[tool.uv.sources]
# OMN-13878: omnibase-core and omnibase-compat now resolve from PyPI (removed
# their git-source overrides). The version-range overrides below already target
# the released artifacts: core>=0.46.7,<0.47.0 and
# compat==0.5.5 (the former rev c0fc716 IS the v0.5.5 tag == PyPI 0.5.5).
# OMN-15539: the omnibase-core git-rev override is DELETED. Every field this
# lane depends on (ModelDelegationRequest.backend_id / response_contract /
# system_prompt / temperature / response_format, and the
# ModelDelegationResult.validate_structured_terminal_evidence invariants) ships
# in the PUBLISHED omnibase-core 0.46.8 wheel on PyPI, verified by downloading
# the wheel and reading the modules. The version-range pin above
# (omnibase-core>=0.46.7,<0.47.0) plus the uv.lock entry now resolve core from
# PyPI. The prior override pinned rev 5a907b71, a commit that is NOT an ancestor
# of omnibase_core dev -- an orphaned feature-branch head of exactly the class
# forbidden by memory reference_never_pin_a_feature_branch_head. Do not
# reintroduce a git rev here: land the core change, publish, then bump the range.
# omnibase-infra git rev retained — infra is not in the dep-provenance forbidden set.
#
# OMN-15423 rebase: re-pinned from 77144f83 to protected infra dev b6bd79c3,
# which contains the OMN-15418 companion squash plus later domain-enforcement,
# migration-fixture, and test-isolation fixes required by the current Market
# gates. The old exact companion head 9e9e62c3 is reachable from this dev tip.
# REMOVE WHEN RELEASED: once omnibase-infra publishes a version containing this
# commit, delete this override (the range pin above already covers it) and `uv lock`.
omnibase-infra = { git = "https://github.com/OmniNode-ai/omnibase_infra.git", rev = "b6bd79c34169b62b664d58f4419a72b3d31bc07c" }
omninode-memory = { git = "https://github.com/OmniNode-ai/omnimemory.git", rev = "887dc679816b9ca4fe1cf51354ac9d5f2869d4ba" }
onex-change-control = { git = "https://github.com/OmniNode-ai/onex_change_control.git", rev = "dd2620d18001495b8d0f493b421b38399e9aab4b" }

[tool.uv]
# OMN-13836: these overrides exist to force the ONEX core/spi/infra/compat
# versions past omninode-memory's stale transitive hard-pins (observed at
# omninode-memory==0.15.0: core==0.40.1 / spi==0.20.6 / infra==0.34.2) so
# omnimarket's own lock resolves during local cross-repo dev.
#
# The previous form git-pinned core/infra/compat to foreign revs
# (core@29e9057=0.46.2, infra@7e52d5b=0.38.4, compat@c0fc716=0.5.5). Those
# git-URL overrides are the "conflicting-URL" source that made omnimarket
# unresolvable when consumed as a declared dependency (OMN-13829): a git-URL
# override forces a URL requirement that clashes with a consumer's own
# core/infra pins. Relaxed to version-range overrides that match the
# current resolvable ranges (core>=0.46.7, spi>=0.23.0) — same override
# function, no foreign URLs.
override-dependencies = [
    # OMN-14280 / OMN-15539: the tenant_id inference-wire feature and the
    # delegation wire contracts both need core 0.46.8, now published on PyPI.
    "omnibase-core>=0.46.8,<0.47.0",
    "omnibase-spi>=0.23.0,<0.24.0",
    "omnibase-infra>=0.38.3,<0.39.0",
    "omnibase-compat==0.5.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/omnimarket"]

[tool.hatch.build]
artifacts = ["src/omnimarket/**/*.yaml", "src/omnimarket/**/*.sql"]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=6.0.0",
    "pytest-split>=0.10.0",
    "ruff>=0.14.13,<0.16.0",
    "mypy>=1.19.1",
    "types-pyyaml>=6.0.12.20250822",
    "types-jsonschema>=4.25.1.20251222",
]

[tool.coverage.run]
source = ["src/omnimarket"]
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
# OMN-14762 (F-18): ignore records whose source is not on disk (e.g. the
# dependency_injector `providers.pyx` C-extension, which ships only as a `.so`).
# pytest-cov's json report in run_coverage_sweep_gate.py reads this section, so
# setting it here makes the authoritative gate's `--cov-report=json` match the
# shadow aggregator's `coverage json -i`. Enforced by check_coverage_ignore_parity.py.
ignore_errors = true

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "C4", "T20", "PT", "ARG", "SLF", "RET"]
ignore = [
    "E501",      # Line too long (will fix incrementally)
    "ARG001",    # Unused function argument
    "ARG002",    # Unused method argument
    "RET504",    # Unnecessary assign before return
    "RUF012",    # Mutable class default (ClassVar annotation)
    "SIM103",    # Needless bool return
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["T201", "SLF001"]
"scripts/**/*.py" = ["T201"]
# CLI entrypoint for the SWE-discriminator smoke battery (OMN-13988) — prints
# progress/results to stdout like the sibling recorder scripts.
"src/omnimarket/delegation/swe_discriminator/run_smoke.py" = ["T201"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
python_version = "3.12"
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = "omnibase_compat.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "omnibase_infra.*"
