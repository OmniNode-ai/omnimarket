[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omnimarket"
version = "0.4.3"
description = "OmniMarket - Portable ONEX workflow package registry"
authors = [
    {name = "OmniNode.ai", email = "contact@omninode.ai"}
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.12,<3.13"
keywords = [
    "onex",
    "marketplace",
    "workflow",
    "portable",
    "contract",
    "event-driven",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = [
    # OMN-14168 requires EnumEvidenceClass.RUNTIME_OPS and
    # runtime_ops_verb_loader from omnibase-core 0.46.7.
    # OMN-14280 (OMN-14208 slice-2 A-now): the inference-wire tenant_id feature
    # (producer + cross-boundary test) requires the tenant_id field on
    # ModelInferenceIntent / ModelInferenceResponseData, first released in
    # omnibase-core 0.46.8 (the paired core PR #1415).
    # OMN-15539: 0.46.8 IS published on PyPI, and it is the first release
    # carrying ModelDelegationRequest.backend_id/response_contract/
    # system_prompt/temperature/response_format plus
    # ModelDelegationResult.validate_structured_terminal_evidence. The lower
    # bound is raised to 0.46.8 so the resolver cannot silently pick a release
    # that lacks the delegation wire contracts this repo now depends on.
    "omnibase-core>=0.46.8,<0.47.0",
    # OMN-14189 imports the shared OCC PR stamp renderer/parser + models from
    # omnibase-compat 0.5.6 (relocated core->compat under OMN-14223 so the gate
    # and this emitter share one zero-dep vocabulary): the single seam
    # omnibase_compat.contracts.pr_occ_stamp.
    "omnibase-compat==0.5.6",
    "omnibase-spi>=0.23.0,<0.24.0",
    "omnibase-infra>=0.38.3,<0.39.0",
    "onex-change-control>=0.5.1",
    "click>=8.1.0",
    "pydantic>=2.12.5,<3.0.0",
    "pydantic-settings>=2.0.0,<3.0.0",
    "pyyaml>=6.0.2,<7.0.0",
    "packaging>=24.0",
    "aiokafka>=0.13.0",
    # OMN-14528: node_runtime_sweep.broker_probe uses the confluent AdminClient
    # (list_consumer_groups) to collect the live consumer-group census in code.
    "confluent-kafka>=2.12.0,<3.0.0",
    "asyncpg>=0.30.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "python-dateutil>=2.9.0",
    "psycopg2-binary>=2.9.10",
    "httpx>=0.27.0",
    "anthropic>=0.25.0",
    "omninode-memory==0.17.0",
    "radon>=6.0.1",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.3.0",
    "docker>=7.0.0",
    "rich>=13.0.0",
    # OMN-14893: GitHub App JWT signing + installation-token exchange for the
    # OCC machine-auth path (github_app_auth.py). Already an unconditional
    # transitive dep via omnibase-infra>=... (pyjwt>=2.12.0); declared
    # directly so this repo does not depend on that transitivity holding.
    "pyjwt[crypto]>=2.12.0",
    # OMN-15193: JSON-Schema structural validation for a contract-declared
    # delegation response_contract (handler_quality_gate.py). Already an
    # unconditional transitive dep (dependency-injector / mcp pull in
    # jsonschema>=4.26.0); declared directly so this repo does not depend on
    # that transitivity holding -- it is a boring, already-resolved validator,
    # not a new addition to the resolved dependency set.
    "jsonschema>=4.18.0",
]

[project.optional-dependencies]
dep-health = [
    "graphifyy==0.8.2",
]
intelligence = [
    "adaptive-classifier>=0.1.2",
]

[project.urls]
Homepage = "https://github.com/OmniNode-ai/omnimarket"
Repository = "https://github.com/OmniNode-ai/omnimarket"

