[[tool.mypy.overrides]]
module = [
    "omnimarket.nodes.node_pr_lifecycle_inventory_compute.*",
    "omnimarket.nodes.node_pr_lifecycle_triage_compute.*",
    "omnimarket.nodes.node_pr_lifecycle_state_reducer.*",
    "omnimarket.nodes.node_pr_lifecycle_merge_effect.*",
    "omnimarket.nodes.node_pr_lifecycle_worktree_prune_effect.*",
    "omnimarket.nodes.node_pr_lifecycle_fix_effect.*",
    "omnimarket.nodes.node_pr_delegated_fix_effect.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["google", "google.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["requests", "requests.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["docker", "docker.*"]
ignore_missing_imports = true

# track_a_adk is a standalone ADK subproject with its own venv/pyproject.
# Its app.* modules are not importable from the omnimarket package root,
# so suppress the not-found and untyped errors for that subtree.
[[tool.mypy.overrides]]
module = [
    "experiments.adk_eval.track_a_adk.*",
]
ignore_errors = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = false
warn_required_dynamic_aliases = true
warn_untyped_fields = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    'ignore:Type google\._upb\._message\.MessageMapContainer uses PyType_Spec.*:DeprecationWarning',
    'ignore:Type google\._upb\._message\.ScalarMapContainer uses PyType_Spec.*:DeprecationWarning',
]
markers = [
    "unit: Unit tests that test individual components in isolation",
    "integration: Integration tests that test multiple components together",
    "slow: Tests that take a long time to run (>1s)",
    "kafka: marks tests requiring a running Kafka broker",
    "e2e: End-to-end probe tests against a live lane (requires OMN_ALLOW_LIVE_E2E_PROBE=true)",
    "live_model: Tests that call live local LLM endpoints (requires OMN_ALLOW_LIVE_LADDER=1)",
]
