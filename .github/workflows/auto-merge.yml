#
# OMN-6571: Automatically enable auto-merge (squash) on every PR opened
# by jonahgabriel. Ensures PRs do not sit idle in the merge queue waiting  # onex-allow-raw-env OMN-10580 reason="CI workflow scoped to repo owner actor; not a personal credential"
# for manual enrollment.
#
# OMN-7786: Re-trigger on review and check_suite events so the workflow
# re-attempts auto-merge after CodeRabbit review finishes and branch
# protection gates clear. Silent continue-on-error removed; "already
# enqueued" races are tolerated but real failures surface.
#
# OMN-13214: Arming auto-merge is NOT the same as enqueuing. During the
# 2026-06-17 dev wave, CLEAN + all-required-green + armed PRs (#1243/1244/1245/
# 1246/1249) sat OUTSIDE the merge queue for hours and each needed a manual
# enqueuePullRequest to land. This workflow now (a) arms bare --auto, (b) runs
# gh pr update-branch first on strict-update repos when the PR is BEHIND
# (the #1245 case), (c) explicitly calls enqueuePullRequest, and (d) VERIFIES
# the PR actually entered the queue — failing loudly if a green+armed PR is not
# enqueued, so the gap surfaces instead of stalling silently. The classify/
# verify decision logic is unit-tested in scripts/ci/merge_queue_enqueue.py.
#
# OMN-14777 (F-24): DROP `reopened` and `ready_for_review` from the
# pull_request trigger, mirroring OMN-14763 (seed fix landed in
# omninode_infra). Marking a draft ready-for-review used to force-arm
# auto-merge, forcing manual draft-holds on evidence-stamped PRs during the
# 2026-07-16 sweep. This aligns with OMN-14151 (default = do NOT auto-arm on
# open/ready). An actually-ready green PR is still armed by the
# pull_request_review / check_suite re-attempt paths below and by
# workflow_dispatch -- just not by the draft->ready transition itself. This
# workflow is NOT a required status check on dev, so narrowing it cannot
# wedge branch protection (verified live via required_status_checks readback
# before landing).
#
# OMN-16081: The "Enable auto-merge" step armed `gh pr merge --auto --squash`
# with `secrets.GITHUB_TOKEN`. GitHub's auto-merge system performs the actual
# squash merge later (when checks + auto-merge conditions are satisfied) as
# `github-actions[bot]` whenever the token that armed it was GITHUB_TOKEN --
# and GitHub does not fire `push` events for GITHUB_TOKEN-actor commits (its
# documented Actions-recursion-prevention behavior). That silently starved
# every push-triggered dev workflow: omnimarket#2078 merged this way on
# 2026-08-15T22:04:46Z and produced zero push-event runs on dev afterward
# (`gh api repos/OmniNode-ai/omnimarket/actions/runs?event=push&branch=dev`).
# Identical root cause already fixed in omninode_infra under OMN-15769
# (github.com/OmniNode-ai/omninode_infra/pull/830). Switched the arming
# token to the org-level `CROSS_REPO_PAT` (already used repo-wide in
# omnimarket, e.g. cr-thread-gate.yml/cr-thread-gate-caller.yml -- no new
# credential minted) so the merge is attributed to a real actor and push
# events fire normally.
name: Auto-Merge

on:
  pull_request:
    types: [opened]
  pull_request_review:
    types: [submitted, dismissed]
  check_suite:
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to enable auto-merge on"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  occ-preflight:
    name: OCC Preflight Dependency
    runs-on: ubuntu-latest
    permissions:
      checks: read
      contents: read
    steps:
      - name: Wait for required OCC preflight
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -uo pipefail

          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "OCC preflight dependency is enforced by the pull_request gate; continuing for ${GITHUB_EVENT_NAME}."
            exit 0
          fi

          # OMN-14343: desynchronize the ~33 same-PR pollers (one per workflow file
          # -- GH Actions `needs:` can't cross workflow-file boundaries) so they
          # don't all hit the Checks API in the same instant every 10s and exhaust
          # the shared per-repo GitHub App installation rate-limit bucket.
          sleep "$(( RANDOM % 15 ))"

          backoff=5
          elapsed=0
          deadline=720

          while [ "$elapsed" -lt "$deadline" ]; do
            # NOTE(OMN-14343): GH Actions runs run: steps under `bash -e {0}` by
            # default -- that -e is already active before this script's own
            # `set -uo pipefail` runs, and `set -uo pipefail` does NOT clear an
            # inherited -e. A bare `response="$(gh api ...)"; status=$?` would
            # therefore abort the whole step on ANY gh api failure before status
            # is ever checked, silently defeating the retry logic below. Using
            # the command substitution as the condition of this `if` is the
            # errexit-safe form -- bash does not trigger -e for a command that is
            # part of an if/while/until condition, regardless of ambient -e state.
            response=""
            status=0
            if response="$(
              gh api "repos/${REPO}/commits/${HEAD_SHA}/check-runs?filter=latest&check_name=occ-preflight%20%2F%20eligibility&per_page=1" \
                --jq 'first(.check_runs[] | .conclusion) // ""' \
                2>&1
            )"; then
              status=0
            else
              status=$?
            fi

            if [ "$status" -ne 0 ]; then
              if echo "$response" | grep -qi "rate limit"; then
                echo "::warning::gh api rate-limited waiting for occ-preflight; backing off ${backoff}s."
                sleep "$backoff"
                elapsed=$((elapsed + backoff))
                backoff=$(( backoff * 2 < 60 ? backoff * 2 : 60 ))
                continue
              fi
              echo "::error::gh api call failed (non-rate-limit): ${response}"
              exit 1
            fi
            backoff=5

            conclusion="$response"

            case "$conclusion" in
              success)
                echo "OCC preflight passed for ${HEAD_SHA}."
                exit 0
                ;;
              failure|cancelled|timed_out|action_required|startup_failure)
                echo "::error::OCC preflight concluded ${conclusion}; refusing to start this workflow."
                exit 1
                ;;
              "")
                echo "Waiting for occ-preflight / eligibility to post for ${HEAD_SHA}..."
                ;;
              *)
                echo "OCC preflight is ${conclusion}; waiting."
                ;;
            esac

            sleep 10
            elapsed=$((elapsed + 10))
          done

          echo "::error::Timed out waiting for occ-preflight / eligibility on ${HEAD_SHA}."
          exit 1
  auto-merge:
    needs: occ-preflight
    name: Enable Auto-Merge
    runs-on: ubuntu-latest
    steps:
      - name: Resolve PR and author
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_FROM_PAYLOAD: ${{ github.event.pull_request.number }}
          PR_FROM_DISPATCH: ${{ github.event.inputs.pr_number }}
          CHECK_SUITE_PRS: ${{ toJson(github.event.check_suite.pull_requests) }}
          PR_AUTHOR_FROM_PAYLOAD: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request|pull_request_review)
              PR="$PR_FROM_PAYLOAD"
              ACTOR="$PR_AUTHOR_FROM_PAYLOAD"
              ;;
            workflow_dispatch)
              PR="$PR_FROM_DISPATCH"
              ACTOR="$(gh pr view "$PR" --json author --jq '.author.login')"
              ;;
            check_suite)
              PR="$(echo "$CHECK_SUITE_PRS" | jq -r 'if type == "array" and length > 0 then .[0].number else empty end')"
              if [ -z "$PR" ]; then
                echo "check_suite had no associated PRs; nothing to do"
                echo "skip=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              ACTOR="$(gh pr view "$PR" --json author --jq '.author.login')"
              ;;
            *)
              echo "unsupported event: $EVENT_NAME"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          echo "pr=$PR" >> "$GITHUB_OUTPUT"
          echo "actor=$ACTOR" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        if: steps.resolve.outputs.skip != 'true' && steps.resolve.outputs.actor == 'jonahgabriel'  # onex-allow-raw-env OMN-10580 reason="CI actor gate for repo owner; not a hardcoded credential"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enable auto-merge
        if: steps.resolve.outputs.skip != 'true' && steps.resolve.outputs.actor == 'jonahgabriel'  # onex-allow-raw-env OMN-10580 reason="CI actor gate for repo owner; not a hardcoded credential"
        env:
          # OMN-16081: CROSS_REPO_PAT, not GITHUB_TOKEN -- see header comment.
          # GITHUB_TOKEN-armed auto-merge completions are attributed to
          # github-actions[bot] and GitHub suppresses push-event workflow
          # runs on bot-actor commits, silently starving downstream
          # build/deploy pipelines on every PR that merges this way.
          GH_TOKEN: ${{ secrets.CROSS_REPO_PAT }}
          PR: ${{ steps.resolve.outputs.pr }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # OMN-14126: gh CLI now requires an explicit merge method in non-interactive
          # mode. This repository disallows merge commits, so arm auto-merge with the
          # repository's squash method instead of failing before enqueue verification.
          # OMN-13214: arming alone does not enqueue — the explicit enqueue + verify
          # steps below close that gap. Do NOT exit here on success.
          if output=$(gh pr merge "$PR" --repo "$REPO" --auto --squash 2>&1); then
            echo "auto-merge enabled: $output"
          elif echo "$output" | grep -qiE "already enqueued|already queued|auto-merge already enabled"; then
            echo "auto-merge not newly enabled (expected): $output"
          else
            echo "auto-merge failed: $output"
            exit 1
          fi

      - name: Enqueue armed PR and verify it entered the queue
        if: steps.resolve.outputs.skip != 'true' && steps.resolve.outputs.actor == 'jonahgabriel'  # onex-allow-raw-env OMN-10580 reason="CI actor gate for repo owner; not a hardcoded credential"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ steps.resolve.outputs.pr }}
        run: |
          set -euo pipefail
          OWNER="${GH_REPO%/*}"
          NAME="${GH_REPO#*/}"

          classify() {
            python3 scripts/ci/merge_queue_enqueue.py classify \
              --pr-json "$1" --strict-update "$2"
          }

          # Is the target (default) branch strict-update? On strict repos a BEHIND
          # PR cannot enqueue until its branch is updated (the #1245 case).
          DEFAULT_BRANCH="$(gh repo view "$GH_REPO" --json defaultBranchRef --jq '.defaultBranchRef.name')"
          STRICT="$(gh api "repos/${GH_REPO}/branches/${DEFAULT_BRANCH}/protection/required_status_checks" \
            --jq '.strict' 2>/dev/null || echo "false")"
          [ "$STRICT" = "true" ] || STRICT="false"
          echo "strict-update on '${DEFAULT_BRANCH}': ${STRICT}"

          fetch_pr() {
            # isInMergeQueue is only on the GraphQL PullRequest object, NOT a
            # `gh pr view --json` field, so fetch PR state via GraphQL.
            # shellcheck disable=SC2016  # $owner/$name/$number are GraphQL vars, not shell vars
            gh api graphql \
              -f owner="$OWNER" \
              -f name="$NAME" \
              -F number="$PR" \
              -f query='
                query($owner:String!, $name:String!, $number:Int!) {
                  repository(owner: $owner, name: $name) {
                    pullRequest(number: $number) {
                      isInMergeQueue
                      mergeStateStatus
                      mergeable
                      autoMergeRequest {
                        enabledAt
                      }
                    }
                  }
                }' \
              --jq '.data.repository.pullRequest'
          }

          PR_JSON="$(fetch_pr)"
          ACTION="$(classify "$PR_JSON" "$STRICT")"
          echo "classified action: ${ACTION}"

          case "$ACTION" in
            already_queued)
              echo "PR #${PR} already in the merge queue — nothing to do."
              exit 0
              ;;
            wait)
              echo "PR #${PR} is not enqueueable yet (BLOCKED/DIRTY/DRAFT/UNKNOWN); will re-fire on next event."
              exit 0
              ;;
            blocked)
              echo "::warning::PR #${PR} in an unrecognised merge state: $(printf '%s' "$PR_JSON" | jq -r '.mergeStateStatus'). Not enqueuing."
              exit 0
              ;;
            update_branch_then_enqueue)
              echo "PR #${PR} is BEHIND on a strict-update repo — updating branch before enqueue (OMN-13214 #1245 case)."
              if ! gh pr update-branch "$PR" --repo "$GH_REPO" 2>&1; then
                echo "::warning::update-branch reported no change or a benign error; continuing."
              fi
              echo "update-branch issued; the resulting check run re-fires this workflow when CI is green."
              exit 0
              ;;
            enqueue)
              : # fall through to enqueue below
              ;;
            *)
              echo "::error::unexpected action '${ACTION}' from classifier"
              exit 1
              ;;
          esac

          PR_ID="$(gh api graphql -f query='{repository(owner:"'"$OWNER"'",name:"'"$NAME"'"){pullRequest(number:'"$PR"'){id}}}' --jq '.data.repository.pullRequest.id')"
          if [ -z "$PR_ID" ] || [ "$PR_ID" = "null" ]; then
            echo "::error::could not resolve PR node id for #${PR}"
            exit 1
          fi

          # shellcheck disable=SC2016  # $prId is a GraphQL variable, not a shell var
          if enq_out=$(gh api graphql -f query='mutation($prId:ID!){enqueuePullRequest(input:{pullRequestId:$prId}){mergeQueueEntry{position}}}' -f prId="$PR_ID" 2>&1); then
            echo "enqueue issued: ${enq_out}"
          else
            if echo "$enq_out" | grep -qiE "merge queue (is )?not enabled|does not have a merge queue|merge_queue_not_enabled"; then
              echo "repo has no merge queue — arming auto-merge is sufficient: ${enq_out}"
              exit 0
            fi
            if echo "$enq_out" | grep -qiE "already (in|enqueued|queued)|in the merge queue"; then
              echo "benign enqueue race (already queued): ${enq_out}"
            else
              echo "::error::enqueuePullRequest failed for #${PR}: ${enq_out}"
              exit 1
            fi
          fi

          # OMN-13214 ENFORCEMENT: verify the PR actually entered the queue.
          # Poll briefly — GitHub may take a few seconds to reflect the entry.
          for attempt in 1 2 3 4 5; do
            sleep 6
            PR_AFTER="$(fetch_pr)"
            if python3 scripts/ci/merge_queue_enqueue.py verify --pr-json "$PR_AFTER"; then
              echo "VERIFIED: PR #${PR} is in the merge queue."
              exit 0
            fi
            echo "not yet in queue (attempt ${attempt}/5); state=$(printf '%s' "$PR_AFTER" | jq -r '.mergeStateStatus')"
          done

          echo "::error::PR #${PR} is green + armed but did NOT enter the merge queue after enqueue (OMN-13214 armed-but-not-enqueued). Manual intervention required."
          exit 1
