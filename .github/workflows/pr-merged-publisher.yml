#
# pr-merged-publisher.yml
#
# Publishes onex.evt.github.pr-merged.v1 to Confluent Cloud whenever a PR
# merges to any branch. The event payload carries {repo, branch, pr_number,
# ticket, merged_at} and is consumed by the projection node (OMN-13227) which
# materialises a queryable projection at GET /projection/onex.evt.github.pr-merged.v1
# on the local projection API. The per-machine worktree reaper (T4, OMN-13228)
# polls that projection to trigger prune-worktrees.sh on matched worktrees.
#
# F3 BROKER DECISION (OMN-13226):
#   Runs on ubuntu-latest (GitHub-hosted cloud runner). Cloud runners cannot
#   reach the private LAN broker. We therefore publish to
#   Confluent Cloud using SASL_SSL, identical to OMN-8917
#   (runtime-rebuild-trigger.yml / trigger_rebuild_on_merge.py). The
#   projection node (T3) bridges Confluent to the local Redpanda lane so the
#   projection is populated for local reaper polling.
#
# Ticket: OMN-13226
#
# Required GitHub Secrets:
#   KAFKA_BOOTSTRAP_SERVERS    -- Confluent Cloud broker endpoint
#   KAFKA_SASL_USERNAME        -- Confluent Cloud API key
#   KAFKA_SASL_PASSWORD        -- Confluent Cloud API secret

name: PR Merged Publisher

on:
  pull_request:
    types: [closed]

jobs:
  publish-pr-merged:
    name: Publish pr-merged event
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --quiet confluent-kafka click

      - name: Publish onex.evt.github.pr-merged.v1
        # All potentially attacker-controlled inputs (branch name, PR title) are
        # passed through environment variables to prevent shell injection.
        env:
          KAFKA_BOOTSTRAP_SERVERS: ${{ secrets.KAFKA_BOOTSTRAP_SERVERS }}
          KAFKA_SASL_USERNAME: ${{ secrets.KAFKA_SASL_USERNAME }}
          KAFKA_SASL_PASSWORD: ${{ secrets.KAFKA_SASL_PASSWORD }}
          PR_REPO: ${{ github.repository }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_MERGED_AT: ${{ github.event.pull_request.merged_at }}
          # Best-effort ticket extraction: the script also parses PR_BRANCH
          PR_TICKET: ""
        run: |
          python scripts/publish_pr_merged_event.py
