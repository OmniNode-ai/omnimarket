#
# uv-lock-pin-reachability.yml (OMN-14450)
#
# Every git-SHA pin in uv.lock must be reachable from a remote branch.
#
# OMN-14447: uv.lock pinned omnibase-core at a FEATURE-BRANCH HEAD. GitHub deletes
# a feature branch when its PR merges, so the commit became reachable from nothing
# on the remote -- and the OMN-12977 sibling-pin preflight could never be satisfied
# again. The workspace build was impossible for every fresh clone, which blocked the
# OMN-14437 effects-runtime rebuild outright.
#
# This job runs on a FRESH runner clone, and prunes before it looks. That is the
# entire point: `git branch -r --contains` reports a deleted branch's commit as
# reachable on any clone that fetched it before deletion, so the naive check is
# green on a developer's machine and on nothing else. CI is the only place this
# check can tell the truth.

name: uv.lock Pin Reachability (OMN-14450)

on:
  pull_request:
    branches: [main, dev, "hotfix/**"]
    paths:
      - "uv.lock"
      - "pyproject.toml"
      - "scripts/ci/check_uv_lock_pin_reachability.py"
      - ".github/workflows/uv-lock-pin-reachability.yml"
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  pin-reachability:
    name: uv.lock Pin Reachability
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    timeout-minutes: 10

    steps:
      - name: Checkout omnimarket
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Clone each pinned sibling FRESH. A fresh clone cannot contain a stale
      # remote-tracking ref for a deleted branch, which is exactly the state a
      # developer's machine hides.
      - name: Clone pinned sibling repos (fresh)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/clones"
          repos=$(python3 - <<'PY'
          import re, pathlib
          text = pathlib.Path("uv.lock").read_text()
          pat = r'git\s*=\s*"https://github\.com/[\w-]+/([\w-]+)\.git\?rev=[0-9a-f]{40}'
          print("\n".join(sorted(set(re.findall(pat, text)))))
          PY
          )
          for r in ${repos}; do
            echo "cloning ${r}"
            git clone --quiet "https://x-access-token:${GH_TOKEN}@github.com/OmniNode-ai/${r}.git" \
              "${RUNNER_TEMP}/clones/${r}" || echo "::warning::could not clone ${r}; it will be SKIPped"
          done

      - name: Assert every git-SHA pin is reachable
        run: |
          python3 scripts/ci/check_uv_lock_pin_reachability.py \
            --lock uv.lock \
            --clones-root "${RUNNER_TEMP}/clones"
