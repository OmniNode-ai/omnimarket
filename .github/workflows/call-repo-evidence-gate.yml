#
# Repo Evidence Gate caller (OMN-20070) verifies repo-owned DoD contracts through
# omnibase_core's receipt-gate reusable with evidence-source: caller.
#
# Why pull_request_target: GitHub reads the workflow definition from the BASE
# branch, so a pull request that edits this file or the reusable's pin does not
# change which definition runs on it. The pull request's own code is only ever
# checked out as data by the reusable, which refuses fork heads.
#
# dev and main are the integration branches. The activity types cover new heads,
# reopened and ready PRs, and edits to the ticket citation or base branch.
# Per-PR concurrency cancels superseded runs so the latest event gets a verdict.
# Read-only contents and pull-requests permissions are all this caller needs;
# checkout and verification belong to the reusable, with no caller secrets.
# The full-SHA pin makes the reusable immutable; verifier-version pins the
# released verifier used to read the caller's contracts.
#
# The job id is the context prefix: repo-evidence / dod-verify carries the
# verdict, so do not add a job name. The reusable also reports a skipped
# repo-evidence / verify job in this mode (the OCC path, switched off by the
# input); only repo-evidence / dod-verify carries a verdict.
#
# OMN-20072 (S5 pilot): repo-evidence / dod-verify is required on dev by its own
# ruleset beside every OCC context, so a merge needs both verdicts. During the
# pilot compare-with-occ is "true": the reusable's difference step classifies
# this head's verdict against OCC's occ-preflight / eligibility verdict on the
# same head and fails on a difference with no reason code in the OR.1
# expected-difference table. verifier-version must be a release that ships that
# classifier (node_dod_verify occ-difference, omnimarket#3277). The PR that
# deletes omnimarket's OCC callers at cutover (S6) sets compare-with-occ back to
# "false", because there is then no OCC verdict to compare.

name: Repo Evidence Gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]
    branches: [dev, main, jonah/omn-20543-scratch-base]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  repo-evidence:
    uses: OmniNode-ai/omnibase_core/.github/workflows/receipt-gate.yml@bedfe5be6365a77871b6769b727c67e3e9603eb2 # OMN-20543 SCRATCH BASE ONLY, never merged: the unmerged omnibase_core branch commit under test.
    with:
      evidence-source: caller
      verifier-version: 0.4.294
      compare-with-occ: "false"
