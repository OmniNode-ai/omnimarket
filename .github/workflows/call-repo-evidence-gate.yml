#
# Repo Evidence Gate caller (OMN-20070) verifies repo-owned DoD contracts through
# omnibase_core's receipt-gate reusable with evidence-source: caller.
#
# Why pull_request_target: GitHub reads the workflow definition from the BASE
# branch, so a pull request that edits this file or the reusable's pin does not
# change which definition runs on it. The pull request's own code is only ever
# checked out as data by the reusable, which refuses fork heads.
#
# dev and main are the integration branches. The activity types cover new heads,
# reopened and ready PRs, and edits to the ticket citation or base branch.
# Per-PR concurrency cancels superseded runs so the latest event gets a verdict.
# Read-only contents and pull-requests permissions are all this caller needs;
# checkout and verification belong to the reusable, with no caller secrets.
# The dev-merge tag of omnibase_core makes the reusable a fixed ref (the repo's
# ruling is tags, never full commit shas); verifier-tag is the omnimarket dev-merge
# tag the reusable installs the verifier from, which reads the caller's contracts.
# The reusable resolves the tag to its commit and refuses a moved tag, a tag not on
# omnimarket dev, or one that does not descend from its floor commit, so no
# released package version decides the verifier. The reusable pin is advanced by
# this repository's node_receipt_gate_pin_advance_compute (OMN-20134), which edits
# the uses line and RECEIPT_GATE_PIN_TAG in tests/ci/receipt_gate_pin.py (and the
# characterization golden); verifier-tag moves by hand to a newer omnimarket
# dev-merge tag.
#
# The job id is the context prefix: repo-evidence / dod-verify carries the
# verdict, so do not add a job name. The reusable also reports a
# repo-evidence / verify job in this mode as a success no-op (the OCC path,
# switched off by the input); only repo-evidence / dod-verify carries a verdict.
#
# OMN-20072 and OMN-20073 (S5 pilot, then the S6 cut-over): repo-evidence /
# dod-verify is required on dev by its own ruleset. During the pilot it was
# required beside every OCC context, with compare-with-occ "true", so the
# reusable's difference step classified this head's verdict against OCC's on
# the same head. The pilot met its bar and dev branch protection no longer
# requires an OCC context, so compare-with-occ is "false": the step would
# otherwise wait for an OCC verdict and fail closed without one. verifier-tag
# stays an omnimarket dev-merge tag that ships the classifier (node_dod_verify
# occ-difference, omnimarket#3277), so a rollback turns the step back on with this
# one input.
#
# verifier-tag descends from the floor commit e565ba5ba00c, which ships the refusal
# of a contract that leaves a criterion unbound (omnimarket#3511; OMN-20070). The
# pinned reusable refuses a tag that does not descend from that commit before
# installing it (omnibase_core#2203; OMN-21676), so a later re-pin of this input to
# an older tag fails the install step instead of admitting a partly bound contract.
# The verifier-version input is a warned migration fallback and is not passed.

name: Repo Evidence Gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]
    branches: [dev, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  repo-evidence:
    uses: OmniNode-ai/omnibase_core/.github/workflows/receipt-gate.yml@dev-20261101103701-2fc5e461fca7 # omnibase_core dev-merge tag
    with:
      evidence-source: caller
      verifier-tag: dev-20261101000200-949993edf3b7
      compare-with-occ: "false"
