---
# hostile-reviewer.yml
#
# Adversarial multi-model code review gate on every pull request.
#
# Invokes omniintelligence.review_pairing.cli_review (node-based path via
# HandlerLlmCliSubprocess / adapter_codex_reviewer) with --model qwen3-review.
# Codex is excluded from the initial pilot — add --model codex once non-interactive
# OAuth auth is confirmed on trusted CI runners (OMN-8524).
#
# Gate semantics (pilot phase):
#   blocked  — critical/error findings from at least one succeeded model → exit 1
#   degraded — all models failed (infra unavailable) → exit 0 (informational, pilot)
#   passed   — no critical/error findings → exit 0
#
# Reference: OMN-8524

name: Hostile Reviewer

on:
  pull_request:
    branches: [main, dev]
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read

jobs:
  occ-preflight:
    name: OCC Preflight Dependency
    runs-on: ubuntu-latest
    permissions:
      checks: read
      contents: read
    steps:
      - name: Wait for required OCC preflight
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -uo pipefail

          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "OCC preflight dependency is enforced by the pull_request gate; continuing for ${GITHUB_EVENT_NAME}."
            exit 0
          fi

          # OMN-14343: desynchronize the ~33 same-PR pollers (one per workflow file
          # -- GH Actions `needs:` can't cross workflow-file boundaries) so they
          # don't all hit the Checks API in the same instant every 10s and exhaust
          # the shared per-repo GitHub App installation rate-limit bucket.
          sleep "$(( RANDOM % 15 ))"

          backoff=5
          elapsed=0
          deadline=720

          while [ "$elapsed" -lt "$deadline" ]; do
            # NOTE(OMN-14343): GH Actions runs run: steps under `bash -e {0}` by
            # default -- that -e is already active before this script's own
            # `set -uo pipefail` runs, and `set -uo pipefail` does NOT clear an
            # inherited -e. A bare `response="$(gh api ...)"; status=$?` would
            # therefore abort the whole step on ANY gh api failure before status
            # is ever checked, silently defeating the retry logic below. Using
            # the command substitution as the condition of this `if` is the
            # errexit-safe form -- bash does not trigger -e for a command that is
            # part of an if/while/until condition, regardless of ambient -e state.
            response=""
            status=0
            for page in $(seq 1 5); do
              if page_response="$(
                gh api "repos/${REPO}/commits/${HEAD_SHA}/check-runs?filter=latest&per_page=100&page=${page}" \
                  --jq 'first(.check_runs[] | select(.name == "occ-preflight / eligibility") | .conclusion) // ""' \
                  2>&1
              )"; then
                status=0
                if [ -n "$page_response" ]; then
                  response="$page_response"
                  break
                fi
              else
                status=$?
                response="$page_response"
                break
              fi
            done

            if [ "$status" -ne 0 ]; then
              if echo "$response" | grep -qi "rate limit"; then
                echo "::warning::gh api rate-limited waiting for occ-preflight; backing off ${backoff}s."
                sleep "$backoff"
                elapsed=$((elapsed + backoff))
                backoff=$(( backoff * 2 < 60 ? backoff * 2 : 60 ))
                continue
              fi
              echo "::error::gh api call failed (non-rate-limit): ${response}"
              exit 1
            fi
            backoff=5

            conclusion="$response"

            case "$conclusion" in
              success)
                echo "OCC preflight passed for ${HEAD_SHA}."
                exit 0
                ;;
              failure|cancelled|timed_out|action_required|startup_failure)
                echo "::error::OCC preflight concluded ${conclusion}; refusing to start this workflow."
                exit 1
                ;;
              "")
                echo "Waiting for occ-preflight / eligibility to post for ${HEAD_SHA}..."
                ;;
              *)
                echo "OCC preflight is ${conclusion}; waiting."
                ;;
            esac

            sleep 10
            elapsed=$((elapsed + 10))
          done

          echo "::error::Timed out waiting for occ-preflight / eligibility on ${HEAD_SHA}."
          exit 1
  hostile-review:
    needs: occ-preflight
    name: Hostile Reviewer (adversarial gate)
    runs-on: >-
      ${{
        github.event_name == 'pull_request'
        && github.event.pull_request.head.repo.full_name != github.repository
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["ubuntu-latest"]')
      }}
    timeout-minutes: 35

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0

      - name: Clean stale dependency clones
        run: rm -rf ../omniintelligence ../omnibase_core ../omnibase_compat

      - name: Clone omniintelligence
        run: |
          OMNIINTELLIGENCE_SHA=$(git ls-remote https://github.com/OmniNode-ai/omniintelligence.git HEAD | cut -f1)
          git clone --depth=1 https://github.com/OmniNode-ai/omniintelligence.git ../omniintelligence
          echo "omniintelligence pinned to: $OMNIINTELLIGENCE_SHA"

      - name: Clone omnibase_core
        run: |
          OMNIBASE_CORE_SHA=$(git ls-remote https://github.com/OmniNode-ai/omnibase_core.git HEAD | cut -f1)
          git clone --depth=1 https://github.com/OmniNode-ai/omnibase_core.git ../omnibase_core
          echo "omnibase_core pinned to: $OMNIBASE_CORE_SHA"

      - name: Clone omnibase_compat
        run: |
          OMNIBASE_COMPAT_SHA=$(git ls-remote https://github.com/OmniNode-ai/omnibase_compat.git HEAD | cut -f1)
          git clone --depth=1 https://github.com/OmniNode-ai/omnibase_compat.git ../omnibase_compat
          echo "omnibase_compat pinned to: $OMNIBASE_COMPAT_SHA"

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Preflight — probe review endpoint reachability
        id: preflight
        working-directory: ../omniintelligence
        env:
          # Resolve the SAME registry the reviewer loads (model_registry_loader)
          # for the SAME models the review step runs
          # (`--model qwen3-review --model qwen3-review-b`). We flip
          # reachable=false ONLY when EVERY requested model is unreachable AND the
          # codex api-fallback is unavailable — the exact condition under which the
          # reviewer itself yields verdict=degraded + exit 0.
          REVIEW_MODEL_KEYS: "qwen3-review qwen3-review-b"
          REGISTRY_PATH: "src/omniintelligence/review_pairing/model_registry.yaml"
          # Wired from a GitHub Actions secret (OMN-14176): the LLM HTTP transport
          # HMAC-signs every call with LOCAL_LLM_SHARED_SECRET and fail-closes if it
          # is absent. The old assumption that the runner env provided it
          # (Infisical / shell profile) never held on this fleet.
          LOCAL_LLM_SHARED_SECRET: ${{ secrets.LOCAL_LLM_SHARED_SECRET }}
          # Added alongside LOCAL_LLM_SHARED_SECRET for env parity with the review
          # step (OMN-14176). This preflight uses a raw TCP probe so it does not
          # invoke the LLM transport's CIDR check, but keeping the two LLM-contact
          # env blocks identical avoids drift. The model host is within this subnet.
          LLM_ENDPOINT_CIDR_ALLOWLIST: "192.168.86.0/24"  # onex-allow-internal-ip OMN-14176 reason="LAN subnet allowlist for the review LLM endpoint host 192.168.86.201"
        run: |
          # -e is intentionally OMITTED: this probe must NEVER fail the job. Every
          # uncertain/ambiguous outcome FAILS OPEN to the full install + review.
          # We flip reachable=false ONLY when the reviewer would ALSO degrade:
          # ALL requested models are TCP-unreachable (adapter_ai_reviewer._probe_tcp)
          # AND the codex api-fallback (select_models_with_fallback ->
          # _resolve_codex_binary) is unavailable. That keeps our short-circuit a
          # STRICT SUBSET of the reviewer's degrade condition under all configs, so
          # once OMN-8524 provisions codex on CI a local outage no longer suppresses
          # a review.
          set -o pipefail

          # Resolve host:port for EACH requested model exactly as the reviewer does:
          #   url = os.environ.get(config.env_var, config.default_url)   # per-model
          # then urllib.parse the host/port. pyyaml runs in an isolated env
          # (--no-project --with) so we do NOT trigger the ~3.6 GiB dependency sync.
          # Output: one "FALLBACK|<bool>" line, then one "TARGET|host|port|url" line
          # per resolvable model.
          PROBE_TARGETS="$(uv run --no-project --with pyyaml python - <<'PYEOF'
          import os
          import shutil
          import urllib.parse

          import yaml

          registry_path = os.environ["REGISTRY_PATH"]
          model_keys = os.environ["REVIEW_MODEL_KEYS"].split()
          with open(registry_path, encoding="utf-8") as fh:
              registry = yaml.safe_load(fh)


          def _codex_resolvable() -> bool:
              # Bool-form verbatim mirror of
              # adapter_codex_reviewer._resolve_codex_binary: CODEX_BINARY (file+exec)
              # -> shutil.which("codex") -> known Homebrew/system fallback dirs.
              # ASSUMPTION (load-bearing): codex resolvability is identical at
              # preflight-time (uv run --no-project) and review-time (project uv run)
              # ONLY because omniintelligence ships no `codex` console-script in its
              # venv; if it ever adds one, resolve codex from the review's own env here
              # or the preflight could miss a `.venv/bin/codex` the review would find.
              env_override = os.environ.get("CODEX_BINARY")
              if (
                  env_override
                  and os.path.isfile(env_override)
                  and os.access(env_override, os.X_OK)
              ):
                  return True
              if shutil.which("codex") is not None:
                  return True
              for directory in (
                  "/opt/homebrew/bin",
                  "/usr/local/bin",
                  os.path.expanduser("~/.local/bin"),
              ):
                  candidate = os.path.join(directory, "codex")
                  if os.path.isfile(candidate) and os.access(candidate, os.X_OK):
                      return True
              return False


          # Mirror select_models_with_fallback: when the requested local models are
          # unreachable the reviewer substitutes api_fallback_keys and only degrades
          # if that fallback ALSO fails. fallback_blocks=True means a live fallback
          # might still succeed -> we must NOT short-circuit; let the reviewer decide.
          # Conservative: an unrecognized (non-codex) fallback we cannot prove
          # unavailable also blocks the short-circuit (fail-open).
          fallback_keys = list(registry.get("api_fallback_keys", []))
          if not fallback_keys:
              fallback_blocks = False
          elif any(k != "codex" for k in fallback_keys):
              fallback_blocks = True
          else:
              fallback_blocks = _codex_resolvable()

          print(f"FALLBACK|{'true' if fallback_blocks else 'false'}")

          for model_key in model_keys:
              cfg = registry["models"].get(model_key)
              if not cfg:
                  continue
              # env_var overrides default_url — identical to adapter_ai_reviewer.
              url = os.environ.get(cfg["env_var"], cfg["default_url"]).strip()
              parsed = urllib.parse.urlparse(url)
              host = parsed.hostname or ""
              port = parsed.port or 80
              if url and host:
                  print(f"TARGET|{host}|{port}|{url}")
          PYEOF
          )"

          FALLBACK_BLOCKS="$(printf '%s\n' "$PROBE_TARGETS" | sed -n 's/^FALLBACK|//p' | head -n1)"
          TARGETS="$(printf '%s\n' "$PROBE_TARGETS" | grep '^TARGET' || true)"

          if [ -z "$TARGETS" ]; then
            echo "Could not statically resolve any of [${REVIEW_MODEL_KEYS}]; proceeding with full review (fail-open)."
            echo "reachable=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # TCP-connect probe — SAME semantics as adapter_ai_reviewer._probe_tcp
          # (socket.create_connection). We retry so our short-circuit is a STRICT
          # SUBSET of the reviewer's own single-shot 2s probe. If ANY requested
          # model is reachable, the review can succeed -> proceed. Process
          # substitution (not a pipe) keeps this loop in the current shell so exit
          # and UNREACHABLE persist.
          UNREACHABLE=""
          while IFS='|' read -r _tag HOST PORT URL; do
            [ "$_tag" = "TARGET" ] || continue
            model_reachable="false"
            for attempt in 1 2 3; do
              if timeout 5 bash -c "exec 3<>/dev/tcp/${HOST}/${PORT}" 2>/dev/null; then
                echo "TCP connect to ${HOST}:${PORT} (${URL}) succeeded (attempt ${attempt})."
                model_reachable="true"
                break
              fi
              echo "TCP connect to ${HOST}:${PORT} (${URL}) failed (attempt ${attempt}/3)."
              [ "$attempt" -lt 3 ] && sleep 2
            done
            if [ "$model_reachable" = "true" ]; then
              echo "At least one review endpoint is reachable; proceeding with full review."
              echo "reachable=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            UNREACHABLE="${UNREACHABLE}${HOST}:${PORT} "
          done < <(printf '%s\n' "$TARGETS")

          # EVERY requested model is unreachable. The reviewer does NOT degrade on
          # that alone — select_models_with_fallback substitutes the codex
          # api-fallback and only degrades if codex ALSO fails. If codex may be
          # available, PROCEED and let the reviewer decide (fail-open; closes the
          # OMN-8524 hole where a codex review would otherwise be suppressed).
          if [ "$FALLBACK_BLOCKS" = "true" ]; then
            echo "All review endpoints unreachable, but the codex api-fallback may be available; proceeding to the full review (reviewer decides) — OMN-8524."
            echo "reachable=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # ALL models unreachable AND codex api-fallback unavailable → this is the
          # EXACT condition under which the reviewer yields verdict=degraded + exit 0
          # with zero models succeeded. Short-circuit with the IDENTICAL degraded
          # verdict (see the degraded branch of "Run adversarial review").
          echo "::warning::All review endpoints [${UNREACHABLE}] unreachable after 3 attempts and no codex api-fallback available; short-circuiting to DEGRADED and skipping the ~3.6 GiB install + review."
          {
            echo "reachable=false"
            echo "verdict=degraded"
            echo "blocking_count=0"
            echo "total_findings=0"
            echo "models_succeeded="
            echo "error=all review endpoints [${UNREACHABLE}] unreachable — preflight short-circuit (no models available)"
          } >> "$GITHUB_OUTPUT"
          exit 0

      - name: Install omniintelligence dependencies
        # Skip the heavy dependency sync when the review endpoint is unreachable
        # (preflight short-circuit). Any non-'false' value — including a crashed
        # or unset preflight — runs the install unchanged (fail-open).
        if: steps.preflight.outputs.reachable != 'false'
        id: install-omniintelligence
        continue-on-error: true
        working-directory: ../omniintelligence
        env:
          UV_CONCURRENT_DOWNLOADS: "1"
          UV_HTTP_TIMEOUT: "600"
          UV_SYNC_ATTEMPTS: "5"
          UV_SYNC_RETRY_DELAY_SECONDS: "10"
          UV_TORCH_BACKEND: "cpu"
        run: |
          set -euo pipefail

          attempt=1
          until uv sync --locked --all-extras; do
            status=$?
            if [ "$attempt" -ge "$UV_SYNC_ATTEMPTS" ]; then
              echo "::error::uv sync failed after ${attempt} attempt(s)"
              exit "$status"
            fi

            sleep_seconds=$((UV_SYNC_RETRY_DELAY_SECONDS * attempt))
            echo "::warning::uv sync attempt ${attempt}/${UV_SYNC_ATTEMPTS} failed with exit ${status}; retrying in ${sleep_seconds}s"
            sleep "$sleep_seconds"
            attempt=$((attempt + 1))
          done

      - name: Run adversarial review
        # Skipped only when the preflight proved the endpoint unreachable; the
        # identical DEGRADED verdict is emitted by the preflight step instead.
        if: steps.preflight.outputs.reachable != 'false'
        id: review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          # LOCAL_LLM_SHARED_SECRET is wired from a GitHub Actions secret
          # (OMN-14176): the omniintelligence LLM HTTP transport HMAC-signs every
          # call with it and fail-closes if it is absent. The earlier assumption
          # that the runner env supplied it (Infisical / shell profile) never held
          # on this fleet — that gap is why every review DEGRADED with "all models
          # failed" despite a reachable endpoint.
          LOCAL_LLM_SHARED_SECRET: ${{ secrets.LOCAL_LLM_SHARED_SECRET }}
          # The omniintelligence LLM HTTP transport's _parse_cidr_allowlist RAISES
          # if LLM_ENDPOINT_CIDR_ALLOWLIST is unset — there is NO code default (the
          # docstring's LAN-subnet default is aspirational only). Without this the
          # reviewer fail-closes on the CIDR gate → verdict=degraded even after the
          # endpoint_url fix + the secret. The model host is within this subnet.
          LLM_ENDPOINT_CIDR_ALLOWLIST: "192.168.86.0/24"  # onex-allow-internal-ip OMN-14176 reason="LAN subnet allowlist for the review LLM endpoint host 192.168.86.201; transport fail-closes if unset"
        working-directory: ../omniintelligence
        run: |
          set -euo pipefail

          # Run cli_review; stdout = ModelMultiReviewResult JSON, stderr = human summary
          # (the per-model failure reason on a DEGRADED verdict lives here).
          # stderr was previously discarded with `2>/dev/null`, so a
          # "Models succeeded: none" verdict gave no per-model reason in the log
          # (OMN-14176). Tee stderr to a log file AND back to fd 2 (the job log) so
          # the reason is visible. stdout is still captured into REVIEW_JSON via the
          # command substitution, and the command's exit code is still preserved via
          # `|| REVIEW_EXIT=$?` — this only stops swallowing stderr.
          # Two models (OMN-14176): qwen3-review (5090 :8000) + qwen3-review-b
          # (4090 :8001). Running >=2 models makes cli_review exit 0 ("at least 2
          # succeeded") reachable — fixing the single-model exit-2 collapse where a
          # successful review was misreported as "all models failed".
          REVIEW_JSON=$(uv run python -m omniintelligence.review_pairing.cli_review \
            --pr "$PR_NUMBER" \
            --repo "$REPO" \
            --model qwen3-review \
            --model qwen3-review-b \
            2> >(tee hostile-reviewer-stderr.log >&2)) || REVIEW_EXIT=$?

          # If the CLI itself failed (not model degraded — actual crash), report and exit 0
          # to avoid blocking PRs due to infrastructure issues during pilot phase.
          if [ "${REVIEW_EXIT:-0}" -ne 0 ]; then
            {
              echo "verdict=degraded"
              echo "blocking_count=0"
              echo "total_findings=0"
              echo "models_succeeded="
              echo "error=cli_review exited non-zero (fewer than 2 models succeeded — partial/total outage — or binary error)"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Parse verdict from JSON using Python inline.
          # JSON is passed via env var to avoid stdin/heredoc conflict (pipe clobbers heredoc stdin).
          VERDICT_DATA=$(REVIEW_JSON="$REVIEW_JSON" python3 - <<'PYEOF'
          import json, os

          data = json.loads(os.environ["REVIEW_JSON"])
          models_succeeded = list(data.get("models_succeeded", []))
          total_findings = data.get("total_input_findings", 0)

          # Count blocking findings (critical severity) from merged_findings
          blocking = 0
          for f in data.get("merged_findings", []):
              if f.get("severity") == "critical":
                  blocking += 1

          if not models_succeeded:
              verdict = "degraded"
          elif blocking > 0:
              verdict = "blocked"
          else:
              verdict = "passed"

          print(f"verdict={verdict}")
          print(f"blocking_count={blocking}")
          print(f"total_findings={total_findings}")
          print(f"models_succeeded={','.join(models_succeeded)}")
          PYEOF
          )

          # Write outputs
          echo "$VERDICT_DATA" >> "$GITHUB_OUTPUT"
          echo "error=" >> "$GITHUB_OUTPUT"

          # Set exit code: blocked → 1, everything else → 0 (pilot: degraded is informational)
          VERDICT=$(echo "$VERDICT_DATA" | grep '^verdict=' | cut -d= -f2)
          if [ "$VERDICT" = "blocked" ]; then
            exit 1
          fi

      - name: Post review summary as PR comment
        if: always()
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        env:
          # When the preflight short-circuits, the review step is skipped and its
          # outputs are empty; fall back to the preflight's identical degraded
          # outputs. On the endpoint-up path the review outputs are authoritative
          # (non-empty) so these resolve to exactly the same values as before.
          REVIEW_VERDICT: ${{ steps.review.outputs.verdict || steps.preflight.outputs.verdict }}
          REVIEW_BLOCKING: ${{ steps.review.outputs.blocking_count || steps.preflight.outputs.blocking_count }}
          REVIEW_TOTAL: ${{ steps.review.outputs.total_findings || steps.preflight.outputs.total_findings }}
          REVIEW_MODELS: ${{ steps.review.outputs.models_succeeded || steps.preflight.outputs.models_succeeded }}
          REVIEW_ERROR: ${{ steps.review.outputs.error || steps.preflight.outputs.error }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const verdict = process.env.REVIEW_VERDICT || 'unknown';
            const blocking = parseInt(process.env.REVIEW_BLOCKING || '0');
            const total = parseInt(process.env.REVIEW_TOTAL || '0');
            const models = process.env.REVIEW_MODELS || '';
            const error = process.env.REVIEW_ERROR || '';

            const icon = {
              passed: '✅',
              blocked: '🚫',
              degraded: '⚠️',
            }[verdict] || '❓';

            const label = {
              passed: 'PASSED',
              blocked: 'BLOCKED',
              degraded: 'DEGRADED (informational)',
            }[verdict] || verdict.toUpperCase();

            let note = '';
            if (verdict === 'degraded') {
              note = '\n\n> **Note**: All reviewer models failed or were unavailable. ' +
                'Degraded results are informational during the pilot phase (OMN-8524) and do not block merge.';
              if (error) note += ` Error: \`${error}\``;
            } else if (verdict === 'blocked') {
              note = '\n\n> **Action required**: Resolve CRITICAL/ERROR findings before merge.';
            }

            const body = [
              `## ${icon} Hostile Reviewer — ${label}`,
              '',
              `**Blocking findings** (critical/error): ${blocking}  `,
              `**Total findings**: ${total}  `,
              `**Models succeeded**: ${models || 'none'}`,
              note,
              '',
              '---',
              '',
              '**Gate semantics (pilot phase)**',
              '',
              '| Verdict | Meaning | Blocks merge? |',
              '|---------|---------|---------------|',
              '| `passed` | No critical/error findings | No |',
              '| `blocked` | CRITICAL or ERROR findings found | **Yes** |',
              '| `degraded` | All models unavailable (infra) | No (pilot) |',
              '',
              '_Powered by [omniintelligence.review_pairing.cli_review](https://github.com/OmniNode-ai/omniintelligence) — node-based adversarial review via HandlerLlmCliSubprocess (OMN-8524)_',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c =>
              c.body.includes('Hostile Reviewer')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  hostile-review-gate:
    name: Hostile Review Gate
    runs-on: >-
      ${{
        github.event_name == 'pull_request'
        && github.event.pull_request.head.repo.full_name != github.repository
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["ubuntu-latest"]')
      }}
    needs: [occ-preflight, hostile-review]
    if: always()
    steps:
      - name: Evaluate gate
        run: |
          echo "=== Hostile Review Gate ==="
          PREFLIGHT="${{ needs.occ-preflight.result }}"
          RESULT="${{ needs.hostile-review.result }}"
          echo "occ-preflight: $PREFLIGHT"
          echo "hostile-review: $RESULT"

          if [ "$PREFLIGHT" != "success" ]; then
            echo "::error::OCC preflight failed or did not complete successfully."
            exit 1
          fi
          if [ "$RESULT" = "failure" ]; then
            echo "::error::Hostile reviewer found CRITICAL/ERROR findings — resolve before merge."
            exit 1
          fi
          echo "Hostile Review Gate PASSED"
