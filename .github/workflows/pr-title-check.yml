# OMN-6912

name: PR Title Check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

# OMN-19643: cancel only superseded pull request runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


jobs:
  pr-title:
    uses: OmniNode-ai/onex_change_control/.github/workflows/pr-title-check-reusable.yml@6adc28168d023d027bf9c1172f262ac03c9d9055 # OCC dev 6adc2816
    permissions:
      pull-requests: read
