#
# Required-Check Skip-Vector Guard — omnimarket caller (OMN-14857, fan-out
# from the omniclaude canary, OMN-14854).
#
# Produces required status check: "required-check-skip-guard / check-skip-vectors"
#
# NOT YET added to required_status_checks on this branch (mirrors OMN-14854's
# ordering) — see .github/required-checks.yaml, where this context's manifest
# row is `mode: ADVISORY`. The branch-protection flip to REQUIRED happens in a
# follow-up PR only after this workflow has posted green on `dev` at least
# twice — never in the same PR that introduces the workflow, to avoid a
# self-inflicted wedge (a PR blocked on a required check that has never
# successfully run under real conditions).
#
# IMPORTANT: this trigger MUST NOT carry a `paths:`/`paths-ignore:` filter
# (design spec section 4c, OMN-14854). This is the one required-check
# workflow that is exempt from "narrow the trigger for efficiency" — a path
# filter here would be the exact self-referential skip-vector this guard
# exists to catch.
#
# PIN NOTE (OMN-14874): the reusable workflow's own doc header says "uses:
# OmniNode-ai/omniclaude/.github/workflows/required-check-skip-guard-reusable.yml@main"
# for caller repos, but omniclaude has NOT YET promoted OMN-14854 from dev to
# main (verified: the file 404s at omniclaude@main, resolves at
# omniclaude@dev). The first landed version of this file pinned to `@main`
# and every run failed at workflow-parse time ("error parsing called
# workflow" — GitHub cannot resolve a `uses:` ref whose file does not exist
# on the given ref). Pinned instead to the omniclaude dev HEAD commit that
# carries OMN-14854 (mirrors this repo's existing "re-pin rev to the
# merged-dev SHA once <repo>#<pr> lands" convention for cross-repo refs, e.g.
# .pre-commit-config.yaml's omnibase_core pins). Re-pin to `@main` once
# omniclaude promotes dev->main.

name: Required-Check Skip-Vector Guard

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  occ-preflight:
    name: OCC Preflight Dependency
    runs-on: ubuntu-latest
    permissions:
      checks: read
      contents: read
    steps:
      - name: Wait for required OCC preflight
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -uo pipefail

          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "OCC preflight dependency is enforced by the pull_request gate; continuing for ${GITHUB_EVENT_NAME}."
            exit 0
          fi

          # OMN-14343: desynchronize the same-PR pollers (one per workflow file
          # -- GH Actions `needs:` can't cross workflow-file boundaries) so they
          # don't all hit the Checks API in the same instant every 10s and exhaust
          # the shared per-repo GitHub App installation rate-limit bucket.
          sleep "$(( RANDOM % 15 ))"

          backoff=5
          elapsed=0
          deadline=720

          while [ "$elapsed" -lt "$deadline" ]; do
            # NOTE(OMN-14343): GH Actions runs run: steps under `bash -e {0}` by
            # default -- that -e is already active before this script's own
            # `set -uo pipefail` runs, and `set -uo pipefail` does NOT clear an
            # inherited -e. A bare `response="$(gh api ...)"; status=$?` would
            # therefore abort the whole step on ANY gh api failure before status
            # is ever checked, silently defeating the retry logic below. Using
            # the command substitution as the condition of this `if` is the
            # errexit-safe form -- bash does not trigger -e for a command that is
            # part of an if/while/until condition, regardless of ambient -e state.
            response=""
            status=0
            if response="$(
              gh api "repos/${REPO}/commits/${HEAD_SHA}/check-runs?filter=latest&check_name=occ-preflight%20%2F%20eligibility&per_page=1" \
                --jq 'first(.check_runs[] | .conclusion) // ""' \
                2>&1
            )"; then
              status=0
            else
              status=$?
            fi

            if [ "$status" -ne 0 ]; then
              if echo "$response" | grep -qi "rate limit"; then
                echo "::warning::gh api rate-limited waiting for occ-preflight; backing off ${backoff}s."
                sleep "$backoff"
                elapsed=$((elapsed + backoff))
                backoff=$(( backoff * 2 < 60 ? backoff * 2 : 60 ))
                continue
              fi
              echo "::error::gh api call failed (non-rate-limit): ${response}"
              exit 1
            fi
            backoff=5

            conclusion="$response"

            case "$conclusion" in
              success)
                echo "OCC preflight passed for ${HEAD_SHA}."
                exit 0
                ;;
              failure|cancelled|timed_out|action_required|startup_failure)
                echo "::error::OCC preflight concluded ${conclusion}; refusing to start this workflow."
                exit 1
                ;;
              "")
                echo "Waiting for occ-preflight / eligibility to post for ${HEAD_SHA}..."
                ;;
              *)
                echo "OCC preflight is ${conclusion}; waiting."
                ;;
            esac

            sleep 10
            elapsed=$((elapsed + 10))
          done

          echo "::error::Timed out waiting for occ-preflight / eligibility on ${HEAD_SHA}."
          exit 1

  required-check-skip-guard:
    needs: occ-preflight
    # pinned to omniclaude dev HEAD carrying OMN-14854 (not yet promoted to
    # main as of this PR) -- see PIN NOTE above. Re-pin to @main post-promotion.
    uses: OmniNode-ai/omniclaude/.github/workflows/required-check-skip-guard-reusable.yml@5289b62c3eb7375de9b783e17f5f6d95805df9ca
