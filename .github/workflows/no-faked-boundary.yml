#
# OMN-13501 / OMN-13502 (WS-F): no-faked-boundary gate — BLOCKING MODE for omnimarket.
#
# A hand-written class/object standing in for the platform's OWN inference /
# routing / dispatch boundary (inference bridge, model router, routing-contract
# resolution, registry, dispatch surface) that returns canned / prompt-echoed
# output, or a patch("httpx.Client") / MagicMock substituting that egress inside a
# real-dispatch test, is a FAKE of our architecture. This gate turns the
# feedback_real_dispatch_path_tests failure ("handler-isolation tests pass while
# live fails") into a mechanical detector.
#
# The detector is the pure COMPUTE HandlerNoFakedBoundaryCompute (OMN-13497)
# executed over the in-memory event bus by runtime_no_faked_boundary, shipped in
# omnibase_core 0.46.4 (PR #1377 detector-FP fix + PR #1379 gate; released
# 2026-07-03). The canonical recorded-replay seam (patch("httpx.Client",
# return_value=<RecordedReplayInferenceTransport>), OMN-13499) is exempt.
#
# WHY BLOCKING NOW: the OMN-13501 burn-down landed REAL fixes for the ~50 real
# boundary fakes (recorded-replay transports, real model objects, contract-level
# fakes, or a justified per-line onex-allow-faked-boundary for non-inference HTTP),
# and the detector's OWN acceptance corpus
# (validator_corpora/corpus_no_faked_boundary.py, which embeds fake examples as
# ground truth) is file-level-exempt (onex-allow-file-faked-boundary). omnimarket
# src+tests now scans CLEAN (0 findings), so this gate drops --report-only and runs
# BLOCKING — new fakes fail the job and block merge. The job name
# "No Faked Boundary Gate" is added to the dev branch-protection required contexts
# by the operator (wedge-safe: merge_group trigger, no paths filter,
# fail-propagating). Mirrors omnibase_core's blocking gate
# (.github/workflows/no-faked-boundary.yml @ core).
#
# Suppress an approved fixture line with:  # onex-allow-faked-boundary

name: No Faked Boundary Gate

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [main, dev]
  merge_group:

permissions:
  contents: read

jobs:
  occ-preflight:
    name: OCC Preflight Dependency
    runs-on: ubuntu-latest
    permissions:
      checks: read
      contents: read
    steps:
      - name: Wait for required OCC preflight
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -uo pipefail

          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "OCC preflight dependency is enforced by the pull_request gate; continuing for ${GITHUB_EVENT_NAME}."
            exit 0
          fi

          # OMN-14343: desynchronize the ~33 same-PR pollers (one per workflow file
          # -- GH Actions `needs:` can't cross workflow-file boundaries) so they
          # don't all hit the Checks API in the same instant every 10s and exhaust
          # the shared per-repo GitHub App installation rate-limit bucket.
          sleep "$(( RANDOM % 15 ))"

          backoff=5
          elapsed=0
          deadline=720

          while [ "$elapsed" -lt "$deadline" ]; do
            # NOTE(OMN-14343): GH Actions runs run: steps under `bash -e {0}` by
            # default -- that -e is already active before this script's own
            # `set -uo pipefail` runs, and `set -uo pipefail` does NOT clear an
            # inherited -e. A bare `response="$(gh api ...)"; status=$?` would
            # therefore abort the whole step on ANY gh api failure before status
            # is ever checked, silently defeating the retry logic below. Using
            # the command substitution as the condition of this `if` is the
            # errexit-safe form -- bash does not trigger -e for a command that is
            # part of an if/while/until condition, regardless of ambient -e state.
            response=""
            status=0
            for page in $(seq 1 5); do
              if page_response="$(
                gh api "repos/${REPO}/commits/${HEAD_SHA}/check-runs?filter=latest&per_page=100&page=${page}" \
                  --jq 'first(.check_runs[] | select(.name == "occ-preflight / eligibility") | .conclusion) // ""' \
                  2>&1
              )"; then
                status=0
                if [ -n "$page_response" ]; then
                  response="$page_response"
                  break
                fi
              else
                status=$?
                response="$page_response"
                break
              fi
            done

            if [ "$status" -ne 0 ]; then
              if echo "$response" | grep -qi "rate limit"; then
                echo "::warning::gh api rate-limited waiting for occ-preflight; backing off ${backoff}s."
                sleep "$backoff"
                elapsed=$((elapsed + backoff))
                backoff=$(( backoff * 2 < 60 ? backoff * 2 : 60 ))
                continue
              fi
              echo "::error::gh api call failed (non-rate-limit): ${response}"
              exit 1
            fi
            backoff=5

            conclusion="$response"

            case "$conclusion" in
              success)
                echo "OCC preflight passed for ${HEAD_SHA}."
                exit 0
                ;;
              failure|cancelled|timed_out|action_required|startup_failure)
                echo "::error::OCC preflight concluded ${conclusion}; refusing to start this workflow."
                exit 1
                ;;
              "")
                echo "Waiting for occ-preflight / eligibility to post for ${HEAD_SHA}..."
                ;;
              *)
                echo "OCC preflight is ${conclusion}; waiting."
                ;;
            esac

            sleep 10
            elapsed=$((elapsed + 10))
          done

          echo "::error::Timed out waiting for occ-preflight / eligibility on ${HEAD_SHA}."
          exit 1
  no-faked-boundary-gate:
    needs: occ-preflight
    name: No Faked Boundary Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone omnibase_core
        run: git clone --depth=1 https://github.com/OmniNode-ai/omnibase_core.git ../omnibase_core

      - name: Clone omnibase_compat
        run: git clone --depth=1 https://github.com/OmniNode-ai/omnibase_compat.git ../omnibase_compat

      - name: Clone omnimemory
        run: git clone --depth=1 https://github.com/OmniNode-ai/omnimemory.git ../omnimemory

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Run no-faked-boundary gate (full src + tests, BLOCKING)
        run: |
          uv run python -m omnibase_core.validation.no_faked_boundary.runtime_no_faked_boundary \
            src tests
