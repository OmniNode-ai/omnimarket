#
# delegation-health-check.yml -- OMN-19451. omnimarket's caller of the
# delegation-health check on runtime PRs. The check itself is authored once, in
# omnibase_infra (delegation-health-reusable.yml, scripts/ci/delegation_health_check.py
# and config/delegation_health_check.yaml); nothing of it is copied here, so the
# source list cannot fork.
#
# SIGNAL, NOT A GATE (OMN-25514, decoupling plan steps S1-A and S1-B). The
# check-run this caller produces, `delegation-health-check / Delegation Health
# Check`, is in no required list: it is not in EXPECTED_EXTERNAL_CONTEXTS in
# scripts/ci/ci_summary_gate.py, not in ci_summary_external_producers.json, and
# CI Summary admits the row a head that ran the old pull_request caller still
# carries through a dated entry in scripts/ci/ci_summary_sweep_exclusions.json.
#
# It reads delegation verdicts from lab, stability and customer-surface runs, so
# a red verdict elsewhere (the M4 C17 customer-surface workflow) put a red row
# on every pull request head, and GitHub's rollup of that head then read red to
# the landing controller although no required context failed. The caller now
# runs on a schedule and on every push to dev, reads every verdict and writes it
# to the job summary; it runs on no pull_request and no merge_group, so no pull
# request head or queue head carries the row. A head that predates this change
# keeps its row until it moves. The same shape runs in omnibase_infra.
#
# The one job carries no `needs:`, no job-level `if:` and no `continue-on-error`.
#
# THE PIN. The reusable is called at a full commit sha, and it checks its own
# scripts and config out at github.job_workflow_sha, so the YAML and the code it
# runs are one omnibase_infra commit (the same pinning runtime-rebuild-trigger.yml
# uses, OMN-18387). The pin is a tag that carries the reusable's push and
# schedule branch (omnibase_infra#6054). tests/ci/test_delegation_health_check_caller_omn19451.py
# replays infra's own fixtures at this pin, so moving it re-proves the check.
name: Delegation Health Check

on:
  schedule:
    - cron: "41 */4 * * *"
  push:
    branches: [dev]

concurrency:
  # One run per ref at a time; a newer push to dev supersedes an older run.
  group: delegation-health-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # No `name:` on purpose: the check-run is then `<job id> / <called job name>`,
  # `delegation-health-check / Delegation Health Check`, the context the
  # sweep exclusion names and the prefix the advisory-job gate
  # matches a called workflow's job by.
  # advisory-automation: OMN-25514 reports the delegation nightly and M4 C17 verdicts as a dev signal; in no required list, so a red row cannot block a merge
  delegation-health-check:
    uses: OmniNode-ai/omnibase_infra/.github/workflows/delegation-health-reusable.yml@dev-20261118210333-41821105a4a7
    with:
      repo_key: omnimarket
    secrets:
      ONEXBOT_OCC_APP_ID: ${{ secrets.ONEXBOT_OCC_APP_ID }}
      ONEXBOT_OCC_PRIVATE_KEY: ${{ secrets.ONEXBOT_OCC_PRIVATE_KEY }}
