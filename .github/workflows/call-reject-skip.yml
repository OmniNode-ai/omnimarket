#
# OMN-10422 (Wave 5): Caller — re-scan skip-gate bypass tokens at merge_group entry.
#
# Invokes the omniclaude-hosted reusable workflow on pull_request and merge_group.
# On merge_group, the reusable workflow resolves the PR via head SHA and asserts
# exactly-one-PR (invariant I10). Cache is not reused across events (invariant I9).
#
# Required-status-check name: `scan / reject-skip-gate-token`
# Wire via: Settings → Branches → main → Require status checks → add the check name above.

name: Reject skip-gate bypass tokens

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [main, dev]
  merge_group:

permissions:
  contents: read
  pull-requests: read

jobs:
  occ-preflight:
    name: OCC Preflight Dependency
    runs-on: ubuntu-latest
    permissions:
      checks: read
      contents: read
    steps:
      - name: Wait for required OCC preflight
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "OCC preflight dependency is enforced by the pull_request gate; continuing for ${GITHUB_EVENT_NAME}."
            exit 0
          fi

          for _ in $(seq 1 60); do
            conclusion=""
            for page in $(seq 1 5); do
              page_conclusion="$(
                gh api "repos/${REPO}/commits/${HEAD_SHA}/check-runs?filter=latest&per_page=100&page=${page}" \
                  --jq 'first(.check_runs[] | select(.name == "occ-preflight / eligibility") | .conclusion) // ""'
              )"
              if [ -n "$page_conclusion" ]; then
                conclusion="$page_conclusion"
                break
              fi
            done

            case "$conclusion" in
              success)
                echo "OCC preflight passed for ${HEAD_SHA}."
                exit 0
                ;;
              failure|cancelled|timed_out|action_required|startup_failure)
                echo "::error::OCC preflight concluded ${conclusion}; refusing to start this workflow."
                exit 1
                ;;
              "")
                echo "Waiting for occ-preflight / eligibility to post for ${HEAD_SHA}..."
                ;;
              *)
                echo "OCC preflight is ${conclusion}; waiting."
                ;;
            esac
            sleep 10
          done

          echo "::error::Timed out waiting for occ-preflight / eligibility on ${HEAD_SHA}."
          exit 1

  call-reject-skip-token:
    needs: occ-preflight
    uses: OmniNode-ai/omniclaude/.github/workflows/reject-deploy-gate-skip.yml@main
    secrets: inherit
