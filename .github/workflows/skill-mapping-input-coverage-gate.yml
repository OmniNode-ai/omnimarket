#
# Skill-mapping input-coverage gate (OMN-13965)
#
# `onex skill <name>` injects every skill_mapping.yaml arg that declares a
# `default` into the node-input payload on every invocation. If that field is
# not accepted by the model the backing handler validates (the handle() param
# for compute/effect/reducer handlers; the handler_routing event_model for
# orchestrators), the skill fails 100% of CLI calls with extra_forbidden
# (OMN-13964). This gate diffs the installed skill_mapping.yaml (from the pinned
# omnibase_infra dep) against each node's resolved input model and FAILs on any
# defaulted-arg / missing-field pair.
#
# Runs on every PR/merge_group with no paths filter: a required status check
# must report on every PR (mirrors state-coverage-gate.yml), otherwise it stays
# permanently "expected" and blocks the queue.

name: skill-mapping-input-coverage-gate

on:
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: skill-mapping-input-coverage-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  occ-preflight:
    name: OCC Preflight Dependency
    runs-on: ubuntu-latest
    permissions:
      checks: read
      contents: read
    steps:
      - name: Wait for required OCC preflight
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "OCC preflight dependency is enforced by the pull_request gate; continuing for ${GITHUB_EVENT_NAME}."
            exit 0
          fi

          for _ in $(seq 1 60); do
            conclusion="$(
              gh api "repos/${REPO}/commits/${HEAD_SHA}/check-runs?filter=latest&per_page=100" \
                --jq '.check_runs[] | select(.name == "occ-preflight / eligibility") | .conclusion' \
                | head -1
            )"

            case "$conclusion" in
              success)
                echo "OCC preflight passed for ${HEAD_SHA}."
                exit 0
                ;;
              failure|cancelled|timed_out|action_required|startup_failure)
                echo "::error::OCC preflight concluded ${conclusion}; refusing to start this workflow."
                exit 1
                ;;
              "")
                echo "Waiting for occ-preflight / eligibility to post for ${HEAD_SHA}..."
                ;;
              *)
                echo "OCC preflight is ${conclusion}; waiting."
                ;;
            esac
            sleep 10
          done

          echo "::error::Timed out waiting for occ-preflight / eligibility on ${HEAD_SHA}."
          exit 1

  skill-mapping-input-coverage-gate:
    needs: occ-preflight
    name: skill-mapping-input-coverage-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone omnibase_core
        run: git clone --depth=1 https://github.com/OmniNode-ai/omnibase_core.git ../omnibase_core

      - name: Clone omnibase_compat
        run: git clone --depth=1 https://github.com/OmniNode-ai/omnibase_compat.git ../omnibase_compat

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Run skill-mapping input-coverage gate
        run: uv run python scripts/validate_skill_mapping_input_coverage.py
