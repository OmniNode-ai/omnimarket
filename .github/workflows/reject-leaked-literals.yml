#
# OMN-10580 (hardens OMN-10554): leaked-literals gate — BLOCKING MODE.
#
# This workflow runs `scripts/validation/check_leaked_literals.sh blocking all`
# on every PR and on merge_group entry. Any unannotated leaked literal causes
# exit 1 and blocks merge.
#
# To permit a legitimate occurrence, add an inline annotation on the same line:
#   # onex-allow-internal-ip OMN-XXXXX reason="<concrete reason>"
#   # onex-allow-local-path OMN-XXXXX reason="<concrete reason>"
#   # onex-allow-test-fixture OMN-XXXXX reason="<concrete reason>"
#   # onex-allow-raw-env OMN-XXXXX reason="<concrete reason>"
#   # onex-allow-model-id OMN-XXXXX reason="<concrete reason>"
#
# See docs/leaked-literals-governance.md for the full governance policy.
#
# This job is a REQUIRED STATUS CHECK. The job name
# "Leaked Literals Gate" must match branch protection rules.

name: Leaked Literals Gate

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [main, dev]
  merge_group:

permissions:
  contents: read

jobs:
  occ-preflight:
    name: OCC Preflight Dependency
    runs-on: ubuntu-latest
    permissions:
      checks: read
      contents: read
    steps:
      - name: Wait for required OCC preflight
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "OCC preflight dependency is enforced by the pull_request gate; continuing for ${GITHUB_EVENT_NAME}."
            exit 0
          fi

          for _ in $(seq 1 60); do
            conclusion="$(
              gh api "repos/${REPO}/commits/${HEAD_SHA}/check-runs?filter=latest&per_page=100" \
                --jq 'first(.check_runs[] | select(.name == "occ-preflight / eligibility") | .conclusion) // ""'
            )"

            case "$conclusion" in
              success)
                echo "OCC preflight passed for ${HEAD_SHA}."
                exit 0
                ;;
              failure|cancelled|timed_out|action_required|startup_failure)
                echo "::error::OCC preflight concluded ${conclusion}; refusing to start this workflow."
                exit 1
                ;;
              "")
                echo "Waiting for occ-preflight / eligibility to post for ${HEAD_SHA}..."
                ;;
              *)
                echo "OCC preflight is ${conclusion}; waiting."
                ;;
            esac
            sleep 10
          done

          echo "::error::Timed out waiting for occ-preflight / eligibility on ${HEAD_SHA}."
          exit 1

  leak-gate:
    needs: occ-preflight
    name: Leaked Literals Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run leak gate in blocking mode
        run: |
          bash scripts/validation/check_leaked_literals.sh blocking all
