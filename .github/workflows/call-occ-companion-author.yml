#
# call-occ-companion-author.yml
#
# Toggle 1 (OMN-14393) — mutate-CAPABLE OCC-companion auto-authoring, DEFAULT OFF.
# A sibling to call-occ-companion-observe.yml. The observe workflow is hardcoded
# to dry_run forever; THIS workflow can author for real — but only when the
# operator explicitly flips the repo variable OMNI_OCC_AUTOAUTHOR_MODE to
# "mutate". Until then the committed default is "dry_run", so a product PR behaves
# EXACTLY as it does today: node_occ_companion_effect reads + computes the plan
# and returns it WITHOUT cloning, pushing, opening an OCC PR, or stamping the
# product body (ModelOccCompanionEffectRequest.mode default = dry_run).
#
# SAFETY (do NOT weaken):
#   * mode is sourced ONLY from the operator repo variable, validated against a
#     hardcoded {dry_run,mutate} allowlist, and defaults to dry_run — it is NEVER
#     templated from PR input (injection-safe, mirrors the observe hardcode).
#   * This job is `continue-on-error: true`, is NOT in required_status_checks, and
#     is NOT referenced by ci.yml's CI Summary `needs:` — it can never block a
#     merge (same guardrail shape as OMN-14657's observe job).
#   * OccCompanionEmitter (node_pr_lifecycle_fix_effect) + call-occ-autobind.yml
#     remain the sole LIVE producer and are UNTOUCHED by this workflow.
#
# DEPENDENCY — DO NOT FLIP TO mutate UNTIL OMN-14679 IS MERGED:
#   Pre-14679, auto-minted companions fail the substance-floor / placeholder-lint
#   gate, so the product PR's Evidence-Source would point at a RED OCC PR and the
#   product PR's own occ-preflight would jam. Turning mutate on early blocks
#   product PRs at scale (design "Two-toggle plan"). Flipping mutate ON must also
#   be coupled with disabling the call-occ-autobind emitter dispatch, or every PR
#   gets TWO companions (dual-producer hazard) — that coupling is an operator-gated
#   step OUT OF THIS LANE.
#
# When mutate is enabled the node clones onex_change_control, pushes a branch, and
# opens the OCC PR, so it runs on the trusted self-hosted runner with a
# cross-repo write credential (the ambient omnimarket-scoped Actions token used
# for dry_run can never push to onex_change_control).
#
# CREDENTIAL (OMN-15350) — the mutate path mints a per-run installation token
# from the least-privilege **OnexBot-OCC-Writer** GitHub App (org secrets
# ONEXBOT_OCC_APP_ID / ONEXBOT_OCC_PRIVATE_KEY), scoped down to
# OmniNode-ai/onex_change_control ONLY, via the canonical
# `actions/create-github-app-token` pattern already used by
# call-occ-attestation-observe.yml (OMN-14955) and pr-arch-review.yml.
#   * The prior OCC_AUTOAUTHOR_TOKEN secret (OMN-14904) was NEVER provisioned —
#     live readback 2026-07-29 shows it in neither the org nor the omnimarket
#     repo secret set, so the mutate path was credential-dead on arrival. Do not
#     reintroduce it. (Named without the `secrets.` prefix on purpose: the
#     shape test asserts that prefix is absent, so the assertion measures real
#     credential usage rather than prose.)
#   * The org-wide `CROSS_REPO_PAT` is explicitly REJECTED here: it is broader
#     than this job needs and is not attributable to a machine identity.
#   * Operator ruling 2026-07-29: verifier / merge-path / OCC-authoring machine
#     identity uses the EXISTING OnexBot + OnexBot-OCC-Writer Apps. OCC companion
#     authoring is the OnexBot-OCC-Writer lane. Never create a new bot account.
#
# TWO CREDENTIALS, NOT ONE (OMN-15441) — the node makes writes into TWO repos:
#   1. onex_change_control (lease, clone, push, PR create, label)  -> OCC token
#   2. THIS product repo, exactly one call: PATCH the PR body with
#      `Evidence-Source: OCC#<n>`                                  -> product token
#   The OMN-15350 OCC mint is scoped `repositories: onex_change_control`, so it
#   can NEVER satisfy (2). Reusing it there 403'd live on omnimarket#1958 (run
#   30496115784): OCC#5516 was created fine, then `_patch_product_body` died on
#   "Resource not accessible by integration". Scope and target are disjoint by
#   design, so this is deterministic, not flaky.
#
#   The fix is credential SEPARATION, deliberately NOT broadening the OCC-Writer
#   App onto product repos — least privilege on the OCC writer is the entire
#   point of OMN-15350/OMN-14955, and widening it would hand every product repo
#   to the credential that can push change-control evidence.
#
#   (2) mints from the general **OnexBot** App (ONEXBOT_APP_ID /
#   ONEXBOT_APP_PRIVATE_KEY), scoped to THIS repo only. That App is already
#   installed here — pr-arch-review.yml mints it every run ("creating token for
#   the current repository (\"omnimarket\")") — so this adds no new credential
#   surface and no new account, per the standing ruling.
#
#   Why not the ambient `secrets.GITHUB_TOKEN`, which is already product-scoped:
#   a body edit authored by GITHUB_TOKEN does NOT emit `pull_request: edited`
#   (GitHub's recursion guard). call-occ-preflight.yml lists `edited` in its
#   trigger types precisely so the stamp re-evaluates eligibility, so the
#   ambient token would land the bytes and silently fail to unjam the PR. An
#   App-installation token does emit the event. Do NOT "simplify" this to
#   secrets.GITHUB_TOKEN.
#
# Ticket: OMN-14393 (RSD-5), credential re-point OMN-15350, product-body
#   credential split OMN-15441. Design doc:
#   docs/plans/2026-07-14-rsd3-occ-producer-and-retirement.md §3-§4.

name: OCC Companion Author (mutate-capable, DEFAULT dry_run)

on:
  pull_request:
    branches: [main, dev, "hotfix/**"]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  occ-companion-author:
    name: OCC Companion Author (mode from OMNI_OCC_AUTOAUTHOR_MODE, default dry_run)
    # Same eligibility filter as call-occ-autobind.yml / observe: skip dependency
    # bots and ticketless PRs, and skip fork PRs (no secrets / not trusted).
    if: >-
      github.actor != 'dependabot[bot]' &&
      github.actor != 'renovate[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (contains(github.event.pull_request.title, 'OMN-') ||
       contains(github.event.pull_request.head.ref, 'OMN-'))
    # Default (dry_run) runs on ubuntu-latest — no mutation, no self-hosted
    # contention. Only when the operator flips OMNI_OCC_AUTOAUTHOR_MODE=mutate does
    # the job move to the trusted self-hosted runner (needed for OCC clone/push).
    runs-on: >-
      ${{
        (vars.OMNI_OCC_AUTOAUTHOR_MODE == 'mutate')
        && fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
        || 'ubuntu-latest'
      }}
    # Report-only guardrail: a red step here is observed, never enforced. Carries
    # no required-status-check name and is not referenced by any `needs:`.
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Build author payload (mode from operator variable, allowlisted)
        env:
          PR_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # Operator-set repo variable — NOT PR input. Absent => dry_run.
          OMNI_OCC_AUTOAUTHOR_MODE: ${{ vars.OMNI_OCC_AUTOAUTHOR_MODE }}
        run: |
          set -euo pipefail
          # Fail-closed allowlist: anything but the two known modes => dry_run.
          MODE="${OMNI_OCC_AUTOAUTHOR_MODE:-dry_run}"
          case "$MODE" in
            dry_run|mutate) ;;
            *) echo "::warning::unrecognized OMNI_OCC_AUTOAUTHOR_MODE='$MODE' — defaulting to dry_run"; MODE="dry_run" ;;
          esac
          echo "Resolved auto-author mode: $MODE"
          jq -n \
            --arg repo "$PR_REPO" \
            --argjson pr_number "$PR_NUMBER" \
            --arg mode "$MODE" \
            '{repo: $repo, pr_number: $pr_number, mode: $mode}' \
            > occ_companion_author_payload.json
          cat occ_companion_author_payload.json

      - name: Validate OCC cross-repo write credential
        # Fail LOUD, before the mint, when the App secrets are absent — an
        # unprovisioned App must surface as an actionable error, never as a
        # silent degradation to dry_run. The ambient `secrets.GITHUB_TOKEN` is
        # not a substitute: it is omnimarket-scoped and can never push to
        # onex_change_control.
        if: ${{ vars.OMNI_OCC_AUTOAUTHOR_MODE == 'mutate' }}
        env:
          ONEXBOT_OCC_APP_ID: ${{ secrets.ONEXBOT_OCC_APP_ID }}
          ONEXBOT_OCC_PRIVATE_KEY: ${{ secrets.ONEXBOT_OCC_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${ONEXBOT_OCC_APP_ID:-}" ] || [ -z "${ONEXBOT_OCC_PRIVATE_KEY:-}" ]; then
            echo "::error::OMNI_OCC_AUTOAUTHOR_MODE=mutate requires org secrets ONEXBOT_OCC_APP_ID + ONEXBOT_OCC_PRIVATE_KEY (the least-privilege OnexBot-OCC-Writer GitHub App with contents:write + pull-requests:write on OmniNode-ai/onex_change_control; the org-wide CROSS_REPO_PAT is NOT an acceptable substitute). Provision them, or set repo variable OMNI_OCC_AUTOAUTHOR_MODE=dry_run to stand the durable write down. See OMN-15350 / OMN-14955."
            exit 1
          fi

      - name: Validate product-repo write credential (OMN-15441)
        # Same fail-LOUD shape as the OCC credential check above, for the second
        # credential this job needs: the product-body stamp targets THIS repo,
        # which the onex_change_control-scoped OCC token can never reach.
        # Missing secrets must be an actionable error, never a silent
        # degradation that authors OCC#<n> and then 403s on the stamp.
        if: ${{ vars.OMNI_OCC_AUTOAUTHOR_MODE == 'mutate' }}
        env:
          ONEXBOT_APP_ID: ${{ secrets.ONEXBOT_APP_ID }}
          ONEXBOT_APP_PRIVATE_KEY: ${{ secrets.ONEXBOT_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${ONEXBOT_APP_ID:-}" ] || [ -z "${ONEXBOT_APP_PRIVATE_KEY:-}" ]; then
            echo "::error::OMNI_OCC_AUTOAUTHOR_MODE=mutate requires org secrets ONEXBOT_APP_ID + ONEXBOT_APP_PRIVATE_KEY (the general OnexBot GitHub App, pull-requests:write on this product repo) to stamp Evidence-Source onto the product PR body. The OnexBot-OCC-Writer App is scoped to onex_change_control ONLY and cannot do this write (OMN-15441). Do NOT broaden the OCC-Writer scope, and do NOT substitute secrets.GITHUB_TOKEN (its edits do not re-trigger the pull_request:edited gates). See OMN-15441 / OMN-15350."
            exit 1
          fi

      - name: Mint OCC write token (OnexBot-OCC-Writer App, mutate only)
        # Canonical App-token mint pattern (same as call-occ-attestation-observe.yml
        # and pr-arch-review.yml), scoped down to the single target repo: the
        # installation token can touch OmniNode-ai/onex_change_control ONLY, for
        # this run only (~1h TTL) — strictly narrower than any long-lived PAT.
        id: occ-app-token
        if: ${{ vars.OMNI_OCC_AUTOAUTHOR_MODE == 'mutate' }}
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.ONEXBOT_OCC_APP_ID }}
          private-key: ${{ secrets.ONEXBOT_OCC_PRIVATE_KEY }}
          owner: OmniNode-ai
          repositories: onex_change_control

      - name: Mint product-repo write token (OnexBot App, mutate only)
        # OMN-15441: the SECOND credential. Scoped to THIS repo only, ~1h TTL,
        # used for exactly one call — PATCH this PR's body with the
        # Evidence-Source block. Deliberately a different App from the OCC mint
        # above so the OCC-Writer stays least-privilege on onex_change_control.
        id: product-app-token
        if: ${{ vars.OMNI_OCC_AUTOAUTHOR_MODE == 'mutate' }}
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.ONEXBOT_APP_ID }}
          private-key: ${{ secrets.ONEXBOT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Run node_occ_companion_effect (mode-gated)
        id: author
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OCC_WRITE_TOKEN: ${{ steps.occ-app-token.outputs.token }}
          PRODUCT_WRITE_TOKEN: ${{ steps.product-app-token.outputs.token }}
        run: |
          set -euo pipefail
          MODE="$(jq -r '.mode' occ_companion_author_payload.json)"
          if [ "$MODE" = "mutate" ]; then
            # HandlerOccCompanionEffect resolves its write credential from
            # GITHUB_TOKEN; point that at the minted, onex_change_control-scoped
            # OnexBot-OCC-Writer installation token.
            export GITHUB_TOKEN="${OCC_WRITE_TOKEN:?mode=mutate requires the minted OnexBot-OCC-Writer token}"
            # OMN-15441: and hand the handler the SEPARATE product-repo-scoped
            # credential for the one write GITHUB_TOKEN above cannot make.
            # Unset/empty would silently fall back to the OCC token and 403, so
            # this is `:?` (fail loud), matching the OCC token's treatment.
            export OMNI_OCC_PRODUCT_TOKEN="${PRODUCT_WRITE_TOKEN:?mode=mutate requires the minted OnexBot product-repo token}"
          fi
          uv run onex node node_occ_companion_effect \
            --input occ_companion_author_payload.json \
            --output receipt \
            | tee occ_companion_author_result.json

      - name: Publish authoring result to job summary
        if: always()
        run: |
          {
            echo "### OCC Companion Author — mode-gated (report-only, non-blocking)"
            echo
            echo "Ticket: OMN-14393. Default mode is dry_run (no GitHub mutation);"
            echo "mutate requires OMNI_OCC_AUTOAUTHOR_MODE=mutate AND OMN-14679 merged."
            echo
            echo '```json'
            if [ -s occ_companion_author_result.json ]; then
              cat occ_companion_author_result.json
            else
              echo "(node did not produce a result — see step logs above)"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload authoring artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: occ-companion-author-${{ github.event.pull_request.number }}
          path: |
            occ_companion_author_payload.json
            occ_companion_author_result.json
          if-no-files-found: ignore
          retention-days: 30
