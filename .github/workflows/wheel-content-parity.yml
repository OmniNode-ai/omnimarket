#
# WHEEL CONTENT PARITY, called here. OMN-18865.
#
# The pre-merge twin of the OMN-14631 workspace content-parity gate. It proves
# this repository's built wheel carries byte-for-byte the tracked source tree
# under src/omnimarket, plus whatever this repo declares force-included into
# that package from outside src/.
#
# WHY IT IS HERE RATHER THAN ONLY ON THE LAB. omnimarket#2670 adopted the
# propagated public_repo_hygiene block on 2026-09-19, which declared a BARE
# `merge-sweep/`. A bare directory pattern matches at ANY depth, so it also
# matched this repository's real, git-tracked package directory
# src/omnimarket/adapters/codex/skills/merge-sweep/, and hatchling applies the
# VCS ignore file as a build-time exclude -- so the staged source kept
# SKILL.md and the built wheel did not. That pull request was fully GREEN
# here. From 21:19Z every BUILD_SOURCE=workspace runtime image build died with
# `differing files (1 total): ['adapters/codex/skills/merge-sweep/SKILL.md']`
# and the .201 dev lane could not rebuild at all until #2694 anchored the
# pattern to `/merge-sweep/`.
#
# Nothing in this repository looked at what its own wheel contained, so a
# packaging change could not be judged where it was written. It can now.
#
# The subtlety that let it through review: the file is TRACKED, so a plain
# `git check-ignore` is SILENT on it and the pattern reads as harmless in a
# clone. Only `--no-index` reports it, and a git-stripped staged tree has no
# index to consult. This check does not depend on noticing that.
#
# THE COMPARISON IS NOT COPIED INTO THIS REPOSITORY. It lives once, in the
# omnibase_infra image gate, and the ACTION carries it: an action's repository
# is checked out at the ref pinned below, so one pin fixes the action and the
# comparison together, never a branch.
#
# A CI-TIME ACTION IS NOT A RUNTIME DEPENDENCY. Nothing is added to this
# project's metadata, lock file or import graph, and the fetched files die
# with the runner.
#
# NO `paths:` AND NO `branches:` FILTER, and no job-level `if:`, deliberately.
# This context is asserted in EXPECTED_EXTERNAL_CONTEXTS, and an asserted
# context that can be legitimately absent on some pull-request shape does not
# fail that shape, it wedges it.

name: Wheel Content Parity

on:
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  wheel-content-parity:
    name: wheel-content-parity
    # OMNI_RUNNER_SELECTOR_V1 - trusted CI defaults to self-hosted omnibase-ci;
    # public forks default to ubuntu-latest. The untrusted test is the FORK
    # test and only the fork test (OMN-18205). Read live from the routing
    # seam; this workflow never writes a routing variable.
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Judge wheel content parity
        uses: OmniNode-ai/omnibase_infra/.github/actions/wheel-content-parity@5b0898a938202e499e8b2ce491f9fab65adeeb44
        with:
          package: omnimarket
