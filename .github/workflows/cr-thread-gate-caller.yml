name: CR Thread Gate (caller)
# Caller workflow for omniclaude's own PRs.
# Produces required status check: "gate / CodeRabbit Thread Check"
on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_review:
    types: [submitted, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  issue_comment:
    types: [created, edited, deleted]

jobs:
  occ-preflight:
    name: OCC Preflight Dependency
    runs-on: ubuntu-latest
    permissions:
      checks: read
      contents: read
    steps:
      - name: Wait for required OCC preflight
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "OCC preflight dependency is enforced by the pull_request gate; continuing for ${GITHUB_EVENT_NAME}."
            exit 0
          fi

          for _ in $(seq 1 60); do
            conclusion="$(
              gh api "repos/${REPO}/commits/${HEAD_SHA}/check-runs?filter=latest&per_page=100" \
                --jq '.check_runs[] | select(.name == "occ-preflight / eligibility") | .conclusion' \
                | head -1
            )"

            case "$conclusion" in
              success)
                echo "OCC preflight passed for ${HEAD_SHA}."
                exit 0
                ;;
              failure|cancelled|timed_out|action_required|startup_failure)
                echo "::error::OCC preflight concluded ${conclusion}; refusing to start this workflow."
                exit 1
                ;;
              "")
                echo "Waiting for occ-preflight / eligibility to post for ${HEAD_SHA}..."
                ;;
              *)
                echo "OCC preflight is ${conclusion}; waiting."
                ;;
            esac
            sleep 10
          done

          echo "::error::Timed out waiting for occ-preflight / eligibility on ${HEAD_SHA}."
          exit 1

  gate:
    needs: occ-preflight
    if: >-
      github.event_name == 'merge_group' ||
      ((github.event_name != 'issue_comment' || github.event.issue.pull_request != null) &&
      github.actor != 'dependabot[bot]')
    uses: ./.github/workflows/cr-thread-gate.yml
    with:
      pr-number: ${{ format('{0}', github.event.pull_request.number || github.event.issue.number || 0) }}
    secrets:
      CROSS_REPO_PAT: ${{ secrets.CROSS_REPO_PAT }}
