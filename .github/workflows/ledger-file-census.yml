# OMN-22917: the no-file census ratchet and its falsifiers run locally and in CI.

name: Ledger File Census

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # advisory-ok: OMN-22917 new census job is not yet a required status check on dev or main; enforce once branch protection lists it.
  ledger-file-census:
    name: Ledger File Census
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7

      - name: Census of executable ledger-file readers and writers is at or under its ratchet
        env:
          ONEX_LEDGER_CENSUS_ROOT: .
          ONEX_LEDGER_CENSUS_OVERLAY: src/omnimarket/nodes/node_work_ledger_file_census_effect/overlay.example.yaml
        run: uv run python -m omnimarket.nodes.node_work_ledger_file_census_effect --repos omnimarket --directory omnimarket=.

      - name: Prove the ratchet is falsifiable
        run: uv run pytest tests/unit/validators/test_ledger_file_census.py tests/unit/nodes/node_work_ledger_file_census_effect -q --no-cov -p no:cacheprovider

      - name: The seven no-file readings turn red on their planted breaks
        run: uv run pytest tests/unit/nodes/node_work_ledger_reader_effect/test_no_file_readings.py tests/unit/nodes/node_work_ledger_no_file_readings_effect -q --no-cov -p no:cacheprovider
