# OMN-13291: Enforce validator-requirements.yaml fleet gate for omnimarket.
# Reports ALL missing gates in a single pass (never fail-on-first).
name: Validate Validator Requirements

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  occ-preflight:
    name: OCC Preflight Dependency
    runs-on: ubuntu-latest
    permissions:
      checks: read
      contents: read
    steps:
      - name: Wait for required OCC preflight
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "OCC preflight dependency is enforced by the pull_request gate; continuing for ${GITHUB_EVENT_NAME}."
            exit 0
          fi

          for _ in $(seq 1 60); do
            conclusion="$(
              gh api "repos/${REPO}/commits/${HEAD_SHA}/check-runs?filter=latest&per_page=100" \
                --jq '.check_runs[] | select(.name == "occ-preflight / eligibility") | .conclusion' \
                | head -1
            )"

            case "$conclusion" in
              success)
                echo "OCC preflight passed for ${HEAD_SHA}."
                exit 0
                ;;
              failure|cancelled|timed_out|action_required|startup_failure)
                echo "::error::OCC preflight concluded ${conclusion}; refusing to start this workflow."
                exit 1
                ;;
              "")
                echo "Waiting for occ-preflight / eligibility to post for ${HEAD_SHA}..."
                ;;
              *)
                echo "OCC preflight is ${conclusion}; waiting."
                ;;
            esac
            sleep 10
          done

          echo "::error::Timed out waiting for occ-preflight / eligibility on ${HEAD_SHA}."
          exit 1

  validate-validator-requirements:
    needs: occ-preflight
    name: Enforce validator-requirements.yaml (OMN-13291)
    # OMNI_RUNNER_SELECTOR_V1 — runners are resolved from centralized selector variables.
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Checkout omnibase_core
        uses: actions/checkout@v6
        with:
          repository: OmniNode-ai/omnibase_core
          # Pinned to the commit that exports the validate-validator-requirements hook (OMN-13291).
          # Update by running: gh api repos/OmniNode-ai/omnibase_core/commits/dev --jq '.sha'
          ref: d163312724489f10f58ffdf8115ba1fa9d5783e8
          path: omnibase_core
          token: ${{ secrets.OMNIBASE_CORE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Enforce validator-requirements.yaml
        run: |
          cd omnibase_core
          uv sync --all-extras
          uv run python -m omnibase_core.validation.validator_requirements_consumer \
            --repo omnimarket \
            --repo-root .. \
            --spec ../architecture-handshakes/validator-requirements.yaml \
            --baseline ../architecture-handshakes/validator-requirements-baseline.yaml
