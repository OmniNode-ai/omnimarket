#
# OMN-14768 — Branch-safety gate (BLOCKING) for the merge controller.
#
# F-11 (branch-rename prohibition): renaming an OPEN PR's head branch CLOSES the
# PR (the omnidash#258 class). This gate fails closed if any branch-rename
# invocation (`repos/.../branches/.../rename`, `gh api ... rename`, `git branch
# -m/--move`) is introduced anywhere in the merge-controller node tree.
#
# F-12 (Evidence-Ticket branch identity): the Receipt Gate fails LATE on a branch
# whose name omits its Evidence-Ticket id. This gate front-runs it — on a PR it
# asserts the head branch references every `Evidence-Ticket: OMN-XXXX` in the PR
# body, failing with the exact required branch fragment — reusing the Receipt
# Gate's own regexes so the two cannot drift.
#
# The self-tests run here too, so a passing rename-scan of the real tree is never
# vacuous (a planted rename is proven to fail). SYNC with the two pre-commit hooks
# check-branch-rename-prohibited / check-branch-identity-tests.

name: Branch-safety gate

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [main, dev]
  merge_group:

permissions:
  contents: read

jobs:
  branch-safety:
    name: Branch-safety gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone omnibase_core
        run: git clone --depth=1 https://github.com/OmniNode-ai/omnibase_core.git ../omnibase_core

      - name: Clone omnibase_compat
        run: git clone --depth=1 https://github.com/OmniNode-ai/omnibase_compat.git ../omnibase_compat

      - name: Clone omnimemory
        run: git clone --depth=1 https://github.com/OmniNode-ai/omnimemory.git ../omnimemory

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: F-11 — branch-rename prohibition (merge-controller tree)
        run: uv run python scripts/ci/check_branch_identity.py --mode rename-scan

      - name: Gate self-tests (positive controls — non-vacuous)
        run: uv run pytest tests/ci/test_check_branch_identity.py -q -p no:randomly

      - name: F-12 — Evidence-Ticket branch identity (PR only)
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          printf '%s' "$PR_BODY" > /tmp/pr_body.txt
          uv run python scripts/ci/check_branch_identity.py \
            --mode identity --branch "$HEAD_REF" --body-file /tmp/pr_body.txt
