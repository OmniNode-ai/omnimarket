#
# call-occ-autobind.yml
#
# Born-path trigger (OMN-13990 / OMN-13317 F1). Publishes
# onex.cmd.omnimarket.occ-autobind.v1 when a ticketed product PR is opened or
# synchronized, so the OCC evidence companion is authored mechanically by the
# .201 effects runtime (node_pr_lifecycle_fix_effect -> OccAutobindAdapter)
# rather than by a human/agent post-hoc. The runtime PATCHes
# `Evidence-Source: OCC#<n>` onto the PR body and occ-preflight (which now also
# fires on `edited`) re-evaluates green — zero manual authoring.
#
# BROKER DECISION (mirrors pr-merged-publisher.yml, OMN-13226):
#   Trusted (non-fork) PR events run on the self-hosted omnibase-ci runner on
#   .201, which reaches the LOCAL lane Redpanda broker directly
#   (KAFKA_BOOTSTRAP_SERVERS sourced from ~/.omnibase/.env). Fork PRs fall back
#   to ubuntu-latest, where the publisher skips gracefully (exit 0) because no
#   broker is resolvable. The transport is env-resolved, never hardcoded.
#
# Ticket: OMN-13990

name: OCC Autobind Publisher

on:
  pull_request:
    branches: [main, dev, "hotfix/**"]
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  publish-occ-autobind:
    name: Publish occ-autobind command
    # Skip dependency bots (exempt from occ-preflight too) and PRs with no OMN
    # ticket token in the title or branch — a ticketless PR must be fixed by the
    # pr-title gate, not papered over with a mechanical companion (OMN-13990 H4).
    if: >-
      github.actor != 'dependabot[bot]' &&
      github.actor != 'renovate[bot]' &&
      (contains(github.event.pull_request.title, 'OMN-') ||
       contains(github.event.pull_request.head.ref, 'OMN-'))
    # OMNI_RUNNER_SELECTOR_V1 — trusted (non-fork) PRs run on the self-hosted
    # omnibase-ci runner so the publisher reaches the local lane broker; fork
    # PRs fall back to ubuntu-latest (publisher skips gracefully, no broker).
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --quiet confluent-kafka click pydantic

      - name: Publish onex.cmd.omnimarket.occ-autobind.v1
        # All potentially attacker-controlled inputs (branch name, PR title) are
        # passed through environment variables to prevent shell injection.
        #
        # On the self-hosted runner, ~/.omnibase/.env supplies
        # KAFKA_BOOTSTRAP_SERVERS (the local lane broker); that shell env value
        # wins over the secret fallback. On a cloud runner the secret (if any)
        # is used; with no broker the publisher skips gracefully (exit 0).
        env:
          KAFKA_BOOTSTRAP_SERVERS: ${{ secrets.KAFKA_BOOTSTRAP_SERVERS }}
          KAFKA_SASL_USERNAME: ${{ secrets.KAFKA_SASL_USERNAME }}
          KAFKA_SASL_PASSWORD: ${{ secrets.KAFKA_SASL_PASSWORD }}
          PR_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          # Best-effort ticket extraction; the script also parses the branch ref.
          PR_TICKET: ""
        run: |
          # On the self-hosted runner, shell env from ~/.omnibase/.env supplies
          # the local lane broker endpoint and overrides the (cloud) secret.
          source ~/.omnibase/.env 2>/dev/null || true
          python scripts/publish_occ_autobind_command.py
