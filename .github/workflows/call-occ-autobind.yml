#
# call-occ-autobind.yml
#
# Born-path trigger (OMN-13990 / OMN-13317 F1). Publishes
# onex.cmd.omnimarket.occ-autobind.v1 when a ticketed product PR is opened or
# synchronized, so the OCC evidence companion is authored mechanically by the
# .201 effects runtime (node_pr_lifecycle_fix_effect -> OccAutobindAdapter)
# rather than by a human/agent post-hoc. The runtime PATCHes
# `Evidence-Source: OCC#<n>` onto the PR body and occ-preflight (which now also
# fires on `edited`) re-evaluates green — zero manual authoring.
#
# BROKER DECISION (mirrors pr-merged-publisher.yml, OMN-13226; corrected under
# OMN-14451):
#   Trusted (non-fork) PR events run on the self-hosted omnibase-ci runner on
#   .201. That runner is a DOCKER CONTAINER (docker-compose.runners.yml,
#   omnibase_infra) with no bind mount for ~/.omnibase/.env -- that path is
#   host-only and does not exist inside the container, so `source
#   ~/.omnibase/.env` was always a silent no-op there (previously masked by
#   `|| true`). KAFKA_BOOTSTRAP_SERVERS is now supplied ONLY via the
#   repo-level `secrets.KAFKA_BOOTSTRAP_SERVERS` (the dev-lane Redpanda's
#   Tailscale-advertised external listener, reachable from inside the runner
#   container across the bridge network -- verified live, OMN-14451). Fork
#   PRs fall back to ubuntu-latest, where no broker is configured and the
#   publisher skips gracefully (exit 0). On the trusted runner, a missing
#   broker is now a hard failure (RUNNER_IS_TRUSTED) rather than a silent
#   exit 0, since that combination means a real misconfiguration, not an
#   expected fork skip.
#
# OVERLAY-DRIVEN LANE RESOLUTION (OMN-14801):
#   The publish step passes `--lane dev`, which the script resolves against the
#   checked-in `config/ci_bus_lanes.yaml` overlay to decide the bus target and to
#   fail-loud-check the injected `secrets.KAFKA_BOOTSTRAP_SERVERS` against the
#   lane's declared broker (silent dev->stability repoint guard, incident
#   OMN-14800). `dev` is declared `from-secret` while a secret rotation is in
#   flight, so the secret path is preserved byte-identical -- this workflow does
#   NOT remove or bypass the secret.
#
# Ticket: OMN-13990, OMN-14451, OMN-14801

name: OCC Autobind Publisher

on:
  pull_request:
    branches: [main, dev, "hotfix/**"]
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  publish-occ-autobind:
    name: Publish occ-autobind command
    # Skip dependency bots (exempt from occ-preflight too) and PRs with no OMN
    # ticket token in the title or branch — a ticketless PR must be fixed by the
    # pr-title gate, not papered over with a mechanical companion (OMN-13990 H4).
    if: >-
      github.actor != 'dependabot[bot]' &&
      github.actor != 'renovate[bot]' &&
      (contains(github.event.pull_request.title, 'OMN-') ||
       contains(github.event.pull_request.head.ref, 'OMN-'))
    # OMNI_RUNNER_SELECTOR_V1 — trusted (non-fork) PRs run on the self-hosted
    # omnibase-ci runner so the publisher reaches the local lane broker; fork
    # PRs fall back to ubuntu-latest (publisher skips gracefully, no broker).
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    # OMN-14451: same fork/non-fork test as `runs-on:` above, threaded into the
    # publish step so the script can fail loudly (not silently exit 0) when the
    # broker is unresolvable on the trusted lane where a real broker MUST exist.
    env:
      RUNNER_IS_TRUSTED: >-
        ${{
          (github.event_name == 'pull_request' &&
           github.event.pull_request.head.repo.full_name != github.repository)
          && 'false' || 'true'
        }}
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # This job only runs a Python publisher; it never pushes to git, so do
          # not persist the auto-injected token into .git/config (supply-chain
          # exposure surface for later steps). CodeRabbit hardening.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          # pyyaml: parse the checked-in config/ci_bus_lanes.yaml lane overlay
          # (OMN-14801). Kept deliberately thin -- no product graph import.
          pip install --quiet confluent-kafka click pydantic pyyaml

      - name: Publish onex.cmd.omnimarket.occ-autobind.v1
        # All potentially attacker-controlled inputs (branch name, PR title) are
        # passed through environment variables to prevent shell injection.
        #
        # OMN-14451: KAFKA_BOOTSTRAP_SERVERS comes ONLY from the repo secret now
        # (the dev-lane Redpanda's Tailscale-advertised external listener). The
        # runner is a container with no ~/.omnibase/.env bind mount, so sourcing
        # that host-only dotfile here was always a silent no-op -- removed.
        env:
          KAFKA_BOOTSTRAP_SERVERS: ${{ secrets.KAFKA_BOOTSTRAP_SERVERS }}
          KAFKA_SASL_USERNAME: ${{ secrets.KAFKA_SASL_USERNAME }}
          KAFKA_SASL_PASSWORD: ${{ secrets.KAFKA_SASL_PASSWORD }}
          PR_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          # Best-effort ticket extraction; the script also parses the branch ref.
          PR_TICKET: ""
        # OMN-14801: --lane dev selects the authoring lane from the checked-in
        # config/ci_bus_lanes.yaml overlay. `dev` is declared `from-secret` there
        # (a KAFKA_BOOTSTRAP_SERVERS rotation is in flight), so the injected
        # secret remains the broker and the runtime behavior is byte-identical to
        # before -- the overlay adds the fail-loud divergence guard without
        # disabling the secret path. Flip `dev` to a concrete host:port in the
        # overlay once the rotation lands to give the guard teeth.
        run: |
          python scripts/publish_occ_autobind_command.py --lane dev
