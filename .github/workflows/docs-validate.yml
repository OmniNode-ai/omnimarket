name: docs-validate

on:
  pull_request:
  push:
    branches: [main, 'hotfix/**']

# OMN-19643: cancel only superseded pull request runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


jobs:
  call:
    uses: OmniNode-ai/omnibase_core/.github/workflows/validate-docs.yml@dev-20261018024445-b6ee996befa1 # v0.47.28
