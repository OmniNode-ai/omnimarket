#
# OMN-12243: Block PRs targeting main unless they are promotion PRs
# from dev with a promotion receipt, or hotfix PRs with evidence and
# a backmerge link.

name: Main target guard

on:
  pull_request:
    types: [opened, edited, synchronize]

permissions:
  contents: read

jobs:
  occ-preflight:
    name: OCC Preflight Dependency
    runs-on: ubuntu-latest
    permissions:
      checks: read
      contents: read
    steps:
      - name: Wait for required OCC preflight
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "OCC preflight dependency is enforced by the pull_request gate; continuing for ${GITHUB_EVENT_NAME}."
            exit 0
          fi

          for _ in $(seq 1 60); do
            conclusion="$(
              gh api "repos/${REPO}/commits/${HEAD_SHA}/check-runs?filter=latest&per_page=100" \
                --jq 'first(.check_runs[] | select(.name == "occ-preflight / eligibility") | .conclusion) // ""'
            )"

            case "$conclusion" in
              success)
                echo "OCC preflight passed for ${HEAD_SHA}."
                exit 0
                ;;
              failure|cancelled|timed_out|action_required|startup_failure)
                echo "::error::OCC preflight concluded ${conclusion}; refusing to start this workflow."
                exit 1
                ;;
              "")
                echo "Waiting for occ-preflight / eligibility to post for ${HEAD_SHA}..."
                ;;
              *)
                echo "OCC preflight is ${conclusion}; waiting."
                ;;
            esac
            sleep 10
          done

          echo "::error::Timed out waiting for occ-preflight / eligibility on ${HEAD_SHA}."
          exit 1

  main-target-guard:
    needs: occ-preflight
    name: main-target-guard
    runs-on: >-
      ${{
        (github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    timeout-minutes: 5

    steps:
      - name: Check PR target branch
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail

          if [[ "${BASE_REF}" != "main" ]]; then
            echo "::notice::PR targets '${BASE_REF}', not main; guard does not apply."
            exit 0
          fi

          echo "PR targets main. Checking head ref: '${HEAD_REF}'"

          if [[ "${HEAD_REF}" == "dev" || "${HEAD_REF}" == promotion/* ]]; then
            if echo "${PR_BODY}" | grep -qE 'promotion-receipt:[[:space:]]*OCC-[0-9]+'; then
              echo "::notice::Promotion PR from '${HEAD_REF}' with valid promotion-receipt. Allowed."
              exit 0
            fi

            echo "::error::Promotion PR from '${HEAD_REF}' is missing a promotion receipt."
            echo "::error::Add a line matching: promotion-receipt: OCC-<number>"
            echo "::error::Retarget this PR to dev; main accepts only promotion or hotfix PRs."
            exit 1
          fi

          if [[ "${HEAD_REF}" == hotfix/* ]]; then
            MISSING=()

            if ! echo "${PR_BODY}" | grep -qE 'hotfix-evidence:[[:space:]]*OCC-[0-9]+'; then
              MISSING+=("hotfix-evidence: OCC-<number>")
            fi

            if ! echo "${PR_BODY}" | grep -qE 'backmerge:[[:space:]]*#[0-9]+'; then
              MISSING+=("backmerge: #<pr-number>")
            fi

            if [[ "${#MISSING[@]}" -eq 0 ]]; then
              echo "::notice::Hotfix PR from '${HEAD_REF}' with valid hotfix evidence and backmerge. Allowed."
              exit 0
            fi

            echo "::error::Hotfix PR from '${HEAD_REF}' is missing required fields:"
            for field in "${MISSING[@]}"; do
              echo "::error::  - ${field}"
            done
            echo "::error::Retarget this PR to dev; main accepts only promotion or hotfix PRs."
            exit 1
          fi

          echo "::error::PRs targeting main must come from dev, promotion/*, or hotfix/*."
          echo "::error::Head ref '${HEAD_REF}' is not permitted to target main directly."
          echo "::error::Retarget this PR to dev; main accepts only promotion or hotfix PRs."
          exit 1
