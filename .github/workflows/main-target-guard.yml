#
# OMN-12243: Block PRs targeting main.
#
# OMN-20074: no exception is left. `main` is release-synced: release.yml's
# "Sync main to release tag" step advances it and opens no pull request against
# it, and the operator ruling of 2026-10-10T16:52:56Z holds that anything
# targeting main violates the rule. The promotion-receipt and hotfix-evidence
# shapes this guard used to admit named records in the change-control
# repository, which is being retired. Pinned by
# tests/ci/test_main_target_guard_refuses_receipt_admission.py.

name: Main target guard

on:
  pull_request:
    types: [opened, edited, synchronize]

# OMN-19643: cancel only superseded pull request runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


permissions:
  contents: read

jobs:
  main-target-guard:
    name: main-target-guard
    runs-on: >-
      ${{
        (github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    timeout-minutes: 5

    steps:
      - name: Check PR target branch
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail

          if [[ "${BASE_REF}" != "main" ]]; then
            echo "::notice::PR targets '${BASE_REF}', not main; guard does not apply."
            exit 0
          fi

          echo "::error::PR from '${HEAD_REF}' targets main. main is release-synced and accepts no pull request."
          echo "::error::Retarget this PR to dev."
          exit 1
