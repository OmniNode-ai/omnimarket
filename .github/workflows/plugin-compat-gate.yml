#
# plugin-compat-gate.yml — CI gate: runtime version handshake tests
#
# DoD gate for OMN-8789 SD-02:
#   1. Runs version_handshake unit tests (match + mismatch detection).
#   2. Hard-fails if handshake module is broken or tests regress.
#
# When this fails:
#   - Test failure: fix omnimarket.runtime.version_handshake logic.
#   - Import error: check packaging dependency is present in pyproject.toml.

name: Plugin Compat Handshake Gate

on:
  push:
    branches: [main, develop, 'hotfix/**']
    paths:
      - 'src/omnimarket/runtime/**'
      - 'tests/test_plugin_compat_handshake.py'
      - '.github/workflows/plugin-compat-gate.yml'
  pull_request:
    branches: [main, dev, develop]
    paths:
      - 'src/omnimarket/runtime/**'
      - 'tests/test_plugin_compat_handshake.py'
      - '.github/workflows/plugin-compat-gate.yml'
  merge_group:
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.12'

jobs:
  occ-preflight:
    # self-gating-ok: centralized OCC preflight reusable is the canonical cross-repo gate for non-OCC repositories.
    uses: OmniNode-ai/omnibase_core/.github/workflows/occ-preflight.yml@336021ef29ba3568394b31a32b9a3e01dba0dae9
    permissions:
      contents: read
      pull-requests: read
    with:
      contracts-dir: contracts
      receipts-dir: drift/dod_receipts

  plugin-compat-handshake:
    needs: occ-preflight
    name: Runtime version handshake tests
    runs-on: >-
      ${{
        github.event_name == 'pull_request'
        && github.event.pull_request.head.repo.full_name != github.repository
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["ubuntu-latest"]')
      }}
    timeout-minutes: 10
    if: needs.occ-preflight.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Clone omnibase_core
        run: git clone --depth=1 https://github.com/OmniNode-ai/omnibase_core.git ../omnibase_core

      - name: Clone omnibase_compat
        run: git clone --depth=1 https://github.com/OmniNode-ai/omnibase_compat.git ../omnibase_compat

      - name: Clone omnimemory
        run: git clone --depth=1 https://github.com/OmniNode-ai/omnimemory.git ../omnimemory

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.6.1"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Load cached venv
        uses: actions/cache@v5
        with:
          path: .venv
          key: uv-plugin-compat-handshake-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      - name: Install dependencies
        run: uv sync --locked

      - name: Run version handshake tests
        run: |
          uv run pytest tests/test_plugin_compat_handshake.py -v \
            --tb=short \
            -p no:warnings

      - name: Verify handshake module imports cleanly
        run: |
          uv run python -c "
          from omnimarket.runtime.version_handshake import (
              check_plugin_compat,
              load_compat_matrix,
              ModelPluginCompatResult,
              ModelPluginCompatMatrix,
          )
          print('OK: version_handshake module imports clean')
          "
