name: Imperative Contract Guard

on:
  pull_request:
  push:
    branches:
      - main

# OMN-19643: cancel only superseded pull request runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


permissions:
  contents: read

jobs:
  imperative-contract-guard:
    # self-gating-ok: central guard is intentionally shared across repos; caller PRs do not modify the referenced workflow.
    uses: OmniNode-ai/onex_change_control/.github/workflows/imperative-contract-guard.yml@86c7907b171241372573239339ee37308ba54a19 # v0.5.3
    with:
      # read allowlists from the same OCC release tag the reusable is pinned to,
      # never OCC's live branch, so an OCC merge cannot turn this repo red. Bump both
      # together (see the sibling pin table in .github/CONTRIBUTING.md).
      onex-change-control-ref: v0.5.3
