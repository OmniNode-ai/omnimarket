name: Imperative Contract Guard

on:
  pull_request:
  push:
    branches:
      - main

# OMN-19643: cancel only superseded pull request runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


permissions:
  contents: read

jobs:
  imperative-contract-guard:
    # self-gating-ok: central guard is intentionally shared across repos; caller PRs do not modify the referenced workflow.
    # OMN-21002: the caller owns its unchanged, shrink-only allowlist.
    uses: OmniNode-ai/omnibase_core/.github/workflows/imperative-contract-guard.yml@dev-20261018024445-b6ee996befa1
    with:
      allowlist-path: imperative-contract-allowlist.yaml
