name: Imperative Contract Guard

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  occ-preflight:
    # self-gating-ok: centralized OCC preflight reusable is the canonical cross-repo gate for non-OCC repositories.
    uses: OmniNode-ai/omnibase_core/.github/workflows/occ-preflight.yml@336021ef29ba3568394b31a32b9a3e01dba0dae9
    permissions:
      contents: read
      pull-requests: read
    with:
      contracts-dir: contracts
      receipts-dir: drift/dod_receipts

  imperative-contract-guard:
    needs: occ-preflight
    # self-gating-ok: central guard is intentionally shared across repos; caller PRs do not modify the referenced workflow.
    uses: OmniNode-ai/onex_change_control/.github/workflows/imperative-contract-guard.yml@main
    with:
      # OMN-13208: read allowlists from OCC dev (the live source of truth; main lags dev
      # by ~2400 commits and promotes governance artifacts in bulk). Matches omnimemory.
      onex-change-control-ref: dev
