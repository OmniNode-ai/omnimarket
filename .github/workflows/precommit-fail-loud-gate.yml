name: Precommit Fail-Loud Gate

# OMN-14666 (WS7 fan-out #2, canary OMN-14655 / omniclaude#1904); OMN-14668
# hardening. CI mirror of the two local pre-commit meta-gates over
# .pre-commit-config.yaml:
#
#   1. Fail-loud meta-gate — hard-rejects the exit-0-on-missing-path /
#      WARN-SKIP-degrade shape (a skipped gate must be byte-indistinguishable
#      from a failing gate), plus any hook `stages:` value that
#      `default_install_hook_types` does not install.
#   2. Pin-parity check — fails closed if the pre-commit `rev:` pin for a
#      shared omnibase_core validator diverges from the SHA
#      .github/workflows/ci.yml pins for that same validator (DRIFT-3).
#
# UNCONDITIONAL BY DESIGN (OMN-14668). This standalone workflow now matches the
# canonical parity-gate shape shipped to the other five repos, closing all three
# false-green vectors that the WS7 #2 (pre-lesson) version still carried:
#   * runs-on: ubuntu-latest — HOSTED-PINNED, unconditionally. The prior form
#     routed only public-fork PRs to hosted and left every trusted internal PR /
#     push on the self-hosted omnibase-ci fleet; a saturated or absent fleet
#     left this required check queued/cancelled = a false-green window in the
#     very gate meant to kill false-greens. The gate is short and
#     dependency-free (`uv run --no-project --with pyyaml` over local files), so
#     it must never depend on self-hosted availability.
#   * NO `needs:` — the prior `needs: occ-preflight` was the exact
#     skip-then-vacuous-green vector the OMN-14666 canary (omnimarket#1783)
#     surfaced: an occ-preflight failure SKIPPED the byte-match proof, and only a
#     manual rerun made it fire. OCC receipt eligibility is already enforced by
#     the independent `occ-preflight` job in ci.yml, so this coupling was
#     redundant as well as harmful. The gate now passes/fails purely on its own
#     byte-match evidence, never conditioned on another job's result.
#   * NO `paths:` filter — fires on EVERY PR to main/dev. A path-filtered
#     required check silently does not run (and may be treated as green) on PRs
#     that miss the filter; removing it closes that window.
#
# Enforcement, not detection (CLAUDE.md Rule #5): this workflow is wired as the
# CI counterpart of the precommit-fail-loud-meta-gate + precommit-pin-parity
# pre-commit hooks added in the SAME PR, so the checks it encodes cannot regress
# silently.

on:
  push:
    branches: [main, dev, 'hotfix/**']
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  precommit-fail-loud-gate:
    name: Precommit Fail-Loud Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.6.1"

      - name: Fail-loud meta-gate (exit-0-on-missing / stages coverage)
        working-directory: ${{ github.workspace }}
        run: |
          uv run --no-project --with pyyaml \
            python3 scripts/validation/validate_precommit_fail_loud.py

      - name: Pin-parity check (pre-commit rev vs CI-pinned SHA)
        working-directory: ${{ github.workspace }}
        run: |
          uv run --no-project --with pyyaml \
            python3 scripts/validation/validate_precommit_pin_parity.py
