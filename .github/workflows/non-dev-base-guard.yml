#
# OMN-13021 (retro A-6): Fail PRs whose base is neither dev nor main unless
# the body declares an intentional stack via `Stacked-Parent: #<pr-number>`.
#
# Failure class: feedback_stacked_prs_orphan_from_dev — PRs #1185/#1954 were
# auto-merged INTO parent feature branches, producing misleading MERGED states
# and stranding the work off dev (recurrence of the June 5 incident, 3 tickets
# stranded). Base=main is governed by main-target-guard (OMN-12243/OMN-12477).

name: Non-dev base guard

on:
  pull_request:
    types: [opened, edited, synchronize]

permissions:
  contents: read

jobs:
  occ-preflight:
    name: OCC Preflight Dependency
    runs-on: ubuntu-latest
    permissions:
      checks: read
      contents: read
    steps:
      - name: Wait for required OCC preflight
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -uo pipefail

          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "OCC preflight dependency is enforced by the pull_request gate; continuing for ${GITHUB_EVENT_NAME}."
            exit 0
          fi

          # OMN-14343: desynchronize the ~33 same-PR pollers (one per workflow file
          # -- GH Actions `needs:` can't cross workflow-file boundaries) so they
          # don't all hit the Checks API in the same instant every 10s and exhaust
          # the shared per-repo GitHub App installation rate-limit bucket.
          sleep "$(( RANDOM % 15 ))"

          backoff=5
          elapsed=0
          deadline=720

          while [ "$elapsed" -lt "$deadline" ]; do
            # NOTE(OMN-14343): GH Actions runs run: steps under `bash -e {0}` by
            # default -- that -e is already active before this script's own
            # `set -uo pipefail` runs, and `set -uo pipefail` does NOT clear an
            # inherited -e. A bare `response="$(gh api ...)"; status=$?` would
            # therefore abort the whole step on ANY gh api failure before status
            # is ever checked, silently defeating the retry logic below. Using
            # the command substitution as the condition of this `if` is the
            # errexit-safe form -- bash does not trigger -e for a command that is
            # part of an if/while/until condition, regardless of ambient -e state.
            response=""
            status=0
            if response="$(
              gh api "repos/${REPO}/commits/${HEAD_SHA}/check-runs?filter=latest&check_name=occ-preflight%20%2F%20eligibility&per_page=1" \
                --jq 'first(.check_runs[] | .conclusion) // ""' \
                2>&1
            )"; then
              status=0
            else
              status=$?
            fi

            if [ "$status" -ne 0 ]; then
              if echo "$response" | grep -qi "rate limit"; then
                echo "::warning::gh api rate-limited waiting for occ-preflight; backing off ${backoff}s."
                sleep "$backoff"
                elapsed=$((elapsed + backoff))
                backoff=$(( backoff * 2 < 60 ? backoff * 2 : 60 ))
                continue
              fi
              echo "::error::gh api call failed (non-rate-limit): ${response}"
              exit 1
            fi
            backoff=5

            conclusion="$response"

            case "$conclusion" in
              success)
                echo "OCC preflight passed for ${HEAD_SHA}."
                exit 0
                ;;
              failure|cancelled|timed_out|action_required|startup_failure)
                echo "::error::OCC preflight concluded ${conclusion}; refusing to start this workflow."
                exit 1
                ;;
              "")
                echo "Waiting for occ-preflight / eligibility to post for ${HEAD_SHA}..."
                ;;
              *)
                echo "OCC preflight is ${conclusion}; waiting."
                ;;
            esac

            sleep 10
            elapsed=$((elapsed + 10))
          done

          echo "::error::Timed out waiting for occ-preflight / eligibility on ${HEAD_SHA}."
          exit 1
  non-dev-base-guard:
    needs: occ-preflight
    name: non-dev-base-guard
    runs-on: >-
      ${{
        (github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    timeout-minutes: 5

    steps:
      - name: Check PR base branch
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail

          if [[ "${BASE_REF}" == "dev" ]]; then
            echo "::notice::PR targets dev; guard does not apply."
            exit 0
          fi

          if [[ "${BASE_REF}" == "main" ]]; then
            echo "::notice::PR targets main; main-target-guard governs that path."
            exit 0
          fi

          echo "PR targets feature base '${BASE_REF}' from head '${HEAD_REF}'."

          if echo "${PR_BODY}" | grep -qE 'Stacked-Parent:[[:space:]]*#[0-9]+'; then
            echo "::notice::Declared stacked PR (Stacked-Parent found). Allowed."
            echo "::warning::Stacked PRs merge INTO their parent branch, not dev."
            echo "::warning::Do NOT arm auto-merge on this PR; land the parent into dev first."
            exit 0
          fi

          echo "::error::PR base '${BASE_REF}' is not the integration branch (dev)."
          echo "::error::Auto-merge on this PR would fold it INTO '${BASE_REF}' and strand it off dev"
          echo "::error::(feedback_stacked_prs_orphan_from_dev — the #1185/#1954 incident class)."
          echo "::error::Either retarget to dev, or declare an intentional stack by adding a body line:"
          echo "::error::  Stacked-Parent: #<parent-pr-number>"
          exit 1
