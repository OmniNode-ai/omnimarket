#
# OMN-13663 (T4, epic OMN-13659): projection exposure⇄column drift gate —
# BLOCKING MODE.
#
# Every projection node contract.yaml's projection_api.exposures must be
# reconciled against the materialized columns of the table/view each exposure
# reads from. The materialized columns are extracted from the node's own
# migration DDL (CREATE TABLE / ALTER TABLE ... ADD COLUMN / CREATE [OR REPLACE]
# VIEW). This gate fails on:
#
#   - EXISTENCE drift (always blocking, not allowlistable): an exposure references
#     a column its table/view does not materialize. A phantom column makes the
#     projection query fail at runtime. Fix the exposure column list or the
#     migration DDL.
#
#   - OMISSION drift (enforced via --fail-on-omission): a materialized
#     identity/tier/cost column (cost_tier, tier, *_id, correlation_id, cost_*,
#     savings_*, tokens_*) surfaced by NO exposure. This is the cost_tier_name
#     class of bug (OMN-13649): delegation_events.cost_tier_name existed in DDL
#     (migration 0018) but was omitted from the decisions.v1 exposure column list,
#     so the tier silently dropped at the projection boundary and the UI fell back
#     to a regex. Existing intentional omissions are grandfathered as an annotated
#     ratchet baseline in .projection-exposure-allowlist.yaml; a NEW unannotated
#     omission of such a column blocks merge.
#
# The validator ships in omnibase_core (the canonical validator repo) and is
# installed here via a pinned git dependency — the same cross-repo pattern used by
# the Canonical Inference Gate and URL Authority Gate. Re-pin the @<sha> to the
# merged-dev SHA once omnibase_core#1350 lands.
#
# This job is a REQUIRED STATUS CHECK. The job name "Projection Exposure Drift
# Gate" must match branch protection rules.

name: Projection Exposure Drift Gate

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [main, dev]
  merge_group:

permissions:
  contents: read

jobs:
  occ-preflight:
    name: OCC Preflight Dependency
    runs-on: ubuntu-latest
    permissions:
      checks: read
      contents: read
    steps:
      - name: Wait for required OCC preflight
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -uo pipefail

          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "OCC preflight dependency is enforced by the pull_request gate; continuing for ${GITHUB_EVENT_NAME}."
            exit 0
          fi

          # OMN-14343: desynchronize the ~33 same-PR pollers (one per workflow file
          # -- GH Actions `needs:` can't cross workflow-file boundaries) so they
          # don't all hit the Checks API in the same instant every 10s and exhaust
          # the shared per-repo GitHub App installation rate-limit bucket.
          sleep "$(( RANDOM % 15 ))"

          backoff=5
          elapsed=0
          deadline=720

          while [ "$elapsed" -lt "$deadline" ]; do
            # NOTE(OMN-14343): GH Actions runs run: steps under `bash -e {0}` by
            # default -- that -e is already active before this script's own
            # `set -uo pipefail` runs, and `set -uo pipefail` does NOT clear an
            # inherited -e. A bare `response="$(gh api ...)"; status=$?` would
            # therefore abort the whole step on ANY gh api failure before status
            # is ever checked, silently defeating the retry logic below. Using
            # the command substitution as the condition of this `if` is the
            # errexit-safe form -- bash does not trigger -e for a command that is
            # part of an if/while/until condition, regardless of ambient -e state.
            response=""
            status=0
            for page in $(seq 1 5); do
              if page_response="$(
                gh api "repos/${REPO}/commits/${HEAD_SHA}/check-runs?filter=latest&per_page=100&page=${page}" \
                  --jq 'first(.check_runs[] | select(.name == "occ-preflight / eligibility") | .conclusion) // ""' \
                  2>&1
              )"; then
                status=0
                if [ -n "$page_response" ]; then
                  response="$page_response"
                  break
                fi
              else
                status=$?
                response="$page_response"
                break
              fi
            done

            if [ "$status" -ne 0 ]; then
              if echo "$response" | grep -qi "rate limit"; then
                echo "::warning::gh api rate-limited waiting for occ-preflight; backing off ${backoff}s."
                sleep "$backoff"
                elapsed=$((elapsed + backoff))
                backoff=$(( backoff * 2 < 60 ? backoff * 2 : 60 ))
                continue
              fi
              echo "::error::gh api call failed (non-rate-limit): ${response}"
              exit 1
            fi
            backoff=5

            conclusion="$response"

            case "$conclusion" in
              success)
                echo "OCC preflight passed for ${HEAD_SHA}."
                exit 0
                ;;
              failure|cancelled|timed_out|action_required|startup_failure)
                echo "::error::OCC preflight concluded ${conclusion}; refusing to start this workflow."
                exit 1
                ;;
              "")
                echo "Waiting for occ-preflight / eligibility to post for ${HEAD_SHA}..."
                ;;
              *)
                echo "OCC preflight is ${conclusion}; waiting."
                ;;
            esac

            sleep 10
            elapsed=$((elapsed + 10))
          done

          echo "::error::Timed out waiting for occ-preflight / eligibility on ${HEAD_SHA}."
          exit 1
  projection-exposure-drift-gate:
    needs: occ-preflight
    name: Projection Exposure Drift Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Run projection exposure⇄column drift gate (full src tree, fail-on-omission)
        run: |
          uv run --with "omnibase-core @ git+https://github.com/OmniNode-ai/omnibase_core.git@0c69dff015b6f83365d4b0247d8b3230516276ae" \
            python -m omnibase_core.validators.projection_exposure_drift \
            src \
            --fail-on-omission \
            --allowlist .projection-exposure-allowlist.yaml
