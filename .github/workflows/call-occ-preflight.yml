#
# OCC Preflight caller — gates auto-merge and the CI Summary rollup on OCC
# eligibility. (OMN-10485 / OMN-10482 epic; required-everywhere wiring:
# OMN-13332; thin-caller migration: OMN-14226)
#
# This workflow wires the reusable occ-preflight check (hosted in omnibase_core)
# as the canonical cross-repo OCC eligibility gate. Every auto-merging repo
# follows the same pattern: a `call-occ-preflight.yml` that delegates to the
# reusable.
#
# Why this file was rewritten (OMN-14226): omnimarket previously reimplemented
# the eligibility logic inline. That standalone body read the PR body from the
# frozen triggering-event payload (`github.event.pull_request.body`), so a body
# corrected AFTER the event fired kept failing until a manual rerun. The
# reusable resolves the PR body LIVE (`gh pr view`, event-payload fallback only
# if that fails), which removes those stale-event-body rerun waves.
#
# Required status check name: "occ-preflight / eligibility"
#   The caller job id `occ-preflight` composed with the reusable's `eligibility`
#   job yields the check-run name `occ-preflight / eligibility`. Many omnimarket
#   workflows poll for a check-run with that exact name and gate on it via
#   `needs:`, and ci.yml's required "CI Summary" rollup depends on it. Do NOT
#   rename this job or add a `name:` — either would change the surfaced context
#   and wedge the entire CI matrix.
#
# Trigger note: the omnibase_core/omniclaude callers also fire on `merge_group`,
# but omnimarket's dev branch has no merge queue configured, so merge_group is
# intentionally omitted here (it would never fire). `edited` is retained so the
# OCC autobind emitter's `Evidence-Source: OCC#<n>` PATCH re-fires eligibility
# immediately (OMN-13990 D2 self-heal) instead of waiting for an unrelated push.
#
# Invariants enforced by the reusable workflow (do NOT modify here):
#   I2: merge_group events re-run eligibility fully (cache disabled in reusable).
#   I3: OCC's own PRs validate against in-tree checkout (handled inside reusable).
#   I4: OCC fetch failure is a hard FAIL.

name: OCC Preflight

on:
  pull_request:
    branches: [main, dev, "hotfix/**"]
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  occ-preflight:
    # self-gating-ok: centralized OCC preflight reusable is the canonical cross-repo gate for non-OCC repositories.
    uses: OmniNode-ai/omnibase_core/.github/workflows/occ-preflight.yml@main
    with:
      contracts-dir: contracts
      receipts-dir: drift/dod_receipts
