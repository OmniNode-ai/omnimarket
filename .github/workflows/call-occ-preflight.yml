#
# OCC Preflight caller — gates auto-merge and the CI Summary rollup on OCC
# eligibility. (OMN-10485 / OMN-10482 epic; required-everywhere wiring:
# OMN-13332; thin-caller migration: OMN-14226)
#
# This workflow wires the reusable occ-preflight check (hosted in omnibase_core)
# as the canonical cross-repo OCC eligibility gate. Every auto-merging repo
# follows the same pattern: a `call-occ-preflight.yml` that delegates to the
# reusable.
#
# Why this file was rewritten (OMN-14226): omnimarket previously reimplemented
# the eligibility logic inline. That standalone body read the PR body from the
# frozen triggering-event payload (`github.event.pull_request.body`), so a body
# corrected AFTER the event fired kept failing until a manual rerun. The
# reusable resolves the PR body LIVE (`gh pr view`, event-payload fallback only
# if that fails), which removes those stale-event-body rerun waves.
#
# Required status check name: "occ-preflight / eligibility"
#   The caller job id `occ-preflight` composed with the reusable's `eligibility`
#   job yields the check-run name `occ-preflight / eligibility`. Many omnimarket
#   workflows poll for a check-run with that exact name and gate on it via
#   `needs:`, and ci.yml's required "CI Summary" rollup depends on it. Do NOT
#   rename this job or add a `name:` — either would change the surfaced context
#   and wedge the entire CI matrix.
#
# Trigger note: the omnibase_core/omniclaude callers also fire on `merge_group`,
# but omnimarket's dev branch has no merge queue configured, so merge_group is
# intentionally omitted here (it would never fire). `edited` is retained so the
# OCC autobind emitter's `Evidence-Source: OCC#<n>` PATCH re-fires eligibility
# immediately (OMN-13990 D2 self-heal) instead of waiting for an unrelated push.
#
# Invariants enforced by the reusable workflow (do NOT modify here):
#   I2: merge_group events re-run eligibility fully (cache disabled in reusable).
#   I3: OCC's own PRs validate against in-tree checkout (handled inside reusable).
#   I4: OCC fetch failure is a hard FAIL.

name: OCC Preflight

on:
  pull_request:
    branches: [main, dev, "hotfix/**"]
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  occ-preflight:
    # self-gating-ok: centralized OCC preflight reusable is the canonical cross-repo gate for non-OCC repositories.
    #
    # OMN-18647 CANARY PIN. This repository is the single caller running the
    # terminal-decline fast exit, on the operator's in-session ruling of
    # 2026-09-20 that the change reach one repository before the fleet
    # (RULING row, omni_home docs/tracking/ROLLING_WORK_LEDGER.md:2682).
    #
    # Two things make this exactly one caller, and both are needed:
    #
    #   * the SHA pin below. The other callers take this reusable at a
    #     literal @main and omnibase_core's main is release-synced, so they
    #     keep running the workflow file from the last release cut. The new
    #     input does not exist there, so they could not set it even by
    #     mistake.
    #   * the input itself, which defaults to false. When a release cut does
    #     advance main, the fleet still gets today's behaviour until someone
    #     decides otherwise. The default is the durable half of the scoping;
    #     the pin is the half that expires.
    #
    # The SCRIPT is a separate question and is NOT pinned: it is checked out
    # at core-ref, which defaults to dev, so every caller already runs the
    # new occ_preflight_wait.py. That is safe precisely because the new
    # behaviour is inert without the input, and it is why the pin alone
    # would not have been enough.
    #
    # REMOVAL IS TRACKED: OMN-18884 deletes this pin, the input and the
    # script flag together once the canary readback holds and the operator
    # gives the second go. Do not quietly advance this pin to @main as part
    # of unrelated maintenance -- that is the fleet propagation, and it needs
    # that ticket and that go.
    uses: OmniNode-ai/omnibase_core/.github/workflows/occ-preflight.yml@a9f2bb87841cc86a0c813b62b29fb5458cdac7e6
    with:
      contracts-dir: contracts
      receipts-dir: drift/dod_receipts
      terminal-decline-fast-exit: true

  # WS3 (OMN-14646) — representative "OCC Preflight Dependency" poller migrated
  # to the reusable Governance Readiness orchestrator. REPORT-ONLY shadow: it
  # consumes the occ-preflight job result and maps it to a typed reason code,
  # WITHOUT touching the required `occ-preflight / eligibility` context above and
  # WITHOUT being added to branch-protection required_status_checks. Its surfaced
  # context is `governance-readiness / evaluate` (not required).
  #
  # This shadow is scoped to the OCC dimension only. The product / receipt /
  # deploy inputs are documented placeholders (`success`): the authoritative
  # product signal remains the required `CI Summary` rollup and the authoritative
  # receipt signal remains `receipt-gate / verify`. Wiring the orchestrator to
  # consume all four dimensions together (and the remaining ~24 pollers) is the
  # mechanical migration checklist in the PR body — deliberately out of this PR.
  governance-readiness:
    needs: [occ-preflight]
    if: always()
    uses: ./.github/workflows/governance-readiness.yml
    with:
      product_conclusion: success
      occ_conclusion: ${{ needs.occ-preflight.result }}
      receipt_conclusion: success
      deploy_conclusion: success
      report_only: true
