# SPDX-License-Identifier: MIT
#
# Market Node Drift Gate (OMN-9725)
#
# Validates that every new or modified node directory is correctly wired before
# merge. Checks:
#   1. contract.yaml exists
#   2. contract.yaml has required fields (name, node_type, handler for classic types)
#   3. Node is registered in pyproject.toml [project.entry-points."onex.nodes"]
#   4. Declared subscribe topics appear in handler source (best-effort WARN)
#   5. Event-bus contracts declare both producer and consumer sides unless
#      explicitly annotated experimental/deprecated.
#
# Pre-existing violations on main (as of 2026-04-25) are catalogued in
# scripts/validate_node_drift.py::KNOWN_MAIN_VIOLATIONS and produce WARN,
# not FAIL. Nodes that are *modified* in a PR trigger --strict mode, which
# promotes WARN→FAIL for the touched nodes.

name: node-drift-gate

on:
  # No paths filter: as of OMN-12693 (#1044) the job runs `--check-all
  # --check-orphan-nodes --strict` on every event, so it must report a status on
  # every PR to main/dev — otherwise a required `node-drift-gate` check stays
  # permanently "expected" on PRs that touch neither src/omnimarket/nodes/** nor
  # pyproject.toml (e.g. test-only PRs), blocking the merge queue. (OMN-12706)
  pull_request:
    branches: [main, dev]
  merge_group:
  workflow_dispatch:

concurrency:
  group: node-drift-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  occ-preflight:
    name: OCC Preflight Dependency
    runs-on: ubuntu-latest
    permissions:
      checks: read
      contents: read
    steps:
      - name: Wait for required OCC preflight
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -uo pipefail

          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "OCC preflight dependency is enforced by the pull_request gate; continuing for ${GITHUB_EVENT_NAME}."
            exit 0
          fi

          # OMN-14343: desynchronize the ~33 same-PR pollers (one per workflow file
          # -- GH Actions `needs:` can't cross workflow-file boundaries) so they
          # don't all hit the Checks API in the same instant every 10s and exhaust
          # the shared per-repo GitHub App installation rate-limit bucket.
          sleep "$(( RANDOM % 15 ))"

          backoff=5
          elapsed=0
          deadline=720

          while [ "$elapsed" -lt "$deadline" ]; do
            # NOTE(OMN-14343): GH Actions runs run: steps under `bash -e {0}` by
            # default -- that -e is already active before this script's own
            # `set -uo pipefail` runs, and `set -uo pipefail` does NOT clear an
            # inherited -e. A bare `response="$(gh api ...)"; status=$?` would
            # therefore abort the whole step on ANY gh api failure before status
            # is ever checked, silently defeating the retry logic below. Using
            # the command substitution as the condition of this `if` is the
            # errexit-safe form -- bash does not trigger -e for a command that is
            # part of an if/while/until condition, regardless of ambient -e state.
            response=""
            status=0
            for page in $(seq 1 5); do
              if page_response="$(
                gh api "repos/${REPO}/commits/${HEAD_SHA}/check-runs?filter=latest&per_page=100&page=${page}" \
                  --jq 'first(.check_runs[] | select(.name == "occ-preflight / eligibility") | .conclusion) // ""' \
                  2>&1
              )"; then
                status=0
                if [ -n "$page_response" ]; then
                  response="$page_response"
                  break
                fi
              else
                status=$?
                response="$page_response"
                break
              fi
            done

            if [ "$status" -ne 0 ]; then
              if echo "$response" | grep -qi "rate limit"; then
                echo "::warning::gh api rate-limited waiting for occ-preflight; backing off ${backoff}s."
                sleep "$backoff"
                elapsed=$((elapsed + backoff))
                backoff=$(( backoff * 2 < 60 ? backoff * 2 : 60 ))
                continue
              fi
              echo "::error::gh api call failed (non-rate-limit): ${response}"
              exit 1
            fi
            backoff=5

            conclusion="$response"

            case "$conclusion" in
              success)
                echo "OCC preflight passed for ${HEAD_SHA}."
                exit 0
                ;;
              failure|cancelled|timed_out|action_required|startup_failure)
                echo "::error::OCC preflight concluded ${conclusion}; refusing to start this workflow."
                exit 1
                ;;
              "")
                echo "Waiting for occ-preflight / eligibility to post for ${HEAD_SHA}..."
                ;;
              *)
                echo "OCC preflight is ${conclusion}; waiting."
                ;;
            esac

            sleep 10
            elapsed=$((elapsed + 10))
          done

          echo "::error::Timed out waiting for occ-preflight / eligibility on ${HEAD_SHA}."
          exit 1
  node-drift-gate:
    needs: occ-preflight
    name: node-drift-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone omnibase_core
        run: git clone --depth=1 https://github.com/OmniNode-ai/omnibase_core.git ../omnibase_core

      - name: Clone omnibase_compat
        run: git clone --depth=1 https://github.com/OmniNode-ai/omnibase_compat.git ../omnibase_compat

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Run node drift gate (all nodes, strict)
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "merge_group" ]]; then
            echo "::notice::merge_group event — running full strict check."
            uv run python scripts/validate_node_drift.py --check-all --check-orphan-nodes --strict
          else
            echo "Validating all nodes (strict mode) against contract liveness..."
            uv run python scripts/validate_node_drift.py --check-all --check-orphan-nodes --strict
          fi
