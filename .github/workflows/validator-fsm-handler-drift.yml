---
# FSM Handler Drift Guard — omnimarket consumer gate (OMN-13735)
#
# Scans omnimarket's src/ for contracts with fsm_handler_binding and validates
# that each declared handler's VALID_TRANSITIONS + GUARD_CONDITIONS match the
# contract's state_machine.transitions exactly. Zero allowlist entries.
#
# Required status check context: "fsm-handler-drift".
#
# This workflow:
#   1. Installs omnibase_core from the PR SHA so new validator code is available.
#   2. Runs the fsm-handler-drift integration tests (TDD: divergence fixture, aligned
#      fixture, real node_intelligence_reducer positive test).
#   3. Runs the validator directly on omnimarket src/ to confirm zero findings.
#
# When the omnibase_core PR lands, the pin-bump PR will update the rev below.
# Until then, the workflow installs from the pinned rev that carries the validator.

name: FSM Handler Drift Guard

on:
  push:
    branches: [main, develop, dev, "hotfix/**"]
  pull_request:
    branches: [main, develop, dev]

env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.8.3"

concurrency:
  group: fsm-handler-drift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  occ-preflight:
    name: OCC Preflight Dependency
    runs-on: ubuntu-latest
    permissions:
      checks: read
      contents: read
    steps:
      - name: Wait for required OCC preflight
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -uo pipefail

          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "OCC preflight dependency is enforced by the pull_request gate; continuing for ${GITHUB_EVENT_NAME}."
            exit 0
          fi

          # OMN-14343: desynchronize the ~33 same-PR pollers (one per workflow file
          # -- GH Actions `needs:` can't cross workflow-file boundaries) so they
          # don't all hit the Checks API in the same instant every 10s and exhaust
          # the shared per-repo GitHub App installation rate-limit bucket.
          sleep "$(( RANDOM % 15 ))"

          backoff=5
          elapsed=0
          deadline=720

          while [ "$elapsed" -lt "$deadline" ]; do
            # NOTE(OMN-14343): GH Actions runs run: steps under `bash -e {0}` by
            # default -- that -e is already active before this script's own
            # `set -uo pipefail` runs, and `set -uo pipefail` does NOT clear an
            # inherited -e. A bare `response="$(gh api ...)"; status=$?` would
            # therefore abort the whole step on ANY gh api failure before status
            # is ever checked, silently defeating the retry logic below. Using
            # the command substitution as the condition of this `if` is the
            # errexit-safe form -- bash does not trigger -e for a command that is
            # part of an if/while/until condition, regardless of ambient -e state.
            response=""
            status=0
            for page in $(seq 1 5); do
              if page_response="$(
                gh api "repos/${REPO}/commits/${HEAD_SHA}/check-runs?filter=latest&per_page=100&page=${page}" \
                  --jq 'first(.check_runs[] | select(.name == "occ-preflight / eligibility") | .conclusion) // ""' \
                  2>&1
              )"; then
                status=0
                if [ -n "$page_response" ]; then
                  response="$page_response"
                  break
                fi
              else
                status=$?
                response="$page_response"
                break
              fi
            done

            if [ "$status" -ne 0 ]; then
              if echo "$response" | grep -qi "rate limit"; then
                echo "::warning::gh api rate-limited waiting for occ-preflight; backing off ${backoff}s."
                sleep "$backoff"
                elapsed=$((elapsed + backoff))
                backoff=$(( backoff * 2 < 60 ? backoff * 2 : 60 ))
                continue
              fi
              echo "::error::gh api call failed (non-rate-limit): ${response}"
              exit 1
            fi
            backoff=5

            conclusion="$response"

            case "$conclusion" in
              success)
                echo "OCC preflight passed for ${HEAD_SHA}."
                exit 0
                ;;
              failure|cancelled|timed_out|action_required|startup_failure)
                echo "::error::OCC preflight concluded ${conclusion}; refusing to start this workflow."
                exit 1
                ;;
              "")
                echo "Waiting for occ-preflight / eligibility to post for ${HEAD_SHA}..."
                ;;
              *)
                echo "OCC preflight is ${conclusion}; waiting."
                ;;
            esac

            sleep 10
            elapsed=$((elapsed + 10))
          done

          echo "::error::Timed out waiting for occ-preflight / eligibility on ${HEAD_SHA}."
          exit 1
  fsm-handler-drift:
    needs: occ-preflight
    name: fsm-handler-drift
    # OMNI_RUNNER_SELECTOR_V1 - trusted events default to self-hosted omnibase-ci; pull_request defaults to ubuntu-latest
    runs-on: >-
      ${{
        github.event_name != 'pull_request'
        && fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
        || fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
      }}
    timeout-minutes: 10

    steps:
      - name: Checkout omnimarket
        uses: actions/checkout@v7

      # OMN-13735: the validator landed on omnibase_core dev in #1360.
      - name: Clone omnibase_core (for new validator)
        run: git clone --depth=1 --branch dev https://github.com/OmniNode-ai/omnibase_core.git ../omnibase_core

      - name: Clone omnibase_compat
        run: git clone --depth=1 https://github.com/OmniNode-ai/omnibase_compat.git ../omnibase_compat

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install omnimarket
        run: uv sync --all-extras

      - name: Install omnibase_compat
        run: uv pip install --python .venv/bin/python -e ../omnibase_compat

      - name: Install omnibase_core (includes check-fsm-handler-drift validator)
        run: uv pip install --python .venv/bin/python --force-reinstall --no-deps -e ../omnibase_core

      - name: Run fsm-handler-drift integration tests
        run: |
          PYTHONPATH="../omnibase_core/src${PYTHONPATH:+:$PYTHONPATH}" uv run --no-sync pytest \
            tests/validators/test_fsm_handler_drift_integration.py \
            -v

      - name: Scan omnimarket src/ for FSM handler drift (must exit 0)
        run: PYTHONPATH="../omnibase_core/src${PYTHONPATH:+:$PYTHONPATH}" uv run --no-sync python -m omnibase_core.validators.fsm_handler_drift src/
