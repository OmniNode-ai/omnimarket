name: CR Thread Gate
# Reusable workflow — call via:
#   uses: OmniNode-ai/omniclaude/.github/workflows/cr-thread-gate.yml@main
# Required status check string: "gate / CodeRabbit Thread Check"
# (produced by callers whose job key is named 'gate:' and uses this workflow)
on:
  workflow_call:
    secrets:
      CROSS_REPO_PAT:
        description: "GitHub PAT with read:discussion scope for CR thread queries"
        required: false
      github-token:
        description: "Deprecated: pass CROSS_REPO_PAT instead"
        required: false
    inputs:
      repo:
        description: "Target repo name (owner/repo or bare name). Defaults to caller's github.repository."
        required: false
        type: string
        default: ""
      pr-number:
        description: "Pull request number to check. Pass '0' or empty to skip (merge_group context)."
        required: false
        type: string
        default: ""

jobs:
  occ-preflight:
    name: OCC Preflight Dependency
    runs-on: ubuntu-latest
    permissions:
      checks: read
      contents: read
    steps:
      - name: Wait for required OCC preflight
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "OCC preflight dependency is enforced by the pull_request gate; continuing for ${GITHUB_EVENT_NAME}."
            exit 0
          fi

          for _ in $(seq 1 60); do
            conclusion="$(
              gh api "repos/${REPO}/commits/${HEAD_SHA}/check-runs?filter=latest&per_page=100" \
                --jq 'first(.check_runs[] | select(.name == "occ-preflight / eligibility") | .conclusion) // ""'
            )"

            case "$conclusion" in
              success)
                echo "OCC preflight passed for ${HEAD_SHA}."
                exit 0
                ;;
              failure|cancelled|timed_out|action_required|startup_failure)
                echo "::error::OCC preflight concluded ${conclusion}; refusing to start this workflow."
                exit 1
                ;;
              "")
                echo "Waiting for occ-preflight / eligibility to post for ${HEAD_SHA}..."
                ;;
              *)
                echo "OCC preflight is ${conclusion}; waiting."
                ;;
            esac
            sleep 10
          done

          echo "::error::Timed out waiting for occ-preflight / eligibility on ${HEAD_SHA}."
          exit 1

  gate:
    needs: occ-preflight
    name: CodeRabbit Thread Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout omniclaude scripts
        uses: actions/checkout@v4
        with:
          repository: OmniNode-ai/omniclaude
          ref: main
          sparse-checkout: scripts/check-unresolved-threads.sh
          sparse-checkout-cone-mode: false

      - name: Resolve repo name
        id: resolve-repo
        run: |
          TARGET="${{ inputs.repo }}"
          [ -z "$TARGET" ] && TARGET="${{ github.repository }}"
          # Support both "owner/repo" and bare "repo"
          if [[ "$TARGET" == */* ]]; then
            OWNER="${TARGET%%/*}"
            REPO="${TARGET##*/}"
          else
            OWNER="${{ github.repository_owner }}"
            REPO="$TARGET"
          fi
          echo "owner=$OWNER" >> "$GITHUB_OUTPUT"
          echo "repo=$REPO" >> "$GITHUB_OUTPUT"

      - name: Resolve PR number
        id: resolve-pr
        run: |
          PR="${{ inputs.pr-number }}"
          if [ -z "$PR" ]; then
            PR="${{ github.event.pull_request.number }}"
          fi
          if [ -z "$PR" ]; then
            PR="${{ github.event.issue.number }}"
          fi
          echo "pr=$PR" >> "$GITHUB_OUTPUT"

      - name: Check unresolved CodeRabbit threads
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_PAT || secrets.github-token || secrets.GITHUB_TOKEN }}
        run: |
          PR="${{ steps.resolve-pr.outputs.pr }}"
          if [ -z "$PR" ] || [ "$PR" = "0" ]; then
            echo "No PR number — skipping (merge_group context)."
            exit 0
          fi
          chmod +x scripts/check-unresolved-threads.sh
          COUNT=$(bash scripts/check-unresolved-threads.sh \
            "${{ steps.resolve-repo.outputs.owner }}" \
            "${{ steps.resolve-repo.outputs.repo }}" \
            "$PR")
          echo "Unresolved CodeRabbit threads: $COUNT"
          if [ "$COUNT" -gt 0 ]; then
            echo "::error::$COUNT unresolved CodeRabbit thread(s). Resolve all CR threads before merging."
            exit 1
          fi
          echo "All CodeRabbit threads resolved."
