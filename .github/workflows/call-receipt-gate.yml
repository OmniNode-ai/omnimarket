#
# Caller workflow: invokes the reusable receipt-gate on every PR targeting main.
#
# Receipt-gate (omnibase_core) enforces "Enforcement by Receipt" (OMN-10412):
# every PR must cite a Linear ticket whose dod_evidence items all have PASS
# ModelDodReceipt artifacts in onex_change_control. Missing or failing receipts
# block merge.
#
# Required-status-check name: `verify / verify`

name: Receipt Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main, dev]
  merge_group:

permissions:
  contents: read
  pull-requests: read

jobs:
  verify:
    uses: OmniNode-ai/omnibase_core/.github/workflows/receipt-gate.yml@a03b10720db364575b0477003da95b46de765950 # OMN-19149: immutable SHA pin, advanced from 76532c20 (0.47.19). Provenance: the squash commit of omnibase_core#1736 on that repo's dev branch, which closes the OMN-19050 FAIL-supersede latch -- at 76532c20 the resolver's supersede-suffix pattern excludes a dot, so an attempt-scoped record is invisible to it rather than outranked, and omnimarket#2751 was blocked on a key whose merged companion already carried a PASS. NO PUBLISHED RELEASE CONTAINS THIS FIX: v0.47.20 is the latest, tagged 3afa3528 on 2026-09-20, and the fix merged 2026-09-21, so this pins the merge sha and should be re-pointed at the first release that carries it. Blast radius, measured: .github/workflows/receipt-gate.yml is BYTE-IDENTICAL across the move (blob cb0c2b547e34d664644b3faa08758ef44d245576 at both shas), so the gate's own shape does not change; the validation surface moves 18 files, and the two gate-relevant validators besides the resolver, validator_occ_append_only.py and validator_receipt_diff_consistency.py, both come from one commit, omnibase_core#1730 (OMN-18996). A 40-hex pin remains the intended long-term form here, not a placeholder for a branch ref: it is immutable, so the gate this repo runs cannot change under it without a reviewed edit to this line
