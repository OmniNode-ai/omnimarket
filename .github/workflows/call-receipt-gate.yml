#
# Caller workflow: invokes the reusable receipt-gate on every PR targeting main.
#
# Receipt-gate (omnibase_core) enforces "Enforcement by Receipt" (OMN-10412):
# every PR must cite a Linear ticket whose dod_evidence items all have PASS
# ModelDodReceipt artifacts in onex_change_control. Missing or failing receipts
# block merge.
#
# Required-status-check name: `verify / verify`

name: Receipt Gate

on:
  pull_request:
    # OMN-19512: ready_for_review re-runs the gate on the draft flip, so a
    # draft-era red (companion declined while the PR is a draft) is refreshed.
    types: [opened, synchronize, reopened, edited, ready_for_review]
    branches: [main, dev]
  merge_group:

# OMN-19643: cancel only superseded pull request runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


permissions:
  contents: read
  pull-requests: read

jobs:
  verify:
    uses: OmniNode-ai/omnibase_core/.github/workflows/receipt-gate.yml@52851458622f368c3b596c82bf810bc6acce1d5e # OMN-20161: immutable SHA pin, the squash commit of omnibase_core#1820 on that repo's dev branch. It carries the OCC writer app pin-only exemption and still carries the inner validator ref past ModelDodReceipt.tree_sha (omnibase_core#1814, OMN-20132). A 40-hex pin is the intended long-term form. NO PUBLISHED RELEASE CONTAINS THIS: re-point at the first release that carries omnibase_core#1820
