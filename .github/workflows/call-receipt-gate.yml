#
# Caller workflow: invokes the reusable receipt-gate on every PR targeting main.
#
# Receipt-gate (omnibase_core) enforces "Enforcement by Receipt" (OMN-10412):
# every PR must cite a Linear ticket whose dod_evidence items all have PASS
# ModelDodReceipt artifacts in onex_change_control. Missing or failing receipts
# block merge.
#
# Required-status-check name: `verify / verify`

name: Receipt Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main, dev]
  merge_group:

permissions:
  contents: read
  pull-requests: read

jobs:
  verify:
    uses: OmniNode-ai/omnibase_core/.github/workflows/receipt-gate.yml@76532c203a2dccd5f928fba6657d5dd5ff3bdf10 # OMN-18882: immutable SHA pin, advanced from b97e20e2. Provenance: the squash commit of omnibase_core#1723 on that repo's dev branch, which adds the dependency-pin-only exemption to the Receipt Gate; verified by reading .github/workflows/receipt-gate.yml at this exact SHA. A 40-hex pin is the intended long-term form here, not a placeholder for a branch ref: it is immutable, so the gate this repo runs cannot change under it without a reviewed edit to this line
