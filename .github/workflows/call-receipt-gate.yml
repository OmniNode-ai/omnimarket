#
# Caller workflow: invokes the reusable receipt-gate on every PR targeting main.
#
# Receipt-gate (omnibase_core) enforces "Enforcement by Receipt" (OMN-10412):
# every PR must cite a Linear ticket whose dod_evidence items all have PASS
# ModelDodReceipt artifacts in onex_change_control. Missing or failing receipts
# block merge.
#
# Required-status-check name: `verify / verify`

name: Receipt Gate

on:
  pull_request:
    # OMN-19512: ready_for_review re-runs the gate on the draft flip, so a
    # draft-era red (companion declined while the PR is a draft) is refreshed.
    types: [opened, synchronize, reopened, edited, ready_for_review]
    branches: [main, dev]
  merge_group:

# OMN-19643: cancel only superseded pull request runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


permissions:
  contents: read
  pull-requests: read

jobs:
  verify:
    uses: OmniNode-ai/omnibase_core/.github/workflows/receipt-gate.yml@9cc9f035465266442df542d345cde621c9c3b0d5 # OMN-19149: immutable SHA pin, advanced from a03b1072. Provenance: the squash commit of omnibase_core#1740 on that repo's dev branch. a03b1072 was the right VALIDATOR but the wrong thing to pin here: this line selects which copy of receipt-gate.yml runs, and that file carries a SECOND, separate hardcoded ref supplying the validator SOURCE, which at a03b1072 still read 37bd8519 (2026-08-24). Advancing this line alone was therefore inert -- proven live on omnimarket#2751, whose gate log shows it checking out omnibase_core at 37bd8519 after this pin had already been moved. omnibase_core#1740 advances that inner ref to a03b1072, so 9cc9f035 is the first sha at which the OMN-19050 supersede-latch fix is actually in force on this repository's gate. At 37bd8519 the supersede-suffix pattern excludes a dot, so an attempt-scoped record is invisible to the resolver rather than outranked. NO PUBLISHED RELEASE CONTAINS THIS: re-point at the first release that carries omnibase_core#1740. A 40-hex pin remains the intended long-term form here, not a placeholder for a branch ref: it is immutable, so the gate this repo runs cannot change under it without a reviewed edit to this line
