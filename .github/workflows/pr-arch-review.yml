---
# pr-arch-review.yml
#
# Automatic architectural PR review on every pull request.
#
# Single-phase static architectural lint (arch-lint) — pattern checks that need
# no model and always run. Catches:
#   - Hardcoded Kafka topic strings in handler code
#   - Manual handler wiring that bypasses the DI container
#   - Reinvented DI patterns outside the contract system
#   - event_bus=None bypass
#   - Direct handler instantiation outside workflow_runner / WorkflowPackage entry points
#
# History: a second "pr-review-bot" FSM phase (node_pr_review_bot.workflow_runner)
# once ran here and in the standalone pr-review-bot.yml workflow. Both were removed
# in OMN-14176 — the node_pr_review_bot module tree was deleted in OMN-13212, so the
# jobs no-op'd (skipped_no_review_models) and reported a false CLEAN, and neither was
# a required status check. The workflow-module-resolution guard
# (scripts/ci/check_workflow_module_refs.py) now blocks any workflow that imports a
# deleted omnimarket module, so this class of dead reference cannot silently return.
#
# Bot identity (onexbot GitHub App):
#   When ONEXBOT_APP_ID + ONEXBOT_APP_PRIVATE_KEY org secrets are set, the arch-lint
#   PR comment is posted as onexbot[bot] via a short-lived installation token. Until
#   the GitHub App is created, the workflow falls back to GITHUB_TOKEN (posts as
#   github-actions[bot]).
#
#   To create the app:
#     https://github.com/organizations/OmniNode-ai/settings/apps/new
#     Name: onexbot  |  Permissions: pull_requests:write, issues:write
#     Store app_id as ONEXBOT_APP_ID and the private key as ONEXBOT_APP_PRIVATE_KEY
#     in org-level Actions secrets.
#
#   Fallback identity is github-actions[bot] — no personal username in the fallback path.

name: PR Architectural Review

on:
  pull_request:
    branches: [main, dev]
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read

jobs:
  occ-preflight:
    name: OCC Preflight Dependency
    runs-on: ubuntu-latest
    permissions:
      checks: read
      contents: read
    steps:
      - name: Wait for required OCC preflight
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -uo pipefail

          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "OCC preflight dependency is enforced by the pull_request gate; continuing for ${GITHUB_EVENT_NAME}."
            exit 0
          fi

          # OMN-14343: desynchronize the ~33 same-PR pollers (one per workflow file
          # -- GH Actions `needs:` can't cross workflow-file boundaries) so they
          # don't all hit the Checks API in the same instant every 10s and exhaust
          # the shared per-repo GitHub App installation rate-limit bucket.
          sleep "$(( RANDOM % 15 ))"

          backoff=5
          elapsed=0
          deadline=720

          while [ "$elapsed" -lt "$deadline" ]; do
            # NOTE(OMN-14343): GH Actions runs run: steps under `bash -e {0}` by
            # default -- that -e is already active before this script's own
            # `set -uo pipefail` runs, and `set -uo pipefail` does NOT clear an
            # inherited -e. A bare `response="$(gh api ...)"; status=$?` would
            # therefore abort the whole step on ANY gh api failure before status
            # is ever checked, silently defeating the retry logic below. Using
            # the command substitution as the condition of this `if` is the
            # errexit-safe form -- bash does not trigger -e for a command that is
            # part of an if/while/until condition, regardless of ambient -e state.
            response=""
            status=0
            for page in $(seq 1 5); do
              if page_response="$(
                gh api "repos/${REPO}/commits/${HEAD_SHA}/check-runs?filter=latest&per_page=100&page=${page}" \
                  --jq 'first(.check_runs[] | select(.name == "occ-preflight / eligibility") | .conclusion) // ""' \
                  2>&1
              )"; then
                status=0
                if [ -n "$page_response" ]; then
                  response="$page_response"
                  break
                fi
              else
                status=$?
                response="$page_response"
                break
              fi
            done

            if [ "$status" -ne 0 ]; then
              if echo "$response" | grep -qi "rate limit"; then
                echo "::warning::gh api rate-limited waiting for occ-preflight; backing off ${backoff}s."
                sleep "$backoff"
                elapsed=$((elapsed + backoff))
                backoff=$(( backoff * 2 < 60 ? backoff * 2 : 60 ))
                continue
              fi
              echo "::error::gh api call failed (non-rate-limit): ${response}"
              exit 1
            fi
            backoff=5

            conclusion="$response"

            case "$conclusion" in
              success)
                echo "OCC preflight passed for ${HEAD_SHA}."
                exit 0
                ;;
              failure|cancelled|timed_out|action_required|startup_failure)
                echo "::error::OCC preflight concluded ${conclusion}; refusing to start this workflow."
                exit 1
                ;;
              "")
                echo "Waiting for occ-preflight / eligibility to post for ${HEAD_SHA}..."
                ;;
              *)
                echo "OCC preflight is ${conclusion}; waiting."
                ;;
            esac

            sleep 10
            elapsed=$((elapsed + 10))
          done

          echo "::error::Timed out waiting for occ-preflight / eligibility on ${HEAD_SHA}."
          exit 1
  # ============================================================================
  # Token resolution — swap to onexbot GitHub App token when the app exists,
  # fall back to GITHUB_TOKEN otherwise. Runs once; the arch-lint job consumes
  # the output token.
  # ============================================================================
  resolve-bot-token:
    needs: occ-preflight
    name: Resolve Bot Token
    runs-on: ubuntu-latest
    outputs:
      token: ${{ steps.pick.outputs.token }}
      bot_login: ${{ steps.pick.outputs.bot_login }}

    steps:
      - name: Detect onexbot app secrets
        id: app-secret-status
        shell: bash
        env:
          ONEXBOT_APP_ID: ${{ secrets.ONEXBOT_APP_ID }}
          ONEXBOT_APP_PRIVATE_KEY: ${{ secrets.ONEXBOT_APP_PRIVATE_KEY }}
        run: |
          if [ -n "$ONEXBOT_APP_ID" ] && [ -n "$ONEXBOT_APP_PRIVATE_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate onexbot installation token (if app secrets present)
        id: app-token
        # Only attempt if both secrets are non-empty. The `vars.` context would
        # work for non-sensitive values; secrets are used here for both because
        # APP_ID is stored alongside the private key as an org secret.
        if: ${{ steps.app-secret-status.outputs.present == 'true' }}
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.ONEXBOT_APP_ID }}
          private-key: ${{ secrets.ONEXBOT_APP_PRIVATE_KEY }}

      - name: Pick token and bot login
        id: pick
        shell: bash
        run: |
          if [ -n "${{ steps.app-token.outputs.token }}" ]; then
            echo "token=${{ steps.app-token.outputs.token }}" >> "$GITHUB_OUTPUT"
            echo "bot_login=onexbot[bot]" >> "$GITHUB_OUTPUT"
            echo "Using onexbot GitHub App token"
          else
            echo "token=${{ github.token }}" >> "$GITHUB_OUTPUT"
            echo "bot_login=github-actions[bot]" >> "$GITHUB_OUTPUT"
            echo "ONEXBOT_APP_ID/ONEXBOT_APP_PRIVATE_KEY not set — falling back to GITHUB_TOKEN (posts as github-actions[bot])"
          fi

  # ============================================================================
  # Phase 1 — Static architectural lint (fast, no infra)
  # ============================================================================
  arch-lint:
    name: Architectural Compliance Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [occ-preflight, resolve-bot-token]

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run architectural lint
        id: lint
        shell: bash
        run: |
          set -euo pipefail

          ERRORS=0
          WARNINGS=0
          REPORT=""
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          mapfile -t CHANGED_SRC_FILES < <(
            git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- src/ || true
          )
          mapfile -t CHANGED_PY_FILES < <(
            printf '%s\n' "${CHANGED_SRC_FILES[@]}" \
              | grep -E '\.py$' \
              | grep -v '/tests/' \
              || true
          )
          mapfile -t CHANGED_CONTRACT_FILES < <(
            printf '%s\n' "${CHANGED_SRC_FILES[@]}" \
              | grep -E '(^|/)contract\.yaml$' \
              || true
          )

          echo "Changed Python source files: ${#CHANGED_PY_FILES[@]}"
          echo "Changed contract files: ${#CHANGED_CONTRACT_FILES[@]}"

          # -----------------------------------------------------------------------
          # Rule 1: No hardcoded Kafka topic strings in handler code.
          #
          # Topics must be declared in contract.yaml and read at runtime via the
          # contract loader. Hardcoded strings like "onex.evt.foo.bar.v1" in Python
          # handler files are forbidden (CLAUDE.md + omnimarket/CLAUDE.md invariant).
          #
          # Exclude: contract.yaml files (they ARE the source of truth),
          #          test files (topic fixtures are acceptable there),
          #          scripts/lint_no_hardcoded_topics.py itself.
          # -----------------------------------------------------------------------
          TOPIC_HITS=""
          if [ "${#CHANGED_PY_FILES[@]}" -gt 0 ]; then
            TOPIC_HITS=$(grep -Hn -E \
              '"onex\.(cmd|evt)\.[a-z_]+\.[a-z_-]+\.v[0-9]+"' \
              "${CHANGED_PY_FILES[@]}" \
              2>/dev/null \
              | grep -v 'lint_no_hardcoded_topics.py' \
              | grep -v 'onex-topic-allow' \
              || true)
          fi

          if [ -n "$TOPIC_HITS" ]; then
            echo "::error::ARCH-TOPIC-001: Hardcoded Kafka topic string(s) found in handler code."
            echo "  Topics must be declared in contract.yaml and read at runtime, never hardcoded."
            echo "$TOPIC_HITS" | while IFS= read -r line; do
              echo "  $line"
            done
            REPORT="${REPORT}### ARCH-TOPIC-001: Hardcoded topic strings\n\n\`\`\`\n${TOPIC_HITS}\n\`\`\`\n\nTopics must be declared in \`contract.yaml\` (\`event_bus.publish_topics\` / \`subscribe_topics\`) and read at runtime via the contract loader. Never hardcode topic strings in Python handler code.\n\n"
            ERRORS=$((ERRORS + 1))
          fi

          # -----------------------------------------------------------------------
          # Rule 2: No event_bus=None bypass.
          #
          # Passing event_bus=None bypasses the DI container and breaks the
          # contract system. See: feedback_no_manual_wiring.md
          # -----------------------------------------------------------------------
          BUS_NONE_HITS=""
          if [ "${#CHANGED_PY_FILES[@]}" -gt 0 ]; then
            BUS_NONE_HITS=$(grep -Hn -E \
              'event_bus\s*=\s*None' \
              "${CHANGED_PY_FILES[@]}" \
              2>/dev/null | grep -v '^\s*#' || true)
          fi

          if [ -n "$BUS_NONE_HITS" ]; then
            echo "::error::ARCH-DI-001: event_bus=None bypass detected."
            echo "  Always resolve handlers via the DI container. Never pass event_bus=None."
            echo "$BUS_NONE_HITS" | while IFS= read -r line; do
              echo "  $line"
            done
            REPORT="${REPORT}### ARCH-DI-001: event_bus=None bypass\n\n\`\`\`\n${BUS_NONE_HITS}\n\`\`\`\n\nAlways resolve handlers via the DI container. Never bypass with \`event_bus=None\`.\n\n"
            ERRORS=$((ERRORS + 1))
          fi

          # -----------------------------------------------------------------------
          # Rule 3: No manual handler wiring that bypasses the container.
          #
          # Handler classes must not be instantiated directly in application code
          # outside of: workflow_runner.py, WorkflowPackage entry points,
          # conftest.py / test files, and adapter modules.
          # -----------------------------------------------------------------------
          MANUAL_WIRE_HITS=""
          if [ "${#CHANGED_PY_FILES[@]}" -gt 0 ]; then
            MANUAL_WIRE_HITS=$(grep -Hn -E 'Handler[A-Z][A-Za-z]+\(' \
            "${CHANGED_PY_FILES[@]}" \
            2>/dev/null \
            | grep -v 'workflow_runner\.py' \
            | grep -v 'adapter_' \
            | grep -v '__init__\.py' \
            | grep -v 'class Handler' \
            | grep -v 'isinstance(' \
            | grep -v '#' \
            || true)
          fi

          if [ -n "$MANUAL_WIRE_HITS" ]; then
            echo "::warning::ARCH-DI-002: Direct Handler instantiation outside workflow_runner / adapter layers."
            echo "  Handler classes should be wired only in workflow_runner.py or adapter modules."
            echo "$MANUAL_WIRE_HITS" | while IFS= read -r line; do
              echo "  $line"
            done
            REPORT="${REPORT}### ARCH-DI-002: Direct Handler instantiation (warning)\n\n\`\`\`\n${MANUAL_WIRE_HITS}\n\`\`\`\n\nHandler classes should be wired only in \`workflow_runner.py\` or adapter modules. Direct instantiation elsewhere bypasses the contract system.\n\n"
            WARNINGS=$((WARNINGS + 1))
          fi

          # -----------------------------------------------------------------------
          # Rule 4: No reinvented DI — DIContainer / ServiceLocator patterns
          # from outside omnibase_core.
          # -----------------------------------------------------------------------
          DI_REINVENT_HITS=""
          if [ "${#CHANGED_PY_FILES[@]}" -gt 0 ]; then
            DI_REINVENT_HITS=$(grep -Hn -E \
              'class\s+(DIContainer|ServiceLocator|DependencyContainer|InjectionContext)\b' \
              "${CHANGED_PY_FILES[@]}" \
              2>/dev/null || true)
          fi

          if [ -n "$DI_REINVENT_HITS" ]; then
            echo "::error::ARCH-DI-003: Reinvented DI container detected."
            echo "  Use omnibase_core's contract system, not a hand-rolled DI container."
            echo "$DI_REINVENT_HITS" | while IFS= read -r line; do
              echo "  $line"
            done
            REPORT="${REPORT}### ARCH-DI-003: Reinvented DI container\n\n\`\`\`\n${DI_REINVENT_HITS}\n\`\`\`\n\nUse omnibase_core's contract system, not a hand-rolled DI container.\n\n"
            ERRORS=$((ERRORS + 1))
          fi

          # -----------------------------------------------------------------------
          # Rule 5: contract.yaml topics follow onex.{cmd|evt|dlq}.{producer}.{name}.v{N}
          # -----------------------------------------------------------------------
          CONTRACT_TOPIC_VIOLATIONS=""
          if [ "${#CHANGED_CONTRACT_FILES[@]}" -gt 0 ]; then
            CONTRACT_TOPIC_VIOLATIONS=$(grep -Hn 'onex\.' "${CHANGED_CONTRACT_FILES[@]}" 2>/dev/null \
              | grep -vE 'onex\.(cmd|evt|dlq)\.[a-z_-]+\.[a-z_-]+\.v[0-9]+' \
              | grep -v '#' \
              || true)
          fi

          if [ -n "$CONTRACT_TOPIC_VIOLATIONS" ]; then
            echo "::error::ARCH-TOPIC-002: contract.yaml topic(s) do not follow onex.{cmd|evt|dlq}.{producer}.{name}.v{N} convention."
            echo "$CONTRACT_TOPIC_VIOLATIONS" | while IFS= read -r line; do
              echo "  $line"
            done
            REPORT="${REPORT}### ARCH-TOPIC-002: Non-standard topic names in contract.yaml\n\n\`\`\`\n${CONTRACT_TOPIC_VIOLATIONS}\n\`\`\`\n\nAll topics must follow the \`onex.{cmd|evt|dlq}.{producer}.{event-name}.v{N}\` convention.\n\n"
            ERRORS=$((ERRORS + 1))
          fi

          # -----------------------------------------------------------------------
          # Summary
          # -----------------------------------------------------------------------
          echo ""
          echo "=== Architectural Lint Summary ==="
          echo "Errors  : $ERRORS"
          echo "Warnings: $WARNINGS"

          {
            echo "ARCH_LINT_ERRORS=$ERRORS"
            echo "ARCH_LINT_WARNINGS=$WARNINGS"
          } >> "$GITHUB_ENV"

          if [ -n "$REPORT" ]; then
            printf '%s' "$REPORT" > /tmp/arch_lint_report.md
          else
            echo "_No architectural violations found._" > /tmp/arch_lint_report.md
          fi

          if [ "$ERRORS" -gt 0 ]; then
            exit 1
          fi

      - name: Post architectural lint summary as PR comment
        if: always()
        uses: actions/github-script@v7
        env:
          BOT_LOGIN: ${{ needs.resolve-bot-token.outputs.bot_login }}
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const errors = parseInt(process.env.ARCH_LINT_ERRORS || '0');
            const warnings = parseInt(process.env.ARCH_LINT_WARNINGS || '0');
            const botLogin = process.env.BOT_LOGIN || '';

            let report = '';
            try {
              report = fs.readFileSync('/tmp/arch_lint_report.md', 'utf8');
            } catch (e) {
              report = '_Lint report not available._';
            }

            const badge = errors > 0 ? '**BLOCKED**' : warnings > 0 ? '**WARNINGS**' : '**PASSED**';
            const icon = errors > 0 ? '🚫' : warnings > 0 ? '⚠️' : '✅';

            const body = [
              `## ${icon} Architectural Review — ${badge}`,
              '',
              `**Errors**: ${errors}  `,
              `**Warnings**: ${warnings}`,
              '',
              '### What this checks',
              '',
              '| Rule | Description |',
              '|------|-------------|',
              '| ARCH-TOPIC-001 | No hardcoded Kafka topic strings in handler code |',
              '| ARCH-DI-001 | No `event_bus=None` bypass |',
              '| ARCH-DI-002 | No direct Handler instantiation outside workflow_runner/adapters |',
              '| ARCH-DI-003 | No reinvented DI containers |',
              '| ARCH-TOPIC-002 | contract.yaml topics follow `onex.{cmd|evt|dlq}.{producer}.{name}.v{N}` |',
              '',
              '---',
              '',
              report,
              '',
              '_Static architectural lint — no model inference (OMN-14176)._',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            // Match existing comment by bot login to support upsert across token types
            const botComment = comments.find(c =>
              (c.user.login === botLogin || c.user.type === 'Bot') &&
              c.body.includes('Architectural Review')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  # ============================================================================
  # GATE AGGREGATOR
  # arch-lint is required to pass; occ-preflight must succeed.
  # ============================================================================
  pr-arch-review-gate:
    name: PR Arch Review Gate
    runs-on: ubuntu-latest
    needs: [occ-preflight, arch-lint]
    if: always()
    steps:
      - name: Evaluate gate
        run: |
          echo "=== PR Arch Review Gate ==="
          FAILED=false

          PREFLIGHT="${{ needs.occ-preflight.result }}"
          ARCH_LINT="${{ needs.arch-lint.result }}"

          echo "occ-preflight: $PREFLIGHT"
          echo "arch-lint  : $ARCH_LINT"

          if [ "$PREFLIGHT" != "success" ]; then
            echo "::error::OCC preflight failed or did not complete successfully."
            FAILED=true
          fi

          # arch-lint is a hard gate — structural violations block merge
          if [ "$ARCH_LINT" != "success" ] && [ "$ARCH_LINT" != "skipped" ]; then
            echo "::error::arch-lint failed — architectural violations must be resolved before merge."
            FAILED=true
          fi

          if [ "$FAILED" = "true" ]; then
            echo ""
            echo "PR Arch Review Gate FAILED"
            exit 1
          fi
          echo ""
          echo "PR Arch Review Gate PASSED"
