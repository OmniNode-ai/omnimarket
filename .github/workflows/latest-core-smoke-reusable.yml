#
# OMN-26215: the latest-core smoke, callable from a core PR against omnimarket dev.
# A core PR adds a job that calls this workflow (workflow_call) and passes its own
# build as `core_spec`; with no input the newest published omnibase-core is used.
# SYNC with the `latest-core-smoke` job in ci.yml.
name: Latest Core Smoke (reusable)

on:
  workflow_call:
    inputs:
      core_spec:
        description: "pip requirement for omnibase-core, e.g. 'omnibase-core @ git+https://github.com/OmniNode-ai/omnibase_core.git@<sha>'; empty = newest release"
        type: string
        default: ""
      omnimarket_ref:
        description: "omnimarket ref to check out"
        type: string
        default: "dev"
  workflow_dispatch:
    inputs:
      core_spec:
        description: "pip requirement for omnibase-core; empty = newest release"
        type: string
        default: ""
      omnimarket_ref:
        description: "omnimarket ref to check out"
        type: string
        default: "dev"

permissions:
  contents: read

jobs:
  smoke:
    name: Latest Core Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          repository: OmniNode-ai/omnimarket
          ref: ${{ inputs.omnimarket_ref }}
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          version: "latest"
      - name: Build a throwaway venv with omnimarket (no lockfile)
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/smoke-venv"
          uv pip install --python "$RUNNER_TEMP/smoke-venv/bin/python" -e .
      - name: Replace core with the requested build
        env:
          CORE_SPEC: ${{ inputs.core_spec }}
        run: |
          uv pip install --python "$RUNNER_TEMP/smoke-venv/bin/python" --upgrade --no-deps "${CORE_SPEC:-omnibase-core}"
          "$RUNNER_TEMP/smoke-venv/bin/python" -c "import importlib.metadata as m; print('omnibase-core', m.version('omnibase-core'))"
      - name: Import every node entry point
        env:
          OMNI_HOME: ${{ github.workspace }}
        run: |
          "$RUNNER_TEMP/smoke-venv/bin/python" tests/ci/latest_core_smoke.py
