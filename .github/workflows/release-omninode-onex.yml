name: Release omninode-onex

# Publishes the customer package packages/omninode-onex to PyPI and attaches
# its installer, rendered by node_onex_installer_render_compute. Its own tag, omninode-onex-v<version>, so it never fires with
# omnimarket's v<version> release tags (release.yml). The steps follow
# release.yml: clean tree, tag equals the package version, wheel and sdist,
# the PyPI pin-resolvability gate before anything is published, an idempotent
# upload, then a GitHub Release.
#
# PYPI_TOKEN must be allowed to upload to the omninode-onex project.

on:
  push:
    tags: ['omninode-onex-v[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. omninode-onex-v0.0.1.post1)'
        required: true

permissions:
  contents: read

concurrency:
  group: release-omninode-onex-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Assert clean working tree
        run: |
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git ls-files --others --exclude-standard)"

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7

      - name: Validate the tag, the package version and the installer pin
        id: tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="$RELEASE_TAG"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          case "$TAG" in
            ''|*[!A-Za-z0-9.+_-]*)
              echo "::error::release tag contains unsupported characters"
              exit 1
              ;;
          esac
          VERSION="$(python3 -c "import tomllib;print(tomllib.load(open('packages/omninode-onex/pyproject.toml','rb'))['project']['version'])")"
          if [ "$TAG" != "omninode-onex-v$VERSION" ]; then
            echo "::error::tag $TAG does not match omninode-onex-v$VERSION"
            exit 1
          fi
          PINNED="$(python3 -c "import json;print(json.load(open('packages/omninode-onex/installer.json'))['version'])")"
          if [ "$PINNED" != "$VERSION" ]; then
            echo "::error::installer.json pins $PINNED, the package is $VERSION"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build wheel + sdist
        run: uv build --out-dir dist packages/omninode-onex

      # The installer is rendered by node_onex_installer_render_compute from the
      # release's pinned values (the repository holds no shell script), before
      # anything is published, so a bad render stops the release.
      - name: Render the installer
        run: |
          PYTHONPATH="$PWD/src" uv run --no-project --python 3.12 --with pydantic python -m omnimarket.nodes.node_onex_installer_render_compute.runtime_onex_installer_render \
            < packages/omninode-onex/installer.json > dist/install.sh
          grep -qx "ONEX_VERSION=\"$(python3 -c "import json;print(json.load(open('packages/omninode-onex/installer.json'))['version'])")\"" dist/install.sh

      - name: Verify PyPI dependency-pin resolvability
        env:
          PYPI_PIN_RESOLVE_TIMEOUT_SECONDS: '900'
        run: python3 scripts/ci/verify_pypi_pin_resolvability.py dist/

      # --check-url skips files already on PyPI, so a rerun is idempotent.
      - name: Publish to PyPI
        run: |
          uv publish \
            --check-url https://pypi.org/simple/ \
            --token "$UV_PUBLISH_TOKEN" \
            dist/*.whl dist/*.tar.gz
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}

      - name: Generate checksums
        run: sha256sum dist/*.whl dist/*.tar.gz dist/install.sh > dist/SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/install.sh
            dist/SHA256SUMS.txt
          generate_release_notes: true
          make_latest: false
