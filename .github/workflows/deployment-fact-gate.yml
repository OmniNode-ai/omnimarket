#
# OMN-20287: no new deployment fact in omnimarket's packaged routing configs.
#
# Routing decisions belong in a deployment's overlay, not in the config this
# package ships (operator rulings 2026-09-26T14:31:29Z and 2026-09-26T15:24:56Z).
# The fields that record one carry the deployment-fact marker on their typed
# models; node_deployment_fact_gate_effect refuses a non-neutral value in a
# marked field, and a key the file's typed model does not declare, that the base
# revision did not carry. The base revision is the shrink-only baseline.
#
# The pull request's merge ref is checked out, so its first parent is the base
# branch tip it would merge onto: the tree is judged against that parent, which
# is exactly the pull request's change. The `deployment-fact-gate` pre-commit
# hook runs the same entry point against HEAD.
#
# Enforcement surface on omnimarket dev is the required `CI Summary` umbrella:
# this job's name is in scripts/ci/ci_summary_gate.py EXPECTED_EXTERNAL_CONTEXTS,
# and merge-group-pr-scoped-contexts.yml reports it on a queue commit.
#
# Reads only committed config — never the PR body or title — so `edited` is
# deliberately absent from the trigger types (OMN-16171).

name: Deployment Fact Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, dev]

# OMN-19643: cancel only superseded pull request runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


permissions:
  contents: read

jobs:
  deployment-fact-gate:
    name: Deployment Fact Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          fetch-depth: 2

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7

      - name: Refuse a new deployment fact against the base branch tip
        run: |
          set -euo pipefail
          git rev-parse --verify 'HEAD^2' >/dev/null
          uv run python -m omnimarket.nodes.node_deployment_fact_gate_effect --base 'HEAD^1' --inventory

      - name: Prove the gate is falsifiable (red on omnimarket#3624, shrink-only)
        run: uv run pytest tests/unit/nodes/node_deployment_fact_gate_effect -q
