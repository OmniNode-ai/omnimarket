#
# KB Doc Gate — thin caller. OMN-16589.
# Blocks new/regrown non-KB markdown docs, evaluated against the PR diff.
# Validator lives in omniclaude (mirrors deploy-gate.yml's thin-caller pattern).
#
# Pilot wiring (P1): transition mode, NOT a required status check yet. The
# required-check flip is explicit follow-up scope once this repo and
# omnibase_core both run green on real PRs — see OMN-16589 AC.

name: KB Doc Gate

on:
  pull_request:
    branches: [dev]

jobs:
  kb-doc-gate:
    # Pinned by immutable SHA, not @main: main is release-synced and does not
    # carry this gate yet (promotion deferred by policy). This commit includes
    # the reusable workflow and the validator-ref input that keeps the script
    # checkout on the same immutable omniclaude source.
    uses: OmniNode-ai/omniclaude/.github/workflows/kb-doc-gate-reusable.yml@3b3f5e6966df2beebfb1435d15948394f92771de
    with:
      mode: transition
      validator_ref: 3b3f5e6966df2beebfb1435d15948394f92771de
