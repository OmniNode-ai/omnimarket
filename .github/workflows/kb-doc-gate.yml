#
# KB Doc Gate — thin caller. OMN-16589.
# Blocks new/regrown non-KB markdown docs, evaluated against the PR diff.
# Validator lives in omniclaude (mirrors deploy-gate.yml's thin-caller pattern).
#
# Pilot wiring (P1): transition mode, NOT a required status check yet. The
# required-check flip is explicit follow-up scope once this repo and
# omnibase_core both run green on real PRs — see OMN-16589 AC.

name: KB Doc Gate

on:
  pull_request:
    branches: [dev]

jobs:
  kb-doc-gate:
    # Pinned by immutable SHA, not @main: omniclaude main is release-synced and
    # carries neither this reusable workflow nor scripts/kb_doc_gate.py
    # (verified: `git cat-file -e origin/main:scripts/kb_doc_gate.py` fails).
    #
    # This pin MUST be a real omniclaude commit on `dev` that contains BOTH the
    # reusable workflow and the validator script. The previous pin
    # (3b3f5e6966df2beebfb1435d15948394f92771de, landed by #2153) is not a
    # commit in omniclaude at all —
    # `GET /repos/OmniNode-ai/omniclaude/commits/<sha>` returns 422 "No commit
    # found for SHA" — so GitHub could not resolve the reusable workflow and
    # every run here failed with zero jobs.
    #
    # 17a6a47b (omniclaude#2050) also fixes the gate's INNER validator checkout
    # to default to `github.job_workflow_sha`, so this one `uses:` pin now
    # covers the validator source too and `validator_ref` is no longer needed.
    uses: OmniNode-ai/omniclaude/.github/workflows/kb-doc-gate-reusable.yml@17a6a47bfe2af626de5cf59d1f0ed43bddcb5002
    with:
      mode: transition
