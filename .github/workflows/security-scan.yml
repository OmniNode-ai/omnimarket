name: Security Scanning

# ENFORCEMENT (2026-08-13, OMN-ci-gate-omnimarket): `pull_request` trigger
# added — this workflow previously ran ONLY on schedule/workflow_dispatch/push,
# so `dependency-scan`'s "Run Dependency Review" step (`if:
# github.event_name == 'pull_request'`) was dead code (the event that gates it
# could never occur) and none of these three jobs could ever validate a PR
# before merge. The resulting contexts are NOT yet asserted in CI Summary's
# EXPECTED_EXTERNAL_CONTEXTS (scripts/ci/ci_summary_gate.py) in this same PR —
# they are unproven PR-event reporters until observed green on at least one
# real PR; promoting an unproven reporter straight to a required/asserted
# context is the documented wedge trap. See the completeness test's
# EXEMPT_CONTEXTS entries for these three jobs for the tracked follow-up.
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
  push:
    branches: [main, 'hotfix/**']
  pull_request:
    branches: [main, dev]

# OMN-19643: cancel only superseded pull request runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


permissions:
  contents: read

jobs:
  dependency-scan:
    name: Dependency Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7

      - name: Export requirements
        run: uv export --format requirements-txt --no-hashes --output-file requirements.txt

      - name: Run Dependency Review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48  # v4
        if: github.event_name == 'pull_request'

      - name: Run Safety Check
        run: |
          pip install safety
          # JSON capture is diagnostic-only (feeds the uploaded artifact below);
          # `|| true` here only prevents a non-zero exit from skipping the
          # artifact write. The PLAIN invocation below is the enforcing gate —
          # no `|| true`: `|| true` on an enforcing step is not a valid
          # exemption form (doctrine). A real finding now fails this job.
          safety check --file requirements.txt --output json > safety-report.json || true
          safety check --file requirements.txt

      - name: Upload Safety report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        if: always()
        with:
          name: safety-dependency-report
          path: safety-report.json

  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          fetch-depth: 0

      - name: TruffleHog Secret Scanning (push diff)
        if: github.event_name == 'push'
        uses: trufflesecurity/trufflehog@586f66d7886cd0b037c7c245d4a6e34ef357ab10
        with:
          path: ./
          base: ${{ github.event.before }}
          head: ${{ github.event.after }}
          # --exclude-detectors=lob (OMN-16045): Lob detector regex (v3.95.9+) mass-verifies test_-prefixed pytest identifiers as live keys; zero Lob usage in this repo. Remove when a released trufflehog tag carries upstream PR 5188.
          extra_args: --only-verified --exclude-detectors=lob

      - name: TruffleHog Secret Scanning (full scan)
        if: github.event_name != 'push'
        uses: trufflesecurity/trufflehog@586f66d7886cd0b037c7c245d4a6e34ef357ab10
        with:
          path: ./
          # --exclude-detectors=lob (OMN-16045): Lob detector regex (v3.95.9+) mass-verifies test_-prefixed pytest identifiers as live keys; zero Lob usage in this repo. Remove when a released trufflehog tag carries upstream PR 5188.
          extra_args: --only-verified --exclude-detectors=lob

  codeql:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ['python']

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4
        with:
          languages: ${{ matrix.language }}
          queries: +security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4
        with:
          category: "/language:${{ matrix.language }}"
