---
# Runtime Profiles — ValidatorRuntimeProfiles gate [OMN-12957]
#
# Wires omnibase_core.validation.validator_runtime_profiles as a required
# status check on omnimarket node contracts. Enforces three rules:
#   - runtime_profiles_missing (OMN-9886)
#   - runtime_profile_unregistered (OMN-12957) — declared profile not in the
#     canonical REGISTERED_RUNTIME_PROFILES registry
#   - runtime_profile_no_consumer_lane (OMN-12957) — subscribing REDUCER/EFFECT
#     names no consumer-attached profile, so its subscriptions are never drained
#
# The allowlist drained to empty (OMN-12982) and OMN-20558 deleted it. The
# validator runs with an explicitly empty allowlist (allowlist=set(), which also
# disables repo and core allowlist discovery), so ANY violating contract fails.
# No exception list remains.
#
# Requires the omnibase_core pin to include OMN-12957's validator (new rules).
# Context: "validate" (CORRECTED 2026-08-13 — this comment previously claimed
# "Runtime Profiles / validate", which is FALSE: the `validate` job below
# carries no job-level `uses:`, so GitHub names its check-run after the job's
# own `name:` field only, same as the sibling bare-name `state-coverage-gate`
# job — never workflow-name-prefixed). NOT a direct branch-protection
# required status check on either dev or main (verified live 2026-08-13 via
# `gh api repos/OmniNode-ai/omnimarket/branches/{dev,main}/protection/required_status_checks`).
# It IS asserted fail-closed as an L4 external context by CI Summary's
# EXPECTED_EXTERNAL_CONTEXTS (scripts/ci/ci_summary_gate.py), which is
# required — a red or missing run here now blocks merge transitively.

name: Runtime Profiles

on:
  push:
    branches: [main, develop, dev, "hotfix/**"]
  pull_request:
    branches: [main, develop, dev]

env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.8.3"

concurrency:
  group: runtime-profiles-${{ github.ref }}
  cancel-in-progress: true

jobs:
  occ-preflight:
    name: Repo Evidence Dependency
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: read
      contents: read
    steps:
      - name: Wait for required repo evidence
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -uo pipefail

          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Repo evidence dependency is enforced by the pull_request gate; continuing for ${GITHUB_EVENT_NAME}."
            exit 0
          fi

          # OMN-14343: desynchronize the ~33 same-PR pollers (one per workflow file
          # -- GH Actions `needs:` can't cross workflow-file boundaries) so they
          # don't all hit the Checks API in the same instant every 10s and exhaust
          # the shared per-repo GitHub App installation rate-limit bucket.
          sleep "$(( RANDOM % 15 ))"

          backoff=5
          elapsed=0
          # The repo-owned verifier has a 40-minute job timeout. Allow another
          # 180 seconds for scheduling; a missing verdict still fails closed.
          deadline=2580

          while [ "$elapsed" -lt "$deadline" ]; do
            # NOTE(OMN-14343): GH Actions runs run: steps under `bash -e {0}` by
            # default -- that -e is already active before this script's own
            # `set -uo pipefail` runs, and `set -uo pipefail` does NOT clear an
            # inherited -e. A bare `response="$(gh api ...)"; status=$?` would
            # therefore abort the whole step on ANY gh api failure before status
            # is ever checked, silently defeating the retry logic below. Using
            # the command substitution as the condition of this `if` is the
            # errexit-safe form -- bash does not trigger -e for a command that is
            # part of an if/while/until condition, regardless of ambient -e state.
            response=""
            status=0
            if response="$(
              gh api "repos/${REPO}/commits/${HEAD_SHA}/check-runs?filter=latest&check_name=repo-evidence%20%2F%20dod-verify&per_page=100" \
                --jq '[.check_runs[] | select(.app.id == 15368)] | sort_by(.id) | last | .conclusion // ""' \
                2>&1
            )"; then
              status=0
            else
              status=$?
            fi

            if [ "$status" -ne 0 ]; then
              if echo "$response" | grep -qi "rate limit"; then
                echo "::warning::gh api rate-limited waiting for repo-evidence; backing off ${backoff}s."
                sleep "$backoff"
                elapsed=$((elapsed + backoff))
                backoff=$(( backoff * 2 < 60 ? backoff * 2 : 60 ))
                continue
              fi
              echo "::error::gh api call failed (non-rate-limit): ${response}"
              exit 1
            fi
            backoff=5

            conclusion="$response"

            case "$conclusion" in
              success)
                echo "Repo evidence passed for ${HEAD_SHA}."
                exit 0
                ;;
              cancelled)
                # OMN-20038: a cancelled verifier that a newer run for this head is
                # replacing is pending, not refused. With no run queued or in progress the
                # cancel is final and refuses exactly as before (fail closed on any read error).
                in_flight="$(gh api "repos/${REPO}/commits/${HEAD_SHA}/check-runs?filter=latest&check_name=repo-evidence%20%2F%20dod-verify&per_page=100" --jq '[.check_runs[] | select(.app.id == 15368)] | sort_by(.id) | [last | select(.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "pending")] | length')" || in_flight=0
                if [ "$in_flight" -gt 0 ] 2>/dev/null; then
                  echo "Repo evidence was cancelled but ${in_flight} newer run(s) are pending for ${HEAD_SHA}; waiting."
                else
                  echo "::error::Repo evidence concluded cancelled with no newer run pending; refusing to start this workflow."
                  exit 1
                fi
                ;;
              failure|timed_out|action_required|startup_failure)
                echo "::error::Repo evidence concluded ${conclusion}; refusing to start this workflow."
                exit 1
                ;;
              "")
                echo "Waiting for repo-evidence / dod-verify to post for ${HEAD_SHA}..."
                ;;
              *)
                echo "Repo evidence is ${conclusion}; waiting."
                ;;
            esac

            sleep 10
            elapsed=$((elapsed + 10))
          done

          echo "::error::Timed out waiting for repo-evidence / dod-verify on ${HEAD_SHA}."
          exit 1
  validate:
    needs: occ-preflight
    name: validate
    # OMNI_RUNNER_SELECTOR_V1 - trusted events default to self-hosted omnibase-ci; pull_request defaults to ubuntu-latest
    runs-on: >-
      ${{
        github.event_name != 'pull_request'
        && fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
        || fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
      }}
    timeout-minutes: 10

    steps:
      - name: Checkout omnimarket
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install dependencies
        run: uv sync

      - name: Validate runtime_profiles on omnimarket contracts
        run: |
          uv run python - <<'PY'
          from pathlib import Path

          from omnibase_core.validation.validator_runtime_profiles import (
              ValidatorRuntimeProfiles,
          )

          result = ValidatorRuntimeProfiles(
              allowlist=set()
          ).validate(Path("src"))
          for issue in result.issues:
              print(f"[{issue.severity.value}] {issue.file_path}:{issue.line_number}: {issue.message}")
          raise SystemExit(0 if result.is_valid else 1)
          PY
