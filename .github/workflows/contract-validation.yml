# Contract Validation Gate
#
# Validates ONEX ticket contracts for PRs in omnimarket using the
# reusable composite action from onex_change_control.
#
# The validation is intentionally lenient on missing contracts:
# - If branch name has no OMN-XXXX ticket ID -> skipped
# - If contracts/<ticket_id>.yaml does not exist -> skipped
# - If contract file exists but fails schema validation -> fails

name: Contract Validation

on:
  pull_request:
    branches: [main, dev]
  merge_group:
  workflow_dispatch:
    inputs:
      branch-name:
        description: "Branch name to validate contracts for (defaults to current branch)"
        required: false
        default: ""

concurrency:
  group: contract-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  occ-preflight:
    name: OCC Preflight Dependency
    runs-on: ubuntu-latest
    permissions:
      checks: read
      contents: read
    steps:
      - name: Wait for required OCC preflight
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -uo pipefail

          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "OCC preflight dependency is enforced by the pull_request gate; continuing for ${GITHUB_EVENT_NAME}."
            exit 0
          fi

          # OMN-14343: desynchronize the ~33 same-PR pollers (one per workflow file
          # -- GH Actions `needs:` can't cross workflow-file boundaries) so they
          # don't all hit the Checks API in the same instant every 10s and exhaust
          # the shared per-repo GitHub App installation rate-limit bucket.
          sleep "$(( RANDOM % 15 ))"

          backoff=5
          elapsed=0
          deadline=720

          while [ "$elapsed" -lt "$deadline" ]; do
            response="$(
              gh api "repos/${REPO}/commits/${HEAD_SHA}/check-runs?filter=latest&per_page=100" \
                --jq 'first(.check_runs[] | select(.name == "occ-preflight / eligibility") | .conclusion) // ""' \
                2>&1
            )"
            status=$?

            if [ "$status" -ne 0 ]; then
              if echo "$response" | grep -qi "rate limit"; then
                echo "::warning::gh api rate-limited waiting for occ-preflight; backing off ${backoff}s."
                sleep "$backoff"
                elapsed=$((elapsed + backoff))
                backoff=$(( backoff * 2 < 60 ? backoff * 2 : 60 ))
                continue
              fi
              echo "::error::gh api call failed (non-rate-limit): ${response}"
              exit 1
            fi
            backoff=5

            conclusion="$response"

            case "$conclusion" in
              success)
                echo "OCC preflight passed for ${HEAD_SHA}."
                exit 0
                ;;
              failure|cancelled|timed_out|action_required|startup_failure)
                echo "::error::OCC preflight concluded ${conclusion}; refusing to start this workflow."
                exit 1
                ;;
              "")
                echo "Waiting for occ-preflight / eligibility to post for ${HEAD_SHA}..."
                ;;
              *)
                echo "OCC preflight is ${conclusion}; waiting."
                ;;
            esac

            sleep 10
            elapsed=$((elapsed + 10))
          done

          echo "::error::Timed out waiting for occ-preflight / eligibility on ${HEAD_SHA}."
          exit 1
  contract-validation:
    needs: occ-preflight
    name: contract-validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Auth preflight — confirm onex_change_control action is accessible
        id: auth-preflight
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Checking visibility of OmniNode-ai/onex_change_control..."
          if gh api repos/OmniNode-ai/onex_change_control --silent; then
            echo "::notice::onex_change_control repo is accessible."
          else
            echo "::error::Cannot reach OmniNode-ai/onex_change_control. Composite action will not resolve."
            exit 1
          fi

      - name: Resolve branch name
        id: resolve-branch
        env:
          WORKFLOW_INPUT_BRANCH: ${{ inputs.branch-name }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "merge_group" ]]; then
            echo "resolved_branch=" >> "$GITHUB_OUTPUT"
            echo "skip_validation=true" >> "$GITHUB_OUTPUT"
            echo "::notice::merge_group event — contract validation skipped (validated on PR branch instead)."
            exit 0
          fi

          echo "skip_validation=false" >> "$GITHUB_OUTPUT"

          if [[ -n "$WORKFLOW_INPUT_BRANCH" ]]; then
            BRANCH="$WORKFLOW_INPUT_BRANCH"
          elif [[ -n "$GITHUB_HEAD_REF" ]]; then
            BRANCH="$GITHUB_HEAD_REF"
          else
            BRANCH="$GITHUB_REF_NAME"
          fi
          echo "resolved_branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "::notice::Resolved branch name: $BRANCH"

      - name: Run contract validation
        id: validate-contract
        if: steps.resolve-branch.outputs.skip_validation != 'true'
        uses: OmniNode-ai/onex_change_control/.github/actions/validate-contract@main
        with:
          branch-name: ${{ steps.resolve-branch.outputs.resolved_branch }}
          contracts-path: contracts

      - name: Report validation result
        if: always()
        env:
          TICKET_ID: ${{ steps.validate-contract.outputs.ticket-id }}
          VALIDATION_STATUS: ${{ steps.validate-contract.outputs.validation-status }}
          SKIP_VALIDATION: ${{ steps.resolve-branch.outputs.skip_validation }}
        run: |
          if [[ "$SKIP_VALIDATION" == "true" ]]; then
            echo "::notice::Contract validation SKIPPED — merge_group event."
            exit 0
          fi
          case "$VALIDATION_STATUS" in
            passed)
              echo "::notice::Contract validation PASSED for ticket $TICKET_ID"
              ;;
            skipped)
              if [[ -z "$TICKET_ID" ]]; then
                echo "::notice::Contract validation SKIPPED — no OMN-XXXX ticket ID found in branch name."
              else
                echo "::notice::Contract validation SKIPPED — no contract file found for $TICKET_ID in contracts/."
              fi
              ;;
            failed)
              echo "::error::Contract validation FAILED for ticket $TICKET_ID. See validate-contract step for details."
              exit 1
              ;;
            *)
              echo "::warning::Unexpected validation status: '$VALIDATION_STATUS'. Treating as skipped."
              ;;
          esac
