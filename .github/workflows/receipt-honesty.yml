#
# Receipt-Honesty Gate (OMN-12791 validator; wired by OMN-12825).
#
# Runs the omnibase_core receipt-honesty validator
# (`python -m omnibase_core.validation.validator_receipt_honesty`) against any
# ModelDodReceipt YAML files changed in the PR. The validator fails on gamed
# probes (no-op echo marked PASS), deferred evidence (PENDING/TBD/TODO in PASS
# receipts), self-attestation (verifier==runner), fake human verifiers, and
# deploy-keyword evidence backed only by an echo probe_command.
#
# Queue-safety: triggers on BOTH pull_request and merge_group so that, when
# later promoted to a required status check, it cannot permanently wedge the
# merge queue. omnimarket carries no committed receipt YAMLs of its own, so the
# gate is a no-op (PASS) unless a PR introduces receipt files.
#
# Required-status-check name (when later flipped): `receipt-honesty / receipt-honesty`

name: receipt-honesty

on:
  pull_request:
    branches: [main, dev]
  merge_group:

permissions:
  contents: read

concurrency:
  group: receipt-honesty-${{ github.ref }}
  cancel-in-progress: true

jobs:
  occ-preflight:
    name: OCC Preflight Dependency
    runs-on: ubuntu-latest
    permissions:
      checks: read
      contents: read
    steps:
      - name: Wait for required OCC preflight
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -uo pipefail

          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "OCC preflight dependency is enforced by the pull_request gate; continuing for ${GITHUB_EVENT_NAME}."
            exit 0
          fi

          # OMN-14343: desynchronize the ~33 same-PR pollers (one per workflow file
          # -- GH Actions `needs:` can't cross workflow-file boundaries) so they
          # don't all hit the Checks API in the same instant every 10s and exhaust
          # the shared per-repo GitHub App installation rate-limit bucket.
          sleep "$(( RANDOM % 15 ))"

          backoff=5
          elapsed=0
          deadline=720

          while [ "$elapsed" -lt "$deadline" ]; do
            # NOTE(OMN-14343): GH Actions runs run: steps under `bash -e {0}` by
            # default -- that -e is already active before this script's own
            # `set -uo pipefail` runs, and `set -uo pipefail` does NOT clear an
            # inherited -e. A bare `response="$(gh api ...)"; status=$?` would
            # therefore abort the whole step on ANY gh api failure before status
            # is ever checked, silently defeating the retry logic below. Using
            # the command substitution as the condition of this `if` is the
            # errexit-safe form -- bash does not trigger -e for a command that is
            # part of an if/while/until condition, regardless of ambient -e state.
            response=""
            status=0
            for page in $(seq 1 5); do
              if page_response="$(
                gh api "repos/${REPO}/commits/${HEAD_SHA}/check-runs?filter=latest&per_page=100&page=${page}" \
                  --jq 'first(.check_runs[] | select(.name == "occ-preflight / eligibility") | .conclusion) // ""' \
                  2>&1
              )"; then
                status=0
                if [ -n "$page_response" ]; then
                  response="$page_response"
                  break
                fi
              else
                status=$?
                response="$page_response"
                break
              fi
            done

            if [ "$status" -ne 0 ]; then
              if echo "$response" | grep -qi "rate limit"; then
                echo "::warning::gh api rate-limited waiting for occ-preflight; backing off ${backoff}s."
                sleep "$backoff"
                elapsed=$((elapsed + backoff))
                backoff=$(( backoff * 2 < 60 ? backoff * 2 : 60 ))
                continue
              fi
              echo "::error::gh api call failed (non-rate-limit): ${response}"
              exit 1
            fi
            backoff=5

            conclusion="$response"

            case "$conclusion" in
              success)
                echo "OCC preflight passed for ${HEAD_SHA}."
                exit 0
                ;;
              failure|cancelled|timed_out|action_required|startup_failure)
                echo "::error::OCC preflight concluded ${conclusion}; refusing to start this workflow."
                exit 1
                ;;
              "")
                echo "Waiting for occ-preflight / eligibility to post for ${HEAD_SHA}..."
                ;;
              *)
                echo "OCC preflight is ${conclusion}; waiting."
                ;;
            esac

            sleep 10
            elapsed=$((elapsed + 10))
          done

          echo "::error::Timed out waiting for occ-preflight / eligibility on ${HEAD_SHA}."
          exit 1
  receipt-honesty:
    needs: occ-preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Clone omnibase_core (provides the receipt-honesty validator)
        run: git clone --depth=1 https://github.com/OmniNode-ai/omnibase_core.git ../omnibase_core
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - name: Set up Python 3.12
        run: uv python install 3.12
      - name: Install omnibase_core (validator package) into a uv venv
        run: |
          set -euo pipefail
          uv venv .honesty-venv --python 3.12
          uv pip install --python .honesty-venv/bin/python ../omnibase_core
      - name: Identify changed DoD receipt YAMLs
        id: receipts
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
            head_sha="${{ github.event.pull_request.head.sha }}"
          else
            # merge_group: compare against the base of the queued group
            base_sha="${{ github.event.merge_group.base_sha }}"
            head_sha="${{ github.event.merge_group.head_sha }}"
          fi
          # Ensure both endpoints are present locally (base may be unfetched).
          git fetch --no-tags --depth=1 origin "$base_sha" 2>/dev/null || true
          git fetch --no-tags --depth=1 origin "$head_sha" 2>/dev/null || true
          # Restrict to receipt files (matches the omnibase_core pre-commit
          # hook's `files: drift/dod_receipts/.*\.yaml$` filter).
          changed=$(git diff --name-only --diff-filter=d "$base_sha" "$head_sha" \
            | grep -E 'drift/dod_receipts/.*\.yaml$' || true)
          {
            echo "files<<EOF"
            echo "$changed"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          if [ -z "$changed" ]; then
            echo "No DoD receipt YAMLs changed in this PR — honesty gate is a no-op."
          else
            echo "Changed receipt files:"
            echo "$changed"
          fi
      - name: Run receipt-honesty validator
        run: |
          set -euo pipefail
          files="${{ steps.receipts.outputs.files }}"
          if [ -z "$files" ]; then
            echo "RECEIPT HONESTY GATE PASSED: 0 changed receipt files to scan."
            exit 0
          fi
          # Pass explicit changed receipt paths; validator exits non-zero on any
          # honesty violation.
          # shellcheck disable=SC2086
          .honesty-venv/bin/python -m omnibase_core.validation.validator_receipt_honesty $files
