#
# OMN-13298 (child of OMN-12803): url-authority ratchet gate — BLOCKING MODE.
#
# Every URL/endpoint must resolve from a contract (the routing authority for
# model endpoints, the integration catalog for external/infra endpoints) — never
# from a public-HTTPS source literal or a *_URL / *_ENDPOINT env read. API-key
# env reads and config-PATH reads stay legal.
#
# This is a RATCHET: existing violations are grandfathered by the sha256 baseline
# at src/omnibase_core/validation/baselines/url_authority_baseline.json in the
# omnibase_core package. Any NEW violation (fingerprint absent from the baseline)
# fails the job and blocks merge. The baseline is burn-down only.
#
# To permit a legitimate literal, annotate the line:
#   # url-authority-ok: <concrete reason>
#
# Migration debt ticket: OMN-12808
#
# This job is a REQUIRED STATUS CHECK. The job name "URL Authority Gate" must
# match branch protection rules.

name: URL Authority Gate

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [main, dev]
  merge_group:

permissions:
  contents: read

jobs:
  occ-preflight:
    name: OCC Preflight Dependency
    runs-on: ubuntu-latest
    permissions:
      checks: read
      contents: read
    steps:
      - name: Wait for required OCC preflight
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -uo pipefail

          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "OCC preflight dependency is enforced by the pull_request gate; continuing for ${GITHUB_EVENT_NAME}."
            exit 0
          fi

          # OMN-14343: desynchronize the ~33 same-PR pollers (one per workflow file
          # -- GH Actions `needs:` can't cross workflow-file boundaries) so they
          # don't all hit the Checks API in the same instant every 10s and exhaust
          # the shared per-repo GitHub App installation rate-limit bucket.
          sleep "$(( RANDOM % 15 ))"

          backoff=5
          elapsed=0
          deadline=720

          while [ "$elapsed" -lt "$deadline" ]; do
            # NOTE(OMN-14343): GH Actions runs run: steps under `bash -e {0}` by
            # default -- that -e is already active before this script's own
            # `set -uo pipefail` runs, and `set -uo pipefail` does NOT clear an
            # inherited -e. A bare `response="$(gh api ...)"; status=$?` would
            # therefore abort the whole step on ANY gh api failure before status
            # is ever checked, silently defeating the retry logic below. Using
            # the command substitution as the condition of this `if` is the
            # errexit-safe form -- bash does not trigger -e for a command that is
            # part of an if/while/until condition, regardless of ambient -e state.
            response=""
            status=0
            for page in $(seq 1 5); do
              if page_response="$(
                gh api "repos/${REPO}/commits/${HEAD_SHA}/check-runs?filter=latest&per_page=100&page=${page}" \
                  --jq 'first(.check_runs[] | select(.name == "occ-preflight / eligibility") | .conclusion) // ""' \
                  2>&1
              )"; then
                status=0
                if [ -n "$page_response" ]; then
                  response="$page_response"
                  break
                fi
              else
                status=$?
                response="$page_response"
                break
              fi
            done

            if [ "$status" -ne 0 ]; then
              if echo "$response" | grep -qi "rate limit"; then
                echo "::warning::gh api rate-limited waiting for occ-preflight; backing off ${backoff}s."
                sleep "$backoff"
                elapsed=$((elapsed + backoff))
                backoff=$(( backoff * 2 < 60 ? backoff * 2 : 60 ))
                continue
              fi
              echo "::error::gh api call failed (non-rate-limit): ${response}"
              exit 1
            fi
            backoff=5

            conclusion="$response"

            case "$conclusion" in
              success)
                echo "OCC preflight passed for ${HEAD_SHA}."
                exit 0
                ;;
              failure|cancelled|timed_out|action_required|startup_failure)
                echo "::error::OCC preflight concluded ${conclusion}; refusing to start this workflow."
                exit 1
                ;;
              "")
                echo "Waiting for occ-preflight / eligibility to post for ${HEAD_SHA}..."
                ;;
              *)
                echo "OCC preflight is ${conclusion}; waiting."
                ;;
            esac

            sleep 10
            elapsed=$((elapsed + 10))
          done

          echo "::error::Timed out waiting for occ-preflight / eligibility on ${HEAD_SHA}."
          exit 1
  url-authority-gate:
    needs: occ-preflight
    name: URL Authority Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run url-authority gate (full-repo, against frozen baseline)
        run: |
          uv run --with "omnibase-core @ git+https://github.com/OmniNode-ai/omnibase_core.git@a596e248d2ae8a112295f5d9c6558d15e9ebb70f" \
            python -m omnibase_core.validation.validator_url_authority \
            --all --repo omnimarket --repo-root .

      - name: Assert baseline did not grow (anti-gaming)
        run: |
          uv run --with "omnibase-core @ git+https://github.com/OmniNode-ai/omnibase_core.git@a596e248d2ae8a112295f5d9c6558d15e9ebb70f" python - <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path

          # Locate the baseline inside the installed omnibase_core package.
          import omnibase_core.validation.validator_url_authority as _m
          baseline = Path(_m.__file__).parent / "baselines" / "url_authority_baseline.json"
          head = json.loads(baseline.read_text())
          head_repo = {
              e["fingerprint"]
              for e in head["violations"]
              if e["repo"] == "omnimarket"
          }
          # Compare against the baseline on the PR base branch.
          base_ref = "origin/${{ github.base_ref || 'dev' }}"
          try:
              prior_text = subprocess.check_output(
                  ["git", "show", f"{base_ref}:{baseline.relative_to(Path.cwd())}"],
                  text=True,
              )
              prior = json.loads(prior_text)
              prior_repo = {
                  e["fingerprint"]
                  for e in prior["violations"]
                  if e["repo"] == "omnimarket"
              }
          except (subprocess.CalledProcessError, ValueError):
              print(
                  "URL-AUTHORITY BASELINE OK (initial): "
                  f"baseline file is new on this PR ({len(head_repo)} grandfathered "
                  "fingerprints); no prior to compare against."
              )
              sys.exit(0)
          grew = head_repo - prior_repo
          if grew:
              sys.stderr.write(
                  "URL-AUTHORITY BASELINE GREW: "
                  f"{len(grew)} new fingerprint(s) added to the baseline. The baseline "
                  "is burn-down only — fix the violation or annotate with "
                  "# url-authority-ok:, never grow the baseline.\n"
              )
              sys.exit(1)
          print(
              "URL-AUTHORITY BASELINE OK: "
              f"omnimarket subset {len(head_repo)} (<= prior {len(prior_repo)})."
          )
          PY
