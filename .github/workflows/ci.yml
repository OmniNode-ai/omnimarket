        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --locked --all-extras
      - name: Check topic drift (OMN-13331)
        run: |
          echo "================================================================"
          echo "Topic Drift Check (OMN-13331)"
          echo "Validates contract topic format + producer namespaces."
          echo "Cross-repo registry coverage gaps are warn-only."
          echo "================================================================"
          uv run python scripts/ci/check_topic_drift.py

  # ============================================================================
  # MERGE-CHECK REASON-CODE GATE (OMN-14765, epic OMN-14643)
  # Fixture-corpus contract regression gate for the jobs-API-keyed merge-check
  # reason-code classifier (omnimarket.merge_control.reason_code_classifier).
  # Rule-5 enforcement: replays every captured jobs-API fixture through the
  # classifier and fails closed on any mismatch, a shrunk corpus, or a corpus
  # that no longer covers all five reason codes — so a future edit can never
  # silently re-collapse cancelled/stale/infra into product_failed. Stdlib-only
  # (bare setup-python, no uv sync). SYNC with the .pre-commit hook
  # `merge-reason-code-gate` and with the CI Summary strict success-only gate.
  # ============================================================================
  merge-reason-code-gate:
    name: Merge Reason-Code Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Merge-check reason-code fixture-corpus gate (OMN-14765)
        run: python scripts/ci/check_merge_reason_codes.py

  event-registry-drift:
    needs: occ-preflight
    if: always()
    name: Event Registry Drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clone omnibase_core
        run: git clone --depth=1 https://github.com/OmniNode-ai/omnibase_core.git ../omnibase_core
      - name: Clone omnibase_compat
        run: git clone --depth=1 https://github.com/OmniNode-ai/omnibase_compat.git ../omnibase_compat
      - name: Clone omnimemory
        run: git clone --depth=1 https://github.com/OmniNode-ai/omnimemory.git ../omnimemory
      - name: Clone omniclaude
        run: git clone --depth=1 https://github.com/OmniNode-ai/omniclaude.git ../omniclaude
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - name: Set up Python 3.12
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --locked --all-extras
      - name: Validate event registry drift
        run: uv run python -m omnimarket.validators.event_registry_drift --omniclaude-root ../omniclaude

  # ============================================================================
  # RUNTIME SWEEP GATE (OMN-8611)
  # Verifies every onex.nodes entry point in pyproject.toml has a module
  # directory, __init__.py, and contract.yaml. Fails if any are broken.
  # NOTE: This gate must pass on main — land AFTER fix-market-entry-points
  # PR merges (the PR fixing 96 broken entry points).
  # ============================================================================
  runtime-sweep:
    needs: occ-preflight
    if: always()
    name: Runtime Sweep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clone omnibase_core
        run: git clone --depth=1 https://github.com/OmniNode-ai/omnibase_core.git ../omnibase_core
      - name: Clone omnibase_compat
        run: git clone --depth=1 https://github.com/OmniNode-ai/omnibase_compat.git ../omnibase_compat
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - name: Set up Python 3.12
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --locked --all-extras
      - name: Verify entry point wiring
        run: uv run python -m omnimarket.nodes.node_runtime_sweep --import-check

  # ============================================================================
  # COMPLIANCE SWEEP GATE (OMN-14541, class fix, parent OMN-14531)
  # Handler contract compliance sweep (hardcoded topics, undeclared transport
  # imports, orphaned MISSING_HANDLER_ROUTING handlers, logic-in-node) as a
  # required, fail-closed CI gate — enforcement, not detection (Rule 5).
  # Scope: this checkout only (--target-dirs .), collected by real harness
  # code (the checkout root), never an operator-typed repo name. The sweep
  # itself refuses to report a verdict (status=error, exit 1) when the scan
  # scope resolves to zero handlers and zero contracts — a scanned-nothing
  # scope can never be reported clean (the class defect this gate closes).
  # ============================================================================
  compliance-sweep:
    needs: occ-preflight
    if: always()
    name: Compliance Sweep
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 (full history) is required so the violation baseline
      # ratchet can resolve the merge-base with the target branch (OMN-14541,
      # org-jam fix) — a shallow clone cannot prove a baseline addition
      # predates this PR.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Clone omnibase_core
        run: git clone --depth=1 https://github.com/OmniNode-ai/omnibase_core.git ../omnibase_core
      - name: Clone omnibase_compat
        run: git clone --depth=1 https://github.com/OmniNode-ai/omnibase_compat.git ../omnibase_compat
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - name: Set up Python 3.12
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --locked --all-extras
      - name: Run handler contract compliance sweep
        run: uv run python -m omnimarket.nodes.node_compliance_sweep --target-dirs .

  # ============================================================================
  # CORE-ONLY-INSTALL GATE (OMN-13446, Phase 5, epic OMN-13442)
  # Local-First Runtime Re-Convergence: RuntimeLocal + the local-runtime protocols
  # are now CORE-RESIDENT (omnibase_core.runtime / omnibase_core.protocols.runtime,
  # relocated from omnibase_infra in OMN-13444, deleted from infra in OMN-13445).
  # This job proves the core-only-install guarantee: a clean venv with
  # omnibase-infra UNINSTALLED can `import omnibase_core.runtime`, resolve
  # RuntimeLocal from core, and run the in-memory harness end-to-end (zero infra).
  # Required via the ci-summary aggregator (Rule 5: enforcement, not detection).
  # ============================================================================
  core-only-install:
    needs: occ-preflight
    if: always()
    name: Core-Only Install Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          version: "latest"
      - name: Set up Python 3.12
        run: uv python install 3.12
      - name: Create clean core-only venv (NO omnibase-infra)
        run: uv venv --python 3.12 .venv-core-only
      - name: Install omnibase-core ONLY (from the pinned core git rev)
        # Install core from the exact rev pinned in pyproject [tool.uv.sources].
        # We deliberately do NOT run `uv sync` (which would pull omnibase-infra)
        # and we never install omnimarket as a package — the harness imports the
        # in-tree handler via PYTHONPATH=src, exercising the real workflow with
        # only core + its transitive deps present.
        run: |
          uv pip install --python .venv-core-only \
            "omnibase-core @ git+https://github.com/OmniNode-ai/omnibase_core.git@db7f341353e598df84629b1c32514c78d554ef57"
      - name: Assert omnibase-infra is genuinely absent
        run: |
          if .venv-core-only/bin/python -c "import importlib.util,sys; sys.exit(0 if importlib.util.find_spec('omnibase_infra') is None else 1)"; then
            echo "OK: omnibase_infra is NOT installed"
          else
            echo "::error::omnibase_infra leaked into the core-only venv — the gate is invalid"
            exit 1
          fi
      - name: Run core-only-install guarantee harness (infra uninstalled)
        env:
          PYTHONPATH: src
        run: .venv-core-only/bin/python scripts/ci/core_only_install_harness.py

  # ============================================================================
  # E2E WORKFLOW RUNNER (inmemory bus)
  # Proves the deterministic node platform works end-to-end on every PR:
  #   - onex node CLI loads a real workflow contract
  #   - RuntimeLocal starts EventBusInmemory, subscribes to terminal topic
  #   - Handler executes and runtime writes workflow_result.json
  #   - Exit code 0 = COMPLETED, evidence on disk
  # No Kafka or Postgres required.
  # ============================================================================

  e2e-workflow-runner:
    name: E2E Workflow Runner (inmemory bus)
    needs: [occ-preflight, zone-filter]
    if: needs.occ-preflight.result == 'success' && (needs.zone-filter.outputs.docs_only != 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - name: Clone omnibase_core
        run: |
          OMNIBASE_CORE_SHA=$(git ls-remote https://github.com/OmniNode-ai/omnibase_core.git HEAD | cut -f1)
          git clone --depth=1 https://github.com/OmniNode-ai/omnibase_core.git ../omnibase_core
          echo "omnibase_core pinned to: $OMNIBASE_CORE_SHA"
      - name: Clone omnibase_compat
        run: |
          OMNIBASE_COMPAT_SHA=$(git ls-remote https://github.com/OmniNode-ai/omnibase_compat.git HEAD | cut -f1)
          git clone --depth=1 https://github.com/OmniNode-ai/omnibase_compat.git ../omnibase_compat
          echo "omnibase_compat pinned to: $OMNIBASE_COMPAT_SHA"
      - name: Clone omnimemory
        run: |
          OMNIMEMORY_SHA=$(git ls-remote https://github.com/OmniNode-ai/omnimemory.git HEAD | cut -f1)
          git clone --depth=1 https://github.com/OmniNode-ai/omnimemory.git ../omnimemory
          echo "omnimemory pinned to: $OMNIMEMORY_SHA"
      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          version: "latest"
      - name: Set up Python 3.12
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --locked --all-extras
      - name: Golden-chain census gate (OMN-14536)
        run: |
          # The golden_chain_sweep node is a pure validator over projected_rows.
          # This step is the HARNESS: node_golden_chain_sweep.census_collector
          # derives the locally-reachable (Group A) chains, drives each one's REAL
          # projection on an in-memory DB, reads the materialized row back, runs
          # the sweep, and exits non-zero unless overall_status==pass AND
          # scanned_count>0. The Group B (cross-repo) chains are routed to
          # omnibase_infra CI — see .github/workflows/golden-chain-crossrepo.yml.
          #
          # OMN-14536: this replaces the prior "workflow E2E" check that gated on
          # workflow_result.json result=='completed' (the workflow RAN) rather
          # than the node's overall_status (its verdict). With projected_rows={}
          # every chain timed out, the node returned overall_status=fail, and CI
          # passed anyway — 0 of 13 chains verified. The gate now reads the verdict.
          set -o pipefail
          RESULT=$(mktemp)
          uv run python -m omnimarket.nodes.node_golden_chain_sweep.census_collector \
            --out "$RESULT" || GATE_EXIT=$?
          GATE_EXIT=${GATE_EXIT:-0}
          echo "--- census gate result ($RESULT) ---"
          # Fail-closed cross-check on the emitted JSON (belt-and-suspenders on
          # top of the collector's own exit code): overall_status must be pass,
          # scanned_count must be > 0, and the derived split must cover the whole
          # registry (no chain silently dropped from the denominator).
          python3 - "$RESULT" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          hr = d["handler_result"]
          status = hr["overall_status"]
          scanned = hr["scanned_count"]
          reachable = set(d["reachable"]); routed = set(d["routed_to_omnibase_infra"])
          print(d["coverage_boundary"])
          errs = []
          if scanned <= 0:
              errs.append(f"scanned_count={scanned} (nothing observed — vacuous)")
          if status != "pass":
              errs.append(f"overall_status={status} (not pass)")
          if not reachable:
              errs.append("Group A (reachable) is empty — no chain is verified here")
          if reachable & routed:
              errs.append(f"chain(s) in BOTH buckets: {sorted(reachable & routed)}")
          if errs:
              for e in errs:
                  print(f"::error::golden-chain census gate: {e}")
              sys.exit(1)
          print(f"golden-chain census gate GREEN: overall_status=pass, scanned_count={scanned}, "
                f"reachable={len(reachable)}, routed_to_infra={len(routed)}")
          PY
          if [ "${GATE_EXIT}" -ne 0 ]; then
            echo "::error::census collector exited ${GATE_EXIT}"
            exit 1
          fi
  # ============================================================================
  # GOLDEN CHAIN SUITE
  # Runs all 1,000+ golden chain tests (EventBusInmemory, zero infra) on every PR.
  # These are the platform's canonical correctness proof:
  #   - FSM state machines (build loop, close-out, observe, full modes)
  #   - Event pub/sub field-level assertions through EventBusInmemory
  #   - Handler round-trips: publish -> subscribe -> validate field values
  #   - Circuit breaker, metrics accumulation, mode branching
  # Separate from the main test job so it shows as its own required gate.
  # ============================================================================

  golden-chains:
    name: Golden Chain Suite (inmemory bus)
    needs: [occ-preflight, zone-filter]
    if: needs.occ-preflight.result == 'success' && (needs.zone-filter.outputs.docs_only != 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clone omnibase_core
        run: git clone --depth=1 https://github.com/OmniNode-ai/omnibase_core.git ../omnibase_core
      - name: Clone omnibase_compat
        run: git clone --depth=1 https://github.com/OmniNode-ai/omnibase_compat.git ../omnibase_compat
      - name: Clone omnimemory
        run: git clone --depth=1 https://github.com/OmniNode-ai/omnimemory.git ../omnimemory
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - name: Set up Python 3.12
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --locked --all-extras
      - name: Run golden chain suite
        run: |
          uv run pytest             tests/test_golden_chain_*.py             tests/unit/nodes/test_golden_chain_*.py             tests/nodes/*/test_golden_chain_*.py             -v --tb=short -q -m "not kafka"             --junit-xml=golden-chain-results.xml
      - name: Upload golden chain results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: golden-chain-results
          path: golden-chain-results.xml

  # ============================================================================
  # SEA ACCEPTANCE + SESSION-DEFECT ERROR CHAINS (OMN-12660)
  # Runs the SEA e2e acceptance chain and all session-defect error chains
  # (D3/D9/D1+D2/D4/F1) on every dev-targeting PR.
  # Promotion to main blocks when any of these chains fail.
  # Zero infra required — all chains use inmemory sweep assertions.
  # ============================================================================

  sea-e2e-chains:
    name: SEA E2E Acceptance + Error Chains (OMN-12660)
    needs: [occ-preflight, zone-filter]
    if: needs.occ-preflight.result == 'success' && (needs.zone-filter.outputs.docs_only != 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clone omnibase_core
        run: git clone --depth=1 https://github.com/OmniNode-ai/omnibase_core.git ../omnibase_core
      - name: Clone omnibase_compat
        run: git clone --depth=1 https://github.com/OmniNode-ai/omnibase_compat.git ../omnibase_compat
      - name: Clone omnimemory
        run: git clone --depth=1 https://github.com/OmniNode-ai/omnimemory.git ../omnimemory
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - name: Set up Python 3.12
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --locked --all-extras
      - name: Run SEA acceptance chain and session-defect error chains
        run: |
          uv run pytest \
            tests/integration/golden_chain/test_sea_acceptance_chain.py \
            -v --tb=short -m "not kafka" \
            --junit-xml=sea-e2e-chain-results.xml
      - name: Upload SEA chain results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sea-e2e-chain-results
          path: sea-e2e-chain-results.xml

  # ============================================================================
  # GENERATED-NODE GOLDEN-CHAIN GATE (OMN-13624)
  # Dedicated required gate for the self-extension loop golden-chain tests.
  # Runs the two canonical proofs for the node-generation pipeline:
  #   - test_golden_chain_generation_self_extension.py  (§D2 loop proof)
  #   - test_golden_chain_generated_node_publish_effect.py  (§publish chain)
  # Separate from the broad golden-chains job so failures surface explicitly
  # against the generation/SEA nodes rather than buried in the full suite.
  # Zero infra required — all assertions use injected fakes and sandbox exec.
  # Wired as: ci.yml BLOCKING gate + pre-commit hook (Operating Rule #5).
  # ============================================================================

  generated-node-golden-chain:
    name: Generated-Node Golden Chain Gate (OMN-13624)
    needs: [occ-preflight, zone-filter]
    if: needs.occ-preflight.result == 'success' && (needs.zone-filter.outputs.docs_only != 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clone omnibase_core
        run: git clone --depth=1 https://github.com/OmniNode-ai/omnibase_core.git ../omnibase_core
      - name: Clone omnibase_compat
        run: git clone --depth=1 https://github.com/OmniNode-ai/omnibase_compat.git ../omnibase_compat
      - name: Clone omnimemory
        run: git clone --depth=1 https://github.com/OmniNode-ai/omnimemory.git ../omnimemory
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - name: Set up Python 3.12
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --locked --all-extras
      - name: Run generated-node golden-chain tests
        run: |
          uv run pytest \
            tests/test_golden_chain_generation_self_extension.py \
            tests/test_golden_chain_generated_node_publish_effect.py \
            -v --tb=short -m "not kafka" \
            --junit-xml=generated-node-golden-chain-results.xml
      - name: Upload generated-node golden-chain results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: generated-node-golden-chain-results
          path: generated-node-golden-chain-results.xml

  # ============================================================================
  # GATE AGGREGATOR
  # Required status check for branch protection and merge queue.
  # ============================================================================

  # ============================================================================
  # DEP-HEALTH GATE (OMN-11063) — phased rollout
  # Phase 1 (advisory): no baseline → continue-on-error, exit 0.
  # Phase 2 (active):   baseline exists → delta-block new CRITICAL findings.
  # Phase 3+ ratchet:   raise threshold as baseline shrinks over time.
  # DEAD_IMPORT pass remains advisory until scanner confidence is proven.
  # ============================================================================
  # ============================================================================
  # uv.lock git-SHA pin reachability (OMN-14449)
  #
  # Lives HERE, in ci.yml, and is wired into the ci-summary rollup below --
  # NOT as a standalone workflow. A separate workflow file gets a separate
  # run_id, and the only required check on dev is `CI Summary`, whose poller is
  # run_id-scoped: a standalone job is structurally invisible to it and can
  # never block a merge (OMN-14415). A gate that cannot block is decoration.
  #
  # It clones each pinned sibling FRESH, because `git branch -r --contains`
  # reports a deleted branch's commit as reachable on any clone that fetched it
  # before deletion. The naive check is green on every developer's machine and
  # on nothing else -- CI is the only place it can tell the truth (OMN-14447).
  # ============================================================================
  uv-lock-pin-reachability:
    needs: occ-preflight
    if: always()
    name: uv.lock Pin Reachability
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Clone pinned sibling repos (FRESH -- no stale refs possible)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/clones"
          repos=$(python3 - <<'PY'
          import re, pathlib
          text = pathlib.Path("uv.lock").read_text()
          pat = r'git\s*=\s*"https://github\.com/[\w-]+/([\w-]+)\.git\?rev=[0-9a-f]{40}'
          print("\n".join(sorted(set(re.findall(pat, text)))))
          PY
          )
          for r in ${repos}; do
            git clone --quiet "https://x-access-token:${GH_TOKEN}@github.com/OmniNode-ai/${r}.git" \
              "${RUNNER_TEMP}/clones/${r}" \
              || echo "::warning::could not clone ${r}; it will be SKIPped"
          done

      - name: Assert every git-SHA pin is reachable from a remote branch
        run: |
          python3 scripts/ci/check_uv_lock_pin_reachability.py \
            --lock uv.lock \
            --clones-root "${RUNNER_TEMP}/clones"

  dep-health:
    needs: occ-preflight
    if: always()
    name: Dependency Health Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          version: "latest"
      - name: Install dependencies
        run: uv sync --locked --extra dep-health
      - name: Check baseline exists (phase detection)
        id: phase
        run: |
          if [ -f ".onex_state/dep_health_baseline.json" ]; then
            echo "has_baseline=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_baseline=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Dep-health sweep (advisory — no baseline)
        if: steps.phase.outputs.has_baseline == 'false'
        continue-on-error: true
        run: |
          uv run python scripts/ci/run_dep_health_sweep.py \
            --repo-roots src \
            --severity-threshold CRITICAL \
            --dry-run
      - name: Dep-health sweep (Phase 2 — delta-block new CRITICAL)
        if: steps.phase.outputs.has_baseline == 'true'
        run: |
          uv run python scripts/ci/run_dep_health_sweep.py \
            --repo-roots src \
            --severity-threshold CRITICAL \
            --baseline-path .onex_state/dep_health_baseline.json \
            --delta-mode

  contract-compliance:
    needs: occ-preflight
    name: Contract Compliance Check
    runs-on: ubuntu-latest
    if: needs.occ-preflight.result == 'success' && (github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.event_name == 'push')
    steps:
      - uses: actions/checkout@v6
      - name: Checkout onex_change_control
        uses: actions/checkout@v6
        with:
          repository: OmniNode-ai/onex_change_control
          path: onex_change_control

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: 'onex_change_control/uv.lock'

      - name: Install onex_change_control
        working-directory: onex_change_control
        run: uv sync --locked --all-extras

      - name: Validate contract YAML files
        working-directory: onex_change_control
        run: |
          CONTRACTS=$(find "$GITHUB_WORKSPACE/onex_change_control/contracts" -name "OMN-*.yaml" 2>/dev/null)
          if [ -z "$CONTRACTS" ]; then
            echo "No contract YAML files found — skipping validation"
            exit 0
          fi
          uv run validate-yaml $CONTRACTS
        env:
          GH_TOKEN: ${{ github.token }}

  # ============================================================================
  # CONTRACT SWEEP GATE (OMN-14542, class fix, parent OMN-14531)
  # node_contract_sweep (`nodes/*/contract.yaml` field/topic/node_type compliance)
  # previously had ZERO CI/pre-commit caller anywhere and its ContractSweepRequest
  # defaulted `repos` to an empty list, which the handler silently reinterpreted as
  # "scan whatever top-level omni_home dirs happen to have a src/" — a prior receipt
  # reported 9 contracts checked clean while 941 actually existed (~1% coverage).
  #
  # This job wires scripts/ci/run_contract_sweep_gate.py as a REQUIRED gate. The
  # script derives the census (--repos) from its own on-disk location (never an
  # operator-typed value) and independently re-counts contract.yaml files via a
  # second, separately-implemented filesystem probe, then asserts the node's own
  # scanned_count matches that independent count and is > 0. Any narrowing
  # (scanned_count mismatch), any empty scope (scanned_count == 0), or an
  # unresolvable OMNI_HOME is a HARD, BLOCKING failure — this is what actually
  # closes the "9 vs 941" defect.
  #
  # SCOPE — the pre-existing field/topic/node_type backlog (5 major, 21 minor as
  # of the gate landing) was paid down under OMN-14544: the 5 major violations
  # (2 contracts missing contract_version/node_version, node_emit_daemon's
  # invalid node_type) were fixed at the source, and the 21 minor violations
  # were re-classified — `onex.snapshot.*` is a real, cross-repo-established
  # projection-broadcast topic kind (verified in use across omnimarket,
  # omnidash, onex_change_control, omnibase_infra, omnibase_core, and
  # omniintelligence), not 21 naming mistakes, so the separate
  # `_SNAPSHOT_TOPIC_RE` accepts it. The corpus is now a real, enforced zero — this job passes
  # --strict so any NEW violation fails closed.
  # ============================================================================
  contract-sweep-gate:
    needs: occ-preflight
    if: always()
    name: Contract Sweep Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          version: "latest"
      - name: Install dependencies
        run: uv sync --locked --all-extras
      - name: Run contract sweep scope-invariant gate
        run: uv run python scripts/ci/run_contract_sweep_gate.py --strict

  # ============================================================================
  # AISLOP SWEEP GATE (OMN-13578) — failing-rollup sub-job (Model B, OMN-13574)
  # Detection sweeps that are not pre-merge gates are advisory and get ignored
  # (Operating Rule 5). aislop detection was ABSENT from omnimarket CI; this job
  # makes it a required check by feeding the ci-summary rollup.
  #
  # SCOPE — PR diff only. The omnimarket tree carries pre-existing aislop debt
  # (hardcoded topics, empty impls). A whole-tree hard gate would block every PR
  # on that backlog. Instead this scans only the files a PR changes vs its base,
  # exactly like omnibase_core's `ai-slop-check` and omniclaude's
  # `ai-slop-check (strict, PR diff)` jobs: NEW slop blocks, existing debt does
  # not. A planted violation in a touched file turns this job — and therefore
  # the required CI Summary rollup — red.
  #
  # Uses the canonical scanner check_ai_slop.py from omnibase_core (cloned the
  # same way the other omnimarket jobs clone it) so the rule set stays uniform
  # across repos rather than forking a second omnimarket-local copy.
  # ============================================================================
  aislop-sweep:
    needs: occ-preflight
    if: always()
    name: Aislop Sweep (strict, PR diff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Clone omnibase_core (canonical aislop scanner)
        run: git clone --depth=1 https://github.com/OmniNode-ai/omnibase_core.git ../omnibase_core
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compute changed Python/Markdown files vs PR base
        id: changed
        # BASE_REF is passed via env (not spliced into the script body) so an
        # attacker-controlled ref/filename cannot be expanded as shell code.
        # No --depth on the base fetch: a shallow tip can miss the merge-base on
        # a diverged branch, making the `...` diff over-report files. A full
        # fetch resolves the true merge-base.
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then
            git fetch origin "$BASE_REF" --no-tags
            FILES=$(git diff --name-only "origin/$BASE_REF"...HEAD -- '*.py' '*.md' | tr '\n' ' ')
          else
            FILES=$(git diff --name-only HEAD~1 -- '*.py' '*.md' 2>/dev/null | tr '\n' ' ')
          fi
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
      - name: Check changed files for AI-slop patterns (strict)
        # FILES is passed via env so attacker-controlled filenames (backticks,
        # $(...)) are never spliced into the script source.
        env:
          FILES: ${{ steps.changed.outputs.files }}
        run: |
          if [ -z "$FILES" ]; then
            echo "No changed Python/Markdown files — nothing to scan."
            exit 0
          fi
          # shellcheck disable=SC2086
          python ../omnibase_core/scripts/validation/check_ai_slop.py --strict $FILES

  # ============================================================================
  # COVERAGE SWEEP GATE (OMN-14539) — failing-rollup sub-job.
  # Detection sweeps that are not pre-merge gates are advisory and get ignored
  # (Operating Rule 5). coverage_sweep existed but nothing ever GENERATED the
  # coverage.json artifact it reads — the handler silently `continue`d past a
  # missing one and reported status="clean" (OMN-14531 audit: false green
  # over zero measured modules). This job is the harness that was missing: it
  # generates a real coverage.json for THIS repo's own checkout via
  # `pytest --cov` (scripts/ci/run_coverage_sweep_gate.py), then dispatches
  # node_coverage_sweep against it.
  #
  # COVERAGE BOUNDARY (explicit, OMN-14531 Part 4): this job covers omnimarket
  # only — the fleet-wide 8-repo default scan (sweep_scope.DEFAULT_REPOS)
  # needs those repos checked out and is tracked as follow-up under OMN-14531.
  # What this job DOES guarantee: the sweep can no longer silently pass over
  # an unmeasured scope. Fails when status="error" (no usable coverage
  # artifact was ever produced); existing coverage debt (status="gaps_found")
  # is informational and does not block, matching aislop-sweep's
  # new-vs-existing-debt precedent above.
  # ============================================================================
  coverage-sweep-gate:
    needs: occ-preflight
    if: always()
    name: Coverage Sweep Gate
    runs-on: ubuntu-latest
    # OMN-14645: bound the longest-pole job explicitly. The generation step caps
    # its inner `pytest --cov` at 1800s (30 min) in run_coverage_sweep_gate.py;
    # 40 min leaves headroom for setup (3 clones + `uv sync --all-extras`) while
    # ensuring a wedged/orphaned pytest child can never hold a runner slot for
    # the 360-minute GitHub default. A timeout here surfaces as `cancelled` and
    # is caught fail-closed by the strict CI-Summary check below (never a pass).
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Clone omnibase_core
        run: git clone --depth=1 https://github.com/OmniNode-ai/omnibase_core.git ../omnibase_core
      - name: Clone omnibase_compat
        run: git clone --depth=1 https://github.com/OmniNode-ai/omnibase_compat.git ../omnibase_compat
      - name: Clone omnimemory
        run: git clone --depth=1 https://github.com/OmniNode-ai/omnimemory.git ../omnimemory
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - name: Set up Python 3.12
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --locked --all-extras
      - name: Generate coverage.json and sweep it (OMN-14539)
        run: uv run python scripts/ci/run_coverage_sweep_gate.py --target-dir "$GITHUB_WORKSPACE"
      # OMN-14680: publish the authoritative census so the shadow aggregator can
      # prove same-head parity against it. Additive only — this job's pass/fail
      # is still decided solely by the sweep step above; it remains the
      # merge-blocking authority until the shadow path is proven and cut over.
      - name: Upload authoritative coverage.json (OMN-14680 shadow parity)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-authoritative
          path: coverage.json
          if-no-files-found: warn
          retention-days: 7

  # ============================================================================
  # COVERAGE AGGREGATE — SHADOW (OMN-14680 / merge-flow WS2)
  # SHADOW, NON-BLOCKING: deliberately NOT in ci-summary `needs:`, so it can
  # fail LOUD without wedging a merge. It proves the per-shard coverage
  # artifacts emitted by `test` can be combined ONCE (no second full
  # `pytest --cov`) into a census at parity with the authoritative
  # `coverage-sweep-gate`. Fail-closed on missing/stale/malformed/wrong-head
  # artifacts. The authoritative gate stays the required census until parity
  # holds across enough real PRs to cut over (plan §2 WS2 rollback:
  # "Restore the existing sweep as required if comparison diverges; do not
  # waive coverage.").
  # ============================================================================
  coverage-aggregate-shadow:
    name: Coverage Aggregate (shadow)
    needs: [occ-preflight, detect-changes, test, coverage-sweep-gate]
    # Runs even if `test`/`coverage-sweep-gate` failed (always()) so a partial
    # shard set is surfaced fail-closed; skipped only when detect-changes was
    # (docs-only PRs produce no shards to aggregate).
    if: always() && needs.detect-changes.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Clone omnibase_core
        run: git clone --depth=1 https://github.com/OmniNode-ai/omnibase_core.git ../omnibase_core
      - name: Clone omnibase_compat
        run: git clone --depth=1 https://github.com/OmniNode-ai/omnibase_compat.git ../omnibase_compat
      - name: Clone omnimemory
        run: git clone --depth=1 https://github.com/OmniNode-ai/omnimemory.git ../omnimemory
      - name: Install uv (dependency cache — OMN-14680)
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true
      - name: Set up Python 3.12
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --locked --all-extras
      - name: Download per-shard coverage artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-shard-*
          path: .coverage-artifacts
          merge-multiple: true
      - name: Download authoritative coverage.json (best-effort)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: coverage-authoritative
          path: .coverage-authoritative
      - name: Aggregate + validate + shadow parity (OMN-14680)
        run: |
          uv run python scripts/ci/aggregate_coverage_artifacts.py \
            --artifacts-dir .coverage-artifacts \
            --expected-head "${{ github.sha }}" \
            --split-count "${{ needs.detect-changes.outputs.split_count }}" \
            --target-dir "$GITHUB_WORKSPACE" \
            --compare-to .coverage-authoritative/coverage.json \
            --tolerance 0.5 \
            --max-age-seconds 21600

  # ============================================================================
  # WORKFLOW MODULE-RESOLUTION GUARD (OMN-14176) — failing-rollup sub-job.
  # Every in-repo omnimarket module referenced by a .github/workflows/*.yml step
  # (from X import / import X / python -m X) must resolve under src/omnimarket/.
  # A workflow that imports a deleted node (e.g. node_pr_review_bot, deleted in
  # OMN-13212) previously stayed green while silently no-op'ing and reporting a
  # false CLEAN — nothing proved the module it claims to run still exists. This
  # guard closes that gap. Same-repo scope only; sibling-repo refs (omniintelligence.*,
  # omnibase_*) are cloned at CI runtime and out of scope. Feeds the required
  # ci-summary rollup (Rule 5: enforcement, not detection). Pure stdlib, no uv
  # sync. SYNC with pre-commit hook "workflow-module-refs".
  # ============================================================================
  workflow-module-refs:
    needs: occ-preflight
    if: always()
    name: Workflow Module Resolution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check workflow module references (OMN-14176)
        run: python scripts/ci/check_workflow_module_refs.py

  no-noncanonical-lifecycle-classes:
    name: no-noncanonical-lifecycle-classes
    # OMN-14350: non-canonical lifecycle-class ratchet. Unconditional (no needs/if)
    # so it never skips; wired into the required "CI Summary" via needs: + a strict
    # success-only verdict check (fail-closed on skipped/cancelled/failure).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.8.3"
      - name: Ratchet non-canonical lifecycle-word classes against frozen allowlist (OMN-14350)
        run: |
          uv run --no-project \
            --with 'omnibase-core @ git+https://github.com/OmniNode-ai/omnibase_core@63635097705d832e0ee9c4811093efb31349105c' \
            python -m omnibase_core.validators.no_noncanonical_lifecycle_classes \
            --check-stale \
            --allowlist .onex_ratchets/noncanonical_class_allowlist.yaml \
            src/omnimarket

  # ============================================================================
  # CONTRACT TOPIC GRAPH (OMN-14527 / OMN-14568 / OMN-14582)
  # Static producer/consumer oracle over EVERY topic-declaring package. Moved
  # here from the standalone contract-topic-graph.yml (retired) because GHA
  # `needs:` cannot cross workflow-file boundaries -- CI Summary can only
  # depend on jobs defined in THIS file.
  #
  # OMN-14582 Phase 1: unconditional (no needs/if), mirroring
  # no-noncanonical-lifecycle-classes exactly, so it never silently skips.
  # OMN-14582 Phase 2 / OMN-14640: promoted to the strict success-only slot
  # in ci-summary below (RESULT must be EXACTLY 'success'; skipped/cancelled/
  # failure all block) -- see the strict block in the ci-summary job.
  # ============================================================================
  contract-topic-graph:
    name: contract-topic-graph
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CONTRACT_GRAPH_CHECKOUT_ROOT: ${{ github.workspace }}/.contract-graph-checkouts
    steps:
      # fetch-depth: 0 (full history) is required so the baseline ratchet can
      # resolve the merge-base with the target branch -- a shallow clone
      # cannot prove a baseline addition predates this PR.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      # Census-only siblings (OMN-14568): NOT pip dependencies, just checked
      # out so parse_contract can read their contract.yaml text. See
      # CHECKOUT_PACKAGES / CONTRACT_GRAPH_CHECKOUT_ROOT in
      # contract_topic_graph.py.
      - name: Checkout omniclaude (census-only, full topic coverage)
        uses: actions/checkout@v4
        with:
          repository: OmniNode-ai/omniclaude
          ref: dev
          persist-credentials: false
          path: .contract-graph-checkouts/omniclaude

      - name: Checkout omniintelligence (census-only, full topic coverage)
        uses: actions/checkout@v4
        with:
          repository: OmniNode-ai/omniintelligence
          ref: dev
          persist-credentials: false
          path: .contract-graph-checkouts/omniintelligence

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras

      # Fail closed on ANY missing package -- both the runtime-soundness pair
      # (ACTIVE_RUNTIME_PACKAGES) and the full census scope (GRAPH_PACKAGES).
      # A silent partial here is exactly how OMN-14527 shipped scoped to 3 of
      # 9 topic-declaring packages for months with nothing erroring -- assert
      # completeness loudly so a broken checkout or a dependency change
      # surfaces as a gate failure, never as silence.
      - name: Assert the graph surface is complete (fail closed)
        run: |
          uv run python - <<'PY'
          from omnimarket.validators.contract_topic_graph import (
              GRAPH_PACKAGES,
              discover_contract_roots,
          )

          roots = discover_contract_roots()
          missing = [p for p in GRAPH_PACKAGES if p not in roots]
          if missing:
              raise SystemExit(
                  f"::error::Contract graph is INCOMPLETE — missing {missing}. "
                  "A partial graph reports every cross-package producer as a phantom "
                  "orphan. Restore the dependency/checkout or move this gate."
              )
          print(f"Graph surface complete: {sorted(roots)}")
          PY

      - name: Contract topic graph gate (ratcheted)
        run: uv run python -m omnimarket.validators.contract_topic_graph

      - name: Golden-chain tests (generated per edge)
        run: uv run pytest tests/validators/test_contract_topic_graph.py -q

      - name: Census (informational)
        if: always()
        run: uv run python -m omnimarket.validators.contract_topic_graph --report || true

  # ============================================================================
  # OCC COMPANION MERGED GATE (OMN-15214 canary -> OMN-15221 omniclaude ->
  # OMN-15427 omnimarket)
  #
  # omnimarket was the last CI repo without this gate, and the gap was observed
  # live: omnimarket#1953's body cited `Evidence-Source: OCC#5487`, a companion
  # CLOSED WITHOUT MERGING (superseded by the merged OCC#5497). The canonical
  # arbiter returns FAIL for that body -- but omnimarket CI never ran it, so the
  # PR looked green with a dead evidence citation and nothing noticed.
  #
  # This job polls the PR's LIVE body (not the event payload -- occ-autobind
  # PATCHes Evidence-Source in after the trigger fires) and greens ONLY when
  # EVERY cited OCC companion is MERGED, or every cited OCC commit SHA is an
  # ancestor of onex_change_control dev/main. A companion CLOSED without merging
  # fails immediately (that IS the incident state); an OPEN companion polls and
  # converts to FAIL at the deadline (fail-closed).
  #
  # Enforcement, not detection: registered in STRICT_GATE_JOBS in
  # scripts/ci/ci_summary_gate.py, so the REQUIRED `CI Summary` context cannot
  # go green unless this job is present + completed + success (absent/skipped/
  # cancelled all block). Deliberately NOT a new top-level required context: a
  # context that does not report on every PR shape wedges merges indefinitely
  # under branch protection (see CLAUDE.md, deploy-gate section); the umbrella's
  # check-run always instantiates, so it has no such failure mode.
  #
  # Unconditional (no needs/if) so CI Summary always WAITS for it; internal
  # event scoping no-ops on push/workflow_dispatch (mirrors occ-preflight).
  # GitHub-hosted + pure gh-API polling against a PUBLIC repo
  # (onex_change_control): zero self-hosted/LAN dependency and no cross-repo
  # secret -- the default GITHUB_TOKEN reads public repos. The poll window
  # absorbs autobind mint + companion auto-merge latency instead of converting
  # them into instant reds.
  # ============================================================================
  occ-companion-merged:
    name: OCC Companion Merged Gate (OMN-15214)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      MERGE_GROUP_HEAD_REF: ${{ github.event.merge_group.head_ref }}
      # Poll window (seconds) -- bounded well under ci-summary's 90m deadline so
      # this gate reaches a terminal state first; PENDING converts to FAIL.
      DEADLINE_SECONDS: "1500"
      POLL_INTERVAL_SECONDS: "30"
    steps:
      - name: Checkout (gate script)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - name: Require every cited OCC companion to be merged before product merge
        run: python3 scripts/ci/check_occ_companion_merged.py

  ci-summary:
    name: CI Summary
    # OMN-14127 fan-out: REQUIRED branch-protection context, implemented as a
    # NO-`needs`, GitHub-hosted, FAIL-CLOSED poller (ported from omnibase_core
    # #1397 / omnibase_infra #2230 / omniclaude #1870 — omnimarket was the last
    # `needs`-gated ci-summary on the fleet). A `needs`-gated job gets no
    # check-run until its `needs` terminalize, so under self-hosted fleet
    # saturation the old needs-based CI Summary (needs: [occ-preflight,
    # zone-filter, lint, ...28 upstream jobs]) was ABSENT forever and the PR
    # wedged BLOCKED with no auto-recovery. With NO `needs` this job's check-run
    # instantiates immediately (the required context can never be absent); it
    # polls the current run's job conclusions and posts a terminal
    # success/failure within a bounded deadline. DEFAULT-DENY: green ONLY when
    # every strict/skippable gate is present+good, the dynamic test matrix ran
    # to completion, AND no non-allowlisted job failed — see
    # scripts/ci/ci_summary_gate.py for the auditable gating set + strict/
    # skippable split + soft-allowlist (unit-tested in
    # tests/unit/scripts/ci/test_ci_summary_gate.py). Pure hosted GitHub-API
    # polling: zero self-hosted/LAN dependency. DO NOT rename — the job name IS
    # the required context; a rename re-wedges every PR.
    #
    # COVERAGE HONESTY: this poller summarizes ci.yml jobs ONLY. ~38 other
    # required contexts (Hostile Review Gate, deploy-gate, OCC Emitter Golden
    # Gate, receipt-honesty, ...) are produced by OTHER workflow files, are
    # independently required, and are NOT summarized here — see
    # UNSUMMARIZED_REQUIRED_CONTEXTS in the gate script. The name does not imply
    # whole-PR coverage.
    runs-on: ubuntu-latest
    if: always()
    permissions:
      actions: read
      contents: read
    # Deadline (below) is comfortably under any run-cancellation window so the
    # required context ALWAYS posts a terminal state first. The concurrency
    # group above does NOT cancel-in-progress, so on pull_request there is
    # effectively no shorter cancel window than GitHub's job default. This job
    # timeout is only a hard backstop above the internal poll deadline.
    timeout-minutes: 100
    steps:
      - name: Checkout (gate script)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - name: Checkout head gate script
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: .ci-summary-head
          sparse-checkout: scripts/ci/ci_summary_gate.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Restore head gate script
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
        run: cp .ci-summary-head/scripts/ci/ci_summary_gate.py scripts/ci/ci_summary_gate.py
      - name: Poll run jobs and compute fail-closed CI Summary verdict
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          # Bounded poll window (minutes) — kept under the run-cancel window so
          # the required context always reaches a terminal state first.
          DEADLINE_MINUTES: "90"
          POLL_INTERVAL_SECONDS: "45"
        run: |
          # GitHub invokes this step as `bash -e {0}`; disable errexit because
          # the gate script's non-zero exit codes are handled explicitly below
          # (2 = PENDING must NOT terminate the poll loop).
          set +e
          set -uo pipefail
          deadline=$(( $(date +%s) + DEADLINE_MINUTES * 60 ))
          attempt=0
          while true; do
            attempt=$((attempt + 1))
            if ! gh api --paginate \
                "repos/${GH_REPO}/actions/runs/${RUN_ID}/jobs?filter=all&per_page=100" \
                --jq '.jobs[]' | jq -s '.' > jobs.json; then
              if [ "$(date +%s)" -ge "${deadline}" ]; then
                echo "::error::CI Summary poll deadline (${DEADLINE_MINUTES}m) reached while fetching jobs — failing closed"
                exit 1
              fi
              echo "gh api fetch failed (attempt ${attempt}); retrying after ${POLL_INTERVAL_SECONDS}s"
              sleep "${POLL_INTERVAL_SECONDS}"
              continue
            fi
            python3 scripts/ci/ci_summary_gate.py --jobs-file jobs.json --run-attempt "${RUN_ATTEMPT}"
            rc=$?
            case "${rc}" in
              0) echo "::notice::CI Summary = SUCCESS (all gating jobs provably passed)"; exit 0 ;;
              1) echo "::error::CI Summary = FAILURE (fail-closed: a gating job failed/cancelled)"; exit 1 ;;
              2) : ;;  # PENDING — gating jobs still running; keep polling
              *) echo "::error::ci_summary_gate.py returned unexpected code ${rc}; failing closed"; exit 1 ;;
            esac
            if [ "$(date +%s)" -ge "${deadline}" ]; then
              echo "::error::CI Summary poll deadline (${DEADLINE_MINUTES}m) reached with gating jobs still pending — failing closed"
              python3 scripts/ci/ci_summary_gate.py --jobs-file jobs.json --run-attempt "${RUN_ATTEMPT}" --report-only || true
              exit 1
            fi
            sleep "${POLL_INTERVAL_SECONDS}"
          done
