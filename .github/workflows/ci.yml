name: CI

on:
  push:
    branches: [main, 'hotfix/**']
  pull_request:
    branches: [main, dev]
    # OMN-16217: default types (opened/synchronize/reopened) don't retrigger
    # on a draft->ready flip. `ready_for_review` is added so undrafting a PR
    # re-evaluates the draft-state admission gate on the current head without
    # requiring a new push — see coverage-sweep-gate's `if:` below.
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:

# OMN-14645: single-flight per ref, QUEUE — never cancel — an older candidate.
# The coverage-sweep-gate was the longest-pole job (3 fresh sibling clones +
# `uv sync --all-extras` + full `pytest --cov`; since OMN-18556 it aggregates
# shard artifacts and the full run moved to nightly-full-suite.yml), so any run-wide cancel almost
# always catches it mid-flight; the resulting `cancelled` result rolls the
# required "CI Summary" red and wedges the PR (mergeStateStatus=BLOCKED).
# `cancel-in-progress: false` means a newer run on the SAME ref WAITS for the
# in-flight one to reach a terminal result instead of cancelling it — so a
# running sweep is allowed to finish. The group is keyed by ref, so different
# PRs (and main / merge_group) never block each other.
#
# SCOPE / HONESTY: this guards same-ref push/synchronize churn only. It does
# NOT stop an external `gh run rerun` on the SAME run id (a rerun is not a new
# workflow run and is not subject to `concurrency`), which was the verified
# driver of the 2026-07-15 cancel storm on #1754/#1758/#1774. Halting that
# driver is an operational action, not a YAML change (see PR body).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # =============================================================================
  # Per-run runner routing (OMN-18031)
  # =============================================================================
  # Decides ONCE PER RUN which runs-on label set a consuming job below should
  # use, from live org-runner capacity and the most recent lab load record. The
  # decision is not made here and no threshold is written here: this job calls
  # the cross-repo reusable landed by OMN-18423, which checks omnibase_infra out
  # at its own pinned commit and invokes `node_ci_runner_route_compute`. This
  # repository vendors no routing module and carries no routing policy file, so
  # there is no second copy of the decision to drift.
  #
  # THE SEAM IS READ AS A CEILING AND NEVER WRITTEN. Routing may only ever
  # DOWNGRADE from what OMNI_TRUSTED_CI_RUNS_ON_JSON already allows; nothing in
  # this change writes any Actions variable at any scope, which is the
  # single-owner rule (omni_home CLAUDE.md rule 14) that a read-modify-write
  # from a second lane silently violates.
  #
  # IT IS INERT TODAY AND THAT IS THE POINT. omnimarket is PUBLIC and its
  # trusted seam reads '["ubuntu-latest"]' at both org and repository scope
  # (read live 2026-09-18), so the node returns the seam verbatim with decision
  # `seam_ceiling_hosted` and the consuming job lands exactly where it landed
  # before. The proof this change carries is that a job's runs-on RESOLVED FROM
  # THE ROUTE OUTPUT -- never that anything moved onto the lab fleet. Changing
  # placement is a separate single-owner claim on the seam and is not this
  # ticket.
  #
  # FAIL-CLOSED ON ANY PROBE ERROR. The reusable's decide step carries a floor:
  # if the interpreter itself cannot run, it still emits hosted labels with a
  # `probe_error:` reason rather than an empty string, because an empty runs-on
  # makes every consuming job fail to SCHEDULE -- a failure with no log to read.
  # A missing capacity token is the same class: the probe reports it and the
  # decision is hosted. Read the reason, not the job's colour.
  # RUNNER_FLEET_STATUS_TOKEN is not set on this repository or the org today;
  # it is declared optional by the reusable and its absence resolves hosted,
  # which is already the seam ceiling here.
  #
  # ONE CONSUMER IS WIRED: `js-toolchain-hermetic`. It is the only job in this
  # file that is simultaneously (a) placed by the shared V1 seam expression
  # rather than a hardcoded label, (b) unconditional -- no `needs:`, no `if:`,
  # so it runs on every pull_request, merge_group and push event and the
  # consumer is exercised constantly, (c) not container-backed, unlike
  # `Customer Path Boundary (OMN-18012)`, whose placement is deliberately
  # governed by OMNI_DOCKER_CI_RUNS_ON_JSON AHEAD of the trusted seam so a
  # broker-starting gate can be moved separately from the hermetic bulk, and
  # (d) not lane-bound: `scripts/ci/check_lane_job_placement.py` refuses a
  # variable-driven placement for a job whose correctness depends on WHERE its
  # runner sits, and its LANE_BOUND_JOBS map names only
  # delegation-regression-nightly.yml's `golden-tasks`, no job in this file.
  # EVERY OTHER JOB HERE IS UNTOUCHED and keeps its existing placement
  # expression; a survey of the routing repos found no prior use of this wiring
  # at fan-out scale, so widening it in one step would put the whole fleet on
  # one unproven shape.
  #
  # `needs: route` on the consumer is load-bearing twice: without the edge the
  # `needs.route.outputs` expression resolves to nothing and the job fails to
  # SCHEDULE, which does not surface as a red check; and the route job is
  # fail-closed, so a probe fault yields hosted labels rather than a red gate.
  #
  # Registered in scripts/ci/ci_summary_gate.py STRICT_GATE_JOBS as
  # "Runner Route (OMN-18031) / route" -- the display name the jobs API returns
  # for a reusable-workflow caller that sets `name:` (verified against live
  # omnibase_infra run 35337599072). THAT REGISTRATION IS HALF THE MECHANISM:
  # this repo's merge gate is the "CI Summary" poller, and an unregistered job
  # that is `skipped` or absent yields SUCCESS -- so without it, deleting this
  # job would silently retire the routing decision on a green run, the same
  # silent-retirement shape the "Event Chain Gate" entry already documents
  # there.
  route:
    name: Runner Route (OMN-18031)
    uses: OmniNode-ai/omniclaude/.github/workflows/route-runner-reusable.yml@b6ba84ef6c9ba3f220204c3d672de1da5131132c
    with:
      workflow_path: .github/workflows/ci.yml
    secrets:
      RUNNER_FLEET_STATUS_TOKEN: ${{ secrets.RUNNER_FLEET_STATUS_TOKEN }}
      CROSS_REPO_PAT: ${{ secrets.CROSS_REPO_PAT }}

  # OCC preflight is the first non-OCC CI dependency. If central OCC
  # evidence is missing or red, no runner-heavy validation jobs fan out.
  occ-preflight:
    name: OCC Preflight Dependency
    runs-on: ubuntu-latest
    permissions:
      checks: read
      contents: read
    steps:
      - name: Wait for required OCC preflight
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -uo pipefail

          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "OCC preflight dependency is enforced by the pull_request gate; continuing for ${GITHUB_EVENT_NAME}."
            exit 0
          fi

          # OMN-14343: desynchronize the ~33 same-PR pollers (one per workflow file
          # -- GH Actions `needs:` can't cross workflow-file boundaries) so they
          # don't all hit the Checks API in the same instant every 10s and exhaust
          # the shared per-repo GitHub App installation rate-limit bucket.
          sleep "$(( RANDOM % 15 ))"

          backoff=5
          elapsed=0
          deadline=720

          while [ "$elapsed" -lt "$deadline" ]; do
            # NOTE(OMN-14343): GH Actions runs run: steps under `bash -e {0}` by
            # default -- that -e is already active before this script's own
            # `set -uo pipefail` runs, and `set -uo pipefail` does NOT clear an
            # inherited -e. A bare `response="$(gh api ...)"; status=$?` would
            # therefore abort the whole step on ANY gh api failure before status
            # is ever checked, silently defeating the retry logic below. Using
            # the command substitution as the condition of this `if` is the
            # errexit-safe form -- bash does not trigger -e for a command that is
            # part of an if/while/until condition, regardless of ambient -e state.
            response=""
            status=0
            if response="$(
              gh api "repos/${REPO}/commits/${HEAD_SHA}/check-runs?filter=latest&check_name=occ-preflight%20%2F%20eligibility&per_page=1" \
                --jq 'first(.check_runs[] | .conclusion) // ""' \
                2>&1
            )"; then
              status=0
            else
              status=$?
            fi

            if [ "$status" -ne 0 ]; then
              if echo "$response" | grep -qi "rate limit"; then
                echo "::warning::gh api rate-limited waiting for occ-preflight; backing off ${backoff}s."
                sleep "$backoff"
                elapsed=$((elapsed + backoff))
                backoff=$(( backoff * 2 < 60 ? backoff * 2 : 60 ))
                continue
              fi
              echo "::error::gh api call failed (non-rate-limit): ${response}"
              exit 1
            fi
            backoff=5

            conclusion="$response"

            case "$conclusion" in
              success)
                echo "OCC preflight passed for ${HEAD_SHA}."
                exit 0
                ;;
              failure|cancelled|timed_out|action_required|startup_failure)
                echo "::error::OCC preflight concluded ${conclusion}; refusing to start heavy CI."
                exit 1
                ;;
              "")
                echo "Waiting for occ-preflight / eligibility to post for ${HEAD_SHA}..."
                ;;
              *)
                echo "OCC preflight is ${conclusion}; waiting."
                ;;
            esac

            sleep 10
            elapsed=$((elapsed + 10))
          done

          echo "::error::Timed out waiting for occ-preflight / eligibility on ${HEAD_SHA}."
          exit 1
  # Zone filter — short-circuit heavy jobs on docs / declarative-evidence PRs.
  # Calls the reusable workflow in omnibase_core. Outputs docs_only (true|false).
  zone-filter:
    needs: occ-preflight
    if: always()
    uses: OmniNode-ai/omnibase_core/.github/workflows/zone-filter.yml@7631ef3321e1a6561f4b2c70019ee57d24160620
    with:
      python-version: "3.12"

  # OMN-16662: DOCS-ONLY MARKER.
  #
  # This job carries exactly one bit — "zone-filter classified every changed
  # path as DOCS" — into a place the `ci-summary` poller can actually see it.
  #
  # Why it has to exist at all: `ci-summary` is a NO-`needs` poller by design
  # (OMN-14127 — a `needs`-gated job gets no check-run until its needs
  # terminalize, which is exactly how the old gate went ABSENT under fleet
  # saturation and wedged PRs BLOCKED with 0 failing / 0 pending). It reads
  # `actions/runs/{id}/jobs`, and job OUTPUTS are not in that payload. So it
  # cannot consume `needs.zone-filter.outputs.docs_only` the way omnibase_core's
  # `quality-gate` does (OMN-16625). A JOB, however, is in that payload — hence
  # this marker.
  #
  # FAIL-CLOSED BY CONSTRUCTION: `ci_summary_gate.py` treats ONLY
  # completed+success here as docs_only=true. On any ordinary code PR this `if:`
  # is false, the job reports `skipped`, and every gate stays strict. Absent,
  # in_progress, skipped, cancelled and failure all mean "not docs-only".
  #
  # Deliberately NOT a `mode: REQUIRED` row in .github/required-checks.yaml: it
  # is a conditional job by nature, and registering it would make the
  # required-check skip-vector guard analyse it as a required context (vector 2)
  # for no benefit — its verdict is only ever read by the poller.
  docs-only-marker:
    needs: [occ-preflight, zone-filter]
    if: always() && needs.zone-filter.outputs.docs_only == 'true'
    name: Docs-Only Marker (OMN-16662)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record docs-only classification
        run: |
          echo "zone-filter classified every changed path as EnumFileZone.DOCS."
          echo "The docs-only skip tier in scripts/ci/ci_summary_gate.py is ACTIVE for this run."
          {
            echo "### Docs-only diff detected"
            echo ""
            echo "Every changed path classified \`EnumFileZone.DOCS\`. The heavy"
            echo "code-verification tier (see \`DOCS_ONLY_SKIPPABLE_GATE_JOBS\`)"
            echo "is allowed to skip; the contract, doc-content and evidence"
            echo "gates still run and must still be green."
          } >> "$GITHUB_STEP_SUMMARY"

  lint:
    needs: occ-preflight
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Clone omnibase_core
        run: git clone --depth=1 https://github.com/OmniNode-ai/omnibase_core.git ../omnibase_core
      - name: Clone omnibase_compat
        run: git clone --depth=1 https://github.com/OmniNode-ai/omnibase_compat.git ../omnibase_compat
      - name: Clone omnimemory
        run: git clone --depth=1 https://github.com/OmniNode-ai/omnimemory.git ../omnimemory
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - name: Set up Python 3.12
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --locked --all-extras
      - name: Ruff check
        run: uv run ruff check src/ tests/ benchmarks/
      - name: Ruff format check
        run: uv run ruff format --check src/ tests/ benchmarks/
      - name: Stub implementation check
        run: python ../omnibase_core/scripts/validation/check_stub_implementations.py src/
      - name: TODO format check
        run: |
          pip install onex-change-control 2>/dev/null || pip install ../onex_change_control 2>/dev/null || true
          # Inline check: all TODO/FIXME/HACK must have (OMN-XXXX) ticket reference
          find src/ -name '*.py' -not -path '*/tests/*' | while read -r f; do
            grep -nE '#.*\b(TODO|FIXME|HACK)\b' "$f" 2>/dev/null | grep -vE '\b(TODO|FIXME|HACK)\(OMN-[0-9]+\)' | while read -r line; do
              echo "::error file=${f}::${line} -- bare TODO/FIXME/HACK without ticket reference (use: # TODO(OMN-XXXX): description)"
              echo "FAIL" > /tmp/todo_check_failed
            done
          done
          if [ -f /tmp/todo_check_failed ]; then exit 1; fi
      # NOTE: This step requires PR #75 (OMN-7922, fix legacy contracts) to be merged
      # before it is active in CI. The build_loop_orchestrator handler still contains
      # hardcoded onex.evt.* constants until OMN-7922 migrates them to contract-declared
      # topics. This lint was added in OMN-7921 (branched from PR #76 / OMN-7918).
      - name: Topic-literal guardrail
        run: python scripts/lint_no_hardcoded_topics.py
      # OMN-10909: stricter topic-literal gate — allowlist is topics.py, test_* files,
      # and inline `# onex-topic-allow` annotations (delegation thin-shim plan, Task 8).
      - name: Topic-literal guardrail (annotation allowlist)
        run: uv run python scripts/ci/check_no_hardcoded_topics.py
      # OMN-15833: bare AIOKafkaConsumer/AIOKafkaProducer construction (zero auth
      # kwargs) silently connects PLAINTEXT against a SASL/IAM-only MSK broker —
      # third occurrence of the OMN-14155 class, this time in omnimarket itself.
      # AST call-site check (not file-level substring) so it does not repeat the
      # OMN-14158 bypass. SYNC with pre-commit hook 'aiokafka-construction-auth'.
      - name: Bare aiokafka construction gate (auth kwargs)
        run: uv run python scripts/ci/check_aiokafka_construction_auth.py
      # OMN-13548 (D-03): a projection handler that catches ValidationError must
      # route the malformed event to its contract-declared DLQ topic, not drop it
      # silently. SYNC with pre-commit hook 'projection-dlq-path'.
      - name: Projection-DLQ path gate
        run: uv run python scripts/ci/check_projection_dlq_path.py
      # OMN-16690: a db_io contract's declared table `access` must cover the
      # operations its handler performs. A handler that reads for idempotency
      # under `access: write` is refused fail-closed by the runtime and every
      # event is quarantined while the caller still sees a 202 — invisible to
      # isolation tests, which inject fakes with no access enforcement. SYNC
      # with pre-commit hook 'projection-contract-access'.
      - name: Projection contract-access gate
        run: uv run python scripts/ci/check_projection_contract_access.py
      # OMN-17446: a REGISTRY-shaped projection (its relation is resolved
      # against by another node's `ALTER COLUMN ... TYPE ... USING` conversion,
      # or by a shared write-path module another node imports) must not be fed
      # only by a time-retained topic. tenant_registry_mirror was, on
      # onex.tenant.events at 168h, so four of five historical tenants could
      # never be materialized and migration 0034's own pre-guard could never
      # pass. Fails closed on a topic whose cleanup class cannot be
      # established. SYNC with pre-commit hook 'registry-projection-reconcile'.
      - name: Registry-projection reconcile gate
        run: uv run python scripts/ci/check_registry_projection_reconcile.py
      # OMN-18774: refuse a GUC-predicated RLS policy, or a tenant_id column,
      # on a relation its own contract declares omninode_internal or
      # platform_catalog -- the operator ruled on 2026-09-14 that internal
      # relations receive no tenant stamping and no row-level security
      # (docs/tracking/ROLLING_WORK_LEDGER.md:654). SYNC with pre-commit hook
      # 'internal-relation-tenant-posture'.
      - name: Internal-relation tenant-posture gate
        run: uv run python scripts/validation/check_internal_relation_tenant_posture.py
      # OMN-14285 (WI-1 / S1d): exactly one OCC companion producer. Fails if a
      # second writer surface (inline receipt/contract template outside the
      # occ_evidence_stamp seam, duplicate OccCompanionEmitter, or a resurrected
      # scaffold_occ_receipt.py) reappears. SYNC with pre-commit hook
      # 'one-occ-producer'.
      - name: One OCC producer per contract
        run: uv run python scripts/ci/check_one_occ_producer.py
      # OMN-18304: one self-bind SHAPE, per-entry bound. The sibling gate above
      # keeps a second producer from appearing; this one keeps the single
      # producer from emitting a whole-file-only self-bind, which is stale by
      # construction on any ticket with more than one companion. The positive
      # control runs first and deliberately: a clean pass from a check that
      # cannot fail is not evidence. SYNC with pre-commit hook
      # 'occ-self-bind-entry-binding'.
      - name: OCC self-bind entry-binding gate (positive control)
        run: uv run python scripts/ci/check_self_bind_entry_binding.py --self-test
      - name: OCC self-bind entry-binding gate
        run: uv run python scripts/ci/check_self_bind_entry_binding.py
      - name: Reject node-level topics.py files
        run: |
          FOUND=$(find src/omnimarket/nodes -name "topics.py" -path "*/node_*/*" 2>/dev/null)
          if [ -n "$FOUND" ]; then
            echo "ERROR: topics.py files found in node directories. Topic bindings must come from contract.yaml."
            echo "$FOUND"
            exit 1
          fi
          echo "OK: No node-level topics.py files found."
      - name: ONCP node metadata dependency scope
        run: uv run python scripts/ci/check_node_metadata_dependencies.py
      # OMN-14762 (F-18): keep the authoritative coverage-json invocation
      # (pytest-cov, config-driven) aligned with the shadow aggregator's
      # `coverage json -i` so a missing C-extension source can never red one gate
      # while the other stays green. SYNC with pre-commit hook 'coverage-ignore-parity'.
      - name: Coverage-json ignore-errors parity gate
        run: uv run python scripts/ci/check_coverage_ignore_parity.py
      # OMN-14762 (F-19-A): action-pin ratchet — every third-party `uses:` must be
      # pinned to a 40-char SHA; the current unpinned set is frozen in
      # scripts/ci/action_pin_baseline.txt (burn-down only) and NEW unpinned refs
      # fail closed. SYNC with pre-commit hook 'check-action-pins'.
      - name: GitHub Actions pin ratchet
        run: uv run python scripts/ci/check_action_pins.py
      # SYNC: Pre-commit hook 'validate-no-env-fallbacks' at pre-commit stage (OMN-10738)
      # Prevents silent fallback to localhost defaults via os.getenv/os.environ.get
      - name: Validate no silent env fallbacks
        run: uv run python scripts/validation/validate_no_env_fallbacks.py
      # SYNC: OMN-10926 — delegation env read scanner in enforce mode (Wave 2)
      # Fails CI if any delegation/LLM/bifrost module adds a new os.environ/os.getenv read.
      - name: Delegation env read scanner (enforce)
        run: uv run python scripts/ci/check_delegation_env_reads.py --mode enforce
      # OMN-12856: GitHub-token env-read gate. Fails CI if any omnimarket source
      # reads GH_PAT/GH_TOKEN/GITHUB_TOKEN via os.environ/os.getenv directly.
      # After OMN-12856 the canonical path is contract_secret_ref + resolve_api_key.
      # SYNC with pre-commit hook 'github-token-env-gate'.
      - name: GitHub-token env-read gate (enforce)
        run: uv run python scripts/ci/check_github_token_env_reads.py
      # OMN-17372: house inference-credential gate. Fails CI if a delegation
      # backend re-declares `api_key_env`, or if any omnimarket source reads a
      # house provider key from the process environment (bare os.environ, or
      # the resolver's `env_var_fallback`, which bypasses the lane secret
      # mapping on its way to os.environ). OmniNode does not offer inference
      # and there are no keyless customers on the cloud: a credential resolves
      # from its secret_ref through the managed store, per-tenant scoped, or
      # the delegation refuses rather than borrowing the house account.
      # SYNC with pre-commit hook 'house-inference-credential-gate'.
      - name: House inference-credential gate (enforce)
        run: uv run python scripts/ci/check_backend_secret_discipline.py
      # OMN-12821 (plan A1.5): routing-authority demo gate. Proves the demo path
      # (generation + delegation) resolves provider/model/endpoint_ref/endpoint/
      # route_source from contract+authority AND that no demo-path source reads
      # env for endpoint/provider/model, hardcodes a provider literal, or reads a
      # fallback endpoint string. Fails CI on any hardcoded/env path on the demo path.
      # OMN-13285 (W6/GAP-3): ported to the canonical core COMPUTE validator
      # (replaces the deleted omnimarket-local scripts/ci/check_routing_authority.py).
      - name: Routing-authority demo gate (enforce)
        run: uv run python -m omnibase_core.validation.validator_routing_authority --repo omnimarket --repo-root .
      # OMN-12964: Quality-gate calibration. Fails CI if the delegation quality
      # gate score distribution collapses (degenerate {0.0,1.0}) or fails to
      # discriminate known-good from known-bad outputs. A meaningless quality
      # signal masquerades as an ON/OFF effect and invalidates Experiments 1-3.
      - name: Quality-gate calibration (enforce)
        run: uv run python scripts/ci/run_quality_gate_calibration.py
      # OMN-13290: backend secret-ref / credential-ref discipline. Fails CI if a
      # literal credential value lands in routing-authority config, or if an
      # authenticated cloud backend lacks a logical secret/credential ref. Keeps
      # the Vertex ADC path (and all cloud backends) value-free in committed config.
      # Sourced from omnibase_core (ported from the deleted local OMN-12971 script).
      - name: Backend secret-discipline gate (enforce)
        run: >-
          uv run python -m omnibase_core.validators.backend_secret_discipline
          src/omnimarket/configs/bifrost_delegation.yaml
          src/omnimarket/configs/routing_tiers.yaml
          src/omnimarket/data/model_registry/model_registry_v1.yaml
      # OMN-15630: routing-completeness invariant. For every task class declared
      # in task_class_contracts.v1.yaml, every tier in that class's OWN
      # escalation_policy.tier_order must be served by >=1 backend's use_for,
      # evaluated through the REAL _select_model_for_task with
      # contract_model_ref=None so the default_task_model_ref implicit pin
      # cannot mask a gap. Also covers the id_matches[0] silent-wrong-
      # capability-bind closure (implicit default pin no longer selects a
      # model that does not declare the task type; explicit
      # task_model_overrides pins, OMN-10942/OMN-13140, are unaffected).
      # SYNC with pre-commit hook 'routing-completeness-gate'.
      - name: Routing-completeness invariant gate (OMN-15630)
        run: uv run pytest tests/unit/delegation/test_routing_completeness_omn15630.py -q
      # OMN-16856: enforcing surface for ARCH-002's OMNI_HOME example. Runs here,
      # not only in the smart-selected suite, because the test imports no src
      # module and so is never selected by a change to the file that regresses.
      # SYNC with pre-commit hook 'omni-home-no-silent-default'.
      - name: OMNI_HOME no-silent-default gate (OMN-16856)
        run: uv run pytest tests/test_omni_home_no_silent_default_omn16856.py -q -p no:randomly
      # OMN-18300: the delegation task-complexity ladder. Wired here in the same
      # change that introduces it, per the enforcement-not-detection rule: these
      # tests assert that every committed bundle parses and names real fixtures,
      # that each rung carries four tasks, that no diagnosis task can be passed by
      # echoing its own trace, that the mutation and pre-fix controls actually
      # discriminate, and that no complexity threshold has drifted out of the
      # contract into code. They run nothing against any model.
      - name: Delegation ladder harness + complexity rubric (OMN-18300)
        run: uv run pytest benchmarks/delegation_ladder/tests/ -q
      # OMN-13530: every operation_match (or absent-strategy) handler_routing
      # entry must declare a non-empty 'operation' field. A missing operation
      # makes the contract fail closed at RuntimeLocal startup ('handlers[i].
      # operation is missing' / result=failed) — the 0.46.0 regression that
      # took down the headless automation fleet. SYNC with pre-commit hook
      # 'operation-match-requires-operation'.
      - name: operation_match operation-field gate (enforce)
        run: uv run python -m omnibase_core.validators.operation_match_requires_operation src/omnimarket
      # OMN-12972 (plan P2.7): Gemini registry/version hygiene. Every provider:google
      # registry entry + its bifrost backend must align with the live Vertex-served
      # model name PER ENVIRONMENT (Vertex = publisher-qualified, AI Studio = bare)
      # and carry no retired/404 model id (the gemini-2.0-flash-on-Vertex failure).
      # SYNC with pre-commit hook "gemini-registry-version-hygiene".
      - name: Gemini registry/version hygiene gate (enforce)
        run: uv run python scripts/ci/check_model_registry_served_names.py
      # OMN-10821: Handler* classes in handler_*.py with zero external import references
      # cannot be wired by the DI container and are silently absent from the pipeline.
      - name: Unimported-handler check
        run: uv run python scripts/ci/check_unimported_handlers.py
      # OMN-12942: node migration sets must create base tables before views.
      # A view-before-base-table migration hard-fails the forward-migration
      # runner on a clean node-set apply. SYNC with pre-commit hook
      # 'migration-base-before-view'.
      - name: Migration base-before-view gate
        run: uv run python scripts/ci/check_migration_base_before_view.py
      # OMN-12959: FSM terminal-state invariant. Watchdog topic literals
      # (workflow-timeout/unroutable/stalled) may only live in the canonical
      # omnimarket.events.topics registry (omnimarket.events.watchdog imports
      # them and exposes the typed authority); orchestrators must resolve them
      # through the typed EnumWatchdogEventType authority. Fails CI on any
      # hardcoded watchdog topic string outside the registry.
      - name: Watchdog-topic authority gate
        run: uv run python scripts/ci/check_watchdog_topic_authority.py
      # OMN-17017 (A10 step 1): contract-vs-handler publish parity. The wave
      # scheduler declared five publish topics while its Python contained zero
      # publish/Envelope/event_bus references — the contract described a system
      # that did not exist. Burn-down ratchet; a NEW offender fails closed.
      # SYNC with pre-commit hook 'contract-publish-parity-gate'.
      - name: Contract publish parity gate
        run: uv run python scripts/ci/check_contract_publish_parity.py
      # OMN-13026: Transport-mock lint. Bare AsyncMock/MagicMock without
      # spec=/spec_set= on EventBus/transport/kafka surfaces. Ratchet: existing
      # violations frozen in validation/transport_mock_baseline.yaml. New
      # violations in any PR are blocked. Drain tracked by per-site tickets.
      # SYNC with pre-commit hook 'transport-mock-lint'.
      # Invoked via PYTHONPATH so it uses the sibling clone (already cloned
      # earlier in this job) rather than the uv-locked pin.
      - name: Transport-mock lint (OMN-13026)
        run: |
          uv run python \
            -m omnibase_core.validators.transport_mock_lint \
            --baseline validation/transport_mock_baseline.yaml \
            tests/
      - name: Golden-chain coverage gate
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ] && [ -n "$PR_BASE_SHA" ]; then
            base="$PR_BASE_SHA"
            git fetch --no-tags --depth=1 origin "$base" || true
          else
            base="$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)"
          fi
          uv run python scripts/ci/check_golden_chain_coverage.py --changed-ref "$base"
      # OMN-15909: a diff touching a projection write-path surface
      # (node_projection_*/handlers/** or projection/runner.py) must ship an
      # accompanying real-Postgres @pytest.mark.integration test in the same
      # diff. Enforcement-only presence check (Operating Rule #5), same shape
      # as the golden-chain-coverage gate above -- closes the mock-DB blind
      # spot that let OMN-15905's str-where-datetime TIMESTAMPTZ defect merge:
      # tests/test_omn15905_delegation_projection_writer_seam.py drove the
      # same write path against an AsyncMock DB, which accepts a str param
      # just as happily as a real datetime -- only live asyncpg enforces
      # column types.
      - name: Projection write-path real-DB gate (OMN-15909)
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ] && [ -n "$PR_BASE_SHA" ]; then
            base="$PR_BASE_SHA"
            git fetch --no-tags --depth=1 origin "$base" || true
          else
            base="$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)"
          fi
          uv run python scripts/ci/check_projection_write_path_db_gate.py --changed-ref "$base"
      # OMN-15797 AC3 rule 2 -- the complement to OMN-15801's no-db-outside-
      # runtime gate: that one enforces WHO may open a connection, this one
      # enforces that a surface legitimately holding one did not forget the
      # tenant seam on a statement against an RLS-covered relation. Postgres
      # RLS fails OPEN from the caller's side (unset app.tenant_id -> NULL
      # predicate -> zero rows, no error), which is how the original OMN-15797
      # blinding survived undetected and how OMN-16092's fail-open ROI read was
      # only found months later by hand. --selftest runs first so a gate that
      # can no longer fire fails the build instead of reporting clean.
      - name: RLS tenant-seam gate (OMN-15797)
        run: |
          uv run python scripts/ci/check_rls_read_tenant_seam.py --selftest
          uv run python scripts/ci/check_rls_read_tenant_seam.py
      # Canonical handler-shape GROWTH RATCHET fan-out (OMN-14355/OMN-14368/OMN-14372).
      # compliance_sweep checks handler hygiene but is blind to handler SHAPE, so a
      # non-canonical handler passes green CI. This classifies each omnimarket node's
      # contract-declared handler (definition B: typed-payload handle(request)->
      # response, adapted by the shared runtime, no envelope in the core), WARNs the
      # committed baseline's debt (scripts/ci/canonical_handler_shape_baseline.py),
      # and HARD-FAILS a NEW non-canonical node or baseline growth. Sourced from the
      # already-cloned sibling omnibase_core checkout (same pattern as "Stub
      # implementation check" above) since the classifier lives at omnibase_core's
      # repo-root scripts/ci/, not the installed package. Runs --full (not the
      # default --scope changed): the classifier's diff-scoped git-diff runs with
      # cwd = the classifier's OWN repo (omnibase_core parents[2]), which is wrong
      # for a fan-out invocation against this sibling checkout, so --full avoids
      # that mismatch (this job's classification is cheap: ~365 nodes, sub-second).
      # No pre-commit mirror yet: pre-commit's language:python remote-hook install
      # only ships the installed src/omnibase_core/ package (verified — the
      # classifier isn't importable that way), and language:script has no dep
      # isolation (needs pydantic/pyyaml); see OMN-14563 for the real fix
      # (relocate the classifier into an installed omnibase_core module). This
      # CI-only pattern already matches several sibling gates in this same job
      # list (compliance-sweep, runtime-sweep, aislop-sweep, coverage-sweep-gate).
      - name: Canonical handler-shape ratchet (OMN-14355 fan-out)
        run: |
          uv run python ../omnibase_core/scripts/ci/canonical_handler_shape.py \
            --package omnimarket --src-root src \
            --baseline scripts/ci/canonical_handler_shape_baseline.py \
            --receipts-dir scripts/ci/adequacy_receipts \
            --full

      # Fail-closed flip-bundle SEAM gate fan-out (OMN-14809 / OMN-15340 / OMN-15344).
      # The ratchet above proves a node's SHAPE. It is structurally blind to whether the
      # PROOF a flip carries is coherent, and — since OMN-15340 — to whether the declared
      # hand-flip parity tests are RED-for-the-right-reason at the receipt's own base_ref.
      # A parity test that is ALREADY GREEN on the pre-change tree discriminates nothing,
      # and the flip is credited with a behavior proof it never earned.
      #
      # That mechanism shipped in omnibase_core#1519 but ran in omnibase_core's CI ONLY,
      # while ALL 22 committed hand-flip receipts live in this repo (7) and
      # omnimarket/omnibase_infra — zero coverage over 100% of the population it was
      # built for. This step wires it HERE, in the same job, from the sibling
      # ../omnibase_core checkout already cloned above: no new job, no new workflow, no new
      # hook (net-negative-surface). Flags mirror the ratchet's so it reads THIS repo's
      # tree/receipts/baseline, not the ephemeral core checkout's — same --receipts-dir
      # reason as OMN-14633 above.
      #
      # NOT path-filtered, deliberately. The gate self-scopes to nodes NEWLY flipped vs
      # origin/dev and exits 0 when there are none (measured 2.4s on .200), so an
      # everyday PR pays nothing; a path filter on a fail-closed proof gate is a bypass.
      #
      # It also enforces scripts/ci/parity_red_on_base_baseline.py as a SHRINK-ONLY
      # ratchet: growth hard-fails, a stale entry hard-fails, and removing an entry
      # re-arms assertion 7 for that node and EXECUTES it. The inline fetch makes
      # origin/dev's tip available for flip-discovery (this checkout is shallow); the
      # gate NOTEs and exits 0 if it is still unavailable, exactly as in core.
      - name: Canonical-shape flip-bundle seam gate (OMN-15344 fan-out)
        run: |
          git fetch --no-tags --prune origin +refs/heads/dev:refs/remotes/origin/dev || true
          uv run python ../omnibase_core/scripts/ci/verify_flip_bundle.py \
            --package omnimarket --src-root src \
            --baseline scripts/ci/canonical_handler_shape_baseline.py \
            --receipts-dir scripts/ci/adequacy_receipts

      # OMN-14617: fleet-wide fan-out of the omnibase_infra OMN-14135 dispatch-ENTRYPOINT
      # gate. A contract-declared handler exposing NEITHER handle() nor handle_async() is
      # bound by the shared auto-wiring to _missing_handle, which raises ModelOnexError on
      # EVERY dispatch — while the contract validates, the node boots, and CI stays green
      # (node_pattern_b_broker's AdapterPatternBBroker* shipped exactly this way, caught
      # only by manual OMN-14605 triage and fixed under OMN-14616/#1769). Registration and
      # routing do NOT imply executability. Self-contained repo-local validator (the
      # infra copy is not in a released omnibase-infra wheel), same spirit as
      # omnimarket.validators.event_registry_drift. The validator fails closed under a
      # non-vacuity floor (MIN_EXPECTED_DECLARED_HANDLERS) so a collapsed scan cannot pass
      # silently (OMN-14541). Ratchet frozen in
      # validation/handler_dispatch_entrypoint_baseline.yaml and is shrink-only.
      # SYNC with pre-commit hook 'handler-dispatch-entrypoint'.
      - name: Handler dispatch-entrypoint gate (OMN-14617 fan-out)
        run: PYTHONPATH=src uv run python -m omnimarket.validators.handler_dispatch_entrypoint src/omnimarket

      # ======================================================================
      # BRANCH-SAFETY GATE (OMN-14768 / friction F-11 + F-12; F-12 flip: OMN-14773)
      # Folded into the `lint` job — which is in ci.yml's required "CI Summary"
      # rollup `needs:` — so F-11, F-12, and the self-tests are ALL GENUINELY
      # blocking on every PR class. F-12 was advisory (continue-on-error) at first
      # to avoid wedging an already-open ticket-split PR (#1811, now CLOSED); with
      # no open omnimarket PR tripping it, the tolerance was removed (OMN-14773).
      #
      # WHY NOT A STANDALONE WORKFLOW: a separate workflow file gets its own
      # run_id and CANNOT be aggregated into CI Summary (GHA `needs:` cannot
      # cross workflow-file boundaries), and it is NOT in the dev
      # required_status_checks (["CI Summary","reason-graph","OCC Emitter Golden
      # Gate"]). The standalone "Branch-safety gate" workflow that shipped in
      # #1810 was therefore ADVISORY — it could not block a merge without a
      # separate branch-protection required-context flip. Running these checks
      # HERE, as `lint` steps, makes F-11 part of the already-required CI Summary
      # with no paths filter and no job-level `if` — enforcement, not detection
      # (Operating Rule #5). The standalone branch-safety-gate.yml is retired in
      # this follow-up PR — net-negative surface. SYNC with the two pre-commit
      # hooks check-branch-rename-prohibited / check-branch-identity-tests.
      #
      # F-11 (rename prohibition): renaming an OPEN PR's head branch CLOSES the PR
      # (the omnidash#258 class). Fails closed if any branch-rename invocation is
      # introduced anywhere in the merge-controller node tree.
      - name: Branch-safety F-11 — branch-rename prohibition (merge-controller tree)
        run: uv run python scripts/ci/check_branch_identity.py --mode rename-scan
      # Self-tests run here too so a passing rename-scan of the real tree is never
      # vacuous (a planted rename is proven to fail — positive controls).
      - name: Branch-safety gate self-tests (positive controls — non-vacuous)
        run: uv run pytest tests/ci/test_check_branch_identity.py -q -p no:randomly
      # F-12 (Evidence-Ticket branch identity): front-runs the Receipt Gate's late
      # branch-name failure — on a PR it asserts the head branch references every
      # `Evidence-Ticket: OMN-XXXX` in the PR body, reusing the Receipt Gate's own
      # regexes so the two cannot drift. PR-only (needs the PR body/head ref).
      #
      # BLOCKING (OMN-14773): the `continue-on-error: true` that made this step
      # advisory was removed once the only open PR that tripped it (#1811 — branch
      # `…omn-14765…`, `Evidence-Ticket: OMN-14769`) closed and no open omnimarket
      # PR remained to wedge. Because this step runs inside the `lint` job that
      # feeds the required "CI Summary" rollup, removing the tolerance makes F-12
      # merge-blocking with NO branch-protection change — it folds into the
      # existing `CI Summary` required context (enforcement, not detection —
      # Operating Rule #5). Pre-flip green proof: rename-scan clean, self-tests
      # green, identity mode green vs dev (no Evidence-Ticket to bind) and vs a
      # branch that references its Evidence-Ticket; a mismatched branch fails
      # rc=1 (non-vacuous negative control). It is also BLOCKING at pre-commit
      # (hook `check-branch-identity-tests`). A legitimate ticket-split PR must
      # name the branch for the sub-ticket whose `Evidence-Ticket:` it carries
      # (or fold that convention into `branch_binds_ticket`).
      - name: Branch-safety F-12 — Evidence-Ticket branch identity (PR only, blocking)
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          printf '%s' "$PR_BODY" > /tmp/pr_body.txt
          uv run python scripts/ci/check_branch_identity.py \
            --mode identity --branch "$HEAD_REF" --body-file /tmp/pr_body.txt

  typecheck:
    needs: [occ-preflight, zone-filter]
    if: needs.occ-preflight.result == 'success' && (needs.zone-filter.outputs.docs_only != 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clone omnibase_core
        run: git clone --depth=1 https://github.com/OmniNode-ai/omnibase_core.git ../omnibase_core
      - name: Clone omnibase_compat
        run: git clone --depth=1 https://github.com/OmniNode-ai/omnibase_compat.git ../omnibase_compat
      - name: Clone omnimemory
        run: git clone --depth=1 https://github.com/OmniNode-ai/omnimemory.git ../omnimemory
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - name: Set up Python 3.12
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --locked --all-extras
      - name: Mypy strict
        run: uv run mypy src/omnimarket/ --strict

  # ---------------------------------------------------------------------------
  # Detect Changes — emits matrix for test job (OMN-10759)
  # ---------------------------------------------------------------------------
  detect-changes:
    name: Detect Changes
    needs: [occ-preflight, zone-filter]
    if: needs.occ-preflight.result == 'success' && (needs.zone-filter.outputs.docs_only != 'true')
    runs-on: ubuntu-latest
    outputs:
      is_full_suite: ${{ steps.detect.outputs.is_full_suite }}
      full_suite_reason: ${{ steps.detect.outputs.full_suite_reason }}
      split_count: ${{ steps.detect.outputs.split_count }}
      matrix: ${{ steps.detect.outputs.matrix }}
      selected_paths: ${{ steps.detect.outputs.selected_paths }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install pyyaml + pydantic (lightweight, no full sync needed)
        run: |
          uv venv --python 3.12
          uv pip install pyyaml pydantic

      - name: Compute changed files
        id: diff
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            git fetch --no-tags --depth=1 origin "$base" || true
            git diff --name-only "$base"...HEAD > changed.txt
          else
            git diff --name-only HEAD~1 HEAD > changed.txt || echo "" > changed.txt
          fi
          echo "Changed files:"
          cat changed.txt

      - name: Resolve test selection
        id: detect
        env:
          FLAG: ${{ vars.ENABLE_SMART_TESTS == 'true' && 'on' || 'off' }}
        run: |
          . .venv/bin/activate
          python -m scripts.ci.detect_test_paths \
            --changed-files-from changed.txt \
            --ref-name "${{ github.ref_name }}" \
            --event-name "${{ github.event_name }}" \
            --feature-flag "$FLAG" \
            > selection.json
          cat selection.json
          is_full=$(python -c "import json; d=json.load(open('selection.json')); print(str(d['is_full_suite']).lower())")
          reason=$(python -c "import json; d=json.load(open('selection.json')); print(d['full_suite_reason'] or '')")
          split_count=$(python -c "import json; d=json.load(open('selection.json')); print(d['split_count'])")
          matrix=$(python -c "import json; d=json.load(open('selection.json')); print(json.dumps(d['matrix']))")
          paths=$(python -c "import json; d=json.load(open('selection.json')); print(json.dumps(d['selected_paths']))")
          echo "is_full_suite=$is_full" >> "$GITHUB_OUTPUT"
          echo "full_suite_reason=$reason" >> "$GITHUB_OUTPUT"
          echo "split_count=$split_count" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "selected_paths=$paths" >> "$GITHUB_OUTPUT"

  test:
    name: Tests (Split ${{ matrix.split }}/${{ needs.detect-changes.outputs.split_count }})
    needs: [occ-preflight, detect-changes]
    runs-on: ubuntu-latest
    # OMN-18405: no timeout-minutes meant a stuck shard fell back to GitHub's
    # implicit 360m job default. Measured p95 across 524 successful shards
    # (last 30 successful ci.yml runs, 2026-09-15) is 7.8m, which looked like
    # it supported a 30m ceiling (p95 rounded up +10m, floored at 30m) --
    # but that statistic conflated two different job shapes under one name.
    # A workflow-only change (like this one) makes the impacted-test selector
    # select the whole `tests/` tree with split_count=1 -- one unsplit job
    # running virtually the entire suite serially, not a parallel shard. This
    # was caught live: the first version of this fix set timeout-minutes: 30
    # and its own PR's Tests (Split 1/1) job was killed by that ceiling at
    # 53% (run 35003874837, job 104513593515), a real full-suite run in
    # progress, not a hang. The two >30m outliers in the p95 sample (73.1m,
    # 34.3m) were this same single-job full-suite shape, not noise.
    # 90m covers the observed max full-suite duration (73.1m) with margin,
    # while still bounding the actual defect this ticket fixes: the 2h05m
    # hang on run 34988591973 that starved PR #2565's successor run through
    # this workflow's non-cancelling concurrency group (OMN-14645; left
    # unchanged here -- see the workflow-level `concurrency:` block near the
    # top of this file).
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        split: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    # OMN-14167: real Postgres service so @pytest.mark.integration real-DB tests
    # (e.g. tests/test_projection_delegation_tier_distribution_omn13662.py's
    # `..._against_real_postgres` proof) actually EXECUTE instead of silently
    # skipping. Without a broker they self-skip, which produced a false green:
    # that gap let the OMN-14058 delegation_events tenant_id missing-column
    # defect reach dev. Image + wiring mirror the omnibase_infra
    # migration-integration job (postgres:16-alpine, ephemeral 5432/tcp,
    # pg_isready health-check).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: omnibase_infra
        ports:
          - 5432/tcp
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Clone omnibase_core
        run: git clone --depth=1 https://github.com/OmniNode-ai/omnibase_core.git ../omnibase_core
      - name: Clone omnibase_compat
        run: git clone --depth=1 https://github.com/OmniNode-ai/omnibase_compat.git ../omnibase_compat
      - name: Clone omnimemory
        run: git clone --depth=1 https://github.com/OmniNode-ai/omnimemory.git ../omnimemory
      # OMN-15390 (residual R3): the ONLY cross-repo differential in this repo
      # — node_dod_verify's supersession parity against onex_change_control's
      # REAL `contract_compliance_check._superseded_dod_ids` — used to SKIP on
      # every hosted run because no OCC checkout existed here, so the parity
      # claim was proven locally and asserted, never executed, on a PR. OCC is
      # PUBLIC, so the default `github.token` reads it: no new secret, no new
      # permission, and the same `actions/checkout` pattern the
      # `contract-compliance` and `onex-schema-compat` jobs already use.
      # `sparse-checkout: src` skips the contracts/ + drift/ bulk (~25 MB) and
      # takes only the package the differential imports. Kept OFF
      # ONEX_CC_REPO_PATH deliberately: exporting that would re-point
      # EvidenceCollector's contract resolution for every other test in the
      # job. The test finds this path relative to the repo root, and
      # `test_ci_wires_an_occ_checkout_into_the_job_that_runs_this_suite` fails
      # if this step is removed or its path changed.
      - name: Checkout onex_change_control (OCC parity differential)
        uses: actions/checkout@v4
        with:
          repository: OmniNode-ai/onex_change_control
          ref: dev
          path: onex_change_control
          sparse-checkout: src
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - name: Set up Python 3.12
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --locked --all-extras

      # OMN-18693: the shadow-comparison migration proof starts a private,
      # socket-only PostgreSQL 16 cluster through the standard integration
      # connection inputs.  The service container supplies the shared DB
      # fixture, but does not expose initdb/pg_ctl to this runner.  Install the
      # matching server tools and fail before pytest if the required PG16
      # binaries are unavailable; a missing native proof must not self-skip.
      - name: Provision PostgreSQL 16 server tools for native migration proofs
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-16
          pg16_bin=/usr/lib/postgresql/16/bin
          for tool in initdb pg_ctl psql; do
            test -x "${pg16_bin}/${tool}"
          done
          "${pg16_bin}/initdb" --version | grep -Eq 'PostgreSQL\) 16\.'
          echo "${pg16_bin}" >> "$GITHUB_PATH"

      # OMN-14167: resolve the Postgres service host + ephemeral port and export
      # the connection env the integration fixtures read
      # (INTEGRATION_POSTGRES_* / POSTGRES_PASSWORD). Setting POSTGRES_PASSWORD is
      # what flips the real-DB integration tests from "skipped" to "executed".
      # The host-resolution dance mirrors the omnibase_infra migration-integration
      # job so this stays correct on both GitHub-hosted and self-hosted runners.
      - name: Resolve Postgres service host and export integration env
        env:
          POSTGRES_PORT: ${{ job.services.postgres.ports['5432'] }}
        run: |
          host="$(python - <<'PY'
          import os
          import socket

          port = int(os.environ["POSTGRES_PORT"])

          def can_connect(candidate: str) -> bool:
              try:
                  with socket.create_connection((candidate, port), timeout=1.0):
                      return True
              except OSError:
                  return False

          if can_connect("127.0.0.1"):
              print("127.0.0.1")
              raise SystemExit(0)

          with open("/proc/net/route", encoding="utf-8") as routes:
              for line in routes.readlines()[1:]:
                  fields = line.split()
                  if len(fields) >= 3 and fields[1] == "00000000":
                      gateway_hex = fields[2]
                      gateway = ".".join(
                          str(int(gateway_hex[i : i + 2], 16)) for i in (6, 4, 2, 0)
                      )
                      if can_connect(gateway):
                          print(gateway)
                          raise SystemExit(0)

          raise SystemExit(
              f"could not reach Postgres service on localhost or default gateway port {port}"
          )
          PY
          )"
          {
            echo "INTEGRATION_POSTGRES_HOST=${host}"
            echo "INTEGRATION_POSTGRES_PORT=${POSTGRES_PORT}"
            echo "INTEGRATION_POSTGRES_USER=postgres"
            echo "INTEGRATION_POSTGRES_PASSWORD=test_password"
            echo "INTEGRATION_POSTGRES_DB=omnibase_infra"
            echo "POSTGRES_PASSWORD=test_password"
          } >> "$GITHUB_ENV"
          echo "Resolved Postgres integration host=${host} port=${POSTGRES_PORT}"

      - name: Restore test durations cache
        uses: actions/cache/restore@v4
        with:
          path: .test_durations
          key: test-durations-${{ github.sha }}
          restore-keys: |
            test-durations-

      # OMN-14680 (merge-flow WS2): collect coverage IN the shard where the
      # tests already run, writing a per-shard data file to COVERAGE_FILE. The
      # shadow aggregator combines these ONCE instead of the authoritative
      # gate's second full `pytest --cov` pass. `--cov=src --cov-report=`
      # mirrors the authoritative gate's measurement basis exactly (no branch
      # coverage) so the shadow census is comparable.
      - name: Run pytest (smart selection)
        if: vars.ENABLE_SMART_TESTS == 'true' && needs.detect-changes.outputs.is_full_suite == 'false'
        env:
          COVERAGE_FILE: ${{ github.workspace }}/.coverage.${{ matrix.split }}
        run: |
          paths=$(echo '${{ needs.detect-changes.outputs.selected_paths }}' | python -c "import json,sys; print(' '.join(json.load(sys.stdin)))")
          uv run pytest $paths \
            --splits ${{ needs.detect-changes.outputs.split_count }} \
            --group ${{ matrix.split }} \
            --cov=src --cov-report= \
            -v --tb=short -m "not kafka" \
            --timeout=300 --timeout-method=thread \
            --junitxml=junit-${{ matrix.split }}.xml

      - name: Run pytest (full suite)
        if: vars.ENABLE_SMART_TESTS != 'true' || needs.detect-changes.outputs.is_full_suite == 'true'
        env:
          COVERAGE_FILE: ${{ github.workspace }}/.coverage.${{ matrix.split }}
        run: |
          uv run pytest tests/ \
            --splits ${{ needs.detect-changes.outputs.split_count }} \
            --group ${{ matrix.split }} \
            --store-durations \
            --durations-path .test_durations \
            --cov=src --cov-report= \
            -v --tb=short -m "not kafka" \
            --timeout=300 --timeout-method=thread \
            --junitxml=junit-${{ matrix.split }}.xml

      # OMN-14680: stamp a versioned metadata sidecar (head SHA, environment,
      # test-scope, schema) so the shadow aggregator can validate the artifact
      # is head-bound, complete, and schema-current — a missing/stale/wrong-head
      # shard fails the aggregator closed, never a silent under-count.
      - name: Emit coverage artifact metadata (OMN-14680)
        if: always()
        env:
          HEAD_SHA: ${{ github.sha }}
          SPLIT: ${{ matrix.split }}
          SPLIT_COUNT: ${{ needs.detect-changes.outputs.split_count }}
          IS_FULL: ${{ needs.detect-changes.outputs.is_full_suite }}
          SMART_FLAG: ${{ vars.ENABLE_SMART_TESTS }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        # OMN-14762 (F-19-B): emit through the shared producer
        # (scripts/ci/coverage_artifact_metadata.build_shard_metadata) instead of
        # inline python, so the sidecar shape is single-sourced with
        # aggregate_coverage_artifacts.validate_artifacts and proven by
        # tests/ci/test_coverage_artifact_metadata_roundtrip.py — a shape drift now
        # fails a local test, not only downstream CI.
        run: python scripts/ci/emit_coverage_shard_metadata.py

      - name: Upload coverage shard artifact (OMN-14680)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coverage-shard-${{ matrix.split }}
          path: |
            .coverage.${{ matrix.split }}
            coverage-meta-${{ matrix.split }}.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

      - name: Save test durations (full suite only, split 1)
        if: |
          needs.detect-changes.outputs.is_full_suite == 'true' &&
          matrix.split == 1 &&
          success()
        uses: actions/cache/save@v4
        with:
          path: .test_durations
          key: test-durations-${{ github.sha }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-${{ matrix.split }}
          path: junit-${{ matrix.split }}.xml
          retention-days: 7

  # ============================================================================
  # OMN-18790 — skip-count baseline ratchet (epic OMN-18775; ported from
  # omnibase_infra OMN-18776, squash 77ea8d01)
  #
  # A skipped test reports nothing, and a SET of tests that skips on every run
  # reports nothing repeatedly while looking identical to a green suite.
  # Measured 2026-09-18: five per-repo skip counts byte-identical across three
  # consecutive runs each, and 91 PostgreSQL-16 cases collected-and-skipped on
  # every full-matrix run for 49 days with no surface registering it. This
  # repo's `Tests (Split 1/20)` was the 42/42/42 row.
  #
  # This job refuses the GROWTH of that set. It compares the skipped test
  # IDENTITIES in this run's JUnit reports against config/skip_count_baseline.yaml
  # rather than the raw count, because this repo's impacted-test selector varies
  # the collected set: three consecutive full-width runs (35395544621,
  # 35393542842, 35392845454) each reported exactly 259 unique skipped ids with
  # byte-identical sets, but OMN-18790's own first CI run was narrowed to 765
  # collected and 2 unique skips -- a factor of 30, and a count comparison there
  # emits a ratchet-candidate number whose adoption would red every later
  # full-width run. A selector only ever narrows, so a narrowed run's skip set is
  # a subset of the full-width baseline and cannot false-fail, while a newly
  # added environmentally-skipped test is not in the set and turns the run red.
  #
  # Registered in STRICT_GATE_JOBS (scripts/ci/ci_summary_gate.py). THAT LINE IS
  # HALF THE MECHANISM: this repo's merge gate is the `CI Summary` umbrella, and
  # the default-deny sweep there already fails it when a registered job FAILS --
  # but an unregistered job that is `skipped` or ABSENT yields SUCCESS, which is
  # the silent-retirement shape this gate exists to close. The job is
  # unconditional (`if: always()`), so a skip is anomalous and never a
  # legitimate opt-out.
  # ============================================================================
  skip-count-ratchet:
    name: "Skip Count Ratchet (OMN-18776)"
    needs: [detect-changes, test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      # The test matrix legitimately does not run on a docs-only diff, where
      # `detect-changes` is itself docs-only-gated. The verdict on whether a
      # missing matrix was LEGITIMATE already belongs to the `CI Summary`
      # poller, which owns the dynamic-matrix completeness rule
      # (scripts/ci/ci_summary_gate.py, TEST_SPLIT_PREFIX + DETECT_CHANGES_JOB).
      # Re-deriving that judgement here would fork it. This job therefore states
      # the reason and stops, rather than inventing a second opinion or failing
      # a docs-only PR on an artifact that was never meant to exist.
      - name: Decide whether there is a run to ratchet
        id: decide
        env:
          MATRIX_RESULT: ${{ needs.test.result }}
        run: |
          if [ "$MATRIX_RESULT" = "success" ] || [ "$MATRIX_RESULT" = "failure" ]; then
            echo "ratchet=true" >> "$GITHUB_OUTPUT"
            echo "Test matrix result: $MATRIX_RESULT -- JUnit reports expected."
          else
            echo "ratchet=false" >> "$GITHUB_OUTPUT"
            echo "Test matrix result: $MATRIX_RESULT -- no JUnit reports were produced."
            echo "The verdict on whether that skip was legitimate belongs to the"
            echo "CI Summary poller's dynamic-matrix rule. This job does not fork it."
          fi

      - uses: actions/checkout@v4
        if: steps.decide.outputs.ratchet == 'true'

      - name: Install uv
        if: steps.decide.outputs.ratchet == 'true'
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python 3.12
        if: steps.decide.outputs.ratchet == 'true'
        run: uv python install 3.12

      # Retried inside the step rather than by letting a download step fail
      # softly and trying again. The artifact service flakes, but a gate whose
      # input fetch is allowed to fail softly is a gate that passes when it
      # could not read anything -- the whole failure class this job refuses.
      # Three attempts, then red. This job carries no advisory setting at job
      # or step level, deliberately and by test.
      - name: Download this run's JUnit reports
        if: steps.decide.outputs.ratchet == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3; do
            if gh run download "${{ github.run_id }}" \
                 --repo "${{ github.repository }}" \
                 --pattern 'test-results-*' \
                 --dir junit-reports; then
              echo "JUnit reports downloaded on attempt ${attempt}."
              exit 0
            fi
            echo "Artifact download attempt ${attempt} failed."
            rm -rf junit-reports
            sleep $((attempt * 10))
          done
          echo "::error::could not download this run's JUnit reports after 3 attempts."
          echo "Failing closed: a gate that cannot read its input has not passed."
          exit 1

      # Fail-closed: a matrix that ran and produced no parsable report is an
      # uploader silently matching nothing, and a gate that treated it as
      # "nothing to check" would be the very false-green this closes. Every
      # step here is blocking, by construction and by test.
      - name: Enforce the skip-count baseline (OMN-18790)
        if: steps.decide.outputs.ratchet == 'true'
        run: |
          echo "================================================================"
          echo "Skip Count Ratchet (OMN-18776)"
          echo "A test that is collected and never executed proves nothing. This"
          echo "gate refuses the growth of that set against a recorded baseline."
          echo "Lowering the bar is an edit to config/skip_count_baseline.yaml."
          echo "================================================================"
          mapfile -t reports < <(find junit-reports -name '*.xml' -type f | sort)
          if [ "${#reports[@]}" -eq 0 ]; then
            echo "::error::the test matrix ran but produced no JUnit report to read."
            echo "That is an uploader defect, not an empty result -- failing closed."
            exit 1
          fi
          echo "Reading ${#reports[@]} JUnit report(s)."
          uv run --no-project --with pyyaml python scripts/ci/skip_count_ratchet.py \
            --suite omnimarket/test \
            --junit "${reports[@]}"

  # ============================================================================
  # INTEGRATION SILENT-SKIP GUARD (OMN-14172)
  # Fail-closed gate against the silent-skip false-green class. An
  # @pytest.mark.integration real-service test that self-skips because its
  # DB/service/env is absent produces a false-green: the required Tests job
  # reports success while the real-DB assertion never ran. This recurred across
  # repos (OMN-10330 omninode_infra, OMN-14167 omnimarket) and each time hid a
  # genuine latent defect (the OMN-14058 missing-tenant_id-column bug reached
  # dev this way). Detection-only never held; this makes the class mechanically
  # RED (Operating Rule #5: enforcement, not detection).
  #
  # This job PROVISIONS Postgres (mirroring the Tests job, OMN-14167) and runs
  # ONLY the integration-marked tests, then asserts via check_integration_skips.py
  # that (1) none skipped citing a *provisioned* service's absence and (2) at
  # least one integration test actually executed (zero-collection is itself a
  # false-green). Legitimately-optional skips (Kafka broker not provisioned by
  # design, live-LLM / live-e2e opt-in flags) remain allowed — the gate is keyed
  # to the services this job actually provisions (integration_skip_guard.yaml).
  #
  # Wired as: ci.yml BLOCKING gate (via ci-summary rollup) + pre-commit hook
  # 'integration-skip-guard'. SYNC both when the config changes.
  # ============================================================================
  integration-guard:
    name: Integration Silent-Skip Guard (OMN-14172)
    needs: [occ-preflight, zone-filter]
    if: needs.occ-preflight.result == 'success' && (needs.zone-filter.outputs.docs_only != 'true')
    runs-on: ubuntu-latest
    # Same Postgres service block as the Tests job (OMN-14167): a real broker so
    # the @pytest.mark.integration real-DB proofs EXECUTE instead of self-skipping.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: omnibase_infra
        ports:
          - 5432/tcp
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Clone omnibase_core
        run: git clone --depth=1 https://github.com/OmniNode-ai/omnibase_core.git ../omnibase_core
      - name: Clone omnibase_compat
        run: git clone --depth=1 https://github.com/OmniNode-ai/omnibase_compat.git ../omnibase_compat
      - name: Clone omnimemory
        run: git clone --depth=1 https://github.com/OmniNode-ai/omnimemory.git ../omnimemory
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - name: Set up Python 3.12
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --locked --all-extras

      # OMN-18693: the shadow-comparison migration proof starts a private,
      # socket-only PostgreSQL 16 cluster through the standard integration
      # connection inputs.  The service container supplies the shared DB
      # fixture, but does not expose initdb/pg_ctl to this runner.  Install the
      # matching server tools and fail before pytest if the required PG16
      # binaries are unavailable; a missing native proof must not self-skip.
      - name: Provision PostgreSQL 16 server tools for native migration proofs
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-16
          pg16_bin=/usr/lib/postgresql/16/bin
          for tool in initdb pg_ctl psql; do
            test -x "${pg16_bin}/${tool}"
          done
          "${pg16_bin}/initdb" --version | grep -Eq 'PostgreSQL\) 16\.'
          echo "${pg16_bin}" >> "$GITHUB_PATH"

      # Resolve the Postgres service host + ephemeral port and export the
      # connection env the integration fixtures read. Setting POSTGRES_PASSWORD
      # is what flips the real-DB integration tests from "skipped" to "executed"
      # (identical to the Tests job step; host-resolution mirrors omnibase_infra).
      - name: Resolve Postgres service host and export integration env
        env:
          POSTGRES_PORT: ${{ job.services.postgres.ports['5432'] }}
        run: |
          host="$(python - <<'PY'
          import os
          import socket

          port = int(os.environ["POSTGRES_PORT"])

          def can_connect(candidate: str) -> bool:
              try:
                  with socket.create_connection((candidate, port), timeout=1.0):
                      return True
              except OSError:
                  return False

          if can_connect("127.0.0.1"):
              print("127.0.0.1")
              raise SystemExit(0)

          with open("/proc/net/route", encoding="utf-8") as routes:
              for line in routes.readlines()[1:]:
                  fields = line.split()
                  if len(fields) >= 3 and fields[1] == "00000000":
                      gateway_hex = fields[2]
                      gateway = ".".join(
                          str(int(gateway_hex[i : i + 2], 16)) for i in (6, 4, 2, 0)
                      )
                      if can_connect(gateway):
                          print(gateway)
                          raise SystemExit(0)

          raise SystemExit(
              f"could not reach Postgres service on localhost or default gateway port {port}"
          )
          PY
          )"
          {
            echo "INTEGRATION_POSTGRES_HOST=${host}"
            echo "INTEGRATION_POSTGRES_PORT=${POSTGRES_PORT}"
            echo "INTEGRATION_POSTGRES_USER=postgres"
            echo "INTEGRATION_POSTGRES_PASSWORD=test_password"
            echo "INTEGRATION_POSTGRES_DB=omnibase_infra"
            echo "POSTGRES_PASSWORD=test_password"
          } >> "$GITHUB_ENV"
          echo "Resolved Postgres integration host=${host} port=${POSTGRES_PORT}"

      # Run ONLY the integration-marked tests (kafka excluded — no broker
      # provisioned). Real integration FAILURES fail this step directly; the
      # silent-skip enforcement below runs regardless (if: always()).
      - name: Run integration-marked tests (Postgres provisioned)
        run: |
          uv run pytest -m "integration and not kafka" \
            -rs -v --tb=short \
            --junitxml=integration-guard.xml

      # Fail-closed silent-skip enforcement. RED if any integration test skipped
      # citing a provisioned service's absence, or if zero integration tests ran.
      - name: Enforce no missing-service silent-skips (OMN-14172)
        if: always()
        run: |
          uv run python scripts/ci/check_integration_skips.py \
            --junit integration-guard.xml

      - name: Upload integration-guard results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: integration-guard-results
          path: integration-guard.xml
          retention-days: 7

  topic-naming-lint:
    needs: occ-preflight
    if: always()
    name: Topic Naming Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clone omnibase_infra
        run: git clone --depth=1 https://github.com/OmniNode-ai/omnibase_infra.git ../omnibase_infra
      - name: Clone omnibase_core
        run: git clone --depth=1 https://github.com/OmniNode-ai/omnibase_core.git ../omnibase_core
      - name: Clone omnibase_compat
        run: git clone --depth=1 https://github.com/OmniNode-ai/omnibase_compat.git ../omnibase_compat
      - name: Clone omnimemory
        run: git clone --depth=1 https://github.com/OmniNode-ai/omnimemory.git ../omnimemory
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - name: Set up Python 3.12
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --locked --all-extras
      - name: Topic naming lint (OMN-8507)
        env:
          OMNIBASE_INFRA_PATH: ../omnibase_infra
        run: |
          uv run python ../omnibase_infra/scripts/validation/lint_topic_names.py \
            --scan-contracts src/omnimarket/nodes \
            --baseline scripts/validation/topic_naming_baseline.txt
          uv run python ../omnibase_infra/scripts/validation/lint_topic_names.py \
            --scan-python src/omnimarket \
            --baseline scripts/validation/topic_naming_baseline.txt

  # ============================================================================
  # TOPIC ENUM DRIFT CHECK (OMN-13331 / WS-3)
  # Validates that all topic string constants in canonical topics.py registry
  # files are backed by at least one contract.yaml declaration (or carry a
  # # onex-topic-allow annotation). Orphaned constants are drift violations.
  # ============================================================================
  topic-enum-drift:
    needs: occ-preflight
    if: always()
    name: Topic Enum Drift Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - name: Set up Python 3.12
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --locked --all-extras
      - name: Check topic enum drift (OMN-13331)
        run: |
          echo "================================================================"
          echo "Topic Enum Drift Check (OMN-13331)"
          echo "Validates that topics.py constants are backed by contracts."
          echo "================================================================"
          uv run python scripts/ci/check_topic_enum_drift.py

  # ============================================================================
  # TOPIC DRIFT CHECK (OMN-13331 / WS-3)
  # Validates that all contract-declared topics use valid ONEX naming format
  # and known producer namespaces. New violations (not in baseline) fail CI.
  # Cross-repo registry coverage gaps are warnings only (exit 0), mirroring the
  # --warn-only behaviour of the equivalent omnibase_infra check (OMN-5248).
  # ============================================================================
  topic-drift-check:
    needs: occ-preflight
    if: always()
    name: Topic Drift Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - name: Set up Python 3.12
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --locked --all-extras
      - name: Check topic drift (OMN-13331)
        run: |
          echo "================================================================"
          echo "Topic Drift Check (OMN-13331)"
          echo "Validates contract topic format + producer namespaces."
          echo "Cross-repo registry coverage gaps are warn-only."
          echo "================================================================"
          uv run python scripts/ci/check_topic_drift.py

  # ============================================================================
  # MERGE-CHECK REASON-CODE GATE (OMN-14765, epic OMN-14643)
  # Fixture-corpus contract regression gate for the jobs-API-keyed merge-check
  # reason-code classifier (omnimarket.merge_control.reason_code_classifier).
  # Rule-5 enforcement: replays every captured jobs-API fixture through the
  # classifier and fails closed on any mismatch, a shrunk corpus, or a corpus
  # that no longer covers all five reason codes — so a future edit can never
  # silently re-collapse cancelled/stale/infra into product_failed. Stdlib-only
  # (bare setup-python, no uv sync). SYNC with the .pre-commit hook
  # `merge-reason-code-gate` and with the CI Summary strict success-only gate.
  # ============================================================================
  merge-reason-code-gate:
    name: Merge Reason-Code Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Merge-check reason-code fixture-corpus gate (OMN-14765)
        run: python scripts/ci/check_merge_reason_codes.py

  # OMN-16344: release-identity gate — the mechanism that keeps dev's
  # project.version permanently ahead of the last published tag, matching
  # omnibase_core (OMN-13411) and omnibase_infra (OMN-13412). omnimarket had no
  # such gate, which is why dev sat at 0.4.8 — identical to the published
  # v0.4.8 tag — while carrying seven commits of src/ changes, so one version
  # string named two distinct code states and a release could not be cut
  # without a manual hand-bump first.
  #
  # fetch-depth: 0 is REQUIRED, not incidental, and OMN-18443 made it doubly so.
  # The gate resolves the latest published version from the tags REACHABLE FROM
  # THE EVALUATED TREE (`git tag --merged`), so this checkout must carry both the
  # tag refs and the commit ancestry behind them. A shallow checkout carries
  # neither: it would once have made the gate report "no published tag yet" and
  # pass everything, and it would now make the ancestry unknowable. The gate
  # detects that case itself and falls back to the whole tag list rather than
  # trusting a truncated one, but the fallback is the safety net, not the plan.
  # SYNC with the pre-commit hook `check-release-identity`.
  release-identity-gate:
    name: Release Identity Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packaging
        # `packaging` is the gate script's only third-party import, so this job
        # stays a sub-minute pip install instead of a full `uv sync
        # --all-extras`. The gate's unit tests deliberately run in the MAIN test
        # job rather than here, matching the other tests/scripts/* suites:
        # tests/conftest.py imports asyncpg, omnibase_core and omnibase_infra,
        # so collecting them under this lightweight environment would fail at
        # import time regardless of what the tests themselves need.
        run: python -m pip install --quiet "packaging>=24.0"
      - name: No code merged onto a published version without a bump (OMN-16344)
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref || 'dev' }}
        run: |
          set -euo pipefail
          BASE="${BASE_REF}"
          git fetch --quiet origin "${BASE}" || true
          python scripts/check_release_identity.py --base "origin/${BASE}"

  wire-compatibility-gate:
    name: Wire Compatibility Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # OMN-18868: full history AND tags, both load bearing. The gate
          # resolves the last released consumer with `git tag --merged`, and a
          # shallow clone resolves an OLDER release than the tree really
          # descends from -- which is this gate's STRICT direction, so it would
          # not be unsafe, but it would redden pull requests for a fetch depth
          # rather than for a wire break. `git archive` then reads that
          # release's src/ straight out of the object store, so the objects
          # have to be present.
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - name: Set up Python 3.12
        run: uv python install 3.12
      - name: Install dependencies
        # Unlike the release-identity gate above, this one cannot run on a bare
        # `pip install packaging`: it IMPORTS the released wire models, and
        # those import omnibase_core and sibling omnimarket modules. A missing
        # dependency would surface as WIRE_COMPAT_PROBE_FAILED -- fail-closed,
        # so safe, but red for the wrong reason.
        run: uv sync --locked --all-extras
      - name: Every changed wire payload must decode on the last release (OMN-18868)
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref || 'dev' }}
        run: |
          set -euo pipefail
          BASE="${BASE_REF}"
          git fetch --quiet origin "${BASE}" || true
          uv run python scripts/ci/check_wire_compatibility.py \
            --base "origin/${BASE}"
      - name: The two real-history controls must EXECUTE here (OMN-18868)
        # These two replay the OMN-18852 incident against this repository's
        # own tags, and they need what only this job's checkout has. The
        # shard job clones at depth 1 with no tags, so there they skip and
        # are recorded in config/skip_count_baseline.yaml with that
        # provenance. This is the checkout that carries the history, so this
        # is where they run -- and this job is in the strict gate set, so a
        # refusal here refuses the pull request.
        #
        # The exit status alone cannot be trusted for this: two SKIPPED tests
        # also exit zero, which would turn the arrangement above into a gate
        # that prints and passes. The report is read instead.
        run: |
          set -euo pipefail
          uv run pytest tests/ci/test_check_wire_compatibility_omn18868.py \
            -m integration -q --junit-xml=wire_compat_integration.xml
          uv run python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse("wire_compat_integration.xml").getroot()
          suite = root if root.tag == "testsuite" else root.find("testsuite")
          if suite is None:
              print("WIRE_COMPAT_CONTROLS_UNREADABLE: no testsuite in the report", file=sys.stderr)
              sys.exit(1)
          executed = int(suite.get("tests", "0"))
          skipped = int(suite.get("skipped", "0"))
          if executed < 2 or skipped:
              print(
                  "WIRE_COMPAT_CONTROLS_DID_NOT_RUN: "
                  f"{executed} collected, {skipped} skipped; this job must run both "
                  "real-history controls, and a skip here means the checkout lost "
                  "its tags or its depth",
                  file=sys.stderr,
              )
              sys.exit(1)
          print(f"WIRE_COMPAT_CONTROLS_RAN: {executed} executed, 0 skipped")
          PY

