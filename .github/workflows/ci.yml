  # ============================================================================
  # GATE AGGREGATOR
  # Required status check for branch protection and merge queue.
  # ============================================================================

  # ============================================================================
  # DEP-HEALTH GATE (OMN-11063) — phased rollout
  # Phase 1 (advisory): no baseline → continue-on-error, exit 0.
  # Phase 2 (active):   baseline exists → delta-block new CRITICAL findings.
  # Phase 3+ ratchet:   raise threshold as baseline shrinks over time.
  # DEAD_IMPORT pass remains advisory until scanner confidence is proven.
  # ============================================================================
  # ============================================================================
  # uv.lock git-SHA pin reachability (OMN-14449)
  #
  # Lives HERE, in ci.yml, and is wired into the ci-summary rollup below --
  # NOT as a standalone workflow. A separate workflow file gets a separate
  # run_id, and the only required check on dev is `CI Summary`, whose poller is
  # run_id-scoped: a standalone job is structurally invisible to it and can
  # never block a merge (OMN-14415). A gate that cannot block is decoration.
  #
  # It clones each pinned sibling FRESH, because `git branch -r --contains`
  # reports a deleted branch's commit as reachable on any clone that fetched it
  # before deletion. The naive check is green on every developer's machine and
  # on nothing else -- CI is the only place it can tell the truth (OMN-14447).
  # ============================================================================
  uv-lock-pin-reachability:
    needs: occ-preflight
    if: always()
    name: uv.lock Pin Reachability
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Clone pinned sibling repos (FRESH -- no stale refs possible)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/clones"
          repos=$(python3 - <<'PY'
          import re, pathlib
          text = pathlib.Path("uv.lock").read_text()
          pat = r'git\s*=\s*"https://github\.com/[\w-]+/([\w-]+)\.git\?rev=[0-9a-f]{40}'
          print("\n".join(sorted(set(re.findall(pat, text)))))
          PY
          )
          for r in ${repos}; do
            git clone --quiet "https://x-access-token:${GH_TOKEN}@github.com/OmniNode-ai/${r}.git" \
              "${RUNNER_TEMP}/clones/${r}" \
              || echo "::warning::could not clone ${r}; it will be SKIPped"
          done

      - name: Assert every git-SHA pin is reachable from a remote branch
        run: |
          python3 scripts/ci/check_uv_lock_pin_reachability.py \
            --lock uv.lock \
            --clones-root "${RUNNER_TEMP}/clones"

  dep-health:
    needs: occ-preflight
    if: always()
    name: Dependency Health Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          version: "latest"
      - name: Install dependencies
        run: uv sync --locked --extra dep-health
      - name: Check baseline exists (phase detection)
        id: phase
        run: |
          if [ -f ".onex_state/dep_health_baseline.json" ]; then
            echo "has_baseline=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_baseline=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Dep-health sweep (advisory — no baseline)
        if: steps.phase.outputs.has_baseline == 'false'
        continue-on-error: true
        run: |
          uv run python scripts/ci/run_dep_health_sweep.py \
            --repo-roots src \
            --severity-threshold CRITICAL \
            --dry-run
      - name: Dep-health sweep (Phase 2 — delta-block new CRITICAL)
        if: steps.phase.outputs.has_baseline == 'true'
        run: |
          uv run python scripts/ci/run_dep_health_sweep.py \
            --repo-roots src \
            --severity-threshold CRITICAL \
            --baseline-path .onex_state/dep_health_baseline.json \
            --delta-mode

  contract-compliance:
    needs: occ-preflight
    name: Contract Compliance Check
    runs-on: ubuntu-latest
    if: needs.occ-preflight.result == 'success' && (github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.event_name == 'push')
    steps:
      - uses: actions/checkout@v6
      - name: Checkout onex_change_control
        uses: actions/checkout@v6
        with:
          repository: OmniNode-ai/onex_change_control
          path: onex_change_control

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: 'onex_change_control/uv.lock'

      - name: Install onex_change_control
        working-directory: onex_change_control
        run: uv sync --locked --all-extras

      - name: Validate contract YAML files
        working-directory: onex_change_control
        run: |
          mapfile -t CONTRACTS < <(find "$GITHUB_WORKSPACE/onex_change_control/contracts" -maxdepth 1 -type f -name "OMN-*.yaml" 2>/dev/null)
          if [ "${#CONTRACTS[@]}" -eq 0 ]; then
            echo "No contract YAML files found — skipping validation"
            exit 0
          fi
          uv run validate-yaml "${CONTRACTS[@]}"
        env:
          GH_TOKEN: ${{ github.token }}

  # ============================================================================
  # CONTRACT SWEEP GATE (OMN-14542, class fix, parent OMN-14531)
  # node_contract_sweep (`nodes/*/contract.yaml` field/topic/node_type compliance)
  # previously had ZERO CI/pre-commit caller anywhere and its ContractSweepRequest
  # defaulted `repos` to an empty list, which the handler silently reinterpreted as
  # "scan whatever top-level omni_home dirs happen to have a src/" — a prior receipt
  # reported 9 contracts checked clean while 941 actually existed (~1% coverage).
  #
  # This job wires scripts/ci/run_contract_sweep_gate.py as a REQUIRED gate. The
  # script derives the census (--repos) from its own on-disk location (never an
  # operator-typed value) and independently re-counts contract.yaml files via a
  # second, separately-implemented filesystem probe, then asserts the node's own
  # scanned_count matches that independent count and is > 0. Any narrowing
  # (scanned_count mismatch), any empty scope (scanned_count == 0), or an
  # unresolvable OMNI_HOME is a HARD, BLOCKING failure — this is what actually
  # closes the "9 vs 941" defect.
  #
  # SCOPE — the pre-existing field/topic/node_type backlog (5 major, 21 minor as
  # of the gate landing) was paid down under OMN-14544: the 5 major violations
  # (2 contracts missing contract_version/node_version, node_emit_daemon's
  # invalid node_type) were fixed at the source, and the 21 minor violations
  # were re-classified — `onex.snapshot.*` is a real, cross-repo-established
  # projection-broadcast topic kind (verified in use across omnimarket,
  # omnidash, onex_change_control, omnibase_infra, omnibase_core, and
  # omniintelligence), not 21 naming mistakes, so the separate
  # `_SNAPSHOT_TOPIC_RE` accepts it. The corpus is now a real, enforced zero — this job passes
  # --strict so any NEW violation fails closed.
  # ============================================================================
  contract-sweep-gate:
    needs: occ-preflight
    if: always()
    name: Contract Sweep Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          version: "latest"
      - name: Install dependencies
        run: uv sync --locked --all-extras
      - name: Run contract sweep scope-invariant gate
        run: uv run python scripts/ci/run_contract_sweep_gate.py --strict

  # ============================================================================
  # AISLOP SWEEP GATE (OMN-13578) — failing-rollup sub-job (Model B, OMN-13574)
  # Detection sweeps that are not pre-merge gates are advisory and get ignored
  # (Operating Rule 5). aislop detection was ABSENT from omnimarket CI; this job
  # makes it a required check by feeding the ci-summary rollup.
  #
  # SCOPE — PR diff only. The omnimarket tree carries pre-existing aislop debt
  # (hardcoded topics, empty impls). A whole-tree hard gate would block every PR
  # on that backlog. Instead this scans only the files a PR changes vs its base,
  # exactly like omnibase_core's `ai-slop-check` and omniclaude's
  # `ai-slop-check (strict, PR diff)` jobs: NEW slop blocks, existing debt does
  # not. A planted violation in a touched file turns this job — and therefore
  # the required CI Summary rollup — red.
  #
  # Uses the canonical scanner check_ai_slop.py from omnibase_core (cloned the
  # same way the other omnimarket jobs clone it) so the rule set stays uniform
  # across repos rather than forking a second omnimarket-local copy.
  # ============================================================================
  aislop-sweep:
    needs: occ-preflight
    if: always()
    name: Aislop Sweep (strict, PR diff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Clone omnibase_core (canonical aislop scanner)
        run: git clone --depth=1 https://github.com/OmniNode-ai/omnibase_core.git ../omnibase_core
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compute changed Python/Markdown files vs PR base
        id: changed
        # BASE_REF is passed via env (not spliced into the script body) so an
        # attacker-controlled ref/filename cannot be expanded as shell code.
        # No --depth on the base fetch: a shallow tip can miss the merge-base on
        # a diverged branch, making the `...` diff over-report files. A full
        # fetch resolves the true merge-base.
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then
            git fetch origin "$BASE_REF" --no-tags
            FILES=$(git diff --name-only "origin/$BASE_REF"...HEAD -- '*.py' '*.md' | tr '\n' ' ')
          else
            FILES=$(git diff --name-only HEAD~1 -- '*.py' '*.md' 2>/dev/null | tr '\n' ' ')
          fi
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
      - name: Check changed files for AI-slop patterns (strict)
        # FILES is passed via env so attacker-controlled filenames (backticks,
        # $(...)) are never spliced into the script source.
        env:
          FILES: ${{ steps.changed.outputs.files }}
        run: |
          if [ -z "$FILES" ]; then
            echo "No changed Python/Markdown files — nothing to scan."
            exit 0
          fi
          # shellcheck disable=SC2086
          python ../omnibase_core/scripts/validation/check_ai_slop.py --strict $FILES

  # ============================================================================
  # COVERAGE SWEEP GATE (OMN-14539; census cut over to shard artifacts OMN-18556)
  # The required PR coverage census. Since OMN-18556 it no longer re-runs the
  # suite under `pytest --cov`: it combines the per-shard coverage artifacts the
  # `test` matrix already emits (scripts/ci/aggregate_coverage_artifacts.py,
  # proven as the OMN-14680 shadow at parity with zero divergence) and dispatches
  # node_coverage_sweep against that combined census. The full second-pass
  # census (scripts/ci/run_coverage_sweep_gate.py) runs nightly on `dev` in
  # .github/workflows/nightly-full-suite.yml, which carries what smart selection
  # does not run on a PR. Rollback: revert the OMN-18556 commit.
  #
  # Fail-closed on missing / wrong-head / malformed / stale shard artifacts
  # (exit 3), combine-engine failure (exit 4) and a sweep `status="error"`
  # (exit 5). When the shards were skipped (e.g. OCC preflight failed) there is
  # no artifact set, so this job fails and CI Summary fails closed.
  # `gaps_found` stays informational, exactly as before.
  #
  # OMN-16217 draft gate and OMN-16662 docs-only skip are unchanged: the `if:`
  # below is the same expression, and `Coverage Sweep Gate` stays in
  # STRICT_GATE_JOBS and DOCS_ONLY_SKIPPABLE_GATE_JOBS in
  # scripts/ci/ci_summary_gate.py (never SKIPPABLE_GATE_JOBS). A draft
  # dev-targeting PR's skipped gate still fails CI Summary closed; pinned by
  # tests/unit/scripts/ci/test_ci_summary_gate.py::test_draft_gate_still_fails_closed_without_marker.
  # ============================================================================
  coverage-sweep-gate:
    needs: [occ-preflight, zone-filter, detect-changes, test]
    if: always() && (github.event_name != 'pull_request' || github.base_ref != 'dev' || !github.event.pull_request.draft) && needs.zone-filter.outputs.docs_only != 'true'
    name: Coverage Sweep Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # This job runs under always(), so it also runs when detect-changes was
      # skipped (for example after OCC preflight failed) and no shard ever ran.
      # Refuse by name there, before any clone or sync, instead of letting the
      # aggregator die on an empty --split-count. A census over shards that
      # never ran is not a census.
      - name: Refuse when the test shards did not run
        env:
          DETECT_RESULT: ${{ needs.detect-changes.result }}
          TEST_RESULT: ${{ needs.test.result }}
          SPLIT_COUNT: ${{ needs.detect-changes.outputs.split_count }}
        run: |
          if [ "$DETECT_RESULT" != "success" ] || [ -z "$SPLIT_COUNT" ]; then
            echo "::error::coverage census refused: detect-changes=${DETECT_RESULT} split_count='${SPLIT_COUNT}' test=${TEST_RESULT}. The test shards did not run, so there are no shard artifacts to combine."
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: Clone omnibase_core
        run: git clone --depth=1 https://github.com/OmniNode-ai/omnibase_core.git ../omnibase_core
      - name: Clone omnibase_compat
        run: git clone --depth=1 https://github.com/OmniNode-ai/omnibase_compat.git ../omnibase_compat
      - name: Clone omnimemory
        run: git clone --depth=1 https://github.com/OmniNode-ai/omnimemory.git ../omnimemory
      - name: Install uv (dependency cache — OMN-14680)
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true
      - name: Set up Python 3.12
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --locked --all-extras
      - name: Download per-shard coverage artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-shard-*
          path: .coverage-artifacts
          merge-multiple: true
      - name: Combine shard coverage and sweep it (OMN-18556)
        run: |
          uv run python scripts/ci/aggregate_coverage_artifacts.py \
            --artifacts-dir .coverage-artifacts \
            --expected-head "${{ github.sha }}" \
            --split-count "${{ needs.detect-changes.outputs.split_count }}" \
            --target-dir "$GITHUB_WORKSPACE" \
            --max-age-seconds 21600

  # ============================================================================
  # WORKFLOW MODULE-RESOLUTION GUARD (OMN-14176) — failing-rollup sub-job.
  # Every in-repo omnimarket module referenced by a .github/workflows/*.yml step
  # (from X import / import X / python -m X) must resolve under src/omnimarket/.
  # A workflow that imports a deleted node (e.g. node_pr_review_bot, deleted in
  # OMN-13212) previously stayed green while silently no-op'ing and reporting a
  # false CLEAN — nothing proved the module it claims to run still exists. This
  # guard closes that gap. Same-repo scope only; sibling-repo refs (omniintelligence.*,
  # omnibase_*) are cloned at CI runtime and out of scope. Feeds the required
  # ci-summary rollup (Rule 5: enforcement, not detection). Pure stdlib, no uv
  # sync. SYNC with pre-commit hook "workflow-module-refs".
  # ============================================================================
  workflow-module-refs:
    needs: occ-preflight
    if: always()
    name: Workflow Module Resolution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check workflow module references (OMN-14176)
        run: python scripts/ci/check_workflow_module_refs.py

  no-noncanonical-lifecycle-classes:
    name: no-noncanonical-lifecycle-classes
    # OMN-14350: non-canonical lifecycle-class ratchet. Unconditional (no needs/if)
    # so it never skips; wired into the required "CI Summary" via needs: + a strict
    # success-only verdict check (fail-closed on skipped/cancelled/failure).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.8.3"
      - name: Ratchet non-canonical lifecycle-word classes against frozen allowlist (OMN-14350)
        run: |
          uv run --no-project \
            --with 'omnibase-core @ git+https://github.com/OmniNode-ai/omnibase_core@63635097705d832e0ee9c4811093efb31349105c' \
            python -m omnibase_core.validators.no_noncanonical_lifecycle_classes \
            --check-stale \
            --allowlist .onex_ratchets/noncanonical_class_allowlist.yaml \
            src/omnimarket

  # ============================================================================
  # EVENT CHAIN GATE (OMN-16774)
  # ---------------------------------------------------------------------------
  # OMN-16767 killed the whole delegation chain on the .201 dev lane and every
  # repo's CI stayed green. The TRIGGER lived in THIS repo:
  # node_delegation_routing_reducer's contract.yaml gained a db_io.db_tables
  # block for its tenant-overlay table (OMN-15631), and that YAML edit silently
  # flipped the runtime's wiring arm underneath an unchanged, canonical def-B
  # handler — which was then handed a raw dict and quarantined every routing
  # request. No Python in this repo changed shape; a contract did, and nothing
  # in CI drove the seam that the contract controls.
  #
  # This job drives whole chains from the REAL contract.yaml on disk, through
  # the REAL handler, the REAL _prepare_handler_wiring arm selection and the
  # REAL MessageDispatchEngine, on the in-memory bus. It asserts the terminal
  # event lands AND that nothing reaches the quarantine sink.
  #
  # ZERO INFRASTRUCTURE by construction — no broker, no database. Note the suite
  # lives at tests/chains/, NOT tests/integration/: in this repo `integration`
  # means a real Kafka bus (tests/conftest.py's OMN-8726 guard rejects
  # EventBusInmemory there, correctly), and a per-PR chain gate must not need a
  # broker. Do not move it under tests/integration/.
  #
  # Unconditional (no needs/if) so it is always present, and registered in
  # scripts/ci/ci_summary_gate.py::STRICT_GATE_JOBS so a skipped/absent
  # conclusion fails "CI Summary" closed as well as a failing one.
  # ============================================================================
  event-chain-gate:
    name: Event Chain Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.8.3"
      - name: Run event chain gate
        run: |
          echo "================================================================"
          echo "Event Chain Gate (OMN-16774)"
          echo "Real contracts + real handlers through the real dispatch seam."
          echo "In-memory bus only: no broker, no database."
          echo "A chain that dies into the quarantine sink FAILS here."
          echo "================================================================"
          uv run pytest tests/chains/ -v --tb=short

  # ============================================================================
  # CUSTOMER PATH BOUNDARY (OMN-18012)
  # ----------------------------------------------------------------------------
  # Escape 1 of 2026-09-06: credential_publisher / generation_publisher built
  # their event bus WITHOUT apply_environment_overrides(), so the config kept
  # its PLAINTEXT default and the client opened plaintext against onex-dev's
  # IAM-only MSK listener. bus.start() raised ONEX_CORE_205_SERVICE_UNAVAILABLE
  # and EVERY POST /v1/tenants/me/inference-credentials returned 503, with the
  # customer's key already written to the secret store. Fixed in #2350
  # (15afc64f); the defect entered at 3a4308c9 and a0ad3c99.
  #
  # Nothing local could have caught it: every local proof lane runs a NO-AUTH
  # broker, so there is no listener that refuses. This job brings up a Redpanda
  # that DOES refuse, DISCOVERS every _build_event_bus under
  # omnimarket.projection by walking the package, and starts each one against
  # it. The landed unit test asserts the constructed config of two publishers
  # it names by hand and is structurally unable to fail for a third.
  #
  # RESIDUAL: staging and prod are MSK with AWS_MSK_IAM + SASL_SSL; this
  # harness is SCRAM. It proves "this client did not silently open PLAINTEXT
  # against an auth-required listener", NOT "this client speaks IAM".
  #
  # SIBLING OVERLAY, and why: the client-side ability to speak SCRAM at all is
  # an omnibase_infra change (OMN-18012 gate 0 -- build_aiokafka_auth_kwargs
  # handled only PLAINTEXT, OAUTHBEARER and AWS_MSK_IAM, so a username/password
  # mechanism produced a client with no credentials). Until that ships in a
  # published wheel and this repo repins, the job overlays omnibase_infra from
  # its own dev branch for THIS JOB ONLY -- the same sibling-checkout shape
  # omnibase_infra's own kafka-boundary-compat job uses. It is a test-time
  # overlay, not a dependency pin: pyproject/uv.lock are untouched. Drop the
  # overlay step at the repin.
  # ============================================================================
  customer-path-boundary:
    name: Customer Path Boundary (OMN-18012)
    # OMNI_RUNNER_SELECTOR_V1 — trusted CI defaults to self-hosted omnibase-ci; public forks default to ubuntu-latest
    #
    # OMN-18205: this job starts a broker container, so its placement is
    # governed by OMNI_DOCKER_CI_RUNS_ON_JSON before the general trusted seam --
    # the same precedence chain omnibase_infra already uses on its seven
    # docker-executing jobs. The variable is unset on this repository today, so
    # this resolves to the trusted seam exactly as before and no job moves. What
    # it buys is the ability to move the hermetic bulk of CI to the lab fleet
    # without moving the container-backed gate in the same write, and to move the
    # gate back on its own if it regresses. One variable, one blast radius.
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_DOCKER_CI_RUNS_ON_JSON || vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
      }}
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Checkout omnibase_infra (sibling, test-time overlay only)
        uses: actions/checkout@v6
        with:
          repository: OmniNode-ai/omnibase_infra
          ref: dev
          path: .sibling/omnibase_infra
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.8.3"
      - name: Pre-pull the harness broker image
        # Digest-pinned, and identical to REDPANDA_IMAGE in
        # tests/integration/customer_path/redpanda_sasl_harness.py. A floating
        # tag lets two runners resolve two different images;
        # tests/unit/docker/test_omn18012_harness_runner_topology.py asserts
        # this line and the harness constant never drift apart.
        run: docker pull redpandadata/redpanda:v24.2.7@sha256:82a69763bef8d8b55ea5a520fa1b38f993908ef68946819ca1aed43541824c48
      - name: Overlay omnibase_infra from dev
        run: |
          uv sync
          uv pip uninstall omnibase-infra
          uv pip install --no-deps -e .sibling/omnibase_infra
          export PYTHONPATH="${PWD}/.sibling/omnibase_infra/src:${PYTHONPATH:-}"
          echo "PYTHONPATH=${PYTHONPATH}" >> "$GITHUB_ENV"
          uv run --no-sync python - <<'PY'
          import pathlib
          import omnibase_infra

          package_path = pathlib.Path(omnibase_infra.__file__).resolve()
          sibling_root = pathlib.Path(".sibling/omnibase_infra").resolve()
          if sibling_root not in package_path.parents:
              raise SystemExit(
                  f"omnibase_infra overlay is inert: imported {package_path}, expected under {sibling_root}"
              )
          print(f"omnibase_infra overlay import path: {package_path}")
          PY
      - name: Run customer-path boundary tests
        env:
          # A missing docker daemon must be RED here, never a green skip.
          OMN18012_REQUIRE_HARNESS: "1"
          OMNIMARKET_ALLOW_PYTHONPATH_OVERRIDE: "1"
        run: |
          echo "================================================================"
          echo "Customer Path Boundary (OMN-18012)"
          echo "Every discovered projection publisher, against a broker that"
          echo "actually refuses an unauthenticated client."
          echo "RESIDUAL: this harness is SCRAM; staging/prod are AWS_MSK_IAM."
          echo "================================================================"
          uv run --no-sync pytest tests/integration/customer_path/ -v --tb=short -p no:randomly

  # ============================================================================
  # JS TOOLCHAIN HERMETIC (OMN-18012 gate 5)
  # ----------------------------------------------------------------------------
  # Escape 5 of 2026-09-06: the OMN-17863 hermetic-env suite was green on macOS
  # and red on Linux, because its real-install legs are guarded by
  # skipif(shutil.which("pnpm") is None) -- on a host without the toolchain
  # they SKIP, and a skip is indistinguishable from a pass in a CI summary.
  #
  # This job sets OMN18012_REQUIRE_JS_TOOLCHAIN=1, which turns the guard into
  # an explicit require-toolchain ASSERTION (never a second skip condition):
  # a missing or unusable pnpm fails loudly and names the cause, and the
  # real-install legs run instead of skipping. A developer on a host with no
  # pnpm still gets the local skip.
  # ============================================================================
  js-toolchain-hermetic:
    name: JS Toolchain Hermetic (OMN-18012)
    # OMN-18031: the single route consumer in this file. See the `route` job's
    # block at the top of `jobs:` for why this job and no other. `needs: route`
    # is required for the expression below to resolve at all -- without the edge
    # the job fails to SCHEDULE rather than failing red. This job's gate role is
    # unchanged: it stays unconditional and stays a STRICT_GATE_JOBS entry.
    #
    # FORK ISOLATION IS NOT RESTATED HERE, AND THAT IS THE POINT. The seam
    # expression it replaces encodes the fork branch inline at every call site,
    # any one of which can be edited wrong with nothing noticing. The routing
    # node holds it in ONE place, ahead of every capacity signal: a fork pull
    # request gets the public label set, and a public variable naming a
    # self-hosted label is overridden back to hosted, so a fork can never widen
    # onto the fleet at any idle level.
    needs: route
    # OMNI_RUNNER_SELECTOR_V2 — placement comes from the route job's decision.
    runs-on: ${{ fromJSON(needs.route.outputs.runs_on) }}
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.8.3"
      - name: Run the hermetic real-install legs with the toolchain REQUIRED
        env:
          OMN18012_REQUIRE_JS_TOOLCHAIN: "1"
        run: |
          echo "================================================================"
          echo "JS Toolchain Hermetic (OMN-18012 gate 5)"
          echo "A missing pnpm is RED here, not a green skip."
          echo "================================================================"
          uv run pytest \
            tests/unit/nodes/node_dod_verify/test_omn_17863_hermetic_node_behaviour_check_env.py \
            -v --tb=short -p no:randomly

  # ============================================================================
  # CONTRACT TOPIC GRAPH (OMN-14527 / OMN-14568 / OMN-14582)
  # Static producer/consumer oracle over EVERY topic-declaring package. Moved
  # here from the standalone contract-topic-graph.yml (retired) because GHA
  # `needs:` cannot cross workflow-file boundaries -- CI Summary can only
  # depend on jobs defined in THIS file.
  #
  # OMN-14582 Phase 1: unconditional (no needs/if), mirroring
  # no-noncanonical-lifecycle-classes exactly, so it never silently skips.
  # OMN-14582 Phase 2 / OMN-14640: promoted to the strict success-only slot
  # in ci-summary below (RESULT must be EXACTLY 'success'; skipped/cancelled/
  # failure all block) -- see the strict block in the ci-summary job.
  # ============================================================================
  contract-topic-graph:
    name: contract-topic-graph
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CONTRACT_GRAPH_CHECKOUT_ROOT: ${{ github.workspace }}/.contract-graph-checkouts
    steps:
      # fetch-depth: 0 (full history) is required so the baseline ratchet can
      # resolve the merge-base with the target branch -- a shallow clone
      # cannot prove a baseline addition predates this PR.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      # Census-only siblings (OMN-14568): NOT pip dependencies, just checked
      # out so parse_contract can read their contract.yaml text. See
      # CHECKOUT_PACKAGES / CONTRACT_GRAPH_CHECKOUT_ROOT in
      # contract_topic_graph.py.
      - name: Checkout omniclaude (census-only, full topic coverage)
        uses: actions/checkout@v4
        with:
          repository: OmniNode-ai/omniclaude
          ref: dev
          persist-credentials: false
          path: .contract-graph-checkouts/omniclaude

      - name: Checkout omniintelligence (census-only, full topic coverage)
        uses: actions/checkout@v4
        with:
          repository: OmniNode-ai/omniintelligence
          ref: dev
          persist-credentials: false
          path: .contract-graph-checkouts/omniintelligence

      # onex_change_control moved from INSTALLED_PACKAGES to CHECKOUT_PACKAGES
      # when omnimarket dropped its runtime dependency on the governance repo.
      # Its contracts still matter for census completeness — a topic whose
      # producer lives in an unscanned package looks like an orphan to every
      # consumer the graph can see — but reading packaged YAML never justified
      # a runtime pin, and resolving it by import is what quietly required the
      # dependency that has now been removed.
      - name: Checkout onex_change_control (census-only, full topic coverage)
        uses: actions/checkout@v4
        with:
          repository: OmniNode-ai/onex_change_control
          ref: dev
          persist-credentials: false
          path: .contract-graph-checkouts/onex_change_control

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras

      # Fail closed on ANY missing package -- both the runtime-soundness pair
      # (ACTIVE_RUNTIME_PACKAGES) and the full census scope (GRAPH_PACKAGES).
      # A silent partial here is exactly how OMN-14527 shipped scoped to 3 of
      # 9 topic-declaring packages for months with nothing erroring -- assert
      # completeness loudly so a broken checkout or a dependency change
      # surfaces as a gate failure, never as silence.
      - name: Assert the graph surface is complete (fail closed)
        run: |
          uv run python - <<'PY'
          from omnimarket.validators.contract_topic_graph import (
              GRAPH_PACKAGES,
              discover_contract_roots,
          )

          roots = discover_contract_roots()
          missing = [p for p in GRAPH_PACKAGES if p not in roots]
          if missing:
              raise SystemExit(
                  f"::error::Contract graph is INCOMPLETE — missing {missing}. "
                  "A partial graph reports every cross-package producer as a phantom "
                  "orphan. Restore the dependency/checkout or move this gate."
              )
          print(f"Graph surface complete: {sorted(roots)}")
          PY

      - name: Contract topic graph gate (HARD --scope omnimarket, no baseline)
        run: uv run python -m omnimarket.validators.contract_topic_graph --scope omnimarket

      - name: Golden-chain tests (generated per edge)
        run: uv run pytest tests/validators/test_contract_topic_graph.py -q

      - name: Census (informational)
        if: always()
        run: uv run python -m omnimarket.validators.contract_topic_graph --scope omnimarket --report || true

  # ============================================================================
  # OCC COMPANION MERGED GATE (OMN-15214 canary -> OMN-15221 omniclaude ->
  # OMN-15427 omnimarket)
  #
  # omnimarket was the last CI repo without this gate, and the gap was observed
  # live: omnimarket#1953's body cited `Evidence-Source: OCC#5487`, a companion
  # CLOSED WITHOUT MERGING (superseded by the merged OCC#5497). The canonical
  # arbiter returns FAIL for that body -- but omnimarket CI never ran it, so the
  # PR looked green with a dead evidence citation and nothing noticed.
  #
  # This job polls the PR's LIVE body (not the event payload -- occ-autobind
  # PATCHes Evidence-Source in after the trigger fires) and greens ONLY when
  # EVERY cited OCC companion is MERGED, or every cited OCC commit SHA is an
  # ancestor of onex_change_control dev/main. A companion CLOSED without merging
  # fails immediately (that IS the incident state); an OPEN companion polls and
  # converts to FAIL at the deadline (fail-closed).
  #
  # Enforcement, not detection: registered in STRICT_GATE_JOBS in
  # scripts/ci/ci_summary_gate.py, so the REQUIRED `CI Summary` context cannot
  # go green unless this job is present + completed + success (absent/skipped/
  # cancelled all block). Deliberately NOT a new top-level required context: a
  # context that does not report on every PR shape wedges merges indefinitely
  # under branch protection (see CLAUDE.md, deploy-gate section); the umbrella's
  # check-run always instantiates, so it has no such failure mode.
  #
  # Unconditional (no needs/if) so CI Summary always WAITS for it; internal
  # event scoping no-ops on push/workflow_dispatch (mirrors occ-preflight).
  # GitHub-hosted + pure gh-API polling against a PUBLIC repo
  # (onex_change_control): zero self-hosted/LAN dependency and no cross-repo
  # secret -- the default GITHUB_TOKEN reads public repos. The poll window
  # absorbs autobind mint + companion auto-merge latency instead of converting
  # them into instant reds.
  # ============================================================================
  occ-companion-merged:
    name: OCC Companion Merged Gate (OMN-15214)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      MERGE_GROUP_HEAD_REF: ${{ github.event.merge_group.head_ref }}
      # Poll window (seconds) -- bounded well under ci-summary's 90m deadline so
      # this gate reaches a terminal state first; PENDING converts to FAIL.
      DEADLINE_SECONDS: "1500"
      POLL_INTERVAL_SECONDS: "30"
    steps:
      - name: Checkout (gate script)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - name: Require every cited OCC companion to be merged before product merge
        run: python3 scripts/ci/check_occ_companion_merged.py

  # ============================================================================
  # VERIFICATION HOLD GATE (OMN-15483)
  #
  # The consumer-independent half of the merge-hold mechanism. The ONEX merge
  # node learned to honor the hold marker in the first round, which bound one
  # consumer -- but NOT the foreground Codex merge controller that performed
  # every merge in OMN-15483's incident table, and not `gh pr merge`, repo
  # auto-merge, or any future consumer. Chasing consumers does not converge.
  #
  # This job moves enforcement to the choke point every consumer already
  # respects: required status checks. A held PR fails here; this job is in the
  # fail-closed STRICT set of the required "CI Summary" context
  # (scripts/ci/ci_summary_gate.py), so a held PR can never be required-green.
  #
  # UNCONDITIONAL BY DESIGN -- no `needs:`, no `if:`. On a56e3819 the
  # `occ-preflight` dependency failed and cascade-skipped Tests, typecheck,
  # Contract Compliance and the whole E2E lane; a hold gate that an unrelated
  # upstream failure can skip is not a gate. Hosted runner, stdlib-only script,
  # no `uv sync`, seconds to a verdict, zero self-hosted/LAN dependency.
  #
  # ONE VOCABULARY: the script declares no regex. It loads
  # src/omnimarket/merge_control/hold_marker.py by path and calls the canonical
  # evaluate_merge_hold() -- same matcher and same fail-closed tri-state as the
  # node path, so OMN-15483 criterion 1 still has exactly one definition to
  # falsify against. DO NOT inline a pattern here.
  # ============================================================================
  pr-hold-check:
    name: Merge Hold Gate (OMN-15483)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    env:
      # Live refresh (preferred: current, so clearing a hold + re-running
      # releases the PR without a new push -- criterion 4 on the CI path).
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      GITHUB_EVENT_NAME: ${{ github.event_name }}
      # Event-payload fallback, straight off the `github` context -- no API
      # dependency for the gate to function at all.
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_LABELS_JSON: ${{ toJSON(github.event.pull_request.labels) }}
    steps:
      - name: Checkout (gate script + canonical vocabulary)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - name: Refuse a PR that is held against landing
        run: python3 scripts/ci/check_pr_hold_marker.py

  # ============================================================================
  # OMN-15484 -- omnimarket is the FIRST CALLER of the shared fan-out surface.
  # ============================================================================
  # `merge-hold-gate-reusable.yml` is the one authored surface that
  # onex_change_control and omnibase_infra call to get this gate without
  # vendoring a second vocabulary (AC1). A reusable workflow that the repo
  # defining it does not itself call is an unproven surface: the adopting repos
  # would be the first to execute it, in a PR whose author cannot iterate on it.
  # So omnimarket calls it too, locally (`uses: ./...`), which resolves at the
  # PR head and therefore exercises the exact code under review.
  #
  # This runs ALONGSIDE `pr-hold-check` above, deliberately, and only for this
  # transition. `pr-hold-check` is the live-proven implementation registered in
  # STRICT_GATE_JOBS and is omnimarket's actual enforcement; this job is the
  # fan-out surface proving itself against an independent control. Collapsing
  # the two -- deleting `pr-hold-check` and registering this context instead --
  # is a follow-up, kept out of this PR so that a defect in the new path cannot
  # take omnimarket's working coverage down with it.
  #
  # NOT registered in STRICT_GATE_JOBS while it is a proof job. It is still not
  # toothless here: omnimarket's CI Summary poller runs a default-deny sweep
  # over every present+completed job, so a FAILURE in this job already fails the
  # required context. What strict registration would add is `skipped` -> FAILURE
  # and `absent` -> PENDING, and those belong with the collapse.
  merge-hold-gate:
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/merge-hold-gate-reusable.yml
    with:
      # The PR's own code, not `dev`: this call exists to prove the surface the
      # PR is adding. Adopting repos pin `dev` instead -- see the input's docs.
      vocabulary_ref: ${{ github.sha }}
      context_name: merge-hold-gate / evaluate

  ci-summary:
    name: CI Summary
    # OMN-14127 fan-out: REQUIRED branch-protection context, implemented as a
    # NO-`needs`, GitHub-hosted, FAIL-CLOSED poller (ported from omnibase_core
    # #1397 / omnibase_infra #2230 / omniclaude #1870 — omnimarket was the last
    # `needs`-gated ci-summary on the fleet). A `needs`-gated job gets no
    # check-run until its `needs` terminalize, so under self-hosted fleet
    # saturation the old needs-based CI Summary (needs: [occ-preflight,
    # zone-filter, lint, ...28 upstream jobs]) was ABSENT forever and the PR
    # wedged BLOCKED with no auto-recovery. With NO `needs` this job's check-run
    # instantiates immediately (the required context can never be absent); it
    # polls the current run's job conclusions and posts a terminal
    # success/failure within a bounded deadline. DEFAULT-DENY: green ONLY when
    # every strict/skippable gate is present+good, the dynamic test matrix ran
    # to completion, AND no non-allowlisted job failed — see
    # scripts/ci/ci_summary_gate.py for the auditable gating set + strict/
    # skippable split + soft-allowlist (unit-tested in
    # tests/unit/scripts/ci/test_ci_summary_gate.py). Pure hosted GitHub-API
    # polling: zero self-hosted/LAN dependency. DO NOT rename — the job name IS
    # the required context; a rename re-wedges every PR.
    #
    # LAYER 4 (added 2026-08-13, OMN-ci-gate-omnimarket): this poller's layers
    # 1-3 summarize ci.yml jobs ONLY. A 4th layer now ADDITIONALLY asserts
    # EXPECTED_EXTERNAL_CONTEXTS (scripts/ci/ci_summary_gate.py) against the PR
    # head SHA's `commits/{sha}/check-runs` — contexts produced by OTHER
    # workflow files, fail-closed (missing/skipped/non-success all block). This
    # is what makes ~40 previously-independently-required-only (or, for
    # fsm-handler-drift / skill-mapping-input-coverage-gate /
    # node-migration-vendor-parity-gate / node-drift-gate(dev) /
    # contract-validation(dev) / deploy-gate(dev) / Runtime Profiles / validate,
    # never-required-anywhere) contexts newly enforced through this one
    # required umbrella, without any branch-protection edit.
    runs-on: ubuntu-latest
    if: always()
    permissions:
      actions: read
      checks: read
      contents: read
    # Deadline (below) is comfortably under any run-cancellation window so the
    # required context ALWAYS posts a terminal state first. The concurrency
    # group above does NOT cancel-in-progress, so on pull_request there is
    # effectively no shorter cancel window than GitHub's job default. This job
    # timeout is only a hard backstop above the internal poll deadline.
    timeout-minutes: 100
    steps:
      - name: Checkout (gate script)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - name: Checkout head gate script
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: .ci-summary-head
          sparse-checkout: scripts/ci/ci_summary_gate.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Restore head gate script
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
        run: cp .ci-summary-head/scripts/ci/ci_summary_gate.py scripts/ci/ci_summary_gate.py
      - name: Poll run jobs and compute fail-closed CI Summary verdict
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          # L4: the PR head SHA (not the run's own SHA) — commits/{sha}/check-runs
          # is keyed by commit, and on pull_request the run's own SHA is a merge
          # commit that never carries other workflows' check-runs.
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'merge_group' && github.event.merge_group.head_sha || github.sha }}
          ACTOR: ${{ github.actor }}
          # Bounded poll window (minutes) — kept under the run-cancel window so
          # the required context always reaches a terminal state first.
          DEADLINE_MINUTES: "90"
          POLL_INTERVAL_SECONDS: "45"
        run: |
          # GitHub invokes this step as `bash -e {0}`; disable errexit because
          # the gate script's non-zero exit codes are handled explicitly below
          # (2 = PENDING must NOT terminate the poll loop).
          set +e
          set -uo pipefail
          deadline=$(( $(date +%s) + DEADLINE_MINUTES * 60 ))
          attempt=0
          while true; do
            attempt=$((attempt + 1))
            if ! gh api --paginate \
                "repos/${GH_REPO}/actions/runs/${RUN_ID}/jobs?filter=all&per_page=100" \
                --jq '.jobs[]' | jq -s '.' > jobs.json; then
              if [ "$(date +%s)" -ge "${deadline}" ]; then
                echo "::error::CI Summary poll deadline (${DEADLINE_MINUTES}m) reached while fetching jobs — failing closed"
                exit 1
              fi
              echo "gh api fetch failed (attempt ${attempt}); retrying after ${POLL_INTERVAL_SECONDS}s"
              sleep "${POLL_INTERVAL_SECONDS}"
              continue
            fi
            # L4: commits/{sha}/check-runs for the PR head — a fetch failure here
            # is NOT retried on its own bounded loop; ci_summary_gate.py treats a
            # missing/unreadable file as "every external context unobserved"
            # (PENDING, never a blind pass), so a transient failure here just
            # costs one poll cycle, not a false green.
            gh api --paginate \
                "repos/${GH_REPO}/commits/${HEAD_SHA}/check-runs?filter=latest&per_page=100" \
                --jq '.check_runs[]' | jq -s '.' > check_runs.json || echo "[]" > check_runs.json
            python3 scripts/ci/ci_summary_gate.py --jobs-file jobs.json --run-attempt "${RUN_ATTEMPT}" --check-runs-file check_runs.json --actor "${ACTOR}" --event "${{ github.event_name }}"
            rc=$?
            case "${rc}" in
              0) echo "::notice::CI Summary = SUCCESS (all gating jobs + external contexts provably passed)"; exit 0 ;;
              1) echo "::error::CI Summary = FAILURE (fail-closed: a gating job or an asserted external context failed/cancelled)"; exit 1 ;;
              2) : ;;  # PENDING — gating jobs or external contexts still running; keep polling
              *) echo "::error::ci_summary_gate.py returned unexpected code ${rc}; failing closed"; exit 1 ;;
            esac
            if [ "$(date +%s)" -ge "${deadline}" ]; then
              echo "::error::CI Summary poll deadline (${DEADLINE_MINUTES}m) reached with gating jobs still pending — failing closed"
              python3 scripts/ci/ci_summary_gate.py --jobs-file jobs.json --run-attempt "${RUN_ATTEMPT}" --check-runs-file check_runs.json --actor "${ACTOR}" --event "${{ github.event_name }}" --report-only || true
              exit 1
            fi
            sleep "${POLL_INTERVAL_SECONDS}"
          done
