# To register as required status check after merging:
#   gh api repos/OmniNode-ai/omnimarket/branches/main/protection \
#     --method PUT \
#     --field required_status_checks='{"strict":false,"contexts":["dep-health / scan"]}'
#
# Phased rollout:
#   Phase 1 (advisory): no baseline file → run sweep, upload artifact, exit 0
#   Phase 2 (blocking): baseline committed → delta-mode, block on new MAJOR+ findings
#
# Baseline-first: commit .onex_state/dep_health_baseline.json to enable Phase 2.
---
name: dep-health-gate

"on":
  pull_request:
  merge_group:

jobs:
  occ-preflight:
    name: OCC Preflight Dependency
    runs-on: ubuntu-latest
    permissions:
      checks: read
      contents: read
    steps:
      - name: Wait for required OCC preflight
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -uo pipefail

          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "OCC preflight dependency is enforced by the pull_request gate; continuing for ${GITHUB_EVENT_NAME}."
            exit 0
          fi

          # OMN-14343: desynchronize the ~33 same-PR pollers (one per workflow file
          # -- GH Actions `needs:` can't cross workflow-file boundaries) so they
          # don't all hit the Checks API in the same instant every 10s and exhaust
          # the shared per-repo GitHub App installation rate-limit bucket.
          sleep "$(( RANDOM % 15 ))"

          backoff=5
          elapsed=0
          deadline=720

          while [ "$elapsed" -lt "$deadline" ]; do
            response="$(
              gh api "repos/${REPO}/commits/${HEAD_SHA}/check-runs?filter=latest&per_page=100" \
                --jq 'first(.check_runs[] | select(.name == "occ-preflight / eligibility") | .conclusion) // ""' \
                2>&1
            )"
            status=$?

            if [ "$status" -ne 0 ]; then
              if echo "$response" | grep -qi "rate limit"; then
                echo "::warning::gh api rate-limited waiting for occ-preflight; backing off ${backoff}s."
                sleep "$backoff"
                elapsed=$((elapsed + backoff))
                backoff=$(( backoff * 2 < 60 ? backoff * 2 : 60 ))
                continue
              fi
              echo "::error::gh api call failed (non-rate-limit): ${response}"
              exit 1
            fi
            backoff=5

            conclusion="$response"

            case "$conclusion" in
              success)
                echo "OCC preflight passed for ${HEAD_SHA}."
                exit 0
                ;;
              failure|cancelled|timed_out|action_required|startup_failure)
                echo "::error::OCC preflight concluded ${conclusion}; refusing to start this workflow."
                exit 1
                ;;
              "")
                echo "Waiting for occ-preflight / eligibility to post for ${HEAD_SHA}..."
                ;;
              *)
                echo "OCC preflight is ${conclusion}; waiting."
                ;;
            esac

            sleep 10
            elapsed=$((elapsed + 10))
          done

          echo "::error::Timed out waiting for occ-preflight / eligibility on ${HEAD_SHA}."
          exit 1
  dep-health:
    needs: occ-preflight
    name: dep-health / scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --extra dep-health

      # Phase 1 — Advisory run (always runs, uploads artifact for baseline generation)
      - name: Dep health sweep (advisory)
        id: advisory
        continue-on-error: true
        run: |
          uv run python scripts/ci/run_dep_health_sweep.py \
            --repo-roots src/ \
            --severity-threshold MAJOR \
            > dep-health-advisory.json 2>&1 || true
          echo "Advisory run complete"

      - name: Upload advisory artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dep-health-baseline
          path: dep-health-advisory.json
          retention-days: 30

      # Phase 2 — Delta-blocking run (only when baseline file exists)
      - name: Dep health sweep (delta-blocking)
        if: hashFiles('.onex_state/dep_health_baseline.json') != ''
        run: |
          uv run python scripts/ci/run_dep_health_sweep.py \
            --repo-roots src/ \
            --severity-threshold MAJOR \
            --baseline-path .onex_state/dep_health_baseline.json \
            --delta-mode
