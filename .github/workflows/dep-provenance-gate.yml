#
# OMN-13873: dep-provenance gate — forbid first-party git-source overrides.
#
# Root cause this closes: omnibase_infra PR #2184 merged to dev carrying
# [tool.uv.sources] git-rev overrides pinning omnibase-core / omnibase-spi to
# UNRELEASED commits. All ~60 CI checks passed green because CI resolved
# core/spi from those exact commits and tests ran against them — the breakage is
# dependency *provenance*, not runtime behavior, so no test catches it.
#
# This offline check accepts PyPI or a registered sibling's own dev merge tag.
# Branches, raw revisions, malformed dev tags and foreign git sources fail.
#
# Run when the dependency sources or this gate's implementation change, matching
# the local pre-commit hook. A validator change must exercise the current sources.
#
# This job is intended to be a REQUIRED STATUS CHECK. The job name
# "Dep Provenance Gate" must match branch protection rules (follow-up: add
# `dep-provenance-gate` as a required context on dev + main — see OMN-13873).

name: Dep Provenance Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, dev]
  merge_group:

# OMN-19643: cancel only superseded pull request runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


permissions:
  contents: read

jobs:
  dep-provenance-gate:
    name: Dep Provenance Gate
    runs-on: ubuntu-latest
    steps:
      - name: Skip on merge_group
        if: ${{ github.event_name == 'merge_group' }}
        run: |
          echo "merge_group event — provenance already proven at PR time; skipping."

      - name: Checkout
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up uv
        if: ${{ github.event_name == 'pull_request' }}
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7

      - name: Validate PyPI or sibling dev merge tag provenance
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail

          BASE_REF="origin/${{ github.base_ref }}"
          CHANGED=$(git diff --name-only "$BASE_REF"...HEAD -- pyproject.toml scripts/check_dep_provenance.py)

          if [ -z "$CHANGED" ]; then
            echo "Dependency sources and provenance gate unchanged in this PR. Skipping."
            exit 0
          fi

          echo "Dependency sources or provenance gate modified — verifying dependency provenance."
          python3 scripts/check_dep_provenance.py --pyproject pyproject.toml
