#
# OMN-13873: dep-provenance gate — forbid first-party git-source overrides.
#
# Root cause this closes: omnibase_infra PR #2184 merged to dev carrying
# [tool.uv.sources] git-rev overrides pinning omnibase-core / omnibase-spi to
# UNRELEASED commits. All ~60 CI checks passed green because CI resolved
# core/spi from those exact commits and tests ran against them — the breakage is
# dependency *provenance*, not runtime behavior, so no test catches it.
#
# This gate is a pure static provenance check (no network calls). It FAILS if
# any of omnibase-core / omnibase-spi / omnibase-compat (hyphen or underscore
# spelling) has a git / rev / branch / tag source override in pyproject.toml's
# [tool.uv.sources] block. onex-change-control is intentionally NOT checked (it
# follows an immutable-main pin release model). A single line may be exempted
# with an inline '# raw-override-ok: <ticket>' comment carrying a non-empty
# token.
#
# Scoping: the whole-file gate runs only when a PR actually modifies
# pyproject.toml (a forbidden override cannot be introduced without editing
# pyproject.toml). This mirrors the precommit hook's `files: ^pyproject\.toml$`
# scoping and the stale-todo-gate's changed-files approach, so a PR that does
# not touch pyproject.toml is not re-flagged for pre-existing, separately-tracked
# overrides.
#
# This job is intended to be a REQUIRED STATUS CHECK. The job name
# "Dep Provenance Gate" must match branch protection rules (follow-up: add
# `dep-provenance-gate` as a required context on dev + main — see OMN-13873).

name: Dep Provenance Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, dev]
  merge_group:

permissions:
  contents: read

jobs:
  occ-preflight:
    name: OCC Preflight Dependency
    runs-on: ubuntu-latest
    permissions:
      checks: read
      contents: read
    steps:
      - name: Wait for required OCC preflight
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -uo pipefail

          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "OCC preflight dependency is enforced by the pull_request gate; continuing for ${GITHUB_EVENT_NAME}."
            exit 0
          fi

          # OMN-14343: desynchronize the ~33 same-PR pollers (one per workflow file
          # -- GH Actions `needs:` can't cross workflow-file boundaries) so they
          # don't all hit the Checks API in the same instant every 10s and exhaust
          # the shared per-repo GitHub App installation rate-limit bucket.
          sleep "$(( RANDOM % 15 ))"

          backoff=5
          elapsed=0
          deadline=720

          while [ "$elapsed" -lt "$deadline" ]; do
            # NOTE(OMN-14343): GH Actions runs run: steps under `bash -e {0}` by
            # default -- that -e is already active before this script's own
            # `set -uo pipefail` runs, and `set -uo pipefail` does NOT clear an
            # inherited -e. A bare `response="$(gh api ...)"; status=$?` would
            # therefore abort the whole step on ANY gh api failure before status
            # is ever checked, silently defeating the retry logic below. Using
            # the command substitution as the condition of this `if` is the
            # errexit-safe form -- bash does not trigger -e for a command that is
            # part of an if/while/until condition, regardless of ambient -e state.
            if response="$(
              gh api "repos/${REPO}/commits/${HEAD_SHA}/check-runs?filter=latest&per_page=100" \
                --jq 'first(.check_runs[] | select(.name == "occ-preflight / eligibility") | .conclusion) // ""' \
                2>&1
            )"; then
              status=0
            else
              status=$?
            fi

            if [ "$status" -ne 0 ]; then
              if echo "$response" | grep -qi "rate limit"; then
                echo "::warning::gh api rate-limited waiting for occ-preflight; backing off ${backoff}s."
                sleep "$backoff"
                elapsed=$((elapsed + backoff))
                backoff=$(( backoff * 2 < 60 ? backoff * 2 : 60 ))
                continue
              fi
              echo "::error::gh api call failed (non-rate-limit): ${response}"
              exit 1
            fi
            backoff=5

            conclusion="$response"

            case "$conclusion" in
              success)
                echo "OCC preflight passed for ${HEAD_SHA}."
                exit 0
                ;;
              failure|cancelled|timed_out|action_required|startup_failure)
                echo "::error::OCC preflight concluded ${conclusion}; refusing to start this workflow."
                exit 1
                ;;
              "")
                echo "Waiting for occ-preflight / eligibility to post for ${HEAD_SHA}..."
                ;;
              *)
                echo "OCC preflight is ${conclusion}; waiting."
                ;;
            esac

            sleep 10
            elapsed=$((elapsed + 10))
          done

          echo "::error::Timed out waiting for occ-preflight / eligibility on ${HEAD_SHA}."
          exit 1
  dep-provenance-gate:
    needs: occ-preflight
    name: Dep Provenance Gate
    runs-on: ubuntu-latest
    steps:
      - name: Skip on merge_group
        if: ${{ github.event_name == 'merge_group' }}
        run: |
          echo "merge_group event — provenance already proven at PR time; skipping."

      - name: Checkout
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up uv
        if: ${{ github.event_name == 'pull_request' }}
        uses: astral-sh/setup-uv@v7

      - name: Forbid first-party git-source overrides on dev/main
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail

          BASE_REF="origin/${{ github.base_ref }}"
          CHANGED=$(git diff --name-only "$BASE_REF"...HEAD -- pyproject.toml || true)

          if [ -z "$CHANGED" ]; then
            echo "pyproject.toml unchanged in this PR — no new provenance surface. Skipping."
            exit 0
          fi

          echo "pyproject.toml modified in this PR — verifying dependency provenance."
          python3 scripts/check_dep_provenance.py --pyproject pyproject.toml
