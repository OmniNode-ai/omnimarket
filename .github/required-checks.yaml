# required-checks.yaml v3 (OMN-14857 — required-check skip-vector guard fan-out)
# Location: .github/required-checks.yaml
#
# Fan-out of the schema-v3 manifest introduced for omniclaude in OMN-14854. This
# is the OPERATIONAL input to the Required-Check Skip-Vector Guard
# (validate_no_required_check_skip_vectors.py, canonical source: omniclaude).
#
# Exhaustive: every context in required_status_checks.contexts for omnimarket's
# `dev` branch (58 contexts) AND `main` branch (28 contexts) has a `mode: REQUIRED`
# row below, fetched via
# `gh api repos/OmniNode-ai/omnimarket/branches/{dev,main}/protection/required_status_checks`,
# verified 2026-07-20. Each row's job resolution (workflow/job_path or
# caller_workflow+caller_job[+reusable_workflow+reusable_job|+cross_repo_ref]) was
# generated by running the SAME context->job resolution algorithm the validator
# uses (_workflow_model.py::resolve_context_to_job) against omnimarket's live
# .github/workflows/ — not hand-guessed.
#
# This manifest is single, branch-agnostic (same convention as omniclaude's
# OMN-14854 manifest — see that file's `required-check-manifest-reconcile.yml`
# scope note re: per-branch schema being an open follow-up, not resolved here
# either): a context required on only one of dev/main still gets one full row.
# Each row's `rationale` states which branch(es) enforce it (verified 2026-07-20).
#
# Do NOT rename/remove a REQUIRED row without following the Branch Protection
# Migration Safety procedure — flip branch protection first (or same PR), then
# update this file, so the reconcile job never observes a divergence window.
#
# `job_path` len 1 = Shape A (direct job); caller_workflow/caller_job (+
# reusable_workflow/reusable_job for local reusables, or + cross_repo_ref for
# cross-org reusables) = Shape B/C, per the design spec's context->job resolution
# algorithm (OMN-14854 ticket, spec section 1).
#
# NOTE (this PR, OMN-14857): this manifest backs the guard's OWN required check
# (`required-check-skip-guard / check-skip-vectors`, ADVISORY row at the bottom),
# which runs on every omnimarket PR starting this PR. Branch protection is NOT
# modified in this PR — the guard is observation-only until a follow-up flips it
# to REQUIRED after 2+ independent green runs on dev (same ordering OMN-14854 used
# for omniclaude).

