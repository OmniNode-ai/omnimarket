# required-checks.yaml v3 (OMN-14857 fan-out; reconciled OMN-15120 canary)
# Location: .github/required-checks.yaml
#
# Fan-out of the schema-v3 manifest introduced for omniclaude in OMN-14854. This
# is the OPERATIONAL input to the Required-Check Skip-Vector Guard
# (validate_no_required_check_skip_vectors.py, canonical source: omniclaude).
#
# RECONCILED 2026-07-25 (OMN-15120, canary-before-fanout fix for OMN-15057
# parent finding): re-fetched live required_status_checks for both branches
# via `gh api repos/OmniNode-ai/omnimarket/branches/{dev,main}/protection/required_status_checks`
# and diffed against this manifest using the canonical
# `reconcile_manifest_vs_live.py --branch <dev|main>` script (OMN-15117
# per-branch `branch:` field support). Live counts as of 2026-07-25:
# `dev` = 31 required contexts, `main` = 28 required contexts (down from the
# 58/28 recorded at the 2026-07-20 authoring pass — branch protection was
# pruned independently of this manifest between 2026-07-20 and 2026-07-25;
# not caused or investigated by this PR).
#
# Every REQUIRED row below now carries an optional `branch: dev` or
# `branch: main` field (OMN-15117 schema extension) when the context is
# required on only ONE branch; a row with no `branch:` field is required on
# BOTH branches (unchanged legacy convention). 19 rows that were REQUIRED at
# the 2026-07-20 authoring pass but are no longer live-required on EITHER
# branch as of the 2026-07-25 readback were removed (branch protection had
# already dropped them; removing here follows, not precedes, the branch-
# protection change — see Migration Safety procedure below). Removed:
# reason-graph, shell-hygiene, Core-Only Install Gate, Contract Sweep Gate,
# Aislop Sweep (strict, PR diff), Coverage Sweep Gate, Workflow Module
# Resolution, uv.lock Pin Reachability, no-noncanonical-lifecycle-classes,
# contract-topic-graph, Topic Naming Lint, Topic Enum Drift Check, Topic
# Drift Check, Merge Reason-Code Gate, Event Registry Drift, Compliance
# Sweep, receipt-honesty, skill-mapping-input-coverage-gate, fsm-handler-drift.
#
# Post-reconcile verification: `reconcile_manifest_vs_live.py --branch dev`
# and `--branch main` both return PASS (empty diff in both directions) —
# see PR body for full command output.
#
# Each row's job resolution (workflow/job_path or
# caller_workflow+caller_job[+reusable_workflow+reusable_job|+cross_repo_ref]) was
# generated by running the SAME context->job resolution algorithm the validator
# uses (_workflow_model.py::resolve_context_to_job) against omnimarket's live
# .github/workflows/ — not hand-guessed.
#
# Do NOT rename/remove a REQUIRED row without following the Branch Protection
# Migration Safety procedure — flip branch protection first (or same PR), then
# update this file, so the reconcile job never observes a divergence window.
#
# `job_path` len 1 = Shape A (direct job); caller_workflow/caller_job (+
# reusable_workflow/reusable_job for local reusables, or + cross_repo_ref for
# cross-org reusables) = Shape B/C, per the design spec's context->job resolution
# algorithm (OMN-14854 ticket, spec section 1).
#
# NOTE (OMN-15178, operator ruling "Make it blocking" 2026-07-26T07:25Z): this
# manifest backs the guard's OWN required check (`required-check-skip-guard /
# check-skip-vectors`, REQUIRED row at the bottom, flipped from ADVISORY after
# 12+ independent green runs on dev). Branch protection already carries this
# context live (gh api repos/OmniNode-ai/omnimarket/branches/dev/protection/required_status_checks,
# added additively, 31->32 contexts, 0 removed).

