---
schema_version: "1.0.0"
ticket_id: "OMN-18349"
title: "The nightly delegation regression publishes a scoreboard even when preflight fails"
summary: "The nightly workflow runs the Layer-2 golden-task runner with if: always() so a preflight failure still produces the fatal scoreboard artifact, and the upload fails when the scoreboard file is missing."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-scoreboard-on-preflight-failure"
    statement: "A failed preflight still produces the runner's fatal scoreboard, and a missing scoreboard fails the upload."
    acceptance:
      - id: "AC3"
        statement: "AC3: the scoreboard runner step carries if: always() and the artifact upload uses if-no-files-found: error -- falsifier: uv run pytest tests/test_delegation_nightly_placement.py -q in omnimarket fails at the merge base"
  - id: "req-runner-deadline-outlives-handler-cancel"
    statement: "The nightly runner keeps waiting for a case's row until after the delegate-skill handler has committed its budget terminal."
    acceptance:
      - id: "AC5"
        statement: "AC5: the Layer-2 runner's per-case deadline is at least the task class's ceiling plus its terminal delivery margin plus the projection margin, for every task class in the integration corpus -- falsifier: uv run pytest tests/delegation_golden/test_runner_corpus_pacing.py::TestPerCaseDeadlineReadsTheBoundThatBinds::test_deadline_outlives_the_handler_budget_terminal -q fails when the runner's deadline is the 240s handler execution budget plus the projection margin"
evidence_requirements:
  - kind: "tests"
    description: "Placement regression for the nightly scoreboard step and its upload."
    command: "env -u PYTHONPATH uv run pytest tests/test_delegation_nightly_placement.py -q"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn18349-ac3-scoreboard-on-failure"
    description: "AC3 placement regression: the scoreboard step runs after a failed preflight and the upload errors on a missing file."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/test_delegation_nightly_placement.py -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC3"]
  - id: "dod-omn18349-ac5-runner-deadline-outlives-handler-cancel"
    description: "AC5 deadline regression: for every task class in the integration corpus, the runner's per-case deadline is at least the handler's cancel bound after pickup plus the projection margin, with the bound read from the task-class authority and not from the runner."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/delegation_golden/test_runner_corpus_pacing.py::TestPerCaseDeadlineReadsTheBoundThatBinds::test_deadline_outlives_the_handler_budget_terminal -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC5"]
