schema_version: "1.0.0"
ticket_id: "OMN-24254"
title: "A refused runner group read names the GitHub App permission it lacked"
summary: "node_runner_group_exposure_effect's GitHub source gains a required org_read_permission overlay key, the NAME of the App permission the organization read of the runner group needs. When that read is refused (403 or 404 on the group call; a 401 means the token itself was refused and names no permission) the source carries the declared name in its read result, the probe result passes it on, and the reading writer adds a needs-<permission> reason cell beside org-read-denied. A missing stored token still reads org-read-denied with no permission named. The h053 unit was found running a revision from before the token mint merged; installing this change from its branch replaces it."
is_seam_ticket: false
interface_change: true
interfaces_touched:
  - "public_api"
requirements:
  - id: "req-omn24254-permission-refusal"
    statement: |-
      A refused organization read of the runner group names the App permission the overlay declares, so the operator can see what to grant.
    acceptance:
      - id: "AC1"
        statement: "AC1: when the organization read of the runner group is refused, the reading row names the permission the settings file declares as missing, in its reason cells -- falsifier: pytest tests/nodes/node_runner_group_exposure_effect/test_org_read_permission.py -q fails at the base, where the settings model refuses the permission key"
      - id: "AC2"
        statement: "AC2: the permission named is read from the settings file and not from code -- falsifier: the failing-control test in the same file, which declares a different permission and fails if the result names any other"
      - id: "AC3"
        statement: "AC3: a missing stored token with no key fetch names no permission and makes no call -- falsifier: the error chain test in the same file fails if a permission is named for a missing token"
      - id: "AC4"
        statement: "AC4: integrated, read in the running runtime on h053: the installed revision of onex-runner-group-exposure-hourly.service contains this change, and one hourly run prints a reading line whose verdict is WORKING or NOT WORKING, or whose reason cells name the missing permission or the failed key fetch -- falsifier: the unit log line still reads reason=org-read-denied alone, or the install record shows a revision without this change"
      - id: "AC5"
        statement: "AC5: a refused token (401 on the organization read) names no permission, since the token itself was refused and no permission is missing -- falsifier: test_error_chain_a_refused_token_names_no_permission fails if a 401 read names the declared permission"
evidence_requirements:
  - kind: "tests"
    description: "The exposure effect's golden chain, error chain, token mint, permission refusal, reading writer and overlay tests."
    command: "uv run pytest tests/nodes/node_runner_group_exposure_effect -q --no-cov"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn24254-permission-refusal"
    description: "The permission refusal tests pass at the head; with the source files of origin/dev put back they fail (the failing control)."
    source: "manual"
    binds_ac: ["AC1", "AC2", "AC3", "AC4"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_runner_group_exposure_effect -q --no-cov"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn24254-refused-token-names-no-permission"
    description: "A 401 on the organization read names no permission; the test fails if the source names the declared permission for a 401."
    source: "manual"
    binds_ac: ["AC5"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_runner_group_exposure_effect/test_org_read_permission.py -q --no-cov -k test_error_chain_a_refused_token_names_no_permission"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn24254-integration-proof"
    description: "Run the exposure effect's tests on a lab host at the pushed head. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check. It binds no acceptance criterion: the runtime reading (AC4) is read on h053 after the unit is reinstalled."
    source: "manual"
    execution_scope: "local_done_gate"
    checks:
      - check_type: "command"
        check_value: "env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha \"$(git rev-parse HEAD)\" --lane dod-integration-proof-24254 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_runner_group_exposure_effect -q --no-cov"
        cwd: "."
