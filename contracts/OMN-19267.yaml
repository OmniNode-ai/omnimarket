---
schema_version: "1.0.0"
ticket_id: "OMN-19267"
title: "local reasoning and complex_reasoning delegations return an accepted deliverable"
summary: "Local reasoning and complex_reasoning delegations return a non-empty, accepted deliverable (AC1), and the per-class profile test maps complex_reasoning to a thinking-suppressing profile (AC2). The verifier, receipt-runner and thinking-budget evidence items remain executable without criterion bindings because AC4, AC5 and AC6 are not criteria of this ticket."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-local-reasoning-delegations-return-accepted-deliverable"
    statement: "Local reasoning and complex_reasoning delegations return a non-empty deliverable. The criteria below are the ticket's two live criteria, transcribed from the ticket body; each id is the label a binding item claims through binds_ac. The ticket dropped its profile-pin criterion, and AC4, AC5 and AC6, which this contract once declared, are not criteria of the ticket: those evidence items retain their checks without claiming a ticket criterion."
    acceptance:
      - id: "AC1"
        statement: "AC1: a reasoning-class delegation on the local tier returns a non-empty deliverable for a reasoning prompt, with no ambiguous_unmarked_deliverable refusal on the accepted attempt -- falsifier: onex delegate --task-type reasoning with a reasoning prompt against the lab endpoint, reading receipt.json output_refusal and result.txt"
      - id: "AC2"
        statement: "AC2: the per-class profile test maps complex_reasoning to a thinking-suppressing profile, and fails red on dev before the change -- falsifier: uv run pytest tests/unit/delegation/test_prose_task_class_no_think_omn18967.py -q"
evidence_requirements:
  - kind: "tests"
    description: "Run the verifier over a contract whose declared item collides with the derived falsifier id and is retired by a marker."
    command: "uv run pytest tests/test_dod_verify_acceptance_basis.py tests/test_occ_falsifier_checks.py -q -k id_collision"
  - kind: "tests"
    description: "AC1: the local dispatch port returns a non-empty, unrefused deliverable for the reasoning classes against a stand-in that answers as the measured lab server did."
    command: "uv run pytest tests/unit/delegation/test_local_reasoning_delivers_answer_omn19267.py -q"
  - kind: "tests"
    description: "AC2: the per-class profile test maps reasoning and complex_reasoning to a thinking-suppressing profile."
    command: "uv run pytest tests/unit/delegation/test_prose_task_class_no_think_omn18967.py -q"
  - kind: "tests"
    description: "Run the OCC receipt runner over a ticket whose contract declares one check on two items."
    command: "uv run pytest tests/unit/scripts/test_occ_receipt_runner_shared_check_omn_19267.py -q"
  - kind: "tests"
    description: "AC6: the reasoning thinking-on profile carries the 2048-token thinking budget in both spellings and the request carries it."
    command: "uv run pytest tests/unit/delegation/test_reasoning_thinking_budget_omn19267.py"
  - kind: "tests"
    description: "AC2: the per-class profile test maps complex_reasoning to a thinking-suppressing profile."
    command: "uv run pytest tests/unit/delegation/test_prose_task_class_no_think_omn18967.py -q -k complex_reasoning"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-derived-falsifier-id-collision"
    description: "A marker aimed at a declared item that shares the derived falsifier id no longer retires the derived falsifier; the derived falsifier runs and its result counts. Fails at the merge base."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/test_dod_verify_acceptance_basis.py tests/test_occ_falsifier_checks.py -q -k id_collision"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: []
  - id: "dod-omn19267-ac1-local-reasoning-delivers"
    description: "AC1 hosted probe. The real local dispatch port (system prompt, inference-protocol shaping, deliverable extraction, refusal handling) runs a reasoning and a complex_reasoning delegation against a stand-in for the lab model server that answers as the server measured on 2026-09-23 did: an untagged trace with no marker when thinking is on, a marked answer when the request carries enable_thinking false. Passes at the head; fails at the merge base with omnimarket#2809's profile change reverted, because the request then leaves thinking on and the extractor refuses the trace. The live-model half of AC1 is the lab probe on the OCC receipt for this criterion."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/delegation/test_local_reasoning_delivers_answer_omn19267.py -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC1"]
  - id: "dod-omn19267-ac2-reasoning-profiles-no-think"
    description: "AC2 hosted probe. The per-class profile test maps reasoning and complex_reasoning to a thinking-suppressing profile. Passes at the head; fails at the merge base with omnimarket#2809's profile change reverted."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/delegation/test_prose_task_class_no_think_omn18967.py -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC2"]
  - id: "dod-receipt-runner-one-supersession-per-check"
    description: "Two contract items declaring one check produce one execution and one supersession record, never a byte-identical pair; an item whose receipt does not stand is refused, not given a second record. Fails at the merge base."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/scripts/test_occ_receipt_runner_shared_check_omn_19267.py -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: []
  - id: "dod-omn19267-ac6-reasoning-thinking-budget"
    description: "AC6 hosted probe. The reasoning thinking-on profile carries the 2048-token thinking budget in both server spellings, the budget travels on the request, and a response that spent the whole budget on thinking fails the class gate. Passes at the head; fails at the merge base, whose inference_protocols.v1.yaml carries no budget."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/delegation/test_reasoning_thinking_budget_omn19267.py"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: []
  - id: "dod-omn19267-ac2-complex-reasoning-no-think"
    description: "AC2 hosted probe, complex_reasoning only, as the ticket's reworded criterion states. The per-class profile test cases for complex_reasoning map it to a thinking-suppressing profile. The deploy readback loads this repo-owned contract with the installed canonical schema and checks that its requirements and evidence claim only the ticket criteria AC1 and AC2. The other evidence items keep running without claiming criteria the ticket does not carry."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/delegation/test_prose_task_class_no_think_omn18967.py -q -k complex_reasoning"
        cwd: "${OMNI_HOME}/omnimarket"
      - check_type: "command"
        check_value: |
          uv run python -c 'from pathlib import Path; from omnibase_core.models.ticket.model_ticket_contract import ModelTicketContract; c=ModelTicketContract.from_yaml(Path("contracts/OMN-19267.yaml").read_text()); declared={a.id for r in c.requirements for a in r.acceptance}; claimed={label for item in c.dod_evidence for label in item.binds_ac}; assert declared == claimed == {"AC1", "AC2"}, (declared, claimed); print("LAB_OMN19267_CONTRACT_READBACK schema=valid declared=AC1,AC2 claimed=AC1,AC2")'
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC2"]
