schema_version: 1.0.0
ticket_id: OMN-23108
title: The delegation completion rate over delegation_events is a floor reading with an owner-set bound
summary: A pure compute node reads R_all, R_dep and failed_rate over the rows of delegation_events for a window against bounds read from an overlay, and reads WORKING, NOT WORKING or UNKNOWN. It carries the reading as one STATUS ledger row that the floor's ledger_shadows rule shows under piece 15 with its read time. It carries its own golden and error chain tests, each with named mutations that turn it red.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23108-delegation-rate-reading
  statement: The delegation completion rate reads NOT WORKING when R_all or R_dep is under its overlay bound or failed_rate is over its overlay bound for the window, reads WORKING inside all three, and the served floor shows the reading as a row with its read time.
  acceptance:
  - id: AC1
    statement: 'AC1: the reading node computes R_all, R_dep and failed_rate over delegation_events for the last hour, with its bound read from an overlay and no hard-coded value, and a planted below-bound hour reads red while an above-bound hour reads green -- falsifier: uv run pytest of the node''s test in omnimarket with both planted hours'
  - id: AC2
    statement: 'AC2: the served floor shows the reading as a row with its read time after install from the branch -- falsifier: uv run pytest of the floor compute test for the key plus the key present in floor-simple.json after install'
evidence_requirements:
- kind: tests
  description: The planted-hour tests, the golden and error chain tests with their named mutations, and the floor row test
  command: uv run --frozen pytest tests/nodes/node_delegation_completion_rate_compute tests/nodes/node_floor_simple_effect/test_delegation_rate_row_floor_simple.py -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23108-planted-hours
  description: A below-bound hour (14 completions, none by the deployed lane, 5 failures) reads NOT WORKING naming each broken bound; an above-bound hour (136 completions, 100 by the deployed lane) reads WORKING; the same rows read the other way when only the overlay's bounds change.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_delegation_completion_rate_compute -q --no-cov -k "hours or chain"
    cwd: .
- id: dod-omn23108-floor-row
  description: The floor tick reads the node's ledger row through the ledger_shadows rule and writes a piece 15 line carrying the verdict, R_all, R_dep, failed share and its age against the max age the row declares.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_floor_simple_effect/test_delegation_rate_row_floor_simple.py -q --no-cov
    cwd: .
- id: dod-omn23108-integration-proof
  description: Run this pull request's own tests on a lab host at the pushed head. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23108 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_delegation_completion_rate_compute tests/nodes/node_floor_simple_effect/test_delegation_rate_row_floor_simple.py -q --no-cov
    cwd: .
