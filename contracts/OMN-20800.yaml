schema_version: "1.0.0"
ticket_id: "OMN-20800"
title: "The orchestrator's rounds run from launchd agents rendered by the registry installer, one run of a round at a time"
summary: >-
  The orchestrator's fill, integration and review rounds ran only as cron prompts inside one
  Claude Code session. A new host-timer effect, node_session_round_effect, runs one round as a
  headless claude -p under one exclusive lock per round and writes the round's heartbeat at the
  start and at the end of each run. node_host_installer_registry_units declares four launchd units,
  one per round, that run it. A temporary bridge until each round is a scheduled node run.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-omn20800-rounds"
    statement: "Each of the four rounds runs from its own rendered launchd unit, never two runs of a round at once, and every run writes the round's heartbeat."
    acceptance:
      - id: "DoD1"
        statement: >-
          DoD1: the registry installer renders four round units, each running claude -p of its
          round through node_session_round_effect with its heartbeat directory -- falsifier:
          uv run pytest tests/nodes/node_host_installer_registry_units/test_session_round_units.py -q
      - id: "DoD2"
        statement: >-
          DoD2: a live holder of a round's lock makes a second start exit 75 without running the
          round, and with no holder the round runs and writes its heartbeat -- falsifier:
          uv run pytest tests/nodes/node_session_round_effect/test_session_round_guard.py -q
evidence_requirements:
  - kind: "tests"
    description: "The render test of the four round units and the guard test of the round node, including the agent command run in a separate process under a separate live lock holder."
    command: "uv run pytest tests/nodes/node_host_installer_registry_units/test_session_round_units.py tests/nodes/node_session_round_effect/test_session_round_guard.py -q"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn20800-lc3-round-units-render"
    description: "DoD1: each of the four round units renders through the registry installer with its label, cadence, module, heartbeat directory, claude binary and prompt."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_host_installer_registry_units/test_session_round_units.py -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["DoD1"]
  - id: "dod-omn20800-lc4-round-guard"
    description: "DoD2: under a separate live lock holder a start exits 75 and runs nothing; with no holder the round runs and its heartbeat is written."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_session_round_effect/test_session_round_guard.py -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["DoD2"]
  - id: "dod-omn20800-integration-proof"
    description: "Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check: the pushed head runs the round guard test on a lab host through the lab work runner, where a separate live process holds the round's lock while the agent command starts. The install on the operator host is out of this change and is read from the pull request comment."
    source: "manual"
    execution_scope: local_done_gate
    checks:
      - check_type: "command"
        check_value: "env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha \"$(git rev-parse HEAD)\" --lane dod-integration-proof-20800 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_session_round_effect/test_session_round_guard.py -q --no-cov -p no:randomly"
        cwd: "."
