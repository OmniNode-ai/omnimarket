schema_version: 1.0.0
ticket_id: OMN-22915
title: 'Ledger bus step 5: the reducer judge runs in shadow, the guard replay exists and the accepted-row topic holds rows with unlimited retention'
summary: The reducer judge (the ledger row grammar's guards composed as one verdict) judges each row the live judge answered, on the text before it, and files its verdict beside the live one with the difference named. The guard replay re-judges recorded rows in order and lists every row whose verdict or refusal rule changed. The accepted-row topic is declared in the projection contract with retention.ms and retention.bytes of -1, and a table rebuilt from it equals the live table row for row, sequence for sequence and entity for entity. Nothing is wired to the serve, no bound is changed and nothing is muted.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn22915-ledger-judge-shadow-replay-topic
  statement: The reducer judge runs in shadow with a named difference, the guard replay lists changed verdicts, and the accepted-row topic holds rows forever and rebuilds the live table.
  acceptance:
  - id: AC1
    statement: 'AC1: the reducer judge reads each appended row in shadow and writes its accept or refuse verdict beside the live judge''s, and a test with a row the live judge accepts and the shadow refuses names the difference -- falsifier: uv run pytest tests/unit/nodes/node_work_ledger_reducer_compute/test_shadow_judge.py -q'
  - id: AC2
    statement: 'AC2: the guard replay re-judges a recorded week of rows and reports any row whose verdict changed -- falsifier: uv run pytest tests/unit/nodes/node_work_ledger_reducer_compute/test_guard_replay.py -q'
  - id: AC3
    statement: 'AC3: the accepted-row topic is declared with retention -1 in the broker declaration and a rebuild from it equals the live table row for row -- falsifier: uv run pytest tests/unit/nodes/node_projection_work_ledger/test_rebuild_from_topic.py -q'
