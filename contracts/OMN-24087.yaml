schema_version: 1.0.0
ticket_id: OMN-24087
title: Inference calls record the time allowance they were given
summary: Every inference call of node_llm_delegation_call_effect now logs one INFO line naming the call time allowance it was given, so the running runtime's log shows the overlay ceiling in force. The line records the task type, the overlay ceiling, the requested timeout, the resolved effective timeout, and the correlation id.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn24087-ceiling-evidence
    statement: Every inference call of node_llm_delegation_call_effect logs one INFO line naming the call time allowance it was given, so the running runtime's log shows the overlay ceiling in force.
    acceptance:
      - id: AC1
        statement: 'AC1: a code-writing inference call logs one line naming the task type, the overlay ceiling in force, the requested timeout and the effective timeout -- falsifier: pytest tests/unit/nodes/node_llm_delegation_call_effect/test_call_ceiling_evidence.py -q fails on the base revision because no such line is logged'
      - id: AC2
        statement: 'AC2: the logged ceiling is the value the code budget overlay declares for the task class, so changing the overlay value changes the line -- falsifier: the same test file runs the call with two overlay values (600 and 240) and fails if the line does not follow the overlay'
      - id: AC3
        statement: 'AC3: a task type the overlay does not name is still refused and logs no ceiling line -- falsifier: the same test file asserts the refusal and the absence of the line for an unnamed task type'
      - id: AC4
        statement: 'AC4: integrated: after the change merges and the dev runtime rolls, one code_generation delegation leaves the log line in the running runtime''s log naming ceiling 600 for its correlation id -- falsifier: the runtime log read for that correlation id shows no such line or a ceiling other than 600'
evidence_requirements:
  - kind: tests
    description: The ceiling evidence tests pass at the pushed head.
    command: uv run pytest tests/unit/nodes/node_llm_delegation_call_effect/test_call_ceiling_evidence.py -q -n 0 --no-cov -p no:cacheprovider
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
