schema_version: 1.0.0
ticket_id: OMN-24943
title: Make the Claude pool refill read run where it belongs, as a declared host unit
summary: The pool refill command (onex-claude-pool-refill) reads each host's pool with the overlay roots, but no declared scheduled unit ran it, so the integration pass read it as having no declared runner. This change adds a registry module tick main for the refill (read-only, the dry run) and declares it as a systemd unit and a launchd unit in the host installer registry units contract, installed with onex-host-install-units. Not in this change - a pool-mutating refill pass, any overlays runner line, and the Mac rotation tick unit.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24943-refill-unit
  statement: The pool refill read has a declared unit the host installer renders and installs, and the tick it runs never adds or marks a token.
  acceptance:
  - id: AC1
    statement: 'AC1: the refill tick main runs the refill handler as a dry run, writes the unit heartbeat and exits with the handler exit code -- falsifier: tests/nodes/node_claude_pool_refill_effect/test_claude_pool_refill_tick.py fails'
  - id: AC2
    statement: 'AC2: the systemd and launchd refill units are declared in the registry units contract and render the refill tick module with the overlay roots in their environment -- falsifier: the unit declaration or render tests of that file fail'
  - id: AC3
    statement: 'AC3: a pass over every declared host reads no host the lab host table declares unavailable and still reads one named in the request -- falsifier: the parked-host tests in tests/nodes/node_claude_pool_refill_effect/test_claude_pool_refill.py fail'
evidence_requirements:
- kind: tests
  description: The refill tick tests at the pushed head.
  command: uv run pytest tests/nodes/node_claude_pool_refill_effect/test_claude_pool_refill_tick.py -q -n 0 --no-cov -p no:cacheprovider
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24943-ac1
  description: The refill tick runs the dry run, writes the heartbeat and records a refusal or a host error with its exit code.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_claude_pool_refill_effect/test_claude_pool_refill_tick.py -q -n 0 --no-cov -p no:cacheprovider -k "golden or live or probe or host_error or refusal"
    cwd: .
- id: dod-omn24943-ac2
  description: Both platform units are declared for the refill tick and the systemd unit renders through the declared installer handler.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_claude_pool_refill_effect/test_claude_pool_refill_tick.py -q -n 0 --no-cov -p no:cacheprovider -k "units_are_declared or renders"
    cwd: .
- id: dod-omn24943-integration-proof
  description: 'Lab proxy: the branch is installed on the dev lane host with onex-host-install-units and one run of the unit is read in the PR Lab comment; hosted CI cannot reach a lab host, so only the local Done gate runs this unbound check; it runs one read-only tick pass at the sha on a lab host and fails unless the heartbeat records a dry run.'
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24943 --kind test -- sh -c 'uv run --frozen python -m omnimarket.nodes.node_claude_pool_refill_effect.runtime_claude_pool_refill_tick --state-dir /tmp/refill_omn24943; python3 -c "import json; r=json.load(open(\"/tmp/refill_omn24943/last-run.json\")); assert r[\"result\"][\"dry_run\"] is True, r"'
    cwd: .
- id: dod-omn24943-ac3
  description: An unnamed refill pass skips a parked host with a skipped line and exits zero when the rest answer; a named parked host is read.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_claude_pool_refill_effect/test_claude_pool_refill.py -q -n 0 --no-cov -p no:cacheprovider -k "parked or unnamed"
    cwd: .
