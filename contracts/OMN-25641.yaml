---
schema_version: "1.0.0"
ticket_id: "OMN-25641"
title: "The work-state projection's snapshot topic is a publish topic so the runtime provisioner creates it on the dev broker"
summary: >
  node_work_state_projection_effect lists onex.snapshot.projection.floor-work-state.v1 only under
  externally_consumed_topics, so the runtime's boot provisioner never creates it, and with the dev
  broker's auto-create off the publish (pointed at the dev broker by overlays#729) fails on absent
  cluster metadata. The contract now declares the topic in event_bus.publish_topics, the shape
  node_floor_emissions_publish_effect holds, and the topic stays in externally_consumed_topics
  because the floor reads it through node_floor_projection_read_effect.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-omn25641-snapshot-publish-topic"
    statement: "The work-state projection's snapshot topic is declared as a publish topic of its contract."
    acceptance:
      - id: "AC1"
        statement: "AC1: the topic onex.snapshot.projection.floor-work-state.v1 is listed in the dev broker's cluster metadata on h201 -- falsifier: a cluster metadata read of the dev broker on h201 that lists topic names returns the name onex.snapshot.projection.floor-work-state.v1 (this branch's part: the contract declares the topic in event_bus.publish_topics so the next dev image's boot provisioner creates it; hosted falsifier: uv run pytest on tests/nodes/node_work_state_projection_effect/test_contract_publishes_snapshot_topic.py, red on the base and green on the branch)"
      - id: "AC2"
        statement: "AC2: a STATUS row kv pr=overlays#729 installed=<host>:<revision> observed=<what ran> read_at=<UTC> is on the ledger -- falsifier: python3 \"$LB\" grep 'overlays#729' prints a STATUS row with those cells (the lane writes it before its TERMINAL)"
evidence_requirements:
  - kind: "tests"
    description: "The contract-shape test passes"
    command: "uv run pytest tests/nodes/node_work_state_projection_effect/test_contract_publishes_snapshot_topic.py -q --no-cov -n 0"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn25641-contract-shape"
    description: >
      The focused test reads the packaged contract and asserts the snapshot topic sits in
      event_bus.publish_topics and stays in externally_consumed_topics. It fails on the base
      (publish_topics is empty) and passes on the branch.
    source: "manual"
    binds_ac: ["AC1"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_work_state_projection_effect/test_contract_publishes_snapshot_topic.py -q --no-cov -n 0 --refuse-skips"
        cwd: "."
  - id: "dod-omn25641-integration-proof"
    description: "Run the focused contract test on a lab host at the pushed head. Hosted CI cannot reach the lab hosts, so only the local Done gate runs this unbound check."
    source: "manual"
    execution_scope: "local_done_gate"
    binds_ac: ["AC1"]
    checks:
      - check_type: "command"
        check_value: 'env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-25641 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_work_state_projection_effect/test_contract_publishes_snapshot_topic.py -q --no-cov -n 0'
        cwd: "."
  - id: "dod-omn25641-topic-on-dev-broker"
    description: >
      Deploy check, unbound here: the shared dev runtime on h201 is never restarted by a lane, so
      the branch install is queued needs-dev-window and the topic is created by the next dev
      image's boot provisioner. Verified after the orchestrator's batched window by an asserted
      cluster metadata read of the dev broker on h201 with the lane's dev-broker login (the env
      names KAFKA_SASL_USERNAME and KAFKA_SASL_PASSWORD name it; the value is never printed).
    source: "manual"
    execution_scope: "local_done_gate"
    binds_ac: ["AC1"]
    checks:
      - check_type: "command"
        check_value: 'kcat -L -b "$KAFKA_BOOTSTRAP" -X security.protocol=SASL_PLAINTEXT -X sasl.mechanisms=SCRAM-SHA-256 -X sasl.username="$KAFKA_SASL_USERNAME" -X sasl.password="$KAFKA_SASL_PASSWORD" | grep -F onex.snapshot.projection.floor-work-state.v1'
        cwd: "."
  - id: "dod-omn25641-status-row"
    description: >
      The lane writes the STATUS row naming overlays#729, the installed revision and what ran to
      the rolling work ledger before its TERMINAL row.
    source: "manual"
    binds_ac: ["AC2"]
    checks:
      - check_type: "grep"
        check_value: "the rolling work ledger holds a row matching 'STATUS .* pr=overlays#729 installed=' with observed= and read_at= cells"
        cwd: "."
