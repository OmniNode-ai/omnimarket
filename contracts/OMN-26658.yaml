schema_version: 1.0.0
ticket_id: OMN-26658
title: A pure judge reads the hook-event projection and says which declared Claude Code and Codex installs emit session start, tool use and stop
summary: node_hook_install_emission_compute judges, without I/O, whether each declared install put its three event kinds on the bus under its own host, and names an install that emitted nothing and an emitter no install explains. It is the readback judge for the ticket's emission criteria; the Codex-side hooks and the alert are not in this change.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn26658-silence-reader
  statement: An effect node reads events per host, actor and time from the claude_hook_events projection and each install's last session from the ledger lane rows, calls the emission judge and hands its alert_text to the lab alarm effect; an unreadable projection alerts as unreadable.
  acceptance:
  - id: DoD3
    statement: 'DoD3: over a fake projection a host whose Codex is silent while Claude emits alerts by tool, a known-good fleet stays quiet and an unreadable projection alerts as unreadable -- falsifier: uv run --frozen pytest tests/nodes/node_hook_install_silence_alert_effect -q --no-cov'
- id: req-omn26658-install-emission-judge
  statement: The emission judge is a node with a contract, typed models, a golden chain test and an error chain test; an install is emitting, partial or silent from the events read back, an event counts only for an install of its own tool and host, and an emitter no install explains is named.
  acceptance:
  - id: DoD1
    statement: 'DoD1: the node golden and error chain tests pass -- falsifier: uv run --frozen pytest tests/nodes/node_hook_install_emission_compute -q --no-cov'
  - id: DoD2
    statement: 'DoD2: a Codex install with no event is silent while a Claude install on the same host is emitting, and a Claude event never satisfies a Codex install, shown by the error chain tests -- falsifier: uv run --frozen pytest tests/nodes/node_hook_install_emission_compute -q --no-cov -k "headless_codex or actor_must_match"'
  - id: DoD3
    statement: 'DoD3: a Codex install that ran a session and emitted nothing for 30 minutes raises one alert naming host and tool, and an emitting install raises none -- falsifier: uv run --frozen pytest tests/nodes/node_hook_install_emission_compute/test_alert_hook_install_silent.py -q --no-cov'
evidence_requirements:
- kind: tests
  description: The install emission node tests pass
  command: uv run --frozen pytest tests/nodes/node_hook_install_emission_compute -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
