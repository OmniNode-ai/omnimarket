---
schema_version: "1.0.0"
ticket_id: "OMN-19968"
title: "Projection writers that run on a developer machine produce the same rows on SQLite and on Postgres"
summary: "The four writers with a SQLite path (delegation_events, llm_call_metrics, usage_by_model_day, metering_summary) give equal normalized rows through the real SQLite adapter and the real Postgres adapter, and no Postgres-only SQL is reachable from the SQLite path. This change makes the llm-cost writer speak the shared usage-source vocabulary on both stores."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-store-neutral-writers"
    statement: |-
      Projection writers that run on a developer machine must produce the same rows on SQLite and on Postgres, with no Postgres-only SQL on the SQLite path.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: For each of the four writers with a SQLite path (delegation_events, llm_call_metrics, usage_by_model_day and metering_summary) the same recorded event fixtures give equal normalized rows through the real SQLite adapter and the real Postgres adapter -- falsifier: the omnimarket parity test run with uv run pytest shows a row difference
      - id: "AC2"
        statement: |-
          AC2: No Postgres-only SQL ($n placeholders, ::jsonb, enum casts) is reachable from the SQLite path -- falsifier: the parity test with the SQLite adapter raising on any of those tokens fails
evidence_requirements:
  - kind: "tests"
    description: "Each writer's recorded fixtures give equal rows on SQLite and on Postgres; the Postgres half needs a real Postgres and is skipped without one."
    command: "uv run pytest tests/test_omn19968_writer_store_parity.py -q -k rows_equal"
  - kind: "tests"
    description: "A recording SQLite connection refuses every Postgres-only token on each writer's SQLite path."
    command: "uv run pytest tests/test_omn19968_writer_store_parity.py -q -k postgres_only_sql"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn19968-ac1-rows-equal"
    description: "The parity tests compare each writer's normalized rows on the real SQLite adapter and the real Postgres adapter for the same recorded fixtures."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/test_omn19968_writer_store_parity.py -q -k rows_equal"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC1"]
  - id: "dod-omn19968-ac2-no-postgres-sql-on-sqlite"
    description: "Each writer runs against a recording SQLite connection that raises on $n placeholders, ::jsonb and enum casts."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/test_omn19968_writer_store_parity.py -q -k postgres_only_sql"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC2"]
