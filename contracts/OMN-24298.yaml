  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_floor_emission_compute/test_contract_topics.py -q -n 0 --no-cov -p no:cacheprovider -k single_event
    cwd: .
- id: dod-omn24298-ac3
  description: 'hosted proxy for AC3: the contract topic tests and the piece 16 chain test pass; the in-runtime reading of the dev runtime log is taken on a lab host after the deploy and named in the pull request.'
  source: manual
