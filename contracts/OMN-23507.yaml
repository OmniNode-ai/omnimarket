schema_version: 1.0.0
ticket_id: OMN-23507
title: 'Landing facts for a switched-over repository, read from the change watcher'
summary: A new effect node, node_pr_landing_watcher_facts_effect, reads the PR watcher's state for the repositories its overlay names and writes the landing facts file the landing snapshot step's file facts source reads, so act mode on a repository the old controller treats as out of scope (omnimemory first) has facts to decide on. It only reads the watcher state and writes local files; it never writes to GitHub or acts on a pull request.
is_seam_ticket: true
interface_change: true
interfaces_touched:
- topics
- public_api
requirements:
- id: req-omn23507-watcher-facts
  statement: The watcher facts node writes landing facts for the overlay's repositories from the PR watcher's state, the snapshot step records them, and a seam test fails when either side changes shape.
  acceptance:
  - id: AC1
    statement: 'AC1: an effect node in omnimarket reads the PR watcher''s state for the repositories its overlay names and writes landing facts the snapshot step''s facts source reads, with the repository list, state path, output path and age bound in its overlay -- falsifier: the node''s unit test with the overlay''s repository list emptied'
  - id: AC2
    statement: 'AC2: a seam test runs the node''s output through the snapshot step''s facts source and handler and fails when either side renames a field -- falsifier: rename one facts field on either side and run the seam test'
  - id: AC3
    statement: 'AC3: a golden chain test (facts written, completed event) and an error chain test (stale or unreadable watcher state ends in the typed failed event and writes nothing) -- falsifier: the error chain test with the age bound removed'
  - id: AC4
    statement: 'AC4: integrated: on the floor host the node runs from its branch or merged revision against the live watcher state and writes facts naming the open omnimemory pull requests, read back in the running unit''s output -- falsifier: the written facts file read on the floor host after one run'
evidence_requirements:
- kind: tests
  description: The watcher facts node's tests and the seam test against the snapshot step
  command: uv run --frozen pytest tests/nodes/node_pr_landing_watcher_facts_effect tests/chain/test_watcher_facts_snapshot_seam.py -q --no-cov -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23507-node
  description: The node maps the watcher state's open pull requests of the overlay's repositories to landing facts and writes them; the overlay refuses an empty repository list.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_pr_landing_watcher_facts_effect -q --no-cov -p no:randomly
    cwd: .
- id: dod-omn23507-seam
  description: The snapshot step's file facts source and handler record the tick the node wrote, with node ids filled from the same watcher state; a renamed facts field and a key under another owner are the named breaks.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/chain/test_watcher_facts_snapshot_seam.py -q --no-cov -p no:randomly
    cwd: .
- id: dod-omn23507-chains
  description: Golden chain (facts written, written event on the written topic) and error chains (stale and unreadable watcher state end in the failed event on the failed topic and write nothing).
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_pr_landing_watcher_facts_effect -q --no-cov -p no:randomly -k "golden or error"
    cwd: .
- id: dod-omn23507-runtime-entry
  description: 'Integrated, hosted: the node runs as the unit runs it, python -m omnimarket.nodes.node_pr_landing_watcher_facts_effect in a subprocess under an overlay root, reads a fresh watcher state, prints the written line naming omnimemory and writes the facts file the snapshot step reads; a stale state exits 1 with nothing written and a missing overlay exits 3. The entry does not exist at the merge base, so the control fails there. The live read on the floor host is the unbound local item below.'
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_pr_landing_watcher_facts_effect -q --no-cov -p no:randomly -k runtime_entry
    cwd: .
- id: dod-omn23507-integration-proof-lab
  description: 'Integrated: on the floor host the node runs once against that host''s live PR watcher state under the deployed overlay (ONEX_SKILL_OVERLAY_ROOTS naming the overlays checkout) and prints the written line naming omnimemory; the facts file it names is then read back. Hosted CI cannot reach the floor host, so only the local Done gate runs this unbound item; the hosted entry run above binds AC4.'
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: 'env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23507 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen python -m omnimarket.nodes.node_pr_landing_watcher_facts_effect'
    cwd: .
