---
schema_version: "1.0.0"
ticket_id: "OMN-20912"
title: "Every GitHub operation a lane uses has a typed node operation"
summary: "node_github_repo_gateway_effect gains the Actions, PR-text and release reads (workflow_runs, run_jobs, job_log_tail, artifacts, pr_text, releases); a write effect performs the PR authoring writes with quota-floor, expected-head, idempotency and claim guards; ProtocolSourceControl gets one adapter on the same transport. AC4 is read live on the lab dev lane's bus after a publish per operation and is not bound here."
is_seam_ticket: false
interface_change: true
interfaces_touched:
  - "public_api"
requirements:
  - id: "req-scm-node-operations"
    statement: |-
      Every GitHub operation a lane uses has a typed node operation on the bus.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: node_github_repo_gateway_effect answers workflow_runs, run_jobs, job_log_tail, artifacts, pr_text and releases operations, covered by unit tests on a recorded fake transport -- falsifier: uv run pytest tests/nodes/node_github_repo_gateway_effect -q
      - id: "AC2"
        statement: |-
          AC2: a write effect performs pr_create, pr_edit, pr_ready, pr_close, pr_comment and workflow_dispatch with a quota floor, and refuses pr_close without a claim held in node_pr_claim_registry_effect -- falsifier: uv run pytest on the write effect handler tests with a recorded fake transport, including the refused close
      - id: "AC3"
        statement: |-
          AC3: ProtocolSourceControl from omnibase_spi has one adapter in omnimarket built on the same transport -- falsifier: uv run pytest of a protocol conformance test for the adapter
evidence_requirements:
  - kind: "tests"
    description: "AC1: the six new gateway reads replay on a recorded fake transport, page inside the node, honour their byte and item caps, and refuse an over-cap artifact with a typed reason."
    command: "uv run pytest tests/nodes/node_github_repo_gateway_effect/test_github_repo_gateway_scm_reads.py tests/nodes/node_github_repo_gateway_effect/test_github_repo_gateway_protocols.py -q -p no:randomly"
  - kind: "tests"
    description: "AC2: node_github_repo_write_effect performs pr_create, pr_edit, pr_ready, pr_close, pr_comment and workflow_dispatch on a recorded fake transport; pr_close without the lane's claim in node_pr_claim_registry_effect and a call under the quota floor are refused with typed reasons before any mutation."
    command: "uv run pytest tests/unit/nodes/node_github_repo_write_effect/test_handler_github_repo_write.py -q -p no:randomly"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn20912-ac1-gateway-reads"
    description: "AC1: workflow_runs, run_jobs, job_log_tail, artifacts, pr_text and releases answer on a recorded fake transport, with paging inside the node and typed size refusals."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_github_repo_gateway_effect/test_github_repo_gateway_scm_reads.py tests/nodes/node_github_repo_gateway_effect/test_github_repo_gateway_protocols.py -q -p no:randomly"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC1"]
  - id: "dod-omn20912-ac2-repo-write-effect"
    description: "AC2: the six writes run on a recorded fake transport; the refused close (no claim, another lane's claim) and the quota-floor refusal send no mutation."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/nodes/node_github_repo_write_effect/test_handler_github_repo_write.py -q -p no:randomly"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC2"]
