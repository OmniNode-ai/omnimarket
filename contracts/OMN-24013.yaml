schema_version: 1.0.0
ticket_id: OMN-24013
title: The roll failure capture node keeps the failed container's log and writes a typed roll terminal naming the command and its issuer
summary: 'node_dev_roll_failure_capture_effect (five whys R2) consumes the dev roll manifest and the incident that the deploy agent publishes, keeps the manifest and the failed container''s log in an injected
  artifact store, and publishes one typed roll terminal per incident: recovered, unrecovered, or unknown with a typed reason. An incident that cannot be read, has no issuer, or whose artifacts cannot be written
  never reads as a success. The store location and the log byte cap are overlay values. The deploy agent side is omnibase_infra#5919.'
is_seam_ticket: true
interface_change: true
interfaces_touched:
- topics
- public_api
requirements:
- id: req-omn24013-capture
  statement: The incident and the manifest become one typed roll terminal with the log kept.
  acceptance:
  - id: AC2
    statement: 'AC2: node_dev_roll_failure_capture_effect consumes the incident and manifest events and writes one typed roll terminal (command id, issuer, outcome, log artifact with its completeness) through
      an injected artifact store, and an unreadable incident yields a typed unknown terminal, never success -- falsifier: an incident with no issuer or an unwritable store reads as a success terminal'
  - id: AC3
    statement: 'AC3: the start event, manifest and incident shapes are pinned against the start-count node''s contract and the capture node''s models in a seam test on each side -- falsifier: renaming a field
      on either side leaves the seam test green'
- id: req-omn24013-integrated
  statement: The terminal is read from the running dev runtime.
  acceptance:
  - id: AC4
    statement: 'AC4: integrated: after the next dev roll with both changes running, the start events, the manifest naming the command and its issuer, and the roll terminal are read on the dev bus lane -- falsifier:
      a dev roll finishes after both are running and the dev bus lane carries no start event for it'
evidence_requirements:
- kind: tests
  description: The node's handler, golden chain, error chain and seam tests pass at the pushed head; the error chain tests fail when the issuer check or the store check is removed.
  command: uv run --frozen pytest tests/unit/nodes/node_dev_roll_failure_capture_effect -q --no-cov -p no:cacheprovider
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24013-ac2
  description: A recovered and an unrecovered incident each read one typed terminal with the log kept in the store; an incident with no issuer, an unreadable one, an unwritable store and an unreadable overlay each
    read an unknown terminal with a typed reason and never recovered.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/nodes/node_dev_roll_failure_capture_effect -q --no-cov -p no:cacheprovider
    cwd: .
- id: dod-omn24013-ac3
  description: The seam test spells the incident, manifest and log capture fields and the two topics the deploy agent publishes, and reads a payload built from exactly those fields as recovered.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/nodes/node_dev_roll_failure_capture_effect/test_seam_agent_events.py -q --no-cov -p no:cacheprovider
    cwd: .
- id: dod-omn24013-ac4
  description: The tests behind the integrated reading pass at the head; the reading itself needs the deploy agent change (omnibase_infra#5919) and this node on the running dev runtime and is named in the pull request
    as the step left.
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/nodes/node_dev_roll_failure_capture_effect -q --no-cov -p no:cacheprovider
    cwd: .
- id: dod-omn24013-integration-proof
  description: The node tests run on a lab host at the pushed head through the lab work node. The reading on the running dev runtime is the pull request's Lab line; hosted CI cannot reach it.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24013 --kind test -- env PYTHONDONTWRITEBYTECODE=1
      uv run --frozen pytest tests/unit/nodes/node_dev_roll_failure_capture_effect -q --no-cov -p no:cacheprovider
    cwd: .
