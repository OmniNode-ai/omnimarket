schema_version: 1.0.0
ticket_id: OMN-23556
title: Reconcile scan reads compose files with custom YAML tags
summary: The retirement scan of node_host_reconcile_effect refused omnimemory/docker-compose.prod.yml as malformed registry configuration because it carries the compose-only tag !override, which the safe YAML loader rejects. The node contract now declares compose_yaml_tags (override, reset); the scan reads a file with a declared tag as its plain value, never rewrites it, and still refuses an undeclared tag and invalid YAML.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23556-compose-tags-read
  statement: The retirement scan reads a registry file that uses a contract-declared compose tag, and still refuses an undeclared tag and a file that is not valid YAML.
  acceptance:
  - id: AC1
    statement: 'AC1: the retirement scan reads a compose file that uses the override and reset tags without raising and without a finding when it names no retired repository -- falsifier: pytest tests/test_retired_repository_reconcile.py -k "compose_tag" -q'
  - id: AC2
    statement: 'AC2: a tag the contract does not declare, and a file that is not valid YAML, are still refused as malformed registry configuration -- falsifier: pytest tests/test_retired_repository_reconcile.py -k "still_malformed" -q'
  - id: AC3
    statement: 'AC3: the host reconcile handler run over a workspace holding a compose file with the override tag exits 0, and with a retired target in that file''s repository list exits 2 -- falsifier: pytest tests/test_retired_repository_reconcile.py -k "compose_tag_workspace" -q'
  - id: AC4
    statement: 'AC4: integrated: after the change is installed on the lab computer h051 through the host installer, the unit onex-host-reconcile prints no malformed-configuration refusal for the memory-service compose file on its next run -- falsifier: the unit''s journal and out log still contain the line "omnimemory/docker-compose.prod.yml: malformed registry configuration"'
evidence_requirements:
- kind: tests
  description: The scan and handler tests, with the compose-tag cases as failing controls and the undeclared-tag and invalid-YAML refusals as guards
  command: uv run --frozen pytest tests/test_retired_repository_reconcile.py -q --no-cov -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23556-compose-tags-read
  description: A compose file with the override and reset tags yields no finding and no error, is byte-identical after the scan, and still yields a finding for a retired target. Against the merge-base scan the same file raises the malformed-configuration refusal, so the selection fails there. The same selection holds the two refusal guards (an undeclared tag, invalid YAML), which must keep raising.
  source: manual
  binds_ac:
  - AC1
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/test_retired_repository_reconcile.py -q --no-cov -p no:randomly -k "compose_tag or still_malformed"
    cwd: .
- id: dod-omn23556-handler-chain
  description: Golden and error chain through the host reconcile handler on a workspace holding the compose file with the override tag (exit 0, then exit 2 with a retired target in it), plus the contract and policy model agreeing on the declared tags. These are the code paths the h051 unit runs; the unit's own next run is recorded in the pull request's Lab line.
  source: manual
  binds_ac:
  - AC3
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/test_retired_repository_reconcile.py -q --no-cov -p no:randomly -k "compose_tag_workspace or compose_tags"
    cwd: .
- id: dod-omn23556-integration-proof-lab
  description: Runs the retirement tests at the pushed head on a lab host through the lab work runner. Hosted CI cannot reach the lab runner, so only the local Done gate runs this unbound item; the host unit's next run on h051 is recorded in the pull request's Lab line.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: 'env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23556 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/test_retired_repository_reconcile.py -q --no-cov -p no:randomly'
    cwd: .
