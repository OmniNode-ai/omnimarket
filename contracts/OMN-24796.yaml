schema_version: 1.0.0
ticket_id: OMN-24796
title: omnimarket pull request 6001 reads green on its required checks, with the omninode-memory tag repointed to the build that locks the same core
summary: The Tests (Split 7/20) job on the OMN-24079 pull request fails test_cli_from_external_directory with "Requirements contain conflicting URLs for package omnibase-core", because the pull request pins omnibase-core dev-20261113013358-a09066caf945 while the omninode-memory tag it pinned declares dev-20261111183916-a85cb916d4c1. The omnimemory build dev-20261118033152-967ddaf9eed2 declares the core tag this pull request pins. The change repoints omninode-memory to that tag in pyproject.toml and uv.lock and re-records the lock hash in the work contracts that pin it.
