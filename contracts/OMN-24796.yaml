  statement: The omninode-memory tag names the same omnibase-core tag as the pull request, so the external-directory resolve of the package succeeds.
  acceptance:
  - id: AC1
    statement: 'AC1: the live dev tag lineage tests and the sibling pin tests pass at the pushed head -- falsifier: uv run --frozen pytest tests/nodes/node_dev_tag_lineage_effect/live/test_dev_tag_lineage_live.py fails seven cases with the conflicting-URLs text on the previous omninode-memory tag'
  - id: AC2
    statement: 'AC2: every work contract that pins uv.lock records the lock hash of the tree -- falsifier: uv run --frozen pytest tests/ci/test_infra_pin_aa87c2dd6abe_work_contracts_omn23865.py fails when a contract records another hash'
