    check_value: |-
      bash -o pipefail -c 'gh api "repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_standalone_service_redeploy_effect/handlers/handler_standalone_service_redeploy.py?ref=$(git rev-parse HEAD)" --jq .content | base64 -d | grep -F "class HandlerStandaloneServiceRedeploy" > /dev/null'
