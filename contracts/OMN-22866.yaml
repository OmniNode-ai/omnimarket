schema_version: 1.0.0
ticket_id: OMN-22866
title: The lab fill briefs that open a pull request tell the lane to push its branch and name its branch and head, so lane-brief check --lab admits them
summary: (1) From 2026-11-08 21:57Z every lab-fill fire read dispatched=0 with brief-check-refused for each eligible ticket (1 ticket, then up to 7, with 41 free slots at 2026-11-09 04:10Z). lane-brief check --lab refuses a brief whose own prose opens a pull request and carries neither a child-ticket-ids line nor a push-the-branch-and-report sentence (OMN-22883, merged 2026-11-08 21:25Z), and the fill briefs said open one PR whose title contains the ticket and nothing about pushing. The omnimarket lane renderer and the tick node's ticket and diagnose briefs now carry one shared sentence (PUSH_AND_REPORT_LINE) that tells the lane to push the branch and name its branch and head in its TERMINAL. No check, bound or threshold is changed. (2) The hourly Linear snapshot (node_linear_snapshot_effect) wrote each open issue's state and description but not its attachments or children, so the brief check and the lab fill read every ticket from Linear for the merged-implementation rule and lost dispatches when Linear answered HTTP 429; the full and the incremental read now select the first 50 attachments and children of each issue and write them as attachments and children (child ids), a part with a next page or absent from the answer is written as null, and a snapshot written before the parts existed is read in full once.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn22866-snapshot-holds-attachments-and-children
  statement: Each issue of the snapshot file carries its attachments and child ids, written the same by the full and the incremental read, and null when a part was not read.
  acceptance:
  - id: AC2
    statement: 'AC2: a full read and an incremental read each write every issue''s attachments and child ids, a part with a next page and a part absent from the answer are written as null, and a snapshot written before the parts existed is read in full -- falsifier: uv run --frozen pytest tests/nodes/node_linear_snapshot_effect/test_attachments_children.py -q --no-cov'
- id: req-omn22866-fill-brief-admitted
  statement: Every brief the omnimarket lab fill renders passes the child-id check of lane-brief check --lab, and the same brief with the push sentence cut out is refused by it.
  acceptance:
  - id: AC1
    statement: 'AC1: each rendered dispatch kind, the tick ticket brief and the diagnose brief hold no opening sentence the check would refuse, and the ticket brief with the push sentence removed is refused naming open one PR -- falsifier: uv run --frozen pytest tests/nodes/node_lab_fill_effect/test_error_chain_lab_fill_brief_check_omn22866.py -q --no-cov'
evidence_requirements:
- kind: tests
  description: The brief-check tests with their failing control, and the lab fill plan and effect suites.
  command: uv run --frozen pytest tests/nodes/node_lab_fill_plan_compute tests/nodes/node_lab_fill_effect -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn22866-snapshot-parts
  description: The snapshot node's tests read both queries, a legacy base, a next page and an answer without the parts.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_linear_snapshot_effect -q --no-cov
- id: dod-omn22866-fill-brief-admitted-ac1
  description: The brief-check tests pass, and the failing control reads the ticket brief refused once the push sentence is cut out.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_lab_fill_effect/test_error_chain_lab_fill_brief_check_omn22866.py -q --no-cov
- id: dod-omn22866-lab-fill-suites
  description: The lab fill plan and effect suites still pass.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_lab_fill_plan_compute tests/nodes/node_lab_fill_effect -q --no-cov
- id: dod-omn22866-lab-fill-integration-proof
  description: The brief-check tests run on a lab host at the pushed head, and the lab run is recorded in the pull request body.
  source: manual
  execution_scope: local_done_gate
  checks:
