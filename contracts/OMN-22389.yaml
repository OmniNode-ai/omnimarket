schema_version: 1.0.0
ticket_id: OMN-22389
title: omnimarket dev opens one durations-record PR before the 50 unrecorded-file cap fails every open PR
summary: A new effect node counts the test files the committed durations record does not hold, and a workflow runs it on each push to dev; at 20 unrecorded files it measures just those files once, adds them to the record with every existing entry left as it was, and opens or updates one automation PR. The cap of 50 is not raised.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn22389-durations-refresh
  statement: The freshness test failed every open PR once 50 test files were unrecorded, three times on 2026-11-03, and each time a lane recorded the files by hand.
  acceptance:
  - id: AC1
    statement: 'AC1: status counts the unrecorded test files and says the refresh is due at the contract threshold and not before, and the threshold is at most half the unchanged cap of 50 -- falsifier: uv run pytest tests/unit/test_ci_durations_refresh_omn22389.py -k "status or threshold" fails when the threshold passes half the cap or the count is off by one'
  - id: AC2
    statement: 'AC2: supplement adds the unrecorded files, leaves every existing entry byte-equal, and a second run changes nothing -- falsifier: uv run pytest tests/unit/test_ci_durations_refresh_omn22389.py -k supplement fails when an existing entry is overwritten'
  - id: AC3
    statement: 'AC3: the workflow runs on a dev push, does nothing past the count when not due, and opens or updates one PR under the app identity staging only the two data files -- falsifier: uv run pytest tests/unit/test_ci_durations_refresh_omn22389.py -k workflow fails when a step after the count loses its due gate'
evidence_requirements:
- kind: tests
  description: The durations refresh unit tests and the node golden chain.
  command: uv run pytest tests/unit/test_ci_durations_refresh_omn22389.py tests/nodes/node_test_durations_refresh_effect -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn22389-ac1
  description: AC1 the count and the due threshold hold, and the threshold stays under half the cap.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/test_ci_durations_refresh_omn22389.py -q --no-cov -k "status or threshold"
    cwd: .
- id: dod-omn22389-ac2
  description: AC2 the supplement leaves existing entries and is idempotent.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/test_ci_durations_refresh_omn22389.py -q --no-cov -k supplement
    cwd: .
- id: dod-omn22389-ac3
  description: AC3 the workflow shape.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/test_ci_durations_refresh_omn22389.py -q --no-cov -k workflow
    cwd: .
- id: dod-omn22389-integration-proof
  description: Run the durations refresh unit tests, the node golden chain and the planner and freshness tests on a lab host at the pushed head. The hosted verifier cannot dispatch lab work, so this unbound check belongs to the local Done gate.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-22389 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/test_ci_durations_refresh_omn22389.py tests/nodes/node_test_durations_refresh_effect tests/unit/test_ci_shard_plan_omn19684.py tests/unit/test_ci_shard_plan_record_freshness_omn17427.py -q --no-cov
    cwd: .
