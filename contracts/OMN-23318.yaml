schema_version: 1.0.0
ticket_id: OMN-23318
title: The floor compare page's category cards that dev lacks get their own contract
summary: The commit ab9790e8f (the compare page rolling the numbers up into category cards with a collapsed, searchable, paged details table) sat on branch omn-23018-floor-compare-page and never reached dev. node_floor_compare_effect now rolls the comparison up by the overlay's categories into cards with a details table and the page draws one card per category for each window. The page tests render compare.html under Node.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23318-compare-page-category-cards
  statement: The comparison is rolled up into category cards from the node's model and the page draws one card per category for each window, with the details closed, paged and searchable.
  acceptance:
  - id: AC1
    statement: |-
      AC1: the compare page renders the category cards from the node's model with tests -- falsifier: uv run pytest tests -q -k compare_category_cards in omnimarket, failing with a card removed
- id: req-omn23318-dod-verify-passes
  statement: dod-verify reads this pull request's own contract, so the repo-evidence check is no longer red for want of a contract that binds the cards.
  acceptance:
  - id: AC2
    statement: |-
      AC2: dod-verify passes on omnimarket#5581 with this ticket's contract -- falsifier: pr_state_local.py --pr omnimarket#5581 shows no repo-evidence red
evidence_requirements:
- kind: tests
  description: The node's rollup tests and the compare page render tests pass on the branch; the failing controls (no overlay, a prefix claimed twice, a planted gap) are in the same files.
  command: uv run --frozen pytest tests/nodes/node_floor_compare_effect -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23318-ac1-category-rollup
  description: The rollup of a planted history gives the right counts per category, accounts for every line of the window, says each card's biggest change, draws a category with nothing read as unread, and refuses a prefix claimed twice; without the overlay there are no cards and the reason is in the file.
  source: manual
  execution_scope: hosted_and_local
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_floor_compare_effect -q --no-cov
    cwd: .
  binds_ac:
  - AC1
- id: dod-omn23318-ac1-compare-page-render
  description: The compare page, rendered under Node, draws one card per category for each window, keeps the details closed and paged twenty-five to a page, filters by search, category and result, and draws a planted gap as unread. The render needs Node on PATH, so it runs on the local Done gate.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_factory_floor_publish_effect/test_compare_page.py -q --no-cov
    cwd: .
  binds_ac:
  - AC1
- id: dod-omn23318-ac2-no-repo-evidence-red
  description: 'Read from the pull request watcher''s state: the pull request''s red list holds no repo-evidence check. Reads red while the state names repo-evidence among the red checks. Hosted CI cannot read the watcher, so only the local Done gate runs it.'
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: sh -c 'if python3 "${OMNI_PLUGIN_ROOT:?}/skills/merge-drain/scripts/pr_state_local.py" --pr omnimarket#5581 | grep -E "red=.*repo-evidence"; then exit 1; fi'
    cwd: .
  binds_ac:
  - AC2
- id: dod-omn23318-integration-proof
  description: The node tests and the compare page render tests run on a lab host at the pushed head through the lab-work node (Node on PATH there). Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23318 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_floor_compare_effect tests/nodes/node_factory_floor_publish_effect/test_compare_page.py -q --no-cov
    cwd: .
