schema_version: 1.0.0
ticket_id: OMN-24586
title: Pool rotation tick on the Mac lab host writes its logs on the internal disk
summary: The launchd unit of the pool rotation tick (claude-pool-rotation-tick, omnimarket#5872) was installed on h101 on 2026-11-15 at 03:57Z through the registry units installer and its first run ended with exit 78 (EX_CONFIG) and no log, because h101's registry root links to an external volume that launchd cannot open log files on. The overlay store reader, the declared clone refresh and the lane closeout sweep units already declare log_directory and launchd_root for this. The declaration of the pool tick gains the same two keys. Not in this change - the Linux unit, the installer handler and the other launchd units.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24586-launchd-log-directory
  statement: The macOS pool rotation tick unit renders its log paths and its working directory under the home, and the Linux unit renders as before.
  acceptance:
  - id: AC1
    statement: "AC1: the declaration of the macOS pool rotation tick unit names a log directory under the home, and the rendered launchd plist puts both log paths there -- falsifier: pytest tests/nodes/node_host_installer_registry_units/test_pool_tick_log_directory.py -q fails on the unchanged declaration (no log_directory key, log paths under the registry root)"
  - id: AC2
    statement: "AC2: the Linux unit of the same job is rendered exactly as before -- falsifier: the same test file, test_the_linux_unit_is_unchanged, fails if the systemd render changes"
  - id: AC3
    statement: "AC3: integrated: after installing from the change on h101, launchctl list ai.omninode.claude-pool-rotation-tick shows last exit 0 and the unit's heartbeat file last-run.json has a ran_at under 10 minutes old -- falsifier: read 2026-11-15T03:58Z the same list shows last exit 78 (EX_CONFIG) and no heartbeat file exists"
evidence_requirements:
- kind: tests
  description: The pool tick log directory tests at the pushed head; they fail against the declaration before this change.
  command: uv run pytest tests/nodes/node_host_installer_registry_units/test_pool_tick_log_directory.py -q -n 0 --no-cov -p no:cacheprovider
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24586-ac1
  description: 'AC1 and AC2: the pool tick log directory tests pass with the change; against the declaration before it the declaration and render tests fail.'
  source: manual
  binds_ac:
  - AC1
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_host_installer_registry_units/test_pool_tick_log_directory.py -q -n 0 --no-cov -p no:cacheprovider
    cwd: .
- id: dod-omn24586-integration-proof
  description: 'AC3 lab proxy: the registry units tests run on a lab host at the pushed head; the first run on h101 after installing from the branch is read in the pull request comment and is not claimed by this local check'
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24586 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_host_installer_registry_units/test_pool_tick_log_directory.py -q --no-cov -p no:randomly
    cwd: .
- id: dod-omn24586-ac3-hosted-proxy
  description: 'hosted proxy for AC3: the golden render test reads the plist and finds both log paths and the working directory under the home.'
  source: manual
  binds_ac:
