schema_version: 1.0.0
ticket_id: OMN-22976
title: The routing overlay carries per-task-class bars frozen with a hash and the routing overlay tests run per task class
summary: A new compute node, node_delegation_routing_overlay_check_compute, reads the task-class contract and a routing overlay of bars (task_class_bars.v1.yaml). Each of the 21 task classes holds a bar (required score, request override bounds, price ceiling, latency bound) frozen under a full sha256 that names the class. A class with no bar, a bar edited without a new hash, and a contract bar moved without refreezing each fail the check. The tests run once per task class and the golden and error chain event tests carry named mutations.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn22976-class-bars
  statement: Every task class holds a frozen bar in the routing overlay and the overlay tests run per task class.
  acceptance:
  - id: AC1
    statement: 'AC1: every task class has a bar in the overlay with a hash and a class with no bar fails the overlay check -- falsifier: uv run pytest src/omnimarket/nodes/node_delegation_routing_overlay_check_compute -q -k every_class_has_bar'
  - id: AC2
    statement: 'AC2: the routing overlay tests pass per task class and a changed bar without a new hash fails -- falsifier: uv run pytest src/omnimarket/nodes/node_delegation_routing_overlay_check_compute -q -k hash_change_fails'
evidence_requirements:
- kind: tests
  description: The per-class overlay tests and the golden and error chain event tests with their named mutations
  command: uv run --frozen pytest src/omnimarket/nodes/node_delegation_routing_overlay_check_compute -q --no-cov
