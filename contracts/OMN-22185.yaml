schema_version: '1.0.0'
ticket_id: OMN-22185
title: Lander P0 third pull request, append_if_absent on the ledger append node
summary: This repository implements AC3 of OMN-22185. AC1 is bound by the contract in omnibase_spi (PR 435) and AC2 by the contract in omnibase_core (PR 2246). The ledger append node takes an optional row id on its one append request; the row is appended only when no ledger row already carries that id cell, and the check and the append run under one flock beside the ledger, so two concurrent calls of one row id leave one row.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-append-if-absent
    statement: The ledger append node appends a row by row id atomically, with its names, lock suffix and lock wait declared in its contract.
    acceptance:
      - id: AC3
        statement: 'AC3: Two concurrent append_if_absent calls of one row id leave one row -- falsifier: uv run pytest on the node_work_ledger_append_effect concurrency test in omnimarket, with a positive control that two different ids leave two rows'
evidence_requirements:
  - kind: tests
    description: The append_if_absent cases, the concurrency tests with their positive controls, and the node proof cases.
    command: uv run pytest tests/unit/nodes/node_work_ledger_append_effect tests/unit/work_ledger_bus -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn22185-concurrency
    description: Two concurrent append_if_absent calls of one row id, from threads and from processes against a real temp ledger file under the flock, leave one row; the plain append of one id and the same call with the lock removed both leave two rows, and two different ids leave two rows.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/nodes/node_work_ledger_append_effect/test_append_if_absent.py -q --no-cov -k 'concurrent or control or different_row_ids'
        cwd: .
    binds_ac: [AC3]
  - id: dod-omn22185-node-proof
    description: The handler boots from its contract with in-memory adapters and reaches no file, process or socket outside the protocol seam, and the contract section append_if_absent supplies the row id cell, the lock suffix and the lock wait, an absent key refusing by name.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/nodes/node_work_ledger_append_effect/test_append_if_absent.py -q --no-cov -k 'np1 or np2'
        cwd: .
    binds_ac: [AC3]
  - id: dod-omn22185-spi-half
    description: The omnibase_spi pull request of this ticket (protocols with conformance suites) is merged. Hosted CI cannot be relied on to reach GitHub for another repository, so only the local Done gate runs this unbound check.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: bash -o pipefail -c 'gh api repos/OmniNode-ai/omnibase_spi/pulls/435 --jq .merged_at | grep -E "^20"'
        cwd: .
  - id: dod-omn22185-core-half
    description: The omnibase_core pull request of this ticket (the overlay_constraints validator for R1 and R2) is merged. Only the local Done gate runs this unbound check.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: bash -o pipefail -c 'gh api repos/OmniNode-ai/omnibase_core/pulls/2246 --jq .merged_at | grep -E "^20"'
        cwd: .
  - id: dod-omn22185-deploy-smoke
    description: Hosted deployment smoke loads the packaged node contract through the serve handler, requires the declared lock beside the ledger, and appends once under concurrent processes. This checks the local serve wiring without a lab endpoint or broker; it is not a live deployment readback.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/nodes/node_work_ledger_append_effect/test_append_if_absent.py -q --no-cov -k 'serve_wiring or two_concurrent_processes'
        cwd: .
    binds_ac: [AC3]
  - id: dod-omn22185-integration-proof
    description: The pushed head ran the append node and ledger bus tests, concurrency cases included, on a lab host through the bus and exited 0. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: |-
          uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane lander-p0-ledger-1250 -- uv run --frozen pytest tests/unit/nodes/node_work_ledger_append_effect tests/unit/work_ledger_bus -q --no-cov
        cwd: .
