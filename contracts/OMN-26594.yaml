---
schema_version: "1.0.0"
ticket_id: OMN-26594
title: "Five merged gateway terminal, roll gate and metering changes are each read SEEN RUNNING or NOT RUNNING on dev, with one evidence line each"
summary: The read found the gateway workflow terminal writer running on dev while the runtime dropped its decision event on every delivery, because the contract declared a terminal topic but no published event; the contract now declares it, so the runtime registers a result applier and publishes the decision.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn26594-seen-running-reads
    statement: Each of the five merged changes has one verdict, and a verdict that finds a defect in our code is fixed failure-first.
    acceptance:
      - id: AC1
        statement: "AC1: each merge named above has one verdict, SEEN RUNNING or NOT RUNNING, with the evidence line (log line, row or command output) quoted beside it -- falsifier: grep the lane report for one verdict line per merge each followed by a non-empty evidence line returns fewer lines than merges today"
      - id: AC2
        statement: "AC2: every SEEN RUNNING verdict names the log, database or journal read that holds its line, and every NOT RUNNING verdict names the declared caller that was invoked and the missing piece with its fix -- falsifier: the report's verdict table read for a row with an empty source or fix cell"
      - id: AC3
        statement: "AC3: the verdicts are sent to orchestrator-31d9-swarm by one ledger MSG -- falsifier: grep the rolling ledger for a MSG row from proof5-1-1400 to=orchestrator-31d9-swarm returns zero rows today"
evidence_requirements:
  - kind: tests
    description: The runtime-wiring test of the writer's contract, which fails when the contract leaves the decision event undeclared.
    command: uv run pytest tests/nodes/node_gateway_workflow_terminal_effect -q --no-cov
  - kind: tests
    description: The projection's BYOK pricing logs the source and read time of each price it books; the tests fail when the line is absent.
    command: uv run pytest tests/unit/nodes/node_projection_delegation/test_byok_price_source_line_omn26594.py -q --no-cov
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-omn26594-ac1
    description: "The verdict for the gateway terminal writer rests on a defect this change fixes: the runtime registered no result applier for the writer, so its decision event was dropped. The wiring test fails before the contract change and passes after it."
    source: manual
    binds_ac: [AC1]
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/nodes/node_gateway_workflow_terminal_effect/test_applied_event_reaches_bus.py -q --no-cov
        cwd: .
  - id: dod-omn26594-ac2
    description: "The fix for the one defect the read found is the writer contract's published event, terminal event, publish topic and broker grant; the node's own tests still pass."
    source: manual
    binds_ac: [AC2]
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/nodes/node_gateway_workflow_terminal_effect -q --no-cov
        cwd: .
  - id: dod-omn26594-ac3
    description: "AC3 is proved by the lane's MSG row to orchestrator-31d9-swarm at terminal, out of this change's reach; the check here is the wiring test the verdict rests on."
    source: manual
    binds_ac: [AC3]
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/nodes/node_gateway_workflow_terminal_effect/test_applied_event_reaches_bus.py -k decision -q --no-cov
        cwd: .
  - id: dod-omn26594-integration-proof
    description: "Run the writer node's tests on a lab host at the pushed head; the local Done gate runs this unbound check."
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-26594 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_gateway_workflow_terminal_effect -q --no-cov
        cwd: .
  - id: dod-omn26594-price-source-line
    description: "The read of omnimarket#6594 found no dev log or row naming the source that priced a BYOK call (catalogue, model registry or models.dev with its read time), so the models.dev leg could not be told from the catalogue leg that wins first. The projection's BYOK pricing now logs one INFO line per priced call with the source and read time; the tests fail on dev without it."
    source: manual
    binds_ac: [AC1, AC2]
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/nodes/node_projection_delegation/test_byok_price_source_line_omn26594.py -q --no-cov
        cwd: .
  - id: dod-omn26594-registration-slug-to-uuid
    description: "A key registered with onex secret register-tenant-key under a tenant slug was stored in tenant_inference_credentials and delegation_routing_tenant_overlay under the slug while the router reads the overlay by tenant UUID, so the customer's registration was never read. The credentials projection now resolves the slug through tenant_registry_mirror and writes under the UUID; the tests (a registration by slug is read by the resolver for that tenant, a second registration replaces the first, another tenant's rows are never read, an unknown slug writes nothing) fail on the base and pass after."
    source: manual
    binds_ac: [AC1, AC2]
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/test_omn26594_registration_slug_writes_tenant_uuid.py -q --no-cov
        cwd: .
