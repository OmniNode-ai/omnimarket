schema_version: 1.0.0
ticket_id: OMN-23082
title: "Join J1 passes: the host reading node's join-j1 probe carries a failing control, so a writing run gives the join its golden and its error side from one real graph run"
summary: "Join J1 (code graph to hosts and capacity) reads not_run on the served floor because the join-j1 probe was built (OMN-22904) but never declared for a host, so it never ran, and its error side only appears when the real graph run fails. The probe gains an overlay-declared control_node: a node the graph can never hold. A writing run judges the same graph run once more against it under its own graph run id and publishes the typed upstream failure with no start, which is the join's error side from a real run. A control that does not break the join turns the reading red. The overlay change that declares the probe on the host is its own pull request in the overlays repository."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23082-join-j1-control
  statement: "A writing join-j1 run emits the golden chains under the graph run's id and the typed failure chains of the failing control under its own id, so the floor's receipt fold reads join J1 as passed; a control that does not break the join reads NOT_WORKING."
  acceptance:
  - id: AC1
    statement: 'AC1: golden join test: one writing run with a control makes the floor fold read J1 passed -- falsifier: uv run pytest tests/unit/nodes/node_host_reading_effect/test_join_j1.py -q -k "golden_a_writing_run_with_a_control"'
  - id: AC2
    statement: 'AC2: error and control tests: the control is a typed upstream failure that never starts the host stage, a control that does not break reads NOT_WORKING, and without the control the join reads golden_only -- falsifier: uv run pytest tests/unit/nodes/node_host_reading_effect/test_join_j1.py -q -k "control"'
evidence_requirements:
- kind: tests
  description: "Join J1 golden, error and control tests on the in-memory and the git-backed graph source"
  command: uv run --frozen pytest tests/unit/nodes/node_host_reading_effect -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23082-tests
  description: "Golden, error and control join tests of join J1 pass on both graph source backends."
  source: manual
  binds_ac:
  - AC1
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/nodes/node_host_reading_effect -q --no-cov
    cwd: .
- id: dod-omn23082-integration-proof
  description: Run this pull request's own tests on a lab host at the pushed head. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23082 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/nodes/node_host_reading_effect -q --no-cov
    cwd: .
- id: dod-omn23082-floor-read
  description: "The served floor record's join J1 reads passed with golden and error ages, read from the lab after the overlay pull request has installed the probe on the host that runs the floor tick. Unbound, so only the local Done gate runs it."
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: sh -c 'curl -fsS "$ONEX_FLOOR_SIMPLE_URL" | python3 -c "import json,sys; j=json.load(sys.stdin)[\"pieces\"][0][\"joins\"][0]; assert j[\"id\"]==\"J1\" and j[\"state\"]==\"passed\", j"'
    cwd: .
