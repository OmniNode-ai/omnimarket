---
schema_version: "1.0.0"
ticket_id: "OMN-20945"
title: "OCC retirement: node_dod_verify refuses a product-repo contract YAML with a duplicate mapping key instead of silently keeping the last entry"
summary: "node_dod_verify parsed a contract with yaml.safe_load, which keeps the last of two equal mapping keys without a word, so an evidence item could lose its description and command while the gate passed. The evidence collector and the sweep orchestrator's receipt_exists check now load a contract through omnibase_core's strict mapping loader, and a duplicate key is a failed result naming file, line and key. The duplicates already present on the nine product repos' origin/dev contracts are listed in the pull request body."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-duplicate-key-refused"
    statement: "A contract with a duplicate mapping key is a typed failure, never a pass."
    acceptance:
      - id: "AC1"
        statement: "AC1: node_dod_verify loads a contract through omnibase_core's strict mapping loader and reports a contract with a duplicate key as a typed failure naming file, line and key, never as a pass -- falsifier: a test added under tests/unit/nodes/node_dod_verify that feeds a contract with a duplicated evidence_requirements item key fails at the merge base and passes at the head (uv run pytest on that file)"
  - id: "req-clean-contracts-unchanged"
    statement: "A contract with no duplicate key verifies exactly as before."
    acceptance:
      - id: "AC2"
        statement: "AC2: A contract with no duplicate key verifies exactly as before -- falsifier: the existing node_dod_verify tests and one recorded contract from each of omnimarket, omnibase_infra and omnibase_core dev give the same verdict at the merge base and at the head (uv run pytest tests/unit/nodes/node_dod_verify)"
  - id: "req-duplicates-announced"
    statement: "The duplicates already on the product repos' dev contracts are listed before those repos bump their omnimarket pin."
    acceptance:
      - id: "AC3"
        statement: "AC3: Every contracts/\\*.yaml on origin/dev of the nine product repos is scanned with the strict loader and each duplicate found is listed by repo, file, line and key in the PR body, so no repo meets the new refusal unannounced when it bumps its omnimarket pin -- falsifier: the scan, rerun from the canonical clones on a lab host and recorded on the PR body Lab: line, names a duplicate the list omits"
evidence_requirements:
  - kind: "tests"
    description: "AC1: a contract with a duplicated evidence_requirements item key fails with file, line and key."
    command: "uv run pytest tests/unit/nodes/node_dod_verify/test_contract_duplicate_key_omn20945.py -q -p no:randomly"
  - kind: "tests"
    description: "AC2: the existing node_dod_verify tests give the same verdicts."
    command: "uv run pytest tests/unit/nodes/node_dod_verify -q -p no:randomly"
  - kind: "command"
    description: "AC3: the strict-loader scan of every contracts/*.yaml on origin/dev of the nine product repos prints each duplicate."
    command: "uv run python -c 'import os, subprocess as s\nfrom omnibase_core.errors.error_duplicate_yaml_mapping_key import DuplicateYamlMappingKeyError as D\nfrom omnibase_core.utils.util_safe_yaml_loader import load_yaml_mapping_no_duplicates as L\nh = os.environ[\"OMNI_HOME\"]\ndef g(r, *a):\n    return s.run([\"git\", \"-C\", h + \"/\" + r, *a], capture_output=True, text=True, check=True).stdout\nfor r in \"omnibase_core omnibase_infra omniclaude omnimarket omnibase_spi omnibase_compat omnimemory omniintelligence omnidash\".split():\n    for n in g(r, \"ls-tree\", \"-r\", \"--name-only\", \"origin/dev\", \"--\", \"contracts/\").split():\n        if n.endswith(\".yaml\") and n.count(\"/\") == 1:\n            try:\n                L(g(r, \"show\", \"origin/dev:\" + n), source=n)\n            except D as e:\n                print(\"DUPLICATE\", r, n, e.line, e.key)\n'"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn20945-ac1-duplicate-key-refused"
    description: "AC1: a contract with a duplicated evidence_requirements item key is a FAILED result naming file, line and key."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/nodes/node_dod_verify/test_contract_duplicate_key_omn20945.py -q -p no:randomly"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC1"]
  - id: "dod-omn20945-ac2-clean-contracts-unchanged"
    description: "AC2: the existing node_dod_verify tests pass with the strict loader in place."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/nodes/node_dod_verify -q -p no:randomly"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC2"]
  - id: "dod-omn20945-ac3-duplicates-scanned"
    description: "AC3: the strict-loader scan of the nine product repos' origin/dev contracts runs and prints each duplicate."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: "uv run python -c 'import os, subprocess as s\nfrom omnibase_core.errors.error_duplicate_yaml_mapping_key import DuplicateYamlMappingKeyError as D\nfrom omnibase_core.utils.util_safe_yaml_loader import load_yaml_mapping_no_duplicates as L\nh = os.environ[\"OMNI_HOME\"]\ndef g(r, *a):\n    return s.run([\"git\", \"-C\", h + \"/\" + r, *a], capture_output=True, text=True, check=True).stdout\nfor r in \"omnibase_core omnibase_infra omniclaude omnimarket omnibase_spi omnibase_compat omnimemory omniintelligence omnidash\".split():\n    for n in g(r, \"ls-tree\", \"-r\", \"--name-only\", \"origin/dev\", \"--\", \"contracts/\").split():\n        if n.endswith(\".yaml\") and n.count(\"/\") == 1:\n            try:\n                L(g(r, \"show\", \"origin/dev:\" + n), source=n)\n            except D as e:\n                print(\"DUPLICATE\", r, n, e.line, e.key)\n'"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC3"]
