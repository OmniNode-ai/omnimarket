schema_version: 1.0.0
ticket_id: OMN-24546
title: "Install requests: a lane ends with a typed request the host installer carries out"
summary: A lane that ends with a change needing an install on a named host publishes one typed install request on the bus; the installer on that host decides, installs through the declared installer with its own rollback, runs the request's verify command and publishes a typed result. The request owns the NOT RUNNING line until a verified result exists, and a request not verified inside its expiry prints one line for the throughput tick.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24546-install-request
  statement: A typed install request, its decision, its host installer and its owed reading exist as nodes, with the first slice on one lab host and the launching host's plugin tree.
  acceptance:
  - id: AC1
    statement: "AC1: the pure decision executes only a request for its own host that is unexpired, not yet verified and unblocked, and ignores, skips, expires or holds every other -- falsifier: pytest tests/unit/nodes/node_install_request_decision_compute -q fails when the expiry rule is removed"
  - id: AC2
    statement: "AC2: a request with no verified result is owed and owns a NOT RUNNING line, and past its expiry prints one expired line -- falsifier: pytest tests/unit/nodes/node_install_request_owed_compute -q fails when the verified-clears rule is removed"
  - id: AC3
    statement: "AC3: the installer refuses a unit, repository or verify command its host row does not declare before anything is written, and answers verified only when the verify output holds the expected line -- falsifier: pytest tests/unit/nodes/node_install_request_effect -q fails when the verify-command check is removed"
  - id: AC4
    statement: "AC4: the request, result and installed-revision line keep one shape across the compute nodes, the effect, the unit tree installer and the handoff proof reader, on the in-memory bus and on a real broker -- falsifier: pytest tests/seams/test_install_request_seam.py -q fails when either side changes shape"
  - id: AC5
    statement: "AC5: integrated, read in the running runtime: a request published on the bus for h051 is carried out by the installer served there and its result names the installed revision and the verify line -- falsifier: the result journal on h051 holds the request id with status verified and the revision of the pushed head"
evidence_requirements:
- kind: tests
  description: The node tests pass at the pushed head.
  command: uv run pytest tests/unit/nodes/node_install_request_decision_compute tests/unit/nodes/node_install_request_owed_compute tests/unit/nodes/node_install_request_effect -q -p no:randomly --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24546-ac1
  description: "AC1: the decision tests pass at the head; the failing control removes the expiry rule and the expired request reads execute."
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/nodes/node_install_request_decision_compute -q -p no:randomly --no-cov
    cwd: .
- id: dod-omn24546-ac2
  description: "AC2: the owed reading tests pass at the head; the failing control removes the verified-clears rule and a verified request stays owed."
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/nodes/node_install_request_owed_compute -q -p no:randomly --no-cov
    cwd: .
- id: dod-omn24546-ac3
  description: "AC3: the effect tests pass at the head, covering the golden unit-tree and plugin-tree installs and the typed refusals; the failing control lets an undeclared verify command through and the runner is then called."
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/nodes/node_install_request_effect -q -p no:randomly --no-cov
    cwd: .
- id: dod-omn24546-ac4
  description: "hosted proxy for AC4: the seam test over the in-memory bus passes here; the real-broker leg runs where INSTALL_REQUEST_PARITY_BOOTSTRAP names a plaintext lab broker and its reading is posted as a pull request comment naming the head."
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/seams/test_install_request_seam.py -q -p no:randomly --no-cov
    cwd: .
- id: dod-omn24546-integration-proof
  description: the node tests run on a lab host at the pushed head; hosted CI cannot reach the lab, so only the local Done gate runs this unbound check
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24546 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/nodes/node_install_request_effect -q --no-cov -p no:randomly
