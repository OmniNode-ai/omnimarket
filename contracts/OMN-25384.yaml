schema_version: 1.0.0
ticket_id: OMN-25384
title: The Delegation Health Check gates dev on a nightly run against dev; stability's run alarms and never gates dev
summary: The Delegation Health Check that gates omnimarket merges into dev reads the newest run of delegation-regression-nightly.yml by file name. That workflow measured the stability lane, so a broken stability environment froze the merge queue for about 12 hours while dev was healthy. The nightly's gating leg now measures the dev lane (same golden tasks and assertions; the lane's broker, transport and mechanism come from the lane overlay), and the stability measurement is a second, alarm-only leg of the same job (continue-on-error) that cannot turn the run's conclusion, which the check reads, red.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
