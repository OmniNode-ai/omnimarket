schema_version: 1.0.0
ticket_id: OMN-25384
title: The Delegation Health Check gates dev on a nightly run against dev; stability's run alarms and never gates dev
summary: The nightly's gating leg measures the dev lane. On dev, golden case I8 read a budget-timeout terminal because the bus delegation workflow kept re-drafting and escalating past the caller's requested_timeout_seconds (it read only its node's 900 s completion bound), so its real FAILED terminal reached the delegation_events row after the delegate-skill handler had committed its own budget-timeout terminal. The bus workflow now applies the in-process port's two budget rules to the caller's budget measured from emitted_at - a same-tier re-draft leaves the class's next-rung reserve, a next rung is reached only with the class's rung floor left - and otherwise closes the run FAILED inside the budget.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn25384-dev-gate
  statement: The check that gates dev reads a nightly run against dev, and the dev run's golden cases terminate inside the caller's budget.
  acceptance:
  - id: AC1
    statement: 'AC1: a resolved, wired mechanism enforces the ruling of 2026-11-17T14:08:49Z -- the bus delegation ladder stops inside the caller''s requested budget, so the dev leg the check reads scores I8 on the workflow''s own FAILED terminal -- falsifier: uv run pytest tests/unit/delegation/test_bus_ladder_caller_budget_omn25384.py -q (red at the merge base)'
