- id: dod-omn25384-ac1-integration-proof
  description: On a lab host, from the pushed head, the Layer-2 golden-task runner publishes the integration corpus to the dev lane's delegate-skill command topic and scores each case from its delegation_events row; I8 reads terminal failed, not timeout. Hosted CI cannot reach the dev lane, so this unbound check belongs to the local Done gate; it is read there and in the PR's Lab line, beside the dev leg of delegation-regression-nightly dispatched from this branch after the dev install.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: 'env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-25384 --kind test -- env ONEX_E2E_LANE=dev OMN_ALLOW_LIVE_E2E_PROBE=true uv run --frozen python -m tests.delegation_golden.runner --out delegation_regression_scoreboard.json'
