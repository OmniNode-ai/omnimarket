- id: req-omn25384-dev-gate
  statement: The check that gates dev reads a nightly run against dev, and a failed stability run never fails it.
  acceptance:
  - id: AC1
    statement: 'AC1: a resolved, wired mechanism enforces the ruling of 2026-11-17T14:08:49Z -- the run the check reads measures the dev lane, the stability measurement is an alarm-only leg that cannot turn that run red, a failed stability leg with a green dev leg passes the check and a failed dev leg fails it -- falsifier: uv run pytest tests/ci/test_delegation_gate_reads_dev_omn25384.py -q (red against the workflows at the merge base)'
