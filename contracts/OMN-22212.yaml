schema_version: 1.0.0
ticket_id: OMN-22212
title: The refusal-phrase veto routes a refused secret request to a cloud rung instead of ending in a typed refusal
summary: When a rung refused a request for secrets or for moving data out, the quality gate's refusal-phrase rule vetoed the refusal, and the local delegation port re-drafted it and then escalated the prompt to a cloud rung. The port now reads a secret_request_refusal block declared in the delegate-skill node's contract (request markers, the refusal verdict prefix and the typed stop reason). A refusal veto on a request that matches a marker is a terminal veto, so the run ends on the rung that refused, with terminal_failure_reason secret_request_refused and a TERMINATE decision on the attempt. A refusal veto on any other request still re-drafts and climbs as before.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn22212-secret-refusal-terminal
  statement: A refused secret or exfiltration request ends in a typed refusal on the rung that refused it, and an ordinary refusal still climbs.
  acceptance:
  - id: AC1
    statement: 'AC1: a refusal of a secret or exfiltration request is a terminal typed refusal and is never escalated to a cloud rung -- falsifier: uv run pytest tests/unit/delegation/test_secret_request_refusal_terminal.py -q -k never_escalated, a stub local rung that refuses a secret request, which escalates to the cloud stub today'
  - id: AC2
    statement: 'AC2: a refusal of an ordinary request that the veto catches still climbs as before -- falsifier: uv run pytest tests/unit/delegation/test_secret_request_refusal_terminal.py -q -k ordinary_refusal_still_climbs'
  - id: AC3
    statement: 'AC3: a regression test built from the recorded run 9fc115b5 (three vetoed refusals then a cloud answer, scrubbed) fails on the current code and passes on the fix -- falsifier: uv run pytest tests/unit/delegation/test_secret_request_refusal_terminal.py -q -k receipt_9fc115b5'
evidence_requirements:
- kind: tests
  description: A stubbed local rung that refuses a secret request stops there, the same refusal on an ordinary request still climbs, and the recorded run no longer reaches the cloud stub.
  command: uv run pytest tests/unit/delegation/test_secret_request_refusal_terminal.py -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn22212-ac1
  description: AC1 a stub local rung refuses a secret request; the cloud stub is never called, the run ends after one attempt with terminal_failure_reason secret_request_refused and a TERMINATE decision, and the declared predicate fires only on a refusal veto of a request that matches a marker.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/delegation/test_secret_request_refusal_terminal.py -q --no-cov --tb=line -k never_escalated
    cwd: .
- id: dod-omn22212-ac2
  description: AC2 the same refusing local rung on an ordinary request re-drafts on the local tier and then reaches the cloud stub, with every local attempt recorded as a climb.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/delegation/test_secret_request_refusal_terminal.py -q --no-cov --tb=line -k ordinary_refusal_still_climbs
    cwd: .
- id: dod-omn22212-ac3
  description: AC3 run 9fc115b5 scrubbed (a secret-request prompt, three local refusals vetoed for refusal phrases, then a cloud answer that completed) now stops on the first local refusal and hands back that refusal; at the base the stubs record three local calls and one cloud call.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/delegation/test_secret_request_refusal_terminal.py -q --no-cov --tb=line -k receipt_9fc115b5
    cwd: .
- id: dod-omn22212-deploy-probe
  description: 'Deploy probe: the delegate-skill node contract GitHub serves at the checked-out commit declares the secret_request_refusal block with its typed stop reason, which the merge base does not.'
  source: manual
  checks:
  - check_type: command
    check_value: |-
      bash -o pipefail -c 'gh api "repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_delegate_skill_orchestrator/contract.yaml?ref=$(git rev-parse HEAD)" --jq .content | base64 -d | grep -F "terminal_failure_reason: secret_request_refused" > /dev/null'
    cwd: .
- id: dod-omn22212-integration-proof
  description: The pushed head ran the focused tests of this change (a refused secret request ends in a typed refusal and is never escalated) on a lab host and exited 0. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-22212 --kind test -- uv run --frozen pytest tests/unit/delegation/test_secret_request_refusal_terminal.py -q --no-cov
    cwd: .
