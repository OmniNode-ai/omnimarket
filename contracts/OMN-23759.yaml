schema_version: 1.0.0
ticket_id: OMN-23759
title: A pure compute node renders the standard contract into the ticket body and parses it back, reporting drift by fingerprint
summary: A new pure compute node, node_ticket_contract_render_compute, renders the standard (schema 1.1.0) ticket contract into the ticket body and parses a body back into its filing lines and contract. A block whose contract_fingerprint no longer recomputes is reported as contract_not_synced, text that differs from a fresh render as rendered_text_drift, and the filing lines are never compared. Render refuses text that does not parse back with the same fingerprint.
is_seam_ticket: true
interface_change: true
interfaces_touched:
- topics
requirements:
- id: req-omn23759-render-parse
  statement: One renderer turns a standard contract into the ticket body and a parser reads it back, so the ticket and the contract file can be compared by fingerprint.
  acceptance:
  - id: AC1
    statement: 'AC1: for every fixture, the rendered body passes the core create gate''s checker with no finding -- falsifier: uv run pytest src/omnimarket/nodes/node_ticket_contract_render_compute/tests -q -k render_passes_create_gate'
  - id: AC2
    statement: 'AC2: parse(render(c)) has the same fingerprint as c for every 1.1.0 fixture -- falsifier: uv run pytest src/omnimarket/nodes/node_ticket_contract_render_compute/tests -q -k round_trip'
  - id: AC3
    statement: 'AC3: an edited criterion line above an unchanged block yields rendered_text_drift -- falsifier: uv run pytest src/omnimarket/nodes/node_ticket_contract_render_compute/tests -q -k text_drift'
  - id: AC4
    statement: 'AC4: a block edited by hand, whose contract_fingerprint no longer equals its recomputed fingerprint, yields contract_not_synced -- falsifier: uv run pytest src/omnimarket/nodes/node_ticket_contract_render_compute/tests -q -k block_edited'
  - id: AC5
    statement: 'AC5: a body whose filing lines come from a different lane, with the same contract, yields no rendered_text_drift -- falsifier: uv run pytest src/omnimarket/nodes/node_ticket_contract_render_compute/tests -q -k filing_lines_not_compared'
  - id: AC6
    statement: 'AC6: integrated: done only when running and observed where it runs: the compute installed from the merged revision answers one render request on the dev bus -- falsifier: one render request on the dev bus and its reply, the output pasted in the pull request'
evidence_requirements:
- kind: tests
  description: The render, round trip, drift, edited-block and filing-line tests pass at the pushed head.
  command: uv run pytest tests/nodes/node_ticket_contract_render_compute -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23759-ac1
  description: 'AC1: every fixture, rendered, passes the core create gate''s checker (omnibase_core check_ticket_creation, the pinned release) with no finding; a body with its Gate line removed is refused by the same checker (the control).'
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_ticket_contract_render_compute -q --no-cov -n 0 -p no:randomly -k render_passes_create_gate
    cwd: .
- id: dod-omn23759-ac2
  description: 'AC2: parse of render keeps the fingerprint for every 1.1.0 fixture, including one whose text holds a code fence.'
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_ticket_contract_render_compute -q --no-cov -n 0 -p no:randomly -k round_trip
    cwd: .
- id: dod-omn23759-ac3
  description: 'AC3: an edited criterion line above an unchanged block is reported as rendered_text_drift and nothing else.'
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_ticket_contract_render_compute -q --no-cov -n 0 -p no:randomly -k text_drift
    cwd: .
- id: dod-omn23759-ac4
  description: 'AC4: a block edited by hand is reported as contract_not_synced, naming the stated and the recomputed fingerprint.'
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_ticket_contract_render_compute -q --no-cov -n 0 -p no:randomly -k block_edited
    cwd: .
- id: dod-omn23759-ac5
  description: 'AC5: a body with other filing lines and the same contract yields no finding and the same fingerprint.'
  source: manual
  binds_ac:
  - AC5
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_ticket_contract_render_compute -q --no-cov -n 0 -p no:randomly -k filing_lines_not_compared
    cwd: .
- id: dod-omn23759-ac6
  description: 'hosted proxy for AC6: the node tests pass; the dev-bus render request and its reply are taken after the merged revision is installed and are pasted in a pull request comment.'
  source: manual
  binds_ac:
  - AC6
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_ticket_contract_render_compute -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn23759-integration-proof
  description: the node's tests run on a lab host at the pushed head; hosted CI cannot reach the lab, so only the local Done gate runs this unbound check
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23759 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_ticket_contract_render_compute -q --no-cov
    cwd: .
