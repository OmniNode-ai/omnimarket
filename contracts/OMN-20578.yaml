schema_version: "1.0.0"
ticket_id: "OMN-20578"
title: "The routing-feedback and alert-channel liveness projection tables are vendored and granted in omnibase_infra"
summary: "omnimarket carries the source migrations, ownership declarations and shape reconciliation for the routing-feedback and alert-channel liveness projection tables; omnibase_infra vendors them byte-identically and derives the projection grants. The ticket's AC1 and AC2 run in omnibase_infra and are listed as unbound local_done_gate items, because the hosted check carries only this repository and cannot control them; AC1 is bound to the omnimarket prerequisite test, which it can run. The ticket's AC3 is a dev-202 runtime log readback and is neither listed nor bound here."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-routing-feedback-and-alert-liveness-vendored-and-granted"
    statement: "The routing-feedback and alert-channel liveness projection tables are vendored and granted in omnibase_infra. The criterion below is transcribed from the ticket body; its id is the label a binding item claims through binds_ac. The ticket's AC2 (grant derivation, run in omnibase_infra) and AC3 (a dev-202 runtime log readback) cannot run in this repository's hosted check, so they stay in the ticket and in the unbound local_done_gate items, not in this repo-owned acceptance list."
    acceptance:
      - id: "AC1"
        statement: "AC1: the vendored migration files are byte-identical to the omnimarket source of both PRs and carry ledger rows and migration classes -- falsifier: uv run pytest tests/unit/migrations/test_vendor_routing_feedback_and_alert_liveness.py -q in omnibase_infra"
evidence_requirements:
  - kind: "tests"
    description: "AC1 omnibase_infra probe. The vendored migration files match the omnimarket source and carry ledger rows and migration classes."
    command: "uv run pytest tests/unit/migrations/test_vendor_routing_feedback_and_alert_liveness.py -q"
  - kind: "tests"
    description: "AC2 omnibase_infra probe. The grant derivation check proves both tables granted to the projection principal on every topology instance and catalog."
    command: "uv run python scripts/generate_application_database_table_grants.py --check"
  - kind: "tests"
    description: "AC1 omnimarket probe. The source migrations reconcile every declared routing-feedback column and the ownership manifest declares each created relation exactly once, which omnibase_infra's vendoring gates require."
    command: "uv run pytest tests/test_omn20578_vendor_prereqs_declared.py -q"
