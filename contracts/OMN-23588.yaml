schema_version: 1.0.0
ticket_id: OMN-23588
title: The hourly reading reads a failed source once more at the end of its run
summary: node_reading_writer_effect holds a piece whose source stayed unreadable through its inline retries, finishes the other pieces, then reads each held piece once and writes its row from that read. The pass is bounded by read_retry.reread_budget_seconds in the overlay; absent, there is no final pass.
is_seam_ticket: false
interface_change: true
interfaces_touched:
- public_api
requirements:
- id: req-omn23588-final-pass
  statement: A source that fails its inline retries and then answers is read WORKING in the same run, written once; a source that stays down writes UNKNOWN as today inside the unit limit; the key is an optional overlay value.
  acceptance:
  - id: AC1
    statement: 'AC1: a source whose ledger read failed through its inline retries is read once more after the other pieces of the same run, and its reading is written from that read -- falsifier: uv run pytest tests/unit/nodes/node_reading_writer_effect -k final_pass_reads_late fails at the base, where the piece writes UNKNOWN'
  - id: AC2
    statement: 'AC2: when the final read fails too, the piece writes UNKNOWN as today, later deferred pieces are not read, and the final pass spends at most the overlay''s reread_budget_seconds before starting a read -- falsifier: uv run pytest tests/unit/nodes/node_reading_writer_effect -k final_pass_stays_unknown with a read that always fails'
  - id: AC3
    statement: 'AC3: the new key is optional in the overlay model and absent means no final pass, so the unit''s current overlay still loads -- falsifier: uv run pytest tests/unit/nodes/node_reading_writer_effect -k final_pass_overlay with the key absent and with a non-positive value'
  - id: AC4
    statement: 'AC4: integrated: after the change runs on h053 the hourly unit''s next run reads piece 1 as read or written inside 600 s and exits 0 -- falsifier: the unit''s journal and WINDOW line of the next run after the install name a failed count above 0 or a run past 600 s'
evidence_requirements:
- kind: tests
  description: The final pass, seam and neighbouring read budget tests of the reading writer.
  command: uv run --frozen pytest tests/unit/nodes/node_reading_writer_effect/test_final_pass_omn23588.py tests/unit/nodes/node_reading_writer_effect/test_join_final_pass_to_floor_omn23588.py tests/nodes/node_reading_writer_effect/test_read_budget_omn23119.py -q --no-cov -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23588-final-pass-tests
  description: The final pass tests pass; with the source change reverted 8 of 9 fail (the control without the key passes, as at the base).
  source: manual
  binds_ac:
  - AC1
  - AC2
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/nodes/node_reading_writer_effect/test_final_pass_omn23588.py tests/unit/nodes/node_reading_writer_effect/test_join_final_pass_to_floor_omn23588.py -q --no-cov -p no:randomly
    cwd: .
- id: dod-omn23588-integration-proof
  description: Runs the final pass tests at the pushed head on a lab host through the lab work runner; hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23588 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/nodes/node_reading_writer_effect/test_final_pass_omn23588.py tests/unit/nodes/node_reading_writer_effect/test_join_final_pass_to_floor_omn23588.py -q --no-cov -p no:randomly
    cwd: .
- id: dod-omn23588-runtime-reading
  description: 'AC4: the h053 unit run after the install ends with a WINDOW line whose failed count is 0; read from the unit log on the host, so only the local Done gate runs it.'
  source: manual
  execution_scope: local_done_gate
  binds_ac:
  - AC4
  checks:
  - check_type: command
    check_value: grep -a "^WINDOW " "$OMNI_HOME/.onex_state/reading-writer/reading-writer.out.log" | tail -1 | grep -q "failed=0"
    cwd: .
