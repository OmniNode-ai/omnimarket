schema_version: 1.0.0
ticket_id: OMN-24410
title: Let the host role baseline check be called through the running system
summary: 'node_host_role_baseline_compute is in the dev runtime and subscribes its command topic, but onex run-node refuses it: its overlay document names no event_bus, and ModelHostRoleBaselines keeps
  extra=forbid, so the key could not be added. The model gains an optional event_bus (ModelNodeEventBus, the shape omnimarket#6074 gave two other nodes), the example overlay carries the key, and a new test
  file holds the golden, the refusals and a failing control. Not in this change: the overlays repository key (its own change on the host role baselines pull request) and the run through the running dev
  runtime (AC3).'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24410-event-bus
  statement: The host role baseline overlay model accepts an optional event_bus and still refuses every other unknown key.
  acceptance:
  - id: AC1
    statement: 'AC1: the settings model of node_host_role_baseline_compute accepts an optional event_bus of type kafka with a lane, refuses kafka with no lane, and still refuses every other unknown key
      -- falsifier: uv run pytest tests/unit/nodes/test_host_role_baseline_event_bus.py -q -p no:randomly --no-cov fails at the merge base'
  - id: AC2
    statement: 'AC2: the host role baselines settings file of the overlays repository carries event_bus kafka on the dev lane and loads through the model of the pinned revision -- falsifier: the overlays
      repository test of that file fails when the key is removed or the pin is behind'
  - id: AC3
    statement: 'AC3: integrated: in the running dev runtime, onex run-node node_host_role_baseline_compute with one host returns its derived event -- falsifier: the run is refused with no event_bus in its
      overlay, or no terminal event arrives'
evidence_requirements:
- kind: tests
  description: The two overlay model tests pass at the pushed head.
  command: uv run pytest tests/unit/nodes/test_host_role_baseline_event_bus.py -q -p no:randomly --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24410-ac1
  description: 'AC1: the model accepts event_bus kafka on a lane, refuses kafka with no lane, an unknown inner key and an unknown top-level key; the failing control fails at the merge base where the model
    refused the key.'
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/nodes/test_host_role_baseline_event_bus.py -q -p no:randomly --no-cov
    cwd: .
- id: dod-omn24410-ac2
  description: 'hosted proxy for AC2: the shipped example overlay carries event_bus and loads through the model at the pull request head; the overlays repository key is its own change and is named in this
    pull request.'
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/nodes/test_host_role_baseline_event_bus.py -q -p no:randomly --no-cov -k shipped
    cwd: .
- id: dod-omn24410-ac3
  description: 'hosted proxy for AC3: the model tests pass at the pull request head; the run through the running dev runtime is read after the overlays change merges and is named in the pull request.'
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/nodes/test_host_role_baseline_event_bus.py -q -p no:randomly --no-cov
    cwd: .
- id: dod-omn24410-integration-proof
  description: the model tests run on a lab host at the pushed head; hosted CI cannot reach the lab, so only the local Done gate runs this unbound check
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24410 --kind test -- env PYTHONDONTWRITEBYTECODE=1
      uv run --frozen pytest tests/unit/nodes/test_host_role_baseline_event_bus.py -q --no-cov
