schema_version: 1.0.0
ticket_id: OMN-22911
title: "Piece 4's two-backend rule: every effect the piece's reading names has an in-memory default and a real backend chosen by overlay, and one suite passes on both"
summary: "A new node, node_two_backend_suite_effect, reads the list the core effect-backends validator writes, runs every effect declared on both backends against both, publishes a golden or error event per effect and one STATUS row with the red count and the count of effects not yet on both. The reading writer carries that count in piece 4's reading row, so the floor draws it. node_reading_writer_effect and the suite node are the first two effects declared on both backends. The validator itself lands in omnibase_core under the same ticket."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn22911-two-backend
    statement: "One suite runs each listed effect on both backends and a planted effect that passes on one backend only turns it red; piece 4's reading row carries the count of effects not yet on both backends."
    acceptance:
      - id: AC2
        statement: 'AC2: one suite runs each listed effect on both backends, and a planted effect that passes on one backend only turns it red -- falsifier: uv run pytest tests/integration/test_two_backend_suite.py -q'
      - id: AC3
        statement: 'AC3: the reading row carries the count of effects not yet on both backends and the floor shows it -- falsifier: uv run pytest tests/unit/nodes/node_reading_writer_effect -q -k two_backend'
evidence_requirements:
  - kind: tests
    description: "Suite golden and error chain event tests, the planted one-sided effect, and the reading row's two_backend_pending cell read back through the floor's reading rows"
    command: uv run --frozen pytest tests/integration/test_two_backend_suite.py tests/unit/nodes/node_reading_writer_effect -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn22911-suite
    description: "The suite is green on the planted healthy effect and the enrolled effects, and red on a planted effect that passes on one backend only."
    source: manual
    binds_ac:
      - AC2
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/integration/test_two_backend_suite.py -q --no-cov
        cwd: .
  - id: dod-omn22911-reading
    description: "Piece 4's reading row carries two_backend_pending and two-backend-pending-<n> in its reason, and the floor's reading rows show the reason."
    source: manual
    binds_ac:
      - AC3
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/nodes/node_reading_writer_effect -q --no-cov -k two_backend
        cwd: .
  - id: dod-omn22911-integration-proof
    description: Run this pull request's own tests on a lab host at the pushed head. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-22911 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/integration/test_two_backend_suite.py tests/unit/nodes/node_reading_writer_effect -q --no-cov
        cwd: .
