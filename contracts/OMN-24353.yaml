schema_version: 1.0.0
ticket_id: OMN-24353
title: Stop the daily landing check from failing on every heartbeat in the development system
summary: 'The scheduled landing canary (node_landing_canary_scheduled_effect) failed with an empty AssertionError on every runtime tick in the dev runtime because the settle built a fresh in-memory canary repository instead of the one that opened the run. The code fix landed as OMN-24348 (omnimarket#6135, ModelCanaryPendingRun carries its repository). This ticket adds the tests its criteria name: a runtime tick through the real open and settle on the in-memory backend returns the run event, and a settle with a different repository object is refused.'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24353-settle-keeps-repo
  statement: The scheduled canary opens and settles through the same repository object and a runtime tick that settles a pending run returns the run event.
  acceptance:
  - id: AC1
    statement: 'AC1: a runtime tick that settles a pending run of the scheduled landing canary on the in-memory backend raises no assertion and returns the run event -- falsifier: uv run pytest tests/nodes/node_landing_canary_scheduled_effect/test_settle_keeps_repo.py -q -n 0 --no-cov fails on the code before omnimarket#6135'
  - id: AC2
    statement: 'AC2: the scheduled canary opens and settles through the same repository object, and a settle with a different repository object is shown refused by the control test -- falsifier: uv run pytest tests/nodes/node_landing_canary_scheduled_effect/test_settle_keeps_repo.py -q -n 0 --no-cov -k control fails when the different-repository settle does not raise'
  - id: AC3
    statement: 'AC3: integrated: the dev runtime log carries no landing canary AssertionError line for 10 minutes after the build that holds the fix, and a schedule-run event is published for the job -- falsifier: grep -c of docker logs of the dev runtime container since the build for landing_canary_scheduled_run.*AssertionError returns a number above 0'
evidence_requirements:
- kind: tests
  description: The canary node's focused tests pass at the pushed head.
  command: uv run --frozen pytest tests/nodes/node_landing_canary_scheduled_effect -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24353-ac1
  description: 'AC1: a runtime tick that settles a pending run of the scheduled landing canary on the in-memory backend raises no assertion and returns the run event'
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_landing_canary_scheduled_effect/test_settle_keeps_repo.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24353-ac2
  description: 'AC2: open and settle share one repository object, and the control test shows a settle with a different repository object refused'
  source: manual
