schema_version: 1.0.0
ticket_id: OMN-24885
title: The capture silence watch's unit exits 0 when it delivered an alarm
summary: The capture silence watch's tick on h201 exited 2 every tick because its node returns 2 when a silence alarm was published, so systemd marked the unit failed and the hourly pass read omnimarket#6116 as not running. The unit's tick wrapper now exits 0 when the node's code is the alarm-delivered code and records the node's own code and an alarm_delivered marker in last-run.json; any other code, including the node's fault code 3, still exits non-zero.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24885-alarm-exit
  statement: A tick whose node delivered an alarm exits 0 and says so in its evidence, and a tick whose node faulted still exits non-zero.
  acceptance:
  - id: AC1
    statement: 'AC1: a tick whose node returns the alarm-delivered code 2 exits 0 and writes last-run.json with exit_code 0, node_exit_code 2 and alarm_delivered true -- falsifier: pytest tests/nodes/node_capture_silence_watch_effect/test_capture_silence_watch_schedule.py -q -k delivered_an_alarm'
  - id: AC2
    statement: 'AC2: a tick whose node returns the fault code 3, or raises, still exits 3 and carries no alarm_delivered marker, and a quiet tick exits 0 with no marker -- falsifier: pytest tests/nodes/node_capture_silence_watch_effect/test_capture_silence_watch_schedule.py -q -k "stays_a_fault or quiet_tick or raises"'
  - id: AC3
    statement: 'AC3: integrated: on h201 the capture-silence-watch unit installed from the branch ticks and systemd reads ExecMainStatus 0 with the unit not failed -- falsifier: ssh h201 systemctl --user show onex-capture-silence-watch.service -p Result,ExecMainStatus,ActiveState read after the install'
evidence_requirements:
- kind: tests
  description: The schedule tests, the node tests and the golden chain pass at the pushed head.
  command: uv run pytest tests/nodes/node_capture_silence_watch_effect tests/test_omn19975_capture_silence_watch.py tests/test_golden_chain_capture_silence_watch_effect.py -q -n 0 --no-cov -p no:cacheprovider
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24885-ac1
  description: 'AC1: the tick wrapper maps the node alarm-delivered code 2 to exit 0 and records the node code and the alarm_delivered marker in last-run.json.'
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_capture_silence_watch_effect/test_capture_silence_watch_schedule.py -k delivered_an_alarm -q -n 0 --no-cov -p no:cacheprovider
    cwd: .
- id: dod-omn24885-ac2
  description: 'AC2: the node fault code 3 and a raised error stay non-zero without the marker; a quiet tick exits 0 without it.'
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_capture_silence_watch_effect/test_capture_silence_watch_schedule.py -k "stays_a_fault or quiet_tick or raises" -q -n 0 --no-cov -p no:cacheprovider
    cwd: .
- id: dod-omn24885-ac3
  description: 'hosted proxy for AC3: the tests above pass; the h201 install from the branch and the unit''s next tick are read on h201 and named in the pull request.'
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_capture_silence_watch_effect tests/test_omn19975_capture_silence_watch.py -q -n 0 --no-cov -p no:cacheprovider
    cwd: .
- id: dod-omn24885-integration-proof
  description: the schedule tests, the node tests and the golden chain run on a lab host at the pushed head; hosted CI cannot reach the lab, so only the local Done gate runs this unbound check
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24885 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/test_omn19975_capture_silence_watch.py tests/test_golden_chain_capture_silence_watch_effect.py tests/nodes/node_capture_silence_watch_effect -q --no-cov
    cwd: .
