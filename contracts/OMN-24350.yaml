schema_version: 1.0.0
ticket_id: OMN-24350
title: Name seam mismatches with a fixed rule and no model call
summary: Experiment exp-seampow-6803 scored 197 real cross-topic crossings from 7 days of dev bus traffic (hashed before any call; majority baseline 108 of 197). Rule R (a required declared field absent names the crossing missing_field) then a deterministic key check (a key the consumer does not declare names it unknown_field) named 180 of 197 (0.914); rule R plus the local model scored 135 with examples and 136 zero-shot, a tie (p=1.0); the key check against the model was 45 against 0 discordant (p<0.0001). No node in omnimarket named a crossing, and none called a model, so the new compute node node_seam_crossing_name_compute does the naming with no model dependency. Its consumer-side shape is the field diff detector's ModelSeamModelSummary, its three labels are contract config with an overlay that replaces them, and its command and terminal topics are declared so the runtime can wire it.
is_seam_ticket: true
interface_change: true
interfaces_touched:
  - topics
requirements:
  - id: req-omn24350-seam-crossing-name
    statement: A crossing at a seam is named by rule R then a deterministic key check in a pure compute node with no model, measured on the hashed 197-crossing fixture, with the detector-to-naming declared shape guarded by a join test.
    acceptance:
      - id: AC1
        statement: 'AC1: node_seam_crossing_name_compute names the hashed 197-crossing fixture at least 180 correctly (rule R, then the key check, no model) -- falsifier: pytest tests/nodes/node_seam_crossing_name_compute/test_seampow_fixture_score.py -q fails when the key-check step is removed'
      - id: AC2
        statement: 'AC2: the node''s labels come from the contract config or an overlay and a command on its topic reaches one completed event on the in-memory bus -- falsifier: pytest tests/nodes/node_seam_crossing_name_compute/test_overlay_seam_crossing_name.py tests/nodes/node_seam_crossing_name_compute/test_runtime_wiring_seam_crossing_name.py -q'
      - id: AC3
        statement: 'AC3: the field diff detector and the naming node share one declared-side shape and the join test fails when either changes it -- falsifier: pytest tests/nodes/node_seam_crossing_name_compute/test_join_field_diff_to_naming.py -q'
      - id: AC4
        statement: 'AC4: integrated: the node''s next run in the dev runtime names crossings and its trace shows no model call -- falsifier: read the completed event on onex.evt.omnimarket.seam-crossing-name-completed.v1 and the run''s trace in dev; a model call in the trace or no completed event fails it'
evidence_requirements:
  - kind: tests
    description: The naming node tests (golden chain, error chain, wiring on the in-memory bus, overlay, join to the field diff detector, hashed fixture score) pass at the pushed head.
    command: env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_seam_crossing_name_compute -q -p no:cacheprovider
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn24350-ac1
    description: 'AC1: the fixture score test names the hashed keys-only fixture at least 180 of 197 (exactly 180) and has failing controls: with the key-check step removed from the handler 10 of 26 tests in the node directory fail, among them the fixture score and the per-class reading; a rule-R-only control scores 108 of 197.'
    source: manual
    binds_ac:
      - AC1
    checks:
      - check_type: test_passes
        check_value: env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_seam_crossing_name_compute/test_seampow_fixture_score.py -q -p no:cacheprovider
        cwd: .
  - id: dod-omn24350-ac2
    description: 'AC2: the labels are read from the contract config or an overlay (an invalid overlay refuses and never falls back), and a command on the contract command topic reaches one completed event on the in-memory bus wired the way the runtime wires it.'
    source: manual
    binds_ac:
      - AC2
    checks:
      - check_type: test_passes
        check_value: env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_seam_crossing_name_compute/test_overlay_seam_crossing_name.py tests/nodes/node_seam_crossing_name_compute/test_runtime_wiring_seam_crossing_name.py -q -p no:cacheprovider
        cwd: .
  - id: dod-omn24350-ac3
    description: 'AC3: the join test builds one consumer summary for the field diff detector and for the naming node, shows both name the same field, and guards the shared declared-side shape (the consumer annotation and the field fact names).'
    source: manual
    binds_ac:
      - AC3
    checks:
      - check_type: test_passes
        check_value: env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_seam_crossing_name_compute/test_join_field_diff_to_naming.py -q -p no:cacheprovider
        cwd: .
  - id: dod-omn24350-ac4
    description: 'hosted proxy for AC4: the in-memory bus wiring test passes; the reading in the running dev runtime is named in the pull request and taken after the dev runtime runs this revision.'
    source: manual
    binds_ac:
      - AC4
    checks:
      - check_type: test_passes
        check_value: env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_seam_crossing_name_compute/test_runtime_wiring_seam_crossing_name.py -q -p no:cacheprovider
        cwd: .
  - id: dod-omn24350-integration-proof
    description: the naming node tests run on a lab host at the pushed head, including the in-memory bus test that wires the contract as the kernel does and the hashed fixture score; hosted CI cannot reach the lab, so only the local Done gate runs this unbound check
    source: manual
    execution_scope: local_done_gate
