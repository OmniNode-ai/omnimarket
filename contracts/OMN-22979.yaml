  - id: "req-pilot-manifest-check"
    statement: "A pilot starts only on a manifest with a frozen bar and its matching hash, and a pilot that fails its frozen bar reads rejected, not extended."
    acceptance:
      - id: "AC1"
        statement: "AC1: a pilot manifest without a frozen bar or its hash fails the check and one with both passes -- falsifier: uv run pytest tests/nodes/node_pilot_manifest_check_compute -q -p no:randomly -k bar_and_hash"
      - id: "AC2"
        statement: "AC2: a pilot that fails its frozen bar reads rejected, not extended -- falsifier: uv run pytest tests/nodes/node_pilot_manifest_check_compute -q -p no:randomly -k bar_failure_rejects"
