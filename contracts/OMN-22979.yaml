title: "The pilot manifest check refuses a pilot that starts without a frozen bar and hash"
summary: "node_pilot_manifest_check_compute is a pure compute node: given a pilot manifest it refuses a pilot with no frozen bar, no bar hash, a hash that does not match the bar, or a bar frozen after the start; given results read against the bar it returns accepted when every criterion is met and rejected when one is not, never extended. Every setting is in the node's overlay."
