- id: dod-omn21957-deploy-probe-contract
  description: "Deploy probe. GitHub serves the node contract at the checked-out HEAD with the handler bound and the report_only default; it fails at the merge base, which has neither."
  source: manual
  checks:
  - check_type: command
    check_value: >-
      gh api "repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_launch_validity_compute/contract.yaml?ref=$(git rev-parse HEAD)" --jq .content | base64 -d | python3 -c 'import sys; source = sys.stdin.read(); assert all(name in source for name in ("HandlerLaunchValidity", "mode: report_only")); print("launch validity deploy probe: PASS")'
    cwd: .
