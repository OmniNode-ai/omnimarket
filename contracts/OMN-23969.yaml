schema_version: 1.0.0
ticket_id: OMN-23969
title: The delegation scoreboard keeps publishing when the floor step refuses and says stale since when its reading is old
summary: A cycle refused at the required floor step still serves the delegation tracker built in that cycle and a status carrying a refused block; a scenario whose read is older than its limit is drawn stale since its read time, with its last result, never unread.
is_seam_ticket: false
interface_change: true
interfaces_touched:
- public_api
requirements:
- id: req-omn23969-tracker-stale-and-served
  statement: The delegation tracker is never frozen on the serving host by a refusal at the floor step, and a scenario reading that is older than its limit is named stale since its read time.
  acceptance:
  - id: AC1
    statement: "AC1: a scenario whose last read is older than the read limit is drawn as stale with the time it went stale, and is never counted as a pass or as unread -- falsifier: pytest tests/nodes/node_floor_delegation_effect/test_scenario_stale.py -q"
  - id: AC2
    statement: "AC2: a publish cycle that is refused at a required input step still serves the delegation tracker built in that cycle and names the refusal in the served status -- falsifier: pytest tests/nodes/node_factory_floor_publish_effect/test_tracker_served_on_refusal.py -q"
  - id: AC3
    statement: "AC3: a golden chain test (healthy cycle) and an error chain test (refused cycle) both pass in the in-memory bus profile -- falsifier: pytest tests/nodes/node_factory_floor_publish_effect/test_tracker_served_on_refusal.py -k chain -q"
  - id: AC4
    statement: "AC4: integrated: the tracker served at the h051 web host has a generated_at newer than the install of this change and nine scenario states, read from the running page cycle -- falsifier: curl the served delegation-tracker.json and find generated_at older than 10 minutes"
evidence_requirements:
- kind: tests
  description: The stale-state, refusal-serving and page-seam tests and the existing tracker and publish tests pass at the pushed head.
  command: uv run pytest tests/nodes/node_floor_delegation_effect tests/nodes/node_factory_floor_publish_effect/test_tracker_served_on_refusal.py tests/nodes/node_factory_floor_publish_effect/test_floor_failover.py -q -p no:randomly --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23969-ac1
  description: 'AC1: the stale-state tests pass at the head; the stale test fails at the merge base, where an old read is drawn unread.'
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_floor_delegation_effect/test_scenario_stale.py -q -p no:randomly --no-cov
    cwd: .
- id: dod-omn23969-ac2
  description: 'AC2: the refusal-serving tests pass at the head; the error chain tests fail at the merge base, where a refusal serves nothing.'
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_factory_floor_publish_effect/test_tracker_served_on_refusal.py -q -p no:randomly --no-cov
    cwd: .
- id: dod-omn23969-ac3
  description: 'AC3: the golden chain and error chain tests pass in the in-memory profile (the handler runs against a local stand-in for the serving host).'
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_factory_floor_publish_effect/test_tracker_served_on_refusal.py -k chain -q -p no:randomly --no-cov
    cwd: .
- id: dod-omn23969-ac4
  description: 'hosted proxy for AC4: the page-seam test passes here; the reading of the served tracker on the h051 web host after the install is posted as a pull request comment naming the head.'
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_floor_delegation_effect/test_page_state_seam.py -q -p no:randomly --no-cov
    cwd: .
- id: dod-omn23969-integration-proof
  description: the new tests run on a lab host at the pushed head, including the tests that fail at the merge base; hosted CI cannot reach the lab, so only the local Done gate runs this unbound check
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23969 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_factory_floor_publish_effect/test_tracker_served_on_refusal.py tests/nodes/node_floor_delegation_effect/test_scenario_stale.py -q --no-cov -p no:randomly
