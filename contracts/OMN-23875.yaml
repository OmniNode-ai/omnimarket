schema_version: 1.0.0
ticket_id: OMN-23875
title: The lab work unit carries a model's draft back, and the trial run's decision logic
summary: node_lab_work_unit_effect gains a code_draft payload (ModelLabCodeDraft) and returns diff, diff_truncated and code_edit_result on its receipt; its failure terminal echoes the command's correlation id; ModelDelegatedCodeEditRequest gains traffic_class and source_surface put on each delegate turn. A new pure node, node_code_eval_trial_reducer, with run models under node_code_eval_trial_orchestrator/models, decides one code eval run's row (formal/code_eval_trial).
is_seam_ticket: true
interface_change: true
interfaces_touched:
- public_api
- topics
requirements:
- id: req-omn23875-ac1
  statement: the lab work unit's code_draft kind returns the diff and the loop result on its receipt, also for a unit that timed out, caps a long diff, pins the loop to the draft's backend, and the failure terminal carries the command's correlation id
  acceptance:
  - id: AC1
    statement: 'AC1: the lab work unit''s code_draft kind returns the diff and the loop result on its receipt, also for a unit that timed out, caps a long diff, pins the loop to the draft''s backend, and the failure terminal carries the command''s correlation id -- falsifier: uv run pytest tests/nodes/node_lab_work_unit_effect/test_code_draft_kind.py -q, each of the breaks "diff after removal", "drop --backend-id" and a failure terminal without the correlation id turns it red'
- id: req-omn23875-ac2
  statement: every delegate turn a code draft causes carries the synthetic traffic class and the source surface the caller named
  acceptance:
  - id: AC2
    statement: 'AC2: every delegate turn a code draft causes carries the synthetic traffic class and the source surface the caller named -- falsifier: uv run pytest tests/nodes/node_lab_work_unit_effect/test_code_draft_provenance_copied.py -q, red when either link drops the two fields'
- id: req-omn23875-ac3
  statement: the pure reducer of the trial run gives 12 try rows, 2 control rows, 14 score requests and one close for two tasks, two models and bound 3, the same on redelivery; each row of the unit-end table gives its verdict; budget counting and the close rule hold
  acceptance:
  - id: AC3
    statement: 'AC3: the pure reducer of the trial run gives 12 try rows, 2 control rows, 14 score requests and one close for two tasks, two models and bound 3, the same on redelivery; each row of the unit-end table gives its verdict; budget counting and the close rule hold -- falsifier: uv run pytest tests/nodes/node_code_eval_trial_orchestrator -q, and the failing controls "skip the score request", "place after pass", "send an unscorable end to E2", "close with a try pending", "drop the nudge expiry" and "bound below the score timeout" each turn a test red'
- id: req-omn23875-ac4
  statement: 'integrated: the lab work serve of a lab host running this branch returns a code_draft unit''s receipt with its diff and loop result on the dev bus, read back by the unit id'
  acceptance:
  - id: AC4
    statement: 'AC4: integrated: the lab work serve of a lab host running this branch returns a code_draft unit''s receipt with its diff and loop result on the dev bus, read back by the unit id -- falsifier: no lab-work-unit-completed event for the unit id carrying a non-empty diff after one code_draft unit addressed to that host'
evidence_requirements:
- kind: tests
  description: The code_draft kind, provenance and reducer tests (AC1 to AC3, and the in-memory half of AC4).
  command: uv run pytest tests/nodes/node_lab_work_unit_effect/test_code_draft_kind.py tests/nodes/node_lab_work_unit_effect/test_code_draft_provenance_copied.py tests/nodes/node_code_eval_trial_orchestrator -q -n 0 -p no:randomly --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23875-ac1
  description: AC1 is the code_draft kind tests and the unchanged host bus tests.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_lab_work_unit_effect/test_code_draft_kind.py tests/unit/lab_work/test_lab_work_host_bus.py -q -n 0 -p no:randomly --no-cov
    cwd: .
- id: dod-omn23875-ac2
  description: AC2 is the provenance chain from the draft to each delegate turn's argv.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_lab_work_unit_effect/test_code_draft_provenance_copied.py tests/unit/delegated_code_edit/test_loop_ports.py -q -n 0 -p no:randomly --no-cov
    cwd: .
- id: dod-omn23875-ac3
  description: AC3 is the golden chain, classification, budget counting, close rule and failing-control tests of the reducer.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_code_eval_trial_orchestrator -q -n 0 -p no:randomly --no-cov
    cwd: .
- id: dod-omn23875-ac4
  description: 'AC4 in-memory half is the completed-unit test; the read on the dev bus from a lab host running this branch is recorded in the pull request comment that starts Lab: when taken.'
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_lab_work_unit_effect/test_code_draft_kind.py -k completed_unit -q -n 0 -p no:randomly --no-cov
    cwd: .
- id: dod-omn23875-integration-proof-lab-work-surface
  description: 'The lab-work surface a code_draft unit rides answers on the launching host. Hosted CI cannot reach the lab bus, so only the local Done gate runs this unbound item; the read of a code_draft unit''s receipt from a lab host running this branch (AC4) is recorded in the pull request comment that starts Lab: with the host, the revision and the unit id.'
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: onex lab-work run --help | grep -F -- --lane
    cwd: .
