- id: dod-omn25378-ac7
  description: The caller walk matches attribute calls, import aliases, bound names and module-level calls of resolve_tier_cost; the AC3 command of the OMN-24874 contract reads the commit subject only (see the contract check test).
  source: manual
  binds_ac:
  - AC7
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/delegation/test_omn24874_tenant_overlay_budget_readers.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn25378-ac4-lab-comment-real-postgres
  description: 'The PR holds a comment starting Lab: head= with the full head of the checkout, and after that line a line starting real-Postgres: exit=0 that carries the run''s pytest summary (N passed), so a comment that only names the run (Not run by this lane: the real-Postgres run) passes nothing. Local Done gate only: it reads the pull request comments and a sha.'
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: 'sh -c ''H=$(git rev-parse HEAD) && C=$(onex scm pr-view OmniNode-ai/omnimarket#6335 --comments) && printf %s "$C" | grep -qF "Lab: head=$H" && printf "%s\n" "$C" | sed -n "/Lab: head=$H/,\$p" | grep -qE "^real-Postgres: exit=0 .*[0-9]+ passed"'''
    cwd: .
- id: dod-omn25378-integration-proof
  description: The focused tests of this change run on a lab host at the pushed head through the lab work runner; hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --bus-lane dev --omnibase-path "${OMNI_HOME:?}" --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-25378 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/test_omn24874_contract_checks.py tests/ci/test_repo_evidence_caller_workflow.py tests/unit/delegation/test_omn24874_pricing_tier_lookup.py tests/unit/delegation/test_omn24874_tenant_overlay_terminal_cost.py tests/unit/delegation/test_omn24874_tenant_overlay_budget_readers.py tests/nodes/node_factory_floor_effect/test_model_factory_floor_runtime_ledger_projection.py -q --no-cov -n 0 -p no:randomly
    cwd: .
