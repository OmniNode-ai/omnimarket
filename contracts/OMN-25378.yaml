- id: dod-omn25378-ac5
  description: The attempt-pricing site takes the endpoint only from the decision the attempt names by routing_decision_id (another decision prices nothing), a driven run of retries on the customer's own route reaches a terminal whose cumulative cost counts every attempt at the declared price over a non-empty escalation_history and draws no ceiling budget row, and a tenant_overlay run has no platform successor tier, with a platform-tier control.
