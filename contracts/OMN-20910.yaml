    source: "manual"
    checks:
      - check_type: "command"
        check_value: |-
          env docker run --rm -v "${PWD}:/workspace:ro" -w /workspace -e PYTHONDONTWRITEBYTECODE=1 -e UV_PROJECT_ENVIRONMENT=/tmp/native-messages-venv -e UV_CACHE_DIR=/tmp/uv-cache ghcr.io/astral-sh/uv@sha256:e5b65587bce7de595f299855d7385fe7fca39b8a74baa261ba1b7147afa78e58 uv run --frozen pytest tests/test_omn20910_native_messages_protocol.py -q -p no:randomly -p no:cacheprovider --no-cov --basetemp=/tmp/native-messages-tests
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn20910-ac8-defect-catalog-node"
    description: "The defect-code catalog node validates and renders the packaged catalog; every refusal has a positive control."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/nodes/node_review_defect_catalog_compute/test_review_defect_catalog.py -q -n 0 --no-cov"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC8"]
