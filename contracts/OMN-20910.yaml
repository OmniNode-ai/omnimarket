---
schema_version: "1.0.0"
ticket_id: "OMN-20910"
title: "Review-voter models are declared in a contract overlay, not repo variables or workflow files"
summary: "omnimarket's Hostile Reviewer workflow reads every voter from the review voters overlay (since OMN-20923 a private CI overlay fetched at run time from the repository the org variable OMNI_CI_OVERLAY_REPO names, never a file of a shipped repository) through omniintelligence's cli_review --voters-overlay, its retry-budget check and its preflight. The workflow names no voter endpoint, port, model flag or endpoint variable, and a ratchet with a known-bad positive control keeps it that way. The quorum rule and the fail-closed gate are unchanged."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-workflow-reads-overlay"
    statement: "The hostile-review job resolves its voters only from the review voters overlay, at the preflight, retry-budget and review sites."
    acceptance:
      - id: "AC1"
        statement: "AC1: the preflight, retry-budget and review steps read the overlay and the overlay path is the CI overlay outside the workspace -- falsifier: env -u PYTHONPATH uv run pytest tests/ci/test_hostile_reviewer_voters_overlay_omn20910.py -q -k 'reads_the_overlay or from_the_overlay or outside_the_workspace'"
  - id: "req-no-voter-endpoint-in-workflows"
    statement: "No workflow file names a review voter endpoint, port, model flag or endpoint variable."
    acceptance:
      - id: "AC3"
        statement: "AC3: a ratchet over every reviewer workflow finds no voter endpoint, port, model flag or endpoint variable, and finds all five lines of a known-bad fixture -- falsifier: env -u PYTHONPATH uv run pytest tests/ci/test_hostile_reviewer_voters_overlay_omn20910.py -q -k 'ratchet or names_a_voter or llm_endpoint_variable'"
  - id: "req-no-voter-model-in-workflows"
    statement: "No reviewer workflow names a review voter model: no vars.*MODEL* reference, no model id literal, no MODEL env key bound to a literal."
    acceptance:
      - id: "AC4"
        statement: "AC4: the ratchet refuses a vars.<anything>MODEL reference, a model id literal and a MODEL env key bound to a literal, finds all five lines of a known-bad model fixture, and the new cases fail on the merge base -- falsifier: env -u PYTHONPATH uv run pytest tests/ci/test_hostile_reviewer_voters_overlay_omn20910.py -q -n 0 --no-cov -k voter_model_from_overlay"
      - id: "AC5"
        statement: "AC5: the ratchet's test file runs as a step of the lint job that the required lint context covers and as a check-only pre-commit hook -- falsifier: env -u PYTHONPATH uv run pytest tests/ci/test_hostile_reviewer_voters_overlay_omn20910.py -q -n 0 --no-cov -k voter_model_from_overlay_ratchet_is_wired"
  - id: "req-register-key-declared-lane"
    statement: "onex secret register-tenant-key publishes its credential-registered event on the bound host's declared ledger_bus_lane from the lab host table when the environment names no broker, so a Claude review key registers on a lab host without KAFKA_BOOTSTRAP_SERVERS."
    acceptance:
      - id: "AC6"
        statement: "AC6: with KAFKA_BOOTSTRAP_SERVERS unset, a key bound to a host whose row names ledger_bus_lane is published on that lane through the lab-run lane resolver; a broker in the environment keeps the publisher path, and an unopenable lane is refused by name -- falsifier: uv run pytest tests/unit/cli/test_omn20910_register_tenant_key_lane_bus.py -q -p no:randomly --no-cov fails at the merge base"
  - id: "req-container-check-docker-less-writer"
    statement: "The PR-create and push contract prerequisite accepts a command check whose first token is a declared verifier-host tool (docker) on a writer host with no docker, while the verifier still resolves every first token on its own PATH and prose is refused."
    acceptance:
      - id: "AC7"
        statement: "AC7: with docker unresolvable, no dev contract is refused for 'docker', a bare docker run check passes, prose is refused, and the verifier still refuses docker -- falsifier: uv run pytest tests/ci/test_contract_prerequisite_verifier_host_tools_omn20910.py -q -n 0 -p no:randomly --no-cov fails at the merge base"
  - id: "req-compact-strict-parser"
    statement: "node_review_response_parser_compute parses a v2 compact review verdict in compact_strict mode and fails closed: a verdict cut mid-array, schema-invalid, done absent, more true, an X or R finding with no family, an unknown R id or an abnormal stop reason each give a failed result with no findings, a mandatory R finding comes out critical, and a frozen v1 reply still passes in the default mode."
    acceptance:
      - id: "AC9"
        statement: "AC9: each fail-closed case has a failed result with no findings, the valid verdict is the positive control, and the v1 reply passes unchanged -- falsifier: env -u PYTHONPATH uv run pytest tests/unit/review/test_compact_strict_parser.py -q -n 0 --no-cov fails at the merge base"
  - id: "req-review-independent-judge-flag"
    statement: "The answer gate applies an independent cross-family judge to the review class only when the answer gate contract arms it; the flag ships empty, a judge that is not the selected model is refused, and a pin-only judge backend is used only when no ordinary backend qualifies."
    acceptance:
      - id: "AC10"
        statement: "AC10: with the flag empty a review answer makes no judge call and keeps its contract verdict; with review armed a judge reject refuses it, an accept passes it, and a reviewer other than the selected judge is refused -- falsifier: env -u PYTHONPATH uv run pytest tests/unit/delegation/test_review_judge_flag_omn20910.py -q -n 0 --no-cov fails at the merge base"
  - id: "req-review-cost-events"
    statement: "Every provider attempt of a Hostile Review call, including one cut off by a cancellation, leaves one cost record from the delegation call effect's per-attempt observation boundary, carrying the review provenance the gateway passes in the request."
    acceptance:
      - id: "AC11"
        statement: "AC11: a review call records one cost event per provider attempt with its usage, outcome and review provenance, an attempt that was cut off is recorded as cancelled, a call that names no review records nothing, and the gateway copies the review identity from the request metadata -- falsifier: uv run pytest tests/test_omn20910_review_call_cost_events.py tests/test_omn20910_review_gateway_provenance.py -q -p no:randomly --no-cov fails at the merge base"
  - id: "req-review-budget-admission"
    statement: "Plan ticket 6: durable atomic reservations govern synchronous and Batch calls with per-key and aggregate limits, block-wise pricing and a server-resolved persona tier."
    acceptance:
      - id: "AC33"
        statement: "Concurrent calls against a balance for one admit exactly one; outstanding Batch reservations reduce synchronous allowance; aggregate exhaustion refuses a key that still has allowance."
      - id: "AC34"
        statement: "Price each cache block at its TTL's cold-write maximum, include tool schema and output, and distinguish per-model and Batch prices."
      - id: "AC35"
        statement: "Persist reservation transitions before reply; retain uncertain charges after dispatch; settle measured usage and reconcile confirmed provider balances idempotently."
  - id: "req-review-replay-set-node"
    statement: "node_review_replay_set_effect freezes 40 merged diffs stratified by repo and size under a manifest hash."
    acceptance:
      - id: "AC12"
        statement: "AC12: the set holds the target count balanced across repo x size strata, the same inputs give the same manifest hash, a changed diff or seed changes it, pinned items are always in, and a tampered frozen manifest is refused -- falsifier: env -u PYTHONPATH uv run pytest tests/unit/nodes/node_review_replay_set_effect/test_review_replay_set.py -q -p no:randomly --no-cov fails at the merge base"
  - id: "req-claude-review-batch-node"
    statement: "node_claude_review_batch_effect submits replay items through admission and records a cost and a verdict per item."
    acceptance:
      - id: "AC13"
        statement: "AC13: each item goes admission, call, parse, verdict with an event per step in order; a refused item is never submitted; a failed call releases its reservation; a truncated, unparseable or empty answer is degraded and never passed; a diff that no longer matches the manifest is refused -- falsifier: env -u PYTHONPATH uv run pytest tests/unit/nodes/node_claude_review_batch_effect/test_claude_review_batch.py -q -p no:randomly --no-cov fails at the merge base"

  - id: "req-native-messages-protocol"
    statement: "node_llm_delegation_call_effect calls the native Anthropic Messages API for the api_native BYOK row, with prompt caching of the catalog and persona blocks and a typed stop_reason, and node_claude_review_gateway_effect serves the voter surface over it; a call naming no plan still uses the compatibility row."
    acceptance:
      - id: "AC30"
        statement: "AC30: two calls differing only in the persona block report the diff's tokens as cache_read_input_tokens on the second -- falsifier: env -u PYTHONPATH uv run pytest tests/test_omn20910_native_messages_protocol.py -q -n 0 --no-cov -k 'second_persona_reads_the_diff_from_cache or two_voter_calls' fails at the merge base"
      - id: "AC31"
        statement: "AC31: stop_reason max_tokens reaches the review parser as a typed stop reason and the gateway answers finish_reason length -- falsifier: env -u PYTHONPATH uv run pytest tests/test_omn20910_native_messages_protocol.py tests/unit/nodes/node_claude_review_gateway_effect -q -n 0 --no-cov -k 'max_tokens' fails at the merge base"
      - id: "AC32"
        statement: "AC32: a call naming no plan still uses the compatibility row and the OpenAI-compatible chat shape -- falsifier: env -u PYTHONPATH uv run pytest tests/test_omn20910_native_messages_protocol.py -q -n 0 --no-cov -k TestCallsNamingNoPlanKeepTheCompatibilityRow"
  - id: "req-defect-catalog-node"
    statement: "node_review_defect_catalog_compute validates the review defect-code catalog, refuses a duplicate or reused code, a family-letter mismatch, an enforced_by entry with no validator version and a section over its token budget, and renders the reviewer's catalog section and allowed-code set for one repository."
    acceptance:
      - id: "AC8"
        statement: "AC8: the packaged catalog resolves within 5,000 rendered tokens and each refusal has a passing positive control -- falsifier: env -u PYTHONPATH uv run pytest tests/unit/nodes/node_review_defect_catalog_compute/test_review_defect_catalog.py -q -n 0 --no-cov fails at the merge base"
  - id: "req-newest-dev-tag-and-key"
    statement: "The hostile-review job reads omniintelligence at its newest dev-* tag, resolved at run time, and no step carries the Claude API key from an Actions secret."
    acceptance:
      - id: "AC7"
        statement: "AC7: the clone step resolves the newest dev-<UTC>-<sha12> tag with git ls-remote, logs it, clones at it, and refuses a branch tip or a remote with no dev tag -- falsifier: env -u PYTHONPATH uv run pytest tests/ci/test_hostile_reviewer_dev_tag_key_omn20910.py -q -n 0 --no-cov -k 'dev_tag or branch_tip or resolver or sha_literal' fails over the merge base's workflow, which clones at a sha literal"
      - id: "AC8"
        statement: "AC8: no step of the hostile-review job carries ANTHROPIC_API_KEY and no workflow references a provider key secret, so the Claude key reaches a voter only through the tenant route (OMN-20974) -- falsifier: env -u PYTHONPATH uv run pytest tests/ci/test_hostile_reviewer_dev_tag_key_omn20910.py tests/unit/test_no_provider_key_in_workflows_omn20974.py -q -n 0 --no-cov -k 'claude_api_key or key_on_the_review_step or provider_key' fails when the review step exports the key from an Actions secret"
  - id: "req-scm-pr-thread-reply"
    statement: "A lane replies to a pull request's review thread through onex scm, under the write node's own identity, and lists the threads it can reply to."
    acceptance:
      - id: "AC36"
        statement: "AC36: node_github_repo_write_effect answers a pr_thread_reply with a POST to the thread's replies endpoint carrying the idempotency marker, replays a reply whose key a review comment already carries, refuses a moved head, a missing thread and a quota under the floor with the typed reasons pr_comment has, and plans the same requests in dry_run; onex scm pr-thread-reply publishes it -- falsifier: env -u PYTHONPATH uv run pytest tests/unit/nodes/node_github_repo_write_effect/test_handler_pr_thread_reply.py tests/unit/handlers/scm/test_onex_scm_command.py -q -n 0 --no-cov fails at the merge base"
      - id: "AC37"
        statement: "AC37: node_github_repo_gateway_effect answers a pr_review_threads read over a recorded GraphQL payload with each thread's id, path, line, resolved state and root comment id, pages and cuts at the request limit, and raises on a GraphQL error; onex scm pr-threads publishes it -- falsifier: env -u PYTHONPATH uv run pytest tests/nodes/node_github_repo_gateway_effect/test_github_repo_gateway_review_threads.py -q -n 0 --no-cov fails at the merge base"
  - id: "req-unreachable-host-skipped"
    statement: "A backend whose host refused a connection is skipped by ordinary delegation routing until the recorded block lifts and the next attempt probes it; a pinned (smoke) run still reaches it."
    acceptance:
      - id: "AC38"
        statement: "AC38: a connection-level failure (no route, refused, name not resolved) on a local host is observed as a timed host_unreachable block on the provider quota state; ordinary routing and spread selection skip the backend, a pinned run reaches it, it returns when the block lifts, a failed probe blocks it again, and a host that answered with an error or timed out on read is never blocked -- falsifier: env -u PYTHONPATH uv run pytest tests/unit/delegation/test_unreachable_host_skipped_omn20910.py -q -n 0 --no-cov fails at the merge base"
  - id: "req-labelled-line-citation"
    statement: "The review gate's cites_specific_lines rule counts a labelled line field (Line: 5, **Line:** 5, line #7) as a line citation; an answer that names no line number is still refused."
    acceptance:
      - id: "AC39"
        statement: "AC39: the stored answers of runs ef0e0d15 and 80dcfc6f and five labelled forms pass _check_cites_specific_lines, a label with no number, an identifier and a word ending in line are still refused, and the existing forms still pass -- falsifier: env -u PYTHONPATH uv run pytest tests/unit/delegation/test_omn20910_labelled_line_citation.py -q -n 0 --no-cov fails at the merge base"
  - id: "req-rung-eval-fail-window"
    statement: "The rung-eval check-missing command lists every gap in its window but sets exit 1 only for gaps on the newest nights (--fail-window-days, default 1), so a past night that cannot be back-filled no longer keeps the nightly unit failed for the rest of the window."
    acceptance:
      - id: "AC39"
        statement: "AC39: with every cell present on the night checked and gaps on two older nights, check-missing exits 0 and still prints a MISSING line for each older night; a gap on the night checked exits 1; --fail-window-days 3 exits 1 on the same table; --fail-window-days 0 is refused -- falsifier: env -u PYTHONPATH uv run pytest tests/unit/delegation/rung_eval/test_check_missing_fail_window.py -q -n 0 --no-cov -p no:randomly fails at the merge base"
  - id: "req-fill-answered-item"
    statement: "The lab fill drops a stored backlog item that a fill lane answered (its receipt final, done or handed-off) at or after the item's fact, so an answered item is not sent again until its fact is refreshed."
    acceptance:
      - id: "AC40"
        statement: "AC40: a stored defect item whose fill lane receipt ended done or handed-off after its fact_at is dropped with an answered reason on NOTE lab-fill-dropped and in lab-fill.dropped.json, and is still sent when that receipt ended before the fact, was blocked, is not final, or belongs to a longer key sharing the lane prefix -- falsifier: env -u PYTHONPATH uv run pytest tests/nodes/node_idle_slot_fill_effect/test_idle_slot_fill_node.py -q -n 0 --no-cov -k answered_after_its_fact fails at the merge base"
  - id: "req-lab-disk-hygiene-ghost-containers"
    statement: "The lab disk hygiene node keeps a stopped container that docker ps lists but docker inspect does not know (a daemon-side ghost), names it in ghost_containers, never passes it to docker rm and records no error for it; an inspect that exits nonzero with no rows removes no container."
    acceptance:
      - id: "AC41"
        statement: "AC41: a ghost beside an old orphan leaves errors empty, ghost_containers names the ghost and docker rm names only the orphan; an inspect that exits 1 with no rows makes no rm call and records one docker inspect error -- falsifier: env -u PYTHONPATH uv run pytest tests/nodes/node_lab_disk_hygiene_effect/test_lab_disk_hygiene_ghosts.py -q -n 0 --no-cov -p no:randomly fails at the merge base"
  - id: "req-lab-disk-hygiene-all-ghost-inspect"
    statement: "When every stopped candidate is a ghost, docker inspect prints nothing on stdout, exits 1 and names each candidate id as an unknown object on stderr; the lab disk hygiene node reads that as all ghosts, records no error and removes nothing. An inspect that exits nonzero without naming every candidate still records the docker inspect error."
    acceptance:
      - id: "AC42"
        statement: "AC42: two dead ghost containers whose inspect exits 1 with no rows and a stderr naming both ids leave errors empty, name both in ghost_containers and make no docker rm call -- falsifier: env -u PYTHONPATH uv run pytest tests/nodes/node_lab_disk_hygiene_effect/test_lab_disk_hygiene_ghosts.py -q -n 0 --no-cov -p no:randomly -k only_ghost_candidates fails at the merge base"
  - id: "req-gateway-overlay-model-swap"
    statement: "Gateway model and thinking mode are deployment configuration; swapping them changes the native call target without a workflow edit. The full gate resolver proof remains in the resolver repository."
    acceptance:
      - id: "AC2"
        statement: "AC2: Adding or swapping a voter is an overlay-only diff, proven by a test that changes the overlay model and asserts the resolved call target changes with no workflow edit -- falsifier: pytest test over the resolver with two overlay fixtures"
evidence_requirements:
  - kind: "tests"
    description: "The workflow reads the overlay at every roster site."
    command: "env -u PYTHONPATH uv run pytest tests/ci/test_hostile_reviewer_voters_overlay_omn20910.py -q"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn20910-ac1-workflow-reads-overlay"
    description: "The preflight, retry-budget and review steps read the review voters overlay."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_hostile_reviewer_voters_overlay_omn20910.py -q -k 'reads_the_overlay or from_the_overlay or outside_the_workspace'"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC1"]
  - id: "dod-omn20910-ac3-no-voter-endpoint"
    description: "No reviewer workflow names a voter endpoint; the ratchet's positive control finds the known-bad lines."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_hostile_reviewer_voters_overlay_omn20910.py -q -k 'ratchet or names_a_voter or llm_endpoint_variable'"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC3"]
  - id: "dod-omn20910-ac4-no-voter-model"
    description: "The widened ratchet refuses a model variable, a model id literal and a MODEL env literal, and no reviewer workflow carries one."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_hostile_reviewer_voters_overlay_omn20910.py -q -n 0 --no-cov -k voter_model_from_overlay"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC4"]
  - id: "dod-omn20910-ac5-ratchet-wired"
    description: "The test file is a step of the lint job (a required context) and a pre-commit hook entry."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_hostile_reviewer_voters_overlay_omn20910.py -q -n 0 --no-cov -k voter_model_from_overlay_ratchet_is_wired"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC5"]
  - id: "dod-omn20910-claude-api-reviewer-pin"
    description: "The workflow pins the merged Claude API voter revision, retaining the earlier budget-timeout fix and its known-bad control."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_hostile_reviewer_pin_budget_timeout_omn19998.py -q -n 0 --no-cov"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC1"]
  - id: "dod-omn20910-chunk-deadline-reviewer-pin"
    description: "The workflow pins the omniintelligence revision that scales a voter's review deadline by chunk count, retaining the earlier structured-votes pin test and its known-bad control."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_hostile_reviewer_pin_structured_votes_omn19998.py -q -n 0 --no-cov"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC1"]
  - id: "dod-omn20910-ac6-register-key-declared-lane"
    description: "register-tenant-key resolves the bound host's declared bus lane when KAFKA_BOOTSTRAP_SERVERS is unset."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/cli/test_omn20910_register_tenant_key_lane_bus.py -q -p no:randomly --no-cov"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC6"]
  - id: "dod-omn20910-ac7-docker-less-writer"
    description: "On a writer host with no docker, a container check passes the contract prerequisite and prose does not."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_contract_prerequisite_verifier_host_tools_omn20910.py -q -n 0 -p no:randomly --no-cov"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC7"]
  - id: "dod-omn20910-deploy-register-key-container-smoke"
    description: "Run the checked-out register-tenant-key CLI in a disposable container. With no environment broker, its declared host lane must be opened and receive the credential event; an environment broker and a missing or unopenable lane must retain their expected behavior. The hosted runner needs Docker and the checkout, without access to a lab broker or lane containers."
    source: "manual"
    checks:
      # python3.13-bookworm (not -slim) keeps git for the omnibase-infra git source. The image pull runs as
      # its own check, on its own 30s budget. The test run mounts the host's uv over the image's uv 0.9.30,
      # so the container reads the uv cache the hosted verifier synced uv.lock into with the uv version that
      # wrote it. On CI at 9cd73fcaf the -slim image's uv 0.9.30 run exited 1 with no pytest output.
      - check_type: "command"
        check_value: "docker pull -q ghcr.io/astral-sh/uv@sha256:47965cdc9d53a515f68f78241161c901e70051ce428f12e791bd7fe19f6a631a"
        cwd: "${OMNI_HOME}/omnimarket"
      - check_type: "command"
        check_value: |-
          env docker run --rm --user "$(id -u):$(id -g)" -v "${PWD}:/workspace:ro" -w /workspace -v "$(uv cache dir):/uv-cache" -v "$(command -v uv):/usr/local/bin/uv:ro" -e UV_LINK_MODE=copy -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0="*" -e PYTHONDONTWRITEBYTECODE=1 -e COMPOSE_PROJECT_NAME=landing-l10892-lab -e UV_PROJECT_ENVIRONMENT=/tmp/register-key-venv -e UV_CACHE_DIR=/uv-cache ghcr.io/astral-sh/uv@sha256:47965cdc9d53a515f68f78241161c901e70051ce428f12e791bd7fe19f6a631a uv run --frozen pytest tests/unit/cli/test_omn20910_register_tenant_key_lane_bus.py -q -p no:randomly -p no:cacheprovider --no-cov --basetemp=/tmp/register-key-tests
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn20910-ac9-compact-strict-parser"
    description: "compact_strict fails closed on every listed case; a mandatory R finding is critical; v1 replies pass unchanged."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/review/test_compact_strict_parser.py -q -n 0 --no-cov"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC9"]
  - id: "dod-omn20910-ac10-review-judge-flag"
    description: "The review judge flag ships off, the armed path refuses a judge reject and a reviewer that is not the selected judge, and the unarmed path makes no judge call."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/delegation/test_review_judge_flag_omn20910.py -q -n 0 --no-cov"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC10"]
  - id: "dod-omn20910-ac11-review-cost-events"
    description: "One cost event per provider attempt from the effect's observation boundary (including a cancelled attempt), and the gateway's review provenance."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/test_omn20910_review_call_cost_events.py tests/test_omn20910_review_gateway_provenance.py -q -p no:randomly --no-cov"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC11"]
  - id: "dod-omn20910-budget-limits"
    description: "Admission races, Batch liability, aggregate limits and server-resolved tiers at the durable handler boundary."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/nodes/node_claude_review_budget_reducer/test_golden_chain_review_budget_admission.py -q -n 0 -p no:randomly --no-cov"
        cwd: "${OMNI_HOME}/omnimarket"
