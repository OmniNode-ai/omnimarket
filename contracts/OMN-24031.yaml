    check_value: uv run pytest tests/unit/nodes/node_work_ledger_query_effect/test_rows_window_read_once.py -q -n 0 --no-cov -p no:randomly -k reader_seam
    cwd: .
- id: dod-omn24031-integration-proof
  description: the focused tests run on a lab host at the pushed head; hosted CI cannot reach the lab, so only the local Done gate runs this unbound check
  source: manual
  execution_scope: local_done_gate
  checks:
