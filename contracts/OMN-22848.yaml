schema_version: 1.0.0
ticket_id: OMN-22848
title: 'The lane runner''s lab start path becomes nodes: node_remote_lane_start_orchestrator and node_remote_lane_start_effect (first in order)'
summary: 'Two new omnimarket nodes run the remote-lane runner''s run path for the Claude engine on lab placement: refuse other shapes, place through node_remote_lane_compute, append the CLAIM through node_work_ledger_append_effect with a deduplicated request id, start the engine detached through the spi ProtocolLaneHostTransport, supervise it, and close with one TERMINAL through node_remote_lane_close_compute. This omnimarket pull request carries AC2, AC3, AC4, AC5 and AC7; AC1 (the script-against-node parity harness) and AC6 (the runner shim) are carried by the pull request that changes the runner script, with this repository''s overlay check runner_command_names_node kept below as an unbound check.'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn22848-remote-lane-start-nodes
  statement: The lab Claude run path of the remote-lane runner is a sequence of nodes whose leader appends the CLAIM itself before any engine-starting host call, starts the engine in a session of its own, and writes one TERMINAL only when the engine's end is known.
  acceptance:
  - id: AC2
    statement: 'AC2: *CLAIM first.* The first host command that starts the engine comes after the CLAIM append returned; a refused CLAIM and an `already-claimed` replay leave the host-command list empty -- falsifier: `-k claim_before_engine`, `-k claim_refused_starts_nothing` and `-k claim_request_id_dedup`, with the ordered call log of the scripted transport and ledger, and `-k claim_dedup_survives_restart` (against the real ledger effect and a ledger fixture file: append the CLAIM, recreate the effect, replay the request id, and assert one CLAIM row and no host command).'
  - id: AC3
    statement: 'AC3: *The facts the fill relies on.* With a real posix leader process and a stub transport whose engine is a `setsid` child, the CLAIM carries the lane name and `key=` given, only the leader appended it, and the engine is in another session -- falsifier: `-k fill_contract_facts`, on macOS and Linux.'
  - id: AC4
    statement: 'AC4: *Early refusals write nothing.* `no-host` (exit 75) and each unsupported shape (cloud placement, each other engine) write no CLAIM and issue no host command -- falsifier: `-k early_refusals_write_nothing`, one case per refusal.'
  - id: AC5
    statement: 'AC5: *Close.* A SIGTERM while the engine runs gives one TERMINAL with the stopped outcome after `stop_engine` confirmed the exit; an engine that survives the stop, and a start that does not settle, leave the CLAIM open and write no TERMINAL; a lane that wrote its own closing row gets a STATUS and no second TERMINAL -- falsifier: `-k sigterm_closes_once`, `-k sigterm_survivor_no_terminal`, `-k start_unresolved_no_terminal` and `-k no_double_terminal`.'
  - id: AC7
    statement: 'AC7: G-NODE holds for both nodes, and the placed, no-host, CLAIM-refused and engine-fails scenarios give equal decision projections on the in-memory and Redpanda legs with the scripted transport -- falsifier: `-m floor_fill_parity -k remote_lane_start` with the Redpanda receipt in the PR body.'
evidence_requirements:
- kind: tests
  description: The focused tests of both lane start nodes.
  command: uv run pytest src/omnimarket/nodes/node_remote_lane_start_orchestrator src/omnimarket/nodes/node_remote_lane_start_effect -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
