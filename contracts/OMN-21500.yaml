schema_version: 1.0.0
ticket_id: OMN-21500
title: 'T2.1: wire core validators by hook id in omnimarket'
summary: Partial wiring. omnimarket consumes five omnibase_core validators by hook id at one dev-merge tag, locally
  (.pre-commit-config.yaml) and in CI (job core-validators in ci.yml). check-no-utcnow and
  check-ai-slop have no findings in the tree; check-hardcoded-model-config-compute, handler-di-gate and
  check-protocol-binding each carry one generated per-file shrink-only baseline with a zero target. The other validators
  of the task are not wired and the canary falsifier (3 to at least 14) is not met; each unwired hook id and the core
  change that lifts it are named in the pull request.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-t21-omnimarket-core-validators
  statement: omnimarket consumes omnibase_core's validators by hook id at a dev-merge tag, locally and in CI, with a
    shrink-only baseline where the tree has findings.
  acceptance:
  - id: AC1
    statement: 'AC1: Each canary defect in section A.5 marked NO-VALIDATOR or MISSED for omnimarket is CAUGHT, locally and in CI, by a core validator consumed by hook id with a shrink-only baseline where the tree has findings -- falsifier: re-run the 24-defect validator canary against omnimarket'
  - id: AC2
    statement: 'AC2: The 24-defect canary catches at least 14 defects in omnimarket where it catches 3 today -- falsifier: the canary harness count for omnimarket, read from the canary PR run'
  - id: AC3
    statement: 'AC3: Each of the eleven validators resolves to repo https://github.com/OmniNode-ai/omnibase_core in omnimarket''s pre-commit config and runs in ci.yml -- falsifier: pytest case parsing .pre-commit-config.yaml and ci.yml for the eleven hook ids'
evidence_requirements:
- kind: tests
  description: Wiring tests for the core validators.
  command: uv run pytest tests/ci/test_core_validators_wired_omn21500.py -q --no-cov --tb=line -p no:randomly -n 0
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn21500-ac1
  description: AC1, partial. The wiring file proves the five wired hook ids resolve to omnibase_core at one dev-merge tag
    and that each hook with findings in the tree names a committed baseline. The canary defects the wired hooks refuse are
    utcnow, model_config and ai_slop; the remaining canary defects are not caught here and the canary re-run is the lab
    receipt in the pull request.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/ci/test_core_validators_wired_omn21500.py -q --no-cov --tb=line -p no:randomly -n 0 -k "resolves or share_one_tag or baselined"
    cwd: ${OMNI_HOME}/omnimarket
- id: dod-omn21500-ac2
  description: AC2, not met by this pull request. The canary count is read from a lab run that plants the canary files from
    the canary branch and runs every hook of the pre-commit config over them; the count is recorded in the pull request.
    This check binds the wired set that count is taken over.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: command
    check_value: |-
      python3 - <<'PYCODE'
      import yaml
      config = yaml.safe_load(open(".pre-commit-config.yaml"))
      core = "https://github.com/OmniNode-ai/omnibase_core"
      ids = {hook["id"] for repo in config["repos"] if repo.get("repo") == core for hook in repo["hooks"]}
      needed = {"check-no-utcnow", "check-ai-slop", "check-hardcoded-model-config-compute", "handler-di-gate", "check-protocol-binding"}
      assert needed <= ids, sorted(needed - ids)
      assert yaml.safe_load(open("config/hardcoded_model_config_baseline.yaml"))["entries"]
      print("five core hook ids wired, baselines committed")
      PYCODE
    cwd: ${OMNI_HOME}/omnimarket
- id: dod-omn21500-ac3
  description: AC3, partial (five of the eleven named plus the stage 1 additions). The wiring file parses .pre-commit-config.yaml
    and ci.yml for the wired hook ids, and that no unwired hook id of the ticket has a local copy.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/ci/test_core_validators_wired_omn21500.py -q --no-cov --tb=line -p no:randomly -n 0
    cwd: ${OMNI_HOME}/omnimarket
- id: dod-omn21500-deploy-source
  description: 'Hosted deploy check: the pre-commit config at the checked-out commit consumes the model-config hook. Needs no account, lab host or runtime.'
  source: manual
  checks:
  - check_type: command
    check_value: |
      set -eu;
      curl --fail --silent --show-error --location --max-time 60 "https://raw.githubusercontent.com/OmniNode-ai/omnimarket/$(git rev-parse HEAD)/.pre-commit-config.yaml" | grep "id: check-hardcoded-model-config-compute" >/dev/null
    cwd: .
