schema_version: 1.0.0
ticket_id: OMN-23154
title: The serve process stops appending to the file in a fenced flip, with in-flight appends drained and a rollback that never recreates the file
summary: >-
  Rebuild plan 4.3 step 8 (L13), code half. The work-ledger append effect gains a fenced handover of authority between
  the file judge and the reducer. A handover closes admission (a new command is answered with a retry receipt and appends
  nothing), waits for every in-flight append, checks that the file's last row and the reducer's highest sequence name the
  same row, switches and lifts the fence. After the flip the reducer gives each row its ledger_seq, the receipt carries
  ledger_seqs and no file line, and the handler writes nothing to the file. The rollback restarts the file judge from the
  reducer's request records and never regenerates the file. The handover is off unless the serve binds the contract's
  fenced_flip section and a reducer. Not covered here and named in the pull request: the database reducer adapter that
  binds the authority port, the serve verbs that call the flip and the rollback, the outbox drain through the fence
  sequence, the local-append refusal in the file judge, and the live drill on the ledger host.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23154-fenced-flip
  statement: The append effect hands authority between the file judge and the reducer under a fence, answers commands that arrive during the handover with a retry receipt, loses and doubles no in-flight append, and rolls back without recreating the file.
  acceptance:
  - id: AC1
    statement: 'AC1: after the flip no append reaches the file, a probe append returns a receipt with a ledger_seq and no file line, and the node verb reads it back -- falsifier: uv run pytest src/omnimarket/nodes/node_work_ledger_append_effect -q -k flip_no_file_append'
  - id: AC2
    statement: 'AC2: new commands during the handover get a retry receipt and no in-flight append is lost or doubled -- falsifier: uv run pytest src/omnimarket/nodes/node_work_ledger_append_effect -q -k fenced_handover_in_flight'
  - id: AC3
    statement: 'AC3: the rollback restarts the old judge without recreating the file as an export -- falsifier: uv run pytest src/omnimarket/nodes/node_work_ledger_append_effect -q -k rollback_without_file_recreate'
evidence_requirements:
- kind: tests
  description: The three falsifier selections of the acceptance criteria, with the failing controls named in the tests.
  command: uv run --frozen pytest src/omnimarket/nodes/node_work_ledger_append_effect/tests/test_fenced_flip.py -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23154-ac1-flip-no-file-append
  description: After the flip a probe append returns ledger_seqs and no file line, the file's bytes and the file judge's call count do not change, and the query node reads the emitted row back; a flip whose file and reducer name different last rows is refused and changes nothing.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest src/omnimarket/nodes/node_work_ledger_append_effect/tests/test_fenced_flip.py -q --no-cov -k flip_no_file_append
- id: dod-omn23154-ac2-fenced-handover
  description: A command that arrives while an append is in flight is answered retry and appends nothing; the in-flight append lands once on the file; the retried commands land once on the reducer or answer duplicate; a drain that does not finish leaves authority where it was and lifts the fence.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest src/omnimarket/nodes/node_work_ledger_append_effect/tests/test_fenced_flip.py -q --no-cov -k fenced_handover_in_flight
- id: dod-omn23154-ac3-rollback
  description: The rollback restarts the file judge from the reducer's request records with the file absent, leaves the file absent, and answers a retried committed request duplicate; a restart that fails keeps the reducer authoritative and lifts the fence.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest src/omnimarket/nodes/node_work_ledger_append_effect/tests/test_fenced_flip.py -q --no-cov -k rollback_without_file_recreate
- id: dod-omn23154-integration-proof
  description: >-
    The pushed head ran the focused fenced-flip tests of the append effect on a lab host through the bus and exited 0. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23154 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest src/omnimarket/nodes/node_work_ledger_append_effect -q -n 0 --no-cov
