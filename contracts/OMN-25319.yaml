  description: The Lab check fails a comment that names no exit 0, no lab command or an old head; the Lab comment of the new head is read as a local Done gate item (findings 1 to 8 of this review, the lab
    command and exit 0).
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_delegation_scenario_alarm_effect/test_contract_checks_omn25071.py -k "lab" -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn25319-ac4-comment
  description: 'Local Done gate: the one comment of this pull request that opens with the Lab marker for the head the PR watcher records names each of findings 1 to 8 of the review of head 37fe44a7a8ef,
    and the lab command and exit 0.'
  source: manual
  binds_ac:
  - AC4
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: sh -c 'H=$(python3 "${OMNI_PLUGIN_ROOT:?}/skills/merge-drain/scripts/pr_state_local.py" --pr OmniNode-ai/omnimarket#6353 --json | python3 -c "import json,sys; print(json.load(sys.stdin)[sys.argv[1]][sys.argv[2]])"
      facts head_sha) && test "${#H}" -eq 40 && test "$H" = "$(git rev-parse HEAD)" && onex scm pr-view --source bus OmniNode-ai/omnimarket#6353 | python3 tests/nodes/node_delegation_scenario_alarm_effect/pr_comment_check.py
      --head "$H" --finding 1 --finding 2 --finding 3 --finding 4 --finding 5 --finding 6 --finding 7 --finding 8 --round 1139 --lab'
    cwd: .
- id: dod-omn25319-ac5
  description: The stamp of an alarm row at head 37fe44a7a8ef was never after the tick that writes it; OMN-25376 replaced that rule with a stamp that depends on the record and the bucket only. The contract's discovery entry is skipped by the effects runtime's wiring in both
    modes, the rendered unit environment leaves the state dir and the lane login to the real append, and the comment check reads exit lines, the lab command word, truncation, the author, the review round
    and the tree head.
  source: manual
  binds_ac:
  - AC5
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_delegation_scenario_alarm_effect -k "omn24874 and alarm" -q --no-cov -n 0 -p no:randomly
    cwd: .
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_delegation_scenario_alarm_effect/test_golden_chain_delegation_scenario_alarm.py -k "effects_runtime or would_be_unresolvable or leaves_the_state_dir"
      -q --no-cov -n 0 -p no:randomly
    cwd: .
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_delegation_scenario_alarm_effect/test_contract_checks_omn25071.py -k "exit_of_a_line or collab_runs or truncated_comment or reads_the_author or finding_eight
      or watcher_head" -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn25319-integration-proof
  description: The alarm node tests and the installer registry unit tests run on a lab host at the pushed head through the lab work runner; hosted CI cannot reach the lab, so only the local Done gate runs
    this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --bus-lane dev --omnibase-path "${OMNI_HOME:?}" --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-25319
      --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_delegation_scenario_alarm_effect tests/nodes/node_host_installer_registry_units -q --no-cov -n 0 -p no:randomly
    cwd: .
