schema_version: 1.0.0
ticket_id: OMN-26220
title: A delegation pinned to a harness backend is published to the harness handler and answered
summary: >-
  The runtime dispatch port of node_delegate_skill_orchestrator publishes the typed harness request to the
  harness-execute topic that node_llm_delegation_call_effect consumes, for a backend_id the routing overlay
  declares as kind harness, and reads the handler's result back as the delegation terminal with one cost row per
  attempt. It is the producer step B of the harness delegation work needs before any caller moves; it does not move
  a caller.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn26220-producer
    statement: A harness pin reaches the harness handler on its own topic and a non-harness pin stays on the generic topic.
    acceptance:
      - id: DoD1
        statement: >-
          DoD1: a delegation whose backend_id the overlay declares as a harness backend is published to the
          harness-execute topic and its answer and per-attempt cost come back as the terminal -- falsifier: uv run
          pytest tests/unit/delegation/test_harness_execute_producer_omn26220.py -q fails
  - id: req-omn26220-review-rung
    statement: The review harness rung casts its vote through one onex delegate pinned to its harness backend, which the harness handler serves, with the vote contract unchanged.
    acceptance:
      - id: AC2
        statement: >-
          AC2: node_agent_review_harness_rung_effect casts its vote through the harness handler with the same vote contract
          and signed receipt, with its test unchanged in meaning -- falsifier: uv run pytest -k agent_review_harness_rung in
          omnimarket fails, or its source still shells to harness_delegate.py
evidence_requirements:
  - kind: tests
    description: The producer's focused unit tests.
    command: uv run --frozen pytest tests/unit/delegation/test_harness_execute_producer_omn26220.py -q
  - kind: tests
    description: The review harness rung's focused unit tests, including the source check that no module of the node names harness_delegate.
    command: uv run --frozen pytest tests/unit/nodes/node_agent_review_harness_rung_effect -q --no-cov
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-omn26220-producer
    description: The harness pin is published to the harness-execute topic, answered with a cost row per attempt, and a non-harness pin stays on the generic topic.
    source: manual
    binds_ac: [DoD1]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/delegation/test_harness_execute_producer_omn26220.py -q
        cwd: .
  - id: dod-omn26220-ac2
    description: The rung's vote is built from the receipt of an onex delegate pinned to the rung's harness backend, the vote model is unchanged, and no module of the node names harness_delegate.
    source: manual
    binds_ac: [AC2]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/nodes/node_agent_review_harness_rung_effect -q --no-cov -k agent_review_harness_rung
        cwd: .
  - id: dod-omn26220-integration-proof
    description: Run this pull request's own tests on a lab host at the pushed head. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-26220 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/delegation/test_harness_execute_producer_omn26220.py tests/unit/nodes/node_agent_review_harness_rung_effect -q --no-cov
        cwd: .
  - id: dod-omn26220-house-never-byok-sentinel
    description: Our own (house) work never resolves the all-task-types BYOK sentinel overlay row, in either house tenant form, and takes the declared chain; its own exact rows and a customer's sentinel row still resolve. The two house tests fail on the base commit, where the stale byok-anthropic sentinel row outranked the chain.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/nodes/node_delegation_routing_reducer/test_omn26220_house_work_never_takes_byok_sentinel.py -q --no-cov
        cwd: .
