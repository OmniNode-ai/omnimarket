schema_version: 1.0.0
ticket_id: OMN-25857
title: The CI log reader returns a log body or a typed refusal, because the gateway read node never leaves a job-log request without a terminal reply
summary: The dev GitHub gateway read consumer is attached only about four minutes after each dev runtime replacement, and a job-log request whose per-job lock is held or whose download stalls had no bound. The node now declares a lock wait and a download deadline, and a request that cannot be served inside them answers JOB-LOG-BUSY or JOB-LOG-FILL-TIMEOUT. The regression tests replay the recorded dev runtime consumer log.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn25857-terminal
  statement: A job-log request to the gateway ends in a log body or a typed refusal inside declared bounds, and the consumer that serves the read topic is named with a recorded request.
  acceptance:
  - id: AC1
    statement: 'AC1: the consumer group, host and runtime that serve the read topic are named, with the log lines of one request id showing where the request stopped -- falsifier: the lane TERMINAL or ticket comment names no consumer group, host or runtime, or quotes no log line carrying a request id'
  - id: AC2
    statement: 'AC2: integrated: one `onex scm job-log` call on the dev lane returns a non-empty log body for a failed CI job id, after the fix is installed on the dev runtime through the declared deploy path -- falsifier: run `onex scm job-log OmniNode-ai/omnimarket --job-id <failed job id>` on the dev lane and read back the exit code and the body; exit 75, exit 124 or an empty body falsifies it'
  - id: AC3
    statement: 'AC3: a regression test built from the recorded consumer log of the failed request (fixture path in the pull request) fails on the broken code and passes on the fix -- falsifier: `uv run pytest <test path> -q` passes at the unfixed base or fails at the fixed head'
evidence_requirements:
- kind: tests
  description: The bounded-terminal tests built from the recorded dev runtime consumer log.
  command: env -u PYTHONPATH uv run --frozen pytest tests/nodes/node_github_repo_gateway_effect/test_job_log_bounded_terminal.py -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn25857-ac1-recorded-consumer
  description: The recorded consumer log fixture names the consumer group, the runtime start, the attach time and the typed refusal of one request id, and the control test replays the refusal from it.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_github_repo_gateway_effect/test_job_log_bounded_terminal.py -q --no-cov -n 0 -p no:randomly -k recorded_miss_refusal
    cwd: .
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_github_repo_gateway_effect/test_job_log_bounded_terminal.py -q --no-cov -n 0 -p no:randomly -k 'job_log_busy or fill_timeout'
    cwd: .
- id: dod-omn25857-integration-proof
  description: Hosted CI cannot reach a lab lane, so only the local Done gate runs this unbound check. On the dev lane, one job-log read of a failed omnimarket CI job returns exit 0 and a non-empty body.
  source: manual
  execution_scope: local_done_gate
  binds_ac:
  - AC2
  checks:
  - check_type: command
    check_value: onex scm job-log OmniNode-ai/omnimarket --job-id 135174286787 | grep -q '"outcome":"completed"'
    cwd: .
- id: dod-omn25857-ac3-bounded-terminal
  description: A held per-job lock answers JOB-LOG-BUSY inside the declared wait and a download past its deadline answers JOB-LOG-FILL-TIMEOUT; both tests fail at the base commit and pass at the head.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_github_repo_gateway_effect/test_job_log_bounded_terminal.py -q --no-cov -n 0 -p no:randomly
    cwd: .
