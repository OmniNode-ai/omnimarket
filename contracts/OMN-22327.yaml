schema_version: 1.0.0
ticket_id: OMN-22327
title: 'The clean VM walk receipt publishes the onboarding log tail unredacted and keeps credentials embedded in URLs'
summary: node_onboarding_clean_vm_walk_effect passes the finished, published receipt through one sanitiser over every string field (URL user information of any scheme, URL queries, authorization values, secret assignments and provider key shapes), and a clone whose reply is lost still ends with the VM deleted or the receipt naming it undeleted.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn22327-ac1
  statement: 'The published receipt carries no URL user information and no secret-shaped value in any field, the log tail included -- falsifier: uv run pytest tests/nodes/node_onboarding_clean_vm_walk_effect -v -rs -k redact'
  acceptance:
  - id: AC1
    statement: 'AC1: The published receipt carries no URL user information and no secret-shaped value in any field, the log tail included -- falsifier: uv run pytest tests/nodes/node_onboarding_clean_vm_walk_effect -v -rs -k redact'
- id: req-omn22327-ac2
  statement: 'A clone whose reply is lost still ends with the VM deleted or with the receipt naming it undeleted -- falsifier: uv run pytest tests/nodes/node_onboarding_clean_vm_walk_effect -v -rs -k lost_clone'
  acceptance:
  - id: AC2
    statement: 'AC2: A clone whose reply is lost still ends with the VM deleted or with the receipt naming it undeleted -- falsifier: uv run pytest tests/nodes/node_onboarding_clean_vm_walk_effect -v -rs -k lost_clone'
evidence_requirements:
- kind: tests
  description: The receipt redaction and lost-clone tests and the node's existing tests run on a lab host at the pushed head.
  command: uv run pytest tests/nodes/node_onboarding_clean_vm_walk_effect tests/nodes/node_onboarding_clean_vm_walk -v -rs
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn22327-ac1
  description: AC1 is proven by the redaction tests over the serialized receipt.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_onboarding_clean_vm_walk_effect -v -rs -k redact --no-cov --tb=line
    cwd: .
- id: dod-omn22327-ac2
  description: AC2 is proven by the lost-clone cleanup tests.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_onboarding_clean_vm_walk_effect -v -rs -k lost_clone --no-cov --tb=line
    cwd: .
- id: dod-omn22327-ac2-refused-clone
  description: AC2 holds without deleting a VM the walk did not create; a clone refused for an existing VM name, or refused before it started, issues no stop and no delete.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_onboarding_clean_vm_walk_effect -v -rs -k "refused_clone or refused_before or lost_clone" --no-cov --tb=line
    cwd: .
- id: dod-omn22327-existing
  description: The node's existing tests pass with the sanitiser and the cleanup change.
  source: manual
  binds_ac:
  - AC1
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_onboarding_clean_vm_walk -q --no-cov --tb=line
    cwd: .
- id: dod-omn22327-deploy-probe-sanitiser
  description: 'Deploy probe: the receipt sanitiser module GitHub serves at the checked-out commit defines sanitize_receipt; the module is absent at the merge base, so the content read fails there.'
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: command
    check_value: gh api "repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_onboarding_clean_vm_walk_effect/handlers/receipt_redaction.py?ref=$(git rev-parse HEAD)" --jq '.content | gsub("\n";"") | @base64d | contains("def sanitize_receipt")' | grep -qx true
    cwd: .
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_onboarding_clean_vm_walk_effect -q --no-cov --tb=line
    cwd: .
- id: dod-omn22327-integration-proof
  description: The pushed head ran the node's receipt redaction, lost-clone and existing test suites on a lab host through the bus and exited 0. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: |-
      uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane fix-22327-1205 -- uv run --frozen pytest tests/nodes/node_onboarding_clean_vm_walk_effect tests/nodes/node_onboarding_clean_vm_walk -v -rs
    cwd: .
