schema_version: 1.0.0
ticket_id: OMN-22362
title: the architecture-discovery bus callers dial the broker their node's contract overlay declares and no longer import core's private security helper
summary: The architecture-discovery CLI and its coding-agent bus adapter read KAFKA_BOOTSTRAP_SERVERS for the broker and imported omnibase_core's private _resolve_client_security_config for the client security, which read KAFKA_SECURITY_PROTOCOL and KAFKA_SASL_*. omnibase_core deletes that helper when onex run-node takes its broker from the node's contract overlay, so omnimarket would fail at import once its core pin carries that change. Both callers now resolve the broker and the client security of each node they dial from the event_bus the node's overlay declares, through the registered node broker resolver when one is installed and through the same overlay declaration read here when the pinned omnibase_infra predates it. No environment variable, flag or default selects the broker, a node with no declaration is refused naming its overlay path, and an in-memory declaration is refused because these callers publish to nodes that run in the lane's runtime.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn22362-callers-overlay-broker
  statement: The architecture-discovery callers select each node's broker and client security from the node's contract overlay and from nothing else.
  acceptance:
  - id: AC1
    statement: 'AC1: a Redpanda overlay (event_bus type kafka, lane dev) is dialed with the lane''s broker and client security for the orchestrator, the workspace-validation node and the invoke node while KAFKA_BOOTSTRAP_SERVERS and KAFKA_SECURITY_PROTOCOL name something else; a registered resolver answers through the same path and two registered resolvers are refused -- falsifier: uv run pytest tests/nodes/node_architecture_discovery_orchestrator/test_broker_overlay_omn22362.py -q --no-cov -k "redpanda or default_adapter or cli_dials or sasl or registered"'
  - id: AC2
    statement: 'AC2: a node with no overlay, an overlay with no event_bus, an undeclared lane or an in-memory declaration is refused naming the overlay path before anything is published, also with the old environment variable set, and neither caller references the deleted core helper -- falsifier: uv run pytest tests/nodes/node_architecture_discovery_orchestrator/test_broker_overlay_omn22362.py -q --no-cov -k "inmemory or missing_overlay or without_event_bus or refuses or undeclared_lane or private"'
