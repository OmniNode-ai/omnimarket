schema_version: 1.0.0
ticket_id: OMN-24061
title: The sampling settings a local model is called with are read per kind of task from the team settings
summary: The temperature of a delegated call was a number written into the effect request model (0.3), the thinking switch and the vendor sampling values came from a packaged profile file chosen by model and task type, and the output cap was one per-backend value. This pull request adds an optional class_sampling table to the overlay of node_delegation_code_budget_compute, a sampling operation on that node, a reader read_sampling_settings in omnimarket.handlers.delegation_sampling_reader, and the one place in the local dispatch port that applies a named class's values (temperature and token cap when the caller sent none, thinking switch, thinking budget and sampling values over the profile options). A class the overlay does not name, and an overlay with no class_sampling, leave the call exactly as it was.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24061-sampling-reader
  statement: A reader in omnimarket returns the overlay's sampling settings of a task class through the node's sampling operation, none for a class the overlay does not name, and refuses an invalid overlay without a default.
  acceptance:
  - id: AC1
    statement: 'AC1: a reader returns the sampling settings the overlay names for a task class, nothing for a class it does not name, and refuses an invalid overlay -- falsifier: pytest tests/unit/handlers/test_delegation_sampling_reader.py -q'
  - id: AC2
    statement: 'AC2: a delegated call whose class the overlay names is sent with the overlay temperature, token cap and thinking switch, and a call with no overlay is sent as before -- falsifier: pytest tests/unit/nodes/test_delegation_sampling_wiring.py -q'
  - id: AC3
    statement: 'AC3: integrated: on a lab host running the branch, an onex delegate receipt for a named class shows the overlay temperature in its attempt configuration -- falsifier: read attempts[].configuration.temperature in the run receipt under the lane state root'
evidence_requirements:
- kind: tests
  description: The reader and wiring tests pass at the pushed head.
  command: uv run pytest tests/unit/handlers/test_delegation_sampling_reader.py tests/unit/nodes/test_delegation_sampling_wiring.py -q -n 0 --no-cov -p no:cacheprovider
emergency_bypass:
