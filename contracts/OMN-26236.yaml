schema_version: 1.0.0
ticket_id: OMN-26236
title: A customer session on its own key connects only to the provider it chose; the model price list is read at setup and by a refresh command, and a call's cost says whether the provider reported it
summary: The customer-key probe went red on clause no_omninode because a delegation call read models.dev live to price a model. The price list is now read by onex setup and by onex models refresh-prices and kept under the ONEX home; a delegation call reads only that copy (whatever its age), else the price list shipped in the install, and never the network. The call's cost receipt prefers the charge the provider reported in its usage accounting and carries cost_source, reported or estimated.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn26236-no-session-read
  statement: A delegation call's pricing path makes no socket connect and no name lookup, and with no stored copy prices from the shipped list marked estimated.
  acceptance:
  - id: AC1
    statement: 'AC1: the cause of the red is the delegation call reading models.dev live for pricing (five connects to models.dev in the keyed step), and the call no longer does -- falsifier: tests/unit/delegation/test_shipped_price_list_no_fetch.py records a getaddrinfo or connect during the call'
  - id: AC2
    statement: 'AC2: the probe reads green against what exists now with no clause widened -- falsifier: the newest c29-customer-byo-key run after a release carrying this change reads red'
  - id: AC3
    statement: 'AC3: the lane writes one STATUS row for the probe -- falsifier: a ledger grep for the probe finds no STATUS row'
evidence_requirements:
- kind: tests
  description: The no-connect, kept-copy, shipped-list, refresh, setup and cost-source tests pass at the pushed head.
  command: uv run pytest tests/unit/delegation/test_shipped_price_list_no_fetch.py tests/unit/delegation/test_byok_models_dev_price_omn23413.py tests/unit/delegation/test_delegation_cost_source.py tests/unit/nodes/node_model_setup_effect/test_refresh_prices.py tests/unit/nodes/node_onex_setup_effect/test_setup_price_list_read.py -q -n 0 --no-cov -p no:cacheprovider
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn26236-ac1
  description: 'AC1: a delegation call with every socket connect and getaddrinfo blocked and recorded prices with no attempt, from the shipped list marked estimated when no copy is stored, and from the stored copy whatever its age; a positive control shows the explicit refresh does connect through the same probe.'
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/delegation/test_shipped_price_list_no_fetch.py tests/unit/delegation/test_byok_models_dev_price_omn23413.py -q -n 0 --no-cov -p no:cacheprovider
    cwd: .
- id: dod-omn26236-ac2
  description: 'hosted proxy for AC2: the call prices off the network, the refresh command and setup read the price list, and the cost receipt carries reported or estimated with no model text in the figure. The probe run after a release carrying this change is read after the merge and is not met by this change alone.'
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/delegation/test_delegation_cost_source.py tests/unit/nodes/node_model_setup_effect/test_refresh_prices.py tests/unit/nodes/node_onex_setup_effect/test_setup_price_list_read.py -q -n 0 --no-cov -p no:cacheprovider
    cwd: .
- id: dod-omn26236-ac3
  description: 'hosted proxy for AC3: the STATUS row is a ledger row written after the post-merge probe read and is not met by this change alone; the focused tests pass.'
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/delegation/test_shipped_price_list_no_fetch.py -q -n 0 --no-cov -p no:cacheprovider
    cwd: .
- id: dod-omn26236-integration-proof
  description: the no-connect, kept-copy, refresh, setup and cost-source tests run on a lab host at the pushed head; hosted CI cannot reach the lab, so only the local Done gate runs this unbound check
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-26236 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/delegation/test_shipped_price_list_no_fetch.py tests/unit/delegation/test_delegation_cost_source.py tests/unit/nodes/node_model_setup_effect/test_refresh_prices.py -q --no-cov
