schema_version: 1.0.0
ticket_id: OMN-22860
title: A runner group's exposure to public origins is read as five subjects, from an in-memory fixture or the GitHub REST API
summary: Two nodes. node_runner_group_exposure_compute is the pure reading of five subjects (files that select a group label with a public-origin trigger, the group's pinned workflows against those files, the group's public-repository setting, jobs of public origin in the window, the read's age). node_runner_group_exposure_effect reads one group from the source the overlay names (an in-memory fixture, or the GitHub REST API with a token named by an environment variable and a call budget) and asks the compute node for the reading. A group that cannot be read (denied, over budget, unreadable) or a read past its max age reads UNKNOWN and ends in the typed failure event. The schedule and a reading writer are not part of this ticket.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn22860-exposure-reading
  statement: The exposure of a runner group to public origins is a reading of five subjects that is WORKING only when every subject is, and UNKNOWN when the group was not read or the read is stale.
  acceptance:
  - id: AC1
    statement: 'AC1: a clean group reads WORKING on five subjects on the in-memory overlay and on the GitHub overlay served by a local fixture server, and the GitHub read sends its token only as the Authorization header -- falsifier: uv run --frozen pytest tests/nodes/node_runner_group_exposure_effect tests/nodes/node_runner_group_exposure_compute -k "golden or token" -q --no-cov -p no:cacheprovider'
  - id: AC2
    statement: 'AC2: each named break (a public-origin trigger on a group file, a group not restricted to workflows, a group allowing public repositories, a public-origin job) reads NOT_WORKING on its own subject on both overlays, and the same overlay without the break reads WORKING -- falsifier: uv run --frozen pytest tests/nodes/node_runner_group_exposure_effect tests/nodes/node_runner_group_exposure_compute -k injected_break -q --no-cov -p no:cacheprovider'
  - id: AC3
    statement: 'AC3: a denied org read, a broken workflow listing, a call past the budget, a missing token and a stale read each read UNKNOWN with the typed failure, and the run ends in the failure topic for the first four -- falsifier: uv run --frozen pytest tests/nodes/node_runner_group_exposure_effect tests/nodes/node_runner_group_exposure_compute -k error_chain -q --no-cov -p no:cacheprovider'
evidence_requirements:
- kind: tests
  description: The compute node's tests and the effect node's golden chain, error chain and named failing controls on both overlays.
  command: uv run --frozen pytest tests/nodes/node_runner_group_exposure_effect tests/nodes/node_runner_group_exposure_compute -q --no-cov -p no:cacheprovider
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn22860-golden
  description: A clean group reads WORKING on both overlays.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_runner_group_exposure_effect tests/nodes/node_runner_group_exposure_compute -k "golden or token" -q --no-cov -p no:cacheprovider
    cwd: .
- id: dod-omn22860-breaks
  description: Each named break reads NOT_WORKING on its subject on both overlays.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_runner_group_exposure_effect tests/nodes/node_runner_group_exposure_compute -k injected_break -q --no-cov -p no:cacheprovider
    cwd: .
- id: dod-omn22860-errors
  description: An unreadable group or a stale read reads UNKNOWN with the typed failure.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_runner_group_exposure_effect tests/nodes/node_runner_group_exposure_compute -k error_chain -q --no-cov -p no:cacheprovider
    cwd: .
- id: dod-omn22860-integration-proof
  description: Run this pull request's own tests on a lab host at the pushed head (the probe node run on both overlays, the GitHub one against a local fixture server). Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-22860 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_runner_group_exposure_effect tests/nodes/node_runner_group_exposure_compute -q --no-cov -p no:cacheprovider
    cwd: .
