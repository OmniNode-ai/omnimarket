schema_version: 1.0.0
ticket_id: OMN-23420
title: The J7 connection between the process spine and CI has its own test and a scheduled run
summary: Join J7 (piece 7, the process spine, to piece 8, the central test harness) had no test of its own and nothing that ran it. This change adds the J7 join test (a send admitted past a stop on piece 8 posts its lab check on the head, through the real gate store, stop gate and lab check effect) and the J7 seam test (the row the stop drill writes is the row the J7 refusal rule reads, and the join refusal node answers a real piece 7 failure with piece 8's typed refusal). Each fails when either side of the seam changes shape, on the in-memory bus and, where the lab names a broker, on a Redpanda bus.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23420-j7-join
  statement: The J7 join test and the J7 seam test run in the omnimarket suite and fail when the stop drill's row or the piece 8 side of the seam changes shape.
  acceptance:
  - id: AC1
    statement: 'AC1: the J7 join test and run caller on branch OMN-22936-j7-join merge with this ticket''s contract, the join test failing when either side of the piece 7 to piece 8 seam changes shape, on the in-memory bus and the real broker -- falsifier: uv run pytest on the J7 join test with a planted field rename'
  - id: AC2
    statement: 'AC2: integrated: the J7 run caller is installed on the serving host through the host installer, piece 7''s producer (the stop drill) writes rows again, and join J7 reads PASS on the served floor -- falsifier: the join:J7 row of the served floor after the next J7 run'
evidence_requirements:
- kind: tests
  description: The J7 join test and the J7 seam test at the pushed head. The seam test's planted renames of the stop drill's verdict, drill and reason cells turn the golden expectation red.
  command: uv run --frozen pytest tests/integration/test_join_j7.py tests/nodes/node_join_refusal_effect/test_join_j7_seam.py -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23420-ac1-j7-tests
  description: The J7 join test (12 tests) and the J7 seam test pass at the pushed head, including the failing controls (a stop gate that ignores the stop, a check-run API that ignores an invalidation, a planted rename of a cell the stop drill writes).
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: command
    check_value: grep -q join_j7_parity pyproject.toml && uv run --frozen pytest tests/integration/test_join_j7.py tests/nodes/node_join_refusal_effect/test_join_j7_seam.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn23420-ac2-j7-refusal-answered
  description: The hosted part of AC2, the answer the served floor's join refusal run gives. A real piece 7 failure row written by the stop drill is answered with piece 8's typed refusal and the floor fold reads J7 as an error join (the seam test's golden tests). The marker grep fails at the merge base, which lacks the join_j7_parity marker.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: command
    check_value: grep -q join_j7_parity pyproject.toml && uv run --frozen pytest tests/nodes/node_join_refusal_effect/test_join_j7_seam.py -k golden -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn23420-ac2-j7-floor
  description: The served floor reads join J7 as passed. Hosted CI cannot reach the floor host (the URL is in FLOOR_SIMPLE_URL), so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: "curl -s -m 20 \"${FLOOR_SIMPLE_URL:?set FLOOR_SIMPLE_URL to the served floor-simple.json}\" | python3 -c \"import json,sys; d=json.load(sys.stdin); sys.exit(0 if [j for p in d['pieces'] if p['piece']==7 for j in p['joins'] if j['id']=='J7'][0]['state']=='passed' else 1)\""
    cwd: .
