schema_version: 1.0.0
ticket_id: OMN-22120
title: The throughput tick decision node no longer imports the runtime models on cold start, so its read stays inside its share of the tick budget
summary: The handlers package of node_throughput_tick_decision_compute resolves HandlerThroughputTickScheduledFire on first access, so the decision handler's cold import skips omnibase_infra.runtime.models.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn22120-tick-node-cold-start
  statement: The decision node's cold start pays for an import only its scheduled-fire handler needs, which on a CPU-bound launching host is part of the node call timing out inside its share of the tick budget.
  acceptance:
  - id: AC1
    statement: 'AC1: the decision handler import does not load omnibase_infra.runtime.models and the package export of the scheduled-fire handler still resolves -- falsifier: uv run pytest tests/ -q -k tick_node_cold_start in omnimarket'
evidence_requirements:
- kind: tests
  description: The cold-start tests of the throughput tick decision node.
  command: uv run pytest tests/test_throughput_tick_node_cold_start.py -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn22120-ac1
  description: AC1 the decision handler import skips the runtime models and the package export still resolves.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/test_throughput_tick_node_cold_start.py -q --no-cov --tb=line -k tick
    cwd: .
- id: dod-omn22120-integration-proof
  description: Run the tick tests on a lab host at the pushed head. The hosted verifier cannot dispatch lab work, so this unbound check belongs to the local Done gate.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-22120 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/ -q --no-cov -k tick
    cwd: .
