    statement: 'AC1: omnimarket''s PR Title Check workflow produces `pr-title / check-title` by running node_pr_title_check_compute from a pinned published omnimarket release, and no workflow line in pr-title-check.yml references onex_change_control -- falsifier: uv run pytest tests/ci/test_pr_title_check_omnimarket_node.py -q -n 0 fails when parsing the merge-base workflow.'
