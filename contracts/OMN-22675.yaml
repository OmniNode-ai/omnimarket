schema_version: 1.0.0
ticket_id: OMN-22675
title: The delegation savings view answers inside the projection API's 15 s read bound
summary: Migration 101 reads the savings view's unpriced call count from the flags combined_sessions already carries from its one hash left join, instead of probing the savings_sessions CTE for every unpriced delegation_events row, so the savings exposure answers instead of 503 projection_database_unavailable.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn22675-savings-view-single-pass
  statement: The savings view gives the answer migration 098 gave for every column it serves, without the per-row probe that read 31.8 s on the dev lane, and the check that finds the probe is shown finding it in the 098 definition.
  acceptance:
  - id: AC1
    statement: 'AC1: on a real Postgres seeded with the 096 cases the view returns the same unpriced_call_count, session_count and totals as before -- falsifier: uv run --frozen pytest tests/test_omn20717_savings_unpriced_call_count_real_postgres.py -q --no-cov'
  - id: AC2
    statement: 'AC2: a test asserts the view definition holds no per-row probe of savings_sessions for the unpriced count, and the same assertion run against the 098 definition reports the probe -- falsifier: uv run --frozen pytest tests/test_omn22675_savings_unpriced_single_pass_real_postgres.py -q --no-cov'
  - id: AC3
    statement: 'AC3: on the dev database the view read for the house tenant answers in under 5 s -- falsifier: curl on the projection API savings exposure for the house tenant answers HTTP 200 instead of 503'
evidence_requirements:
- kind: tests
  description: The savings view tests pass on a real Postgres
  command: uv run --frozen pytest tests/test_omn22675_savings_unpriced_single_pass_real_postgres.py tests/test_omn20717_savings_unpriced_call_count_real_postgres.py -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn22675-view-tests
  description: Runs the oracle comparison against the 098 definition, the probe check with its failing control, and the existing unpriced count cases. For AC3 it proves the structural cause of the slow read is gone; the dev read itself is the integration-proof item.
  source: manual
  binds_ac:
  - AC1
  - AC2
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/test_omn22675_savings_unpriced_single_pass_real_postgres.py tests/test_omn20717_savings_unpriced_call_count_real_postgres.py -q --no-cov
    cwd: .
- id: dod-omn22675-integration-proof
  description: After the dev lane runs migration 101, the savings exposure for the house tenant answers HTTP 200. Only the local Done gate can reach the dev lane.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: test "$(curl -s -m 40 -o /dev/null -w '%{http_code}' "${DEV_PROJECTION_API_URL:?}/projection/onex.snapshot.projection.delegation.savings.v1?tenant=820272f9-4aaf-5add-a2df-0af942852ab2")" = 200
    cwd: .
