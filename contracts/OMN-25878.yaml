schema_version: 1.0.0
ticket_id: OMN-25878
title: Distinguish dev boot from R8 and R9 scenario failures
summary: Scheduled R8 and R9 poll dev readiness before their first scenario read. A readiness timeout produces a neutral skipped result.
is_seam_ticket: true
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn25878-scenario-readiness
  statement: R8 and R9 record the outcome of a readiness timeout separately from a product failure.
  acceptance:
  - id: AC1
    statement: >-
      AC1: the cause of the r8 exit 1 at 02:34:45Z and the r9 exit 1 at 02:34:45Z and 03:34:45Z, and of the r8 exit 1 at 01:47:23Z, is named from the h053 journals and the dev /ready readings at those times, in the lane's TERMINAL row -- falsifier: the TERMINAL row cites no journal line for one of the four failures, or names a cause that the dev /ready reading at that time contradicts
  - id: AC2
    statement: >-
      AC2: a regression test built from the recorded journal and /ready output of the 02:34:45Z failure (fixture path named in the pull request) fails on the unfixed scenario nodes and passes on the fix -- falsifier: `uv run pytest tests/nodes/node_delegation_scenario_r8_effect tests/nodes/node_delegation_scenario_r9_effect -q` exits 0 on the fix and exits non-zero on dev
  - id: AC3
    statement: >-
      AC3: when dev /ready does not answer within the wait bound, r8 and r9 each end with a typed not-ready result that no consumer reads as a scenario failure or a product fault, and when /ready answers inside the bound the scenario runs unchanged -- falsifier: a pytest case that stubs /ready as unavailable and asserts the typed not-ready result, run by `uv run pytest tests/nodes/node_delegation_scenario_r8_effect tests/nodes/node_delegation_scenario_r9_effect -q`, fails or the unit exit code for that case is 1
  - id: AC4
    statement: >-
      AC4: the branch is installed on h053 through the declared host installer, and one r8 run and one r9 run after the install each read Finished successfully in the h053 journal, with the installed revision recorded as installed=h053:<revision> -- falsifier: `ssh h053 journalctl --user -u onex-delegation-scenario-r8 -u onex-delegation-scenario-r9 --since <install time>` shows no Finished line for one of the two units, or the installed revision lacks the fix sha
  - id: AC5
    statement: >-
      AC5: the count of idle-converge recreates of the dev runtime per day, and whether it recreates with no new commits on origin/dev, is posted as a comment on [OMN-19509](https://linear.app/omninode/issue/OMN-19509) for the deploy-agent owner -- falsifier: `list_comments` on [OMN-19509](https://linear.app/omninode/issue/OMN-19509) holds no comment with an actor line from this lane that gives the recreate count and the no-new-commit reading
dod_evidence:
- id: dod-omn25878-ac1-journal-and-ledger
  description: AC1 operational evidence is the lane report and TERMINAL row. The recorded fixture holds the paired 02:34:45Z journal exits of the two scenario units, and this check reads them. Historical readiness during the three overlapping exits is unmeasured.
  source: manual
  evidence_artifact: tests/nodes/node_delegation_scenario_r8_effect/fixtures/ready_unavailable_20261119.json
  binds_ac: [AC1]
  checks:
  - check_type: command
    check_value: |
      uv run --frozen python -c "import json; j=json.load(open('tests/nodes/node_delegation_scenario_r8_effect/fixtures/ready_unavailable_20261119.json'))['journal']; assert sum('02:34:45' in l and 'status=1/FAILURE' in l for l in j)==2; print('AC1_FIXTURE_JOURNAL_EXITS=2')"
      grep -qE 'wait_seconds: 850$' src/omnimarket/nodes/node_delegation_scenario_r8_effect/contract.yaml
      uv run pytest tests/nodes/node_delegation_scenario_r8_effect/test_dev_readiness.py -q
    cwd: .
- id: dod-omn25878-ac2-regression
  description: The fixture contains the paired 02:34:45Z journal exits with simulated unavailability. The real scheduled entry points return a typed skipped result before either product check.
  source: manual
  binds_ac: [AC2]
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_delegation_scenario_r8_effect/test_dev_readiness.py -q
    cwd: .
- id: dod-omn25878-ac3-scenario-and-reader
  description: The scheduled ticks, skip record and green-days reader are checked together. The separate alarm branch tests the counter and distinct alarm using the same last-run record fields.
  source: manual
  binds_ac: [AC3]
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_delegation_scenario_r8_effect/test_dev_readiness.py tests/nodes/node_delegation_scenario_r8_effect/test_scenario_r8_tick.py tests/nodes/node_delegation_scenario_days_compute/test_green_days.py -q
    cwd: .
- id: dod-omn25878-integration-proof-ac4-live-install
  description: Live read of the two scenario units on h053 after the branch install through the declared installer. Each unit's journal holds a Finished line after the install, which a typed dev-not-ready skip also produces because it exits 0, and a unit that exits 1 leaves none. The installed revision is recorded as installed=h053:<revision> in the lane report.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: |
      ssh h053 'for u in r8 r9; do journalctl --user -u onex-delegation-scenario-$u --since "2026-11-19 06:30" --no-pager | grep -q "Finished onex-delegation-scenario-$u" || exit 1; done'
    cwd: .
- id: dod-omn25878-ac5-deploy-agent-finding
  description: AC5 operational evidence is the prior lane's comment on the idle-converge ticket. It reports daily counts, the two measured changed component revisions, and the historical same-revision gap. The check reads the comment through the Linear API at the local Done gate and requires its actor line.
  source: manual
  execution_scope: local_done_gate
  evidence_artifact: https://linear.app/omninode/issue/OMN-19509#comment-ca7f5c2c-1388-4d6b-9b9a-6f7459ce0efe
  checks:
  - check_type: command
    check_value: |
      curl -sf -H "Authorization: $LINEAR_API_KEY" -H "Content-Type: application/json" -d '{"query":"{ comment(id: \"ca7f5c2c-1388-4d6b-9b9a-6f7459ce0efe\") { body } }"}' https://api.linear.app/graphql | grep -q 'actor:'
    cwd: .
- id: dod-omn25878-ac4-hosted-proxy
  description: Hosted proxy for AC4. The scheduled unit declarations for the scenario nodes render from the installer registry at this revision. The live h053 read stays in the local Done gate item.
  source: manual
  binds_ac: [AC4]
  checks:
  - check_type: command
    check_value: |
      test "$(grep -c 'run_timeout_s: 1800$' src/omnimarket/nodes/node_host_installer_registry_units/contract.yaml)" = 2 &&
      uv run pytest tests/nodes/node_host_installer_registry_units/test_scenario_r3_r5_r8_units.py -q
    cwd: .
- id: dod-omn25878-ac5-hosted-proxy
  description: Hosted proxy for AC5. This contract cites the comment on the idle-converge ticket by its comment id, and the check fails where the r9 scenario contract declares no readiness wait.
  source: manual
  binds_ac: [AC5]
  checks:
  - check_type: command
    check_value: |
      grep -q 'ca7f5c2c-1388-4d6b-9b9a-6f7459ce0efe' contracts/OMN-25878.yaml &&
      grep -qE 'wait_seconds: 850$' src/omnimarket/nodes/node_delegation_scenario_r9_effect/contract.yaml &&
      uv run pytest tests/nodes/node_delegation_scenario_r8_effect/test_dev_readiness.py -q
    cwd: .
- id: dod-omn25878-hosted-deploy
  description: The hosted runner checks the exact PR revision's scenario contracts for a declared readiness wait, then exercises the packaged scheduled entry points with the fixture.
  source: manual
  checks:
  - check_type: command
    check_value: |
      gh api "repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_delegation_scenario_r8_effect/contract.yaml?ref=$(git rev-parse HEAD)" --jq .content | base64 -d | grep -E 'wait_seconds: 850$' &&
      gh api "repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_delegation_scenario_r9_effect/contract.yaml?ref=$(git rev-parse HEAD)" --jq .content | base64 -d | grep -E 'wait_seconds: 850$' &&
      uv run --frozen pytest tests/nodes/node_delegation_scenario_r8_effect/test_dev_readiness.py -q
    cwd: .
