- id: dod-omn24628-integration-proof
  description: Hosted CI cannot reach a lab host, so only the local Done gate runs this unbound check. It runs scenario R8 once (manual, recorded to a file) at the sha on a lab host and fails while that record still shows -organic_run_has_values.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24628 --kind test -- sh -c 'uv run --frozen python -m omnimarket.nodes.node_delegation_scenario_r8_effect run --manual --record /tmp/r8_omn24628_record.json && ! grep -q -e "-organic_run_has_values" /tmp/r8_omn24628_record.json'
    cwd: .
