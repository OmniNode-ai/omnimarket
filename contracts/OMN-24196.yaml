schema_version: 1.0.0
ticket_id: OMN-24196
title: A scheduled host hygiene orchestrator runs each lab machine's due clean-ups
summary: 'Two omnimarket nodes: node_host_hygiene_decision_compute (pure: per host and per cleanup, due or not, from the host''s newest disk reading, a used-fraction threshold, a minimum interval and an unread-reading policy) and node_host_hygiene_orchestrator (holds the newest disk reading per host; on a runtime tick gated by its overlay''s run interval it decides, sends one lab work unit per due cleanup to its host, and publishes one run event with every decision and each unit''s typed result plus one schedule run event). Every threshold, host, repository, commit, lane and command word is in the node overlay.'
is_seam_ticket: true
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24196-host-hygiene-orchestrator
  statement: A scheduled orchestrator in the runtime sends each lab host's due cleanups to that host over the lab-work service and publishes one typed run result.
  acceptance:
  - id: AC1
    statement: 'AC1: a due schedule tick sends each due clean-up to its machine as one work unit and publishes one run result listing every decision and each unit''s typed outcome -- falsifier: uv run pytest tests/chains/host_hygiene -q fails without the node'
  - id: AC2
    statement: 'AC2: a clean-up that exits non-zero reads as failed and fails the run, and one that never reached its machine is sent again on the next due tick -- falsifier: uv run pytest tests/unit/nodes/node_host_hygiene_orchestrator/test_scheduled_run.py -q -k "nonzero or never_reached" fails when exit code 3 is mapped to completed'
  - id: AC3
    statement: 'AC3: the five seams (disk reading routine, lab-work service, clean-up commands, schedule reducer, decision compute) each fail a test when either side changes shape -- falsifier: uv run pytest tests/unit/nodes/node_host_hygiene_orchestrator/test_contract_seams.py -q fails when the read topic is renamed in the contract'
  - id: AC4
    statement: 'AC4: integrated: in the running dev runtime a scheduled run dispatches to h053 and its typed result is read on the run topic, read nine minutes after the runtime recreate -- falsifier: the run topic holds no run naming h053 after the scheduled interval'
evidence_requirements:
- kind: tests
  description: The nodes' focused tests pass at the pushed head.
  command: uv run --frozen pytest tests/unit/nodes/node_host_hygiene_orchestrator tests/unit/nodes/node_host_hygiene_decision_compute tests/chains/host_hygiene -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
