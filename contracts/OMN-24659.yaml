schema_version: 1.0.0
ticket_id: OMN-24659
title: The code graph refresh on merge writes its marker only after a written build, defers after a failed attempt under one lock, and its contract carries the ticket's four criteria
summary: 'Review findings on the refresh verb of node_code_graph_effect (omnimarket#6308, ticket OMN-24642): the built marker is written only when the ledger holds the build''s row, the refresh result reads the marker back after a build, a failed attempt defers the next ticks, one fcntl lock in the state directory lets one writing build run at a time, tests drive the refresh through its real closure and the CLI, and contracts/OMN-24642.yaml states the ticket''s four criteria with the installed-unit criterion bound to a local Done gate check on h053.'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24659-refresh-review-findings
  statement: The refresh on merge never reports a build it did not write, defers after a failed attempt and under one lock, and its contract carries the ticket's criteria.
  acceptance:
  - id: AC1
    statement: 'AC1: a probe run and a failed run each leave no code-graph-built.json marker, and the marker is written only when the ledger result is written or already-written -- falsifier: uv run pytest tests/nodes/node_code_graph_effect/test_code_graph_refresh.py -q -k marker'
  - id: AC2
    statement: 'AC2: tests drive build_refresh_handler, _refresh and main refresh: a tick that builds and writes the marker then a second tick that answers fresh with one build in total, the build-failed path returns failed with exit 1 and an untouched marker, and an unset host or state directory variable exits 3 -- falsifier: uv run pytest tests/nodes/node_code_graph_effect/test_code_graph_refresh.py -q -k "tick or failed or unset"'
  - id: AC3
    statement: 'AC3: after a build the result reports the built_at and built_heads read back from the rewritten marker and fails when the marker was not rewritten -- falsifier: uv run pytest tests/nodes/node_code_graph_effect/test_code_graph_refresh.py -q -k readback'
  - id: AC4
    statement: 'AC4: a failed build records the attempt and the next tick within 15 minutes defers, and a second run while another holds the one fcntl lock in the state directory defers -- falsifier: uv run pytest tests/nodes/node_code_graph_effect/test_code_graph_refresh.py -q -k "attempt or lock"'
  - id: AC5
    statement: 'AC5: contracts/OMN-24642.yaml states the four criteria of OMN-24642 as written, binds the installed-unit criterion to a local_done_gate check that reads the unit and a fresh log entry on h053, and the integration proof matches outcome=(refreshed|fresh|deferred) and states or avoids its appended row -- falsifier: uv run pytest tests/nodes/node_code_graph_effect -q -k contract'
