- id: dod-omn24659-pr-body-scope
  description: The pull request body says this change fixes neither the unreadable architecture graph, ARCH_GRAPH_BOLT_URI unbound on lab hosts with owner OMN-14572, nor the missing code graph query path. It states no criterion of its own. Only the local Done gate runs this unbound check, which reads the pull request from the watcher state. It fails unless the body names ARCH_GRAPH_BOLT_URI.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: onex scm pr-view OmniNode-ai/omnimarket#6308 | grep -q ARCH_GRAPH_BOLT_URI
    cwd: .
- id: dod-omn24659-integration-proof
  description: Hosted CI cannot reach a lab host, so only the local Done gate runs this unbound check. It runs the refresh verb of the code graph node at the sha on a lab host against the lab clones and a scratch state directory, and fails unless the verb prints a REFRESH line whose outcome is refreshed, fresh or deferred. With the empty scratch state directory the verb runs a writing build, so each run appends one operational code graph row to the ledger; a failed outcome fails the check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24659 --kind test -- sh -c 'ONEX_CODE_GRAPH_STATE_DIR="$(mktemp -d)" uv run --frozen python -m omnimarket.nodes.node_code_graph_effect refresh | grep -Eq "^REFRESH outcome=(refreshed|fresh|deferred) "'
    cwd: .
