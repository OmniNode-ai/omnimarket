---
schema_version: "1.0.0"
ticket_id: "OMN-22403"
title: "A contract that binds an acceptance criterion to a local_done_gate item is refused by the Tests gate, before a full hosted dod-verify run"
summary: "The hosted receipt gate runs a local_done_gate item neither at the head nor at the merge base, so it refuses a bound one as a control that did not run. contract_binds_violations now names that shape, so test_every_repo_contract_binds_every_criterion refuses it in the Tests gate."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-bound-scoped-item-refused-early"
    statement: |-
      A contract that binds a criterion to a local_done_gate item must be refused by the repository's own contract checker.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: a regression test built from the recorded annotation text and the omnimarket#4918 contract shape fails on the previous contract_binds_violations and passes once a local_done_gate item with a non-empty binds_ac is a violation -- falsifier: uv run pytest tests/ci/test_repo_evidence_caller_workflow.py -q -k local_done_gate
      - id: "AC2"
        statement: |-
          AC2: every contract on dev still passes the checker, so the new rule refuses no merged contract -- falsifier: uv run pytest tests/ci/test_repo_evidence_caller_workflow.py -q -k every_repo_contract_binds
evidence_requirements:
  - kind: "tests"
    description: "The contract checker refuses a bound local_done_gate item and accepts every contract on the tree."
    command: "uv run pytest tests/ci/test_repo_evidence_caller_workflow.py -q -k local_done_gate"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn22403-ac1-ac2-bound-scoped-item-refused"
    description: "AC1: the checker refuses a bound local_done_gate item and accepts an unbound one; the rule lives in services/scoped_item_binding.py, absent at the merge base, so the test module fails to import there."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "env PYTHONDONTWRITEBYTECODE=1 uv run pytest tests/ci/test_repo_evidence_caller_workflow.py -q --no-cov -k local_done_gate"
        cwd: "."
    binds_ac: ["AC1"]
  - id: "dod-omn22403-ac2-repo-contracts"
    description: "AC2: every repository contract passes the binding checker, and the module that carries the rule is absent at the merge base, so this check fails there."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "env PYTHONDONTWRITEBYTECODE=1 uv run pytest tests/ci/test_repo_evidence_caller_workflow.py -q --no-cov -k every_repo_contract_binds"
        cwd: "."
    binds_ac: ["AC2"]
  - id: "dod-omn22403-deploy-probe"
    description: "Deploy probe: the module GitHub serves at the checked-out commit carries scoped_item_binding_violation, which the merge base does not."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: |-
          bash -o pipefail -c 'gh api "repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_dod_verify/services/scoped_item_binding.py?ref=$(git rev-parse HEAD)" --jq .content | base64 -d | grep -F "def scoped_item_binding_violation" > /dev/null'
        cwd: "."
