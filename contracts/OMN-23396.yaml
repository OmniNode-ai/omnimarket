schema_version: 1.0.0
ticket_id: OMN-23396
title: The runner-placement snapshot publisher reads its hosts from the lab host table, so every lab host gets a fresh snapshot
summary: node_prrp_snapshot_publish_effect takes its target hosts from the rows of the declared lab host table (the lab_hosts overlay) instead of a hosts file the installer wrote, and carries each row's ssh login, jump host, key and fallback destinations to the copy. The command no longer takes a hosts file.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23396-hosts-from-table
  statement: The publisher writes the snapshot to every available host of the declared lab host table and to no host the table does not hold.
  acceptance:
  - id: AC1
    statement: 'AC1: the publisher takes its target hosts from the declared lab host table overlay (no host list in a state file or the plist), and a test with a planted host table proves a host added there is written and a host removed is not -- falsifier: uv run pytest tests/nodes/node_prrp_snapshot_publish_effect -q in omnimarket fails on the unfixed node'
  - id: AC2
    statement: 'AC2: after install on the Mac through the declared installer, one run writes a snapshot dated the same day on every lab host in the table and raises no alarm -- falsifier: the unit''s err log after its next run, and the snapshot captured_at on h051 and h202'
evidence_requirements:
- kind: tests
  description: The planted-table tests (host added is written, host removed is not, unavailable row skipped, row login and fallback route carried, a missing or invalid table fails the run loudly) and the publisher's existing handler and golden chain tests
  command: uv run --frozen pytest tests/nodes/node_prrp_snapshot_publish_effect tests/test_golden_chain_prrp_snapshot_publish_effect.py -q --no-cov -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23396-hosts-from-table
  description: Plants a lab_hosts overlay under an overlay root and runs the command against it with a stand-in gate and a stand-in ssh. Two hosts are written; after a host is added to the table and another removed, the added host is written and the removed host gets no ssh call. A row the table marks unavailable is skipped with no ssh, a local row is a file write, a row carrying the real table's other columns is read, the row's login, key, jump host and fallback destination reach ssh, and a missing or invalid table fails the run with an ALARM line and copies nothing. The command refuses a hosts-file flag. On the base commit (the head of omnimarket#5534) the command reads a hosts file, so the eight new tests fail.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_prrp_snapshot_publish_effect/test_prrp_snapshot_hosts_from_lab_table.py -q --no-cov -p no:randomly
    cwd: .
- id: dod-omn23396-all-table-hosts-written
  description: Runs the command over planted tables whose rows are written on every available host, skipped when the table marks them unavailable, read when they carry the real table's other columns, and alarm with no heartbeat when one host cannot be reached. This is the hosted stand-in for AC2; the live readback on the Mac is the local Done gate item below. A hosted job cannot run a local_done_gate item at the merge base, so that item binds no criterion.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_prrp_snapshot_publish_effect/test_prrp_snapshot_hosts_from_lab_table.py -q --no-cov -p no:randomly -k "unavailable_is_skipped or real_tables_other_columns or every_host_down"
    cwd: .
- id: dod-omn23396-regression
  description: The publisher's golden chain (a failed read records a failure and a recovery publishes) and the node entrypoint binding still pass. Binds no criterion; a regression check.
  source: manual
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/test_golden_chain_prrp_snapshot_publish_effect.py -q --no-cov -p no:randomly
    cwd: .
- id: dod-omn23396-install-readback
  description: After the branch is installed on the launching Mac through the declared installer, one run of ai.omninode.prrp-snapshot-publish writes captured_at dated that day on every available row of the lab host table, h051 and h202 included, and its err log holds no ALARM line. Hosted CI cannot reach the Mac or the lab hosts, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: 'ssh h051 "grep captured_at $HOME/.omninode/prrp/variables-snapshot.json"'
    cwd: .
- id: dod-omn23396-integration-proof
  description: The new tests run on a lab host at the pushed head through the lab work runner. Hosted CI cannot reach the Mac or the lab hosts, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: 'env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23396 --kind test -- uv run --frozen pytest tests/nodes/node_prrp_snapshot_publish_effect -q --no-cov -p no:randomly'
    cwd: .
