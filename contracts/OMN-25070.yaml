---
schema_version: "1.0.0"
ticket_id: OMN-25070
title: onex setup loads on every omnibase-core a customer install can resolve
summary: >-
  omnibase_core#2335 moved run_node_in_process to ModelRunNodeHosted.run. A customer install
  resolves the newest omnibase-core, where the setup command failed to import, so onex --help
  exited 1 and the installed onex did not run. The setup command now takes the new home first and
  the old one only when the new module itself is absent; any other import failure is raised.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn25070-setup-loads-on-customer-core
    statement: The onex setup command imports on an omnibase-core with only the new hosted-run home,
      on one with only the old home, and raises a real import failure inside the new home.
    acceptance:
      - id: AC1
        statement: >-
          AC1 (this repository's part, the installed onex runs): the setup entry point loads on a core
          without run_node_in_process and on a core without ModelRunNodeHosted, and a broken import
          inside the new home is raised rather than hidden -- falsifier: uv run pytest
          tests/unit/nodes/node_onex_setup_effect/test_hosted_run_import_omn25070.py fails on omnimarket
          dev 62ba6381480713ebc593a92af42061b8b2cd18f6, where cli.py imports run_node_in_process by name.
evidence_requirements:
  - kind: tests
    description: The hosted-run import tests and the rest of the setup node's unit tests.
    command: uv run --frozen pytest tests/unit/nodes/node_onex_setup_effect -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
