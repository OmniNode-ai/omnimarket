---
schema_version: "1.0.0"
ticket_id: OMN-25070
title: The customer package omninode-onex declares the customer launchers and pins its distributions
summary: >-
  omnimarket now holds the customer package omninode-onex under packages/omninode-onex. It carries
  no code, declares onex and omni-agent with omnibase_core's CLI as their target, and pins
  omnibase-core, omnibase-infra, omnibase-spi, omnimarket and omninode-memory with ==. A customer runs uv tool install
  omninode-onex, which links only the named package's launchers, so exactly onex and omni-agent
  land on PATH. During the testing phase omnibase-core keeps declaring the same two launchers.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn25070-customer-package
    statement: The customer package declares exactly onex and omni-agent, pins each distribution with ==,
      and its wheel carries no code.
    acceptance:
      - id: AC2
        statement: >-
          AC2 (testing-phase form, package part): the package declares exactly onex and omni-agent with
          omnibase_core's target, pins omnibase-core, omnibase-infra, omnibase-spi, omnimarket and omninode-memory with ==, pins
          omnimarket no newer than this repository's version, and its built wheel holds only its dist-info --
          falsifier: uv run pytest tests/ci/test_omninode_onex_package_omn25070.py fails on omnimarket
          dev, where packages/omninode-onex does not exist. The install part (uv tool install puts
          exactly onex and omni-agent on PATH and onex runs) is the opt-in
          tests/e2e/test_setup_packaged_journey.py -k customer_launchers_only, run with
          ONEX_TEST_ONEX_WHEEL set.
  - id: req-omn25070-curl-installer
    statement: curl -fsSL https://omninode.ai/install.sh | bash installs omninode-onex on Apple Silicon macOS and
      Linux with a checksum-verified uv, refuses unsupported platforms and foreign launchers, and is safe to rerun.
    acceptance:
      - id: AC4
        statement: >-
          AC4 (testing-phase form): the installer node_onex_installer_render_compute renders from
          packages/omninode-onex/installer.json, piped into bash, maps Apple Silicon macOS (also under
          Rosetta) and Linux x86_64 and arm64 to the right uv build and refuses, before installing
          anything, every platform not supported yet (Intel macOS, Windows, musl Linux, any other CPU or
          system); never builds from source; never runs a uv archive whose sha256 differs from the value in the script; refuses,
          naming the file and leaving it unchanged, when a launcher it did not install is in uv's bin
          directory; and installs, reinstalls and upgrades leaving exactly onex and omni-agent on PATH --
          falsifier: uv run pytest tests/ci/test_omninode_onex_install_sh_omn25070.py fails on omnimarket
          dev, where neither the node nor its request exists; the real install cases run with ONEX_TEST_ONEX_WHEEL set,
          on each platform in .github/workflows/onex-installer.yml.
  - id: req-omn25070-run-by-lane-kept
    statement: No infra change is required. The stack-shape baseline forbids re-commanding projection-api, so T1
      removes no console script marked run_by_lane.
    acceptance:
      - id: AC5
        statement: >-
          AC5 (amended 2026-11-18): no infra change is required. The stack-shape baseline forbids re-commanding
          projection-api, so T1 removes no console script marked run_by_lane, proved by the existing stack-shape
          gate and a market-side run_by_lane_scripts_kept test -- falsifier: uv run pytest
          tests/ci/test_omninode_onex_package_omn25070.py -k run_by_lane fails when omnimarket-projection-api is removed from,
          or retargeted in, pyproject.toml [project.scripts], or declared by packages/omninode-onex.
  - id: req-omn25070-no-git-install
    statement: The guide's install line, run as printed with --no-build into an empty HOME, never calls git, creates no .git directory, builds nothing and gives an onex that runs on each supported platform.
    acceptance:
      - id: AC1
        statement: >-
          AC1 (as written on the ticket, platforms as amended on 2026-11-18 and 2026-11-19: Apple Silicon macOS, Linux x86_64 and Linux arm64): the guide's install line, run as printed (with its --no-build) into an empty HOME with no UV_NO_BUILD in the environment, never calls git, creates no .git directory and gives an onex that runs, so every distribution of the dependency closure installs from a published wheel; with a build-backend stub that fails the test if invoked and a transitive dependency's newer release published only as a source distribution after the candidate, the line installs that dependency from a wheel or exits non-zero naming it, and a control line without --no-build invokes the stub and fails -- falsifier: uv run pytest tests/e2e/test_setup_packaged_journey.py -q -k no_git_install, on each of those runners (the onex installer workflow runs it on all three with the candidate wheel and ONEX_E2E_REQUIRE_COMPLETE=1).
  - id: req-omn25070-one-package-uv-and-pipx
    statement: The customer package is the only owner of onex and omni-agent, and uv and pipx each install it under Python 3.12 with exactly those two launchers.
    acceptance:
      - id: AC3
        statement: >-
          AC3 (ticket text as amended 2026-11-21), the part this falsifier checks: uv tool install --python 3.12 --no-build omninode-onex==<candidate> and pipx install --python 3.12 --pip-args=--only-binary=:all: omninode-onex==<candidate>, each into an empty HOME with a PATH of /usr/bin and /bin plus only the installers and Python 3.12 and Python 3.11 as the default interpreter for uv and pipx (UV_PYTHON, PIPX_DEFAULT_PYTHON), install under Python 3.12, put exactly onex and omni-agent on PATH, run onex, and build nothing from AC1's source-only certifi fixture, which is shown to be in the closure; each launcher is declared once, by omninode-onex with the target omnibase_core.cli.cli_commands:cli, counting console_scripts, gui_scripts and launcher files listed in any RECORD; every hashed file of the customer wheel's RECORD is installed with that sha256; every Requires-Dist of the customer package is a single == pin equal to the installed version, and every installed omnibase-, omnimarket or omninode- distribution is pinned; the customer package carries no code; offline controls (core only, both, none, a wrong target, a gui_scripts or RECORD launcher, a changed installed file, no pins, an unpinned or non-== pin, code in the wheel) fail. Not yet covered here, because they need the release train's candidate manifest: the owner and target as the manifest names them, the customer wheel's sha256, and the installed content of the other distributions. The pipx line without --python 3.12 fails because pipx installs through uv (PIPX_DEFAULT_BACKEND=uv, pipx's default when uv is on PATH); with pip, pipx picks a Python 3.12 from PATH itself. -- falsifier: uv run pytest tests/e2e/test_setup_packaged_journey.py -q -k one_package_uv_and_pipx.
  - id: req-omn25070-installer-matches-manifest
    statement: The candidate check refuses a served curl installer that is not the one the candidate manifest pins.
    acceptance:
      - id: AC4
        statement: >-
          AC4 (ticket text), the candidate-check part this falsifier checks: the M13 candidate check
          (node_release_candidate_verify_effect, operation verify_installer) refuses a served script whose
          sha256 differs from the one the manifest pins; whose ONEX_PACKAGE and ONEX_VERSION are not set
          exactly once (plain, export, readonly, declare or local) to the manifest's installer package and
          that distribution's version; that names an index other than https://pypi.org/simple through
          -i, --index-url, --extra-index-url, --default-index or --index, or through UV_INDEX_URL,
          UV_DEFAULT_INDEX, UV_INDEX or PIP_INDEX_URL; that uses UV_EXTRA_INDEX_URL, PIP_EXTRA_INDEX_URL,
          --config-file, UV_CONFIG_FILE, PIP_CONFIG_FILE, --index-strategy, UV_INDEX_STRATEGY,
          UV_FIND_LINKS, PIP_FIND_LINKS, or --find-links or -f with a value that is not a shell variable;
          that sets UV_NO_BUILD*, UV_NO_BINARY*, PIP_NO_BINARY, PIP_ONLY_BINARY or
          PIP_NO_BUILD_ISOLATION; or that runs pip, pip3, pipx, uv tool or uv install, uvx, uv tool run,
          or uv add, sync or run without the exact token --no-build (or --only-binary=:all:) in the same
          command, lines joined across backslash continuations. The installer rendered from
          packages/omninode-onex/installer.json at the candidate version passes, naming PyPI explicitly
          passes, and the installer's own --find-links "$ONEX_INSTALL_FIND_LINKS" test hook passes. This is
          a list of refused spellings, not a shell interpreter: an index or install hidden behind eval, a
          sourced file or a function built at run time is not covered. Not covered here: the install on
          actual macOS and Linux from a local stand-in for the domain (-k curl_installer_same_release).
          -- falsifier: uv run pytest
          tests/nodes/node_release_candidate_verify_effect/test_installer_matches_manifest.py -q -k installer_matches_manifest.
evidence_requirements:
  - kind: tests
    description: The package tests; the opt-in install check runs with ONEX_TEST_ONEX_WHEEL set.
    command: uv run --frozen pytest tests/ci/test_omninode_onex_package_omn25070.py -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn25070-customer-package
    description: The customer package declares the two launchers, pins its distributions with == and
      ships no code. The bound test fails on dev, where the package does not exist.
    source: manual
    binds_ac: [AC2]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/ci/test_omninode_onex_package_omn25070.py -q --no-cov
        cwd: ${OMNI_HOME}/omnimarket
  - id: dod-omn25070-curl-installer
    description: The installer's platform, checksum and conflict cases, run through bash from stdin. The bound
      test fails on dev, where the script does not exist.
    source: manual
    binds_ac: [AC4]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/ci/test_omninode_onex_install_sh_omn25070.py -q --no-cov
        cwd: ${OMNI_HOME}/omnimarket
  - id: dod-omn25070-ac5-run-by-lane-kept
    description: Every omnimarket console script the infra stack shape marks run_by_lane is still declared with
      the same target, and the customer package declares none of them. The bound test fails when a script is
      removed or retargeted.
    source: manual
    binds_ac: [AC5]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest -q --no-cov tests/ci/test_omninode_onex_package_omn25070.py -k run_by_lane
        cwd: ${OMNI_HOME}/omnimarket
  - id: dod-omn25070-installer-integration-proof
    description: The render node and the rendered installer run on a lab host at the pushed head. Hosted CI runs
      the same tests per platform; only the local Done gate runs this unbound check on the lab.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-25070 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_onex_installer_render_compute tests/ci/test_omninode_onex_install_sh_omn25070.py -q --no-cov
        cwd: ${OMNI_HOME}/omnimarket
  - id: dod-omn25070-no-git-install
    description: >-
      Builds the candidate wheel at this commit and runs the guide's install line test with ONEX_E2E_REQUIRE_COMPLETE=1, so a missing wheel fails rather than skips. Red while the candidate's pins resolve to a release without the onex setup fix.
    source: manual
    binds_ac:
      - AC1
    execution_scope: hosted_and_local
    checks:
      - check_type: command
        check_value: >-
          sh -c 'd="$(mktemp -d)" && uv build --wheel --out-dir "$d" packages/omninode-onex && ONEX_TEST_ONEX_WHEEL="$(ls "$d"/omninode_onex-*.whl)" ONEX_E2E_REQUIRE_COMPLETE=1 uv run --frozen pytest tests/e2e/test_setup_packaged_journey.py -q --no-cov -k no_git_install'
        cwd: ${OMNI_HOME}/omnimarket
  - id: dod-omn25070-one-package-uv-and-pipx
    description: >-
      Builds the candidate wheel at this commit and installs it with uv and with pipx into empty homes whose default Python is 3.11, with ONEX_E2E_REQUIRE_COMPLETE=1 so a missing wheel fails rather than skips. Red while omnibase-core still declares onex and omni-agent beside omninode-onex (released 0.47.76 and earlier); green once the candidate pins the core release that stops declaring them. Needs pipx and Python 3.11 and 3.12 on the host.
    source: manual
    binds_ac:
      - AC3
    execution_scope: hosted_and_local
    checks:
      - check_type: command
        check_value: >-
          sh -c 'd="$(mktemp -d)" && uv build --wheel --out-dir "$d" packages/omninode-onex && ONEX_TEST_ONEX_WHEEL="$(ls "$d"/omninode_onex-*.whl)" ONEX_E2E_REQUIRE_COMPLETE=1 uv run --frozen pytest tests/e2e/test_setup_packaged_journey.py -q --no-cov -k one_package_uv_and_pipx'
        cwd: ${OMNI_HOME}/omnimarket
  - id: dod-omn25070-installer-matches-manifest
    description: >-
      The candidate check against the curl installer rendered from packages/omninode-onex/installer.json: the
      rendered script passes, and a changed script, another index, another version or package, or an install
      line without --no-build is refused. Fails on dev, where the manifest pins no installer and the check has no
      verify_installer operation.
    source: manual
    binds_ac:
      - AC4
    execution_scope: hosted_and_local
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/nodes/node_release_candidate_verify_effect/test_installer_matches_manifest.py -q --no-cov -k installer_matches_manifest
        cwd: ${OMNI_HOME}/omnimarket
