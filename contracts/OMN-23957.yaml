schema_version: 1.0.0
ticket_id: OMN-23957
title: Host unit install state record on the real bus
summary: A reducer node holds, per host and unit, the state of one install (requested, snapshotted, installing, installed, verified, run_ok, failed, rolled_back) with the render digest, the installed
  file digest, the rollback target digest, the actor and the times. The reducer compares the digests itself, so a verify read of another file than the render never reads verified. This first change adds
  only the reducer, its overlay and its tests; the orchestrator and the command-line path follow as separate changes.
is_seam_ticket: true
interface_change: true
interfaces_touched:
- events
requirements:
- id: req-omn23957-state-record
  statement: Each host unit install has one record whose projection every reader uses.
  acceptance:
  - id: AC1
    statement: 'AC1: a state-holding node folds each install step event into one per-machine, per-unit record with the render digest, installed digest, rollback digest, actor and times -- falsifier:
      pytest tests/nodes/node_host_install_state_reducer/test_reducer.py -q'
  - id: AC2
    statement: 'AC2: a verify step whose installed digest differs from the render digest moves the record to failed and names the rollback target, never to verified -- falsifier: pytest tests/nodes/node_host_install_state_reducer/test_reducer.py
      -k mismatch -q'
  - id: AC3
    statement: 'AC3: the step events and the state record keep one shape on the in-memory bus and on the real broker -- falsifier: pytest tests/nodes/node_host_install_state_reducer/test_seam.py -q'
- id: req-omn23957-integrated
  statement: One real install on a lab host is recorded by the reducer in the running runtime.
  acceptance:
  - id: AC4
    statement: 'AC4: integrated: one real install on h051 over the dev bus shows its states and digests in the reducer projection read in the running runtime -- falsifier: the projection read for that
      unit shows no verified or run_ok state'
evidence_requirements:
- kind: tests
  description: The host install state reducer tests pass at the pushed head.
  command: uv run --frozen pytest tests/nodes/node_host_install_state_reducer -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23957-ac1
  description: The golden chain reads run_ok with digests, actor and times; the error chains and the refusals hold.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_host_install_state_reducer/test_reducer.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn23957-ac2
  description: The mismatch test reads failed with the rollback target recorded; the control (a naive fold that trusts the verify step) reads verified and turns the shared assertion red.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_host_install_state_reducer/test_reducer.py -k "mismatch or control" -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn23957-ac3
  description: The seam tests hold the step event and the record the same in process and on the in-memory bus, and the registry effect's result cells and topics the workflow reads. The Redpanda leg runs when HOST_INSTALL_PARITY_BOOTSTRAP names a lab broker.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_host_install_state_reducer/test_seam.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn23957-ac4
  description: The integrated reading is taken in the running runtime after the orchestrator change; the tests at the head stand behind the reducer half.
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_host_install_state_reducer -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn23957-integration-proof
  description: Run the host install state reducer tests on a lab host at the pushed head. Hosted CI cannot reach the lab hosts, so only the local Done gate runs this unbound check; it binds no criterion for the hosted check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23957 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_host_install_state_reducer -q --no-cov -n 0 -p no:randomly
    cwd: .
