schema_version: 1.0.0
ticket_id: OMN-25853
title: The Claude pool refill probe names why a host's pool resolved no label
summary: 'A host whose pool resolve exits non-zero answered verdict=empty with the excerpt "LABEL=none RESOLVE rc=1", which names no cause, so the refill tick exit code could not be traced to an input from its own output. The probe now appends the resolver''s last stderr line to that excerpt. Clearing the cause on a host (a rollback journal beside the host credential database) is not part of this change.'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn25853-resolve-cause-named
  statement: An empty probe verdict carries the last line of the resolver's own error, so the tick output says which input failed.
  acceptance:
  - id: AC1
    statement: 'AC1: the cause of the exit 1 is read from the unit''s own output on h053 and h051 and recorded in the ticket -- falsifier: the ticket comment quotes the failing line from the tick''s log on each host'
  - id: AC3
    statement: 'AC3: a regression test built from the recorded failing output fails on the unfixed code and passes on the fix -- falsifier: uv run pytest on the new test file in omnimarket'
evidence_requirements:
- kind: tests
  description: The resolve-cause test passes at the pushed head.
  command: uv run pytest tests/nodes/node_claude_pool_refill_effect/test_claude_pool_refill_resolve_cause.py -q -p no:randomly --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn25853-ac1
  description: 'AC1: the probe excerpt for an empty verdict carries the resolver''s last stderr line (the h105 failure recorded on 2026-11-19: sqlite3.OperationalError: attempt to write a readonly database).'
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_claude_pool_refill_effect/test_claude_pool_refill_resolve_cause.py -q -p no:randomly --no-cov
    cwd: .
- id: dod-omn25853-ac3
  description: 'AC3: test_empty_verdict_excerpt_names_the_resolver_failure passes with the change and fails at origin/dev 3c2a974be5, where the excerpt reads only LABEL=none RESOLVE rc=1.'
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_claude_pool_refill_effect/test_claude_pool_refill_resolve_cause.py -q -p no:randomly --no-cov
    cwd: .
- id: dod-omn25853-integration-proof
  description: The pushed head runs the resolve-cause test on a lab host over the bus and exits 0. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-25853 -- uv run pytest tests/nodes/node_claude_pool_refill_effect/test_claude_pool_refill_resolve_cause.py -q --no-cov
    cwd: .
