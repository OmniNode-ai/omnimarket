schema_version: 1.0.0
ticket_id: OMN-22684
title: The ticket-contract-prerequisite tests no longer depend on git version or origin/HEAD
summary: The tests of the ticket contract prerequisite hook read the remote branches of a single-branch clone by full ref name and leave out the origin/HEAD pointer, so they read the same on git 2.43 and 2.56.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn22684-git-version-independent
  statement: The missing-base tests of the ticket contract prerequisite node pass on every git version because they do not read the text of git branch -r.
  acceptance:
  - id: AC1
    statement: "AC1: the node test directory passes on git 2.43.0 and 2.56.0 -- falsifier: uv run --frozen pytest tests/nodes/node_ticket_contract_prerequisite_effect -q --no-cov -n 0 -p no:randomly"
  - id: AC2
    statement: "AC2: a test that sets origin/HEAD explicitly passes with the fix, and the unchanged test body fails with origin/HEAD present -- falsifier: uv run --frozen pytest tests/nodes/node_ticket_contract_prerequisite_effect/test_missing_base.py -q --no-cov -n 0 -p no:randomly -k origin_head"
evidence_requirements:
- kind: tests
  description: The acceptance tests of this ticket at the pushed head.
  command: uv run --frozen pytest tests/nodes/node_ticket_contract_prerequisite_effect -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
- id: dod-omn22684-missing-base-tests
  description: The node test directory runs on h201 (git 2.43.0) and h053 (git 2.56.0) from the branch. The origin/dev test body fails 11 tests on h201 as a failing control.
  source: manual
  binds_ac:
  - AC1
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_ticket_contract_prerequisite_effect -q --no-cov -n 0 -p no:randomly
    cwd: .
