schema_version: 1.0.0
ticket_id: OMN-23734
title: The hourly check's new goal-check compute and its facts and record effects, each with golden and parity tests on recorded ticks
summary: Three new nodes the hourly check needs, each ported from the retired throughput_tick.py with golden, error-chain and parity tests on 20 recorded ticks of the script's own code. node_throughput_goal_check_compute is the goal check (goal_tick_fold), node_throughput_tick_facts_effect is the facts read and node_throughput_tick_record_effect is the heartbeat, open-count, repo-status and goal-record writes.
is_seam_ticket: false
interface_change: false
requirements:
- id: req-omn23734-three-nodes
  statement: The hourly check's goal check, facts read and record step each exist as a node whose output equals the script's on 20 recorded ticks.
  acceptance:
  - id: AC1
    statement: "AC1: node_throughput_goal_check_compute returns the same goal line as the script's goal_tick_fold on 20 recorded ticks -- falsifier: a parity test over the recorded inputs with a planted change to one input turning it red"
  - id: AC2
    statement: "AC2: on the same ticks node_throughput_tick_facts_effect returns the facts the script read and node_throughput_tick_record_effect writes the same heartbeat, open-count and repo-status rows, each with a golden test and an error-chain test -- falsifier: uv run pytest src/omnimarket/nodes/node_throughput_tick_facts_effect src/omnimarket/nodes/node_throughput_tick_record_effect -q -k parity"
  - id: AC3
    statement: "AC3: integrated: done only when running and observed in the runtime: the facts effect run once on the Mac runtime against the live controller, watcher and launchd state returns facts equal to the same minute's script read, the compare output named -- falsifier: one live run of the facts effect compared with the script's tick"
evidence_requirements:
- kind: tests
  description: The focused parity, golden and error-chain tests of the three nodes at the pushed head.
  command: env -u PYTHONPATH uv run --frozen pytest src/omnimarket/nodes/node_throughput_goal_check_compute src/omnimarket/nodes/node_throughput_tick_facts_effect src/omnimarket/nodes/node_throughput_tick_record_effect -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23734-ac1-goal-parity
  description: The goal line, findings and record of node_throughput_goal_check_compute equal the script's on the 20 recorded ticks, and a planted change to one input turns the parity red.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest src/omnimarket/nodes/node_throughput_goal_check_compute -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn23734-ac2-facts-record-parity
  description: The facts read and the record rows equal the script's on the 20 recorded ticks, each node with a golden test and an error-chain test.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest src/omnimarket/nodes/node_throughput_tick_facts_effect src/omnimarket/nodes/node_throughput_tick_record_effect -q --no-cov -n 0 -p no:randomly -k parity
    cwd: .
- id: dod-omn23734-ac3-integration-proof
  description: Not yet observed. The pushed head's focused tests run on a lab host through the lab work runner; the live run of the facts effect on the Mac runtime against the live controller, watcher and launchd state, compared with the same minute's script read, is still to be taken and its compare output named on the ticket.
  source: manual
  binds_ac:
  - AC3
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23734 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest src/omnimarket/nodes/node_throughput_goal_check_compute src/omnimarket/nodes/node_throughput_tick_facts_effect src/omnimarket/nodes/node_throughput_tick_record_effect -q --no-cov -n 0 -p no:randomly
