    description: 'AC2: a fresh subprocess imports ModelNodeEventBusOverlay and none of omnibase_core, omnibase_infra or omnibase_spi is in sys.modules. Fails at the parent of omnimarket#5155, where ModelNodeEventBusOverlay does not exist.'
