schema_version: "1.0.0"
ticket_id: OMN-22577
title: "A pure-import model for node overlays that hold only an event bus"
summary: >-
  Thirty-two node overlays hold only the lane a node is reached on. They load whole through one closed model that
  imports pydantic and pyyaml alone, so the overlay home validates them without omnibase_core. No value lives in
  the repository.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn22577-event-bus-overlay-model
    statement: An overlay holding only a node's event bus loads whole through one typed model, closed to stray keys.
    acceptance:
      - id: AC1
        statement: 'AC1: an event-bus-only overlay validates through ModelNodeEventBusOverlay and a stray key refuses -- falsifier: uv run --frozen pytest tests/unit/bus_binding/test_node_event_bus_overlay_model_omn22478.py -q --no-cov'
      - id: AC2
        statement: 'AC2: the model imports with pydantic and pyyaml alone -- falsifier: uv run --frozen pytest tests/unit/bus_binding/test_node_event_bus_overlay_model_omn22478.py -q --no-cov'
evidence_requirements:
  - kind: tests
    description: An event-bus-only node overlay loads through its model the way the overlay home loads it.
    command: uv run --frozen pytest tests/unit/bus_binding/test_node_event_bus_overlay_model_omn22478.py -q --no-cov
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-omn22577-event-bus-overlay-model
    description: An event-bus-only node overlay loads through its model the way the overlay home loads it, a wrong document refuses, and the model imports with pydantic and pyyaml alone.
    source: manual
    execution_scope: hosted_and_local
    binds_ac: [AC1, AC2]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/bus_binding/test_node_event_bus_overlay_model_omn22478.py -q --no-cov
        cwd: .
  - id: dod-omn22577-event-bus-overlay-integration-proof
    description: The pushed head ran the model's suite on a lab host through the lab work runner and exited 0. Hosted CI cannot reach the lab, so only the local Done gate runs this check.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: 'uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-22577 -- uv run --frozen pytest tests/unit/bus_binding/test_node_event_bus_overlay_model_omn22478.py -q --no-cov'
        cwd: .
