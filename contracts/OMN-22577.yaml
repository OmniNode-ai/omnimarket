        check_value: uv run --frozen pytest tests/unit/bus_binding/test_node_event_bus_overlay_model_omn22478.py::test_loads_the_way_the_overlay_home_loads_it tests/unit/bus_binding/test_node_event_bus_overlay_model_omn22478.py::test_a_wrong_document_refuses -q --no-cov -p no:cacheprovider
        cwd: .
