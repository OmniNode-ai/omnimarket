  acceptance:
  - id: AC3
    statement: 'AC3: the runtime''s health reply carries every field that a listed caller reads, declared in the runtime''s own health contract with no hard-coded value, or the PR states that no caller reads a field the runtime lacks -- falsifier: a pytest over the runtime health contract that fails when a field named in the plan''s caller list is absent from the reply'
