title: 'T18c group 2: serve the API service liveness (GET / and GET /health) by the runtime''s own /health'
summary: AC1 and AC2 (the plan text, namely the decision, the list of callers and probes, the status-only replay rule and its named mask) are proven in a pull request to the repository that owns the plan, merged before this change, and are not bound here because their evidence cannot be re-run from this repository, so this contract binds AC3 only. This change adds the test that pins the plan's statement that no caller reads a body field the runtime's health reply lacks, against the runtime's real /health handler and its declared reply model. No runtime source changes.
