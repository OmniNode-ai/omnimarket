schema_version: 1.0.0
ticket_id: OMN-22780
title: "The floor main page's tab bar is a div, so the page has no nav element and dev's links-area test passes again"
summary: "omnimarket#5224 put the Process and Machines tab bar in simple.html as a nav element, and the floor page links-area test forbids a nav element, so that test failed on dev and in the full-suite split of every pull request that ran the whole tree. The tab bar switches in-page views by hash anchors and is not a links area: the element becomes a div with the same role, class and anchors, and the check is unchanged."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn22780-tabs-not-nav
  statement: "The floor main page script runs under node with its tab bar: it declares no top-level name twice. The tab bar as a div with no nav element (ticket AC1 and AC3) was already on dev when this pull request was merged up, so the links-area test passes at the merge base and is regression evidence here, not a must-fail control."
  acceptance:
  - id: AC2
    statement: 'AC2: the tab tests of the page that run the page script under node still pass, so the tab bar works the same -- falsifier: uv run --frozen pytest src/omnimarket/nodes/node_factory_floor_publish_effect/tests/test_simple_page_machines.py -q --no-cov'
evidence_requirements:
- kind: tests
  description: "The floor main page's tab bar is a div and the links-area test passes"
  command: uv run --frozen pytest tests/test_omnidash_host_effect.py -k omnidash_host_floor -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn22780-tests
  description: "Regression evidence (unbound: dev already draws the tab bar as a div, so the links-area test passes at the merge base too and is not a must-fail control): the floor main page has its Process and Machines tab bar and no nav element, and the links-area test passes on it."
  source: manual
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/test_omnidash_host_effect.py -k omnidash_host_floor -q --no-cov
    cwd: .
- id: dod-omn22780-page-script-no-double-declaration
  description: The floor page script declares no top-level const or let name twice (a second declaration is a SyntaxError that stops the whole page script), and the check runs without node. It fails on the merge base, where the check does not exist, and on a script with one name declared twice.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest src/omnimarket/nodes/node_factory_floor_publish_effect/tests/test_simple_page_machines.py -k declares_no_top_level_name_twice -q --no-cov
    cwd: .
- id: dod-omn22780-integration-proof
  description: Run this pull request's own check on a lab host at the pushed head. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-22780 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/test_omnidash_host_effect.py -q --no-cov
    cwd: .
