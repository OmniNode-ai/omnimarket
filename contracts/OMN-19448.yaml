---
schema_version: "1.0.0"
ticket_id: "OMN-19448"
title: "delegation_events stores terminal columns and classifies canonical outcomes"
summary: "Migrations 0052, 0053 and 0058 already supply the terminal trace, routing, finish reason, truncation, requested model and timing columns. Both writers now also classify canonical terminal_ok, so canonical-only failures participate in the cause readback even when the producer names no cause. Real PostgreSQL checks all eleven terminal fields together. The read-only lab probe refuses empty failure windows and failed rows with NULL causes."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-stop-reason-columns"
    statement: |-
      delegation_events must record the provider finish reason and whether the answer was truncated, written from the terminal.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: migration 0053 adds the nullable finish_reason and truncated columns idempotently and ships a rollback -- falsifier: uv run pytest tests/unit/delegation/test_terminal_stop_reason_columns_omn19448.py -q -k "migration_adds_stop_reason_columns"
      - id: "AC2"
        statement: |-
          AC2: the local dispatch payload and the canonical terminal carry the deciding rung's stop reason, and the projection writes both columns, keeps them across a later sparse terminal, and leaves them NULL for an unknown stop reason -- falsifier: uv run pytest tests/unit/delegation/test_terminal_stop_reason_columns_omn19448.py tests/unit/delegation/test_terminal_columns_omn19448.py -q
      - id: "AC3"
        statement: |-
          AC3: a failed ladder the gate decided, whose terminal declared no cause, derives terminal_failure_cause quality_gate_refused, and a declared cause, an accepted rung and a capacity-only ladder keep their previous result -- falsifier: uv run pytest tests/unit/delegation/test_gate_decided_cause_derived_omn19448.py -q
  - id: "req-requested-model-and-timing-columns"
    statement: |-
      delegation_events must record the model the ladder first requested and the terminal's measured queue wait and execution time, written from the terminal, with NULL meaning not measured.
    acceptance:
      - id: "AC4"
        statement: |-
          AC4: migration 0058 adds the nullable requested_model, queue_wait_ms and execution_ms columns idempotently, ships a rollback, and no other migration adds them -- falsifier: uv run pytest tests/unit/delegation/test_terminal_columns_omn19448.py -q -k "only_migration_0058"
      - id: "AC5"
        statement: |-
          AC5: the delegate-skill terminal and the canonical terminal write the three columns, a measured zero is stored as zero, an unmeasured value stays NULL, and a later sparse terminal does not erase them -- falsifier: uv run pytest tests/unit/delegation/test_terminal_timing_and_requested_model_omn19448.py -q
evidence_requirements:
  - kind: "tests"
    description: "The stop reason column tests."
    command: "uv run pytest tests/unit/delegation/test_terminal_stop_reason_columns_omn19448.py tests/unit/delegation/test_terminal_columns_omn19448.py -q"
  - kind: "tests"
    description: "The gate-decided cause tests."
    command: "uv run pytest tests/unit/delegation/test_gate_decided_cause_derived_omn19448.py -q"
  - kind: "tests"
    description: "The requested model and timing column tests."
    command: "uv run pytest tests/unit/delegation/test_terminal_timing_and_requested_model_omn19448.py tests/unit/delegation/test_terminal_columns_omn19448.py -q"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-stop-reason-columns-ac1"
    description: "Migration 0053 adds the nullable finish_reason and truncated columns idempotently and ships a rollback."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/delegation/test_terminal_stop_reason_columns_omn19448.py -q -k \"migration_adds_stop_reason_columns\""
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC1"]
  - id: "dod-omn19448-terminal-fields-container-smoke"
    description: "Hosted deploy probe for the projection writers: a disposable container mounts the checked-out source read-only and checks that both delegate-skill row builders copy the terminal's declared operational_outcome and content_verdict. The probe is absent at the merge base and present at the head. A full in-container pytest run exceeded the verifier's 30 second per-check budget on a hosted runner, so the behavioural proof stays in the test_passes checks of dod-omn19448-ticket-ac1-terminal-fields-copied and the lab readback."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: |-
          sh -c 'docker run --rm -v "${PWD}:/workspace:ro" -w /workspace postgres:16-alpine sh -c "set -eu; for f in src/omnimarket/nodes/node_projection_delegation/handlers/handler_projection_delegation.py src/omnimarket/nodes/node_projection_delegation/handlers/handler_delegation.py; do grep -Fq \"event.operational_outcome)\" \"\$f\"; grep -Fq \"event.content_verdict)\" \"\$f\"; done"'
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-stop-reason-columns-ac2"
    description: "The local dispatch payload and the canonical terminal carry the deciding rung's stop reason, and the projection writes both columns, keeps them across a sparse terminal, and leaves them NULL for an unknown stop reason."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/delegation/test_terminal_stop_reason_columns_omn19448.py tests/unit/delegation/test_terminal_columns_omn19448.py -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC2"]
  - id: "dod-gate-decided-cause-ac3"
    description: "A failed ladder the gate decided derives quality_gate_refused when the terminal declared no cause; a declared cause, an accepted rung and a capacity-only ladder keep their previous result."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/delegation/test_gate_decided_cause_derived_omn19448.py -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC3"]
  - id: "dod-requested-model-and-timing-ac4"
    description: "Migration 0058 adds the nullable requested_model, queue_wait_ms and execution_ms columns idempotently, ships a rollback, and is the only migration that adds them."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/delegation/test_terminal_columns_omn19448.py -q -k \"only_migration_0058\""
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC4"]
  - id: "dod-requested-model-and-timing-ac5"
    description: "Both terminal paths write requested_model, queue_wait_ms and execution_ms; a measured zero stays zero, an unmeasured value stays NULL, and a sparse later terminal keeps them."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/delegation/test_terminal_timing_and_requested_model_omn19448.py -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC5"]
  - id: "dod-omn19448-lab-readback"
    description: "Lab readback, 2026-10-15T01:15:44Z, on the lab dev lane database omnidash_analytics (delegation_events), over the 208 rows written since the runtime-effects image built from omnibase_infra revision f32d46c8965d57f23d12127e41c86bddf8a1d9c7 at 2026-10-15T00:02:27Z. Columns written from the terminal: requested_model, queue_wait_ms and execution_ms 99 rows, finish_reason and truncated 203, routed_model 205, answering_backend 205, trace_id 0. All 109 rows with a NULL requested_model are failed rows; no row with terminal_ok true lacks it. Row for correlation f58ffb0f-452a-4b1f-ab77-cd91838fb108: requested_model Qwen3.8-27B, queue_wait_ms 4013, execution_ms 9512, finish_reason absent, truncated false, routed_model Qwen3.8-27B, answering_backend local-heavy-reasoning, operational_outcome completed, content_verdict usable. Failed rows since the build by terminal_failure_cause/operational_outcome: quality_gate_refused/quality_rejected 126, timeout/timeout 3, quality_gate_refused/schema_rejected 1, runtime_shutdown/empty 1, empty/empty 1. The AC3 falsifier (a failed row with a null cause after the deploy) returns one row: correlation 252a8269-bcbc-44f1-a47e-c1fbfa036649, written 2026-10-15T00:48:35Z, a request refused before dispatch by the task-class timeout ceiling (requested 300 seconds, ceiling 240), with attempt_history empty and the cause, outcome and verdict all empty. Earlier pre-dispatch refusals show the same shape: 2026-10-14T02:25:49Z (credential_absent) and 2026-10-14T08:01:16Z (timeout_exceeds_task_class_ceiling). Every other failed row since the build carries a terminal_failure_cause. The check re-runs the column tests."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/delegation/test_terminal_timing_and_requested_model_omn19448.py tests/unit/delegation/test_terminal_columns_omn19448.py -q"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn19448-pr3924-merged-cause-control"
    description: "AC3 evidence for the lab readback: the gate-decided cause tests pass with merged fix 3bbef4dee3f15cef026c6e89292403685009f8da and fail when its product change is reverted at the merge base. The original lab readback and the pre-dispatch refusal it records remain unchanged."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/delegation/test_gate_decided_cause_derived_omn19448.py -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC3"]
  - id: "dod-omn19448-ticket-ac1-terminal-fields-copied"
    description: "Ticket AC1: the sync and async projection writers copy the terminal's terminal_failure_cause, operational_outcome and content_verdict into in-memory, SQLite and real PostgreSQL rows. The regressions exercise both terminal families with and without a declared quality_gate_refused cause: refusal text alone must not invent a cause. They fail at the merge base because the delegate-skill row builders drop the declared outcome and verdict."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/delegation/test_terminal_cause_copied_omn19448.py tests/unit/delegation/test_terminal_columns_omn19448.py tests/unit/delegation/test_terminal_fields_copied_binding_omn19448.py -k \"quality_gate_refused or inmemory_row_carries or sqlite_local_store\" -q -p no:cacheprovider"
        cwd: "${OMNI_HOME}/omnimarket"
      - check_type: "test_passes"
        check_value: "uv run pytest tests/test_omn19448_terminal_fields_projection_real_postgres.py -q -p no:cacheprovider"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC1"]
  - id: "dod-omn19448-refused-before-dispatch-cause"
    description: "Ticket AC3: a request refused before dispatch (a requested timeout above the task-class ceiling) leaves no ladder to derive a cause from, and the lab readback found one such failed row with a NULL terminal_failure_cause. The refusal terminal now names refused_before_dispatch, and the projection keeps it on an empty ladder. The handler test fails at the merge base, where the refusal declares no cause; the negative control shows a request inside the ceiling carries none."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/delegation/test_pre_dispatch_refusal_cause_omn19448.py -q -p no:cacheprovider"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC3"]
  - id: "dod-omn19448-credential-refusal-cause"
    description: "Ticket AC3: the lab readback of 2026-10-19T04:19Z found 7 failed rows written after the refused-before-dispatch fix with a NULL terminal_failure_cause, each a one-rung ladder refused for a missing provider credential (failure_class provider_credential_missing, acceptance_reason provider_call_failed). The projection now falls back to the delegate-skill producer's own cause reading when the terminal declared none and neither the gate nor a capacity refusal decided the ladder, so such a row names provider_error. The tests fail at the merge base for the credential-missing and the auth-failed ladders; the controls show a declared cause still wins, a ladder that records nothing stays unclassified and a capacity refusal keeps the quota cause."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/delegation/test_credential_refusal_cause_derived_omn19448.py -q -p no:cacheprovider"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC3"]
  - id: "dod-omn19448-pre-dispatch-container-smoke"
    description: "Hosted deploy probe for the delegate-skill handler: a disposable container mounts the checked-out source read-only and checks that the pre-dispatch refusal names the refused_before_dispatch cause. The probe is absent at the merge base and present at the head; the behavioural proof stays in the test_passes check of dod-omn19448-refused-before-dispatch-cause."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: |-
          sh -c 'docker run --rm -v "${PWD}:/workspace:ro" -w /workspace postgres:16-alpine sh -c "set -eu; grep -Fq EnumDelegationTerminalFailureCause.REFUSED_BEFORE_DISPATCH src/omnimarket/nodes/node_delegate_skill_orchestrator/handlers/handler_delegate_skill.py"'
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn19448-trace-id-lab-readback"
    description: "Lab readback, 2026-10-20T03:03Z, on the lab dev lane database omnidash_analytics (delegation_events) on the lab dev lane host, after the delegate-skill trace_id writer fix merged as omnimarket efba3ec67 (2026-10-19T11:32:06Z). The first row storing a trace_id was written at 2026-10-19T12:31:43Z; before it no row in the readback window from 2026-10-19T06:00Z carried one. Window 2026-10-19T12:31:43Z to 2026-10-20T03:00Z: 3556 rows, 499 with trace_id, 498 with queue_wait_ms and every one of those 498 with trace_id, 437 with operational_outcome (400 of them with trace_id). The 3057 rows without trace_id also carry no queue_wait_ms: they are terminals that measured no timing, among them 1971 GLM rows (glm-5.3 843, glm-5.3-flash 1128), none with an operational_outcome, and 1038 Qwen3.8-27B rows, 1023 of them with no operational_outcome. The bus was not read (the dev broker requires SASL), so whether those terminals carried a trace on the wire is unverified. Failed rows in the window: 348, each with a terminal_failure_cause; the last failed row with a NULL cause was written at 2026-10-19T07:59:47Z, before the credential-refusal cause fix merged as b483d4369 (2026-10-19T08:25:32Z). The deployed delegation projection writer image was built from omnimarket a453656d0 at 2026-10-20T02:29:17Z. The check re-runs the trace_id and column tests."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/delegation/test_delegate_skill_trace_id_omn19448.py tests/unit/delegation/test_terminal_columns_omn19448.py tests/unit/delegation/test_credential_refusal_cause_derived_omn19448.py -q -p no:cacheprovider"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: dod-omn19448-complete-terminal-postgres-acceptance
    description: 'Ticket AC1 and AC2: apply the full migration chain and reapply 0052, 0053 and 0058; read all eight added columns plus declared cause, operational outcome and content verdict through both real PostgreSQL writers and both terminal families. The fix additionally stamps terminal_ok for canonical terminals, which previously left it NULL even on a declared failure. No cause is invented for an unnamed failure. The locked infra checkout at 49d28fc6208afd2625aee305069eca8ae992e59e vendors byte-identical copies of all three migrations (read 2026-10-21). No duplicate migration is added.'
    source: manual
    binds_ac: [AC1, AC2]
    checks:
    - check_type: test_passes
      check_value: uv run pytest tests/test_omn19448_terminal_acceptance_real_postgres.py -q -n 0 --no-cov -p no:cacheprovider --refuse-skips
      cwd: ${OMNI_HOME}/omnimarket
  - id: dod-omn19448-current-deploy-cause-readback
    description: 'Ticket AC3: read on dev at 2026-10-21T15:18Z after the current writers started at 13:38:45Z: 84 rows, 5 failed, 0 failed with NULL cause. The query requires a nonzero failed-row count and a zero NULL-cause count, and PostgreSQL rejects a false result. The credential-refusal fix window from 2026-10-19T08:25:32Z separately had 8531 rows, 968 failed and 0 failed with NULL cause. The lab read is local-gate-only; hosted proof tests the same SQL against disposable rows.'
    source: manual
    execution_scope: local_done_gate
    checks:
    - check_type: command
      check_value: >-
        ssh -o BatchMode=yes -o ConnectTimeout=10 "${DELEGATION_DEV_SSH_TARGET:?set the dev-lane SSH target}"
        'docker exec -e PGOPTIONS="-c default_transaction_read_only=on" -i omnibase-infra-postgres psql -X -v ON_ERROR_STOP=1 -v deploy_boundary=2026-10-21T13:38:45.647091938Z -U postgres -d omnidash_analytics'
        < scripts/ci/delegation_terminal_cause_readback.sql
      cwd: ${OMNI_HOME}/omnimarket
  - id: dod-omn19448-cause-readback-negative-controls
    description: 'AC3 query controls: the same SQL passes a typed failure and raises for a failed row with NULL cause or an empty failure window. All controls execute on real PostgreSQL with skips refused.'
    source: manual
    binds_ac: [AC3]
    checks:
    - check_type: test_passes
      check_value: uv run pytest tests/test_omn19448_terminal_acceptance_real_postgres.py -q -n 0 --no-cov -p no:cacheprovider --refuse-skips
      cwd: ${OMNI_HOME}/omnimarket
  - id: dod-omn19448-canonical-outcome-hosted-probe
    description: 'Hosted package probe for the canonical outcome fix: real disposable PostgreSQL must store terminal_ok=false with the declared cause, and the readback must fail when that cause is removed. Docker and locked dependencies suffice. These canonical cases fail before the fix; this does not attest deployment to the lab.'
    source: manual
    checks:
    - check_type: command
      check_value: uv run pytest tests/test_omn19448_terminal_acceptance_real_postgres.py -q -n 0 --no-cov -p no:cacheprovider --refuse-skips -k 'async and canonical and quality_gate_refused'
      cwd: ${OMNI_HOME}/omnimarket
