schema_version: 1.0.0
ticket_id: OMN-24106
title: Runtime login roles resolve contract grant placeholders
summary: A role in the principals overlay may name the placeholders its single login fills, and the reconcile effect fills a contract's broker grant placeholders from those roles before the environment, so a runtime login needs no environment variable.
is_seam_ticket: true
interface_change: true
interfaces_touched:
- topics
requirements:
- id: req-omn24106-role-placeholders
  statement: A contract grant whose login is a placeholder a declared role names renders concrete rows from that role's login; a placeholder no role and no environment variable fills is refused by name.
  acceptance:
  - id: AC1
    statement: "AC1: a contract grant whose login is a placeholder that a declared role names renders concrete rows from that role's login with no environment variable set -- falsifier: uv run pytest tests/nodes/node_broker_acl_reconcile_effect/test_role_placeholders.py -q fails at the merge base"
  - id: AC2
    statement: "AC2: a placeholder that no role names and the environment does not set is refused by name, and a role naming one placeholder twice or holding more than one login is refused when it loads -- falsifier: uv run pytest tests/nodes/node_broker_acl_reconcile_effect/test_role_placeholders.py -q -k refused fails at the merge base"
  - id: AC3
    statement: "AC3: the real principals overlay declares one role per runtime profile with the login read from the development compose environment, and it loads through the node's own model -- falsifier: the overlays repository check that loads overlays/broker_acl_principals/overlay.yaml fails when a role names a placeholder twice or an unknown node"
  - id: AC4
    statement: "AC4: integrated: a dry-run reconcile against the development broker, read-only, from the running runtime reports declared, live, missing and extra row counts with the runtime login resolved from the roles -- falsifier: the dry-run result has no derived count or names an unset placeholder"
evidence_requirements:
- kind: tests
  description: The role placeholder tests and the existing reconcile and render tests pass at the pushed head.
  command: uv run pytest tests/nodes/node_broker_acl_reconcile_effect tests/nodes/node_broker_acl_overlay_render_compute -q -p no:randomly --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24106-ac1
  description: 'AC1: the role placeholder tests pass at the head; the handler fills placeholders from the environment only at the merge base, so the apply tests fail there.'
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_broker_acl_reconcile_effect/test_role_placeholders.py -q -p no:randomly --no-cov
    cwd: .
- id: dod-omn24106-ac2
  description: 'AC2: the refusal tests pass at the head; the role model has no placeholders field at the merge base.'
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_broker_acl_reconcile_effect/test_role_placeholders.py -q -p no:randomly --no-cov -k refused
    cwd: .
- id: dod-omn24106-ac3
  description: 'hosted proxy for AC3: this repository holds the model the real overlay is loaded through and the shipped example that shows the placeholders key; the overlays repository check loads the real overlay at the pinned revision of this change.'
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_broker_acl_reconcile_effect/test_role_placeholders.py -q -p no:randomly --no-cov -k example
    cwd: .
- id: dod-omn24106-ac4
  description: 'hosted proxy for AC4: the reconcile tests that stand in for the dev broker pass here; the dry-run reading against the development broker is posted as a pull request comment naming the head.'
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_broker_acl_reconcile_effect -q -p no:randomly --no-cov
    cwd: .
- id: dod-omn24106-integration-proof
  description: the role placeholder tests run on a lab host at the pushed head, including the tests that fail at the merge base; hosted CI cannot reach the lab, so only the local Done gate runs this unbound check
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24106 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_broker_acl_reconcile_effect/test_role_placeholders.py -q --no-cov -p no:randomly
