---
schema_version: "1.0.0"
ticket_id: "OMN-21599"
title: "A collaborator's prompt hook checks the lane they are bound to"
summary: "The prompt hook selected the hook-edge contract's declared lane for every developer, so a collaborator bound to another lane passed unchecked or was blocked for lacking a login on the declared lane. node_developer_lane_admission_compute selects the lane from the developer's lane binding and checks the principal against that lane's own declared list of people. It names no lane: the lanes, the lane a collaborator never uses and every list arrive in the request, from the hook-edge contract and the private overlay declarations. The omniclaude hook loads the handler by path and calls it in place of its inline check."
is_seam_ticket: false
interface_change: true
interfaces_touched:
  - "public_api"
requirements:
  - id: "req-omn21599-lane-admission"
    statement: |-
      A developer bound to a collaborator lane is admitted on that lane's own declared list and nowhere else; a collaborator selecting the barred lane, a bound lane with no declared principal or no installed list, and a principal declared on another lane are refused; the operator's own flow is unchanged.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: the node admits a bound collaborator with a declared principal, refuses the same developer with the binding removed, with the principal removed, and when selecting the barred lane, and leaves the operator's principal unchanged -- falsifier: uv run pytest tests/nodes/node_developer_lane_admission_compute fails one of those cases, or the node is absent at the merge base
evidence_requirements:
  - kind: "tests"
    description: "The planted cases: bound with a declared principal passes, binding removed refuses, principal removed refuses, a collaborator selecting the barred lane refuses, the operator's own flow is unchanged; plus the by-path load and the standard-library-only module level."
    command: "uv run pytest tests/nodes/node_developer_lane_admission_compute/test_developer_lane_admission.py -q --no-cov"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn21599-ac1-lane-admission"
    description: "The node's tests pass; at the merge base the node directory does not exist, so the same command fails."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_developer_lane_admission_compute/test_developer_lane_admission.py -q -n 0 --no-cov"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC1"]
