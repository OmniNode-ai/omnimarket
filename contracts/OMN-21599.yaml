---
schema_version: "1.0.0"
ticket_id: "OMN-21599"
title: "A collaborator's prompt hook checks the lane they are bound to, and the placement node refuses a house-lane lane on a collaborator machine"
summary: "The prompt hook selected the hook-edge contract's declared lane for every developer, so a collaborator bound to another lane passed unchecked or was blocked for lacking a login on the declared lane. node_developer_lane_admission_compute selects the lane from the developer's lane binding and checks the principal against that lane's own declared list of people. It names no lane: the lanes, the lane a collaborator never uses and every list arrive in the request, from the hook-edge contract and the private overlay declarations. The omniclaude hook loads the handler by path and calls it in place of its inline check."
is_seam_ticket: false
interface_change: true
interfaces_touched:
  - "public_api"
requirements:
  - id: "req-omn21599-lane-admission"
    statement: |-
      A developer bound to a collaborator lane is admitted on that lane's own declared list and nowhere else; a collaborator selecting the barred lane, a bound lane with no declared principal or no installed list, and a principal declared on another lane are refused; the operator's own flow is unchanged.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: the node admits a bound collaborator with a declared principal, refuses the same developer with the binding removed, with the principal removed, and when selecting the barred lane, and leaves the operator's principal unchanged -- falsifier: uv run pytest tests/nodes/node_developer_lane_admission_compute fails one of those cases, or the node is absent at the merge base
  - id: "req-omn21599-contributor-lane-placement"
    statement: "Work may run on a collaborator machine but never bound to the lane the house works in: the placement node refuses a house-lane lane there and admits one bound to the collaborator lane once that lane is ready."
    acceptance:
      - id: "AC2159901"
        statement: "AC2159901: a lane bound to the house lane is refused on a contributor host (the verdict names the lane it binds), and a lane bound to the collaborator lane is admitted when the row says the lane is ready -- falsifier: uv run pytest tests/nodes/node_remote_lane_compute/test_contributor_lane_placement.py -q passes with the refusal assertion removed from the node"
      - id: "AC2159902"
        statement: "AC2159902: while the row says the lane is not ready the host takes no lane and the verdict prints the row's reason, and the lab_hosts overlay model refuses a contributor row that binds a lane a non-contributor row binds -- falsifier: the same file passes with lane_ready defaulted to true or the validator removed"
evidence_requirements:
  - kind: "tests"
    description: "The planted cases: bound with a declared principal passes, binding removed refuses, principal removed refuses, a collaborator selecting the barred lane refuses, the operator's own flow is unchanged; plus the by-path load and the standard-library-only module level."
    command: "uv run pytest tests/nodes/node_developer_lane_admission_compute/test_developer_lane_admission.py -q --no-cov"
  - kind: tests
    description: "AC2159901 and AC2159902: the planted refusal, the planted admission, the fail-closed readiness and the overlay model validator"
    command: "env PYTHONDONTWRITEBYTECODE=1 uv run pytest tests/nodes/node_remote_lane_compute/test_contributor_lane_placement.py -q --no-cov -p no:randomly --refuse-skips"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn21599-ac1-lane-admission"
    description: "The node's tests pass; at the merge base the node directory does not exist, so the same command fails."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_developer_lane_admission_compute/test_developer_lane_admission.py -q -n 0 --no-cov"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC1"]
  - id: "dod-omn21599-deploy-source-admission-readback"
    description: |-
      Hosted-runner source-artifact deploy check for this pure compute handler: fetch the
      handler at the checkout's exact published commit and load it as the prompt hook does,
      without importing the package. Admit the bound collaborator, refuse removal of the
      binding or principal and selection of the barred lane, and retain the operator verdict.
      Missing source, a missing entry point or a wrong decision fails the command. This is
      published source readback, not an assertion that a live runtime has been deployed.
    source: "manual"
    checks:
      - check_type: "command"
        check_value: |-
          curl --fail --silent --show-error --location --max-time 15 "https://raw.githubusercontent.com/OmniNode-ai/omnimarket/$(git rev-parse HEAD)/src/omnimarket/nodes/node_developer_lane_admission_compute/handlers/handler_developer_lane_admission.py" | python3 -c '
          import copy, sys
          namespace = {"__name__": "admission_deploy_readback"}
          exec(compile(sys.stdin.read(), "published_handler", "exec"), namespace)
          admit = namespace["admit"]
          request = {
              "declared_lane": "lane-home",
              "barred_lanes": ["lane-home"],
              "lane_store": {
                  "developer": {"lane_binding": "lane-collab"},
                  "lanes": {"lane-collab": {"sasl_username": "collab-principal"}},
              },
              "lanes": {
                  "lane-home": {
                      "credential_source": "onex_lane_store",
                      "declaration": {"schema_version": "developer_principal.v1", "principals": [{"principal": "home-collaborator"}]},
                  },
                  "lane-collab": {
                      "credential_source": None,
                      "declaration": {"schema_version": "developer_principal.v1", "principals": [{"principal": "collab-principal"}]},
                  },
              },
          }
          decision = admit(copy.deepcopy(request))
          assert (decision["selected_lane"], decision["verdict"], decision["refusal"]) == ("lane-collab", "collaborator", None), decision
          unbound = copy.deepcopy(request)
          del unbound["lane_store"]["developer"]
          decision = admit(unbound)
          assert (decision["verdict"], decision["refusal"]) == ("refused", "no-declared-principal"), decision
          missing_principal = copy.deepcopy(request)
          missing_principal["lane_store"]["lanes"] = {}
          decision = admit(missing_principal)
          assert (decision["verdict"], decision["refusal"]) == ("refused", "no-declared-principal"), decision
          barred = copy.deepcopy(request)
          barred["lane_store"]["developer"]["lane_binding"] = "lane-home"
          barred["lane_store"]["lanes"]["lane-home"] = {"sasl_username": "home-collaborator"}
          decision = admit(barred)
          assert (decision["verdict"], decision["refusal"]) == ("refused", "collaborator-on-barred-lane"), decision
          operator = copy.deepcopy(barred)
          operator["lane_store"]["lanes"]["lane-home"]["sasl_username"] = "operator-principal"
          decision = admit(operator)
          assert (decision["selected_lane"], decision["verdict"], decision["refusal"]) == ("lane-home", "operator", None), decision
          print("OMN-21599 published-source deploy readback: 5 admission decisions PASS")
          '
  - id: "dod-omn21599-contributor-lane-placement"
    description: "The contributor lane rule of the remote-lane placement node and the overlay model validator"
    source: "manual"
    binds_ac: ["AC2159901", "AC2159902"]
    checks:
      - check_type: "test_passes"
        check_value: "env PYTHONDONTWRITEBYTECODE=1 uv run pytest tests/nodes/node_remote_lane_compute/test_contributor_lane_placement.py -q --no-cov -p no:randomly --refuse-skips"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn21599-deploy-placement-check"
    description: "Hosted package deploy smoke: the placement node source at the evaluated revision carries the contributor lane refusal, and the overlay model carries the lane_binding and lane_ready columns, read from the repository at that revision. No credentials, broker or lab service is required. This checks the evaluated revision, not a production rollout."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: "gh api \"repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_remote_lane_compute/handlers/handler_remote_lane_placement.py?ref=$(git rev-parse HEAD)\" --jq '.content | gsub(\"\\n\";\"\") | @base64d | contains(\"def contributor_lane_refusal(\")' | grep -qx true"
        cwd: "."
      - check_type: "command"
        check_value: "gh api \"repos/OmniNode-ai/omnimarket/contents/src/omnimarket/models/overlay_keys/model_overlay_documents.py?ref=$(git rev-parse HEAD)\" --jq '.content | gsub(\"\\n\";\"\") | @base64d | contains(\"lane_ready: bool = False\")' | grep -qx true"
        cwd: "."
