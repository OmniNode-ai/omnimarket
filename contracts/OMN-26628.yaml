schema_version: 1.0.0
ticket_id: OMN-26628
title: The ten delegation probes read the responder's context window, pricing and capabilities from the chain's live catalog at check time, so swapping the model behind a local endpoint never turns a probe red
summary: The delegation check probe node (C13, C14, C17) takes the responder's window, capabilities and price from the responder chain's live catalog on every run and records them on the run, with every probe running through the chain; a swap test over every local endpoint of a fixture catalog and a source scan keep any probe from holding a model name, window or price. The seven checks with no probe in this repository are listed as open on the PR.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn26628-probes-read-live-catalog
  statement: A delegation probe reads the responder's window, capabilities and price from the chain's live catalog when it runs.
  acceptance:
  - id: AC1
    statement: 'AC1: each probe of this repository reads the responder''s context window, pricing and capabilities from the chain''s live catalog at check time, with no fixture value and no pinned model name -- falsifier: uv run pytest -k delegation_probe_model_swap with a source scan that fails when a probe module names a model or holds a window or price constant'
  - id: AC2
    statement: 'AC2: every probe runs through the responder chain and not around it -- falsifier: uv run pytest -k delegation_probe_model_swap fails when a probe grades without a chain call recorded'
  - id: AC3
    statement: 'AC3: swapping the model behind each local endpoint in the fixture catalog leaves every probe grading correctly -- falsifier: uv run pytest -k delegation_probe_model_swap parametrized over every local endpoint, failing when any probe grades red or wrongly green after the swap'
  - id: AC4
    statement: 'AC4: integrated: running the ten probes through the running responder chain on dev or a lab host, after the local model changes, reads every probe green from the live catalog -- falsifier: the probe run command on the dev lane, with the ten results read back, lists any probe red with a model-specific cause'
  - id: AC5
    statement: 'AC5: a regression test built from the incident''s recorded data (fixture path) fails on the broken code and passes on the fix -- falsifier: uv run pytest -k delegation_probe_model_swap with the recorded 2026-11-23 catalog before and after the Qwen to Inkling swap'
evidence_requirements:
- kind: tests
  description: The swap tests, failing on the code before the change and passing on it.
  command: uv run pytest -k delegation_probe_model_swap -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn26628-swap
  description: Each of C13, C14 and C17 grades PASS after the model behind either local endpoint is swapped, carrying the swapped model's own window, capabilities and price; a windowless swap reads NOT_MEASURED; no probe source names a model or holds a window or price constant. The tests fail on the code before the change.
  source: manual
  binds_ac:
  - AC1
  - AC2
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest -k delegation_probe_model_swap -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn26628-recorded-listing
  description: The listing the second lab GPU host answered on 2026-11-24 (tests/handlers/routing/fixtures/llamacpp_models_listing_pc2.json) carries each of C13, C14 and C17 to PASS with that listing's own window and capabilities on the record; the test fails on the code before the change, whose record holds neither. The 2026-11-23 catalog before the Qwen to Inkling swap is not held in this repository.
  source: manual
  binds_ac:
  - AC5
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/handlers/routing/test_delegation_probe_model_swap.py -q --no-cov -n 0 -p no:randomly -k recorded_listing
    cwd: .
- id: dod-omn26628-chain-recorded-without-collector
  description: A probe tick of C13, C14 and C17 on a machine whose collector is absent still resolves the responder chain and records the served model, window, capabilities and both prices on every run; the test fails on the code before the change, whose record holds none of them. The reading against a running lab responder is in the PR's Lab line, not in this hosted check, which holds no lab responder.
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/handlers/routing/test_delegation_probe_model_swap.py -q --no-cov -n 0 -p no:randomly -k a_machine_without_a_collector_still_records_the_chain
    cwd: .
- id: dod-omn26628-integration-proof-lab-run
  description: On a lab host, with the branch installed, the probe tick runs C13, C14 and C17 against the live catalog and the run records name the served model, window, capabilities and price read at that time. Hosted CI holds no lab responder, so only the local Done gate runs this check, and it binds no criterion (the lab reading is in the PR's Lab line).
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-26628 --kind test -- uv run --frozen pytest tests/handlers/routing/test_delegation_probe_model_swap.py -q --no-cov -n 0 -p no:randomly
    cwd: .
