schema_version: 1.0.0
ticket_id: OMN-24216
title: The branch deploy command node puts an optional overlays revision into the signed rebuild command it publishes
summary: The branch deploy command effect and the branch deploy orchestrator carry an optional overlay_ref (the 40-hex head of an overlays repository revision) from the deploy request into the signed rebuild command the deploy agent reads (omnibase_infra pull request 5946 adds the field to the agent's command model). A deploy request without it publishes a command with no overlay_ref key, as before; a rollback command carries none, which clears the revision on the agent.
is_seam_ticket: true
interface_change: true
interfaces_touched:
- public_api
requirements:
- id: req-omn24216-command-carries-overlay-ref
  statement: The signed rebuild command carries the deploy request's overlays revision, and only when one is declared.
  acceptance:
  - id: AC4
    statement: 'AC4: the branch deploy command node puts the revision into the signed command it publishes, and the agent''s command model accepts that envelope -- falsifier: uv run pytest tests/nodes/node_branch_deploy_command_effect/test_overlay_ref_seam_omn24216.py -q fails when the overlay_ref field is renamed on either side (this repository''s wire fixture, or the handler)'
evidence_requirements:
- kind: tests
  description: The command effect and orchestrator tests pass at the pushed head.
  command: uv run --frozen pytest tests/nodes/node_branch_deploy_command_effect tests/nodes/node_branch_deploy_orchestrator -q -n 0 --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24216-ac4-command-carries-overlay-ref
  description: 'AC4: a deploy request with an overlays revision publishes a signed command carrying it, within the agent wire contract, and a request without one publishes no overlay_ref key; the orchestrator chain threads the revision into the deploy command and sends none on the rollback command; fails when the handler stops emitting the field.'
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_branch_deploy_command_effect/test_overlay_ref_seam_omn24216.py -q -n 0 --no-cov
    cwd: .
- id: dod-omn24216-integration-proof
  description: "Run the command effect seam test on a lab host at the pushed head. Hosted CI cannot reach the lab hosts, so only the local Done gate runs this unbound check; it binds no criterion for the hosted check. The live reading (the signed command with overlay_ref reaching the deploy agent on the development runtime) is recorded in the pull request's Lab line."
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24216 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_branch_deploy_command_effect/test_overlay_ref_seam_omn24216.py -q --no-cov -n 0 -p no:randomly
    cwd: .
