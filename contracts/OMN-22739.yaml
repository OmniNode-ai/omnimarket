schema_version: 1.0.0
ticket_id: OMN-22739
title: "The floor overlay names the golden and error rows of rebuild pieces 2 to 6 so they draw their events"
summary: "The floor overlay listed piece_events for piece 1 only, so pieces 2 to 6 drew no events although each wrote ledger rows. The overlay now has one rule per piece (the private overlay carries the same rules): a WORKING row that is not a drill is a golden event and any NOT_WORKING row is a typed failure, drill or real. This pull request carries the mirror of those rules in the test overlay and the test over the rows each piece wrote."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn22739-piece-events
  statement: "Each of pieces 2 to 6 draws golden and error events from the rows it wrote on the ledger, a real NOT_WORKING row counts as a typed failure and a drill stays marked as one."
  acceptance:
  - id: AC1
    statement: 'AC1: each of pieces 2 to 6 has a piece_events rule whose golden and error rows match the rows the piece wrote on the ledger, shown on the recorded rows of each lane -- falsifier: uv run --frozen pytest tests/nodes/node_floor_simple_effect/test_piece_events_overlay_floor_simple.py -q --no-cov'
  - id: AC2
    statement: 'AC2: a WORKING row that is not a drill is a golden event, a NOT_WORKING row is a typed failure whether or not it is a drill, and a row of another probe of the same lane is neither -- falsifier: uv run --frozen pytest tests/nodes/node_floor_simple_effect/test_piece_events_overlay_floor_simple.py -q --no-cov'
  - id: AC3
    statement: 'AC3: with the rules removed the same ledger rows leave pieces 2 to 6 with no events, so the test fails without the overlay -- falsifier: uv run --frozen pytest tests/nodes/node_floor_simple_effect/test_piece_events_overlay_floor_simple.py -q --no-cov'
evidence_requirements:
- kind: tests
  description: "The floor overlay names the golden and error rows of rebuild pieces 2 to 6 so they draw their events"
  command: uv run --frozen pytest tests/nodes/node_floor_simple_effect/test_piece_events_overlay_floor_simple.py -q --no-cov
