    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_delegation_ground_truth_label_compute/test_golden_hidden_test_tasks.py -q -k eight_tasks_for_each_class"
        cwd: "${OMNI_HOME}/omnimarket"
