schema_version: "1.0.0"
ticket_id: "OMN-19787"
title: "Delegation evals: measure the acceptance gate's false-pass rate per task class, standing, as nodes and a projection"
summary: "The ticket now carries AC1 to AC4. The requirements declare them with the ticket's text, one appended item retires every merged claim on the deleted AC5 to AC7 and supersedes the earlier AC1 to AC4 claims, which proved other changes under the same labels, and four new items bind the ticket's own criteria: the eval run's recorded arm per class, the check register, the acceptance-eval exposure the dashboard panel reads, and the rollup's eval-line gate."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-omn19787-eval-run"
    statement: |-
      An eval run over a labelled manifest on the dev lane writes per-class results whose recorded-verdict arm reproduces the committed recorded-arm counts per class.
    acceptance:
      - id: "AC1"
        statement: |-
          AC-1: an eval run over a labelled manifest on the dev lane writes per-class results, and its recorded-verdict arm reproduces the slice-40 task 40.5 counts per class -- falsifier: select count(*) from delegation_eval_results for the run on the dev lane returns 0, or a class count differs from the committed 40.5 report
  - id: "req-omn19787-check-register"
    statement: |-
      Every class of the plan's section 2.3 has a declared false-pass range and every delegation gate check has a check-register entry.
    acceptance:
      - id: "AC2"
        statement: |-
          AC-2: every class of the plan's section 2.3 has a declared false-pass range and every delegation gate check has a check-register entry -- falsifier: uv run python -m omnimarket.ranges check-register in omnimarket exits non-zero, or a class or gate check has no entry
  - id: "req-omn19787-dashboard-panel"
    statement: |-
      The dashboard panel shows every class of the latest eval run with its false-pass bound.
    acceptance:
      - id: "AC3"
        statement: |-
          AC-3: the dashboard panel shows every class of the latest eval run with its false-pass bound -- falsifier: npx vitest run server/__tests__/postgres-projection-reader.test.ts in omnidash, and the dev dashboard row count against select count(distinct task_class) for the latest run
  - id: "req-omn19787-rollup-eval-line"
    statement: |-
      The outcome rollup never suppresses a tier for a class whose false-pass line is not met.
    acceptance:
      - id: "AC4"
        statement: |-
          AC-4: the outcome rollup never suppresses a tier for a class whose false-pass line is not met -- falsifier: uv run pytest tests/unit/delegation -k eval_not_met_is_unknown -v in omnimarket
evidence_requirements:
  - kind: "tests"
    description: "The first page of the exposure carries the newest run for every class."
    command: "uv run pytest tests/unit/projection/test_omn19787_acceptance_eval_latest_first.py -q -k latest_run_every_class"
  - kind: "tests"
    description: "A since read still walks the cursor."
    command: "uv run pytest tests/unit/projection/test_omn19787_acceptance_eval_latest_first.py -q -k since_still_walks"
  - kind: "tests"
    description: "The class rubric decides answers by what the prompt declares."
    command: "uv run pytest tests/nodes/node_delegation_rubric_check_compute/test_rubric_checks.py -q -k \"single_word or json_decision\""
  - kind: "tests"
    description: "The lab run keeps only the named task classes."
    command: "uv run pytest tests/nodes/node_delegation_eval_orchestrator/test_lab_run_task_class.py -q -k task_class_keeps_only"
  - kind: "tests"
    description: "Runs are labelled from hidden tests and independently scored checklists, and the gate's false passes are counted against those labels."
    command: "uv run pytest tests/nodes/node_delegation_ground_truth_label_compute/test_ground_truth_label.py -q"
  - kind: "tests"
    description: "The golden code tasks' hidden tests pass their references, fail their controls and never appear in the prompts."
    command: "uv run pytest tests/nodes/node_delegation_ground_truth_label_compute/test_golden_hidden_test_tasks.py -q"
  - kind: "tests"
    description: "Four more task classes carry golden checklist tasks that a scorer other than the delegated model can judge."
    command: "uv run pytest tests/nodes/node_delegation_ground_truth_label_compute/test_golden_hidden_test_tasks.py -q -k eight_tasks_for_each_class"
  - kind: "tests"
    description: "AC1: the eval run's recorded arm reproduces the dev-lane rows and the committed first-run table per class."
    command: "uv run pytest tests/nodes/node_delegation_eval_run_orchestrator/test_run_terminals.py -q --no-cov -k \"omn19787 or reproduces_the_label_set_and_run_id or recorded_arm_matches_the_report\""
  - kind: "tests"
    description: "AC2: every section 2.3 class has a declared false-pass range and every gate check a gate entry, and the register CLI exits zero."
    command: "uv run pytest tests/test_omn19320_check_register.py -q --no-cov -k \"omn19787 or RequiredDelegationAcceptance\""
  - kind: "tests"
    description: "AC3, omnimarket half: the exposure's first page carries every class of the latest run with its false-pass bound."
    command: "uv run pytest tests/unit/projection/test_omn19787_acceptance_eval_latest_first.py -q --no-cov -k \"latest_run_every_class\""
  - kind: "tests"
    description: "AC4: a class whose line is not met never suppresses a tier."
    command: "uv run pytest tests/unit/delegation -k eval_not_met_is_unknown -v"

