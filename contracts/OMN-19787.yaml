schema_version: "1.0.0"
ticket_id: "OMN-19787"
title: "Serve the newest acceptance-eval run on the first page of its exposure"
summary: "The acceptance-eval projection exposure selects its top rows by observed_at DESC over the whole row set when no since cursor is given, so the dashboard's first page carries the latest run for every class. A focused test proves the first page and that since still walks the cursor."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-acceptance-eval-latest-first"
    statement: |-
      The acceptance-eval exposure must serve the newest run first and keep the since cursor walk.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: the latest acceptance-eval run has every class on the first page of its exposure -- falsifier: uv run pytest tests/unit/projection/test_omn19787_acceptance_eval_latest_first.py -q -k latest_run_every_class
      - id: "AC2"
        statement: |-
          AC2: a read with since still walks the cursor and is not reordered by the latest-first selection -- falsifier: uv run pytest tests/unit/projection/test_omn19787_acceptance_eval_latest_first.py -q -k since_still_walks
  - id: "req-rubric-declared-answers"
    statement: |-
      The review and test class rubrics must decide an answer against what its prompt declares, and the lab run must re-measure named classes only.
    acceptance:
      - id: "AC3"
        statement: |-
          AC3: declared_format_met decides a single-word reply, a JSON field with declared alternatives and facts echoed exactly as given, and an unreadable Facts object never passes -- falsifier: uv run pytest tests/nodes/node_delegation_rubric_check_compute/test_rubric_checks.py -q -k "single_word or json_decision"
      - id: "AC4"
        statement: |-
          AC4: lab_run run --task-class keeps only the named task classes -- falsifier: uv run pytest tests/nodes/node_delegation_eval_orchestrator/test_lab_run_task_class.py -q -k task_class_keeps_only
  - id: "req-ground-truth-labels"
    statement: |-
      A delegated run must be labelled from evidence the acceptance gate never produced, so the gate's false-pass rate is measured against ground truth.
    acceptance:
      - id: "AC5"
        statement: |-
          AC5: a code run is adequate only when a hidden test the delegated model never saw passes every case, a document run only when every checklist item is met by a scorer that is not the delegated model, and the labelled items count the gate's false passes per class -- falsifier: uv run pytest tests/nodes/node_delegation_ground_truth_label_compute/test_ground_truth_label.py -q
      - id: "AC6"
        statement: |-
          AC6: every golden code task's reference passes its hidden test, its control fails it, and no hidden-test line appears in the task prompt -- falsifier: uv run pytest tests/nodes/node_delegation_ground_truth_label_compute/test_golden_hidden_test_tasks.py -q
evidence_requirements:
  - kind: "tests"
    description: "The first page of the exposure carries the newest run for every class."
    command: "uv run pytest tests/unit/projection/test_omn19787_acceptance_eval_latest_first.py -q -k latest_run_every_class"
  - kind: "tests"
    description: "A since read still walks the cursor."
    command: "uv run pytest tests/unit/projection/test_omn19787_acceptance_eval_latest_first.py -q -k since_still_walks"
  - kind: "tests"
    description: "The class rubric decides answers by what the prompt declares."
    command: "uv run pytest tests/nodes/node_delegation_rubric_check_compute/test_rubric_checks.py -q -k \"single_word or json_decision\""
  - kind: "tests"
    description: "The lab run keeps only the named task classes."
    command: "uv run pytest tests/nodes/node_delegation_eval_orchestrator/test_lab_run_task_class.py -q -k task_class_keeps_only"
  - kind: "tests"
    description: "Runs are labelled from hidden tests and independently scored checklists, and the gate's false passes are counted against those labels."
    command: "uv run pytest tests/nodes/node_delegation_ground_truth_label_compute/test_ground_truth_label.py -q"
  - kind: "tests"
    description: "The golden code tasks' hidden tests pass their references, fail their controls and never appear in the prompts."
    command: "uv run pytest tests/nodes/node_delegation_ground_truth_label_compute/test_golden_hidden_test_tasks.py -q"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-latest-first-ac1"
    description: "The focused test proves the newest run has every class on the first page."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/projection/test_omn19787_acceptance_eval_latest_first.py -q -k latest_run_every_class"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC1"]
  - id: "dod-latest-first-ac2"
    description: "The focused test proves a since read still walks the cursor."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/projection/test_omn19787_acceptance_eval_latest_first.py -q -k since_still_walks"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC2"]
  - id: "dod-rubric-declared-answers-ac3"
    description: "The focused tests prove declared_format_met decides single-word, enumerated JSON and facts-echo answers."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_delegation_rubric_check_compute/test_rubric_checks.py -q -k \"single_word or json_decision\""
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC3"]
  - id: "dod-rubric-declared-answers-ac4"
    description: "The focused test proves lab_run run --task-class keeps only the named classes."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_delegation_eval_orchestrator/test_lab_run_task_class.py -q -k task_class_keeps_only"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC4"]
  - id: "dod-ground-truth-labels-ac5"
    description: "The focused test proves the labeller decides from hidden tests and independent checklists and the gate eval counts false passes against them."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_delegation_ground_truth_label_compute/test_ground_truth_label.py -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC5"]
  - id: "dod-golden-hidden-tests-ac6"
    description: "The focused test proves every golden hidden test passes its reference, fails its control and stays out of the prompt."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_delegation_ground_truth_label_compute/test_golden_hidden_test_tasks.py -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC6"]
  - id: "dod-ground-truth-label-deploy-probe"
    description: "PR #3866 on OmniNode-ai/omnimarket: the new node's handler at the PR head defines HandlerGroundTruthLabel."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: "gh api repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_delegation_ground_truth_label_compute/handlers/handler_ground_truth_label.py?ref=fe339700221568188bea801d332e2014c88c9187 --jq .content | base64 -d | grep -c 'class HandlerGroundTruthLabel'"
        cwd: "${OMNI_HOME}/omnimarket"
