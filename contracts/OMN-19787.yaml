          gh api "repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_delegation_ground_truth_label_compute/golden/checklist_tasks_planning.v1.yaml?ref=$(git rev-parse HEAD)" --jq '.content | gsub("\n"; "") | @base64d | contains("task_class: planning")' | grep -qx true
