schema_version: 1.0.0
ticket_id: OMN-22767
title: The code graph, overlay drift, host reading, lane census, host reconcile and consumer group guard schedule installs refuse a unit that runs from a worktree
summary: A unit installed from a worktree dies when the host worktree reconcile removes that tree (OMN-22735 closed this for the reading writer's install). Six other installers still rendered and wrote a unit whose ExecStart, WorkingDirectory or Environment names a path under omni_worktrees, and six loaded units on one lab host ran that way. Each installer now reads its rendered service and timer text through the shared unit-root guard and refuses, before any file is written and also in a dry run, naming the path and exiting 1. A canonical clone or an installed revision outside omni_worktrees installs as before.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn22767-refuse-worktree-roots
  statement: No schedule install of the six nodes writes a unit that runs from a worktree.
  acceptance:
  - id: AC1
    statement: 'AC1: each of the six installers refuses a rendered unit whose ExecStart, WorkingDirectory or Environment names a path under omni_worktrees, names the path, exits 1 and writes nothing, also in a dry run -- falsifier: uv run --frozen pytest tests/handlers/test_schedule_installers_refuse_worktree_roots.py -q --no-cov'
  - id: AC2
    statement: 'AC2: each installer still installs a unit rendered from a stable root and writes both files with no omni_worktrees text -- falsifier: uv run --frozen pytest tests/handlers/test_schedule_installers_refuse_worktree_roots.py -k stable_root -q --no-cov'
  - id: AC3
    statement: 'AC3: with the guard let through by a named injected break the same install writes a worktree unit, so each refusal test is red without the guard -- falsifier: uv run --frozen pytest tests/handlers/test_schedule_installers_refuse_worktree_roots.py -k guard_let_through -q --no-cov'
evidence_requirements:
- kind: tests
  description: The refusals, the stable installs and the injected break of the six installers
  command: uv run --frozen pytest tests/handlers/test_schedule_installers_refuse_worktree_roots.py -q --no-cov
