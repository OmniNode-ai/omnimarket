    description: "AC1 to AC5: the focused Market tests for the construction outcome pair."
    command: "uv run pytest tests/unit/delegation/test_unconstructible_terminal_omn18978.py tests/unit/delegation/test_omn19013_core_floor_terminal_construction.py tests/test_omn15905_delegation_projection_writer_seam.py -q"
