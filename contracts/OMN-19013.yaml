---
schema_version: "1.0.0"
ticket_id: "OMN-19013"
title: "Delegation terminal-construction outcome contract"
summary: "The Market receiver of the terminal-construction outcome pair: the orchestrator's degraded terminal keeps the gate's own quality flag next to the TERMINAL_CONSTRUCTION_FAILED / UNDETERMINED pair, the delegate-skill response model holds the pair's invariants, and the projection row carries the pair with no score. The Core wire contract (omnibase_core#1737) and the Infra receipt delivery (omnibase_infra#3945) are merged and are proven here through the installed Core release and the migration source Infra vendors."
is_seam_ticket: true
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-terminal-construction-outcome-contract"
    statement: "The criteria below are the ticket's definition of done, transcribed from its body: Core, Market and Infra receiver invariants; canonical JSON round trips; failed-topic versus quality-gate semantics. Each id is the label an evidence item claims through binds_ac."
    acceptance:
      - id: "AC1"
        statement: "AC1: Core receiver invariant -- the installed Core release carries TERMINAL_CONSTRUCTION_FAILED and UNDETERMINED, and a failed terminal may keep quality_passed=true only under that exact pair -- falsifier: uv run pytest tests/unit/delegation/test_omn19013_core_floor_terminal_construction.py -q -k 'installed_core or core_failed_topic'"
      - id: "AC2"
        statement: "AC2: Market receiver invariants -- the delegate-skill response model refuses an undetermined verdict without the construction outcome, a construction outcome without the stable reason, and any quality score or evidence on a construction failure -- falsifier: uv run pytest tests/unit/delegation/test_unconstructible_terminal_omn18978.py -q -k Consumer"
      - id: "AC3"
        statement: "AC3: Infra receiver invariant -- the migration Infra vendors from this repository filters the quality denominators on exactly the pair and keeps security_invoker on every view it replaces -- falsifier: uv run pytest tests/unit/delegation/test_omn19013_core_floor_terminal_construction.py -q -k migration_0045"
      - id: "AC4"
        statement: "AC4: canonical JSON round trips -- the degraded terminal and the response model reload equal from their own JSON, keeping the gate flag and a null score -- falsifier: uv run pytest tests/unit/delegation/test_unconstructible_terminal_omn18978.py tests/unit/delegation/test_omn19013_core_floor_terminal_construction.py -q -k round_trip"
      - id: "AC5"
        statement: "AC5: failed-topic versus quality-gate semantics -- the degraded terminal keeps the gate's decision whether it passed or not, and the projection row persists the pair, that decision and no score -- falsifier: uv run pytest tests/unit/delegation/test_unconstructible_terminal_omn18978.py tests/test_omn15905_delegation_projection_writer_seam.py -q -k 'gate_fact or construction_terminal'"
evidence_requirements:
