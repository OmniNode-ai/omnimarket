evidence_requirements:
- kind: tests
  description: Synthetic full-table fixtures cover the neutral shipped shape, no configured deployment,
    concurrent placement, and refusal of uncommitted private state.
  command: uv run pytest tests/scripts/test_prepush_host_table.py tests/scripts/test_pytest_full_suite_host_guard.py
    -q -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn17232-ac1-reviewed-private-host-authority
  description: The host authority is deployment configuration. This supports the rollout prerequisite;
    it does not claim the per-host runtime census or reasoned exclusions.
  source: manual
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/scripts/test_prepush_host_table.py -q -p no:randomly -k "test_the_shipped_table_carries_only_the_neutral_disabled_row
      or test_the_deployment_shape_check_has_a_positive_control"
  binds_ac:
  - AC1
- id: dod-omn17232-ac2-single-shared-resolver
  description: One repository-neutral resolver reads injected table data. This supports the zero-bespoke-placement
    prerequisite; the runtime recipe rollout remains unproven.
  source: manual
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/scripts/test_prepush_host_table.py -q -p no:randomly -k "test_the_deployment_table_path_is_declared_by_the_caller_not_the_library
      or test_the_picker_library_is_not_edited_into_a_repo_specific_fork"
  binds_ac:
  - AC2
- id: dod-omn17232-ac3-remote-identity-parity
  description: Remote guard configuration is preserved across transport. This supporting check does not
    prove a broker consumer-group census; AC3 remains pending.
  source: manual
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/scripts/test_prepush_host_table.py -q -p no:randomly -k "test_remote_wrapper_installs_the_verified_private_table
      or test_remote_dispatch_carries_the_private_table_and_its_declared_path"
  binds_ac:
  - AC3
- id: dod-omn17232-ac4-committed-configuration
  description: Committed configuration is reproducibly resolved and divergent state refuses. This supporting
    check does not prove reboot survival; AC4 remains pending. Both shell and direct pytest entry points
    refuse present unreadable, divergent or never-committed private tables before authorizing a run.
  source: manual
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/scripts/test_prepush_host_table.py -q -p no:randomly -k "test_a_committed_deployment_table_in_a_git_root_is_read
      or test_an_uncommitted_edit_to_the_deployment_table_is_refused or test_a_deployment_table_never_committed_in_a_git_root_is_refused"
  - check_type: test_passes
    check_value: uv run pytest tests/scripts/test_pytest_full_suite_host_guard.py -q -p no:randomly -k "present_untrusted_private_table or no_configured_table_refusal"
  binds_ac:
  - AC4
- id: dod-omn17232-ac5-neutral-without-config
  description: No built-in host identity substitutes for deployment configuration. This supporting placement
    check does not prove broker-address sourcing across runtime hosts; AC5 remains pending.
  source: manual
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/scripts/test_prepush_host_table.py -q -p no:randomly -k "test_without_a_config_root_only_the_neutral_row_remains_and_the_status_says_how_to_supply_one
      or test_a_config_root_without_the_table_is_the_neutral_case_not_an_error"
  binds_ac:
  - AC5
- id: dod-omn17232-ac6-offbox-placement
  description: Synthetic off-box placement preserves prefer_remote and admits independent slots. This
    supporting check does not settle the Studio load question or measure its runtime footprint; AC6 remains
    pending.
  source: manual
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/scripts/test_prepush_host_table.py -q -p no:randomly -k "test_private_high_slot_host_takes_two_concurrent_lanes_and_skips_unreachable
      or test_the_shipped_heavy_local_policy_is_pinned"
  binds_ac:
  - AC6
- id: dod-omn17232-deploy-overlay-smoke
  description: 'Hosted-runner deploy smoke for this hook-only contribution: source the actual dispatcher
    against a committed neutral fixture and an invented private full table, require independent high-slot
    placement, reject an extra public capacity row, and refuse divergent private git state. No lab route
    or private checkout is required. This check does not claim deployment of the ticket-wide runtime rollout.'
  source: manual
  checks:
  - check_type: command
    check_value: bash -n scripts/hooks/prepush_dispatch.sh scripts/hooks/prepush_smart_tests.sh && uv
      run pytest tests/scripts/test_prepush_host_table.py -q -p no:randomly -k "neutral_disabled_row or
      positive_control or private_high_slot or uncommitted_edit_to_the_deployment_table or never_committed"
- id: dod-omn17232-swapping-host-placement
  description: 'Swapping-host placement support for the shared recipe and load prerequisites:
    both engines refuse a paging host and an open alarm, choose a quiet host, and admit the
    recovered host. Hosted in-process runtime dispatch exercises the packaged node without
    a lab network or broker. This does not claim the ticket-wide runtime rollout, consumer
    census, reboot survival, broker configuration or Studio footprint obligations.'
  source: manual
  binds_ac:
  - AC2
  - AC6
  checks:
  - check_type: test_passes
    check_value: env PYTHONDONTWRITEBYTECODE=1 uv run --locked pytest tests/nodes/node_remote_lane_compute/test_host_swapping_slots.py -q --no-cov -p no:randomly
  - check_type: command
    check_value: |
      set -eu
      export PYTHONDONTWRITEBYTECODE=1
      probe_dir="$(mktemp -d)"
      trap 'rm -rf "$probe_dir"' EXIT
      runtime_bin="$(uv run --locked python -c 'import sys; from pathlib import Path; print(Path(sys.executable).parent)')"
      uv run --locked python -c '
      import json
      import sys
      from pathlib import Path
      root = Path(sys.argv[1])
      for engine in ("claude_sonnet", "codex"):
          for scenario in ("paging", "alarm_open", "fallback", "recovered"):
              host = {"name": "probe-paging", "engines": [engine], "lane_slots": 9, "lane_cap": 10, "rank_free": 9.0}
              if scenario in ("paging", "fallback"):
                  host["swap_in_kb_s"] = 167000.0
              elif scenario == "alarm_open":
                  host.update(swap_in_kb_s=0.0, swap_alarm_open=True)
              else:
                  host.update(swap_in_kb_s=0.0, swap_alarm_open=False)
              readings = [host]
              if scenario == "fallback":
                  readings.append({"name": "probe-quiet", "engines": [engine], "lane_slots": 1, "lane_cap": 10, "rank_free": 1.0})
              (root / f"{engine}-{scenario}.input.json").write_text(json.dumps({"engine": engine, "readings": readings}))
      ' "$probe_dir"
      for engine in claude_sonnet codex; do
        for scenario in paging alarm_open fallback recovered; do
          env ONEX_LANE=omn17232-placement-probe "$runtime_bin/onex" node node_remote_lane_compute --input "$probe_dir/$engine-$scenario.input.json" --state-root "$probe_dir/state-$engine-$scenario" --backend event_bus=inmemory --timeout 30 --output receipt --omnibase-path "$PWD" > "$probe_dir/$engine-$scenario.receipt.json"
        done
      done
      uv run --locked python -c '
      import json
      import sys
      from pathlib import Path
      root = Path(sys.argv[1])
      for engine in ("claude_sonnet", "codex"):
          for scenario in ("paging", "alarm_open", "fallback", "recovered"):
              receipt = json.loads((root / f"{engine}-{scenario}.receipt.json").read_text())
              assert receipt["status"] == "success" and receipt["exit_code"] == 0, receipt
              result = receipt["result"]
              expected = "probe-quiet" if scenario == "fallback" else "probe-paging" if scenario == "recovered" else None
              assert result["host"] == expected, result
              assert result["outcome"] == ("NO_HOST" if expected is None else "ADMITTED"), result
              reasons = {verdict["host"]: verdict["reason"] for verdict in result["verdicts"]}
              if scenario != "recovered":
                  assert reasons["probe-paging"].startswith("host-swapping:"), result
              print(json.dumps({"run_id": receipt["run_id"], "engine": engine, "scenario": scenario, "host": result["host"], "outcome": result["outcome"], "verdicts": result["verdicts"]}))
      ' "$probe_dir"
