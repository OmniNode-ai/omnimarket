schema_version: 1.0.0
ticket_id: OMN-17232
title: Lab placement reads the host table, and the pre-push host authority comes from the private full table
summary: 'Bus placement read only the pool hosts'' capacity advertisements, so available: false in the lab host
  table kept a host out of the ssh path alone. On 2026-10-29 a host marked unavailable ran seven or more units from
  other lanes, one omnibase_core suite ending 128 failed (cause not read). A census of fifteen repositories on that
  Ivy Bridge host (no AVX2) found one (a private repository) whose unit suite dies of the missing instruction set,
  in a wheel; its rule is data of the private host table. A new pure node, node_lab_placement_compute, judges each
  advertising host against the host table for one unit (a row of the table, not available: false, takes the unit''s
  work kind and weight, has the capabilities the unit needs). A unit''s weight and needs are contract data of that
  node and of the host table document (a unit of a repository that needs avx2 is not placed on a row with avx2:
  false); a host row may carry its own memory bar (min_free_gb), job_kinds, max_weight and a measured speed. Lab-work
  placement refuses on a table it cannot read. The omni lab-run shim calls the same rule through onex lab-work judge.
  Second part, supporting overlay lane: Supporting overlay lane only: remove deployment rows and built-in host identities
  from the public hook, use one committed private full table through dependency injection, and carry verified configuration
  to remote guards. The ticket-wide runtime rollout acceptance criteria below are retained as obligations, not declared
  satisfied by this hook change.'
is_seam_ticket: false
interface_change: true
interfaces_touched:
- public_api
