schema_version: 1.0.0
ticket_id: OMN-17232
title: Pre-push host authority comes from the private full table
summary: 'Supporting overlay lane only: remove deployment rows and built-in host identities from the public
  hook, use one committed private full table through dependency injection, and carry verified configuration
  to remote guards. The ticket-wide runtime rollout acceptance criteria below are retained as obligations,
  not declared satisfied by this hook change.'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn17232-ac1
  statement: Every host in the table either runs a runtime brought up by C-a's recipe unmodified, or carries
    a recorded, reasoned exclusion naming the constraint that excludes it. "Not done yet" is not an exclusion.
  acceptance:
  - id: AC1
    statement: Every host in the table either runs a runtime brought up by C-a's recipe unmodified, or
      carries a recorded, reasoned exclusion naming the constraint that excludes it. "Not done yet" is
      not an exclusion.
- id: req-omn17232-ac2
  statement: Zero per-host deviations. Any deviation required is filed back against C-a's recipe and this
    ticket waits — it does not absorb the exception.
  acceptance:
  - id: AC2
    statement: Zero per-host deviations. Any deviation required is filed back against C-a's recipe and
      this ticket waits — it does not absorb the exception.
- id: req-omn17232-ac3
  statement: Each host's EFFECT node shows a live consumer group on the broker lane its contract resolved
    (memory `reference_node_liveness_verification`). One census, listing group / member / offset per host.
  acceptance:
  - id: AC3
    statement: Each host's EFFECT node shows a live consumer group on the broker lane its contract resolved
      (memory `reference_node_liveness_verification`). One census, listing group / member / offset per
      host.
- id: req-omn17232-ac4
  statement: Each host survives a reboot with the runtime returning unattended — same bar as C-a AC2,
    run per host, not extrapolated from one.
  acceptance:
  - id: AC4
    statement: Each host survives a reboot with the runtime returning unattended — same bar as C-a AC2,
      run per host, not extrapolated from one.
- id: req-omn17232-ac5
  statement: No host's broker address comes from an env var. A single grep-assert across all hosts, not
    per-host eyeballing.
  acceptance:
  - id: AC5
    statement: No host's broker address comes from an env var. A single grep-assert across all hosts,
      not per-host eyeballing.
- id: req-omn17232-ac6
  statement: The Studio (`h200`) is added only after its load question is settled — either OMN-17226's
    pre-push offload has moved heavy work off it, or the runtime's footprint on the Studio is measured
    and recorded as acceptable. Not assumed.
  acceptance:
  - id: AC6
    statement: The Studio (`h200`) is added only after its load question is settled — either OMN-17226's
