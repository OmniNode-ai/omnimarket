schema_version: 1.0.0
ticket_id: OMN-26489
title: A pull request that adds or changes a node whose contract names no caller, schedule or tick is refused at merge unless the contract declares the on-demand command that runs it
summary: 'The census, the lane dispatcher and the dev identity provisioner each declare what runs them: the census gets a daily host unit (ledger-file-census-systemd) and a tick module that keeps the daily record, the dispatcher names the host unit it already had, and the provisioner declares its on-demand command and owner; the typed declarations live in omnimarket.models.model_node_trigger.'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn26489-ac3
  statement: the nodes of the NOT RUNNING list that declare none of the three are marked or given a trigger
  acceptance:
  - id: AC3
    statement: 'AC3: the nodes of the current NOT RUNNING list that declare none of the three are each marked on_demand with a command and owner or given a trigger, so the check passes on dev -- falsifier: uv run pytest tests/unit/contracts/test_every_changed_node_declares_a_caller.py --all-nodes exits non-zero on dev'
evidence_requirements:
- kind: tests
  description: The trigger declaration tests pass at the pushed head.
  command: uv run --frozen pytest -q tests/unit/contracts/test_node_trigger_declarations.py -p no:cacheprovider --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn26489-ac3
  description: 'Scope of this pull request: the three nodes of the ledger''s NOT RUNNING lines named by the ticket (the census, the lane dispatcher, the dev identity provisioner) each declare a trigger: the census a daily host unit, the dispatcher its host unit, the provisioner an on-demand command and owner; each declaration is checked against the thing it names, with controls. The check and the all-nodes list belong to the second pull request.'
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest -q tests/unit/contracts/test_node_trigger_declarations.py -p no:cacheprovider --no-cov
    cwd: .
- id: dod-omn26489-deploy
  description: 'Deploy probe the hosted runner can run: the installer contract at the checked-out commit on GitHub declares the ledger-file-census-systemd unit; the unit does not exist at the merge base, so the probe fails there.'
  source: manual
  checks:
  - check_type: command
    check_value: bash -o pipefail -c 'gh api "repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_host_installer_registry_units/contract.yaml?ref=$(git rev-parse HEAD)" --jq .content | base64 -d | grep -F "ledger-file-census-systemd:" > /dev/null'
    cwd: .
- id: dod-omn26489-integration-proof
  description: The pushed head ran the trigger declaration tests, which run one census tick against a registry clone, on a lab host through the bus and exited 0. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane triggers2-0140 --kind test -- uv run --frozen pytest -q tests/unit/contracts/test_node_trigger_declarations.py -p no:cacheprovider --no-cov
    cwd: .
