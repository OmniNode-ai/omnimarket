- id: req-omn19797
  statement: The routing outcome overlay must fail open to the static tiers whenever a class's eval false-pass line is not demonstrably met.
  acceptance:
  - id: AC1
    statement: 'AC1: a class whose latest eval is MISSED or REFUSED yields unknown and never suppresses a tier -- falsifier: uv run pytest tests/unit/delegation/test_routing_eval_line_gate_omn19797.py -q -k eval_not_met_is_unknown'
  - id: AC2
    statement: 'AC2: a class whose line is MET gets the normal verdict, and an unreadable eval table yields unknown, never failing -- falsifier: uv run pytest tests/unit/delegation/test_routing_eval_line_gate_omn19797.py -q -k "eval_met_normal or eval_unreadable_unknown"'
