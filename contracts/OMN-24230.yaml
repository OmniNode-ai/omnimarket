schema_version: 1.0.0
ticket_id: OMN-24230
title: Tenant routes in the runtime read their caller-identity setting from an overlay
summary: 'Four tenant routes that moved from the separate API service into the runtime (usage privileges, inference credentials, tenant savings, tenant delegations) refuse every caller with 503 on the dev
  lane because no resolver is bound. A shared resolver builds the bearer-token check from each node''s own overlay document (found under the overlay roots), cached on success and never served open: no document,
  a broken document or an unreachable key set refuses. An explicitly bound resolver still wins.'
is_seam_ticket: true
interface_change: true
interfaces_touched:
- public_api
requirements:
- id: req-omn24230-overlay-identity
  statement: Each of the four runtime routes builds its caller-identity check from its own overlay document and fails closed without one.
  acceptance:
  - id: AC1
    statement: 'AC1: each tenant route of the runtime reads its caller-identity setting from its own deployment document -- falsifier: a unit test that fails when the document is removed or the factory
      is not wired'
  - id: AC2
    statement: 'AC2: a route with no document or with an unreadable key set refuses every caller and never serves anonymously -- falsifier: error-chain test over a missing document and a broken key set'
  - id: AC3
    statement: 'AC3: integrated: on the dev lane the four routes answer 401 with no credential instead of 503 -- falsifier: a read of each route on the dev runtime port after the deploy'
evidence_requirements:
- kind: tests
  description: The overlay identity route tests pass at the pushed head.
  command: uv run pytest tests/handlers/test_edge_overlay_identity_routes.py -q -p no:randomly --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24230-ac1
  description: 'AC1: the four routes serve a verified bearer token from their overlay document; at the merge base the shared module does not exist and the positive cases answer 503.'
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/handlers/test_edge_overlay_identity_routes.py -q -p no:randomly --no-cov
    cwd: .
- id: dod-omn24230-ac2
  description: 'AC2: no document, a symmetric-algorithm document, a document missing a setting and a down key set each answer 503 with no read.'
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/handlers/test_edge_overlay_identity_routes.py -q -p no:randomly --no-cov
    cwd: .
- id: dod-omn24230-ac3
  description: 'hosted proxy for AC3: the route tests pass here; the read of the four routes on the dev runtime after the branch deploy is posted as a pull request comment naming the head.'
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/handlers/test_edge_overlay_identity_routes.py -q -p no:randomly --no-cov
    cwd: .
- id: dod-omn24230-integration-proof
  description: the route tests run on a lab host at the pushed head; hosted CI cannot reach the lab, so only the local Done gate runs this unbound check
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24230 --kind test -- env PYTHONDONTWRITEBYTECODE=1
      uv run --frozen pytest tests/handlers/test_edge_overlay_identity_routes.py -q --no-cov -p no:randomly
