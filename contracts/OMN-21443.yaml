schema_version: 1.0.0
ticket_id: OMN-21443
title: 'T-A2: stop reducer, class registry and stop gate rule'
summary: New reducer node node_andon_stop_reducer (contract state machine of plan section 5.8, config.andon_stop, andon_stop overlay model), the shared rule rules_stop_gate with stop_gate, models stop_gate,
  and the stop fields, role-checked append, lease replacement and decision rows in node_exception_queue_effect. Pure local invocation; hosted deploy smoke folds a stop event through the packaged reducer
  without external services.
is_seam_ticket: false
interface_change: true
interfaces_touched:
- public_api
requirements:
- id: req-andon-stop
  statement: A stop is a record of the exception queue whose lifecycle is the contract state machine of the stop reducer, and one rule refuses new work into its scope.
  acceptance:
  - id: AC1
    statement: 'AC1: `stop_gate(scope)` returns refuse with the stop''s id and swarm lane while open, and admit after `cleared_at` -- falsifier: the pytest cases'
  - id: AC2
    statement: 'AC2: A readback reading UNKNOWN leaves the stop open -- falsifier: the pytest case'
  - id: AC3
    statement: 'AC3: The contract''s `state_machine` equals the fragment of section 5.8 and passes `analyze_fsm` with no finding -- falsifier: a test that loads it with `ModelFSMSubcontract` and compares
      it to a fixture copy of the fragment'
  - id: AC4
    statement: 'AC4: A row for a class not in `config.andon_stop.stop_classes` opens a failure record and no stop -- falsifier: the pytest case'
  - id: AC5
    statement: 'AC5: A lease, a countermeasure record, a clear or a declare-false written by a caller whose role is not the trigger''s role in `config.andon_stop.writer_roles` is refused at the queue''s
      append and the refusal is recorded -- falsifier: four pytest cases through the persistence boundary, and a fifth with the right role that is accepted'
  - id: AC6
    statement: 'AC6: A class in `observe` mode returns admit with the stop named, never refuse -- falsifier: the pytest case'
  - id: AC7
    statement: 'AC7: A lease past its expiry is replaceable, and a replacement past `max_lease_replacements` writes one decision row -- falsifier: the pytest cases'
  - id: AC8
    statement: 'AC8: Configuration: every number of `config.andon_stop` is read from the reducer''s contract, the class mode from the `andon_stop` overlay, and no literal of the register is in the handler
      or the rule -- falsifier: the pytest cases run with the fixture contract at 1 consecutive reading and again at 3 and assert the clear moves from the first readback to the third; an absent overlay
      mode refuses naming the key'
  - id: AC9
    statement: 'AC9: Bindings: depends on LED, STO, CHG, HST and CLK (the exception queue persists what the reducer decides and starts the mechanize lane); the reducer is pure -- falsifier: this task''s
      tests run under the `local` profile and under the `lab` profile through the parity run (T-B2) and assert identical semantic projections; a stub binding that reorders rows, drops a row or moves a source
      time across a decision boundary makes the comparison fail'
