- id: dod-omn21443-deploy-local-runtime
  description: Hosted deploy smoke dispatches the installed reducer through the ONEX CLI with an in-memory backend and checks a lease applied by the swarm lane and a lease from the wrong role refused. No
    broker, credentials, Docker or lab service is required; this is packaged local execution, not a production rollout.
  source: manual
  binds_ac:
  - AC5
  - AC8
  checks:
  - check_type: test_passes
    check_value: env PYTHONDONTWRITEBYTECODE=1 uv run pytest tests/nodes/node_andon_stop_reducer/test_runtime_local.py -q --no-cov
    cwd: ${OMNI_HOME}/omnimarket
  - check_type: command
    check_value: |
      set -eu;
      export PYTHONDONTWRITEBYTECODE=1;
      probe_dir="$(mktemp -d)";
      trap 'rm -rf "$probe_dir"' EXIT;
      uv sync --locked;
      export PATH="$(uv run --locked python -c 'import sys; from pathlib import Path; print(Path(sys.executable).parent)'):$PATH";
      python -c '
      import json
      import sys
      from pathlib import Path
      root = Path(sys.argv[1])
      request = {"stop": {"id": "stop-1", "cls": "engine-policy-breach", "scope": {"kind": "engine", "key": "example-engine"}, "state": "open", "stopped_at": "2026-11-01T10:00:00Z"}, "event": {"stop_id": "stop-1", "kind": "lease_granted", "role": "swarm_lane", "at": "2026-11-01T10:05:00Z", "lane_id": "swarm-lane-1"}}
      (root / "applied.json").write_text(json.dumps(request))
      request["event"]["role"] = "readback"
      (root / "refused.json").write_text(json.dumps(request))
      ' "$probe_dir";
      for expected in applied refused; do
        onex node node_andon_stop_reducer --input "$probe_dir/$expected.json" --state-root "$probe_dir/$expected.state" --backend event_bus=inmemory --timeout 30 --output receipt --omnibase-path "$PWD" > "$probe_dir/$expected.receipt.json";
        python -c '
      import json
      import sys
      from pathlib import Path
      expected, path = sys.argv[1:]
      receipt = json.loads(Path(path).read_text())
      assert receipt["status"] == "success" and receipt["exit_code"] == 0, receipt
      result = receipt["result"]
      assert result["status"] == expected, result
      assert result["stop"]["state"] == {"applied": "swarming", "refused": "open"}[expected], result
      print(json.dumps({"run_id": receipt["run_id"], "result": result["status"], "state": result["stop"]["state"]}, sort_keys=True))
      ' "$expected" "$probe_dir/$expected.receipt.json";
      done
    cwd: ${OMNI_HOME}/omnimarket
