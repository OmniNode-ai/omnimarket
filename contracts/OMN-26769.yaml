schema_version: "1.0.0"
ticket_id: OMN-26769
title: Work contract uv.lock pins survive a version-only release bump
summary: The work contract environment pin digests uv.lock without its revision line and omnimarket self-entry version, so a version-only release bump keeps every pin and any other lock change still fails.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn26769
  statement: The work contract uv.lock pin must survive a version-only release bump and still refuse any other uv.lock change.
  acceptance:
  - id: AC1
    statement: 'AC1: the work contract pin check passes on a uv.lock whose only change is a version bump, and fails on any other uv.lock change -- falsifier: uv run pytest tests/nodes/test_work_contract_pins_current.py -q'
  - id: AC2
    statement: 'AC2: every work contract in the corpus loads against the current uv.lock, so the post-release bump reads green on its pin-dependent checks -- falsifier: uv run pytest tests/nodes/test_work_contract_checks.py -q'
evidence_requirements:
- kind: tests
  description: The cited tests pass at the PR head.
  command: uv run pytest tests/nodes/test_work_contract_pins_current.py tests/nodes/test_work_contract_checks.py -q
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn26769-ac1
  description: A uv.lock with a bumped self version and lock revision passes the pin; a changed dependency version raises input_pin_mismatch; non-lock files stay raw sha256.
  source: manual
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/test_work_contract_pins_current.py -q
    cwd: ${OMNI_HOME}/omnimarket
  binds_ac:
  - AC1
- id: dod-omn26769-ac2
  description: The full work contract check module collects and passes against the current uv.lock.
  source: manual
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/test_work_contract_checks.py -q
    cwd: ${OMNI_HOME}/omnimarket
  binds_ac:
  - AC2
- id: dod-omn26769-integration-proof
  description: Run the whole work contract check module on a lab host at the pushed head, so every corpus contract loads against the current uv.lock. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: onex lab-work run --bus-lane dev --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-26769 --kind test -- uv run --frozen pytest tests/nodes/test_work_contract_checks.py -q --no-cov
    cwd: ${OMNI_HOME}/omnimarket
