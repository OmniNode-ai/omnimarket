  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/nodes/test_golden_chain_ask_state.py tests/unit/nodes/node_ask_state_compute -q --no-cov
    cwd: .
- id: dod-omn22729-ac2-ac3
