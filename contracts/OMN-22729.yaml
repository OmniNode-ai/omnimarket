schema_version: 1.0.0
ticket_id: OMN-22729
title: An operator ask that a lane reports done or a merge cites reads unverified until a done-check verdict row reads TRUE
summary: node_ask_state_compute reads an ask that a lane's TERMINAL or a merge closes as unverified until a STATUS row on the check lane cites the ask with verdict TRUE, and as failed when the newest verdict reads FALSE. The new node_ask_done_check_effect runs each ask's declared done check against the running system, the floor's JSON or a ledger row read through the bus-fed query node, and appends one verdict row; a source that cannot be read is UNKNOWN, never TRUE and never FALSE. The read route is the query node's command and the overlay refuses a file route.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn22729-ask-done-check
  statement: An operator ask is closed only by a verdict row that the running system produced, never by a lane's report or a merge.
  acceptance:
  - id: AC1
    statement: 'AC1: an ask reported done or cited by a merge reads unverified with no done-check verdict row, verified when the newest verdict row reads TRUE and failed when it reads FALSE -- falsifier: uv run --frozen pytest tests/unit/nodes/test_golden_chain_ask_state.py tests/unit/nodes/node_ask_state_compute -q --no-cov, red when the handler is reverted'
  - id: AC2
    statement: 'AC2: the done-check node reads the floor or a ledger row through the query node command and refuses a file read route in its overlay -- falsifier: uv run --frozen pytest tests/unit/nodes/node_ask_done_check_effect/test_ask_done_check_chain_events.py -q --no-cov -k file_read_route'
  - id: AC3
    statement: 'AC3: golden and error chain event tests exist for the ask type and the done-check node, and the injected break (the ledger read fails) emits an UNKNOWN verdict and not a TRUE one -- falsifier: uv run --frozen pytest tests/unit/nodes/node_ask_done_check_effect/test_ask_done_check_chain_events.py -q --no-cov -k "golden_chain or error_chain or named_break"'
evidence_requirements:
- kind: tests
  description: The ask state tests and the done-check node tests.
  command: uv run --frozen pytest tests/unit/nodes/node_ask_done_check_effect tests/unit/nodes/node_ask_state_compute tests/unit/nodes/test_golden_chain_ask_state.py -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
