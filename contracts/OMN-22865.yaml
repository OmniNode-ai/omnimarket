schema_version: 1.0.0
ticket_id: OMN-22865
title: The friction rollup's shipped class rules name every stoppage row of the ledger day that carried no class
summary: The rollup unit reads node_friction_rollup_compute overlay.example.yaml as its class rules. That file held six rules while the overlay home held twenty-seven, so the floor's stoppage:unclassified row stood at 33 occurrences with no class and no owner. The shipped set now carries the home's rules and ten more, named from the text of the 24 rows of 2026-11-06T23:55Z to 2026-11-07T23:55Z that the first twenty-seven left unclassified. The largest class, eight rows, is the lab host table that lab-run and placement reject or cannot reach.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn22865-class-rules
  statement: Every FRICTION row of the recorded day that carries no class is named by a shipped class rule with an owner, and a row no rule knows stays unclassified.
  acceptance:
  - id: AC1
    statement: 'AC1: every stoppage in the rollup carries a class from the declared class list, and the largest class has a fix merged or installed from its branch with a failing control -- falsifier: uv run pytest of the friction rollup classifier tests plus the board read showing the unclassified count'
evidence_requirements:
- kind: tests
  description: The class rule tests of the friction rollup node, including the recorded 2026-11-07 day.
  command: uv run pytest tests/nodes/node_friction_rollup_compute -q
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn22865-ac1
  description: The recorded-day tests pass on the branch; with the six rules the unit read before, the shipped-rules, per-row class and largest-class tests fail, and the two controls pass either way.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_friction_rollup_compute/test_class_rules_ledger_day_2026_11_07.py -q
- id: dod-omn22865-integration-proof
  description: Run the friction rollup node tests on a lab host at the pushed head. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-22865 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_friction_rollup_compute -q --no-cov
