schema_version: 1.0.0
ticket_id: OMN-24349
title: The dev workflow list route reads its sign-in settings from its own overlay
summary: GET /v1/workflows/contracts answers 503 'OIDC authentication is not configured' on the dev runtime because nothing binds the node's caller resolver. The node now builds its resolver from its own
  overlay document when none is bound, and a resolver failure refuses 503 from the contract instead of failing unhandled. The overlay document lives in the overlays repository.
is_seam_ticket: true
interface_change: true
interfaces_touched:
- public_api
requirements:
- id: req-omn24349-catalog-identity-overlay
  statement: The workflow contract catalog mount builds its caller-identity check from its own overlay document and fails closed without one.
  acceptance:
  - id: AC1
    statement: 'AC1: GET /v1/workflows/contracts with no bound resolver and no identity overlay answers 503 "OIDC authentication is not configured" instead of failing, and with the overlay document plus
      a valid token it answers 200 -- falsifier: pytest tests/handlers/test_edge_overlay_identity_routes.py -q -k workflow_contract_catalog fails on the pre-change handler'
  - id: AC2
    statement: 'AC2: the overlays repository holds a caller-identity document for node_workflow_contract_catalog_effect with the nine required keys and the dev identity provider values, pinned to a model
      revision -- falsifier: pytest tests/test_tenant_route_identity_overlays.py -q fails with the document removed'
  - id: AC3
    statement: 'AC3: integrated: on the dev runtime on h201, GET /v1/workflows/contracts with a dev token is no longer refused 503 "OIDC authentication is not configured" -- falsifier: the same GET on the
      running runtime still answers 503 with that detail'
evidence_requirements:
- kind: tests
  description: The overlay identity route tests and the catalog node tests pass at the pushed head.
  command: uv run pytest tests/handlers/test_edge_overlay_identity_routes.py -q -p no:randomly --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24349-ac1
  description: 'AC1: the catalog mount is built like the runtime builds it, with no identity argument; with the pre-change http_app 9 route tests fail and with the pre-change handler 8 fail.'
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/handlers/test_edge_overlay_identity_routes.py -q -p no:randomly --no-cov
    cwd: .
- id: dod-omn24349-ac2
  description: 'hosted proxy for AC2: the route tests load the same nine-key document through ModelEdgeIdentityOverlay; the overlays repository pull request carries the document, the pin line and its own
    test.'
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/handlers/test_edge_overlay_identity_routes.py -q -p no:randomly --no-cov
    cwd: .
- id: dod-omn24349-ac3
  description: 'hosted proxy for AC3: the route tests pass here; the read of the route on the dev runtime after the branch deploy is posted as a pull request comment naming the head.'
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/handlers/test_edge_overlay_identity_routes.py -q -p no:randomly --no-cov
    cwd: .
- id: dod-omn24349-integration-proof
  description: the route tests run on a lab host at the pushed head; hosted CI cannot reach the lab, so only the local Done gate runs this unbound check
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24349 --kind test -- env PYTHONDONTWRITEBYTECODE=1
      uv run --frozen pytest tests/handlers/test_edge_overlay_identity_routes.py -q --no-cov -p no:randomly
