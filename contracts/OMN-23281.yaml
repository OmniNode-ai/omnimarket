schema_version: 1.0.0
ticket_id: OMN-23281
title: Lanes read GitHub only through the read-only mirror; a validator refuses a direct gh read in lane-facing text
summary: node_lane_gh_read_scan_compute names each line of a lane-facing text that tells a lane to run a gh read or gh pr create, with the onex scm verb or local reader that answers it. The dispatch brief-shape refusal gh-read-refused calls it before placement, and the dispatch worker watcher and ops templates name onex scm verbs instead of gh.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23281-no-direct-gh-read
  statement: Lane-facing code or prompt text that calls gh or the GitHub API for a read the mirror serves is refused, and the mirror verb is admitted.
  acceptance:
  - id: AC1
    statement: 'AC1: an omnimarket validator refuses lane-facing code or prompt text that calls gh or the GitHub API for a read the mirror serves, and admits the mirror verb -- falsifier: `uv run pytest tests -q -k no_direct_gh_read` in omnimarket, failing with the validator removed'
evidence_requirements:
- kind: tests
  description: The scan, its golden chain and error chain event tests and the whole-tree no-direct-gh-read test pass.
  command: uv run --frozen pytest tests/nodes/node_lane_gh_read_scan_compute -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23281-ac1
  description: The scan names each direct gh read with its mirror verb and admits the mirror form; every skill under plugins and the worker templates name no direct gh call -- proven by the named tests.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_lane_gh_read_scan_compute -q --no-cov -k no_direct_gh_read
    cwd: .
- id: dod-omn23281-integration-proof
  description: Run this pull request's own check on a lab host at the pushed head. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23281 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_lane_gh_read_scan_compute tests/nodes/node_dispatch_brief_shape_compute -q --no-cov
    cwd: .
