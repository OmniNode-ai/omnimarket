schema_version: 1.0.0
ticket_id: OMN-21491
title: 'T-V2: delivery-path reducer'
summary: 'New pure reducer node node_delivery_path_reducer. Its contract carries the plan section 7.3 (Figure 11) state machine
  and config.delivery.stale_after_minutes; the handler builds the guard context and emits stale_limit_reached from the configured
  limit and the merge time of the expected target.'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-delivery-path-reducer
  statement: The delivery-path reducer folds one event of a delivery path into its record through the contract's state machine.
  acceptance:
  - id: AC1
    statement: 'AC1: The contract equals the fragment of 7.3, loads with the core model and has no unreachable state, dead
      or ambiguous transition or cycle without exit -- falsifier: the contract-equality and `analyze_fsm` pytest cases'
  - id: AC2
    statement: 'AC2: A reference of kind `branch`, `sha` or `hand_kept_version` is refused and nothing leaves `refused` --
      falsifier: three pytest cases and a case that every trigger from `refused` is rejected'
  - id: AC3
    statement: 'AC3: A path waiting for its tag past `stale_after_minutes` reaches `stale` and writes one decision row, and
      when the tag then appears `tag_seen` brings it back to `tag_resolved` and an install reaches `verified`; `install_started`
      from `stale` needs `target_resolved == True` -- falsifier: the pytest cases missing tag, timeout, tag appears, verified,
      and a `stale` path with an unresolved target that stays `stale`'
  - id: AC4
    statement: 'AC4: An install whose receipt does not name the tag returns to `tag_resolved` and is retried, and the deadline
      is the one anchored to the expected merge, so repeated older-tag receipts and a missing receipt both reach `stale` at
      the limit instead of restarting the clock; `installing` has its own `stale_limit_reached` transition -- falsifier: two
      pytest cases with a clock past the limit across five retries and with no receipt'
  - id: AC5
    statement: 'AC5: A `verified` path whose repository has a newer merge that no tag covers moves to `tag_pending` on `newer_merge_seen`
      and to `stale` at the limit counted from that merge -- falsifier: the pytest case with an installed older tag and an
      untagged newer merge'
  - id: AC6
    statement: 'AC6: `path_checked` is valid in every active state: a reference whose `reference_allowed` is False reaches
      `refused` from `declared`, `tag_pending`, `tag_resolved`, `installing`, `verified` and `stale`, and an allowed one (a
      dev-merge tag on a continuous path, or a candidate tag on a declared pre-PR path) moves `declared` to `tag_pending`
      and leaves every other active state unchanged -- falsifier: twelve pytest cases, and a case that changes the reference
      during pending resolution and during installation'
  - id: AC7
    statement: 'AC7: A consumer found off the tag leaves `verified` for `stale` -- falsifier: the pytest case with `consumer_on_tag`
      False'
  - id: AC8
    statement: 'AC8: A newer merge or tag seen in `tag_resolved` or `installing` moves the path to the new target, and a receipt
      for the superseded target never reaches `verified` -- falsifier: the pytest case that starts installing A, sees merge
      B and then receives A''s successful receipt (the path stays off `verified` and keeps B as its target), plus its restart
      and concurrent-sync variants'
  - id: AC9
    statement: 'AC9: Configuration: `stale_after_minutes` is a contract field; the handler holds no number -- falsifier: the
      same waiting path is `stale` under a fixture of 30 and pending under 600'
  - id: AC10
    statement: 'AC10: Bindings: depends on no protocol (it takes facts and `now`) -- falsifier: byte-identical results in
      process and through the local in-process entry of the parity harness (T-B2), and the conformance check (T-B1) fails
      if a `protocol_dependencies` entry appears in its contract'
