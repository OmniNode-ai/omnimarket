schema_version: 1.0.0
ticket_id: OMN-22989
title: The automation liveness overlay check node returns the findings of the private copy it replaces, cell by cell, on a recorded input
summary: The node already reads and checks the overlay. This change records what the private copy printed on 19 planted registry trees, one per finding kind and source class, and runs the node over the same trees, comparing the exit code, each finding's kind, subject and detail and each summary count. A planted divergence in the recorded side and in the node side must be named. One case is a declared divergence, the node's wildcard rule, asserted as exactly one finding the node does not raise.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn22989-parity
  statement: The node's output equals the private copy's recorded output cell by cell, and a planted undeclared unit makes the node alone report a finding.
  acceptance:
  - id: AC1
    statement: 'AC1: omnimarket''s check returns the same findings as the private copy on a recorded tree and on today''s base, and the installer scan handler is covered -- falsifier: uv run --frozen pytest src/omnimarket/nodes/node_automation_liveness_overlay_check_compute -q --no-cov -k parity_with_internal_copy'
  - id: AC3
    statement: 'AC3: a planted undeclared unit makes both copies, then the node alone, report a finding -- falsifier: uv run --frozen pytest src/omnimarket/nodes/node_automation_liveness_overlay_check_compute -q --no-cov -k planted_undeclared_unit'
evidence_requirements:
- kind: tests
  description: The parity tests, the planted divergence controls and the planted undeclared unit tests.
  command: uv run --frozen pytest src/omnimarket/nodes/node_automation_liveness_overlay_check_compute tests/nodes/node_automation_liveness_overlay_check_compute tests/nodes/node_automation_liveness_overlay_check_effect -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn22989-ac1
  description: The parity tests pass on the recorded trees and fail when one finding's text in the node is changed.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest src/omnimarket/nodes/node_automation_liveness_overlay_check_compute -q --no-cov -k parity_with_internal_copy
- id: dod-omn22989-ac3
  description: The planted undeclared unit is reported by the node and matches the recorded private copy.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest src/omnimarket/nodes/node_automation_liveness_overlay_check_compute -q --no-cov -k planted_undeclared_unit
- id: dod-omn22989-integration-proof
  description: Run the node tests on a lab host at the pushed head. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-22989 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest src/omnimarket/nodes/node_automation_liveness_overlay_check_compute tests/nodes/node_automation_liveness_overlay_check_effect -q --no-cov
