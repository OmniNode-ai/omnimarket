schema_version: 1.0.0
title: Omnimarket dev passes tests/ci/test_selection_stage_evidence.py with the stage gate intact; a stage advance still needs the receipt the 2026-11-21 ruling names
ticket_id: OMN-26442
summary: >-
  Six tests of tests/ci/test_selection_stage_evidence.py fail at dev head 6d15b8e833 because selection_stage is 1 in
  the selector policy while the stage gate (omnimarket#6567) requires a recomputed clean-night receipt for any stage
  above 0, and no published attribution record source is wired yet. The tree goes back to selection_stage 0, the
  stage the gate accepts with its baseline receipt, so the six tests pass and the gate is unchanged. The gate still
  refuses a stage above 0 with no receipt and a two-stage jump, and no gate test is skipped, deleted or loosened.
  Stage 1 re-lands when its receipt can be recomputed from the nightly attribution records. Not in this change: the
  source adapter for the published records and the nightly publish effect.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn26442-stage-gate-green
  statement: The stage gate tests pass on this tree, and a stage advance still needs a receipt recomputed from published records.
  acceptance:
  - id: AC1
    statement: 'AC1: the six tests of tests/ci/test_selection_stage_evidence.py that fail at dev head 6d15b8e833 pass at the pull request head -- falsifier: `uv run pytest tests/ci/test_selection_stage_evidence.py -q --no-cov -n 0 -p no:randomly` run at 6d15b8e833 (6 failed) and at the pull request head (0 failed)'
  - id: AC2
    statement: 'AC2: a tree above stage 0 with no receipt, and a two-stage jump, are still refused by the stage gate, and no stage gate test is skipped, deleted or loosened to get AC1 -- falsifier: `uv run pytest tests/ci/test_selection_stage_evidence.py -q --no-cov -n 0 -p no:randomly -k "without_a_receipt or two_stage_jump or stage_receipt_recomputed"` passes, and a mutant that drops the receipt requirement makes it fail'
  - id: AC3
    statement: 'AC3: the pull request binds its own evidence in contracts/OMN-<this ticket>.yaml and every required check reads success at its head, repo-evidence / dod-verify included -- falsifier: `onex scm pr-view OmniNode-ai/omnimarket#<n>` lists no required check that is not success, and `onex skill dod_verify` over the contract exits 0'
