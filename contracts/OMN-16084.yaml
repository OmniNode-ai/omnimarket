---
schema_version: "1.0.0"
ticket_id: "OMN-16084"
title: "CI Summary waits on its own jobs, not a wall clock"
summary: "A supersession window on an external check-run no longer ends the CI Summary wait while the run's own jobs are still pending; a finished-red own job still fails at once."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn16084-window-waits-on-jobs
  statement: "While the run's own jobs are PENDING, a skipped, failed or cancelled external row past its supersession window holds the verdict PENDING instead of failing it."
  acceptance:
  - id: AC1
    statement: 'AC1: with own jobs still running, an external row past its window leaves CI Summary PENDING; Falsifier: tests/unit/scripts/ci/test_ci_summary_gate.py::TestSupersessionWindowWaitsOnOwnJobsOmn16084::test_expired_window_stays_pending_while_own_jobs_run'
- id: req-omn16084-fail-closed
  statement: "Fail-closed is preserved: once own jobs settle the expired row fails, a finished-red own job fails at once, a conclusion no re-run replaces fails, and a future completion time fails."
  acceptance:
  - id: AC2
    statement: 'AC2: the expired row fails once own jobs have settled, a finished-red own job fails at once, timed_out and a future completion time are not held; Falsifier: tests/unit/scripts/ci/test_ci_summary_gate.py::TestSupersessionWindowWaitsOnOwnJobsOmn16084'
evidence_requirements:
- kind: tests
  description: Gate behaviour with own jobs running and settled.
  command: uv run pytest tests/unit/scripts/ci/test_ci_summary_gate.py -q -n 0 --no-cov -p no:cacheprovider
- kind: tests
  description: Poll step loop and the declared cap.
  command: uv run pytest tests/unit/workflows/test_ci_summary_poll_waits_on_jobs_omn16084.py -q -n 0 --no-cov -p no:cacheprovider
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn16084-ac1
  description: 'AC1: with own jobs still running, an external row past its window leaves CI Summary PENDING.'
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/scripts/ci/test_ci_summary_gate.py::TestSupersessionWindowWaitsOnOwnJobsOmn16084::test_expired_window_stays_pending_while_own_jobs_run -q -n 0 --no-cov -p no:cacheprovider
    cwd: .
- id: dod-omn16084-ac2
  description: 'AC2: the fail-closed cases hold once own jobs settle, on a finished-red own job, a timed_out row and a future completion time.'
