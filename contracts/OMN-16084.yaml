    check_value: uv run pytest tests/unit/workflows/test_ci_summary_poll_waits_on_jobs_omn16084.py::test_cap_is_a_declared_setting_above_the_slowest_measured_run -q -n 0 --no-cov -p no:cacheprovider
    cwd: .
