  description: 'AC1: with own jobs still running, an external row past its window leaves CI Summary PENDING.'
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/scripts/ci/test_ci_summary_gate.py::TestSupersessionWindowWaitsOnOwnJobsOmn16084::test_expired_window_stays_pending_while_own_jobs_run -q -n 0 --no-cov -p no:cacheprovider
    cwd: .
- id: dod-omn16084-ac2
  description: 'AC2: the fail-closed cases hold once own jobs settle, on a finished-red own job, a timed_out row and a future completion time.'
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/scripts/ci/test_ci_summary_gate.py -k TestSupersessionWindowWaitsOnOwnJobsOmn16084 -q -n 0 --no-cov -p no:cacheprovider
    cwd: .
- id: dod-omn16084-ac3
  description: 'AC3: the poll step waits on PENDING, fails at once on FAILURE and fails closed at the cap.'
  source: manual
