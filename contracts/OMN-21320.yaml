---
schema_version: "1.0.0"
ticket_id: "OMN-21320"
title: "Every delegation run-step publish is refused: onex.evt.omnimarket.delegation-run-step.v1 and event_type delegation.run_step are absent from the event registry, so no redaction posture resolves"
summary: "The delegate-skill run-step recorder publishes each run step with event_type delegation.run_step onto onex.evt.omnimarket.delegation-run-step.v1, and node_event_emit_effect refused every one because neither was in the event registry. The registry now declares delegation.run_step with that topic, no transform (a step carries ids, enums, timings and a short reason) and correlation_id as the partition key; the drift baseline lists the pair as emit-only."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-omn21320-ac1"
    statement: |-
      the event registry declares onex.evt.omnimarket.delegation-run-step.v1 (or event_type delegation.run_step) with a redaction posture, and a run-step publish through node_event_emit_effect is delivered instead of refused
    acceptance:
      - id: "AC1"
        statement: "AC1: the event registry declares onex.evt.omnimarket.delegation-run-step.v1 (or event_type delegation.run_step) with a redaction posture, and a run-step publish through node_event_emit_effect is delivered instead of refused -- falsifier: uv run pytest tests/unit -q -k run_step_publish_posture, a test that emits one recorded run step through the handler and fails on f9bc19a9105a"
  - id: "req-omn21320-ac2"
    statement: |-
      an in-process delegation logs no "event not delivered to onex.evt.omnimarket.delegation-run-step.v1" line
    acceptance:
      - id: "AC2"
        statement: "AC2: an in-process delegation logs no \"event not delivered to onex.evt.omnimarket.delegation-run-step.v1\" line -- falsifier: onex delegate --bus inmemory --locus in-process --json, then grep of receipt.result.capture_log for that line"
  - id: "req-omn21320-ac3"
    statement: |-
      a regression test built from the recorded refusal text of run 070ef15d-7686-4369-9f9c-ca2d507123a1 fails on the broken code and passes on the fix
    acceptance:
      - id: "AC3"
        statement: "AC3: a regression test built from the recorded refusal text of run 070ef15d-7686-4369-9f9c-ca2d507123a1 fails on the broken code and passes on the fix -- falsifier: uv run pytest tests/unit -q -k receipt_070ef15d_run_step"
