schema_version: "1.0.0"
ticket_id: OMN-23150
title: "A join check compares each overlay value with the value its consumer depends on and goes red on a mismatch, so a shell default can no longer disagree with an overlay"
summary: >-
  node_overlay_drift_compute reads, for each consumer of an overlay key that its own overlay declares, the overlay's value and the
  consumer's effective value (a shell default read by pattern, a config key, or the override variable when it is set), puts both
  in the overlay's base unit and reads NOT WORKING when they differ. A park list defined in a file the overlay lists as outside
  every overlay is reported by the same read. The consumers, paths, units and patterns come from the node's overlay with no
  default (a missing overlay is refused), and the result is one reading row the floor can show.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn23150-consumer-join
    statement: Each overlay value is compared with the value its declared consumer depends on, and a park list held outside an overlay is reported.
    acceptance:
      - id: AC1
        statement: 'AC1: for each declared consumer of an overlay key the check reads the consumer''s effective value and goes red when it differs from the overlay value -- falsifier: uv run pytest src/omnimarket/nodes/node_overlay_drift_compute -q -k consumer_value_matches_overlay'
      - id: AC2
        statement: 'AC2: a planted shell default of 5 GiB against an overlay value of 3072 MiB turns the check red and the matching pair passes -- falsifier: uv run pytest src/omnimarket/nodes/node_overlay_drift_compute -q -k planted_floor_mismatch'
      - id: AC3
        statement: 'AC3: a park list held outside an overlay is reported by the same check -- falsifier: uv run pytest src/omnimarket/nodes/node_overlay_drift_compute -q -k park_list_outside_overlay'
evidence_requirements:
  - kind: tests
    description: The node's focused tests, golden and error chain event tests, and the named breaks.
    command: uv run --frozen pytest src/omnimarket/nodes/node_overlay_drift_compute -q --no-cov
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-omn23150-consumer-value-tests
    description: The consumer-value tests pass with the change; a consumer that differs from the overlay reads NOT WORKING with both values named, and the matching consumer reads WORKING.
    source: manual
    execution_scope: hosted_and_local
    binds_ac: [AC1]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest src/omnimarket/nodes/node_overlay_drift_compute -q --no-cov -k consumer_value_matches_overlay
        cwd: .
  - id: dod-omn23150-planted-floor-tests
    description: The planted floor of 5 GiB against 3072 MiB turns the check red, and the matching pair passes.
    source: manual
    execution_scope: hosted_and_local
    binds_ac: [AC2]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest src/omnimarket/nodes/node_overlay_drift_compute -q --no-cov -k planted_floor_mismatch
        cwd: .
  - id: dod-omn23150-park-list-tests
    description: A park list defined in a file outside every overlay is reported, and the same file without it reads WORKING.
    source: manual
    execution_scope: hosted_and_local
    binds_ac: [AC3]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest src/omnimarket/nodes/node_overlay_drift_compute -q --no-cov -k park_list_outside_overlay
        cwd: .
  - id: dod-omn23150-node-tests
    description: All tests of the node pass, including the golden and error chain event tests.
    source: manual
    execution_scope: hosted_and_local
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest src/omnimarket/nodes/node_overlay_drift_compute -q --no-cov
        cwd: .
  - id: dod-omn23150-integration-proof-h053
    description: The node tests run on a lab host at the pushed sha; hosted CI cannot reach the lab, so only the local Done gate runs this unbound check; the node's probe run on h053 over planted scratch files is read in the pull request Lab line.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: 'env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23150 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest src/omnimarket/nodes/node_overlay_drift_compute -q --no-cov'
        cwd: .
