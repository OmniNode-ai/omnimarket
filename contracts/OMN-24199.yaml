  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_host_retention_effect/test_host_retention_precommit.py -q -p no:randomly --no-cov
    cwd: .
- id: dod-omn24199-ac2
  description: 'AC2: the held, locked and refused tests pass at the head; at the merge base the test file cannot import the store port.'
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_host_retention_effect/test_host_retention_precommit.py -q -k 'held or locked or refused' -p no:randomly --no-cov
    cwd: .
- id: dod-omn24199-ac3
  description: 'AC3: the seam test passes at the head; the overlay row of h101 in the overlays repository is read by the model and bounds in a lab run, because the hosted runner holds no overlays checkout.'
  source: manual
