schema_version: "1.0.0"
ticket_id: "OMN-23541"
title: "A ledger rows query with no start time reads a declared window, not the whole table"
summary: "A rows query with no start time made node_work_ledger_query_effect read the whole work_ledger_rows table (about 326 thousand rows, 22.5 s end to end) and filter afterwards. The query now reads back only a declared default window (the node's overlay field default_rows_window_days, else the contract's work_ledger_query.rows_default_window_days) from its end time, narrowed in the store, and its answer says it was bounded (bounded, bounded_window_days, window_since). A query that names a start, a row_ref or a history range reads as before. The seam with the board's rows readers is pinned by a seam test."
is_seam_ticket: true
interface_change: true
interfaces_touched:
  - public_api
requirements:
  - id: "req-omn23541-bounded-rows-read"
    statement: "A rows query with no start time reads a declared default window from the node's overlay, never a hard-coded number, and says in its answer that it was bounded."
    acceptance:
      - id: "AC1"
        statement: "AC1: a rows query with no start reads only the declared window and the answer carries bounded, bounded_window_days and the window start -- falsifier: uv run pytest tests/unit/nodes/node_work_ledger_query_effect/test_rows_default_window_omn23541.py fails at the base commit (the answer has no bounded field)"
      - id: "AC2"
        statement: "AC2: the window comes from the node's overlay (else the declared contract default), an invalid overlay refuses, and a query that names a start is not bounded -- falsifier: the overlay, explicit-start and invalid-overlay tests in the same file fail when the number is hard-coded or the overlay is ignored"
      - id: "AC3"
        statement: "AC3: the seam with the board's rows readers holds on the in-memory bus and the real broker -- falsifier: uv run pytest tests/nodes/node_floor_delegation_effect/test_seam_ledger_bounded_rows.py fails when either side renames or drops a field the other reads"
      - id: "AC4"
        statement: "AC4: integrated: after a dev runtime roll that carries this change, a rows query with no start sent through the bus read command is answered with bounded true in far less than the 22.5 s measured at the base -- falsifier: the same query on the runtime before the roll answers with no bounded field"
evidence_requirements:
  - kind: "tests"
    description: "AC1 to AC3: the bounded read tests, the golden and error chain tests of the query node and the seam test."
    command: "uv run pytest tests/unit/nodes/node_work_ledger_query_effect/test_rows_default_window_omn23541.py tests/nodes/node_floor_delegation_effect/test_seam_ledger_bounded_rows.py -q --no-cov -p no:randomly"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn23541-ac1-bounded"
    description: "AC1: the bounded read tests pass; they fail at the base because the answer has no bounded field."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/nodes/node_work_ledger_query_effect/test_rows_default_window_omn23541.py -q --no-cov -p no:randomly"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC1", "AC2"]
  - id: "dod-omn23541-ac3-seam"
    description: "AC3: the seam test over the board readers' request and answer passes."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_floor_delegation_effect/test_seam_ledger_bounded_rows.py tests/nodes/node_floor_delegation_effect/test_seam_ledger_read_node.py -q --no-cov -p no:randomly"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC3"]
  - id: dod-omn23541-ac4-hosted-proxy
    description: "AC4 hosted proxy: a rows query with no start is answered bounded, with the window start and days on the answer; the lab readback on the dev runtime after a roll is the integrated proof."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/nodes/node_work_ledger_query_effect/test_rows_default_window_omn23541.py -k golden_no_since -q --no-cov -p no:randomly"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC4"]
  - id: dod-omn23541-integration-proof
    description: The pushed head ran the bounded read tests and the seam tests on a lab host through the lab work runner and exited 0. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: 'env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23541 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/nodes/node_work_ledger_query_effect/test_rows_default_window_omn23541.py tests/nodes/node_floor_delegation_effect/test_seam_ledger_bounded_rows.py -q --no-cov'
        cwd: .
