title: "omnimarket adopts the receipt-gate that keeps work-contract digest swaps pin-only"
summary: "Bot core-pin-bump PRs rewrite the environment.sha256 digests in src/omnimarket/configs/work_contracts/contracts/*.yaml. The receipt-gate at dev-20261101005012-ac2f26e3e5bf refuses the writer pin-only exemption for those files ('pin swap: path is not allowed ... F01-01.yaml'), so those PRs fail Repo Evidence Dependency. omnibase_core#2214 (merge commit 2fc5e461f) fixes the gate. The caller now calls receipt-gate.yml at dev-20261101103701-2fc5e461fca7. The test-side pin constant and the action-ref golden move with it in the same commit, and the caller's with: inputs are unchanged."
is_seam_ticket: false
