schema_version: 1.0.0
ticket_id: OMN-23039
title: The canonical clone dirty-converge tick leaves every clone alone while the dev deploy agent holds its image-build lock
summary: The dev deploy agent stages its siblings into the canonical omnibase_infra clone and builds from it under the reconcile-host mkdir lock. The dirty-converge tick read the staged placeholders as a dirty clone and hard-reset it mid-build, so the second image build copied the placeholder and failed on empty provenance (deploy jobs 69268d1b and 5eb50a7d on 2026-11-08). The tick now skips every clone while a build lock is held by a live holder and younger than a declared age.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23039-converge-honors-build-lock
  statement: The dirty-converge tick converges no clone while the deploy agent's image-build lock is held by a live holder; a lock past its declared age, or whose holder process on this host is gone, no longer holds the clones.
  acceptance:
  - id: AC1
    statement: 'AC1: a dirty or detached clone is left alone while the deploy agent holds the reconcile-host lock, and converges once the lock is stale or its holder is gone -- falsifier: uv run pytest of the dirty-converge node tests, red with the lock check removed from the handler'
- id: req-omn23039-credential-routes-in-runtime
  statement: The three inference-credential routes are answered by the runtime on its own HTTP port.
  acceptance:
    - id: AC5
      statement: 'AC5: POST, GET and DELETE under /v1/tenants/me/inference-credentials answer on the runtime''s real HTTP mount (submit 201 with ref and metadata and never the value, list the caller''s own refs, revoke an owned ref) -- falsifier: uv run pytest tests/nodes/node_inference_credentials/test_http_runtime_mount.py fails, and the same requests against a runtime built without the node''s contract answer 404 (the injected-break test)'
    - id: AC6
      statement: 'AC6: no read and no write runs unless the caller resolves to a tenant (503 with no resolver bound, 401 for an anonymous or unknown credential), a revoke of another tenant''s ref answers 404 and never reaches the publisher, and the key value appears in no response or log line -- falsifier: uv run pytest tests/nodes/node_inference_credentials/test_error_chain_inference_credentials.py fails when the ownership check is bypassed'
    - id: AC7
      statement: 'AC7: the route inventory records the three identities as served by this node''s contract, so the strict reading of the one-container control moves with the port -- falsifier: uv run pytest tests/integration/onex_api_fold fails if an identity is recorded served without a mount, or pending while one covers it'
evidence_requirements:
- kind: tests
  description: The dirty-converge node tests pass, including the planted clone held by a live lock, a stale lock and a dead holder
  command: uv run --frozen pytest tests/unit/clone_dirty_converge -q --no-cov
- kind: tests
  description: Route behaviour, fail-closed refusals and the real runtime mount.
  command: uv run --frozen pytest tests/nodes/node_inference_credentials tests/integration/onex_api_fold -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23039-build-lock
  description: Runs the dirty-converge node tests; the six lock tests fail on the base branch, where a clone held by the lock is converged.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/clone_dirty_converge -q --no-cov
    cwd: .
- id: dod-omn23039-integration-proof
  description: Run the build-lock tests on a lab host at the pushed head against that host's real canonical clone sync engine and converge script. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23039 --kind test -- sh -c 'ONEX_TEST_OMNICLAUDE_ROOT="$OMNI_HOME/omniclaude" PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/clone_dirty_converge -k "build_lock or image_build" -q --no-cov'
    cwd: .
- id: credential-routes-on-runtime-mount
  description: >
    The golden chain, the error chain and the real runtime mount for the node, with
    the injected break (a runtime without the node's contract answers 404).
  source: manual
  binds_ac: [AC5]
  checks:
    - check_type: test_passes
      check_value: uv run --frozen pytest tests/nodes/node_inference_credentials/test_golden_chain_inference_credentials.py tests/nodes/node_inference_credentials/test_http_runtime_mount.py -q --no-cov --refuse-skips
      cwd: .
- id: credential-routes-fail-closed
  description: >
    Unbound, anonymous, unknown, cross-tenant, read-failure and publisher-failure
    cases, each naming the side effect that must not happen.
  source: manual
  binds_ac: [AC6]
  checks:
    - check_type: test_passes
      check_value: uv run --frozen pytest tests/nodes/node_inference_credentials/test_error_chain_inference_credentials.py -q --no-cov --refuse-skips
      cwd: .
- id: onex-api-route-inventory-moves
  description: >
    The T18c route inventory records the three identities served, and the
    strict one-container reading still holds for the recorded set.
  source: manual
  binds_ac: [AC7]
  checks:
    - check_type: test_passes
      check_value: uv run --frozen pytest tests/integration/onex_api_fold -q --no-cov --refuse-skips
      cwd: .
- id: credential-routes-integration-proof
  description: >
    The pushed head ran the node's tests and the route inventory on a lab host
    through the bus and exited 0. Hosted CI cannot reach the lab, so only the
    local Done gate runs this check.
  source: manual
  execution_scope: local_done_gate
  checks:
    - check_type: command
      check_value: >-
        uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane inferport-0855 -- uv run --frozen pytest tests/nodes/node_inference_credentials tests/integration/onex_api_fold -q --no-cov
      cwd: .
- id: credential-published-source-probe
  description: >
    Hosted deploy check of the published source at this checkout's exact commit:
    the node's contract declares its mount prefix and its handler binding. It
    checks the published artifact and does not attest a running deployment.
  source: manual
  checks:
    - check_type: command
      check_value: |-
        set -euo pipefail;
        probe_dir=$(mktemp -d);
        trap 'rm -rf "$probe_dir"' EXIT;
        root="https://raw.githubusercontent.com/OmniNode-ai/omnimarket/$(git rev-parse HEAD)/src/omnimarket/nodes";
        curl --fail --silent --show-error --location --max-time 30 "$root/node_inference_credentials/contract.yaml" --output "$probe_dir/credentials.yaml";
        grep -q 'path_prefix: "/v1/tenants/me/inference-credentials"' "$probe_dir/credentials.yaml";
        grep -q 'name: HandlerInferenceCredentials' "$probe_dir/credentials.yaml"
      cwd: .
