schema_version: 1.0.0
ticket_id: OMN-23039
title: The canonical clone dirty-converge tick leaves every clone alone while the dev deploy agent holds its image-build lock
summary: The dev deploy agent stages its siblings into the canonical omnibase_infra clone and builds from it under the reconcile-host mkdir lock. The dirty-converge tick read the staged placeholders as a dirty clone and hard-reset it mid-build, so the second image build copied the placeholder and failed on empty provenance (deploy jobs 69268d1b and 5eb50a7d on 2026-11-08). The tick now skips every clone while a build lock is held by a live holder and younger than a declared age.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23039-converge-honors-build-lock
  statement: The dirty-converge tick converges no clone while the deploy agent's image-build lock is held by a live holder; a lock past its declared age, or whose holder process on this host is gone, no longer holds the clones.
  acceptance:
  - id: AC1
    statement: 'AC1: a dirty or detached clone is left alone while the deploy agent holds the reconcile-host lock, and converges once the lock is stale or its holder is gone -- falsifier: uv run pytest of the dirty-converge node tests, red with the lock check removed from the handler'
evidence_requirements:
- kind: tests
  description: The dirty-converge node tests pass, including the planted clone held by a live lock, a stale lock and a dead holder
  command: uv run --frozen pytest tests/unit/clone_dirty_converge -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23039-build-lock
  description: Runs the dirty-converge node tests; the six lock tests fail on the base branch, where a clone held by the lock is converged.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/clone_dirty_converge -q --no-cov
    cwd: .
- id: dod-omn23039-integration-proof
  description: Run the build-lock tests on a lab host at the pushed head against that host's real canonical clone sync engine and converge script. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23039 --kind test -- sh -c 'ONEX_TEST_OMNICLAUDE_ROOT="$OMNI_HOME/omniclaude" PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/clone_dirty_converge -k "build_lock or image_build" -q --no-cov'
    cwd: .
