    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-25296 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_host_retention_effect/test_runtime_host_retention_tick.py tests/nodes/node_host_installer_registry_units/test_host_retention_uv_cache_unit.py -q --no-cov -p no:randomly
