  description: Runs the size-band paid-rule tests. A small and a medium request whose free rung is unavailable skip the paid rung with cause size_band_below_paid and the run ends returned_to_caller; a large request is answered on the paid rung; the control with no band declared reaches the paid rung with a small request.
  source: manual
  binds_ac:
