schema_version: 1.0.0
ticket_id: OMN-23180
title: A large task may climb to a paid model while a small one stays on free models, by a size band the contract declares
summary: The measured size band (S up to 4000 tokens, M up to 16000, L above) rode on the routing decision but no rule read it. The contract now declares paid_from_size_band (default L, by the operator ruling of 2026-11-08T13:46:43Z; a class may override it under escalation_policy), the escalation decision node reads it for a paid rung and returns a skip with cause size_band_below_paid, and the local dispatch records that skip under skipped_rungs. A small request whose free rungs are unavailable ends returned_to_caller; a large one is accepted on the paid rung. No bound or check is widened.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23180-size-band-paid-rule
  statement: A paid rung is reached only by a request whose measured size band is at or above the band the contract declares.
  acceptance:
  - id: AC1
    statement: 'AC1: an S request whose free rungs are all unavailable ends returned_to_caller with the paid rung recorded as a skip, and an L request with the same rungs is accepted on the paid rung -- falsifier: `uv run pytest tests/unit/delegation/test_size_band_paid_rule.py -q`'
evidence_requirements:
- kind: tests
  description: The size-band paid-rule tests, including the control that reaches the paid rung with the rule removed, pass.
  command: uv run --frozen pytest tests/unit/delegation/test_size_band_paid_rule.py -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
