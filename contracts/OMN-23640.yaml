schema_version: 1.0.0
ticket_id: OMN-23640
title: 'Delegation health checks: fix the local-server, paid-model and installer entries that keep three checks red'
summary: Scenario R2 failed because its settings overlay named a model id the local server does not list and a second server that was retired. Scenario R3's paid leg failed because its 16 token cap cut every real answer off and the delegation quality gate refused it, which ended the run on the escalation limit. Scenarios R3, R5 and R8 had no registry installer declaration. The R2 overlay now names the listed model id and a live second server, R3's cap is raised so a one-sentence answer finishes, and R3, R5 and R8 each get a tick module and a unit declaration the installer owns. R4 and R5 stay red on purpose, each blocked on a shared request-format change that is not part of this ticket.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23640-scenario-units
  statement: Each delegation readiness scenario that can pass is a declared unit of the registry installer, and the settings it reads name values the servers it calls actually serve.
  acceptance:
  - id: AC1
    statement: 'AC1: scenario R2''s overlay names a model id its first local server lists and a second server on a different address -- falsifier: uv run pytest tests/nodes/node_delegation_scenario_r2_effect/test_local_settings_overlay.py -q (red against the old overlay)'
  - id: AC2
    statement: 'AC2: scenario R3''s paid leg finishes under the contract''s token cap and is cut off under the old cap of 16 -- falsifier: uv run pytest tests/nodes/node_delegation_scenario_r3_effect/test_golden_chain_scenario_r3_effect.py -q -k leg_b'
  - id: AC3
    statement: 'AC3: scenarios R3, R5 and R8 are declared units of the registry installer and render a unit with their own tick module -- falsifier: uv run pytest tests/nodes/node_host_installer_registry_units/test_scenario_r3_r5_r8_units.py -q'
  - id: AC4
    statement: 'AC4: integrated: on lab host h201, scenarios R2, R3 and R8 installed from the branch through the registry installer each ran once and their result rows are read from the running host -- falsifier: the last-run record and events journal under the scenario state directory on h201 name the branch revision and a conclusion for each scenario'
evidence_requirements:
- kind: tests
  description: The R2 overlay tests, the R3 leg b tests and the unit declaration tests at the pushed head. The R3 control with the old cap of 16 comes out red by design.
  command: uv run --frozen pytest tests/nodes/node_delegation_scenario_r2_effect/test_local_settings_overlay.py tests/nodes/node_delegation_scenario_r3_effect/test_golden_chain_scenario_r3_effect.py tests/nodes/node_host_installer_registry_units/test_scenario_r3_r5_r8_units.py -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23640-ac1-r2-overlay
  description: The overlay test passes at the pushed head; against the overlay at origin/dev the first model id resolves to the stored alias the server does not list.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_delegation_scenario_r2_effect/test_local_settings_overlay.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn23640-ac2-r3-cap
  description: The leg b tests pass at the pushed head, including the control that gives the old cap of 16 and reads the truncated answer refused.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_delegation_scenario_r3_effect/test_golden_chain_scenario_r3_effect.py tests/nodes/node_delegation_scenario_r3_effect/test_r3_inputs.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn23640-ac3-units
  description: The unit declaration tests pass at the pushed head, including the refusal of an install with no host name and of a checkout without the tick entry file.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_host_installer_registry_units/test_scenario_r3_r5_r8_units.py tests/nodes/node_delegation_scenario_r3_effect/test_scenario_r3_tick.py tests/nodes/node_delegation_scenario_r5_effect/test_scenario_r5_tick.py tests/nodes/node_delegation_scenario_r8_effect/test_scenario_r8_tick.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn23640-ac4-runtime
  description: The last-run records of scenarios R2, R3 and R8 on the lab host h201 after an install from the branch. Hosted CI cannot reach the lab host, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  binds_ac:
  - AC4
  checks:
  - check_type: command
    check_value: 'cat .local/state/omni/delegation-scenario-r2/last-run.json .local/state/omni/delegation-scenario-r3/last-run.json .local/state/omni/delegation-scenario-r8/last-run.json'
    cwd: .
