schema_version: 1.0.0
ticket_id: OMN-23119
title: Contract and evidence for node_runtime_boot_set_compute, the declared boot set judgment of the one-runtime plan (T28)
summary: node_runtime_boot_set_compute judges one runtime boot against the boot set its deployment declares. Today's dev start announces 1,153 contracts, has 638 command contracts to attach and subscribes 2,919 distinct topics with no declared set; the node reads that start FAIL, names the contracts and topics outside a declared set, and hands the overlay the ONEX_RUNTIME_NODE_SELECTION value for the declared set.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23119-declared-boot-set
  statement: A boot with no declared set, or one that loads a contract or subscribes a topic outside the declared set, reads FAIL with the rule named and the excess listed; a boot inside the declared set reads PASS; a boot that was not read reads UNKNOWN and fails.
  acceptance:
  - id: AC1
    statement: 'AC1: replaying the dev runtime start read on 2026-11-09 (638 contracts to attach, 2,919 distinct topics subscribed, no declared set) reads FAIL with NO_DECLARED_SET, and a boot inside a declared set reads PASS -- falsifier: uv run pytest tests/nodes/node_runtime_boot_set_compute/test_runtime_boot_set.py -q -k "control or inside_the_declared_set", failing at the merge base where the node is absent'
  - id: AC2
    statement: 'AC2: the golden and error chain events end in one judged event for a declared boot and one violated event naming the rules for today''s start, and each chain assertion turns red on its named break -- falsifier: uv run pytest tests/nodes/node_runtime_boot_set_compute/test_runtime_boot_set_chain_events.py -q'
evidence_requirements:
- kind: tests
  description: The boot set unit tests, the replay of today's dev start as the failing control, and the golden and error chain event tests with their named breaks.
  command: uv run --frozen pytest tests/nodes/node_runtime_boot_set_compute -q --no-cov -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23119-boot-set-tests
  description: Runs the boot set judgment tests. The control replays today's dev start with no declared set and reads FAIL; a start against a declared set names every contract and topic outside it; a boot inside the declared set reads PASS; an unannounced name, a dropped declared contract, a declaration for another deployment and an unread boot each read as their rule. The selection value parses back to the declared set through omnibase_infra's own reader. Absent at the merge base, so the command fails there.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_runtime_boot_set_compute/test_runtime_boot_set.py -q --no-cov -p no:randomly
    cwd: .
- id: dod-omn23119-boot-set-chain-events
  description: Runs the golden chain and error chain event tests on the in-memory bus. A declared boot ends in one judged event; today's start ends in one violated event naming the rules; a payload that is no request ends in a typed failure event; four named breaks (ignored excess, today's start in place of a declared boot, dropped result event, wrong rule named) each turn a chain assertion red. Absent at the merge base, so the command fails there.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_runtime_boot_set_compute/test_runtime_boot_set_chain_events.py -q --no-cov -p no:randomly
    cwd: .
