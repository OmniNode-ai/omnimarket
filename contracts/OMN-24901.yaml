schema_version: 1.0.0
ticket_id: OMN-24901
title: The worktree reconcile tick skips a failed transient unit whose environment file is gone
summary: The unit reader of node_worktree_reconcile_effect raised UnitSnapshotError for a failed transient unit whose required environment file no longer existed, which kept and failed every tree (failures=22 of scanned=22, exit 1). It now skips a transient, not-running unit that names no worktree with a typed skipped_units entry (unit, reason environment_file_missing, path) and keeps scanning. An installed unit, a worktree unit and an active unit with a missing required environment file still raise.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24901-skip-gone-env
  statement: A transient failed unit with a gone environment file is a typed skip the tick's report carries, and every other missing required environment file still fails the snapshot.
  acceptance:
  - id: AC1
    statement: 'AC1: a failed transient unit with a missing required environment file is skipped with reason environment_file_missing and its path, the scan completes and the run reports failures 0 -- falsifier: uv run pytest tests/test_worktree_reconcile_gone_env.py -q fails at the merge base and passes at the PR head'
  - id: AC2
    statement: 'AC2: an installed unit, a worktree unit and an active transient unit with a missing required environment file still raise UnitSnapshotError -- falsifier: uv run pytest tests/test_worktree_reconcile_gone_env.py -q -k still_raises fails when the skip is widened to them'
evidence_requirements:
- kind: tests
  description: The gone-environment-file tests and the existing worktree reconcile tests.
  command: env -u PYTHONPATH uv run --frozen pytest tests/test_worktree_reconcile_gone_env.py tests/test_worktree_reconcile_units.py tests/test_worktree_reconcile_effect.py tests/test_golden_chain_worktree_reconcile.py -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24901-ac1-skip
  description: A failed transient unit with a gone environment file is skipped with the typed reason, the scan finishes and the run chain reports no failure.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/test_worktree_reconcile_gone_env.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24901-ac2-still-raises
  description: The installed unit, the worktree unit, the worktree environment file, the active unit and the unreadable state each still raise.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/test_worktree_reconcile_gone_env.py -q -k still_raises --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24901-integration-proof-h051
  description: At the pushed revision the h051 lab worker runs the gone-environment-file tests, and the installed reconcile unit's next tick on h051 exits 0 with the three failed transient units still present.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: >-
      onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)"
      --host h051 --lane dod-integration-proof-24901 --kind test --
      uv run --frozen --python 3.12 pytest tests/test_worktree_reconcile_gone_env.py
      -q --no-cov -n 0 -p no:randomly
    cwd: .
