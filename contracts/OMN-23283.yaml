schema_version: 1.0.0
ticket_id: OMN-23283
title: A lab lane can commit a merge of dev into a PR branch because the ticket-contract prerequisite judges only the PR's own entries and its regression suite runs in a lab worktree
summary: The ticket-contract prerequisite no longer charges a pull request with contract entries and changed paths that the base tip already holds with the same content, so a merge of dev passes whether the caller hands the hook the committed two-parent merge or the staged tree on the old head alone. Every entry and path the pull request itself adds or changes still differs from the base tip and is still refused. The regression suite starts each control without the hook-run refs a lab pre-check exports, so it passes from a linked worktree. No check is widened and no bound is changed.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23283-judge-own-entries
  statement: The prerequisite judges only the entries and paths the pull request adds or changes against the base tip, and the suite runs from a lab worktree.
  acceptance:
  - id: AC1
    statement: 'AC1: ticket-contract-prerequisite judges only contract entries the PR adds or changes against its merge base, so a merge commit of dev that brings in another ticket''s entries passes, and an entry the PR itself adds without its prerequisite is still refused -- falsifier: uv run pytest tests -q -k ticket_contract_prerequisite, failing with the old whole-file read restored'
  - id: AC2
    statement: 'AC2: the regression suite''s base lookup works in a linked lab worktree -- falsifier: uv run pytest tests -q -k test_missing_base run from a git worktree add checkout, failing on the old code with rev-parse exit 128'
evidence_requirements:
- kind: tests
  description: The staged-merge controls and the existing prerequisite suites pass.
  command: uv run --frozen pytest tests/nodes/node_ticket_contract_prerequisite_effect -q -n 0 --no-cov -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23283-ac1-staged-merge
  description: Runs the staged-merge controls. A staged and a committed merge of dev pass; the pull request's own umbrella entry and its own runtime path are still refused and the dev entries and paths are not named in the refusal.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_ticket_contract_prerequisite_effect/test_staged_merge_omn23283.py tests/nodes/node_ticket_contract_prerequisite_effect/test_umbrella_append_omn19998.py tests/nodes/node_ticket_contract_prerequisite_effect/test_stale_base_omn21887.py -q -n 0 --no-cov -p no:randomly
    cwd: .
- id: dod-omn23283-ac2-missing-base
  description: Runs the missing-base controls with a leaked hook ref in the environment, as the lab pre-check exports one. They pass because the suite clears the hook-run refs before each control.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: command
    check_value: env PRE_COMMIT_TO_REF=0000000000000000000000000000000000000000 uv run --frozen pytest tests/nodes/node_ticket_contract_prerequisite_effect/test_missing_base.py -q -n 0 --no-cov -p no:randomly
    cwd: .
- id: dod-omn23283-integration-proof
  description: Run this pull request's own check on a lab host at the pushed head. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23283 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_ticket_contract_prerequisite_effect -q -n 0 --no-cov -p no:randomly
    cwd: .
