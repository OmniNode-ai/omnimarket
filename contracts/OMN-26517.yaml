  acceptance:
  - id: AC1
    statement: 'AC1: the three tests are named with their error lines and classed as failing on origin/dev or only on 6633, with the merge that caused each found -- falsifier: uv run pytest tests/unit/scripts/test_application_relation_inventory.py -q run at origin/dev and at the 6633 head, output quoted in the lane TERMINAL'
  - id: AC2
    statement: 'AC2: the cause is fixed with no skip and no widened check, and a regeneration comes from the declared generator, not a hand edit -- falsifier: uv run pytest tests/unit/scripts/test_application_relation_inventory.py -q fails before the fix and passes after it'
  - id: AC3
    statement: 'AC3: the fix is a pull request against dev, or a commit on the 6633 branch if the cause is its own, with required checks green and handed to the landing controller, and the orchestrator sent one message naming it -- falsifier: onex scm pr-view OmniNode-ai/omnimarket#<n> shows required checks green and the ledger holds one MSG to orchestrator-31d9-swarm naming the pull request'
evidence_requirements:
- kind: tests
  description: The application relation inventory tests pass at the pushed head.
