schema_version: 1.0.0
ticket_id: OMN-23561
title: 'The scheduled readiness timers carry the setting that names the bus address file'
summary: 'The schedule blocks of the R2, R3, R4, R5 and R6 scenario nodes list ONEX_WORKSPACE_CONFIG_ROOT among the variables a rendered unit copies from the installing environment, so a scheduled run can resolve the bus lane declaration and write its ledger row.'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23561-ac1
  statement: 'Each scenario node schedule block names ONEX_WORKSPACE_CONFIG_ROOT in its unit environment and the rendered unit carries the value from the installing environment, and only then.'
  acceptance:
  - id: AC1
    statement: 'AC1: each scenario node schedule block (R2, R3, R4, R5, R6) names ONEX_WORKSPACE_CONFIG_ROOT among its unit environment variables and the rendered unit carries the value from the installing environment -- falsifier: `uv run pytest tests/nodes/test_scenario_unit_environment_workspace_root.py -q`'
evidence_requirements:
- kind: tests
  description: 'The unit environment tests pass for all five scenarios; at the merge base the contracts do not list the variable and the declared-variable and rendered-line tests fail.'
  command: uv run --frozen pytest tests/nodes/test_scenario_unit_environment_workspace_root.py -q --no-cov -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23561-unit-environment-tests
  description: 'The unit environment tests pass for R2, R3, R4, R5 and R6.'
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: 'uv run --frozen pytest tests/nodes/test_scenario_unit_environment_workspace_root.py -q --no-cov -p no:randomly'
    cwd: .
- id: dod-omn23561-integration-proof-lab
  description: 'Runs the unit environment tests at the pushed head on a lab host through the lab work runner; hosted CI cannot reach the lab runner, so only the local Done gate runs this unbound check.'
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: 'env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23561 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/test_scenario_unit_environment_workspace_root.py -q --no-cov -p no:randomly'
