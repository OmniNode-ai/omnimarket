schema_version: 1.0.0
ticket_id: OMN-24205
title: Work log lines from scheduled checks carry the machine stamp
summary: The work ledger append node stamps via=bus:<requesting host> after the request cell of every accepted row that lacks it, so rows from scheduled node writers (about 1000 STATUS rows a day) carry the bus stamp the cutover plan L2 bar counts, and a request accepted before the change is still a duplicate on redelivery.
is_seam_ticket: true
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24205-via-stamp
  statement: Every row the append node accepts carries a via=bus cell naming the requesting host.
  acceptance:
  - id: AC1
    statement: 'AC1: an accepted append row that has no bus stamp cell gains via=bus:<requesting host> as its last cell, for every row kind. -- falsifier: uv run pytest tests/unit/nodes/node_work_ledger_append_effect/test_via_stamp.py -k stamps_every_kind'
  - id: AC2
    statement: 'AC2: a row that already carries a via=bus cell keeps it once and gains no second one. -- falsifier: uv run pytest tests/unit/nodes/node_work_ledger_append_effect/test_via_stamp.py -k keeps_an_existing_stamp'
  - id: AC3
    statement: 'AC3: a redelivered request that landed before this change answers duplicate and is not refused as different rows. -- falsifier: uv run pytest tests/unit/nodes/node_work_ledger_append_effect/test_via_stamp.py -k redelivery_of_an_unstamped_request'
  - id: AC4
    statement: 'AC4: the row shape a node writer sends, stamped by the real append handler, parses with the ledger row grammar and exposes its via cell. -- falsifier: uv run pytest tests/unit/nodes/node_work_ledger_append_effect/test_via_stamp.py -k seam_with_the_node_writer'
  - id: AC5
    statement: 'AC5: integrated: on the ledger host running this revision, a row sent by a scheduled check carries via=bus:<its host>, and rows lacking via= stamped over the next UTC day count 0. -- falsifier: read the live ledger rows of one UTC day after the install and count the rows without a via= cell'
evidence_requirements:
- kind: tests
  description: The append node stamp tests pass at the pushed head.
  command: uv run --frozen pytest tests/unit/nodes/node_work_ledger_append_effect/test_via_stamp.py tests/unit/nodes/node_work_ledger_append_effect/test_handler_work_ledger_append_effect.py tests/unit/work_ledger_bus/test_work_ledger_append_bus.py -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
