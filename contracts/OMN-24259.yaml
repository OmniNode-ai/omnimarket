schema_version: 1.0.0
ticket_id: OMN-24259
title: Record the Claude account each new lane starts under on the lane's start record
summary: The lane start node writes a pool_label cell beside login on the start record (CLAIM row) it appends, from the one label its token pool draw found; none when the pool draws nothing, and no record when the pool refuses the start. The pool node's steering reader keeps reading login, which stays unchanged.
is_seam_ticket: true
interface_change: true
interfaces_touched:
- topics
requirements:
- id: req-omn24259-pool-label-cell
  statement: The start record the lane start node writes names the pool label the lane starts under in a pool_label cell, next to the unchanged login cell.
  acceptance:
  - id: AC1
    statement: 'AC1: the test for the lane start-up step''s pool_label cell passes -- falsifier: running that test fails when pool_label is missing or wrong with a drawn account'
  - id: AC2
    statement: 'AC2: the refused-start test shows no record written -- falsifier: the test finds a start record written after the pool refuses the start'
  - id: AC3
    statement: 'AC3: a read of the ledger after a new lane starts on a lab host shows a start record with pool_label -- falsifier: a search of the ledger in the running runtime after a new lane start returns no start record carrying pool_label'
evidence_requirements:
- kind: tests
  description: The pool label cell tests pass at the pushed head.
  command: uv run pytest src/omnimarket/nodes/node_remote_lane_start_orchestrator/tests/test_remote_lane_start_pool_label_cell.py -q -p no:randomly --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24259-ac1
  description: 'AC1: a drawn label rides on the start record as pool_label and login, and a pool that draws nothing writes pool_label=none; with no draw wired neither cell is written (the failing control).'
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest src/omnimarket/nodes/node_remote_lane_start_orchestrator/tests/test_remote_lane_start_pool_label_cell.py -q -p no:randomly --no-cov
    cwd: .
- id: dod-omn24259-ac2
  description: 'AC2: a pool that refuses the start at its lanes-per-label cap ends the start with login-refused and no start record.'
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest src/omnimarket/nodes/node_remote_lane_start_orchestrator/tests/test_remote_lane_start_pool_label_cell.py -q -p no:randomly --no-cov -k refused
    cwd: .
- id: dod-omn24259-ac3
  description: 'hosted proxy for AC3: the cell tests pass here; the read of a new start record on the ledger from the running runtime, or the exact step left, is posted as a pull request comment naming the head.'
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest src/omnimarket/nodes/node_remote_lane_start_orchestrator/tests/test_remote_lane_start_pool_label_cell.py -q -p no:randomly --no-cov
    cwd: .
- id: dod-omn24259-integration-proof
  description: the cell tests run on a lab host at the pushed head; hosted CI cannot reach the lab, so only the local Done gate runs this unbound check
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24259 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest src/omnimarket/nodes/node_remote_lane_start_orchestrator/tests/test_remote_lane_start_pool_label_cell.py -q --no-cov -p no:randomly
