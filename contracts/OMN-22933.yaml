schema_version: 1.0.0
ticket_id: OMN-22933
title: The commit-hooks floor row - the seam three-part-proof tests read the same on every runner, including one whose pytest temp root sits inside a git directory
summary: The two planted-fault tests of node_seam_conservation_compute (three-part proof, AC2 of OMN-22020) copy the seam contracts under pytest's temp root. The event chain walker's own contract excludes every path under a .git directory, so on a runner that keeps the temp root inside a git directory (the lane hook-preflight does) every copied contract read as absent, the planted faults went unrefused and the hook blocked every omnimarket commit. The test now moves the corpus out of any .git path and asserts it. The walker's exclusion and the checks are unchanged.
