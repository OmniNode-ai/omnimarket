  statement: The seam three-part-proof tests read the same result whether pytest's temp root is an ordinary directory or sits inside a git directory.
  acceptance:
  - id: AC1
    statement: 'AC1: the seam three-part-proof tests pass with pytest''s temp root inside a .git directory, where the unchanged test file fails two of them -- falsifier: PYTEST_DEBUG_TEMPROOT=<dir>/.git/tmproot uv run pytest src/omnimarket/nodes/node_seam_conservation_compute/tests/test_three_part_proof.py -q --no-cov'
