- id: dod-omn18300-deploy-wire
  description: 'Hosted deploy probe: execute the inline-source boundary regression and read the model from GitHub
    at the checked-out head. The base keeps test_files private and fails both checks. This verifies the shipped
    source, not a live deployment.'
  source: manual
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/delegation/test_inline_named_tests_roundtrip_omn18300.py -q -n 0 -p no:randomly
      --no-cov
    cwd: ${OMNI_HOME}/omnimarket
  - check_type: command
    check_value: 'bash -o pipefail -c ''gh api "repos/OmniNode-ai/omnimarket/contents/src/omnimarket/models/delegation/wire/model_named_test_run_request.py?ref=$(git
      rev-parse HEAD)" --jq .content | base64 -d | grep -F "    test_files: tuple[ModelNamedTestFile, ...] = Field("
      > /dev/null'''
    cwd: ${OMNI_HOME}/omnimarket
  binds_ac:
  - DoD8
