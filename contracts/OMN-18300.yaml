schema_version: 1.0.0
ticket_id: OMN-18300
title: Delegation inline-source serialization and bounded no-answer escalation
summary: 'Runtime defect increment prompted by scenario failures. Reuses existing epic benchmark evidence and adds
  historical threshold analysis and an execution-surface proposal. Does not claim a new model qualification, deployment,
  or C14 closure. The F05 collection wrapper was generated by a prior lane outside this repository; packaging guidance
  is recorded without altering that frozen evidence. AC6 and AC7 use lane-private report evidence and are explicitly
  local_done_gate: hosted CI must report them not evaluated. The local report is retained in delegation receipts
  for the launching host; the KB gate forbids a report Markdown file in this repository.'
is_seam_ticket: true
interface_change: true
interfaces_touched:
- public_api
requirements:
- id: req-capability-ladder
  statement: Preserve the epic acceptance criteria. Existing benchmark evidence is reused; runtime fixes do not
    close C14 or requalify a model.
  acceptance:
  - id: AC1
    statement: AC1. Six rungs, at least four real tasks each, every bundle committed as a fixture carrying its exact
      fed text, so a rerun is byte-reproducible.
  - id: AC2
    statement: AC2. Every scorer is mechanical where the rung states it is; the rubric parts are a fixed checklist,
      not a judgement call.
  - id: AC3
    statement: AC3. R4 scoring executes the produced test against the real function AND against a mutated copy;
      a test that passes both is scored as not discriminating.
  - id: AC4
    statement: AC4. R6 scoring applies the patch and runs the focused test off the launching host, or focused-only,
      never a broad local suite.
  - id: AC5
    statement: AC5. Every run records delegation id, tier, backend, model, tokens, cost, wall time, quality-gate
      score, leak fraction, and the mechanical result.
  - id: AC6
    statement: AC6. The report states both thresholds explicitly and recommends what real work to route where today.
  - id: AC7
    statement: 'AC7. The execution-surface proposal names the safety rails: read-only by default, allowlisted commands,
      a worktree per task, no credential access, the lab only.'
- id: req-runtime-defects
  statement: Fix named-test serialization and allow no-answer escalation without bypassing the decision contract.
  acceptance:
  - id: DoD8
    statement: Inline sources round-trip through the deployed wire decoder and nested runner request, retaining
      path, source and execution result.
  - id: DoD9
    statement: No-answer and timeout failures advance on an eligible non-final rung and stop at the task-class escalation
      limit.
evidence_requirements:
- kind: tests
  description: Inline tests survive dispatch serialization; no-answer and timeout failures obey the escalation budget.
  command: uv run pytest tests/unit/delegation/test_inline_named_tests_roundtrip_omn18300.py tests/unit/delegation/test_delegation_orchestrator.py
    tests/unit/delegation/test_rung_call_timeout_capped.py -q -n 0 -p no:randomly --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
