schema_version: 1.0.0
ticket_id: OMN-23719
title: Node changes run only the tests they can affect, so the shared lint red clears
summary: On dev e57a70ff3f a one-node change selected all of tests/nodes/ plus the always-selected paths, 1800.75 recorded seconds against the selector's 1800 s bound, so every node change took the full suite and the lint job's test_pr_code_change_is_narrowed failed on dev and on eight open changes. Dev crossed the bound at #5815 (1800.65 s). A module listed in the adjacency map's new node_scoped_modules (nodes) now selects the tests of the nodes a change can reach by the import graph (transitively, through non-node modules and test helpers), the tests of nodes whose YAML names them, the tests that import or name them, conftest and package-init directories they reach, and the flat tests/nodes/test_*.py files. A change it cannot attribute falls back to the whole tests/nodes/ directory. Measured over all 1111 nodes on dev, 943 node changes narrow (median 63.6 s, p90 262.9 s), 98 stay protected surfaces and 70 are too heavy and take the full suite. The 1800 s bound, the policy and the durations record are unchanged, and the merge queue still runs the full suite.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23719-node-scoped-selection
  statement: A one-node change runs the tests it can affect, not every node's tests, without raising the selector bound.
  acceptance:
  - id: AC1
    statement: "AC1: a one-node change selects that node's tests, the tests of nodes that import it through the import graph, the tests of nodes whose YAML names it, the tests that import or name it, and the always-selected gates, not all of tests/nodes/; the new tests fail on dev's selector -- falsifier: uv run pytest tests/unit/scripts/test_detect_test_paths.py -q -n 0 -p no:randomly --no-cov, red on dev for the node-scoped cases"
  - id: AC2
    statement: "AC2: the lint job's queue run-once test passes on the branch and fails on dev -- falsifier: uv run pytest tests/ci/test_queue_run_once_omn19998.py -q -n 0 -p no:randomly --no-cov"
  - id: AC3
    statement: 'AC3: a change the selector cannot attribute (a deleted node, a node with no tests, a non-Python file outside a node) falls back to the whole tests/nodes/ directory, and the 1800 s bound and the durations record are unchanged -- falsifier: uv run pytest tests/unit/scripts/test_detect_test_paths.py -q -k "falls_back" plus git diff origin/dev -- src/omnimarket/nodes/node_test_selection_selector_compute/policy.yaml config/test_file_durations.json is empty'
  - id: AC4
    statement: "AC4: integrated: the Detect Changes job on the pull request computes a narrowed selection for a one-node change in CI and the lint job passes on that head -- falsifier: run python -m scripts.ci.detect_test_paths on a lab host at the pushed head over a one-node change list and read is_full_suite false with the node's test directory in selected_paths"
evidence_requirements:
- kind: tests
  description: The selector tests and the lint job's queue run-once test pass.
  command: uv run --frozen pytest tests/unit/scripts/test_detect_test_paths.py tests/ci/test_queue_run_once_omn19998.py -q -n 0 --no-cov -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23719-ac1-node-scoped-selection
  description: The node-scoped cases run on a small synthetic tree; with dev's selector they select tests/nodes/ and fail.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/scripts/test_detect_test_paths.py -q -n 0 --no-cov -p no:randomly
    cwd: .
- id: dod-omn23719-ac2-queue-run-once
  description: test_pr_code_change_is_narrowed fails on dev e57a70ff3f with narrowed_selection_too_heavy and passes on the branch.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/ci/test_queue_run_once_omn19998.py -q -n 0 --no-cov -p no:randomly
    cwd: .
- id: dod-omn23719-ac3-fallback
  description: Unattributable changes select the whole tests/nodes/ directory; the selector policy and the durations record are not in the diff.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/scripts/test_detect_test_paths.py -q -n 0 --no-cov -p no:randomly -k falls_back
    cwd: .
- id: dod-omn23719-ac4-integrated
  description: The selector run on a lab host at the pushed head over a one-node change; the lab read is in the pull request lab line.
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/scripts/test_detect_test_paths.py -q -n 0 --no-cov -p no:randomly -k real_node_change_narrows_under_the_bound
    cwd: .
- id: dod-omn23719-integration-proof
  description: The pushed head ran the selector tests, the queue run-once test and the selector node's tests on a lab host through the lab work runner and exited 0. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23719 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/scripts/test_detect_test_paths.py tests/ci/test_queue_run_once_omn19998.py tests/nodes/node_test_selection_selector_compute -q --no-cov -n 0 -p no:randomly
    cwd: .
