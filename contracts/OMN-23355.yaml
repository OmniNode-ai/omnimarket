schema_version: 1.0.0
ticket_id: OMN-23355
title: The prepush host table reader resolves uv_abs_path and the workroot per login on a host
summary: The pre-push host guard's table reader reads a per-login overlay (prepush_logins, a label login uv_abs_path workroot row per login) and replaces the host row's uv_abs_path and workroot for the invoking login only, so a second person on a lab host runs full suites under their own uv and run folder. The ssh target stays a host and names no login. A decision verb prints the guard's decision line for a host and login.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23355-per-login-rows
  statement: A login with a row in the per-login overlay resolves to its own uv_abs_path and workroot on a capacity host; any other login, and a read with no overlay, keep the host row's values byte for byte; a malformed or repeated overlay row refuses with a reason instead of reading as absent.
  acceptance:
  - id: AC1
    statement: 'AC1: the prepush host table reader resolves uv_abs_path and the workroot per login on a host, keeping the no-hardcoded-login rule for the ssh target, with a test that a second login on the same host resolves to its own uv and run folder -- falsifier: uv run pytest -q -k per_login_prepush in omnimarket, failing with the login row replacement removed'
  - id: AC2
    statement: 'AC2: the guard reads an authorized decision for the dashboard owner''s login on h051 with his own uv and run folder -- falsifier: the guard decision line for that login, with the overlay row removed it names the host row values'
evidence_requirements:
- kind: tests
  description: The per-login row tests of the host table reader
  command: uv run --frozen pytest tests/scripts/test_prepush_per_login_rows.py -q --no-cov -p no:randomly -k per_login_prepush
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23355-per-login-reader
  description: Runs the per-login row tests. A second login resolves to its own uv and run folder, another login keeps the host row, no overlay leaves the table byte identical, the reader uses the invoking login by default, the decision line names the login's own values, and a malformed or repeated row refuses. The failing control replaces the login check with a constant so no login row applies; three of these tests turn red. Absent at the merge base, so the command fails there.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/scripts/test_prepush_per_login_rows.py -q --no-cov -p no:randomly -k per_login_prepush
    cwd: .
- id: dod-omn23355-decision-line
  description: After the overlay row for the dashboard owner's login is installed on the host, the guard's decision verb names that login's own uv and run folder. Hosted CI has no overlay root and no host login, so only the local Done gate runs this item.
  source: manual
  execution_scope: local_done_gate
  binds_ac:
  - AC2
  checks:
  - check_type: command
    check_value: 'sh -c ''uv run --no-project python -m scripts.hooks.pytest_full_suite_host_guard --read-table decision --host "$ONEX_PREPUSH_PROBE_HOST" --login "$ONEX_PREPUSH_PROBE_LOGIN" | grep -q "verdict=authorized"'''
    cwd: .
