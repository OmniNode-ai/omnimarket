schema_version: "1.0.0"
ticket_id: "OMN-26720"
title: "The delegation check receipt names the chain source (store or overlay), its source_ref, loaded_at and declared rows"
summary: >-
  Acceptance for the omnimarket slice of OMN-26720: each delegation check receipt carries the chain source, so a reader
  of the 4 Dec readout can tell a chain loaded from the settings store from one read from an overlay.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-omn26720-chain-source-receipt"
    statement: >-
      Every check receipt carries chain_source (store or overlay, source_ref, loaded_at, declared rows), read from the
      injected store reader and never a file path.
    acceptance:
      - id: "AC1"
        statement: >-
          AC1: each probe receipt carries the chain source -- falsifier: uv run pytest tests/nodes/node_delegation_check_probe_effect/test_chain_source_receipt.py fails on omnimarket dev, where evidence_for lists no chain_source
evidence_requirements: []
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn26720-chain-source-receipt"
    description: >-
      Each check receipt names the chain source, its source_ref, loaded_at and rows; an overlay chain reads overlay and an
      absent row reads no source.
    source: "manual"
    binds_ac: ["AC1"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_delegation_check_probe_effect/test_chain_source_receipt.py -q -p no:randomly"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn26720-integration-proof"
    description: >-
      On a lab host at the pushed sha the receipt tests run; hosted CI holds no lab placement, so only the local Done
      gate runs this unbound check (the lab reading is in the PR's Lab line).
    source: "manual"
    execution_scope: local_done_gate
    checks:
      - check_type: "command"
        check_value: 'onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-26720 --kind test -- uv run --frozen pytest tests/nodes/node_delegation_check_probe_effect/test_chain_source_receipt.py -q --no-cov -n 0 -p no:randomly'
        cwd: "."
