---
schema_version: "1.0.0"
ticket_id: "OMN-20162"
title: "delegation_events stores the accepting attempt's backend_id and host"
summary: "The delegation_events row recorded the terminal's route as answering_backend but not the backend and host of the attempt that answered. The canonical terminal now carries backend_id and host, the projection writes both columns (migration 0054) as one unit, and a blank or absent value is stored as NULL."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-backend-id-and-host"
    statement: |-
      The delegation_events row must store the backend_id and host of the accepting attempt, separately from answering_backend, and must store NULL when the terminal names none.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: the backend_id and host of the accepting attempt reach the delegation_events row and the local store without repurposing answering_backend, and a refused ladder names neither -- falsifier: uv run pytest tests/unit/projection/test_delegation_backend_id_and_host_omn20162.py -q
      - id: "AC2"
        statement: |-
          AC2: the projection contract lists backend_id and host as columns and migration 0054 adds them -- falsifier: uv run pytest tests/unit/projection/test_delegation_backend_id_and_host_omn20162.py -q -k contract_lists_the_columns
evidence_requirements:
  - kind: "tests"
    description: "The backend_id and host projection tests pass."
    command: "uv run pytest tests/unit/projection/test_delegation_backend_id_and_host_omn20162.py -q"
  - kind: "tests"
    description: "The projection contract lists the columns and migration 0054 adds them."
    command: "uv run pytest tests/unit/projection/test_delegation_backend_id_and_host_omn20162.py -q -k contract_lists_the_columns"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn20162-ac1-backend-id-and-host"
    description: "The accepting attempt's backend_id and host reach the row and the local store, answering_backend is untouched, and blank or absent values are NULL."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/projection/test_delegation_backend_id_and_host_omn20162.py -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC1"]
  - id: "dod-omn20162-ac2-contract-and-migration"
    description: "The projection contract lists backend_id and host and migration 0054 adds both columns."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/projection/test_delegation_backend_id_and_host_omn20162.py -q -k contract_lists_the_columns"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC2"]
  - id: "dod-omn20162-ac1-real-postgres-own-cluster"
    description: "Ticket AC1 on a real database: a projected terminal stores the accepting attempt's backend_id and host, and the unit tests prove the same on the in-memory and SQLite stores (8 tests). With no INTEGRATION_POSTGRES_* password the twin starts its own disposable native cluster (local_postgres). The twin fails rather than skips when no real Postgres can be reached, and its test is named by node id, so a skipped or missing real-database test exits non-zero."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/test_omn20162_backend_id_and_host_real_postgres.py::TestTheRowCarriesBackendIdAndHost::test_a_terminal_stores_backend_id_and_host tests/unit/projection/test_delegation_backend_id_and_host_omn20162.py -q -p no:cacheprovider -k \"not null_backend and not contract_lists\""
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC1"]
  - id: "dod-omn20162-ac2-real-postgres-own-cluster"
    description: "Ticket AC2 on a real database: a row written while the table had no backend_id or host column reads NULL in both once migration 0054 is applied, and a terminal without them or with blank ones stores NULL; the unit tests prove the same on the in-memory and SQLite stores (7 tests). With no INTEGRATION_POSTGRES_* password the twin starts its own disposable native cluster (local_postgres). The twin fails rather than skips when no real Postgres can be reached, and its tests are named by node id, so a skipped or missing real-database test exits non-zero."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/test_omn20162_backend_id_and_host_real_postgres.py::TestTheRowCarriesBackendIdAndHost::test_a_terminal_without_them_and_a_blank_one_store_nulls tests/test_omn20162_backend_id_and_host_real_postgres.py::TestTheRowCarriesBackendIdAndHost::test_null_backend_for_a_row_written_before_the_columns tests/unit/projection/test_delegation_backend_id_and_host_omn20162.py -q -p no:cacheprovider -k \"null_backend or without_them\""
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC2"]
