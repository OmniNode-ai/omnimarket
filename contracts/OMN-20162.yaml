---
schema_version: "1.0.0"
ticket_id: "OMN-20162"
title: "delegation_events stores the accepting attempt's backend_id and host"
summary: "The delegation_events row recorded the terminal's route as answering_backend but not the backend and host of the attempt that answered. The canonical terminal now carries backend_id and host, the projection writes both columns (migration 0054) as one unit, and a blank or absent value is stored as NULL."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-backend-id-and-host"
    statement: |-
      The delegation_events row must store the backend_id and host of the accepting attempt, separately from answering_backend, and must store NULL when the terminal names none.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: the backend_id and host of the accepting attempt reach the delegation_events row and the local store without repurposing answering_backend, and a refused ladder names neither -- falsifier: uv run pytest tests/unit/projection/test_delegation_backend_id_and_host_omn20162.py -q
      - id: "AC2"
        statement: |-
          AC2: the projection contract lists backend_id and host as columns and migration 0054 adds them -- falsifier: uv run pytest tests/unit/projection/test_delegation_backend_id_and_host_omn20162.py -q -k contract_lists_the_columns
evidence_requirements:
  - kind: "tests"
    description: "The backend_id and host projection tests pass."
    command: "uv run pytest tests/unit/projection/test_delegation_backend_id_and_host_omn20162.py -q"
  - kind: "tests"
    description: "The projection contract lists the columns and migration 0054 adds them."
    command: "uv run pytest tests/unit/projection/test_delegation_backend_id_and_host_omn20162.py -q -k contract_lists_the_columns"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn20162-ac1-backend-id-and-host"
    description: "The accepting attempt's backend_id and host reach the row and the local store, answering_backend is untouched, and blank or absent values are NULL."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/projection/test_delegation_backend_id_and_host_omn20162.py -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC1"]
  - id: "dod-omn20162-ac2-contract-and-migration"
    description: "The projection contract lists backend_id and host and migration 0054 adds both columns."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/projection/test_delegation_backend_id_and_host_omn20162.py -q -k contract_lists_the_columns"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC2"]
