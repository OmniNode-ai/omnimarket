schema_version: 1.0.0
ticket_id: OMN-22426
title: 'Host-drift family: the drift typed events and fold move to omnimarket'
summary: First slice of the host-drift family move. The typed events, models, escalate handler and fold of the host drift check (kept under node_launchd_drift_effect, the name the ticket gives) and the fold test move into omnimarket with no behaviour change. The reducer and the other nodes follow in later slices; the reducer slice waits on the topic naming lint, which refuses the family's producer segment.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn22426-drift-fold-slice
  statement: The drift typed events and the fold run from omnimarket with their test.
  acceptance:
  - id: AC1
    statement: 'AC1: the moved fold suite passes under its original test names -- falsifier: uv run pytest tests/nodes/test_host_drift_fold.py fails or collects a different set of test names than the original file'
evidence_requirements:
- kind: tests
  description: The moved fold suite passes.
  command: uv run pytest tests/nodes/test_host_drift_fold.py -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn22426-ac1
  description: AC1 the moved fold suite passes.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/test_host_drift_fold.py -q --no-cov --tb=line
    cwd: .
- id: dod-omn22426-contract-routing
  description: The packaged local contract resolves both handlers and their request models, folds a drift observation and escalates its open item at four bounds.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/test_launchd_drift_contract.py -q --no-cov --tb=line
    cwd: .
- id: dod-omn22426-deploy-published-fold
  description: 'Hosted deploy artifact readback: the fold source published at the checked-out commit contains the moved handler and detected, resolved and heartbeat transitions. The source path is absent at the merge base; this reads published code and does not claim a host rollout.'
  source: manual
  execution_scope: hosted_and_local
  checks:
  - check_type: command
    check_value: >-
      bash -o pipefail -c 'curl --fail --silent --show-error --location --max-time 30 "https://raw.githubusercontent.com/OmniNode-ai/omnimarket/$(git rev-parse HEAD)/src/omnimarket/nodes/node_launchd_drift_effect/handlers/handler_host_drift_fold.py" | python3 -c '\''import sys; source = sys.stdin.read(); assert all(symbol in source for symbol in ("class HandlerHostDriftFold:", "ModelHostDriftDetectedEvent(", "ModelHostDriftResolvedEvent(", "ModelHostDriftHeartbeatEvent(")), "Published host-drift fold is incomplete"'\'''
    cwd: .
- id: dod-omn22426-integration-proof
  description: AC1 the pushed head, run on a lab host, passes the moved fold suite. Hosted CI cannot reach the lab, so only the local Done gate runs this check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane fill-bust0-0200 -- uv run --frozen pytest tests/nodes/test_host_drift_fold.py -q --no-cov
    cwd: .
