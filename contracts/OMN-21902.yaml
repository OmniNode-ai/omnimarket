schema_version: 1.0.0
ticket_id: OMN-21902
title: One ledger MSG addressed to a running remote lane reaches the lane within a turn, proven on a real lane on the bus
summary: This change adds node_agent_inbox_spool to omnimarket, the host spool half of the ticket. It reads the work-ledger MSG events with one stable consumer group per host and writes a local spool entry and an unread marker for each addressed lane. The hook shim in the omni plugin (AC2) and the observed injection on a real lane (AC3) are separate steps this change does not make.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn21902-spool-node
    statement: omnimarket carries a contract-driven node that reads the work-ledger MSG events for the lanes of one host and writes a local spool entry and an unread marker.
    acceptance:
      - id: AC1
        statement: 'AC1: a node with a contract in omnimarket reads the work-ledger MSG events for one lane id and writes a local spool entry and an unread marker, on the in-memory overlay and on the Redpanda overlay with no code change -- falsifier: uv run pytest -k agent_inbox_spool in omnimarket on both overlays'
evidence_requirements:
  - kind: tests
    description: The node suite runs on a lab host at the pushed head, the Redpanda case against a lab broker.
    command: uv run pytest tests/nodes/node_agent_inbox_spool -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn21902-ac1-spool
    description: AC1 spools addressed MSG rows per lane with an unread marker, skips malformed and unaddressed rows, and reads with one stable group per host on every replay; a handler that mints a group per call fails the replay case.
    source: manual
    binds_ac:
      - AC1
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/nodes/node_agent_inbox_spool/test_agent_inbox_spool_replays.py tests/nodes/node_agent_inbox_spool/test_agent_inbox_spool_contract.py -k agent_inbox_spool -m "not kafka" -q --no-cov --tb=line
        cwd: .
  - id: dod-omn21902-deploy-spool-check
    description: 'Hosted-runner deploy smoke: a disposable Python 3.13 container runs the node contract and in-memory spool tests against this checkout and its locked dependencies, mounted read-only. The contract, overlay example and source scan must hold, and twenty replays must reuse one stable consumer group and write each entry once; a handler that mints a group per replay fails it. The container has no network. This checks the evaluated checkout in an isolated runtime, not a production rollout.'
    source: manual
    checks:
      - check_type: command
        check_value: |
          dependencies="$(uv run --frozen --python 3.13 python -c 'import sysconfig; print(sysconfig.get_path("purelib"))')" &&
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            --tmpfs /tmp/agent-inbox-spool-venv:rw,mode=1777 \
            --mount "type=bind,source=$PWD,target=/workspace,readonly" --workdir /workspace \
            --mount "type=bind,source=$dependencies,target=/tmp/agent-inbox-spool-venv/lib/python3.13/site-packages,readonly" \
            --env PYTHONDONTWRITEBYTECODE=1 \
            ghcr.io/astral-sh/uv@sha256:531f855bda2c73cd6ef67d56b733b357cea384185b3022bd09f05e002cd144ca \
            sh -ec 'python -m venv --without-pip /tmp/agent-inbox-spool-venv
              exec /tmp/agent-inbox-spool-venv/bin/python -m pytest tests/nodes/node_agent_inbox_spool/test_agent_inbox_spool_contract.py \
                tests/nodes/node_agent_inbox_spool/test_agent_inbox_spool_replays.py \
                -q --no-cov -p no:cacheprovider --basetemp=/tmp/agent-inbox-spool-tests --refuse-skips'
        cwd: .
