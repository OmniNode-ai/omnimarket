schema_version: 1.0.0
ticket_id: OMN-23227
title: The factory floor is served from two lab hosts with a local copy, so one host being down no longer makes it unreadable
summary: The factory floor publisher writes every published file to a local copy on the publishing machine first, then serves it to each host its overlay names (h051 and h053 run the same compose service) on its own, so a copy failure to one host never refuses the other and a host whose connection did not open is skipped for the rest of the run. The overlay lists every host's served URL and the floor reader tries them in order. The run, the served status and the result name the hosts that missed files. A run where no host stored a file still refuses. No check and no bound changes.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23227-two-hosts
  statement: A publish with one serving host unreachable updates the other serving host and the local copy, and the floor reader reads the other host's URL.
  acceptance:
  - id: AC1
    statement: 'AC1: a publish with one serving host unreachable still updates the other host and the local copy, names the missed host in the result and the served status, and refuses only when no host stored a file -- falsifier: uv run pytest tests/nodes/node_factory_floor_publish_effect/test_floor_failover.py, whose one-host-down test fails when a single host failure refuses the publish'
  - id: AC2
    statement: 'AC2: the floor is read from h053 while h051 is down -- falsifier: curl of the h053 served URL returning the floor''s record with the h051 host unreachable'
evidence_requirements:
- kind: tests
  description: The failover tests (golden both hosts, error one host down, error every host down, reports site, operator gate, URL list reader) and the existing publish tests pass.
  command: uv run --frozen pytest tests/nodes/node_factory_floor_publish_effect -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23227-failover-tests
  description: Runs the failover tests; with the injected break that refuses on any host failure the one-host-down tests fail, without it they pass.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_factory_floor_publish_effect/test_floor_failover.py -q --no-cov
- id: dod-omn23227-h053-served
  description: The h053 compose service answers on the tailnet and serves the floor's record published by the publisher with h051 unreachable. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  binds_ac:
  - AC2
  checks:
  - check_type: command
    check_value: curl -fsS --max-time 10 "${FLOOR_SECOND_HOST_URL:?set to the second serving host URL from the publisher overlay}factory-floor.json"
