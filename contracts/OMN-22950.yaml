schema_version: 1.0.0
ticket_id: OMN-22950
title: The lab check-run effect posts a required check on the exact head within the wait bound and the J8 join consumes it
summary: >-
  node_lab_check_run_effect is the posting side of J8 (rebuild plan 3.6 row 8 and 4.1). A lab-bound job posts its check
  run on the exact head with the attempt identity as the run's external_id, inside the wait bound the overlay names. A
  post from a superseded attempt posts nothing and sets that attempt's counting runs to a non-passing conclusion; a post
  by the current attempt invalidates the counting runs of other attempts; every post is read back on the head before it
  reads posted. A head with no run of the current attempt reads missing (or superseded), never passing. The check-run
  API is in-memory by default and the GitHub REST API as the real backend; every setting is in the overlay. Every call is
  one chain on the floor's emission contract. The tests include the join to the landing decision (parity of the two
  readings, a golden and an error chain on the floor's receipt fold) and three named injected breaks.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn22950-lab-check-run
  statement: A lab-bound job's required check is posted on the exact head carrying its attempt identity, a superseded attempt's check is invalidated, and a missing check reads missing.
  acceptance:
  - id: AC1
    statement: 'AC1: a lab-bound job posts its check run on the exact head carrying the attempt identity within the wait bound -- falsifier: uv run pytest src/omnimarket/nodes/node_lab_check_run_effect -q -k post_on_exact_head'
  - id: AC2
    statement: 'AC2: a check from a superseded attempt is invalidated and a missing check reads as missing, not as passing -- falsifier: uv run pytest src/omnimarket/nodes/node_lab_check_run_effect -q -k superseded_and_missing'
evidence_requirements:
- kind: tests
  description: The node's golden chain, error chain, named injected breaks and the J8 join tests.
  command: uv run --frozen pytest tests/nodes/node_lab_check_run_effect src/omnimarket/nodes/node_lab_check_run_effect -q --no-cov -p no:cacheprovider
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn22950-post-on-exact-head
  description: A post lands on the exact head with the attempt as external_id inside the wait bound; a late post, a refused repository, a poster on another head and a down API each end in their typed failure.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_lab_check_run_effect -k post_on_exact_head -q --no-cov -p no:cacheprovider
