- id: dod-omn22950-superseded-and-missing
  description: A superseded attempt posts nothing and is invalidated, a new attempt invalidates the old pass, an API that ignores the invalidation fails the post, and a missing check reads missing inside and past the bound.
  source: manual
  binds_ac:
  - AC2
  checks:
