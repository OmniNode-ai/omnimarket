---
schema_version: "1.0.0"
ticket_id: "OMN-20282"
title: "Authenticate bus ledger appends and operator consent"
summary: "Work-ledger append requests carry a principal and an Ed25519 signature over domain-separated canonical JSON. The serve side verifies against issuer-supplied public keys, attributes each row to the verified principal, and only the configured operator principal may write RULING or OPERATOR-CONSENT rows. Unsigned, unknown-principal and forged requests are refused before any read or append."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-signed-appends"
    statement: "Unsigned, unknown-principal and forged append requests are refused before reads or append, and each appended row carries the verified principal."
    acceptance:
      - id: "AC1"
        statement: "AC1: the append handler refuses unsigned and forged requests, attributes rows to the verified principal, and refuses conflicting principal cells"
  - id: "req-operator-consent"
    statement: "Only the independently configured operator principal may write RULING or OPERATOR-CONSENT rows."
    acceptance:
      - id: "AC2"
        statement: "AC2: the CLI signs requests from environment configuration, round-trips through the bus and host adapter, and operator-only rows from other principals are refused"
evidence_requirements:
  - kind: "tests"
    description: "AC1: handler signature and operator policy tests pass."
    command: "uv run pytest tests/unit/nodes/node_work_ledger_append_effect/test_handler_work_ledger_append_effect.py -q"
  - kind: "tests"
    description: "AC2: CLI signing configuration and bus round-trip tests pass."
    command: "uv run pytest tests/unit/work_ledger_bus/test_work_ledger_append_cli.py -q"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn20282-ac1-handler"
    description: "AC1: handler signature and operator policy tests pass."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/nodes/node_work_ledger_append_effect/test_handler_work_ledger_append_effect.py -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC1"]
  - id: "dod-omn20282-ac2-cli"
    description: "AC2: CLI signing configuration and bus round-trip tests pass."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/work_ledger_bus/test_work_ledger_append_cli.py -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC2"]
