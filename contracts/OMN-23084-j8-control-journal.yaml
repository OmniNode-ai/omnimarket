interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23084-j8-control-journal
  statement: A named injected break of the live J8 run leaves the floor's journal unchanged, reads broken in the control journal, and an overlay whose two journals are equal is refused.
  acceptance:
  - id: AC1
    statement: 'AC1: golden, error and silent-landing runs through the verb leave the floor journal folding to passed while the control journal folds to broken, and equal journals are refused -- falsifier: uv run --frozen pytest tests/unit/nodes/node_pr_landing_decision_compute/test_join_j8_live.py -q --no-cov -n 0 -p no:randomly'
