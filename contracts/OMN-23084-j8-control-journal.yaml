schema_version: 1.0.0
ticket_id: OMN-23084
title: A named injected break of the live J8 run writes to a control journal of its own, so a failing control never reads as a broken chain on the floor
summary: The live J8 runtime verb wrote its named injected breaks to the floor's emission journal. A silent-landing run leaves piece 8 failed and piece 9 silent there, so past the chain deadline the floor reads join J8 broken (downstream_missing_typed_failure) and chains:broken red, from a chain that was a control. The overlay gains a required control_journal setting that must differ from emission_journal; an injected break writes there and a normal run writes to the floor's journal. No verdict, bound or check of the receipt fold changes.
