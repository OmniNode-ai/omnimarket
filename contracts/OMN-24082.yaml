---
schema_version: "1.0.0"
ticket_id: OMN-24082
title: "Content capture: replace credential-shaped text before it is sent"
summary: "The emit registry routes content.captured through redact_capture, so credential-shaped spans of the content and command fields are replaced in place before publish and every other character is kept."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn24082-redact-before-emit
    statement: "A credential planted in a content.captured record never reaches the published record or the stored row, and the full text around it is kept."
    acceptance:
      - id: AC1
        statement: 'AC1: a planted fake credential in a content.captured record is absent from the record the emit route publishes and from the row the session content writer stores, and the text around it is kept -- falsifier: uv run pytest tests/unit/nodes/node_event_emit_effect/test_content_redact_before_emit_omn24062.py tests/unit/nodes/test_golden_chain_session_content_omn19550.py -q --no-cov'
      - id: AC2
        statement: 'AC2: the old passthrough route publishes the planted credential unchanged, an ungoverned topic refuses, and a 70000 character item crosses uncut -- falsifier: uv run pytest tests/unit/nodes/node_event_emit_effect/test_content_redact_before_emit_omn24062.py -q --no-cov -k "passthrough or ungoverned or within_the_cap"'
      - id: AC3
        statement: 'AC3: integrated: on the running dev runtime a content record with a planted fake credential sent through the emit route reads back from session_content with the credential replaced by its marker and redaction_state set -- falsifier: the stored row holds the planted text or a null redaction_state'
evidence_requirements:
  - kind: "tests"
    description: "Redaction before emit: golden chain through the resolved route, passthrough control, ungoverned refusal, size"
    command: "uv run pytest tests/unit/nodes/node_event_emit_effect/test_content_capture_omn19550.py tests/unit/nodes/node_event_emit_effect/test_content_redact_before_emit_omn24062.py tests/unit/nodes/test_golden_chain_session_content_omn19550.py tests/unit/nodes/node_event_emit_effect/test_hook_event_capture_omn19513.py -q -p no:randomly --no-cov"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-omn24082-ac1
    description: "AC1: the routed-transform and golden chain tests pass at the head and fail at the merge base, where the route names passthrough."
    source: "manual"
    binds_ac: [AC1]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/nodes/node_event_emit_effect/test_content_redact_before_emit_omn24062.py tests/unit/nodes/test_golden_chain_session_content_omn19550.py -q -p no:randomly --no-cov"
        cwd: "."
  - id: dod-omn24082-ac2
    description: "AC2: the passthrough control, the ungoverned refusal and the size test pass at the head and fail at the merge base."
    source: "manual"
    binds_ac: [AC2]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/nodes/node_event_emit_effect/test_content_redact_before_emit_omn24062.py -q -p no:randomly --no-cov -k \"passthrough or ungoverned or within_the_cap\""
        cwd: "."
  - id: dod-omn24082-ac3
    description: "hosted proxy for AC3: the golden chain from hook record through the resolved route to the stored row passes here; the reading on the running runtime is a later step after the change is approved and merged."
    source: "manual"
    binds_ac: [AC3]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/nodes/test_golden_chain_session_content_omn19550.py tests/unit/nodes/node_event_emit_effect/test_content_capture_omn19550.py -q -p no:randomly --no-cov"
        cwd: "."
  - id: dod-omn24082-integration-proof
    description: "The pushed head ran the redaction tests on a lab host and exited 0. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check."
    source: "manual"
    execution_scope: "local_done_gate"
    checks:
      - check_type: "command"
        check_value: uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24082 -- uv run --frozen pytest tests/unit/nodes/node_event_emit_effect/test_content_redact_before_emit_omn24062.py tests/unit/nodes/test_golden_chain_session_content_omn19550.py -q -p no:randomly --no-cov
        cwd: "."
