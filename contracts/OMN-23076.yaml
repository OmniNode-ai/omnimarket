schema_version: "1.0.0"
ticket_id: OMN-23076
title: The J8 join handler is a handler_routing entry it cannot be auto-wired as, so the runtime-ownership guard reddens every omnimarket pull request
summary: >-
  OMN-22919 (#5301, on dev at 2026-11-08T03:27:37Z as 7dd22344) routed HandlerLandingJoinJ8 under the operation join_j8_landing_decision. The handler is an EFFECT taking sink and policy through its constructor, which the auto-wiring cannot supply, so the runtime-ownership guard refused on every pull request: Tests (Split 4/20) red on 18 of 52 open ones, omnimarket merged 0 in 60 minutes, and the fleet fell to 4 merges in 60 minutes, under its 5/h stall line. The shard is pull_request-only, so dev's own head carried no Tests (Split N/20) row and read green throughout, which is why reading dev could not find this. The entry was also dead and a live hazard: the operation appeared in that contract and nowhere else in src, only the J8 unit tests construct the handler, the landing controller calls it in process, and an entry declaring no event_model is granted every contract subscribe_topic by the auto-wiring, so it would have become an independent consumer of the node's command topic and thrown on the mismatched payload. The fix removes the routing entry; the handler, its policy model and its unit tests are untouched.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn23076-unroutable-handler-not-routed
    statement: >-
      A handler whose constructor dependencies the auto-wiring cannot supply is not declared as a handler_routing entry, so the runtime-ownership guard passes and no auto-wired consumer can be built for an operation nothing dispatches.
    acceptance:
      - id: AC1
        statement: "AC1: the runtime-ownership guard passes at this head and the J8 handler keeps its own tests -- falsifier: uv run --frozen pytest tests/validation/test_runtime_profile_contract_ownership.py tests/unit/nodes/node_pr_landing_decision_compute/ -q -p no:randomly --no-cov"
      - id: AC2
        statement: "AC2: the operation is routed by no contract under src/omnimarket/nodes, and node_pr_landing_decision_compute routes exactly one handler, its pure decision handler -- falsifier: uv run --frozen pytest tests/validation/test_j8_join_is_not_auto_wirable_omn23076.py -q -p no:randomly --no-cov"
      - id: AC3
        statement: "AC3: the whole validation suite is green -- falsifier: uv run --frozen pytest tests/validation -q -p no:randomly --no-cov"
evidence_requirements:
  - kind: tests
    description: >-
      The runtime-ownership guard that named the defect, the node's own unit tests (the handler and its policy are unchanged, so they must stay green), and the two new assertions that pin the removal rather than the symptom.
    command: uv run --frozen pytest tests/validation/test_runtime_profile_contract_ownership.py tests/validation/test_j8_join_is_not_auto_wirable_omn23076.py tests/unit/nodes/node_pr_landing_decision_compute/ -q -p no:randomly --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
