    description: >-
      The runtime-ownership guard passes and the J8 handler's own 418 unit tests stay green. At the merge base the guard fails on the exact line that reddened 18 open pull requests: node_pr_landing_decision_compute/HandlerLandingJoinJ8 requires constructor dependencies ('sink', 'policy'); declare runtime_profiles or dependency ownership.
    source: manual
    binds_ac:
