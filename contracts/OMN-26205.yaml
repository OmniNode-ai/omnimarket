---
schema_version: "1.0.0"
ticket_id: OMN-26205
title: "A scheduled dropped-work audit writes one owner-missing event and one alarm row for each ruling, promise, blocked next step, unreleased hold and unfinished claim that has no live owner"
summary: "A pure audit node and an hourly scheduled effect read the ledger for six kinds of dropped work and raise one owner-missing event and, after 30 minutes unowned, one alarm row per item with no live owner."
is_seam_ticket: false
interface_change: true
interfaces_touched:
  - topics
requirements:
  - id: req-omn26205-dropped-work-audit
    statement: "Dropped work is raised by itself every hour, with one owner-missing event and one alarm row per item with no live owner, and the audit assigns no owner and admits or refuses nothing."
    acceptance:
      - id: AC1
        statement: "AC1: a ledger fixture holding one row of each of the six kinds, none with a live owner, yields exactly six owner-missing events and, once 30 minutes have passed, six alarm rows each with item, source row and suggested step -- falsifier: uv run pytest tests/unit/nodes/node_dropped_work_audit_compute -q -k six_kinds_owner_missing"
      - id: AC2
        statement: "AC2: an item with a live CLAIM, a later TERMINAL or a RELEASE writes no event and no alarm, and a second run over the same ledger writes no second row for an item -- falsifier: uv run pytest tests/unit/nodes/node_dropped_work_audit_compute -q -k owned_and_rerun_quiet"
      - id: AC3
        statement: "AC3: an item unowned for less than 30 minutes writes the event and no alarm row -- falsifier: uv run pytest tests/unit/nodes/node_dropped_work_audit_compute -q -k alarm_after_thirty_minutes"
      - id: AC4
        statement: "AC4: an admission refusal of work covered by a standing ruling (the omnimarket 6478 case) raises the same alarm row -- falsifier: uv run pytest tests/unit/nodes/node_dropped_work_audit_compute -q -k admission_refusal_raises_row"
      - id: AC5
        statement: "AC5: the node is scheduled hourly through its overlay in overlays, every interval, kind list, window and host a value there and none a literal in code, and the schedule verdict reads one run per hour -- falsifier: uv run pytest tests/unit/nodes/node_dropped_work_audit_scheduled_effect -q -k overlay_schedule"
      - id: AC6
        statement: "AC6: the alarm row carries a shape the fill and the open-work check already read, and neither reader needs a code change to list it -- falsifier: uv run pytest tests/unit/nodes/node_dropped_work_audit_compute -q -k row_read_by_open_work_check"
evidence_requirements:
  - kind: tests
    description: "The compute and scheduled effect tests of the dropped-work audit."
    command: uv run pytest tests/unit/nodes/node_dropped_work_audit_compute tests/unit/nodes/node_dropped_work_audit_scheduled_effect -q --no-cov
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
