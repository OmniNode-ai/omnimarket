schema_version: 1.0.0
ticket_id: OMN-23216
title: A refusal on a local model for a policy reason ends the run instead of trying a paid model
summary: The declared transition lists gain the cause policy_refusal in terminate_on for every task class. The local dispatch port and the bus orchestrator both classify a refused secret or exfiltration request as that cause, so the run makes no later provider call and ends with the contract's typed reason. A 503 on the same rung is not that cause and still moves to the next rung. No bound or check is widened.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23216-policy-refusal-terminates
  statement: A fixed policy refusal on rung 1 makes no later attempt, and a 503 on rung 1 still moves.
  acceptance:
  - id: AC1
    statement: 'AC1: a fixed policy refusal on rung 1 makes no later attempt, and a 503 on rung 1 still moves -- falsifier: `uv run pytest tests/unit/delegation/test_policy_refusal_terminates.py -q`'
evidence_requirements:
