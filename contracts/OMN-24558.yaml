schema_version: 1.0.0
ticket_id: OMN-24558
title: The host reading unit reads whether the copies of the lab host table agree
summary: 'The drift read of the copies of the lab host table (node_host_table_copies_drift_compute) had no caller: nothing ran it, so a second copy could drift unseen. This change gives it its home as one more probe of node_host_reading_effect, the hourly host reading, so the same unit that already runs hourly on the lab host reads the copies and the reading writer prints the verdict. It replaces the parallel one-copy check nodes first drafted on this branch, which duplicated nodes that already existed.'
is_seam_ticket: true
interface_change: true
interfaces_touched:
- public_api
requirements:
- id: req-omn24558-host-table-copies-probe
  statement: The hourly host reading runs the host table copies drift read and writes its verdict as a reading row; copies that agree read WORKING, a differing field reads NOT_WORKING naming the host and the field, an unreadable copy reads UNKNOWN.
  acceptance:
  - id: AC1
    statement: 'AC1: the probe returns WORKING when the copies agree, NOT_WORKING naming the host and field when one differs, and UNKNOWN with a typed reason when a copy or the overlay cannot be read, each with its chain event -- falsifier: uv run --frozen pytest tests/nodes/node_host_reading_effect/test_host_table_copies_probe.py -q --no-cov fails when the probe returns WORKING for a differing copy'
  - id: AC2
    statement: 'AC2: the seam between the probe and the drift node fails when the drift result model, its verdict enum or the handler constructor changes shape -- falsifier: the seam tests in the same file fail on a renamed field'
  - id: AC3
    statement: 'AC3: integrated: after the change is installed, the hourly host reading unit on the lab host writes a host-table-copies row that reads WORKING while the copies agree, read in the reading writer piece 2 source -- falsifier: the row reads NOT_WORKING when a third differing copy is added to the drift overlay'
evidence_requirements:
- kind: tests
  description: The probe tests and the existing host reading tests at the pushed head.
  command: env -u PYTHONPATH uv run --frozen pytest tests/nodes/node_host_reading_effect/test_host_table_copies_probe.py -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24558-ac1-ac2
  description: 'The probe tests: golden chain, error chains, the failing control and the seam tests.'
  source: manual
  binds_ac:
  - AC1
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_host_reading_effect/test_host_table_copies_probe.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24558-ac3-running-unit
  description: The running-unit reading on the lab host after install; it is read from the host and is not claimed by the local check, which runs the host reading tests at the pushed head.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_host_reading_effect -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24558-integration-proof
  description: The pushed head ran the probe tests on a lab host through the lab work runner and exited 0.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24558 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_host_reading_effect/test_host_table_copies_probe.py -q --no-cov
    cwd: .
