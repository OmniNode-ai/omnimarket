schema_version: 1.0.0
ticket_id: OMN-23601
title: The floor reads the floor piece's answer to an evals failure
summary: Join J16 (piece 16, context memory and evals, to piece 17, observability and the floor) reads broken on the served board with downstream_missing_typed_failure findings. The floor's receipt fold reads, for piece 17, only the chains of the nodes the floor simple node lists in pipeline_chains, so the typed upstream refusal the J16 join node writes for piece 17 was invisible unless its node is listed. This change lists the J16 piece 17 node in the floor simple contract, makes the J16 step refuse with exit 3 and a named reason when its overlay names a piece 17 node the floor does not read, and adds the J16 seam test that runs the real J16 handler as producer and the floor's own receipt fold, with the production declared chains, as judge.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23601-j16-floor-seam
  statement: The floor reads piece 17's typed refusal of a piece 16 failure, and the seam test and the J16 step fail when the node name on either side changes.
  acceptance:
  - id: AC1
    statement: 'AC1: the floor receipt fold, given the production declared chains, reads the floor piece''s typed refusal written by the join J16 node and reads J16 error_only with no finding -- falsifier: uv run --frozen pytest tests/nodes/node_join_j16_effect/test_join_j16_floor_seam.py -q --no-cov -n 0 -k "golden or error", red at the base'
  - id: AC2
    statement: 'AC2: the J16 step refuses with a named reason when its overlay''s floor node is not among the floor''s declared chains, and the test with the node renamed or the contract entry dropped fails -- falsifier: uv run --frozen pytest tests/nodes/node_join_j16_effect/test_join_j16_floor_seam.py -q --no-cov -n 0 -k control'
  - id: AC3
    statement: 'AC3: the same answer crosses the in-memory bus and the real dev broker -- falsifier: the same file with the parity bootstrap naming the lab broker, run through lab-run'
  - id: AC4
    statement: 'AC4: integrated: after the change runs on the dev runtime and the next publish cycle, the join J16 line of the served floor-simple.json lists no downstream_missing_typed_failure -- falsifier: the chain findings and the join J16 detail of the served floor-simple.json'
evidence_requirements:
- kind: tests
  description: The J16 floor seam test and the existing J16 node tests at the pushed head.
  command: uv run --frozen pytest tests/nodes/node_join_j16_effect/test_join_j16_floor_seam.py tests/unit/nodes/node_join_j16_effect -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23601-ac1-golden-error
  description: The J16 seam test, golden and error legs, passes at the pushed head and its golden leg reads red at the merge base, where the floor simple contract lists no piece 17 node for the J16 join.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_join_j16_effect/test_join_j16_floor_seam.py -q --no-cov -n 0 -p no:randomly -k "golden or error"
    cwd: .
- id: dod-omn23601-ac2-controls
  description: The failing controls pass at the pushed head, each reading J16 broken or the step refusing when the contract entry is dropped, the node is renamed or the journal drops piece 17.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_join_j16_effect/test_join_j16_floor_seam.py -q --no-cov -n 0 -p no:randomly -k control
    cwd: .
- id: dod-omn23601-ac3-parity
  description: The in-process and in-memory bus legs of the parity test pass at the pushed head; the broker leg runs when JOIN_J16_PARITY_BOOTSTRAP names a lab broker.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_join_j16_effect/test_join_j16_floor_seam.py -q --no-cov -n 0 -p no:randomly -k parity
    cwd: .
- id: dod-omn23601-ac4-floor-fold-hosted
  description: 'The hosted side of AC4: the floor''s own receipt fold, given the production declared chains, reads J16 error_only with no finding over the real J16 handler''s chains. The read of the served board on the floor host is the unbound local item below.'
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_join_j16_effect/test_join_j16_floor_seam.py -q --no-cov -n 0 -p no:randomly -k golden
    cwd: .
- id: dod-omn23601-j16-floor
  description: The served floor lists no J16 chain finding. Hosted CI cannot reach the floor host (the URL is in FLOOR_SIMPLE_URL), so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: "curl -s -m 20 \"${FLOOR_SIMPLE_URL:?set FLOOR_SIMPLE_URL to the served floor-simple.json}\" | python3 -c \"import json,sys; d=json.load(sys.stdin); sys.exit(0 if not [f for f in d['chain_findings'] if 'J16' in f['subject']] else 1)\""
    cwd: .
- id: dod-omn23601-integration-proof
  description: The pushed head ran the J16 seam test and the J16 node tests on a lab host through the lab work runner and exited 0. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: 'env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23601 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_join_j16_effect/test_join_j16_floor_seam.py tests/unit/nodes/node_join_j16_effect -q --no-cov'
    cwd: .
