schema_version: 1.0.0
ticket_id: OMN-21454
title: Native remote-lane receipt usage and work identity
summary: 'Omnimarket side only: close-node engine events produce typed usage and brief identity. Runner wiring,
  receipt persistence and CLAIM/TERMINAL propagation remain outstanding in the launcher; no runner code changes
  here. Original criterion text is retained; checks bind the corresponding node-side behavior, not completed runner
  integration.'
is_seam_ticket: false
interface_change: true
interfaces_touched:
- public_api
- events
requirements:
- id: req-native-receipt-usage
  statement: The close node provides the typed receipt usage and ledger identity required by the runner.
  acceptance:
  - id: AC1
    statement: 'AC1: a receipt for a stubbed Claude stream-json run whose result event holds usage carries tokens_in,
      tokens_out, cache_read, cache_write and tool_calls from that event -- falsifier: uv run pytest plugins/omni/skills/remote-lane/tests
      -q -k receipt_carries_claude_usage'
  - id: AC2
    statement: 'AC2: a receipt for a stubbed Codex run carries tokens_in, tokens_out and tool_calls from the usage
      object the runner already reads, and cost_basis UNKNOWN with total_cost_usd absent, not 0 -- falsifier: uv
      run pytest plugins/omni/skills/remote-lane/tests -q -k codex_cost_unknown_not_zero'
  - id: AC3
    statement: 'AC3: a brief with a single line Contract: <contract_id> writes contract_id into the receipt and
      the lane CLAIM and TERMINAL rows, and a brief without the line writes none -- falsifier: uv run pytest plugins/omni/skills/remote-lane/tests
      -q -k contract_id_in_receipt'
  - id: AC4
    statement: 'AC4: a run whose stream carries no usage records the token fields as UNKNOWN and the receipt still
      validates -- falsifier: uv run pytest plugins/omni/skills/remote-lane/tests -q -k missing_usage_unknown'
  - id: AC5
    statement: 'AC5: a regression test built from a recorded real stream-json tail and a recorded codex event tail
      (fixture paths named in the test) fails on the runner before the change and passes after -- falsifier: uv
      run pytest plugins/omni/skills/remote-lane/tests -q -k recorded_stream_fixtures'
  - id: AC6
    statement: 'AC6: turns, tool_calls and retries are derived from the recorded event sequence per engine by the
      stated definitions (turns are assistant messages, tool_calls are tool-use blocks or command items, retries
      are repeated identical calls after a failed result) and a recorded stream with several turns, two tool types,
      a failed call and a retry yields exactly those counts -- falsifier: uv run pytest plugins/omni/skills/remote-lane/tests
      -q -k counter_semantics_recorded_streams'
  - id: AC7
    statement: 'AC7: the brief''s Attempt line is copied into the receipt beside the Contract line -- falsifier:
      uv run pytest plugins/omni/skills/remote-lane/tests -q -k attempt_id_in_receipt'
evidence_requirements:
- kind: tests
  description: Focused usage, native fixture and packaged RuntimeLocal tests.
  command: uv run pytest tests/nodes/node_remote_lane_close_compute/test_receipt_usage.py -q --no-cov
- kind: manual
  description: Hosted deploy check exercises the packaged node without network, broker, credentials or live services.
  command: Packaged ONEX node dispatch and typed receipt readback in dod-omn21454-deploy-packaged-node.
emergency_bypass:
