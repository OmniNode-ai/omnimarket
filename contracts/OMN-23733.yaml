schema_version: 1.0.0
ticket_id: OMN-23733
title: node_stuck_owner_actor_effect and node_unit_probe_effect move into omnimarket and their plugin copies are deleted
summary: 'This change is the first slice of the ticket. It adds node_unit_probe_effect to omnimarket in the canonical shape (contract, metadata, handler, models, entry point) with its tests. The handler
  and its behaviour are the plugin copy''s; the request and result models become frozen pydantic models. Not in this change: node_stuck_owner_actor_effect (its handler imports
  node_cause_fix_guard_compute and node_tick_read_budget_compute, which omnimarket does not hold), the deletion of both plugin copies, and the throughput tick import switch (AC2 and AC3 are read on the plugin
  repository and on the installed tick and stay pending).'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
