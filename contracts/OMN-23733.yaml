    statement: 'AC1: node_stuck_owner_actor_effect and node_unit_probe_effect each import from omnimarket.nodes with their ported tests passing -- falsifier: uv run pytest src/omnimarket/nodes/node_stuck_owner_actor_effect
      src/omnimarket/nodes/node_unit_probe_effect -m unit'
evidence_requirements:
- kind: tests
  description: The unit probe tests pass at the pushed head.
  command: uv run pytest tests/nodes/node_unit_probe_effect -q -p no:randomly --no-cov -m unit
