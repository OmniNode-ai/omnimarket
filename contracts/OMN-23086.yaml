schema_version: 1.0.0
ticket_id: OMN-23086
title: Join J5 runs, piece 6 answers each piece 5 reading with a ledger append under the store-resolved identity, so the floor can read J5 passed
summary: Join J5 (piece 5 secrets to piece 6 ledger and state) read broken on the served floor because the J5 join handler of OMN-22914 was called by nothing. Piece 5's readings are chains of the floor's own (the secret reading rows of the ledger), and piece 6 never answered one. The new runner reads those rows through the join refusal overlay's piece 5 rule, and for each golden reading piece 6 has not answered it appends one row under the identity the secret store resolves, reads the row back from the projection and writes piece 6's chain to the emission journal under the reading's correlation id. The publish cycle runs it as the join_j5 step. A receipt authenticated as anyone but the store identity, a store that resolves nothing, a projection that never hears the row and a receipt naming a ledger line that is not there each leave the join unpassed.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23086-j5-run
  statement: Every golden piece 5 reading is answered once by a piece 6 chain under its own correlation id, a rerun appends nothing, and each injected break leaves the join not passed on the floor's own receipt fold.
  acceptance:
  - id: AC1
    statement: 'AC1: the golden chain (a golden piece 5 reading is answered once and join J5 reads golden_only, passed with the refusal node answering the failure), the error chains (a drill, a failed reading and an unreadable ledger are not answered by the runner) and the failing controls (no runner leaves the join broken; a deaf projection, a store without the key, a foreign principal on the receipt and a missing ledger line leave it unpassed) all hold -- falsifier: uv run --frozen pytest tests/unit/nodes/node_work_ledger_append_effect -q --no-cov'
evidence_requirements:
- kind: tests
  description: The J5 runner tests with the failing controls.
  command: uv run --frozen pytest tests/unit/nodes/node_work_ledger_append_effect tests/nodes/node_factory_floor_publish_effect -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
