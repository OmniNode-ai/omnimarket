schema_version: 1.0.0
ticket_id: OMN-26043
title: The C29 customer BYO-key probe grades a delegation call that prices an uncatalogued model from the price list shipped with the install and never fetches models.dev
summary: A customer-key delegation call prices a model that neither the provider catalogue nor the model registry prices from a price list shipped inside the install, refreshed with each release. It no longer fetches models.dev inside the call, so the C29 probe's no_omninode clause sees no connect it cannot attribute to the provider. The model table's own user-initiated refresh is unchanged.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn26043-c29-shipped-price-list
  statement: The delegation call's price lookup reads the shipped price list and opens no connection to models.dev.
  acceptance:
  - id: AC5
    statement: "AC5: each of the eight probes has one run read green after the change, or the lane names the real product defect it now shows with its ticket id and the run id -- falsifier: a probe's newest run reads red and neither a green run id nor a defect ticket id for it appears in the lane TERMINAL"
- id: req-omn26043-probe-overlay-model
  statement: The delegation check probe node's overlay document has a typed model in omnimarket that the overlays repository and the node pull request import.
  acceptance:
  - id: AC6
    statement: "AC6: ModelDelegationCheckProbeOverlay validates the overlay document of the delegation check probe node and refuses a malformed one -- falsifier: tests/unit/models/test_delegation_check_probe_overlay_document_omn26043.py fails collection or any of its tests fails"
- id: req-omn26043-probe-node-chain
  statement: The delegation checks C13, C14 and C17 run as a node through the responder chain.
  acceptance:
  - id: AC7
    statement: "AC7: the delegation checks C13, C14 and C17 run as node_delegation_check_probe_effect through the responder chain and publish each run on the declared result topic -- falsifier: the node's tests pass on the base commit, where neither the node nor the chain module exists"
evidence_requirements:
- kind: tests
  description: The call's pricing function with the real pricing index restored and every socket connect and fetch refused, on a cold ONEX home.
  command: uv run pytest tests/unit/delegation/test_shipped_price_list_no_fetch.py -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn26043-c29-no-fetch-tests
  description: With the network closed and no models.dev cache, an uncatalogued model is priced from the shipped list (a zero price books as zero marginal cost, a paid price as cloud cost), an unlisted model stays unpriced, and neither path opens a connection or calls the fetch function; the model table's refresh still fetches. The tests fail on the code before the change, where the pricing path was a models.dev fetch, and pass after it.
  source: manual
  binds_ac:
  - AC5
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/delegation/test_shipped_price_list_no_fetch.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn26043-c29-integration-proof
  description: On a lab host, at the pushed sha, the same focused tests run through the lab work node with the network closed inside the tests; the run exits 0 only when the call's pricing opens no connection to models.dev. Hosted CI holds no customer machine, so only the local Done gate runs this check and it binds no criterion here; the tests above bind AC5.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-26043 --kind test -- uv run --frozen pytest tests/unit/delegation/test_shipped_price_list_no_fetch.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn26043-probe-overlay-model-tests
  description: The overlay document model for the delegation check probe node accepts a valid document and refuses malformed ones; the test file fails at collection with ModuleNotFoundError before the model module exists and passes after.
  source: manual
  binds_ac:
  - AC6
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/models/test_delegation_check_probe_overlay_document_omn26043.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn26043-delegation-check-chain-tests
  description: The delegation checks C13, C14 and C17 run as node_delegation_check_probe_effect. Each check sends its task through the responder row of the settings store (local least busy, then openrouter, then claude_api; the window is max_model_len else meta.n_ctx and a windowless responder is skipped), a task that never reaches a local responder reads NOT_MEASURED, a pinned model, an unproven zero and a broken command hidden by the customer surface each read FAIL, and every run is published on the declared result topic. The tests fail on the base commit, where neither the node nor the chain module exists, and pass after the change. This binds AC7; the green runs of AC5 are read from the node once its collectors are wired.
  source: manual
  binds_ac:
  - AC7
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_delegation_check_probe_effect tests/handlers/routing/test_delegation_check_responder_chain.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn26043-collectors-run-from-node
  description: "The collectors of C13, C14 and C17 (fresh-container install, egress recorder, routing walk, clean-machine run) run from node_delegation_check_probe_effect on a lab host; the contract declares the result topic each reading is published on, and the tick no longer builds an absent machine by default. Failure cases come first in the tests (no container engine, clean record refused, install fails, egress recorder empty, responder chain exhausted, no collector record), then the green path. The tests fail on the base commit, where neither the container machine nor the collectors exist, and pass after the change. This binds AC7; the lab readings of AC5 are read after the unit is installed."
  source: manual
  binds_ac:
  - AC7
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_delegation_check_probe_effect -q --no-cov -n 0 -p no:randomly
    cwd: .
  - check_type: command
    check_value: grep -q 'delegation-check-probe-completed' src/omnimarket/nodes/node_delegation_check_probe_effect/contract.yaml
    cwd: .
- id: dod-omn26043-responder-row-declared
  description: "The responder list is a settings-store row, overlay delegation_check_responders key responders, declared in the settable settings of node_overlay_setting_set_effect, so it changes only through that command with its audit row. The list in the order Inkling 8111, Qwen 8000, OpenRouter, Claude API is the value set in the store and read back in the lane report; the repository holds no local address for it. This binds no criterion of this ticket."
  source: manual
  checks:
  - check_type: command
    check_value: "grep -q 'overlay_id: delegation_check_responders' src/omnimarket/nodes/node_overlay_setting_set_effect/contract.yaml"
    cwd: .
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_delegation_check_probe_effect/test_no_check_pins_a_model.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn26043-overlay-docs-and-trigger
  description: "The node declares its trigger (the host unit delegation-check-probe) so the trigger declaration check passes, and the unit's overlay documents are in the overlays repository (a separate pull request), which Overlay Main Load reads. This binds no criterion of this ticket."
  source: manual
  checks:
  - check_type: command
    check_value: uv run python -m omnimarket.nodes.node_trigger_declaration_check_effect --root . --contract src/omnimarket/nodes/node_delegation_check_probe_effect/contract.yaml
    cwd: .
- id: dod-omn26043-c13-customer-install-entry
  description: "C13 grades that the delegate ran through the customer install's own packaged onex, and it no longer carries any assertion that the runner has no onex (runner image v15 ships one on PATH). A run through the runner's onex reads FAIL on the install_entry clause; a run through the install's own entry passes with an onex on the runner. The tests fail on the base commit, where the observation has no entry field and no install_entry clause exists, and pass after the change. This binds AC7."
  source: manual
  binds_ac:
  - AC7
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_delegation_check_probe_effect/test_customer_install_entry.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn26043-c14-llamacpp-listing-fixture
  description: "The window of a responder is max_model_len else meta.n_ctx, read from the recorded llama.cpp listing of the second lab GPU host without a KeyError; with the n_ctx fallback removed the fixture tests read red. This binds AC7."
  source: manual
  binds_ac:
  - AC7
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/handlers/routing/test_delegation_check_llamacpp_listing_fixture.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn26043-build-checks-run-our-nodes
  description: "A rebuild-completed event runs the probe node of this repository for each check it owns (C13, C14, C17) and no cloud workflow dispatch, the tick runs one named check and exits 4 for a run it could not measure, and each of the ten checks publishes its own record on the per-check topic the contract declares; a check with no node of ours reads unavailable. The tests fail on the base commit, where the default routes are empty and no per-check topic exists, and pass after the change. This binds AC7."
  source: manual
  binds_ac:
  - AC7
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_build_delegation_checks tests/nodes/node_delegation_check_probe_effect/test_tick_single_check.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn26043-setting-set-first-record
  description: "A set on an overlay the node contract declares settable (delegation_check_responders, delegation_check_gateway) creates its first record when the store holds none, validated by the overlay's own model, with the actor and time as provenance; an invalid document, an undeclared overlay id and an overlay with no declared first document are still refused with nothing written. The tests read red on the base commit, where a set on an empty store always raised OverlayNotInStoreError. This binds AC7."
  source: manual
  binds_ac:
  - AC7
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/nodes/node_overlay_setting_set -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn26043-responder-row-absent-keeps-c17
  description: "A tick whose settings store serves no delegation_check_responders row no longer ends at once with overlay_unreadable: C13 and C14 publish PRECONDITION-ABSENT naming responders_row and C17, which reads no responder, still grades and publishes; a row that is served but broken still ends the tick with exit 2. The new test fails on the base commit, where the tick ended with exit 2 and published nothing, and passes after the change. This binds AC7."
  source: manual
  binds_ac:
  - AC7
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_delegation_check_probe_effect/test_tick_single_check.py -q --no-cov -n 0 -p no:randomly
    cwd: .
  - check_type: command
    check_value: grep -q 'NodeOverlayNotFoundError' src/omnimarket/nodes/node_delegation_check_probe_effect/runtime_delegation_check_probe_tick.py
    cwd: .
- id: dod-omn26043-probe-unit-bus-environment
  description: "The delegation-check-probe registry unit declares the lane bus environment by reference (OMNIBASE_PATH and ONEX_WORKSPACE_CONFIG_ROOT, the same two variables the overlay-store-load unit renders) and names no broker address; the rendered service carries both, and the overlay-store-load render is unchanged. The new test file fails on the base commit, where the unit declared neither variable (measured on h051: event not delivered, KAFKA_BOOTSTRAP_SERVERS), and passes after the change. This binds AC5: the probe unit delivering its result is the precondition of each probe reading a run."
  source: manual
  binds_ac:
  - AC5
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_host_installer_registry_units/test_delegation_check_probe_bus_env.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn26043-probe-unit-overlay-snapshot-root
  description: "The delegation-check-probe registry unit names the overlay store reader's snapshot directory (home/.local/state/onex/overlay-store) as the last of its overlay roots, so the probe finds the delegation_check_responders and delegation_check_gateway rows the reader keeps; the rendered service carries it after every root the unit declares. The two new tests fail on the previous commit, where the unit named no snapshot directory among its roots (measured on h051: C13 and C14 PRECONDITION-ABSENT with responders_row and gateway_row absent, C17 gateway_row absent). This binds AC5: the probe unit delivering its result is the precondition of each probe reading a run."
  source: manual
  binds_ac:
  - AC5
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_host_installer_registry_units/test_delegation_check_probe_bus_env.py -q --no-cov -n 0 -p no:randomly -k snapshot_root
    cwd: .
- id: dod-omn26043-probe-delivers-on-declared-broker
  description: "The probe tick publishes its run record through the declared broker publisher, which reads the lane from the node overlay's event_bus and never from KAFKA_BOOTSTRAP_SERVERS, and the publisher passes the check id as the partition key. The new test file fails on the previous commit, where the tick defaulted to the emit effect and a lab host's tick ended with KeyError KAFKA_BOOTSTRAP_SERVERS and exit 3, and passes after the change; a tick whose overlay declares no event_bus still exits 3. This binds AC5: the probe unit delivering its result is the precondition of each probe reading a run."
  source: manual
  binds_ac:
  - AC5
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_delegation_check_probe_effect/test_probe_delivery_declared_broker.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn26043-probe-record-flat-on-topic
  description: "The probe tick publishes its run record flat, the payload alone as the record value, the wire shape every other record on the result topic carries (read from the dev broker on h051: check_id, verdict and run_id at the top level), where the default declared broker publisher wraps it as event_type, event_id, correlation_id and payload; the publisher keeps the wrapped shape for its other callers. The new test fails on the previous commit, where the tick sent the wrapped record and the publisher took no flat option, and passes after the change. This binds AC5: the probe unit delivering its result is the precondition of each probe reading a run."
  source: manual
  binds_ac:
  - AC5
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_delegation_check_probe_effect/test_probe_delivery_declared_broker.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn26043-beta-board-reads-gateway-leg
  description: "A beta board probe that names a gateway check (C13 or C14) is read from that check's gateway_leg in the delegation check probe node's run history, never from the cloud workflow (ruling 2026-11-24T13:11:36Z). A green gateway leg beside a red cloud workflow reads pass, a red gateway leg reads fail, an unmeasured leg or a missing history reads unread or is no reading, an old leg reads stale, and the tick writes gateway_leg on each customer-local history line (known good pass, known bad fail). The new tests fail on the previous commit, where the board model had no gateway_check and the history line no gateway_leg, and pass after the change. This binds AC5: the probe reading its newest run is how C13 and C14 read green."
  source: manual
  binds_ac:
  - AC5
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_beta_board_effect/test_gateway_leg_reading.py tests/nodes/node_delegation_check_probe_effect/test_tick_single_check.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn26043-beta-board-declares-its-trigger
  description: "The beta board node, which subscribes to no topic, declares what runs it: runtime_dispatch.callers names the factory floor publish node's contract, whose beta_board step runs the module, so the node trigger declaration check no longer refuses the changed node (it read refused=1 with no-trigger-declared on the previous commit and reads refused=0 after). The new test runs the check on the node's own contract; it fails on the previous commit and passes after the change. This binds AC5: the board reading the gateway legs has to pass the changed-node gate before C13 and C14 can be read from it."
  source: manual
  binds_ac:
  - AC5
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_beta_board_effect/test_trigger_declaration.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn26043-tenant-key-absent-precondition
  description: "A healthy delegation the dev runtime refuses ONEX_MARKET_CUSTOMER_PROVIDER_KEY_ABSENT (the test tenant holds no provider key, measured on the dev runtime for run c28-20261126T025132Z-77239c46: tenant 8044e4eb has no row in delegation_routing_tenant_overlay and none in tenant_registry_mirror) reads PRECONDITION-ABSENT naming tenant_provider_key with the refusal quoted, in C15, C16, C28 and C29, and every clause the run graded is still recorded; a healthy run that fails with any other code still reads FAIL, and an invalid payload that never terminates still reads FAIL. The new test file fails on the previous commit (four readings FAIL) and passes after the change. This binds AC5: a probe reading red names its real cause instead of a product defect that is not one."
  source: manual
  binds_ac:
  - AC5
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_delegation_check_probe_effect/test_tenant_provider_key_absent.py tests/nodes/node_delegation_check_probe_effect/test_gateway_checks.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn26043-customer-machine-delegation-collector
  description: "The clean-install customer machine runs one delegation through the customer path (the guide's install line in a disposable tool environment, the model declared as the guide's option A, the install's own onex under an egress recorder) and walks the installed product's routing, so C13 and C14 read a graded run instead of PRECONDITION-ABSENT. A good run grades every machine clause green for both checks; a receipt naming another model reads C13 fail, an external connect reads C13 fail, an unbindable tier reads C14 fail, a failed install reads fail and runs no driver, and a driver that prints no record is an absent collector, never a pass. The new tests fail on the previous commit, where the machine raised the absent-collector error for both calls. This binds AC5: C13 and C14 each reading a run is the precondition of reading it green."
  source: manual
  binds_ac:
  - AC5
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_delegation_check_probe_effect/test_c13_c14_customer_machine_collector.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn26043-c15-chain-tier-order
  description: "C15 asserts the tier order of the responder chain it was handed (local, then OpenRouter, then the Claude API) as the clause responder_chain_tier_order beside its gateway clauses, which the chain audit found missing. The declared order grades ok, each other order grades red and names the declared and the expected order, and C15 over a chain naming the Claude API before OpenRouter reads FAIL with that clause the only red one (known good pass, known bad fail). The new tests fail on the previous commit, where no such grader existed. This binds AC5: C15 reading a run green has to mean the chain it ran through was in order."
  source: manual
  binds_ac:
  - AC5
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_delegation_check_probe_effect/test_c15_chain_tier_order.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn26043-tenant-read-answers-on-its-topic
  description: "The tenant provision node's contract declares the tenant-read-completed topic as a publish topic and routes the read result class (ModelTenantReadResult) to it through published_events, and the provision result class to the provision-completed topic. On dev the read command was consumed and handled but its answer fell back to the provision-completed topic, so the dev identity bind waited 30 s on tenant-read-completed twice and timed out. The contract-shape tests fail on the previous commit, where publish_topics held only the terminal event and no published_events map existed, and pass after the change; the publish-parity gate exempts only a topic routed to a result class the node defines (negative control in the same test file). This binds AC5: the bind that reads the tenant row is the precondition of the C29 and C30 runs reading a precondition."
  source: manual
  binds_ac:
  - AC5
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_tenant_provision_effect/test_contract_shape.py tests/nodes/node_tenant_provision_effect/test_runtime_publishes_read_answer.py tests/gates/test_contract_publish_parity.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn26043-refused-request-failed-terminal
  description: A delegation request the wire model refuses (a task class the contract does not declare, an invalid payload field) now ends with a failed terminal carrying the request's correlation id and tenant and a typed class and code, so a gateway run reads failed instead of staying published. A request with no readable correlation id still emits no terminal, and a valid request still routes. The tests fail on the base commit, where the dispatcher answered INVALID_MESSAGE with no output event, and pass after the change. This binds AC5 (the dead-run clauses of C14, C16 and C28).
  source: manual
  binds_ac:
  - AC5
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/delegation/test_invalid_request_failed_terminal_omn26043.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn26043-gateway-check-budget-completes
  description: "A gateway check's submission carries an output budget of 512 tokens, not 32, and a prompt that asks for the one code block a task_type test run's gate grades. C29 run c29-20261126T044722Z-f2c5a20f read FAIL on completed_under_tenant_key with the tenant's own OpenRouter key answering: the workflow failed with finish_reason=length because the probe asked for 32 tokens, and the gateway refusing a truncated answer is intended behaviour; the check's budget was the defect (a lab run at 128 still truncated; at 1024 the old prompt failed the gate with TASK_MISMATCH on 2 of 4 runs; with the new prompt and 512, 5 of 5 completed). The new test fails on the previous commit, where every submit carried 32, and passes after the change. This binds AC5: C29 reading green needs a healthy run that can finish."
  source: manual
  binds_ac:
  - AC5
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_delegation_check_probe_effect/test_gateway_check_token_budget.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn26043-host-install-shared-context
  description: "The host install orchestrator keeps its working memory at class level, because the runtime builds one handler instance per routing entry: a registry result consumed by an instance other than the one that took the request now finds the install's context and publishes the next step, where it read 'ignored a registry result' and no terminal arrived (measured on the dev runtime for two dry runs of the delegation-check-probe unit on h053, 2026-11-26). The new test fails on the previous commit and passes after; its failing control shows a result for an install no instance started is still ignored. This binds AC5: the second delegation check runner on h053 cannot be installed until the orchestrator ends an install."
  source: manual
  binds_ac:
  - AC5
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_host_install_orchestrator -q --no-cov -n 0 -p no:randomly
    cwd: .
