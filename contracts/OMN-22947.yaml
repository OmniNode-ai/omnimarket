schema_version: 1.0.0
ticket_id: OMN-22947
title: "Piece 8's reading: a group-setting test and a daily runner-group read plus a canary public workflow read NOT WORKING when a public repository can see a lab group"
summary: A pure compute node reads the organization's runner groups, its repositories and the runs of the canary public workflow that a fetching effect already read. A group that allows public repositories and holds lab runners, a public repository that can see a lab group, and a canary run picked up by a lab group each read NOT WORKING. An unread, empty or stale read, and an unread canary, read UNKNOWN. This pull request adds the node and its tests; the daily read that feeds it is a later piece.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn22947-reading
  statement: The runner-group reading reads NOT WORKING when a public repository can reach a group that holds lab runners, and passes for the closed groups.
  acceptance:
  - id: AC1
    statement: 'AC1: the group-setting test fails for a group that allows public repositories and holds lab runners, and passes for the closed groups -- falsifier: uv run pytest src/omnimarket/nodes/node_runner_group_reading_compute -q -k group_setting'
  - id: AC2
    statement: 'AC2: a fixture where a public repository can see a lab group flips the reading to NOT WORKING within one probe -- falsifier: uv run pytest src/omnimarket/nodes/node_runner_group_reading_compute -q -k public_sees_lab'
  - id: AC3
    statement: 'AC3: generated golden and error chain tests exist and a named mutation turns each red -- falsifier: uv run pytest src/omnimarket/nodes/node_runner_group_reading_compute -q -k chain'
evidence_requirements:
- kind: tests
  description: The reading node's group-setting and public-sees-lab tests, with the golden and error chain tests of the node.
  command: uv run pytest src/omnimarket/nodes/node_runner_group_reading_compute tests/nodes/node_runner_group_reading_compute -q
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
