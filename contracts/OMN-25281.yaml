      "omn24874 and alarm" --collect-only -q` collects no test'
- id: req-omn25281-ac4
  statement: The golden chain accepted reply comes from the append command under CliRunner, and a duplicate receipt makes the tick return zero.
  acceptance:
  - id: AC4
    statement: 'AC4: the golden chain accepted reply comes from the append command run under CliRunner, and a duplicate-receipt case makes the tick return zero, each with a test -- falsifier: `uv run
      --frozen pytest tests -k "omn24874 and golden_chain" -q` passes with the reply hand-built or with a duplicate mapped to a non-zero exit'
