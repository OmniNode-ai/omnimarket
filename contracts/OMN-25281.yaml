    statement: 'AC1: every per-number check in the contracts reads the number inside the fixer''s comment for the current head only, and the shim tests cover both contract files -- falsifier: `uv run
      --frozen pytest tests/nodes/node_delegation_scenario_alarm_effect/test_contract_checks_omn25071.py -q` passes with a review comment that quotes the number-8 pattern and no fixer comment'
- id: req-omn25281-ac2
  statement: The Lab segment is one comment; a failing marker comment followed by a later comment and a corrected second comment are both tested.
  acceptance:
  - id: AC2
    statement: 'AC2: the Lab segment is bounded to one comment, with a test for a failing marker comment followed by a later comment holding the command and exit 0, and a test where a corrected second comment
      is read -- falsifier: `uv run --frozen pytest tests/nodes/node_delegation_scenario_alarm_effect/test_contract_checks_omn25071.py -q` passes with the segment running to the next marker across comment ends'
- id: req-omn25281-ac3
  statement: Each dod item runs a file or selector that selects a test in the diff.
  acceptance:
