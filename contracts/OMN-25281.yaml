- id: req-omn25281-ac6
  statement: Non-blocking findings 7, 8 and 9 are fixed or argued; a Lab comment names the head, the command and exit 0.
  acceptance:
  - id: AC6
    statement: 'AC6: non-blocking findings 7, 8 and 9 are fixed (R9 stale row stamped at max of bucket start and ran_at plus max_age, with a test) or argued with evidence in a PR comment, and a PR comment
