schema_version: 1.0.0
ticket_id: OMN-25281
title: 'Review findings 1 to 9 on the alarm pull request at head 38481c6661f2 are fixed or argued: the per-number and Lab checks read one comment, the golden chain reply comes from the command, and a duplicate
  receipt returns zero'
summary: The contract checks of the alarm pull request read each finding number and the Lab sha, command and exit 0 inside the one comment that opens with the Lab marker for the current head, from the bus
  read of onex scm pr-view; the golden chain takes the accepted and the duplicate reply from the real append command run under CliRunner, and a duplicate receipt returns zero from the tick; a stale row is
  stamped no earlier than the run it cites.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
