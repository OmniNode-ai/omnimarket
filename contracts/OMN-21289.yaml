title: "Delegation targets are adapters behind one delegation effect node, and no harness is invoked outside its handlers"
summary: "Adds node_harness_invocation_check_effect: an effect node whose handler reads the repository's Python and shell sources, finds every place one starts the codex or claude CLI or calls an OpenRouter or GLM HTTP endpoint, and refuses each site outside the handlers of node_llm_delegation_call_effect that its contract's shrink-only baseline does not hold, and each baseline entry whose sites are gone. The baseline is exactly the six sites measured on dev when the check landed. A repository-wide test runs the check in hosted CI on every PR. AC2 (adapter classes selected from the contract) is not built in this change."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-no-harness-invocation-outside-delegation-effect"
    statement: |-
      No harness (codex CLI, claude CLI, a GLM or OpenRouter HTTP call) is invoked outside a handler of the delegation effect node, except the shrink-only measured baseline.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: a check refuses a harness invocation outside a handler of the delegation effect node -- falsifier: pytest of the check over a fixture script calling the codex CLI directly
