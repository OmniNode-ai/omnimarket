schema_version: 1.0.0
ticket_id: OMN-23303
title: The job-log filler's launchd timer binds its own evidence in its contract, so its change passes dod-verify
summary: A launchd unit runs the job-log filler every 120 s, newest failure first, with parallel probes and a probe memo, so a failed job's log is in the mirror within minutes instead of never.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23303-filler-timer
  statement: The host installer declares a unit that runs the job-log filler tick on a timer; the tick selects red runs before named ones and newer before older, probes the cache in parallel, and does not probe a confirmed log again inside the reprobe window.
  acceptance:
  - id: AC1
    statement: 'AC1: the filler''s timer evidence is bound in this ticket''s contract and dod-verify passes on omnimarket#5575 -- falsifier: pr_state_local.py --pr omnimarket#5575 shows no repo-evidence red, and uv run pytest tests -q -k job_log_filler passes'
  - id: AC2
    statement: 'AC2: after install on the Mac, a failed required job on an open in-scope PR has its log in the mirror within 15 minutes -- falsifier: a lane read of that job''s log through the mirror returns the log, not JOB-LOG-CACHE-MISS'
evidence_requirements:
- kind: tests
  description: The filler tick tests (selection order with its failing control, the probe memo, the golden and error ticks, the unit declaration) and the filler's own and chain tests pass
  command: uv run --frozen pytest tests/nodes/node_job_log_filler_effect -q --no-cov -p no:randomly -k job_log_filler
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23303-timer-and-order
  description: Runs the focused filler tests. The installer declares the job-log-filler unit at a 120 s interval that runs the tick module; a fresh failure behind a backlog of old reds is filled in the next pass (the failing control reads in watcher order and defers it); a confirmed log is not probed again until the reprobe window passes and a cache that lost its log is refilled after it; a golden tick writes the reading and an error tick (unreadable watcher state, no overlay) fails and says why.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_job_log_filler_effect/test_job_log_filler_tick.py -q --no-cov -p no:randomly
    cwd: .
- id: dod-omn23303-filler-regression
  description: The filler's own tests and the golden and error chain event tests still pass with the changed handler and models. Binds no criterion; it is a regression check.
  source: manual
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_job_log_filler_effect/test_job_log_filler.py tests/nodes/node_job_log_filler_effect/test_golden_chain_node_job_log_filler_effect.py -q --no-cov -p no:randomly
    cwd: .
- id: dod-omn23303-unit-run-limit
  description: Runs the installer's run-limit test, which holds every declared unit, the new job-log-filler unit included, to a run timeout of at most three intervals. A regression check, not proof of a criterion, so it binds none (it passes at the merge base by design).
  source: manual
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_host_installer_registry_units/test_run_timeout.py -q --no-cov -p no:randomly
    cwd: .
- id: dod-omn23303-filler-deploy
  description: Runs the unit-declaration test, which reads the installer contract and fails on a branch without the ai.omninode.job-log-filler unit at its 120 s interval. Runs on a hosted runner.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_job_log_filler_effect/test_job_log_filler_tick.py -q --no-cov -p no:randomly -k installer_declares
    cwd: .
- id: dod-omn23303-integration-proof
  description: On the Mac after the unit is installed from the branch, one failed required job of an open in-scope pull request is read through the mirror within 15 minutes of its failure and returns the log, not JOB-LOG-CACHE-MISS. The first check runs the filler tests at the pushed head on a lab host through the lab work runner. Hosted CI cannot reach the Mac or the deployed gateway cache, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: 'env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23303 --kind test -- uv run --frozen pytest tests/nodes/node_job_log_filler_effect -q --no-cov -p no:randomly'
    cwd: .
  - check_type: command
    check_value: "test -s $HOME/.local/state/omni/job-log-filler/last-run.json && grep -Eq 'status.: .(completed|partial)' $HOME/.local/state/omni/job-log-filler/last-run.json"
    cwd: .
