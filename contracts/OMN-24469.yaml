schema_version: 1.0.0
ticket_id: OMN-24469
title: Stability lane refresh refuses to run when the host disk is below a declared floor
summary: node_stability_lane_refresh_effect reads the free space of the volume its host overlay names and refuses a refresh, before anything is run, when it is below the overlay's floor or cannot be read. The volume and the floor are overlay values with no default and no hard-coded host fact.
is_seam_ticket: true
interface_change: true
interfaces_touched:
- topics
- public_api
requirements:
- id: req-omn24469-refresh-disk-floor
  statement: A stability lane refresh answers refused-low-disk, on the node's refused topic with exit 67 and without running the refresh script, when the free space of the overlay's disk_floor path is under its min_free_gib, unreadable, or when the overlay declares no floor.
  acceptance:
  - id: AC1
    statement: 'AC1: a stability lane refresh reads the free space of the volume its host overlay names and refuses, before running anything, when it is below the overlay''s floor, and refuses when the reading cannot be taken -- falsifier: uv run --frozen pytest tests/nodes/node_stability_lane_refresh_effect -q --no-cov -k disk_floor'
  - id: AC2
    statement: 'AC2: a host overlay without a disk floor still loads and a refresh with no declared floor refuses and reads no disk, and the example overlay carries a floor -- falsifier: uv run --frozen pytest tests/nodes/node_stability_lane_refresh_effect -q --no-cov -k "disk_floor"'
  - id: AC3
    statement: 'AC3: a low-disk request on the in-memory bus answers with one refusal event naming the low-disk outcome and no completed or failed event; the real host profile exits 67 on a floor its volume cannot meet -- falsifier: uv run --frozen pytest tests/nodes/node_stability_lane_refresh_effect -q --no-cov -k "low_disk or below_the_overlay_floor"'
  - id: AC4
    statement: 'AC4: integrated: on the stability lane host the refresh node, with the floor value in its overlay, answers a refresh request on the bus and the answer names the free space it read -- falsifier: the lab receipt names the host, the revision running, the request''s correlation id and the free space read'
evidence_requirements:
- kind: tests
  description: Golden chain, error chain, failing control and real-profile tests of the disk floor
  command: uv run --frozen pytest tests/nodes/node_stability_lane_refresh_effect -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24469-tests
  description: AC1 to AC3 proven by the named tests; AC4 is read on the stability lane host after the declared install and named in the pull request.
  source: manual
  binds_ac:
  - AC1
  - AC2
  - AC3
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_stability_lane_refresh_effect -q --no-cov
    cwd: .
- id: dod-omn24469-deploy-conditions
  description: 'Deploy probe the hosted runner can run: the node overlay example at the checked-out commit declares disk_floor; the line does not exist at the merge base, so the probe fails there.'
  source: manual
  checks:
  - check_type: command
    check_value: bash -o pipefail -c 'gh api "repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_stability_lane_refresh_effect/overlay.example.yaml?ref=$(git rev-parse HEAD)" --jq .content | base64 -d | grep -F "disk_floor:" > /dev/null'
    cwd: .
- id: dod-omn24469-integration-proof
  description: The change is run on a lab host at the pushed head and the reading is named in the pull request; AC4's stability-host reading is taken after the declared install and named there.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane write-carry3-6803 -- uv run --frozen pytest tests/nodes/node_stability_lane_refresh_effect -q --no-cov
    cwd: .
