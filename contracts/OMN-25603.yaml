schema_version: 1.0.0
ticket_id: OMN-25603
title: The broker ACL driver's bare-word credential form refuses a tilde, which the shell expands to a home directory
summary: The generated broker ACL prologue read DEV_KAFKA_SASL_* values from the declared operator env file with a bare-word form check whose negated bracket class omitted the tilde, while the real consumer sources the file as shell and tilde-expands `~` at the start of a value and after a colon to a home directory path. The bare-word class now excludes the tilde, so a bare-word value holding a tilde anywhere fails closed with exit 3 and the prologue marker for both DEV_KAFKA_SASL keys, a plain word still reads, and the driver docstring and the form-check comment list the tilde among the characters a bare word may not hold. Single- and double-quoted values are unchanged (the shell does not expand a tilde inside quotes). Not in this change - the quoted-value forms, the credential extraction, any workflow, any host file.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn25603-tilde-bare-word
  statement: A bare-word credential value holding a tilde anywhere is refused fail-closed, for both DEV_KAFKA_SASL keys, and a plain word still reads.
  acceptance:
  - id: AC1
    statement: "AC1: a bare-word value holding a tilde anywhere is refused with exit 3 and the prologue marker, for both DEV_KAFKA_SASL keys, and a plain word still reads -- falsifier: uv run pytest tests/nodes/node_broker_acl_reconcile_effect -q -k tilde fails on dev 5cbfda50 and passes on the fix"
- id: req-omn25603-tilde-docstring
  statement: The driver docstring lists the tilde among the characters a bare word may not hold.
  acceptance:
  - id: AC2
    statement: "AC2: the driver docstring lists the tilde among the characters a bare word may not hold -- falsifier: uv run pytest tests/nodes/node_broker_acl_reconcile_effect -q -k bare_word_docstring asserts the docstring text"
evidence_requirements:
- kind: tests
  description: The tilde and docstring tests at the pushed head; both fail against the base driver and pass with the change.
  command: uv run pytest tests/nodes/node_broker_acl_reconcile_effect -q -k "tilde or bare_word_docstring" --no-cov -p no:cacheprovider
