schema_version: 1.0.0
ticket_id: OMN-24658
title: The review gateway's deferred key-state queue is bounded, its credit probe fails loud, and the change carries its own ticket
summary: 'A key-state event the bus refuses (the live state: the topic ACL refuses this host''s login) is deferred and the review moves to the next key. This change bounds what that defers: one held
  event per key (the newest state wins), drops counted, the held and dropped counts on the gateway''s /v1/key-events route, and a request that never waits on the bus past the wait the node contract
  declares. The standing credit probe `onex models review-gateway-key-probe` exits non-zero when no key gave a reading, writes through the existing ledger appender and its ONEX_LEDGER_COMMAND variable,
  and files its alarm row under this ticket. Not in this change: the broker ACL for the key-state topics and the probe schedule.'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24658-ticket
  statement: This change is filed under its own ticket in the contract file name, the test file names, the commits, the branch, the body and the alarm row's ticket cell.
  acceptance:
  - id: AC1
    statement: 'AC1: the contract is contracts/OMN-24658.yaml, the probe test file carries omn24658 in its name, and no file at the head names the placement mechanism ticket -- falsifier: uv run pytest
      tests/unit/nodes/node_claude_review_gateway_effect/test_review_key_credit_probe_omn24658.py -q -k rendered_row'
- id: req-omn24658-skip
  statement: A review reaches the next funded key in the same call when keys are out of credit and the bus refuses every publication.
  acceptance:
  - id: AC2
    statement: 'AC2: with two keys out of credit, one funded key and a bus that refuses every publication, the review answers 200 and the two set-aside events are queued -- falsifier: uv run pytest
      tests/unit/nodes/node_claude_review_gateway_effect/test_review_gateway_key_events_omn24658.py -q -k third'
- id: req-omn24658-bound
  statement: The deferred key-state queue is bounded and an unreachable bus never holds a request past the declared wait.
  acceptance:
  - id: AC3
    statement: 'AC3: the held events are one per key, drops are counted, the depth is on the key-events route, and a bus that never answers holds a request no longer than the declared wait --
      falsifier: uv run pytest tests/unit/nodes/node_claude_review_gateway_effect/test_review_gateway_key_events_omn24658.py -q'
- id: req-omn24658-probe
  statement: The credit probe fails loud, reuses the ledger appender and is exercised end to end.
  acceptance:
  - id: AC4
    statement: 'AC4: the probe exits non-zero when no key gave a reading, writes through the existing appender on ONEX_LEDGER_COMMAND, and its command, appender and row renderer each have a test that
      asserts no key reference appears in a rendered row -- falsifier: uv run pytest tests/unit/nodes/node_claude_review_gateway_effect/test_review_key_credit_probe_omn24658.py -q'
evidence_requirements:
