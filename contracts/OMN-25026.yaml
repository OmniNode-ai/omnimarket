- kind: tests
  description: The guard, scorer, wire, seam, triage pointer and two node tests run over the real tree.
  command: bash -c 'uv run pytest benchmarks/delegation_ladder/tests/test_scorers.py tests/ci/test_check_wire_compatibility_omn18868.py tests/unit/test_no_retired_package_running_references.py tests/test_golden_chain_seam_parallel_executor.py tests/unit/test_triage_routing_policy_pointer_omn24967.py tests/nodes/node_dod_closeout_sweep_compute/test_retired_repository_dod_closeout_sweep_compute.py tests/nodes/node_lab_fill_effect/test_retired_repository_lab_fill.py -q --no-cov'
