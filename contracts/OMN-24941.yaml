schema_version: 1.0.0
ticket_id: OMN-24941
title: Pilot agentest, catch lanes that claim done when they are not
summary: 'Measured pilot of an outside trace checker on six finished lanes. The pilot report is written under the lab scratch reports folder; the pull request holds only the converter, a pure compute node (node_agent_trace_otel_compute) that turns a headless lane log (stream-json or session records) into an OpenTelemetry GenAI trace (tool calls, results, final message) and an MCP-style tools list. The node carries no code from the checker it was piloted against. Draft only, not handed off.'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24941-ac1
  statement: 'the pilot report gives a six-lane table with truly done or not, the agentest verdict with its evidence line, caught or missed, and a STATUS row'
  acceptance:
  - id: AC1
    statement: 'AC1: a report with a table of six lanes (three truly done, three whose done the integration pass later read as not running, among them run484-1620 and run6021-1620) gives for each lane: truly done or not, the agentest verdict with its evidence line, and caught or missed, plus a STATUS row -- falsifier: `test -s <report path> && grep -c ''STATUS'' <report path>` prints at least 1 and the table has six lane rows'
- id: req-omn24941-ac2
  statement: 'the report names the pinned agentest commit and says its code was read before it ran in a venv in a scratch folder on h051'
  acceptance:
  - id: AC2
    statement: 'AC2: the report names the pinned agentest commit (40 hex characters) and states that its code was read before it ran, and the venv sat in a scratch folder on h051 -- falsifier: `grep -E ''[0-9a-f]{40}'' <report path>` matches the pin and `ssh h051 pip list` outside the venv shows no agentest'
- id: req-omn24941-ac3
  statement: 'a converter from our stream-json log to OTel GenAI spans exists with a test that fails when a tool result is dropped'
  acceptance:
  - id: AC3
    statement: 'AC3: a small converter from our stream-json log to OTel GenAI spans (tool calls, results, final message) exists, with a test that fails when a tool result is dropped -- falsifier: `uv run pytest <converter test path> -q` passes on the lane''s branch and fails with the result mapping removed'
- id: req-omn24941-ac4
  statement: 'the report says whether agentest catches false done claims well enough to become a check behind an effect node, names the node, and states what the converter would need to become'
  acceptance:
  - id: AC4
    statement: 'AC4: the report says plainly whether agentest catches false done claims well enough to become a check on every lane''s result behind an effect node, names the node, and states what the converter would need to become -- falsifier: `grep -iE ''integrate (behind|via)'' <report path>` returns the verdict line and `grep -i ''converter would need'' <report path>` returns its section'
- id: req-omn24941-ac5
  statement: 'the pilot changed no lane, runner, hook or prod; the converter goes in a draft pull request only, not handed off'
  acceptance:
  - id: AC5
    statement: 'AC5: the pilot changed no lane, runner, hook or prod; any converter kept goes in a draft pull request only, not handed off -- falsifier: `onex scm pr-list <repo>` shows the lane''s pull request as a draft and the ledger holds no handoff row for lane agentest-1915'
evidence_requirements:
- kind: tests
  description: The converter node's tests pass at the pushed head.
  command: uv run --frozen pytest src/omnimarket/nodes/node_agent_trace_otel_compute/tests -q -p no:cacheprovider --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24941-ac1
  description: 'The pilot report sits in the lab scratch reports folder on the host that ran the pilot and holds the six-lane table and a STATUS line; hosted CI cannot read that folder, so the check is the local Done gate only.'
  source: manual
  execution_scope: local_done_gate
  binds_ac:
  - AC1
  checks:
  - check_type: command
    check_value: sh -c 'f=$(ls "$OMNI_HOME"/.claude_scratch/reports/agentest-1915-*.md | tail -1) && test -s "$f" && test "$(grep -c STATUS "$f")" -ge 1'
    cwd: .
- id: dod-omn24941-ac2
  description: 'The report names the pinned commit as 40 hex characters; the pilot venv sat under a scratch folder on h051 and no agentest distribution is installed outside it (local Done gate only, the report and host are not reachable from hosted CI).'
  source: manual
  execution_scope: local_done_gate
  binds_ac:
  - AC2
  checks:
  - check_type: command
    check_value: sh -c 'f=$(ls "$OMNI_HOME"/.claude_scratch/reports/agentest-1915-*.md | tail -1) && grep -qE "[0-9a-f]{40}" "$f"'
    cwd: .
- id: dod-omn24941-ac3
  description: 'The converter tests pass: the tool result is copied into the execute_tool span, an error result marks the span, the final message and first user text map to the root span, unmatched calls are listed, Bash read-only classification, ignored record types, determinism and truncation. The result-mapping test fails when the code that copies the tool result into the span is removed.'
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest src/omnimarket/nodes/node_agent_trace_otel_compute/tests/test_trace_convert.py -q -p no:cacheprovider --no-cov
    cwd: .
- id: dod-omn24941-ac4
  description: 'The report holds the verdict line (integrate behind a named node, or not) and the section on what the converter would need to become; local Done gate only because the report sits in the lab scratch reports folder.'
  source: manual
  execution_scope: local_done_gate
  binds_ac:
  - AC4
  checks:
  - check_type: command
    check_value: sh -c 'f=$(ls "$OMNI_HOME"/.claude_scratch/reports/agentest-1915-*.md | tail -1) && grep -qiE "integrate (behind|via)" "$f" && grep -qi "converter would need" "$f"'
    cwd: .
- id: dod-omn24941-ac5
  description: 'The pull request changes only the converter node, its model, its tests, the entry-point line and this contract; no lane runner, hook or host file is touched. Hosted proxy: the converter tests pass at the head. The draft state and the absence of a handoff row are read from the PR watcher and the ledger by the orchestrator.'
  source: manual
  binds_ac:
  - AC5
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest src/omnimarket/nodes/node_agent_trace_otel_compute/tests -q -p no:cacheprovider --no-cov
    cwd: .
- id: dod-omn24941-integration-proof
  description: the converter node's tests run on a lab host at the pushed head; hosted CI cannot reach the lab, so only the local Done gate runs this unbound check. The pilot reading of six lane logs through the converter is in the pilot report.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24941 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest src/omnimarket/nodes/node_agent_trace_otel_compute/tests -q --no-cov
