schema_version: 1.0.0
ticket_id: OMN-25406
title: A shared red that holds five or more pull requests, or measures a different environment than the one it gates, raises one operator question
summary: A new compute node judges the shared causes the landing controller records. It yields one operator question per cause and pull request set (fix the gate, admit by label, keep waiting), prints each cause's age in hours, pull request count and question state for queue-status, and refuses an andon-start row on a shared check that lacks the environment the check measures and a reading of the gated environment taken within the hour.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn25406-shared-blocker
  statement: A shared red cannot hold pull requests, or stop the line, without an operator question and a reading of the environment it gates.
  acceptance:
  - id: AC1
    statement: 'AC1: an andon-start row on a shared check is refused unless it carries the environment the check measures and a reading of the gated environment taken within the hour -- falsifier: `uv run pytest -q -k andon_guarded_env` refuses the recorded 2026-11-17T12:37:06Z andon-start row text and admits it with both cells added'
  - id: AC2
    statement: 'AC2: a shared cause that holds five or more pull requests for two hours, or whose measured environment is not the gated branch''s environment, or whose gated environment reads healthy, writes one MSG to the operator with the options (fix the gate, admit by label, keep waiting) and asks again only when its pull request set changes -- falsifier: `uv run pytest -q -k shared_blocker_escalation` over the recorded landing ticks.jsonl slice 2026-11-17T00:00Z to 12:00Z yields exactly one question by 04:30Z'
  - id: AC3
    statement: 'AC3: queue-status prints each shared cause with its age in hours, its pull request count and whether its question is open -- falsifier: `uv run pytest -q -k queue_status_shared_cause_age` on the same recorded slice prints the Delegation Health Check cause with age and count'
evidence_requirements:
- kind: tests
  description: The shared-blocker escalation node's tests.
  command: env -u PYTHONPATH uv run --frozen pytest tests/nodes/node_shared_blocker_escalation_compute -q --no-cov -n 0 -p no:randomly
- kind: manual
  description: 'deploy: read the shared-blocker escalation handler at this head from the public repository and run the node tests on a hosted runner.'
  command: uv run pytest tests/nodes/node_shared_blocker_escalation_compute -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn25406-ac1-andon-guarded-env
  description: The recorded andon-start row text is refused and admitted with both cells added.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_shared_blocker_escalation_compute -q -k andon_guarded_env --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn25406-ac2-shared-blocker-escalation
  description: The replayed slice yields exactly one question by 04:30Z.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_shared_blocker_escalation_compute -q -k shared_blocker_escalation --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn25406-ac3-queue-status-shared-cause-age
  description: The status line prints the Delegation Health Check cause with its age, count and question state.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_shared_blocker_escalation_compute -q -k queue_status_shared_cause_age --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn25406-deploy-handler-at-head
  description: 'Hosted deploy readback: the public repository at this exact head must contain the shared-blocker escalation handler, and the node tests must pass there. No lab service is required.'
  source: manual
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_shared_blocker_escalation_compute -q --no-cov -n 0 -p no:randomly
    cwd: .
  - check_type: command
    check_value: |
      set -eu;
      curl --fail --silent --show-error --location --max-time 60 "https://raw.githubusercontent.com/OmniNode-ai/omnimarket/$(git rev-parse HEAD)/src/omnimarket/nodes/node_shared_blocker_escalation_compute/handlers/handler_shared_blocker_escalation.py" | grep -q '^class HandlerSharedBlockerEscalation:'
    cwd: .
- id: dod-omn25406-integration-proof
  description: Hosted CI cannot reach a lab host, so only the local Done gate runs this unbound check. It runs the node's tests at the sha on a lab host through the lab work runner.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-25406 --kind test -- uv run pytest tests/nodes/node_shared_blocker_escalation_compute -q --no-cov -n 0 -p no:randomly
    cwd: .
