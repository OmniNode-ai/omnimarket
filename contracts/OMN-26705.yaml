schema_version: 1.0.0
ticket_id: OMN-26705
title: The delegation quality check never accepts a score below its bar
summary: An attempt accepted with a score under its declared bar (a code class decided by executed checks) records the typed reason executed_checks_passed instead of quality_bar_met, and an UNDETERMINED rubric outcome is named in the acceptance detail.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn26705-below-bar-never-bar-met
  statement: A below-bar score is never recorded as accepted with reason quality_bar_met, and an UNDETERMINED rubric is named in the acceptance reason.
  acceptance:
  - id: AC1
    statement: 'AC1: a scored attempt below its required bar is never accepted with reason quality_bar_met -- falsifier: a unit test with actual_score 0.733 and required_bar 0.850 asserts the acceptance is not accept-with-quality_bar_met'
  - id: AC2
    statement: 'AC2: when the rubric outcome is UNDETERMINED the receipt says so in its acceptance reason instead of claiming the bar was met -- falsifier: a unit test with an UNDETERMINED rubric asserts the reason names the undetermined rubric'
  - id: AC3
    statement: 'AC3: the 2026-11-26 receipt fields replayed through the gate give the corrected outcome -- falsifier: a test built from that receipt acceptance fields'
evidence_requirements:
- kind: tests
  description: The focused tests, each failing against the unfixed derive_attempt_acceptance first and passing on the fix.
  command: uv run pytest tests/unit/delegation/test_omn26705_below_bar_accept_reason.py -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn26705-below-bar-not-bar-met
  description: A 0.733 score against a 0.850 bar is not accepted with quality_bar_met; an at-bar score still is.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/delegation/test_omn26705_below_bar_accept_reason.py -q --no-cov -n 0 -p no:randomly -k "ac1 or at_or_above"
    cwd: .
- id: dod-omn26705-undetermined-rubric-named
  description: An UNDETERMINED rubric verdict is named in the acceptance detail with its undetermined criteria.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/delegation/test_omn26705_below_bar_accept_reason.py -q --no-cov -n 0 -p no:randomly -k ac2
    cwd: .
- id: dod-omn26705-receipt-replay
  description: The 2026-11-26 receipt fields (0.733, 0.850, rubric UNDETERMINED) replay to accept with executed_checks_passed and a detail naming the rubric.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/delegation/test_omn26705_below_bar_accept_reason.py -q --no-cov -n 0 -p no:randomly -k ac3
    cwd: .
- id: dod-omn26705-integration-proof
  description: On a lab host, with the branch checked out at its pushed sha, the focused acceptance tests run with a known good (an at-bar score accepted as quality_bar_met) and a known bad (the 0.733 against 0.850 receipt replay, which must not read quality_bar_met). Hosted CI holds no lab host, so only the local Done gate runs this check, and it binds no criterion.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-26705-below-bar --kind test -- uv run --frozen pytest tests/unit/delegation/test_omn26705_below_bar_accept_reason.py -q --no-cov -n 0 -p no:randomly
    cwd: .
