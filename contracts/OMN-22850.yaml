  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env FLOOR_FILL_PARITY_BOOTSTRAP="$FLOOR_FILL_PARITY_BOOTSTRAP" uv run pytest tests/nodes/node_floor_task_ticket -q --no-cov -p no:randomly -m "floor_fill_parity and kafka"
    cwd: .
- id: dod-omn22850-integration-proof
  description: 'The focused command exits 0 on a lab host through lab-work: the two floor-task ticket nodes'' suites and their composition. The task''s lab step is none until T8 (the live mint of one real ready floor task), so the focused command is the proof. The hosted verifier cannot dispatch lab work, so this unbound check belongs to the local Done gate.'
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-focused-22850 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest src/omnimarket/nodes/node_floor_task_ticket_effect src/omnimarket/nodes/node_floor_task_ticket_payload_compute tests/nodes/node_floor_task_ticket -q --no-cov
    cwd: .
