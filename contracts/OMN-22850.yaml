- id: dod-omn22850-ac1-real-gate
  description: AC1 the stubbed node_create_ticket runs the installed ticket-creation guard and accepts the payload; the same guard refuses a payload whose criteria lose their falsifiers. The hosted verifier has no installed guard, so this unbound check belongs to the local Done gate.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env ONEX_TICKET_GUARD_PATH="$ONEX_TICKET_GUARD_PATH" uv run pytest tests/nodes/node_floor_task_ticket -q --no-cov -p no:randomly -m real_gate
    cwd: .
- id: dod-omn22850-ac7-redpanda
