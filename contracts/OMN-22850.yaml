schema_version: 1.0.0
ticket_id: OMN-22850
title: 'The floor-task ticket mint: node_floor_task_ticket_payload_compute and node_floor_task_ticket_effect'
summary: 'Two new nodes. node_floor_task_ticket_payload_compute is a pure compute that builds the create payload of one floor task''s ticket from the plan text (title, parent, verbatim criteria, Gate line, Definition of done block, Floor key line; no project, label or pillar) or returns NEEDS-SPEC, NO-PARENT or PLAN-UNREAD. node_floor_task_ticket_effect finds or creates the one ticket through ProtocolFloorTicketStore: search by the Floor key line first, create once, read back, fail closed and retry on the next tick, and judge an entry ticket.'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn22850-floor-task-ticket-mint
  statement: The stopped-line fill has no node that builds the ticket of a floor task from its plan text or mints it once, searching before creating, with a deadline on every Linear call.
  acceptance:
  - id: AC1
    statement: 'AC1: A ready task whose plan text has criteria with falsifiers, an integration check and a header ticket yields exactly one create whose payload passes the gate (the stubbed `node_create_ticket` runs the real gate and accepts it) and carries the parent, the verbatim criteria, the `Definition of done` block and the `Floor key:` line -- falsifier: `-k mint_payload_passes_gate`.'
  - id: AC2
    statement: 'AC2: A task whose text lacks a falsifier, an integration check or a header ticket returns `NEEDS-SPEC` (naming the parts) or `NO-PARENT` and makes zero Linear calls; a payload the gate refuses makes no ticket -- falsifier: `-k mint_needs_spec`, `-k mint_no_parent` and `-k mint_gate_refusal`, asserting the stub''s call list.'
  - id: AC3
    statement: 'AC3: Search comes before create: a task whose key already has a usable matching issue creates nothing and uses it; one whose only matches are Done, Canceled or an umbrella creates one ticket -- falsifier: `-k mint_search_before_create`, counting creates in the stub. An open match with a project or a delegation label creates nothing, uses nothing and ends `ticket-refused:old-fill-visible` -- falsifier: `-k mint_old_fill_visible_refused`.'
  - id: AC4
    statement: 'AC4: A create, search or read that exceeds the deadline ends the mint for the tick with no ticket and no lane; the next tick searches first, uses the late issue when the search returns it and creates once when it returns nothing -- falsifier: `-k mint_timeout_retries_next_tick`, with the stub''s search returning the late issue in one case and nothing in the other, and `-k mint_readback_after_create` (a create followed by an unreadable read-back, and by a read-back that is Canceled, store nothing and send no lane).'
  - id: AC5
    statement: 'AC5: With a late-completing create and a lagging search, two tickets exist for the key and the orchestrator''s pass (T13) starts exactly one lane for it -- falsifier: `-k duplicate_ticket_one_lane`, counting issues, launches and CLAIMs (lands with T13).'
  - id: AC6
    statement: 'AC6: *The old fill cannot pick a minted ticket.* `plan_ticket_backlog` (the one Linear-ticket rule of the generated source of both copies of the old fill, P18) run on the facts of a minted ticket (status Backlog, empty project, no labels, no pillar, a description holding the `Floor key:` line, in the shape the plugin passes it) returns no item and one `not-pillar` drop; the same facts with a `delegation` label, and again with a current-sprint project, return an item (the control: the test reaches the gate); and the payload compute emits no project, no label and no pillar -- falsifier: `-k floor_ticket_dropped_by_old_rule`, `-k floor_ticket_control_admitted` and `-k payload_has_no_source_fields`. A change to that rule that admits Backlog tickets fails the first of them and names the rule.'
  - id: AC7
    statement: 'AC7: G-NODE holds for both nodes, and the payload compute''s verdicts (payload, `NEEDS-SPEC`, `NO-PARENT`) are equal on the two legs -- falsifier: `-k floor_task_ticket_parity` with the Redpanda receipt in the PR body.'
evidence_requirements:
- kind: tests
  description: The focused suites of the two floor-task ticket nodes and their composition.
  command: uv run pytest src/omnimarket/nodes/node_floor_task_ticket_effect src/omnimarket/nodes/node_floor_task_ticket_payload_compute tests/nodes/node_floor_task_ticket -q --no-cov --tb=line -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
