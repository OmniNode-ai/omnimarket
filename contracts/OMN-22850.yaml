  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest src/omnimarket/nodes/node_floor_task_ticket_effect src/omnimarket/nodes/node_floor_task_ticket_payload_compute tests/nodes/node_floor_task_ticket -q --no-cov --tb=line -p no:randomly -k "mint_payload_passes_gate"
