schema_version: 1.0.0
ticket_id: OMN-23993
title: Keep each failed dev update's evidence and read dev's running revision against the merged head
summary: 'New omnimarket nodes for the dev roll evidence: a running-revision reading of the dev runtime against the merged head (compute and a lab source effect), a roll terminal and incident reading with
  the capture deadline, and a failure capture effect that keeps the failed container''s full log. Shadow readings that decide nothing; every bound is an overlay value.'
is_seam_ticket: true
interface_change: true
interfaces_touched:
- topics
- public_api
requirements:
- id: req-omn23993-evidence
  statement: A failed dev roll keeps its full log and its incident, and the dev runtime's running revision reads against the merged head.
  acceptance:
  - id: AC1
    statement: 'AC1: typed events for a runtime start, a roll incident, a capture receipt and a build manifest exist in omnimarket, each with a golden and an error chain test, and every bound is an overlay
      value -- falsifier: a bound or topic hard-coded in a handler, or an event with no chain test'
  - id: AC2
    statement: 'AC2: node_dev_running_revision_compute reads each repository''s running revision against its dev tip and gives per-repository behind-by-changes and behind-for-seconds and per-merge time
      to the first running revision that contains it -- falsifier: uv run --frozen pytest tests/unit/nodes/node_dev_running_revision_compute/test_handler_dev_running_revision.py -k manifest_missing -q --no-cov
      -n 0 -p no:randomly fails on a handler that reads a repository missing from the manifest as current'
  - id: AC3
    statement: 'AC3: a failed roll''s incident keeps the container''s full log through a capture node with a completeness manifest, and an incident pending past its bound reads red -- falsifier: a fixture
      failed roll whose log is lost, or a pending incident past the bound that does not read red'
  - id: AC4
    statement: 'AC4: integrated: read in the running dev runtime, the running revision reads per repository against the merged head and the start events of the next dev roll appear on the bus -- falsifier:
      no reading from the effect on a lab host, or a reading that says current while a merge older than the threshold is not contained in the running revision'
evidence_requirements:
- kind: tests
  description: The node chain, handler and seam tests pass at the pushed head.
  command: uv run --frozen pytest tests/unit/nodes/node_dev_running_revision_compute tests/unit/nodes/node_dev_running_revision_effect tests/unit/nodes/node_dev_roll_terminal_compute tests/unit/nodes/node_dev_roll_failure_capture_effect
    -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23993-ac1
  description: typed events for a runtime start, a roll incident, a capture receipt and a build manifest exist in omnimarket, each with a golden and an error chain test, and every bound is an overlay value
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/nodes/node_dev_running_revision_compute tests/unit/nodes/node_dev_roll_terminal_compute tests/unit/nodes/node_dev_roll_failure_capture_effect -q --no-cov
      -n 0 -p no:randomly
    cwd: .
- id: dod-omn23993-ac2
  description: node_dev_running_revision_compute reads each repository's running revision against its dev tip and gives per-repository behind-by-changes and behind-for-seconds and per-merge time to the
    first running revision that contains it
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/nodes/node_dev_running_revision_compute -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn23993-ac3
  description: a failed roll's incident keeps the container's full log through a capture node with a completeness manifest, and an incident pending past its bound reads red
  source: manual
