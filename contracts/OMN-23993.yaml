  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/nodes/node_dev_roll_terminal_compute tests/unit/nodes/node_dev_roll_failure_capture_effect -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn23993-ac4
  description: 'integrated: read in the running dev runtime, the running revision reads per repository against the merged head and the start events of the next dev roll appear on the bus'
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/nodes/node_dev_running_revision_effect -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn23993-integration-proof
  description: From the branch on a lab host, the running-revision compute node's chain tests read the real contract on the in-memory bus and the handler tests read a missing repository as unknown, never current. Hosted CI cannot reach the lab host, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23993-running-revision --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/nodes/node_dev_running_revision_compute -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn23993-integration-proof-effect
  description: From the branch on a lab host, the running-revision effect reads the provenance file through the process boundary, builds the merge histories and answers behind, with a source that cannot read answering failed and never a reading. Hosted CI cannot reach the lab host, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23993-running-revision-effect --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/nodes/node_dev_running_revision_effect -q --no-cov -n 0 -p no:randomly
    cwd: .
