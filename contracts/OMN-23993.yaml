schema_version: 1.0.0
ticket_id: OMN-23993
title: Keep each failed dev update's evidence and read dev's running revision against the merged head
summary: 'New omnimarket nodes for the dev roll evidence, first slice (R3): a running-revision reading of the dev runtime against the merged head (a compute node and a lab source effect). The roll terminal
  and incident reading and the failure capture (R1, R2) are a follow-up. Readings that decide nothing; every bound is an overlay value.'
is_seam_ticket: true
interface_change: true
interfaces_touched:
- topics
- public_api
requirements:
- id: req-omn23993-evidence
  statement: The dev runtime's running revision reads against the merged head.
  acceptance:
  - id: AC1
    statement: 'AC1: a typed build manifest, a running build and the reading''s facts exist in omnimarket with a golden chain, an error chain and a seam test, and every bound is an overlay value -- falsifier:
      a bound or topic hard-coded in a handler, or a model with no chain or seam test'
  - id: AC2
    statement: 'AC2: node_dev_running_revision_compute reads each repository''s running revision against its dev tip and gives per-repository behind-by-changes and behind-for-seconds and per-merge time
      to the first running revision that contains it -- falsifier: uv run --frozen pytest tests/unit/nodes/node_dev_running_revision_compute/test_handler_dev_running_revision.py -k manifest_missing -q --no-cov
      -n 0 -p no:randomly fails on a handler that reads a repository missing from the manifest as current'
  - id: AC4
    statement: 'AC4: integrated: read in the running dev runtime, the running revision reads per repository against the merged head and the start events of the next dev roll appear on the bus -- falsifier:
      no reading from the effect on a lab host, or a reading that says current while a merge older than the threshold is not contained in the running revision'
evidence_requirements:
- kind: tests
  description: The node chain, handler and seam tests pass at the pushed head.
  command: uv run --frozen pytest tests/unit/nodes/node_dev_running_revision_compute tests/unit/nodes/node_dev_running_revision_effect -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23993-ac1
  description: a typed build manifest, a running build and the reading's facts exist with a golden chain, an error chain and a seam test
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/nodes/node_dev_running_revision_compute tests/unit/nodes/node_dev_running_revision_effect -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn23993-ac2
  description: node_dev_running_revision_compute reads each repository's running revision against its dev tip and gives per-repository behind-by-changes and behind-for-seconds and per-merge time to the
    first running revision that contains it
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/nodes/node_dev_running_revision_compute -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn23993-ac4
  description: 'integrated: read in the running dev runtime, the running revision reads per repository against the merged head and the start events of the next dev roll appear on the bus'
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/nodes/node_dev_running_revision_effect -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn23993-integration-proof
  description: From the branch on a lab host, the running-revision compute node's chain tests read the real contract on the in-memory bus and the handler tests read a missing repository as unknown, never
    current. Hosted CI cannot reach the lab host, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23993-running-revision --kind test -- env PYTHONDONTWRITEBYTECODE=1
      uv run --frozen pytest tests/unit/nodes/node_dev_running_revision_compute -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn23993-integration-proof-effect
  description: From the branch on a lab host, the running-revision effect reads the provenance file through the process boundary, builds the merge histories and answers behind, with a source that cannot
    read answering failed and never a reading. Hosted CI cannot reach the lab host, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23993-running-revision-effect --kind test -- env
      PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/nodes/node_dev_running_revision_effect -q --no-cov -n 0 -p no:randomly
    cwd: .
