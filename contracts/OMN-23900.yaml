schema_version: 1.0.0
ticket_id: OMN-23900
title: The lane guard the lab runs and the one omnimarket owns become one program
summary: The lane guard program that bounds a lab lane's command exists as a plugin file the lab runs and an omnimarket file the end record landed in. Omnimarket's file gains the plugin file's stop notice, backstop runtime and same-start-time process check (this change, valid alone). The overlays repository change and the plugin change that ships omnimarket's file and deletes the plugin copy carry the ticket's other criteria in their own repositories.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23900-one-guard
  statement: One guard program, omnimarket's, that the plugin ships; the plugin copy is deleted.
  acceptance:
  - id: AC1
    statement: 'AC1: omnimarket''s guard program carries the stop notice, the backstop runtime and the same-start-time process check the plugin copy has -- falsifier: uv run pytest tests/nodes/node_lane_guard_unit_effect -q -k parity fails at the merge base'
evidence_requirements:
- kind: tests
  description: The parity tests at the pushed head; each fails at origin/dev where omnimarket's guard has no stop notice, backstop runtime or same-start-time check.
  command: env -u PYTHONPATH uv run --frozen pytest tests/nodes/node_lane_guard_unit_effect -q --no-cov -n 0 -p no:randomly -k parity
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23900-ac1-guard-parity
  description: Omnimarket's guard carries the stop notice, the backstop runtime and the same-start-time process check. Fails at origin/dev.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_lane_guard_unit_effect -q -k parity
    cwd: .
- id: dod-omn23900-ac1-integration-proof
  description: The pushed head ran the focused parity and end_record tests on a lab host through the lab work runner and exited 0. The guard program's own end line with a cause is read from the lane-shaped unit run recorded in the lab receipt comment on the ticket.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23900 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_lane_guard_unit_effect -q --no-cov -n 0 -p no:randomly -k "parity or end_record"
    cwd: .
