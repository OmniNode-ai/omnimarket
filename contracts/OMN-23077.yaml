    description: >-
      A stale piece 9 window probed twice with different ages over the same snapshot reads already-written, and a snapshot whose newest observation moved still reads replay-failed. At the merge base the first test fails with replay-failed.
    source: manual
    binds_ac:
      - AC1
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/nodes/node_reading_writer_effect/test_landing_row.py -q -n 0 --no-cov
        cwd: ${OMNI_HOME}/omnimarket
  - id: dod-omn23077-integration-proof
    description: The pushed head ran the landing reading tests on a lab host through the lab work runner and exited 0. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check; the live readback on h053 (the hourly reading writer from the branch, the same stale window probed twice) is in the pull request's Lab line.
    source: manual
    execution_scope: local_done_gate
    checks:
