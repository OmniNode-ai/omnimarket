schema_version: 1.0.0
ticket_id: OMN-23635
title: The input-size limit for local code drafts is an overlay setting read through the budget node
summary: Adds the input_ceiling operation to node_delegation_code_budget_compute, reads every input ceiling in routing through it from the overlay key delegation.code_budget.input_ceilings.<backend>.<task_class>, deletes the packaged measured_correct_ceilings key, and makes the edit loop's above-ceiling refusal name the overlay key. The number (8169 for local-coder code_generation) moves to the overlays repository unchanged.
is_seam_ticket: true
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23635-input-ceiling-overlay
  statement: The input ceiling of a backend and task class is an overlay value read through the budget node, with no packaged value and no fallback, and a refusal names the overlay key.
  acceptance:
  - id: AC1
    statement: "AC1: the budget node's new input_ceiling operation returns the overlay's ceiling for a named backend and task class and refuses an unnamed pair, and no measured_correct_ceilings key remains under src/omnimarket/configs -- falsifier: uv run pytest tests/nodes/node_delegation_code_budget_compute/test_input_ceiling.py -q, red on the dev head where the operation is absent"
  - id: AC2
    statement: "AC2: with the overlay ceiling lowered below a fixture request's size the route refuses with the ceiling reason naming the overlay key, and the injected break \"fall back to the old packaged value\" turns the test red -- falsifier: uv run pytest tests/unit/routing/test_measured_correct_ceiling_overlay.py -q"
  - id: AC3
    statement: "AC3: golden chain and error chain of the new operation, where an overlay that cannot be read is a typed failure and never a default -- falsifier: uv run pytest tests/nodes/node_delegation_code_budget_compute/test_chains_input_ceiling.py -q"
  - id: AC4
    statement: "AC4: integrated: on the dev lane a change of the overlay's ceiling for local-coder changes which backend a fixed over-ceiling draft is routed to, with no code change and no restart beyond the overlay's own reload -- falsifier: the two delegation receipts' backend ids read on the dev lane before and after the overlay change"
evidence_requirements:
- kind: tests
  description: The input_ceiling operation tests, its golden and error chains with named mutations, the routing overlay test with the injected fall-back break, and the seam test of the overlay document, the node and the routing read.
  command: uv run --frozen pytest tests/nodes/node_delegation_code_budget_compute tests/unit/routing/test_measured_correct_ceiling_overlay.py tests/unit/routing/test_local_coder_code_generation_ceiling.py -q --no-cov -p no:cacheprovider
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23635-ac1-operation
  description: The input_ceiling operation returns the overlay's ceiling for a named pair, refuses an unnamed pair, and no packaged measured_correct_ceilings key remains. Red at the merge base, where the operation and the test file are absent.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_delegation_code_budget_compute/test_input_ceiling.py -q --no-cov -p no:cacheprovider
    cwd: .
- id: dod-omn23635-ac2-route-refuses
  description: A lowered overlay ceiling makes the route refuse with the ceiling reason that names the overlay key; the injected fall-back to the old packaged value turns the test red.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/routing/test_measured_correct_ceiling_overlay.py tests/unit/routing/test_local_coder_code_generation_ceiling.py -q --no-cov -p no:cacheprovider
    cwd: .
- id: dod-omn23635-ac3-chains
  description: Golden chain and error chain of the input_ceiling operation, with named mutations that turn each chain red; an absent or broken overlay is a typed failure.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_delegation_code_budget_compute/test_chains_input_ceiling.py tests/nodes/node_delegation_code_budget_compute/test_seam_input_ceiling_overlay_routing.py -q --no-cov -p no:cacheprovider
    cwd: .
- id: dod-omn23635-deploy-probe
  description: Hosted structural probe that needs no lab route or broker. GitHub serves the budget node contract at the checked-out HEAD with the input_ceiling operation named, and serves the seam test. It fails at the merge base, which holds neither.
  source: manual
  checks:
  - check_type: command
    check_value: >-
      bash -o pipefail -c 'gh api "repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_delegation_code_budget_compute/contract.yaml?ref=$(git rev-parse HEAD)" --jq .content | base64 -d | grep -F "Operation input_ceiling" > /dev/null && gh api "repos/OmniNode-ai/omnimarket/contents/tests/nodes/node_delegation_code_budget_compute/test_seam_input_ceiling_overlay_routing.py?ref=$(git rev-parse HEAD)" --jq .content | base64 -d | grep -F "OVERLAYS_REPO_KEYS" > /dev/null'
- id: dod-omn23635-ac4-integration-proof
  description: The dev lane routes a fixed over-ceiling code draft to a different backend after the overlay's local-coder ceiling is changed, with no code change; the two delegation receipts' backend ids are read before and after. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  binds_ac:
  - AC4
  checks:
  - check_type: command
    check_value: 'env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23635 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_delegation_code_budget_compute tests/unit/routing/test_measured_correct_ceiling_overlay.py -q --no-cov'
    cwd: .
