- id: dod-omn21438-deploy-local-runtime
  description: Hosted deploy smoke dispatches the installed reducer through the ONEX CLI with an in-memory backend
    and checks typed admission and missing-reading refusal readbacks. No broker, credentials, Docker or lab service
    is required; this is packaged local execution, not a production rollout.
  source: manual
  binds_ac:
  - AC5
  - AC6
  - AC12
  checks:
  - check_type: test_passes
    check_value: env PYTHONDONTWRITEBYTECODE=1 uv run pytest tests/nodes/node_wip_gate_reducer/test_runtime_local.py
      -q --no-cov
    cwd: ${OMNI_HOME}/omnimarket
  - check_type: command
    check_value: |
      set -eu;
      export PYTHONDONTWRITEBYTECODE=1;
      probe_dir="$(mktemp -d)";
      trap 'rm -rf "$probe_dir"' EXIT;
      uv sync --locked;
      export PATH="$(uv run --locked python -c 'import sys; from pathlib import Path; print(Path(sys.executable).parent)'):$PATH";
      python -c '
      import json
      import sys
      from pathlib import Path
      from omnimarket.handlers.rules_wip_gate import load_wip_gate_contract
      root = Path(sys.argv[1])
      request = {"repo": "example", "dispatch_id": "deploy-probe", "now": "2026-10-27T12:00:00Z", "state": {"prs": {}, "last_tick": "2026-10-27T12:00:00Z"}, "policy": {"enforce_ruling": "enforcing", "dispatchable_repos": ["example"], "limits": {"example": {"limit": 5, "merges_per_hour": 1.5, "method": "supplied measurement", "evidence": "supplied evidence"}}, "exempt_roles": []}, "config": load_wip_gate_contract()[1].model_dump()}
      (root / "admit.json").write_text(json.dumps(request))
      request["state"] = None
      (root / "refuse.json").write_text(json.dumps(request))
      ' "$probe_dir";
      for expected in admit refuse; do
        onex node node_wip_gate_reducer --input "$probe_dir/$expected.json" --state-root "$probe_dir/$expected.state" --backend event_bus=inmemory --timeout 30 --output receipt --omnibase-path "$PWD" > "$probe_dir/$expected.receipt.json";
        python -c '
      import json
      import sys
      from pathlib import Path
      expected, path = sys.argv[1:]
      receipt = json.loads(Path(path).read_text())
      assert receipt["status"] == "success" and receipt["exit_code"] == 0, receipt
      result = receipt["result"]
      assert result["outcome"] == expected, result
      assert result["reason"] == {"admit": "under_limit", "refuse": "missing_reading"}[expected], result
      assert result["open"] == (0 if expected == "admit" else None), result
      print(json.dumps({"run_id": receipt["run_id"], "decision": result}, sort_keys=True))
      ' "$expected" "$probe_dir/$expected.receipt.json";
      done
    cwd: ${OMNI_HOME}/omnimarket
