schema_version: 1.0.0
ticket_id: OMN-23205
title: The floor publishes an mvp_launch block of 17 readings that reads WORKING only when every reading's newest scheduled run on the launch candidate is green
summary: Adds a pure handler beside the customer-health handler in node_product_floor_verdict_compute (decide_mvp_launch), its models and overlay loader, and the floor cycle step in node_floor_simple_effect that publishes the mvp_launch block on floor-simple.json.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23205-mvp-launch-block
  statement: The floor publishes an mvp_launch block of 17 readings; a reading is WORKING only when its newest scheduled run is green on the launch candidate (and, for a customer-machine reading, its Mac leg is WORKING in the newest walk).
  acceptance:
  - id: AC1
    statement: 'AC1: the block exists with exactly the 17 ids -- falsifier: curl -s <floor>/floor-simple.json | jq -e ''[.mvp_launch.readings[].id] | sort == (...17 ids...)'''
  - id: AC2
    statement: 'AC2: the handler refuses to load an overlay missing a kind, a grace, a scenario entry or a Mac leg for a customer-machine id, or holding a non-cron schedule or a derived id with a cron -- falsifier: uv run --frozen pytest tests/unit/nodes/node_product_floor_verdict_compute -q --no-cov
      -k "overlay_missing_grace_refused or overlay_missing_kind_refused or overlay_missing_scenario_refused or overlay_noncron_schedule_refused or derived_with_cron_refused or overlay_customer_machine_without_mac_leg_refused"'
  - id: AC3
    statement: 'AC3: the newest-run rule holds at its boundaries over recorded histories, each case asserting state and reason -- falsifier: uv run --frozen pytest tests/unit/nodes/node_product_floor_verdict_compute -q --no-cov -k "latest_slot_failed or unreadable_is_not_working or latest_running_is_not_working
      or older_success_not_used_while_latest_running or uncreated_slot_inside_grace_newest_run_decides or missed_slot_is_not_working or cron_boundary_exact or cancelled_is_not_working or derived_input_unreadable"'
  - id: AC4
    statement: 'AC4: a reading whose graded versions differ from the launch candidate manifest reads NOT WORKING with reason not-the-candidate -- falsifier: uv run --frozen pytest tests/unit/nodes/node_product_floor_verdict_compute -q --no-cov -k not_the_candidate'
  - id: AC5
    statement: 'AC5: a composite reading is green only on both sources -- falsifier: uv run --frozen pytest tests/unit/nodes/node_product_floor_verdict_compute -q --no-cov -k "composite_linux_green_mac_leg_missing or composite_linux_green_mac_leg_failed or composite_mac_leg_stale or composite_mac_green_linux_failed
      or composite_both_green"'
  - id: AC6
    statement: 'AC6: golden and error chain tests for the block run required in CI, and a named injected break turns the golden chain test red -- falsifier: uv run --frozen pytest tests/nodes/node_floor_simple_effect/test_mvp_launch_floor_simple.py -q --no-cov'
evidence_requirements:
- kind: tests
  description: The block's unit tests and the floor cycle's golden and error chain tests
  command: uv run --frozen pytest tests/unit/nodes/node_product_floor_verdict_compute -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
