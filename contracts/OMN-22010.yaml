schema_version: 1.0.0
ticket_id: OMN-22010
title: Refresh measured shard durations blocking the factory floor limits pull request
summary: The shard freshness check fails when at least 50 test files lack recorded durations. Append measured durations for ten existing test files without changing the checker or its threshold.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn22010-shard-record
    statement: The committed shard duration record includes the newly measured files and passes its existing freshness and partition checks.
    acceptance:
      - id: AC1
        statement: The existing shard record freshness test passes with fewer than 50 unrecorded files and the shard planner remains an exact partition.
evidence_requirements:
  - kind: tests
    description: Existing freshness and shard planning tests.
    command: uv run pytest tests/unit/test_ci_shard_plan_record_freshness_omn17427.py tests/unit/test_ci_shard_plan_omn19684.py -q --no-cov -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn22010-shard-record-ac1
    description: The unchanged freshness and shard planning tests read the refreshed record.
    source: manual
    binds_ac:
      - AC1
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/test_ci_shard_plan_record_freshness_omn17427.py tests/unit/test_ci_shard_plan_omn19684.py -q --no-cov -p no:randomly
        cwd: .
  - id: dod-omn22010-shard-record-deploy
    description: Hosted deployment-candidate smoke reads the committed record, refuses 50 unrecorded files, and verifies an exact partition across 20 shards. This CI data change does not attest a live service deployment.
    source: manual
    execution_scope: hosted_and_local
    checks:
      - check_type: command
        check_value: |
          python3 - <<'PY'
          import importlib.util
          import json
          from pathlib import Path
          spec = importlib.util.spec_from_file_location("durations", "scripts/ci/merge_test_durations.py")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          record = json.loads(Path("config/test_file_durations.json").read_text())
          files = module.discover_test_files(Path.cwd())
          weights, missing = module.file_weights(files, record)
          assert len(missing) < 50, missing
          shards = module.plan_shards(weights, 20)
          assert not module.verify_partition(shards, files)
          print(f"deployment-candidate shard record: PASS ({len(missing)} unrecorded, {len(shards)} shards)")
          PY
        cwd: .
