  - id: "dod-omn21034-source-probe"
    description: "Source probe: the rebase handler at the checked-out commit carries the head_moved refusal added by this PR. A head without it fails the probe."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: "grep -c 'head_moved: origin/' src/omnimarket/nodes/node_rebase_effect/handlers/handler_rebase.py"
  - id: "dod-omn21034-deploy-probe-handler-import"
    description: "Deploy smoke on the effects runtime after the deploy agent rolls this change: import the pr-polish handler and the rebase handler from the running container, assert that HandlerPrPolish.handle_async is a coroutine function and that the rebase handler source carries the head_moved refusal. The command exits nonzero on an image without this change, including the dev image deployed on lab host h202 at dispatch. It reads deployed code, not this contract or a receipt. Hosted CI has no effects runtime; the local Done gate must execute this unbound deployment check."
    source: "manual"
    execution_scope: "local_done_gate"
    checks:
      - check_type: "command"
        check_value: "docker exec ${RUNTIME_CONTAINER:-omninode-runtime-effects} python -c 'import inspect; from omnimarket.nodes.node_pr_polish.handlers.handler_pr_polish import HandlerPrPolish; from omnimarket.nodes.node_rebase_effect.handlers import handler_rebase; assert inspect.iscoroutinefunction(HandlerPrPolish.handle_async); assert \"head_moved: origin/\" in inspect.getsource(handler_rebase)'"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn21034-ac4-rebase-push-head-only"
    description: "AC4 (ticket criterion): the rebase effect makes exactly one push, a lease on refs/heads/<PR head> to origin HEAD:refs/heads/<PR head>, with no --force, -f, --mirror, --all or --tags, so a push to any other ref fails the test. Re-run by the accepting lane on lab host h051 at omnimarket dev ac5c2f4622266d90158aa019bf7b09e01552aaf6: passed. The same test fails against the product code at the parent of omnimarket#3815 (38ff38286e7b), where the lease named the bare branch."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/test_rebase_effect.py::test_push_targets_only_the_pr_head_branch -q -n 0"
    binds_ac: ["AC4"]
