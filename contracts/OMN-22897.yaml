schema_version: 1.0.0
ticket_id: OMN-22897
title: A job-start source reads which GitHub Actions jobs start and when, judges the read and keeps one record per read in a retained store
summary: node_job_start_source_effect is the job-start source of the base-first plan's step 0 (section 7.1, source 4). For the repositories an overlay declares it reads the jobs that started in a window (repository, run id, job id, runner group, labels, run event, fork head, start time) from an in-memory fixture or the GitHub REST API through an injected reader, judges the read on three subjects (every declared repository read, the read fresh, no public-origin start on a watched runner group off the dated baseline) and keeps one record per read in an in-memory store or as one STATUS row in the ledger through the reading appender, the kind of store the runner-group exposure read uses. A read that cannot be completed (denied, rate limited, over budget, truncated, unreadable, a reader that raised, a repository dropped) is a typed failure event and an unread record, never zero starts. This ticket adds the node, its contract, overlay examples, a CLI and tests; it does not install a schedule, read the real organization, or reconcile starts with hook events on the bus.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn22897-job-start-source
  statement: Which jobs start, and when, is read read-only for the declared repositories and kept, and a read that fails reads as a failure and never as zero starts.
  acceptance:
  - id: AC1
    statement: 'AC1: a clean read returns each started job with its repository, run id, job id, runner group, labels, fork flag and start time in start order, on the fake reader and on the GitHub reader over a fake HTTP getter (pages followed, queued and out-of-window jobs left out, the token only in the Authorization header), and ends in the completed topic -- falsifier: uv run --frozen pytest tests/nodes/node_job_start_source_effect -k golden -q --no-cov -p no:cacheprovider'
  - id: AC2
    statement: 'AC2: each named injected break reads on its own subject and the same overlay without it reads WORKING: a fork-head or a public-repository job on a watched runner group reads NOT_WORKING (a baseline repository does not count, a fork never is on the baseline), a repository the reader drops reads UNKNOWN with repositories-incomplete, and a read older than the max age reads UNKNOWN -- falsifier: uv run --frozen pytest tests/nodes/node_job_start_source_effect -k injected_break -q --no-cov -p no:cacheprovider'
  - id: AC3
    statement: 'AC3: a rate limit (429 or a 403 naming it), a denial, a missing token, a server error, a body that is not JSON, a call past the budget, a listing with more pages than the overlay allows and a reader that raises each give a typed failure on the failed topic with the start count None (not 0) and an UNKNOWN reading, and the failed read is still kept as an unread record -- falsifier: uv run --frozen pytest tests/nodes/node_job_start_source_effect -k error_chain -q --no-cov -p no:cacheprovider'
  - id: AC4
    statement: 'AC4: the ledger store appends one STATUS row per read carrying the verdict, the start count and digest, the first and last start time and the runs of public starts, the same read again is already-written, a failed read writes an UNKNOWN row with no start count, and an append that does not land, or a store with no appender, fails the run on the store-failed topic -- falsifier: uv run --frozen pytest tests/nodes/node_job_start_source_effect/test_job_start_source.py -k "ledger or append or already_written" -q --no-cov -p no:cacheprovider'
  - id: AC5
    statement: 'AC5: every setting (repositories, window, lookback, max age, watched groups, baseline, API base, token variable name, call budget, page size and limit, store route) is in the overlay with no default, the shipped examples load, an absent key refuses and names itself, the code names no repository, group or organization, and the CLI exits 0 on a read, 1 on a failed read and 3 when the overlay or a route variable is missing -- falsifier: uv run --frozen pytest tests/nodes/node_job_start_source_effect/test_overlay_and_cli.py -q --no-cov -p no:cacheprovider'
evidence_requirements:
