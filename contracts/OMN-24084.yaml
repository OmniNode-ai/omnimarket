schema_version: 1.0.0
ticket_id: OMN-24084
title: Shared message shapes and seam tests for lab health, prompt intent and PR status
summary: A reading of 40 producer and consumer contract pairs flagged three that looked like real declared mismatches. The lab health board and alert nodes subscribed to the evaluate node's topic but validated the payload into a wrapped request model (evaluation plus state) that the topic never carries, so every delivery would raise; their routes now declare the evaluate node's batch model as event_model and the handlers carry the projection and alert state between batches. The prompt intent producer typed its correlation id and emission time loosely (any string, optional) while the omnimemory consumer needs a UUID and a datetime; the producer model and handler now refuse what the consumer would refuse. The pull request status topic has two producer shapes and the branch-claim consumer accepts one; that pair is pinned by a test and not changed because the poller publishes nothing with its default config. The lane's broker login has no read permission on these topics, so the live read was unreadable and each pair is proven in process and on the in-memory bus.
is_seam_ticket: true
interface_change: true
interfaces_touched:
  - topics
requirements:
  - id: req-omn24084-shared-message-shapes
    statement: Each producer and consumer of the lab-sli-evaluated, intent-classified and pr-status topics shares a shape the other side accepts, shown by a seam test that serializes the producer's event and validates it with the consumer's declared model.
    acceptance:
      - id: AC1
        statement: 'AC1: the lab health board and alert nodes accept the batch the evaluate node publishes on its topic, state carried between batches -- falsifier: pytest tests/nodes/node_lab_sli_compute/test_seam_lab_sli_evaluated_consumers.py -q fails on the dev tip without this change'
      - id: AC2
        statement: 'AC2: every event the prompt-intent producer can emit validates in both of its consumers, and the producer refuses a missing emission time or a non-UUID id -- falsifier: pytest tests/nodes/node_prompt_intent_classify_compute/test_seam_intent_classified_consumers.py -q fails on the dev tip without this change'
      - id: AC3
        statement: 'AC3: the pull request status topic''s two producer shapes are pinned against the branch-claim consumer (webhook shape accepted, poller shape refused, poller publishes nothing by default) -- falsifier: pytest tests/nodes/node_branch_claim_check_effect/test_seam_pr_status_producers.py -q fails if either shape changes'
      - id: AC4
        statement: 'AC4: integrated: after merge and the dev roll, the running dev runtime image carries this change and a real crossing on the lab-sli-evaluated or intent-classified topic is handled without a validation error, read in the running runtime -- falsifier: the running image revision label is older than the merge commit, or the runtime records a validation error for these models'
evidence_requirements:
  - kind: tests
    description: The three seam test files, the lab SLI chain tests and the prompt intent tests pass at the pushed head.
    command: env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_lab_sli_compute tests/nodes/node_prompt_intent_classify_compute tests/nodes/node_branch_claim_check_effect -q -p no:cacheprovider
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn24084-ac1
    description: 'AC1: the model-level seam test (the contract-declared event model reads the published batch; board history and alert suppression carry across batches) and the in-memory bus test (the wired consumers run once per published batch and publish their terminal event) pass at the head; on the merge base the consumers declare no event model and the old request models raise ValidationError on the published batch.'
    source: manual
    binds_ac:
      - AC1
    checks:
      - check_type: test_passes
        check_value: env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_lab_sli_compute/test_seam_lab_sli_evaluated_consumers.py tests/nodes/node_lab_sli_compute/test_seam_lab_sli_evaluated_bus.py -q -p no:cacheprovider
        cwd: .
  - id: dod-omn24084-ac2
    description: 'AC2: the seam test validates every producer event in both consumers and the producer refuses a missing emission time and a non-UUID id; the handler tests show a non-UUID id and a missing or unparseable emission time yield no event. The two refusal tests fail on the merge base where the producer accepted both.'
    source: manual
    binds_ac:
      - AC2
    checks:
      - check_type: test_passes
        check_value: env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_prompt_intent_classify_compute -q -p no:cacheprovider
        cwd: .
  - id: dod-omn24084-ac3
    description: 'AC3: the pin test passes: the webhook observation validates in the consumer model read from the consumer contract, the poller event is refused naming entity_id, delivery_id, github_event and as_of, the poller default config names no repository, and the consumer contract declares its dead-letter topic.'
    source: manual
    binds_ac:
      - AC3
    checks:
      - check_type: test_passes
        check_value: env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_branch_claim_check_effect -q -p no:cacheprovider
        cwd: .
  - id: dod-omn24084-ac4
    description: 'hosted proxy for AC4: the seam and chain tests pass; the reading of a real crossing in the running dev runtime is named in the pull request and taken after the dev runtime runs this revision.'
    source: manual
    binds_ac:
      - AC4
    checks:
      - check_type: test_passes
        check_value: env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_lab_sli_compute/test_seam_lab_sli_evaluated_bus.py -q -p no:cacheprovider
        cwd: .
  - id: dod-omn24084-integration-proof
    description: the three seam test files and the lab SLI chain tests run on a lab host at the pushed head, including the in-memory bus test that wires the board and alert contracts as the kernel does; hosted CI cannot reach the lab, so only the local Done gate runs this unbound check
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24084 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_lab_sli_compute tests/nodes/node_prompt_intent_classify_compute tests/nodes/node_branch_claim_check_effect -q --no-cov
