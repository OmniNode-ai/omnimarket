schema_version: "1.0.0"
ticket_id: OMN-23055
title: Step 0 row 3, the gate store on Postgres
summary: >-
  Builds the part of rebuild step 0 row 3 that needs no deployment value: the gate store's Postgres backend (schema only by the node's two migrations, one row lock per request, the same rules as the in-memory twin, passing the frozen 8-check contract suite on a real Postgres with 3 named breaks failing it). The order writer, node_order_advance_effect, is the node merged on dev under OMN-22938; this change carries no copy of it and its tests live with that node. The start admission effect is built on omnimarket#5539 under OMN-22939. Every setting is in an overlay whose shape ships as an example with synthetic values. This does not make row 3 read true on the running system: that needs the gate_store and order_advance overlay values and the database connection from the deployment owner. Row 7's job-start source node is OMN-22897 on its own pull request.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn23055-step0-rows-3-4-7
    statement: >-
      Step 0 rows 3, 4 and 7 read true from the running system, each with a failing control. This pull request carries the built, tested parts of rows 3 and 4; the remaining reads are named in the pull request.
    acceptance:
      - id: AC1
        statement: "AC1: rows 3, 4 and 7 each read true from the running system, with a failing control per row -- falsifier: the step 0 table re-read from the running system"
evidence_requirements:
  - kind: tests
    description: >-
      The gate store test directory: the contract suite on the twin and on Postgres with the named breaks.
    command: uv run --frozen pytest tests/nodes/node_gate_store_effect -q -n 0 --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn23055-gate-store-postgres
    description: >-
      The Postgres backend passes the 8 checks of the frozen contract suite on a real Postgres whose relations were created only by the node's migrations, and the 3 named breaks (no row lock, commit before the kill point, no step-key memo) each fail the suite. Without an integration database the 13 integration tests skip under the repository's silent-skip guard and the 4 refusal tests pass.
    source: manual
    binds_ac:
      - AC1
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/nodes/node_gate_store_effect -q -n 0 --no-cov
        cwd: ${OMNI_HOME}/omnimarket
  - id: dod-deploy-omn23055-live-content
    description: >-
      The pushed head carries the new Postgres gate store on the repository, read live from GitHub at the head commit; each check fails when its handler class is absent at that commit.
    source: manual
    checks:
      - check_type: command
        check_value: gh api "repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_gate_store_effect/handlers/store_postgres.py?ref=$(git rev-parse HEAD)" --jq .content | base64 -d | grep -c '^class PostgresGateStore'
        cwd: ${OMNI_HOME}/omnimarket
  - id: dod-omn23055-integration-proof
    description: >-
      The pushed head ran the gate store test directory on a lab host and exited 0. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: |-
          uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane step0-rows-f-0210 -- uv run --frozen pytest tests/nodes/node_gate_store_effect -q -n 0 --no-cov
        cwd: .
