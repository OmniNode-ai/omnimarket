schema_version: "1.0.0"
ticket_id: OMN-23055
title: Step 0 rows 3 and 4, the gate store on Postgres, the order writer and the start admission effect
summary: >-
  Builds the parts of rebuild step 0 rows 3 and 4 that need no deployment value: the gate store's Postgres backend (schema only by the node's two migrations, one row lock per request, the same rules as the in-memory twin, passing the frozen 8-check contract suite on a real Postgres with 3 named breaks failing it), node_order_advance_effect (the order writer, with golden and error chain events, restart, fencing and 2 named breaks), and node_start_admission_effect (admit and start on the gate store, observe or enforce by path, single use, a planted bypass refused, a store with no answer admits and logs, with golden and error chain events and 2 named breaks). Every setting is in an overlay whose shape ships as an example with synthetic values. This does not make rows 3 or 4 read true on the running system: that needs the gate_store, order_writer and start_admission overlay values and the database connection from the deployment owner, and for row 4 the start-path census and the refusal drill on each live path. Row 7's job-start source node is OMN-22897 on its own pull request.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn23055-step0-rows-3-4-7
    statement: >-
      Step 0 rows 3, 4 and 7 read true from the running system, each with a failing control. This pull request carries the built, tested parts of rows 3 and 4; the remaining reads are named in the pull request.
    acceptance:
      - id: AC1
        statement: "AC1: rows 3, 4 and 7 each read true from the running system, with a failing control per row -- falsifier: the step 0 table re-read from the running system"
evidence_requirements:
  - kind: tests
    description: >-
      The three node test directories: the gate store contract suite on the twin and on Postgres with the named breaks, the order writer chains, and the admission chains and drill.
    command: uv run --frozen pytest tests/nodes/node_gate_store_effect tests/nodes/node_order_advance_effect tests/nodes/node_start_admission_effect -q -n 0 --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn23055-gate-store-postgres
    description: >-
      The Postgres backend passes the 8 checks of the frozen contract suite on a real Postgres whose relations were created only by the node's migrations, and the 3 named breaks (no row lock, commit before the kill point, no step-key memo) each fail the suite. Without an integration database the 13 integration tests skip under the repository's silent-skip guard and the 4 refusal tests pass.
    source: manual
    binds_ac:
      - AC1
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/nodes/node_gate_store_effect -q -n 0 --no-cov
        cwd: ${OMNI_HOME}/omnimarket
  - id: dod-omn23055-order-writer
    description: >-
      The order writer advances a test order, reports complete, waits on a piece that is not ready, continues from the store after a restart, is fenced by a handover between its read and its write, and is refused on another holder's record unless the overlay allows takeover; the golden chain and four error chains pass and 2 named breaks turn them red.
    source: manual
    binds_ac:
      - AC1
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/nodes/node_order_advance_effect -q -n 0 --no-cov
        cwd: ${OMNI_HOME}/omnimarket
  - id: dod-omn23055-start-admission
    description: >-
      Admission admits and consumes a reservation once, refuses the second start and the one over the limit on an enforced path, admits and logs what it would refuse on an observed or unlisted path, refuses a planted start that never reserved, and admits with a log entry when the store gives no answer; the golden chain and error chains pass and 2 named breaks let the planted bypass through.
    source: manual
    binds_ac:
      - AC1
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/nodes/node_start_admission_effect -q -n 0 --no-cov
        cwd: ${OMNI_HOME}/omnimarket
  - id: dod-deploy-omn23055-node-dispatch
    description: >-
      Each new node's contract loads and its handler answers its golden chain on the in-memory bus profile, which hosted CI can run; the Postgres profile is read on the lab.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/nodes/node_order_advance_effect/test_order_advance.py tests/nodes/node_start_admission_effect/test_start_admission.py -q -n 0 --no-cov -k "golden_chain"
        cwd: ${OMNI_HOME}/omnimarket
    binds_ac: []
  - id: dod-omn23055-integration-proof
    description: >-
      The pushed head ran the three node test directories on a lab host and exited 0. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: |-
          uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane step0-rows-f-0210 -- uv run --frozen pytest tests/nodes/node_gate_store_effect tests/nodes/node_order_advance_effect tests/nodes/node_start_admission_effect -q -n 0 --no-cov
        cwd: .
