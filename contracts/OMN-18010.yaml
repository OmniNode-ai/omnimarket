---
schema_version: "1.0.0"
ticket_id: "OMN-18010"
title: "Post-release dev version bump disarms the release-identity gate"
summary: "After a release is tagged on dev, the automated bump PR moves pyproject.toml and uv.lock to the next patch so dev's version is ahead of every published release it descends from."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-post-release-dev-bump"
    statement: "Dev's package version is strictly above the highest published release tag reachable from it, and uv.lock pins the same version."
    acceptance:
      - id: "AC1"
        statement: "scripts/check_release_identity.py in strict mode exits 0 on the bumped tree and uv.lock pins the pyproject.toml version."
  - id: "req-release-staleness-heal"
    statement: "A PR's red Release Staleness copy is re-run once a release newer than the base it failed against is published."
    acceptance:
      - id: "AC2"
        statement: "scripts/ci/pr_stale_red_heal.py re-runs a red Release Staleness job (and CI Summary when those are the run's only reds) when the newest published tag is newer than the failed measurement's base, and re-runs nothing when no release followed the red."
  - id: "req-local-observer-http-deadline"
    statement: "The local environment observer starts the HTTP request deadline after synchronous client construction."
    acceptance:
      - id: "AC3"
        statement: "Slow HTTP client construction does not turn a reachable local HTTP service into a down observation; real HTTP, TCP and closed-port observations retain their expected states."
  - id: "req-post-release-work-contract-pins"
    statement: "Packaged work contracts remain runnable after the post-release lockfile update."
    acceptance:
      - id: "AC4"
        statement: "Every packaged work-contract input pin matches this tree."
evidence_requirements:
  - kind: "tests"
    description: "Run the release-identity gate in strict mode against the tree and compare the uv.lock pin with pyproject.toml."
    command: "uv run pytest tests/ci/test_post_release_dev_bump_omn18010.py -q"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-post-release-dev-bump"
    description: "The bumped version is ahead of every reachable release and uv.lock agrees."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_post_release_dev_bump_omn18010.py -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC1"]
  - id: "dod-release-staleness-heal"
    description: "The stale-red heal re-runs a Release Staleness red once a newer release is tagged, and not otherwise."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_pr_stale_red_heal_omn19852.py -q -k release_staleness"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC2"]
  - id: "dod-omn18010-pr4306-local-observer-deadline"
    description: "Run the packaged observer against real loopback HTTP and TCP services, including slow HTTP client construction and a closed port."
    source: "manual"
    binds_ac: ["AC3"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/test_golden_chain_local_environment_observe_effect.py -q -k 'slow_client_construction or real_prober'"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn18010-pr4306-local-observer-deploy-probe"
    description: "Hosted-runner deploy check of the published source artifact at this checkout's exact commit. The client context must contain the HTTP timeout context. The former timeout-first implementation fails. This checks the package artifact and does not attest a running deployment."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: |-
          set -o pipefail;
          curl --fail --silent --show-error --location --max-time 30 "https://raw.githubusercontent.com/OmniNode-ai/omnimarket/$(git rev-parse HEAD)/src/omnimarket/nodes/node_local_environment_observe_effect/handlers/handler_local_environment_observe.py" | python3 -c 'import ast, sys; tree = ast.parse(sys.stdin.read()); clients = [n for n in ast.walk(tree) if isinstance(n, ast.AsyncWith) and any(isinstance(i.context_expr, ast.Call) and isinstance(i.context_expr.func, ast.Attribute) and i.context_expr.func.attr == "AsyncClient" for i in n.items)]; assert len(clients) == 1; assert any(isinstance(n, ast.AsyncWith) and any(isinstance(i.context_expr, ast.Call) and isinstance(i.context_expr.func, ast.Attribute) and i.context_expr.func.attr == "timeout" for i in n.items) for n in clients[0].body); print("local environment deploy probe: PASS")'
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn18010-pr4562-work-contract-pins"
    description: "Load the packaged corpus against this tree after the release bump; the test fails when any pinned input digest differs from the file on disk."
    source: "manual"
    binds_ac: ["AC4"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/test_work_contract_pins_current.py -q"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn18010-pr4562-work-contract-deploy-probe"
    description: "Hosted-runner source-artifact deploy check at the exact checkout commit. Fetch the published lockfile and a packaged command contract; require the contract environment digest to match the lockfile bytes. The pre-fix artifact fails. This does not attest a running deployment."
    source: "manual"
    binds_ac: ["AC4"]
    checks:
      - check_type: "command"
        check_value: |-
          set -euo pipefail;
          probe_dir=$(mktemp -d);
          trap 'rm -rf "$probe_dir"' EXIT;
          artifact_base="https://raw.githubusercontent.com/OmniNode-ai/omnimarket/$(git rev-parse HEAD)";
          curl --fail --silent --show-error --location --max-time 30 "$artifact_base/uv.lock" -o "$probe_dir/uv.lock";
          curl --fail --silent --show-error --location --max-time 30 "$artifact_base/src/omnimarket/configs/work_contracts/contracts/F01-01.yaml" -o "$probe_dir/contract.yaml";
          uv run python - "$probe_dir" <<'PY'
          import hashlib, pathlib, sys, yaml
          root = pathlib.Path(sys.argv[1])
          contract = yaml.safe_load((root / "contract.yaml").read_bytes())
          pin = contract["acceptance"]["spec"]["environment"]
          assert pin["path"] == "uv.lock"
          assert pin["sha256"] == hashlib.sha256((root / "uv.lock").read_bytes()).hexdigest(), "deployed work-contract lockfile pin mismatch"
          print("work-contract source-artifact deploy probe: PASS")
          PY
        cwd: "${OMNI_HOME}/omnimarket"
