schema_version: 1.0.0
ticket_id: OMN-22783
title: The seam deadline, work ledger copy and worktree reconcile schedule installs refuse a unit that runs from a worktree
summary: A unit installed from a worktree dies when the host worktree reconcile removes that tree (OMN-22735 and OMN-22767 closed this for seven installers). Three installers still rendered and wrote a unit whose program, working directory or environment names a path under omni_worktrees. The seam deadline installer (systemd) and the worktree reconcile's own schedule now read their rendered service, timer and drop-in text through the shared unit-root guard, and the work ledger copy's launchd agent is read through a new plist reader beside it that covers the program, the working directory and the environment but not the log paths. Each refuses before any file is written, in a dry run or render as well, naming the path. A canonical clone or an installed revision outside omni_worktrees installs as before.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn22783-refuse-worktree-roots
  statement: No schedule install of the three nodes writes a unit that runs from a worktree.
  acceptance:
  - id: AC1
    statement: 'AC1: each of the three installers refuses a rendered unit whose program, working directory or environment names a path under omni_worktrees, names the path, fails and writes nothing, also in a dry run or render -- falsifier: uv run --frozen pytest tests/handlers/test_schedule_installers_refuse_worktree_roots_rest.py -q --no-cov'
  - id: AC2
    statement: 'AC2: each installer still installs from a stable root and writes files with no omni_worktrees text, and a launchd log path under a worktree is not refused -- falsifier: uv run --frozen pytest tests/handlers/test_schedule_installers_refuse_worktree_roots_rest.py -k "stable_root or log_path" -q --no-cov'
  - id: AC3
    statement: 'AC3: with the guard let through by a named injected break the same install writes a worktree unit, so each refusal test is red without the guard -- falsifier: uv run --frozen pytest tests/handlers/test_schedule_installers_refuse_worktree_roots_rest.py -k guard_let_through -q --no-cov'
evidence_requirements:
- kind: tests
  description: The refusals, the stable installs, the log path control and the injected break of the three installers
  command: uv run --frozen pytest tests/handlers/test_schedule_installers_refuse_worktree_roots_rest.py -q --no-cov
