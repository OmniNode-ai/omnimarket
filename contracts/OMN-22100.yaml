schema_version: 1.0.0
ticket_id: OMN-22100
title: A lane on a proof lab host can run onex-capability-catalog find and the work-ledger parity check because the host installer provisions their inputs
summary: The host capability node holds the requirement and the committed per-host declaration for the two reader inputs (catalog.json path, lab env file with the parity password key) and judges a declared lane host that lacks one; the new node_lane_reader_provision_effect provisions them on a host from the node overlay and that table (catalog.json, the catalog CLI link on the lane PATH, ONEX_CAPABILITY_CATALOG_JSON and WL_ENV_FILE in the lab-work serve environment file) and names the one key only the host owner supplies.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn22100-lane-reader-inputs
  statement: A lane on a lab host cannot run onex-capability-catalog find (no catalog.json given) or the work-ledger parity check (no lab env file password) unless the host provisions both inputs.
  acceptance:
  - id: AC1
    statement: 'AC1: from a lane shell on the proof lab host, the catalog find reader exits 0 and prints a hit with no hand-set variable -- falsifier: a lab-run receipt of the catalog find reader on the proof host, exit code in the PR body'
  - id: AC2
    statement: 'AC2: from a lane shell on the proof lab host the ledger parity check exits 0 or 1 and not 2 with no hand-set variable -- falsifier: a lab-run receipt of the projection parity module with the ledger-ask arguments on the proof host, exit code in the PR body'
  - id: AC3
    statement: 'AC3: a test fails when a declared lane host lacks the catalog path or the lab env file that these two readers need, and passes on the committed host table -- falsifier: uv run pytest tests/nodes/test_host_installer_lane_readers.py -q'
evidence_requirements:
- kind: tests
  description: The lane reader inputs suite and the host capability node suites.
  command: uv run pytest tests/nodes/test_host_installer_lane_readers.py tests/nodes/node_host_capability_compute -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn22100-ac1-lab
  description: AC1 lab run, unbound because hosted CI cannot reach the lab. The catalog find reader exits 0 on the proof host with no hand-set variable. Open until the merged node_lane_reader_provision_effect has run on the host and the serve unit has restarted; the lab-run receipt of the measurement is in the PR.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --host "$ONEX_PROOF_HOST" --lane readers-node-1102 -- onex-capability-catalog find lane
    cwd: .
- id: dod-omn22100-ac2-lab
  description: AC2 lab run, unbound because hosted CI cannot reach the lab. The ledger parity check exits 0 or 1 on the proof host with no hand-set variable. Open until the merged node_lane_reader_provision_effect has named WL_ENV_FILE for lanes and the host owner has supplied the database password key in the lab env file.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --host "$ONEX_PROOF_HOST" --lane readers-node-1102 -- uv run --frozen python -m omnimarket.nodes.node_projection_work_ledger.parity --ledger "$ONEX_LEDGER_PATH" --archive-dir "$(dirname "$ONEX_LEDGER_PATH")/archive" --since 2026-11-02T00:00:00Z --dsn-env WL_DSN
    cwd: .
- id: dod-omn22100-ac1
  description: AC1 hosted part. A declared lane host with no catalog.json path fails for the catalog find reader by the ONEX_CAPABILITY_CATALOG_JSON item, and a measured host whose catalog.json is absent fails by its path. The lab run on the proof host is the unbound dod-omn22100-ac1-lab item.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/test_host_installer_lane_readers.py -q --no-cov --tb=line -k "catalog_json or missing_both_inputs"
    cwd: .
- id: dod-omn22100-ac2
  description: AC2 hosted part. A declared lane host with no lab env file fails for the ledger parity reader by the WL_ENV_FILE item, and measured host key names without the database password key fail by that key name. The lab run on the proof host is the unbound dod-omn22100-ac2-lab item.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/test_host_installer_lane_readers.py -q --no-cov --tb=line -k "wl_env_file or missing_password_key"
    cwd: .
- id: dod-omn22100-ac3
  description: AC3 a declared lane host without the catalog path or the lab env file fails, a measured env file without the password key fails by name, and the committed host table passes.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/test_host_installer_lane_readers.py -q --no-cov --tb=line
    cwd: .
- id: dod-omn22100-integration-proof
  description: The pushed head ran the lane reader inputs suite and the host capability node suites on a lab host through the bus and exited 0. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane readers-node-1102 -- uv run --frozen pytest tests/nodes/test_host_installer_lane_readers.py tests/nodes/node_host_capability_compute -q --no-cov
    cwd: .
- id: dod-omn22100-deploy-probe
  description: 'Deploy probe: the lane reader inputs handler GitHub serves at the checked-out commit defines HandlerLaneReaderInputs, which the merge base does not carry.'
  source: manual
  checks:
  - check_type: command
    check_value: bash -o pipefail -c 'gh api "repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_host_capability_compute/handlers/handler_lane_reader_inputs.py?ref=$(git rev-parse HEAD)" --jq .content | base64 -d | grep -F "class HandlerLaneReaderInputs" > /dev/null'
    cwd: .
- id: dod-omn22100-node-ac1
  description: AC1 and AC2 node part. The provisioning node produces catalog.json, links the catalog CLI onto the lane PATH directory and sets the two variables in the serve environment file from the overlay and the committed table, changes nothing on a second run, rewrites only those two lines, and names the password key without a value. The in-memory bus scenario runs here; the separate kafka-marked Redpanda profile is required as lab evidence.
  source: manual
  binds_ac:
  - AC1
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_lane_reader_provision_effect -q --no-cov --tb=line -m "not kafka"
    cwd: .
- id: dod-omn22100-node-deploy-probe
  description: 'Deploy probe: the provisioning handler GitHub serves at the checked-out commit defines HandlerLaneReaderProvision, which the merge base does not carry.'
  source: manual
  checks:
  - check_type: command
    check_value: bash -o pipefail -c 'gh api "repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_lane_reader_provision_effect/handlers/handler_lane_reader_provision.py?ref=$(git rev-parse HEAD)" --jq .content | base64 -d | grep -F "class HandlerLaneReaderProvision" > /dev/null'
    cwd: .
