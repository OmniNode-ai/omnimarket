schema_version: 1.0.0
ticket_id: OMN-24221
title: 'T18c: the runtime answers GET /v1/workflows/contracts, the last public onex-api route'
summary: GET /v1/workflows/contracts moves into the runtime. The effect node node_workflow_contract_catalog_effect, revived from the stalled draft omnimarket#4984 (OMN-22342) and rebuilt on the current
  dev line, carries the route in its contract (http_mount at the route path, http_route with the handler binding and the refusals), resolves the caller through the shared tenant identity protocol before
  it reads the catalog, and reads the catalog from a lane overlay document. The route record in tests/integration/onex_api_fold moves the identity from pending to served, so no public identity is pending.
  No caller is switched and no container is stopped here; binding the overlay document and the identity resolver on the dev runtime is a prerequisite of the cut-over (T18e).
is_seam_ticket: false
interface_change: true
interfaces_touched:
- public_api
- protocols
requirements:
- id: workflow-contract-catalog-runtime-route
  statement: Serve the workflow contract catalog read from a runtime node.
  acceptance:
  - id: AC1
    statement: 'AC1: a runtime node serves GET /v1/workflows/contracts under a contract-declared http_mount -- falsifier: the route-fixture test in tests/integration/onex_api_fold reads the identity as
      served and fails when the node''s contract is left out of the runtime'
  - id: AC2
    statement: 'AC2: the golden chain test returns the tenant''s catalog and the error chain tests refuse a request with no resolved identity and with no resolver bound before the catalog is read -- falsifier:
      the fails-closed cases with the tenant header removed return the typed refusal, not a catalog'
  - id: AC3
    statement: 'AC3: integrated: the real runtime HTTP listener at the pushed head, started on a lab host through lab-work on the Redpanda profile, discovers the node''s mount and serves GET /v1/workflows/contracts
      to a resolved test tenant and refuses everyone else -- falsifier: the same request on a runtime without the node falls through with 404, shown by the route record control; the read on the dev runtime
      after merge is reported in the pull request'
evidence_requirements:
- kind: tests
  description: Route behaviour, refusals, the route record control and the real runtime mount in both profiles.
  command: uv run --frozen pytest tests/nodes/node_workflow_contract_catalog_effect tests/integration/onex_api_fold -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: catalog-route-in-memory
  description: 'The moved route-pinning tests run against the mounted app, then the real runtime HTTP mount serves the route on the in-memory profile.

    '
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_workflow_contract_catalog_effect -q --no-cov
    cwd: .
- id: catalog-route-redpanda
  description: 'The real runtime HTTP mount serves the route on the Redpanda profile: the isolated auth-required broker of the customer-path harness is up and its environment is set. Hosted CI has no broker
    container runtime, so only the local Done gate runs this check. The route itself reads no topic.

    '
  source: manual
  execution_scope: local_done_gate
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: env ONEX_WORKFLOW_CONTRACTS_HTTP_TEST_PROFILE=redpanda uv run --frozen pytest tests/nodes/node_workflow_contract_catalog_effect/test_http_runtime_profiles.py -q --no-cov --refuse-skips
    cwd: .
- id: catalog-route-integration-proof
  description: 'The pushed head ran both profile legs of the catalog route on a lab host through lab-work. Hosted CI cannot reach the lab, so only the local Done gate runs this check. It covers the one
    ported route, not the replay or the cutover.

    '
  source: manual
  execution_scope: local_done_gate
  binds_ac:
  - AC1
  - AC3
  checks:
  - check_type: command
    check_value: uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24221 -- env ONEX_WORKFLOW_CONTRACTS_HTTP_TEST_PROFILE=redpanda uv run
      --frozen pytest tests/nodes/node_workflow_contract_catalog_effect -q --no-cov
    cwd: .
- id: catalog-route-fails-closed
  description: 'Unauthenticated requests and requests with no identity resolver bound are refused (401 and 503) and the catalog source records zero reads.

    '
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_workflow_contract_catalog_effect/test_workflow_contract_catalog_http.py -q --no-cov -k "FailsClosed or AuthenticationRequired"
    cwd: .
- id: deploy-probe
  description: 'Hosted smoke check: the real runtime listener discovers the contract mount and serves the route to a resolved test tenant and refuses everyone else. This process-local smoke is not a deployed-dev
    or cutover claim.

    '
  source: manual
  checks:
  - check_type: command
    check_value: |-
      set -euo pipefail;
      probe_dir=$(mktemp -d);
      trap 'rm -rf "$probe_dir"' EXIT;
      root="https://raw.githubusercontent.com/OmniNode-ai/omnimarket/$(git rev-parse HEAD)/src/omnimarket/nodes";
      curl --fail --silent --show-error --location --max-time 30 "$root/node_workflow_contract_catalog_effect/contract.yaml" --output "$probe_dir/catalog.yaml";
      grep -q 'path_prefix: "/v1/workflows/contracts"' "$probe_dir/catalog.yaml"
    cwd: .
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_workflow_contract_catalog_effect/test_http_runtime_profiles.py -q --no-cov --refuse-skips
    cwd: .
  binds_ac:
  - AC3
- id: route-record-control
  description: The onex-api fold control reads every non-retired public identity as answering from the one runtime, with the workflow contract catalog now served.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/integration/onex_api_fold -q --no-cov
    cwd: .
