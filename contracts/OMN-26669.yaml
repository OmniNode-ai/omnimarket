schema_version: "1.0.0"
ticket_id: "OMN-26669"
title: "omnimarket: node_tenant_topic_provision_effect creates a tenant's wire topics from a bus command, so retiring the old API's delivery service removes nothing a tenant needs"
summary: "A new effect node answers tenant-topic-provision-requested: for one tenant slug, or for a backfill over every tenant a registry holds, it creates each topic of the forwarder contract's mirror_topics as tenant-<slug>.<name>, lists the broker again to read each back, and answers on the completed topic with one report per tenant. A topic that could not be created is named and leaves the tenant unprovisioned; a retry creates only what is still absent. The node has no delete."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-omn26669-create"
    statement: |-
      A bus command with a tenant slug creates the whole mirror set under the tenant prefix and reads it back.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: a bus command with a tenant slug creates every topic of the contract-declared mirror set as tenant-<slug>.<name>, reads each back from the broker, and a second run creates none -- falsifier: a missing topic after the first run or any created on the second
  - id: "req-omn26669-source"
    statement: |-
      The name list is the forwarder contract's mirror_topics.
    acceptance:
      - id: "AC2"
        statement: |-
          AC2: the name list comes from the forwarder contract's mirror_topics and a test fails when the node's set differs from it -- falsifier: a literal topic list in the node
  - id: "req-omn26669-failure"
    statement: |-
      A failure names the topic, leaves the tenant unprovisioned, and a retry completes it.
    acceptance:
      - id: "AC3"
        statement: |-
          AC3: a failure names the topic and leaves the tenant marked unprovisioned; a retry completes it -- falsifier: a partial set reported as done
  - id: "req-omn26669-backfill"
    statement: |-
      A backfill over existing tenants creates only what is missing.
    acceptance:
      - id: "AC4"
        statement: |-
          AC4: a backfill run over existing tenants creates only the missing topics and reports per tenant -- falsifier: a topic recreated or deleted
  - id: "req-omn26669-dev-proof"
    statement: |-
      The node is proven on the dev lane broker with a test tenant.
    acceptance:
      - id: "AC5"
        statement: |-
          AC5: proven on the dev lane broker with a test tenant, read back by a consumer; nothing is run against a cloud broker -- falsifier: no dev reading
evidence_requirements:
  - kind: "tests"
    description: "The node's focused tests pass at the pushed head and fail before the node exists."
    command: "uv run pytest tests/nodes/node_tenant_topic_provision_effect -q -n 0 --no-cov -m 'not kafka'"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn26669-ac1-create-and-readback"
    description: "A bus command creates the whole set under the tenant prefix with the injected partitions and replicas, reads each back, and a second run makes no create call."
    source: "manual"
    binds_ac: ["AC1"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_tenant_topic_provision_effect -q -n 0 --no-cov -k ac1 -m 'not kafka'"
        cwd: "."
  - id: "dod-omn26669-ac2-forwarder-set"
    description: "The node's set equals the forwarder contract's inbound and outbound union, widens with it, refuses an unreadable contract, and no Python file of the node holds a literal topic."
    source: "manual"
    binds_ac: ["AC2"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_tenant_topic_provision_effect/test_contract_and_mirror_source.py -q -n 0 --no-cov -k ac2"
        cwd: "."
  - id: "dod-omn26669-ac3-failure-and-retry"
    description: "A refused create names the topic and leaves the tenant unprovisioned, a partial set is never reported as done, and a retry creates only the absent topic and completes the set."
    source: "manual"
    binds_ac: ["AC3"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_tenant_topic_provision_effect -q -n 0 --no-cov -k ac3 -m 'not kafka'"
        cwd: "."
  - id: "dod-omn26669-ac4-backfill"
    description: "A backfill creates only the missing topics, reports per tenant, never deletes, and a second backfill creates none."
    source: "manual"
    binds_ac: ["AC4"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_tenant_topic_provision_effect -q -n 0 --no-cov -k ac4 -m 'not kafka'"
        cwd: "."
  - id: "dod-omn26669-ac5-consumer-read-back"
    description: "The operator entry, given --consumer-read-back, asks a consumer on the same broker for every topic the run read back, prints the ones it saw, and a topic no consumer saw is missing from that list."
    source: "manual"
    binds_ac: ["AC5"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_tenant_topic_provision_effect/test_runtime_entry.py -q -n 0 --no-cov -k ac5"
        cwd: "."
  - id: "dod-omn26669-integration-proof-dev-lane"
    description: "On a lab host, against the dev lane broker with a test tenant: the first run creates the set, the second creates none and a consumer reads every topic. Hosted CI holds no lab broker, so only the local Done gate runs this unbound check; it binds no criterion here because a bound item the hosted job cannot run fails its must-fail control, and the dev-lane reading is carried by the pull request's Lab line."
    source: "manual"
    execution_scope: local_done_gate
    checks:
      - check_type: "command"
        check_value: "onex lab-work run --repo OmniNode-ai/omnimarket --sha \"$(git rev-parse HEAD)\" --lane dod-dev-proof-26669 --kind test -- env ONEX_TENANT_TOPIC_PROVISION_LANE=dev uv run --frozen python -m omnimarket.nodes.node_tenant_topic_provision_effect --tenant lab-proof-26669 --consumer-read-back"
        cwd: "."
  - id: "dod-omn26669-hosted-deploy-check"
    description: "Deploy check the hosted runner can run: the node is registered under onex.nodes. This binds no criterion by itself."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: "grep -q 'node_tenant_topic_provision_effect = ' pyproject.toml"
        cwd: "."
