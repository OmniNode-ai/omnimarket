schema_version: 1.0.0
ticket_id: OMN-24332
title: Dev runtime health, intent classification writer rejects the runtime's own failure notices
summary: 'On the dev runtime the intent classification writer (HandlerProjectionIntentClassification) validated every message on onex.evt.omniintelligence.intent-classified.v1 as ModelIntentClassifiedEvent. The runtime
  publishes its own boundary failure notice (omnibase_infra ModelBoundaryFailureTerminal: failure_class, failure_code, retryable, failure_reason, origin_topic, terminalized_at; no session_id, intent_class or
  confidence) on that topic when the older claude-hook-event handler cannot dispatch a hook event (ONEX_CORE_063_ITEM_NOT_REGISTERED). Read on the dev runtime at 23:07Z after the 23:02:28Z recreate: 22 notices
  published and 22 "3 validation errors for ModelIntentClassifiedEvent" lines routed to onex.dlq.omnimarket.projection-intent-classification-malformed.v1. The writer and the standalone runner now recognise the
  runtime''s own notice model, store nothing and report a refusal; a payload that is neither a classified intent nor a notice still raises to the DLQ.'
is_seam_ticket: true
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24332-failure-notice-declined
  statement: The intent classification writer declines a runtime failure notice and still dead-letters a payload that is neither a classified intent nor a notice.
  acceptance:
  - id: AC1
    statement: 'AC1: the intent classification writer given the runtime''s own failure notice stores no row, raises nothing and reports one deliberate refusal -- falsifier: uv run pytest tests/test_projection_intent_classification_failure_notice.py
      -q fails at the merge base'
  - id: AC2
    statement: 'AC2: a real classified-intent event still stores its row, and a payload that is neither a classified intent nor a failure notice still raises to the malformed DLQ -- falsifier: the same file fails
      when the notice check swallows a malformed event'
  - id: AC3
    statement: 'AC3: integrated: on the dev runtime after the deploy agent rolls the change, over 30 minutes the health report carries no projection_dlq_saturation flag for projection_intent_classification and
      the runtime log holds no line routing a failure notice to onex.dlq.omnimarket.projection-intent-classification-malformed.v1 -- falsifier: curl of the runtime health report and a grep of the runtime log
      for that DLQ line with a failure notice correlation id'
evidence_requirements:
- kind: tests
  description: The writer tests pass at the pushed head.
  command: uv run pytest tests/test_projection_intent_classification_failure_notice.py tests/test_golden_chain_projection_intent_classification.py -q -n 0 --no-cov -p no:cacheprovider
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24332-ac1
  description: 'AC1: a failure notice built from the runtime''s own model reports zero rows and one refusal and writes nothing; fails at the merge base (ValidationError).'
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/test_projection_intent_classification_failure_notice.py -q -n 0 --no-cov -p no:cacheprovider -k "declines"
    cwd: .
- id: dod-omn24332-ac2
  description: 'AC2: a real event still writes one row; a real event without session_id and a notice with an unknown extra key still raise; the event and notice models are disjoint.'
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/test_projection_intent_classification_failure_notice.py tests/test_golden_chain_projection_intent_classification.py -q -n 0 --no-cov -p no:cacheprovider
    cwd: .
- id: dod-omn24332-ac3
  description: 'hosted proxy for AC3: the writer tests pass; the in-runtime reading of the dev runtime health report and log is taken on a lab host after the deploy and named in the pull request.'
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/test_projection_intent_classification_failure_notice.py -q -n 0 --no-cov -p no:cacheprovider
    cwd: .
- id: dod-omn24332-integration-proof
  description: the writer tests run on a lab host at the pushed head; hosted CI cannot reach the lab, so only the local Done gate runs this unbound check
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24332 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/test_projection_intent_classification_failure_notice.py -q --no-cov
