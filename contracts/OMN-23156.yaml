schema_version: 1.0.0
ticket_id: OMN-23156
title: "The h053 merge-queue pool reads private with four online members, a private merge-group job on it is a proof, and the hp051 queue names cannot stop before that proof"
summary: The runner-group reading gains two subjects, read from facts a fetching effect already read, and the runner-stop idle proof gains one. The queue group reads WORKING only when its visibility is private, no public repository is allowed, the expected number of queue runners are online in it and none is registered in another group. A completed merge-group job of a private repository on a runner of that group is the proof of the pool, and a merge-group job of a public repository on it reads NOT WORKING. A stop request that names an hp051 queue runner is refused until the pool's proof reads WORKING. This pull request adds the reading and the gate; the operator places the group, the installer unit lands in omnibase_infra, and the live readback and the real job are not part of it.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23156-queue-pool
  statement: The private queue group, the merge-group job proof and the stop gate each read from typed facts and fail under a named injected break.
  acceptance:
  - id: AC1
    statement: 'AC1: the installer''s declared unit places hp053-ci-mq-runner-1 to -4 in the group named by the overlay and the readback prints visibility private with four online members -- falsifier: uv run pytest src/omnimarket/nodes/node_runner_group_reading_compute -q -k private_queue_group_readback'
  - id: AC2
    statement: 'AC2: a real merge-group job for a private repository completes on the h053 pool and its run record names a runner of that group -- falsifier: uv run pytest src/omnimarket/nodes/node_runner_group_reading_compute -q -k merge_group_job_on_private_pool'
  - id: AC3
    statement: 'AC3: the hp051 queue names are not on the stop list until AC2 has passed, and a stop request before it is refused -- falsifier: uv run pytest src/omnimarket/nodes/node_runner_stop_idle_proof_compute -q -k queue_pool_proven_before_stop'
evidence_requirements:
- kind: tests
  description: The reading node's and the stop idle proof node's tests, with the chain tests of the reading node.
  command: uv run pytest src/omnimarket/nodes/node_runner_group_reading_compute src/omnimarket/nodes/node_runner_stop_idle_proof_compute tests/nodes/node_runner_group_reading_compute tests/nodes/node_runner_stop_idle_proof_compute -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23156-ac1
  description: The private queue group readback tests pass on the branch and fail under the injected breaks that ignore the group's visibility and that count every runner online.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest src/omnimarket/nodes/node_runner_group_reading_compute -q -k private_queue_group_readback
- id: dod-omn23156-ac2
  description: The merge-group job tests pass on the branch and fail under the injected breaks that accept any job as the proof and that take unread runs as proven.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest src/omnimarket/nodes/node_runner_group_reading_compute -q -k merge_group_job_on_private_pool
- id: dod-omn23156-ac3
  description: The stop gate tests pass on the branch and fail under the injected breaks that take the pool's proof as given and that drop the queue names from the request.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest src/omnimarket/nodes/node_runner_stop_idle_proof_compute -q -k queue_pool_proven_before_stop
- id: dod-omn23156-integration-proof
  description: Run both nodes' tests on a lab host at the pushed head. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23156 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest src/omnimarket/nodes/node_runner_group_reading_compute src/omnimarket/nodes/node_runner_stop_idle_proof_compute tests/nodes/node_runner_group_reading_compute tests/nodes/node_runner_stop_idle_proof_compute -q --no-cov
