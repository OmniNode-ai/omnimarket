schema_version: 1.0.0
ticket_id: OMN-22342
title: 'T18c group 8: serve the workflow contract catalog read from a runtime node'
summary: >
  GET /v1/workflows/contracts moves into the runtime. A new effect node,
  node_workflow_contract_catalog_effect, carries the route in its contract
  (http_mount at the route path, http_route with the handler binding and the
  refusals), resolves the caller through the shared tenant identity protocol
  before it reads the catalog, and reads the catalog from a lane overlay
  document. The recorded fixture replay (AC3) is written and waits for the
  T18b corpus; it has not run against recorded pairs. No caller is switched and
  no container is stopped here.
is_seam_ticket: false
interface_change: true
interfaces_touched: [public_api, protocols]
requirements:
  - id: workflow-contract-catalog-runtime-route
    statement: Serve the workflow contract catalog read from a runtime node.
    acceptance:
      - id: AC1
        statement: 'AC1: GET /v1/workflows/contracts is answered by the runtime through a contract-declared http_mount by a node with its own contract, and the moved onex-api tests for the route pass under the in-memory and the Redpanda profile -- falsifier: uv run pytest over the new node test directory in both profiles, run on a lab host through lab-run'
      - id: AC2
        statement: 'AC2: the route refuses a caller with no resolved identity, and also when no identity resolver is bound, before the catalog is read -- falsifier: a pytest case on the mounted app that fails unless the unauthenticated and unbound requests are refused with no catalog read'
      - id: AC3
        statement: 'AC3: the T18b fixture subset for this method-and-path identity replays against the mounted app with no unmasked difference -- falsifier: a pytest replay test that reads the T18b corpus for the identity and fails on any unmasked difference'
evidence_requirements:
  - kind: tests
    description: Route behaviour, refusals and the real runtime mount in both profiles.
    command: uv run --frozen pytest tests/nodes/node_workflow_contract_catalog_effect -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: catalog-route-in-memory
    description: >
      The moved route-pinning tests run against the mounted app, then the real
      runtime HTTP mount serves the route on the in-memory profile.
    source: manual
    binds_ac: [AC1]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/nodes/node_workflow_contract_catalog_effect -q --no-cov
        cwd: .
  - id: catalog-route-redpanda
    description: >
      The real runtime HTTP mount serves the route on the Redpanda profile: the
      isolated auth-required broker of the customer-path harness is up and its
      environment is set. The route itself reads no topic.
    source: manual
    binds_ac: [AC1]
    checks:
      - check_type: test_passes
        check_value: env ONEX_WORKFLOW_CONTRACTS_HTTP_TEST_PROFILE=redpanda uv run --frozen pytest tests/nodes/node_workflow_contract_catalog_effect/test_http_runtime_profiles.py -q --no-cov --refuse-skips
        cwd: .
  - id: catalog-route-integration-proof
    description: >
      The pushed head ran both profile legs of the catalog route on a lab host
      through lab-work. Hosted CI cannot reach the lab, so only the local Done
      gate runs this check. It covers the one ported route, not the replay or
      the cutover.
    source: manual
    execution_scope: local_done_gate
    binds_ac: [AC1]
    checks:
      - check_type: command
        check_value: >-
          uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-22342 -- env ONEX_WORKFLOW_CONTRACTS_HTTP_TEST_PROFILE=redpanda uv run --frozen pytest tests/nodes/node_workflow_contract_catalog_effect -q --no-cov
        cwd: .
  - id: catalog-route-fails-closed
    description: >
      Unauthenticated requests and requests with no identity resolver bound are
      refused (401 and 503) and the catalog source records zero reads.
    source: manual
    binds_ac: [AC2]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/nodes/node_workflow_contract_catalog_effect/test_workflow_contract_catalog_http.py -q --no-cov -k "FailsClosed or AuthenticationRequired"
        cwd: .
  - id: t18b-replay-pending
    description: >
      AC3 is OPEN. The replay test exists and selects this route's identity from
      the T18b corpus, but the corpus is not recorded yet (OMN-22158), so it has
      not replayed a recorded pair. This local Done check refuses until the
      replay runs against the corpus with no skip.
    source: manual
    execution_scope: local_done_gate
    binds_ac: [AC3]
    checks:
      - check_type: command
        check_value: >-
          python -c "import os,sys; sys.exit(0 if os.environ.get('ONEX_T18B_CORPUS_DIR') else 'AC3 OPEN: ONEX_T18B_CORPUS_DIR is unset; the T18b corpus (OMN-22158) has not landed')"
        cwd: .
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/nodes/node_workflow_contract_catalog_effect/test_t18b_replay.py -q --no-cov --refuse-skips
        cwd: .
  - id: deploy-probe
    description: >
      Hosted smoke check: the real runtime listener discovers the contract mount
      and serves the route to a resolved test tenant and refuses everyone else.
      This process-local smoke is not a deployed-dev or cutover claim.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/nodes/node_workflow_contract_catalog_effect/test_http_runtime_profiles.py -q --no-cov --refuse-skips
        cwd: .
