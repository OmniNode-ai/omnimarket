schema_version: 1.0.0
ticket_id: OMN-23242
title: On every merge deferral or kept_out of a handed-off PR the landing controller writes one ledger MSG to the hand-off row's parent, and the floor shows the count
summary: The floor reads the ledger's hand-off and parent MSG rows and the landing controller's decisions.jsonl and admissions.jsonl, and shows how many handed-off pull requests are deferred or kept out and how many of the deferred ones lasted more than 3 ticks with no parent MSG. The controller's own MSG (AC1, AC2) is the plugin repository's #1796; this change is the floor half (AC3).
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23242-floor-handoff-refusals
  statement: The floor document carries a handoff_refusals section whose counts come from the ledger's hand-off and parent MSG rows and the controller's journals, drawn unread with its reason when a source cannot be read.
  acceptance:
  - id: AC3
    statement: 'AC3: the floor shows how many handed-off PRs are deferred or kept out, and how many of them were deferred more than 3 ticks with no parent MSG -- falsifier: uv run pytest of the floor simple handler tests with a recorded ledger slice, and the served floor-simple.json read after the publisher install carries both counts'
evidence_requirements:
- kind: tests
  description: The recorded ledger slice and journal rows for the 2026-11-08 case, the 3-tick boundary, the unread sources, and one floor cycle that writes both counts
  command: uv run --frozen pytest tests/nodes/node_floor_simple_effect/test_handoff_refusals_omn23242.py -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23242-floor-counts
  description: With the 2026-11-08 case (one pull request deferred 73 times with no parent MSG, one told at its head and gate, one at 2 ticks, one kept out, one never handed off, one at the strict base queue order, one merged) the floor reads 4 refused and 1 silent; a parent MSG at the deferred head and gate clears the silent count; a source that cannot be read draws the section unread with its reason.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_floor_simple_effect/test_handoff_refusals_omn23242.py -q --no-cov
    cwd: .
- id: dod-omn23242-integration-proof
  description: Run this pull request's own tests on a lab host at the pushed head. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23242 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_floor_simple_effect/test_handoff_refusals_omn23242.py tests/nodes/node_floor_simple_compute -q --no-cov
    cwd: .
