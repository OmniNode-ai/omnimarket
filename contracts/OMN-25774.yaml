schema_version: 1.0.0
ticket_id: OMN-25774
title: A scheduled probe reads one job log through onex scm job-log each tick, and two no_terminal readings in a row raise an alarm row with an owner
summary: >-
  The GitHub gateway declares bounded concurrency for independent reads. A
  scheduled dev probe records gateway latency and one owned alarm per timeout
  streak through the work-ledger append bus.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn25774-job-log-probe
    statement: The GitHub gateway is responsive and its scheduled probe reports consecutive missed replies.
    acceptance:
      - id: AC1
        statement: 'AC1: the probe sends one job-log read for a known finished job per tick and writes a STATUS reading with verdict and latency -- falsifier: uv run pytest on the probe handler with a stub gateway that never answers, expecting verdict no_terminal'
      - id: AC2
        statement: 'AC2: two no_terminal readings in a row write one FRICTION alarm row naming the consumer host and an owner lane -- falsifier: uv run pytest with two failing readings as fixture, expecting one row with owner set'
      - id: AC3
        statement: 'AC3: the first alarm on the dev bus is followed by a STATUS row that names the measured cause of the no_terminal (budget, consumer stall or GitHub) -- falsifier: onex scm job-log on a known job returns its text within 60 s, or the ledger holds no STATUS row with a cause cell from the probe owner'
evidence_requirements:
  - kind: tests
    description: The runtime wires the gateway concurrency and the probe tick, and the probe records timeout streaks.
    command: uv run --frozen pytest -q tests/nodes/node_github_job_log_probe_effect/test_golden_chain_job_log_probe.py tests/nodes/node_github_repo_gateway_effect/test_gateway_consume_concurrency.py
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn25774-ac1-reading
    description: One SCM command with no reply produces a single STATUS reading with the no_terminal verdict and latency.
    source: manual
    binds_ac: [AC1]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest -q tests/nodes/node_github_job_log_probe_effect/test_golden_chain_job_log_probe.py::test_no_terminal_writes_one_status_reading
        cwd: .
  - id: dod-omn25774-ac2-alarm
    description: The second consecutive timeout adds one FRICTION row with the consumer host and accountable lane.
    source: manual
    binds_ac: [AC2]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest -q tests/nodes/node_github_job_log_probe_effect/test_golden_chain_job_log_probe.py::test_two_no_terminals_raise_one_owned_alarm_and_reset_on_reply
        cwd: .
  - id: dod-omn25774-ac3-integration-proof
    description: A lab runner at the checked-out revision reads a nonempty log body for a known finished job through the dev gateway within 60 seconds.
    source: manual
    binds_ac: [AC3]
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: >-
          onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)"
          --lane joblog-probe-proof --kind test -- bash -o pipefail -c
          'timeout 60s onex scm job-log OmniNode-ai/omnibase_infra
          --job-id 135208915972 --bus-lane dev --source bus --timeout-s 54 --tail-bytes 1024 |
          python3 -c "import json,sys; result=json.load(sys.stdin).get(\"result\", {}); sys.exit(0 if result.get(\"text\") else 1)"'
        cwd: .
  - id: dod-omn25774-deploy-gateway-contract
    description: The hosted runner reads the gateway contract at the checked-out GitHub revision and verifies that the runtime concurrency bound is declared.
    source: manual
    checks:
      - check_type: command
        check_value: >-
          bash -o pipefail -c 'gh api "repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_github_repo_gateway_effect/contract.yaml?ref=$(git rev-parse HEAD)"
          --jq .content | base64 -d | grep -Fx "  max_in_flight_records: 8"'
        cwd: .
