---
schema_version: "1.0.0"
ticket_id: "OMN-20278"
title: "Lab work terminals reach the work ledger through the ledger serve process"
summary: "A lab work unit terminal, completed or failed, is mapped by a pure node to one STATUS append request that the existing ledger serve host appends once per work unit, with lane, repo, sha, kind and duration carried on the terminal."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-lab-work-receipt-ledger"
    statement: |-
      A lab work terminal is appended to the work ledger as one STATUS row, and a redelivery appends nothing more.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: A completed or failed lab work terminal maps to one STATUS ledger row naming its unit, host, lane, repo, sha, kind, state, exit code and duration, and leaves log paths, output tails and error messages out -- falsifier: a test that maps a terminal and finds a missing cell or a leaked log path, output tail or error message
      - id: "AC2"
        statement: |-
          AC2: Redelivering the same terminal through the ledger serve host appends the row once -- falsifier: a test that delivers one terminal twice and finds two rows
evidence_requirements:
  - kind: "tests"
    description: "The terminal-to-STATUS mapping and the ledger serve redelivery dedup."
    command: "uv run pytest tests/unit/nodes/node_work_ledger_bus_mirror/test_lab_work_receipt_mapping.py tests/unit/work_ledger_bus/test_lab_work_receipt_mirror.py -q -p no:randomly"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn20278-lab-receipt-ledger"
    description: "A lab work terminal maps to one ledger STATUS row without log paths, output tails or error messages, and a redelivery appends once."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/nodes/node_work_ledger_bus_mirror/test_lab_work_receipt_mapping.py tests/unit/work_ledger_bus/test_lab_work_receipt_mirror.py -q -p no:randomly"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC1", "AC2"]
