schema_version: "1.0.0"
ticket_id: "OMN-21128"
title: "Exemplar admission compute: the pure admission decision of the exemplar registry"
summary: >-
  First slice of exemplar admission. node_exemplar_admission_compute takes, for one
  repository at one commit, the canonical-handler-shape classification of every contract
  binding of each candidate node plus the facts a caller read (handler and node-package
  source text, contract validity, unit-test directory, coverage, and the check-runs of the
  commit), and returns one decision per candidate listing every violation, with admitted
  candidates ranked per archetype by handler size then contract path and carrying the gate
  receipt (gate, gate_version, baseline_sha256, result, commit, check-run ids). It reads no
  files, no network and no clock. The omnibase_core classifier move, the admission
  orchestrator, its decided event and the registry projection are later slices.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-exemplar-sampled-revocation"
    statement: "Revocation requires a declared minimum sample; precision and recall are derived from labelled confusion counts."
    acceptance:
      - id: "AC12"
        statement: >-
          AC12: an exemplar is not revoked on a single failure with no prior runs (a minimum sample is required), and precision and recall come from counts, not constants -- falsifier: a one-run revocation, or a recall figure that does not move with the counts.
  - id: "req-exemplar-admission-refusals"
    statement: "A candidate is refused, with every reason listed, when it is in its repository's baseline, comes from a repository where the gate does not run, fails the gate, or is one of the shape-valid negatives."
    acceptance:
      - id: "AC1"
        statement: >-
          AC1: a candidate in its repository's baseline, a candidate from a repository where
          the gate does not run (omnibase_spi, omnibase_compat, omnidash, onex_change_control,
          or a private repository), and a candidate whose first binding fails the gate are each
          refused with that reason -- falsifier: test_baseline_candidate_is_refused_for_exactly_in_baseline,
          test_gate_absent_repository_is_refused, test_private_repository_is_refused or
          test_first_noncanonical_binding_fails_gate in tests/nodes/node_exemplar_admission_compute/test_golden_chain_exemplar_admission_compute.py fails
      - id: "AC2"
        statement: >-
          AC2: a handle(**kwargs) stub, a zero-argument handle, a node whose second binding is
          non-canonical, a compute handler that imports a database client, and a node at a
          commit whose newest required check-run is not success are each refused with their
          reason, and a refusal lists every violation, not the first -- falsifier: the kwargs,
          zero-argument, second-binding, database-import, failed-run and all-violations tests
          in tests/nodes/node_exemplar_admission_compute/test_golden_chain_exemplar_admission_compute.py fail
  - id: "req-exemplar-registry-reconcile"
    statement: "The exemplar registry's sync plan is a pure omnimarket compute that reconciles an admission result at a commit against the registry's current rows into one create, revise, retain, deprecate or revoke row per logical source, and never drops a source silently."
    acceptance:
      - id: "AC6"
        statement: >-
          AC6: a newly admitted source is created active with its gate receipt; an unchanged active
          source is a typed retain; changed content or a gate version bump revises with a new version
          digest; an active source absent at the commit or refused for an ordinary reason is deprecated
          with its reason codes; a refusal carrying a declared revoke code revokes; a revoked source
          with the same bytes stays revoked -- falsifier: the create, retain, revise, deprecate, revoke
          and revoked tests in tests/nodes/node_exemplar_registry_reconcile_compute/test_golden_chain_exemplar_registry_reconcile_compute.py fail
      - id: "AC7"
        statement: >-
          AC7: the plan is ordered by logical source, independent of input order, bound by counts and a
          reconciliation hash, and fails closed on an admitted source with no content digest, a row or
          admission from another repository, and duplicate rows or decisions -- falsifier: the ordered,
          deterministic and fails_closed tests in tests/nodes/node_exemplar_registry_reconcile_compute/test_golden_chain_exemplar_registry_reconcile_compute.py fail
      - id: "AC8"
        statement: >-
          AC8: the reconcile node is dispatched through its contract on the RuntimeLocal in-memory bus,
          its topics are declared in contract.yaml and its entry point resolves -- falsifier:
          test_contract_declares_topics_models_handler_and_entry_point or the over-the-bus chain tests in
          tests/nodes/node_exemplar_registry_reconcile_compute/test_golden_chain_exemplar_registry_reconcile_compute.py fail
  - id: "req-exemplar-admission-receipt-and-data"
    statement: "Admission rests on check-run records on the cited commit and declared deny data, never on a caller-asserted success."
    acceptance:
      - id: "AC3"
        statement: >-
          AC3: an admitted decision's receipt names the check-run ids chosen on the cited
          commit; a missing required check, runs only on another commit, or node tests absent
          from the collected set refuse the candidate; a caller-asserted passed or confidence
          field is refused by the model -- falsifier: the receipt and
          test_caller_asserted_success_fields_are_forbidden tests in tests/nodes/node_exemplar_admission_compute/test_golden_chain_exemplar_admission_compute.py fail
      - id: "AC4"
        statement: >-
          AC4: no coverage figure is recorded as coverage_state unknown with a null percentage,
          not 0.5; a hardcoded password or api key, a bare eval or exec, or a pickle import is
          refused by the deny data, and Path() arithmetic or a dict[str, Any] field annotation
          is not -- falsifier: test_good_candidate_is_admitted_with_receipt_and_unknown_coverage,
          the deny tests or test_path_arithmetic_and_model_dict_annotations_are_pure in tests/nodes/node_exemplar_admission_compute/test_golden_chain_exemplar_admission_compute.py fail
      - id: "AC5"
        statement: >-
          AC5: the node is dispatched through its contract on the RuntimeLocal in-memory bus,
          its topics are declared in contract.yaml and its entry point resolves -- falsifier:
          test_contract_declares_topics_models_handler_and_entry_point or the over-the-bus chain tests
          in tests/nodes/node_exemplar_admission_compute/test_golden_chain_exemplar_admission_compute.py fail
evidence_requirements:
  - kind: "tests"
    description: "AC1-AC5: the admission compute's focused tests."
    command: "uv run pytest tests/nodes/node_exemplar_admission_compute -q -p no:randomly --no-cov"
  - kind: "tests"
    description: "AC6-AC8: the registry reconcile compute's focused tests."
    command: "uv run pytest tests/nodes/node_exemplar_registry_reconcile_compute -q -p no:randomly --no-cov"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn21128-ac12-sampled-revocation"
    description: "A first failure without history is deprecated rather than irrevocably revoked. Precision and recall derive from strict nonnegative confusion counts; each quality threshold requires enough denominator samples. Typed dispatch, RuntimeLocal in-memory dispatch and the packaged onex node CLI run the same cases. This slice does not complete the admission orchestrator or registry writer."
    source: "manual"
    binds_ac: ["AC12"]
    checks:
      - check_type: "test_passes"
        check_value: "env UV_FROZEN=true uv run pytest tests/nodes/node_exemplar_registry_reconcile_compute/test_sampled_revocation.py -q -n 0 -p no:randomly --no-cov"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn21128-deploy-sampled-revocation"
    description: "Hosted-runner packaged-handler and in-memory-runtime probe checks the sampled revocation behavior, strict evidence validation and checked-in contract/overlay parity. A head without this implementation fails these tests. No live services or credentials are required."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: "uv run --frozen pytest tests/nodes/node_exemplar_registry_reconcile_compute/test_sampled_revocation.py -q -n 0 -p no:randomly --no-cov"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn21128-refusals"
    description: "Baseline, gate-absent, gate-failed and shape-valid negative candidates are refused with every reason."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_exemplar_admission_compute/test_golden_chain_exemplar_admission_compute.py -q -n 0 -k 'baseline or gate_absent or private_repository or noncanonical or kwargs or zero_argument or database_import or failed_run or all_violations'"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC1", "AC2"]
  - id: "dod-omn21128-receipt-and-data"
    description: "The receipt is built from check-runs on the commit, coverage unknown stays unknown, and the deny data refuses only what it names."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_exemplar_admission_compute/test_golden_chain_exemplar_admission_compute.py -q -n 0 -k 'receipt or required_check or collected or caller_asserted or coverage or secret or eval or pickle or path_arithmetic'"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC3", "AC4"]
  - id: "dod-omn21128-bus"
    description: "The node runs through its contract on the in-memory bus."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_exemplar_admission_compute/test_golden_chain_exemplar_admission_compute.py -q -n 0 -k 'contract_declares or over_the_bus'"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC5"]
  - id: "dod-omn21128-reconcile-lifecycle"
    description: "Create, revise, retain, deprecate and revoke follow the declared lifecycle rules; at the merge base the node package does not exist and the file fails at collection."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_exemplar_registry_reconcile_compute/test_golden_chain_exemplar_registry_reconcile_compute.py -q -n 0 -k 'created or retain or revises or deprecated or revoke or revoked'"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC6"]
  - id: "dod-omn21128-reconcile-plan-binding"
    description: "The plan is ordered, deterministic and fails closed on missing digests, foreign repositories and duplicates."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_exemplar_registry_reconcile_compute/test_golden_chain_exemplar_registry_reconcile_compute.py -q -n 0 -k 'ordered or deterministic or fails_closed or malformed or validated'"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC7"]
  - id: "dod-omn21128-reconcile-bus"
    description: "The reconcile node runs through its contract on the in-memory bus."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_exemplar_registry_reconcile_compute/test_golden_chain_exemplar_registry_reconcile_compute.py -q -n 0 -k 'contract_declares or over_the_bus'"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC8"]
  - id: "dod-omn21128-deploy-probe"
    description: "Deploy probe: the handler read from GitHub at the checked-out commit defines HandlerExemplarAdmission. A head without it fails the probe."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: "gh api \"repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_exemplar_admission_compute/handlers/handler_exemplar_admission.py?ref=$(git rev-parse HEAD)\" --jq .content | base64 -d | grep -c 'class HandlerExemplarAdmission'"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn21128-reconcile-deploy-probe"
    description: "Deploy probe: the reconcile handler read from GitHub at the checked-out commit defines HandlerExemplarRegistryReconcile. A head without it fails the probe."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: "gh api \"repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_exemplar_registry_reconcile_compute/handlers/handler_exemplar_registry_reconcile.py?ref=$(git rev-parse HEAD)\" --jq .content | base64 -d | grep -c 'class HandlerExemplarRegistryReconcile'"
        cwd: "${OMNI_HOME}/omnimarket"
