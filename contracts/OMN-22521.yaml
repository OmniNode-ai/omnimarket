dod_evidence:
- id: dod-omn19998-census-alias-parity
  description: The frozen assertion's exact host-id conversion and alias equality are preserved with explicit deployment data. The recorded hp-gen8 addition refuses until its matching alarm alias data is supplied. This migration does not assert the controller timer criteria or repair the live host service.
  source: manual
  binds_ac:
  - AC8
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_lane_census_alias_parity_compute/test_alias_parity.py -q --no-cov
    cwd: .
- id: dod-omn19998-census-alias-parity-deploy
  description: Hosted installed-package smoke discovers the node and auto-wires its declared command and completion topics on an in-memory bus. Both the missing h051 alias and the data-only repair reach the typed handler and publish correlated verdicts. No sibling checkout, broker or live lab service is needed or asserted.
  source: manual
  binds_ac:
  - AC8
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_lane_census_alias_parity_compute/test_alias_parity.py -q --no-cov -k runtime_command
    cwd: .
- id: dod-omn19998-unreadable-base-refusal
  description: An unreadable base that names no remote returns no resolved base, so the release-cut exemption is not granted and the missing-contract refusal stands, while a failed fetch of a named remote still propagates. The unreadable-base test fails before this change with a CalledProcessError.
  source: manual
  binds_ac:
  - AC10
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/ci/test_ticket_contract_release_cut_exempt_omn17427.py tests/nodes/node_ticket_contract_prerequisite_effect/test_missing_base.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn22521-integration-proof
  description: Run this pull request's own check on a lab host at the pushed head. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-22521 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_lane_census_alias_parity_compute/test_alias_parity.py -q --no-cov
    cwd: .
