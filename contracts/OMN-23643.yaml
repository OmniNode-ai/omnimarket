schema_version: 1.0.0
ticket_id: OMN-23643
title: One ticket-contract check no longer depends on the installed git version
summary: The check test_unreadable_base_preserves_explicit_missing_contract_refusal read the printed text of git branch -r, which git 2.43 prints with an origin/HEAD line and git 2.56 does not, so it passed or failed by the installed git version. It now reads the remote branch refs through the file's own helper that leaves out origin/HEAD, as every other check in the file does. No check is widened and no bound is changed.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23643-branch-list-git-version
  statement: The check reads remote branches by full ref name and no longer compares the printed text of git branch -r.
  acceptance:
  - id: AC1
    statement: 'AC1: the check passes on git 2.43 -- falsifier: uv run pytest tests/nodes/node_ticket_contract_prerequisite_effect/test_missing_base.py -q'
  - id: AC2
    statement: 'AC2: failing control: restoring the old comparison of the printed text makes it red on git 2.43 -- falsifier: the same file run with the old line'
evidence_requirements:
- kind: tests
  description: The missing-base suite passes on git 2.43.
  command: uv run --frozen pytest tests/nodes/node_ticket_contract_prerequisite_effect/test_missing_base.py -q -n 0 --no-cov -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23643-ac1-missing-base
  description: Runs the missing-base suite on a host whose git prints origin/HEAD for git branch -r.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_ticket_contract_prerequisite_effect/test_missing_base.py -q -n 0 --no-cov -p no:randomly
    cwd: .
- id: dod-omn23643-ac2-old-comparison-absent
  description: The old comparison of the printed git branch -r text is absent from the file; with it restored the check fails on git 2.43 (read on h202 before the change - 1 failed, 3 passed with -x).
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_ticket_contract_prerequisite_effect/test_missing_base.py -q -n 0 --no-cov -p no:randomly -k test_remote_branch_list_ignores_origin_head_and_keeps_real_branches
    cwd: .
  - check_type: command
    check_value: "! grep -q 'branch\", \"-r\") == \"origin/worker\"' tests/nodes/node_ticket_contract_prerequisite_effect/test_missing_base.py"
    cwd: .
- id: dod-omn23643-integration-proof
  description: Run the suite on a lab host at the pushed head. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23643 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_ticket_contract_prerequisite_effect/test_missing_base.py -q -n 0 --no-cov -p no:randomly
    cwd: .
