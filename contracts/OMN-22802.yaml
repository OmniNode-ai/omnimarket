schema_version: 1.0.0
ticket_id: OMN-22802
title: "The omnimarket test jobs run on the Ubuntu 24.04 image, so the Postgres 16 install works again"
summary: "The hosted ubuntu-latest image became Ubuntu 26.04 at about 22:11Z on 2026-11-06, whose archive has no postgresql-16, so the install step failed in every full-suite shard and in the integration guard. The three jobs that install it (test and integration-guard in ci.yml, shard in nightly-full-suite.yml) name ubuntu-24.04, the image the install was written for. No check is changed."
