  statement: "Each job that apt-installs postgresql-16 runs on the Ubuntu 24.04 image."
  acceptance:
  - id: AC1
    statement: 'AC1: the test, integration-guard and nightly full-suite jobs name runs-on ubuntu-24.04 and no job that installs postgresql-16 names ubuntu-latest -- falsifier: uv run --frozen pytest tests/unit/test_ci_postgres_runner_image_omn22781.py -q --no-cov'
  - id: AC2
    statement: 'AC2: the test fails on dev, where those jobs name ubuntu-latest, so it fails without the change -- falsifier: uv run --frozen pytest tests/unit/test_ci_postgres_runner_image_omn22781.py -q --no-cov'
