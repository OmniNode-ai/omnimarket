schema_version: 1.0.0
ticket_id: OMN-24394
title: Lab ledger serve reads service logins from a settings file kept apart from the code
summary: 'The work-ledger serve learned its writers from install-time arguments plus the developer overlay rows whose role is machine. The dev runtime''s own login has no person login or device, so it could not be declared there and the rows it published on the append command topic were never consumed. The append node''s contract gains a service_writers section; the serve reads the node''s own overlay under the declared roots, then the overlays clone beside the workspace config root, follows it without a reinstall, and serves the union of both sources. A malformed or deleted overlay keeps the writers already served.'
is_seam_ticket: true
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24394-service-writers-declared-in-overlay
  statement: A service login declared in the append node's overlay is served as a writer without a reinstall, and a malformed or deleted overlay keeps the writers already served.
  acceptance:
  - id: AC1
    statement: 'AC1: a service login declared in the append node''s overlay is served as a writer without a reinstall, its rows are appended and attributed to it, and the same login before the declaration is refused -- falsifier: uv run pytest tests/unit/work_ledger_bus/test_service_writers.py -q -k declared_service_login fails at the merge base'
  - id: AC2
    statement: 'AC2: a malformed or deleted overlay keeps the writers already served, and the overlay is found under the declared roots then the clone beside the workspace config root -- falsifier: uv run pytest tests/unit/work_ledger_bus/test_service_writers.py -q -k "malformed or falls_back or unioned" fails at the merge base'
  - id: AC3
    statement: 'AC3: the overlays repository declares the dev runtime login as the one service writer, equal to its broker rows -- falsifier: pytest tests/test_node_work_ledger_append_effect_overlay.py -q in the overlays repository fails when the writer or its topic row changes'
  - id: AC4
    statement: 'AC4: integrated: one ledger row appended by the dev runtime login on the dev bus is written to the ledger and read back in the work-ledger projection -- falsifier: the append run ends refused with unknown writer principal, or the row is absent on read back'
evidence_requirements:
- kind: tests
  description: The service writers tests pass at the pushed head.
  command: uv run --frozen pytest tests/unit/work_ledger_bus/test_service_writers.py tests/unit/work_ledger_bus/test_writer_overlay_watch.py tests/unit/work_ledger_bus/test_work_ledger_append_bus.py -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
