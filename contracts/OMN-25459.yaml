schema_version: 1.0.0
ticket_id: OMN-25459
title: The scheduled ticket closer reads its open pull requests through the GitHub gateway over the bus
summary: "The closer's open-pull-request source reads node_github_repo_gateway_effect over the bus, so the closer runs on the dev runtime on h201, which holds no PR watcher state file."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn25459-closer-runs-on-h201
    statement: The ticket closer runs on the dev runtime on h201 and reads its candidates there without a PR watcher state file.
    acceptance:
      - id: AC1
        statement: "AC1: a STATUS row on the rolling ledger reads kv pr=omnibase_core#2279 installed=<host>:<revision> observed=<what ran> read_at=<UTC>, written by the lane after it read one run on the dev runtime on h201 itself (a log line, a dispatch, a health read or a job record) -- falsifier: `grep -F 'pr=omnibase_core#2279' $ONEX_LEDGER_PATH | grep -F 'installed='` finds no row"
      - id: AC2
        statement: "AC2: the ticket closer ran once on a done ticket on the dev runtime on h201 and its predicate verdict was read, or the STATUS row names the single measured cause that keeps it from running and who must act -- falsifier: the dev runtime log and job record on h201 show no run line for it and the STATUS row names no cause and no actor"
      - id: AC3
        statement: "AC3: no host file, unit or plist was edited by hand: every change went through the declared installer, read from the installer own receipt -- falsifier: the STATUS row cites no installer receipt, or the installed unit differs from the revision the receipt names"
evidence_requirements:
  - kind: tests
    description: Run the closer node's tests.
    command: uv run --frozen pytest tests/nodes/node_ticket_closer_scheduled_effect -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn25459-gateway-open-prs
    description: "Hosted proxy for the live closer run. A closer built with no watcher state file reads its open pull requests from a gateway client double and reads its candidates; an unreadable, wrong-typed or cut gateway answer reads the open set as unread, never as an empty set. The live run on h201 is a separate read."
    source: manual
    binds_ac: [AC1, AC2]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/nodes/node_ticket_closer_scheduled_effect/test_gateway_open_prs.py -q --no-cov
        cwd: .
  - id: dod-omn25459-no-watcher-file
    description: "Hosted proxy for the declared-installer rule. The bound profile no longer asks for a watcher state file, so no host file has to be copied or set by hand for the closer to read."
    source: manual
    binds_ac: [AC3]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/nodes/node_ticket_closer_scheduled_effect/test_bound_profile.py tests/nodes/node_ticket_closer_scheduled_effect/test_gateway_open_prs.py -q --no-cov
        cwd: .
  - id: dod-omn25459-integration-proof
    description: Run the closer node's tests, the gateway open-pull-request source and the bound profile among them, on a lab host at the pushed head. The live read of one closer tick on the dev runtime on h201 is taken after the branch install and goes in a ledger STATUS row naming the head; hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
    source: manual
    execution_scope: local_done_gate
    binds_ac: [AC1, AC2]
    checks:
      - check_type: command
        check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane closer3-1450 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_ticket_closer_scheduled_effect -q --no-cov
