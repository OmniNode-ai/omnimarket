schema_version: 1.0.0
ticket_id: OMN-24334
title: The code scoring step names the answer a caller waits for
summary: 'node_code_contract_score_effect names its two answer topics only under runtime_dispatch.terminal_events (success and failure) and has no top-level terminal_event key, which the route resolver
  of onex run-node (omnibase_core.cli.cli_run_node._resolve_node_topics) requires; onex run-node refuses the node with "contract ... does not declare a terminal_event". The contract gains a top-level terminal_event
  naming the success answer, and a new test file holds the golden, the error chain and a failing control. Not in this change: the lab login broker rows (overlays pull request 486, declared only until the
  operator applies them) and the run through the running dev runtime (AC3).'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24334-terminal-event
  statement: The code scoring node contract declares a top-level terminal_event that the route resolver of onex run-node reads, and the failure answer stays under runtime_dispatch.terminal_events.failure.
  acceptance:
  - id: AC1
    statement: 'AC1: the contract of node_code_contract_score_effect declares terminal_event with the topic onex.evt.omnimarket.code-contract-scored.v1, and the contract loader of onex run-node resolves
      it -- falsifier: pytest tests/nodes/node_code_contract_score_effect/test_terminal_event_seam.py -q fails at the base, where the loader refuses the contract for declaring no terminal_event'
  - id: AC2
    statement: 'AC2: a contract whose terminal_event differs from its runtime_dispatch success topic is refused -- falsifier: the control test in the same file passes only if the refusal names both topics'
  - id: AC3
    statement: 'AC3: integrated: onex run-node node_code_contract_score_effect run from h053 on the dev bus returns a terminal event from the running dev runtime, read after the runtime carries this change
      and the lab login rows are applied -- falsifier: the run still ends with a refusal naming terminal_event or topic metadata'
