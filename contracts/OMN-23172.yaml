schema_version: 1.0.0
ticket_id: OMN-23172
title: Scenario R2 adds the lab's local servers that answer, least busy first, instead of one pinned address
summary: Scenario R2 read red every hourly slot from 2026-11-24T02:00Z because its first local server was the setting LLM_CODER_URL, whose host no longer serves the model (the model is never moved back), so the first add local was refused while a local model answered elsewhere. The run now reads the lab's declared local tier (the spread-group endpoints routing already places local work on), asks each server for the model it lists, and adds the least busy servers that answer. The dead-URL refusal leg and every local assertion are unchanged; the two settings remain the fallback for a slot the tier leaves unfilled.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23172-local-tier
  statement: Scenario R2 adds the lab's local servers that answer now, least busy first, and a pinned address that no longer answers cannot turn the scenario red while two local servers answer.
  acceptance:
  - id: AC1
    statement: 'AC1: with the first pinned server gone and two lab servers answering, R2 adds the two that answer, least busy first, and every assertion holds; with no pool the same pins read red -- falsifier: `uv run pytest tests/nodes/node_delegation_scenario_r2_effect/test_local_pool_chain.py -q`'
  - id: AC2
    statement: 'AC2: the pool orders by waiting requests, drops a server that does not answer, names a shared server once, and is empty when no spread group is declared; one live server leaves the order assertion red -- falsifier: `uv run pytest tests/nodes/node_delegation_scenario_r2_effect/test_local_pool_chain.py -q -k "pool or one_live"`'
evidence_requirements:
- kind: tests
  description: The pool chain tests and scenario R2's golden and error chain tests pass at the pushed head. At origin/dev the pool chain tests fail (the pool seam does not exist).
  command: uv run --frozen pytest tests/nodes/node_delegation_scenario_r2_effect -q --no-cov
