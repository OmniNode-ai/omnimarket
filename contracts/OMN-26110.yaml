schema_version: "1.0.0"
ticket_id: OMN-26110
title: The review-gate-context probe unit on the Mac reads the ledger without DelegateLaneSelectionError and writes one ok:true last-run
summary: The probe was installed with the registry path as its workspace config root. The installer now checks the dev lane declaration before loading the probe. Supply the workspace config root that owns the declaration when reinstalling.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn26110-probe-ledger-read
    statement: Install the scheduled review-gate probe with a resolvable dev ledger lane so it can read and decide open heads in probe mode.
    acceptance:
      - id: AC1
        statement: 'AC1: the probe unit''s last-run.json reads ok true with heads greater than 0 after the ledger read no longer raises DelegateLaneSelectionError -- falsifier: cat \~/.local/state/omni/review-gate-context-probe/last-run.json'
      - id: AC2
        statement: 'AC2: a regression test built from the recorded read-command output fails on the broken read route and passes on the fix -- falsifier: uv run pytest tests -q -k review_gate_context_probe_read'
evidence_requirements:
  - kind: tests
    description: The incident replay covers the wrong and correct config roots, and the scheduled probe writes a receipt for a positive head count with zero posts.
    command: uv run --frozen pytest tests/unit/nodes/node_review_gate_context_orchestrator/test_review_gate_context_main.py -q --no-cov -p no:randomly
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-omn26110-ac1-scheduled-probe
    description: Hosted check for the installed launch arguments, command route and successful scheduled receipt with a fixture head.
    source: manual
    binds_ac: [AC1]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/nodes/node_review_gate_context_orchestrator/test_review_gate_context_main.py -q --no-cov -p no:randomly -k installer_tick_runs
        cwd: .
  - id: dod-omn26110-ac2-recorded-refusal
    description: Hosted check for the recorded read refusal and the installer start check. With the old start check the installer accepts the config root that caused the refusal.
    source: manual
    binds_ac: [AC2]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/nodes/node_review_gate_context_orchestrator/test_review_gate_context_main.py -q --no-cov -p no:randomly -k review_gate_context_probe_read
        cwd: .
  - id: dod-omn26110-hosted-deploy-smoke
    description: Exercise the installed CLI with the incident query and a missing declaration, then require the launchd start check to reject that environment and accept a declared dev lane.
    source: manual
    checks:
      - check_type: command
        check_value: |
          set -eu
          probe_dir=$(mktemp -d)
          trap 'rm -rf "$probe_dir"' EXIT
          uv sync --frozen --group dev
          runtime_bin=$(uv run --frozen python -c 'import sys; from pathlib import Path; print(Path(sys.executable).parent)')
          read_exit=0
          PATH="$runtime_bin:$PATH" OMNIBASE_PATH="$probe_dir" ONEX_WORKSPACE_CONFIG_ROOT="$probe_dir" onex ledger query --stdin < tests/unit/nodes/node_review_gate_context_orchestrator/review_gate_context_probe_read.json > "$probe_dir/answer" 2> "$probe_dir/refusal" || read_exit=$?
          cat "$probe_dir/refusal"
          test "$read_exit" -eq 1
          test ! -s "$probe_dir/answer"
          grep -F 'Work-ledger read refused (DelegateLaneSelectionError)' "$probe_dir/refusal"
          uv run --frozen pytest tests/unit/nodes/node_review_gate_context_orchestrator/test_review_gate_context_main.py -q --no-cov -p no:randomly -k review_gate_context_probe_read
        cwd: .
  - id: dod-omn26110-integration-proof
    description: On the probe host, replay the incident query fixture against the dev ledger and check the installed unit's receipt after reinstalling.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: >-
          env "${OMNI_HOME:?}/.onex-dispatch-venv/bin/onex" ledger query --stdin
          < tests/unit/nodes/node_review_gate_context_orchestrator/review_gate_context_probe_read.json
          | python3 -c 'import json, sys; reply = json.load(sys.stdin); assert reply["status"] == "ok" and reply["rows"] and not reply.get("next_cursor")'
        cwd: .
      - check_type: command
        check_value: >-
          python3 -c 'import json, sys; receipt = json.load(open(sys.argv[1])); assert receipt["ok"] and receipt["heads"] > 0 and receipt["posted"] == 0' "$HOME/.local/state/omni/review-gate-context-probe/last-run.json"
        cwd: .
