    description: "AC1 hosted probe. The non-dev base guard regression tests pass at the head."
    command: "env -u PYTHONPATH uv run pytest tests/unit/workflows/test_non_dev_base_guard_omn19032.py -q"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
