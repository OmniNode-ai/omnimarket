schema_version: "1.0.0"
ticket_id: "OMN-19032"
title: "Refuse feature-base auto-merge in the existing workflows"
summary: "The auto-merge workflow reads the base ref immediately before arming and refuses feature or unreadable bases, and the non-dev base guard fails for armed or unreadable declared stacks. AC1 is bound to the focused regression that runs the workflow shell steps with only the gh transport mocked. The ticket is partial: live feature-base required enforcement and a real refused-merge probe are not claimed."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-feature-base-auto-merge-refusal"
    statement: "The auto-merge and non-dev-base-guard workflows refuse to arm or keep armed a PR whose base is a feature or unreadable base, and preserve dev and main. The criterion below is labeled AC1 so the binding item can claim it through binds_ac."
    acceptance:
      - id: "AC1"
        statement: "AC1: the non-dev base guard regression tests pass at the head -- falsifier: uv run pytest tests/unit/workflows/test_non_dev_base_guard_omn19032.py -q in omnimarket"
evidence_requirements:
