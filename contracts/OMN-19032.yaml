    description: "AC1 hosted probe. The non-dev base guard regression tests pass at the head."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/workflows/test_non_dev_base_guard_omn19032.py -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC1"]
