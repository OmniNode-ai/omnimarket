schema_version: 1.0.0
ticket_id: OMN-24569
title: 'Typed reads for the stability lane: is-ancestor on the git mirror node and the loaded code sha on the lab alarm node'
summary: node_git_query_mirror_effect gains the typed operation is_ancestor (two shas, one repository mirror, unread when the mirror lacks either) and node_lab_alarm gains the typed operation loaded_code_sha behind which the existing deploy agent sha adapter call moves. No new node; both are the reads plan section 4.4 step 2 of the stability lane slice needs.
is_seam_ticket: true
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24569-typed-reads
  statement: The two reads the stability slice needs are typed operations on existing nodes, each with a failing control.
  acceptance:
  - id: AC1
    statement: 'AC1: the git mirror node answers whether one sha is an ancestor of another for a named repository as a typed result, true or false, and answers unread (ok false, no answer) when the mirror lacks either sha, never fetching -- falsifier: pytest tests/nodes/node_git_query_mirror_effect/test_omn19998_is_ancestor.py -q goes red when the answer is forced to true or when the presence check is removed'
  - id: AC2
    statement: 'AC2: the lab alarm node''s loaded-code-sha operation returns the deploy agent''s loaded sha with its surface as READ, or UNREAD with the reason, and the lab-pass-receipt condition reads its sha only through it with unchanged answers -- falsifier: pytest tests/nodes/node_lab_alarm/test_lab_alarm_loaded_code_sha.py -q goes red when the condition reads its source directly or when the adapter accepts a non-sha string'
  - id: AC3
    statement: 'AC3: integrated: on a lab host running the node from this change with the overlay''s lab_pass_receipt block declared, the loaded-code-sha verb prints READ with the development agent''s loaded sha, and an is_ancestor request on a synced mirror answers true for an older and a newer sha of one repository -- falsifier: with the agent url pointed at a closed port the verb exits 3 with UNREAD, and with a sha the mirror lacks the answer is unread'
evidence_requirements:
- kind: tests
  description: The two operations tests pass at the pushed head.
  command: uv run --frozen pytest tests/nodes/node_lab_alarm/test_lab_alarm_loaded_code_sha.py tests/nodes/node_lab_alarm/test_lab_alarm_lab_pass_receipt.py -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24569-ac1
  description: 'Golden: an older sha is an ancestor of a newer one. Error: a sha the mirror lacks reads unread. Failing control: the same shas reversed read false; the answer forced to true and the presence check removed each turn a test red.'
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_git_query_mirror_effect/test_omn19998_is_ancestor.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24569-ac2
  description: 'Golden and error event chains for the loaded_code_sha operation; parity of the lab-pass-receipt condition; failing controls: the condition reading its source directly and the adapter accepting any string as a sha each turn a test red.'
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_lab_alarm/test_lab_alarm_loaded_code_sha.py tests/nodes/node_lab_alarm/test_lab_alarm_lab_pass_receipt.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24569-ac3
  description: The tests behind the integrated reading pass; the live reading on a lab host is recorded in the Lab comment of the pull request.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_git_query_mirror_effect/test_omn19998_is_ancestor.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24569-integration-proof
  description: Run the two operations tests on a lab host at the pushed head. Hosted CI cannot reach the lab hosts, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24569 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_git_query_mirror_effect/test_omn19998_is_ancestor.py tests/nodes/node_lab_alarm/test_lab_alarm_loaded_code_sha.py -q --no-cov -n 0 -p no:randomly
