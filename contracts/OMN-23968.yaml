schema_version: 1.0.0
ticket_id: OMN-23968
title: Install the second stability environment through a node workflow
summary: Two nodes (a plan compute node and a compose effect node) that install a declared stability stack on a lab host from overlay values, with the project name, ports, volumes, container names and image tags as overlay data and a refusal for any collision with a reserved lane. The install orchestrator that composes them and the install state reducer wiring follow as separate changes.
is_seam_ticket: true
interface_change: true
interfaces_touched:
- events
requirements:
- id: req-omn23968-plan
  statement: A stack description in an overlay becomes an ordered install plan, or a refusal naming the collision, with nothing started.
  acceptance:
  - id: AC1
    statement: 'AC1: a plan node turns the overlay''s stack description into an ordered install plan and refuses a project name, container name, volume name or published port that collides with a declared reserved lane -- falsifier: pytest tests/nodes/node_stability_stack_plan_compute/test_golden_chain_stability_stack_plan_compute.py -q fails when the reserved-lane list is emptied'
- id: req-omn23968-effect
  statement: One plan step runs on the host the overlay names, through an injected runner.
  acceptance:
  - id: AC2
    statement: 'AC2: an effect node runs one plan step through an injected runner and refuses a step outside the plan or a host outside the overlay with a typed reason -- falsifier: pytest tests/nodes/node_stability_stack_compose_effect/test_golden_chain_stability_stack_compose_effect.py -q fails when the host check is removed'
- id: req-omn23968-integrated
  statement: The workflow runs on a lab host and the stack's own broker carries one event.
  acceptance:
  - id: AC4
    statement: 'AC4: integrated: on host h053 through the workflow the stack is taken down and read gone, then brought up from a dev-merge tag proven on dev, every container reads healthy, the runtime health read returns 200 and one event is published and consumed on the stack''s own broker -- falsifier: curl of the stack runtime health port on h053 returns non-200, or the consumed event count reads 0'
evidence_requirements:
- kind: tests
  description: The plan and compose effect node tests pass at the pushed head.
  command: uv run --frozen pytest tests/nodes/node_stability_stack_plan_compute/test_golden_chain_stability_stack_plan_compute.py tests/nodes/node_stability_stack_compose_effect/test_golden_chain_stability_stack_compose_effect.py -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23968-ac1
  description: The golden plan, one refusal per collision kind, and the control (the collision removed from the reserved lanes plans the stack) pass.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_stability_stack_plan_compute/test_golden_chain_stability_stack_plan_compute.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn23968-ac2
  description: The golden step argv, every refusal and failed readback, and the host control pass.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_stability_stack_compose_effect/test_golden_chain_stability_stack_compose_effect.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn23968-ac4
  description: The integrated reading is taken on h053 from the branch; the tests at the head stand behind the node half.
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_stability_stack_plan_compute/test_golden_chain_stability_stack_plan_compute.py tests/nodes/node_stability_stack_compose_effect/test_golden_chain_stability_stack_compose_effect.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn23968-integration-proof
  description: Run the stability stack node tests on a lab host at the pushed head. Hosted CI cannot reach the lab hosts, so only the local Done gate runs this unbound check; it binds no criterion for the hosted check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23968 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_stability_stack_plan_compute tests/nodes/node_stability_stack_compose_effect -q --no-cov -n 0 -p no:randomly
    cwd: .
