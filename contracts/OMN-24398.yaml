schema_version: 1.0.0
ticket_id: OMN-24398
title: Add a code-scanning alerts read to the GitHub service
summary: The GitHub gateway effect node gains the read operation code_scanning_alerts and onex scm the verb code-scanning-alerts, which lists the open code-scanning alerts of a pull request merge ref or a branch (number, rule id, severity, path, line). A missing analysis, scanning off and a token without access are typed available=false answers with a reason.
is_seam_ticket: true
interface_change: true
interfaces_touched:
- public_api
requirements:
- id: req-omn24398-code-scanning-alerts
  statement: A lane reads a pull request's open code-scanning alerts through onex scm over the bus.
  acceptance:
  - id: AC1
    statement: 'AC1: the gateway answers a code-scanning-alerts request for a pull request or a ref with each open alert''s number, rule id, severity, path and line, typed in the contract -- falsifier: uv run pytest tests/nodes/node_github_repo_gateway_effect -q --no-cov -k code_scanning_golden_chain'
  - id: AC2
    statement: 'AC2: a missing scope, a forbidden answer, a repository with no scanning data and a transport failure each end as a typed refusal, never an exception -- falsifier: uv run pytest tests/nodes/node_github_repo_gateway_effect -q --no-cov -k code_scanning_error_chain'
  - id: AC3
    statement: 'AC3: the failing control: a request with neither a pull request nor a ref is refused at the model -- falsifier: uv run pytest tests/nodes/node_github_repo_gateway_effect -q --no-cov -k code_scanning_failing_control'
  - id: AC4
    statement: 'AC4: the CLI verb, the bus request and the gateway agree on the request and result shape, on the in-memory bus -- falsifier: uv run pytest tests/unit/handlers/scm/test_code_scanning_alerts_seam.py -q --no-cov'
  - id: AC5
    statement: 'AC5: integrated: on the dev runtime, onex scm code-scanning-alerts OmniNode-ai/omnimarket#6096 answers over the bus with a typed result -- falsifier: run the command against the dev bus; a no-consumer answer or a missing result fails it'
evidence_requirements:
- kind: tests
  description: The gateway and scm command tests pass at the pushed head.
  command: uv run pytest tests/nodes/node_github_repo_gateway_effect/test_code_scanning_alerts.py tests/unit/handlers/scm/test_code_scanning_alerts_seam.py tests/unit/handlers/scm/test_onex_scm_command.py -q -n 0 --no-cov -p no:cacheprovider
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24398-ac1
  description: 'AC1: golden chain on a recorded GitHub transport'
  source: manual
  binds_ac: [AC1]
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_github_repo_gateway_effect/test_code_scanning_alerts.py -q -n 0 --no-cov -p no:cacheprovider -k code_scanning_golden_chain
    cwd: .
- id: dod-omn24398-ac2
  description: 'AC2: error chain: unavailable answers carry a reason, other statuses raise'
  source: manual
  binds_ac: [AC2]
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_github_repo_gateway_effect/test_code_scanning_alerts.py -q -n 0 --no-cov -p no:cacheprovider -k code_scanning_error_chain
    cwd: .
- id: dod-omn24398-ac3
  description: 'AC3: failing control: neither ref, both refs refused; red when the rule is removed'
  source: manual
  binds_ac: [AC3]
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_github_repo_gateway_effect/test_code_scanning_alerts.py -q -n 0 --no-cov -p no:cacheprovider -k code_scanning_failing_control
    cwd: .
- id: dod-omn24398-ac4
  description: 'AC4: seam: CLI, bus request, gateway dispatch and recorded GitHub answer as one chain'
  source: manual
  binds_ac: [AC4]
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/handlers/scm/test_code_scanning_alerts_seam.py -q -n 0 --no-cov -p no:cacheprovider
    cwd: .
- id: dod-omn24398-ac5
  description: 'hosted proxy for AC5: the tests above; the dev read is made after the deploy and named in the pull request'
  source: manual
  binds_ac: [AC5]
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/handlers/scm/test_code_scanning_alerts_seam.py -q -n 0 --no-cov -p no:cacheprovider
    cwd: .
- id: dod-omn24398-integration-proof
  description: the verb answers on the dev bus; hosted CI cannot reach the lab, so only the local Done gate runs this check
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-codescan --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_github_repo_gateway_effect/test_code_scanning_alerts.py tests/unit/handlers/scm/test_code_scanning_alerts_seam.py -q --no-cov
