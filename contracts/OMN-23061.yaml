schema_version: 1.0.0
ticket_id: OMN-23061
title: ModelLabHostsTable accepts the registry_root_candidates key the host-list projection carries
summary: ModelLabHostsTable refused the projection key registry_root_candidates, which node_host_capability_compute reads to try registry roots in order on a probed host. The model gains the optional field (a non-empty tuple of registry roots, default None), carried by the table shape and not an overlay key. No check and no bound changes.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23061-registry-root-candidates
  statement: A host table that declares registry_root_candidates loads with them, and one that declares none loads with None.
  acceptance:
  - id: AC1
    statement: 'AC1: the 7 new tests pass on the branch and 2 fail on the base source -- falsifier: uv run pytest of tests/unit/lab_work/test_lab_host_table_registry_root_candidates.py on origin/dev source'
evidence_requirements:
- kind: tests
  description: The registry root candidates table tests
  command: uv run --frozen pytest tests/unit/lab_work/test_lab_host_table_registry_root_candidates.py -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23061-table-tests
  description: Runs the table tests; a table declaring registry_root_candidates loads with them and one declaring none loads with None. Two of the seven fail without the field.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/lab_work/test_lab_host_table_registry_root_candidates.py -q --no-cov
    cwd: .
- id: dod-omn23061-deploy-probe
  description: Deploy probe. The ModelLabHostsTable field registry_root_candidates is read from the checked-out source; the probe exits nonzero on a tree without it, so it fails at the merge base.
  source: manual
  checks:
  - check_type: command
    check_value: "grep -q '    registry_root_candidates: ($' src/omnimarket/models/overlay_keys/model_overlay_documents.py"
    cwd: .
- id: dod-omn23061-integration-proof
  description: The pushed head ran the registry root candidates table tests on a lab host through the lab work runner and exited 0. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: 'uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23061 -- uv run --frozen pytest tests/unit/lab_work/test_lab_host_table_registry_root_candidates.py -q --no-cov'
    cwd: .
