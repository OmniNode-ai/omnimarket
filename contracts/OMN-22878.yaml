schema_version: "1.0.0"
ticket_id: OMN-22878
title: "The overlay store reader installs on a Linux lab host through the registry unit installer, as a systemd user service and timer"
summary: >-
  node_host_installer_registry_units renders and installs a registry_module_tick unit that declares platform systemd as a
  systemd user service and timer, with a module proof before install, a rollback of the previous unit files on a refused
  step, an install record of the revision it runs and a status read of the timer and the heartbeat. The unit
  overlay-store-refresh-systemd runs the overlay store reader tick, so a Linux lab host keeps the lab host list projection
  through a declared installer. This branch's pull request takes its own child ticket of OMN-22878 when one is assigned;
  this file is renamed to that ticket then.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn22878-systemd-reader-unit
    statement: A Linux lab host installs the overlay store reader through the declared registry unit installer.
    acceptance:
      - id: AC1
        statement: 'AC1: a unit declaring platform systemd renders and installs a user service and timer that run the named checkout, a refused step restores the previous unit files, and status reads the timer and the heartbeat -- falsifier: uv run --frozen pytest tests/nodes/node_host_installer_registry_units/test_registry_units_systemd.py -q --no-cov'
evidence_requirements:
  - kind: tests
    description: The installer node's focused tests, including the systemd tests and the rollback control.
    command: uv run --frozen pytest tests/nodes/node_host_installer_registry_units -q --no-cov
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-omn22878-systemd-reader-tests
    description: The installer node tests pass with the change, including the refused-enable rollback control.
    source: manual
    execution_scope: hosted_and_local
    binds_ac: [AC1]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/nodes/node_host_installer_registry_units -q --no-cov
        cwd: .
  - id: dod-omn22878-integration-proof-h051
    description: The reader unit installed on h051 from this branch through this node reads LOADED with a fresh heartbeat; hosted CI cannot reach the lab host, so only the local Done gate runs this unbound check, and the h051 read is in the pull request comment that names the head.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: 'onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-22878-reader --kind test -- bash -c ''echo "{\"unit\": \"overlay-store-refresh-systemd\", \"mode\": \"status\", \"home\": \"$HOME\", \"registry_root\": \"$OMNI_HOME\"}" | uv run --frozen python -m omnimarket.nodes.node_host_installer_registry_units'''
        cwd: .
