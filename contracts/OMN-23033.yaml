schema_version: 1.0.0
ticket_id: OMN-23033
title: One bus workflow answers every repository state query from the mirror, pulling first only when the mirror is behind
summary: node_repo_state_query_effect answers refs, a branch head, files at a revision, and pull request, check and job state from this host's mirror (the canonical clone and the PR watcher state), comparing the mirror with the latest state the bus holds first and pulling only when it is behind; concurrent queries of one stale repository share one pull.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23033-repo-state-query
  statement: A repository state query on a current mirror returns from the mirror with no GitHub call; on a stale mirror it pulls once and then returns; concurrent queries for the same stale repository cause one pull.
  acceptance:
  - id: AC1
    statement: 'AC1: a state query on a current mirror returns from the mirror with no GitHub call; on a stale mirror it pulls once and then returns, and both paths are tested with a planted stale mirror and a planted current one -- falsifier: uv run pytest of the workflow''s handler tests with GitHub calls counted'
  - id: AC3
    statement: 'AC3: concurrent queries for the same stale repository cause one pull, not one per query -- falsifier: uv run pytest of the coalescing test'
evidence_requirements:
- kind: tests
  description: The handler tests (planted current and stale mirrors, GitHub-bound git commands counted) and the coalescing test pass
  command: uv run --frozen pytest tests/nodes/node_repo_state_query_effect -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23033-handler-paths
  description: Runs the handler tests; a current planted mirror answers with zero GitHub-bound git commands and a stale one with exactly one pull.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_repo_state_query_effect/test_repo_state_query_handler.py -q --no-cov
    cwd: .
- id: dod-omn23033-coalescing
  description: Runs the coalescing test; eight concurrent queries of one stale planted repository make one pull, and the injected break without the in-flight table makes eight.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_repo_state_query_effect/test_repo_state_query_coalescing.py -q --no-cov
    cwd: .
- id: dod-omn23033-integration-proof
  description: The pushed head ran the node's handler, coalescing and bus chain tests on a lab host through the lab work runner and exited 0. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: 'uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23033 -- uv run --frozen pytest tests/nodes/node_repo_state_query_effect -q --no-cov'
    cwd: .
- id: dod-omn23033-deploy-probe
  description: Deploy probe. The repository state serve host, RepoStateHost in adapter_repo_state_query_serve.py, is read from GitHub at the checked-out commit; the probe exits nonzero on a tree without it, so it fails at the merge base.
  source: manual
  checks:
  - check_type: command
    check_value: gh api "repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_repo_state_query_effect/handlers/adapter_repo_state_query_serve.py?ref=$(git rev-parse HEAD)" --jq .content | base64 -d | grep -q '^class RepoStateHost'
    cwd: .
- id: dod-omn23033-deploy-golden-chain
  description: 'Hosted deploy smoke, runnable on the hosted runner with no lab route, broker or GitHub read: runs the node''s golden chain through the in-process bus and requires the planted current mirror to answer from the mirror and the planted stale mirror to pull once.'
  source: manual
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_repo_state_query_effect/test_golden_chain_node_repo_state_query_effect.py -q --no-cov
    cwd: .
- id: dod-omn23033-watcher-refresh
  description: Runs the watcher refresh tests; a planted stale watcher state with a newer bus event reads mirror_behind with no declared refresh command and with a tick that changes nothing, and reads current after the declared repo-state-refresh command runs.
  source: manual
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_repo_state_watcher_refresh_effect -q --no-cov
    cwd: .
- id: dod-omn23033-watcher-refresh-deploy-probe
  description: 'Deploy probe: the handler GitHub serves at the checked-out commit defines the watcher refresh, which the merge base does not.'
  source: manual
  checks:
  - check_type: command
    check_value: |-
      bash -o pipefail -c 'gh api "repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_repo_state_watcher_refresh_effect/handlers/handler_watcher_refresh.py?ref=$(git rev-parse HEAD)" --jq .content | base64 -d | grep -F "class HandlerWatcherRefresh" > /dev/null'
    cwd: .
- id: dod-omn23033-lab-fill-reads
  description: Runs the lab fill repository state read tests; a stale planted watcher state without a hold label is read by the old direct read as no hold, and the lab fill's repository state read refreshes the watcher state first, reads the hold, and makes no GitHub-bound git command.
  source: manual
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_lab_fill_effect/test_lab_fill_repo_state_read.py -q --no-cov
    cwd: .
