schema_version: 1.0.0
ticket_id: OMN-24324
title: "Dev runtime unhealthy: skill lifecycle writer drops every assistant skill record"
summary: The skill lifecycle projection fold required the run id and the correlation id of each skill record to parse as UUIDs. The skill hook sets the run id to Claude's own tool use id, an opaque string, so the fold skipped every hook record, the writer upserted zero rows, and the dev runtime's health check read projection_apply_divergence and unhealthy. The fold now keeps a UUID as sent and derives a stable UUID from any other non-empty text, so a started and a completed record of one invocation share a run id and a replay reaches the same row.
is_seam_ticket: true
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24324-fold
  statement: The skill lifecycle fold folds the skill hook's records, whose run id is an opaque tool use id, to rows that pair and replay.
  acceptance:
  - id: AC1
    statement: "AC1: a skill-started and a skill-completed record carrying the assistant's own tool-use identifier fold to rows that share one run id, and replaying them lands on the same rows -- falsifier: pytest tests/test_seam_skill_hook_to_skill_lifecycle_fold.py -q fails on the pre-change fold"
  - id: AC2
    statement: "AC2: a run id that is not text still writes nothing and logs the skip -- falsifier: pytest tests/test_seam_skill_hook_to_skill_lifecycle_fold.py -q -k refused_where"
- id: req-omn24324-integrated
  statement: The dev runtime reads healthy with no divergence after the deploy agent rolls the fix.
  acceptance:
  - id: AC3
    statement: "AC3: integrated: on the dev runtime after the deploy agent rolls the fix, the container health reads healthy for 30 minutes and the runtime log holds no projection_apply_divergence line -- falsifier: docker inspect of the runtime container health status and a grep of its log for projection_apply_divergence"
evidence_requirements:
- kind: tests
  description: The seam test and the golden chain test pass at the pushed head.
  command: uv run pytest tests/test_seam_skill_hook_to_skill_lifecycle_fold.py tests/test_golden_chain_projection_skill_lifecycle.py -q -p no:randomly --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24324-ac1
  description: 'AC1: the seam test passes at the head; at the merge base the same test fails with the message the runtime logs (a required field is not of its declared type).'
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/test_seam_skill_hook_to_skill_lifecycle_fold.py -q -p no:randomly --no-cov
    cwd: .
- id: dod-omn24324-ac2
  description: 'AC2: the contrast test accepts a tool use id and refuses a number, an empty string, a boolean and a list as run ids; at the merge base the fold refuses the tool use id too, so the check fails there.'
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/test_seam_skill_hook_to_skill_lifecycle_fold.py -q -p no:randomly --no-cov -k refused_where
    cwd: .
- id: dod-omn24324-ac3
  description: 'hosted proxy for AC3: the golden chain test replays a hook-keyed started and completed pair to the same two rows; the reading on the dev runtime after the roll is posted as a pull request comment naming the head.'
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/test_golden_chain_projection_skill_lifecycle.py -q -p no:randomly --no-cov -k hook_keyed
    cwd: .
- id: dod-omn24324-integration-proof
  description: the seam test and the golden chain test run on a lab host at the pushed head, the seam test failing at the merge base; hosted CI cannot reach the lab, so only the local Done gate runs this unbound check
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24324 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/test_seam_skill_hook_to_skill_lifecycle_fold.py tests/test_golden_chain_projection_skill_lifecycle.py -q --no-cov -p no:randomly
