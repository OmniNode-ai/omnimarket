schema_version: 1.0.0
ticket_id: OMN-22906
title: Host power control and a runnable storage command exist as nodes with a failing control, so a host window needs no hand step
summary: Two omnimarket nodes. node_host_power_effect takes a host and an action from its overlay, refuses a host with no declared power route with a typed result, and serves the ilo_redfish route through node_ilo_redfish_effect. node_host_storage_effect runs one declared storage command on a host and returns the free bytes before and after. Each has an in-memory backend and a real one chosen by overlay.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn22906-host-power-storage
  statement: A host window's power and storage steps run as nodes whose overlay declares the hosts, routes and commands, with typed refusals and a failing control for each reading.
  acceptance:
  - id: AC1
    statement: 'AC1: a power node takes a host and an action from the host table''s overlay, refuses a host with no declared power route with a typed failure, and a test shows the refusal -- falsifier: uv run pytest tests/unit/nodes/node_host_power_effect -q'
  - id: AC2
    statement: 'AC2: a storage node runs one declared storage command on a host and returns a typed result with the free bytes before and after -- falsifier: uv run pytest tests/unit/nodes/node_host_storage_effect -q'
  - id: AC3
    statement: 'AC3: both nodes ship with an in-memory backend and a real one chosen by overlay, and one suite passes on both -- falsifier: uv run pytest tests/unit/nodes -q -k ''host_power or host_storage'''
evidence_requirements:
- kind: tests
  description: The power and storage node suites, each run on both backends, with the named injected breaks.
  command: uv run --frozen pytest tests/unit/nodes/node_host_power_effect tests/unit/nodes/node_host_storage_effect -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
