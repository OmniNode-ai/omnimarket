---
schema_version: "1.0.0"
ticket_id: OMN-26355
title: "A projection writer dispatched with no delivery context ends in a typed outcome naming the missing delivery context instead of KeyError _partition"
summary: RuntimeProjectionWriter.handle and SavingsProjectionWriter.handle read the delivery coordinates through ModelProjectionRequest and, when a dispatch carries no _partition or no _offset, raise ProjectionDeliveryContextMissingError naming the missing keys instead of a bare KeyError. The coordinates are never defaulted to 0. The consume boundary treats the typed error as a write-path failure, so the offset withhold stays bounded by the existing redelivery cap.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn26355-typed-delivery-context-refusal
    statement: A projection writer dispatched with no delivery context refuses with a typed error that names the missing delivery keys, never a bare KeyError, and never fabricates a coordinate.
    acceptance:
      - id: AC1
        statement: "AC1: a dispatch with no delivery context is reproduced reaching SavingsProjectionWriter on a lab host at current omnimarket dev and omnibase_infra dev, and the PR body has a section headed Measured reproduction with the command, the host, the UTC read time and the KeyError excerpt -- falsifier: grep -c 'Measured reproduction' on the PR body file named in the lane STATUS row prints 0"
      - id: AC2
        statement: "AC2: RuntimeProjectionWriter.handle and SavingsProjectionWriter.handle given a request with no _partition or no _offset read the coordinates through ModelProjectionRequest and end in a typed error that names the missing delivery context keys, never a KeyError -- falsifier: uv run pytest tests -q -k partition_missing_delivery_context fails at origin/dev and passes on the PR branch"
      - id: AC3
        statement: "AC3: a regression test built from the incident's recorded data (the 2026-11-21 09:10Z KeyError evidence saved as a fixture, path named in the PR) fails on the broken code and passes on the fix -- falsifier: uv run pytest tests -q -k partition_missing_delivery_context_incident"
      - id: AC4
        statement: "AC4: the ProjectionNotMaterializedError loop the failure fed is measured, and the PR body has a section headed Measured redelivery bound that says whether a delivery ending in the typed outcome is redelivered, how many times, on which host and at what UTC read time -- falsifier: grep -c 'Measured redelivery bound' on the PR body file named in the lane STATUS row prints 0"
      - id: AC5
        statement: "AC5: the PR branch changes nothing outside src/omnimarket handlers, models, projection and node_projection_* directories and tests, and no runtime, compose, health gate or deploy file -- falsifier: git diff origin/dev --name-only piped through grep -vE the allowed prefixes prints a line"
evidence_requirements:
  - kind: tests
    description: The focused delivery-context tests, the incident fixture test and the writer tests they touch.
    command: uv run pytest tests/test_projection_writer_partition_missing_delivery_context.py tests/test_omn23043_savings_hook_event_skip.py tests/test_projection_request.py tests/test_omn18905_writers_carry_source_coordinates.py -q --no-cov
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-omn26355-ac1
    description: "The delivery-less dispatch was reproduced on a lab host at omnimarket dev 0935d157dd: SavingsProjectionWriter().handle with the dict omnibase_infra builds when its delivery is None raised KeyError '_partition' at handler_runtime_writer.py line 44. The command, host and UTC read time are in the PR body section Measured reproduction; the incident test below replays the same dict against the fix."
    source: manual
    binds_ac: [AC1]
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests -q --no-cov -k partition_missing_delivery_context_incident
        cwd: .
  - id: dod-omn26355-ac2
    description: "Both writers refuse a request with no _partition or no _offset with ProjectionDeliveryContextMissingError naming the missing keys; the focused tests failed with KeyError at origin/dev and pass on the branch."
    source: manual
    binds_ac: [AC2]
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests -q --no-cov -k partition_missing_delivery_context
        cwd: .
  - id: dod-omn26355-ac3
    description: "The incident fixture (tests/fixtures/projection_writer_partition_missing_delivery_context_incident.json) rebuilds the delivery-less dispatches against every savings topic family and fails with KeyError on the broken code."
    source: manual
    binds_ac: [AC3]
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests -q --no-cov -k partition_missing_delivery_context_incident
        cwd: .
  - id: dod-omn26355-ac4
    description: "The redelivery bound for a delivery ending in the typed error was read from omnibase_infra at origin/dev and measured on a lab host; the result is in the PR body section Measured redelivery bound. The typed error is not a validation, key or type error, so the consume boundary treats it as a write-path failure bounded by projection_withhold_max_redeliveries."
    source: manual
    binds_ac: [AC4]
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests -q --no-cov -k partition_missing_delivery_context_error_is_not_a_content_or_wiring_type
        cwd: .
  - id: dod-omn26355-ac5
    description: "The branch changes only src/omnimarket/handlers, src/omnimarket/models, src/omnimarket/nodes/node_projection_savings, tests and this contract."
    source: manual
    binds_ac: [AC5]
    checks:
      - check_type: command
        check_value: "bash -c '! git diff origin/dev --name-only | grep -vE \"^(src/omnimarket/(handlers|models|projection|nodes/node_projection_[a-z_]+)/|tests/|contracts/OMN-26355.yaml$)\"'"
        cwd: .
  - id: dod-omn26355-integration-proof
    description: "Run the focused delivery-context tests and the writer tests they touch on a lab host at the pushed head; the local Done gate runs this unbound check."
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-26355 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/test_projection_writer_partition_missing_delivery_context.py tests/test_omn23043_savings_hook_event_skip.py tests/test_projection_request.py tests/test_omn18905_writers_carry_source_coordinates.py -q --no-cov
        cwd: .
