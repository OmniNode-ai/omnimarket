---
schema_version: "1.0.0"
ticket_id: "OMN-26087"
title: "Port the capability catalog node into omnimarket"
summary: "The capability catalog node (collect lab hosts, lanes, model servers and host-local tools read-only, render the catalog views, publish them to the knowledge base) moves into omnimarket as node_capability_catalog_effect with its tests, so the host timer no longer depends on a frozen private repository."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-omn26087-capability-catalog-node"
    statement: |-
      node_capability_catalog_effect exists in omnimarket with its contract, metadata, handlers, models and ported tests, and imports nothing from the private tooling package.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: the node and its ported tests exist and pass, and ruff and mypy --strict are clean on the touched files -- falsifier: uv run pytest tests/nodes/node_capability_catalog_effect -q -p no:cacheprovider fails, or uv run ruff check src/omnimarket/nodes/node_capability_catalog_effect tests/nodes/node_capability_catalog_effect fails, or uv run mypy src/omnimarket/nodes/node_capability_catalog_effect --strict fails
evidence_requirements:
  - kind: "tests"
    description: "The ported capability catalog tests."
    command: "uv run pytest tests/nodes/node_capability_catalog_effect -q -p no:cacheprovider"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn26087-ac1-node-and-tests"
    description: "The node's ported tests (lab collector, tool collector, renderers, publish and the console entry golden tests) pass; the node directory is ruff-clean and mypy --strict clean. Fails at the merge base, where the node does not exist."
    source: "manual"
    binds_ac: ["AC1"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_capability_catalog_effect -q -p no:cacheprovider"
        cwd: "${OMNI_HOME}/omnimarket"
      - check_type: "command"
        check_value: "uv run ruff check src/omnimarket/nodes/node_capability_catalog_effect tests/nodes/node_capability_catalog_effect"
        cwd: "${OMNI_HOME}/omnimarket"
      - check_type: "command"
        check_value: "uv run mypy src/omnimarket/nodes/node_capability_catalog_effect --strict"
        cwd: "${OMNI_HOME}/omnimarket"
