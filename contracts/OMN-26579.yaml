schema_version: 1.0.0
ticket_id: OMN-26579
title: 'One declared topic carries agent messages, with a typed message model and an effect node that publishes and reads it'
summary: 'node_agent_message_effect declares onex.evt.omnimarket.agent-message.v1 in its contract and in the emit daemon topic registry, validates ModelAgentMessage (from, to, thread, kind, text, sent_at, platform) and sends and reads it through the emit effect and the declared broker.'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn26579-agent-message-topic
  statement: One declared topic, a typed message model and an effect node that sends and reads it, with typed refusals.
  acceptance:
  - id: AC1
    statement: 'AC1: the topic name, its message model and the node contract exist in canonical locations and the contract validates -- falsifier: uv run pytest tests for the node contract validation fails on a missing or misdeclared topic'
  - id: AC2
    statement: 'AC2: a message with a missing from, to, thread, kind, text, sent_at or platform is refused with a typed error and publishes nothing -- falsifier: uv run pytest -m unit on the failure-first tests fails when the model accepts an incomplete message'
  - id: AC3
    statement: 'AC3: the node publishes one valid message and reads it back by recipient and thread -- falsifier: uv run pytest -m unit round-trip test against a fake bus fails when publish or read is removed'
evidence_requirements:
- kind: tests
  description: The agent message node tests pass at the pushed head.
  command: uv run pytest tests/unit/nodes/node_agent_message_effect -m unit -q -n 0 --no-cov -p no:cacheprovider
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn26579-ac1
  description: 'AC1: the contract declares the topic it publishes and reads, the emit daemon registry declares the same topic as duty_critical, and the two are equal.'
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/nodes/node_agent_message_effect/test_agent_message_contract.py -q -n 0 --no-cov -p no:cacheprovider
    cwd: .
- id: dod-omn26579-ac2
  description: 'AC2: an incomplete message, an unknown platform or kind, a naive sent_at and an over-long text are refused by the model, and the node publishes nothing for them (failing control: the tests fail with ModuleNotFoundError before the node exists).'
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/nodes/node_agent_message_effect/test_agent_message_model.py tests/unit/nodes/node_agent_message_effect/test_agent_message_handler.py -q -n 0 --no-cov -p no:cacheprovider
    cwd: .
- id: dod-omn26579-ac3
  description: 'AC3: send then read round-trips against a fake bus by recipient and thread, oldest first, bounded by count and since.'
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/nodes/node_agent_message_effect/test_agent_message_handler.py -q -n 0 --no-cov -p no:cacheprovider
    cwd: .
- id: dod-omn26579-integration-proof
  description: the agent message node tests run on a lab host at the pushed head; hosted CI cannot reach the lab, so only the local Done gate runs this unbound check
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-26579 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/nodes/node_agent_message_effect -m unit -q --no-cov
