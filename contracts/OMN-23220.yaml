schema_version: 1.0.0
ticket_id: OMN-23220
title: The friction rollup reads the local-hooks stoppage from rows that say hooks failed one at a time, and reads an inline cost as lane time
summary: The floor row stoppage:local-hooks-fail-one-per-attempt read 8 rows and 214 lane-minutes, but the class rule of node_friction_rollup_compute matched any FRICTION row that names the pre-commit or pre-push stage, so the 8 rows were 8 different causes. The broad rule now keeps only the text that says hooks failed one at a time over several attempts, five rules name the causes the broad rule had filed, and the rollup reads an inline cost as the first duration written as lane time or with a tilde, falling back to the first duration of any kind only when none is marked. No verdict, bound or check of the rollup changes.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23220-hooks-class-rule
  statement: The hooks class holds only the rows that name a hook round, commit attempts or failing hooks, each other recorded row of the day reads as its own cause, and an age or a limit in a row's text is not its cost.
  acceptance:
  - id: AC1
    statement: 'AC1: the 8 recorded rows of 2026-11-07T21:01Z to 2026-11-08T15:21Z read as their own causes with one row staying in the hooks class, and the rule as it stood files all 8 in it -- falsifier: uv run --frozen pytest tests/nodes/node_friction_rollup_compute/test_hooks_fail_class_2026_11_08.py -q --no-cov'
  - id: AC2
    statement: 'AC2: an age or a limit in a row text is not read as its cost and a row with only bare durations still reads its first, with every earlier class rule test unchanged -- falsifier: uv run --frozen pytest tests/nodes/node_friction_rollup_compute -q --no-cov'
