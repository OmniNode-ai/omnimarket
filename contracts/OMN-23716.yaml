schema_version: 1.0.0
ticket_id: OMN-23716
title: Make the h053 secret reading overlay come from the overlays repository
summary: "The secret reading node's schedule install pins the overlay document id a unit reads (ONEX_SECRET_READING_OVERLAY_ID) beside the overlay root, and the drill is named by a document id read from the same root, so the units on h053 read their documents from the overlays clone and no second root is placed by hand. A unit that does not name an id renders byte for byte as before."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23716-units-read-declared-documents
  statement: The schedule install renders the unit's overlay document id and the drill's id from the declared overlay, loads the document the process is told to read, and refuses a drill id with no document; the default render is unchanged.
  acceptance:
  - id: AC1
    statement: 'AC1: the h053 secret-reading overlay documents (main, drill) are declared in the overlays repository, name the store at its tailnet address, list only that one address under plain_http_hosts, and the office-network address appears in none of them -- falsifier: python3 -m pytest tests/test_secret_reading_h053_overlays.py -q in the overlays repository fails when the file is absent or the office address or a wider range is put back'
  - id: AC2
    statement: 'AC2: the schedule installer writes the overlay document id a unit reads into the rendered unit, and the drill unit reads its own declared id from the same overlay root as the hourly unit -- falsifier: python3 -m pytest tests/nodes/node_secret_reading_effect/test_secret_reading_schedule.py -q -k overlay_id in the omnimarket repository fails on the pre-change installer'
  - id: AC3
    statement: 'AC3: integrated: after the declared reinstall from the declared overlay clone, the unit files on h053 name the clone as their overlay root and the next hourly secret-reading run and the next join J4 run read outcome resolved -- falsifier: grep ONEX_SKILL_OVERLAY_ROOTS in the installed unit files names a path outside the overlays clone, or the run rows of the two units on the ledger read an outcome other than resolved'
evidence_requirements:
- kind: tests
  description: The secret reading schedule tests, including the overlay id cases.
  command: uv run --frozen pytest tests/nodes/node_secret_reading_effect/test_secret_reading_schedule.py -q --no-cov -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23716-ac1-declared-documents
  description: The overlay model loads a document by the id the unit pins and accepts a drill document id; the h053 documents themselves are declared and tested in the overlays repository (tests/test_secret_reading_h053_overlays.py there).
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_secret_reading_effect/test_secret_reading_schedule.py -k "overlay_id" -q --no-cov -p no:randomly
    cwd: .
- id: dod-omn23716-ac2-installer-overlay-id
  description: The rendered unit pins the id, the drill reads the same root with its own id, a missing drill document is refused with nothing written, and the default render is unchanged.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_secret_reading_effect/test_secret_reading_schedule.py -q --no-cov -p no:randomly
    cwd: .
- id: dod-omn23716-ac3-integrated
  description: 'The hosted-runnable part of AC3: the schedule install verb, run with the overlay root and id in its environment, renders units that pin that root and id; the read of the installed unit files and of the next hourly and J4 runs on h053 waits for the reinstall.'
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_secret_reading_effect/test_secret_reading_schedule.py -k "schedule_install_verb_pins" -q --no-cov -p no:randomly
    cwd: .
- id: dod-omn23716-integration-proof
  description: The pushed head ran the focused schedule tests of the node on a lab host through the lab work runner and exited 0. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check. The runtime half (the installed unit files on h053 pin the overlays clone and the document ids, and the next hourly and J4 runs read outcome resolved) is read after the declared reinstall.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23716 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_secret_reading_effect/test_secret_reading_schedule.py -q --no-cov -n 0 -p no:randomly
    cwd: .
