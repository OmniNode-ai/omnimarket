---
schema_version: "1.0.0"
ticket_id: OMN-22903
title: "Piece 1 corrects the graph's resolution and counting, then maps each relation of the five-relation cycle cut to the joins of the pieces that own its endpoints"
summary: 'node_network_graph_compute gains an import_relation_compute operation that keeps every direction of each repository pair, reports cycles, and maps the five tracked relations to the join ids of the pieces owning their endpoints; node_reading_writer_effect writes the map progress as a relation_map reading row'
is_seam_ticket: false
interface_change: true
interfaces_touched:
  - public_api
requirements:
  - id: req-omn22903-ac1
    statement: 'the graph reports the directed import relations without collapsing a repository pair, and a pair importing each other reads one cycle'
    acceptance:
      - id: AC1
        statement: 'AC1: the graph reports the directed import relations without collapsing a repository pair, shown by a fixture of two repositories importing each other that reads one cycle -- falsifier: uv run pytest tests/unit/nodes/node_network_graph_compute/test_cycle_report.py -q'
  - id: req-omn22903-ac2
    statement: 'each of the five relations of the cut table carries the join id of the piece owning each endpoint, and an unmapped relation reads as a finding'
    acceptance:
      - id: AC2
        statement: 'AC2: each of the five relations of the plan''s cut table carries the join id of the piece owning each endpoint, and an unmapped relation reads as a finding -- falsifier: uv run pytest tests/unit/nodes/node_network_graph_compute/test_relation_join_map.py -q'
  - id: req-omn22903-ac3
    statement: 'the map progress is written as a reading row the floor can show'
    acceptance:
      - id: AC3
        statement: 'AC3: the map''s progress is written as a reading row the floor can show -- falsifier: uv run pytest tests/unit/nodes/node_reading_writer_effect -q -k relation_map'
evidence_requirements:
  - kind: "tests"
    description: "Cycle report, relation join map and relation map reading tests"
    command: "uv run pytest tests/unit/nodes/node_network_graph_compute tests/unit/nodes/node_reading_writer_effect -q"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-001"
    description: 'AC1: two repositories importing each other read one cycle; the one-direction-per-pair control reads none'
    source: "manual"
    binds_ac: [AC1]
    checks:
      - check_type: "test_passes"
        check_value: 'uv run pytest tests/unit/nodes/node_network_graph_compute/test_cycle_report.py -q --no-cov --tb=line'
        cwd: "."
  - id: "dod-002"
    description: 'AC2: the five relations carry the join ids of both endpoint pieces; an unowned endpoint is a finding'
    source: "manual"
    binds_ac: [AC2]
    checks:
      - check_type: "test_passes"
        check_value: 'uv run pytest tests/unit/nodes/node_network_graph_compute/test_relation_join_map.py -q --no-cov --tb=line'
        cwd: "."
  - id: "dod-003"
    description: 'AC3: the relation map reading row is read by the floor reader as piece 1 WORKING; an unread graph is UNKNOWN and a refused append is a typed failed event'
    source: "manual"
    binds_ac: [AC3]
    checks:
      - check_type: "test_passes"
        check_value: 'uv run pytest tests/unit/nodes/node_reading_writer_effect -q --no-cov -k relation_map --tb=line'
        cwd: "."
  - id: "dod-omn22903-deploy-source-readback"
    description: "Hosted-runner readback of the published relation handler and node contract at the evaluated commit against this checkout, then the existing registration test. This checks published source, not a runtime rollout."
    source: "manual"
    execution_scope: "hosted_and_local"
    checks:
      - check_type: "command"
        check_value: |
          set -eu;
          readback_dir="$(mktemp -d)";
          trap 'rm -rf "$readback_dir"' EXIT;
          revision="$(git rev-parse HEAD)";
          node_path=src/omnimarket/nodes/node_network_graph_compute;
          for relative_path in handlers/handler_import_relation_compute.py contract.yaml; do
            target="$readback_dir/$(basename "$relative_path")";
            curl --fail --silent --show-error --location --max-time 30 \
              "https://raw.githubusercontent.com/OmniNode-ai/omnimarket/$revision/$node_path/$relative_path" \
              --output "$target";
            cmp "$node_path/$relative_path" "$target";
          done;
          grep -F 'class HandlerImportRelationCompute:' "$readback_dir/handler_import_relation_compute.py";
          grep -F 'operation: import_relation_compute' "$readback_dir/contract.yaml";
          printf 'import relation compute source readback matched %s\n' "$revision"
        cwd: "."
      - check_type: "test_passes"
        check_value: 'env PYTHONDONTWRITEBYTECODE=1 uv run pytest tests/nodes/node_network_graph_compute/test_registration.py -q --no-cov --tb=line'
        cwd: "."
  - id: "dod-omn22903-integration-proof"
    description: "The pushed head ran the relation cycle, join map and relation map reading tests, and the existing tests of both nodes, on a lab host and exited 0. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check."
    source: "manual"
    execution_scope: "local_done_gate"
    checks:
      - check_type: "command"
        check_value: uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-22903 -- uv run --frozen pytest tests/unit/nodes/node_network_graph_compute tests/unit/nodes/node_reading_writer_effect tests/nodes/node_network_graph_compute tests/nodes/node_reading_writer_effect -q --no-cov
        cwd: "."
