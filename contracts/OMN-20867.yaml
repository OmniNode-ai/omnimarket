---
schema_version: "1.0.0"
ticket_id: "OMN-20867"
title: "Lab-fill headroom plan and lab-fill, hourly and throughput decision nodes running from the runtime tick"
summary: "A host probe with idle slots but no fresh headroom reading gives a typed HEADROOM_UNKNOWN failure for that host; a fresh reading with free slots gives a placement plan; a fan-out claim is derived only from dispatch records read back in the same tick. Lab-fill, hourly and throughput decision nodes run from the runtime tick."
is_seam_ticket: false
interface_change: true
interfaces_touched:
  - "topics"
  - "public_api"
requirements:
  - id: "req-headroom-unknown-failure"
    statement: |-
      The lab-fill plan fails loudly for an idle host it cannot read headroom for.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1 (AC-M2): plan_lab_fill_headroom gives HEADROOM_UNKNOWN (terminal_failure_cause, routed to the declared failure terminal topic) for a host with idle slots and a missing, stale or future headroom reading, and a placement plan for a host with a fresh reading; verify_lab_fill_fanout counts only dispatch records of the request's tick and gives FANOUT_UNPROVEN for a claimed lane with no matching record.
  - id: "req-runtime-tick-schedule"
    statement: "Lab-fill hourly and throughput decision nodes running from the runtime tick"
    acceptance:
      - id: "AC2"
        statement: 'AC2: contracts route platform.runtime-tick with interval/offset lab-fill 1200/600 seconds, hourly 3600/900, throughput 600/0 -- falsifier: uv run pytest tests/unit/nodes/test_runtime_tick_schedule_fires.py -q -p no:randomly'
      - id: "AC3"
        statement: 'AC3: one scheduled fire per interval and none on ticks inside interval -- falsifier: uv run pytest tests/unit/nodes/test_runtime_tick_schedule_fires.py -q -p no:randomly'
      - id: "AC4"
        statement: 'AC4: real contract discovery and wire_from_manifest on MessageDispatchEngine and EventBusInmemory publish scheduled fires on terminal topics, no host env or process in routes -- falsifier: uv run pytest tests/unit/nodes/test_runtime_tick_schedule_fires.py -q -p no:randomly'
  - id: "req-merge-sweep-runtime-tick"
    statement: "The merge-sweep plan compute running from the runtime tick"
    acceptance:
      - id: "AC5"
        statement: 'AC5: node_merge_sweep_plan_compute routes platform.runtime-tick with interval/offset merge-sweep 300/0 seconds, one scheduled fire per interval and none on ticks inside it -- falsifier: uv run pytest tests/unit/nodes/test_merge_sweep_plan_runtime_tick.py -q -p no:randomly'
      - id: "AC6"
        statement: 'AC6: real contract discovery and wire_from_manifest on MessageDispatchEngine and EventBusInmemory publish the merge-sweep scheduled fire on the terminal topic, no host env or process in the route -- falsifier: uv run pytest tests/unit/nodes/test_merge_sweep_plan_runtime_tick.py -q -p no:randomly'
  - id: "req-lane-act-overlay"
    statement: "A lane's private overlay sets whether that lane acts on pull requests and CI reds, and a malformed overlay value is refused at contract load"
    acceptance:
      - id: "AC7"
        statement: 'AC7: the omnimarket landing mode, the arm gate action_mode and the four ci_red_triage.act flags are overlay references whose unset default is the shipped value; a lane bound to dry_run and report_only sends reads only, arms nothing and reruns nothing, and a set-but-empty or malformed value fails at contract load instead of falling back -- falsifier: uv run pytest tests/unit/nodes/node_pr_landing_orchestrator/test_pr_landing_leaves_shadow_omn_20866.py tests/unit/nodes/node_pr_lifecycle_orchestrator/test_ci_red_runner_act.py -q -p no:randomly -k overlay'
evidence_requirements:
  - kind: "tests"
    description: "Lane act overlay: landing mode and arm gate action_mode, and the four ci_red_triage.act flags, unset, bound acting, bound non-acting, set-but-empty and malformed."
    command: "uv run pytest tests/unit/nodes/node_pr_landing_orchestrator/test_pr_landing_leaves_shadow_omn_20866.py tests/unit/nodes/node_pr_lifecycle_orchestrator/test_ci_red_runner_act.py tests/unit/nodes/node_pr_lifecycle_orchestrator/test_ci_red_triage.py -q -p no:randomly"
  - kind: "tests"
    description: "Headroom plan, fan-out readback, golden-chain and contract publish parity gate tests."
    command: "uv run pytest tests/nodes/node_lab_fill_plan_compute/test_lab_fill_headroom_plan.py tests/nodes/node_lab_fill_plan_compute/test_golden_chain_lab_fill_plan_compute.py tests/gates/test_contract_publish_parity.py -q"
  - kind: "tests"
    description: "Runtime tick contract routing, interval decisions and terminal-topic readback tests."
    command: "uv run pytest tests/unit/nodes/test_runtime_tick_schedule_fires.py -q -p no:randomly"
  - kind: "tests"
    description: "Merge-sweep plan runtime tick routing, interval decisions and terminal-topic readback tests."
    command: "uv run pytest tests/unit/nodes/test_merge_sweep_plan_runtime_tick.py -q -p no:randomly"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn20867-headroom-unknown"
    description: "The headroom plan and fan-out readback tests and the publish parity gate tests pass at the PR head."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_lab_fill_plan_compute/test_lab_fill_headroom_plan.py -q -p no:randomly"
        cwd: "${OMNI_HOME}/omnimarket"
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_lab_fill_plan_compute/test_golden_chain_lab_fill_plan_compute.py -q -p no:randomly"
        cwd: "${OMNI_HOME}/omnimarket"
      - check_type: "test_passes"
        check_value: 'uv run pytest tests/gates/test_contract_publish_parity.py -q -p no:randomly -k "failure_terminal"'
        cwd: "${OMNI_HOME}/omnimarket"
      - check_type: "test_passes"
        check_value: 'uv run pytest tests/gates/test_contract_publish_parity.py -q -p no:randomly -k "repaired_nodes"'
        cwd: "${OMNI_HOME}/omnimarket"
      - check_type: "test_passes"
        check_value: 'uv run pytest tests/gates/test_contract_publish_parity.py -q -p no:randomly -k "not failure_terminal and not repaired_nodes"'
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC1"]
  - id: "dod-omn20867-headroom-unknown-cause"
    description: "The headroom plan handler emits the HEADROOM_UNKNOWN failure cause."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: "grep -q 'HEADROOM_UNKNOWN' src/omnimarket/nodes/node_lab_fill_plan_compute/handlers/handler_lab_fill_headroom_plan.py"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn20867-fire-fresh-readings-one-plan"
    description: "A lab-fill fire with fresh readings publishes one headroom plan naming the idle hosts. The test file is added by this pull request; it fails on the merge base."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_lab_fill_orchestrator/test_golden_chain_lab_fill_orchestrator.py -q -p no:randomly -k test_fire_with_fresh_readings_publishes_one_plan_naming_the_idle_hosts"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC1"]
  - id: "dod-omn20867-fire-stale-reading-headroom-unknown"
    description: "A lab-fill fire with a stale reading for a host with an idle slot fails HEADROOM_UNKNOWN on the failure topic. The test file is added by this pull request; it fails on the merge base."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_lab_fill_orchestrator/test_golden_chain_lab_fill_orchestrator.py -q -p no:randomly -k test_fire_with_a_stale_reading_fails_headroom_unknown_on_the_failure_topic"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC1"]
  - id: "dod-omn20867-fire-no-reading-headroom-unknown"
    description: "A lab-fill fire with no reading at all fails HEADROOM_UNKNOWN. The test file is added by this pull request; it fails on the merge base."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_lab_fill_orchestrator/test_golden_chain_lab_fill_orchestrator.py -q -p no:randomly -k test_fire_with_no_reading_at_all_fails_headroom_unknown"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC1"]
  - id: "dod-omn20867-fire-replay-publishes-nothing-new"
    description: "A replayed fire with the same fire_id publishes nothing new, so a fire has one plan request. The test file is added by this pull request; it fails on the merge base."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_lab_fill_orchestrator/test_golden_chain_lab_fill_orchestrator.py -q -p no:randomly -k test_replayed_fire_with_the_same_fire_id_publishes_nothing_new"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn20867-deploy-one-fire-plan-per-fire-id"
    description: "Deploy probe on the lab dev lane once the deploy agent rolls this change: the dev lane runtime has published at least one onex.cmd.omnimarket.lab-fill-fire-plan-requested.v1 and no fire_id appears on it twice. Run with KAFKA_BOOTSTRAP_SERVERS set to the dev lane broker (bus-local); it exits nonzero on a runtime that predates this change, which publishes none to that topic. Hosted CI has no dev broker, so only the local Done gate runs it."
    source: "manual"
    execution_scope: "local_done_gate"
    checks:
      - check_type: "command"
        check_value: "kcat -C -b \"${KAFKA_BOOTSTRAP_SERVERS:?set KAFKA_BOOTSTRAP_SERVERS to the dev lane broker}\" -t onex.cmd.omnimarket.lab-fill-fire-plan-requested.v1 -o -200 -e -q | grep -Eo '\"fire_id\": ?\"[^\"]+\"' | sort | uniq -c | awk '$1 > 1 {dup = 1} END {exit !(NR > 0 && !dup)}'"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn20867-runtime-tick-schedule"
    description: "Runtime tick schedule tests pass at the PR head, including real contract wiring and terminal-topic readback."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/nodes/test_runtime_tick_schedule_fires.py -q -p no:randomly"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC2", "AC3", "AC4"]
  - id: "dod-omn20867-merge-sweep-runtime-tick"
    description: "Merge-sweep plan runtime tick tests pass at the PR head, including real contract wiring and terminal-topic readback."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/nodes/test_merge_sweep_plan_runtime_tick.py -q -p no:randomly"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC5", "AC6"]
  - id: "dod-omn20867-merge-sweep-deploy-probe"
    description: "Deploy probe. The merge-sweep plan compute at the checked-out commit carries HandlerMergeSweepScheduledFire, the runtime-tick handler this change adds; the probe reads it from GitHub at that commit and exits nonzero on a tree without it, so it fails at the merge base. The dev-lane readout after the deploy agent rolls it is a record with a fire_id beginning merge-sweep- on onex.evt.omnimarket.merge-sweep-planned.v1 within one 300 s interval of the runtime tick."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: "gh api \"repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_merge_sweep_plan_compute/handlers/handler_merge_sweep_scheduled_fire.py?ref=$(git rev-parse HEAD)\" --jq .content | base64 -d | grep -c '^class HandlerMergeSweepScheduledFire'"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn20867-lane-act-overlay-landing"
    description: "AC7, landing slice: the omnimarket landing mode and the arm gate action_mode come from overlay references. Unset or bound acting, a ready canary PR is armed with an enforce arm; bound dry_run and report_only, only reads are sent; a set-but-empty or malformed value fails at contract load. The overlay tests are added by this pull request and fail on the merge base, where the contract carries literal values."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/nodes/node_pr_landing_orchestrator/test_pr_landing_leaves_shadow_omn_20866.py -q -p no:randomly -k overlay"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC7"]
  - id: "dod-omn20867-lane-act-overlay-triage"
    description: "AC7, red-triage slice: each of the four ci_red_triage.act flags comes from its own overlay reference. Unset, only the runner class acts; bound false, a runner red is recorded and nothing is rerun; each env name flips only its own class; a set-but-empty or malformed value, and a flag that is neither a bool nor a reference, fail at contract load. The overlay tests are added by this pull request and fail on the merge base."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/nodes/node_pr_lifecycle_orchestrator/test_ci_red_runner_act.py -q -p no:randomly -k overlay"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC7"]
  - id: "dod-omn20867-lane-act-overlay-landing-deploy-probe"
    description: "Deploy probe. The landing orchestrator contract at the checked-out commit carries the overlay reference for the arm gate action_mode that this change adds; the probe reads it from GitHub at that commit and exits nonzero on a tree without it, so it fails at the merge base. The dev-lane readout after the deploy agent rolls it, with the lane's env names unbound, is the same enforce arm as before: a ready omnimarket PR is armed by the landing orchestrator."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: "gh api \"repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_pr_landing_orchestrator/contract.yaml?ref=$(git rev-parse HEAD)\" --jq .content | base64 -d | grep -cF 'env.ONEX_PR_LANDING_ARM_ACTION_MODE:enforce'"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn20867-lane-act-overlay-triage-deploy-probe"
    description: "Deploy probe. The lifecycle orchestrator contract at the checked-out commit carries the overlay reference for the runner act flag that this change adds; the probe reads it from GitHub at that commit and exits nonzero on a tree without it, so it fails at the merge base. The dev-lane readout after the deploy agent rolls it, with the lane's env names unbound, is the action_applied field of onex.evt.omnimarket.ci-red-triage-decided.v1 records for class runner, true as before."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: "gh api \"repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_pr_lifecycle_orchestrator/contract.yaml?ref=$(git rev-parse HEAD)\" --jq .content | base64 -d | grep -cF 'env.ONEX_CI_RED_TRIAGE_ACT_RUNNER:true'"
        cwd: "${OMNI_HOME}/omnimarket"
