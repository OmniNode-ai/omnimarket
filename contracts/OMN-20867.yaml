---
schema_version: "1.0.0"
ticket_id: "OMN-20867"
title: "Lab-fill plan fails HEADROOM_UNKNOWN for idle hosts with no fresh bus reading"
summary: "A host probe with idle slots but no fresh headroom reading gives a typed HEADROOM_UNKNOWN failure for that host; a fresh reading with free slots gives a placement plan; a fan-out claim is derived only from dispatch records read back in the same tick."
is_seam_ticket: false
interface_change: true
interfaces_touched:
  - "topics"
  - "public_api"
requirements:
  - id: "req-headroom-unknown-failure"
    statement: |-
      The lab-fill plan fails loudly for an idle host it cannot read headroom for.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1 (AC-M2): plan_lab_fill_headroom gives HEADROOM_UNKNOWN (terminal_failure_cause, routed to the declared failure terminal topic) for a host with idle slots and a missing, stale or future headroom reading, and a placement plan for a host with a fresh reading; verify_lab_fill_fanout counts only dispatch records of the request's tick and gives FANOUT_UNPROVEN for a claimed lane with no matching record.
evidence_requirements:
  - kind: "tests"
    description: "Headroom plan, fan-out readback, golden-chain and contract publish parity gate tests."
    command: "uv run pytest tests/nodes/node_lab_fill_plan_compute tests/gates/test_contract_publish_parity.py -q"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn20867-headroom-unknown"
    description: "The headroom plan and fan-out readback tests and the publish parity gate tests pass at the PR head."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_lab_fill_plan_compute tests/gates/test_contract_publish_parity.py -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC1"]
  - id: "dod-omn20867-headroom-unknown-cause"
    description: "The headroom plan handler emits the HEADROOM_UNKNOWN failure cause."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: "grep -q 'HEADROOM_UNKNOWN' src/omnimarket/nodes/node_lab_fill_plan_compute/handlers/handler_lab_fill_headroom_plan.py"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC1"]
