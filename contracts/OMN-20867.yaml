---
schema_version: "1.0.0"
ticket_id: "OMN-20867"
title: "Lab-fill headroom plan and lab-fill, hourly and throughput decision nodes running from the runtime tick"
summary: "A host probe with idle slots but no fresh headroom reading gives a typed HEADROOM_UNKNOWN failure for that host; a fresh reading with free slots gives a placement plan; a fan-out claim is derived only from dispatch records read back in the same tick. Lab-fill, hourly and throughput decision nodes run from the runtime tick."
is_seam_ticket: false
interface_change: true
interfaces_touched:
  - "topics"
  - "public_api"
requirements:
  - id: "req-headroom-unknown-failure"
    statement: |-
      The lab-fill plan fails loudly for an idle host it cannot read headroom for.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1 (AC-M2): plan_lab_fill_headroom gives HEADROOM_UNKNOWN (terminal_failure_cause, routed to the declared failure terminal topic) for a host with idle slots and a missing, stale or future headroom reading, and a placement plan for a host with a fresh reading; verify_lab_fill_fanout counts only dispatch records of the request's tick and gives FANOUT_UNPROVEN for a claimed lane with no matching record.
  - id: "req-runtime-tick-schedule"
    statement: "Lab-fill hourly and throughput decision nodes running from the runtime tick"
    acceptance:
      - id: "AC2"
        statement: 'AC2: contracts route platform.runtime-tick with interval/offset lab-fill 1200/600 seconds, hourly 3600/900, throughput 600/0 -- falsifier: uv run pytest tests/unit/nodes/test_runtime_tick_schedule_fires.py -q -p no:randomly'
      - id: "AC3"
        statement: 'AC3: one scheduled fire per interval and none on ticks inside interval -- falsifier: uv run pytest tests/unit/nodes/test_runtime_tick_schedule_fires.py -q -p no:randomly'
      - id: "AC4"
        statement: 'AC4: real contract discovery and wire_from_manifest on MessageDispatchEngine and EventBusInmemory publish scheduled fires on terminal topics, no host env or process in routes -- falsifier: uv run pytest tests/unit/nodes/test_runtime_tick_schedule_fires.py -q -p no:randomly'
  - id: "req-tick-window-exactly-once"
    statement: "No tick-schedule window is lost to tick jitter, and a runtime tick dead-letters nothing"
    acceptance:
      - id: "AC5"
        statement: 'AC5: under jittered tick periods each lab-fill, hourly, throughput and audit-trail daily window fires on exactly one tick, and one runtime tick writes no dead letter and one record per prune completed topic -- falsifier: uv run pytest tests/unit/nodes/test_runtime_tick_schedule_fires.py -q -p no:randomly -k "jittered or one_tick_is_one_record"'
evidence_requirements:
  - kind: "tests"
    description: "Headroom plan, fan-out readback, golden-chain and contract publish parity gate tests."
    command: "uv run pytest tests/nodes/node_lab_fill_plan_compute/test_lab_fill_headroom_plan.py tests/nodes/node_lab_fill_plan_compute/test_golden_chain_lab_fill_plan_compute.py tests/gates/test_contract_publish_parity.py -q"
  - kind: "tests"
    description: "Runtime tick contract routing, interval decisions and terminal-topic readback tests."
    command: "uv run pytest tests/unit/nodes/test_runtime_tick_schedule_fires.py -q -p no:randomly"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn20867-headroom-unknown"
    description: "The headroom plan and fan-out readback tests and the publish parity gate tests pass at the PR head."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_lab_fill_plan_compute/test_lab_fill_headroom_plan.py -q -p no:randomly"
        cwd: "${OMNI_HOME}/omnimarket"
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_lab_fill_plan_compute/test_golden_chain_lab_fill_plan_compute.py -q -p no:randomly"
        cwd: "${OMNI_HOME}/omnimarket"
      - check_type: "test_passes"
        check_value: 'uv run pytest tests/gates/test_contract_publish_parity.py -q -p no:randomly -k "failure_terminal"'
        cwd: "${OMNI_HOME}/omnimarket"
      - check_type: "test_passes"
        check_value: 'uv run pytest tests/gates/test_contract_publish_parity.py -q -p no:randomly -k "repaired_nodes"'
        cwd: "${OMNI_HOME}/omnimarket"
      - check_type: "test_passes"
        check_value: 'uv run pytest tests/gates/test_contract_publish_parity.py -q -p no:randomly -k "not failure_terminal and not repaired_nodes"'
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC1"]
  - id: "dod-omn20867-headroom-unknown-cause"
    description: "The headroom plan handler emits the HEADROOM_UNKNOWN failure cause."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: "grep -q 'HEADROOM_UNKNOWN' src/omnimarket/nodes/node_lab_fill_plan_compute/handlers/handler_lab_fill_headroom_plan.py"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn20867-runtime-tick-schedule"
    description: "Runtime tick schedule tests pass at the PR head, including real contract wiring and terminal-topic readback."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/nodes/test_runtime_tick_schedule_fires.py -q -p no:randomly"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC2", "AC3", "AC4"]
  - id: "dod-omn20867-tick-window-exactly-once"
    description: "Jittered ticks fire every window exactly once, one tick dead-letters nothing, and the prune scheduled run has a declared destination, at the PR head."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: 'uv run pytest tests/unit/nodes/test_runtime_tick_schedule_fires.py -q -p no:randomly -k "jittered or one_tick_is_one_record"'
        cwd: "${OMNI_HOME}/omnimarket"
      - check_type: "test_passes"
        check_value: 'uv run pytest tests/test_golden_chain_dead_letter_prune_effect.py tests/test_golden_chain_consumer_flow_prune_effect.py -q -p no:randomly -k "declared_destination"'
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC5"]
  - id: "dod-omn20867-tick-window-fires-once"
    description: "Jittered runtime ticks (the dev lane's 1.12 s base period with 1.559 s and 3.3 s slow ticks) open every lab-fill, hourly and throughput window on exactly one tick, and the audit trail daily slot on exactly one tick. These tests are new in this pull request and fail against the merge base's source."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/nodes/test_runtime_tick_schedule_fires.py::test_jittered_ticks_fire_every_window_exactly_once -q -p no:randomly"
        cwd: "${OMNI_HOME}/omnimarket"
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/nodes/test_runtime_tick_schedule_fires.py::test_jittered_ticks_open_the_audit_trail_daily_slot_exactly_once -q -p no:randomly"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC3"]
  - id: "dod-omn20867-tick-window-prune-in-interval"
    description: "The dead-letter prune and consumer-flow prune tick routes return no output for a tick inside their interval and skip sink resolution, so a tick inside the interval produces no result to dead-letter. These tests change in this pull request and fail against the merge base's source."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/test_golden_chain_dead_letter_prune_effect.py::test_the_first_tick_runs_and_an_immediate_second_tick_is_skipped -q -p no:randomly"
        cwd: "${OMNI_HOME}/omnimarket"
      - check_type: "test_passes"
        check_value: "uv run pytest tests/test_golden_chain_dead_letter_prune_effect.py::test_skipped_tick_never_resolves_sink -q -p no:randomly"
        cwd: "${OMNI_HOME}/omnimarket"
      - check_type: "test_passes"
        check_value: "uv run pytest tests/test_golden_chain_consumer_flow_prune_effect.py::test_a_scheduled_tick_runs_once_per_interval_and_skips_in_between -q -p no:randomly"
        cwd: "${OMNI_HOME}/omnimarket"
      - check_type: "test_passes"
        check_value: "uv run pytest tests/test_golden_chain_consumer_flow_prune_effect.py::test_skipped_tick_never_resolves_sink -q -p no:randomly"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC3"]
  - id: "dod-omn20867-tick-window-boot-one-record"
    description: "With the three tick-fire contracts and both prune contracts wired by wire_from_manifest on the in-memory bus, one tick is one tick record plus its one throughput fire and one record per prune completed topic with nothing dead-lettered, and a second tick inside every interval publishes only the tick. The test is new in this pull request and fails against the merge base's source."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/nodes/test_runtime_tick_schedule_fires.py::test_runtime_tick_boot_one_tick_is_one_record_and_dead_letters_nothing -q -p no:randomly"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC4"]
  - id: "dod-omn20867-tick-window-prune-destination"
    description: "Each prune effect contract declares its completed topic as terminal_event, publish topic and published_events entry, so the scheduled run's result has a destination. These tests are new in this pull request and fail against the merge base's source."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/test_golden_chain_dead_letter_prune_effect.py::test_the_scheduled_run_result_has_a_declared_destination -q -p no:randomly"
        cwd: "${OMNI_HOME}/omnimarket"
      - check_type: "test_passes"
        check_value: "uv run pytest tests/test_golden_chain_consumer_flow_prune_effect.py::test_the_scheduled_run_result_has_a_declared_destination -q -p no:randomly"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC4"]
  - id: "dod-omn20867-tick-window-dev-lane-per-fire"
    description: "On the dev lane, once the deploy agent rolls this change, onex.evt.omnimarket.throughput-tick-decision-completed.v1 and onex.evt.omnimarket.lab-fill-plan-decided.v1 each carry exactly one record per fire_id for every scheduler window since TICK_WINDOW_SINCE (default: the last three hours), and at least one fire. Before the roll the 18:30Z fire is on the lane two and three times and the 18:40Z fire is missing, so the check is red; it reads the dev lane broker named by KAFKA_BOOTSTRAP_SERVERS (bus-local), which hosted CI does not have, so only the local Done gate runs it."
    source: "manual"
    execution_scope: "local_done_gate"
    checks:
      - check_type: "command"
        check_value: |-
          S="${TICK_WINDOW_SINCE:-$(jq -n 'now-10800|todate')}"
          for T in onex.evt.omnimarket.throughput-tick-decision-completed.v1 onex.evt.omnimarket.lab-fill-plan-decided.v1; do
            R="$(kcat -C -b "${KAFKA_BOOTSTRAP_SERVERS:?set KAFKA_BOOTSTRAP_SERVERS to the dev lane broker}" -t "$T" -o beginning -e -q)" && printf '%s\n' "$R" | jq -rs --arg s "$S" --arg t "$T" '[.[] | first(.. | objects | select(.fire_id != null)) | select(.window_start >= $s)] | group_by(.fire_id) | map({fire_id: .[0].fire_id, records: length}) | (map(select(.records != 1))) as $bad | if length == 0 then "\($t): no fire since \($s)" | halt_error(1) elif ($bad | length) > 0 then "\($t): more than one record per fire_id: \($bad | tostring)" | halt_error(1) else "\($t): \(length) fires, one record each" end' || exit 1
          done
        cwd: "${OMNI_HOME}/omnimarket"
