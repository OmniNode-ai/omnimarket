schema_version: 1.0.0
ticket_id: OMN-23388
title: The floor reads owner unknown with the read's age when its owner map or lane list is stale or unreadable, never nobody on it
summary: node_floor_simple_compute judges the owner map (by the overlay store source reading) and the lane list (by the record's read time) against declared bounds and marks a row with no lane on it owner unknown, with the age, when either is stale or unread; the floor cycle refuses a floor overlay whose owner entries differ from overlays main, naming the source. This contract binds the evidence so dod-verify can judge the pull request.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23388-owner-unknown
  statement: A row with no lane on it reads owner unknown with the read's age, not unowned, whenever the owner map or the lane list is older than its declared bound or was not read; with fresh, read inputs it still reads unowned.
  acceptance:
  - id: AC1
    statement: 'AC1: when the owner map or lane list is older than its declared max age or unreadable, a red row reads owner unknown with the age, not unowned -- falsifier: a floor compute test with a stale owner map that renders work_under_way false and no unknown marker'
  - id: AC3
    statement: 'AC3: with the overlay store stopped (drill), no red row reads unowned -- falsifier: the served floor during the drill'
- id: req-omn23388-owner-source
  statement: The floor cycle refuses a floor overlay whose owner entries are not those of overlays main, and the refusal names the source.
  acceptance:
  - id: AC2
    statement: "AC2: the publisher's loader refuses owner entries from any source other than overlays main, naming the source -- falsifier: a test loading a side-branch owner map that is accepted"
evidence_requirements:
- kind: tests
  description: The owner unknown compute tests, the owner source tests and the overlay store drill test
  command: uv run --frozen pytest tests/nodes/node_floor_simple_compute/test_owner_unknown_omn23388.py tests/nodes/node_floor_simple_effect/test_owner_source_omn23388.py tests/nodes/node_floor_simple_effect/test_owner_unknown_drill_omn23388.py -q --no-cov -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23388-owner-unknown
  description: Runs the compute tests. A stale or unread owner map or lane list turns every row with no lane to owner unknown with the age (golden and error cases); fresh inputs still read unowned; an overlay that declares no judgment judges none. At the merge base the overlay field is absent, so the command fails there.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_floor_simple_compute/test_owner_unknown_omn23388.py -q --no-cov -p no:randomly
    cwd: .
- id: dod-omn23388-owner-source
  description: Runs the owner source tests over real git checkouts. A checkout equal to origin/main runs; a side-branch owner map, an uncommitted edit, a file outside any checkout and a missing ref are each refused with the source named, and the cycle closes its start with overlay_refused. At the merge base the module is absent, so the command fails there.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_floor_simple_effect/test_owner_source_omn23388.py -q --no-cov -p no:randomly
    cwd: .
- id: dod-omn23388-drill
  description: Runs the cycle over a registry home with the overlay store fleet record fresh, stopped for 319 minutes and missing; reads the served floor-simple.json. Fresh leaves rows unowned; stopped or missing leaves none unowned and names them owner unknown.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_floor_simple_effect/test_owner_unknown_drill_omn23388.py -q --no-cov -p no:randomly
    cwd: .
- id: dod-omn23388-integration-proof
  description: The new tests run on a lab host at the pushed head through the lab work runner. Hosted CI cannot reach the lab runner, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: 'env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23388 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_floor_simple_compute/test_owner_unknown_omn23388.py tests/nodes/node_floor_simple_effect/test_owner_source_omn23388.py tests/nodes/node_floor_simple_effect/test_owner_unknown_drill_omn23388.py -q --no-cov -p no:randomly'
    cwd: .
