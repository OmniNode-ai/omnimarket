schema_version: "1.0.0"
ticket_id: "OMN-23066"
title: "T13 context audit projection node on dev with its handover from the retired consumer group"
summary: >
  One-runtime plan T13. node_projection_context_audit replaces the omnibase_infra
  context-audit consumer module: it reads the same five audit topics and writes
  the same twelve context_audit_events columns, plus a deterministic event_key
  with an UPSERT on it, so a second replay leaves one row per key. This change
  puts the node on current dev (it was only on stale draft branches) and declares
  its handover from the retired context-audit-postgres group through
  consumer_group_handover from_group_id, which omnibase_infra added in OMN-21932.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-omn23066-node-and-handover"
    statement: "The node is on dev and names the retired group through the key the runtime preflight reads."
    acceptance:
      - id: "AC1"
        statement: "AC1: node_projection_context_audit is on omnimarket dev with the handover consumer_group_handover from_group_id context-audit-postgres and from_auto_offset_reset earliest -- falsifier: uv run pytest tests/test_golden_chain_projection_context_audit.py -q -k handover, red on dev where the node is absent"
  - id: "req-omn23066-replay"
    statement: "The node writes one row per event key on replayed events."
    acceptance:
      - id: "AC2"
        statement: "AC2: replayed events write one row per event_key and a second replay adds none -- falsifier: uv run pytest tests/test_golden_chain_projection_context_audit.py -q -k replay with a planted key-less write failing it"
evidence_requirements:
  - kind: "tests"
    description: "The context audit node replays to one row per key and its contract names the retired group."
    command: "uv run pytest tests/test_golden_chain_projection_context_audit.py -q --no-cov"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn23066-handover"
    description: "The contract declares the handover in the shape the preflight loader reads, naming the retired consumer's default group, and the loader returns it in local, dev and prod. Fails on dev, which has no such node."
    source: "manual"
    binds_ac: ["AC1"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/test_golden_chain_projection_context_audit.py -q --no-cov -k handover"
        cwd: "."
  - id: "dod-omn23066-replay"
    description: "The writer replays the five audit topics and a second replay leaves one row per event key. Fails on dev, which has no such node."
    source: "manual"
    binds_ac: ["AC2"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/test_golden_chain_projection_context_audit.py -q --no-cov -k replay"
        cwd: "."
  - id: "dod-omn23066-integration-proof"
    description: "The pushed head ran the context audit golden chain on a lab host through the lab work runner and exited 0. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check."
    source: "manual"
    execution_scope: "local_done_gate"
    checks:
      - check_type: "command"
        check_value: "uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha \"$(git rev-parse HEAD)\" --lane oneruntime-t14-0315 -- uv run --frozen pytest tests/test_golden_chain_projection_context_audit.py -q --no-cov -p no:randomly"
        cwd: "."
