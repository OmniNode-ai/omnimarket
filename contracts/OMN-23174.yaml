schema_version: 1.0.0
ticket_id: OMN-23174
title: Scenario R6 runs daily on the lab as an omnimarket node, a task longer than 240 seconds completes under a configured 600 second ceiling and the same run without the overlay is refused before dispatch
summary: The readiness plan put the R6 producer in a workflow of the cloud repository. It now lives in omnimarket as node_delegation_scenario_r6_effect, scheduled daily on the lab by its own timer. One run drives the delegation skill handler with a synthetic summarization request and a rungs-mode probe ladder whose one loopback stub rung answers after 300 s under its own 450 s deadline, asked for with a 500 s timeout. With a site overlay that sets the summarization ceiling to 600 s the run completes, lasts longer than 240 s, and its budget evidence names ceiling 600 from the overlay; the same request without the overlay is refused before dispatch because 500 s is above the contract's 240 s ceiling. It writes one ledger STATUS row (the row the green-days reading counts) and emits the result on the bus.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23174-r6-long-task-ceiling
  statement: A long task completes under a configured 600 second ceiling with the budget source the overlay, and the same request without the overlay is refused before dispatch for a timeout above the class ceiling.
  acceptance:
  - id: AC1
    statement: 'AC1: the committed R6 inputs pass their own schema test -- falsifier: `uv run pytest tests/nodes/node_delegation_scenario_r6_effect/test_r6_inputs.py -q`'
  - id: AC2
    statement: 'AC2: the run without the overlay is refused before dispatch (red for a named injected break) and the run with it completes with ceiling 600 from the overlay -- falsifier: `uv run pytest tests/nodes/node_delegation_scenario_r6_effect/test_golden_chain_scenario_r6_effect.py -q`'
