---
schema_version: "1.0.0"
ticket_id: "OMN-25552"
title: "Codex lanes take an explicit --codex-model from a declared list, and the account default stays the default"
summary: >
  node_codex_model_compute declares the accepted Codex model ids (gpt-6.2-sol,
  gpt-6.2-astra) in its config, replaceable by the node's overlay. A request that
  names no model gets no model (the account default runs), a declared id is
  returned, and any other id is refused with the declared ids named.
is_seam_ticket: false
interface_change: true
interfaces_touched:
  - "public_api"
requirements:
  - id: "req-omn25552-codex-model-node"
    statement: "A compute node answers which Codex model a lane runs from a declared list."
    acceptance:
      - id: "AC1"
        statement: "AC1: an omnimarket compute node declares an optional codex_model input and an overlay listing the accepted Codex model ids (gpt-6.2-sol, gpt-6.2-astra), and returns no model when none is asked, the declared id when one is, and a refusal for an undeclared id -- falsifier: uv run pytest on the node's test file in omnimarket, red on the base and green on the branch"
evidence_requirements:
  - kind: "tests"
    description: "The node's tests pass"
    command: "uv run pytest tests/nodes/node_codex_model_compute/test_golden_chain_codex_model_compute.py -q --no-cov -n 0"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn25552-codex-model-node"
    description: >
      Hermetic hosted-runner check: the node's handler and packaged contract are
      exercised with typed requests and a temporary overlay. No model asked
      returns no model, each declared id returns itself, an undeclared id is
      refused naming the declared ids, and an overlay replaces the declared ids.
      The test file fails on the base, where the node does not exist, and passes
      on the branch. The Mac install and the two proof placements are the open
      follow-up of AC4.
    source: "manual"
    binds_ac: ["AC1"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_codex_model_compute/test_golden_chain_codex_model_compute.py -q --no-cov -n 0 --refuse-skips"
        cwd: "."
  - id: "dod-omn25552-integration-proof"
    description: "Run the node's tests on a lab host at the pushed head. Hosted CI cannot reach the lab hosts, so only the local Done gate runs this unbound check."
    source: "manual"
    execution_scope: "local_done_gate"
    checks:
      - check_type: "command"
        check_value: 'env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-25552 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_codex_model_compute/test_golden_chain_codex_model_compute.py -q --no-cov -n 0'
        cwd: "."
