schema_version: 1.0.0
ticket_id: OMN-24140
title: Remove old unused check environments from lab host disks
summary: The file retention pass of node_retention_cleanup removes regular files of an aged unit and never a symlink, so a Python environment left a hollow directory of symlinks that the dod-verify code would reuse as an environment; and nothing declared the dod-verify environment folder at all. On lab host h101 that folder held 92 environments (about 34 GB) because dod-verify prunes only when a check builds on its own host. This adds NodeCacheTreeRetention (a new handler and models beside the file pass, because the file shape ratchet baselines the file handler), a retention_policy.cache_tree_retention contract block with the dod-verify-venvs entry at seven days, and the cleanup node's file pass runs it.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24140-venv-cache-retention
  statement: The cleanup node's file pass removes aged rebuildable environment folders whole, from a declared cache entry, and never an entry that holds a protected name or a recent file.
  acceptance:
  - id: AC1
    statement: 'AC1: the file retention pass removes an aged dod-verify environment whole (symlinks inside it removed, never followed) and keeps a recent one, and its cleanup-node run reads the declared cache entry without the caller naming it -- falsifier: uv run pytest tests/nodes/test_omn19998_venv_cache_retention.py -q fails at the merge base'
  - id: AC2
    statement: 'AC2: an aged environment holding a protected name, or one with a recent file, is kept whole (error status for the first), and a window under seven days is refused -- falsifier: uv run pytest tests/nodes/test_omn19998_venv_cache_retention.py -q -k ''protected or recent or refused'' fails at the merge base'
  - id: AC3
    statement: 'AC3: the contract''s cache entry path equals the dod-verify hermetic environment root -- falsifier: uv run pytest tests/nodes/test_omn19998_venv_cache_retention.py -q -k seam fails at the merge base'
  - id: AC4
    statement: 'AC4: integrated: on lab host h101 the retention pass run from the branch frees the environment folder, and free disk on h101 reads at least 10G afterwards -- falsifier: ssh h101 df -h / reads under 10G free, or du of the dod-verify-venvs folder still above 5G'
