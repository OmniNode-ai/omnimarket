- id: dod-omn23836-integration-proof
  description: Run this pull request's node tests on a lab host at the pushed head. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check. The dev-lane readback of one day of real merges is AC5.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23836 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/nodes/node_merge_override_alarm_effect tests/unit/nodes/node_pr_landing_github_effect/test_pr_state_fact_merger.py tests/unit/nodes/node_pr_landing_github_effect/test_contract.py -q --no-cov
    cwd: .
