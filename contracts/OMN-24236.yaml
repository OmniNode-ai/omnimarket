schema_version: 1.0.0
ticket_id: OMN-24236
title: The goal checker's decisions go to their own channel and not to the closer's request channel
summary: 'node_goal_verification_orchestrator declared no terminal_event and one publish topic, so the runtime result applier published its returned ModelGoalVerificationOutcome (field decisions) on
  onex.cmd.omnimarket.dod-verify-start.v1. node_dod_verify rejected each as a start command without ticket_id and with an extra decisions field, the runtime then posted a failure notice on
  onex.evt.omnimarket.dod-verify-completed.v1, and both ended in the DLQ. The contract now declares onex.evt.omnimarket.goal-verification-decided.v1 as its terminal_event, first publish topic and
  published_events target for the outcome.'
is_seam_ticket: true
interface_change: true
interfaces_touched:
- public_api
requirements:
- id: req-omn24236-outcome-on-its-own-topic
  statement: The goal verification orchestrator's returned outcome is published on its own decided topic and never on the verifier's start topic.
  acceptance:
  - id: AC1
    statement: 'AC1: the goal verification orchestrator contract declares its own terminal_event and published_events topic for ModelGoalVerificationOutcome, apart from dod-verify-start -- falsifier:
      uv run pytest tests/test_goal_verification_outcome_topic.py -q fails at the merge base'
  - id: AC2
    statement: 'AC2: the runtime''s output topic selection for the orchestrator contract returns the new topic and never onex.cmd.omnimarket.dod-verify-start.v1 -- falsifier: the same file fails when
      terminal_event is removed from the contract'
  - id: AC3
    statement: 'AC3: integrated: in the running dev runtime, over ten minutes after the change runs, the log has no line ''ticket_id: Field required; decisions: Extra inputs are not permitted'' on
      dod-verify-start -- falsifier: such a line appears'
evidence_requirements:
- kind: tests
  description: The orchestrator tests pass at the pushed head.
  command: uv run pytest tests/test_goal_verification_outcome_topic.py tests/nodes/node_goal_verification_orchestrator -q -n 0 --no-cov -p no:cacheprovider
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24236-ac1
  description: 'AC1: the contract names the decided topic as terminal_event, first publish topic and published_events target; fails at the merge base (no terminal_event).'
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/test_goal_verification_outcome_topic.py -q -n 0 --no-cov -p no:cacheprovider
    cwd: .
- id: dod-omn24236-ac2
  description: 'AC2: the real result applier, wired as auto-wiring wires it, publishes the outcome on the decided topic; a copy of the contract without terminal_event publishes on the start topic (the failing control).'
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/test_goal_verification_outcome_topic.py -q -n 0 --no-cov -p no:cacheprovider -k "decided_topic or failing_control"
    cwd: .
- id: dod-omn24236-ac3
  description: 'hosted proxy for AC3: the orchestrator tests pass; the in-runtime reading of the dev runtime log is taken on a lab host after the deploy and named in the pull request.'
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/test_goal_verification_outcome_topic.py tests/nodes/node_goal_verification_orchestrator -q -n 0 --no-cov -p no:cacheprovider
    cwd: .
- id: dod-omn24236-integration-proof
  description: the orchestrator tests run on a lab host at the pushed head; hosted CI cannot reach the lab, so only the local Done gate runs this unbound check
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24236 --kind test -- env PYTHONDONTWRITEBYTECODE=1
      uv run --frozen pytest tests/test_goal_verification_outcome_topic.py tests/nodes/node_goal_verification_orchestrator -q --no-cov
