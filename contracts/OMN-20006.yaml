      - id: "AC1"
        statement: "AC1: a readiness probe issued on a reused connection rechecks the relation and reports ready, and the connection's tenant setting is restored when the probe transaction ends -- falsifier: uv run pytest tests/unit/projection/test_readiness_reused_tenant_context.py -q fails at the merge base with projection_database_unavailable"
evidence_requirements:
