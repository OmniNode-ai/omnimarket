- id: dod-omn24029-deploy-schedule-nodes
  description: 'Deploy probe the hosted runner can run: the verdict effect contract at the checked-out commit on GitHub names its handler class; the file does not exist at the merge base, so the probe fails there. AC4 is read on the dev runtime after the dev deploy through the deploy agent; the unbound lab run below is the local Done gate proof.'
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: command
    check_value: 'bash -o pipefail -c ''gh api "repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_schedule_verdict_effect/contract.yaml?ref=$(git rev-parse HEAD)" --jq .content | base64 -d | grep -F "HandlerScheduleVerdictScheduled" > /dev/null'''
    cwd: .
- id: dod-omn24029-integration-proof
  description: AC4 is read on the dev runtime after the dev deploy through the deploy agent; the pushed head is run on a lab host first and the deployed reading is named in the pull request.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane runtime-triggers-6650 -- uv run --frozen pytest tests/nodes/node_schedule_verdict_effect tests/nodes/node_floor_fill_scheduled_effect -q --no-cov
    cwd: .
