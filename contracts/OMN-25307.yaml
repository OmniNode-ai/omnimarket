  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_daily_line_scheduled_effect -q --no-cov
    cwd: .
- id: dod-omn25307-ac2
  description: AC2 proven by the builder, failed-event and empty-line tests.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_daily_line_scheduled_effect -q --no-cov -k 'builder or failed or empty'
    cwd: .
- id: dod-omn25307-ac3
  description: AC3 proven by the contract and metadata tests.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_daily_line_scheduled_effect -q --no-cov -k 'contract or metadata'
    cwd: .
- id: dod-omn25307-ac4
  description: AC4 proven by the timeout, golden chain and seam tests.
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_daily_line_scheduled_effect -q --no-cov -k 'timeout or golden or seam'
    cwd: .
- id: dod-omn25307-ac5
  description: AC5 is read on the pull request after the push; the Lab comment is read there and the head is read from the watcher.
  source: manual
