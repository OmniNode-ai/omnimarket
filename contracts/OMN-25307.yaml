    check_value: uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane fix6356-1139 -- uv run --frozen pytest tests/nodes/node_daily_line_scheduled_effect -q --no-cov
    cwd: .
