schema_version: 1.0.0
ticket_id: OMN-25307
title: 'Review findings 1 to 7 on omnimarket PR 6356 at head f71be4527990 are fixed or argued: the default runner builder is tested, any exception becomes a failed event, AC3 binds to a schedule-run read, the metadata declares its effects and the timeout and instant tests can fail'
summary: 'Fixes the review findings of the daily line scheduled effect node: tests of the default runner builder, a broad failed-event path with an empty-line guard, AC3 of its owner contract bound to a schedule-run read on dev, real metadata capabilities, a timeout test that asserts 300000, three distinct instants in the golden chain and an entry-point seam test.'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn25307-review-findings
  statement: The blocking findings of the review of the daily line scheduled effect node at head f71be4527990 are fixed with tests that fail on that head, or argued with evidence.
  acceptance:
  - id: AC1
    statement: 'AC1: every blocking finding (1 to 7) of the review at head f71be4527990 is fixed with a test that is red on that head and green on the new head, or argued with evidence in a PR comment -- falsifier: `uv run pytest tests/nodes/node_daily_line_scheduled_effect -q` on the lab at the new head passes while the new tests fail against the source files of head f71be4527990'
  - id: AC2
    statement: 'AC2: tests run the default runner builder with and without OMNI_HOME and a no-arg NodeDailyLineScheduledEffect, and any Exception from build, run or detail, and an empty line, becomes a failed event -- falsifier: `uv run pytest tests/nodes/node_daily_line_scheduled_effect -q -k ''builder or failed or empty''` fails with the builder call or the broad except removed'
  - id: AC3
    statement: 'AC3: contract AC3 is bound to a read of onex.evt.omnimarket.schedule-run.v1 for job_id daily_line on dev, the overlay PR and its merge order are named, and metadata.yaml declares the real capabilities -- falsifier: `uv run pytest tests/nodes/node_daily_line_scheduled_effect -q -k ''contract or metadata''` fails when AC3 is rebound to a contract.yaml grep or the metadata keeps side_effect_class none'
  - id: AC4
    statement: 'AC4: the timeout test asserts 300000, the golden chain test uses three distinct instants and the seam test asserts the pyproject entry point -- falsifier: `uv run pytest tests/nodes/node_daily_line_scheduled_effect -q -k ''timeout or golden or seam''` fails with timeout_ms set to 120000, with fired_at and scheduled_for swapped, or with the entry point removed'
  - id: AC5
    statement: 'AC5: a PR comment starting `Lab: head=<full head sha>` names exactly the pushed head after the required suites ran on the lab (a whole-suite timeout rerun in named parts), and the three non-blocking findings are answered in a PR comment -- falsifier: `onex scm pr-view OmniNode-ai/omnimarket#6356` shows a head that differs from the head named in the Lab: comment, or no Lab: comment'
evidence_requirements:
- kind: tests
  description: The tests of the daily line scheduled effect node pass at the pushed head.
  command: uv run --frozen pytest tests/nodes/node_daily_line_scheduled_effect -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
