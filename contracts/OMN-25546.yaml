schema_version: "1.0.0"
ticket_id: OMN-25546
title: "The forward node sends its recorded events over HTTPS: PublisherHttps with bounded attempts, size limits and a per-attempt wall-clock deadline"
summary: The runtime bus forward effect can deliver a run's recorded events to its declared HTTPS endpoint with bounded batches and a cancellable deadline for every attempt.
is_seam_ticket: true
interface_change: true
interfaces_touched: [public_api]
requirements:
  - id: req-omn25546-https-forwarding
    statement: Carry recorded events either to the configured Kafka lane or to the configured HTTPS endpoint and account for every record in the receipt.
    acceptance:
      - id: AC1
        statement: "AC1: the https publisher posts every recorded event in order with key, value and headers to the declared URL in batches no larger than the overlay bound, and an in-memory run's receipt counts forwarded and failed -- falsifier: `uv run pytest tests/unit/nodes/node_runtime_bus_forward_effect -k https_golden` with the batch splitter removed turns the 3-batch case red"
      - id: AC2
        statement: "AC2: a `422` refuses its whole sub-batch, every record in it counts failed with the door's reasons in `failure_detail`, and it is not retried -- falsifier: `pytest ... -k https_refusal` with the `422` branch made retryable turns the request-count assertion red"
      - id: AC3
        statement: "AC3: a `503` with a partial body counts the body's `published` records forwarded and the rest failed (`delivery-unconfirmed` is said to possibly be on the broker), the next attempt resends only unacknowledged records, and `forwarded + failed` equals the events handed in -- falsifier: `pytest ... -k https_partial` with the body ignored turns the forwarded-count case red"
      - id: AC4
        statement: "AC4: serialized size bounds: a record one byte over `max_event_bytes` is refused at `publish`, never sent, named `event-too-large`; the largest body the door stand-in received is at most `max_batch_bytes`; an over-size `authorization` sends nothing; the load refuses `max_batch_bytes` below `max_event_bytes` plus the envelope -- falsifier: `pytest ... -k https_size_bounds` with the splitter counting decoded bytes turns the body-length case red, and with the event check removed turns the refusal case red"
      - id: AC5
        statement: "AC5: each of the six field limits (`max_key_bytes`, `max_value_bytes`, `max_record_headers`, `max_header_name_chars`, `max_header_value_chars`, `max_topic_chars`) refuses a record one over its limit at `publish` as `event-field-too-large` naming the field, and sends one at exactly the limit -- falsifier: `pytest ... -k https_field_bounds` with only the aggregate check kept turns every over-limit field case red, and with the key limit compared on its base64 length turns the exact-limit key case red"
      - id: AC6
        statement: "AC6: dedup identity at the client: records differing in key, or in a declared identity header, reach the stand-in with four different `event_id`s, a rerun reaches it with the same four, and the receipt reads forwarded 4 -- falsifier: `pytest ... -k https_identity` with the id computed from topic and value only turns the key and header cases red"
      - id: AC7
        statement: "AC7: header budget: the real `httpx.Client` over a real loopback socket sends header names equal to `CLIENT_HEADER_SET` exactly, each value within its declared length, and a request built with an added header name raises before anything is sent -- falsifier: `pytest ... -k https_header_budget` with a library default header left unsuppressed turns the exact-set case red, and with the send-time subset check removed turns the added-header case red"
      - id: AC8
        statement: "AC8: deadline load check: `request_timeout_seconds` equal to `max_batch_records x door_record_confirm_timeout_seconds` is refused at load, one second above that plus `request_margin_seconds` loads, and an absent `door_record_confirm_timeout_seconds` or `request_margin_seconds` refuses the load -- falsifier: `pytest ... -k https_deadline_load` with the margin dropped from the inequality turns the boundary case red"
      - id: AC9
        statement: "AC9: flush budget: the load refuses `max_attempts` of 1 and a `flush_timeout_seconds` below `worst_case_sub_batches x (2 x request_timeout_seconds + retry_backoff_seconds)` taken at the byte split; on a virtual clock a first attempt failing at the full timeout is followed by a second attempt with the full timeout, every sub-batch keeps its first attempt and one full retry, and no attempt is sent with a clipped timeout -- falsifier: `pytest ... -k https_flush_budget` with the rule reverted to `flush_timeout_seconds >= request_timeout_seconds` turns the load and first-run cases red, with the sub-batch count taken from `max_batch_records` alone turns the byte-split case red, and with the later-sub-batch reserve dropped from the retry gate turns the reservation case red"
      - id: AC10
        statement: "AC10: door busy and drift: `503 door-busy` and `408` are retried after `retry_backoff_seconds` and not after `Retry-After`, and a `500 kafka-limit-drift` with `retryable: false` is sent once -- falsifier: `pytest ... -k https_door_busy` with `door-busy` treated as not retryable turns the first case red, and with the `retryable` flag ignored turns the request-count case red"
      - id: AC11
        statement: "AC11: earlier acknowledgments survive a lost retry, kept as a set of original record positions for one `flush` only (never `event_id`s); a second `flush` with no new `publish` posts nothing -- falsifier: `pytest ... -k https_ack_survives` with the set reset at each attempt turns the forwarded-count case red, with the set kept after `flush` turns the no-hold case red, and with the set keyed by `event_id` turns the repeated-id case red"
      - id: AC12
        statement: "AC12: a transport failure with no body leaves the sub-batch unconfirmed, retries at most `max_attempts` times and never past `flush`'s `timeout_s`, and `failure_detail` says it may have been published -- falsifier: `pytest ... -k https_transport` with `max_attempts` ignored turns the attempt-count case red, and with the `timeout_s` guard removed turns the deadline case red"
      - id: AC13
        statement: "AC13: no event is held after `flush` returns -- falsifier: `pytest ... -k https_no_retention` with a post-failure buffer kept turns it red"
      - id: AC14
        statement: "AC14: retry recovery with a stateless door: a whole-batch `503` with `Retry-After: 120` is retried after `retry_backoff_seconds`, the receipt reads forwarded equal to events handed in, and the client keeps no per-record wait state -- falsifier: `pytest ... -k https_retry_recovery` with the client waiting out `Retry-After` turns the flush-budget case red"
      - id: AC15
        statement: "AC15: an overlay whose `ingest_url_ref` or `auth_ref` is a literal, or that omits any required key (no defaults), is refused at load -- falsifier: `pytest ... -k https_overlay` with `extra=forbid` removed turns the unknown-key case red, and with `max_attempts` or `max_batch_bytes` given a default turns the matching absent-key case red"
      - id: AC16
        statement: "AC16: the h051 capture leg: a recording wrapper writes per `publish` the exact key, value bytes, headers and computed `event_id` to an evidence file and passes the call through unchanged, and the file matches what the `MockTransport` door received -- falsifier: `pytest ... -k https_capture` with the wrapper recording a re-encoded copy of the value turns the bytes case red"
      - id: AC17
        statement: "AC17: the Kafka path is byte-for-byte unchanged and its existing tests pass untouched -- falsifier: `git diff origin/dev -- src/omnimarket/nodes/node_runtime_bus_forward_effect/publishers/publisher_kafka.py` is empty and `uv run pytest tests/unit/nodes/node_runtime_bus_forward_effect -q` passes"
      - id: AC18
        statement: "AC18: KNOWN FINDING 5 (see the section below): each attempt runs under a wall-clock deadline, not only httpx per-phase timeouts, that fits inside the flush budget, and a trickling slow response ends at its deadline while later batches keep their reserved first attempt and retry -- falsifier: `pytest ... -k https_wall_clock_deadline` with only per-phase httpx timeouts (the deadline removed) turns the trickling-response case red (the stalled request outlives its deadline and a later batch loses its reserve)"
evidence_requirements:
  - kind: tests
    description: The forwarder tests with recording and TLS loopback doors.
    command: "uv run --frozen pytest tests/unit/nodes/node_runtime_bus_forward_effect -q -m \"not kafka\" --no-cov -n 0"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-omn25546-ac1
    description: "The registered forwarder reads a core in-memory recording and preserves topic, key, value, headers, order, batch sizes and receipt counts."
    source: manual
    binds_ac: [AC1]
    checks:
      - check_type: test_passes
        check_value: "uv run --frozen pytest tests/unit/nodes/node_runtime_bus_forward_effect -q -k https_golden --no-cov -n 0"
        cwd: .
  - id: dod-omn25546-ac2
    description: "The door's two indexed refusal reasons reach the receipt and the publisher sends the refused batch once."
    source: manual
    binds_ac: [AC2]
    checks:
      - check_type: test_passes
        check_value: "uv run --frozen pytest tests/unit/nodes/node_runtime_bus_forward_effect -q -k https_refusal --no-cov -n 0"
        cwd: .
  - id: dod-omn25546-ac3
    description: "Confirmed positions survive the partial response and the retry contains only the unconfirmed positions."
    source: manual
    binds_ac: [AC3]
    checks:
      - check_type: test_passes
        check_value: "uv run --frozen pytest tests/unit/nodes/node_runtime_bus_forward_effect -q -k https_partial --no-cov -n 0"
        cwd: .
  - id: dod-omn25546-ac4
    description: "Actual request body bytes, field encoding, the event boundary and the authorization length govern admission."
    source: manual
    binds_ac: [AC4]
    checks:
      - check_type: test_passes
        check_value: "uv run --frozen pytest tests/unit/nodes/node_runtime_bus_forward_effect -q -k https_size_bounds --no-cov -n 0"
        cwd: .
  - id: dod-omn25546-ac5
    description: "The six field checks independently accept the boundary and refuse one over before buffering."
    source: manual
    binds_ac: [AC5]
    checks:
      - check_type: test_passes
        check_value: "uv run --frozen pytest tests/unit/nodes/node_runtime_bus_forward_effect -q -k https_field_bounds --no-cov -n 0"
        cwd: .
  - id: dod-omn25546-ac6
    description: "Keys and declared identity headers affect the shared event identity and identical reruns reproduce it."
    source: manual
    binds_ac: [AC6]
    checks:
      - check_type: test_passes
        check_value: "uv run --frozen pytest tests/unit/nodes/node_runtime_bus_forward_effect -q -k https_identity --no-cov -n 0"
        cwd: .
  - id: dod-omn25546-ac7
    description: "The TLS loopback receives exactly the shared header set at its declared lengths and an extra header prevents a send."
    source: manual
    binds_ac: [AC7]
    checks:
      - check_type: test_passes
        check_value: "uv run --frozen pytest tests/unit/nodes/node_runtime_bus_forward_effect -q -k https_header_budget --no-cov -n 0"
        cwd: .
  - id: dod-omn25546-ac8
    description: "The strict per-request budget uses both required door timing settings."
    source: manual
    binds_ac: [AC8]
    checks:
      - check_type: test_passes
        check_value: "uv run --frozen pytest tests/unit/nodes/node_runtime_bus_forward_effect -q -k https_deadline_load --no-cov -n 0"
        cwd: .
  - id: dod-omn25546-ac9
    description: "The load computes the byte-driven split and the virtual clock exercises full retries while reserving later batches."
    source: manual
    binds_ac: [AC9]
    checks:
      - check_type: test_passes
        check_value: "uv run --frozen pytest tests/unit/nodes/node_runtime_bus_forward_effect -q -k https_flush_budget --no-cov -n 0"
        cwd: .
  - id: dod-omn25546-ac10
    description: "Busy and upload deadline replies use the configured backoff. Broker limit drift preserves acknowledgments and stops retries."
    source: manual
    binds_ac: [AC10]
    checks:
      - check_type: test_passes
        check_value: "uv run --frozen pytest tests/unit/nodes/node_runtime_bus_forward_effect -q -k https_door_busy --no-cov -n 0"
        cwd: .
  - id: dod-omn25546-ac11
    description: "Acknowledgments track request positions through a lost or refused retry, including repeated event identities."
    source: manual
    binds_ac: [AC11]
    checks:
      - check_type: test_passes
        check_value: "uv run --frozen pytest tests/unit/nodes/node_runtime_bus_forward_effect -q -k https_ack_survives --no-cov -n 0"
        cwd: .
  - id: dod-omn25546-ac12
    description: "The virtual clock observes attempt and flush limits and the receipt describes possible delivery after a lost response."
    source: manual
    binds_ac: [AC12]
    checks:
      - check_type: test_passes
        check_value: "uv run --frozen pytest tests/unit/nodes/node_runtime_bus_forward_effect -q -k https_transport --no-cov -n 0"
        cwd: .
  - id: dod-omn25546-ac13
    description: "A failed flush drains the buffer permanently and a subsequent flush carries only new records."
    source: manual
    binds_ac: [AC13]
    checks:
      - check_type: test_passes
        check_value: "uv run --frozen pytest tests/unit/nodes/node_runtime_bus_forward_effect -q -k https_no_retention --no-cov -n 0"
        cwd: .
  - id: dod-omn25546-ac14
    description: "A stateless door's advisory retry header adds no per-record wait."
    source: manual
    binds_ac: [AC14]
    checks:
      - check_type: test_passes
        check_value: "uv run --frozen pytest tests/unit/nodes/node_runtime_bus_forward_effect -q -k https_retry_recovery --no-cov -n 0"
        cwd: .
  - id: dod-omn25546-ac15
    description: "The HTTPS arm requires every declared field and two dotted deployment references."
    source: manual
    binds_ac: [AC15]
    checks:
      - check_type: test_passes
        check_value: "uv run --frozen pytest tests/unit/nodes/node_runtime_bus_forward_effect -q -k https_overlay --no-cov -n 0"
        cwd: .
  - id: dod-omn25546-ac16
    description: "The capture file matches the original binary key, value, headers and shared identity against both the recording and TLS loopback doors."
    source: manual
    binds_ac: [AC16]
    checks:
      - check_type: test_passes
        check_value: "uv run --frozen pytest tests/unit/nodes/node_runtime_bus_forward_effect -q -k https_capture --no-cov -n 0"
        cwd: .
  - id: dod-omn25546-ac17
    description: "The Kafka implementation has the same Git blob as the reference implementation and its existing publisher tests pass."
    source: manual
    binds_ac: [AC17]
    checks:
      - check_type: test_passes
        check_value: "uv run --frozen pytest tests/unit/nodes/node_runtime_bus_forward_effect/test_runtime_bus_publisher_kafka.py -q --no-cov -n 0"
        cwd: .
      - check_type: command
        check_value: "test \"$(git hash-object src/omnimarket/nodes/node_runtime_bus_forward_effect/publishers/publisher_kafka.py)\" = c18dd6d61974128be40ae3df5d3a114a2a2dae4a"
        cwd: .
  - id: dod-omn25546-ac18
    description: "A trickling TLS response runs past an HTTPX phase budget in the negative control. The deadline cancels it and the later batch gets two full attempts."
    source: manual
    binds_ac: [AC18]
    checks:
      - check_type: test_passes
        check_value: "uv run --frozen pytest tests/unit/nodes/node_runtime_bus_forward_effect -q -k https_wall_clock_deadline --no-cov -n 0"
        cwd: .
  - id: dod-omn25546-deploy-https-forwarder
    description: Install the checkout into a disposable environment. Exercise the registered forwarder and its capture and deadline behavior through the loopback doors.
    source: manual
    checks:
      - check_type: command
        check_value: >-
          docker run --rm --mount "type=bind,source=$PWD,target=/checkout,readonly" --workdir /checkout
          --env UV_PROJECT_ENVIRONMENT=/tmp/forwarder-venv --env PYTHONDONTWRITEBYTECODE=1
          --entrypoint uv ghcr.io/astral-sh/uv:python3.12-bookworm run --frozen --python 3.12 --no-editable
          pytest tests/unit/nodes/node_runtime_bus_forward_effect -q
          -k "https_golden or https_capture or https_wall_clock_deadline"
          --no-cov -n 0 -o pythonpath=. -p no:cacheprovider
        cwd: .
  - id: dod-omn25546-integration-proof
    description: Run the pushed sender from a non-editable install on the lab. The TLS capture compares the recorded event with the bytes received by the loopback door and checks the forwarding receipt.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: >-
          onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)"
          --lane dod-integration-proof-25546 --kind test --
          uv run --frozen --python 3.12 --no-editable pytest
          tests/unit/nodes/node_runtime_bus_forward_effect/test_https_capture_h051.py
          -k tls_loopback -q --no-cov -n 0 -o pythonpath=. -p no:cacheprovider
        cwd: .
