schema_version: 1.0.0
ticket_id: OMN-24548
title: Floor deploy lag row reads its lab-pass receipts from an overlay, not two unset variables
summary: node_merged_running_count_effect builds its lab-pass receipt reader from the lab_pass_receipts overlay (receipts_url and lane) instead of two environment variables the Mac publisher never had, so the deploy_lag row on the board stops reporting the settings as unset.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24548-lab-pass-overlay
  statement: The address of the lab-pass receipts and the lane whose receipt counts are overlay values, and an absent or invalid overlay reads as unread and names the overlay.
  acceptance:
  - id: AC1
    statement: 'AC1: the lab-pass receipt reader of node_merged_running_count_effect is built from an overlay (lab_pass_receipts: receipts_url and lane) and names the overlay when it is absent or invalid -- falsifier: pytest tests/nodes/node_merged_running_count_effect/test_deployed_receipts.py -q fails on the previous source (three of its tests)'
  - id: AC2
    statement: 'AC2: the environment names ONEX_LAB_PASS_RECEIPTS_URL and ONEX_LAB_PASS_LANE are no longer read -- falsifier: pytest tests/nodes/node_merged_running_count_effect/test_deployed_receipts.py -k old_environment -q fails when the reader takes either name from the environment'
  - id: AC3
    statement: 'AC3: integrated, read in the running runtime: on the served floor record the lab_state row deploy_lag no longer says ONEX_LAB_PASS_RECEIPTS_URL, ONEX_LAB_PASS_LANE not set -- falsifier: fetch floor-simple.json from the served board and read the deploy_lag text'
evidence_requirements:
- kind: tests
  description: The node's tests and the floor wiring test pass at the pushed head.
  command: uv run --frozen pytest tests/nodes/node_merged_running_count_effect tests/nodes/node_factory_floor_effect/test_merged_running_wiring.py -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24548-ac1
  description: Golden build from the overlay, the failing control that an absent overlay names lab_pass_receipts and the refusal of a non-http address.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_merged_running_count_effect/test_deployed_receipts.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24548-ac2
  description: The old environment names alone build no source.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_merged_running_count_effect/test_deployed_receipts.py -k old_environment -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24548-ac3
  description: The floor wiring test passes; the live reading on the served board is recorded in the Lab line and a comment once the Mac publisher runs this head with the overlay values installed.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_factory_floor_effect/test_merged_running_wiring.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24548-integration-proof
  description: Run the node's tests on a lab host at the pushed head. Hosted CI cannot reach the lab hosts, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24548 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_merged_running_count_effect/test_deployed_receipts.py -q --no-cov -n 0 -p no:randomly
    cwd: .
