schema_version: 1.0.0
ticket_id: OMN-21974
title: Typed goal, caps and stop reasons for goal-driven runs
summary: A pure compute node, node_goal_run_stop_compute, decides whether a goal-driven run continues, is retried or stops, with ten typed stop reasons, caps read from the experiment's data file whose sha256 is in the run key, and a fixed analysis role per reason. The code-edit loop's stop states are mapped to the reasons as data in the node's contract; the loop is not edited. The node declares no topic and no subscription and changes no runtime.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn21974-goal-run-stop
    statement: Each acceptance criterion has a test in tests/nodes/node_goal_run_stop_compute that fails without the node.
    acceptance:
      - id: AC1
        statement: 'AC1: all ten reasons are reachable and typed -- falsifier: a reason with no test'
      - id: AC2
        statement: 'AC2: caps are read from the experiment''s data file, whose hash is in the run key -- falsifier: a cap changed without a changed key'
      - id: AC3
        statement: 'AC3: a cap-stopped run is flagged and treated as right-censored, `NO_PROGRESS` and `AGENT_BLOCKED` are scored as failures with the sensitivity reading of section 3.9, and `OPERATOR_STOP` and `REFUSED_PREMISE` are excluded with their reason -- falsifier: a censored run averaged as a success, or an excluded stop counted'
evidence_requirements:
  - kind: tests
    description: The node's suite runs at the pushed head on a lab host.
    command: uv run pytest tests/nodes/node_goal_run_stop_compute -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn21974-ac1
    description: AC1 drives a run to each of the nine reasons a counter or signal reaches and to INFRA_FAULT once its retries are spent, and asserts the typed reason; one test asserts the enum is exactly the ten names and that the tested set is the same ten, and another that the contract gives each a role.
    source: manual
    binds_ac:
      - AC1
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/nodes/node_goal_run_stop_compute/test_goal_run_stop_decision.py -q --no-cov --tb=line -k "typed_reason or tenth_reason or exactly_the_ten or gives_every_reason_a_role"
        cwd: .
  - id: dod-omn21974-ac2
    description: AC2 reads the five caps from the caps file text, asserts the file hash is the sha256 of its bytes, and asserts a changed cap changes the run key while an unchanged file gives the same key; a file that is not the five positive caps is refused.
    source: manual
    binds_ac:
      - AC2
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/nodes/node_goal_run_stop_compute/test_goal_run_stop_decision.py -q --no-cov --tb=line -k "caps_are_read or file_hash or run_key or caps_file_that_is_not"
        cwd: .
  - id: dod-omn21974-ac3
    description: AC3 asserts a cap-stopped run is right-censored at the cap and not a success, NO_PROGRESS and AGENT_BLOCKED are failures with a censored alternate reading, OPERATOR_STOP, REFUSED_PREMISE and a spent INFRA_FAULT are excluded with a reason and counted and out of the denominator, and only GOAL_MET counts as a success.
    source: manual
    binds_ac:
      - AC3
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/nodes/node_goal_run_stop_compute/test_goal_run_stop_decision.py -q --no-cov --tb=line -k "right_censored or censored_reading or excluded or only_goal_met or observed_time or not_scored"
        cwd: .
  - id: dod-omn21974-deploy-local-runtime
    description: The hosted runner dispatches the packaged goal-run stop node through the ONEX local runtime with the in-memory backend. Returned receipts must show continue, goal success, a right-censored token cap, an infra retry and exclusion after retries are spent, with the same run key throughout. No broker or Docker daemon is required.
    source: manual
    checks:
      - check_type: command
        check_value: |
          set -eu;
          export PYTHONDONTWRITEBYTECODE=1;
          export PATH="$(uv run --frozen python -c 'import sys; from pathlib import Path; print(Path(sys.executable).parent)'):$PATH"
          probe_dir="$(mktemp -d)"
          trap 'rm -rf "$probe_dir"' EXIT;
          uv run --frozen python -c '
          import copy
          import json
          import sys
          from pathlib import Path
          request = {
              "correlation_id": "goal-run-stop-smoke",
              "item_id": "goal-run-stop-smoke",
              "goal": {"predicate_kind": "verify_run", "predicate_ref": "goal-run-stop-smoke", "predicate_sha256": "a" * 64},
              "caps_file_text": "token_cap: 300000\nwall_clock_cap_s: 7200\nturn_cap: 40\ncompaction_cap: 3\nno_progress_window_turns: 8\n",
              "counters": {"tokens": 100, "wall_clock_s": 60, "turns": 1, "compactions": 0, "turns_without_subcheck_change": 0}}
          cases = {name: copy.deepcopy(request) for name in ("continue", "goal", "capped", "retry", "spent")}
          cases["goal"]["signals"] = {"goal_met": True}
          cases["capped"]["counters"]["tokens"] = 300000
          cases["retry"]["signals"] = {"infra_fault": True}
          cases["spent"]["signals"] = {"infra_fault": True}
          cases["spent"]["infra_fault_retries_used"] = 2
          for name, payload in cases.items():
              Path(sys.argv[1], name + ".json").write_text(json.dumps(payload))
          ' "$probe_dir";
          for case in continue goal capped retry spent; do
            onex node node_goal_run_stop_compute --input "$probe_dir/$case.json" --state-root "$probe_dir/state-$case" --backend event_bus=inmemory --timeout 30 --output receipt --omnibase-path "$PWD" > "$probe_dir/$case-receipt.json";
          done;
          uv run --frozen python -c '
          import hashlib
          import json
          import sys
          from pathlib import Path
          receipts = {name: json.loads(Path(sys.argv[1], name + "-receipt.json").read_text()) for name in ("continue", "goal", "capped", "retry", "spent")}
          for receipt in receipts.values():
              assert receipt["status"] == "success" and receipt["exit_code"] == 0, receipt
          results = {name: receipt["result"] for name, receipt in receipts.items()}
          assert results["continue"]["action"] == "continue" and results["continue"]["stop_reason"] is None, results
          goal = results["goal"]
          assert goal["action"] == "stop" and goal["stop_reason"] == "goal_met" and goal["analysis"]["counts_as_success"] is True, goal
          capped = results["capped"]
          assert capped["action"] == "stop" and capped["stop_reason"] == "token_cap", capped
          assert capped["analysis"]["right_censored"] is True and capped["analysis"]["counts_as_success"] is False and capped["analysis"]["censored_at"]["tokens"] == 300000, capped
          retry = results["retry"]
          assert retry["action"] == "retry" and retry["retry_reason"] == "infra_fault" and retry["stop_reason"] is None, retry
          spent = results["spent"]
          assert spent["action"] == "stop" and spent["stop_reason"] == "infra_fault", spent
          assert spent["analysis"]["role"] == "excluded" and spent["analysis"]["in_denominator"] is False and spent["analysis"]["exclusion_reason"], spent
          assert len({result["run_key"] for result in results.values()}) == 1, results
          request = json.loads(Path(sys.argv[1], "continue.json").read_text())
          expected_hash = hashlib.sha256(request["caps_file_text"].encode()).hexdigest()
          assert all(result["caps_file_sha256"] == expected_hash for result in results.values()), results
          print(json.dumps({name: {"run_id": receipt["run_id"], "runtime_identity": receipt["runtime_identity"], "result": receipt["result"]} for name, receipt in receipts.items()}, sort_keys=True))
          ' "$probe_dir"
        cwd: .
  - id: dod-omn21974-integration-proof
    description: The pushed head ran the node's suite, including the golden chain through the registered contract on the in-memory bus, on a lab host and exited 0. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-21974 -- uv run --frozen pytest tests/nodes/node_goal_run_stop_compute -q --no-cov
        cwd: .
