schema_version: 1.0.0
ticket_id: OMN-21974
title: Typed goal, caps and stop reasons for goal-driven runs
summary: A pure compute node, node_goal_run_stop_compute, decides whether a goal-driven run continues, is retried or stops, with ten typed stop reasons, caps read from the experiment's data file whose sha256 is in the run key, and a fixed analysis role per reason. The code-edit loop's stop states are mapped to the reasons as data in the node's contract; the loop is not edited. The node declares no topic and no subscription and changes no runtime.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn21974-goal-run-stop
    statement: Each acceptance criterion has a test in tests/nodes/node_goal_run_stop_compute that fails without the node.
    acceptance:
      - id: AC1
        statement: 'AC1: all ten reasons are reachable and typed -- falsifier: a reason with no test'
      - id: AC2
        statement: 'AC2: caps are read from the experiment''s data file, whose hash is in the run key -- falsifier: a cap changed without a changed key'
      - id: AC3
        statement: 'AC3: a cap-stopped run is flagged and treated as right-censored, `NO_PROGRESS` and `AGENT_BLOCKED` are scored as failures with the sensitivity reading of section 3.9, and `OPERATOR_STOP` and `REFUSED_PREMISE` are excluded with their reason -- falsifier: a censored run averaged as a success, or an excluded stop counted'
evidence_requirements:
  - kind: tests
    description: The node's suite runs at the pushed head on a lab host.
    command: uv run pytest tests/nodes/node_goal_run_stop_compute -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn21974-ac1
    description: AC1 drives a run to each of the nine reasons a counter or signal reaches and to INFRA_FAULT once its retries are spent, and asserts the typed reason; one test asserts the enum is exactly the ten names and that the tested set is the same ten, and another that the contract gives each a role.
    source: manual
    binds_ac:
      - AC1
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/nodes/node_goal_run_stop_compute/test_goal_run_stop_decision.py -q --no-cov --tb=line -k "typed_reason or tenth_reason or exactly_the_ten or gives_every_reason_a_role"
        cwd: .
  - id: dod-omn21974-ac2
    description: AC2 reads the five caps from the caps file text, asserts the file hash is the sha256 of its bytes, and asserts a changed cap changes the run key while an unchanged file gives the same key; a file that is not the five positive caps is refused.
    source: manual
    binds_ac:
      - AC2
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/nodes/node_goal_run_stop_compute/test_goal_run_stop_decision.py -q --no-cov --tb=line -k "caps_are_read or file_hash or run_key or caps_file_that_is_not"
        cwd: .
  - id: dod-omn21974-ac3
    description: AC3 asserts a cap-stopped run is right-censored at the cap and not a success, NO_PROGRESS and AGENT_BLOCKED are failures with a censored alternate reading, OPERATOR_STOP, REFUSED_PREMISE and a spent INFRA_FAULT are excluded with a reason and counted and out of the denominator, and only GOAL_MET counts as a success.
    source: manual
    binds_ac:
      - AC3
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/nodes/node_goal_run_stop_compute/test_goal_run_stop_decision.py -q --no-cov --tb=line -k "right_censored or censored_reading or excluded or only_goal_met or observed_time or not_scored"
        cwd: .
  - id: dod-omn21974-integration-proof
    description: The pushed head ran the node's suite, including the golden chain through the registered contract on the in-memory bus, on a lab host and exited 0. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-21974 -- uv run --frozen pytest tests/nodes/node_goal_run_stop_compute -q --no-cov
        cwd: .
