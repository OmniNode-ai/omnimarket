schema_version: 1.0.0
ticket_id: OMN-26621
title: Every dev build is checked once against the ten delegation checks, with each check recorded pass or fail by build id and a newly red check naming the merges the build added as suspects
summary: node_build_delegation_checks subscribes to the deploy agent's rebuild-completed event, runs the ten delegation checks once per dev build, records pass, fail or unavailable per check with the build id and the merges the build added, and raises one regression event (the event model shared with the probe-run regression alarm) naming those merges as suspects for a check that passed before and fails now, delivered through the lab alarm delivery with a named owner.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn26621-build-delegation-checks
  statement: A dev build's delegation checks run once and a newly red check names the merges that build added.
  acceptance:
  - id: AC1
    statement: 'AC1: a contract-declared omnimarket node consumes rebuild-completed and runs the ten delegation checks once per build id, so a replayed second rebuild-completed for the same build id runs nothing -- falsifier: uv run pytest tests/nodes/node_build_delegation_checks -q -k once_per_build fails on a handler that runs twice'
  - id: AC2
    statement: 'AC2: each run records one result per check as pass or fail with the build id and the list of merges the build added -- falsifier: uv run pytest tests/nodes/node_build_delegation_checks -q -k records_per_check fails when a check row lacks the build id or the merge list'
  - id: AC3
    statement: 'AC3: a check that passed on the previous build and fails on this one emits a regression event naming the merges that build added as suspects, in the event model shared with regalarm-0110, and a check that was already red emits none -- falsifier: uv run pytest tests/nodes/node_build_delegation_checks -q -k suspects fails when the suspects list is empty or a repeat red re-alarms'
  - id: AC4
    statement: 'AC4: thresholds and owners are read from the settings store with tested defaults in the overlays, and a missing owner refuses the alarm instead of sending it unowned -- falsifier: uv run pytest tests/nodes/node_build_delegation_checks -q -k owner_required fails on a handler that alarms with no owner'
  - id: AC5
    statement: 'AC5: a regression test built from the recorded probe results of the 13:30Z to 14:45Z transition on 2026-11-23 (fixture path under tests/nodes/node_build_delegation_checks/fixtures) fails on a handler that reads the C14 and C29 change as no regression and passes on the fix -- falsifier: uv run pytest tests/nodes/node_build_delegation_checks -q -k replay_1330_1445'
  - id: AC6
    statement: 'AC6: integrated: with the node installed from its branch on the lab and the real 13:30Z to 14:45Z transition replayed from the recorded probe results, the mechanism delivers one alarm row through the lab alarm node with a named owner and no prod target, read in the dev runtime log -- falsifier: onex run-node node_build_delegation_checks on the lab with the recorded results prints no alarm row, or the delivered row names a prod target'
evidence_requirements:
- kind: tests
  description: The node's focused tests, each failing against the broken behavior first and passing on the handler.
  command: uv run pytest tests/nodes/node_build_delegation_checks -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn26621-once-per-build
  description: A second rebuild-completed for the same build id runs no probe and publishes nothing; the test fails on a handler that claims no build.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_build_delegation_checks -q --no-cov -n 0 -p no:randomly -k once_per_build
    cwd: .
- id: dod-omn26621-records-per-check
  description: Each check's row carries pass, fail or unavailable, the build id, the previous build id and the merges the build added; the test fails on a handler that drops the merge list.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_build_delegation_checks -q --no-cov -n 0 -p no:randomly -k records_per_check
    cwd: .
- id: dod-omn26621-suspects
  description: A check that passed and now fails raises one regression event in the shared model with the merges as suspects and one owned alarm; a check already red raises none. The test fails on a handler with empty suspects and on one that re-alarms a repeat red.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_build_delegation_checks -q --no-cov -n 0 -p no:randomly -k suspects
    cwd: .
- id: dod-omn26621-owner-required
  description: The owner and the thresholds are the settings store's overlay (settable keys declared in node_overlay_setting_set_effect), with tested defaults in overlay.example.yaml; a missing owner refuses the alarm. The test fails on a handler that alarms with no owner.
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_build_delegation_checks -q --no-cov -n 0 -p no:randomly -k owner_required
    cwd: .
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_build_delegation_checks -q --no-cov -n 0 -p no:randomly -k overlay
    cwd: .
  - check_type: command
    check_value: 'grep -q ''overlay_id: node_build_delegation_checks'' src/omnimarket/nodes/node_overlay_setting_set_effect/contract.yaml'
    cwd: .
- id: dod-omn26621-replay
  description: The recorded 2026-11-23 transition (the probes' own finished runs and the dev branch's first-parent history, fixture under tests/nodes/node_build_delegation_checks/fixtures) raises C29 and C14 with the merges between the builds as suspects. The test fails on a handler that reads the change as no regression.
  source: manual
  binds_ac:
  - AC5
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_build_delegation_checks -q --no-cov -n 0 -p no:randomly -k replay_1330_1445
    cwd: .
- id: dod-omn26621-hosted-deploy-check
  description: 'Deploy check the hosted runner can run: the contract declares the rebuild-completed input and the regression and alarm topics, the node is registered as an onex.nodes entry point, and the node''s trigger declaration holds. This binds no criterion by itself.'
  source: manual
  checks:
  - check_type: command
    check_value: grep -q 'rebuild_completed:' src/omnimarket/nodes/node_build_delegation_checks/contract.yaml
    cwd: .
  - check_type: command
    check_value: grep -q 'node_build_delegation_checks = ' pyproject.toml
    cwd: .
  - check_type: command
    check_value: uv run python -m omnimarket.nodes.node_trigger_declaration_check_effect --root . --contract src/omnimarket/nodes/node_build_delegation_checks/contract.yaml
    cwd: .
- id: dod-omn26621-integration-proof
  description: On a lab host, with the node installed from its pushed branch and the recorded transition replayed through onex run-node node_build_delegation_checks, one alarm row is delivered through the lab alarm node with a named owner and no prod target. Hosted CI holds no lab bus, so only the local Done gate runs this unbound check (the lab reading of AC6 is in the PR's Lab line and comment).
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-26621 --kind test -- uv run --frozen pytest tests/nodes/node_build_delegation_checks -q --no-cov -n 0 -p no:randomly
    cwd: .
