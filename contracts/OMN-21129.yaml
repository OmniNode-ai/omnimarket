---
schema_version: "1.0.0"
ticket_id: "OMN-21129"
title: "TC.6 transcript parser port: node_transcript_parse_compute and node_transcript_read_effect"
summary: "A pure, definition-B compute node parses one Claude Code transcript's JSONL text into typed turns (role, record uuid, parent uuid, session id, promptId, timestamp, character offsets of the record in the text, the record's text as the archive extractor read it, and the operator-typed flag by the P8a transcript-form rule). A pinned-mode effect node reads one transcript under ONEX_CONTEXT_REPLAY_ROOT, which has no default. Ported from the archive session extractor (extract_session_archive.py) without its SQLite writes or default directory."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-transcript-parse"
    statement: "Operator-typed prompts and their text match the archive extractor except records the P8a rule classifies synthetic; the compute performs no I/O and the effect reads only under ONEX_CONTEXT_REPLAY_ROOT."
    acceptance:
      - id: "AC1"
        statement: "AC1: on the boundary transcripts, the operator-typed prompts and offsets equal the old script's `extract_user_text` output for the same records, except records the P8a rule classifies synthetic, which the PR lists -- falsifier: an unlisted difference."
      - id: "AC2"
        statement: "AC2: the compute performs no I/O, and the effect reads only under `ONEX_CONTEXT_REPLAY_ROOT`, which has no default -- falsifier: a file read elsewhere in a sandboxed test, or a default path."
evidence_requirements:
  - kind: "tests"
    description: "AC1 and AC2 in the parse, read and contract tests of both nodes."
    command: "uv run pytest tests/nodes/node_transcript_parse_compute tests/nodes/node_transcript_read_effect -q -p no:randomly --no-cov"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn21129-ac1"
    description: "AC1: every user record's text equals the verbatim old extract_user_text oracle, record offsets slice each record line out of the text, and the only records with old text that are not operator-typed are the listed synthetic ones."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_transcript_parse_compute/test_parse.py -q -p no:randomly --no-cov -k 'old_extractor or offsets_slice or compact_summary_with or prompt_id_and_no_prompt_source'"
    binds_ac: ["AC1"]
  - id: "dod-omn21129-ac2"
    description: "AC2: the parse runs with every file-open path patched to raise; the read refuses an unset or empty root, an absolute path, .., a symlink out of the root and the root itself, with no file read."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_transcript_parse_compute/test_parse.py tests/nodes/node_transcript_read_effect/test_read.py -q -p no:randomly --no-cov -k 'no_io or names_no_path or unset_root or outside_the_root or absolute_path or default_handler or no_default_path'"
    binds_ac: ["AC2"]
  - id: "dod-omn21129-contracts"
    description: "Both node contracts declare their topics, resolve their handlers, are onex.nodes entry points and import no event envelope."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_transcript_parse_compute/test_contracts.py tests/nodes/node_transcript_read_effect/test_read.py -q -p no:randomly --no-cov -k 'contract or entry_point or envelope'"
  - id: "dod-omn21129-deploy-container-parse"
    description: "Hosted deploy probe. An ephemeral Python 3.12 container installs the read-only checkout into /tmp with uv run --frozen --no-dev, writes a two-record transcript under a temporary ONEX_CONTEXT_REPLAY_ROOT, reads it through the product effect, parses it through the product compute, and asserts one operator-typed prompt, one synthetic replacement record and a refused read with the root unset. It fails at the merge base, which has no such handlers. The hosted runner can run it; no lab route is required."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: |-
          docker run --rm --volume "$PWD:/workspace:ro" --workdir /workspace \
          --env UV_PROJECT_ENVIRONMENT=/tmp/omnimarket-venv \
          ghcr.io/astral-sh/uv:python3.12-bookworm-slim \
          uv run --frozen --no-dev python -c '
          import json, tempfile, pathlib
          from omnimarket.models.transcript_parse import ModelTranscriptParseRequest as P, ModelTranscriptReadRequest as Q
          from omnimarket.nodes.node_transcript_parse_compute.handlers.handler_transcript_parse import HandlerTranscriptParse as H
          from omnimarket.nodes.node_transcript_read_effect.handlers.handler_transcript_read import HandlerTranscriptRead as R
          d = pathlib.Path(tempfile.mkdtemp())
          rows = [{"type": "user", "uuid": "u1", "promptId": "p1", "promptSource": "terminal", "message": {"content": "hold the deploy"}}, {"type": "user", "uuid": "u2", "promptId": "p2", "message": {"content": "replacement"}}]
          (d / "t.jsonl").write_text("\n".join(json.dumps(r) for r in rows) + "\n")
          assert R(environ={}).handle(Q(relative_path="t.jsonl")).status.value == "refused_root_unset"
          got = R(environ={"ONEX_CONTEXT_REPLAY_ROOT": str(d)}).handle(Q(relative_path="t.jsonl"))
          assert got.status.value == "read", got
          res = H().handle(P(transcript_text=got.transcript_text))
          assert [t.operator_typed for t in res.turns] == [True, False], res
          assert res.turns[1].prompt_class.value == "synthetic_no_prompt_source", res
          print(got.sha256, res.operator_typed_count)'
