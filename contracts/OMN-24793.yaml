schema_version: 1.0.0
ticket_id: OMN-24793
title: Unblock omnimarket PR 5611 by binding the criteria of the OMN-24838 contract to hosted-runnable evidence
summary: Tests (Split 9/20) failed on omnimarket#5611 because contracts/OMN-24838.yaml bound AC1 and AC6 to local_done_gate items, which the hosted repo-evidence check refuses (test_every_repo_contract_binds_every_criterion and test_no_repo_contract_binds_a_local_done_gate_item in tests/ci/test_repo_evidence_caller_workflow.py). The two local_done_gate items stay, unbound; two new hosted items bind AC1 and AC6 to pytest evidence, and a new test reads contracts/OMN-18534.yaml for 0069 and for no 0068. No test is removed, skipped or loosened.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24793-unblock
  statement: Every required check-run of omnimarket#5611 reads success at the new head, with the Split 9 cause fixed in the contract binding and no test weakened.
  acceptance:
  - id: AC1
    statement: 'AC1: every required check-run of omnimarket#5611 at its new head reads success, read through the bus after the fix push -- falsifier: `onex scm pr-checks OmniNode-ai/omnimarket#5611` lists a required context that is not success at the new head'
  - id: AC2
    statement: 'AC2: the fix weakens no test and skips no check, so the diff from head 3c4d4b4cb49e to the new head removes no assertion and adds no skip, xfail or loosened threshold -- falsifier: `git diff 3c4d4b4cb49e <new head> -- tests/` shows a removed assert, a new skip or xfail marker'
  - id: AC3
    statement: 'AC3: the new head is on the PR as a comment starting `Lab: head=<new head>` and carries a lab test run that was red before the fix and green after -- falsifier: the PR has no comment whose first line is `Lab: head=<new head>`'
evidence_requirements:
- kind: tests
  description: The repo-evidence binding tests and the turn count tests pass.
  command: uv run --frozen pytest tests/ci/test_repo_evidence_caller_workflow.py tests/unit/delegation/test_terminal_turn_count_omn18534.py -q --no-cov -p no:randomly -p no:cacheprovider
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24793-ac1-bindings
  description: Hosted proxy for AC1. Every repo contract binds every criterion to a hosted-runnable item and none binds a local_done_gate item; this is the test pair that was red in Tests (Split 9/20) and reads green at the new head. The live check-run read is the unbound item below.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/ci/test_repo_evidence_caller_workflow.py -q --no-cov -p no:randomly -p no:cacheprovider
    cwd: .
- id: dod-omn24793-ac1-checks-read
  description: Only the local Done gate runs this unbound check; hosted CI cannot read its own required contexts at the new head.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: onex scm pr-checks OmniNode-ai/omnimarket#5611
    cwd: .
- id: dod-omn24793-ac2-no-weakened-test
  description: Hosted proxy for AC2. The turn count tests that carry the PR's assertions pass at the new head, including the added contract test; the diff read is the unbound item below.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/delegation/test_terminal_turn_count_omn18534.py tests/test_omn18534_turn_count_real_postgres.py -q --no-cov -p no:randomly -p no:cacheprovider
    cwd: .
- id: dod-omn24793-ac2-diff-read
  description: Only the local Done gate runs this unbound check. It fails when the diff of tests/ from the earlier head removes an assertion or adds a skip or xfail marker.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: '! git diff 3c4d4b4cb49e HEAD -- tests/ | grep -E "^-[[:space:]]*assert |^\+.*(pytest\.mark\.(skip|xfail)|pytest\.skip)"'
    cwd: .
- id: dod-omn24793-ac3-lab-red-green
  description: Hosted proxy for AC3. The same binding tests the lab run read red before the fix and green after pass at the new head; the PR comment that starts with the Lab head line is a PR write, not a file the hosted check can read.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/ci/test_repo_evidence_caller_workflow.py -q --no-cov -p no:randomly -p no:cacheprovider -k "binds or local_done_gate"
    cwd: .
- id: dod-omn24793-integration-proof
  description: On a lab host at the pushed head, runs the turn count unit tests and the real-Postgres twin, the runtime paths this PR changes, through the lab work runner. Hosted CI cannot reach the lab host, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24793 --kind test -- uv run --frozen pytest tests/unit/delegation/test_terminal_turn_count_omn18534.py tests/test_omn18534_turn_count_real_postgres.py -q --no-cov -p no:randomly -p no:cacheprovider
    cwd: .
