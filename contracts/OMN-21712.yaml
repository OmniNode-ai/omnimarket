- id: dod-omn21536-deploy-handlers-import
  description: 'Hosted deploy check: the overlay-source collaborator this change adds is served from the repository at the evaluated head (a fetch of the file at that commit, grepped for the class). No credentials, broker or lab service is required. This checks the pushed source, not a production rollout.'
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: command
    check_value: |
      set -eu;
      curl --fail --silent --show-error --location --max-time 60 "https://raw.githubusercontent.com/OmniNode-ai/omnimarket/$(git rev-parse HEAD)/src/omnimarket/handlers/overlay_source.py" | grep -q "class OverlaySource"
    cwd: .
  - check_type: test_passes
    check_value: uv run pytest tests/ci/test_repo_evidence_caller_workflow.py -q --no-cov --tb=line
    cwd: .
