schema_version: 1.0.0
ticket_id: OMN-21712
title: public handler methods stop mutating handler state, handler-shape slice 3 (omnimarket#4634 contract split)
summary: Slice 3 of the omnimarket handler-shape burn-down (omnimarket#4634). The handler-shape validator of omnibase_core reports a public method of a handler class, other than handle, that assigns to the handler (mutating_public_method). Twenty-six of those sat in twenty files. Each now keeps its state in a collaborator the handler is given (a quota-reading store, a source-control connection, an overlay source, a decision count, a dispatch session, a DLQ routing mark, an emit lifecycle), in a local of the call, or nowhere when nothing read it. The tests of every touched node follow the move. The acceptance items of this PR moved here from the shared contracts/OMN-21536.yaml.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn21712-own-contract
  statement: The public handler methods touched by omnimarket#4634 stop mutating handler state, and the PR's acceptance items live in this contract file, not in the shared contracts/OMN-21536.yaml.
  acceptance:
  - id: AC1
    statement: 'AC1: the public handler methods touched by omnimarket#4634 stop mutating handler state and the handler-shape count over them drops as the PR states -- falsifier: uv run pytest tests/unit -q over the touched modules plus the handler-shape checker re-run on the PR paths'
  - id: AC2
    statement: 'AC2: the PR''s acceptance items live in contracts/OMN-21712.yaml and the PR does not edit contracts/OMN-21536.yaml -- falsifier: git diff --stat origin/dev...HEAD on the PR head lists contracts/OMN-21712.yaml and not contracts/OMN-21536.yaml'
