schema_version: 1.0.0
ticket_id: OMN-23151
title: Each of the eleven topics consumed with no producer found has an error join test first, and the five loaded on dev have a golden one
summary: Piece 3 of the base-first plan (bus, runtime and seams), section 3.3 candidate topics. The seam reading lists the event topics a seam graph shows consumed with no producer, each with its consumer and graph evidence, and writes the list as one append-only seam row so the floor reads its age. A join gate in front of each listed topic's consumer refuses a typed upstream failure without starting the consumer. Each listed topic has an error join test and a golden join test on the in-memory bus and, selected with the kafka marker, on the dev bus.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23151-no-producer-topics
  statement: The seam reading lists topics consumed with no producer found, and each listed topic has an error join test and a golden join test.
  acceptance:
  - id: AC1
    statement: 'AC1: a list of the 11 topics with, for each, the consumer and the graph evidence is written by the seam reading and the floor shows its age -- falsifier: uv run pytest src/omnimarket/nodes/node_seam_reading_compute -q -k no_producer_topic_list'
  - id: AC2
    statement: 'AC2: each topic has an error join test in which the consumer receives a typed failure and does not start, and the test is red against a consumer that ignores it -- falsifier: uv run pytest tests/unit/nodes -q -k no_producer_topic_error_join'
  - id: AC3
    statement: 'AC3: each of the 5 topics loaded on dev has a golden join test that runs on the in-memory bus and the dev bus -- falsifier: uv run pytest tests/unit/nodes -q -k no_producer_topic_golden_join'
evidence_requirements:
- kind: tests
  description: No-producer topic list, error join and golden join tests on the in-memory bus.
  command: uv run --frozen pytest src/omnimarket/nodes/node_seam_reading_compute tests/unit/nodes/node_seam_reading_compute -q --no-cov -m "not kafka"
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23151-ac1
  description: The list handler names each event topic with a consumer and no producer, keeps off it a topic with a producer edge, a producer send or another source that spells it, reads UNKNOWN for a graph that read nothing, and the committed list's in-repo consumers still subscribe.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest src/omnimarket/nodes/node_seam_reading_compute -q --no-cov -k no_producer_topic_list
- id: dod-omn23151-ac2
  description: For each listed topic the typed failure enters the bus, the consumer is not started and the refusal names the upstream code; the same assertion fails against a consumer that ignores the failure.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/nodes -q --no-cov -k no_producer_topic_error_join -m "not kafka"
- id: dod-omn23151-ac3
  description: For each listed topic an event enters the bus, the consumer starts once on that payload and the chain ends with a started decision, on the in-memory bus here and on the dev bus under the kafka marker.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/nodes -q --no-cov -k no_producer_topic_golden_join -m "not kafka"
- id: dod-omn23151-integration-proof
  description: Run the seam reading suites and the dev-bus legs on a lab host at the pushed head. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23151 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest src/omnimarket/nodes/node_seam_reading_compute tests/unit/nodes/node_seam_reading_compute -q --no-cov
- id: dod-omn23151-durations-record
  description: The committed durations record covers the two test files added on this branch.
  source: manual
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/test_ci_shard_plan_omn19684.py -q -n 0 --no-cov
