schema_version: 1.0.0
ticket_id: OMN-20548
title: The hold, inbox and open-rulings readers answer from the bus-fed projection and name the source on a fault
summary: The moved reader node reports the seconds each read took on its injected clock (elapsed_s on the result and its READER line), and a new test module proves, for the inbox, pause-check and open-rulings readers, that the answer comes from the projection fixture while the ledger file is missing or poisoned, that the read is checked against a time budget, that a node fault is unreadable (exit 69, nothing printed) and never an empty answer, and that taking the reader out of moved_readers restores the caller's own file read.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn20548-reader-source-db
    statement: A moved reader answers from the projection, within a checkable budget, and a fault is never an empty answer.
    acceptance:
      - id: AC1
        statement: 'AC1: the inbox, pause-check and open-rulings readers answer from the projection fixture, each READER line carrying the seconds of the read as elapsed_s, while the ledger path variable names a missing or a poisoned file -- falsifier: uv run pytest tests/unit/nodes/node_work_ledger_reader_effect/test_reader_source_db_verb.py -q --no-cov -k source_db_verb_answers'
      - id: AC2
        statement: 'AC2: each read reports elapsed_s on the injected clock, is held to its budget constant, and a read at the measured latency is seen over the 1 s plan figure -- falsifier: uv run pytest tests/unit/nodes/node_work_ledger_reader_effect/test_reader_source_db_verb.py -q --no-cov -k budget'
      - id: AC3
        statement: 'AC3: a node fault exits 69 with nothing on stdout and source=none, and a reader not in moved_readers exits 3 and asks the node nothing (the flag back to file) -- falsifier: uv run pytest tests/unit/nodes/node_work_ledger_reader_effect/test_reader_source_db_verb.py -q --no-cov -k "node_fault or flip_rollback_file"'
evidence_requirements:
  - kind: tests
    description: The reader node's unit suite at the pushed head.
    command: uv run pytest tests/unit/nodes/node_work_ledger_reader_effect -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn20548-ac1
    description: The three readers answer from the projection with the file missing or poisoned, and each READER line carries elapsed_s. At the merge base the READER line has no elapsed_s, so this fails.
    source: manual
    binds_ac:
      - AC1
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/nodes/node_work_ledger_reader_effect/test_reader_source_db_verb.py -q --no-cov --tb=line -k source_db_verb_answers
        cwd: .
  - id: dod-omn20548-ac2
    description: elapsed_s is reported on the injected clock and held to the budget constants, with a positive control at the measured latency.
    source: manual
    binds_ac:
      - AC2
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/nodes/node_work_ledger_reader_effect/test_reader_source_db_verb.py -q --no-cov --tb=line -k budget
        cwd: .
  - id: dod-omn20548-ac3
    description: A node fault is unreadable and never empty, and the reader removed from moved_readers answers not-moved.
    source: manual
    binds_ac:
      - AC3
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/nodes/node_work_ledger_reader_effect/test_reader_source_db_verb.py -q --no-cov --tb=line -k "node_fault or flip_rollback_file"
        cwd: .
  - id: dod-omn20548-integration-proof
    description: "Run the focused reader tests on a lab host at the pushed head; the local Done gate runs this unbound check."
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-20548 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/nodes/node_work_ledger_reader_effect/test_reader_source_db_verb.py -q --no-cov
        cwd: .
