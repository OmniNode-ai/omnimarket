schema_version: 1.0.0
ticket_id: OMN-24662
title: 'omnimarket#6306 review round 2: provisional-row readers, real-Postgres fixtures, counters and contract checks'
summary: The second review of omnimarket#6306 at head 4b20c966d835 returned six findings. The three real-Postgres test files apply migration 0013 and pass the eleventh insert argument; the gap check, the history completeness read, the query reader and the parity split read a provisional ledger_seq row as unsequenced; provisional rows keep their arrival order across moves; the counters count a newly assigned number once and publish beside rows_upserted; sequence_assigned_sources must be a subset of sequence_required_sources; and the two ticket contract checks can fail.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24662-review-round-2
  statement: Each of the six findings of the second review of omnimarket#6306 is fixed in the branch or argued in a pull request comment with evidence.
  acceptance:
  - id: AC1
    statement: 'AC1: the three real-Postgres test files apply migration 0013, pass the 11th _INSERT_ROW argument and the four new statements in the schema rewrite, and all 17 tests pass on the lab -- falsifier: uv run pytest tests/test_work_ledger_real_postgres_write_path.py tests/test_work_ledger_history_postgres.py tests/test_work_ledger_point_query_postgres.py -q in omnimarket against real Postgres, red on head 4b20c966d835 and green on the new head'
  - id: AC2
    statement: 'AC2: the gap check, history completeness, the query reader and the parity split each treat a ledger_seq_provisional row as unsequenced, with one test each, including judge rows 1-3, judge 4 lost and a provisional row at 4 reading as not exact -- falsifier: uv run pytest tests/unit/nodes -k provisional -q in omnimarket'
  - id: AC3
    statement: 'AC3: provisional rows keep their relative arrival order across moves (two provisional rows, three judge rows) or the contract claim is dropped -- falsifier: uv run pytest tests/unit/nodes/node_projection_work_ledger -k "provisional and order" -q in omnimarket'
  - id: AC4
    statement: 'AC4: the counters count only a newly assigned number, count rows-in separately and publish beside rows_upserted, with tests for redelivery and the moved count -- falsifier: uv run pytest tests/unit/nodes/node_projection_work_ledger -k "redelivery or moved" -q in omnimarket'
  - id: AC5
    statement: 'AC5: the contract.yaml texts are corrected and a validator rejects a sequence_assigned_sources entry outside sequence_required_sources, with a test -- falsifier: uv run pytest tests/unit/nodes/node_projection_work_ledger -k assigned_sources -q in omnimarket'
  - id: AC6
    statement: 'AC6: the check of the OMN-24644 contract AC2 and the docker check of the OMN-24634 contract exit non-zero when unmet, AC5''s row-count half has a check, and a pull request comment answers findings 1-6 by number -- falsifier: run each contract check command by hand with the criterion unmet and with docker absent and read a non-zero exit, then onex scm pr-view reads the comment list'
evidence_requirements:
- kind: tests
  description: The node's focused unit tests.
  command: uv run pytest tests/unit/nodes/node_projection_work_ledger -q -n 0 --no-cov -p no:cacheprovider
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24662-real-postgres
  description: 'AC1: the three real-Postgres files run against a real Postgres and every test passes with none skipped; the hosted runner has no database for the unbound environment, so only the local Done gate runs it.'
  source: manual
  binds_ac:
  - AC1
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: "out=$(uv run pytest tests/test_work_ledger_real_postgres_write_path.py tests/test_work_ledger_history_postgres.py tests/test_work_ledger_point_query_postgres.py -q -n 0 --no-cov -p no:cacheprovider 2>&1); printf '%s\\n' \"$out\" | tail -3; printf '%s\\n' \"$out\" | tail -1 | grep -Eq '^[0-9]+ passed' && ! printf '%s\\n' \"$out\" | tail -1 | grep -Eq 'skipped|failed|error'"
    cwd: ${OMNI_HOME}/omnimarket
- id: dod-omn24662-provisional-readers
  description: 'AC2: the gap check, the history read, the query reader and the parity split each read a provisional row as unsequenced.'
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/nodes -k provisional -q -n 0 --no-cov -p no:cacheprovider
    cwd: ${OMNI_HOME}/omnimarket
- id: dod-omn24662-provisional-order
  description: 'AC3: two provisional rows keep their order across three judge rows.'
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/nodes/node_projection_work_ledger -k "provisional and order" -q -n 0 --no-cov -p no:cacheprovider
    cwd: ${OMNI_HOME}/omnimarket
- id: dod-omn24662-counters
  description: 'AC4: a redelivery is counted apart from a newly assigned number, rows-in is its own count, and the moved count is read.'
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/nodes/node_projection_work_ledger -k "redelivery or moved" -q -n 0 --no-cov -p no:cacheprovider
    cwd: ${OMNI_HOME}/omnimarket
- id: dod-omn24662-assigned-sources
  description: 'AC5: the config model rejects a sequence_assigned_sources entry outside sequence_required_sources.'
  source: manual
  binds_ac:
  - AC5
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/nodes/node_projection_work_ledger -k assigned_sources -q -n 0 --no-cov -p no:cacheprovider
    cwd: ${OMNI_HOME}/omnimarket
- id: dod-omn24662-contract-checks
  description: 'AC6: each ticket contract check exits non-zero when its criterion is unmet and zero when met, run in a shell with stand-in docker, psql and onex commands.'
  source: manual
  binds_ac:
  - AC6
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/nodes/node_projection_work_ledger/test_contract_checks_can_fail.py -q -n 0 --no-cov -p no:cacheprovider
    cwd: ${OMNI_HOME}/omnimarket
- id: dod-omn24662-integration-proof
  description: 'Run the focused node tests on a lab host at the pushed head. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check. It binds no acceptance criterion.'
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24662 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/nodes/node_projection_work_ledger -q -n 0 --no-cov
    cwd: .
