---
schema_version: "1.0.0"
ticket_id: "OMN-21624"
title: "The duplicate guard no longer refuses pull requests that overlap only in generated files, so plan pull requests can open together"
summary: "Every plan pull request in a documents repository regenerates the status-count rows of a rendered index, so the duplicate guard refused each new plan pull request on seven unrelated open ones. The node contract now holds the generic paths as data (moved out of the handler) and the guard takes a per-repository list of generated paths in its request, read by the snapshot effect from the node's deployment overlay, so no private repository is named in this repository. Overlap confined to those files is not duplication; overlap in an authored file still is."
is_seam_ticket: false
interface_change: true
interfaces_touched:
  - "public_api"
requirements:
  - id: "req-omn21624-generated-paths"
    statement: |-
      Pull requests that overlap only in files the deployment declares generated, or in the generic files every change touches, are not duplicates of each other; pull requests that overlap in an authored file still are, and a repository that does not declare the file still has it counted.
    acceptance:
      - id: "AC1"
        statement: "AC1: the generic paths are data in the node contract and the handler source holds no file list -- falsifier: uv run pytest tests/nodes/node_pr_duplicate_guard_compute -q fails the shipped-generic-files case or the no-file-list case"
      - id: "AC2"
        statement: "AC2: two plan pull requests that change only the regenerated index rows plus different plan files pass as clear, end to end through the scm check with a real overlay file -- falsifier: uv run pytest tests/unit/handlers/scm/test_scm_duplicate_guard_generated_paths.py fails the clear case"
      - id: "AC3"
        statement: "AC3: two pull requests that edit or add the same plan file are still refused, a repository that does not declare the index still has its rows counted, and an unreadable overlay checks nothing -- falsifier: the same files pass with the overlap check removed for authored files"
evidence_requirements:
  - kind: "tests"
    description: "The planted cases of 2026-10-30: plan pull requests overlapping only in the regenerated index rows pass; the same plan file edited or added twice is refused; the undeclared repository is refused."
    command: "uv run pytest tests/nodes/node_pr_duplicate_guard_compute tests/unit/handlers/scm/test_scm_duplicate_guard_generated_paths.py tests/unit/handlers/scm/test_scm_duplicate_guard.py -q --no-cov"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn21624-guard"
    description: "The guard's planted cases pass."
    source: "manual"
    binds_ac: ["AC1", "AC3"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_pr_duplicate_guard_compute -q -n 0 --no-cov"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn21624-scm-end-to-end"
    description: "The scm check against real git checkouts, watcher state and overlay file."
    source: "manual"
    binds_ac: ["AC2", "AC3"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/handlers/scm/test_scm_duplicate_guard_generated_paths.py -q -n 0 --no-cov"
        cwd: "${OMNI_HOME}/omnimarket"
