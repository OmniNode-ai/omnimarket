schema_version: 1.0.0
ticket_id: OMN-20017
title: 'Context injection A/B: an exact paired comparison of two arms over the fixed eval set with a negative control'
summary: >-
  Adds node_delegation_arm_compare_compute: given two arms' per-task outcomes at one size band and attempt budget (and optionally a negative-control pair), it pairs them by task key, calls the exact paired test already in ranges/compare.py, and answers ModelComparisonResult with EnumComparisonVerdict on the answer topic. Margin, confidence and power come from the overlay key delegation.capability_map.line, read by the node itself. A gain that the negative control reproduces is not counted. A malformed request ends as a typed failure, never a verdict. No second statistical test and no second verdict enum.
is_seam_ticket: true
interface_change: false
interfaces_touched: []
context:
  ac_binding_provenance:
