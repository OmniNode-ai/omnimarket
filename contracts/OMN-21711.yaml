---
schema_version: 1.0.0
ticket_id: OMN-21711
title: the 19 handler CLI mains move out of handler modules into node runtime modules (omnimarket#4635 contract split)
summary: Slice 2 of the omnimarket handler-shape burn-down (omnimarket#4635). The handler-shape validator of omnibase_core reports a handler module that holds module functions and no handler class (module_function_handler). Nineteen of those were command line entries, a main and its helpers in a handler_*_cli module. Each moves beside its node's contract.yaml as a runtime_*.py module, the location the canonical-file-shape rule cli_entry_outside_node names for a command line entry, and its project.scripts entry, contract, tests and burn-down line follow. The overlay check, which read files and the environment inside a compute node, gets an effect node for the reading and keeps its compute node pure. The acceptance items of this PR moved here from the shared contracts/OMN-21536.yaml.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn21711-own-contract
  statement: The 19 handler CLI mains of omnimarket#4635 live in node runtime modules, and the PR's acceptance items live in this contract file, not in the shared contracts/OMN-21536.yaml.
  acceptance:
  - id: AC1
    statement: 'AC1: the 19 handler CLI mains of omnimarket#4635 live in node runtime modules and the handler-shape count over them drops as the PR states -- falsifier: env PYTHONDONTWRITEBYTECODE=1 uv run pytest tests/nodes/node_landing_tlc_receipt_effect/test_landing_tlc_receipt_effect.py tests/nodes/node_automation_liveness_overlay_check_effect/test_overlay_check_run.py -q --no-cov, together with the moved-module and file-shape checks below'
  - id: AC2
    statement: 'AC2: the PR''s acceptance items live in contracts/OMN-21711.yaml and the PR does not edit contracts/OMN-21536.yaml -- falsifier: git diff --stat origin/dev...HEAD on the PR head lists contracts/OMN-21711.yaml and not contracts/OMN-21536.yaml'
evidence_requirements:
- kind: tests
  description: The tests of the nodes whose command line entry moved, run on a lab host at the pushed head.
  command: uv run pytest tests/nodes/node_automation_liveness_overlay_check_effect/test_overlay_check_run.py tests/nodes/node_automation_liveness_overlay_check_compute tests/nodes/node_architecture_discovery_orchestrator tests/nodes/node_claude_code_hook_adapter_effect tests/nodes/node_friction_synthesis_effect tests/nodes/node_host_thermal_observe_effect tests/nodes/node_hourly_tick_effect tests/nodes/node_lab_disk_growth_effect tests/nodes/node_lab_fill_receipt_table_compute tests/nodes/node_landing_tlc_receipt_effect tests/nodes/node_linear_ticket_write_effect tests/nodes/node_operator_access_mode_effect tests/nodes/node_rsd_migration_orchestrator tests/nodes/node_runtime_deploy_effect tests/test_session_capability_digest.py tests/test_golden_chain_patch_apply_dispatch_effect.py -q --no-cov --tb=line
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn21536-ac3-no-handler-main
  description: AC1 checks that the nineteen old module paths are gone and that each runtime_*.py module that replaced one defines main.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: command
    check_value: |
      set -eu;
      test -z "$(git ls-files src | grep -E 'handlers/handler_(automation_liveness_overlay_check_cli|runtime_coverage_cli|architecture_discovery_cli|claude_code_hook_cli|compaction_latency_cli|friction_synthesis_cli|host_thermal_cli|hourly_tick_cli|lab_disk_growth_cli|lab_fill_receipt_table_cli|lab_secret_store_override_cli|landing_tlc_receipt_cli|operator_hook_cli|capture_cli|patch_apply_dispatch_cli|rsd_migration_cli|runtime_deploy_cli|session_capability_digest_cli|lab_proof)\.py$')";
      test "$(git ls-files src | grep -E '/runtime_[a-z_]*(_cli|lab_proof)\.py$' | xargs grep -lE '^def main\(' | wc -l)" -ge 19
    cwd: ${OMNI_HOME}/omnimarket
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_linear_ticket_write_effect/test_lab_proof.py tests/nodes/node_operator_access_mode_effect/test_operator_access_mode.py -q --no-cov --tb=line
    cwd: ${OMNI_HOME}/omnimarket
