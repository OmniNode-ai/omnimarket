schema_version: "1.0.0"
ticket_id: OMN-23648
title: "The code graph answers lookups from a versioned projection kept current by the merge event, so agents find files by asking it instead of searching text"
summary: >-
  First slice of the ticket: the code graph node gains a lookup of five questions (where a symbol is defined, who
  imports a file, which files a change reaches, the nearest exemplar node of an archetype, whether a model of the same
  field shape exists) answered from a stored version of one repository's graph, keyed by repository and commit. A lookup
  as of a commit reads that commit's version; a commit with no stored version is a typed not-found naming the nearest
  stored version; versions past the overlay's retention are pruned. The refresh on merge, the stored projection, the
  event chain and the two consumers are later slices of the same ticket.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn23648-lookup-and-versions
    statement: The code graph node answers the five lookup questions from versions keyed by repository and commit.
    acceptance:
      - id: AC1
        statement: 'AC1: over a fixture graph each of the five questions returns its expected answer, including a model with a different name and the same field shape for the same-shape question -- falsifier: uv run pytest tests/nodes/node_code_graph_effect/test_code_graph_lookup.py -q'
      - id: AC2
        statement: 'AC2: failing control: the injected break "match shapes by class name" turns the same-shape test red, and the injected break "answer from the head when asked as of a commit" turns the version test red -- falsifier: uv run pytest tests/nodes/node_code_graph_effect/test_code_graph_lookup.py tests/nodes/node_code_graph_effect/test_code_graph_versions.py -q -k break'
      - id: AC3
        statement: 'AC3: a lookup as of a stored commit returns that version''s answer, a commit with no stored version returns a typed not-found naming the nearest stored version, and versions past the overlay''s retention are pruned -- falsifier: uv run pytest tests/nodes/node_code_graph_effect/test_code_graph_versions.py -q'
evidence_requirements:
  - kind: tests
    description: The lookup, version and runtime tests of the code graph node.
    command: uv run --frozen pytest tests/nodes/node_code_graph_effect/test_code_graph_lookup.py tests/nodes/node_code_graph_effect/test_code_graph_versions.py tests/nodes/node_code_graph_effect/test_code_graph_lookup_runtime.py -q --no-cov
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-omn23648-lookup
    description: Each of the five questions returns its expected answer over the fixture graph, the same-shape question included.
    source: manual
    execution_scope: hosted_and_local
    binds_ac: [AC1]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/nodes/node_code_graph_effect/test_code_graph_lookup.py -q --no-cov
        cwd: .
  - id: dod-omn23648-breaks
    description: The two injected breaks turn their tests red, each beside a control that passes without the break.
    source: manual
    execution_scope: hosted_and_local
    binds_ac: [AC2]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/nodes/node_code_graph_effect/test_code_graph_lookup.py tests/nodes/node_code_graph_effect/test_code_graph_versions.py -q --no-cov -k break
        cwd: .
  - id: dod-omn23648-versions
    description: As-of answers, the typed not-found with the nearest stored version, and retention pruning.
    source: manual
    execution_scope: hosted_and_local
    binds_ac: [AC3]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/nodes/node_code_graph_effect/test_code_graph_versions.py -q --no-cov
        cwd: .
  - id: dod-omn23648-integration-proof
    description: The lookup and version tests run at the pushed head on a lab host, including the runtime test that binds the lookup handler to git clones through the overlay; hosted CI cannot reach the lab host, so only the local Done gate runs this unbound check, and the read is in the pull request comment that names the head.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: 'onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23648 --kind test -- uv run --frozen pytest tests/nodes/node_code_graph_effect/test_code_graph_lookup_runtime.py -q --no-cov'
        cwd: .
