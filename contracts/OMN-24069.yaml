schema_version: 1.0.0
ticket_id: OMN-24069
title: The merge alarm hands nothing back to the result publisher
summary: The five typed entries of node_merge_override_alarm_effect returned ModelMergeOverrideResult, which no published_events entry maps, so the runtime kernel published each result to the first entry of publish_topics, the landing request command topic (onex.cmd.omnimarket.pr-landing-github-requested.v1). node_pr_landing_github_effect failed each as a malformed request and answered on its completed topic, which the alarm consumes and dead-lettered (8761 records on the dev broker at 2026-11-13T03:22Z; 295 of the latest 400 request-topic records were alarm results). The node publishes its own verdict, finding, read request and chat command, so the entries now return None (the runtime's None-result opt-out) and the contract lists the node's own verdict topic first, so a returned unmapped model can no longer default to another node's command topic. A new result topic was refused by the broker permission coverage gate (no repository carries the dev runtime login to grant it) and is not used.
is_seam_ticket: true
interface_change: true
interfaces_touched:
- topics
requirements:
- id: req-omn24069-entries-return-no-result
  statement: The merge override alarm's entries hand nothing back to the runtime's result publisher and its fallback publish topic is no other node's command topic.
  acceptance:
  - id: AC1
    statement: 'AC1: the merge alarm''s five typed entries hand nothing back to the runtime''s result publisher, because the node publishes its own verdict, finding, read request and chat command -- falsifier: run tests/unit/nodes/node_merge_override_alarm_effect/test_entries_return_no_result.py against the base entries; the returns-nothing test must fail'
  - id: AC2
    statement: 'AC2: the first publish topic of the alarm''s contract is its own verdict topic, not another node''s command topic, so a returned model that is not mapped cannot reach a landing request line -- falsifier: put the landing request topic first in the contract''s publish topics in that test; it must fail'
  - id: AC3
    statement: 'AC3: the golden chain and error chain tests of the alarm still pass, the verdict, finding, read request and chat command still being published by the node itself -- falsifier: stop the node publishing its verdict in the golden chain through the entries; that test must fail'
  - id: AC4
    statement: 'AC4: integrated: after the dev runtime is rebuilt on a revision carrying AC1, the newest records of the landing request topic on the dev broker hold no alarm handling note and the alarm''s dead-letter topic high watermark stops rising over ten minutes -- falsifier: read both topics read only on the dev broker after the roll; one alarm handling note on the request topic, or a rising dead-letter count, fails this criterion'
evidence_requirements:
- kind: tests
  description: The merge override alarm tests pass at the pushed head.
  command: uv run pytest tests/unit/nodes/node_merge_override_alarm_effect -q -n 0 --no-cov -p no:cacheprovider
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
