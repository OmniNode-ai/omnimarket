schema_version: 1.0.0
ticket_id: OMN-23193
title: The Infisical secret-store transport refuses a plain http address to a host the overlay has not allowed
summary: The overlay model accepted any http or https address and the Infisical adapter built its login, Bearer token and create requests from it with no scheme or host check, while the captured-secret store refused plain http to a remote host with a private copy of the rule. The rule now lives once in models/secret_store/plain_http_rule.py. A plain-http address is accepted only for loopback or a host named in the overlay key plain_http_hosts (names, addresses or CIDR networks); the adapter refuses at construction before any request, the secret-store node answers misconfigured, and the captured-secret store and both overlay models use the same rule.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23193-plain-http-rule
  statement: A secret-store address over plain http reaches only loopback or a host the overlay names, decided by one shared rule.
  acceptance:
  - id: AC1
    statement: 'AC1: a test builds the Infisical adapter with an http address to a non-allowed remote host and expects a typed refusal before any request is made; it fails on the code at omnimarket dev 566d7ead09 -- falsifier: uv run pytest tests/unit/nodes/test_golden_chain_secret_store_effect.py -q -k plain_http, red on the base with the test copied in and green on the fix branch'
  - id: AC2
    statement: 'AC2: a test shows an https address and an allowed loopback http address still work -- falsifier: uv run pytest tests/unit/nodes/test_golden_chain_secret_store_effect.py -q -k "https or loopback"'
  - id: AC3
    statement: 'AC3: the overlay model and the captured-secret store use one shared host rule, not two copies -- falsifier: uv run pytest tests/unit/nodes/test_golden_chain_secret_store_effect.py tests/unit/nodes/test_golden_chain_captured_secret_store_effect.py -q'
evidence_requirements:
- kind: tests
  description: The adapter refusal, the allowed addresses, the bus error chain and the captured-store parity tests.
  command: uv run pytest tests/unit/nodes/test_golden_chain_secret_store_effect.py tests/unit/nodes/test_golden_chain_captured_secret_store_effect.py -q
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23193-ac1
  description: The plain-http refusal tests pass on the branch and fail on the base with the test file copied in.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/nodes/test_golden_chain_secret_store_effect.py -q -k plain_http
- id: dod-omn23193-ac2
  description: The https and loopback addresses still work, and a plain-http host the overlay names works (this last test fails on the base, which has no plain_http_hosts key).
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/nodes/test_golden_chain_secret_store_effect.py -q -k "test_https_and_loopback_addresses_still_work or test_plain_http_to_a_host_the_overlay_names_works"
- id: dod-omn23193-ac3
  description: Both golden chains pass, including the test that the captured store and the adapter hold the one shared function and no private copy.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/nodes/test_golden_chain_secret_store_effect.py tests/unit/nodes/test_golden_chain_captured_secret_store_effect.py -q
- id: dod-omn23193-integration-proof
  description: Run the secret-store and captured-secret golden chains on a lab host at the pushed head. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23193 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/nodes/test_golden_chain_secret_store_effect.py tests/unit/nodes/test_golden_chain_captured_secret_store_effect.py -q --no-cov
