schema_version: 1.0.0
ticket_id: OMN-23032
title: Every lane and host reads git and pull request state only from our read-only mirrors, which repair themselves
summary: The canonical clone dirty-converge tick returns a clone found detached or parked on a lane branch to its tracking branch, and converges a clone found dirty, ahead or diverged, on the tick after the one that found it; its contract bounds drop to one host timer period.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23032-mirror-self-repair
  statement: A canonical clone the sync refuses for a detached HEAD, a lane branch, tracked changes or local commits is repaired by the next timer tick under the contract's own bounds, with no overlay value and no lane action.
  acceptance:
  - id: AC1
    statement: 'AC1: a canonical clone found detached, dirty or behind is repaired by the sync on its next run, with no lane action needed -- falsifier: uv run pytest of the sync''s tests with a planted detached clone'
evidence_requirements:
- kind: tests
  description: The dirty-converge node tests pass, including the planted detached, lane-branch, local-commit and dirty clones repaired one timer period later
  command: uv run --frozen pytest tests/unit/clone_dirty_converge -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23032-next-run-repair
  description: Runs the dirty-converge node tests; the next-run tests fail with the contract bounds of the base branch (1800 s and 14400 s).
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/clone_dirty_converge -q --no-cov
    cwd: .
- id: dod-omn23032-integration-proof
  description: Run the next-run repair tests on a lab host at the pushed head against that host's real canonical clone sync engine and converge script. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23032 --kind test -- sh -c 'ONEX_TEST_OMNICLAUDE_ROOT="$OMNI_HOME/omniclaude" PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/clone_dirty_converge -k next_run -q --no-cov'
    cwd: .
