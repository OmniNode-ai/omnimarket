schema_version: 1.0.0
ticket_id: OMN-23496
title: Add the missing floor input list entry for the J7 join step
summary: The floor's input inventory (floor_inputs.yaml) must name every publish step and every path the floor nodes' contracts declare. Two merged changes added a step and a path without a row, so two tests of the inventory fail on the dev head and on every change that merges dev. This change adds the two rows (the join_j7 step from OMN-23420 and the route-reads file from OMN-23381). No check, bound or test is changed.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23496-inventory-rows
  statement: The inventory holds a row for the join_j7 publish step and for the route-reads file, so the inventory tests pass on the dev head.
  acceptance:
  - id: AC1
    statement: 'AC1: floor_inputs.yaml has a row naming join_j7 under steps, with a replacement node and topic and a ticket slug -- falsifier: pytest tests/nodes/node_factory_floor_publish_effect/test_floor_input_inventory.py -q fails on the dev head without the row'
  - id: AC2
    statement: 'AC2: removing the row again makes test_every_step_the_publish_runs_has_a_row fail with join_j7 named -- falsifier: the same file run against the dev head without the row shows the named failure'
  - id: AC3
    statement: 'AC3: integrated: the factory floor publish run on the dev runtime lists join_j7 among its steps and the inventory test passes on the running revision -- falsifier: the publish status record on the dev runtime does not list join_j7 or the test fails on that revision'
evidence_requirements:
- kind: tests
  description: The inventory test file at the pushed head. On the dev head without the rows, test_every_step_the_publish_runs_has_a_row fails with ['join_j7'], test_named_break_a_step_with_no_row_fails_the_inventory fails with ['join_j7', 'a_new_step_nobody_listed'] and test_every_path_the_floor_contracts_declare_is_in_a_row fails naming route-reads.json.
  command: uv run --frozen pytest tests/nodes/node_factory_floor_publish_effect/test_floor_input_inventory.py -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23496-ac1-inventory-rows
  description: The inventory test file passes at the pushed head (5 tests). The file at the merge base fails two or three of them, so the command fails there.
  source: manual
  binds_ac:
  - AC1
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_factory_floor_publish_effect/test_floor_input_inventory.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn23496-ac1-row-citations
  description: The test that the join_j7 and route-reads rows exist and cite OMN-23499 and OMN-23500 passes at the pushed head. The rows are absent at the merge base, so it fails there.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_factory_floor_publish_effect/test_floor_input_inventory.py -k the_j7_step_and_the_route_reads_file -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn23496-integration-proof
  description: The pushed head ran the inventory test file on a lab host through the lab work runner and exited 0. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  binds_ac:
  - AC3
  checks:
  - check_type: command
    check_value: 'env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23496 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_factory_floor_publish_effect/test_floor_input_inventory.py -q --no-cov'
    cwd: .
