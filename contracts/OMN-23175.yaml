- id: dod-omn23175-ac1-inputs
  description: Runs the inputs schema tests. The committed inputs parse into the typed model, reject an unknown key, ask for the synthetic run with its source surface and for the organic control with neither, and the contract's lane block names every total and every run field.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_delegation_scenario_r8_effect/test_r8_inputs.py -q --no-cov
    cwd: .
- id: dod-omn23175-ac2-chains
  description: Runs the golden and error chain tests. The in-memory lane model and the real HTTP backend with an injected tenant API both show the scenario green; a lane that counts a synthetic run, a synthetic row labelled organic, a synthetic run missing from Runs, an organic control with no values, a response without a declared key, a delegate command that names no correlation id, unreadable inputs, a failing ledger append and a failing bus emit each turn the run red for their own reason.
  source: manual
  binds_ac:
  - AC2
  checks:
