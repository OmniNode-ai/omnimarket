schema_version: 1.0.0
ticket_id: OMN-23175
title: Scenario R8 runs every six hours on the dev lane as an omnimarket node, a synthetic run is labelled and listed but never counted in a probe tenant's totals
summary: The readiness plan put the R8 producer in a workflow of the cloud repository. The scenario's logic lives in omnimarket as node_delegation_scenario_r8_effect, scheduled every six hours by its own timer, and the cloud repository's workflow delegation-readiness-r8-synthetic-not-counted.yml runs the node so the board reads the scenario's scheduled runs. In a probe tenant only this scenario uses, one run reads the totals, sends one synthetic run (traffic class synthetic, source surface readiness_probe) and one organic control, waits until the tenant's Runs list holds both correlation ids and reads the totals again. It holds when the synthetic row is labelled synthetic and listed and the run, token, spend and savings totals rose by exactly the organic run's values. A lane that counts a synthetic run is refused. It writes one ledger STATUS row (the row the green-days reading counts) and emits the result on the bus.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23175-r8-synthetic-not-counted
  statement: The synthetic row is labelled synthetic and listed on Runs, and the run, token, spend and savings totals rose by exactly the organic control's values.
  acceptance:
  - id: AC1
    statement: 'AC1: the committed R8 inputs pass their own schema test -- falsifier: `uv run pytest tests/nodes/node_delegation_scenario_r8_effect/test_r8_inputs.py -q`'
  - id: AC2
    statement: 'AC2: a run against a lane that counts a synthetic run exits red for that reason and a run against a lane that keeps it out of the totals shows the expected colour -- falsifier: `uv run pytest tests/nodes/node_delegation_scenario_r8_effect/test_golden_chain_scenario_r8_effect.py -q`'
evidence_requirements:
- kind: tests
  description: The R8 inputs schema tests and the golden and error chain tests pass.
  command: uv run --frozen pytest tests/nodes/node_delegation_scenario_r8_effect -q --no-cov
emergency_bypass:
