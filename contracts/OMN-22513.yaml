schema_version: 1.0.0
ticket_id: OMN-22513
title: Placement wait returns a typed outcome
summary: The criteria of omnimarket#5120, moved unchanged from the shared contract of OMN-19998.
is_seam_ticket: false
interface_change: true
interfaces_touched:
- events
- public_api
requirements:
- id: req-omn19998-release-asset-retry
  statement: Public dashboard release downloads recover from transient gateway errors within a fixed attempt bound.
  acceptance:
  - id: AC13
    statement: 'AC13: HTTP 502, 503 and 504 permit at most three GET attempts with 0.5 and 1 second delays; other HTTP, network and local write failures are refused immediately, HTTPS remains required, and downloaded dashboard bytes still match the repository pin. -- falsifier: env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/test_github_release_asset_retry.py tests/projection/test_dashboard_bundle_failure_omn20705.py -q --no-cov -p no:randomly'
- id: req-omn19998-placement-wait-outcome
  statement: The detached parent's placement read returns a typed outcome while preserving the existing human output and exit codes.
  acceptance:
  - id: AC12
    statement: 'AC12: a placing receipt at the 30-second wait budget returns placing with error=false and exit 3; placed, refused and crashed reads retain their exit codes; the public node adapter and typed handler emit one JSON result -- falsifier: uv run --frozen pytest tests/nodes/node_lane_placement_recovery_effect/test_placement_wait_result.py -q --no-cov -n 0 -p no:randomly'
evidence_requirements:
- kind: tests
  description: Placement wait returns a typed outcome
  command: env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/test_github_release_asset_retry.py tests/projection/test_dashboard_bundle_failure_omn20705.py -q --no-cov -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn19998-release-asset-retry-deploy
  description: Hosted smoke exercises the production downloader with transient and persistent gateway responses, permanent failures and local write errors, then checks the existing dashboard checksum refusal and verified-page serving path. No lab service is needed.
  source: manual
  binds_ac:
  - AC13
  checks:
  - check_type: test_passes
    check_value: env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/test_github_release_asset_retry.py tests/projection/test_dashboard_bundle_failure_omn20705.py -q --no-cov -p no:randomly
    cwd: .
- id: dod-omn19998-release-asset-integration-proof
  description: On a lab host, fetch the pinned release through the production bundle loader, verify its digest and index, and compare the public checksum sidecar to the repository pin. No cached bundle is reused.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: "env COMPOSE_PROJECT_NAME=landing-l27541-lab PYTHONDONTWRITEBYTECODE=1 UV_PYTHON=3.12 uv run --frozen python - <<'PY'\nimport shlex\nimport subprocess\nfrom pathlib import Path\nfrom tempfile import TemporaryDirectory\nfrom omnimarket.nodes.node_local_dashboard_serve_effect.bundle import ensure_bundle, load_pin\n\npin = load_pin()\nsidecar = subprocess.check_output(\n    [*shlex.split(\"curl --fail --silent --show-error --location\"), f\"{pin.url}.sha256\"],\n    text=True,\n    timeout=60,\n)\nassert sidecar.split() == [pin.sha256, pin.asset], sidecar\nwith TemporaryDirectory() as cache:\n    root = ensure_bundle(pin, cache_root=Path(cache))\n    assert (root / \"index.html\").is_file(), root\nprint(f\"dashboard_bundle_lab_readback=PASS version={pin.version} sha256={pin.sha256} asset={pin.asset}\")\nPY\n"
    cwd: .
- id: dod-omn19998-placement-wait-outcome
  description: Replay the recorded placing receipt at a 30-second budget through the public node adapter and typed handler, including terminal outcomes and legacy exit codes. Collection fails at the merge base because the typed placement model is absent. This scoped placement proof does not assert the original controller rule, lock, acting gate or launchd timer criteria.
  source: manual
  binds_ac:
  - AC12
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_lane_placement_recovery_effect/test_placement_wait_result.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn19998-placement-wait-deploy
  description: Hosted wiring smoke exercises the detached host caller's public node adapter with a real receipt file and observes its typed JSON line. The clock and liveness ports are controlled. No live placement, production endpoint, broker or host unit is required or asserted.
  source: manual
  binds_ac:
  - AC12
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_lane_placement_recovery_effect/test_placement_wait_result.py -q --no-cov -n 0 -p no:randomly -k recorded_placing_after_30s
    cwd: .
