schema_version: 1.0.0
ticket_id: OMN-23543
title: Host reconcile scan skips generated Python environments
summary: The retirement scan of node_host_reconcile_effect walks scripts/, systemd/, launchd/, deploy/ and src/ of every checkout and refuses any symlink. A uv or venv environment under scripts/ (deploy-agent/.venv/lib64 -> lib) made the hourly unit exit 3 on h051. The node contract now declares generated_directory_markers (pyvenv.cfg); a directory holding a marker is generated, not declared input, and is not walked. Every other symlink is still refused.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23543-generated-environment-not-input
  statement: The retirement scan does not walk a directory that holds a contract-declared generated-environment marker, and still refuses a symlink anywhere else.
  acceptance:
  - id: AC1
    statement: 'AC1: the retirement scan returns no finding and raises nothing for a generated environment holding a lib64 link under scripts/ -- falsifier: pytest tests/test_retired_repository_reconcile.py -k "generated_virtualenv" -q'
  - id: AC2
    statement: 'AC2: a link next to the environment, or in a directory with no environment marker, is still refused -- falsifier: pytest tests/test_retired_repository_reconcile.py -k "still_refused" -q'
  - id: AC3
    statement: 'AC3: the host reconcile handler run over a workspace with such an environment exits 0, and with a retired target beside it exits 2 -- falsifier: pytest tests/test_retired_repository_reconcile.py -k "virtualenv" -q'
  - id: AC4
    statement: 'AC4: integrated: after the change is installed on the lab computer h051 through the host installer, the unit onex-host-reconcile prints no lib64 refusal on its next run -- falsifier: journalctl --user -u onex-host-reconcile and the unit''s out log still contain the line "deploy-agent/.venv/lib64: symbolic registry input is refused"'
evidence_requirements:
- kind: tests
  description: The scan and handler tests, with the unmarked-environment and sibling-symlink refusals as failing controls
  command: uv run --frozen pytest tests/test_retired_repository_reconcile.py -q --no-cov -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23543-generated-environment-skipped
  description: A fixture environment (pyvenv.cfg, lib, lib64 -> lib) under scripts/ yields no finding and no error. Against the merge-base scan the same fixture raises the symbolic-input refusal, so the selection fails there. The same selection holds the two refusal controls (a link beside the environment, an environment without the marker), which must keep raising.
  source: manual
  binds_ac:
  - AC1
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/test_retired_repository_reconcile.py -q --no-cov -p no:randomly -k "generated_virtualenv or still_refused"
    cwd: .
- id: dod-omn23543-handler-chain
  description: Golden and error chain through the host reconcile handler on a workspace holding the environment, plus the contract and policy model agreeing on the declared marker. These are the code paths the h051 unit runs; the unit's own next run is recorded in the pull request's Lab line and in the lab item below.
  source: manual
  binds_ac:
  - AC3
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/test_retired_repository_reconcile.py -q --no-cov -p no:randomly -k "virtualenv or generated_environment_marker"
    cwd: .
- id: dod-omn23543-integration-proof-lab
  description: Runs the retirement tests at the pushed head on a lab host through the lab work runner. Hosted CI cannot reach the lab runner, so only the local Done gate runs this unbound item; the host unit's next run on h051 is recorded in the pull request's Lab line.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: 'env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23543 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/test_retired_repository_reconcile.py -q --no-cov -p no:randomly'
    cwd: .
