schema_version: 1.0.0
ticket_id: OMN-23667
title: Re-send work log entries the database copy never received, and retry failed sends
summary: The parity check for UTC day 2026-11-10 read 39 rows (stamped 16:15:22Z to 16:20:05Z) in the ledger file and not in the projection. The dual write fails open and records a failed emit only in a host-local failure log, and nothing retried it. The existing file-mode replay node gains a replay_from_file operation that takes row ids or a stamp window, reads those rows from the ledger file of record, queues them by row id as durable retry records and drains exactly those rows through the work-ledger emit path under the replay source the overlay names. A repeat sends nothing; the dual write's failure log ids can feed it. No check is widened and no bound is changed.
is_seam_ticket: true
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23667-replay-from-file
  statement: Rows the ledger file holds and the projection never received are re-emitted by row id, once, and a failed send stays a retry record.
  acceptance:
  - id: AC1
    statement: 'AC1: a replay command takes row ids or a stamp window and re-emits exactly those rows from the ledger file through the work-ledger emit path under the overlay''s replay source -- falsifier: pytest tests/nodes/node_work_ledger_file_mode_replay_effect/test_replay_from_file.py -q -k "named_rows or window" fails on dev without the change'
  - id: AC2
    statement: 'AC2: a replay of rows already replayed sends nothing, and a replay after a lost queue carries the same event ids -- falsifier: pytest tests/nodes/node_work_ledger_file_mode_replay_effect/test_replay_from_file.py -q -k "second_replay or lost_queue" goes red when the already-replayed check is removed'
  - id: AC3
    statement: 'AC3: a row that only reached the spool, or whose spool raised, stays a pending retry record with its attempts and reason, and the dual write''s failure log ids are replayed or named as not in the file -- falsifier: pytest tests/nodes/node_work_ledger_file_mode_replay_effect/test_replay_from_file.py -q -k "spools or raises or failure_log"'
  - id: AC4
    statement: 'AC4: integrated: on the dev lane the parity check for UTC day 2026-11-10 reads missing=0, unexplained=0 and state_mismatches=0, and the board piece 6 line reads working after the next reading -- falsifier: python -m omnimarket.nodes.node_projection_work_ledger.parity --utc-day 2026-11-10 --dsn-env <dsn env> --receipt, and a read of the factory floor''s published json, the pieces entry for piece 6'
evidence_requirements:
- kind: tests
  description: The replay_from_file tests and the neighbouring emit and seam counter tests pass.
  command: uv run --frozen pytest tests/nodes/node_work_ledger_file_mode_replay_effect -q -n 0 --no-cov -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23667-ac1-replay-named-rows-and-window
  description: The named rows and the stamp window are re-emitted from the ledger file under the replay source, once each.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_work_ledger_file_mode_replay_effect/test_replay_from_file.py -q -n 0 --no-cov -p no:randomly -k "named_rows or window"
    cwd: .
- id: dod-omn23667-ac2-repeat-sends-nothing
  description: A second replay sends nothing and a replay with a lost queue carries the same event ids; the control goes red when the already-replayed check is removed.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_work_ledger_file_mode_replay_effect/test_replay_from_file.py -q -n 0 --no-cov -p no:randomly -k "second_replay or lost_queue"
    cwd: .
- id: dod-omn23667-ac3-retry-records
  description: A spool-only or raising send stays pending with attempts and reason; failure log ids are replayed or named as not in the file.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_work_ledger_file_mode_replay_effect/test_replay_from_file.py -q -n 0 --no-cov -p no:randomly -k "spools or raises or failure_log"
    cwd: .
- id: dod-omn23667-ac4-integrated
  description: The parity check on the dev lane for 2026-11-10 after the replay of the 39 rows, and the board piece 6 line after the next reading; both reads are in the pull request lab line.
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_work_ledger_file_mode_replay_effect/test_replay_from_file.py -q -n 0 --no-cov -p no:randomly -k "parity_reports_missing_row_key or projection_accepts_the_replay_source"
    cwd: .
- id: dod-omn23667-integration-proof
  description: The replay tests run on a lab host at the pushed head through the lab-work node; the live replay of the 39 rows against the dev lane and the parity re-run are in the pull request lab line.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23667 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_work_ledger_file_mode_replay_effect -q --no-cov
    cwd: .
