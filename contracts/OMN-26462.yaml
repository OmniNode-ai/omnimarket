schema_version: 1.0.0
ticket_id: OMN-26462
title: node_build_delegation_checks keeps its build history and probe state under the runtime's state directory, so a rebuild-completed event no longer fails with a permission error on the registry root
summary: In the dev runtime the registry root is /app, which the runtime user cannot write, and the node built its history file and the probe state directory under it, so every rebuild-completed dispatch failed with PermissionError on /app/.onex_state. The node now keeps both under ONEX_STATE_DIR when the runtime names one.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn26462-state-dir
  statement: The node's writable state lives under the runtime's state directory, never under the registry root when a state directory is named.
  acceptance:
  - id: AC1
    statement: 'AC1: with ONEX_STATE_DIR set, the contract-bound handler keeps the build history under that directory and creates nothing under the registry root -- falsifier: uv run pytest tests/nodes/node_build_delegation_checks -q -k state_dir fails on a handler that writes under the registry root'
  - id: AC2
    statement: 'AC2: a probe route names the state directory through the {state_root} placeholder and the default routes carry no .onex_state path -- falsifier: uv run pytest tests/nodes/node_build_delegation_checks -q -k state_root fails on a route that still names the registry root'
evidence_requirements:
- kind: tests
  description: The node's focused tests, each failing against the registry-root behavior first and passing on the handler.
  command: uv run pytest tests/nodes/node_build_delegation_checks -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn26462-state-dir
  description: With ONEX_STATE_DIR set the build history file is written under it and the registry root gains no .onex_state; the test fails on a handler that writes under the registry root.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_build_delegation_checks -q --no-cov -n 0 -p no:randomly -k state_dir
    cwd: .
- id: dod-omn26462-state-root-placeholder
  description: The executor expands {state_root} in a route and the default probe routes use it; the test fails on a route that names the registry root.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_build_delegation_checks -q --no-cov -n 0 -p no:randomly -k state_root
    cwd: .
- id: dod-omn26462-hosted-deploy-check
  description: 'Deploy check the hosted runner can run: the contract still declares the rebuild-completed input and the node stays registered as an onex.nodes entry point. This binds no criterion by itself.'
  source: manual
  checks:
  - check_type: command
    check_value: grep -q 'rebuild_completed:' src/omnimarket/nodes/node_build_delegation_checks/contract.yaml
    cwd: .
  - check_type: command
    check_value: grep -q 'node_build_delegation_checks = ' pyproject.toml
    cwd: .
- id: dod-omn26462-integration-proof
  description: On a lab host, with the change at its pushed sha, the node's focused tests run through the lab work placement and pass, including the one that keeps the build history under ONEX_STATE_DIR. Hosted CI holds no lab bus, so only the local Done gate runs this unbound check; the dev runtime reading (no PermissionError on /app/.onex_state after the sanctioned delivery rolls the change) is in the PR's Lab line and comment.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-26462 --kind test -- uv run --frozen pytest tests/nodes/node_build_delegation_checks -q --no-cov -n 0 -p no:randomly
    cwd: .
