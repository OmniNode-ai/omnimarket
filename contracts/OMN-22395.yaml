schema_version: 1.0.0
ticket_id: OMN-22395
title: The throughput tick FIX for a name-unresolved or non-publickey auth refusal names the host owner and says a rerun clears nothing
summary: The tick's lab-headroom FIX named the host owner only for "Permission denied (publickey". A probe that failed with Too many authentication failures, No supported authentication methods, or Could not resolve hostname still got "rerun the tick", which cannot change a key grant or a name on someone else's machine. Every ssh credential refusal now gets the key-grant FIX, a name that resolves nowhere gets a host-owner FIX, and a timed-out probe keeps the rerun advice.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn22395-auth-refused-fix
  statement: An ssh credential refusal on an unreadable host names the host owner's key grant and states a rerun clears nothing.
  acceptance:
  - id: AC3
    statement: 'AC3: probes refused with publickey, too many authentication failures or no supported authentication methods (h101 read 163 ticks, h053 113) get the host-owner key-grant FIX and not the rerun advice -- falsifier: uv run pytest tests/nodes/node_throughput_tick_decision_compute/test_live_admission_throughput_tick_decision_compute.py -k auth_refused_host_read_for_many_ticks'
- id: req-omn22395-name-unresolved-fix
  statement: A host whose name resolves nowhere names the host owner and states a rerun clears nothing; a timed-out probe keeps the rerun advice.
  acceptance:
  - id: AC4
    statement: 'AC4: a Could not resolve hostname probe gets the host-owner FIX and a timed-out probe still gets the rerun advice -- falsifier: uv run pytest tests/nodes/node_throughput_tick_decision_compute/test_live_admission_throughput_tick_decision_compute.py -k "name_unresolved or transient_probe_failure"'
evidence_requirements:
- kind: tests
  description: The throughput tick decision node suite renders the FIX for each recorded probe error.
  command: uv run pytest tests/nodes/node_throughput_tick_decision_compute -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn22395-ac3
  description: AC3 the recorded auth refusals name the host owner and the authorized_keys grant. At the merge base only the publickey spelling does, so the other cases fail.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_throughput_tick_decision_compute/test_live_admission_throughput_tick_decision_compute.py -q --no-cov --tb=line -k auth_refused_host_read_for_many_ticks
    cwd: .
- id: dod-omn22395-ac4
  description: AC4 a name-unresolved probe names the host owner and a timed-out probe keeps the rerun advice. At the merge base the name-unresolved cases get the rerun advice, so they fail.
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_throughput_tick_decision_compute/test_live_admission_throughput_tick_decision_compute.py -q --no-cov --tb=line -k "name_unresolved or transient_probe_failure"
    cwd: .
- id: dod-omn22395-deploy-probe
  description: 'Deploy probe: the throughput tick decision handler at the checked-out commit carries the name-unresolved FIX, which the merge base does not.'
  source: manual
  checks:
  - check_type: command
    check_value: |-
      bash -o pipefail -c 'gh api "repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_throughput_tick_decision_compute/handlers/handler_throughput_tick_decision.py?ref=$(git rev-parse HEAD)" --jq .content | base64 -d | grep -F "LIVE_NAME_UNRESOLVED_FIX" > /dev/null'
    cwd: .
- id: dod-omn22395-integration-proof
  description: The pushed head ran the throughput tick decision node suite on a lab host and exited 0. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-22395 -- uv run --frozen pytest tests/nodes/node_throughput_tick_decision_compute -q --no-cov
    cwd: .
