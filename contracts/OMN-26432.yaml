schema_version: 1.0.0
ticket_id: OMN-26432
title: 'A merged lab_hosts change reaches lane placement within one refresh interval: the overlay store snapshot reloads when overlays main moves past its source sha, not only on age'
summary: The loader tick publishes when overlays main has moved past the revision of its last load (and once an hour to assert an unchanged overlay), so its unit runs every 300 s instead of hourly; the reader reads through to the record of the revision overlays main names in the same tick instead of one window per tick, and a reading whose snapshot is behind main says so in its detail.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn26432-reload-on-source-move
  statement: A merge to the overlays repository that changes a loaded overlay reaches the host snapshot within one refresh interval of the loader and the reader reaching it, with the age bound a fallback and never the only trigger.
  acceptance:
  - id: AC1
    statement: 'AC1: the five whys from the 02:46Z merge to the 03:16Z snapshot write are recorded to the process root, each why with its evidence (stamp loaded_at and written_at, tick lines, unit log) -- falsifier: the lane''s PR body lists the five whys and each cites a stamp, log line or code line that a reader can open'
  - id: AC2
    statement: 'AC2: a test that fails on current main passes after the fix: when overlays main moves past the source sha held in a snapshot stamp, the next read tick reloads that overlay without waiting for stale_after_s, so a merged lab_hosts change reaches load_pool within one refresh interval -- falsifier: uv run pytest tests/ -k overlay_store_reload_on_source_move -q (red first on main, green on the branch)'
  - id: AC3
    statement: 'AC3: the fix lives in omnimarket node_overlay_store_load_effect or node_overlay_store_read_effect and changes no branch protection and no prod target -- falsifier: gh-free diff read of the PR''s changed paths shows only those node directories, their tests and contracts'
  - id: AC4
    statement: 'AC4: the command that reloads the Mac snapshot on demand is named and its readback shows the stamp source_ref equal to overlays origin/main -- falsifier: onex-work-ledger read of the lane''s MSG to orchestrator-31d9-swarm carries the command and the stamp readback'
evidence_requirements:
- kind: tests
  description: The overlay store tests and the loader unit test pass at the pushed head.
  command: uv run pytest tests/unit/nodes/node_overlay_store -q -n 0 --no-cov -p no:cacheprovider tests/nodes/node_host_installer_registry_units/test_overlay_store_load_unit.py
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
