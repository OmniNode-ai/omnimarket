- id: dod-omn26553-systemd-units
  description: 'the lab alarm condition schedules ran only where launchd runs: onex-host-install-units --list-units listed them launchd only, so h051 and h053 (systemd user units) held none. This pull request declares a systemd twin of each of the five lab alarm units (dev-tag-heartbeat, delegation-chain-canary, work-ledger-projection-stale, container-restarts, digest) in the host installer registry contract; the test lists the units and reads each twin as systemd, fails at origin/dev for the five missing twins and passes at the head. The h051 and h053 install and each timer''s last fire are the pull request''s Lab line and not met by the test alone.'
  source: manual
  binds_ac:
  - AC1
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_host_installer_registry_units/test_lab_alarm_systemd_units.py -q -n 0 --no-cov -p no:cacheprovider
    cwd: .
  - check_type: command
    check_value: grep -q lab-alarm-work-ledger-projection-stale-systemd src/omnimarket/nodes/node_host_installer_registry_units/contract.yaml
    cwd: .
