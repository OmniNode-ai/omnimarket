schema_version: 1.0.0
ticket_id: OMN-24053
title: Move the swarm endpoint list's embedding entry to the staying embedding server
summary: The swarm registry node has no overlay document model, so the overlays repository cannot hold and validate its file. This change adds the model the overlays repository's CI loads the document through; no node behaviour, check, bound or overlay value changes.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24053-registry-overlay-model
  statement: The swarm registry overlay document is validated by a typed model that refuses unknown keys, unknown endpoint fields and unknown capabilities, and agrees with the handler that reads the same file.
  acceptance:
  - id: AC1
    statement: 'AC1: the swarm registry overlay document loads through ModelSwarmRegistryOverlay and the handler reads the same endpoints from the same file, and an unknown top-level key, endpoint field or capability is refused -- falsifier: uv run --frozen pytest src/omnimarket/nodes/node_swarm_registry_compute/tests/test_model_swarm_registry_overlay.py -q --no-cov fails at the merge base (the model does not exist)'
evidence_requirements:
- kind: tests
  description: The model tests and the handler tests at the pushed head.
  command: uv run --frozen pytest src/omnimarket/nodes/node_swarm_registry_compute/tests -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24053-ac1
  description: The model tests and the existing handler tests pass together.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest src/omnimarket/nodes/node_swarm_registry_compute/tests -q --no-cov
    cwd: .
- id: dod-omn24053-integration-proof-lab
  description: The model tests and the handler tests at the pushed head on a lab host through the lab work runner. Hosted CI cannot reach the lab runner, so only the local Done gate runs this unbound item.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: 'env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24053 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest src/omnimarket/nodes/node_swarm_registry_compute/tests -q --no-cov'
    cwd: .
