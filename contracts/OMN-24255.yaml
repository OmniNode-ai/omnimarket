schema_version: 1.0.0
ticket_id: OMN-24255
title: Declare the capture silence watch so it runs from managed code, not a temporary folder
summary: The capture silence watch is declared as a systemd unit of the host installer so the lab host runs it from the registry omnimarket project on a managed timer, not from a /tmp copy of the source.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24255-declared-unit
  statement: The capture silence watch is a declared unit of the host installer.
  acceptance:
  - id: AC1
    statement: "AC1: the capture silence watch is declared as a unit of the host installer and renders a unit that runs the registry code and names no /tmp path. -- falsifier: pytest tests/nodes/node_capture_silence_watch_effect/test_capture_silence_watch_schedule.py -q fails with a KeyError for the unit when the pre-change installer contract is put back"
  - id: AC2
    statement: "AC2: one tick records its exit code in last-run.json, and a tick that raises records exit 3 with the reason. -- falsifier: test_a_tick_that_raises_records_indeterminate in the same file fails when the tick module stops writing last-run.json"
  - id: AC3
    statement: "AC3: integrated: on the lab machine that runs the watchdog, systemctl --user list-timers onex-capture-silence-watch.timer shows the managed timer and last-run.json under the user state directory holds a ran_at under 10 minutes old with exit_code 0. -- falsifier: the timer is absent, the file is missing or older than 10 minutes, or exit_code is 3"
evidence_requirements:
- kind: tests
  description: The unit schedule tests pass at the pushed head.
  command: uv run --frozen pytest tests/nodes/node_capture_silence_watch_effect/test_capture_silence_watch_schedule.py -q --no-cov -n 0 -p no:randomly
