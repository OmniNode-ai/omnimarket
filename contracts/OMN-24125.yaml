- id: dod-omn24125-integration-proof
  description: Run the entry point and local invocation tests on a lab host at the pushed head. Hosted CI cannot reach the lab hosts, so only the local Done gate runs this unbound check; it binds no criterion for the hosted check. The dev runtime registry reading after the roll is posted as a pull request comment.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24125 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/test_entry_points_node_move_batch1.py -q --no-cov -n 0 -p no:randomly
    cwd: .
