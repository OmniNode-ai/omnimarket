schema_version: 1.0.0
ticket_id: OMN-24125
title: Four more built nodes are listed so the dev runtime loads them
summary: Four nodes that already live in omnimarket with a contract (node_captured_secret_store_effect, node_claude_token_pool_effect, node_host_table_copies_drift_compute, node_overlay_drift_compute) carried no onex.nodes entry point, so the dev runtime image never discovered them. The entry points are added, each contract declares a typed local invocation (the shape the runtime dogfood audit accepts), the handle parameter of the two drift handlers is named request, and a test fails when any entry or local invocation is missing. node_lab_fill_selection_compute stays host-only because its models are not typed pydantic models.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24125-entry-points
  statement: Each of the four named nodes is registered under onex.nodes in the omnimarket package metadata and declares a typed local invocation, so the runtime image build discovers it and the runtime dogfood audit accepts it.
  acceptance:
  - id: AC1
    statement: 'AC1: the four named nodes (node_captured_secret_store_effect, node_claude_token_pool_effect, node_host_table_copies_drift_compute, node_overlay_drift_compute) are listed under the onex.nodes entry points of the omnimarket package and each declares a typed local invocation the runtime dogfood audit accepts -- falsifier: with one entry removed from pyproject.toml, uv run pytest tests/test_entry_points_node_move_batch1.py -n 0 --no-cov fails on that node'
  - id: AC2
    statement: 'AC2: the runtime dogfood audit reports zero failures with the four nodes listed -- falsifier: with external_trigger deleted from node_captured_secret_store_effect''s contract, uv run pytest tests/test_entry_points_node_move_batch1.py -n 0 --no-cov fails the local invocation check'
  - id: AC3
    statement: 'AC3: integrated: after the dev runtime rolls to a tag at or past the merge, its node registry lists all four nodes -- falsifier: the dev runtime registry read, taken after the roll, lacks any of the four names'
evidence_requirements:
- kind: tests
  description: The entry point and local invocation tests pass at the pushed head.
  command: uv run pytest tests/test_entry_points_node_move_batch1.py -q -n 0 --no-cov -p no:cacheprovider
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
