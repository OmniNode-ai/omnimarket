schema_version: "1.0.0"
ticket_id: "OMN-23401"
title: "The factory floor's input inventory and overlay store input move to a bus projection"
summary: "The floor publish read the overlay store's fleet from a file that one reader on the operator's Mac kept; when that reader stalled the file froze and every host row read wrong. Each host's reader now publishes its view of the fleet on a snapshot topic stamped with the time it stood by it, a new publish step (node_floor_projection_read_effect) reads the topic and writes the projections with their own times, and the simple floor judges the overlay store against that time and the projection's own bound: a projection older than its bound reads unknown, never the last fleet it held. The same pull request carries the inventory of every input the publish reads, held to the publish contract by a test."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
evidence_requirements:
  - kind: "tests"
    description: "The floor's overlay store source tests pass, including the planted stale projection, and fail on the unfixed file reader."
    command: "uv run --frozen pytest tests/unit/nodes/node_floor_simple_effect/test_overlay_store_source.py -q --no-cov"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
