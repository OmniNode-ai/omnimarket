        check_value: "uv run --frozen pytest tests/nodes/node_floor_projection_read_effect tests/unit/nodes/node_overlay_store tests/nodes/node_factory_floor_publish_effect/test_floor_input_inventory.py -q --no-cov"
        cwd: "${OMNI_HOME}/omnimarket"
