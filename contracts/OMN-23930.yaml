schema_version: "1.0.0"
ticket_id: OMN-23930
title: "Code edit loop refuses an empty draft and reads its limits from settings"
summary: >-
  The delegated code edit loop accepted a draft that changed no file when its declared checks passed or when only a
  syntax check was declared (7 of the 15 misses of the first ten local-model tasks). A finish over an empty diff is now
  refused and fed back, and the loop ends no_change after the declared number of such finishes or at the turn cap with an
  empty diff. The loop's round limit, check time limit and empty-finish limit come from the node's overlay, and the
  ticket's own test checks are declared from its contract file with one option.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn23930-no-change
    statement: A delegated code edit loop never ends accepted over an empty diff, and its limits are settings.
    acceptance:
      - id: AC1
        statement: 'AC1: a code-edit loop whose model calls finish with no changed file is refused and ends as no_change after the declared number of refusals, never accepted -- falsifier: uv run --frozen pytest tests/nodes/node_delegated_code_edit_orchestrator/test_no_change.py -q --no-cov run with the handler from the base branch'
      - id: AC2
        statement: 'AC2: the round limit and the check time limit are read from the node''s overlay and the loop refuses to start with a malformed overlay -- falsifier: uv run --frozen pytest tests/handlers/test_code_edit_loop_overlay.py -q --no-cov with a wrong key planted in the overlay document'
      - id: AC3
        statement: 'AC3: the ticket''s own test checks, read from its contract file, are declared as the loop''s checks by one option -- falsifier: uv run --frozen pytest tests/handlers/test_code_edit_contract_checks.py -q --no-cov with a contract that has no test_passes check'
      - id: AC4
        statement: 'AC4: integrated: the loop run from the branch on a lab host against one past task refuses the empty draft or accepts a draft that passes the ticket''s checks, read in the loop receipt -- falsifier: the receipt of the same task on dev shows an accepted empty diff'
evidence_requirements:
  - kind: tests
    description: The code edit loop tests, including the no_change tests, and the overlay, contract-check and CLI tests.
    command: uv run --frozen pytest tests/nodes/node_delegated_code_edit_orchestrator tests/handlers/test_code_edit_loop_overlay.py tests/handlers/test_code_edit_contract_checks.py tests/cli/test_code_edit_cli_limits.py -q --no-cov
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-omn23930-no-change
    description: The code edit loop tests pass with the change; with the handler from the base branch the no_change tests fail.
    source: manual
    execution_scope: hosted_and_local
    binds_ac: [AC1, AC4]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/nodes/node_delegated_code_edit_orchestrator -q --no-cov
        cwd: .
  - id: dod-omn23930-limits-and-contract-checks
    description: The overlay, contract-check and CLI limit tests pass.
    source: manual
    execution_scope: hosted_and_local
    binds_ac: [AC2, AC3]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/handlers/test_code_edit_loop_overlay.py tests/handlers/test_code_edit_contract_checks.py tests/cli/test_code_edit_cli_limits.py -q --no-cov
        cwd: .
  - id: dod-omn23930-integration-proof
    description: The pushed head ran the loop tests on a lab host through the lab work runner and exited 0. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: 'env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23930 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_delegated_code_edit_orchestrator -q --no-cov'
        cwd: .
