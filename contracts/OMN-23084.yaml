schema_version: 1.0.0
ticket_id: OMN-23084
title: The overlay drift read answers the newest successful seam chain of piece 3 under that chain's correlation id, so join J3 can read golden on the floor
summary: The floor builds piece 3's chains from its seam-deadline ledger rows (one correlation id per row) and piece 4's from the drift rows (another id per row), so the two never shared an id and a run of the drift read could not be the golden half of join J3 (bus to overlays); J3 could read at best error_only. A new optional piece event rule key, correlation_cell, lets a row name the chain it answers, and a new optional overlay block, upstream, makes a drift run take the newest successful upstream chain that no earlier run named and write its id in a row cell. A run with no such chain, a drill, an unreadable ledger or an already answered chain writes no cell and claims no join. No verdict, bound or check of the receipt fold changes.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23084-j3-golden
  statement: A drift run answers the newest successful, unanswered seam chain of piece 3 once, the floor reads the row as piece 4's chain under that id, J3 reads golden and with a typed refusal beside it passed, and the same row without the cell leaves J3 without a golden.
  acceptance:
  - id: AC1
    statement: 'AC1: the finder names the id the floor derives for the newest seam success, the answered chain with a refusal reads J3 passed, a chain is answered once, no chain or a drill or an unreadable ledger claim no join, and the row without the cell leaves J3 with no golden -- falsifier: uv run --frozen pytest tests/unit/nodes/node_overlay_drift_effect/test_join_j3_golden.py -q --no-cov'
- id: req-omn23084-j3-journal-refusal
  statement: A real piece 3 failure chain in the emission journal is answered once by piece 4's typed upstream_ failure with no start, and the floor's receipt fold reads J3 as an error join with no finding; a drill, a piece 3 refusal, a success, an unnamed node and an unreadable ledger are not answered; with the piece 4 refusal dropped or the journal source removed from the overlay J3 reads broken again.
  acceptance:
  - id: AC2
    statement: 'AC2: the golden chain (a real journal failure answered once, J3 error_only with no finding, from the in-memory sink and the journal file), the error chains (drill, refusal, success, unnamed node, unreadable ledger, already answered) and the failing controls (piece 4 refusal dropped, journal source removed) all hold -- falsifier: uv run --frozen pytest tests/unit/nodes/node_join_refusal_effect -q --no-cov'
  - id: AC3
    statement: 'AC3: after install on the publisher from the branch and one publish cycle the served floor-simple.json J3 chain_findings count is below the 78 read before, and each remaining finding is named by correlation id in the pull request comment that names the installed head -- falsifier: curl of the served floor-simple.json chain_findings for J3 after the cycle'
evidence_requirements:
- kind: tests
  description: The J3 golden tests with the failing control, and the drift node and floor tests around them.
  command: uv run --frozen pytest tests/unit/nodes/node_overlay_drift_effect tests/nodes/node_overlay_drift_effect tests/unit/nodes/node_join_refusal_effect -q --no-cov
- kind: tests
  description: The refusal node tests with the journal upstream golden, error and failing-control cases, and the existing ledger cases.
  command: uv run --frozen pytest tests/unit/nodes/node_join_refusal_effect -q --no-cov
