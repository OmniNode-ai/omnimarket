schema_version: "1.0.0"
ticket_id: "OMN-20718"
title: "The ticket closer reports a zero-flip run as a working run, and a staleness alarm goes red when the closer stops running"
summary: "node_dod_closeout_sweep_compute returns a typed zero-flip reading (exit code 0, the candidates and the held reasons counted) and an alarm row for a run that closed no ticket, with a zero-flip runtime command for the runner. node_silent_failure_alarm_compute gains a closer-staleness decision, wired into the silent-failure alarm tick, that goes red when the closer's newest TERMINAL or run record is older than twice its declared interval. What counts as proof for closing a ticket is unchanged."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-closer-zero-flip-is-not-a-failure"
    statement: "A closer run that closes zero tickets returns a typed zero-flip reading with exit code 0 and an alarm row counting the held reasons, never a failure."
    acceptance:
      - id: "AC1"
        statement: "AC1: node_dod_closeout_sweep_compute completion returns a zero_flip_reading with exit_code 0, the candidate count and the held reasons counted, and an alarm STATUS row before the TERMINAL, for a run that flipped nothing; the zero-flip runtime command exits 0 for it and 2 for an unreadable summary -- falsifier: uv run pytest tests/test_omn20718_zero_flip_reading.py tests/test_closeout_completion.py -q fails"
  - id: "req-closer-staleness-alarm"
    statement: "The silent-failure alarm goes red when the closer's newest TERMINAL or run record is older than twice the interval its liveness overlay entry declares."
    acceptance:
      - id: "AC2"
        statement: "AC2: the silent-failure alarm tick reads closer-staleness from the newest dod-closeout-sweep TERMINAL or fire receipt and the declared interval, raises a FRICTION row and an alert past twice the interval, and goes red with the unit named when the unit is absent from the scheduler's table (injected booted-out unit, 11.5 days old) while a fresh record with the unit listed stays LIVE -- falsifier: uv run pytest tests/nodes/node_silent_failure_alarm_compute/test_closer_staleness_omn20718.py -q fails"
evidence_requirements:
  - kind: "tests"
    description: "AC1: the zero-flip reading, its row, the runtime command and the updated completion rows."
    command: "uv run pytest tests/test_omn20718_zero_flip_reading.py tests/test_closeout_completion.py tests/test_omn21146_zero_flip_alert.py -q -p no:randomly --no-cov"
  - kind: "tests"
    description: "AC2: the staleness decision and the tick, with the booted-out-unit failing control."
    command: "uv run pytest tests/nodes/node_silent_failure_alarm_compute tests/nodes/node_silent_failure_alarm_effect -q -p no:randomly --no-cov"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn20718-ac1-zero-flip-reading"
    description: "AC1: a run that flipped nothing returns a typed zero-flip reading with exit code 0 and an alarm row; the runtime command exits 0."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/test_omn20718_zero_flip_reading.py tests/test_closeout_completion.py tests/test_omn21146_zero_flip_alert.py -q -p no:randomly --no-cov"
    binds_ac: ["AC1"]
  - id: "dod-omn20718-ac2-closer-staleness"
    description: "AC2: the closer-staleness alarm goes red past twice the declared interval, with the booted-out-unit control."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_silent_failure_alarm_compute/test_closer_staleness_omn20718.py -q -p no:randomly --no-cov"
    binds_ac: ["AC2"]
  - id: "dod-omn20718-integration-proof"
    description: "Run the closer zero-flip reading and the closer-staleness alarm tests on a lab host at the pushed head. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check."
    source: "manual"
    execution_scope: local_done_gate
    checks:
      - check_type: "command"
        check_value: "env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha \"$(git rev-parse HEAD)\" --lane dod-integration-proof-20718 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/test_omn20718_zero_flip_reading.py tests/nodes/node_silent_failure_alarm_compute/test_closer_staleness_omn20718.py -q --no-cov"
