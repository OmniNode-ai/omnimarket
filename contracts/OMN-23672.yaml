schema_version: 1.0.0
ticket_id: OMN-23672
title: 'Delegation health check R4: a probe rung can declare its credential absent so the third-rung leg runs'
summary: Scenario R4 (every rung fails, and time is shared fairly) failed every six hours on its credential-absent leg because a probe-ladder rung had no way to say its key is missing, so the leg was hard-coded as not runnable. A new credential ladder, declared as new classes in its own wire module so the released probe ladder keeps exactly its keys, lets a rung declare its credential absent; the local port's probe walk never selects such a rung, as production never selects a tier whose key resolves to nothing (OMN-23170). The scenario leg now runs a slow rung, a rung with no credential and a healthy rung, and asserts the healthy rung answers and the absent one is never attempted.
is_seam_ticket: false
interface_change: true
interfaces_touched:
- public_api
requirements:
- id: req-omn23672-credential-absent-rung
  statement: A probe rung can declare its credential absent, the walk never selects it, and scenario R4's third-rung leg runs on that declaration.
  acceptance:
  - id: AC1
    statement: 'AC1: a probe rung can declare its credential absent, the walk never selects it, and a ladder with no usable rung is refused -- falsifier: uv run pytest tests/unit/delegation/test_probe_rung_credential_absent.py -q (red against the unmodified rung model)'
  - id: AC2
    statement: 'AC2: scenario R4''s credential-absent leg runs and turns red when the absent rung is attempted -- falsifier: uv run pytest tests/nodes/node_delegation_scenario_r4_effect/test_golden_chain_scenario_r4_effect.py -q -k absent (red against a walk that ignores the declaration)'
  - id: AC3
    statement: 'AC3: integrated: scenario R4 installed from the branch on a lab host through the registry installer ran once and its tracker entry reads pass after its next scheduled run -- falsifier: the delegation tracker entry for R4 reads pass with a latest run newer than the install, and its status row lists no failed assertion'
