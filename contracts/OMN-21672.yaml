---
schema_version: "1.0.0"
ticket_id: "OMN-21672"
title: "A GitHub write on a host whose secret store cannot be built names the missing bootstrap variable instead of an opaque lookup failure"
summary: "onex scm pr-comment returned credential_unavailable with the text 'credential lookup failed for declared ref GITHUB_TOKEN' when the in-memory fallback injected the dev lane's Infisical store on a host whose environment lacks INFISICAL_ENVIRONMENT_SLUG. The store's configuration error names only variables, yet the write node folded it into one generic message. The write node now carries that message, so the lane sees which variable its host lacks."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-omn21672-store-config-error"
    statement: |-
      A secret store that cannot be built on the host refuses with the store's own value-free message, and any other resolver error still refuses without its text.
    acceptance:
      - id: "AC1"
        statement: "AC1: a store configuration error reaches the credential_unavailable detail with the missing variable name -- falsifier: uv run pytest tests/unit/nodes/node_github_repo_write_effect -k unbuildable_store"
      - id: "AC2"
        statement: "AC2: an arbitrary resolver exception still never reaches the detail or the log -- falsifier: uv run pytest tests/unit/nodes/node_github_repo_write_effect -k resolver_error"
evidence_requirements:
  - kind: "tests"
    description: "The unbuildable-store case fails on the unfixed handler and passes on the fix."
    command: "uv run pytest tests/unit/nodes/node_github_repo_write_effect -q --no-cov"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn21672-unbuildable-store"
    description: "The unbuildable-store case passes on the fix."
    source: "manual"
    binds_ac: ["AC1"]
    checks:
      - check_type: "test_passes"
        check_value: "env PYTHONDONTWRITEBYTECODE=1 uv run pytest tests/unit/nodes/node_github_repo_write_effect/test_app_credentials.py -k unbuildable_store -q --no-cov"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn21672-resolver-error"
    description: "An arbitrary resolver error still exposes nothing."
    source: "manual"
    binds_ac: ["AC2"]
    checks:
      - check_type: "test_passes"
        check_value: "env PYTHONDONTWRITEBYTECODE=1 uv run pytest tests/unit/nodes/node_github_repo_write_effect/test_app_credentials.py -k resolver_error -q --no-cov"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn21672-deploy-handler-source"
    description: "Hosted runtime probe: dispatch the packaged write node with an Infisical mapping and a missing environment slug. The real resolver must return credential_unavailable naming INFISICAL_ENVIRONMENT_SLUG, without exposing the synthetic secret or sending a request. Bootstrap validation refuses before any network call. This checks the evaluated checkout through the in-process runtime, not a production rollout. AC1 remains bound to its behavior test."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: |
          set -eu;
          probe_dir="$(mktemp -d)";
          trap 'rm -rf "$probe_dir"' EXIT;
          uv sync --locked;
          runtime_bin="$(uv run --locked python -c 'import sys; from pathlib import Path; print(Path(sys.executable).parent)')";
          printf '%s' '{"mappings":[{"logical_name":"GITHUB_TOKEN","source":{"source_type":"infisical","source_path":"/probe/GITHUB_TOKEN"}}]}' > "$probe_dir/resolver.json";
          printf '%s' '{"correlation_id":"00000000-0000-4000-8000-000000021672","operation":"pr_comment","repo":"OmniNode-ai/omnimarket","idempotency_key":"omn21672-config-probe","requested_by_lane":"omn21672-deploy-probe","pr_number":1,"body":"configuration refusal probe"}' > "$probe_dir/input.json";
          env -u PYTHONPATH -u INFISICAL_ENVIRONMENT_SLUG PYTHONDONTWRITEBYTECODE=1 INFISICAL_ADDR=http://127.0.0.1:1 INFISICAL_CLIENT_ID=probe-client INFISICAL_CLIENT_SECRET=probe-secret INFISICAL_PROJECT_ID=00000000-0000-4000-8000-000000021672 ONEX_SECRET_RESOLVER_CONFIG_PATH="$probe_dir/resolver.json" "$runtime_bin/onex" node node_github_repo_write_effect --input "$probe_dir/input.json" --state-root "$probe_dir/state" --backend event_bus=inmemory --timeout 30 --output receipt --omnibase-path "$PWD" > "$probe_dir/receipt.json";
          "$runtime_bin/python" -c 'import json, sys; r = json.load(open(sys.argv[1]))["result"]; assert r["outcome"] == "failed" and r["reason"] == "credential_unavailable" and r["requests"] == [], r; assert "INFISICAL_ENVIRONMENT_SLUG" in r["detail"], r; assert "probe-secret" not in r["detail"], r' "$probe_dir/receipt.json"
        cwd: "${OMNI_HOME}/omnimarket"
