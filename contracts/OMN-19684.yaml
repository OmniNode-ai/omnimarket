---
schema_version: "1.0.0"
ticket_id: "OMN-19684"
title: "omnimarket full-suite test shards are planned from committed per-file durations"
summary: "The 20 full-suite shards run only the test files scripts/ci/merge_test_durations.py plans for them from the committed config/test_file_durations.json, so each shard collects only its own files, and the typecheck job proves the 20 plans partition the files pytest collects. The live shard spread is measured on first-attempt PR runs after merge."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-shards-planned-from-committed-durations"
    statement: |-
      The full-suite shard plan assigns every test file to exactly one of 20 shards from the committed per-file durations, is deterministic, balances the committed record within 1.1x, and a shard's pytest step runs only its planned files.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: a planner test asserts every test file lands in exactly one shard, an unrecorded file is assigned once, the plan is deterministic, the committed record balances the real tree within 1.1x, and the ci.yml shard step runs only its planned files -- falsifier: env -u PYTHONPATH uv run pytest tests/unit/test_ci_shard_plan_omn19684.py tests/unit/test_ci_workflow_shape_durations_merge.py -q
  - id: "req-shard-plan-proof-off-the-critical-path"
    statement: |-
      The job that collects the whole tree once and proves the 20 shard plans partition the collected test files must be the typecheck job, which finishes well inside the shards' time, and not the integration-guard job, which already runs 313 to 509 s.
    acceptance:
      - id: "AC2"
        statement: |-
          AC2: the collect-and-verify steps live in the typecheck job and not in integration-guard -- falsifier: env -u PYTHONPATH uv run pytest tests/unit/test_ci_shard_plan_omn19684.py -q -k "typecheck_job_proves or integration_guard_does_not_collect"
  - id: "req-committed-record-names-the-tree"
    statement: |-
      The committed per-file duration record names (almost) every test file on the tree. A file absent from the record is planned at the record's median weight, so a stale record passes the planner's own balance test while the live shards spread about 2x (463 of 3049 files unrecorded; slowest over fastest Tests (Split n/20) pytest step 2.14x, 2.21x and 2.16x on first-attempt PR runs 39058366864, 39057687691 and 39050930650).
    acceptance:
      - id: "AC3"
        statement: |-
          AC3: at most 5% of the test files pytest discovers are missing from config/test_file_durations.json, and at most 5% of the recorded files no longer exist -- falsifier: env -u PYTHONPATH uv run pytest tests/unit/test_ci_shard_plan_omn19684.py -q -k "names_nearly_every", red on the 463-unrecorded record at the merge base
evidence_requirements:
  - kind: "tests"
    description: "The planner and workflow-shape tests pass at the head and fail at the merge base."
    command: "env -u PYTHONPATH uv run pytest tests/unit/test_ci_shard_plan_omn19684.py tests/unit/test_ci_workflow_shape_durations_merge.py -q"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-shards-planned-ac1"
    description: "The planner, the committed record and the ci.yml shard step satisfy the exact-once and balance tests."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/test_ci_shard_plan_omn19684.py tests/unit/test_ci_workflow_shape_durations_merge.py -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC1"]
  - id: "dod-shard-plan-proof-typecheck-ac2"
    description: "The collect-and-verify steps run in typecheck and integration-guard no longer collects the whole tree."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/test_ci_shard_plan_omn19684.py -q -k \"typecheck_job_proves or integration_guard_does_not_collect\""
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC2"]
  - id: "dod-record-names-the-tree-ac3"
    description: "The committed record names the tree's test files, so no shard is planned from median guesses."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/test_ci_shard_plan_omn19684.py -q -k \"names_nearly_every\""
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC3"]
