schema_version: 1.0.0
ticket_id: OMN-23887
title: Claude token pool clears a stale revoked mark and installs on every listed host
summary: The Claude token pool keeps a revoked mark per login on each lab host. Two hosts still carried a revoked mark for a login that later answered a usage limit on every host, so they skipped a working login, and nothing cleared the mark. A new compute node decides a revoke is stale when the same fingerprint was limited or answered ok on any host after the revoke stamp plus an overlay margin; the rotation tick, inside the existing mark sync, sends a typed clear command that the pool effect executes only when the pool still holds that fingerprint and that exact revoke stamp. A revoke with no later success is kept, and an overlay without the block keeps the old behaviour. The serve units overlay gets the overlay roots of every systemd host the pool overlay lists, so tick, assign and schedule install resolve the pool overlay there.
is_seam_ticket: true
interface_change: true
interfaces_touched:
- public_api
requirements:
- id: req-omn23887-stale-revoke
  statement: A revoked mark that a later success of the same fingerprint contradicts is cleared by the pool through a typed command decided by a compute node; a real revoke stays.
  acceptance:
  - id: AC1
    statement: 'AC1: a compute decision marks a revoke stale only when the same fingerprint was limited or answered ok on any host after the revoke stamp, and a typed clear command is executed by the pool effect inside the mark sync; a revoke with no later success is kept -- falsifier: uv run pytest tests/nodes/node_claude_token_pool_effect/test_stale_revoke.py -q, red at the merge base where no decision exists'
  - id: AC2
    statement: 'AC2: the declared install covers every host the overlay lists, so tick, schedule install and assign resolve the overlay on each -- falsifier: uv run pytest tests/nodes/node_claude_token_pool_effect/test_install_coverage.py -q, red when one listed host has no install declaration'
  - id: AC3
    statement: 'AC3: integrated: run from the branch on this host against a copy of a pool file with a stale revoked mark, the stale mark clears and the real one stays, and the live pool file is untouched -- falsifier: the copy still shows the stale mark after the run, or the live pool file hash changed'
evidence_requirements:
- kind: tests
  description: The pool and staleness node tests pass at the pushed head.
  command: env -u PYTHONPATH uv run --frozen pytest tests/nodes/node_claude_token_pool_effect tests/nodes/node_claude_pool_revoke_staleness_compute -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23887-ac1
  description: The stale-revoke golden test clears the stale mark and the failing controls keep a real revoke, a different fingerprint, an unconfigured overlay and a changed stamp.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: env -u PYTHONPATH uv run --frozen pytest tests/nodes/node_claude_token_pool_effect/test_stale_revoke.py tests/nodes/node_claude_pool_revoke_staleness_compute -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn23887-ac2
  description: Every host the example overlay lists renders a tick unit that pins the overlay root; a host not listed is refused.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: env -u PYTHONPATH uv run --frozen pytest tests/nodes/node_claude_token_pool_effect/test_install_coverage.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn23887-integration-proof
  description: From the branch on a lab host, the tick CLI run under a temporary home against a copy of a pool file holding two stale revoked marks and one real one clears the two stale marks and keeps the real one, and the live pool file hash is unchanged. Hosted CI cannot reach the lab host, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: env -u PYTHONPATH uv run --frozen pytest tests/nodes/node_claude_token_pool_effect/test_stale_revoke.py -q --no-cov -n 0 -p no:randomly
    cwd: .
