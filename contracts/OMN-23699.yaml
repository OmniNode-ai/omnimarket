schema_version: 1.0.0
ticket_id: OMN-23699
title: Join J7 gets a failing control so its error side comes from a real run
summary: "Join J7 (piece 7, the process spine, to piece 8, the central test harness) reads golden only on the served floor because the only piece 7 failures that exist are stop drills, which the floor does not count. This change gives the J7 runner a failing control, built the way join J1 gets its own: the stop gate is asked about a lane the open stop must refuse with the stop class in an observing mode, so it admits that lane, which is piece 7 failing typed under its own control id. Piece 8 is not asked and answers with its typed upstream refusal. The run writes both chains as non-drill chains once per overlay window; a gate that still refuses in that mode turns the run red and writes nothing. The deployed overlay gains a required control block (overlays repository)."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23699-j7-control
  statement: The J7 runner writes a non-drill piece 7 failure and piece 8's typed refusal under a control id, and the floor's fold reads them as the join's error side.
  acceptance:
  - id: AC1
    statement: 'AC1: the J7 runner writes a non-drill piece 7 failure and piece 8 typed upstream refusal for a control the stop gate admits, and writes nothing when the gate still refuses -- falsifier: uv run pytest tests/unit/nodes/node_lab_check_run_effect/test_j7_caller_run.py -k control -q'
  - id: AC2
    statement: 'AC2: the control chains and the floor fold agree on the in-memory bus and the real broker -- falsifier: JOIN_J7_PARITY_BOOTSTRAP=<broker> uv run pytest tests/nodes/node_join_refusal_effect/test_join_j7_control_seam.py -q'
  - id: AC3
    statement: 'AC3: integrated: join J7 reads passed on the served floor after the J7 run installed from this change runs once -- falsifier: the join:J7 row of the served floor-simple.json after the next publish cycle'
evidence_requirements:
- kind: tests
  description: The J7 runner test and the J7 control seam test at the pushed head. The failing controls are a stop gate that refuses in the control mode (the control broke nothing), a renamed correlation id cell, a refusal that starts, and a drill flag on piece 7's failure.
  command: uv run --frozen pytest tests/unit/nodes/node_lab_check_run_effect/test_j7_caller_run.py tests/nodes/node_join_refusal_effect/test_join_j7_control_seam.py -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
