---
schema_version: "1.0.0"
ticket_id: OMN-26387
title: "pr-create opens a pull request from every lab host because its duplicate-guard claims are read through the work ledger reader node"
summary: "Tests for the omnimarket side of the move: onex scm pr-create's duplicate guard reads its claims through the ledger reader node (pr-duplicate-guard-claims) and never the ledger file, and the reader answers recorded on lab hosts h051 and h105 on 2026-11-21 (exit 3 not-moved, exit 1 no overlay) leave the guard unchecked while the answers after the fix let pr-create go on. The reader name is declared in the overlays repository and the host setup in its lab host table; this repository needs no source change."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn26387-guard-reads-through-the-reader
    statement: "The duplicate guard's claims come from the reader node's rows on both lab hosts, the ledger file is never read, and the recorded answers of 2026-11-21 are refusals naming the reader's own words."
    acceptance:
      - id: AC2
        statement: "AC2: a test shows pr-create's duplicate guard reads its claims through the reader node and never the ledger file -- falsifier: uv run pytest of that test in the repository that owns the guard fails when the guard reads the file or the reader answers not-moved"
      - id: AC5
        statement: "AC5: a regression test built from the recorded reader output of 2026-11-21 (the exit 3 reader-not-in-moved-readers answer and the exit 1 answer of h105, fixture under the owning repository's tests/fixtures) fails on the broken code and passes on the fix -- falsifier: uv run pytest of that test on the code before the fix passes"
evidence_requirements:
  - kind: tests
    description: "The guard's reader-host tests, replaying the recorded reader answers through the production adapter."
    command: "uv run pytest tests/unit/handlers/scm/test_scm_duplicate_guard_reader_hosts.py -q --no-cov"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-omn26387-ac2
    description: "The guard reads its rows through SubprocessLedgerRowsReader under the reader name pr-duplicate-guard-claims; a poisoned ledger file is never read."
    source: manual
    binds_ac: [AC2]
    checks:
      - check_type: test_passes
        check_value: >-
          uv run pytest tests/unit/handlers/scm/test_scm_duplicate_guard_reader_hosts.py -q --no-cov -k never_the_ledger_file
  - id: dod-omn26387-ac5
    description: "The recorded exit 3 and exit 1 answers leave pr-create unchecked; the newest recorded answer of each lab host lets pr-create go on."
    source: manual
    binds_ac: [AC5]
    checks:
      - check_type: test_passes
        check_value: >-
          uv run pytest tests/unit/handlers/scm/test_scm_duplicate_guard_reader_hosts.py -q --no-cov -k "before_fix or answers_of_2026_11_21"
  - id: dod-omn26387-deploy-contract
    description: "Hosted deploy check: the guard's reader-host tests pass."
    source: manual
    checks:
      - check_type: test_passes
        check_value: >-
          uv run pytest tests/unit/handlers/scm/test_scm_duplicate_guard_reader_hosts.py -q --no-cov
  - id: dod-omn26387-integration-proof
    description: "Local Done gate only: the reader-host tests run on a lab host at the pushed head through onex lab-work."
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: >-
          onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-26387 --kind test -- uv run --frozen pytest tests/unit/handlers/scm/test_scm_duplicate_guard_reader_hosts.py -q --no-cov
        cwd: .
