---
schema_version: "1.0.0"
ticket_id: OMN-26387
title: "pr-create duplicate guard waits long enough for the ledger reader node on a loaded lab host"
summary: "The pr-create duplicate guard builds its ledger reader with a read timeout above the 253 second read recorded on lab host h051 at a load of 46 on 2026-11-21, instead of the reader adapter's 120 second default. The reader-host tests also cover the reader answers recorded on h051 and h105; those already passed before this change and are not bound as evidence here."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn26387-guard-waits-for-the-reader
    statement: "The duplicate guard gives the reader subprocess a timeout longer than the loaded-host read time recorded on 2026-11-21."
    acceptance:
      - id: AC6
        statement: "AC6: the guard's reader subprocess is given a timeout longer than the 253 second read recorded on h051 at a load of 46 on 2026-11-21 -- falsifier: uv run pytest of the loaded-host test fails when the guard keeps the reader adapter's 120 second default"
evidence_requirements:
  - kind: tests
    description: "The guard's reader-host tests, replaying the recorded reader answers through the production adapter."
    command: "uv run pytest tests/unit/handlers/scm/test_scm_duplicate_guard_reader_hosts.py -q --no-cov"
  - kind: tests
    description: "A read the answerer answers late is asked once more as the same bounded read, never as the every-row read of 168 hours, inside the declared budget."
    command: "uv run pytest tests/unit/handlers/scm/test_scm_duplicate_guard_reader_timeout.py -q --no-cov"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-omn26387-ac6
    description: "The guard builds its production reader with a timeout above the loaded-host read time; the 120 second default fails this test."
    source: manual
    binds_ac: [AC6]
    checks:
      - check_type: test_passes
        check_value: >-
          uv run pytest tests/unit/handlers/scm/test_scm_duplicate_guard_reader_hosts.py -q --no-cov -k waits_for_the_reader
  - id: dod-omn26387-deploy-contract
    description: "Hosted deploy check: the guard's reader-host tests pass."
    source: manual
    checks:
      - check_type: test_passes
        check_value: >-
          uv run pytest tests/unit/handlers/scm/test_scm_duplicate_guard_reader_hosts.py -q --no-cov
  - id: dod-omn26387-integration-proof
    description: "Local Done gate only: the reader-host tests run on a lab host at the pushed head through onex lab-work."
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: >-
          onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-26387 --kind test -- uv run --frozen pytest tests/unit/handlers/scm/test_scm_duplicate_guard_reader_hosts.py -q --no-cov
        cwd: .
  - id: dod-omn26387-bounded-retry
    description: "A late first answer is retried once as the same bounded read and never as the 168 hour every-row read; the waits and the total budget come from the snapshot node contract and the clock is injected. These tests fail at origin/dev, which fell back to the every-row read."
    source: manual
    checks:
      - check_type: test_passes
        check_value: >-
          uv run pytest tests/unit/handlers/scm/test_scm_duplicate_guard_reader_timeout.py -q --no-cov -k "late or retry or budget or fallback"
  - id: dod-omn26387-retry-contract
    description: "Deploy assessment: the snapshot node contract declares retry_timeout_s in place of fallback_timeout_s and no every-row fallback. No migration, no prod mutation, no new topic. The check fails when the contract still declares the fallback."
    source: manual
    checks:
      - check_type: command
        check_value: "grep -q 'retry_timeout_s:' src/omnimarket/nodes/node_pr_duplicate_snapshot_effect/contract.yaml && ! grep -q 'fallback_timeout_s:' src/omnimarket/nodes/node_pr_duplicate_snapshot_effect/contract.yaml"
        cwd: .
