schema_version: 1.0.0
ticket_id: OMN-21279
title: omnimarket owns the composed runtime image and market boot gate
summary: >-
  Option B preserves market -> infra layering: omnimarket builds its runtime
  image FROM the infra runtime built at the release-train-moved tag in uv.lock,
  replacing any legacy market install in the base. This PR owns the market half
  of reusable-runtime-boot.yml's boot-catalog-local job: delegate-skill consumer
  liveness, all laptop service health checks and stopped-service controls, both
  kernels' /health bodies, and the strict dev-lane crash-loop phase. Each kernel
  must report the market version in this checkout's pyproject.toml. Infra's own
  removal and layering check remain infra-side obligations; this contract binds
  the market-owned composition that lets infra stop installing market.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-transcribed-acceptance-criteria
    statement: >-
      The ticket author's acceptance criteria, transcribed from the infra
      contract; this PR supplies the omnimarket-owned composed image and boot
      coverage supporting those infra-side criteria.
    acceptance:
      - id: AC1
        statement: 'AC1: the layering check refuses omnimarket named in Dockerfile.runtime, any CI install step or any test fixture of omnibase_infra -- falsifier: pytest of the layering check over fixture Dockerfile and workflow lines'
      - id: AC2
        statement: 'AC2: Dockerfile.runtime installs no omnimarket and the runtime still boots -- falsifier: the runtime-boot-smoke job on the PR head, plus the layering pytest over the real file'
evidence_requirements:
  - kind: tests
    description: >-
      Verify the locked infra tag resolver, market image composition and config
      paths, and the moved boot gates; live boot evidence comes from job
      composed-runtime-boot in .github/workflows/runtime-boot-composed.yml.
    command: uv run pytest tests/unit/docker/test_composed_runtime_image_omn21279.py -q
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn-21279-ac1-market-owns-composed-image
    description: >-
      AC1, infra-side criterion supported by this omnimarket PR: moving market's
      install and packaged delegation configs into the market-owned composed
      image lets infra remove market from its own runtime image. The pytest
      verifies FROM uses the required infra image argument, the resolver takes
      uv.lock's tag rather than its SHA, and market installs into /app/.venv.
      This is supporting composition evidence, not a replacement for infra's
      own layering checker. Red first: the tests fail before these files exist.
    source: generated
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/docker/test_composed_runtime_image_omn21279.py -q
    binds_ac:
      - "AC1"
  - id: dod-omn-21279-ac2-composed-runtime-boots
    description: >-
      AC2, market half: pytest guards image composition, packaged Bifrost base
      and routing ladder, the delegate-skill live consumer probe, projection
      health and stopped-service controls, checkout-version equality in each
      kernel, and the unchanged 900-second/zero-restart dev-lane gate. Live boot
      evidence is job composed-runtime-boot (display name composed-runtime-boot
      (omnimarket on infra)) in .github/workflows/runtime-boot-composed.yml on
      the PR head, building market from this checkout rather than a release.
    source: generated
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/docker/test_composed_runtime_image_omn21279.py -q
      - check_type: command
        check_value: |-
          gh api "repos/OmniNode-ai/omnimarket/commits/$(git rev-parse HEAD)/check-runs?per_page=100" --jq '[.check_runs[] | select(.name == "composed-runtime-boot (omnimarket on infra)")] | sort_by(.started_at) | last | .conclusion == "success"' | grep -qx true
    binds_ac:
      - "AC2"
  - id: dod-omn-21279-ac2-deploy-probe-composed-dockerfile
    description: >-
      AC2, deploy-scope probe: read the market Dockerfile through GitHub's API
      at the PR head carrying this contract. Fail unless the image inherits
      the required infra argument and copies the packaged Bifrost base to the
      configured path. The composed-runtime-boot job supplies live boot proof.
    source: generated
    checks:
      - check_type: command
        check_value: |-
          gh api "repos/OmniNode-ai/omnimarket/contents/docker/Dockerfile.runtime?ref=$(git rev-parse HEAD)" --jq '.content | gsub("\n";"") | @base64d | split("\n") as $l | ($l | map(. == "ARG INFRA_RUNTIME_IMAGE") | any) and ($l | map(. == "FROM ${INFRA_RUNTIME_IMAGE}") | any) and ($l | map(. == "ENV BIFROST_BASE_CONTRACT_PATH=/app/config/delegation/bifrost_delegation.base.yaml") | any) and ($l | map(. == "COPY --chown=omniinfra:omniinfra src/omnimarket/configs/bifrost_delegation.yaml /app/config/delegation/bifrost_delegation.base.yaml") | any)' | grep -qx true
    binds_ac:
      - "AC2"
