    source: generated
    binds_ac: [AC3]
    checks:
      - check_type: test_passes
        check_value: >-
          env PYTHONDONTWRITEBYTECODE=1 uv run pytest
          tests/nodes/node_pool_read_share_effect/test_golden_chain_pool_read_share_effect.py
          -q --no-cov
  - id: dod-omn-21279-probe-timeout-deploy-source-readback
    description: >-
      AC3 hosted-runner deploy-scope source readback: the public raw endpoint
      at the checkout head must serve the timeout handler preserving the
      subprocess exception's stdout and naming the last complete step.
      The merge base lacks these statements. This verifies published source;
      the subprocess tests above verify behavior, not a live lane deployment.
    source: generated
    binds_ac: [AC3]
    checks:
      - check_type: command
        check_value: >-
          bash -o pipefail -c 'curl --fail --silent --show-error
          "https://raw.githubusercontent.com/OmniNode-ai/omnimarket/$(git rev-parse HEAD)/src/omnimarket/nodes/node_pool_read_share_effect/handlers/handler_pool_read_share.py"
          | python3 -c "import sys; source=sys.stdin.read(); assert \"return _timed_out(argv, timeout, exc.stdout)\" in source; assert \"step = last_step(stdout)\" in source; assert \"before any step marker\" in source"'
