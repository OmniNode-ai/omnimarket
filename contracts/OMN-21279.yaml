schema_version: 1.0.0
ticket_id: OMN-21279
title: omnimarket owns the composed runtime image and market boot gate
summary: >-
  Option B preserves market -> infra layering: omnimarket builds its runtime
  image FROM the infra runtime built at the release-train-moved tag in uv.lock,
  replacing any legacy market install in the base. This PR owns the market half
  of reusable-runtime-boot.yml's boot-catalog-local job: delegate-skill consumer
  liveness, all laptop service health checks and stopped-service controls, both
  kernels' /health bodies, and the strict dev-lane crash-loop phase. Each kernel
  must report the market version in this checkout's pyproject.toml. Infra's own
  removal and layering check remain infra-side obligations; this contract binds
  the market-owned composition that lets infra stop installing market.
  The SCM CLI additionally hosts its selected market contract through the
  canonical dispatcher when explicitly using the in-memory bus. This path
  needs neither an infra runtime image nor Bifrost bootstrap configuration.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-transcribed-acceptance-criteria
    statement: >-
      The ticket author's acceptance criteria, transcribed from the infra
      contract; this PR supplies the omnimarket-owned composed image and boot
      coverage supporting those infra-side criteria.
    acceptance:
      - id: AC1
        statement: 'AC1: the layering check refuses omnimarket named in Dockerfile.runtime, any CI install step or any test fixture of omnibase_infra -- falsifier: pytest of the layering check over fixture Dockerfile and workflow lines'
      - id: AC2
        statement: 'AC2: Dockerfile.runtime installs no omnimarket and the runtime still boots -- falsifier: the runtime-boot-smoke job on the PR head, plus the layering pytest over the real file'
  - id: req-inprocess-scm-terminal
    statement: >-
      The SCM CLI hosts its selected contract on the in-memory bus before
      publishing a command, without external runtime bootstrap configuration.
    acceptance:
      - id: AC3
        statement: >-
          AC3: in-memory SCM commands return real terminal envelopes: PR-create
          dry runs complete without Bifrost configuration, closing without a
          claim fails, gateway reads return paginated threads, and gateway
          boundary failures fail -- falsifier: uv run pytest
          tests/unit/handlers/scm/test_onex_scm_command.py -k "real_terminal or without_a_claim or uses_the_gateway_handler or boundary_failure_is_reported" -q -n 0 --refuse-skips --maxfail=1
  - id: req-probe-timeout-step
    statement: Preserve the diagnostics of a pool probe that times out.
    acceptance:
      - id: AC3
        statement: >-
          A timed-out capture returns exit 255, preserves partial stdout, and
          names the last complete PROBE-STEP marker or says before any step
          marker. An incomplete final marker is ignored. Shared reads replay
          the diagnostic and the host-unreadable alarm row includes it.
  - id: req-codex-git-cache-roots
    statement: >-
      A Codex lane can run git fetch in its own clone: the sandbox's writable
      roots name the lane's common git dir and the objects directories of its
      alternates, and nothing wider.
    acceptance:
      - id: AC4
        statement: >-
          AC4: the roots program of node_codex_sandbox_probe_compute grants the
          lane's own common git dir and the objects directory of each of its
          alternates, never a registry peer's whole git dir, "/", $HOME or an
          alternate that is not a repository's objects directory -- falsifier:
          uv run pytest tests/nodes/node_codex_sandbox_probe_compute/test_codex_sandbox_probe.py tests/nodes/node_codex_sandbox_probe_compute/test_golden_chain_codex_sandbox_probe_compute.py -q --no-cov
  - id: req-codex-zero-turn-host-limits
    statement: >-
      The lane brief also requests a Codex host circuit breaker under the
      2026-10-26T11:31:48Z engine-policy ruling. The ticket's original infra
      layering criteria AC1 and AC2 above remain unchanged and are not
      claimed by this additional work.
    acceptance:
      - id: AC5
        statement: >-
          A zero-turn Codex HTTP 429 writes a host-specific Codex limit until
          the provider reset or one hour, prevents same-host retry, excludes
          that host from Codex placement and tick headroom, and reports daily
          Codex 429 counts by host.
  - id: req-lab-fill-live-ticket-gate
    statement: >-
      The lab fill re-reads each ticket's live state and assignee from Linear
      just before it sends a lane, and skips a ticket that is completed,
      cancelled, assigned to anyone other than the operator, or unread.
    acceptance:
      - id: AC6
        statement: >-
          AC6: gate_live_tickets and the live Linear gate skip completed,
          cancelled and other-owner tickets, send open tickets that are
          unassigned or the operator's, and send nothing when the live read
          fails -- falsifier: uv run pytest
          tests/unit/handlers/test_lab_fill_live_gate.py -q --no-cov
  - id: req-scm-consumer-timeout-diagnostic
    statement: >-
      Supplemental SCM diagnostics criterion declared by this PR, separate
      from the ticket author's unchanged infra layering criteria AC1 and AC2.
      This check does not claim that the dev runtime has recovered.
    acceptance:
      - id: AC7
        statement: >-
          AC7: after a command's terminal wait expires, the SCM caller reports
          no_consumer_for_topic only when complete broker evidence proves no
          serving runtime consumer, consumer_present_no_terminal for a serving
          consumer, and consumer_evidence_unreadable for incomplete or unstable
          evidence; it uses the producer's authenticated physical topic, keeps
          exit 75, publishes the write once, and never changes transport --
          falsifier: env UV_FROZEN=1 uv run pytest
          tests/unit/handlers/scm/test_scm_consumer_diagnostics.py
          tests/unit/handlers/scm/test_onex_scm_command.py
          -q --no-cov -n 0 --refuse-skips --maxfail=1
evidence_requirements:
  - kind: tests
    description: >-
      Verify the locked infra pins step, market image composition and config
      paths, and the moved boot gates; live boot evidence comes from job
      composed-runtime-boot in .github/workflows/runtime-boot-composed.yml.
    command: uv run pytest tests/unit/docker/test_composed_runtime_image_omn21279.py -q
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
