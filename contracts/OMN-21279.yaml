      active assignments, another lane's topics, audit readers, unstable groups
      and incomplete broker reads. A timeout names no_consumer_for_topic only
      when complete evidence proves zero serving consumers; an unreadable
      probe stays unknown. The opened producer supplies authentication and the
      physical topic. Writes publish once, retain exit 75, and never select a
      different transport. This is supporting diagnosis, not proof that the
      dev runtime recovered or that infra's layering criteria are complete.
      The new adapter tests fail at the merge base where the adapter is absent.
