    source: generated
    checks:
      - check_type: command
        check_value: >-
          bash -o pipefail -c 'curl --fail --silent --show-error "https://raw.githubusercontent.com/OmniNode-ai/omnimarket/$(git rev-parse HEAD)/src/omnimarket/nodes/node_runtime_coverage_compute/handlers/handler_runtime_coverage.py" | python3 -c "import sys; source=sys.stdin.read(); assert \"count >= 2\" in source; assert \"m.node == command.node and command.topic in m.topics\" in source"'
  - id: dod-omn-21279-probe-timeout-step-diagnostics
    description: >-
      AC3: exercise capture_live with real subprocess timeouts, partial stdout,
      no marker, a truncated marker, shared-cache replay, and the pool alarm
