schema_version: 1.0.0
ticket_id: OMN-23862
title: A rebuild piece reads READY only when real factory work crossed its joins and no neighbour reads NOT WORKING
summary: Every chain event carries a typed origin (unset is unknown, never real). The emission fold gives each join a real_golden_at beside its probe-health golden_at; the floor compute's readiness rule counts a join only when real_golden_at is inside the emission window, and holds a piece back while a neighbour on a counted join reads a status the overlay lists as blocking. Two new readiness overlay keys (real_origins, blocking_neighbour_statuses) carry the values. The board says why in plain words on each held-back piece, shows probe health apart from integration, and its readiness sentence names every in-scope piece including the ones that do not work. The ready count is expected to fall, likely to zero.
is_seam_ticket: true
interface_change: true
interfaces_touched:
  - public_api
  - topics
requirements:
  - id: req-omn23862-rule
    statement: A join counts toward READY only for a golden chain from real work, and a piece is not READY while a counted neighbour reads a blocking status; both values are the overlay's.
    acceptance:
      - id: AC1
        statement: 'AC1: the readiness block of the node_floor_simple_compute overlay carries two keys, real_origins and blocking_neighbour_statuses, both read from the overlay and none hard-coded; a probe-only golden chain and a real golden chain on the same join, and a working piece beside a not-working neighbour, read not ready, ready and not ready, and changing the overlay values changes the result -- falsifier: uv run pytest tests/nodes/node_floor_simple_compute/test_real_work_omn23862.py -k ''probe_only or neighbour or overlay_values'' fails on dev, where the fold has no origin and the rule no neighbour check'
  - id: req-omn23862-words
    statement: The board names why in plain words, shows probe health apart, and names every in-scope piece.
    acceptance:
      - id: AC2
        statement: 'AC2: a piece held back for this cause says ''green on probes only: no real work crossed this join in N hours'' or ''neighbour piece N reads NOT WORKING'', never a silent grey -- falsifier: uv run pytest tests/nodes/node_floor_simple_compute/test_real_work_omn23862.py -k ''hours or probe_only or neighbour'' asserting the exact sentence and the hours'
      - id: AC3
        statement: 'AC3: probe chains stay visible as health, shown apart from integration, and never count toward READY -- falsifier: uv run pytest tests/nodes/node_floor_simple_compute/test_real_work_omn23862.py -k probe_health asserting the health row and zero ready pieces on a board with probe chains only'
      - id: AC5
        statement: 'AC5: the readiness sentence names every in-scope piece, piece 3 included with its state -- falsifier: uv run pytest tests/nodes/node_floor_simple_compute/test_real_work_omn23862.py -k names_every_in_scope_piece'
  - id: req-omn23862-seams
    statement: The typed origin, the emission fold, the floor compute and the overlay agree, in memory and on the real dev broker, and fail when either side changes shape.
    acceptance:
      - id: AC4
        statement: 'AC4: the change has tests that fail without it, golden and error chain tests, run on the in-memory bus and on the real dev broker -- falsifier: the same pytest selection on the base commit fails on the new cases, and the dev-broker run''s reading is recorded in the pull request body'
  - id: req-omn23862-integrated
    statement: The branch is installed on the Mac through the installer with rollback proven first, and the published board is read before and after.
    acceptance:
      - id: AC6
        statement: 'AC6: integrated: installed from the branch on the Mac through the installer with rollback proven first, the published board read before and after, and both readings recorded on this ticket -- falsifier: the installer''s own rollback receipt and the two published board readings (ready count, per-piece reason text) as comments on this ticket'
  - id: req-omn23862-contract
    statement: This file is the definition of done for the ticket and names the runnable checks of AC1 to AC6.
    acceptance:
      - id: AC7
        statement: 'AC7: a definition-of-done contract file for this ticket exists in omnimarket at contracts/OMN-23862.yaml in the standard form, naming the runnable checks of AC1 to AC6 -- falsifier: the dod-verify check of the contract against the pull request in CI'
evidence_requirements:
  - kind: tests
    description: The readiness rule cases, the origin fold cases and the seams between the emission model, the fold, the floor compute and the overlay (AC1 to AC5 and the in-memory half of AC4).
    command: uv run --frozen pytest tests/nodes/node_floor_emission_compute/test_origin_real_work_omn23862.py tests/nodes/node_floor_emission_compute/test_origin_seam_omn23862.py tests/nodes/node_floor_simple_compute/test_real_work_omn23862.py -q -n 0 -p no:randomly --no-cov tests/nodes/node_floor_simple_compute/test_readiness_omn23081.py
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn23862-ac1
    description: AC1 is the real-work rule cases, the neighbour cases and the overlay value cases, with the origin fold cases under them.
    source: manual
    binds_ac:
      - AC1
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/nodes/node_floor_simple_compute/test_real_work_omn23862.py -q -n 0 -p no:randomly --no-cov -k "probe_only or real_golden or neighbour or overlay_values or without_either_key"
        cwd: .
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/nodes/node_floor_emission_compute/test_origin_real_work_omn23862.py -q -n 0 -p no:randomly --no-cov
        cwd: .
  - id: dod-omn23862-ac2
    description: AC2 is the exact reason sentences and the hours from the window.
    source: manual
    binds_ac:
      - AC2
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/nodes/node_floor_simple_compute/test_real_work_omn23862.py -q -n 0 -p no:randomly --no-cov -k "hours or probe_only or neighbour"
        cwd: .
  - id: dod-omn23862-ac3
    description: AC3 is the probe health row and zero ready pieces on a probe-only board.
    source: manual
    binds_ac:
      - AC3
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/nodes/node_floor_simple_compute/test_real_work_omn23862.py -q -n 0 -p no:randomly --no-cov -k "probe_health"
        cwd: .
  - id: dod-omn23862-ac4
    description: AC4 in-memory half is the seam file run on the in-memory bus; the real dev broker half is the same file with FLOOR_ORIGIN_SEAM_LANE set on a lab host, whose reading is in the pull request body.
    source: manual
    binds_ac:
      - AC4
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/nodes/node_floor_emission_compute/test_origin_seam_omn23862.py -q -n 0 -p no:randomly --no-cov -k "not redpanda"
        cwd: .
  - id: dod-omn23862-ac5
    description: AC5 is the readiness sentence naming piece 3 with its state.
    source: manual
    binds_ac:
      - AC5
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/nodes/node_floor_simple_compute/test_real_work_omn23862.py -q -n 0 -p no:randomly --no-cov -k "names_every_in_scope_piece"
        cwd: .
  - id: dod-omn23862-integration-proof-published-board
    description: AC6 is the Mac install of this branch through the installer with the rollback receipt, and the two published board readings as ticket comments; hosted CI cannot reach the Mac, so only the local Done gate runs this unbound check, which reads the served board and fails when a piece reads ready beside a probe-only join or the probe health text is absent.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: "curl -sf -m 20 \"${FLOOR_SIMPLE_URL:?set FLOOR_SIMPLE_URL to the served floor-simple.json}\" | python3 -c \"import json,sys; d=json.load(sys.stdin); assert d['readiness']['probe_health_text'] and all(not (p['ready'] and p['probe_only_joins']) for p in d['pieces']), d['readiness']['text']\""
        cwd: .
  - id: dod-omn23862-ac6
    description: AC6 hosted part is the probe health board, which reads zero ready pieces beside the health row; the install from the branch with its rollback receipt and the two published board readings are ticket comments, and the served board is read by the unbound integration proof above.
    source: manual
    binds_ac:
      - AC6
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/nodes/node_floor_simple_compute/test_real_work_omn23862.py -q -n 0 -p no:randomly --no-cov -k "probe_health"
        cwd: .
  - id: dod-omn23862-ac7
    description: AC7 is this contract read by dod-verify against the pull request; the check greps the changed floor compute source for the real work join reading, which the merge base lacks.
    source: manual
    binds_ac:
      - AC7
    checks:
      - check_type: command
        check_value: grep -q real_golden_at src/omnimarket/nodes/node_floor_simple_compute/handlers/handler_floor_simple.py
        cwd: .
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/nodes/node_floor_simple_compute/test_real_work_omn23862.py -q -n 0 -p no:randomly --no-cov -k "real_golden_chain"
        cwd: .
