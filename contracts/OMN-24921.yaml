schema_version: 1.0.0
ticket_id: OMN-24921
title: 'Review findings 1 to 9 on the outbox reuse pull request are fixed or argued: a repeat refusal refreshes the one refused file, the contract tests bind to the outbox, and the lab readback is on the new head'
summary: The review of the outbox reuse pull request at head 7c5d0b219491 returned CHANGES NEEDED. A clash refused again past the reuse window now refreshes the one refused file, a future or unparsable refused_at reads as expired, the contract tests drive the loaded outbox module, the AC5 check can fail on a red required context, and a corrupt refused file is survived through the replay caller.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24921-outbox-review-findings
  statement: Each blocking review finding on the outbox reuse pull request is fixed with a test that fails before the change, or argued with evidence in a pull request comment.
  acceptance:
  - id: AC1
    statement: 'AC1: the head''s red contexts (CI Summary, Coverage Sweep Gate, Repo Evidence Dependency, delegation-health-check) are each read as red or green on dev 6efbe3ee, the failing log lines are quoted in a PR comment, a comment starting `Lab: head=<new head>` carries the suite run on the lab (parts named if split), and git diff 17dfc41 to the new head over tests/ removes no assertion -- falsifier: `onex scm pr-checks OmniNode-ai/omnimarket#6052` lists a required context that is not success at the new head'
  - id: AC2
    statement: 'AC2: a replay past the age window whose id the ledger still holds is sent twice and leaves one refused file, with refused_at refreshed in the existing file on a repeat clash over the same rows and report_refused_to_writers returning 0, and the [OMN-24250](https://linear.app/omninode/issue/OMN-24250) contract text no longer says no second file where that is untrue -- falsifier: `uv run pytest tests/ -q -k "outbox and refused and window"` in omnimarket exits non-zero at 7c5d0b219491 or selects zero tests'
  - id: AC3
    statement: 'AC3: the [OMN-24875](https://linear.app/omninode/issue/OMN-24875) AC4 contract tests run against the outbox module of the PR head, and the -k selections at contracts/[OMN-24875](https://linear.app/omninode/issue/OMN-24875).yaml lines 25 and 65 also select test_contract_omn_24250_ac2_description_says_it_is_a_preservation_criterion, so the merge-base control fails them -- falsifier: `uv run pytest tests/ -q -k "contract and OMN_24875"` in omnimarket passes with the merge-base outbox module loaded'
  - id: AC4
    statement: 'AC4: dod-omn24875-ac5 is described and bound as what it is, to a check that can fail on a red required context, shown by whether onex scm pr-checks exits non-zero on one -- falsifier: `onex scm pr-checks OmniNode-ai/omnimarket#6052` exit code read against a red required context'
  - id: AC5
    statement: 'AC5: a corrupt refused file holding a list, null or broken JSON is left out through select.replay_outbox with report_refused_to_writers surviving it, and a PR comment lists the other callers of outbox.drain and the readers of DrainResult.refused found by a src/ grep -- falsifier: `uv run pytest tests/ -q -k "outbox and corrupt and replay"` in omnimarket exits non-zero at 7c5d0b219491 or selects zero tests'
  - id: AC6
    statement: 'AC6: each non-blocking finding 6 to 9 of the review is fixed or argued in a PR comment, among them a future or unparsable or naive refused_at treated as expired with a test, the test names in [OMN-24875](https://linear.app/omninode/issue/OMN-24875).yaml lines 32 and 47 spelled out, and the durations split between config/test_file_durations.json and the .d shard settled -- falsifier: `uv run pytest tests/ -q -k "outbox and refused_at"` in omnimarket exits non-zero at 7c5d0b219491 or selects zero tests'
evidence_requirements:
- kind: tests
  description: The outbox reuse and contract-text tests pass at the pushed head; the window, refused-at and contract-text tests fail with the merge-base outbox module loaded.
  command: uv run pytest tests/handlers/bus_binding/test_outbox_refused_receipt_reuse.py tests/handlers/bus_binding/test_outbox_contract_text.py -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24921-ac1
  description: 'AC1: the red and pending required contexts at the head are read from the PR watcher (the check exits 1 while any is red or pending); the failing job log lines, the dev read, the lab run and the tests/ diff are in the PR comments. The watcher is not reachable from hosted CI, so only the local Done gate runs it.'
  source: manual
  execution_scope: local_done_gate
  binds_ac:
  - AC1
  checks:
  - check_type: command
    check_value: sh -c 'onex scm pr-checks OmniNode-ai/omnimarket#6052 | python3 -c "import json,sys; r=[json.loads(l) for l in sys.stdin if l.startswith(chr(123))][-1][\"result\"]; sys.exit(1 if r[\"red\"] or r[\"pending\"] else 0)"'
    cwd: .
- id: dod-omn24921-ac2
  description: 'AC2: past the window with the id still in the ledger the replay is sent twice and one refused file is left, its refused_at refreshed and its reported_at kept, and report_refused_to_writers returns 0; the OMN-24250 summary and AC1 evidence say what holds in and past the window.'
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/handlers/bus_binding -q --no-cov -p no:cacheprovider -k "outbox and refused and window"
    cwd: .
- id: dod-omn24921-ac3
  description: 'AC3: the selection names all three contract tickets and includes a test that drives the loaded outbox module, which fails with the merge-base outbox module loaded.'
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/handlers/bus_binding -q --no-cov -p no:cacheprovider -k "contract and (OMN_24827 or OMN_24250 or OMN_24875)"
    cwd: .
- id: dod-omn24921-ac4
  description: 'AC4: the check bound to AC5 of the OMN-24875 contract exits 1 on a red or pending context and 0 on none, shown with a stand-in onex; onex scm pr-checks itself exits 0 on a red head.'
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/handlers/bus_binding -q --no-cov -p no:cacheprovider -k "contract and OMN_24875 and ac5"
    cwd: .
- id: dod-omn24921-ac5
  description: 'AC5: seven corrupt refused-file shapes replayed through select.replay_outbox leave the drain and the reporter standing; the callers of outbox.drain and readers of DrainResult.refused are listed in the PR comment.'
  source: manual
  binds_ac:
  - AC5
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/handlers/bus_binding -q --no-cov -p no:cacheprovider -k "outbox and corrupt and replay"
    cwd: .
- id: dod-omn24921-ac6
  description: 'AC6: a future, unparsable, non-string or naive refused_at is read as expired or as UTC, with tests; the OMN-24875 test names are spelled out and the reuse test file''s duration entry is in the durations shard.'
  source: manual
  binds_ac:
  - AC6
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/handlers/bus_binding -q --no-cov -p no:cacheprovider -k "outbox and refused_at"
    cwd: .
- id: dod-omn24921-integration-proof
  description: the outbox reuse tests and the neighbouring outbox suites run on a lab host at the pushed head; hosted CI cannot reach the lab, so only the local Done gate runs this unbound check
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24921 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/handlers/bus_binding tests/nodes/node_bus_binding_reducer/test_outbox_request_id_clash.py -q --no-cov
    cwd: .
