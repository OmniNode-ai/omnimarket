schema_version: 1.0.0
ticket_id: OMN-21115
title: TA.13 Receipts projection and install confirmation
summary: Adds the install-confirm trigger effect node, which consumes the session-content projection's applied event, builds the request through the request compute, derives the confirmation through the install-confirm compute and publishes it on the completed topic the receipts projection folds. A rows_upserted of zero publishes nothing. The compute, fold and writer already on dev are unchanged.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn21115-ta13
    statement: The install-confirm trigger runs on the applied event and the receipts replay uses only the fold.
    acceptance:
      - id: AC1
        statement: "AC1: on P6-recorded sessions, captured: a custom compaction yields `installed` with the boundary uuid; a tampered copy yields `install_mismatch`; custom then native (v6, corrected) keeps `installed` for the custom activation, records it `retired` at the native boundary in the current-context projection, and makes the native boundary current; an activation published before a native boundary and never installed yields `not_installed(native_compaction)`; native then custom yields `installed` for the custom one; a discarded precompute yields `not_installed(not_selected)`; a preserved message containing an older activation line is never selected; a truncated record yields `uncertain`; a resumed and a forked session (per P11c) select the boundary on their own active chain; a later captured turn with no compact record yields `uncertain(capture_gap)` -- falsifier: fixture table"
      - id: AC2
        statement: "AC2: every permutation of a fixture event set, with duplicates, folds to the same state per candidate and per activation, and to the same current-context state per session -- falsifier: two permutations with different states"
      - id: AC3
        statement: "AC3: no installation fact changes after it is first derived: replaying a session's events with a later boundary appended leaves every earlier activation's installation fact byte-identical -- falsifier: an installation fact that differs between the two replays"
      - id: AC4
        statement: "AC4: the writer reports `rows_upserted` greater than zero for a replayed event set -- falsifier: zero rows with committed offsets (the rule 7a symptom)"
      - id: AC5
        statement: "AC5: replay rebuilds the table without invoking any node but the fold -- falsifier: a model, CLI or transcript read during replay"
evidence_requirements:
  - kind: tests
    description: Trigger, compute, fold and writer suites at the pushed head.
    command: uv run pytest tests/nodes/node_context_install_confirm_trigger_effect -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn21115-ac1
    description: "AC1 is the fixture table already on dev (install-confirm and current-context fold tests, one case per line of the criterion) plus the trigger chain: an applied event with a custom compaction yields a confirmation whose installation fact is installed, equal to the compute node's result for the built request. The live captured-session leg is owed: this lane has no dev-bus login with the hook-emit grants."
    source: manual
    binds_ac:
      - AC1
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/nodes/node_context_install_confirm_compute tests/nodes/node_context_compaction_receipts_fold_compute tests/nodes/node_context_install_confirm_trigger_effect/test_handler_context_install_confirm_trigger.py -q --no-cov --tb=line
        cwd: .
  - id: dod-omn21115-ac2
    description: "AC2 is the permutation-with-duplicates tests of the install-confirm compute and of the receipts and current-context folds, both on dev."
    source: manual
    binds_ac:
      - AC2
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/nodes/node_context_install_confirm_compute/test_handler_context_install_confirm.py::test_every_permutation_with_duplicates_folds_to_one_result tests/nodes/node_context_compaction_receipts_fold_compute/test_handler_context_current_context_fold.py::test_every_permutation_with_duplicates_folds_to_one_state tests/nodes/node_context_compaction_receipts_fold_compute/test_handler_context_compaction_receipts_fold.py::test_200_permutations_with_random_duplicate_insertion -q --no-cov --tb=line
        cwd: .
  - id: dod-omn21115-ac3
    description: "AC3 is the append-a-later-boundary tests of the compute and of the fold, both on dev."
    source: manual
    binds_ac:
      - AC3
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/nodes/node_context_install_confirm_compute/test_handler_context_install_confirm.py::test_appending_a_later_boundary_never_changes_an_earlier_fact tests/nodes/node_context_compaction_receipts_fold_compute/test_handler_context_compaction_receipts_fold.py::test_later_boundary_preserves_earlier_activation_folds -q --no-cov --tb=line
        cwd: .
  - id: dod-omn21115-ac4
    description: "AC4 is the writer suite on dev plus a new chain test: a confirmation the trigger produces, replayed twice, reaches the writer and reports rows_upserted above zero with every row verdict installed; the writer suite also pins zero for a refused insert."
    source: manual
    binds_ac:
      - AC4
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/test_compaction_receipts_projection_writer.py tests/nodes/node_context_install_confirm_trigger_effect/test_handler_context_install_confirm_trigger.py::test_replayed_confirmation_is_written_with_rows_upserted_above_zero -q --no-cov --tb=line
        cwd: .
  - id: dod-omn21115-ac5
    description: "AC5 is a new test that blocks process spawn, network connect and file open while the fold rebuilds the receipt rows from a stored confirmation."
    source: manual
    binds_ac:
      - AC5
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/nodes/node_context_install_confirm_trigger_effect/test_handler_context_install_confirm_trigger.py::test_replay_runs_only_the_fold_with_no_process_network_or_transcript_read -q --no-cov --tb=line
        cwd: .
  - id: dod-omn21115-integration-proof
    description: The pushed head ran the trigger, install-confirm, receipts fold and writer suites on a lab host and exited 0. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check. The live compaction leg stays owed, because this lane has no dev-bus login with the hook-emit grants.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-21115 -- uv run --frozen pytest tests/nodes/node_context_install_confirm_trigger_effect tests/nodes/node_context_install_confirm_compute tests/nodes/node_context_compaction_receipts_fold_compute tests/test_compaction_receipts_projection_writer.py -q --no-cov
        cwd: .
