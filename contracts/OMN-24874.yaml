schema_version: 1.0.0
ticket_id: OMN-24874
title: A tenant overlay run is priced from the declared model price, and a failed R8 or R9 run writes an alarm row
summary: The R8 organic control runs on the dev probe tenant's own key, so its route is the tenant overlay and its tier name is tenant_overlay. The routing registry declares no such tier, so the workflow terminal and the projection both re-priced the run through resolve_tier_cost as no_cost_model and stored cost_usd 0.0, while the catalogue declares a price for glm-5.3-flash on that endpoint. The terminal now prices a tier with no registry cost model from the declared per-1M price for the endpoint and model (booked metered), and the projection keeps a priced terminal cost instead of overwriting it with the zero re-measurement; a model no table prices stays unpriced. A new node, node_delegation_scenario_alarm_effect, reads the R8 and R9 last-run records on its host every 900 seconds (a registry module tick declared in node_host_installer_registry_units) and appends one ledger STATUS row with src=alarm and alarm=delegation-scenario-r8-failed or alarm=delegation-scenario-r9-failed for a failed or unreadable run.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24874-priced-and-alarmed
  statement: A run on a customer's own key is stored with the declared model price, and a failed R8 or R9 run writes one alarm row.
  acceptance:
  - id: AC1
    statement: 'AC1: the newest r8 run on h053 reads 13 of 13 checks passed with a real provider cost above zero, read from its own job record -- falsifier: journalctl --user -u onex-delegation-scenario-r8 on h053 for the newest run shows fewer than 13 passed checks or a cost_usd of 0.0'
  - id: AC2
    statement: 'AC2: the newest r9 run on h053 reads passed, read from its own job record -- falsifier: the newest r9 scenario row on h053 reads success false, or systemctl --user show onex-delegation-scenario-r9 reports a non-zero exit status'
  - id: AC3
    statement: 'AC3: each fix is merged and the revision running on h053 and on the dev runtime is a dev-merge tag that contains it -- falsifier: git merge-base --is-ancestor <fix sha> <running dev-merge tag> exits 1, or the revision read on h053 lacks the fix sha'
  - id: AC4
    statement: 'AC4: a scheduled check writes an alarm row when either run fails, and it was run once -- falsifier: a run of the check over a forced r8 or r9 failure leaves no STATUS row with alarm= naming r8 or r9 on the ledger'
  - id: AC5
    statement: 'AC5: every fix pull request has a STATUS row verdict=CLEAN from a Fable review at its head -- falsifier: grep -F ''verdict=CLEAN'' $ONEX_LEDGER_PATH | grep -F ''<head sha prefix>'' finds no row for a fix head'
evidence_requirements:
- kind: tests
  description: The tenant overlay pricing tests, the existing cost path tests, the alarm node tests and the registry unit tests.
  command: env -u PYTHONPATH uv run --frozen pytest tests/unit/delegation/test_omn24874_tenant_overlay_terminal_cost.py tests/unit/delegation/test_escalation_metered_cost_reaches_projection_omn13535.py tests/unit/delegation/test_omn24562_glm_53_flash_priced_cost_row.py tests/nodes/node_delegation_scenario_alarm_effect/test_golden_chain_delegation_scenario_alarm.py tests/nodes/node_host_installer_registry_units/test_registry_units.py -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24874-ac1-tenant-overlay-priced
  description: Hosted proxy for AC1. The terminal of a tenant overlay run on glm-5.3-flash is priced above zero from the declared price, the projection keeps that cost, and an undeclared model stays no_cost_model. Fails at the merge base (the projection stores 0.0). The live r8 reading on h053 is taken after the fix runs on the dev runtime.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/delegation/test_omn24874_tenant_overlay_terminal_cost.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24874-ac4-alarm-row
  description: A failed or missing R8 or R9 last-run record yields one STATUS row with src=alarm and alarm=delegation-scenario-r8-failed or -r9-failed, a passing record yields none, one failed run keeps one request id, an unappended alarm fails the tick, and the installer declares the 900-second timer.
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_delegation_scenario_alarm_effect/test_golden_chain_delegation_scenario_alarm.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24874-live-readings
  description: Hosted CI cannot reach a lab host, so only the local Done gate runs this unbound check. It reads the newest R8 and R9 last-run records on the lab host and fails unless both read success. AC2 and AC3 are readings taken on h053 and on the dev runtime after the merge.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: >-
      sh -c 'grep -q success "$HOME/.local/state/omni/delegation-scenario-r8/last-run.json" && grep -q success "$HOME/.local/state/omni/delegation-scenario-r9/last-run.json"'
    cwd: .
- id: dod-omn24874-integration-proof
  description: The tenant overlay pricing tests, the projection cost tests and the alarm node tests run on a lab host at the pushed head through the lab work runner; hosted CI cannot reach the lab, so only the local Done gate runs this unbound check. The live r8 and r9 readings on h053 follow the dev deploy of the merged fix.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24874 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/delegation/test_omn24874_tenant_overlay_terminal_cost.py tests/nodes/node_delegation_scenario_alarm_effect/test_golden_chain_delegation_scenario_alarm.py tests/nodes/node_host_installer_registry_units/test_registry_units.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24874-ac2-r9-node
  description: Hosted proxy for AC2. The R9 node's golden-chain test still passes with this change. The live r9 reading is taken on h053 from its own job record.
  source: manual
