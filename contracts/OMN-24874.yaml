schema_version: 1.0.0
ticket_id: OMN-24874
title: A tenant overlay run is priced from the declared model price, and a failed R8 or R9 run writes an alarm row
summary: The R8 organic control runs on the dev probe tenant's own key, so its route is the tenant overlay and its tier name is tenant_overlay. The routing registry declares no such tier, so the workflow terminal and the projection both re-priced the run through resolve_tier_cost as no_cost_model and stored cost_usd 0.0, while the catalogue declares a price for glm-5.3-flash on that endpoint. The terminal now prices a tier with no registry cost model from the declared per-1M price for the endpoint and model (booked metered), and the projection keeps a priced terminal cost instead of overwriting it with the zero re-measurement; a model no table prices stays unpriced. A new node, node_delegation_scenario_alarm_effect, reads the R8 and R9 last-run records on its host every 900 seconds (a registry module tick declared in node_host_installer_registry_units) and appends one ledger STATUS row with src=alarm and alarm=delegation-scenario-r8-failed or alarm=delegation-scenario-r9-failed for a failed or unreadable run.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24874-priced-and-alarmed
  statement: A run on a customer's own key is stored with the declared model price, and a failed R8 or R9 run writes one alarm row.
  acceptance:
  - id: AC1
    statement: 'AC1: the newest r8 run on h053 reads 13 of 13 checks passed with a real provider cost above zero, read from its own job record -- falsifier: journalctl --user -u onex-delegation-scenario-r8 on h053 for the newest run shows fewer than 13 passed checks or a cost_usd of 0.0'
  - id: AC2
    statement: 'AC2: the newest r9 run on h053 reads passed, read from its own job record -- falsifier: the newest r9 scenario row on h053 reads success false, or systemctl --user show onex-delegation-scenario-r9 reports a non-zero exit status'
  - id: AC3
    statement: 'AC3: each fix is merged and the revision running on h053 and on the dev runtime is a dev-merge tag that contains it -- falsifier: git merge-base --is-ancestor <fix sha> <running dev-merge tag> exits 1, or the revision read on h053 lacks the fix sha'
  - id: AC4
    statement: 'AC4: a scheduled check writes an alarm row when either run fails, and it was run once -- falsifier: a run of the check over a forced r8 or r9 failure leaves no STATUS row with alarm= naming r8 or r9 on the ledger'
  - id: AC5
    statement: 'AC5: every fix pull request has a STATUS row verdict=CLEAN from a Fable review at its head -- falsifier: grep -F ''verdict=CLEAN'' $ONEX_LEDGER_PATH | grep -F ''<head sha prefix>'' finds no row for a fix head'
evidence_requirements:
- kind: tests
  description: The tenant overlay pricing tests, the existing cost path tests, the alarm node tests and the registry unit tests.
  command: env -u PYTHONPATH uv run --frozen pytest tests/unit/delegation/test_omn24874_tenant_overlay_terminal_cost.py tests/unit/delegation/test_escalation_metered_cost_reaches_projection_omn13535.py tests/unit/delegation/test_omn24562_glm_53_flash_priced_cost_row.py tests/nodes/node_delegation_scenario_alarm_effect/test_golden_chain_delegation_scenario_alarm.py tests/nodes/node_host_installer_registry_units/test_registry_units.py -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24874-ac1-tenant-overlay-priced
  description: Hosted proxy for AC1. The terminal of a tenant overlay run on glm-5.3-flash is priced above zero from the declared price, the projection keeps that cost, and an undeclared model stays no_cost_model. Fails at the merge base (the projection stores 0.0). The live r8 reading on h053 is taken after the fix runs on the dev runtime.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/delegation/test_omn24874_tenant_overlay_terminal_cost.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24874-ac4-alarm-row
  description: A failed or missing R8 or R9 last-run record yields one STATUS row with src=alarm and alarm=delegation-scenario-r8-failed or -r9-failed, a passing record yields none, one failed run keeps one request id, an unappended alarm fails the tick, and the installer declares the 900-second timer.
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_delegation_scenario_alarm_effect/test_golden_chain_delegation_scenario_alarm.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24874-live-readings
  description: 'Hosted CI cannot reach a lab host, so only the local Done gate runs this unbound check. It parses the conclusion field of the newest R8 and R9 last-run records on the lab host and fails unless both read success; a record whose conclusion is failure or refused fails it.'
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: >-
      sh -c 'python3 -c "import json,sys; d=json.load(open(sys.argv[1])); sys.exit(0 if d[sys.argv[2]]==sys.argv[3] else 1)" "$HOME/.local/state/omni/delegation-scenario-r8/last-run.json" conclusion success && python3 -c "import json,sys; d=json.load(open(sys.argv[1])); sys.exit(0 if d[sys.argv[2]]==sys.argv[3] else 1)" "$HOME/.local/state/omni/delegation-scenario-r9/last-run.json" conclusion success'
    cwd: .
- id: dod-omn24874-ac1-r8-live-13-of-13
  description: Live reading for AC1. The newest R8 scenario result in the host's event journal concluded success with 13 assertions all held (each reads +name), including +organic_run_has_values, the assertion that the organic run carries a cost above zero. Local Done gate only; the reading is taken on h053 after the fix runs on the dev runtime.
  source: manual
  binds_ac:
  - AC1
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: >-
      sh -c 'python3 -c "import json,sys; f,sc,pl,sid,asr,cc,ok,n,plus,cost=sys.argv[1:]; rows=[json.loads(l)[pl] for l in open(f) if l.strip()]; p=[r for r in rows if r.get(sid)==sc][-1]; a=p[asr]; sys.exit(0 if p[cc]==ok and len(a)==int(n) and all(x.startswith(plus) for x in a) and plus+cost in a else 1)" "${OMNI_HOME:?}/.onex_state/delegation-scenario-r8/events.jsonl" R8 payload scenario_id assertions conclusion success 13 + organic_run_has_values'
    cwd: .
- id: dod-omn24874-ac2-r9-live
  description: Live reading for AC2. The newest R9 last-run record on the lab host parses to conclusion success. Local Done gate only.
  source: manual
  binds_ac:
  - AC2
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: >-
      sh -c 'python3 -c "import json,sys; d=json.load(open(sys.argv[1])); sys.exit(0 if d[sys.argv[2]]==sys.argv[3] else 1)" "$HOME/.local/state/omni/delegation-scenario-r9/last-run.json" conclusion success'
    cwd: .
- id: dod-omn24874-ac4-alarm-ledger-row
  description: Live reading for AC4. The ledger holds a STATUS row with src=alarm and alarm=delegation-scenario-r8-failed or alarm=delegation-scenario-r9-failed, left by the alarm tick run once over a forced failure. Local Done gate only.
  source: manual
  binds_ac:
  - AC4
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: >-
      sh -c 'python3 "${OMNI_PLUGIN_ROOT:?}/skills/lane-brief/scripts/lane_brief.py" grep "src=alarm.*alarm=delegation-scenario-r[89]-failed" | grep -q STATUS'
    cwd: .
- id: dod-omn24874-integration-proof
  description: The tenant overlay pricing tests, the projection cost tests and the alarm node tests run on a lab host at the pushed head through the lab work runner; hosted CI cannot reach the lab, so only the local Done gate runs this unbound check. The live r8 and r9 readings on h053 follow the dev deploy of the merged fix.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24874 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/delegation/test_omn24874_tenant_overlay_terminal_cost.py tests/nodes/node_delegation_scenario_alarm_effect/test_golden_chain_delegation_scenario_alarm.py tests/nodes/node_host_installer_registry_units/test_registry_units.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24874-real-postgres
  description: The real-Postgres file of this change runs on a lab host against a disposable postgres:16-alpine container that the command starts (random password, loopback port) and removes; it fails when any of the file's tests is skipped, so a host without Docker or a database cannot pass it. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: >-
      env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-real-postgres-24874 --kind test -- sh -c 'PW=$(head -c 18 /dev/urandom | base64 | tr -dc A-Za-z0-9); N=dod-omn24874-pg-$$; OUT=/tmp/$N.out; docker run -d --rm --name "$N" -e POSTGRES_PASSWORD="$PW" -e POSTGRES_DB=omnibase_infra -p 127.0.0.1::5432 postgres:16-alpine >/dev/null; trap "docker rm -f $N >/dev/null; rm -f $OUT" EXIT; for i in $(seq 1 40); do docker exec "$N" pg_isready -U postgres -q && break; sleep 1; done; PORT=$(docker port "$N" 5432/tcp | head -1 | sed "s/.*://"); INTEGRATION_POSTGRES_PASSWORD="$PW" INTEGRATION_POSTGRES_HOST=127.0.0.1 INTEGRATION_POSTGRES_PORT="$PORT" env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/test_omn24874_tenant_overlay_cost_real_postgres.py -q --no-cov -n 0 -p no:randomly -rs > "$OUT" 2>&1; R=$?; cat "$OUT"; ! grep -q skipped "$OUT" && exit $R'
    cwd: .
- id: dod-omn24874-ac3-fix-ancestry
  description: Live reading for AC3. The merge commit of this change on origin/dev is an ancestor of the revision the registry clone on this lab host runs, which is the revision the R8 and R9 units render from. Local Done gate only; it fails before the merge, when no commit on origin/dev names the ticket.
  source: manual
  binds_ac:
  - AC3
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: >-
      sh -c 'F=$(git log origin/dev -1 --format=%H --grep="^OMN-24874") && test -n "$F" && git -C "${OMNI_HOME:?}/omnimarket" merge-base --is-ancestor "$F" HEAD'
    cwd: .
- id: dod-omn24874-ac5-clean-verdict-row
  description: Live reading for AC5. The ledger holds a STATUS row with verdict=CLEAN for this pull request. Local Done gate only.
  source: manual
  binds_ac:
  - AC5
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: >-
      sh -c 'python3 "${OMNI_PLUGIN_ROOT:?}/skills/lane-brief/scripts/lane_brief.py" grep "verdict=CLEAN" | grep -F "omnimarket#6335" | grep -q STATUS'
    cwd: .
