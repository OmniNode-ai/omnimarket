schema_version: 1.0.0
ticket_id: OMN-24660
title: Fix omnimarket#6298 canonical file shape refusals and the Fable findings (review-gate commit status)
summary: 'Continues the review-gate commit status pull request on its own branch and answers the five findings of the Fable review at head f06ab557c00a: the canonical file shape refusals, the fail-open
  landing status gate, the required-context write, the stale contract and body, and the status link.'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24660-fable-findings
  statement: Every finding of the Fable review of the review-gate commit status pull request is fixed in its branch or argued with evidence, and the branch passes the canonical file shape check.
  acceptance:
  - id: AC1
    statement: 'AC1: the canonical file shape check passes at the new head of omnimarket#6298: the orchestrator command-line entry lives in runtime_review_gate_context_sweep.py beside contract.yaml with
      __main__.py deleted and ReviewGateSourceError caught, the two baselined files do not grow, and the five new type-ignore comments are replaced by typed code -- falsifier: the canonical file shape check
      at the CI-pinned core reports 0 refusals on the new head, run on the lab with uv run pytest tests/unit/nodes/node_review_gate_context_orchestrator -q'
  - id: AC2
    statement: 'AC2: a test reproduces the top finding red then green: the default landing and pr-handoff wiring refuses a new-work head that has no fable-review-gate status, with a gateway commit_statuses
      reader filling ModelLandingReviewFacts.statuses and the handoff port, or the work moves to a named ticket and the PR body drops Closes -- falsifier: uv run pytest tests/unit/nodes -k review_status_default_wiring
      -q fails on head f06ab557c00a and passes on the new head'
  - id: AC3
    statement: 'AC3: required_context_apply posts add-only to the contexts endpoint or maps a null app_id, and its tests cover an app_id of None and a contexts-only body -- falsifier: uv run pytest tests/unit/nodes/node_github_repo_write_effect/test_handler_required_context.py
      -q fails without the change and passes with it'
  - id: AC4
    statement: 'AC4: the PR body is rewritten for both tickets with a lab reading at the new head and contracts/OMN-24614.yaml line 86 runs commit-statuses, and finding 5 is fixed or argued so the status
      target_url links the verdict comment or the contract says PR link -- falsifier: a PR comment lists each of the 5 findings as fixed or argued and a Lab: head=<full sha> comment names the new head,
      checked by reading them against comment 6904003029'
  - id: AC5
    statement: 'AC5: the PR''s required suites pass on the lab at the new head and the new head is commented on the PR -- falsifier: uv run pytest tests/unit/nodes -q run through lab-run on the lab exits
      0 at the new head'
evidence_requirements:
- kind: tests
  description: The suites the pull request names, run on the lab at the new head.
  command: env -u PYTHONPATH uv run --frozen pytest tests/unit/nodes/node_review_gate_context_orchestrator tests/unit/nodes/node_review_gate_context_compute tests/unit/nodes/node_github_repo_write_effect
    tests/unit/nodes/node_pr_landing_decision_compute tests/unit/nodes/node_pr_handoff_decision_compute tests/unit/nodes/node_pr_handoff_orchestrator tests/nodes/node_review_gate_context_effect -q --no-cov
    -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24660-ac1-shape
  description: The orchestrator command line and its exit-3 case, and the typed tests that replaced the five type-ignore comments.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/nodes/node_review_gate_context_orchestrator -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24660-ac2-default-wiring
  description: The default landing wiring holds a new-work head that has no fable-review-gate status read; red at head f06ab557c00a, green at the new head.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/nodes -k review_status_default_wiring -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24660-ac3-required-context
  description: required_context_apply posts add-only to the contexts endpoint, with an app_id of None and a contexts-only body in the read.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/nodes/node_github_repo_write_effect/test_handler_required_context.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24660-ac4-contract
  description: The scm operation table names the two status verbs, and the effect node's contract says what the status link is.
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/ci/test_scm_operation_table_omn20912.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24660-ac5-suites
  description: The review-gate suites that the pull request names.
  source: manual
  binds_ac:
  - AC5
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/nodes/node_review_gate_context_compute tests/nodes/node_review_gate_context_effect -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24660-integration-proof
  description: Hosted CI cannot reach the lab bus or GitHub, so only the local Done gate runs this unbound check. The reading is the commit statuses of the pushed head of the pull request, read back through the gateway over the lab bus.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex scm commit-statuses OmniNode-ai/omnimarket --head-sha "$(git rev-parse HEAD)"
    cwd: .
