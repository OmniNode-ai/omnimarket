    cwd: .
- id: dod-omn26371-worktree-root
  description: The serve unit installer points the registry root's omni_worktrees at the host row's declared lab_worktree_root, never over a directory that holds entries, never over a link to another place, and refuses a root on a volume above 85 percent used. The test written first failed on dev with extra_forbidden for hosts.0.lab_worktree_root.
  source: manual
