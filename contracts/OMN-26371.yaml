  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_host_installer_serve_units -q --no-cov -n 0 -p no:randomly -k work_root_declared
    cwd: .
- id: dod-omn26371-ac3
  description: An install on a volume above 85 percent used is refused, one at or below is admitted, the default reader reads the live volume, and with the bar raised to 100 the refusal tests fail.
  source: manual
