  description: The serve unit installer writes TMPDIR, UV_CACHE_DIR and XDG_CACHE_HOME from the host row's lab_tmp_root and lab_cache_root, writes none for a row that declares neither, and refuses a root on a volume above 85 percent used. The test written first failed on dev with extra_forbidden for hosts.0.lab_tmp_root.
  source: manual
