schema_version: 1.0.0
ticket_id: OMN-26371
title: The lab-work serve unit works under its host row's declared lane work root, and refuses a work root on a volume above 85 percent used
summary: The serve unit installer rendered LAB_WORK_ROOT as the home directory's lab-run on every host and ignored the row's lab_work_root. It now renders the row's declared root (the home-directory root only for a row that declares none), creates it, and refuses to install when the live volume under the root is above 85 percent used. The rows that declare a root on each host's data drive are in the overlays repository (merged).
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn26371-work-root
  statement: The serve unit reads the host row's lane work root, and an install whose work root sits on a volume above 85 percent used is refused.
  acceptance:
  - id: AC2
    statement: "AC2: the serve unit's LAB_WORK_ROOT is the host row's declared work root, and a row with no work root keeps the home-directory root -- falsifier: uv run pytest tests -q -k work_root_declared in omnimarket (the host rows themselves, each on its data drive, are held by tests/test_lab_host_work_root_declared.py in the overlays repository)"
  - id: AC3
    statement: "AC3: an install is refused when the live volume under the work root is above 85 percent used and admitted at or below it -- falsifier: uv run pytest tests -q -k work_root_volume_bar, failing with the bar removed"
  - id: AC7
    statement: "AC7: the serve unit installer links the registry root's omni_worktrees to the host row's lab_worktree_root, never over a directory that holds entries or a link to another place -- falsifier: uv run pytest tests/nodes/node_host_installer_serve_units -q -k worktree_root"
- id: req-omn26371-temp-cache-roots
  statement: The serve unit reads the host row's declared temp and cache roots into the serve environment, and an install whose temp or cache root sits on a volume above 85 percent used is refused.
  acceptance:
  - id: AC8
    statement: "AC8: the serve environment names the row's lab_tmp_root as TMPDIR and lab_cache_root as XDG_CACHE_HOME with UV_CACHE_DIR under it, and a row declaring neither writes none of them -- falsifier: uv run pytest tests/nodes/node_host_installer_serve_units -q -k temp_cache_roots_declared"
evidence_requirements:
- kind: tests
  description: The serve unit and volume bar tests at the pushed head.
  command: uv run --frozen pytest tests/nodes/node_host_installer_serve_units tests/unit/handlers/test_work_root_volume_bar.py -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
- id: dod-omn26371-ac1
  description: "AC1: the report of every place a host's lane work root, worktree root, uv and pip caches, model caches and runner work dirs are decided, with file and line and the copy each reads today. The report is the lane's report file, outside this repository. A disposition is required at the local Done gate."
  source: manual
  checks:
  - check_type: disposition
    check_value: dod-omn26371-ac1
  execution_scope: local_done_gate
- id: dod-omn26371-ac2
