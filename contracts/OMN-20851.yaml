---
schema_version: "1.0.0"
ticket_id: "OMN-20851"
title: "the throughput tick's decision raises an alarm, not a note, for unplaced lanes and lasting venv divergence"
summary: "node_throughput_tick_decision_compute classifies a lane recorded as dispatched with no placement receipt after unplaced_lane_alarm_minutes (10), and a cross-host dispatch-venv divergence older than venv_divergence_alarm_minutes (30), as typed ALARM verdicts in result.alarms with exit_code 1; a running receipt counts as a running lane only with a CLAIM carrying host= and a run id."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-ac1"
    statement: "An unplaced lane is an ALARM after 10 minutes and is not counted as running."
    acceptance:
      - id: "AC1"
        statement: "AC1: an unplaced lane is an ALARM after 10 minutes and is not counted as running."
  - id: "req-ac2"
    statement: "Venv divergence older than 30 minutes is an ALARM, younger is a NOTE."
    acceptance:
      - id: "AC2"
        statement: "AC2: venv divergence older than 30 minutes is an ALARM, younger is a NOTE."
evidence_requirements:
  - kind: "tests"
    description: "AC1: an unplaced lane is an ALARM after 10 minutes and a running receipt without a CLAIM host and run id holds no slot."
    command: 'uv run pytest tests/nodes/node_throughput_tick_decision_compute -q -p no:randomly -k "unplaced_lane_alarm_not_running"'
  - kind: "tests"
    description: "AC2: a venv divergence older than 30 minutes is an ALARM, a younger one a NOTE."
    command: 'uv run pytest tests/nodes/node_throughput_tick_decision_compute -q -p no:randomly -k "venv_divergence_alarm_after_30m"'
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn20851-ac1"
    description: "AC1: an unplaced lane is an ALARM after 10 minutes and is not counted as running."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: 'uv run pytest tests/nodes/node_throughput_tick_decision_compute -q -p no:randomly -k "unplaced_lane_alarm_not_running"'
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC1"]
  - id: "dod-omn20851-ac2"
    description: "AC2: venv divergence older than 30 minutes is an ALARM, younger is a NOTE."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: 'uv run pytest tests/nodes/node_throughput_tick_decision_compute -q -p no:randomly -k "venv_divergence_alarm_after_30m"'
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC2"]
