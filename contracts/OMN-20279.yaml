---
schema_version: "1.0.0"
ticket_id: "OMN-20279"
title: "The ledger learns of a delegation only when a lane copies run ids into its TERMINAL by hand"
summary: "A pure mapper node turns each delegate-skill terminal into one canonical work-ledger append request, and the work-ledger append host subscribes to the completed and failed delegate-skill topics and appends it, deduplicated by req=."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-delegation-terminal-ledger-mirror"
    statement: |-
      A delegation terminal on the bus becomes one ledger STATUS row without a lane copying run ids by hand.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: A completed or failed delegate-skill terminal maps to one append request whose row carries src=delegation, the run id, model, outcome and quality_gate_passed, and a redelivery of the same run carries the same req= -- falsifier: a terminal that maps to a row missing those cells, or a redelivery that maps to a different req=
      - id: "AC2"
        statement: |-
          AC2: The append host appends a delegation terminal delivered on either topic once, and a terminal with a missing timestamp or a status that does not match its topic is refused without an append -- falsifier: a duplicate append, or an append for a refused terminal
evidence_requirements:
  - kind: "tests"
    description: "The mapper and the append host mirror delegation terminals, deduplicated by req=, and refuse malformed ones."
    command: "uv run pytest tests/unit/work_ledger_bus/test_delegation_terminal.py -q -p no:randomly"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn20279-delegation-terminal-mirror"
    description: "The mapper and the append host mirror delegation terminals into the ledger once per run and refuse malformed terminals."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/work_ledger_bus/test_delegation_terminal.py -q -p no:randomly"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC1", "AC2"]
