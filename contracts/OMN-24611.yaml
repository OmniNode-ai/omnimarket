schema_version: 1.0.0
ticket_id: OMN-24611
title: The dev deploy agent signs with its own dev-only key
summary: 'The secret store node (node_secret_store_effect) gains a generated dev-only entry DEPLOY_AGENT_DEV_HMAC_SECRET and one declared operation, deliver_key_to_env_file, that writes the stored key as one DEPLOY_AGENT_HMAC_SECRET line into the file the dev deploy agent''s unit reads (~/.omnibase/deploy-agent-dev-signing-key.env, mode 0600), without the value ever being printed, logged or put on a command line. The sender node (node_branch_deploy_command_effect) gains an optional signing_key_store block in its settings: when the variable hmac_secret_env names is unset, its own entry resolves the key from the store, and a store that does not return it ends the send with a typed refusal and no publish. The runtime behaves as before. When the variable is set and the block''s required verify_env_key is true, the set value is used only when its one-way check value equals the store key''s, and a mismatch is a typed refusal with no publish. The delivery enforces its declared mode (no wider than 0600) on every run, including when the file already holds the line.'
is_seam_ticket: true
interface_change: true
interfaces_touched:
- public_api
requirements:
- id: req-omn24611-store
  statement: The secret store node generates the dev-only signing key and delivers it into the dev agent's env file, value unseen.
  acceptance:
  - id: AC2
    statement: 'AC2: the secret store''s own node holds a generated dev-only entry DEPLOY_AGENT_DEV_HMAC_SECRET, created without the value being printed -- falsifier: the node''s generate test fails on the contract without the entry, and the store''s name list lacks DEPLOY_AGENT_DEV_HMAC_SECRET'
- id: req-omn24611-sender
  statement: The sender's own entry resolves the signing key from the store when its variable is unset, and refuses with no publish when the store does not return it.
  acceptance:
  - id: AC3
    statement: 'AC3: the key check value the dev agent serves equals the key check value of the store''s entry on the sending lab hosts -- falsifier: the key check node answers different check values for the agent and for the store entry'
- id: req-omn24611-unit
  statement: The dev agent unit side is the omnibase_infra pull request of this ticket.
  acceptance:
  - id: AC1
    statement: 'AC1: the dev deploy agent''s unit declares one EnvironmentFile for its own signing key file and lists the key name as protected, and no other unit names that file -- falsifier: pytest scripts/deploy-agent/tests/unit/test_dev_agent_own_signing_key_omn24565.py fails 4 tests against the dev unit on origin/dev'
- id: req-omn24611-integrated
  statement: The dev agent accepts a signed no-op sent from h051 after the install.
  acceptance:
  - id: AC4
    statement: 'AC4: integrated: from h051 one signed no-op command is accepted by the dev agent on h201 after its unit is installed, and the live agent''s unit file digest is identical before and after, read on h201 -- falsifier: the running dev agent on lab host h201 rejects the command as an invalid signature, or the live unit digest read back after the install differs from the one before'
evidence_requirements:
- kind: tests
  description: The secret store node's generate and delivery tests and the sender node's tests.
  command: uv run pytest tests/unit/nodes/node_secret_store_effect/test_generate_deploy_agent_dev_key.py tests/unit/nodes/node_secret_store_effect/test_deliver_key_to_env_file.py tests/unit/nodes/node_secret_store_effect/test_deliver_key_cli.py tests/unit/nodes/node_secret_store_effect/test_seam_deploy_agent_dev_signing_key.py -q -n 0 --no-cov -p no:cacheprovider && uv run pytest tests/nodes/node_branch_deploy_command_effect -q -n 0 --no-cov -p no:cacheprovider
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24611-ac1-unit-pr
  description: The unit's own tests are in the omnibase_infra pull request of this ticket; here the secret store contract spells the file name the unit reads, pinned by the seam test on both names.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/nodes/node_secret_store_effect/test_seam_deploy_agent_dev_signing_key.py -q -n 0 --no-cov -p no:cacheprovider
    cwd: ${OMNI_HOME}/omnimarket
- id: dod-omn24611-ac2-generated-and-delivered
  description: The contract declares the generated key and its delivery; the golden tests generate the key in a fake store, deliver it to a file of mode 0600 and read no value in any result or log; a contract copy without the entry refuses.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/nodes/node_secret_store_effect/test_generate_deploy_agent_dev_key.py tests/unit/nodes/node_secret_store_effect/test_deliver_key_to_env_file.py tests/unit/nodes/node_secret_store_effect/test_deliver_key_cli.py tests/unit/nodes/node_secret_store_effect/test_seam_deploy_agent_dev_signing_key.py -q -n 0 --no-cov -p no:cacheprovider
    cwd: ${OMNI_HOME}/omnimarket
- id: dod-omn24611-ac3-sender-store
  description: With the variable unset the entry signs under the stored key and publishes once; the same input without the settings block refuses with the missing-key refusal; a store that does not return the key publishes nothing; the real entry assembly is exercised with the store's network seam replaced; with the variable unset, a store key A and an agent serving the check of key B is refused and nothing is published. The second check is the reading of AC3 itself, a pull request comment line that starts Reading and names head=<40 hex>, key check, host=<h051 or h201>, agent_check=<16 hex> and store_check=<16 hex> with the two check values equal, read from the key check node on that host. The check passes only when a line at HEAD of this checkout (or, on a hosted merge checkout, at its second parent, the pull request head) stands for each of h051 and h201; a line from one host only, or at an older head, fails. It fails on every head until the operator of each host posts its line.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_branch_deploy_command_effect -q -n 0 --no-cov -p no:cacheprovider
    cwd: ${OMNI_HOME}/omnimarket
  - check_type: command
    check_value: |-
      gh api repos/OmniNode-ai/omnimarket/issues/6297/comments --paginate --jq '.[].body' | python3 -c '
      import os, re, subprocess, sys
      t = sys.stdin.read().replace("\r", "")
      def rev(ref):
          r = subprocess.run(["git", "rev-parse", "--verify", "--quiet", ref], capture_output=True, text=True)
          return r.stdout.strip() if r.returncode == 0 else ""
      ref = os.environ.get("GITHUB_REF", "")
      hosted_merge_ref = ref.startswith("refs/pull/") and ref.endswith("/merge")
      heads = {h for h in (rev("HEAD"), rev("HEAD^2") if hosted_merge_ref else "") if h}
      ms = re.findall(r"^Reading: head=([0-9a-f]{40}) key check host=(h051|h201) agent_check=([0-9a-f]{16}) store_check=([0-9a-f]{16})$", t, re.M)
      hosts = {m[1] for m in ms if m[0] in heads and m[2] == m[3]}
      assert hosts == {"h051", "h201"}, "no equal key check reading at HEAD from every sending host (h051 and h201); have: " + ",".join(sorted(hosts))
      print("AC3 reading: PASS")
      '
    cwd: ${OMNI_HOME}/omnimarket
- id: dod-omn24611-ac4-integrated
  description: 'The reading itself: one signed no-op from h051 accepted by the dev agent on h201 after the unit install, with the live unit digest before and after. The check reads the issue comments of this pull request and passes only when one comment is one line that starts Reading and reads head=<40 hex> h051->h201 no-op accepted unit_digest_before=<64 hex> unit_digest_after=<64 hex>, whose two digests are equal and whose head is HEAD of this checkout (or, on a hosted merge checkout, its second parent, the pull request head); a reading at an older head fails. It fails on every head until the host operator who installs the unit posts that line after reading both hosts. Nothing in this repository can produce it.'
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: command
    check_value: |-
      gh api repos/OmniNode-ai/omnimarket/issues/6297/comments --paginate --jq '.[].body' | python3 -c '
      import os, re, subprocess, sys
      t = sys.stdin.read().replace("\r", "")
      def rev(ref):
          r = subprocess.run(["git", "rev-parse", "--verify", "--quiet", ref], capture_output=True, text=True)
          return r.stdout.strip() if r.returncode == 0 else ""
      ref = os.environ.get("GITHUB_REF", "")
      hosted_merge_ref = ref.startswith("refs/pull/") and ref.endswith("/merge")
      heads = {h for h in (rev("HEAD"), rev("HEAD^2") if hosted_merge_ref else "") if h}
      ms = re.findall(r"^Reading: head=([0-9a-f]{40}) h051->h201 no-op accepted unit_digest_before=([0-9a-f]{64}) unit_digest_after=([0-9a-f]{64})$", t, re.M)
      ok = [m for m in ms if m[0] in heads and m[1] == m[2]]
      assert ok, "no h051 to h201 reading comment at HEAD with equal unit digests"
      print("AC4 reading: PASS")
      '
    cwd: ${OMNI_HOME}/omnimarket
- id: dod-omn24611-integration-proof
  description: 'Run the focused tests of the secret store node''s generate and delivery and of the sender node on a lab host at the pushed head. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check. It binds no acceptance criterion; the reading on h201 and h051 (AC4) is read on those hosts after the install.'
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24611 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/nodes/node_secret_store_effect tests/nodes/node_branch_deploy_command_effect -q -n 0 --no-cov
    cwd: .
