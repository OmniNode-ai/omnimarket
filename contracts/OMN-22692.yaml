schema_version: "1.0.0"
ticket_id: OMN-22692
title: "A tailnet https listener node installs, reads back and removes the https front of a loopback upstream, with the port and upstream in its overlay"
summary: >-
  node_tailnet_https_serve_effect puts a tailscale serve https listener in front of a loopback upstream (the dev cost estimator,
  whose page sets a Secure cookie and so needs https). The port and the upstream are overlay data. Install refuses a dead
  upstream and a port another listener holds, reads the listener back after it serves, and uninstall is the rollback that leaves
  every other listener alone. The node has an in-memory backend and a tailscale backend, golden and error chain tests, and the
  failing control the earlier installer tests carried: the https flag broken to the http flag goes red.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn22692-https-listener-node
    statement: The listener is installed, read back and rolled back by a node whose every setting is overlay data.
    acceptance:
      - id: AC1
        statement: 'AC1: an install serves the overlay upstream on the overlay port, writes the env file the boot unit reads, reads the listener back, and an uninstall turns it off and leaves every other listener untouched -- falsifier: uv run --frozen pytest tests/unit/nodes/node_tailnet_https_serve_effect/test_golden_chain_tailnet_https_serve_effect.py tests/unit/nodes/node_tailnet_https_serve_effect/test_adapters_tailnet_https_serve_effect.py -q --no-cov'
      - id: AC2
        statement: 'AC2: a dead upstream and a port held by a foreign listener are refused before anything changes, a listener that does not serve the upstream fails its readback, and an uninstall leaves a foreign listener alone -- falsifier: uv run --frozen pytest tests/unit/nodes/node_tailnet_https_serve_effect/test_error_chain_tailnet_https_serve_effect.py -q --no-cov'
      - id: AC3
        statement: 'AC3: the install through the real tailscale adapter goes red when the https flag is broken to the http flag -- falsifier: uv run --frozen pytest tests/unit/nodes/node_tailnet_https_serve_effect/test_adapters_tailnet_https_serve_effect.py -q --no-cov -k failing_control'
evidence_requirements:
  - kind: tests
    description: Golden chain, error chain and the real adapters against a fake tailscale, with the failing control.
    command: uv run --frozen pytest tests/unit/nodes/node_tailnet_https_serve_effect -q --no-cov
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-omn22692-listener-node-tests
    description: The golden chain, the error chain, the adapter tests and the failing control of the listener node pass.
    source: manual
    execution_scope: hosted_and_local
    binds_ac: [AC1, AC2, AC3]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/nodes/node_tailnet_https_serve_effect -q --no-cov
        cwd: .
  - id: dod-omn22692-deploy-source-readback
    description: 'Hosted-runner deploy source readback: the published listener handler at the evaluated commit must equal the checkout byte for byte, and the node entry point must install and uninstall through the in-memory backend. This checks published source and local dispatch; the live read on the dev lane host (foreign listener refused, dead upstream refused, spare port installed and removed, unit swap with every poll 200) is in the pull request body and the lane report.'
    source: manual
    binds_ac: [AC1]
    checks:
      - check_type: command
        check_value: |-
          bash -o pipefail -c 'curl --fail --silent --show-error "https://raw.githubusercontent.com/OmniNode-ai/omnimarket/$(git rev-parse HEAD)/src/omnimarket/nodes/node_tailnet_https_serve_effect/handlers/handler_tailnet_https_serve.py" | cmp - src/omnimarket/nodes/node_tailnet_https_serve_effect/handlers/handler_tailnet_https_serve.py'
        cwd: .
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/nodes/node_tailnet_https_serve_effect/test_golden_chain_tailnet_https_serve_effect.py -q --no-cov
        cwd: .
  - id: dod-omn22692-listener-node-integration-proof
    description: The pushed head ran the listener node tests on a lab host through the lab work runner and exited 0. Hosted CI cannot reach the lab, so only the local Done gate runs this check.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: 'uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-22692 -- uv run --frozen pytest tests/unit/nodes/node_tailnet_https_serve_effect -q --no-cov'
        cwd: .
