schema_version: 1.0.0
ticket_id: OMN-24250
title: A replay of an outbox request already refused for a request-id clash answers with the stored refusal
summary: The bus binding outbox moved a refused request to refused/ and the writer's lane was told once, but a writer that sent the same rows again under the same request id was queued, sent to the ledger host, refused again, kept as a second file and reported as a new case, so the bus-binding-outbox-refused class kept gaining occurrences with nothing new to learn. The outbox drain now answers a request whose id and rows match a stored request-id clash refusal from that stored receipt and sends nothing, for six hours after the refusal was stored. Past that, because the append handler reads only the live ledger file, the replay is sent once more; a clash refused again over the same rows is written into the file that already holds it (its refused_at refreshed), so a stuck id never leaves a second refused file or a second report. A refusal for any other cause and corrected rows under the same id are still sent.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24250-outbox-clash-reuse
  statement: A replay of a refused outbox request whose stored refusal is a request-id clash is answered from the stored refusal; every other refusal and every changed payload is still sent.
  acceptance:
  - id: AC1
    statement: 'AC1: a replay, within six hours of the refusal being stored, of a refused outbox request whose stored refusal is a request-id clash and whose rows are unchanged is answered from the stored refusal, with no send to the ledger host and no second file in refused/ (past six hours the replay is sent once more and refreshes the one file) -- falsifier: uv run pytest tests/handlers/bus_binding/test_outbox_refused_receipt_reuse.py -q -k reuses_stored'
  - id: AC2
    statement: 'AC2: a refused request whose stored refusal is not a request-id clash, or whose rows changed, is still sent to the ledger host -- falsifier: uv run pytest tests/handlers/bus_binding/test_outbox_refused_receipt_reuse.py -q -k still_sent'
  - id: AC3
    statement: 'AC3: the clash message the real append handler writes is recognised by the outbox, so either side changing shape fails a test -- falsifier: uv run pytest tests/handlers/bus_binding/test_outbox_refused_receipt_reuse.py -q -k seam'
  - id: AC4
    statement: 'AC4: integrated: after the change runs on the dev runtime bus binding, the exception queue list shows class bus-binding-outbox-refused with no new occurrence one hour after the roll -- falsifier: queue-status exception list read one hour after the roll shows a new occurrence of that class'
evidence_requirements:
- kind: tests
  description: The outbox reuse tests and the neighbouring bus-binding outbox suites pass at the pushed head, and the reuse test fails against the merge-base outbox module.
  command: uv run pytest tests/handlers/bus_binding/test_outbox_refused_receipt_reuse.py tests/nodes/node_bus_binding_reducer/test_outbox_request_id_clash.py tests/handlers/bus_binding/test_bus_binding_outbox_refused_wired.py tests/handlers/bus_binding/test_bus_binding_outbox_refused_guard.py tests/handlers/bus_binding/test_replay_loss_omn20275.py -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24250-ac1
  description: 'AC1: a clash refusal is stored by the first drain; the same request queued again within the reuse window is counted refused with the sender called once, one file in refused/, and one open exception row after two reports. Past the window the sender is called again and the repeat clash refreshes the one file (the window tests of the same module).'
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/handlers/bus_binding/test_outbox_refused_receipt_reuse.py -q --no-cov -p no:cacheprovider -k reuses_stored
    cwd: .
- id: dod-omn24250-ac2
  description: 'AC2 is a preservation criterion: a guard refusal is sent again on the next drain, corrected rows under a refused id are sent again, and the stored-refusal lookup reuses only a clash refusal over the same rows. The two behavioural still-sent tests also pass at the merge base, which sent every replay, and can fail at the head; only the stored-refusal lookup test fails at the merge base, because it has no such lookup.'
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/handlers/bus_binding/test_outbox_refused_receipt_reuse.py -q --no-cov -p no:cacheprovider -k still_sent
    cwd: .
- id: dod-omn24250-ac3
  description: 'AC3: the real append handler, and the append host reached over the in-memory bus, write a clash refusal the outbox recognises and reuses.'
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/handlers/bus_binding/test_outbox_refused_receipt_reuse.py -q --no-cov -p no:cacheprovider -k seam
    cwd: .
- id: dod-omn24250-ac4
  description: 'hosted proxy for AC4: a replay of a reported clash refusal adds nothing new to report for the writer (the replay test fails at the merge base, where the replay is sent again and kept as a second file), and the neighbouring bus-binding outbox suites still pass; the queue-status read one hour after the roll is named in the pull request comment that starts Lab and in the lane TERMINAL.'
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/handlers/bus_binding/test_outbox_refused_receipt_reuse.py::test_replay_of_clash_refusal_adds_no_new_report_for_the_writer tests/nodes/node_bus_binding_reducer/test_outbox_request_id_clash.py tests/handlers/bus_binding/test_bus_binding_outbox_refused_wired.py tests/handlers/bus_binding/test_bus_binding_outbox_refused_guard.py -q --no-cov -p no:cacheprovider
    cwd: .
- id: dod-omn24250-integration-proof
  description: the outbox reuse tests and the neighbouring outbox suites run on a lab host at the pushed head; hosted CI cannot reach the lab, so only the local Done gate runs this unbound check
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24250 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/handlers/bus_binding tests/nodes/node_bus_binding_reducer/test_outbox_request_id_clash.py -q --no-cov
    cwd: .
