schema_version: 1.0.0
ticket_id: OMN-21453
title: Manifest-backed model attempt receipt join
summary: A pure Phase 1 node normalizes four receipt families, binds attempt identity to a pre-dispatch manifest,
  reports conflicting measurements, and compares lab-run acceptance evidence with pinned contract expectations.
  The comparison run owns persistence. Recorded remote-lane fixture parity and the work-contract runner adapter
  remain integration evidence to collect.
is_seam_ticket: false
interface_change: true
interfaces_touched:
- public_api
requirements:
- id: req-ac1
  statement: 'AC1: ModelWorkAttemptReceipt is a frozen model with contract_id, attempt_id, engine, model, effort,
    tokens_in, tokens_out, cache_read, cache_write, wall_s, turns, tool_calls, retries, rejection_reasons, cost_usd,
    cost_basis (MEASURED or UNKNOWN), verdict (pass, fail or unjoined) and source_refs, and each numeric field a
    source lacks is the literal UNKNOWN, never 0'
  acceptance:
  - id: AC1
    statement: 'AC1: ModelWorkAttemptReceipt is a frozen model with contract_id, attempt_id, engine, model, effort,
      tokens_in, tokens_out, cache_read, cache_write, wall_s, turns, tool_calls, retries, rejection_reasons, cost_usd,
      cost_basis (MEASURED or UNKNOWN), verdict (pass, fail or unjoined) and source_refs, and each numeric field
      a source lacks is the literal UNKNOWN, never 0 -- falsifier: uv run pytest tests/nodes/test_model_work_receipt_join.py
      -q -k absent_is_unknown'
- id: req-ac2
  statement: 'AC2: a recorded codex remote-lane receipt with total_cost_usd 0 joins to cost_basis UNKNOWN, and a
    recorded sonnet receipt with total_cost_usd above 0 joins to MEASURED'
  acceptance:
  - id: AC2
    statement: 'AC2: a recorded codex remote-lane receipt with total_cost_usd 0 joins to cost_basis UNKNOWN, and
      a recorded sonnet receipt with total_cost_usd above 0 joins to MEASURED -- falsifier: uv run pytest tests/nodes/test_model_work_receipt_join.py
      -q -k codex_zero_cost_is_unknown'
- id: req-ac3
  statement: 'AC3: the dedup key is (contract_id, attempt_id) and joining the same inputs twice writes the same
    rows once'
  acceptance:
  - id: AC3
    statement: 'AC3: the dedup key is (contract_id, attempt_id) and joining the same inputs twice writes the same
      rows once -- falsifier: uv run pytest tests/nodes/test_model_work_receipt_join.py -q -k rerun_idempotent'
- id: req-ac4
  statement: 'AC4: a receipt with no contract_id is written with verdict unjoined and counted in the join summary,
    not dropped'
  acceptance:
  - id: AC4
    statement: 'AC4: a receipt with no contract_id is written with verdict unjoined and counted in the join summary,
      not dropped -- falsifier: uv run pytest tests/nodes/test_model_work_receipt_join.py -q -k unjoined_counted'
- id: req-ac5
  statement: 'AC5: the verdict field is computed by running the contract''s acceptance check from the work contract
    task on the attempt output, not copied from the model''s own claim'
  acceptance:
  - id: AC5
    statement: 'AC5: the verdict field is computed by running the contract''s acceptance check from the work contract
      task on the attempt output, not copied from the model''s own claim -- falsifier: uv run pytest tests/nodes/test_model_work_receipt_join.py
      -q -k verdict_from_check'
- id: req-ac6
  statement: 'AC6: attempt identity comes from a pre-dispatch manifest row (contract_id, arm, draw, attempt_id)
    carried into the receipt as an Attempt line, a landing cost row is never summed into an attempt, two sources
    that disagree on a field are reported as a conflict, and a record that cannot be mapped is a separate typed
    unjoined record excluded from every per-pass figure'
  acceptance:
  - id: AC6
    statement: 'AC6: attempt identity comes from a pre-dispatch manifest row (contract_id, arm, draw, attempt_id)
      carried into the receipt as an Attempt line, a landing cost row is never summed into an attempt, two sources
      that disagree on a field are reported as a conflict, and a record that cannot be mapped is a separate typed
      unjoined record excluded from every per-pass figure -- falsifier: uv run pytest tests/nodes/test_model_work_receipt_join.py
      -q -k attempt_identity_and_conflicts'
evidence_requirements:
- kind: tests
  description: Acceptance falsifiers and in-memory bus/SQLite binding checks.
  command: uv run pytest tests/nodes/test_model_work_receipt_join.py -q
