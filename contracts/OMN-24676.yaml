schema_version: 1.0.0
ticket_id: OMN-24676
title: The GLM plan-limit gate reads the reset stamp as Beijing time, holds on code 1308 and 1310 from the declared rules, and never fails the step
summary: The gate handler is bound from node_llm_delegation_call_effect's contract and its command line is that node's runtime_glm_quota_gate module. The zai quota rules declare the reset stamp's Beijing-time offset (reset_utc_offset_minutes) and parse_reset_instant applies it, so the bifrost path and the gate read the recorded stamp the same way. The gate reads its codes and fallback from load_provider_quota_policy, holds a code 1308, holds the declared fallback for a reset not after now, cuts a stamp past 35 days to LONGEST_HOLD, ignores text that only quotes a code, and prints the not-held line for a state root that cannot be used.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24676-gate-review-fixes
  statement: The GLM quota gate is bound from a node contract, reads the Beijing-time stamp as such, holds the declared codes, and fails open.
  acceptance:
  - id: AC1
    statement: "AC1: the Canonical File Shape job passes on the new head because HandlerGlmQuotaGate is bound from a node contract and the command line lives in that node's runtime module, with no baseline line added -- falsifier: uv run onex validate --rules file-shape --base origin/main --head HEAD in the omnimarket worktree exits non-zero"
  - id: AC2
    statement: "AC2: a test built from the recorded 1310 text with its Beijing-time reset stamp fails on the base parser (read as UTC) and passes on the fix, on both HandlerProviderQuotaReset and the gate -- falsifier: uv run pytest on the named Beijing test in omnimarket fails on the head"
  - id: AC3
    statement: "AC3: a note with code 1308 holds for the declared five-hour window, a 1310 noted with reset at or before now holds the unstated hold, a stamp past 35 days is cut to LONGEST_HOLD, and text that only quotes [1310] without the (429) refusal shape holds nothing, each with a test, with the codes and fallback read from load_provider_quota_policy() -- falsifier: uv run pytest on the named gate test file fails on any of the four cases"
  - id: AC4
    statement: "AC4: a state root with a file as a path component prints the not-held JSON line and exits 0 instead of a traceback, with a test, and the gate reads and writes provider_quota_state or the contract states why the lane step cannot -- falsifier: uv run pytest on the named fail-open test fails when the OSError is raised"
  - id: AC5
    statement: "AC5: contracts/OMN-24651.yaml carries AC1 and AC3 or names where they are met, and its falsifier is the behavioural Beijing test on the base parser, and the suites required for the repository pass on the lab with the new head commented on the pull request -- falsifier: uv run pytest of the contract test in omnimarket fails, and onex scm pr-view of omnimarket#6311 shows no comment naming the new head"
