title: 'omnimarket handler-shape envelope_in_core burn-down, slice rf1310-s1: envelope unwrapping stays in the runtime'
summary: Three handlers (the redeploy FSM reducer, the regression-test orchestrator and the user-correction observer effect) took a ModelEventEnvelope and unwrapped or built one in handler code. Each now takes the typed request model its contract declares and returns the typed result; the runtime adapter unwraps the inbound envelope and wraps the returned model for the node's one contract publish topic. The handler-shape envelope_in_core count over the three slice modules goes from 3 to 0 and over omnimarket src from 23 to 20, with no baseline entry or suppression added and no per-node unwrapper.
