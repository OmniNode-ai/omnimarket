schema_version: 1.0.0
ticket_id: OMN-24844
title: The eight-writer sequence number test starts its workers fresh, proves they run together and bounds its waits
summary: tests/test_capture_item_identity_effect.py ran its eight concurrent writers in a fork-context multiprocessing Pool inside a multi-threaded pytest process (CPython warns this may deadlock in the child), with an unbounded pool.map and a terminate-join on exit. A hung run of this test is a hypothesis for a cancelled test split, not a measured cause - it did not reproduce, so no cancelled run is linked here (10 of 10 lab runs and 48 loaded local runs of the fork version passed). The test now starts its workers through the spawn context, makes the eight writers wait for each other on a barrier, reads the worker pids and start methods from the workers, waits on the result with a timeout and always terminates the pool, under a per-test timeout. The gap-free 1000 sequence number assertion is unchanged. Not in this change - the handler under test, the sequence number logic, and any other test. The acceptance criteria below are restated, not the Linear text of OMN-24844 word for word - Linear AC1 (a lab run at the unfixed head hangs past a bound) is falsified by this change's own data, because the unfixed head passed 10 of 10 lab runs and 48 loaded local runs. Whether the ticket owner amends or waives that criterion is an open owner decision, to be recorded on OMN-24844 or OMN-24562; this contract cites that record once it exists and does not stand in for it.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
# The four criteria below are restated. They are not the Linear criteria of OMN-24844:
# AC1 states the hazard as a hypothesis (Linear AC1 wants a lab hang at the unfixed head,
# which did not reproduce; the owner decision on that criterion is open) and AC3 drops
# "run on the lab" and "run data cited by path" (the lab runs are in the pull request Lab comments).
- id: req-omn24844-forkpool
  statement: The concurrent-writer test starts its workers fresh, runs eight writers at once, is bounded in time, and its gap-free assertion over 1000 writes still holds.
  acceptance:
  - id: AC1
    statement: "AC1: the test that uses the fork Pool is named by file and test id, and the hazard is stated as a hypothesis because the hang did not reproduce -- falsifier: the test file at the previous head has no get_context(\"fork\") Pool in test_eight_concurrent_writers_issue_1000_gap_free_sequence_numbers"
  - id: AC2
    statement: "AC2: the test uses a spawn context with a result timeout and is not skipped, xfailed or deselected -- falsifier: git diff against the previous head shows a skip, xfail, deselect or removed assertion for that test"
  - id: AC3
    statement: "AC3: a regression test fails when the writers' pool context is fork and passes on the fix -- falsifier: test_writer_pool_workers_start_fresh_not_forked passes with the context set to fork"
  - id: AC4
    statement: "AC4: one pull request on omnimarket's default branch carries a comment starting Lab: head= with the full head sha -- falsifier: the pull request lists no such comment"
evidence_requirements:
- kind: tests
  description: The capture item identity test file at the pushed head, run on a lab host with the flags the CI test split uses (coverage on, 300 s thread timeout, no xdist).
  command: uv run pytest tests/test_capture_item_identity_effect.py -v --tb=short -m "not kafka" --cov=src --cov-report= --timeout=300 --timeout-method=thread -p no:cacheprovider
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24844-ac1-prior-fork
  description: 'AC1: at the previous head (the pull request base) the writers test builds a fork-context Pool of eight; this check fails if it does not.'
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: command
    check_value: |-
      bash -o pipefail -c 'git show 6efbe3ee5027f6efb67d0b81a1421f0dda32b4e5:tests/test_capture_item_identity_effect.py | grep -F "get_context(\"fork\").Pool(8)" > /dev/null'
    cwd: .
- id: dod-omn24844-ac1-test-id
  description: 'AC1: the named test id exists at the head; this check fails if it is renamed or removed.'
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/test_capture_item_identity_effect.py::test_eight_concurrent_writers_issue_1000_gap_free_sequence_numbers --collect-only -q --no-cov -p no:cacheprovider
    cwd: .
- id: dod-omn24844-ac2-runs
  description: 'AC2: the writers test runs and passes with the CI split flags. --refuse-skips is defined in tests/refuse_skips.py (loaded by tests/conftest.py) and exits 1 on a skipped test or a failing xfail, but exits 0 on an xfail-marked test that passes (xpass); xfail_strict=true turns that xpass into a failure, and test_the_eight_writer_test_carries_no_skip_or_xfail_marker fails on any skip, skipif or xfail marker. A -k that selects nothing exits 5. pytest-timeout, which the timeout flags and the per-test marker need, is declared in the dev dependency group of pyproject.toml and pinned in uv.lock.'
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/test_capture_item_identity_effect.py -q -k eight_concurrent --refuse-skips -o xfail_strict=true --cov=src --cov-report= --timeout=300 --timeout-method=thread -p no:cacheprovider
    cwd: .
- id: dod-omn24844-ac2-assertions
  description: 'AC2: the gap-free assertion over 1000 writes is still in the test file; this check fails if the line is removed.'
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: command
    check_value: grep -E "^    assert sorted\(issued\) == list\(range\(1, 1001\)\)$" tests/test_capture_item_identity_effect.py
    cwd: .
- id: dod-omn24844-ac2-spawn
  description: 'AC2: the writers pool is built from a spawn context; this check fails if the context is not spawn.'
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: command
    check_value: grep -E "^    return multiprocessing\.get_context\(.spawn.\)$" tests/test_capture_item_identity_effect.py
    cwd: .
- id: dod-omn24844-ac3-regression
  description: 'AC3: the fresh-worker regression test passes on the fix, and the control test runs it with the writers context set to fork and fails if it then passes. The control tests run both the fresh-worker test and the eight-writer test with the context set to fork, under a spawn default start method, and fail if either then passes. The lab red run is in the pull request Lab comment.'
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/test_capture_item_identity_effect.py -q -k "start_fresh_not_forked or fails_when_the_writer_context_is_fork" --refuse-skips -o xfail_strict=true --cov=src --cov-report= --timeout=300 --timeout-method=thread -p no:cacheprovider
    cwd: .
- id: dod-omn24844-ac4-lab-comment
  description: 'AC4: the pull request carries a comment starting Lab: head= with the pull request head sha; this check fails when no such comment exists. Read at the local Done gate, because the comment is written after the push.'
  source: manual
  execution_scope: local_done_gate
  binds_ac:
  - AC4
  checks:
  - check_type: command
    check_value: |-
      bash -o pipefail -c 'h=$(gh api repos/OmniNode-ai/omnimarket/pulls/6327 --jq .head.sha) && gh api --paginate repos/OmniNode-ai/omnimarket/issues/6327/comments --jq ".[].body" | grep -E "^Lab: head=$h" > /dev/null'
    cwd: .
