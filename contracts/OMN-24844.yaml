schema_version: 1.0.0
ticket_id: OMN-24844
title: The eight-writer sequence number test starts its workers fresh and bounds its wait so it cannot hang a test split
summary: tests/test_capture_item_identity_effect.py ran its eight concurrent writers in a fork-context multiprocessing Pool inside a multi-threaded pytest process (CPython warns this may deadlock in the child) with an unbounded pool.map and a terminate-join on exit. A hung run cancelled one test split and failed the Coverage Sweep Gate and CI Summary. The test now starts its workers through the spawn context, waits on the result with a timeout and always terminates the pool; the gap-free 1000 sequence number assertion is unchanged. Not in this change - the handler under test, the sequence number logic, and any other test.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24844-forkpool
  statement: The concurrent-writer test cannot hang on a forked pool, and its gap-free assertion over 1000 writes still holds.
  acceptance:
  - id: AC1
    statement: "AC1: the test that uses the fork Pool is named by file and test id, and the measured hazard is stated -- falsifier: the test file at the previous head has no get_context(\"fork\") Pool in test_eight_concurrent_writers_issue_1000_gap_free_sequence_numbers"
  - id: AC2
    statement: "AC2: the test uses a spawn context with a result timeout and is not skipped, xfailed or deselected -- falsifier: git diff against the previous head shows a skip, xfail, deselect or removed assertion for that test"
  - id: AC3
    statement: "AC3: a regression test fails when the writers' pool context is fork and passes on the fix -- falsifier: test_writer_pool_workers_start_fresh_not_forked passes with the context set to fork"
  - id: AC4
    statement: "AC4: one pull request on omnimarket's default branch carries a comment starting Lab: head= with the full head sha -- falsifier: the pull request lists no such comment"
evidence_requirements:
- kind: tests
  description: The capture item identity test file at the pushed head, run on a lab host.
  command: uv run pytest tests/test_capture_item_identity_effect.py -q -n 0 --no-cov -p no:cacheprovider
