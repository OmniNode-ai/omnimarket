schema_version: 1.0.0
ticket_id: OMN-24844
title: The eight-writer sequence number test starts its workers fresh, proves they run together and bounds its waits
summary: tests/test_capture_item_identity_effect.py ran its eight concurrent writers in a fork-context multiprocessing Pool inside a multi-threaded pytest process (CPython warns this may deadlock in the child), with an unbounded pool.map and a terminate-join on exit. A hung run of this test is a hypothesis for a cancelled test split, not a measured cause - it did not reproduce, so no cancelled run is linked here (10 of 10 lab runs and 48 loaded local runs of the fork version passed). The test now starts its workers through the spawn context, makes the eight writers wait for each other on a barrier, reads the worker pids and start methods from the workers, waits on the result with a timeout and always terminates the pool, under a per-test timeout. The gap-free 1000 sequence number assertion is unchanged. Not in this change - the handler under test, the sequence number logic, and any other test. The acceptance criteria below are restated, not the Linear text of OMN-24844 word for word - Linear AC1 (a lab run at the unfixed head hangs past a bound) is falsified by this change's own data, because the unfixed head passed 10 of 10 lab runs and 48 loaded local runs. The owner's amend or waiver of that criterion, and of Linear AC3 (which asks for lab runs and run data cited by path, both of which live in the pull request Lab comments), is still open and is not made here, and the exact amended text of both is proposed in the pull request comment whose first line begins Owner-decision request and names OMN-24844, and the owner's record on OMN-24844 or OMN-24562 replaces this citation when it exists. Known gap - the writers pool cleanup (terminate and join, neither of which takes a timeout) now runs in a daemon thread under a 20 s bound and fails the test with TimeoutError, with the 180 s result wait and that bound together under the 240 s per-test timeout; a `--timeout-method=thread` expiry, if it were reached, would still end the whole pytest process with os._exit and lose that shard's coverage data.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
# The four criteria below are restated. They are not the Linear criteria of OMN-24844:
# AC1 states the hazard as a hypothesis (Linear AC1 wants a lab hang at the unfixed head,
# which did not reproduce; the owner decision on that criterion is open) and AC3 drops
# "run on the lab" and "run data cited by path" (the lab runs are in the pull request Lab comments).
- id: req-omn24844-forkpool
  statement: The concurrent-writer test starts its workers fresh, runs eight writers at once, is bounded in time, and its gap-free assertion over 1000 writes still holds.
  acceptance:
  - id: AC1
    statement: "AC1: the test that uses the fork Pool is named by file and test id, and the hazard is stated as a hypothesis because the hang did not reproduce -- falsifier: the test file at the previous head has no get_context(\"fork\") Pool in test_eight_concurrent_writers_issue_1000_gap_free_sequence_numbers"
  - id: AC2
    statement: "AC2: the test uses a spawn context with a result timeout and is not skipped, xfailed or deselected -- falsifier: git diff against the previous head shows a skip, xfail, deselect or removed assertion for that test"
  - id: AC3
    statement: "AC3: a regression test fails when the writers' pool context is fork and passes on the fix -- falsifier: test_writer_pool_workers_start_fresh_not_forked passes with the context set to fork"
evidence_requirements:
- kind: tests
  description: The capture item identity test file at the pushed head, run on a lab host with the flags the CI test split uses (coverage on, 300 s thread timeout, no xdist, default import mode, as the split runs it), plus --refuse-skips and strict xfail, which the whole-suite split cannot carry (it holds 275 baselined skipped test ids in config/skip_count_baseline.yaml); a new skip in this file is refused there by the skip-count ratchet and in this file by its own tests.
  command: uv run pytest tests/test_capture_item_identity_effect.py -v --tb=short -m "not kafka" --cov=src --cov-report= --timeout=300 --timeout-method=thread -p no:cacheprovider --refuse-skips -o xfail_strict=true
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24844-ac1-fresh-context
  description: 'AC1: the named writers test exists at the head and the module builds its writers pool through the _writer_context helper that replaces the fork Pool of eight; this check fails at the merge base, where the helper does not exist. The control overlays the head test file onto the merge base worktree, so each check reads the committed file with git show HEAD:, which is the merge base commit in the control and the head commit at the head.'
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: command
    check_value: bash -o pipefail -c 'git show HEAD:tests/test_capture_item_identity_effect.py | grep -F "def _writer_context" && uv run pytest tests/test_capture_item_identity_effect.py::test_eight_concurrent_writers_issue_1000_gap_free_sequence_numbers --collect-only -q --no-cov -p no:cacheprovider'
    cwd: ${OMNI_HOME}/omnimarket
- id: dod-omn24844-ac2-runs
  description: 'AC2: the spawn context is in place and the writers test runs and passes with the CI split flags. --refuse-skips is defined in tests/refuse_skips.py (loaded by tests/conftest.py) and exits 1 on a skipped test or a failing xfail; xfail_strict=true turns an xpass into a failure, and test_the_eight_writer_test_carries_no_skip_or_xfail_marker fails on any skip, skipif or xfail marker. A -k that selects nothing exits 5. The grep fails at the merge base, which holds no spawn context for this pool.'
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: command
    check_value: bash -o pipefail -c 'git show HEAD:tests/test_capture_item_identity_effect.py | grep -E "^    return multiprocessing\.get_context\(.spawn.\)$" && uv run pytest tests/test_capture_item_identity_effect.py -q -k eight_concurrent --refuse-skips -o xfail_strict=true --cov=src --cov-report= --timeout=300 --timeout-method=thread -p no:cacheprovider'
    cwd: ${OMNI_HOME}/omnimarket
- id: dod-omn24844-ac2-assertions
  description: 'AC2: the gap-free assertion over 1000 writes is still in the test file next to the spawn context; this check fails if either line is removed, and fails at the merge base, which has no spawn context.'
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: command
    check_value: bash -o pipefail -c 'git show HEAD:tests/test_capture_item_identity_effect.py | grep -E "^    assert sorted\(issued\) == list\(range\(1, 1001\)\)$" && git show HEAD:tests/test_capture_item_identity_effect.py | grep -E "^    return multiprocessing\.get_context\(.spawn.\)$"'
    cwd: ${OMNI_HOME}/omnimarket
- id: dod-omn24844-ac3-regression
  description: 'AC3: the fresh-worker regression test passes on the fix, and the control test runs it with the writers context set to fork and fails if it then passes. The control tests run both the fresh-worker test and the eight-writer test with the context set to fork, under a spawn default start method, and fail if either then passes. The lab red run is in the pull request Lab comment.'
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: command
    check_value: bash -o pipefail -c 'git show HEAD:tests/test_capture_item_identity_effect.py | grep -F "def test_writer_pool_workers_start_fresh_not_forked" && uv run pytest tests/test_capture_item_identity_effect.py -q -k "start_fresh_not_forked or fails_when_the_writer_context_is_fork" --refuse-skips -o xfail_strict=true --cov=src --cov-report= --timeout=300 --timeout-method=thread -p no:cacheprovider'
    cwd: ${OMNI_HOME}/omnimarket
