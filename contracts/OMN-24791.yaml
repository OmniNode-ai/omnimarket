schema_version: 1.0.0
ticket_id: OMN-24791
title: 'Unblock omnimarket pull request 5972: CI Summary, Bus Model Seam Gate and Tests splits 18, 2 and 8 read green at its head'
summary: The pull request's required checks read red at its head for causes in the pull request and in its base. The install-failure alarm models move to the shared silent-failure models package so the effect node no longer reaches into the compute node's models, the disk growth result sits beside the watermark node's output model so the bus-model seam pin keeps matching, and the branch takes the current base, which carries the dependency-health allowlist fix.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24791-unblock-5972
  statement: The required checks of the pull request read green at its new head.
  acceptance:
  - id: AC1
    statement: "AC1: the required checks of omnimarket pull request 5972 (CI Summary, Bus Model Seam Gate, Tests split 18, 2 and 8) read green at its new head, read from the check-runs of that exact head -- falsifier: `onex scm pr-view OmniNode-ai/omnimarket#5972` shows the head's check-runs list every required context as success"
  - id: AC2
    statement: "AC2: the fix is made on the pull request's own branch with no check widened, skipped or bypassed, and a PR comment starting `Lab: head=<full head sha>` carries the red-then-green lab proof for the new head -- falsifier: `onex scm pr-view OmniNode-ai/omnimarket#5972` comments contain a `Lab: head=` line whose sha equals the head, and the diff against the base touches no check or ratchet file"
  - id: AC3
    statement: "AC3: when the cause is outside the pull request, the lane writes a STATUS row with `cause=<one line> shared=yes` and the evidence, and patches nothing around it -- falsifier: a ledger read of STATUS rows for lane `unblk5972-1125` carrying `shared=yes` returns the row, or AC1 holds"
