schema_version: 1.0.0
ticket_id: OMN-22822
title: The dev delegation orchestrator stops re-routing stale dead-letter replays of inference responses, and the replays stop failing to resolve their secret
summary: The dead-letter replay node re-delivered inference responses from 2026-11-03 to 2026-11-05 onto the live inference-response topic, and the delegation orchestrator took a replay for a run's live attempt as a fresh answer, so a failure retried or escalated runs days old and called a provider again. In the four hours to 2026-11-07T03:00Z, 2,093 runs created on 2026-11-04 to 2026-11-06 were moved again, 1,880 onto the cheap_frontier rung. A response that arrives after the run's contract-declared completion bound is now recorded as expired, the run closes FAILED with a timeout outcome, and no routing, inference or gate intent is emitted.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn22822-expire-replayed-responses
  statement: A replayed inference response older than its run's completion bound never opens a new attempt.
  acceptance:
  - id: AC1
    statement: 'AC1: a replayed inference response older than its request''s deadline is recorded as expired and never re-routed, in a test from recorded replays with a failing control -- falsifier: uv run pytest of the orchestrator replay test'
- id: req-omn22822-host-bound-key
  statement: The shared delegation route never runs on a tenant key whose value lives only on one host.
  acceptance:
  - id: AC2
    statement: 'AC2: the secret resolution failure behind the replays is fixed at its cause and a replayed response resolves -- falsifier: uv run pytest of the inference secret resolution test'
evidence_requirements:
- kind: tests
  description: The recorded dev-lane row and replayed response, the expiry, a second delivery and the in-bound case
  command: uv run --frozen pytest tests/unit/delegation/test_omn22822_expired_replayed_response.py -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn22822-expired-replay
  description: The recorded replay of attempt 649b9b71 against the recorded ROUTED row is recorded as expired, closes the run FAILED with a timeout outcome and emits no routing, inference or gate intent; the same response inside the bound is still acted on.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/delegation/test_omn22822_expired_replayed_response.py -q --no-cov
    cwd: .
- id: dod-omn22822-host-bound-key
  description: The recorded dev catalog row of the h200 review key (bound_host h200), read as it stood on 2026-11-05, is not chosen as the tenant route key; an unbound key of the same tenant still is.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/delegation/test_omn22822_host_bound_key_not_routed.py -q --no-cov
    cwd: .
- id: dod-omn22822-integration-proof
  description: Run this pull request's recorded-replay test on a lab host at the pushed head (the recorded dev-lane row and the recorded dead-letter replay of its live attempt; the replay is recorded as expired and no routing intent is emitted). Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-22822 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/delegation/test_omn22822_expired_replayed_response.py tests/unit/delegation/test_omn22822_host_bound_key_not_routed.py -q --no-cov
    cwd: .
