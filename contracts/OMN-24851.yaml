schema_version: 1.0.0
ticket_id: OMN-24851
title: 'Review findings 1 to 6 on omnimarket PR 6326 are fixed or argued: the new branch is shown reachable, the gate reads terminal_ok NULL, and the tests cover a judged row, a missing terminal and more than I9 and I10'
summary: 'Fixes the review findings on the nightly runner change: the unterminalised-row failure is gated on terminal_ok being NULL in the row read and says so, the tests cover all eight nightly hard failures, a judged zero-token row, a missing declared terminal and a row whose terminal is unknown with terminal_ok set, and the contract of the pull request gains a fails-on-base check. The lab placement and the pull request comments are read from the ledger and the watcher, not from hosted CI.'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24851-review-findings-6326
  statement: The review findings on the nightly runner change are fixed or argued with evidence, with a test red at the base and green at the head for each.
  acceptance:
  - id: AC2
    statement: 'AC2: the reachability of the new branch in evaluate_row is shown and the new test output is attached against the base runner (failed) and against the new head (passed) -- falsifier: the new test file passes with the runner change reverted to the base'
  - id: AC3
    statement: 'AC3: the unterminalised-row failure is gated on terminal_ok being NULL in the row read, says "terminal_ok is NULL in the row read", and a test pins a row with terminal unknown and terminal_ok set -- falsifier: the new test file passes with the gate reverted to the terminal unknown test alone'
  - id: AC4
    statement: 'AC4: no consumer of the failure text classifies failures by the reworded text, and the eight cases I1, I3 and I5 to I10 each declare a terminal with the guard for exp.terminal None pinned by a test -- falsifier: the delegation golden tests pass with a consumer string match on the failure line left in place'
  - id: AC5
    statement: 'AC5: the tests include a completed row with zero tokens that yields the tokens line, a row with exp.terminal None on an unterminalised row and cases beyond I9 and I10, and the fixture and docstring match the nightly job -- falsifier: the new test file passes with the zero-token row asserting an empty failure list'
  - id: AC6
    statement: 'AC6: finding 2 of the review (AC1 of the nightly ticket) is answered with a third pull request read, finding 1 (AC2 of the nightly ticket) is answered as a diagnostic that does not fix the cause, and the non-blocking findings are fixed or argued in a pull request comment -- falsifier: the new test file passes with the message still saying the settle window elapsed'
evidence_requirements:
- kind: tests
  description: The new runner test, the runner tests it sits beside and the golden layer tests.
  command: env -u PYTHONPATH uv run --frozen pytest tests/delegation_golden -q --no-cov -n 0 -p no:randomly -m "not e2e"
