requirements:
- id: req-omn25827-nightly-reads-success
  statement: Dev's delegation-regression-nightly reads success on its live golden tasks, each failed case with a named cause fixed at its source without weakening a golden case.
  acceptance:
  - id: AC1
    statement: "AC1: each of the cases I1, I3, I5, I6 and I7 that failed in run 44259885965 has a named cause (delegate answer quality, route, grader or environment) with its case output quoted in the lane's TERMINAL row -- falsifier: the lane's TERMINAL row names no cause or quotes no case output for one of the five cases"
  - id: AC2
    statement: "AC2: one pull request on the omnimarket default branch fixes each named cause at its source with a test that fails at the unfixed base and passes at the new head, built from the recorded case output (fixture path in the PR) -- falsifier: `uv run pytest <the new test path> -q` run at the unfixed base commit passes, or `onex scm pr-view` shows no such pull request"
  - id: AC3
    statement: "AC3: the fix weakens no golden case, so the diff removes no assertion and adds no skip, xfail, loosened threshold, edited case expectation or changed required-check list -- falsifier: `git diff <base> <head> -- tests/ .github/` shows a removed assert, a new skip or xfail marker, an edited expectation or threshold, or a changed required-check list"
  - id: AC4
    statement: "AC4: the pull request body carries a line starting `Lab:` with the head sha, the command and exit 0 -- falsifier: the pull request body has no line starting `Lab:`, or the lab run exit is not 0 at the head"
  - id: AC5
    statement: "AC5: after the fix is deployed where the nightly runs, a dev delegation-regression-nightly dispatched with the stability lane through the declared path has a newest run that reads success -- falsifier: `onex scm run-list OmniNode-ai/omnimarket --workflow delegation-regression-nightly.yml --branch dev --limit 1` shows a conclusion other than success"
