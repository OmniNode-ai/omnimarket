          AC1: omnibase_core#1907's shape (OMN-20704, no head or base control, contract-home-OMN-20704.txt naming OmniNode-ai/omnimarket, OCC success) prints passed true, outcome expected_difference, and reason_code contract_in_another_repo; a marker naming onex_change_control also prints that expected difference per operator ruling 2026-10-08T14:59:17Z; absent, empty, or unreadable markers leave reason unset, and a verified head with passed control still admits -- falsifier: #1907's shape or an onex_change_control marker still prints unclassified_difference
