      omnimarket's Repo Evidence Gate caller pins the omnibase_core receipt-gate reusable at omnibase_core#1914's squash commit, whose dod-verify job exempts the OCC writer app's release cut derived at the head, with a verifier release that ships the classifiers it imports.
    acceptance:
      - id: "AC2"
        statement: |-
          AC2: .github/workflows/call-repo-evidence-gate.yml pins receipt-gate.yml at fb0c6c2117d5868a398b0920cd0048d0824415b1 (omnibase_core#1914) and its verifier-version ships is_release_artifact_only_diff and classify_dependency_pin_only -- falsifier: uv run pytest tests/ci/test_repo_evidence_caller_release_cut_repin_omn20074.py -q fails at the merge base
  - id: "req-writer-bump-classifiers"
    statement: |-
      The writer-app exemption classifiers admit omniclaude's two refused bot bump shapes, a plugin manifest version bump and a sibling lock refresh that moves tool.uv.override-dependencies, and still refuse any other change beside them.
    acceptance:
      - id: "AC3"
        statement: |-
          AC3: classify_plugin_manifest_version_only admits omniclaude#2644's shape (only the version of .claude-plugin/plugin.json and of the marketplace entry moves, increasing) and refuses another key, a non-increasing or non-numeric version, a path outside .claude-plugin manifests, an unreadable, added or deleted manifest, no moved version and too many files; classify_dependency_pin_only admits omniclaude#2646's tool.uv.override-dependencies rev move and still refuses it beside project.scripts -- falsifier: uv run pytest tests/unit/test_writer_plugin_and_override_pin_classifiers_omn_20074.py -q fails at the merge base
  - id: "req-deploy-gate-reads-repo-contract"
    statement: |-
      omnimarket's deploy gate reads the cited ticket's deploy evidence from this repository's contracts/OMN-<n>.yaml at the pull request head, the contract repo-evidence / dod-verify reads, with the pinned validator's strictness unchanged and no change control checkout.
    acceptance:
      - id: "AC5"
        statement: |-
          AC5: .github/workflows/deploy-gate.yml checks out the pull request head's contracts/ and hands that directory to the pinned omniclaude deploy-gate action, and no step reads onex_change_control -- falsifier: uv run pytest tests/unit/workflows/test_deploy_gate_reads_repo_contracts_omn20074.py -q fails at the merge base
  - id: "req-companion-suffixed-evidence-ids"
    statement: |-
      companion_may_cover_pr reads a hand-authored change-control evidence id that carries a descriptive suffix after the PR number, under the owner-repo slug or the bare repo name, compared case- and underscore/hyphen-insensitively, so such an id no longer reads as unreadable coverage that defers every PR on the ticket.
    acceptance:
      - id: "AC6"
        statement: |-
          AC6: dod-omniclaude-pr-2656-runnerip-occ-independence-tests does not cover OmniNode-ai/omnibase_core#1942, and dod-omnibase-core-pr-1938-cosmetic-lint-tests, dod-omnibase_core-pr-1938 and dod-OmniNode-ai-omnibase_core-pr-1938-ci cover #1938 and not #19380 -- falsifier: uv run pytest tests/unit/test_occ_contention_omn_15247.py -q -p no:randomly -k hand_authored_id_for fails at the merge base
  - id: "req-caller-lane-fixture-schema"
    statement: |-
      The caller-lane PostgreSQL proof provisions its disposable schema without the omninode_internal namespace, so it retargets migration 0051's audit relation to that schema, as the backfill proof does, while the product migration and its namespace prerequisite stay unchanged.
    acceptance:
      - id: "AC7"
