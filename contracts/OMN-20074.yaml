schema_version: "1.0.0"
ticket_id: "OMN-20074"
title: "node_dod_verify names contract_in_another_repo as an expected OCC difference"
summary: "Operator ruling 2026-10-08T09:57:41Z makes a cross-repo ticket whose contract exists only in another product repository an expected OCC difference when the new path refuses and OCC admits. omnibase_core#1907 cites OMN-20704, whose contract is in omnimarket, and stops before writing a head verdict. A caller-supplied contract-home marker lets node_dod_verify name contract_in_another_repo. Operator RULING 2026-10-08T14:59:17Z extends RULING 2026-10-08T09:57:41Z: contract_in_another_repo (expected difference) also covers a PR whose ticket has its only other contract in onex_change_control. A marker naming onex_change_control also yields contract_in_another_repo."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-contract-in-another-repo"
    statement: |-
      Classify a missing or unreadable head with a caller-supplied marker naming any repository, including onex_change_control, as contract_in_another_repo, preserving existing head verdicts. Operator RULING 2026-10-08T14:59:17Z extends RULING 2026-10-08T09:57:41Z: contract_in_another_repo (expected difference) also covers a PR whose ticket has its only other contract in onex_change_control.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: omnibase_core#1907's shape (OMN-20704, no head or base control, contract-home-OMN-20704.txt naming OmniNode-ai/omnimarket, OCC success) prints passed true, outcome expected_difference, and reason_code contract_in_another_repo; a marker naming onex_change_control also prints that expected difference per operator ruling 2026-10-08T14:59:17Z; absent, empty, or unreadable markers leave reason unset, and a verified head with passed control still admits -- falsifier: #1907's shape or an onex_change_control marker still prints unclassified_difference
  - id: "req-caller-repin-release-cut"
    statement: |-
      omnimarket's Repo Evidence Gate caller pins the omnibase_core receipt-gate reusable at omnibase_core#1914's squash commit, whose dod-verify job exempts the OCC writer app's release cut derived at the head, with a verifier release that ships the classifiers it imports.
    acceptance:
      - id: "AC2"
        statement: |-
          AC2: .github/workflows/call-repo-evidence-gate.yml pins receipt-gate.yml at fb0c6c2117d5868a398b0920cd0048d0824415b1 (omnibase_core#1914) and its verifier-version ships is_release_artifact_only_diff and classify_dependency_pin_only -- falsifier: uv run pytest tests/ci/test_repo_evidence_caller_release_cut_repin_omn20074.py -q fails at the merge base
  - id: "req-writer-bump-classifiers"
    statement: |-
      The writer-app exemption classifiers admit omniclaude's two refused bot bump shapes, a plugin manifest version bump and a sibling lock refresh that moves tool.uv.override-dependencies, and still refuse any other change beside them.
    acceptance:
      - id: "AC3"
        statement: |-
          AC3: classify_plugin_manifest_version_only admits omniclaude#2644's shape (only the version of .claude-plugin/plugin.json and of the marketplace entry moves, increasing) and refuses another key, a non-increasing or non-numeric version, a path outside .claude-plugin manifests, an unreadable, added or deleted manifest, no moved version and too many files; classify_dependency_pin_only admits omniclaude#2646's tool.uv.override-dependencies rev move and still refuses it beside project.scripts -- falsifier: uv run pytest tests/unit/test_writer_plugin_and_override_pin_classifiers_omn_20074.py -q fails at the merge base
  - id: "req-emitter-caller-absent"
    statement: |-
      The OCC companion emitter authors no companion for a product PR whose base branch no longer carries .github/workflows/call-occ-autobind.yml, because that repository has cut over; the cut-over state is read from the repository's own base branch, not from a list of repositories.
    acceptance:
      - id: "AC4"
        statement: |-
          AC4: an autobind command for a PR whose base branch returns 404 for .github/workflows/call-occ-autobind.yml returns skip:CALLER_ABSENT with no clone and no change-control write, a base that still carries the caller authors as before, and a non-404 read failure raises -- falsifier: uv run pytest tests/unit/nodes/node_pr_lifecycle_fix_effect/test_occ_companion_emitter_friction_omn_14741.py -q -k TestCutOverCallerAbsent fails at the merge base
  - id: "req-deploy-gate-reads-repo-contract"
    statement: |-
      omnimarket's deploy gate reads the cited ticket's deploy evidence from this repository's contracts/OMN-<n>.yaml at the pull request head, the contract repo-evidence / dod-verify reads, with the pinned validator's strictness unchanged and no change control checkout.
    acceptance:
      - id: "AC5"
        statement: |-
          AC5: .github/workflows/deploy-gate.yml checks out the pull request head's contracts/ and hands that directory to the pinned omniclaude deploy-gate action, and no step reads onex_change_control -- falsifier: uv run pytest tests/unit/workflows/test_deploy_gate_reads_repo_contracts_omn20074.py -q fails at the merge base
  - id: "req-topic-hook-from-core"
    statement: |-
      omnimarket's no-hardcoded-topics pre-commit hook comes from omnibase_core, which exports it under the same hook id, instead of from onex_change_control, with the hook's exclude and settings unchanged.
    acceptance:
      - id: "AC6"
        statement: |-
          AC6: .pre-commit-config.yaml declares no-hardcoded-topics once, in an omnibase_core block pinned to a full commit sha, with its exclude (773 characters, sha256 7782a602) and settings unchanged and no onex_change_control block -- falsifier: uv run pytest tests/ci/test_precommit_topic_hook_core_omn20074.py -q fails at the merge base
evidence_requirements:
