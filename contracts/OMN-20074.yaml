    description: "The #1907 shape names the expected difference through the loader, classifier, and CLI while unruled cases and present head verdicts retain their behavior."
    command: "uv run pytest tests/test_dod_verify_occ_difference.py -q -p no:randomly"
  - kind: "tests"
    description: "The caller pins the release-cut reusable and its verifier ships the classifiers it imports."
    command: "uv run pytest tests/ci/test_repo_evidence_caller_release_cut_repin_omn20074.py -q"
  - kind: "tests"
    description: "The writer-app bump classifiers admit the two real omniclaude bump shapes and refuse every other change."
    command: "uv run pytest tests/unit/test_writer_plugin_and_override_pin_classifiers_omn_20074.py -q"
  - kind: "tests"
    description: "The emitter declines a cut-over repository's PR and still authors for a repository that keeps its caller."
    command: "uv run pytest tests/unit/nodes/node_pr_lifecycle_fix_effect/test_occ_companion_emitter_friction_omn_14741.py -q -k TestCutOverCallerAbsent"
  - kind: "tests"
    description: "The deploy gate reads the pull request head's repo contracts and no change control tree."
    command: "uv run pytest tests/unit/workflows/test_deploy_gate_reads_repo_contracts_omn20074.py -q -p no:randomly"
  - kind: "tests"
    description: "The topic hook is one omnibase_core block at a full sha with its exclude and settings unchanged and no onex_change_control block."
    command: "uv run pytest tests/ci/test_precommit_topic_hook_core_omn20074.py -q"
