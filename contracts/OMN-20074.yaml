  - id: "req-scripts-off-change-control"
    statement: |-
      omnimarket's scripts that nothing in this repository calls and that only served the governance repository's companions are deleted, and the lists that named that repository as a sibling to protect, scan or import no longer name it.
    acceptance:
      - id: "AC14"
        statement: |-
          AC14: the three uncalled occ scripts do not exist, five files that listed the governance repository no longer name it and the imperative-contract-guard required check names its omnibase_core owner -- falsifier: uv run pytest tests/unit/workflows/test_ci_off_change_control_omn20074.py -q -p no:randomly fails at the merge base
  - id: "req-repo-evidence-preflight-key"
    statement: |-
      The repo-evidence wait job in ci.yml and validator-runtime-profiles.yml is keyed by the evidence it reads, repo-evidence-preflight, and no workflow other than the four whose occ-preflight key omniclaude's advisory-job baseline grandfathers (auto-merge.yml, dep-health-gate.yml, market-skill-baseline.yml, plugin-compat-gate.yml) declares, needs or reads the result of a job keyed occ-preflight; the key keeps the word preflight so omnibase_core's shape-gate independence guard still finds the job, and the job's display name Repo Evidence Dependency is unchanged.
    acceptance:
      - id: "AC15"
        statement: |-
          AC15: ci.yml and validator-runtime-profiles.yml declare a repo-evidence-preflight job named Repo Evidence Dependency, every needs edge and result expression there that named occ-preflight names it, and no workflow outside the four advisory-baseline workflows declares, needs or reads occ-preflight -- falsifier: uv run pytest tests/ci/test_repo_evidence_prerequisite_workflow.py -q -p no:randomly -k keyed_by_what_it_waits_for fails at the merge base
  - id: "req-main-target-guard-no-receipt"
    statement: |-
