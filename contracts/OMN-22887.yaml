schema_version: "1.0.0"
ticket_id: "OMN-22887"
title: "Lab placement refuses a host that cannot reach what the brief reads"
summary: "Remote-lane placement takes the routes a brief reads over as route:<target> inputs (route:h201, route:broker-admin:dev) and keeps a host whose reading does not hold them off the lane, answering no-route per host and INPUT_ABSENT when only such hosts have room. The recorded 2026-11-07 h106 case is replayed through placement. The host table already accepts hosts.1.volumes_root."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-host-reach"
    statement: "Placement does not send a brief to a host with no route to what the brief reads, and the host table loads."
    acceptance:
      - id: "AC1"
        statement: "AC1: a brief that reads h201 or the dev broker admin port is not placed on a host with no route to it -- falsifier: uv run pytest of the recorded 2026-11-07 h106 reachability friction replayed through placement"
      - id: "AC2"
        statement: "AC2: lab_run_hosts.yaml hosts.1.volumes_root is accepted, or the host is removed from the table -- falsifier: uv run pytest that loads the host table"
evidence_requirements:
  - kind: "tests"
    description: "AC1: the h106 reachability friction replayed through placement."
    command: "uv run pytest tests/nodes/node_remote_lane_compute/test_host_reach_placement.py -q -p no:randomly"
  - kind: "tests"
    description: "AC2: the host table loads with hosts.1.volumes_root."
    command: "uv run pytest tests/unit/lab_work/test_lab_host_table_volumes_root.py -q -p no:randomly"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn22887-ac1-host-reach"
    description: "AC1: the h106 reachability friction replayed through placement."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_remote_lane_compute/test_host_reach_placement.py -q -p no:randomly"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC1"]
  - id: "dod-omn22887-ac2-host-table"
    description: "AC2: the host table loads with hosts.1.volumes_root."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/lab_work/test_lab_host_table_volumes_root.py -q -p no:randomly"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC2"]
  - id: dod-omn22887-host-reach-integration-proof
    description: The pushed head ran the host-reach placement tests on a lab host through the lab work runner and exited 0. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: 'env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-22887 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_remote_lane_compute/test_host_reach_placement.py -q --no-cov'
        cwd: .
