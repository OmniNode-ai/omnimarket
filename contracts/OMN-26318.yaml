schema_version: 1.0.0
ticket_id: OMN-26318
title: Every registry repository is counted by the ledger-file census, with a daily typed record of the per-repository and runtime-code counts that fails when any row grows
summary: >-
  The census node counted one repository. It now counts every repository the registry's clone list
  names (a clone that cannot be read is a red line, never a skip), holds one ratchet row and one
  per-file table per repository, splits each count by surface so runtime code (src/ and runtime
  contracts) is counted apart from tests, docs, data and plan contracts, and builds one typed daily
  record that the nightly workflow publishes and that is red when any row grew.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn26318-census-every-repository
    statement: The census counts every registry repository against its own row, with runtime code apart from the other surfaces, and a new reader seeded into any of them is red.
    acceptance:
      - id: AC1
        statement: >-
          AC1: the census run over every registry repository the node supports commits one ratchet row
          and one per-file table per repository, with runtime code (src/ and runtime contracts) counted
          apart from tests, docs, data and plan contracts -- falsifier: uv run pytest
          tests/unit/nodes/node_work_ledger_file_census_effect -k all_repositories_ratchet -q
      - id: AC2
        statement: >-
          AC2: a scheduled daily run (a node schedule or the existing nightly workflow, no new script)
          publishes the per-repository counts and the runtime-code count as one typed record and fails
          when any row grows -- falsifier: uv run pytest
          tests/unit/nodes/node_work_ledger_file_census_effect -k daily_record -q
      - id: AC3
        statement: >-
          AC3: a new reader seeded into any counted repository fails the census, and a ratchet row is
          never raised to pass it -- falsifier: uv run pytest
          tests/unit/nodes/node_work_ledger_file_census_effect -k new_reader_any_repository -q
evidence_requirements:
  - kind: tests
    description: The census node's tests pass at the pushed head, including the three falsifier selections.
    command: uv run pytest tests/unit/nodes/node_work_ledger_file_census_effect -q -p no:cacheprovider
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn26318-ac1-all-repositories
    description: The registry-wide ratchet tests pass at the head.
    source: manual
    binds_ac: [AC1]
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/nodes/node_work_ledger_file_census_effect -k all_repositories_ratchet -q -p no:cacheprovider
        cwd: .
  - id: dod-omn26318-ac2-daily-record
    description: The daily typed record tests pass at the head, and the nightly workflow carries the ledger-file-census job.
    source: manual
    binds_ac: [AC2]
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/nodes/node_work_ledger_file_census_effect -k daily_record -q -p no:cacheprovider
        cwd: .
  - id: dod-omn26318-ac3-new-reader
    description: A reader seeded into any counted repository fails the census at the head.
    source: manual
    binds_ac: [AC3]
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/nodes/node_work_ledger_file_census_effect -k new_reader_any_repository -q -p no:cacheprovider
        cwd: .
  - id: dod-omn26318-deploy
    description: 'Deploy probe the hosted runner can run: the registry reader module exists at the checked-out commit on GitHub and defines read_registry_repositories; it does not exist at the merge base, so the probe fails there.'
    source: manual
    checks:
      - check_type: command
        check_value: >-
          bash -o pipefail -c 'gh api "repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_work_ledger_file_census_effect/adapters/registry_list.py?ref=$(git rev-parse HEAD)" --jq .content | base64 -d | grep -F "def read_registry_repositories" > /dev/null'
  - id: dod-omn26318-integration-proof
    description: The pushed head ran the census node's tests on a lab host through the bus and exited 0. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: >-
          onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane census-1020 -- uv run --frozen pytest tests/unit/nodes/node_work_ledger_file_census_effect -q --no-cov -n 0 -p no:randomly
        cwd: .
