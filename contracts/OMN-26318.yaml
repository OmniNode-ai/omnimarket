schema_version: 1.0.0
ticket_id: OMN-26318
title: Every registry repository is counted by the ledger-file census, with a daily typed record of the per-repository and runtime-code counts that fails when any row grows
summary: The ledger-file census node counts runtime code (src/ and the runtime contracts in it, scripts and plugin hooks) apart from tests, docs, data and plan contracts through two overlay pattern lists, prints one typed daily record of the per-repository counts and the runtime-code count, and keeps the per-file rows of a repository the run did not count when it lowers a row. The packaged overlay and the packaged ratchet file now hold one row and one per-file table for each of the ten public registry repositories, and the daily census unit counts all of them with --per-file. A private repository keeps its own ratchet file in its own repository, because the packaged ratchet of this public repository names no private repository's files.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn26318-all-repositories
  statement: The census counts every registered repository against its own ratchet row and per-file table, reports runtime code apart, and fails when a row grows or a reader appears in any counted repository.
  acceptance:
  - id: AC1
    statement: 'AC1: the census run over every registry repository the node supports commits one ratchet row and one per-file table per repository, with runtime code (src/ and runtime contracts) counted apart from tests, docs, data and plan contracts -- falsifier: uv run pytest tests/unit/nodes/node_work_ledger_file_census_effect -k all_repositories_ratchet -q'
  - id: AC2
    statement: 'AC2: a scheduled daily run (a node schedule or the existing nightly workflow, no new script) publishes the per-repository counts and the runtime-code count as one typed record and fails when any row grows -- falsifier: uv run pytest tests/unit/nodes/node_work_ledger_file_census_effect -k daily_record -q'
  - id: AC3
    statement: 'AC3: a new reader seeded into any counted repository fails the census, and a ratchet row is never raised to pass it -- falsifier: uv run pytest tests/unit/nodes/node_work_ledger_file_census_effect -k new_reader_any_repository -q'
evidence_requirements:
- kind: tests
  description: The three census falsifiers pass.
  command: uv run pytest tests/unit/nodes/node_work_ledger_file_census_effect -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn26318-ac1
  description: The packaged overlay registers the nine public registry repositories and the packaged ratchet file holds one row and one per-file table for each. The census counts three fixture repositories each against its own row and table, counts the runtime files of each apart from tests, plan contracts and data, and the daily tick counts a registry root built from the committed tables.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/nodes/node_work_ledger_file_census_effect -k all_repositories_ratchet -q --no-cov
- id: dod-omn26318-ac2
  description: The daily record holds each repository's files and runtime files and the totals, names the failure when a row grows, and the CLI prints it as one CENSUS-RECORD line after one CENSUS line per repository. The existing daily unit's tick runs it over every registered repository with --per-file, prints the record and keeps it in its evidence file whether the census passed or failed, and puts it on the contract's declared topic as one typed event with the change against the previous day (the first run states no previous record and carries no change; a partial record is published marked partial; a grown count still fails the run; a contract with no publish topic fails the tick before the census runs).
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/nodes/node_work_ledger_file_census_effect -k daily_record -q --no-cov
- id: dod-omn26318-ac3
  description: A reader seeded into each of three repositories fails the census with that repository named, a reader seeded into each of the ten registered repositories fails the daily tick with that repository named and leaves the ratchet file as it was, a replaced reader that keeps the count under its row is still red, and a cleared reader lowers a row without raising any.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/nodes/node_work_ledger_file_census_effect -k new_reader_any_repository -q --no-cov
- id: dod-omn26318-integration-proof
  description: Run the census node's tests on a lab host at the pushed head. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-26318 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/nodes/node_work_ledger_file_census_effect -q --no-cov
