schema_version: 1.0.0
ticket_id: OMN-24225
title: The write gateway sets and reads approved repository variables
summary: The GitHub write node had no repository-variable operation, so two blocked fixes (the lab proof lane list and the ledger read command the freeze gate uses) could not set the GitHub repository variable they read. The node now serves repo_variable_set and repo_variable_get, limited to names its overlay allowlists with a declared source file in the overlays repository (the value is never on the request), refusing secret-shaped names and values and the unreadable source before any GitHub call, and onex scm serves them as variable-set and variable-get.
is_seam_ticket: true
interface_change: true
interfaces_touched:
- topics
- events
- public_api
requirements:
- id: req-omn24225-repo-variable
  statement: The GitHub write node serves repo_variable_set and repo_variable_get for overlay-allowlisted names whose value comes from the overlay's declared source, and onex scm serves them as variable-set and variable-get.
  acceptance:
  - id: AC1
    statement: 'AC1: a repository-variable set for a name on the overlay allowlist sends the declared source''s value to the repository-variable endpoint once, and a repeat sends no write -- falsifier: pytest tests/unit/nodes/node_github_repo_write_effect/test_handler_repo_variable.py -q'
  - id: AC2
    statement: 'AC2: a name not on the allowlist, a secret-shaped name or value, and a source that cannot be read are each refused with a typed reason and no GitHub call -- falsifier: pytest tests/unit/nodes/node_github_repo_write_effect/test_handler_repo_variable.py -q'
  - id: AC3
    statement: 'AC3: the golden and error chain tests for the new operations pass on the in-memory bus and the onex scm verbs and the node request shape agree -- falsifier: pytest tests/test_golden_chain_github_repo_write_effect.py tests/unit/handlers/scm/test_scm_write_seam_shapes.py -q'
  - id: AC4
    statement: 'AC4: integrated: onex scm variable-get on a lab host running the branch returns the declared value for the allowlisted name from the running runtime -- falsifier: onex scm variable-get <repo> --variable <name> --bus kafka --bus-lane dev ends with the variable''s digest equal to the source''s digest'
evidence_requirements:
- kind: tests
  description: The focused test files at the pushed head; the variable handler tests, the chain tests, the scm verb and seam tests, the operation table and the gh shim coverage table fail at origin/dev where the operations do not exist.
  command: env -u PYTHONPATH uv run --frozen pytest tests/unit/nodes/node_github_repo_write_effect/test_handler_repo_variable.py tests/test_golden_chain_github_repo_write_effect.py tests/unit/handlers/scm tests/ci/test_scm_operation_table_omn20912.py tests/ci/test_gh_shim_coverage_table_omn20914.py -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24225-ac1-ac2-handler
  description: The variable handler tests (create, update, no write when equal, a changed source written under the same key, allowlist, secret and unreadable-source refusals with no call). Fail at origin/dev, where the operations do not exist.
  source: manual
  binds_ac:
  - AC1
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/nodes/node_github_repo_write_effect/test_handler_repo_variable.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24225-ac3-chain-and-seams
  description: The golden chain and error chain legs for the variable operations on the in-memory bus, the CLI seam tests, the scm verb tests, the operation table and the gh shim coverage table.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/test_golden_chain_github_repo_write_effect.py tests/unit/handlers/scm/test_scm_write_seam_shapes.py tests/unit/handlers/scm/test_onex_scm_command.py tests/ci/test_scm_operation_table_omn20912.py tests/ci/test_gh_shim_coverage_table_omn20914.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24225-ac4-integration-proof
  description: The pushed head ran the focused variable tests on a lab host through the lab work runner and exited 0. The running-runtime reading (onex scm variable-get through the dev lane's runtime on a revision that carries the operations) is read from the lab receipt comment on the ticket.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24225 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/nodes/node_github_repo_write_effect/test_handler_repo_variable.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24225-ac4-verb-readback
  description: The onex scm variable-get and variable-set verb tests on a hosted runner. They fail at the merge base, where the verbs and the operations do not exist; the running-runtime reading is read from the lab receipt comment on the ticket.
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/handlers/scm/test_onex_scm_command.py -k variable -q --no-cov -n 0 -p no:randomly
    cwd: .
