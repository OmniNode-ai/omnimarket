---
schema_version: "1.0.0"
ticket_id: "OMN-20497"
title: "A queue commit on dev carries the repo-evidence context that dev's ruleset requires"
summary: "dev's repo-evidence ruleset requires repo-evidence / dod-verify. Its caller runs on pull_request_target and the reusable it calls refuses any other event, so a merge-queue commit never carries the context and a queue entry would wait until the queue's check timeout. merge-group-pr-scoped-contexts.yml gains one job named for the context that reads the verdict the same context already reached on the queued pull request head, the way its other jobs do, and runs on merge_group only."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-queue-commit-carries-the-context"
    statement: "A merge-queue commit reports repo-evidence / dod-verify from the verdict on the queued pull request head."
    acceptance:
      - id: "AC1"
        statement: "AC1: merge-group-pr-scoped-contexts.yml declares exactly one job named repo-evidence / dod-verify -- falsifier: a workflow with no such job, or two"
  - id: "req-shim-never-shadows-the-producer"
    statement: "The job runs on merge_group only, so it cannot stand in for the real producer on a pull request."
    acceptance:
      - id: "AC2"
        statement: "AC2: the workflow's only trigger is merge_group and the caller keeps pull_request_target without merge_group -- falsifier: a pull_request trigger on the shim workflow, or a merge_group trigger on the caller"
evidence_requirements:
  - kind: "tests"
    description: "AC1 and AC2: the workflow files are read and the job name and triggers asserted."
    command: "uv run pytest tests/unit/workflows/test_merge_group_repo_evidence_context_omn20497.py -q -p no:randomly --no-cov -n 0"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn20497-ac1-queue-commit-reports-context"
    description: "AC1: the merge-group workflow declares the repo-evidence / dod-verify job exactly once."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/workflows/test_merge_group_repo_evidence_context_omn20497.py -q -p no:randomly --no-cov -n 0 -k 'queue_commit_reports_the_repo_evidence_context'"
    binds_ac: ["AC1"]
  - id: "dod-omn20497-ac2-merge-group-only"
    description: "AC2: the shim workflow triggers on merge_group only and the caller is left without merge_group."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/workflows/test_merge_group_repo_evidence_context_omn20497.py -q -p no:randomly --no-cov -n 0 -k 'merge_group_only or names_the_context'"
    binds_ac: ["AC2"]
