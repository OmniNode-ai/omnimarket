schema_version: 1.0.0
ticket_id: OMN-23190
title: The workflow baseline comparison refuses duplicate readings and non-finite values, refuses a late result, compares exactly at the tolerance edge and keys its cause lane without collisions
summary: Five review findings on the baseline compare node are fixed in the node and each has a test that fails on the code before the fix. Runtime readings named twice are refused when the result is built. A result observed after the command's deadline reads NOT WORKING. The tolerance compare runs on decimals, so the inclusive edge holds. Infinity and not-a-number are refused in a value, a tolerance and a reading. The cause-lane dispatch key escapes a colon in its parts, so distinct route, baseline and command triples do not share a key.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23190-findings
  statement: The baseline compare node reads a scheduled run the same way whatever the order of its readings, refuses a late result, compares exactly at the tolerance edge, refuses non-finite numbers and gives distinct runs distinct cause-lane keys.
  acceptance:
  - id: AC1
    statement: 'AC1: a test per finding fails on the code at omnimarket dev 566d7ead09 and passes with the fix -- falsifier: uv run pytest tests/nodes/node_workflow_baseline_compare_compute -q, run on the base with the test files copied in (red) and on the fix branch (green)'
  - id: AC2
    statement: 'AC2: duplicate runtime reading names are refused or resolved by a stated rule that does not depend on input order -- falsifier: uv run pytest tests/nodes/node_workflow_baseline_compare_compute -q -k duplicate'
  - id: AC3
    statement: 'AC3: the tolerance compare is exact at the inclusive boundary and refuses inf and nan in value, tolerance and readings -- falsifier: uv run pytest tests/nodes/node_workflow_baseline_compare_compute -q -k "boundary or finite"'
evidence_requirements:
- kind: tests
  description: The finding tests of the compare node with its golden and error chain tests.
  command: uv run pytest src/omnimarket/nodes/node_workflow_baseline_compare_compute tests/nodes/node_workflow_baseline_compare_compute -q
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
