schema_version: 1.0.0
ticket_id: OMN-25005
title: "node_broker_auth_refusal_reading_effect can be scheduled: it installs an hourly user timer on a host its overlay names"
summary: "omnimarket#5641 added node_broker_auth_refusal_reading_effect with no trigger: its contract had no schedule block and no unit installed it, and the dev runtime held no overlay for it, so the integration pass read it NOT RUNNING. This change gives the node the sibling broker load reading's hourly schedule (a schedule block in its contract, a schedule verb that installs, uninstalls, reads the status of and runs now a systemd user timer on a host the overlay's schedule_hosts names, and an optional schedule_hosts field on its overlay model, so an overlay without it still loads). The overlay and the runner line for omnimarket#5641 are in the overlays repository."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn25005-schedule
  statement: The node installs an hourly timer that runs its read verb on a declared host, and uninstall is the rollback.
  acceptance:
  - id: AC1
    statement: "AC1: a STATUS row on the rolling ledger reads kv pr=omnimarket#5641 installed=<host>:<revision> observed=<what ran> read_at=<UTC>, written by the lane after it read one run on the dev runtime on h201 itself (a log line, a dispatch, a health read or a job record) -- falsifier: `grep -F 'pr=omnimarket#5641' the ledger file | grep -F 'installed='` finds no row"
  - id: AC2
    statement: "AC2: the node of omnimarket#5641 handles one run on the dev runtime, or the STATUS row names the single measured cause that keeps it from running and who must act -- falsifier: the dev runtime log and job record on h201 show no run line of the node and the STATUS row names no cause and no actor"
  - id: AC3
    statement: "AC3: no host file, unit or plist was edited by hand: every change went through the declared installer, read from the installer's own receipt -- falsifier: the STATUS row cites no installer receipt, or the installed unit differs from the revision the receipt names"
evidence_requirements:
- kind: tests
  description: The node's tests, including the schedule tests (install writes an hourly timer whose service runs the read verb, uninstall is the rollback, an undeclared host and an unsafe root are refused, a dry run writes nothing).
  command: uv run --frozen pytest tests/nodes/node_broker_auth_refusal_reading_effect -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn25005-ac1-status-row
  description: The STATUS row of the lane names the pull request, the installed host and revision and what ran. The ledger is on the launching host (LANE_LEDGER_FILE names its file there), so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  binds_ac:
  - AC1
  checks:
  - check_type: command
    check_value: 'grep -F "pr=omnimarket#5641" "${LANE_LEDGER_FILE:?set LANE_LEDGER_FILE to the rolling ledger file}" | grep -F "installed=" | grep -F "observed="'
    cwd: .
- id: dod-omn25005-ac2-schedule
  description: The node installs an hourly timer whose service runs the read verb, the same suite that proves the reading itself.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_broker_auth_refusal_reading_effect -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn25005-ac3-installer
  description: The unit is written by the node's own schedule install verb (dry run and rollback tested), never by hand.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_broker_auth_refusal_reading_effect/test_broker_auth_refusal_schedule.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn25005-integration-proof
  description: The pushed head ran the node's tests, schedule tests included, on a lab host through the lab work runner and exited 0. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: 'uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-25005 -- uv run --frozen pytest tests/nodes/node_broker_auth_refusal_reading_effect -q --no-cov -n 0 -p no:randomly'
    cwd: .
- id: dod-omn25005-deploy-schedule-installer
  description: The deploy surface of this change is the schedule installer in the node's schedule handler; the check reads the handler from the pushed branch through the GitHub contents API (a live read, runnable on the hosted runner), and fails when the systemd renderer is absent.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: command
    check_value: gh api "repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_broker_auth_refusal_reading_effect/handlers/schedule.py?ref=omn-25005-broker-auth-refusal-schedule" --jq .content | base64 -d | grep -q 'def render_systemd'
    cwd: .
