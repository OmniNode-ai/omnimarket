schema_version: 1.0.0
ticket_id: OMN-23169
title: Delegation rows typed experiment are left out of a user's run, token, spend and savings totals and stay listed on Runs
summary: Migration 0064 stores data_source experiment for a synthetic terminal, but the Postgres delegation summary view, the Postgres metering refresh query and the SQLite metering reader and summary view left out only fixture rows. Migration 0065 and a new SQLite store step rebuild the summary view over the non-experiment rows, the metering refresh query and the SQLite reader skip experiment rows, and delegation_events still holds every row the Runs listing reads.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23169-synthetic-excluded-from-totals
  statement: A synthetic run leaves run, token, spend and savings totals unchanged on Postgres and on SQLite and is still listed on Runs.
  acceptance:
  - id: AC1
    statement: 'AC1: a synthetic run leaves run, token, spend and savings totals unchanged on Postgres and on SQLite and is listed on Runs -- falsifier: `uv run pytest tests/projection/test_synthetic_exclusion.py -q`'
evidence_requirements:
- kind: tests
  description: The synthetic exclusion tests pass on SQLite and, where a Postgres is reachable, on the node's whole migration chain applied to a throwaway schema.
  command: uv run --frozen pytest tests/projection/test_synthetic_exclusion.py -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
