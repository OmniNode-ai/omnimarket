schema_version: 1.0.0
ticket_id: OMN-24044
title: The delegation step's default engine order is read from the routing settings by a reader in the team code
summary: node_delegation_routing_order_compute (omnimarket 5868) answers the order in which a delegating caller tries engines for a task class from the delegation routing overlay, and nothing calls it. The lane's delegation step keeps its own fixed defaults (GLM first for text, GLM before the lab for code), so every brief overrides them by hand and an overlay edit changes nothing. This pull request adds the reader the step asks, read_engine_order in omnimarket.handlers.delegation_routing_order_reader, which returns one entry per rung through the node, None when the class has no chain or no overlay is bound, and raises a typed error for any other refusal. The step's switch to the reader is a separate pull request that waits for this one on dev.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24044-routing-order-reader
  statement: A reader in omnimarket returns the engine order of a task class through the routing order node, and refuses an invalid or non-lab-first answer without a default.
  acceptance:
  - id: AC1
    statement: 'AC1: the reader returns one entry per rung of the node''s answer in rung order (ladder, then each harness) for a named class, and None for a class with no chain or when no overlay is bound -- falsifier: uv run pytest tests/unit/handlers/test_delegation_routing_order_reader.py -q -n 0 --no-cov fails without the reader'
  - id: AC2
    statement: 'AC2: an invalid overlay and a chain that does not open on the lab tier raise the reader''s typed error and never return a default -- falsifier: uv run pytest tests/unit/handlers/test_delegation_routing_order_reader.py -q -n 0 --no-cov -k "overlay_invalid or not_lab_first"'
  - id: AC3
    statement: 'AC3: integrated: the reader called in the lab dispatch venv with the real overlay roots answers the order of the document class, lab first -- falsifier: the printed order on that host does not open with ladder or the call raises'
