---
schema_version: "1.0.0"
ticket_id: "OMN-26682"
title: "A code answer with no tests run reads untested on the gateway receipt, never passed"
summary: "The gateway receipt and status carry a typed tests_outcome (passed, failed or untested) derived from the rule evaluations the answer gate records; no answer accepted before is refused."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn26682-untested
  statement: "A code answer for which no test was named or run carries tests_outcome untested on the receipt."
  acceptance:
  - id: AC1
    statement: 'AC1: no tests named or run reads untested; Falsifier: tests/nodes/node_workflow_gateway_effect/test_receipt_tests_outcome.py::test_no_tests_named_or_run_reads_untested'
- id: req-omn26682-passed-failed
  statement: "Tests that ran and passed read passed; tests that ran and failed read failed."
  acceptance:
  - id: AC2
    statement: 'AC2: passed and failed read as such; Falsifier: tests/nodes/node_workflow_gateway_effect/test_receipt_tests_outcome.py::test_tests_that_ran_and_passed_read_passed tests/nodes/node_workflow_gateway_effect/test_receipt_tests_outcome.py::test_tests_that_ran_and_failed_read_failed'
- id: req-omn26682-no-new-refusal
  statement: "No answer accepted before is refused."
  acceptance:
  - id: AC3
    statement: 'AC3: the answer gate and gateway suites pass whole; Falsifier: tests/nodes/node_workflow_gateway_effect'
dod_evidence:
- id: dod-omn26682-ac1
  description: 'AC1: untested reading.'
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_workflow_gateway_effect/test_receipt_tests_outcome.py -k untested -q -n 0 --no-cov -p no:cacheprovider
    cwd: .
- id: dod-omn26682-ac2
  description: 'AC2: passed and failed readings.'
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_workflow_gateway_effect/test_receipt_tests_outcome.py -k "read_passed or read_failed" -q -n 0 --no-cov -p no:cacheprovider
    cwd: .
- id: dod-omn26682-ac3
  description: 'AC3: gateway suite passes whole.'
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_workflow_gateway_effect -q -n 0 --no-cov -p no:cacheprovider
    cwd: .
- id: dod-omn26682-integration-proof
  description: Run the receipt tests and the gateway suite on a lab host at the pushed revision.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-26682 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_workflow_gateway_effect -m 'not e2e' -q -n 0 --no-cov --refuse-skips
    cwd: .
