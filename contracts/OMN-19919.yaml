schema_version: "1.0.0"
ticket_id: "OMN-19919"
title: "The decisions exposure serves a failed run's typed cause"
summary: "The writer stores terminal_failure_cause on delegation_events, and Postgres has the column since migration 0029, but the decisions exposure did not declare it, so Runs and the failure-cause list could not show why a run failed, and the per-row snapshot, which carries only declared columns, dropped it too. The exposure now declares the column after terminal_ok, and the local SQLite store adds it on connect, so a fresh store serves it as null before any failure is written."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-omn19919-failure-cause-served"
    statement: |-
      The decisions exposure serves each run's typed failure cause, null for a run without one.
    acceptance:
      - id: "AC4"
        statement: |-
          AC4: The decisions exposure serves terminal_failure_cause -- falsifier: a pytest that writes one failed terminal with a typed cause through the projection writer into the local SQLite store, reads the decisions exposure through create_dashboard_app, and fails unless the served row and its snapshot carry terminal_ok false and that cause, and a passing run reads null.
evidence_requirements:
  - kind: "tests"
    description: "Through the real writer, local store and dashboard app: a failed run serves terminal_ok false and its typed cause (two causes), its per-row snapshot carries the same cause, a passing run serves null, and a fresh store with only passing runs serves the column as null. On dev's code all 3 fail."
    command: "uv run pytest tests/projection/test_omn19919_failure_cause_served.py -q -p no:randomly"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn19919-ac4-failure-cause-served"
    description: "A failed run's typed cause is on the served decisions row and its snapshot; a passing run's is null; a fresh local store serves the column."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/projection/test_omn19919_failure_cause_served.py -q -p no:randomly"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC4"]
  - id: "dod-omn19919-ac4-deploy-probe"
    description: "Deploy probe. GitHub serves the local store at the checked-out commit with terminal_failure_cause among the delegation_events declared columns; the probe reads it from GitHub at that commit and exits nonzero on a tree without it, so it fails at the merge base. This proves source identity only, not a running deployment."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: "gh api \"repos/OmniNode-ai/omnimarket/contents/src/omnimarket/projection/sqlite_database.py?ref=$(git rev-parse HEAD)\" --jq .content | base64 -d | grep -c '^    \"terminal_failure_cause\",$'"
