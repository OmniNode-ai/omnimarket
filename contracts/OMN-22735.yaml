schema_version: 1.0.0
ticket_id: OMN-22735
title: The reading writer's schedule install refuses a unit whose ExecStart, WorkingDirectory or Environment sits under omni_worktrees and names the path
summary: A unit installed from a worktree dies when the host worktree reconcile removes that tree, and three units died that way on 2026-11-06 (the overlay store refresh unit, the floor publisher unit that was left at risk, and the h053 hourly reading writer, whose interpreter and both ledger commands sat in a removed worktree). The reading writer's overlay-driven install accepted the worktree path without a word. The install now reads the rendered service and timer text through the shared unit-root guard and refuses, before any file is written and also in a dry run, when an ExecStart, WorkingDirectory or Environment line names a path with an omni_worktrees segment; the refusal names the path and exits 1.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn22735-refuse-worktree-roots
  statement: The reading writer's schedule install never writes a unit that runs from a worktree.
  acceptance:
  - id: AC1
    statement: 'AC1: facts built from the recorded onex-reading-hourly.service text name its worktree paths and the guard refuses it, naming the unit and the path; an install whose venv sits under omni_worktrees exits 1 naming the path and writes nothing -- falsifier: uv run --frozen pytest tests/nodes/node_reading_writer_effect/test_reading_schedule_worktree_guard.py -q --no-cov'
  - id: AC2
    statement: 'AC2: a unit rendered from stable roots installs and writes both files, none holding omni_worktrees -- falsifier: uv run --frozen pytest tests/nodes/node_reading_writer_effect/test_reading_schedule_worktree_guard.py -k stable_root -q --no-cov'
  - id: AC3
    statement: 'AC3: the refused install (error case) and the stable install (golden case) each leave the expected result, and with the guard let through by a named injected break the same install writes a worktree unit -- falsifier: uv run --frozen pytest tests/nodes/node_reading_writer_effect/test_reading_schedule_worktree_guard.py -k "guard_let_through or stable_root or refused" -q --no-cov'
  - id: AC4
    statement: 'AC4: on a lab host at the pushed head, schedule install against an overlay that names a worktree venv exits 1 with the path named and leaves the installed unit files byte for byte unchanged -- falsifier: run the node schedule install on the lab host with a scratch overlay root and compare the unit file hashes before and after'
evidence_requirements:
- kind: tests
  description: The guard refusals, the stable install and the injected break
  command: uv run --frozen pytest tests/nodes/node_reading_writer_effect -q --no-cov
