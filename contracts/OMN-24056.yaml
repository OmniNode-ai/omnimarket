schema_version: 1.0.0
ticket_id: OMN-24056
title: The release installer test passes with every recent pipx version
summary: The test of the release candidate installed-content check installs the stub wheels through pipx with offline pip arguments. pipx 1.6.0 through 1.11.1 hand those arguments to the pip that upgrades pipx's own shared libraries on a fresh pipx home, and the wheel directory held no pip wheel, so the install failed with no matching pip distribution and Tests (Split 16/20) read red on every pull request that ran it. The test support now copies the pip wheel the interpreter bundles into a directory named in the offline arguments. No product code and no check changes.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24056-pipx-offline
  statement: The pipx install in the release candidate installed-content test resolves offline with every pipx version the runners carry.
  acceptance:
  - id: AC1
    statement: 'AC1: the pipx install test passes with pipx 1.6.0, 1.8.0, 1.10.0, 1.11.1 and 1.12.0 on PATH -- falsifier: with the pip wheel directory removed from the pipx offline arguments the test fails under pipx 1.10.0 with no matching distribution for pip>=23.1'
  - id: AC2
    statement: 'AC2: the offline pipx arguments carry a pip wheel at least version 23.1 -- falsifier: uv run pytest tests/nodes/node_release_candidate_verify_effect/test_installed_content.py -k carry_the_pip -n 0 --no-cov -p no:cacheprovider'
  - id: AC3
    statement: 'AC3: integrated: Tests (Split 16/20) is green on the omnimarket dev tip after the merge -- falsifier: the dev-tip check row for Tests (Split 16/20) reads failure in the PR watcher state of the merged revision'
evidence_requirements:
- kind: tests
  description: The installed-content tests pass at the pushed head.
  command: uv run pytest tests/nodes/node_release_candidate_verify_effect/test_installed_content.py -q -n 0 --no-cov -p no:cacheprovider
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
