    check_value: uv run pytest tests/nodes/node_release_candidate_verify_effect/test_installed_content.py -k untouched_pipx -q -n 0 --no-cov -p no:cacheprovider
    cwd: .
- id: dod-omn24056-ac2
  description: 'AC2: the pip wheel directory test passes at the head.'
  source: manual
