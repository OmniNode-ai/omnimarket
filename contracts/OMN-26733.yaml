---
schema_version: "1.0.0"
ticket_id: OMN-26733
title: "The omnimarket post-release dev bump lands after each release, so commits that touch src pass the release identity hook"
summary: The post-release bump to 0.4.330 is red on one base failure, the onex.cli.help table lacking the settings entry; the entry is added so the drift test passes on dev and on the bump.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn26733-bump-red-fixed-at-source
    statement: Each red check on the post-release bump is fixed at its source or named as a base red with its commit and job.
    acceptance:
      - id: AC1
        statement: "AC1: omnimarket#6997 (or its replacement) is green at its head and merged, and origin/dev pyproject.toml reads a version greater than the newest v* tag -- falsifier: git -C omnimarket show origin/dev:pyproject.toml | grep -m1 '^version' reads 0.4.329"
      - id: AC2
        statement: "AC2: each red check on the bump is fixed at its source or named as a base red with its commit and job -- falsifier: a red check on the bump with no fix and no named cause"
evidence_requirements:
  - kind: tests
    description: The help-table drift test, which fails on dev at 0f3ee51bc4 for the settings command and passes with the entry.
    command: uv run pytest tests/unit/cli/test_onex_cli_help_table_omn26615.py -q --no-cov
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-omn26733-settings-help-entry
    description: "Tests (Split 16/20) on omnimarket#6997 failed with: visible command 'settings' has no onex.cli.help entry. The same test fails on dev at 0f3ee51bc4 because the settings command (cee288483f) was registered without a help line. The entry now equals the command's own help and the drift test passes."
    source: manual
    binds_ac: [AC2]
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/cli/test_onex_cli_help_table_omn26615.py -q --no-cov
        cwd: .
  - id: dod-omn26733-dev-ahead-of-tag
    description: "dev pyproject.toml reads a version above v0.4.329 (it reads 0.4.330 after omnimarket#6997 merged), and a version equal to the release is refused by the same decision."
    source: manual
    binds_ac: [AC1]
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/ci/test_omn26733_dev_ahead_of_v0_4_329.py -q --no-cov -n 0 -p no:randomly
        cwd: .
  - id: dod-omn26733-release-identity-passes-on-src
    description: "The check-release-identity hook passes on a src/ file at this head, which dev can only do once its version is above the newest tag."
    source: manual
    binds_ac: [AC3]
    checks:
      - check_type: command
        check_value: uv run pre-commit run check-release-identity --files src/omnimarket/__init__.py
        cwd: .
  - id: dod-omn26733-lock-pin-survives-bump
    description: "omnimarket#7056 (the 0.4.331 bump) failed Release Proof, Tests (Split 6/20) and Integration Silent-Skip Guard with input_pin_mismatch: uv.lock, because 70 work contracts pinned uv.lock by whole-file hash and the bump rewrites the project version and lock revision. The pin hashes the lock without those two lines; a bumped lock passes and a changed dependency still fails."
    source: manual
    binds_ac: [AC2]
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/ci/test_omn26733_lock_pin_survives_version_bump.py -q --no-cov -n 0 -p no:randomly
        cwd: .
  - id: dod-omn26733-integration-proof-lock-pin
    description: On a lab host, onex lab-work runs the lock pin test and the work-contract corpus load against the pushed head, so every uv.lock pin is read through the live loader. Hosted CI holds no lab bus, so only the local Done gate runs this unbound check (the lab reading is in the PR body).
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: onex lab-work run --bus-lane dev --omnibase-path "${OMNI_HOME:?}" --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-26733 --kind test -- uv run --frozen pytest tests/ci/test_omn26733_lock_pin_survives_version_bump.py tests/nodes/test_work_contract_checks.py -q --no-cov -n 0 -p no:randomly
        cwd: .
