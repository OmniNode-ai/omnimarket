  - id: "req-terminal-command-id"
    statement: |-
      The terminal wire models must declare command_id and the delegate-skill handler must stamp it from the delivering command message.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: the delegate-skill handler stamps command_id, the id of the delivering command message, on every completed and failed terminal it publishes, and a served replay keeps its command id -- falsifier: uv run pytest tests/test_omn20383_terminal_command_id.py -q
      - id: "AC2"
        statement: |-
          AC2: the terminal wire models declare command_id so a decoded terminal carries it, and a misspelt key is still refused with extra_forbidden -- falsifier: uv run pytest tests/unit/delegation/test_omn19437_terminal_accepts_command_id.py -q
