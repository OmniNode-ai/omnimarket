schema_version: 1.0.0
ticket_id: OMN-23225
title: The floor's work_under_way leaves out a read-only analysis CLAIM
summary: 'A read-only five whys lane opened a CLAIM with worktree=none on a stoppage row''s owner ticket and turned the row from red to amber with work_under_way true, though the lane could change nothing. The ledger reader now marks a CLAIM that declares worktree=none or mode=read-only, the factory floor record carries the mark on the lane, and the floor''s live_lanes rule leaves such a lane out. A CLAIM with a worktree, or with no worktree cell, still counts.'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23225-read-only-claim-not-work-under-way
  statement: A CLAIM whose worktree is none or that declares mode=read-only is not work under way on a floor row; a CLAIM with a worktree still is.
  acceptance:
  - id: AC1
    statement: 'AC1: the floor''s work_under_way rule leaves out a CLAIM whose worktree is none or that declares mode=read-only, and still counts a CLAIM with a worktree -- falsifier: uv run pytest tests/nodes/node_floor_simple_compute/test_read_only_claim_omn23225.py -q fails at the merge base (the worktree=none and mode=read-only cases read amber, work_under_way true)'
evidence_requirements:
- kind: tests
  description: The read-only CLAIM tests pass at the pushed head.
  command: uv run --frozen pytest tests/nodes/node_floor_simple_compute/test_read_only_claim_omn23225.py -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
