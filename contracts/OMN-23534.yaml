schema_version: 1.0.0
ticket_id: OMN-23534
title: The landing snapshot step answers the installer's start check without reading its settings
summary: The host installer's start proof runs the snapshot module with --help in the installing shell; the module ignored its arguments, so it read the overlay (refused with all thirteen overlay fields listed when ONEX_SKILL_OVERLAY_ROOTS is not exported there) and, with an overlay, took a real pass and published a record. The module now answers --help with usage and exits 0 before any overlay read, and still accepts the unit's --omni-home and --state-dir. The overlay loader's absent-file message, first listed here as AC2, is delivered and bound by OMN-23536 (omnimarket#5743), whose loader tests fail at the merge base; it is not repeated here because a criterion that the merge base already passes, or that this change cannot make fail, cannot carry a failing control.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23534-start-check
  statement: python -m omnimarket.nodes.node_pr_landing_snapshot_effect --help prints usage and exits 0 without reading an overlay or taking a pass; an unknown option refuses with exit 2; a pass really run without an overlay still refuses with overlay_refused.
  acceptance:
  - id: AC1
    statement: 'AC1: python -m omnimarket.nodes.node_pr_landing_snapshot_effect --help exits 0 with usage, reads no overlay and takes no pass, and the unit''s --omni-home and --state-dir options are still accepted -- falsifier: the start-check test run against the merge base fails (the module runs a pass and prints overlay_refused)'
  - id: AC3
    statement: 'AC3: integrated: the landing-snapshot unit installs on the floor host from the merged revision through the declared installer with the overlay root passed in the request, and its next tick publishes a tick-facts record that is read on the bus -- falsifier: the installer''s result and the unit''s run record on the floor host'
evidence_requirements:
- kind: tests
  description: The start-check tests at the pushed head. With runtime_snapshot.py restored to origin/dev, the help test, the no-side-effect test and the unknown-option test fail.
  command: python -m pytest tests/nodes/node_pr_landing_snapshot_effect/test_snapshot_start_check.py tests/nodes/node_host_installer_registry_units/test_landing_snapshot_unit.py -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23534-ac1-start-check
  description: The start-check tests pass at the pushed head; with runtime_snapshot.py at origin/dev three of them fail (help does not exit, a valid overlay makes the help call attempt a real publish, the unknown option is ignored).
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_pr_landing_snapshot_effect/test_snapshot_start_check.py tests/nodes/node_host_installer_registry_units/test_landing_snapshot_unit.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn23534-ac3-installer-seam
  description: The seam from the installer's start proof and the unit's plist arguments to the step's main passes at the pushed head; with runtime_snapshot.py at origin/dev the seam test fails (DID NOT RAISE SystemExit). The floor-host install and the tick-facts record it publishes are read by the local Done gate item below and recorded in the pull request.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_host_installer_registry_units/test_landing_snapshot_unit.py -q --no-cov -n 0 -p no:randomly -k test_the_step_main_accepts_the_arguments_the_installer_proof_and_the_plist_pass
    cwd: .
- id: dod-omn23534-floor-install
  description: The unit is installed on the floor host and its run record shows a tick-facts record published. Hosted CI cannot reach the floor host, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: 'test -s "${LANDING_SNAPSHOT_LAST_RUN:?set LANDING_SNAPSHOT_LAST_RUN to the unit run record on the floor host}"'
    cwd: .
- id: dod-omn23534-integration-proof
  description: The pushed head ran the start-check tests and the installer's landing-snapshot unit tests on a lab host through the lab work runner and exited 0. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: 'env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23534 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_pr_landing_snapshot_effect/test_snapshot_start_check.py tests/nodes/node_host_installer_registry_units/test_landing_snapshot_unit.py -q --no-cov'
    cwd: .
