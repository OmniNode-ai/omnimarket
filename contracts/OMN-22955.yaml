schema_version: 1.0.0
ticket_id: OMN-22955
title: The install canary and the superset guard are nodes in omnimarket and the installer moves out of the frozen repository with a file-list comparison test
summary: node_install_superset_guard_effect gains a file-list comparison that names each file an install copies from a commit that the test host's copy lacks, and the installer's live-tree check refuses on it. node_install_canary_effect gains one install probe that reads a fresh head, with a daily operation and a drill operation that triggers the same probe on demand against a scratch copy with a root data file deleted.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn22955-file-list-and-probe
  statement: The superset guard compares the commit's file list with the install's copy and the canary node runs that comparison as one probe, daily against a fresh head and on demand as a drill.
  acceptance:
  - id: AC1
    statement: 'AC1: the file-list comparison test fails when a root data file is missing from a test host''s copy and passes when equal -- falsifier: uv run pytest src/omnimarket/nodes/node_install_superset_guard_effect -q -k file_list_comparison'
  - id: AC2
    statement: 'AC2: the daily install canary runs with a fresh head and the drill triggers the same probe on demand -- falsifier: uv run pytest src/omnimarket/nodes/node_install_canary_effect -q -k daily_and_drill'
evidence_requirements:
- kind: tests
  description: The file-list comparison, daily and drill tests pass, and the existing install node tests still pass
  command: uv run --frozen pytest src/omnimarket/nodes/node_install_superset_guard_effect src/omnimarket/nodes/node_install_canary_effect tests/nodes/node_install_superset_guard_effect tests/nodes/node_install_canary_effect -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn22955-file-list-comparison
  description: A root data file missing from a test host's copy is named by the comparison and an equal copy passes.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest src/omnimarket/nodes/node_install_superset_guard_effect -q -k file_list_comparison --no-cov
    cwd: .
- id: dod-omn22955-daily-and-drill
  description: The daily probe reads a fresh head on each run and the drill runs the same probe on a scratch copy with a root data file deleted.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest src/omnimarket/nodes/node_install_canary_effect -q -k daily_and_drill --no-cov
    cwd: .
- id: dod-omn22955-integration-proof
  description: Run this pull request's own check on a lab host at the pushed head. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-22955 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest src/omnimarket/nodes/node_install_superset_guard_effect src/omnimarket/nodes/node_install_canary_effect -q --no-cov
    cwd: .
