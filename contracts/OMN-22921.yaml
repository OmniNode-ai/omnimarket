schema_version: 1.0.0
ticket_id: OMN-22921
title: The landing tick runs as the orchestrator and reducer nodes beside the 300 s script, one tick in replay reads equal decisions on recorded snapshots, and a planted divergence turns it red
summary: node_pr_landing_tick_orchestrator runs one tick's facts through the decision node with the fair share and the new node_pr_landing_tick_reducer, which folds the decision to a row per pull request and names every pull request whose rows differ from the recorded decision. Replay and observe modes write no merge, arm or rerun; act mode is refused unless the overlay enables it. The overlay selects the in-memory backend or the Redpanda backend and the floor piece; each tick emits a start and a success or a typed failure under the floor's emission contract for piece 9.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn22921-replay-parity
  statement: Recorded tick snapshots replayed through the tick orchestrator give the decision per pull request that was recorded, and a planted divergence names the pull request.
  acceptance:
  - id: AC1
    statement: 'AC1: a replay of recorded tick snapshots through node_pr_landing_orchestrator yields the same decision per pull request as the script''s recorded decisions -- falsifier: uv run pytest tests/unit/nodes/node_pr_landing_orchestrator/test_replay_parity.py -q'
  - id: AC2
    statement: 'AC2: a planted divergence in one snapshot turns the parity test red and names the pull request -- falsifier: uv run pytest tests/unit/nodes/node_pr_landing_orchestrator/test_replay_parity.py -q -k divergence'
  - id: AC3
    statement: 'AC3: the node tick runs on the lab in observe mode beside the script and writes no merge, arm or rerun -- falsifier: uv run pytest tests/unit/nodes/node_pr_landing_orchestrator/test_observe_mode.py -q'
evidence_requirements:
- kind: tests
  description: The replay parity, observe mode, golden and error chain, reducer and overlay tests
