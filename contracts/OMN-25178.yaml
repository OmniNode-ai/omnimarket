schema_version: 1.0.0
ticket_id: OMN-25178
title: The onex tools a Codex lane calls over MCP
summary: A Codex lane runs codex exec in a sandbox with no Claude Code skill and no hook, so it could not call onex scm, the ledger write or the handoff check. This change adds node_codex_lane_mcp_server_effect, an MCP server on stdio that lists four tools (scm_pr_view, scm_pr_comment, ledger_status, pr_handoff_check) and runs each as one command pinned to the lane named in its environment. The remote-lane runner change that writes the lane's Codex config with an mcp_servers table pointing at this server and an AGENTS.md carrying the standing rules is a separate pull request in the plugin repository.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn25178-tools
  statement: The server lists exactly the four tools, each tool is one command with no shell, and the lane, ticket, ledger and plugin root come from the server's environment, never from the tool's arguments.
  acceptance:
  - id: AC1
    statement: 'AC1: the MCP server exposes at least onex scm pr-view, onex scm pr-comment, the ledger STATUS write and the pr-handoff check as tools -- falsifier: `uv run pytest tests/unit/nodes/node_codex_lane_mcp_server_effect -q` shows a listed tool absent from the tool list'
  - id: AC2
    statement: 'AC2: a test that asserts the tool list and each tool command fails on the unfixed tree (red) and passes on the fix (green) -- falsifier: the same command run at the base commit passes'
  - id: AC3
    statement: 'AC3: one Codex lane on a lab host calls pr-view, pr-comment, the pr-handoff check and the ledger STATUS write as MCP tools and a STATUS row written through the tool is read in the ledger -- falsifier: the lane brief grep shows no STATUS row written by the tool call, or the lane codex JSON stream shows no MCP tool call'
  - id: AC4
    statement: 'AC4: the change adds no skip, xfail, removed assertion or --no-verify -- falsifier: `git diff origin/dev...HEAD` shows a removed assert, a new skip or xfail marker or a --no-verify flag'
evidence_requirements:
- kind: tests
  description: The node's tests pass at the pushed head.
  command: uv run pytest tests/unit/nodes/node_codex_lane_mcp_server_effect -q -n 0 --no-cov -p no:cacheprovider
emergency_bypass:
