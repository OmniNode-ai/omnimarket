schema_version: 1.0.0
ticket_id: OMN-23304
title: The lab alarm broker lag read keeps reporting when the overlay has no effects-held block
summary: The effects-held condition made its overlay block a required key, so every scheduled broker lag run on the Mac was refused and floor row lab:broker_lag went stale. The block is now read by the effects-held verbs alone.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23304-broker-lag-reports
  statement: An overlay without an effects_held block loads, the broker-lag verb runs to a typed outcome, and the effects-held verbs refuse the missing block by name; every other overlay key stays required.
  acceptance:
  - id: AC1
    statement: 'AC1: the broker-lag verb runs to a typed outcome on an overlay with no effects_held block and the effects-held verbs refuse it by name -- falsifier: uv run pytest tests/nodes/node_lab_alarm -q -k effects_held, failing on the unfixed overlay model'
  - id: AC2
    statement: 'AC2: after the branch is installed on the Mac the broker-lag unit exits without a LAB-ALARM-REFUSED line and the floor row lab:broker_lag reads a run inside its 15 minute limit -- falsifier: the served floor still lists a stale lab:broker_lag cause'
evidence_requirements:
- kind: tests
  description: The lab alarm node tests, the new overlay-without-effects-held tests included, pass
  command: uv run --frozen pytest tests/nodes/node_lab_alarm -q --no-cov -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23304-overlay-without-effects-held
  description: Runs the focused tests. An overlay without effects_held loads, the broker-lag verb returns its typed outcome instead of a refusal, both effects-held verbs refuse the missing block by name, and the failing control (every other key removed in turn) still refuses the load. The new file fails on the unfixed overlay model.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_lab_alarm/test_lab_alarm_overlay_without_effects_held.py -q --no-cov -p no:randomly
    cwd: .
- id: dod-omn23304-lab-alarm-regression
  description: The lab alarm node's golden and error chain event tests and the example overlay test still pass with effects_held optional. A regression check, not proof of a criterion.
  source: manual
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_lab_alarm -q --no-cov -p no:randomly
    cwd: .
- id: dod-omn23304-optional-block-declared
  description: Loads an overlay with no effects_held block through the overlay model from the branch; goes red on a branch whose effects_held is still a required key, because the load then refuses the overlay.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_lab_alarm/test_lab_alarm_overlay_without_effects_held.py -q --no-cov -p no:randomly -k golden_an_overlay_without_effects_held_loads
    cwd: .
- id: dod-omn23304-integration-proof
  description: On the Mac after the branch is installed, the broker-lag unit writes a run record line newer than the install. Hosted CI cannot reach the Mac, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: 'env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23304 --kind test -- uv run --frozen pytest tests/nodes/node_lab_alarm -q --no-cov -p no:randomly'
    cwd: .
  - check_type: command
    check_value: "test -s $OMNI_HOME/.onex_state/lab-alarm/broker-lag-runs.jsonl && ! tail -n 1 $OMNI_HOME/.onex_state/lab-alarm/lab-alarm.err.log | grep -q LAB-ALARM-REFUSED"
    cwd: .
