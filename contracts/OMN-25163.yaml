- id: dod-omn25163-deploy-schedule-node
  description: 'Deploy probe the hosted runner can run: the new node contract at the checked-out commit on GitHub names its handler class; the file does not exist at the merge base, so the probe fails there. AC3 is read on the dev runtime after the dev deploy through the deploy agent.'
  source: manual
