schema_version: 1.0.0
ticket_id: OMN-22133
title: The factory floor draws every task of a line's plan as a station with its own state and ticket, read from merged and typed evidence
summary: node_factory_floor_compute draws one station per task (contract config station_grouping task), the station carrying its task's state, tickets and wave label; tasks come from the plan's tasks.yaml, else its task headings read by the contract-declared heading patterns; a merged pull request sets its task's station through the existing merged-PR mapping.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn22133-station-per-task
  statement: 'Five of six plan lines on the published floor drew one station each (a 59-task plan read as one box) because stations were grouped by wave and a plan that declares no wave fell back to one station.'
  acceptance:
  - id: AC1
    statement: 'AC1: every task of a line''s plan is a station with its own state and tickets, for a tasks.yaml plan, a task-headings plan and a wave manifest -- falsifier: uv run pytest tests/nodes/node_factory_floor_compute/test_station_per_task.py -q'
  - id: AC2
    statement: 'AC2: stations come from the plan''s tasks.yaml (id, state, tickets) where it has one, else from its task headings; the heading rule is declared in the effect contract, not in a handler -- falsifier: uv run pytest tests/nodes/node_factory_floor_compute/test_station_per_task.py -k "heading_rule or recorded_done" -q'
  - id: AC3
    statement: 'AC3: one fixture per plan shape runs under the in-memory and the overlay profile, and each fails on the merge base -- falsifier: uv run pytest tests/nodes/node_factory_floor_compute/test_station_per_task.py -k every_task -q'
  - id: AC4
    statement: 'AC4: a merged pull request sets its task''s station through the existing merged-PR mapping, with no second mapping -- falsifier: uv run pytest tests/nodes/node_factory_floor_compute/test_station_per_task.py -k every_task -q'
  - id: AC5
    statement: 'AC5: the three floor node suites pass -- falsifier: uv run pytest src/omnimarket/nodes/node_factory_floor_compute src/omnimarket/nodes/node_factory_floor_effect src/omnimarket/nodes/node_factory_floor_publish_effect tests/nodes/node_factory_floor_compute tests/nodes/node_factory_floor_effect -q'
  - id: AC-a
    statement: 'AC-a: a merged task with a stale blocked TERMINAL reads merged -- falsifier: uv run pytest tests/nodes/node_factory_floor_compute -k stale_terminal_merged -q'
  - id: AC-b
    statement: 'AC-b: task rows and stations carry the ticket and PR from the task-to-ticket map STATUS row -- falsifier: uv run pytest tests/nodes/node_factory_floor_compute -k map_status_ticket_pr -q'
  - id: AC-c
    statement: 'AC-c: a text-only mention of a task id is not evidence -- falsifier: uv run pytest tests/nodes/node_factory_floor_compute -k text_mention_not_evidence -q'
  - id: AC-d
    statement: 'AC-d: a done item behind a failed gate shows "built ahead of gate" and is excluded from built percent -- falsifier: uv run pytest tests/nodes/node_factory_floor_compute -k built_ahead_of_gate -q'
  - id: AC-e
    statement: 'AC-e (merged and running): a real publish on the served floor after the install shows W0.1 to W0.5 as merged, and W1.2a, W1.2b, W1.2e not done -- falsifier: python3 reading the served record and printing the state of those eight tasks'
evidence_requirements:
- kind: tests
  description: The station-per-task tests and the three floor node suites.
  command: uv run pytest src/omnimarket/nodes/node_factory_floor_compute src/omnimarket/nodes/node_factory_floor_effect src/omnimarket/nodes/node_factory_floor_publish_effect tests/nodes/node_factory_floor_compute tests/nodes/node_factory_floor_effect -q --no-cov --tb=line
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn22133-ac1
  description: AC1 each plan shape draws one station per task with the task's state and tickets.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_factory_floor_compute/test_station_per_task.py -q --no-cov --tb=line
    cwd: .
- id: dod-omn22133-ac2
  description: AC2 a recorded done in tasks.yaml is not built without a merged pull request, and the headings plan reads no task without the contract's heading pattern.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_factory_floor_compute/test_station_per_task.py -k "heading_rule or recorded_done" -q --no-cov --tb=line
    cwd: .
- id: dod-omn22133-ac3
  description: AC3 the three plan-shape fixtures under the in-memory and the overlay profile.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_factory_floor_compute/test_station_per_task.py -k every_task -q --no-cov --tb=line
    cwd: .
- id: dod-omn22133-ac4
  description: AC4 the merged pull request of each fixture reaches only its own task's station, through floor_merged_mapping.
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_factory_floor_compute/test_station_per_task.py -k every_task -q --no-cov --tb=line
    cwd: .
- id: dod-omn22133-ac5
  description: AC5 the three floor node suites pass; hosted CI at the exact head is the evidence for this cloud-placed lane.
  source: manual
  binds_ac:
  - AC5
  checks:
  - check_type: test_passes
    check_value: uv run pytest src/omnimarket/nodes/node_factory_floor_compute src/omnimarket/nodes/node_factory_floor_effect src/omnimarket/nodes/node_factory_floor_publish_effect tests/nodes/node_factory_floor_compute tests/nodes/node_factory_floor_effect -q --no-cov --tb=line
    cwd: .
- id: dod-omn22133-ac-a
  description: AC-a a merged task (watcher merge or the map's merged outcome) reads merged although a stale blocked or partial TERMINAL is bound to it, in memory and through the overlay.
  source: manual
  binds_ac:
  - AC-a
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_factory_floor_compute -k stale_terminal_merged -q --no-cov --tb=line
    cwd: .
- id: dod-omn22133-ac-b
  description: AC-b the task-to-ticket map STATUS row's ticket and pull request are on the task's row and its station, in memory and through the overlay.
  source: manual
  binds_ac:
  - AC-b
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_factory_floor_compute -k map_status_ticket_pr -q --no-cov --tb=line
    cwd: .
- id: dod-omn22133-ac-c
  description: AC-c a TERMINAL that names a task id only in its text is not that task's evidence, in memory and through the overlay.
  source: manual
  binds_ac:
  - AC-c
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_factory_floor_compute -k text_mention_not_evidence -q --no-cov --tb=line
    cwd: .
- id: dod-omn22133-ac-d
  description: AC-d a built task behind a gate that reads fail carries the contract's built-ahead-of-gate label and is left out of the built percent, in memory and through the overlay.
  source: manual
  binds_ac:
  - AC-d
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_factory_floor_compute -k built_ahead_of_gate -q --no-cov --tb=line
    cwd: .
- id: dod-omn22133-ac-e
  description: AC-e the published floor record, after the publisher runs the merged revision, shows W0.1 to W0.5 merged and W1.2a, W1.2b and W1.2e not done. Read from the served record on the lab, so only the local Done gate runs it.
  source: manual
  binds_ac:
  - AC-e
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: "python3 -c 'import json,os,sys,urllib.request; d=json.load(urllib.request.urlopen(os.environ[\"FACTORY_FLOOR_URL\"].rstrip(\"/\")+\"/factory-floor.json\")); s={i[\"id\"]:i for l in d[\"lines\"] if \"orchestration-alignment\" in l[\"line_id\"] for st in l[\"stations\"] for i in st[\"items\"]}; w=[\"W0.1\",\"W0.2\",\"W0.3\",\"W0.4\",\"W0.5\"]; n=[\"W1.2a\",\"W1.2b\",\"W1.2e\"]; [print(t, s[t][\"state\"], s[t][\"note\"]) for t in w+n]; sys.exit(0 if all(s[t][\"state\"]==\"done\" for t in w) and all(s[t][\"state\"]!=\"done\" for t in n) else 1)'"
    cwd: .
- id: dod-omn22133-truth-deploy-probe
  description: Deploy probe. The floor handler GitHub serves at the checked-out commit defines _with_task_map, the task-to-ticket map join this change adds; the probe reads it from GitHub at that commit and exits nonzero on a tree without it, so it fails at the merge base.
  source: manual
  checks:
  - check_type: command
    check_value: "gh api \"repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_factory_floor_compute/handlers/handler_factory_floor.py?ref=$(git rev-parse HEAD)\" --jq .content | base64 -d | grep -c '^def _with_task_map('"
- id: dod-omn22133-integration-proof
  description: The pushed head ran the floor node suites on a lab host with its real dependencies and exited 0. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: "uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha \"$(git rev-parse HEAD)\" --lane floor-truth-integration-proof-1102 -- uv run --frozen pytest src/omnimarket/nodes/node_factory_floor_compute src/omnimarket/nodes/node_factory_floor_effect src/omnimarket/nodes/node_factory_floor_publish_effect tests/nodes/node_factory_floor_compute tests/nodes/node_factory_floor_effect tests/nodes/node_factory_floor_publish_effect -q --no-cov"
    cwd: .
