schema_version: 1.0.0
ticket_id: OMN-23302
title: The lab-fill launchd driver runs node_lab_fill_effect's send step, and laneTask is deleted from lab-fill.js in a delete-only change
summary: node_lab_fill_effect gains a shell entry (python -m omnimarket.nodes.node_lab_fill_effect) that runs send_lab_fill_lane for one planned lane from a JSON request on stdin, so the launchd-run lab-fill driver can call the node's send step. The entry is the omnimarket half of AC1; the driver switch and the Mac install read-back are internal-repository work. AC2 (lab-fill.js holds no laneTask) holds on the internal repository main already, is not changed by this pull request, and is verified there, not here.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn23302-driver-sends-through-node
    statement: The lab-fill driver sends lanes through the node's send step.
    acceptance:
      - id: AC1
        statement: 'AC1: the Mac''s lab-fill launchd unit sends lanes through node_lab_fill_effect''s send_lab_fill_lane, and a fill tick after install sends no lane for a ticket whose implementation merged -- falsifier: the lab-fill tick log after install names the node''s send step, and its sent list holds no ticket with a merged implementation'
evidence_requirements:
  - kind: tests
    description: The send entry tests and the send tests run at the pushed head.
    command: uv run pytest tests/nodes/node_lab_fill_effect/test_lab_fill_send_cli.py tests/nodes/node_lab_fill_effect/test_lab_fill_send.py -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn23302-ac1
    description: AC1 node half only; drives the send entry with the request as JSON text over the send fakes and reads the launched lane, the stderr line that names the send step, and that a ticket with a merged implementation sends no lane. The Mac launchd switch and the tick-log read after install are not met by this pull request.
    source: manual
    binds_ac:
      - AC1
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/nodes/node_lab_fill_effect/test_lab_fill_send_cli.py -q --no-cov --tb=line
        cwd: .
      - check_type: command
        check_value: |
          gh api "repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_lab_fill_effect/__main__.py?ref=8d92f5b791180052ed2d315372eb052daffd826a" --jq .content | base64 -d | grep -q 'lab-fill send: step={_STEP}'
        cwd: .
  - id: dod-omn23302-send-entry-integration-proof
    description: The pushed head ran the lab-fill send entry tests and the send tests on a lab host through the lab work runner and exited 0. Hosted CI cannot reach the lab, so only the local Done gate runs this check.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: 'uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23302 -- uv run --frozen pytest tests/nodes/node_lab_fill_effect/test_lab_fill_send_cli.py tests/nodes/node_lab_fill_effect/test_lab_fill_send.py -q --no-cov'
        cwd: .
