schema_version: 1.0.0
ticket_id: OMN-24360
title: Move the running-vs-merged alarm's remaining behaviour into omnimarket and fix its plugin repair line
summary: The running-vs-merged alarm decision in omnimarket lacked the declared-hold, acknowledgement, serve-checkout, plugin-behind and dev-lane branch-install behaviour of the frozen copy, and the frozen copy's plugin-behind repair line ended with a --lane flag the adopt tool's install-tree command refuses. omnimarket's handler and models now carry every behaviour of the frozen decision (held surfaces, typed acknowledgements, serve-checkout and launchd-lib fixes, the dev deploy agent's branch-install readback, the corrected plugin-behind line with the host's own OMNI_HOME), proven by a recorded parity table of 32 cases taken from the frozen handler's own answers. The switch of the tick from the frozen command to this node and the deletion of the frozen copy follow in their own steps.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24360-parity
  statement: The running-vs-merged decision in omnimarket answers as the frozen decision answered on every recorded case, differing only in the texts the parity table names, and its plugin-behind repair line uses only flags the install-tree command accepts.
  acceptance:
  - id: AC1
    statement: 'AC1: omnimarket''s running-vs-merged alarm gives the frozen handler''s answer for every case in a recorded parity table, differing only where the table names the difference -- falsifier: pytest tests/nodes/node_silent_failure_alarm_compute/test_running_vs_merged_parity_frozen.py -q'
  - id: AC2
    statement: 'AC2: the plugin-behind repair line uses only flags the install-tree command accepts and carries the host''s own OMNI_HOME -- falsifier: pytest tests/nodes/node_silent_failure_alarm_compute/test_running_vs_merged_fix_line.py -q'
  - id: AC3
    statement: 'AC3: integrated: the omnimarket alarm run on h101 against the live fleet fold prints the corrected repair line for a plugin-behind item -- falsifier: the run''s receipt on h101 shows the line without by-hand'
evidence_requirements:
- kind: tests
  description: The parity table and the fix-line seam test pass at the pushed head, with the existing running-vs-merged tests.
  command: uv run pytest tests/nodes/node_silent_failure_alarm_compute -q -n 0 --no-cov -p no:cacheprovider
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24360-ac1
  description: 'AC1: 32 recorded cases (every state, held, acknowledged, branch-install readbacks) decide equal to the frozen handler, with the three named differences each used by a recorded case, and a forged answer is caught.'
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_silent_failure_alarm_compute/test_running_vs_merged_parity_frozen.py -q -n 0 --no-cov -p no:cacheprovider
    cwd: .
- id: dod-omn24360-ac2
  description: 'AC2: the line carries only --branch and --with-installed after install-tree, the host''s declared OMNI_HOME or its own, and the frozen line is refused by the same flag check.'
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_silent_failure_alarm_compute/test_running_vs_merged_fix_line.py -q -n 0 --no-cov -p no:cacheprovider
    cwd: .
- id: dod-omn24360-ac3
  description: 'hosted proxy for AC3: the tests above pass; the run on h101 against its live fold is read on h101 and named in the pull request.'
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_silent_failure_alarm_compute -q -n 0 --no-cov -p no:cacheprovider
    cwd: .
- id: dod-omn24360-integration-proof
  description: the parity table, the fix-line seam test and the running-vs-merged tests run on a lab host at the pushed head; hosted CI cannot reach the lab, so only the local Done gate runs this unbound check
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24360 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_silent_failure_alarm_compute -q --no-cov
