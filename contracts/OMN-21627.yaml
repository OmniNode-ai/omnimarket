schema_version: 1.0.0
ticket_id: OMN-21627
title: 'node_contract_seams_orchestrator and node_contract_seams_reducer: contracts and seams first for a design'
summary: >
  The node-backed form of the lean_contract_seams bootstrap skill (omniclaude#3056). The orchestrator walks its
  contract's execution graph over one design (emit contracts, scaffold through node_generate_node_effect, read the
  seam graph, match every crossing, walk the declared state machines and drive the chain on the bus, gate the
  chains, sweep the golden chain, confirm connected) and folds every step into node_contract_seams_reducer, which
  owns the run's state machine. node_generate_node_effect takes an optional contract_yaml so the scaffold keeps the
  contract written first.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn21627-orchestrator
  statement: An orchestrator with a reducer runs contracts and seams first for a design and refuses a design whose seams do not match.
  acceptance:
  - id: AC1
    statement: 'AC1: The reducer FSM carries the run states drafted, contracts_written, scaffolded, seams_matched, chains_generated,
      golden_chain_passed, connected, refused and failed; it passes analyze_fsm and core''s contract walker finds one golden
      path whose triggers equal the orchestrator graph''s triggers in order, with no dead, unreachable or uncovered state
      -- falsifier: test_contract_seams_fsm.py and test_reducer_fsm_walks_one_golden_path_in_graph_order'
  - id: AC2
    statement: 'AC2: A planted design whose consumer declares a different envelope model is refused at match_seams, naming
      the crossing and the field envelope_model, and nothing after the seam runs -- falsifier: test_planted_mismatched_seam_refuses_at_match_seams'
  - id: AC3
    statement: 'AC3: A two-node toy design runs to connected on the in-memory overlay, both through the handler with an injected
      in-memory bus and through core''s RuntimeLocal reading the orchestrator contract, and the head event reaches the tail
      through the scaffolded contracts only -- falsifier: test_toy_design_connects_on_the_in_memory_overlay and test_core_local_runtime_runs_the_toy_design_from_the_contract'
  - id: AC4
    statement: 'AC4: The scaffold keeps a contract written before it; without one it writes the template -- falsifier: the
      two contract_yaml cases in tests/test_node_generate_node_effect.py'
  - id: AC5
    statement: 'AC5: uv.lock pins virtualenv 21.7.12 or later, which Dependency Security Scan needs to report no virtualenv vulnerability (SFTY-20260930-16258 and SFTY-20260930-15304), and only virtualenv and its python-discovery dependency move -- falsifier: test_virtualenv_lock_floor_clears_the_crlf_and_seed_integrity_advisories in tests/ci/test_omn21627_virtualenv_lock_floor.py fails against a lock that pins virtualenv 21.7.9'
evidence_requirements:
