---
schema_version: "1.0.0"
ticket_id: "OMN-20806"
title: "Automation-liveness watchdog compute: verdicts, failure episodes with window severity, hysteresis, observer-loss folding and the planted self-test"
summary: "node_automation_liveness_watchdog_compute is the watchdog's pure half. Given the liveness overlay, one folded fact record per declared process (mapped from the liveness projection's fold rows by a typed adapter), the host observers' heartbeats, the bus facts, the open trigger expectations, the undeclared processes, the carried watchdog state and the evaluation time, it returns one verdict per process, the verdict events for changed verdicts, the alarm episodes opened, raised in severity and cleared, and the state for the next evaluation. A planted contract that evaluates wrong voids the evaluation; a silent host observer folds its host's MISSED verdicts into one HOST_SILENT; the external dead-man is EXTERNAL_DEADMAN_SILENT after two hours with no completed run. The effect half (state store, outbox, delivery, ledger record, external mirror) is a separate node."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-watchdog-compute"
    statement: "The watchdog compute returns verdicts, failure episodes with window severity, hysteresis-bound episodes, observer-loss folding, the planted self-test and the external dead-man verdict from typed inputs, with no I/O."
    acceptance:
      - id: "AC1"
        statement: "AC1: each of the 2026-10-09 silent failures, replayed, raises its verdict with a delivery due time inside its deadline (verdict half) -- falsifier: uv run pytest tests/nodes/node_automation_liveness_watchdog_compute/test_watchdog_replays_2026_10_09.py -q -p no:randomly"
      - id: "AC2"
        statement: "AC2: a single failed run opens a recorded episode at once, and alternating failed and successful runs raise a posted FAILED -- falsifier: uv run pytest tests/nodes/node_automation_liveness_watchdog_compute/test_watchdog_failed_run_episodes.py -q -p no:randomly"
      - id: "AC3"
        statement: "AC3: a planted self-test contract that evaluates wrong voids the evaluation and raises at once -- falsifier: uv run pytest tests/nodes/node_automation_liveness_watchdog_compute/test_watchdog_selftest_void.py -q -p no:randomly"
      - id: "AC4"
        statement: "AC4: an observer going silent sends one HOST_SILENT, a host with a live observer and many failing processes keeps per-process verdicts, and flapping inside the hysteresis sends nothing -- falsifier: uv run pytest tests/nodes/node_automation_liveness_watchdog_compute/test_watchdog_folding_and_hysteresis.py -q -p no:randomly"
      - id: "AC5"
        statement: "AC5: no completed external dead-man run for 2 hours raises EXTERNAL_DEADMAN_SILENT -- falsifier: uv run pytest tests/nodes/node_automation_liveness_watchdog_compute/test_watchdog_external_deadman_silent.py -q -p no:randomly"
