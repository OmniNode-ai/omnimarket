schema_version: 1.0.0
ticket_id: OMN-24015
title: Required-and-absent topic reading for the development broker
summary: A topic a contract needs but the broker does not have is met first as a 30 second wait that names no cause. The new compute node node_topic_required_absent_compute compares the required topics (from the contract topic reader) with the broker's live topic list and names each absent topic with who requires it; a list that was not read or is below the overlay minimum reads UNKNOWN, never WORKING.
is_seam_ticket: true
interface_change: true
interfaces_touched:
- topics
requirements:
- id: req-omn24015-required-absent
  statement: A required topic that the broker does not have is named by a reading, and a failed read of the broker's topic list never reads as WORKING.
  acceptance:
  - id: AC1
    statement: "AC1: given the required topics and a live listing, the node names each absent topic with who requires it, reads WORKING when none is absent, and reads UNKNOWN when the listing was not read or is smaller than the overlay minimum -- falsifier: uv run pytest tests/nodes/node_topic_required_absent_compute -q fails when an absent topic is reported as WORKING"
  - id: AC2
    statement: "AC2: the required list built from the contract topic reader's report names exactly the command topic missing from a live listing -- falsifier: the seam test in the same file fails when either side changes shape"
  - id: AC3
    statement: "AC3: integrated: on the development runtime after the rebuild the reading runs on the real contracts and the live topic list and names the absent required topics, or reads UNKNOWN naming the unread broker list -- falsifier: no reading row exists for the running image revision"
evidence_requirements:
- kind: tests
  description: The node's tests pass at the pushed head.
  command: uv run pytest tests/nodes/node_topic_required_absent_compute -q -p no:randomly --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24015-ac1
  description: 'AC1: the node tests pass at the head; returning WORKING for an absent topic turned three tests red.'
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_topic_required_absent_compute -q -p no:randomly --no-cov -k "deleted or two_contracts or unknown or below"
    cwd: .
- id: dod-omn24015-ac2
  description: 'AC2: the seam test with the contract topic reader passes at the head.'
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_topic_required_absent_compute -q -p no:randomly --no-cov -k seam
    cwd: .
- id: dod-omn24015-ac3
  description: 'hosted proxy for AC3: the tests pass here; the reading on the development runtime after its rebuild is posted as a pull request comment naming the head.'
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_topic_required_absent_compute -q -p no:randomly --no-cov
    cwd: .
- id: dod-omn24015-integration-proof
  description: the node tests run on a lab host at the pushed head; hosted CI cannot reach the lab, so only the local Done gate runs this unbound check
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24015 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_topic_required_absent_compute -q --no-cov -p no:randomly
