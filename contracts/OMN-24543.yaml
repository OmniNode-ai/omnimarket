schema_version: 1.0.0
ticket_id: OMN-24543
title: Aged lane receipts and run folders are removed only once the ledger shows the lane finished
summary: The orchestrating Mac holds about 130 GiB of our own state with no step that ages it (lab-run runs 35 GiB, remote-lane receipts 10 GiB, more than 5,000 receipt folders older than a week). This adds a TERMINAL guard to the lane_results classes of node_host_retention_effect, so a receipt or run folder goes only when it is older than its keep window and its lane has a TERMINAL on the ledger (and no later CLAIM). The TERMINAL is read by running the ledger rows loader the overlay names, so the node opens no ledger file, and a ledger that cannot be read removes nothing. A launchd unit template runs the pass on the Mac, and the Mac's row and the reader name are overlay values.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24543-terminal-guard
  statement: A lane_results entry is removed only when it is older than its keep window and its lane has a TERMINAL on the ledger, read through the ledger rows loader.
  acceptance:
  - id: AC1
    statement: "AC1: a dry run lists every receipt or run folder older than 7 days whose lane has a ledger TERMINAL at least the declared days old, with its bytes, and removes nothing, and a real run removes exactly that list -- falsifier: uv run pytest tests/nodes/node_host_retention_effect/test_host_retention_terminal.py -k 'dry_run or execute' -q fails at the merge base"
  - id: AC2
    statement: "AC2: a folder whose lane has no TERMINAL, whose TERMINAL is younger than the window, whose name names no lane, or when the ledger cannot be read, is never removed -- falsifier: uv run pytest tests/nodes/node_host_retention_effect/test_host_retention_terminal.py -k kept -q fails at the merge base"
  - id: AC3
    statement: "AC3: the loader's own printed rows are what the retention step reads as closed lanes, the example overlay stays inside the contract bounds, and the Mac timer runs this node's command line -- falsifier: uv run pytest tests/nodes/node_host_retention_effect/test_host_retention_seams.py -k 'ledger_seam or overlay_seam or unit_seam' -q fails at the merge base"
  - id: AC4
    statement: "AC4: integrated: the retention unit run on the Mac lists removed bytes and the remote-lane receipt folder count falls from 12,896, read back with the time -- falsifier: the Mac run's JSON shows removed bytes above zero and a later count of the receipt folders below 12,896"
evidence_requirements:
- kind: tests
  description: The node tests pass at the pushed head.
  command: uv run pytest tests/nodes/node_host_retention_effect -q -p no:randomly --no-cov
emergency_bypass:
