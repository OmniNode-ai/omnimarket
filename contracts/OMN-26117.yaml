schema_version: 1.0.0
ticket_id: OMN-26117
title: The M4 beta board check C11 (probe c11-negative-paths) reads green against what exists now, or its real product defect is named with a ticket
summary: The C11 probe read red at its credential-fetch step because the store name STABILITY_TEST_CHAIN_CANARY_GATEWAY_API_KEY held no secret at dev/shared/env/ (HTTP 404; runs 45340216110 and 45346783411). One dev-scoped key for the house tenant of the dev-201 lane was minted and stored there, and dispatched run 45351153694 read green with wrong_tenant 404 and malformed 422. The fix is store only, so no probe clause is removed or changed and nothing retired is restored.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn26117-c11-cause
  statement: The cause of the C11 red is named from the newest completed run's failure text, with the run id and the failure line.
  acceptance:
  - id: AC1
    statement: "AC1: the cause of the red is named from the probe's newest failure text, with the run id and the failure lines read -- falsifier: the lane report names a cause with no run id or no quoted failure line"
- id: req-omn26117-c11-green
  statement: The C11 probe's next run reads green against what exists now.
  acceptance:
  - id: AC2
    statement: "AC2: the probe's next run reads green against what exists now, with no retired thing restored and no clause removed unless a ruling retired the fact it graded -- falsifier: the newest c11-negative-paths run reads red, or the clause table in the report lists a removed assertion that no ruling retires"
- id: req-omn26117-c11-status-row
  statement: The lane writes one STATUS row for C11 with its verdict and read time.
  acceptance:
  - id: AC3
    statement: "AC3: the lane writes one STATUS row `crit=C11 probe=c11-negative-paths verdict=<green|red> read_at=<UTC>` -- falsifier: a ledger grep for `crit=C11 probe=c11-negative-paths` finds no STATUS row after this ticket's creation"
evidence_requirements:
- kind: manual
  description: The failed credential-fetch line of the newest completed C11 run read back from the job log.
  command: onex scm job-log OmniNode-ai/omnibase_infra --job-id 138261791367
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn26117-c11-cause-line
  description: The job log of run 45340216110 (job 138261791367) holds the line naming CHAIN_CANARY_GATEWAY_API_KEY as not readable from dev/shared/env/ with HTTP 404 (the store name behind it is STABILITY_TEST_CHAIN_CANARY_GATEWAY_API_KEY, which held no secret). Read through the watcher-backed job-log verb, so only the local Done gate runs it.
  source: manual
  execution_scope: local_done_gate
  binds_ac:
  - AC1
  checks:
  - check_type: command
    check_value: sh -c 'onex scm job-log OmniNode-ai/omnibase_infra --job-id 138261791367 | grep -F "is not readable from dev/shared/env/ (HTTP 404)"'
    cwd: .
- id: dod-omn26117-c11-newest-run-green
  description: The newest scheduled run of chain-canary-c11-negative-paths.yml concluded success, and the dispatched run 45351153694 (job 138297640014, created 2026-11-24T07:50:50Z) logged C11 GREEN with the wrong_tenant 404 and malformed 422 arms after the key was stored where the fetch step reads it.
  source: manual
  execution_scope: local_done_gate
  binds_ac:
  - AC2
  checks:
  - check_type: command
    check_value: sh -c 'onex scm run-list OmniNode-ai/omnibase_infra --workflow chain-canary-c11-negative-paths.yml --limit 1 | grep -F "\"conclusion\":\"success\""'
    cwd: .
  - check_type: command
    check_value: sh -c 'onex scm job-log OmniNode-ai/omnibase_infra --job-id 138297640014 | grep -F "wrong_tenant      expected=404 observed=404"'
    cwd: .
  - check_type: command
    check_value: sh -c 'onex scm job-log OmniNode-ai/omnibase_infra --job-id 138297640014 | grep -F "malformed         expected=422 observed=422"'
    cwd: .
- id: dod-omn26117-c11-status-row
  description: The rolling ledger holds the STATUS row of the C11 green reading written by lane c11key-0815 for run 45351153694.
  source: manual
  execution_scope: local_done_gate
  binds_ac:
  - AC3
  checks:
  - check_type: command
    check_value: sh -c 'python3 "${OMNI_PLUGIN_ROOT:?}"/skills/lane-brief/scripts/lane_brief.py grep "crit=C11 probe=c11-negative-paths verdict=" | grep -F "lane=c11key-0815"'
    cwd: .
