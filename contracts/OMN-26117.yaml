schema_version: 1.0.0
ticket_id: OMN-26117
title: The M4 beta board check C11 (probe c11-negative-paths) reads green against what exists now, or its real product defect is named with a ticket
summary: The C11 delegation check reads the test tenant's credential from the secret store, by the name the dev tenant node declares, and sends only that key. A local gateway that accepts one key proves it - the key the store holds grades every clause PASS, a store holding another key fails the tenant arms, a store holding nothing is PRECONDITION-ABSENT. The earlier probe red was a missing store entry (run 45340216110); the entry was stored and run 45351153694 read green. No probe clause is removed or changed and nothing retired is restored.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn26117-c11-cause
  statement: The cause of the C11 red is named from the newest completed run's failure text, with the run id and the failure line.
  acceptance:
  - id: AC1
    statement: "AC1: the cause of the red is named from the probe's newest failure text, with the run id and the failure lines read -- falsifier: the lane report names a cause with no run id or no quoted failure line"
- id: req-omn26117-c11-green
  statement: The C11 probe's next run reads green against what exists now.
  acceptance:
  - id: AC2
    statement: "AC2: the probe's next run reads green against what exists now, with no retired thing restored and no clause removed unless a ruling retired the fact it graded -- falsifier: the newest c11-negative-paths run reads red, or the clause table in the report lists a removed assertion that no ruling retires"
- id: req-omn26117-c11-status-row
  statement: The lane writes one STATUS row for C11 with its verdict and read time.
  acceptance:
  - id: AC3
    statement: "AC3: the lane writes one STATUS row `crit=C11 probe=c11-negative-paths verdict=<green|red> read_at=<UTC>` -- falsifier: a ledger grep for `crit=C11 probe=c11-negative-paths` finds no STATUS row after this ticket's creation"
evidence_requirements:
- kind: tests
  description: The C11 credential-from-store tests, each failing against a credential path that ignores the store and passing on the real one.
  command: uv run pytest tests/nodes/node_delegation_check_probe_effect/test_c11_credential_from_store.py -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn26117-c11-cause
  description: The C11 credential reader raises PRECONDITION-ABSENT when the store holds nothing under the declared name, the state the red run 45340216110 hit (HTTP 404 from the store).
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_delegation_check_probe_effect/test_c11_credential_from_store.py -q --no-cov -n 0 -p no:randomly -k nothing
    cwd: .
- id: dod-omn26117-c11-reads-store
  description: With the store holding the gateway's key, C11 grades positive_control, wrong_key, absent_key, wrong_tenant and malformed all PASS, and the store was read once under the declared folder and name.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_delegation_check_probe_effect/test_c11_credential_from_store.py -q --no-cov -n 0 -p no:randomly -k known_good
    cwd: .
- id: dod-omn26117-c11-wrong-store-key
  description: A store holding another key fails wrong_tenant and malformed, so a green reading cannot come from any key but the stored one.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_delegation_check_probe_effect/test_c11_credential_from_store.py -q --no-cov -n 0 -p no:randomly -k another_key
    cwd: .
- id: dod-omn26117-c11-status-row
  description: The green reading the C11 STATUS row records (run 45351153694, lane c11key-0815) is the known-good arm, where the store holds the gateway's key and every clause grades PASS. The ledger row itself is read only by the local Done gate, so the hosted check binds the arm that produces that verdict.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_delegation_check_probe_effect/test_c11_credential_from_store.py -q --no-cov -n 0 -p no:randomly -k known_good
    cwd: .
- id: dod-omn26117-c11-close-all-arms
  description: Close-out reading at the head the C11 reading was taken from (newest scheduled run 45711516977 success, 29 of the 30 newest scheduled runs success). All four arms run together, the known good (the store's key grades every clause PASS), the store holding another key (wrong_tenant and malformed fail), the store holding nothing and the store not answering (both PRECONDITION-ABSENT), so a credential path that ignores the store, or crashes on an unreachable one, fails this item.
  source: manual
  binds_ac:
  - AC1
  - AC2
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_delegation_check_probe_effect/test_c11_credential_from_store.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn26117-c11-refused-store-not-measured
  description: A settings store that refuses the read (the dev broker's ONEX_CORE_025_PERMISSION_DENIED on the overlay-store topic) is recorded as overlay_unreadable and the tick exits with the unavailable code, never the failed-check code. The test failed against the merge base with the uncaught ModelOnexError and passes on the tick that catches it, so a missing dev grant is never graded as a product regression.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_delegation_check_probe_effect/test_tick_single_check.py -q --no-cov -n 0 -p no:randomly -k refuses_the_read
    cwd: .
- id: dod-omn26117-c11-integration-proof
  description: On a lab host, with the branch checked out at its pushed sha, the C11 credential tests run the real caller and the real tenant credential reader against a local gateway that accepts one key. The store's key grades every clause PASS; another key, a store holding nothing and a store that does not answer each fail as named. Hosted CI holds no lab host, so only the local Done gate runs this unbound check (the lab reading is in the PR's Lab comment).
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-26117-c11-credential --kind test -- uv run --frozen pytest tests/nodes/node_delegation_check_probe_effect/test_c11_credential_from_store.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn26117-probe-evidence-keeps-clause-detail
  description: The delegation check probe's evidence file records the detail of every failed clause beside its name. The 12:27Z scheduled C13 run (c13-20261127T122753Z-cd03e0ef) read FAIL on zero_provider and its evidence held only the clause name, so which branch of the clause failed was unreadable. The test fails on the merge base with a KeyError on failed_clause_details and passes with the change.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_delegation_check_probe_effect/test_tick_single_check.py -q --no-cov -n 0 -p no:randomly -k keeps_the_detail
    cwd: .
- id: dod-omn26117-c28-submit-timeout-reads-gateway
  description: A timeout or refusal on the dev gateway's workflow submit (POST /v1/workflows) reads cause_class gateway, a responder timeout stays lab-model, and the submit has its own cap read from the probe overlay (submit_timeout_s) apart from responder_timeout_s. The 15:13Z scheduled C28 run read lab-model for a gateway submit timeout while the local tier answered /v1/models in 7 ms. The tests fail on the merge base (cause_class lab-model, no submit cap) and pass with the change.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_delegation_check_probe_effect/test_gateway_checks.py tests/nodes/node_delegation_check_probe_effect/test_delegation_check_probe_node.py -q --no-cov -n 0 -p no:randomly -k "submit or responder_timeout"
    cwd: .
- id: dod-omn26117-pool-saturated-to-openrouter
  description: The delegation responder chain treats a local responder whose every advertised slot is processing as busy and not usable. Of two local endpoints the one with a free slot carries the task, and when every local endpoint is saturated or down the chain advances to OpenRouter. The slot count comes from the llama.cpp /slots reading the chain already takes, no new probe. The tests fail on the merge base (the reading has no slots field) and pass with the change.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/handlers/routing/test_delegation_check_responder_chain.py -q --no-cov -n 0 -p no:randomly -k "saturated or every_slot or free_slot or no_usable_local"
    cwd: .
