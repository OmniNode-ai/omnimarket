schema_version: 1.0.0
ticket_id: OMN-24007
title: Tenant savings totals never count experiment runs (readiness check R8)
summary: The tenant savings totals query counted every delegation_events row and summed every savings_estimates row of the tenant, so a synthetic run (stored with data_source experiment) was counted in the run, token, spend and savings totals that readiness scenario R8 requires it to stay out of. Both tenant read node contracts now declare config.uncounted_data_sources, the totals query binds that list and skips those runs, and the Runs list queries still list them.
is_seam_ticket: true
interface_change: true
interfaces_touched:
- public_api
requirements:
- id: req-omn24007-totals-skip-uncounted
  statement: The tenant totals skip every data source the node contracts list as uncounted, and the Runs list still shows those runs.
  acceptance:
  - id: AC1
    statement: 'AC1: The tenant savings totals query skips every data source the node contracts list as uncounted, and the Runs list queries stay unchanged -- falsifier: pytest tests/nodes/node_tenant_savings_read_effect/test_savings_totals_exclude_experiment.py -q, which fails when projection_reader.py and resolver_reader.py are restored to origin/dev'
- id: req-omn24007-contract-reaches-readers
  statement: The uncounted list in both tenant read node contracts reaches the bus handler reader and the HTTP app reader, and an empty list is refused.
  acceptance:
  - id: AC2
    statement: 'AC2: The uncounted list in both tenant read node contracts reaches the bus handler reader and the HTTP app reader, and an empty list is refused -- falsifier: pytest tests/nodes/node_tenant_savings_read_effect tests/nodes/node_tenant_delegations_read_effect -q'
- id: req-omn24007-real-postgres
  statement: On a real Postgres the changed query leaves the experiment run out of the totals and the base query does not.
  acceptance:
  - id: AC3
    statement: 'AC3: On a real Postgres 16 with one real run and one experiment run, the base query reads 2 runs and the changed query reads 1 run -- falsifier: the throwaway-database probe in the pull request, rerun with the base query, reads 2'
- id: req-omn24007-integrated
  statement: Readiness scenario R8 reads pass in the running dev runtime on a build holding this change.
  acceptance:
  - id: AC4
    statement: 'AC4: integrated: after the dev runtime rebuilds from a revision holding this change, the next scheduled run of readiness scenario R8 reads pass on the delegation tracker -- falsifier: R8 latest ledger STATUS row names a failed assertion or the tracker still reads R8 failing'
evidence_requirements:
- kind: tests
  description: The tenant read node tests and the new totals test pass at the pushed head.
  command: uv run --frozen pytest tests/nodes/node_tenant_savings_read_effect tests/nodes/node_tenant_delegations_read_effect -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24007-ac1
  description: The new test checks the totals query text for the uncounted-source predicates and the list queries for their absence; its control feeds it the base query text and the check fails; four of its five tests fail with the base reader files.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_tenant_savings_read_effect/test_savings_totals_exclude_experiment.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24007-ac2
  description: The seam test reads the contract value through reader_for_node for both nodes and holds it equal to the experiment data source constant; the reader refuses an empty list.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_tenant_savings_read_effect tests/nodes/node_tenant_delegations_read_effect -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24007-ac3
  description: The tests that stand behind the real-database reading pass at the head; the probe itself (a throwaway postgres:16-alpine container on h053 holding the two tables, base and changed query through psycopg2) is recorded in the pull request body.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_tenant_savings_read_effect/test_savings_totals_exclude_experiment.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24007-ac4
  description: The tests that stand behind the integrated reading pass at the head. The reading itself (the next scheduled R8 run after the dev runtime rebuilds) is taken after the merge.
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_tenant_savings_read_effect/test_savings_totals_exclude_experiment.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24007-integration-proof
  description: Run the new totals test and the tenant read node tests on a lab host at the pushed head. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check; it binds no criterion for the hosted check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24007 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_tenant_savings_read_effect tests/nodes/node_tenant_delegations_read_effect -q --no-cov -n 0 -p no:randomly
    cwd: .
