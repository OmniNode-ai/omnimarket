schema_version: 1.0.0
ticket_id: OMN-24256
title: Add a mint step for internal service broker logins
summary: A new effect node, node_service_principal_mint_effect, creates one broker SCRAM login for a named internal service from an overlay declaration, generates its password straight into the secret store create-only, and delivers a credential env file to the declared read-only folder on each declared host with the declared owner and mode. It never replaces an existing login's password and the password is in no result, log line or exception. The first declared login is ci-ledger-read, whose broker rows are already applied. The declaration lives in the overlays repository.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24256-service-login-mint
  statement: A service login declared in an overlay is created on the dev broker with a generated password held only in the secret store, and its credential file reaches the declared folders.
  acceptance:
  - id: AC1
    statement: 'AC1: a service login declared in an overlay is created on the dev broker with a generated password held only in the secret store, and a second run reports it already exists and changes nothing -- falsifier: pytest tests/nodes/node_service_principal_mint_effect/test_handler_service_principal_mint.py -q'
  - id: AC2
    statement: 'AC2: the login files reach the declared read-only folder on each declared host with the declared owner and mode and the password is in no output, log line or result -- falsifier: pytest tests/nodes/node_service_principal_mint_effect/test_service_principal_mint_chain.py -q'
  - id: AC3
    statement: 'AC3: integrated: a build runner on a lab host reads the work ledger query answer topic with the new login and gets no authorization error in the running runtime -- falsifier: on the runner host, onex ledger query with the mounted login prints an answer instead of TopicAuthorizationFailedError'
evidence_requirements:
- kind: tests
  description: The mint handler, chain and adapter tests pass at the pushed head; the control tests fail against a handler that skips the existence check and against a delivery that logs the content.
  command: uv run --frozen pytest tests/nodes/node_service_principal_mint_effect -q --no-cov -p no:cacheprovider
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24256-ac1
  description: 'AC1: the mint matrix: create, resume after a partial run, idempotent second run, a login with no stored password refused, a check-only run that changes nothing, and no password replacement of an existing login.'
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_service_principal_mint_effect/test_handler_service_principal_mint.py -q --no-cov -p no:cacheprovider
    cwd: .
- id: dod-omn24256-ac2
  description: 'AC2: golden and error chain tests: the delivered env file content, owner and mode; every refusal kind serializes with no password in the result, repr or log.'
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_service_principal_mint_effect/test_service_principal_mint_chain.py tests/nodes/node_service_principal_mint_effect/test_service_principal_mint_adapters.py -q --no-cov -p no:cacheprovider
    cwd: .
- id: dod-omn24256-ac3
  description: 'hosted proxy for AC3: the adapter seam tests (the broker script, the secret store requests and the real delivery script on a temporary folder) pass; the runner read on h202 is named in the pull request Lab line.'
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_service_principal_mint_effect/test_service_principal_mint_adapters.py -q --no-cov -p no:cacheprovider
    cwd: .
- id: dod-omn24256-integration-proof
  description: the mint, chain and adapter tests run on a lab host at the pushed head; hosted CI cannot reach the lab, so only the local Done gate runs this unbound check
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24256 --kind test -- env PYTHONDONTWRITEBYTECODE=1
      uv run --frozen pytest tests/nodes/node_service_principal_mint_effect -q --no-cov
