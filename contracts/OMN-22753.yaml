schema_version: 1.0.0
ticket_id: OMN-22753
title: The sibling pin hook revs node applies its plan to a pre-commit config and answers the train's command line
summary: node_sibling_pin_hook_revs_compute gains an apply operation that moves the planned hook blocks of the pin's repository in a pre-commit config text, and a command line that prints the plan and writes the config with --apply, so the sibling-pin train calls it and omniclaude's relock script does not grow.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn22753-apply-and-cli
  statement: The train's hook rev rewrite is the node's apply operation and command line, with tests that fail on the train as it ran on 2026-11-06 and on a planner whose strictly-newer rule is injected as at-or-newer.
  acceptance:
  - id: AC1
    statement: 'AC1: given a pre-commit config text, the pin repository url, the pin tag and newer dev tags with a green flag, the apply operation returns the plan and the config text with the planned hook blocks moved to the plan hook tag and every other line unchanged -- falsifier: uv run --frozen pytest tests/nodes/node_sibling_pin_hook_revs_compute -q --no-cov'
  - id: AC2
    statement: 'AC2: with the planner strictly-newer rule injected as at-or-newer, the apply tests fail, so the rule is read by them -- falsifier: uv run --frozen pytest tests/nodes/node_sibling_pin_hook_revs_compute -q --no-cov with the rule patched exits non-zero'
  - id: AC3
    statement: 'AC3: the command line prints the plan, writes the config only with --apply, and a config with no block of the repository plans the pin alone and is left untouched -- falsifier: uv run --frozen pytest tests/nodes/node_sibling_pin_hook_revs_compute -k cli -q --no-cov'
evidence_requirements:
- kind: tests
  description: The hook revs node tests pass
  command: uv run --frozen pytest tests/nodes/node_sibling_pin_hook_revs_compute -q --no-cov
