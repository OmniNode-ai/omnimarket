schema_version: 1.0.0
ticket_id: OMN-24767
title: The Wire Compatibility Gate exits 0 on the quota rule offset of the GLM quota gate pull request, the provider rung canary reads the Beijing stamp, and the pull request body names the final head
summary: Fixes the third review of the GLM quota gate pull request. The Beijing-time offset of the zai reset stamp rides in the reset_from value message_reset_timestamp_beijing instead of a new key on ModelQuotaCodeRule, so the omniclaude pin dev-20261112062638-179aa1280722 that tests/fixtures/delegation/quota_rule_legacy_schema.json stands for decodes every rule, and the wrap serializer is removed. The provider rung canary tests read the zai 1310 stamp as Beijing time. The runner prints its JSON line for any failure of the policy loader. The gate reads each refusal's stamp from that refusal and holds until the latest hold.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24767-gate-third-review
  statement: The quota code rule carries no key the pinned consumer refuses, the canary tests read the Beijing stamp, the runner fails open on any policy loader failure, and the gate reads each refusal's own stamp.
  acceptance:
  - id: AC1
    statement: 'AC1: the Wire Compatibility Gate exits 0 at the new head with the Beijing offset carried by no new key on a wire model, the serializer on the quota code rule removed, and the consumer pin the legacy fixture stands for named in the change -- falsifier: the strict gate job command of .github/workflows/ci.yml run on the lab in the omnimarket worktree exits non-zero'
  - id: AC2
    statement: 'AC2: the four failing tests of the provider rung canary node pass with their expectations and the now value moved to the Beijing reading, and every directory of tests/ is run on the lab at the final head in named parts with each exit code read -- falsifier: uv run pytest tests/nodes/node_provider_rung_canary_effect -q exits non-zero'
  - id: AC3
    statement: 'AC3: the pull request body is rewritten for the final head and names OMN-24651, OMN-24676 and OMN-24722 -- falsifier: onex scm pr-view of omnimarket#6311 shows a body that does not name all three tickets'
  - id: AC4
    statement: 'AC4: an AttributeError from the policy loader in the quota gate runner prints its JSON line and exits as the fail-open docstring says, with a test red then green -- falsifier: uv run pytest on the named runner test file in omnimarket exits non-zero on that case'
  - id: AC5
    statement: 'AC5: the gate reads the reset stamp from the matched refusal, so a stampless 1308 followed by a 1310 holds until the 1310 stamp, with a test red then green -- falsifier: uv run pytest on the named gate test file in omnimarket exits non-zero on that case'
  - id: AC6
    statement: 'AC6: the recorded 1308 and 1316 texts are named as built texts and contracts/OMN-24651.yaml names the codes 1308, 1310 and 1316 to 1321, and the new head is commented on the pull request -- falsifier: uv run pytest of the contract test in omnimarket exits non-zero, and onex scm pr-view of omnimarket#6311 shows no comment naming the new head'
