schema_version: 1.0.0
ticket_id: OMN-23135
title: The floor's first page opens with the rebuild, and each piece tile keeps its state colour with the current piece outlined and a legend
summary: >-
  page/simple.html of node_factory_floor_publish_effect draws the rebuild section (piece strip, legend, headline line) as
  the first section of the page, above the holdups. Each tile draws its own state colour; the current piece carries an
  outline (a 3px ink border with a white inner ring) and aria-current, never a colour of its own. A one-line legend under
  the strip names green, amber, red, grey and the outline. The page script also declared const num twice at the top level
  (from OMN-23081), a SyntaxError that stops the whole script in a browser; the second is renamed.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23135-rebuild-first
  statement: The floor's first page opens with the rebuild, each tile keeps its state colour, the current piece is outlined, and a legend names the colours and the outline.
  acceptance:
  - id: AC1
    statement: 'AC1: the rebuild section (piece strip, headline and readiness line) is the first section of the first page, above the holdups -- falsifier: render the page and read the order of its h2 sections'
  - id: AC2
    statement: 'AC2: every piece tile draws its own state colour; the current piece is marked by an outline or border, never by replacing the colour, and a one-line legend under the strip names each colour and the outline -- falsifier: render with current_piece 2 drawing amber and read tile 2''s background and border'
evidence_requirements:
- kind: tests
  description: The render tests of the main page, run under node against a served record whose current piece is 2 and draws pieces 2 and 3 amber.
  command: uv run --frozen pytest src/omnimarket/nodes/node_factory_floor_publish_effect/tests -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23135-ac1-order
  description: >-
    The page's own script is run under node against the served record; the first h2 drawn is The rebuild, it comes before
    What's holding things up, and the first section element is the rebuild section holding the strip, the headline and the
    next line. The named break (the rebuild block placed after the holdups heading) reads the other way.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest src/omnimarket/nodes/node_factory_floor_publish_effect/tests/test_simple_page_rebuild_first.py -q --no-cov
    cwd: .
- id: dod-omn23135-ac2-tiles
  description: >-
    With current_piece 2 and pieces 2 and 3 drawn amber, tile 2 resolves from the page's own style sheet to the amber
    background and a solid border, tile 3 to the same amber with no border, no tile resolves to the blue of the old rule,
    and the legend under the strip names green, amber, red, grey and the outline. The named breaks (the old blue rule, the
    legend line removed) read blue and no legend.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest src/omnimarket/nodes/node_factory_floor_publish_effect/tests/test_simple_page_rebuild_first.py src/omnimarket/nodes/node_factory_floor_publish_effect/tests/test_simple_page_health_line.py src/omnimarket/nodes/node_factory_floor_publish_effect/tests/test_simple_page_machines.py src/omnimarket/nodes/node_factory_floor_publish_effect/tests/test_favicon.py -q --no-cov
    cwd: .
- id: dod-omn23135-integration-proof
  description: The page tests run on a lab host at the pushed head through the lab-work node.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23135 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest src/omnimarket/nodes/node_factory_floor_publish_effect/tests -q --no-cov
    cwd: .
