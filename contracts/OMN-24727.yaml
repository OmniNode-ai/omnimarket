schema_version: 1.0.0
ticket_id: OMN-24727
title: 'omnimarket#6285 third review: the probe and lane reader bound to node contracts, a probe with no bus-less gateway, a contract-declared token budget, and a request budget that counts only bus wait'
summary: 'Fixes the four blocking findings of the third review of the review gateway change: the probe becomes node_review_key_credit_probe_effect and the lane reader joins the gateway node, each bound by a node contract; the probe reads keys through a bus-free ReviewKeyProbe so no gateway is built with event_bus=None; the probe''s token budget and prompt are declared in its node contract; and the request''s key-state publish budget counts only time spent waiting on the bus. Non-blocking findings ride along: a cancelled publication clears _in_flight, two timing asserts count attempts, and the serving comment cites the right ticket. Not in this change: the PR title and body edit, which is a PR write.'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
