schema_version: 1.0.0
ticket_id: OMN-23414
title: Delete the local-alerts consumers opt-out now that the status page declares a reader (omnimarket)
summary: >-
  OMN-23159 declared the local-alerts exposure's `consumers: none` opt-out as deliberately self-expiring, and said so in
  the contract: exposure-reader-coverage fails a standing opt-out once a reader exists, so the change that adds the
  reader deletes both keys. That reader now exists. omnidash src/pages/local/status.contracts.yaml, at the omnidash sha
  omnibase_infra pins (42e51834d000) and on omnidash dev, declares the status-alerts-local-alerts data binding on
  projection_topic onex.snapshot.projection.local-alerts.v1, so the validator now reports the exposure as
  code stale_opt_out. This change deletes `consumers` and `consumers_reason` from the exposure and inverts the OMN-23159
  control test to match. The exposure stays bus_backed true, on its own topic, table and schema, so the gate still reads
  it. No omnibase_infra file is touched; the gate, its workflow and its declared exposure list are unchanged.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23414-local-alerts-optout-expiry
  statement: The local-alerts exposure declares no consumers opt-out over its live omnidash reader, stays in the exposure-reader-coverage gate's input, and the paired-keys invariant holds across every node contract.
  acceptance:
  - id: AC1
    statement: 'AC1: the local-alerts exposure declares no `consumers` and no `consumers_reason`, and stays `bus_backed: true` with its topic unchanged, so the gate still reads it -- falsifier: the contract diff, plus the inverted control test failing at the merge base and passing at the head'
  - id: AC2
    statement: 'AC2: the paired-keys invariant still holds across every node contract in the repo, so neither key can be left standing alone -- falsifier: the `consumers_reason` without `consumers: none` case run over all of src/omnimarket/nodes/*/contract.yaml'
  - id: AC3
    statement: 'AC3: the validator exits 0 for local-alerts at the omnidash sha omnibase_infra pins, with `stale_opt_out` gone from its output -- falsifier: the bus_backed_exposure_readers probe run against this head and the pinned omnidash tree, before and after'
  - id: AC4
    statement: 'AC4: the gate, its workflow and its declared exposure list are never widened, skipped or made advisory -- falsifier: diff of every omnibase_infra path in this pull request, which must be empty'
evidence_requirements:
- kind: tests
  description: The inverted control test, which fails at the merge base (the opt-out is declared there) and passes with it deleted.
  command: uv run --frozen pytest tests/test_omn23159_local_alerts_exposure_reader_declared.py -q -n 0 --no-cov
dod_evidence:
- id: dod-omn23414-ac1-optout-deleted
  description: >-
    The control test fails at the merge base, where the exposure declares `consumers: none` and a
    `consumers_reason`, and passes at this head, where both keys are gone and the exposure is still bus_backed on
    its unchanged topic.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/test_omn23159_local_alerts_exposure_reader_declared.py -q -n 0 --no-cov
    cwd: ${OMNI_HOME}/omnimarket
- id: dod-omn23414-ac2-keys-stay-paired
  description: >-
    The paired-keys case walks every src/omnimarket/nodes/*/contract.yaml and fails on any exposure that declares one
    of `consumers: none` and `consumers_reason` without the other, so deleting one key alone cannot pass.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/test_omn23159_local_alerts_exposure_reader_declared.py -q -n 0 --no-cov
    cwd: ${OMNI_HOME}/omnimarket
- id: dod-omn23414-ac4-exposure-stays-in-gate-input
  description: >-
    The exposure keeps `bus_backed: true` on its own topic, table and schema, so the gate still reads it: it is not
    deleted, not set to bus_backed false and not hidden from the gate's input. This change touches no omnibase_infra
    file, so the gate's workflow, validator and declared exposure list are unchanged.
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/test_omn23159_local_alerts_exposure_reader_declared.py -q -n 0 --no-cov
    cwd: ${OMNI_HOME}/omnimarket
- id: dod-omn23414-ac3-integration-proof
  description: >-
    The pushed head runs the control test on a lab host through the lab work runner and exits 0, so the contract this
    change edits is read on a live surface and not only in this checkout. The gate's own readback is taken beside it:
    the omnibase_infra bus_backed_exposure_readers validator, run from an omnibase_infra checkout against this head's
    contracts and the omnidash tree at the pinned sha 42e51834d000, no longer reports
    onex.snapshot.projection.local-alerts.v1 with code stale_opt_out, and that readback goes in the pull request's Lab
    line. The delegation.daily.v1 no_reader violation is OMN-21970's omnidash reader and is out of this scope, so the
    validator's exit code is not asserted; the local-alerts line being absent from its output is. Hosted omnimarket CI
    cannot reach the lab and has no omnibase_infra checkout, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  binds_ac:
  - AC3
  checks:
  - check_type: command
    check_value: 'env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23414 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/test_omn23159_local_alerts_exposure_reader_declared.py -q --no-cov'
    cwd: .
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
