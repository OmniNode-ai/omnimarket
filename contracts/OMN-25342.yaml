schema_version: 1.0.0
ticket_id: OMN-25342
title: Make the dev signed-in read node routable on the dev runtime
summary: 'node_dev_signed_in_read_effect declared no subscribed command topic and a handler that cannot be built without arguments, so the dev runtime on the lab answered unknown_command for it and the node could only run as a command line verb. The contract now subscribes the command topic and publishes the completed and failed topics, declares the handler routing and the runtime dispatch terminals, and the handler resolves its overlay, transport and secret store on the first request so the runtime can build it with no arguments.'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn25342-runtime-route
  statement: A merged node of the dev signed-in read is reachable through the dev runtime's own ingress, so one call is handled there and leaves a run line, instead of running only from a command line.
  acceptance:
  - id: AC1
    statement: 'AC1: a STATUS row on the rolling ledger reads kv pr=omnimarket#6132 installed=<host>:<revision> observed=<what ran> read_at=<UTC>, written by the lane after it read one run on h201 itself (a log line, a dispatch, a health read or a job record) -- falsifier: `grep -F ''pr=omnimarket#6132'' $ONEX_LEDGER_PATH | grep -F ''installed=''` finds no row'
  - id: AC2
    statement: 'AC2: one call of node_dev_signed_in_read_effect reaches the dev runtime on h201 and is handled (one run line), or the STATUS row names the single measured cause that keeps it from running and who must act -- falsifier: the dev runtime log and job record on h201 show no run line of node_dev_signed_in_read_effect and the STATUS row names no cause and no actor'
  - id: AC3
    statement: 'AC3: no host file, unit or plist was edited by hand: every change went through the declared installer, read from the installer own receipt -- falsifier: the STATUS row cites no installer receipt, or the installed unit differs from the revision the receipt names'
evidence_requirements:
- kind: tests
  description: The node focused tests at the pushed head. The failing control is the contract at the merge base, where the command topic is not subscribed and the handler needs three arguments (the route tests fail).
  command: uv run --frozen pytest tests/nodes/node_dev_signed_in_read_effect -q --no-cov -n 0 -p no:randomly --refuse-skips
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn25342-ac1-status-row
  description: The lane's STATUS row for omnimarket#6132 names the host and a revision that contains this head, what ran (observed=) and when it was read (read_at=). A row that names an older revision, or no read_at, does not pass. Hosted CI cannot read the rolling ledger, so only the local Done gate runs this unbound check.
  source: manual
  binds_ac:
  - AC1
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: >-
      rev="$(git rev-parse --short=12 HEAD)" && grep -F 'pr=omnimarket#6132' "$ONEX_LEDGER_PATH" | grep -F 'observed=' | grep -F 'read_at=' | grep -Eq "installed=[^ |:]+:[^ |]*${rev}"
    cwd: .
- id: dod-omn25342-ac2-route
  description: The node contract is loaded by the runtime's own contract discovery and wired onto an in-memory bus; one command is dispatched to the handler built with no arguments and its answer reaches the completed or failed topic, and a missing overlay is a typed failed result. These tests touch no running runtime, so they are evidence for the route and bind no acceptance criterion.
  source: manual
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_dev_signed_in_read_effect/test_runtime_route.py tests/nodes/node_dev_signed_in_read_effect/test_guard.py -q --no-cov -n 0 -p no:randomly --refuse-skips
    cwd: .
- id: dod-omn25342-ac2-prior-behaviour
  description: The golden chain, error chain and seam tests of the node still pass with the handler's arguments optional, so the command line verb and the tests that pass all three arguments behave as before.
  source: manual
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_dev_signed_in_read_effect -q --no-cov -n 0 -p no:randomly --refuse-skips
    cwd: .
- id: dod-omn25342-ac2-run-line-or-cause
  description: The lane's STATUS row for omnimarket#6132 names this head's revision and either one run line read on h201 (run_line=) or the single measured cause and the actor who must act (cause= and actor=). A row without the head's revision, or with neither, does not pass. Hosted CI cannot read the rolling ledger, so only the local Done gate runs this unbound check.
  source: manual
  binds_ac:
  - AC2
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: >-
      rev="$(git rev-parse --short=12 HEAD)" && grep -F 'pr=omnimarket#6132' "$ONEX_LEDGER_PATH" | grep -F "${rev}" | grep -E 'run_line=[^ |]|cause=[^ |].*actor=[^ |]|actor=[^ |].*cause=[^ |]' | grep -q .
    cwd: .
- id: dod-omn25342-ac3-no-hand-edit
  description: No host file, unit or plist is in the diff from the merge base to the head. The pattern matches any path that ends in .service, .plist or .timer, in any directory, and the diff starts at the merge base with origin/dev (never the last commit alone). The check fails when the merge base cannot be read. A hosted checkout may be shallow, so only the local Done gate runs this unbound check.
  source: manual
  binds_ac:
  - AC3
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: >-
      base="$(git merge-base HEAD origin/dev)" && test -n "$base" && ! git diff --name-only "$base" HEAD | grep -E '\.(service|plist|timer)$|^(etc|usr|Library)/'
    cwd: .
- id: dod-omn25342-ac3-receipt-matches-unit
  description: The lane's STATUS row for omnimarket#6132 cites the installer receipt (receipt=) and the revision that receipt names (receipt_rev=), and that revision equals the revision the installed unit carries (the revision in installed=<host>:<rev>). A row with no receipt, or a receipt revision that differs from the installed one, does not pass. Hosted CI cannot read the rolling ledger, so only the local Done gate runs this unbound check.
  source: manual
  binds_ac:
  - AC3
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: >-
      row="$(grep -F 'pr=omnimarket#6132' "$ONEX_LEDGER_PATH" | grep -F 'receipt=' | tail -n 1)" && inst="$(printf '%s\n' "$row" | sed -n 's/.*installed=[^ |:]*:\([^ |]*\).*/\1/p')" && rcpt="$(printf '%s\n' "$row" | sed -n 's/.*receipt_rev=\([^ |]*\).*/\1/p')" && test -n "$inst" && test "$inst" = "$rcpt"
    cwd: .
- id: dod-omn25342-deploy-route-smoke
  description: 'Hosted checkout deploy-scope smoke: the node contract subscribes its command topic with a routed handler, and the handler class is constructed with no arguments without touching the environment or the network. Fails on the merge base because the contract subscribes nothing and the constructor requires three keyword arguments. No service, broker, host path or credential required; this proves the package shape the runtime reads to build its ingress route, not a live rollout.'
  source: manual
  checks:
  - check_type: command
    check_value: uv run --frozen pytest tests/nodes/node_dev_signed_in_read_effect/test_runtime_route.py -q --no-cov -n 0 -p no:randomly --refuse-skips -k "dev_signed_in_read_runtime_route"
    cwd: .
- id: dod-omn25342-integration-proof
  description: The pushed head ran the node tests on a lab host through the lab work runner and exited 0. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-25342 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_dev_signed_in_read_effect -q --no-cov --refuse-skips
    cwd: .
