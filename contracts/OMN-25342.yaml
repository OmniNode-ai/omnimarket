schema_version: 1.0.0
ticket_id: OMN-25342
title: Make the dev signed-in read node routable on the dev runtime
summary: 'node_dev_signed_in_read_effect declared no subscribed command topic and a handler that cannot be built without arguments, so the dev runtime on the lab answered unknown_command for it and the node could only run as a command line verb. The contract now subscribes the command topic and publishes the completed and failed topics, declares the handler routing and the runtime dispatch terminals, and the handler resolves its overlay, transport and secret store on the first request so the runtime can build it with no arguments. Interface change: the completed and failed topics are published for the first time (the contract declared them before but published nothing), the result gains the overlay_unavailable outcome and its realm may be null; no other repository reads these topics and the only readers are the node contract and its own tests, so no consumer needs a change.'
is_seam_ticket: false
interface_change: true
interfaces_touched:
- events
- topics
requirements:
- id: req-omn25342-runtime-route
  statement: A merged node of the dev signed-in read is reachable through the dev runtime's own ingress, so one call is handled there and leaves a run line, instead of running only from a command line.
  acceptance:
  - id: AC1
    statement: 'AC1: the node contract subscribes its command topic with a routed handler, so the runtime discovery builds an ingress route for node_dev_signed_in_read_effect -- falsifier: the route tests fail at the merge base, where the contract subscribes nothing'
  - id: AC2
    statement: 'AC2: one command dispatched to the handler built with no arguments is answered on the completed or failed topic -- falsifier: the handler constructor requires three keyword arguments, as at the merge base'
  - id: AC3
    statement: 'AC3: a missing overlay is a typed failed result and is never swallowed -- falsifier: the guard test sees no failed answer for a missing overlay'
evidence_requirements:
- kind: tests
  description: The node focused tests at the pushed head. The failing control is the contract at the merge base, where the command topic is not subscribed and the handler needs three arguments (the route tests fail).
  command: uv run --frozen pytest tests/nodes/node_dev_signed_in_read_effect -q --no-cov -n 0 -p no:randomly --refuse-skips
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn25342-ac2-route
  description: The node contract is loaded by the runtime's own contract discovery and wired onto an in-memory bus; one command is dispatched to the handler built with no arguments and its answer reaches the completed or failed topic, and a missing overlay is a typed failed result. These tests touch no running runtime, so they prove the route and the handler, not a live rollout.
  source: manual
  binds_ac:
  - AC2
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_dev_signed_in_read_effect/test_runtime_route.py tests/nodes/node_dev_signed_in_read_effect/test_guard.py -q --no-cov -n 0 -p no:randomly --refuse-skips
    cwd: .
- id: dod-omn25342-ac2-prior-behaviour
  description: The golden chain, error chain and seam tests of the node still pass with the handler's arguments optional, so the command line verb and the tests that pass all three arguments behave as before.
  source: manual
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_dev_signed_in_read_effect -q --no-cov -n 0 -p no:randomly --refuse-skips
    cwd: .
- id: dod-omn25342-ac3-no-hand-edit
  description: No host file, unit or plist is in the diff from the merge base to the head. The pattern matches any path that ends in .service, .plist or .timer, in any directory, and the diff starts at the merge base with origin/dev (never the last commit alone). The check fails when the merge base cannot be read. A hosted checkout may be shallow, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: >-
      base="$(git merge-base HEAD origin/dev)" && test -n "$base" && ! git diff --name-only "$base" HEAD | grep -E '\.(service|plist|timer)$|^(etc|usr|Library)/'
    cwd: .
- id: dod-omn25342-deploy-route-smoke
  description: 'Hosted checkout deploy-scope smoke: the node contract subscribes its command topic with a routed handler, and the handler class is constructed with no arguments without touching the environment or the network. Fails on the merge base because the contract subscribes nothing and the constructor requires three keyword arguments. No service, broker, host path or credential required; this proves the package shape the runtime reads to build its ingress route, not a live rollout.'
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_dev_signed_in_read_effect/test_runtime_route.py -q --no-cov -n 0 -p no:randomly --refuse-skips -k "dev_signed_in_read_runtime_route"
    cwd: .
- id: dod-omn25342-integration-proof
  description: The pushed head ran the node tests on a lab host through the lab work runner and exited 0. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-25342 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_dev_signed_in_read_effect -q --no-cov --refuse-skips
    cwd: .
- id: dod-omn25342-trigger-declared
  description: The node contract declares what runs it (on_demand command and owner), so the Node Trigger Declaration Check passes for it on any pull request that touches the node. Fails on dev dfb19a0870, where runtime_dispatch.external_trigger is set and nothing names the runner.
  source: manual
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_dev_signed_in_read_effect/test_trigger_declaration.py -q --no-cov -n 0 -p no:randomly --refuse-skips
    cwd: .
