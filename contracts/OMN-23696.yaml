schema_version: 1.0.0
ticket_id: OMN-23696
title: 'Delegation check 7: assert the receipt names backend, host and cost over the bus'
summary: 'The hosted workflow that graded scenario R7 reads the delegation receipt through the gateway''s HTTP interface, which is being removed, and fails before it measures anything because the stability lane variable is not declared. Scenario R7 becomes an omnimarket node, node_delegation_scenario_r7_effect, scheduled every six hours by the registry installer: one run drives the delegation skill handler with a two-rung probe ladder (one failing, one answering at a cost) and holds only when the terminal receipt names the answering backend, the serving host and the charged cost, and the terminal cost equals the attempts'' costs added.'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23696-r7
  statement: The delegation receipt and cost name the answering backend and host, read from the terminal the run produces and not through an HTTP interface.
  acceptance:
  - id: AC1
    statement: 'AC1: scenario R7 run in-process reads the delegation terminal receipt over the bus path and holds only when it names the answering backend, the serving host and the charged cost, and the terminal cost equals the sum of the attempts'' costs -- falsifier: uv run pytest tests/nodes/node_delegation_scenario_r7_effect/test_golden_chain_scenario_r7_effect.py -q'
  - id: AC2
    statement: 'AC2: a control whose receipt names a different backend than the one that answered, and a run whose every rung fails, each end the scenario red with the named assertion -- falsifier: uv run pytest tests/nodes/node_delegation_scenario_r7_effect/test_golden_chain_scenario_r7_effect.py -q -k "control or error"'
  - id: AC3
    statement: 'AC3: scenario R7 is a declared unit of the registry installer and renders a unit with its own tick module -- falsifier: uv run pytest tests/nodes/node_host_installer_registry_units/test_scenario_r7_unit.py -q'
  - id: AC4
    statement: 'AC4: integrated: on lab host h053, scenario R7 installed from the branch through the registry installer ran on its schedule and its result row is read from the running host and from the tracker -- falsifier: the last-run record under the scenario state directory on h053 names the branch revision and a conclusion, and the tracker''s R7 entry names the lab lane and its latest run'
