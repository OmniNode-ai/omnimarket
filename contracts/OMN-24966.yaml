schema_version: 1.0.0
ticket_id: OMN-24966
title: 'Review findings 1 to 13 on omnimarket PR 6333 at head 4faf101205a7 are fixed or argued: the fill order is tested, the live ports are bound and the alarm check is scheduled, and the Lab comment and required checks are at the new head'
summary: 'One writer lane fixes the thirteen review findings of the floor fill live pool seam and alarm rule pull request at head 4faf101205a7: the stored run and state rows are read as a real tick stores them (every run kept or a gap refused, state without entries refused, a CLAIM in the same second as the start counted), the alarm row carries its actor cells and passes the ledger grammar, the four ports are bound with the run age bound set and one check is one call, the snapshot refusal prefix is one shared constant and a host with empty engines is refused, the contract checks of the pull request read what they claim, and the findings that need a decision of another owner (the fill order, the narrowed AC3, the schedule, the overlay keys) are argued in a PR comment.'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24966-review-findings
  statement: The review findings on the floor fill live pool seam and alarm rule pull request are fixed or argued with evidence.
  acceptance:
  - id: AC1
    statement: 'AC1: the fill order is implemented and a test whose name matches fill_order selects and passes, or AC2 of OMN-24873 is moved to a minted ticket in a PR comment -- falsifier: `uv run --frozen pytest src/omnimarket/nodes/node_floor_fill_orchestrator/tests -k fill_order -q` collects zero tests or fails at the new head'
  - id: AC2
    statement: 'AC2: the four ports are bound and the alarm check is scheduled, with a test on the bound factory -- falsifier: `uv run --frozen pytest src/omnimarket/nodes -k floor_fill_alarm -q` passes with the binding removed'
  - id: AC3
    statement: 'AC3: the fill logs every run with its slots (or a sequence gap is refused), `free_slots` is set on each run, and a test shows two runs in a row cannot skip a run that sent lanes -- falsifier: `uv run --frozen pytest src/omnimarket/nodes -k floor_fill_alarm -q` passes with the per-run log removed'
  - id: AC4
    statement: 'AC4: the state and answer tests are built from what a real tick stores, and state lacking `entries` is refused, so a shape mismatch cannot read as zero lanes sent -- falsifier: `uv run --frozen pytest src/omnimarket/nodes -k floor_fill_alarm -q` passes with the `entries` refusal removed'
  - id: AC5
    statement: 'AC5: a CLAIM stamped in the same whole second as the start is counted as a CLAIM, with a test -- falsifier: `uv run --frozen pytest src/omnimarket/nodes -k floor_fill_alarm -q` passes with the comparison at sub-second precision'
  - id: AC6
    statement: 'AC6: the alarm row carries the principal and actor cells and a test appends it through the declared ledger append command grammar -- falsifier: `uv run --frozen pytest src/omnimarket/nodes -k floor_fill_alarm -q` passes with the principal cell removed from the row'
  - id: AC7
    statement: 'AC7: the `accounts-unread` prefix is one shared constant used by the writer and the test, and a host with empty `engines` is refused, with a test -- falsifier: `uv run --frozen pytest src/omnimarket/nodes -k measured_cause_sends -q` passes with the empty-engines refusal removed'
  - id: AC8
    statement: 'AC8: the two age bounds differ in the test, the `pool_clock` is injected, the floor loaded is the measured one or the narrowing of AC3 of OMN-24873 is agreed by its owner in a PR comment -- falsifier: `uv run --frozen pytest src/omnimarket/nodes/node_floor_fill_orchestrator/tests -k measured_cause_sends -q` passes with the bounds set equal'
  - id: AC9
    statement: 'AC9: the contract checks of the PR match `| CLAIM |` and not the alarm''s own rows, read each alarm run, read the PR comment, compare the sha to the head and fail on any non-success -- falsifier: `uv run --frozen pytest src/omnimarket/nodes -k floor_fill_alarm -q` passes with a non-success conclusion in the fixture'
  - id: AC10
    statement: 'AC10: a PR comment starting `Lab: head=<full new head sha>` names the sha, the command and exit 0, and every required check-run of omnimarket#6333 is success at the new head -- falsifier: `onex scm pr-checks OmniNode-ai/omnimarket#6333` lists a required context that is not success at the new head, or the Lab comment lacks the full sha, the command or exit 0'
  - id: AC11
    statement: 'AC11: non-blocking findings 11 to 13 are fixed or argued in a PR comment (`max_run_age_minutes` set in the binding, a late CLAIM alarms once, the overlay of h051 holds the four pool keys) -- falsifier: `uv run --frozen pytest src/omnimarket/nodes -k floor_fill_alarm -q` passes with a late-CLAIM repeat alarm case removed'
evidence_requirements:
- kind: tests
  description: The alarm rule, alarm check (stored rows, binding, contract checks) and measured-cause tests.
  command: uv run --frozen pytest src/omnimarket/nodes/node_floor_fill_orchestrator/tests/test_floor_fill_measured_cause_sends.py src/omnimarket/nodes/node_floor_fill_alarm_compute/tests src/omnimarket/nodes/node_floor_fill_alarm_effect/tests -q
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24966-ac1
  description: 'The fill order is not implemented in this change and no ticket for it is minted: the move of AC2 of OMN-24873 to a minted ticket is requested in a PR comment and the owner decides. The falsifier selects no test until the order lands, so it stays unproven and runs only at the local Done gate.'
  source: manual
  execution_scope: local_done_gate
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest src/omnimarket/nodes/node_floor_fill_orchestrator/tests -k fill_order -q
    cwd: .
- id: dod-omn24966-ac2
  description: The four ports are bound by the container of the alarm effect node and one check over a real fill tick writes the rows through the bound ports; the schedule that calls the check belongs to the Temporal workflow of the floor fill (a binding MSG of the orchestrator forbids a new timer, unit or scheduler), so this criterion is met for the binding and the factory test and the schedule is argued in a PR comment.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest src/omnimarket/nodes -k floor_fill_alarm -q
    cwd: .
- id: dod-omn24966-ac3
  description: The fill stores free_slots and lanes_started on every stored answer, the run source keeps each run and refuses a gap in the answer seq, and two idle runs on either side of a run that sent lanes are not two runs in a row.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest src/omnimarket/nodes -k floor_fill_alarm -q
    cwd: .
- id: dod-omn24966-ac4
  description: The state and answer rows are the ones a real live tick stores (and the fill models build); a state row without entries and an answer of the old shape are refused.
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest src/omnimarket/nodes -k floor_fill_alarm -q
    cwd: .
- id: dod-omn24966-ac5
  description: A CLAIM stamped in the second of the start is a CLAIM; a CLAIM in the second before it is not.
  source: manual
  binds_ac:
  - AC5
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest src/omnimarket/nodes -k floor_fill_alarm -q
    cwd: .
- id: dod-omn24966-ac6
  description: The alarm row carries actor= and model=none beside a one-token lane and is appended through the ledger row grammar; it names no principal because the ledger writer adds the authenticated principal and refuses a row whose own principal differs (argued in a PR comment).
  source: manual
  binds_ac:
  - AC6
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest src/omnimarket/nodes -k floor_fill_alarm -q
    cwd: .
- id: dod-omn24966-ac7
  description: The accounts-unread prefix is one constant of the snapshot node shared by the writer, the reader and the tests, and a host with empty engines and no refusal is refused as an unread pool.
  source: manual
  binds_ac:
  - AC7
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest src/omnimarket/nodes -k measured_cause_sends -q
    cwd: .
- id: dod-omn24966-ac8
  description: The settings bound (180) and the record bound (60) differ and the pool clock is injected, so the age is exact at the edge. The floor loaded is the recorded floor of 2026-11-02, not the measured one (which is on the fill host); the narrowing of AC3 of OMN-24873 is not agreed by its owner in the ticket comments read on 2026-11-16, and the agreement is requested in a PR comment, so this criterion is partly argued.
  source: manual
  binds_ac:
  - AC8
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest src/omnimarket/nodes/node_floor_fill_orchestrator/tests -k measured_cause_sends -q
    cwd: .
- id: dod-omn24966-ac9
  description: 'The shell checks of the contracts of the pull request are run over fixtures with the host and the watcher faked: CLAIM rows are matched by type and not the alarm rows, the alarm run is read from the check log, the installed revision is compared to the head, a watcher head that is not this head fails and any non-success check fails.'
  source: manual
  binds_ac:
  - AC9
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest src/omnimarket/nodes -k floor_fill_alarm -q
    cwd: .
- id: dod-omn24966-ac10
  description: 'Hosted CI cannot read the watcher of the pull request at its head, so only the local Done gate runs this: the watcher head is this checkout head and every check read is success and none is in any other state.'
  source: manual
  execution_scope: local_done_gate
  binds_ac:
  - AC10
  checks:
  - check_type: command
    check_value: |-
      test "$(onex scm pr-view OmniNode-ai/omnimarket#6333 | python3 -c 'import json,sys; print(json.load(sys.stdin)["result"]["head_sha"])')" = "$(git rev-parse HEAD)"
  - check_type: command
    check_value: |-
      onex scm pr-checks OmniNode-ai/omnimarket#6333 > "$TMPDIR/omn24966-checks.txt" && grep -qi success "$TMPDIR/omn24966-checks.txt" && ! grep -Eqi 'failure|pending|cancel|error|unread|timed_out|timed out|queued|in_progress|action_required|expected|skipped' "$TMPDIR/omn24966-checks.txt"
- id: dod-omn24966-ac11
  description: max_run_age_minutes is a required key of the alarm settings and set on every check request, and a late CLAIM alarms once under its own key. The overlay of h051 holds none of the four pool keys at the overlays clone read on 2026-11-16 (argued in a PR comment with the values to add).
  source: manual
  binds_ac:
  - AC11
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest src/omnimarket/nodes -k floor_fill_alarm -q
    cwd: .
- id: dod-omn24966-integration-proof
  description: 'Hosted CI cannot reach a lab host, so only the local Done gate runs this unbound check: the alarm rule, alarm check, binding and measured-cause tests run on a lab host at the sha, and the check log of the alarm node on the fill host holds one line per check.'
  source: manual
  execution_scope: local_done_gate
  binds_ac:
  - AC2
  checks:
  - check_type: command
    check_value: onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24966 --kind test -- uv run --frozen pytest src/omnimarket/nodes -k "floor_fill_alarm or measured_cause_sends" -q
