schema_version: 1.0.0
ticket_id: OMN-23109
title: The friction rollup overlay carries the four new classification rules in its example file with tests
summary: The rollup unit reads node_friction_rollup_compute overlay.example.yaml as its shipped class rules. That file held 37 rules; four FRICTION rows of 2026-11-08T00:13Z to 05:15Z carried no class cell and no rule named them, so the floor's stoppage:unclassified row kept them. The shipped set now carries four more rules, one per row, with three tests whose control runs the same rows through the 37 rules and reads all four as unclassified.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23109-class-rules
  statement: Each of the four FRICTION rows that carried no class is named by one shipped class rule with an owner, and the same rows read as unclassified through the rules without the four.
  acceptance:
  - id: AC1
    statement: 'AC1: omnimarket#5412 is titled with this ticket and carries its own contract file for it, and the three tests it adds fail on the base and pass on the branch -- falsifier: uv run pytest of the node_friction_rollup_compute test directory on the base and on the branch'
  - id: AC2
    statement: 'AC2: replaying the ledger copy taken at 05:49Z through the live overlay reads 0 unclassified rows where the 37-rule overlay reads 4 -- falsifier: uv run pytest of the replay test over the recorded ledger copy'
evidence_requirements:
- kind: tests
  description: The class rule tests of the friction rollup node, including the four rows of 2026-11-08 and their control.
  command: uv run pytest tests/nodes/node_friction_rollup_compute -q
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23109-ac1
  description: The three new tests pass on the branch. With the overlay as origin/dev holds it (37 rules) in place of the 41, all three tests fail.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_friction_rollup_compute/test_class_rules_new_stoppages_2026_11_08.py -q
- id: dod-omn23109-ac2
  description: The four rows, in the text the ledger holds, read as four unclassified occurrences through the rules without the four and as none through the shipped rules. The same replay over the ledger copy of 2026-11-08T05:49Z (live file plus archive rolls) read 4 unclassified with 37 rules and 0 with 41.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_friction_rollup_compute/test_class_rules_new_stoppages_2026_11_08.py -q
- id: dod-omn23109-integration-proof
  description: Run the friction rollup node tests on a lab host at the pushed head. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23109 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_friction_rollup_compute -q --no-cov
