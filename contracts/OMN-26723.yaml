schema_version: "1.0.0"
ticket_id: "OMN-26723"
title: "The beta board reads every delegation check from the dev scheduled runs"
summary: >-
  Acceptance for OMN-26723 in omnimarket. The probe tick writes every check's whole verdict as the gateway_leg of its history line
  (C16 and C30 included), and the beta board reads a gateway_check probe from that line only, and reads unread when the newest
  scheduled run is older than two hours. AC1 and AC2 are bound to tests/nodes/node_beta_board_effect/test_scheduled_run_reading.py.
  AC3 is the lab readback of one board publish against the scheduled run it read, recorded on the pull request's Lab line.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-omn26723-board-reads-scheduled-runs"
    statement: >-
      The board's state for a check is read from the newest dev scheduled run's reading, and a reading older than two hours is unread.
    acceptance:
      - id: "AC1"
        statement: >-
          AC1: a scheduled-run reading with C16 PASS beside a stale cloud run with C16 FAIL shows PASS on the board -- falsifier: the scheduled run reading test fails on dev, where a gateway-only check's history line carries no gateway_leg
      - id: "AC2"
        statement: >-
          AC2: a check with no scheduled-run reading newer than two hours shows unread -- falsifier: the two-hour test fails on dev, where an old reading reads stale
      - id: "AC4"
        statement: >-
          AC4: the probe tick prints one line per check with the check id, the verdict and the correlation id, and a NOT PUBLISHED line to stderr for a refused publish -- falsifier: the probe-check-lines test fails on dev, where the tick prints no per-check line
evidence_requirements: []
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn26723-scheduled-run-reading"
    description: >-
      AC1 and AC2: C16 and C30 read PASS and FAIL from the scheduled run's history line, a cloud run is never read, an unmeasured
      run is never a pass, and a reading over two hours old is unread.
    source: "manual"
    binds_ac: ["AC1", "AC2"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_beta_board_effect/test_scheduled_run_reading.py tests/nodes/node_beta_board_effect/test_gateway_leg_reading.py -q -p no:randomly"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn26723-integration-proof"
    description: >-
      Run the scheduled-run reading tests on a lab host at the pushed head: C16 and C30 read from the scheduled run's history line,
      and a reading over two hours old reads unread. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
    source: "manual"
    execution_scope: "local_done_gate"
    checks:
      - check_type: "command"
        check_value: >-
          onex lab-work run --repo OmniNode-ai/omnimarket --sha
          "$(git rev-parse HEAD)" --lane dod-integration-proof-26723 --kind test --
          uv run --frozen pytest tests/nodes/node_beta_board_effect/test_scheduled_run_reading.py
          -q --no-cov
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn26723-probe-check-lines"
    description: >-
      The probe tick prints one line per check with the check id, the verdict and the correlation id the run went on the bus under,
      and writes a NOT PUBLISHED line to stderr for a check the bus refused. The test file is new on this pull request.
    source: "manual"
    binds_ac: ["AC4"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_delegation_check_probe_effect/test_tick_check_lines.py -q --no-cov -p no:randomly"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn26723-board-reads-the-bus"
    description: >-
      AC1 and AC2 from the bus: the board reads every probe naming a check from the newest scheduled run event on the topic its
      contract names (one read, no file path, no host), one scheduled run of ten passes reads ten of ten, a reading over two hours old
      or a topic that cannot be read is unread, and no handler holds the topic as a constant. The tests are new or rewritten on this pull request.
    source: "manual"
    binds_ac: ["AC1", "AC2"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_beta_board_effect/test_scheduled_run_reading.py tests/nodes/node_beta_board_effect/test_gateway_leg_reading.py tests/nodes/node_beta_board_effect/test_check_result_bus_decode.py -q --no-cov -p no:randomly"
        cwd: "${OMNI_HOME}/omnimarket"
