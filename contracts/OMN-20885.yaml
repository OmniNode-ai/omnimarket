---
schema_version: "1.0.0"
ticket_id: "OMN-20885"
title: "OCC retirement: rehome omnimarket's change-control verification checks into the product repositories"
summary: "omnimarket's ONEX Change Control Schema Compatibility job checked out onex_change_control as the schema authority, matched no file in this repository and compared that package's version with a hardcoded reader version. The ticket-contract schema omnimarket reads is omnibase_core's ModelTicketContract. The job now compares the schema_version of every contracts/OMN-*.yaml with the installed omnibase_core model through omnibase_spi's is_compatible, with no change-control checkout, under the same context name."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-schema-compat-core-owner"
    statement: "The ONEX Change Control Schema Compatibility job reads the ticket-contract schema from its owner, omnibase_core, with no onex_change_control checkout, and fails on a major mismatch."
    acceptance:
      - id: "AC2"
        statement: "AC2: .github/workflows/onex-schema-compat.yml checks out no onex_change_control and its compatibility step passes on this repository's contracts, fails on a planted contract whose schema_version major differs from omnibase_core ModelTicketContract's, fails on an unparseable version and on a contracts directory with no OMN-*.yaml -- falsifier: uv run pytest tests/ci/test_schema_compat_core_owner_omn20885.py -q fails"
  - id: "req-contract-compliance-core-validator"
    statement: "Contract Compliance Check and contract-validation validate this repository's own ticket contracts with omnibase_core's ModelTicketContract, with no onex_change_control checkout, install or auth preflight, under unchanged job and context names."
    acceptance:
      - id: "AC3"
        statement: "AC3: the ci.yml Contract Compliance Check job checks out and installs no onex_change_control and its validation step passes every contracts/OMN-*.yaml of this repository, passes a clean planted contract, and fails a planted contract with a binds_ac entry that is not a criterion label and one with a binds_ac item of check_type command_exit_0, naming the file and the rule -- falsifier: uv run pytest tests/ci/test_contract_compliance_core_validator_omn20885.py -q fails"
      - id: "AC4"
        statement: "AC4: .github/workflows/contract-validation.yml has no onex_change_control checkout or auth preflight, keeps its workflow and job names, and its validation step (the same body as Contract Compliance Check) passes a clean branch-ticket contract and fails each of the two refused binds_ac shapes, naming the file and the rule -- falsifier: uv run pytest tests/ci/test_contract_compliance_core_validator_omn20885.py -q fails"
evidence_requirements:
  - kind: "tests"
    description: "AC2: the workflow's own compatibility step, run against the repo contracts and planted ones, admits the repo and refuses a major mismatch."
    command: "uv run pytest tests/ci/test_schema_compat_core_owner_omn20885.py -q -p no:randomly"
  - kind: "tests"
    description: "AC3, AC4: both jobs' validation steps, run against the repo contracts and planted ones, admit the repo and a clean contract and refuse the two binds_ac shapes."
    command: "uv run pytest tests/ci/test_contract_compliance_core_validator_omn20885.py -q -p no:randomly"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn20885-ac2-schema-compat-core-owner"
    description: "AC2: the schema-compatibility step reads omnibase_core and fails on a planted major mismatch."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_schema_compat_core_owner_omn20885.py -q -p no:randomly"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC2"]
  - id: "dod-omn20885-ac3-contract-compliance-core"
    description: "AC3: Contract Compliance Check validates this repository's contracts with omnibase_core and refuses both planted binds_ac shapes."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_contract_compliance_core_validator_omn20885.py -q -p no:randomly"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC3"]
  - id: "dod-omn20885-ac4-contract-validation-core"
    description: "AC4: contract-validation validates the branch-ticket contract with omnibase_core and refuses both planted binds_ac shapes."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_contract_compliance_core_validator_omn20885.py -q -p no:randomly"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC4"]
