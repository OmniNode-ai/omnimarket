schema_version: 1.0.0
ticket_id: OMN-24963
title: The review findings on the runner group flag change are fixed or argued, and the head is proven on the lab
summary: >-
  The review of the head that read restricted_to_workflows from GitHub's runner group body found eight
  items. The renamed field of the published result model is declared as an interface change with its
  deploy order in the contract of the change; a restricted group with no pinned list is refused by both
  readers; the catch clause around the direct source's flag reads and the result detail of the write
  node's refusal are tested red then green; the positive control of the new direct-source tests reads
  the same group_body path as WORKING; the contract of the change gets a criterion for the direct source
  and a running-reading check that matches the merged sha and the order of the install and the reading.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24963-review-findings
  statement: Every blocking finding of the review is fixed with a red then green test, or argued with evidence in a pull request comment, and the new head is commented with its lab proof.
  acceptance:
  - id: AC1
    statement: 'AC1: a PR comment starting Lab: head=<full new head sha> names the sha, the command of the contract of the change and exit 0, and the required check-runs read success at the new head -- falsifier: onex scm pr-checks OmniNode-ai/omnimarket#6332 lists a required context that is not success at the new head, or the Lab comment lacks the full sha, the command or exit 0'
  - id: AC2
    statement: 'AC2: the published result model keeps its field name or the interface change is declared with the model listed and the deploy order stated, and no file under src/ or tests/ names the retired flag name -- falsifier: the search of src/ and tests/ for the retired name prints a line at the new head while the contract of the change still says interface_change false'
  - id: AC3
    statement: 'AC3: a test shows the direct source refuses a body missing the key with an error the caller catches (KeyError and plain ValueError both), and the handler test asserts a result.detail carrying the refusal message, red with the except clause reverted and green at the new head -- falsifier: the two test files pass with the except clause reverted'
  - id: AC4
    statement: 'AC4: a PR comment records the duplicate decision for the other draft (the one kept, the one closed, and whether it adds the contract file of the change) -- falsifier: the PR has no comment naming the other draft and the kept PR'
  - id: AC5
    statement: 'AC5: both tests assert that the group_body path reads WORKING, and a criterion with its own falsifier binds the direct-source tests -- falsifier: the probe test file passes with the group_body path forced to UNREADABLE'
  - id: AC6
    statement: 'AC6: the running-reading check in the contract of the change matches the merged sha, requires the reading row to post-date the install row, and matches the CLI''s real JSON spacing, and the comment in the direct source agrees with the code for an absent selected_workflows -- falsifier: the check has no merged-sha match or no order check, or the compact form of the outcome is not what the CLI prints'
evidence_requirements:
- kind: tests
  description: The tests of the runner group read at the pushed head.
  command: env -u PYTHONPATH uv run --frozen pytest tests/unit/nodes/node_github_repo_write_effect/test_handler_runner_group_get.py tests/nodes/node_runner_group_exposure_effect/test_bus_group_read.py tests/nodes/node_runner_group_exposure_effect/test_exposure_probe.py tests/test_golden_chain_github_repo_write_effect.py -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24963-ac1-suite
  description: 'AC1 hosted proxy: the runner group read suites of the change pass at the pushed head; the Lab comment and the check-runs are read by the local Done gate.'
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: env -u PYTHONPATH uv run --frozen pytest tests/unit/nodes/node_github_repo_write_effect/test_handler_runner_group_get.py tests/nodes/node_runner_group_exposure_effect/test_bus_group_read.py tests/nodes/node_runner_group_exposure_effect/test_exposure_probe.py tests/test_golden_chain_github_repo_write_effect.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24963-ac2-interface
  description: 'AC2: the contract of the change declares the interface change, lists the model and states the deploy order, and no file under src/ or tests/ names the retired flag name.'
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: command
    check_value: |-
      grep -q '^interface_change: true' contracts/OMN-24871.yaml && grep -q 'Deploy order' contracts/OMN-24871.yaml && grep -q 'ModelRepoWriteRunnerGroup' contracts/OMN-24871.yaml && test -z "$(grep -rn --include='*.py' --include='*.yaml' 'restricted_to_selected''_workflows' src/ tests/)"
    cwd: .
- id: dod-omn24963-ac3-except-clause
  description: 'AC3: the refusal tests of the direct source (KeyError and ValueError) and of the write node (result.detail) pass at the head; with the except clause narrowed to TypeError four of them fail, read in the Lab comment.'
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: env -u PYTHONPATH uv run --frozen pytest tests/nodes/node_runner_group_exposure_effect/test_exposure_probe.py tests/unit/nodes/node_github_repo_write_effect/test_handler_runner_group_get.py -q --no-cov -n 0 -p no:randomly -p no:cacheprovider
    cwd: .
- id: dod-omn24963-ac4-duplicate
  description: 'Hosted proxy for AC4: the contract file of the change is on this pull request, the kept one. The duplicate decision itself is a pull request comment of the lane report, which no hosted or local command reads.'
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: command
    check_value: |-
      test -f contracts/OMN-24871.yaml
    cwd: .
- id: dod-omn24963-ac5-control
  description: 'AC5: the direct-source tests pass with the group_body positive control in each refusal test; with the group_body path forced to UNREADABLE the control fails (eleven tests fail, read in the Lab comment). The contract of the change carries AC5 for the direct source.'
  source: manual
  binds_ac:
  - AC5
  checks:
  - check_type: test_passes
    check_value: env -u PYTHONPATH uv run --frozen pytest tests/nodes/node_runner_group_exposure_effect/test_exposure_probe.py -q --no-cov -n 0 -p no:randomly -p no:cacheprovider
    cwd: .
  - check_type: command
    check_value: |-
      grep -q 'id: AC5' contracts/OMN-24871.yaml && grep -q 'AC5' contracts/OMN-24871.yaml
    cwd: .
- id: dod-omn24963-ac6-running-reading
  description: 'AC6: the running-reading check matches the merged sha and orders the reading after the install, the CLI prints compact JSON, and the comment of the direct source describes the refusal of a restricted group with no pinned list.'
  source: manual
  binds_ac:
  - AC6
  checks:
  - check_type: command
    check_value: |-
      grep -q 'onex scm pr-merge-commit OmniNode-ai/omnimarket#6332' contracts/OMN-24871.yaml && grep -q '\[ "\$T" ' contracts/OMN-24871.yaml && grep -q '"outcome":"completed"' contracts/OMN-24871.yaml && grep -q 'restricted group with no selected_workflows list' src/omnimarket/nodes/node_runner_group_exposure_effect/adapters/github_group_source.py
    cwd: .
- id: dod-omn24963-integration-proof
  description: Hosted CI cannot reach a lab host. Only the local Done gate runs this unbound check; it runs the runner group read suites of the change on a lab host at the pushed head through the lab work node, and the lab run of the same suites is read in the pull request comment that starts with Lab and names the head.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24963 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/nodes/node_github_repo_write_effect/test_handler_runner_group_get.py tests/nodes/node_runner_group_exposure_effect tests/test_golden_chain_github_repo_write_effect.py -q --no-cov -p no:randomly
    cwd: .
