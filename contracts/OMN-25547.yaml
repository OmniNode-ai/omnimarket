schema_version: 1.0.0
ticket_id: OMN-25547
title: 'node_gateway_batch_ingest_effect: a stateless HTTPS batch ingest door that validates the whole batch and confirms each record''s delivery before it answers'
summary: New node node_gateway_batch_ingest_effect serves POST /v1/gateway/batch-ingest through the contract's http_mount. It verifies the bearer token with the overlay's lab JWKS, binds the tenant from the claim to the overlay registry, validates every record of a batch before publishing any, produces each record on tenant-<slug>.<canonical topic> with its own delivery callback and answers 202 only when every record is confirmed. It holds no store, claim or lease, and every bound, the exact topics and the Kafka limits are overlay values.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn25547-ac1
  statement: 'lab JWKS verification: a token signed by the lab test key with audience exactly `gateway-attach`, the lab issuer and tenant claims is accepted; another key, a second audience, the broker audience, a wrong issuer or an expired `exp` is refused 401 with nothing published -- falsifier: `uv run pytest tests/nodes/node_gateway_batch_ingest_effect -k claims_lab_jwks` with the signature check disabled turns the other-key case red and with the issuer comparison removed turns the wrong-issuer case red'
  acceptance:
  - id: AC1
    statement: 'AC1: lab JWKS verification: a token signed by the lab test key with audience exactly `gateway-attach`, the lab issuer and tenant claims is accepted; another key, a second audience, the broker audience, a wrong issuer or an expired `exp` is refused 401 with nothing published -- falsifier: `uv run pytest tests/nodes/node_gateway_batch_ingest_effect -k claims_lab_jwks` with the signature check disabled turns the other-key case red and with the issuer comparison removed turns the wrong-issuer case red'
- id: req-omn25547-ac2
  statement: 'tenant binding: a token for `T2` signed with slug `a` bound to `T1` is refused `tenant-binding-mismatch` (403) with publisher call count 0, and an unknown id, a slug mismatch and a reused slug are refused the same way; the overlay load refuses a registry repeating a `tenant_id` or a `tenant_slug` -- falsifier: `pytest ... -k tenant_binding` with the binding check removed turns the `T2` case red, and with the check comparing slug only turns the unknown-id case red'
  acceptance:
  - id: AC2
    statement: 'AC2: tenant binding: a token for `T2` signed with slug `a` bound to `T1` is refused `tenant-binding-mismatch` (403) with publisher call count 0, and an unknown id, a slug mismatch and a reused slug are refused the same way; the overlay load refuses a registry repeating a `tenant_id` or a `tenant_slug` -- falsifier: `pytest ... -k tenant_binding` with the binding check removed turns the `T2` case red, and with the check comparing slug only turns the unknown-id case red'
- id: req-omn25547-ac3
  statement: 'tenant slugs are never reused: a retired tenant''s token is refused `tenant-retired`, a later tenant carrying the retired slug is refused `tenant-binding-mismatch`, and the load refuses a registry that reuses a retired slug or rebinds a retired id -- falsifier: `pytest ... -k slug_reuse` with the retired row dropped from the load check turns the load case red, and with the retired status ignored at admission turns the `T1` case red'
