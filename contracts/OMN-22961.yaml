schema_version: 1.0.0
ticket_id: OMN-22961
title: "Piece 12's first task: the J11 join test: a runtime-affecting merge's PASS receipt is consumed by dispatch and a lane starts from a dispatch record on a node the deploy installed"
summary: The lane dispatch effect node gains a J11 join handler. For one merge it reads the lab pass receipts of the exact merged sha through an injected receipt source and, only when a PASS receipt on the required lane finished between the merge and the judging time, sends the one dispatch spec through the existing dispatch effect. A lane counts as started only on the effect's lane-matched placement acknowledgement, and it starts from the content-addressed job record the effect writes. A receipt that is missing, a FAIL, unreadable, for another sha or lane, or older than the merge starts nothing, and the dispatch effect never runs a command or writes a record. A merge that is not runtime-affecting is exempt. The join reasons are the node contract's join_j11 section. The join test also reads the started lane back through the dispatch reading, and a lane with no dispatch record is named by that reading. The running wiring on the dev bus is not part of this change.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn22961-j11-join
  statement: A runtime-affecting merge's PASS receipt is consumed by dispatch and a lane starts from a dispatch record, with a golden and an error case.
  acceptance:
  - id: AC1
    statement: "AC1: golden join test: a PASS receipt is consumed and a lane starts from a dispatch record -- falsifier: uv run pytest tests/integration/test_join_j11.py -q -k golden"
  - id: AC2
    statement: "AC2: error join test: a lane with no dispatch record is named by the reading and a missing receipt starts nothing -- falsifier: uv run pytest tests/integration/test_join_j11.py -q -k error"
