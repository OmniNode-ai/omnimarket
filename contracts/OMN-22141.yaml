schema_version: 1.0.0
ticket_id: OMN-22141
title: The omnimarket lab host row model accepts fallback_targets, so lab placement reads the host table that the launcher's fallback_targets change merged
summary: ModelLabHostRow gains fallback_targets (a tuple of nonempty names, empty by default, none equal to the row's target, none repeated); every reader that validates the lab host table through the row model accepts the recorded h101 and h053 rows again.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn22141-lab-host-fallback-targets
  statement: A lab host table whose rows carry fallback_targets is refused whole by every reader that validates it through ModelLabHostRow, so lab placement refuses every unit with could_not_check.
  acceptance:
  - id: AC1
    statement: 'AC1: ModelLabHostRow accepts fallback_targets as a tuple of nonempty names, defaulting to empty, and rejects a list that repeats target or itself with the same rule as the launcher _fallback_targets -- falsifier: uv run pytest tests/ -q -k fallback_targets in omnimarket'
  - id: AC2
    statement: 'AC2: a regression test built from the recorded table (the h101 and h053 rows of the launcher lab_run_hosts.yaml at a2ad7d0d, copied as a fixture) fails on the model without the field and passes with it -- falsifier: uv run pytest tests/ -q -k lab_host_table_fallback_targets'
  - id: AC3
    statement: 'AC3: every other omnimarket or core reader that validates lab host rows with extra="forbid" is listed in the PR and either accepts the field or is shown not to read it -- falsifier: uv run pytest tests/ -q -k lab_placement'
evidence_requirements:
- kind: tests
  description: The fallback_targets suite and the lab work placement suites.
  command: uv run pytest tests/unit/lab_work -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn22141-ac1
  description: AC1 the row model accepts, defaults and refuses fallback_targets by the launcher's rule (the target itself, a repeated name, an empty name).
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/lab_work/test_lab_host_table_fallback_targets.py -q --no-cov --tb=line -k fallback_targets
    cwd: .
- id: dod-omn22141-ac2
  description: AC2 the recorded h101 and h053 rows validate through the table model the placement reader loads.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/lab_work/test_lab_host_table_fallback_targets.py -q --no-cov --tb=line -k lab_host_table_fallback_targets
    cwd: .
- id: dod-omn22141-ac3
  description: AC3 lab placement places a unit on a host whose row carries fallback_targets; the PR body lists the other readers and the command that showed each accepts the field.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/lab_work -q --no-cov --tb=line -k lab_placement
    cwd: .
- id: dod-omn22141-deploy-probe
  description: 'Deploy probe: the row model GitHub serves at the checked-out commit declares fallback_targets, which the merge base does not.'
  source: manual
  checks:
  - check_type: command
    check_value: |-
      bash -o pipefail -c 'gh api "repos/OmniNode-ai/omnimarket/contents/src/omnimarket/models/overlay_keys/model_overlay_documents.py?ref=$(git rev-parse HEAD)" --jq .content | base64 -d | grep -F "fallback_targets: tuple" > /dev/null'
    cwd: .
- id: dod-omn22141-integration-proof
  description: The pushed head ran the fallback_targets suite on a lab host through the bus and exited 0. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: |-
      uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane fix-lab-host-model-1102 -- uv run --frozen pytest tests/unit/lab_work/test_lab_host_table_fallback_targets.py -q --no-cov
    cwd: .
