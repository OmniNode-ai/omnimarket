schema_version: 1.0.0
ticket_id: OMN-24440
title: Lab alarm node gains the lane-drift, container-unhealthy, lab-pass-receipt and stale-indeterminate conditions, each on its own schedule
summary: Four conditions of the retired alarm script become verbs of node_lab_alarm with every bound and name in the overlay, alarm delivery through the node's declared publisher, one declared schedule per condition, and the census helpers moved from the old repository with parity tests. container_restarts stays with its own change.
is_seam_ticket: true
interface_change: true
interfaces_touched:
- topics
- public_api
requirements:
- id: req-omn-24440-lab-alarm-four-conditions
  statement: node_lab_alarm reads the lane census snapshot, the lab-pass receipt of the sha the lane runs and the run records of its other conditions on declared schedules, and alarms through the declared delivery.
  acceptance:
  - id: AC1
    statement: 'AC1: the lane_drift and container_unhealthy verbs of node_lab_alarm each read OK, ALARM or INDETERMINATE from one injected lane census snapshot, and the census helpers moved from the old repository give the old copies'' answers -- falsifier: uv run pytest tests/nodes/node_lab_alarm -q --no-cov -k "census and (golden_chain or parity)"'
  - id: AC2
    statement: 'AC2: the lab_pass_receipt verb reads ALARM for a failed receipt of the sha the lane runs and INDETERMINATE for an unresolved sha or an absent, stale or malformed receipt, never an exception -- falsifier: uv run pytest tests/nodes/node_lab_alarm -q --no-cov -k "lab_pass_receipt and (golden_chain or error_chain)"'
  - id: AC3
    statement: 'AC3: the stale_indeterminate verb alarms only after the overlay-declared number of consecutive INDETERMINATE runs of another verb, so removing the verb or the bound turns the test red -- falsifier: uv run pytest tests/nodes/node_lab_alarm -q --no-cov -k "stale_indeterminate and failing_control"'
  - id: AC4
    statement: 'AC4: every bound and name sits in the overlay, each condition declares its own schedule, and a seam test fails when either side of condition, alarm row or alert publisher changes shape -- falsifier: uv run pytest tests/nodes/node_lab_alarm tests/nodes/node_lab_alarm_scheduled_effect -q --no-cov -k seam'
  - id: AC5
    statement: 'AC5: integrated: on the dev runtime one alarm row for a harmlessly triggered condition is read on the bus and one delivery reaches the alerts channel through the declared publisher -- falsifier: the lab receipt names the host, the revision running, the topic offset of the row and the delivery key'
evidence_requirements:
- kind: tests
  description: Golden chain, error chain, failing control and seam tests of the four condition verbs, the census parity test and the per-condition schedules
  command: uv run --frozen pytest tests/nodes/node_lab_alarm -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn-24440-tests
  description: AC1 to AC4 proven by the named tests; AC5 is read on the dev runtime after the declared install and named in the pull request.
  source: manual
  binds_ac:
  - AC1
  - AC2
  - AC3
  - AC4
  - AC5
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_lab_alarm -q --no-cov
    cwd: .
- id: dod-omn-24440-deploy-conditions
  description: 'Deploy probe the hosted runner can run: the node contract at the checked-out commit declares the lane-drift verb topic; the line does not exist at the merge base, so the probe fails there.'
  source: manual
  checks:
  - check_type: command
    check_value: bash -o pipefail -c 'gh api "repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_lab_alarm/contract.yaml?ref=$(git rev-parse HEAD)" --jq .content | base64 -d | grep -F "lane_drift_requested" > /dev/null'
    cwd: .
- id: dod-omn-24440-integration-proof
  description: The change is run on a lab host at the pushed head and the reading is named in the pull request; AC5's dev-runtime and delivery reading is taken after the declared install and named there.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane alarm-five-6803 -- uv run --frozen pytest tests/nodes/node_lab_alarm -q --no-cov
    cwd: .
