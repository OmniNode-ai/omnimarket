schema_version: 1.0.0
ticket_id: OMN-24326
title: Read the h053 runner groups through the GitHub write node instead of the app's own token
summary: 'The hourly runner group exposure reading on h053 could not read the organization''s runner group with its own App token (org-read-denied: the App lacks the organization self-hosted runners read permission, which only an operator can grant on GitHub''s settings page). The GitHub write node, whose App already holds organization runner access, gains one read operation, runner_group_get (verb onex scm runner-group-get --group-id), limited to the (organization, group id) pairs its overlay''s runner_group_reads names, and the exposure source''s overlay gains group_read: with it the group''s settings and repositories are read through the write node over the bus and the source makes no organization call with its own token. The unit''s workflow-file and run reads still use its own minted token.'
is_seam_ticket: true
interface_change: true
interfaces_touched:
- topics
- events
- public_api
requirements:
- id: req-omn24326-group-read-through-write-node
  statement: The runner group exposure source reads the group through the GitHub write node over the bus when its overlay declares it, and the write node serves that read only for overlay-named groups.
  acceptance:
  - id: AC1
    statement: 'AC1: the write node answers a runner_group_get request for an organization and group named in its overlay with the group''s settings and repositories, and refuses any other organization or group before any GitHub call -- falsifier: uv run --frozen pytest tests/unit/nodes/node_github_repo_write_effect/test_handler_runner_group_get.py -q -n 0 -p no:randomly fails when the overlay check is removed'
  - id: AC2
    statement: 'AC2: the exposure probe''s runner group read goes through the write node over the bus when the overlay declares it, and never makes the organization group call with its own app token -- falsifier: uv run --frozen pytest tests/nodes/node_runner_group_exposure_effect/test_bus_group_read.py -q -n 0 -p no:randomly fails when the source reads the group directly'
  - id: AC3
    statement: 'AC3: the verb table, the contract operations and the gh shim table agree on runner-group-get -- falsifier: uv run --frozen pytest tests/ci/test_scm_operation_table_omn20912.py tests/ci/test_gh_shim_coverage_table_omn20914.py -q -n 0 -p no:randomly fails when a verb, field or refusal code changes shape on either side'
  - id: AC4
    statement: 'AC4: integrated: the h053 hourly exposure unit''s next run reads the runner group through the write node with no org-read-denied reading -- falsifier: the unit''s reading row on the ledger after the install shows a verdict other than UNKNOWN with no org-read-denied reason'
evidence_requirements:
- kind: tests
  description: The write node's runner group tests, the exposure node's bus group read tests, the chain and seam tests, the operation table and the gh shim coverage table at the pushed head; they fail at origin/dev where the operation and the group_read setting do not exist.
  command: env -u PYTHONPATH uv run --frozen pytest tests/unit/nodes/node_github_repo_write_effect/test_handler_runner_group_get.py tests/nodes/node_runner_group_exposure_effect tests/test_golden_chain_github_repo_write_effect.py tests/unit/handlers/scm tests/ci/test_scm_operation_table_omn20912.py tests/ci/test_gh_shim_coverage_table_omn20914.py -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24326-ac1-write-node
  description: 'The write node''s runner group handler tests: a named group is read with its repositories (paged), a group or organization the overlay does not name sends nothing, runner_removals alone do not allow a group read, a body without the exposure fields is refused, dry_run plans only the group read.'
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/nodes/node_github_repo_write_effect/test_handler_runner_group_get.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24326-ac2-exposure-source
  description: 'The exposure node''s bus group read tests: golden chain through the write node''s real handler while the fixture refuses every organization call, error chains (node unreachable, refusal, github denial, older shape, another group), and the failing control with group_read null reading org-read-denied.'
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_runner_group_exposure_effect -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24326-ac3-chain-and-seams
  description: The write node's golden and error chain legs, the CLI seam tests on the in-memory bus, the scm verb tests, the operation table and the gh shim coverage table.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/test_golden_chain_github_repo_write_effect.py tests/unit/handlers/scm/test_scm_write_seam_shapes.py tests/unit/handlers/scm/test_onex_scm_command.py tests/ci/test_scm_operation_table_omn20912.py tests/ci/test_gh_shim_coverage_table_omn20914.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24326-ac4-verb-readback
  description: The runner-group-get verb tests on a hosted runner; they fail at the merge base, where the verb and the operation do not exist. The running-runtime reading (the h053 unit's reading row after the install, and onex scm runner-group-get on the dev lane once the write node revision runs there) is read from the lab receipt comment on the ticket.
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/handlers/scm/test_onex_scm_command.py -k runner_group -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24326-ac4-integration-proof
  description: 'The pushed head ran the focused runner group tests on a lab host through the lab work runner and exited 0. It binds no acceptance criterion: the runtime reading (AC4) is read on h053 after the unit is reinstalled from the branch.'
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24326 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/nodes/node_github_repo_write_effect/test_handler_runner_group_get.py tests/nodes/node_runner_group_exposure_effect/test_bus_group_read.py -q --no-cov -n 0 -p no:randomly
    cwd: .
