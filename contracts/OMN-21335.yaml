schema_version: "1.0.0"
ticket_id: "OMN-21335"
title: "TA.15b: the Claude Code adapter template renders a session.compact row for the manual trigger only"
summary: "The binding render refuses any session.compact row whose trigger is not manual (the auto trigger stays unbound), renders the manual row as a trigger matcher, and the adapter contract's client_bindings.claude_code section now carries the manual compaction row, so claude_code_binding_install has a rendered row to install and read back."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-omn21335-compact-binding-row"
    statement: "The adapter template expresses /compact as a manual-only session.compact row, and the install effect installs and reads it back."
    acceptance:
      - id: "AC1"
        statement: "AC1: the adapter template renders a session.compact row for the manual trigger only, and the auto trigger stays unbound -- falsifier: `uv run pytest tests -q -k adapter_template_compact_binding`, which selects no test at the merge base."
      - id: "AC2"
        statement: "AC2: claude_code_binding_install on a lab host installs the rendered row and reads it back -- falsifier: `onex skill claude_code_binding_install` on a lab host followed by its readback lists session.compact."
evidence_requirements:
  - kind: "tests"
    description: "The adapter template compact binding tests pass; none exists at the merge base."
    command: "uv run pytest tests/nodes/node_claude_code_hook_adapter_effect/test_adapter_template_compact_binding.py -q --no-cov -k adapter_template_compact_binding"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn21335-ac1-template-tests"
    description: "AC1: a manual session.compact row renders as a trigger matcher, an auto, absent or other trigger and an additive kind are refused, the render is byte-identical and free of branching, and the shipped contract row is manual only. The selector matches no test at the merge base."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_claude_code_hook_adapter_effect/test_adapter_template_compact_binding.py -q --no-cov -k adapter_template_compact_binding"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC1"]
  - id: "dod-omn21335-ac1-selectors-name-a-file"
    description: "AC1: every pytest check this contract binds names the existing compact-binding test file, AC2 is bound to its install tests, and the command-only deploy probe binds no criterion, so the repo evidence guards accept the contract. Fails at the merge base, where AC1 named a bare directory and AC2 named no test."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_contract_evidence_selector_names_file_omn17427.py -q -p no:randomly -k omn21335_compact_binding_checks_name_the_test_file_and_bind_tests"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC1"]
  - id: "dod-omn21335-ac2-install-readback"
    description: "AC2, hosted-runner form: install the shipped contract row through the install effect in process into a temporary mods folder, read the install record back from disk and require session.compact with the manual matcher, installed bytes equal to the render, and no auto row in the contract; then require the install of an auto row to be refused with no module written. The lab-host form is the skill run recorded in the PR body. At the merge base the contract holds no row, so the first assertion fails."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: |
          set -eu;
          probe_dir="$(mktemp -d)";
          trap 'rm -rf "$probe_dir"' EXIT;
          export PYTHONDONTWRITEBYTECODE=1;
          uv run --locked python - "$probe_dir" <<'PY'
          import json
          import sys
          from pathlib import Path
          from omnimarket.models.claude_code_binding import EnumClientMaxMode
          from omnimarket.nodes.node_claude_code_binding_install_effect.handlers import handler_binding_install as hbi
          from omnimarket.nodes.node_claude_code_binding_install_effect.models import ModelBindingInstallRequest
          from omnimarket.nodes.node_claude_code_hook_adapter_effect.binding_render_error import BindingRenderError
          from omnimarket.nodes.node_claude_code_hook_adapter_effect.handlers.handler_client_bindings_loader import load_client_section
          root = Path(sys.argv[1])
          hbi._inside_a_work_tree = lambda path: False
          bindings = load_client_section().bindings
          assert [b.hook_event for b in bindings] == ["session.compact"], bindings
          assert all(b.matcher_tool == "manual" for b in bindings), bindings
          def request(rows, name):
              return ModelBindingInstallRequest(bindings=tuple(rows), max_mode=EnumClientMaxMode.OBSERVE, mods_dir=str(root / name / "mods"), settings_path=str(root / name / "settings.json"), supported_probe_rows=("P0", "P6", "P11a", "P13", "P14"))
          result = hbi.HandlerClaudeCodeBindingInstall().handle(request(bindings, "manual"))
          record = json.loads((Path(result.module_path).parents[1] / "install_record.json").read_text())
          assert {"event": "session.compact", "matcher": "manual"} in record["events"], record
          assert result.installed_sha256 == result.render_sha256, result
          auto = [bindings[0].model_copy(update={"matcher_tool": "auto"})]
          try:
              hbi.HandlerClaudeCodeBindingInstall().handle(request(auto, "auto"))
              raise SystemExit("auto trigger was installed")
          except BindingRenderError:
              pass
          assert not list((root / "auto").rglob("register.ts"))
          print(json.dumps({"events": record["events"], "sha256": result.installed_sha256}))
          PY
        cwd: "${OMNI_HOME}/omnimarket"
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_claude_code_hook_adapter_effect/test_adapter_template_compact_binding.py -q --no-cov -k install"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC2"]
  - id: "dod-omn21335-deploy-render-runtime"
    description: "Hosted deploy smoke: dispatch the packaged binding-render node through the in-process ONEX runtime using the shipped adapter row. Require a successful typed receipt, the manual session.compact matcher with no auto matcher, and a module hash matching its bytes. The merge-base adapter has no compact row. This runs without a deployed lane or external services; install readback is covered separately by AC2."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_claude_code_hook_adapter_effect/test_adapter_template_compact_binding.py -q --no-cov"
        cwd: "${OMNI_HOME}/omnimarket"
      - check_type: "command"
        check_value: |
          set -eu;
          export PYTHONDONTWRITEBYTECODE=1;
          export COMPOSE_PROJECT_NAME=landing-l15834-lab;
          probe_dir="$(mktemp -d)";
          trap 'rm -rf "$probe_dir"' EXIT;
          runtime_bin="$(uv run --locked python -c 'import sys; from pathlib import Path; print(Path(sys.executable).parent)')";
          uv run --locked python -c '
          import sys
          from pathlib import Path
          from omnimarket.models.claude_code_binding import EnumClientMaxMode, ModelBindingRenderRequest
          from omnimarket.nodes.node_claude_code_hook_adapter_effect.handlers.handler_client_bindings_loader import load_client_section
          bindings = load_client_section().bindings
          assert len(bindings) == 1 and bindings[0].hook_event == "session.compact" and bindings[0].matcher_tool == "manual", bindings
          request = ModelBindingRenderRequest(bindings=bindings, max_mode=EnumClientMaxMode.OBSERVE)
          Path(sys.argv[1]).write_text(request.model_dump_json())
          ' "$probe_dir/input.json";
          env ONEX_LANE=omn21335-deploy-probe "$runtime_bin/onex" node node_claude_code_binding_render_compute --input "$probe_dir/input.json" --state-root "$probe_dir/state" --backend event_bus=inmemory --timeout 30 --output receipt --omnibase-path "$PWD" > "$probe_dir/receipt.json";
          uv run --locked python -c '
          import hashlib
          import json
          import sys
          from pathlib import Path
          receipt = json.loads(Path(sys.argv[1]).read_text())
          assert receipt["status"] == "success" and receipt["exit_code"] == 0, receipt
          result = receipt["result"]
          assert "on(\"session.compact\", { trigger: \"manual\" }" in result["module_text"], result
          assert "{ trigger: \"auto\" }" not in result["module_text"], result
          assert hashlib.sha256(result["module_text"].encode()).hexdigest() == result["module_sha256"], result
          print(json.dumps({"run_id": receipt["run_id"], "sha256": result["module_sha256"], "manual_compact": True}))
          ' "$probe_dir/receipt.json";
        cwd: "${OMNI_HOME}/omnimarket"
