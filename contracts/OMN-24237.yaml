schema_version: 1.0.0
ticket_id: OMN-24237
title: A dedicated development-only service account for creating test logins (step)
summary: "Adds node_dev_keycloak_client_effect: on the dev lane only, it reads the Keycloak bootstrap admin credential from the host env file the overlay names, generates the client secret into the secret store through the secret store node's generate_key operation (a new declared key, dev_keycloak_client_secret), creates or updates one confidential service-account client in the dev realm, grants it exactly the allowed realm-management roles (manage-users, view-users, declared in the contract's dev_only block) on its service account and its scope, and proves it with a client_credentials token request (status only). A lane, realm or role the contract does not declare is refused before any credential read or network call; a missing bootstrap credential is a typed result naming the file and variable names and makes no network call. The result carries names, ids and a status code only."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24237-dev-keycloak-client
  statement: The dev Keycloak service client step refuses non-dev lanes, realms and roles, ensures the one least-privilege client, never exposes a secret, and types every failure.
  acceptance:
  - id: AC1
    statement: 'AC1: the step refuses a lane, a sign-in realm or a role that its contract does not declare for development, before any credential read or network call -- falsifier: pytest tests/nodes/node_dev_keycloak_client_effect/test_dev_only_guard.py -q fails when the guard is removed'
  - id: AC2
    statement: 'AC2: a full run creates or updates the one confidential service account holding only the two user-management roles, stores a generated secret for it, proves it with a token request, and no secret or token appears in the result, its text form or the logs -- falsifier: pytest tests/nodes/node_dev_keycloak_client_effect/test_golden_chain_dev_keycloak_client.py -q fails when the secret is added to the result detail'
  - id: AC3
    statement: 'AC3: every failure is a typed result, and a missing bootstrap credential names the file and variable names it expects and makes no network call -- falsifier: pytest tests/nodes/node_dev_keycloak_client_effect/test_error_chain_dev_keycloak_client.py -q fails when the missing-credential result drops the expected name'
  - id: AC4
    statement: 'AC4: the generated secret key the overlay names is the one the secret store node declares, and the requests the step sends are the ones the sign-in service accepts -- falsifier: pytest tests/nodes/node_dev_keycloak_client_effect/test_seam_generated_client_secret_key.py tests/nodes/node_dev_keycloak_client_effect/test_seam_wire_shapes.py -q fail when the key is renamed or a request field is renamed'
  - id: AC5
    statement: 'AC5: integrated: on the development runtime one run of the step ends ensured and a client-credentials token request for the account answers 200 (status only) -- falsifier: before the step has run on the development host the same token request answers 401'
evidence_requirements:
- kind: tests
  description: 'The node focused tests at the pushed head. The failing controls are the removed dev guard, a secret added to the result detail, a renamed generated key and a renamed request field.'
  command: uv run --frozen pytest tests/nodes/node_dev_keycloak_client_effect -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
