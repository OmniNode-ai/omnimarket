schema_version: 1.0.0
ticket_id: OMN-22862
title: The merged-and-running count skips the ledger roll header
summary: A ledger roll leaves an HTML comment line and a blockquote line quoting a CLAIM row. The merged-and-running count read the quoted line as a row and raised ValueError. Lines starting with > are now skipped, as lines starting with the HTML comment marker already were.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn22862-roll-header
  statement: A ledger roll header in the live ledger or an archive leaves the merged-and-running count unchanged and raises nothing.
  acceptance:
  - id: AC1
    statement: 'AC1: a roll header (HTML comment plus a quoted CLAIM) leaves the count unchanged and does not raise, with a failing control on dev -- falsifier: the three new tests in tests/nodes/node_merged_running_count_effect fail with ValueError with source_local_files.py taken from origin/dev'
evidence_requirements:
- kind: tests
  description: The roll header golden and error chain tests of the merged-and-running count.
  command: uv run --frozen pytest tests/nodes/node_merged_running_count_effect -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn22862-ac1
  description: The roll header tests for the merged-and-running count pass on the branch and fail with ValueError on the dev source.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_merged_running_count_effect/test_effect_merged_running_count.py -q --no-cov
- id: dod-omn22862-integration-proof
  description: Run the merged-and-running count tests on a lab host at the pushed head. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-22862 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_merged_running_count_effect -q --no-cov
