schema_version: "1.0.0"
ticket_id: "OMN-22174"
title: "The host installer installs a declared set of lab-host public keys on every pool host"
summary: "node_lab_host_key_distribution_effect gains an install_declared_keys operation (onex-host-key-distribution --declared-keys). It reads the declared public key lines from the lab_host_public_keys overlay under ONEX_SKILL_OVERLAY_ROOTS, and ensures each in authorized_keys on every available host of the lab host table (or the named hosts), only when absent, so a second run changes nothing. An unavailable host is reported as skipped with the table's reason; a host it cannot reach is a refusal with the transport's text. The result lines hold counts and host names only: no key text and no address. No public file holds key text or a host address."
is_seam_ticket: false
interface_change: true
interfaces_touched:
  - "public_api"
requirements:
  - id: "req-omn22174-declared-key-install"
    statement: |-
      Every pool host carries every declared lab-host public key in authorized_keys after one run of the node, a second run changes nothing, and a lane on h051 or h053 reaches the hosts that need it over ssh without a prompt.
    acceptance:
      - id: "AC1"
        statement: "AC1: a test shows the installer writes every declared public key from a fixture overlay into authorized_keys on each fixture pool host and a second run changes nothing -- falsifier: uv run pytest -k lab_host_public_keys_idempotent"
      - id: "AC2"
        statement: "AC2: the declared key set lives in an overlay and no public file holds key text or host addresses -- falsifier: uv run pytest -k lab_host_public_keys_overlay_only"
      - id: "AC3"
        statement: "AC3: from h051 and from h053, ssh as jonah to the lab hosts h105 and h106 (the two lab-network hosts whose addresses end in 105 and 106; the addresses are in the private host table, not in this file) succeeds non-interactively -- falsifier: ssh -o BatchMode=yes jonah@<each host's target from the host table> true, run from each of h051 and h053, exit 0 for all four"
      - id: "AC4"
        statement: "AC4: the installer change is deployed from its branch and run once on every pool host, shown by its receipt naming each host as ok -- falsifier: the run receipt lists every pool host row as ok"
evidence_requirements:
  - kind: "tests"
    description: "The install, dry-run, refusal, scope, overlay-only and no-literal cases of the node."
    command: "uv run pytest tests/nodes/node_lab_host_key_distribution_effect -q --no-cov"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn22174-idempotent"
    description: "The installer writes every declared key from a fixture overlay into authorized_keys on each available fixture host through a fake transport, skips an unavailable host, and a second run adds nothing."
    source: "manual"
    binds_ac: ["AC1"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_lab_host_key_distribution_effect -q --no-cov -k lab_host_public_keys_idempotent"
        cwd: "."
  - id: "dod-omn22174-overlay-only"
    description: "The key set is read only from the lab_host_public_keys overlay (absent overlay refuses by name, malformed overlay refuses without echoing a value), and a scan of the node package finds no key text and no IPv4 address."
    source: "manual"
    binds_ac: ["AC2"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_lab_host_key_distribution_effect -q --no-cov -k lab_host_public_keys_overlay_only"
        cwd: "."
  - id: "dod-omn22174-deploy-local-runtime"
    description: "Hosted-runner smoke invokes the packaged node's command line with --declared-keys against a host table and an empty overlay root, and asserts exit code 2 with a refusal that names the lab_host_public_keys overlay and no host touched. It needs no lab network and does not assert a live rollout."
    source: "manual"
    binds_ac: ["AC4"]
    checks:
      - check_type: "command"
        check_value: |-
          set -eu;
          probe_dir="$(mktemp -d)";
          trap 'rm -rf "$probe_dir"' EXIT;
          mkdir "$probe_dir/empty";
          python -c 'import json, sys; from pathlib import Path; Path(sys.argv[1]).write_text(json.dumps({"hosts": [{"name": "probe-a", "target": "a.example.invalid"}]}))' "$probe_dir/table.yaml";
          rc=0;
          ONEX_SKILL_OVERLAY_ROOTS="$probe_dir/empty" uv run --frozen onex-host-key-distribution --declared-keys --table "$probe_dir/table.yaml" --dry-run > "$probe_dir/out.txt" 2> "$probe_dir/err.txt" || rc=$?;
          test "$rc" = 2;
          grep -q 'lab_host_public_keys' "$probe_dir/err.txt";
          test ! -s "$probe_dir/out.txt";
          echo '{"probe": "lab_host_public_keys_missing_overlay_refusal", "exit_code": 2}'
        cwd: "."
  - id: "dod-omn22174-lab-ssh"
    description: "From h051 and from h053, ssh as jonah to the two named lab hosts succeeds non-interactively. Needs the lab network and the private host table, so only the local Done gate runs it; it takes its targets from the lab host table at run time, not from this file."
    source: "manual"
    execution_scope: "local_done_gate"
    checks:
      - check_type: "command"
        check_value: |-
          set -eu;
          for src in h051 h053; do for dst in h105 h106; do
            target="$(uv run --frozen python -c 'import sys; from omnimarket.handlers.overlay_keys import resolve_lab_hosts_table; print(next(h.target for h in resolve_lab_hosts_table().hosts if h.name == sys.argv[1]))' "$dst")";
            ssh "$src" ssh -o BatchMode=yes "$target" true;
          done; done
        cwd: "."
  - id: "dod-omn22174-lab-run-receipt"
    description: "The install ran once from the pushed branch and its receipt names every pool host row as ok (an unavailable host row is skipped, with the table's reason). The lab receipt is recorded on the ticket and in the pull request."
    source: "manual"
    execution_scope: "local_done_gate"
    checks:
      - check_type: "command"
        check_value: |-
          uv run --frozen onex-host-key-distribution --declared-keys --dry-run | awk '$2 == "refused" {bad=1} END {exit bad}'
        cwd: "."
  - id: "dod-omn22174-ssh-transport"
    description: "Hosted behavioral support for AC3: the declared-key CLI invokes ssh with BatchMode=yes and the declared target, passes keys only on stdin, and runs the real append script through a synthetic SSH executable. This checks the non-interactive transport and authorized_keys writes, not live connectivity from h051 or h053; the unchanged local lab-ssh check above retains that probe."
    source: "manual"
    binds_ac: ["AC3"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run --frozen pytest tests/nodes/node_lab_host_key_distribution_effect/test_lab_host_public_keys_install.py -q --no-cov -k 'cli_installs_through_shell_transport and ssh'"
        cwd: "."
  - id: "dod-omn22174-cli-install-readback"
    description: "Hosted behavioral support for AC4: the packaged CLI loads a declared-key overlay and host table, runs its real local shell transport, and reads back the authorized_keys bytes and permissions. A dry run writes nothing, unavailable hosts are skipped, and a second run adds nothing. The local lab-run-receipt check above still probes the private pool; this check does not assert a live rollout."
    source: "manual"
    binds_ac: ["AC4"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run --frozen pytest tests/nodes/node_lab_host_key_distribution_effect/test_lab_host_public_keys_install.py -q --no-cov -k 'cli_installs_through_shell_transport and local'"
        cwd: "."
  - id: "dod-omn22174-integration-proof"
    description: "The pushed head ran the node's tests on a lab host and exited 0. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check."
    source: "manual"
    execution_scope: "local_done_gate"
    checks:
      - check_type: "command"
        check_value: uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-22174 -- uv run --frozen pytest tests/nodes/node_lab_host_key_distribution_effect -q --no-cov
        cwd: "."
