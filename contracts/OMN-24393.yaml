schema_version: 1.0.0
ticket_id: OMN-24393
title: Delegation history data for the floor Delegation tab
summary: 'The factory floor publish gains a delegation history step that writes one file, delegation-history.json: the models that do delegated work with their settings, per-day and per-hour success series with Wilson intervals over the last 14 days, and the experiments that ran several models on the same task, read from the lab projection, the routing overlay and the experiment reports of each lab host. A setting no overlay records is shown unrecorded; a source that cannot be read is named in the file.'
is_seam_ticket: true
interface_change: true
interfaces_touched:
- public_api
requirements:
- id: req-omn24393-delegation-history
  statement: The floor publish writes delegation-history.json from recorded sources only, with every unreadable source named.
  acceptance:
  - id: AC1
    statement: 'AC1: the history fold turns the projection''s attempts and latencies, the routing settings and the report tables into models, per-day and per-hour success series with Wilson intervals, and experiments, with an unrecorded setting left unrecorded -- falsifier: pytest tests/nodes/node_floor_delegation_history_compute -q'
  - id: AC2
    statement: 'AC2: a report''s arm table is read as written and a row whose correct exceeds n, a bound written as p<, or a count column is never turned into a number -- falsifier: pytest tests/nodes/node_floor_delegation_history_effect/test_report_tables.py -q'
  - id: AC3
    statement: 'AC3: the publish runs the history step beside the tracker and serves delegation-history.json, also on a refused cycle, and the node and the publish agree on the path -- falsifier: pytest tests/nodes/node_factory_floor_publish_effect/test_delegation_history_step.py -q'
  - id: AC4
    statement: 'AC4: integrated: after the merge and the next board publish, the delegation-history.json served on the h051 web host has models, series and experiments all filled and its sources all read -- falsifier: fetch the file from the h051 web host and read counts.models, counts.series and counts.experiments (any zero fails)'
evidence_requirements:
- kind: tests
  description: The delegation history compute, effect and publish step tests pass at the pushed head.
  command: uv run pytest tests/nodes/node_floor_delegation_history_compute tests/nodes/node_floor_delegation_history_effect tests/nodes/node_factory_floor_publish_effect/test_delegation_history_step.py -q -p no:randomly --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24393-ac1
  description: 'AC1: the fold builds models, series with Wilson intervals and experiments from the recorded sources; at the merge base the compute node does not exist.'
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_floor_delegation_history_compute -q -p no:randomly --no-cov
    cwd: .
- id: dod-omn24393-ac2
  description: 'AC2: the report importer reads a results table as written and refuses a correct count above n, a p bound and a count column mistaken for the result column.'
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_floor_delegation_history_effect/test_report_tables.py -q -p no:randomly --no-cov
    cwd: .
- id: dod-omn24393-ac3
  description: 'AC3: the publish contract holds the delegation_history step and the node agrees with it on the served path.'
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_factory_floor_publish_effect/test_delegation_history_step.py -q -p no:randomly --no-cov
    cwd: .
- id: dod-omn24393-ac4
  description: 'hosted proxy for AC4: the effect and publish tests pass here; the read of the served file on the h051 web host after the publish is posted as a pull request comment naming the head.'
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_floor_delegation_history_effect -q -p no:randomly --no-cov
    cwd: .
- id: dod-omn24393-integration-proof
  description: the delegation history tests run on a lab host at the pushed head; hosted CI cannot reach the lab, so only the local Done gate runs this unbound check
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24393 --kind test -- env PYTHONDONTWRITEBYTECODE=1
      uv run --frozen pytest tests/nodes/node_floor_delegation_history_compute tests/nodes/node_floor_delegation_history_effect tests/nodes/node_factory_floor_publish_effect/test_delegation_history_step.py -q --no-cov -p no:randomly
