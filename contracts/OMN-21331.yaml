    command: "! git grep -qE 'CANONICAL_FILE_SHAPE_CORE: .*[0-9a-f]{40}' -- .github/workflows && git grep -q 'CANONICAL_FILE_SHAPE_CORE: .*omnibase_core@dev-' -- .github/workflows"
