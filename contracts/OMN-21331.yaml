  commit sha. This pull request carries AC4 for omnimarket. AC2 (the job runs on pull requests and the merge
  queue and refuses a planted script) is already on the base, so no check of this pull request can fail
  there. AC1 is the validator change in omnibase_core and AC3 is a ruleset change per repository.
