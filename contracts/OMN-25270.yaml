schema_version: 1.0.0
ticket_id: OMN-25270
title: Make overlays PR 386 run where it belongs; one demand reaches node_lab_alarm_deliver_effect on the dev runtime on h201 and is handled, with a STATUS row
summary: 'node_lab_alarm_deliver_effect declared command topic onex.cmd.omnimarket.lab-alarm-delivery-requested.v1, runtime profile effects and an empty subscribe list, so the dev runtime on h201 (profile main) never attached it and no demand reached it. Its contract now declares the command topic as its subscribe topic, the completed event as its terminal event, its own broker grants and the main profile, and a handler with no required constructor parameter that builds the delivery from the node overlay on its first request.'
is_seam_ticket: false
interface_change: true
interfaces_touched:
- public_api
requirements:
- id: req-omn25270-bus-route
  statement: A command on the delivery node's declared command topic is attached by the runtime and handled, and the typed result is published on its terminal event.
  acceptance:
  - id: AC1
    statement: 'AC1: a STATUS row on the rolling ledger reads kv pr=overlays#386 installed=<host>:<revision> observed=<what ran> read_at=<UTC>, written after the run was read on the dev runtime on h201 -- falsifier: grep -F pr=overlays#386 on the ledger finds no row with installed='
  - id: AC2
    statement: 'AC2: the step is read done on the dev runtime on h201, or the STATUS row names the single measured cause and who must act -- falsifier: the runtime log and job record on h201 show no handled run and the STATUS row names no cause and no actor'
  - id: AC3
    statement: 'AC3: no host file, unit or plist was edited by hand; every change went through the declared installer, read from its receipt -- falsifier: the STATUS row cites no installer receipt'
evidence_requirements:
- kind: tests
  description: The node tests pass at the pushed head.
  command: uv run pytest tests/nodes/node_lab_alarm_deliver_effect -q -n 0 --no-cov -p no:cacheprovider
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
