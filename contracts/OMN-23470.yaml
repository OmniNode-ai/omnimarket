schema_version: 1.0.0
ticket_id: OMN-23470
title: The automatic work-filler's timer can start it in live mode with the live settings
summary: node_floor_fill_orchestrator's schedule install gains --profile (inmemory by default, or live). With live, the install validates the overlay's floor_fill_live section (a missing or unknown key refuses naming it and writes no unit), renders the section into the unit's overlay JSON and adds --profile live to the tick command. The default install renders the same unit as before.
is_seam_ticket: true
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23470-tick-unit-live-profile
  statement: The fill's tick unit installer renders the live profile and the floor_fill_live section when asked, refuses a bad live section by key name before writing any unit, and leaves the default unit unchanged.
  acceptance:
  - id: AC1
    statement: 'AC1: `schedule install --profile live` renders a tick unit whose command carries `--profile live` and whose overlay JSON carries the validated `floor_fill_live` section, and the default install renders the same unit as before -- falsifier: the new unit-render test fails at the merge base and fails when the section is dropped from the JSON'
  - id: AC2
    statement: 'AC2: a missing or unknown `floor_fill_live` key refuses the live install naming the key (exit 1) and writes no unit -- falsifier: remove one key from the test overlay and run the refusal test'
  - id: AC3
    statement: 'AC3: integrated: with the fill host''s tick unit installed in live mode from the merged revision through the node''s own `schedule install`, its next run on the lab host answers in live mode (a typed refusal naming the store or an unbound seam, or a decision row) and is read from the unit journal and the ledger -- falsifier: the unit''s exit and its journal line on the lab host'
evidence_requirements:
- kind: tests
  description: The live-profile unit render, refusal and runtime-acceptance tests, with the existing schedule tests as the unchanged-default control
  command: uv run --frozen pytest src/omnimarket/nodes/node_floor_fill_orchestrator/tests/test_floor_fill_schedule_live.py src/omnimarket/nodes/node_floor_fill_orchestrator/tests/test_floor_fill_schedule.py -q --no-cov -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23470-unit-render
  description: Dry-run install with --profile live renders a command ending --this-host H --profile live tick whose overlay JSON carries floor_fill_live, the installed unit equals the dry run, and the default install has no --profile word. At the merge base the installer refuses --profile as an unknown argument, so these tests fail there.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest src/omnimarket/nodes/node_floor_fill_orchestrator/tests/test_floor_fill_schedule_live.py -q --no-cov -p no:randomly -k "exec_carries or unchanged_by or installed_unit"
    cwd: .
- id: dod-omn23470-key-refusals
  description: Each floor_fill_live key removed in turn, and one unknown key, refuse the live install with exit 1 naming the key and write no unit directory.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest src/omnimarket/nodes/node_floor_fill_orchestrator/tests/test_floor_fill_schedule_live.py -q --no-cov -p no:randomly -k "missing_key or unknown_key"
    cwd: .
- id: dod-omn23470-words-accepted-by-runtime
  description: The rendered command words are accepted by the runtime module itself; with the store variable unset the live path prints the typed refusal naming the variable, the reading recorded before the store exists. At the merge base the test cannot render the live words, so it fails there.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest src/omnimarket/nodes/node_floor_fill_orchestrator/tests/test_floor_fill_schedule_live.py -q --no-cov -p no:randomly -k accepted_by_the_runtime
    cwd: .
- id: dod-omn23470-integration-proof-lab
  description: Runs the schedule tests at the pushed head on a lab host through the lab work runner. Hosted CI cannot reach the lab runner, so only the local Done gate runs this unbound item; the unit installed in live mode and its next run are recorded in the pull request's Lab line.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: 'env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23470 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest src/omnimarket/nodes/node_floor_fill_orchestrator/tests/test_floor_fill_schedule_live.py src/omnimarket/nodes/node_floor_fill_orchestrator/tests/test_floor_fill_schedule.py -q --no-cov -p no:randomly'
    cwd: .
