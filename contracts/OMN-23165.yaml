schema_version: 1.0.0
ticket_id: OMN-23165
title: When no model in the ladder answers, the delegation terminal names why in one word from a closed list, including a run that made no provider call
summary: A delegation run that ends returned_to_caller carries its reason as one word from a closed list of five (every_rung_failed, every_rung_rate_limited, no_rung_reachable, escalation_limit_reached, quality_veto), read from the whole attempt record rather than the last rung's open-set cause. A run that made no provider call and found no reachable rung ends returned_to_caller with no_rung_reachable, and the zero-attempt validator admits it.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23165-end-of-ladder-reason
  statement: The delegation terminal names why no model answered in one word from a closed list, including a run with no provider call.
  acceptance:
  - id: AC1
    statement: 'AC1: one fixture per reason gives that reason, cause returned_to_caller and exit 1 -- falsifier: uv run pytest tests/unit/delegation/test_end_of_ladder.py -q'
  - id: AC2
    statement: 'AC2: a zero-provider-call no_rung_reachable run ends returned_to_caller and not refused_before_dispatch -- falsifier: uv run pytest tests/unit/delegation/test_end_of_ladder.py -q -k zero_attempt'
