  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_floor_simple_effect/test_worklist_floor_simple.py -q --no-cov -k "control_the_lists_alone or ticket_rule_admits"
    cwd: .
- id: dod-omn23184-ac2
  description: The three classes are listed with owner states and the class row is red while any member is unowned -- proven by the named tests.
  source: manual
  binds_ac:
