schema_version: 1.0.0
ticket_id: OMN-26331
title: 'Ledger-file census group 3, slice: four group 3 files read and write the work ledger through the bus path, and their census rows are lowered'
summary: 'node_plans_today_effect, node_owner_summary_effect and node_patch_apply_dispatch_effect read a window of work-ledger rows through node_ledger_rows_loader_effect (the bus-fed reader node) instead of the plugin''s file reader and a ledger file path; node_patch_apply_dispatch_effect and node_private_hosted_minutes_watch_effect append their STATUS rows over the bus append path (onex work-ledger append) instead of a ledger file path. Four census rows drop (the owner-summary entrypoint, the plans-today handler, the patch-apply CLI and the minutes-watch handler) and the repository count goes from 186 to 179. The other nine group 3 files are left with their rows and the reason for each is in the lane report.'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn26331-rows-from-the-bus
    statement: The plans-today and owner-summary readers answer from the rows loader node, and an unanswered read is a refusal or a named error, never an empty window and never a file read.
    acceptance:
      - id: AC1
        statement: 'AC1: plans-today reads its window through the rows loader node with the plugin reader failing if it runs, and an unanswered read refuses -- falsifier: uv run pytest tests/nodes/node_plans_today_effect/test_plans_today_ledger_rows_bus.py tests/nodes/node_plans_today_effect/test_plans_today_member_identity.py -q --no-cov'
      - id: AC2
        statement: 'AC2: owner-summary facts ask the rows loader node for the window, name an unreadable window in the facts errors, and take no ledger path -- falsifier: uv run pytest tests/nodes/node_owner_summary_effect -q --no-cov -k "rows_loader or unreadable_source or cli_facts"'
      - id: AC3
        statement: 'AC3: patch-apply-dispatch reads its window through the rows loader, appends over the bus append path and starts its runner with no ledger path; the minutes watch appends its row over the bus append path with a day-stable request id and takes no ledger path -- falsifier: uv run pytest tests/test_golden_chain_patch_apply_dispatch_effect.py tests/test_golden_chain_private_hosted_minutes_watch_effect.py tests/unit/nodes/node_private_hosted_minutes_watch_effect tests/unit/handlers/test_ledger_append_via_node.py -q --no-cov'
      - id: AC4
        statement: 'AC4: the census exits 0 at count 179 with no hit in the owner-summary entrypoint, the plans-today handler, the patch-apply CLI and the minutes-watch handler, and the ratchet file lowers rows only -- falsifier: env ONEX_LEDGER_CENSUS_ROOT=. ONEX_LEDGER_CENSUS_OVERLAY=src/omnimarket/nodes/node_work_ledger_file_census_effect/overlay.example.yaml uv run python -m omnimarket.nodes.node_work_ledger_file_census_effect --ratchet-file src/omnimarket/nodes/node_work_ledger_file_census_effect/ratchet.yaml --repos omnimarket --directory omnimarket=. --per-file exits non-zero or prints a hit for any of the four files'
evidence_requirements:
  - kind: tests
    description: The four nodes' tests and the two shared helpers' tests at the pushed head.
    command: uv run pytest tests/nodes/node_plans_today_effect tests/nodes/node_owner_summary_effect tests/unit/handlers/test_ledger_rows_via_node.py tests/unit/handlers/test_ledger_append_via_node.py tests/test_golden_chain_patch_apply_dispatch_effect.py tests/test_golden_chain_private_hosted_minutes_watch_effect.py tests/unit/nodes/node_private_hosted_minutes_watch_effect -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn26331-ac1
    description: plans-today spawns the rows loader node for its reader name and refuses on an unanswered read. At the merge base the handler runs the plugin reader and refuses without the path variable, so this fails.
    source: manual
    binds_ac:
      - AC1
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/nodes/node_plans_today_effect/test_plans_today_ledger_rows_bus.py tests/nodes/node_plans_today_effect/test_plans_today_member_identity.py -q --no-cov --tb=line
        cwd: .
  - id: dod-omn26331-ac2
    description: owner-summary facts take their rows from the loader function the handler is given. At the merge base the handler takes no such function and the request names a path, so this fails.
    source: manual
    binds_ac:
      - AC2
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/nodes/node_owner_summary_effect -q --no-cov --tb=line -k "rows_loader or unreadable_source or cli_facts"
        cwd: .
  - id: dod-omn26331-ac3
    description: The patch-apply tick reads rows through the injected rows reader and starts the runner with no ledger path, and the minutes watch appends over the bus append path with no ledger path. At the merge base both nodes take a ledger path, so this fails.
    source: manual
    binds_ac:
      - AC3
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/test_golden_chain_patch_apply_dispatch_effect.py tests/test_golden_chain_private_hosted_minutes_watch_effect.py tests/unit/nodes/node_private_hosted_minutes_watch_effect tests/unit/handlers/test_ledger_append_via_node.py -q --no-cov --tb=line
        cwd: .
  - id: dod-omn26331-ac4
    description: The census passes at 179 with the four files cleared; at the merge base all four hold a hit and the count is 186.
    source: manual
    binds_ac:
      - AC4
    checks:
      - check_type: command
        check_value: "sh -c '! env ONEX_LEDGER_CENSUS_ROOT=. ONEX_LEDGER_CENSUS_OVERLAY=src/omnimarket/nodes/node_work_ledger_file_census_effect/overlay.example.yaml uv run python -m omnimarket.nodes.node_work_ledger_file_census_effect --ratchet-file src/omnimarket/nodes/node_work_ledger_file_census_effect/ratchet.yaml --repos omnimarket --directory omnimarket=. --per-file --verbose 2>&1 | grep -E \"nodes/node_owner_summary_effect/__main__|handlers/handler_plans_today|runtime_patch_apply_dispatch_cli|handlers/handler_private_hosted_minutes_watch\"'"
        cwd: .
      - check_type: command
        check_value: env ONEX_LEDGER_CENSUS_ROOT=. ONEX_LEDGER_CENSUS_OVERLAY=src/omnimarket/nodes/node_work_ledger_file_census_effect/overlay.example.yaml uv run python -m omnimarket.nodes.node_work_ledger_file_census_effect --ratchet-file src/omnimarket/nodes/node_work_ledger_file_census_effect/ratchet.yaml --repos omnimarket --directory omnimarket=. --per-file
        cwd: .

  - id: dod-omn26331-integration-proof
    description: 'Run the focused tests of the four changed nodes and the two shared helpers on a lab host at the pushed head; the local Done gate runs this unbound check.'
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-26331 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_plans_today_effect tests/nodes/node_owner_summary_effect tests/unit/handlers/test_ledger_rows_via_node.py tests/unit/handlers/test_ledger_append_via_node.py tests/test_golden_chain_patch_apply_dispatch_effect.py tests/test_golden_chain_private_hosted_minutes_watch_effect.py tests/unit/nodes/node_private_hosted_minutes_watch_effect -q --no-cov
        cwd: .
