---
schema_version: "1.0.0"
ticket_id: "OMN-17298"
title: "No projection relation ends the migration tree RLS-enabled with zero policies"
summary: "The ticket's remediation includes an audit of whether other projection relations share the shape of RLS enabled without any admitting policy. The existing internal-relation tenant-posture gate already replays the node migration tree to each relation's final posture; it now also refuses any relation whose final posture is row-level security enabled with zero policies. The audit over the live tree finds none, and the gate keeps it that way. This slice does not touch the dev-lane runtime reads in the ticket's two gaps."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-rls-enabled-requires-a-policy"
    statement: "A relation that ends the node migration tree with row-level security enabled and no policy is refused before merge, and the live tree holds none."
    acceptance:
      - id: "AC1"
        statement: "AC1: no relation in the node migration tree ends with row-level security enabled and zero policies -- falsifier: uv run python scripts/validation/check_internal_relation_tenant_posture.py exits non-zero and names a relation"
evidence_requirements:
  - kind: "tests"
    description: "The live tree passes the gate, the audit sees RLS-enabled relations at all (so a zero is not a parser miss), and a synthetic relation with RLS enabled and no policy is refused."
    command: "env -u PYTHONPATH uv run pytest tests/test_omn17298_rls_enabled_requires_policy.py -q"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn17298-audit-gate-tests"
    description: "The live node migration tree passes the gate; the audit is not vacuous; synthetic RLS-enabled relations with no policy, or whose policy a later migration dropped, are refused, and the same relations with a policy pass."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/test_omn17298_rls_enabled_requires_policy.py -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC1"]
  - id: "dod-omn17298-audit-gate-live-tree"
    description: "The gate script exits 0 over the live node migration tree."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: "uv run python scripts/validation/check_internal_relation_tenant_posture.py"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC1"]
  - id: "dod-omn17298-audit-deploy-smoke"
    description: "A disposable container runs the audit regressions from the checked-out source. The probe refuses a synthetic relation with RLS enabled and zero policies, accepts it with a policy, and checks the repository migration tree. The hosted runner needs Docker and the checkout; removing the refusal makes the tests fail."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: |-
          docker run --rm -v "${PWD}:/workspace:ro" -w /workspace -e UV_PROJECT_ENVIRONMENT=/tmp/audit-venv -e UV_CACHE_DIR=/tmp/uv-cache ghcr.io/astral-sh/uv@sha256:e5b65587bce7de595f299855d7385fe7fca39b8a74baa261ba1b7147afa78e58 uv run --frozen pytest tests/test_omn17298_rls_enabled_requires_policy.py -q -p no:cacheprovider --basetemp=/tmp/audit-tests
        cwd: "${OMNI_HOME}/omnimarket"
