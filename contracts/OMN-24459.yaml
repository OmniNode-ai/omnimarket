schema_version: 1.0.0
ticket_id: OMN-24459
title: A lane's wait ends when a message reaches it
summary: A new effect node, node_lane_inbox_wait_effect, is a wait a running lane calls instead of sleeping. It polls the lane's inbox through the work-ledger reader the lane inbox guard already uses and ends early, within one poll interval, with the binding rows when a message or hold addressed to the lane or to all lanes arrives, with a stop result when a stop order arrives, and as unreadable when the inbox cannot be read. Every interval, bound, row type and cell name is the overlay's.
is_seam_ticket: true
interface_change: true
interfaces_touched:
- topics
- public_api
requirements:
- id: req-omn24459-lane-inbox-wait
  statement: A lane that waits through node_lane_inbox_wait_effect learns of a binding message, a hold or a stop order within one poll interval instead of at its next turn.
  acceptance:
  - id: AC1
    statement: 'AC1: a message or hold addressed to the lane, or to all lanes, that arrives while the wait runs ends the wait within one poll interval and is returned with its sender and text -- falsifier: pytest tests/nodes/node_lane_inbox_wait_effect/test_lane_inbox_wait.py -q'
  - id: AC2
    statement: 'AC2: a message addressed to another lane, or older than the wait''s start, does not end the wait, and a wait with no message runs its full time -- falsifier: pytest tests/nodes/node_lane_inbox_wait_effect/test_lane_inbox_wait.py -k quiet -q'
  - id: AC3
    statement: 'AC3: a stop order addressed to the lane ends the wait with the stop result, and an unreadable inbox ends it as unreadable, never as quiet -- falsifier: pytest tests/nodes/node_lane_inbox_wait_effect/test_lane_inbox_wait.py -k "stop or unreadable" -q'
  - id: AC4
    statement: 'AC4: integrated: on a lab host a message written to the ledger for a lane that is inside a wait is returned within two minutes -- falsifier: run the wait on the lab host, append the message, and read the result; a result later than two minutes or a quiet timeout fails it'
evidence_requirements:
- kind: tests
  description: Golden chain, failing control and error tests of the lane inbox wait
  command: uv run --frozen pytest tests/nodes/node_lane_inbox_wait_effect -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24459-tests
  description: AC1 to AC3 proven by the named tests; AC4 is read on a lab host and named in the pull request.
  source: manual
  binds_ac:
  - AC1
  - AC2
  - AC3
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_lane_inbox_wait_effect -q --no-cov
    cwd: .
- id: dod-omn24459-deploy-conditions
  description: 'Deploy probe the hosted runner can run: the node contract at the checked-out commit declares the wait command topic; the line does not exist at the merge base, so the probe fails there.'
  source: manual
  checks:
  - check_type: command
    check_value: bash -o pipefail -c 'gh api "repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_lane_inbox_wait_effect/contract.yaml?ref=$(git rev-parse HEAD)" --jq .content | base64 -d | grep -F "lane-inbox-wait-requested" > /dev/null'
    cwd: .
- id: dod-omn24459-integration-proof
  description: The wait is run on a lab host at the pushed head against the dev ledger bus while a message is appended for the lane, and the reading is named in the pull request.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane why-process-6803 -- uv run --frozen pytest tests/nodes/node_lane_inbox_wait_effect -q --no-cov
    cwd: .
