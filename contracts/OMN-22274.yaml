    check_value: |-
      uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane rm-t2b-overlay-resolver-0330 -- uv run --frozen pytest tests/nodes/node_overlay_resolver_effect -q --no-cov
