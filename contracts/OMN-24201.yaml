schema_version: 1.0.0
ticket_id: OMN-24201
title: The card limit step's settings file names the message bus its command is sent on
summary: 'The settings model of node_gpu_power_caps_effect (ModelGpuPowerCapsOverlay) keeps extra=forbid and had no event_bus field, so a settings file carrying event_bus was refused and onex run-node,
  which reads event_bus from the node''s overlay, refused the node. The model gains an optional event_bus (ModelNodeEventBus, the shape omnimarket#6009 gave three other overlay models), the two lab_work example
  overlays carry the key, and a new test file holds the golden, the refusals and a failing control. Not in this change: the overlays repository entry and pin (its own pull request of this ticket) and the
  run through the running dev runtime (AC3).'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24201-event-bus
  statement: The GPU power caps overlay model accepts an optional event_bus and still refuses every other unknown key.
  acceptance:
  - id: AC1
    statement: 'AC1: the card limit step''s settings model accepts an optional bus entry of type kafka with a lane and refuses a kafka entry with no lane and any other unknown key -- falsifier: uv run
      pytest tests/unit/nodes/node_gpu_power_caps_effect -q -k event_bus fails at the merge base'
  - id: AC2
    statement: 'AC2: the shipped settings file of the card limit step in the overlays repository carries the bus entry kafka on the dev lane and loads through the model of the pinned revision -- falsifier:
      uv run pytest tests/test_node_gpu_power_caps_overlay.py -q -k event_bus fails at the merge base'
  - id: AC3
    statement: 'AC3: integrated: in the running dev runtime, onex run-node node_gpu_power_caps_effect for h201 and for h202 returns one row per card and nvidia-smi on both machines reads 450 W for the
      large card and 300 W for each of the other two cards -- falsifier: the result row differs from the nvidia-smi reading, or the run is refused'
evidence_requirements:
- kind: tests
  description: The GPU power caps node tests pass at the pushed head.
  command: uv run pytest tests/unit/nodes/node_gpu_power_caps_effect -q -p no:randomly --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24201-ac1
  description: 'AC1: the model accepts event_bus kafka on a lane, refuses kafka with no lane, an unknown inner key and an unknown top-level key; the failing control fails at the merge base where the model
    refused the key.'
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/nodes/node_gpu_power_caps_effect/test_gpu_power_caps_event_bus.py -q -p no:randomly --no-cov
    cwd: .
- id: dod-omn24201-ac2
  description: 'hosted proxy for AC2: the two shipped example overlays of the node carry event_bus and load through the model at the pull request head; the overlays repository entry is its own pull request
    and is named in this pull request.'
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/nodes/node_gpu_power_caps_effect -q -p no:randomly --no-cov -k event_bus
    cwd: .
- id: dod-omn24201-ac3
  description: 'hosted proxy for AC3: the node tests pass at the pull request head; the run through the running dev runtime for h201 and h202 is read after the overlays pull request merges and is named
    in the pull request.'
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/nodes/node_gpu_power_caps_effect -q -p no:randomly --no-cov
    cwd: .
- id: dod-omn24201-integration-proof
  description: the node tests run on a lab host at the pushed head; hosted CI cannot reach the lab, so only the local Done gate runs this unbound check
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24201 --kind test -- env PYTHONDONTWRITEBYTECODE=1
      uv run --frozen pytest tests/unit/nodes/node_gpu_power_caps_effect -q --no-cov
