  source: manual
  binds_ac:
  - AC5
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_source_read_cache_effect tests/nodes/node_floor_simple_effect/test_mvp_launch_reads_cache.py tests/nodes/node_beta_board_effect/test_probe_read_cache.py -q
      -n 0 --no-cov -p no:cacheprovider
    cwd: .
- id: dod-omn24050-integration-proof
  description: the cache node, MVP reads, beta probe and ledger archive test files run on a lab host at the pushed head; hosted CI cannot reach the lab, so only the local Done gate runs this unbound check
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24050 --kind test -- env PYTHONDONTWRITEBYTECODE=1
      uv run --frozen pytest tests/nodes/node_source_read_cache_effect tests/nodes/node_floor_simple_effect/test_mvp_launch_reads_cache.py tests/nodes/node_beta_board_effect/test_probe_read_cache.py tests/nodes/node_factory_floor_effect/test_ledger_window_by_archive.py
      -q --no-cov
