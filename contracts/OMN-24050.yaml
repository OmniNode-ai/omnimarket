  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_floor_simple_effect/test_mvp_launch_reads_cache.py -q -n 0 --no-cov -p no:cacheprovider
    cwd: .
- id: dod-omn24050-ac2
  description: 'AC2: the same for the beta board''s probe reads, with and without a cron key.'
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_beta_board_effect/test_probe_read_cache.py -q -n 0 --no-cov -p no:cacheprovider
    cwd: .
- id: dod-omn24050-ac3
  description: 'AC3: the rows equal the combined archives read, a second cycle reads only the live ledger, and a changed archive is a miss.'
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_factory_floor_effect/test_ledger_window_by_archive.py -q -n 0 --no-cov -p no:cacheprovider
    cwd: .
- id: dod-omn24050-ac4
  description: 'AC4: the handler, reader, factory and Valkey adapter tests pass, including the error chains for an unreachable store and an absent overlay.'
  source: manual
  binds_ac:
