schema_version: 1.0.0
ticket_id: OMN-22864
title: The floor cycle closes every start it or a killed process left open, so the chains row names no start without a terminal
summary: A process that is killed (the publish step's time limit, a host restart, a crash) cannot close its own start, and the emission journal is append-only and read over 48 hours, so one open start of piece 17 node_floor_simple_effect run_floor_simple_cycle stayed red on the chains row for two days. Each cycle now closes, before its own work, every start of the cycle's declared pipeline chains that has no terminal and is older than the contract's abandon_after_seconds (300 s, above the publish node's 120 s limit for the cycle steps and below the 900 s chain deadline), with the typed failure abandoned_without_terminal under the chain's own correlation id. A drilled start is closed as a drill. No check, bound or window of the receipts is changed. Join J0 (piece 17 to piece 1) asked piece 1 for a typed refusal of every piece 17 failure, and no node of piece 1 can give one, because the code graph's typed outcomes and the ledger rows that stand for piece 1 run under their own correlation ids and never receive a piece 17 failure. The floor node's contract now declares J0 to end at the cycle node, the last node that emits a typed outcome for it (runtime.join_ends), judged on the cycle ending in a success or a typed failure within the chain deadline; a cycle with no terminal or a malformed cycle chain still breaks it, and every other join still ends at its to piece.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn22864-close-abandoned-starts
  statement: A start with no terminal whose process can no longer close it is closed with a typed failure by the next cycle, and a start that may still be running is left alone.
  acceptance:
  - id: AC1
    statement: 'AC1: each named chain ends in a success or a typed failure within its bound, and the board''s chains:broken row clears by its own rule, with a failing control that drops the terminal emission -- falsifier: uv run pytest of the chain tests for node_floor_simple_effect plus the board read after one publish'
  - id: AC2
    statement: 'AC2: J0 ends at the cycle node, so a typed piece 17 failure no longer reads as downstream_missing_typed_failure, while a cycle with no terminal, a malformed cycle chain and every join the declaration does not name still break -- falsifier: uv run --frozen pytest tests/nodes/node_floor_emission_compute/test_join_ends_at_typed_outcome.py -q --no-cov'
- id: req-omn22864-compare-cycle-terminal
  statement: Every way out of the comparison cycle of piece 17 (node_floor_compare_effect run_floor_compare_cycle), a finish, a termination signal and the cycle's own 12 s deadline below the publish step's 15 s limit, ends its start in a success or a typed failure.
  acceptance:
  - id: AC3
    statement: 'AC3: a termination signal and the cycle deadline each end a comparison cycle start in the typed failures terminated_by_signal and cycle_deadline_exceeded, and the real receipt reader then finds no open chain, while the same cycle with the handler dropped still reads start_without_terminal -- falsifier: uv run --frozen pytest tests/nodes/node_floor_compare_effect/test_every_exit_terminal_floor_compare.py -q --no-cov'
evidence_requirements:
- kind: tests
  description: The abandoned-start tests with their failing controls, and the cycle exit tests.
  command: uv run --frozen pytest tests/nodes/node_floor_simple_effect -q --no-cov
