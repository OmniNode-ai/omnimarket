schema_version: 1.0.0
ticket_id: OMN-22864
title: Piece 3 answers a real failure of piece 2 with a typed upstream refusal, so join J2 stops reading downstream_missing_typed_failure on the floor's chains row
summary: The floor builds piece 2's failure chains from the host-canary readings on the ledger that read NOT WORKING, under a correlation id the row decides. Join J2 then wants a typed upstream_ failure of piece 3 under that id and no start, and nothing wrote one, so each such reading read downstream_missing_typed_failure 900 s later (24 of the board's 119 broken chains at 18:08Z on 2026-11-07). The new node node_join_refusal_effect reads the same rows through the same rule and writes piece 3's typed refusal to the emission journal for every real failure not yet answered. A drill is not answered, a failure is answered once, an unreadable ledger writes nothing, and no verdict or bound of the receipt fold changes.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn22864-j2-refusal
  statement: Every real failure chain of piece 2 ends, under its own correlation id, in a typed upstream_ failure of piece 3 with no start, and with that terminal emission dropped the join reads broken again.
  acceptance:
  - id: AC1
    statement: 'AC1: the golden chain (a real piece 2 failure is answered once and join J2 reads error_only with no finding), the error chains (a drill, a success and an unreadable ledger are not answered) and the failing control (the piece 3 terminal emission dropped turns J2 broken with downstream_missing_typed_failure) all hold -- falsifier: uv run --frozen pytest tests/unit/nodes/node_join_refusal_effect -q --no-cov'
