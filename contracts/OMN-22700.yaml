schema_version: 1.0.0
ticket_id: OMN-22700
title: The registry units host installer refuses a second install of a unit while one runs
summary: Three lanes installed the factory floor publisher from three branches within minutes and overwrote each other. An install or uninstall of a unit now takes a per-unit advisory lock in the unit's state directory; a second request for the same unit exits 75 with a typed refusal that names the holder, changes nothing, and is never queued. The kernel drops the lock when the holder ends, fails or dies. A dry-run, a status read and a kickstart never take it.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn22700-one-install-at-a-time
  statement: One install or uninstall of a unit runs at a time on a host; a second is refused with exit 75 and the holder named, and the lock never outlives its holder.
  acceptance:
  - id: AC1
    statement: 'AC1: a second install request for the same unit sent while the first runs exits 75 with INSTALL-IN-PROGRESS and the holder named, runs no command, and the first install completes -- falsifier: uv run --frozen pytest tests/nodes/node_host_installer_registry_units/test_registry_units.py -k second_install -q --no-cov'
  - id: AC2
    statement: 'AC2: an install that fails leaves no lock held, so the next install of the unit runs -- falsifier: uv run --frozen pytest tests/nodes/node_host_installer_registry_units/test_registry_units.py -k released -q --no-cov'
  - id: AC3
    statement: 'AC3: a dry-run and a status read sent while an install runs are answered and never refused for the lock -- falsifier: uv run --frozen pytest tests/nodes/node_host_installer_registry_units/test_registry_units.py -k never_take -q --no-cov'
  - id: AC4
    statement: 'AC4: installs of two different units never take the same lock, so a second unit installs while the first runs -- falsifier: uv run --frozen pytest tests/nodes/node_host_installer_registry_units/test_registry_units.py -k two_different_units -q --no-cov'
  - id: AC5
    statement: 'AC5: the lock dies with its holder process, so after the holder is killed the next install runs -- falsifier: uv run --frozen pytest tests/nodes/node_host_installer_registry_units/test_registry_units.py -k dies_with_its_holder -q --no-cov'
evidence_requirements:
- kind: tests
  description: The overlap, release and read-only mode cases of the installer lock
  command: uv run --frozen pytest tests/nodes/node_host_installer_registry_units -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn22700-lock
  description: A second install of the same unit is refused with exit 75 while the first runs, the lock is released when an install fails, and a dry-run and a status read never take it.
  source: manual
  binds_ac:
  - AC1
  - AC2
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_host_installer_registry_units -q --no-cov
    cwd: .
- id: dod-omn22700-lock-scope
  description: Installs of two different units never take the same lock, and the lock dies with its holder process so the next install runs.
  source: manual
  binds_ac:
  - AC4
  - AC5
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_host_installer_registry_units/test_registry_units.py -k "two_different_units or dies_with_its_holder" -q --no-cov
    cwd: .
- id: dod-omn22700-integration-proof
  description: Run this pull request's own check on a lab host at the pushed head. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
