- id: req-omn26227-core-tag
  statement: pyproject.toml and uv.lock name omnibase-core dev tag dev-20261126024324-05fa7e557a73 and the lock is fresh.
  acceptance:
  - id: AC1
    statement: 'AC1: the lock is fresh and names the new core tag -- falsifier: uv lock --check exits non-zero, or tests/ci/test_sibling_core_pin_pair_omn17427.py::test_pyproject_and_lock_name_the_same_infra_and_core_tags fails'
  - id: AC2
    statement: 'AC2: the work contracts record the relocked hash and the topology tests pass -- falsifier: tests/ci/test_infra_pin_aa87c2dd6abe_work_contracts_omn23865.py fails, or tests/unit/runtime/test_topology_strict_wiring_omn15655.py fails'
