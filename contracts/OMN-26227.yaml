title: omnimarket pins the omnibase-core dev tag dev-20261126024324-05fa7e557a73, which carries the migration ledger shape
summary: omnibase_infra#6295 needs omnibase-core with the migration ledger shape (omnibase_core#2378). With omnimarket locked to core 0.47.76, 27 omnimarket topology tests fail on it; with core dev tag dev-20261126024324-05fa7e557a73 all 86 pass. This change moves the omnibase-core source in pyproject.toml to that tag, relocks uv.lock with uv lock (core v0.47.81.dev2 at 05fa7e55), and records the new lock hash in the 70 work contracts that pin it.
