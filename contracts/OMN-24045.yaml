schema_version: 1.0.0
ticket_id: OMN-24045
title: The board's emissions step reads its three sources at once
summary: The floor emissions publish handler read its three emission topics one after another, each under a fresh consumer group, so a pass cost three read windows and three group joins (28.7 s measured on h053 against the dev broker, 9.1 to 10.4 s per topic) against the cycle step's 60 s limit. The handler now reads the topics at once with asyncio.gather and keeps the publications in overlay topic order; a topic that cannot be read still publishes nothing and names the first failing topic in overlay order. No limit, overlay value or contract value changes.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24045-concurrent-reads
  statement: A pass of the floor emissions publish node costs one read window, not one per emission topic, and a topic that cannot be read still publishes nothing.
  acceptance:
  - id: AC1
    statement: 'AC1: the floor emissions publish handler reads all its emission topics at once, so a pass costs one read window instead of one per topic -- falsifier: uv run pytest tests/nodes/node_floor_emissions_publish_effect/test_floor_emissions_concurrent_reads.py -q -k failing_control fails with a timeout on the sequential handler'
  - id: AC2
    statement: 'AC2: a topic that cannot be read still publishes nothing and names the first failing topic in overlay order, and a cancellation is not swallowed -- falsifier: uv run pytest tests/nodes/node_floor_emissions_publish_effect/test_floor_emissions_concurrent_reads.py -q -k error_chain'
  - id: AC3
    statement: "AC3: integrated: after the merge reaches the Mac board cycle, the floor_emissions step of the cycle reads ok in the cycle's step report and finishes under its declared limit -- falsifier: the cycle step report still reads failed or 'did not finish within 60 s' for floor_emissions after one full cycle on the Mac"
evidence_requirements:
- kind: tests
  description: The concurrent read tests and the floor emissions publish golden and error chain tests pass at the pushed head.
  command: uv run pytest tests/nodes/node_floor_emissions_publish_effect -q -n 0 --no-cov -p no:cacheprovider
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24045-ac1
  description: 'AC1: the golden test passes at the head; with the sequential handler of origin/dev the control test_failing_control_all_topics_are_read_at_once failed with TimeoutError, and the seam test failed on the in-memory bus (0.90 s against 0.30 s) and on the real dev broker from h053 (15.46 s against 5.12 s for one topic).'
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_floor_emissions_publish_effect/test_floor_emissions_concurrent_reads.py -q -n 0 --no-cov -p no:cacheprovider -k "failing_control or golden_chain"
    cwd: .
- id: dod-omn24045-ac2
  description: 'AC2: the error chain tests pass: two topics down names the first in overlay order and publishes nothing, and a cancellation propagates.'
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_floor_emissions_publish_effect/test_floor_emissions_concurrent_reads.py -q -n 0 --no-cov -p no:cacheprovider -k error_chain
    cwd: .
- id: dod-omn24045-ac3
  description: 'hosted proxy for AC3: the floor emissions publish tests pass; the reading of the floor_emissions step on the Mac board cycle after the merge is named in the pull request and read after the merge.'
  source: manual
