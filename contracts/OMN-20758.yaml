    acceptance:
      - id: "AC1"
        statement: |-
          AC1: The local Overview's cards are titled Actual spend, Agent calls and Tokens processed, each showing the same served figure as today -- falsifier: a vitest page test rendering the Overview from a served metering-summary row that fails unless each of the three titles is present and bound to the same value the current Spend, Measured runs and Tokens in and out cards show
