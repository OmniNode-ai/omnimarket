---
schema_version: "1.0.0"
ticket_id: "OMN-20072"
title: "OR.4 Pilot one full goal chain in shadow against the OCC path"
summary: "Step S5 of the OCC retirement takeover plan on omnimarket. The constructed pilot cases are pinned to the real verifier output, and repo-evidence / dod-verify runs its OCC difference step, which fails on a difference between the two paths that has no reason code in the OR.1 expected-difference table."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-s5-case-list"
    statement: |-
      The S5 constructed cases must be pinned to the real verifier output so a renamed verdict field or reworded refusal moves a reason code in a test.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: the nine constructed S5 cases, run through the real HandlerDodVerify, classify as documented, and every refused case also gives negative_control_refused -- falsifier: uv run pytest tests/test_dod_verify_s5_case_list.py -q
  - id: "req-s5-difference-check-active"
    statement: "The repo-evidence caller runs the reusable's OCC difference step with a verifier release that ships the classifier, so an unclassified difference fails the required context and names the difference."
    acceptance:
      - id: "AC3"
        statement: "The S3 context is required on omnimarket while every OCC context stays required, and a difference between the two paths that has no reason code in the OR.1 expected-difference table fails the check and names the difference."
evidence_requirements:
  - kind: "tests"
    description: "The nine S5 constructed cases classify as documented."
    command: "uv run pytest tests/test_dod_verify_s5_case_list.py -q"
  - kind: "tests"
    description: "The caller passes compare-with-occ true and pins a verifier release that ships node_dod_verify occ-difference."
    command: "uv run pytest tests/ci/test_repo_evidence_caller_workflow.py -q -k compares_with_occ"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-s5-case-list"
    description: "The S5 case-list test passes against the real verifier."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/test_dod_verify_s5_case_list.py -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC1"]
  - id: "dod-s5-caller-compares-with-occ"
    description: "The caller turns on the difference step and pins a verifier that carries the classifier; the test fails at the merge base, whose caller has no compare-with-occ and pins 0.4.280."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_repo_evidence_caller_workflow.py -q -k compares_with_occ"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC3"]
