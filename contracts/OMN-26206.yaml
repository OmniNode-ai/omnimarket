schema_version: 1.0.0
ticket_id: OMN-26206
title: The Evals projection writer's judged-acceptance mapping sends a malformed event to the dead-letter topic instead of raising KeyError judge_run_id
summary: judged_item refuses a judged payload that fails in a way pydantic does not wrap (a missing or invalid judge_run_id or correlation_id, and the judge compute node's render result that the dev broker's judged topic carries) as a typed invalid_event refusal. The writer sends it to the node's declared dead-letter topic and counts it in dlq_routed, so the consumer is no longer taken down. code_try_items takes the same shape for a non-iterable rows field.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn26206-judged-refusal
    statement: A malformed judged event is refused with a typed reason, sent to the node's dead-letter topic and counted, never dropped silently and never raised.
    acceptance:
      - id: AC1
        statement: 'AC1: the mapping handles a judged event the way the producer emits it, read from a real event on the dev broker, and a malformed judged event (judge_run_id missing, empty or of the wrong type) is refused with a typed reason, sent to the node''s declared dead-letter topic onex.dlq.omnimarket.projection-eval-results-malformed.v1 and counted in the writer''s dlq_routed outcome, never dropped silently and never raised -- falsifier: uv run pytest tests/nodes/node_projection_eval_results/test_eval_results_mapping.py -q fails on the new cases at omnimarket dev and passes with the fix'
      - id: AC2
        statement: 'AC2: a regression test built from the recorded real event (fixture path in the PR body, secrets scrubbed) fails on the broken mapping and passes on the fix -- falsifier: uv run pytest tests/nodes/node_projection_eval_results -q -k judged'
      - id: AC3
        statement: 'AC3: the branch installed on the dev runtime on h201 through the declared branch install with restart false shows the writer''s next runtime-tick consumption with no KeyError for judge_run_id and onex.intent.platform.runtime-tick.v1 advancing, and the lane writes one STATUS row carrying installed=h201:revision and observed=that log line -- falsifier: the ledger holds no STATUS row for this ticket carrying both cells, or observed names a log read from before the install'
evidence_requirements:
  - kind: tests
    description: Mapping and writer tests for the judged topic, including the regression test built from the recorded dev broker event.
    command: uv run --frozen pytest -q --no-cov -n 0 -p no:randomly tests/nodes/node_projection_eval_results tests/test_golden_chain_projection_eval_results.py
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn26206-ac1-mapping-and-dlq
    description: Mapping tests for a missing, empty or wrong-typed judge_run_id and the writer tests for the dead-letter route and the dlq_routed count, with a valid-event control.
    source: manual
    binds_ac: [AC1]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest -q --no-cov -n 0 -p no:randomly tests/nodes/node_projection_eval_results/test_eval_results_mapping.py tests/nodes/node_projection_eval_results/test_writer.py
        cwd: .
  - id: dod-omn26206-ac2-recorded-event
    description: The regression test built from the recorded dev broker event (tests/fixtures/eval_results/judged_topic_render_result.json) passes on the fix; at the unfixed mapping it raises KeyError judge_run_id.
    source: manual
    binds_ac: [AC2]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest -q --no-cov -n 0 -p no:randomly tests/nodes/node_projection_eval_results -k judged
        cwd: .
  - id: dod-omn26206-ac3-installed-and-observed
    description: The lane has one STATUS row for this ticket carrying both an installed= and an observed= cell.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: >-
          bash -o pipefail -c '
          python3 "${OMNI_PLUGIN_ROOT:?}/skills/lane-brief/scripts/lane_brief.py" grep "OMN-26206" |
          awk '"'"'/ \| STATUS \| / && / \| installed=h201:[0-9a-f]+/ && / \| observed=[^ |]/ { found = 1 } END { exit !found }'"'"''
        cwd: .
  - id: dod-omn26206-integration-proof-dev-runtime
    description: Asserted read of the live dev runtime on h201 after the branch install with restart false; the log of the last ten minutes holds no KeyError for judge_run_id.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: |-
          python3 "${OMNI_PLUGIN_ROOT:?}/scripts/onex_lab_run.py" --via bus --host h201 --lane evalkey-1415 --repo omnimarket --ref dev -- bash -c "! docker logs --since 10m omninode-runtime 2>&1 | grep -q \"KeyError: 'judge_run_id'\""
        cwd: .
  - id: dod-omn26206-ac3-writer-against-real-postgres
    description: The writer consumes the recorded judged event against a real Postgres, refuses it to the dead-letter topic with dlq_routed 1 and no KeyError, writes no score row, and still lands a valid judged event. The h201 install read stays in the local_done_gate items.
    source: manual
    binds_ac: [AC3]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest -q --no-cov -n 0 -p no:randomly tests/test_omn24171_eval_results_real_postgres.py -k judge_run_id
        cwd: .
  - id: dod-omn26206-deploy-gate-head-carries-the-fix
    description: The pull request head carries the judged-mapping fix (the helper that names the failing field of a payload pydantic does not wrap).
    source: manual
    checks:
      - check_type: command
        check_value: >-
          bash -c 'gh api -H "Accept: application/vnd.github.raw" "repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_projection_eval_results/handlers/eval_results_mapping.py?ref=$(git rev-parse HEAD)" | grep -q _unwrapped_failure_detail'
        cwd: .
