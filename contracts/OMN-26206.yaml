---
schema_version: "1.0.0"
ticket_id: OMN-26206
title: "The Evals projection writer's judged-acceptance mapping sends a malformed event to the dead-letter topic instead of raising KeyError judge_run_id"
summary: A judged-acceptance event whose judge_run_id (or correlation_id) is missing, empty or of the wrong type is refused with an invalid_event reason that names the field, routed to the node's dead-letter topic and counted in dlq_routed; it never raises.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn26206-refuse-malformed-judged
    statement: A malformed judged event is refused with a typed reason, sent to the declared dead-letter topic and counted in dlq_routed, never dropped and never raised.
    acceptance:
      - id: AC1
        statement: "AC1: the mapping handles a judged event the way the producer emits it, read from a real event on the dev broker, and a malformed judged event (judge_run_id missing, empty or of the wrong type) is refused with a typed reason, sent to the node's declared dead-letter topic onex.dlq.omnimarket.projection-eval-results-malformed.v1 and counted in the writer's dlq_routed outcome, never dropped silently and never raised -- falsifier: uv run pytest tests/nodes/node_projection_eval_results/test_eval_results_mapping.py -q fails on the new cases at omnimarket dev and passes with the fix"
  - id: req-omn26206-regression-from-recorded-event
    statement: A regression test built from the recorded judged event fails on the broken mapping and passes on the fix.
    acceptance:
      - id: AC2
        statement: "AC2: a regression test built from the recorded real event (fixture path in the PR body, secrets scrubbed) fails on the broken mapping and passes on the fix -- falsifier: uv run pytest tests/nodes/node_projection_eval_results -q -k judged"
  - id: req-omn26206-runs-on-dev
    statement: The branch installed on the dev runtime on h201 consumes the next runtime tick with no KeyError for judge_run_id.
    acceptance:
      - id: AC3
        statement: "AC3: the branch installed on the dev runtime on h201 through the declared branch install with restart false shows the writer's next runtime-tick consumption with no KeyError for judge_run_id and onex.intent.platform.runtime-tick.v1 advancing, and the lane writes one STATUS row carrying installed=h201:revision and observed=that log line -- falsifier: the ledger holds no STATUS row for this ticket carrying both cells, or observed names a log read from before the install"
evidence_requirements:
  - kind: tests
    description: The eval-results projection node's tests.
    command: uv run pytest tests/nodes/node_projection_eval_results -q --no-cov -n 0 -p no:randomly
  - kind: manual
    description: 'deploy: read the mapping handler at this head from the public repository and run the node tests on a hosted runner.'
    command: uv run pytest tests/nodes/node_projection_eval_results -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-omn26206-ac1
    description: "A judged event with a missing, empty or wrong-type judge_run_id (or correlation_id), with or without event_id, is refused as invalid_event naming the field."
    source: manual
    binds_ac: [AC1]
    checks:
      - check_type: test_passes
        check_value: >-
          uv run pytest tests/nodes/node_projection_eval_results/test_eval_results_mapping.py -q --no-cov -n 0 -p no:randomly
        cwd: .
  - id: dod-omn26206-ac2
    description: "The writer routes the malformed judged delivery to the declared dead-letter topic and counts it in dlq_routed; the producer-shaped fixture still maps."
    source: manual
    binds_ac: [AC2]
    checks:
      - check_type: test_passes
        check_value: >-
          uv run pytest tests/nodes/node_projection_eval_results -q -k judged --no-cov -n 0 -p no:randomly
        cwd: .
  - id: dod-omn26206-deploy-handler-at-head
    description: "Hosted deploy readback: the public repository at this exact head must contain the KeyError refusal in the judged mapping, and the node tests must pass there."
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/nodes/node_projection_eval_results -q --no-cov -n 0 -p no:randomly
        cwd: .
      - check_type: command
        check_value: |
          set -eu;
          curl --fail --silent --show-error --location --max-time 60 "https://raw.githubusercontent.com/OmniNode-ai/omnimarket/$(git rev-parse HEAD)/src/omnimarket/nodes/node_projection_eval_results/handlers/eval_results_mapping.py" | grep -q 'except KeyError as exc'
        cwd: .
  - id: dod-omn26206-integration-proof
    description: "Hosted CI cannot reach a lab host, so only the local Done gate runs this unbound check: the node's tests at the sha on a lab host."
    source: manual
    execution_scope: local_done_gate
    binds_ac: [AC3]
    checks:
      - check_type: command
        check_value: onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-26206 --kind test -- uv run pytest tests/nodes/node_projection_eval_results -q --no-cov -n 0 -p no:randomly
        cwd: .
