schema_version: 1.0.0
ticket_id: OMN-24449
title: Plan review stops full-plan Codex rounds after the blocking findings are fixed and reviews the first slice, then each later rung
summary: 'A new pure compute node, node_plan_first_slice_compute, checks that a plan in review names its first slice section: the first markdown heading naming a first slice (numbering and punctuation stripped,
  fenced blocks ignored) must carry at least the overlay''s minimum of words before the next heading of the same or higher level or a later-rungs heading. Verdicts: ok, no_first_slice_section, empty_first_slice_section.
  Its settings come from its overlay, with the packaged contract section as the default. The plan-write skill and the plan review set skill name it in their own pull requests.'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24449-first-slice-rule
  statement: A plan in review is checked for a first slice section by a node, with every setting in its overlay.
  acceptance:
  - id: AC1
    statement: 'AC1: a resolved, wired mechanism enforces RULING 2026-11-14T15:20:15Z lane=orchestrator-31d9, linked to it by a CORRECTION row carrying mechanism=<repo path> -- falsifier: `python3 plugins/omni/skills/queue-status/scripts/ruling_mechanisms.py`
      no longer lists 2026-11-14T15:20:15Z as unmechanized'
evidence_requirements:
- kind: tests
  description: 'The node tests: golden and error cases, golden and error chain events, the overlay read, the contract, and three injected breaks.'
  command: env -u PYTHONPATH uv run --frozen pytest tests/unit/nodes/node_plan_first_slice_compute -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24449-ac1-node
  description: The node tests, which import a node origin/dev does not hold so they fail there, with three injected breaks that the shared assertion helper catches.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/nodes/node_plan_first_slice_compute -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24449-ac1-integration-proof
  description: Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check. The pushed head ran the node tests on a lab host through the lab work runner and exited 0. The running
    reading (the node answering a plan with no first slice section and a plan with one through onex run-node, and the receipt) is read from the lab receipt comment on the ticket.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24449 --kind test -- env PYTHONDONTWRITEBYTECODE=1
      uv run --frozen pytest tests/unit/nodes/node_plan_first_slice_compute -q --no-cov -n 0 -p no:randomly
    cwd: .
