schema_version: 1.0.0
ticket_id: OMN-23366
title: Contract and evidence for node_runtime_boot_set_compute, the declared boot set judgment of the one-runtime plan (T28)
summary: node_runtime_boot_set_compute judges one runtime boot against the boot set its deployment declares. Today's dev start announces 1,153 contracts, has 638 command contracts to attach and subscribes 2,919 distinct topics with no declared set; the node reads that start FAIL, names the contracts and topics outside a declared set, and hands the overlay the ONEX_RUNTIME_NODE_SELECTION value for the declared set.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23366-declared-boot-set
  statement: A boot with no declared set, or one that loads a contract or subscribes a topic outside the declared set, reads FAIL (NOT_WORKING) with the rule named and the missing and extra nodes listed; a boot inside the declared set reads PASS (WORKING); a boot that was not read reads UNKNOWN and fails.
  acceptance:
  - id: AC1
    statement: 'AC1: a compute node compares a runtime''s booted node set with the deployment''s declared boot set and returns a typed verdict naming missing and extra nodes -- falsifier: uv run pytest tests/nodes/node_runtime_boot_set_compute -q fails today because the node does not exist'
  - id: AC2
    statement: 'AC2: a boot missing one declared node reads NOT_WORKING naming it, and an exact boot reads WORKING -- falsifier: the same pytest module with one case each'
evidence_requirements:
- kind: tests
  description: The boot set unit tests, the replay of today's dev start as the failing control, and the golden and error chain event tests with their named breaks.
  command: uv run --frozen pytest tests/nodes/node_runtime_boot_set_compute -q --no-cov -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23366-boot-set-tests
  description: Runs the boot set judgment tests. The control replays today's dev start with no declared set and reads FAIL; a start against a declared set names every contract and topic outside it; a boot inside the declared set reads PASS and WORKING; a boot missing one declared node or carrying an extra node reads NOT_WORKING naming it; an unannounced name, a dropped declared contract, a declaration for another deployment and an unread boot each read as their rule. The selection value parses back to the declared set through omnibase_infra's own reader. Absent at the merge base, so the command fails there.
  source: manual
  binds_ac:
  - AC1
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_runtime_boot_set_compute/test_runtime_boot_set.py -q --no-cov -p no:randomly
    cwd: .
- id: dod-omn23366-boot-set-chain-events
  description: Runs the golden chain and error chain event tests on the in-memory bus. A declared boot ends in one judged event; today's start ends in one violated event naming the rules; a payload that is no request ends in a typed failure event; four named breaks (ignored excess, today's start in place of a declared boot, dropped result event, wrong rule named) each turn a chain assertion red. Absent at the merge base, so the command fails there.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_runtime_boot_set_compute/test_runtime_boot_set_chain_events.py -q --no-cov -p no:randomly
    cwd: .
- id: dod-omn23366-integration-proof
  description: The pushed head ran the boot set node tests on a lab host through the lab work runner and exited 0. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: 'env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23366 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_runtime_boot_set_compute -q --no-cov'
    cwd: .
