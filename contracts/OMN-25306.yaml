summary: 'Answers the review of omnimarket#6335 at head 033238b5686f. This contract declares the three criteria a hosted test can fail at the merge base (AC1 to AC3); AC4 (the alarm reading on omnimarket#6353) is not met and is kept as the unbound local item dod-omn25306-ac4-alarm-reading-live, and AC5 (a PR comment starting Lab: head= and the answers to findings 7 and 8) is read from the pull request comments by a local_done_gate item that stays unbound, because the hosted gate refuses a bound local_done_gate item and no hosted test can read a comment.'
