- id: dod-omn25306-ac4-alarm-reading-live
  description: 'Not declared in this contract, because it is not met: omnimarket#6353 at its head 856b0c8f54d6 carries the alarm node, its golden-chain tests and the installer''s timer declaration, and no reading of the alarm unit''s install record or of a row newer than it, and no amendment of the criterion is on Linear (read 2026-11-17). The criterion stands unchanged on its ticket, which stays open. The AC4 reading lives in contracts/OMN-24874.yaml as the unbound local item dod-omn24874-ac4-alarm-ledger-row; this item runs the same live command, local Done gate only, and fails until omnimarket#6353 is merged, its unit is installed on h053 and it has written an alarm row. No hosted text test binds this criterion.'
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: 'sh -c ''test "$(hostname -s)" = hp-gen9 && A=$(git log origin/dev --first-parent --no-merges --format="%H %s" | grep -m1 -E " \(#6353\)\$" | cut -d" " -f1) && test -n "$A" && I="${OMNI_HOME:?}/.onex_state/delegation-scenario-alarm/scenario-alarm-systemd.installed.json" && R=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))[sys.argv[2]])" "$I" revision) && git -C "${OMNI_HOME:?}/omnimarket" merge-base --is-ancestor "$A" "$R" && python3 "${OMNI_PLUGIN_ROOT:?}/skills/lane-brief/scripts/lane_brief.py" grep "src=alarm.*alarm=delegation-scenario-r[89]-failed" | python3 -c "import re,sys,json,datetime as D; t=D.datetime.fromisoformat(json.load(open(sys.argv[1]))[sys.argv[3]]); sys.exit(0 if any((m:=re.search(sys.argv[2],l)) and D.datetime.fromisoformat(m.group(1))>=t for l in sys.stdin) else 1)" "$I" "^(?:\S+:\d+:)?(\d{4}-\d\d-\d\dT\d\d:\d\d:\d\dZ) \| STATUS \|(?=.* \| src=alarm )(?=.* \| alarm=delegation-scenario-r[89]-failed )" installed_at'''
    cwd: .
- id: dod-omn25306-ac5-lab-comment-and-findings
  description: 'The PR holds a comment starting Lab: head= with the full head of the checkout, and a comment naming each of findings 7 and 8. Local Done gate only: it reads the pull request comments and a sha.'
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: 'sh -c ''C=$(onex scm pr-view OmniNode-ai/omnimarket#6335 --comments) && printf %s "$C" | grep -qF "Lab: head=$(git rev-parse HEAD)" && for n in 7 8; do printf %s "$C" | grep -qF "OMN-25306 finding $n" || exit 1; done'''
    cwd: .
- id: dod-omn25306-integration-proof
  description: The contract check tests, the ceiling budget reader tests and the tenant overlay pricing tests run on a lab host at the pushed head through the lab work runner; hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --bus-lane dev --omnibase-path "${OMNI_HOME:?}" --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-25306 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/test_omn24874_contract_checks.py tests/unit/delegation/test_omn24874_tenant_overlay_budget_readers.py tests/unit/delegation/test_omn24874_tenant_overlay_terminal_cost.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn25306-real-postgres
  description: The real-Postgres file of the cost fix, whose async ceiling control reads the rule in resolve_tier_cost, runs on a lab host against a disposable postgres:16-alpine container that the command starts and removes; it fails when any of the file's tests is skipped. Local Done gate only.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --bus-lane dev --omnibase-path "${OMNI_HOME:?}" --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-real-postgres-25306 --kind test -- sh -c 'PW=$(head -c 18 /dev/urandom | base64 | tr -dc A-Za-z0-9); N=dod-omn24874-pg-$$; OUT=/tmp/$N.out; docker run -d --rm --name "$N" -e POSTGRES_PASSWORD="$PW" -e POSTGRES_DB=omnibase_infra -p 127.0.0.1::5432 postgres:16-alpine >/dev/null; trap "docker rm -f $N >/dev/null; rm -f $OUT" EXIT; for i in $(seq 1 40); do docker exec "$N" pg_isready -U postgres -q && break; sleep 1; done; PORT=$(docker port "$N" 5432/tcp | head -1 | sed "s/.*://"); INTEGRATION_POSTGRES_PASSWORD="$PW" INTEGRATION_POSTGRES_HOST=127.0.0.1 INTEGRATION_POSTGRES_PORT="$PORT" env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/test_omn24874_tenant_overlay_cost_real_postgres.py -q --no-cov -n 0 -p no:randomly -rs > "$OUT" 2>&1; R=$?; cat "$OUT"; ! grep -q skipped "$OUT" && exit $R'
    cwd: .
