  description: Every caller of resolve_tier_cost reads None as no cost model or tier not budgeted (an AST walk lists the callers and fails on a new one); the premise test reads the loaded registry's tier names; the text test reads the contracts of OMN-24874, OMN-25168 and OMN-25186 and the budget reader test file for the tier-rule text the code no longer has.
