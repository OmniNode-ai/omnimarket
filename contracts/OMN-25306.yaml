  - check_type: test_passes
    check_value: uv run --frozen pytest tests/test_omn24874_contract_checks.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn25306-ac4-undeclared-readings-kept
  description: Each criterion that the contracts of OMN-24918, OMN-24978, OMN-25168 and OMN-25186 no longer declare keeps its unbound local_done_gate reading; the descriptions that cited the alarm or tests no longer in the tree are corrected. The half of AC4 that asks the AC4 reading of OMN-25186 to be confirmed on 6353 is open, because omnimarket#6353 does not carry that reading (read at its head 43bc9673d0c1), the reading is owed to a lane on omnimarket#6353, and OMN-25186 says so in its own words, so this item's tests show the texts agree, not that the reading passes.
