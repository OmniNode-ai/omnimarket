    acceptance:
      - id: "AC1"
        statement: "AC1: a 422 'No commits between' on PR create raises NothingToBindError and the emitter returns a skip decline, while every other PR create fault is still a GitHub error -- falsifier: uv run pytest tests/unit/nodes/node_pr_lifecycle_fix_effect/test_autobind_nothing_to_bind_omn_19984.py -k 'no_commits_between or still_a_github_error or skip_decline' -q in omnimarket fails at the merge base, where the test does not exist"
