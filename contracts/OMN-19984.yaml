title: "Autobind with nothing left to bind reads DECLINED, not ERROR"
summary: "When the change-control window branch has no new commits, POST /pulls returns HTTP 422 'No commits between'. The companion emitter now raises NothingToBindError for that body only and returns skip:NOTHING_TO_BIND, which the classifier posts as a neutral DECLINED outcome. Every other fault still reads ERROR."
