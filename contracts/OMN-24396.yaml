schema_version: 1.0.0
ticket_id: OMN-24396
title: The signed dev deploy refuses a signing key that differs from the deploy agent's key
summary: 'On 2026-11-14 a deploy command signed with a key that differs from the deploy agent''s was dropped by the agent with no job and no word to the sender. The branch deploy command effect now reads the deploy agent''s health page before it publishes and compares the agent''s key check value (a one-way value, the first 16 hex characters of an HMAC of a fixed label under the key) with the check value of its own signing key; a differing key, an unreadable page, a page with no value and an overlay that does not configure the read are each refused with nothing published. The page URL, its timeout and the field name are overlay values. The deploy agent side (OMN-24397) serves the field; the golden vector in agent_wire.json is the seam both repositories test against.'
is_seam_ticket: true
interface_change: true
interfaces_touched:
- public_api
requirements:
- id: req-omn24396-key-check-before-publish
  statement: The branch deploy command effect publishes the signed rebuild command only when the signing key's check value equals the deploy agent's, and otherwise ends refused with nothing published.
  acceptance:
  - id: AC1
    statement: 'AC1: the branch deploy command effect refuses with status refused and a key mismatch detail when the signing key''s check value differs from the deploy agent''s, publishing nothing -- falsifier: pytest tests/nodes/node_branch_deploy_command_effect/test_key_check_seam.py -q (the failing control restores the unchecked publish and the test goes red)'
  - id: AC2
    statement: 'AC2: the check value the node computes equals the golden check value the deploy agent computes for the same key -- falsifier: pytest tests/nodes/node_branch_deploy_command_effect/test_key_check_seam.py -k golden_vector -q'
  - id: AC3
    statement: 'AC3: golden and error chain tests for the node pass on the in-memory bus and on the lab broker -- falsifier: pytest tests/nodes/node_branch_deploy_command_effect -q'
  - id: AC4
    statement: 'AC4: integrated: the node, loaded in the dev runtime on h201, refuses a deliberately wrong key and publishes with the agent''s own key, read from its terminal event on the dev bus -- falsifier: onex node run node_branch_deploy_command_effect with a wrong key shows status refused on the dev lane terminal event'
evidence_requirements:
- kind: tests
  description: The seam, chain, adapter, contract and orchestrator tests pass at the pushed head.
  command: uv run --frozen pytest tests/nodes/node_branch_deploy_command_effect tests/nodes/node_branch_deploy_orchestrator -q -n 0 --no-cov -p no:cacheprovider
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24396-ac1
  description: 'AC1: a differing key, an unreadable page, a page with no value and an unconfigured overlay each refuse with nothing on the bus; the match publishes; the signing key is in no detail.'
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_branch_deploy_command_effect/test_key_check_seam.py -q -n 0 --no-cov -p no:cacheprovider
    cwd: .
- id: dod-omn24396-ac2
  description: 'AC2: the node''s check value for the vector key equals the vector in agent_wire.json, which omnibase_infra deploy-agent tests pin to the same value.'
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_branch_deploy_command_effect/test_key_check_seam.py -k golden_vector -q -n 0 --no-cov -p no:cacheprovider
    cwd: .
- id: dod-omn24396-ac3
  description: 'AC3: golden and error chain tests on the in-memory bus, the http reader against a real local socket, and the orchestrator chain that drives this handler.'
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_branch_deploy_command_effect tests/nodes/node_branch_deploy_orchestrator -q -n 0 --no-cov -p no:cacheprovider
    cwd: .
- id: dod-omn24396-ac4
  description: 'hosted proxy for AC4: the tests above pass; the dev runtime run of the node with a wrong key and with the agent''s own key is read on h201 and named in the pull request.'
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_branch_deploy_command_effect/test_key_check_chain.py -q -n 0 --no-cov -p no:cacheprovider
    cwd: .
- id: dod-omn24396-integration-proof
  description: the key check seam, chain and adapter tests run on a lab host at the pushed head; hosted CI cannot reach the lab, so only the local Done gate runs this unbound check
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24396 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_branch_deploy_command_effect tests/nodes/node_branch_deploy_orchestrator -q --no-cov
    cwd: .
