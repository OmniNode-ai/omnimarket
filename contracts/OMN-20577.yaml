schema_version: 1.0.0
ticket_id: OMN-20577
title: The delegation eval nodes get runtime bindings for their item and event-snapshot sources
summary: The label-record and eval-run nodes raised a missing-source RuntimeError on every delivery because the runtime built their handlers with no snapshot or labelled-item source. The contracts now route to zero-argument runtime handlers that build one tenant-scoped reader per command from the node overlay delegation_eval_sources (field read_dsn_env); the reader sets app.tenant_id in a read-only transaction before its statement. A source that is unconfigured or unreadable ends the run in a failed run-completed terminal naming only the error type.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn20577-eval-runtime-binding
  statement: A delivered eval-run or label-record command resolves a tenant-scoped source from the node overlay and reads only the calling tenant's rows.
  acceptance:
  - id: AC1
    statement: 'AC1: the runtime resolves ProtocolDelegationEvalLabelledItems and ProtocolDelegationEventSnapshot to a tenant-scoped reader, so a delivered eval-run or label-record command no longer raises the missing-source RuntimeError -- falsifier: uv run pytest tests/test_delegation_eval_runtime_binding.py -q in omnimarket'
  - id: AC2
    statement: 'AC2: the tenant reader passes the RLS read-seam gate and reads only rows of the calling tenant -- falsifier: uv run python scripts/ci/check_rls_read_tenant_seam.py in omnimarket'
evidence_requirements:
- kind: tests
  description: The runtime binding tests pass at the head (golden and error chain of both nodes, the tenant seam of the reader, the contract routing).
  command: uv run pytest tests/test_delegation_eval_runtime_binding.py -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn20577-ac1-runtime-binding
  description: 'AC1: the handlers the two contracts route to are built with no arguments, as the runtime builds them, read the calling tenant through the overlay-bound reader and complete a run; an unconfigured overlay, an unset DSN variable and a failing read each end in a failed run-completed terminal naming only the error type.'
  source: manual
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/test_delegation_eval_runtime_binding.py -q --no-cov
    cwd: ${OMNI_HOME}/omnimarket
  binds_ac:
  - AC1
- id: dod-omn20577-ac2-rls-seam
  description: 'AC2: the RLS read-seam gate is clean over the tree, and the binding builds the existing RLS-seamed read adapter for the calling tenant (it sets app.tenant_id before its statement) and a command reads nothing of another tenant.'
  source: manual
  checks:
  - check_type: command
    check_value: uv run python scripts/ci/check_rls_read_tenant_seam.py
    cwd: ${OMNI_HOME}/omnimarket
  - check_type: test_passes
    check_value: uv run pytest tests/test_delegation_eval_runtime_binding.py -k "another_tenants or rls_seamed" -q --no-cov
    cwd: ${OMNI_HOME}/omnimarket
  binds_ac:
  - AC2
- id: dod-omn20577-integration-proof
  description: Run the runtime binding tests and the RLS read-seam gate on a lab host at the pushed head. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-20577 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/test_delegation_eval_runtime_binding.py -q --no-cov
    cwd: .
