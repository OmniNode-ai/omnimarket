    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23842-redpanda --kind test -- env RUN_REDPANDA_PIECE16=1 PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/chains/piece16/test_piece16_chain.py -k redpanda -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn23842-integration-proof
  description: Run this pull request's own focused test on a lab host at the pushed head. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
