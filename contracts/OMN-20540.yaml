schema_version: 1.0.0
ticket_id: OMN-20540
title: a bus writer that cannot reach the broker spools its request locally and replays it under the same req= id
summary: >-
  The work-ledger append command keeps a durable local spool (handlers/bus_binding/outbox.py) for requests it
  cannot publish. This change makes the spool answer the way the ticket states: an append made while the broker
  is unreachable exits 0 and prints status=spooled (it printed queued), and the request file of a send is
  fsynced, with its directory entry, before the publish (the first-attempt record was written without an fsync).
  Replay under the same request id, the duplicate answer after a lost receipt and removal only on a receipt hold
  on the dev mechanism already and are pinned by tests in tests/ledger.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn20540-spool
  statement: A bus ledger writer that cannot reach the broker spools its request, fsynced before the publish, and the replay sends the same request id, so the ledger holds one row.
  acceptance:
  - id: AC1
    statement: 'AC1: with the broker unreachable the append exits 0 with status=spooled and the request is in the spool -- falsifier: uv run pytest tests/ledger -k spool_unreachable -q'
  - id: AC2
    statement: 'AC2: after the broker returns, one replay produces exactly one row, and a replay after a lost receipt answers duplicate and appends nothing -- falsifier: uv run pytest tests/ledger -k ''spool_replay or spool_duplicate'' -q'
  - id: AC3
    statement: 'AC3: a spooled request is removed only on a receipt and the spool file is fsynced before the publish -- falsifier: uv run pytest tests/ledger -k spool_durability -q'
evidence_requirements:
- kind: tests
  description: The three spool test groups pass at the pushed head.
  command: uv run pytest tests/ledger/test_ledger_spool_omn20540.py -q --no-cov -p no:randomly
