dod_evidence:
- id: dod-omn20540-ac1
  description: AC1 the append command, run with the durable open failing on a lane that declares an in-memory fallback, exits 0 and prints a receipt with status spooled naming the request id, and the request file is in the spool directory.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/ledger -k spool_unreachable -q --no-cov -p no:randomly
    cwd: .
- id: dod-omn20540-ac2
  description: AC2 a spooled request replayed against a serve that appends once per request id lands one row, a second drain lands none, and a request whose first attempt landed (receipt lost) is answered duplicate with no second row. A retry of a timed-out send reuses the first attempt's request id and is answered duplicate.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/ledger -k 'spool_replay or spool_duplicate' -q --no-cov -p no:randomly
    cwd: .
- id: dod-omn20540-ac3
  description: AC3 the request file is fsynced before the publish callable runs and is on disk when it runs; a timeout or an error receipt leaves the spooled file, and only an accepted receipt removes it.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/ledger -k spool_durability -q --no-cov -p no:randomly
    cwd: .
