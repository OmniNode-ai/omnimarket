schema_version: "1.0.0"
ticket_id: OMN-18308
title: A no-paid delegation run never reaches a paid rung, a caller-pinned one included
summary: >-
  ONEX_DELEGATION_ALLOW_PAID=0 removed paid rungs from the tier ladder but not from a caller-pinned backend, and judged a rung paid only by its flat per-1k figure, so a pin on a metered rung and a rung typed budgeted with a zero flat figure were still reachable. The routing reducer now asks one predicate for the pin path, the ladder and the exclusion report, and reads the typed cost as well as the flat figure. The paid flag's own documentation now says it removes metered rungs and does not confine a run to the local tier.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn18308-no-paid-run-no-paid-rung
    statement: >-
      With the paid opt-out set, no routing path selects a rung that can bill; with it unset the same requests route as before.
    acceptance:
      - id: AC3
        statement: "AC3: the distinction between no metered escalation and no escalation at all is stated wherever the paid flag is documented, because the current name reads as the second and means the first -- falsifier: the paid-flag comment in the routing reducer, the paid-delegation log line in the local dispatch port and the ladder harness docstring each say metered only"
evidence_requirements:
  - kind: tests
    description: >-
      Pins on a metered and on a budgeted rung are refused under the opt-out and route without it; a pin on the free local rung routes under it; the unpinned walk stays on the free rung; a tier typed metered or budgeted with a zero flat figure is paid in both the predicate and the exclusion report.
    command: uv run --frozen pytest tests/unit/delegation/test_no_paid_run_never_reaches_paid_rung_omn18308.py -q -n 0 --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn18308-ac3-metered-only-stated
    description: >-
      The three places that document the paid flag each state that it removes metered rungs and leaves free non-local rungs reachable.
    source: manual
    binds_ac:
      - AC3
    checks:
      - check_type: command
        check_value: grep -c "METERED" benchmarks/delegation_ladder/run_ladder.py src/omnimarket/nodes/node_delegate_skill_orchestrator/ports/port_local_delegation_dispatch.py
        cwd: ${OMNI_HOME}/omnimarket
  - id: dod-omn18308-no-paid-run-tests
    description: >-
      The no-paid-run tests pass with the fix and five of them fail against the pre-fix reducer.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/delegation/test_no_paid_run_never_reaches_paid_rung_omn18308.py -q -n 0 --no-cov
        cwd: ${OMNI_HOME}/omnimarket
  - id: dod-omn18308-integration-proof
    description: >-
      The pushed head ran the no-paid-run test and the paid-gate and pinned-backend routing tests on a lab host through the lab work runner and exited 0. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-18308 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/delegation/test_no_paid_run_never_reaches_paid_rung_omn18308.py tests/unit/delegation/test_paid_escalation_gate_omn14225.py tests/unit/delegation/test_exact_backend_pin_routing_omn15539.py tests/unit/delegation/test_pinned_backend_never_moves_omn20844.py -q --no-cov
        cwd: .
