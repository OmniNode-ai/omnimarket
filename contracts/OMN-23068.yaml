schema_version: 1.0.0
ticket_id: OMN-23068
title: The floor's join refusal node runs in the publish cycle so J2 to J5 chain findings clear after install
summary: node_join_refusal_effect (omnimarket#5350) writes the downstream piece's typed upstream refusal for each real upstream failure, but its contract says external_trigger true and only its own CLI runs it, so nothing called it and the J2 to J5 chain findings on the served floor board re-accrued. The publish node's contract gains one input step, join_refusal (module omnimarket.nodes.node_join_refusal_effect, args run, concurrent with the other input steps, required false, timeout 30 s), so the node runs in every publish cycle before the floor steps read the receipts. The longest declared path stays 238 s against the 240 s cycle bound. No check, bound or window of the receipts is changed.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23068-join-refusal-publish-step
  statement: The publish cycle runs the join refusal node before the floor reads its receipts, a node that exits non-zero is recorded failed without stopping the floor steps, and with the step removed from the contract the focused tests fail.
  acceptance:
  - id: AC1
    statement: 'AC1: the publish cycle calls the join refusal node before the floor reads its receipts, and a failing control that removes the call makes the focused tests fail -- falsifier: uv run pytest of the node_floor_simple_effect publish cycle tests, 6 failures without the step'
  - id: AC2
    statement: 'AC2: after install on the publisher the served board''s chain findings for J2 to J5 read zero or name a current typed failure -- falsifier: curl of the served floor-simple.json chain_findings after one publish cycle'
evidence_requirements:
- kind: tests
  description: The join refusal publish-step tests, the publish tests and the cycle bound test, with the failing control that takes the contract without the step.
  command: uv run --frozen pytest tests/nodes/node_factory_floor_publish_effect/test_join_refusal_step.py tests/nodes/node_factory_floor_publish_effect/test_factory_floor_publish.py tests/nodes/node_factory_floor_publish_effect/test_cycle_bound.py -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
