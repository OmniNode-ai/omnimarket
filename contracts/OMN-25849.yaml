schema_version: 1.0.0
ticket_id: OMN-25849
title: The hourly prove-running workflow reads the integration pass's typed batch from its snapshot topic, not from a variable that names a ledger file
summary: 'The hourly prove-running batch workflow failed at its first step on h051 (refused: ONEX_INTEGRATION_LEDGER_PATH names no integration ledger) because the integration ledger lives on the operator Mac and the unit
  declared no such path. Its read-not-running step now reads the newest publication of the integration projection from the existing snapshot topic (onex.snapshot.projection.floor-integration.v1, the typed
  ModelIntegrationProjection that node_integration_reading_publish_effect publishes) through the shared snapshot source, with the topic, the bound and the broker taken from the floor reader''s overlay. It refuses
  a batch older than the overlay''s declared bound, a topic with no valid publication and a payload that is not a projection, each with its reason. The text parser of the ledger file is removed. omnimarket 6336
  stays the owner of the workflow; this change rides on its branch.'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn25849-declared-input
  statement: The hourly prove-running workflow receives the integration pass's NOT RUNNING lines through a declared input, a typed batch on an existing snapshot topic, and refuses a batch that is not current.
  acceptance:
  - id: AC1
    statement: 'AC1: read-not-running with no environment set by hand selects the NOT RUNNING lines of the newest published integration batch, oldest merge first -- falsifier: `uv run pytest -m unit tests/nodes/node_prove_running_workflow/test_prove_running_batch.py
      -k "declared_batch or newest_publication"` fails at the merge base (no snapshot_source) and passes at the head'
  - id: AC2
    statement: 'AC2: a batch older than the declared bound, a topic with no valid publication and a contract that still names a ledger path variable are each refused or caught -- falsifier: `uv run pytest -m unit
      tests/nodes/node_prove_running_workflow/test_prove_running_batch.py -k "stale_batch or no_batch or declared_in_the_contract"`'
evidence_requirements:
- kind: tests
  description: The workflow, starter and batch tests against Temporal's time-skipping test server.
  command: uv run pytest -m unit tests/nodes/node_prove_running_workflow -q --no-cov -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
