schema_version: 1.0.0
ticket_id: OMN-25849
title: 'Batch proof runs on Temporal: the prove-running workflow on a schedule replaces Claude placement agents for proof'
summary: 'An hourly Temporal Schedule starts a batch workflow over the prove-running workflow: every step is an activity that runs one of our nodes, the changes are grouped by host, one prove-running run
  starts per change with the workflow id <repo>#<n>@<sha>, and each proved change gets one STATUS row. The Temporal worker unit on h051 runs worker and children from one declared checkout.'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn25849-batch-proof
  statement: Batch proof of merged changes runs mechanically on a Temporal Schedule over the prove-running workflow, with no model in the loop.
  acceptance:
  - id: AC1
    statement: 'AC1: a Temporal Schedule on h051 fires every hour and starts one batch workflow that reads the integration ledger''s NOT RUNNING lines, groups them by host and starts one prove-running run
      per change, every step an activity that calls one of our nodes -- falsifier: `uv run pytest -m unit <batch workflow test file> -k "schedule_hourly or groups_by_host or activities_call_nodes"` against
      Temporal''s test server'
  - id: AC2
    statement: 'AC2: each proved change gets exactly one STATUS row with pr=<repo>#<n> installed=<host>:<revision> observed=<what ran> read_at=<UTC>, and a second fire over the same lines writes no second
      row -- falsifier: `uv run pytest -m unit <batch workflow test file> -k "one_status_row_per_change or refire_no_duplicate"`'
  - id: AC3
    statement: 'AC3: the Temporal worker unit on h051 runs worker and children from one checkout at one declared revision, installed from the branch through the declared installer -- falsifier: the unit''s
      ExecStart path and the working tree of each child process read over ssh on h051 name two different revisions'
  - id: AC4
    statement: 'AC4: one scheduled run is read complete on h051 with per-change rows on the ledger -- falsifier: grep of the ledger for the scheduled run id and for one STATUS row per change in that run''s
      input, each with its read time'
  - id: AC5
    statement: 'AC5: omnimarket 6336, 6340 and 6419 are handed off with a Lab: line in each body -- falsifier: `onex scm pr-view OmniNode-ai/omnimarket#<n>` body read for the Lab: line, for each of the
      three'
evidence_requirements:
- kind: tests
  description: The batch workflow and schedule tests against Temporal's time-skipping test server.
  command: uv run pytest -m unit tests/nodes/node_prove_running_workflow/test_prove_running_batch.py -q --no-cov -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn25849-ac1
  description: The schedule is hourly with overlap skipped, the batch reads and groups through node commands and every activity calls a node.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest -m unit tests/nodes/node_prove_running_workflow/test_prove_running_batch.py -q --no-cov -p no:randomly -k 'schedule_hourly or groups_by_host or activities_call_nodes'
    cwd: .
- id: dod-omn25849-ac2
  description: One STATUS row per change carrying pr, installed, observed, read_at and the batch id; a refire over the same lines writes no second row.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest -m unit tests/nodes/node_prove_running_workflow/test_prove_running_batch.py -q --no-cov -p no:randomly -k 'one_status_row_per_change or refire_no_duplicate'
    cwd: .
- id: dod-omn25849-ac3
  description: The temporal worker supervisor runs its children from the one checkout its unit names.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest -m unit tests/nodes/node_temporal_health_alarm_effect/test_temporal_worker_supervisor.py -q --no-cov -p no:randomly
    cwd: .
- id: dod-omn25849-ac4
  description: Each change a scheduled batch proves has one row carrying pr, installed, observed, read_at and the batch workflow id.
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run pytest -m unit tests/nodes/node_prove_running_workflow/test_prove_running_batch.py -q --no-cov -p no:randomly -k one_status_row_per_change
    cwd: .
- id: dod-omn25849-ac5
  description: 'The batch schedule definition the Lab: lines cite is the hourly one.'
  source: manual
  binds_ac:
  - AC5
  checks:
  - check_type: test_passes
    check_value: uv run pytest -m unit tests/nodes/node_prove_running_workflow/test_prove_running_batch.py -q --no-cov -p no:randomly -k schedule_hourly
    cwd: .
- id: dod-omn25849-integration-proof
  description: 'Hosted CI cannot reach the h051 Temporal server, so only the local Done gate runs this unbound check: the schedule is created on the h051 server and triggered once; the batch run completes
    with one STATUS row per change on the ledger.'
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --host h051 --lane dod-integration-proof-25849 --kind test -- uv run --frozen python -m omnimarket.nodes.node_prove_running_workflow
      schedule --target-host 127.0.0.1:7233 --trigger
    cwd: .
- id: dod-omn25849-ac3-ssh-read
  description: The unit's ExecStart path and each child's working tree are read over ssh on h051 and name one revision.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: ssh h051 "systemctl --user show onex-temporal-worker.service -p ExecStart | grep -c omn-25849"
    cwd: .
- id: dod-omn25849-ac4-ledger-grep
  description: The scheduled run's id appears on the ledger in one STATUS row per change.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: grep -c 'batch=onex-prove-running-hourly' "$ONEX_LEDGER_PATH"
    cwd: .
- id: dod-omn25849-ac5-lab-lines
  description: 'The comment or body of omnimarket 6336, 6340 and 6419 carries a Lab: line.'
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: 'onex scm pr-view OmniNode-ai/omnimarket#6336 | grep -Eq ''Lab: '''
    cwd: .
