schema_version: 1.0.0
ticket_id: OMN-24239
title: Each open host drift item past its limit gets one owned fix lane
summary: A new effect node reads the host drift checker's open items, renders each as the FRICTION row the alarm owner responder reads, and starts one lane per cause that no live lane covers, through the remote-lane runner. The runner path, the bounds, the actor and the paths are the node's overlay; the unit that runs it is declared in the registry units installer, so the dispatch command is no longer set by hand.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24239-owner-dispatch
  statement: An open drift item past its owner bound with no live lane covering its cause is answered with exactly one lane start, and a second pass starts no second lane for it.
  acceptance:
  - id: AC1
    statement: 'AC1: an open drift item past its bound is turned into one alarm row and the responder answers one dispatch for its cause key, none for a covered key -- falsifier: pytest tests/nodes/node_host_drift_owner_dispatch_effect -n 0 --no-cov -q fails when the row rendering or the coverage read is removed'
  - id: AC2
    statement: 'AC2: the dispatch command, bounds and lane settings come from an overlay file and the node refuses to run without them -- falsifier: the error chain test in the same directory fails when a default is added in code'
  - id: AC3
    statement: 'AC3: a second pass over the same open item starts no second lane (one dispatch per cause key per window) -- falsifier: the golden chain test fails when the dispatched record is not kept'
  - id: AC4
    statement: 'AC4: integrated: on lab host h053 one open drift item produces a lane placed (or the dry run naming the lane it would place) read from the node''s terminal event -- falsifier: the terminal event for a request on the dev broker names no lane for the open item'
evidence_requirements:
- kind: tests
  description: The tests of the owner dispatch node and of its installer unit pass.
  command: uv run pytest tests/nodes/node_host_drift_owner_dispatch_effect tests/nodes/node_host_installer_registry_units/test_host_drift_owner_dispatch_unit.py -n 0 --no-cov -q
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24239-ac1
  description: Two open items past the bound with no covering lane start two lanes; an item below the bound, an excluded kind and a covered cause start none.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_host_drift_owner_dispatch_effect/test_golden_chain.py tests/nodes/node_host_drift_owner_dispatch_effect/test_seam.py -n 0 --no-cov -q
- id: dod-omn24239-ac2
  description: An overlay with a missing or unknown key is refused naming the key, and the installer unit names the runner the overlay refers to.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_host_drift_owner_dispatch_effect/test_error_chain.py tests/nodes/node_host_installer_registry_units/test_host_drift_owner_dispatch_unit.py -n 0 --no-cov -q
- id: dod-omn24239-ac3
  description: A second pass over the same items starts nothing and every key is skipped as already dispatched; a refused placement is not recorded and the next pass retries it.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_host_drift_owner_dispatch_effect/test_golden_chain.py tests/nodes/node_host_drift_owner_dispatch_effect/test_error_chain.py -n 0 --no-cov -q -k 'second_pass or refused_placement'
- id: dod-omn24239-ac4
  description: 'hosted proxy for AC4: the runtime adapters read the checker''s real state file layout, the ledger read and a real subprocess; the lab reading on h053 is named in the pull request.'
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_host_drift_owner_dispatch_effect/test_runtime_adapters.py tests/nodes/node_host_drift_owner_dispatch_effect/test_contract.py -n 0 --no-cov -q
- id: dod-omn24239-brief-check
  description: A brief the lane-brief check refuses is never handed to the runner and is not recorded; the stamped bytes are the bytes the runner is given; the runtime preparer builds the brief from the rules block, the ticket text and the 3a constraints and checks it with real subprocesses.
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_host_drift_owner_dispatch_effect/test_brief_check.py -n 0 --no-cov -q
- id: dod-omn24239-integration-proof
  description: Run the owner dispatch node's tests on a lab host at the pushed head. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24239 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_host_drift_owner_dispatch_effect -q --no-cov
