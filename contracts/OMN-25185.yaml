schema_version: 1.0.0
ticket_id: OMN-25185
title: Review findings 1 to 10 on omnimarket PR 6344 at head c2f36ff3e677 are fixed or argued
summary: 'Third review follow-up of omnimarket#6344: the local rungs keep a wrapper margin so a prompt near the old ceiling
  is refused, the contract proof asserts the changed rung and input tokens above 8192, the ceiling test states literal outcomes
  per class and observes a narrowed overlay pair, no check binds the open criteria of OMN-24980, and the served model list
  is the raw endpoint body. The missing-terminal fix, the dev ladder mount and the local-share alarm remain open.'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn25185-review-follow-up
  statement: Every blocking finding of the third review of omnimarket#6344 is fixed or argued with evidence.
  acceptance:
  - id: AC1
    statement: 'AC1: a PR comment starting `Lab: head=<full new head sha>` names each command with exit 0 (the fail-at-53e3cd0f6050
      run and an xdist or random-order run included), and the contract names the owner tickets of the dev mount and the split-out
      alarm instead of "no owner ticket yet" -- falsifier: `onex scm pr-view OmniNode-ai/omnimarket#6344` shows no comment
      starting `Lab: head=` with the new head sha, or the comment lacks a command or exit 0, checked with `uv run pytest tests/nodes/node_delegation_routing_reducer/test_contract_proof_omn24980.py
      -q -p no:cacheprovider`'
  - id: AC2
    statement: 'AC2: no contract check binds AC1, AC2 or AC3 of OMN-24980 to a test that asserts status open, the Done gate
      reading of a passing bound check is stated, and the contract line that says no item binds AC1 is corrected -- falsifier:
      `uv run pytest tests/nodes/node_delegation_routing_reducer/test_contract_proof_omn24980.py -q -p no:cacheprovider` fails
      when a check bound to AC1, AC2 or AC3 asserts status open'
  - id: AC3
    statement: 'AC3: the input gate counts the rendered prompt or subtracts a wrapper margin, and the handler''s clamp of
      max_tokens is read and tested, so a request near 65536 estimated tokens is refused or clamped before it overflows 131072
      -- falsifier: `uv run pytest tests/nodes/node_delegation_routing_reducer/test_local_rung_context_ceiling_omn24980.py
      -q -p no:cacheprovider` fails when a prompt estimated at exactly 65536 tokens is accepted with a 65536 max_tokens'
  - id: AC4
    statement: 'AC4: the contract proof asserts the changed rung and metrics.input_tokens above 8192, a recorded run answered
      by a rung outside the packaged local tier fails it, and a mutation that names another lane is refused by a test -- falsifier:
      `uv run pytest tests/nodes/node_delegation_routing_reducer/test_contract_proof_omn24980.py -q -p no:cacheprovider` fails
      when a 373-token run answered by local-omnipc2-chat is presented as proof'
  - id: AC5
    statement: 'AC5: the ceiling test states the literal outcome per class and token count, with one beyond-local route per
      class, and takes no expected branch from the handler''s own config -- falsifier: `uv run pytest tests/nodes/node_delegation_routing_reducer/test_local_rung_context_ceiling_omn24980.py
      -q -p no:cacheprovider` fails when the handler''s config refuses every class at every token count'
  - id: AC6
    statement: 'AC6: a test narrows one class and rung pair inside the same 131072 overlay file and observes the changed outcome,
      so the refusal cannot come from the ladder alone, and the 1000-token calls assert a route instead of swallowing ProtocolConfigurationError
      -- falsifier: `uv run pytest tests/nodes/node_delegation_routing_reducer/test_local_rung_context_ceiling_omn24980.py
      -q -p no:cacheprovider` fails when the overlay narrowing leaves the outcome unchanged'
  - id: AC7
    statement: 'AC7: the four non-blocking findings are fixed or argued in a PR comment: the receipt envelope status and exit_code
      are checked against the model in omnibase_infra, the served model list is the raw body from an endpoint that is not
      the port-8001 host, and the reproduction is limited to summarization or argued for every class -- falsifier: `uv run
      pytest tests/nodes/node_delegation_routing_reducer/test_contract_proof_omn24980.py -q -p no:cacheprovider` fails when
      a receipt has top-level status or exit_code not success'
evidence_requirements:
- kind: tests
  description: Focused tests of every file the change touches.
  command: uv run pytest tests/nodes/node_delegation_routing_reducer/test_local_rung_context_ceiling_omn24980.py tests/nodes/node_delegation_routing_reducer/test_contract_proof_omn24980.py -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn25185-ac1
  description: The contract of OMN-24980 no longer reads that the follow-ups have no owner ticket yet and states they are
    unfiled, with their texts handed to the orchestrator; the Lab comment of the new head is posted after the push.
  source: manual
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_delegation_routing_reducer/test_contract_proof_omn24980.py -q --no-cov
    cwd: .
  binds_ac:
  - AC1
- id: dod-omn25185-ac2
  description: The three criteria of OMN-24980 are bound (binds_ac) only to checks that fail until the criterion is met, none
    to a record check that passes while the criterion is open, a test fails when the binding is removed or a bound check
    runs outside the local Done gate, and the contract states that a passing bound check counts as met at the Done gate.
  source: manual
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_delegation_routing_reducer/test_contract_proof_omn24980.py -q --no-cov
    cwd: .
  binds_ac:
  - AC2
- id: dod-omn25185-ac3
  description: The spread peer takes an input bound of 48128 (its 65536-token slot, minus its 16384 output
    reserve, minus a 1024-token wrapper margin over the recorded wrapper of at most 420 tokens), a tokenizer-free upper bound
    on the metered input; the handler does not clamp max_tokens and a test pins that, and a prompt estimated at 65536 tokens
    is refused for every local pair.
  source: manual
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_delegation_routing_reducer/test_local_rung_context_ceiling_omn24980.py -q
      --no-cov
    cwd: .
  binds_ac:
  - AC3
- id: dod-omn25185-ac4
  description: The proof command of OMN-24980 requires local-heavy-reasoning and metrics.input_tokens above 8192; the recorded
    373-token local-heavy-reasoning run is refused, and commands naming another lane, bus or locus are refused by a shape check.
  source: manual
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_delegation_routing_reducer/test_contract_proof_omn24980.py -q --no-cov
    cwd: .
  binds_ac:
  - AC4
- id: dod-omn25185-ac5
  description: The ceiling test holds a literal table of 19 classes with the rung that answers a fitting prompt and what an
    unpinned larger prompt meets, and one pinned route beyond the local tier per class; the oracle over the handler's config
    is removed.
  source: manual
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_delegation_routing_reducer/test_local_rung_context_ceiling_omn24980.py -q
      --no-cov
    cwd: .
  binds_ac:
  - AC5
- id: dod-omn25185-ac6
  description: One overlay file declares 131072 for every local pair and the loader reads each value back; narrowing one pair
    in that file changes that pair's outcome and leaves another pair unchanged; the 1000-token calls assert the routed rung.
  source: manual
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_delegation_routing_reducer/test_local_rung_context_ceiling_omn24980.py -q
      --no-cov
    cwd: .
  binds_ac:
  - AC6
- id: dod-omn25185-ac7
  description: The envelope is checked against omnibase_core's skill result model and its status enum, every non-success status
    and non-zero exit code fails the proof, the served model list is the raw body from the shared endpoint on port 8000, and
    the reproduction is limited to summarization in the contract.
  source: manual
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_delegation_routing_reducer/test_contract_proof_omn24980.py -q --no-cov
    cwd: .
  binds_ac:
  - AC7
- id: dod-omn25185-integration-proof
  description: Run the focused routing, contract-proof and delegation-health tests on a lab host at the pushed head. Hosted
    CI cannot reach the lab, so only the local Done gate runs this unbound check; it binds no acceptance criterion.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)"
      --lane dod-integration-proof-25185 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_delegation_routing_reducer/test_local_rung_context_ceiling_omn24980.py
      tests/nodes/node_delegation_routing_reducer/test_contract_proof_omn24980.py
      -q --no-cov
    cwd: .
