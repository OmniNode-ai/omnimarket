schema_version: 1.0.0
ticket_id: OMN-25214
title: 'Review findings 1 to 11 on omnimarket PR 6344 at head 3bb50f2f0531 are fixed or argued: the Lab comment names the
  owner tickets, OMN-24980 declares its criteria bound to checks that fail until met, the input margin is metered and the
  full tests run passes'
summary: 'Fourth review follow-up of omnimarket#6344: the OMN-24980 contract declares AC1, AC2 and AC3 bound to checks that
  fail until met, the input budget of both local rungs is sized from metered wrapper and density readings, the proof prompt
  is a generated code prompt that meters above 8192, the spread peer that answers on dev is read, the beyond-local routes
  are tested per class, and the non-blocking findings are fixed. The owner tickets for the dev mounted ladder and the local-share
  alarm do not exist and are named so in the OMN-24980 contract.'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn25214-review-follow-up
  statement: Every blocking finding of the fourth review of omnimarket#6344 is fixed or argued with evidence.
  acceptance:
  - id: AC1
    statement: 'AC1: a PR comment starting `Lab: head=<full new head sha>` names each command with exit 0 (the fail-at-53e3cd0f6050
      run and an xdist run included), and the contract names the owner tickets of the dev mount and the split-out alarm and
      its test asserts their ids, instead of "not yet filed as tickets" -- falsifier: `uv run pytest tests/nodes/node_delegation_routing_reducer/test_contract_proof_omn24980.py
      -q -p no:cacheprovider` fails when the contract text names no ticket id or the asserted ids are absent, and `onex scm
      pr-view OmniNode-ai/omnimarket#6344` shows no comment starting `Lab: head=` with the new head sha'
  - id: AC2
    statement: 'AC2: contracts/OMN-24980.yaml declares AC1, AC2 and AC3 as acceptance entries, each bound to a check that
      fails until the criterion is met (AC2 binds to a port-8001 model-list that returns 200), or an owner re-scope is recorded,
      and the Done gate is read to say whether it ignores the free-form context -- falsifier: `uv run pytest tests/nodes/node_delegation_routing_reducer/test_contract_proof_omn24980.py
      -q -p no:cacheprovider` fails when the acceptance list is empty or a declared criterion has no bound check'
  - id: AC3
    statement: 'AC3: the input margin of routing_tiers.yaml is sized from metered input_tokens of a real near-budget prompt
      per rung and of the wrapper per class, or max_tokens is clamped at dispatch, so a prompt denser than 4 characters per
      token cannot overflow 131072 -- falsifier: `uv run pytest tests/nodes/node_delegation_routing_reducer/test_local_rung_context_ceiling_omn24980.py
      -q -p no:cacheprovider` fails when a near-budget code-dense prompt is accepted with a max_tokens that overflows the
      window'
  - id: AC4
    statement: 'AC4: contracts/OMN-24980.yaml records one passing dev run, the peer that selects local-omnipc2-chat and its
      ceiling are read, and the 11436 value in the contract proof test is replaced by a metered count of the 44290-character
      prompt -- falsifier: `uv run pytest tests/nodes/node_delegation_routing_reducer/test_contract_proof_omn24980.py -q -p
      no:cacheprovider` fails when the proof input count is not the metered count'
  - id: AC5
    statement: 'AC5: the full tests/ run at the new head passes with the 65536 to 64512 change of local-coder, in named parts
      if a whole run times out, and any existing routing test that cites 65536 is changed or argued -- falsifier: `uv run
      pytest tests -q -p no:cacheprovider` on the lab at the new head exits 0, one named part per timeout'
  - id: AC6
    statement: 'AC6: the beyond-local route test pins one route per class, and the escalation and research rows are routed
      or the comment and the AC2 text of OMN-25102 are corrected -- falsifier: `uv run pytest tests/nodes/node_delegation_routing_reducer/test_local_rung_context_ceiling_omn24980.py
      -q -p no:cacheprovider` fails when every class takes the same beyond-local route'
  - id: AC7
    statement: 'AC7: the four non-blocking findings (the binds_ac test that cannot fail, the key-name comparison in place
      of model_validate against the model the CLI prints, the share-zero test that exercises no diff code, and the PR title
      against the 64512 diff) are fixed or argued in a PR comment -- falsifier: `uv run pytest tests/nodes/node_delegation_routing_reducer/test_contract_proof_omn24980.py
      -q -p no:cacheprovider` fails when the binds_ac check passes with the binding removed'
evidence_requirements:
