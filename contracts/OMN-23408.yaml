schema_version: 1.0.0
ticket_id: OMN-23408
title: The J8 live verbs expand the registry root from their own argument, so the floor host's control chains are found
summary: The J8 verbs run, tick and relocate-controls parsed --omni-home and never used it, so "$OMNI_HOME" in the overlay's watcher_state_path, emission_journal and control_journal was expanded from the calling shell's environment and not from the registry home the floor publisher was started with. Each verb now expands "$OMNI_HOME" in those three paths to the --omni-home value when one is given, and relocate-controls names the journal file and the line count it read when a chain is not found. This is the change that lets the four control chains on the floor host be moved out of the floor's journal, so J8 stops reading a missing typed failure for them.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23408-j8-omni-home
  statement: The J8 run, tick and relocate-controls verbs read the watcher state and the journals under the registry home named by --omni-home, and a control chain that is not found is reported with the journal path and line count that were read.
  acceptance:
  - id: AC1
    statement: 'AC1: omnimarket pull request 5643 carries this ticket''s contract and merges green, and the four control chains it names no longer read as a missing typed failure on J8 -- falsifier: uv run pytest tests for test_join_j8_live.py and the J8 row of the served floor after the next reading'
evidence_requirements:
- kind: tests
  description: The acceptance tests of this ticket at the pushed head. relocate-controls reads the journal under --omni-home and not the calling shell's OMNI_HOME (the test fails at the merge base, where the chain is not found), and a miss names the journal it read.
  command: uv run --frozen pytest tests/unit/nodes/node_pr_landing_decision_compute/test_join_j8_live.py -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23408-ac1-omni-home-honoured
  description: The J8 live tests pass at the pushed head, including the relocate-controls test whose shell OMNI_HOME is another tree and the error test that names the journal read. At the merge base (runtime_join_j8.py without --omni-home expansion) the two new tests fail.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/nodes/node_pr_landing_decision_compute/test_join_j8_live.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn23408-handler-served
  description: Deploy probe. GitHub serves the J8 runtime verbs at the checked-out HEAD with the --omni-home expansion. It fails at the merge base, which expands the overlay paths from the shell environment only.
  source: manual
  checks:
  - check_type: command
    check_value: >-
      gh api "repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_pr_landing_decision_compute/runtime_join_j8.py?ref=$(git rev-parse HEAD)" --jq .content | base64 -d | python3 -c 'import sys; source = sys.stdin.read(); assert all(name in source for name in ("home: Path | None", "dest=\"home\"", "lines read")); print("J8 omni-home deploy probe: PASS")'
- id: dod-omn23408-j8-floor
  description: The served floor reads the J8 row without a missing typed failure for the four control chains. Hosted CI cannot reach the floor host (the URL is in FLOOR_SIMPLE_URL), so only the local Done gate runs this unbound check. It reads passed only after the fix is installed on the floor host and relocate-controls has run with the publisher's registry home.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: "curl -s -m 20 \"${FLOOR_SIMPLE_URL:?set FLOOR_SIMPLE_URL to the served floor-simple.json}\" | python3 -c \"import json,sys; d=json.load(sys.stdin); sys.exit(0 if [j for p in d['pieces'] if p['piece']==8 for j in p['joins'] if j['id']=='J8'][0]['state']=='passed' else 1)\""
    cwd: .
- id: dod-omn23408-integration-proof
  description: The pushed head ran the J8 live tests on a lab host through the lab work runner and exited 0. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: 'env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23408 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/nodes/node_pr_landing_decision_compute/test_join_j8_live.py -q --no-cov -n 0 -p no:randomly'
    cwd: .
