schema_version: 1.0.0
ticket_id: OMN-26709
title: The agent message CLI undeclared-broker test injects its overlay root and never reads the host environment
summary: tests/cli/test_agent_message_cli.py::test_a_node_with_no_declared_broker_is_a_typed_refusal builds its own overlay root with a node overlay that declares no event_bus, so it answers undeclared_broker on a host that sets OMNI_HOME and ONEX_WORKSPACE_CONFIG_ROOT as it does on a clean one.
