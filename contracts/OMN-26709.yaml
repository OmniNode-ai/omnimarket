interface_change: false
interfaces_touched: []
requirements:
- id: req-omn26709-overlay-injected
  statement: The undeclared-broker CLI test supplies its overlay root and broker declaration itself and does not depend on the host overlay environment.
  acceptance:
  - id: AC4
    statement: 'AC4: the test passes with OMNI_HOME and ONEX_WORKSPACE_CONFIG_ROOT set to the host values and with both unset -- falsifier: the test fails in either environment'
