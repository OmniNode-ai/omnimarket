schema_version: 1.0.0
ticket_id: OMN-22690
title: The delegation DoD routing read counts verdicts that found no contract as failed attempts, so every tier reads 0 percent pass
summary: A DoD verdict that failed on the contract lookup (CONTRACT_MISSING) judged the ticket's paperwork, not the delegated run, so the routing DoD read no longer counts it as a sample; a verdict that failed on a check of the attempt still counts as a failed sample.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn22690-contract-missing-not-a-sample
  statement: The routing DoD read counts a verdict as a sample only when it judged the attempt.
  acceptance:
  - id: AC1
    statement: 'AC1: a test fails when a verdict that failed on a missing contract is counted as a DoD sample, built from the recorded dev verdict shape -- falsifier: uv run --frozen pytest tests/unit/routing/test_dod_overlay_contract_missing_omn22478.py -q --no-cov'
  - id: AC2
    statement: 'AC2: a verdict whose failed check exercised the attempt still counts as a failed sample -- falsifier: uv run --frozen pytest tests/unit/routing/test_dod_overlay_contract_missing_omn22478.py -q --no-cov -k behaviour_check'
evidence_requirements:
- kind: tests
  description: The DoD read tests pass
  command: uv run --frozen pytest tests/unit/routing/test_dod_overlay_contract_missing_omn22478.py tests/unit/routing/test_dod_overlay.py -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn22690-dod-read-tests
  description: Runs the contract-missing DoD read tests and the existing DoD overlay tests.
  source: manual
  binds_ac:
  - AC1
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/routing/test_dod_overlay_contract_missing_omn22478.py tests/unit/routing/test_dod_overlay.py -q --no-cov
    cwd: .
- id: dod-omn22690-integration-proof
  description: Run this pull request's own check on a lab host at the pushed head. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-22690 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/routing/test_dod_overlay_contract_missing_omn22478.py -q --no-cov
