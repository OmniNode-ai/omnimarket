---
schema_version: "1.0.0"
ticket_id: OMN-26336
title: "Composed-runtime boot test under dev limits on runtime-affecting PRs"
summary: "A node (node_composed_boot_loop_hold_check) judges one boot of the real composed main kernel, recreated under the CPU cap and memory limit the dev declarations give it with a stack sampler loaded, against a loop-hold bound and a health bound read from its contract. The existing composed-runtime-boot job drives it with three added steps; the bounds and limits are read from declarations and not held in code. Making the check a required context on the dev branch is a branch-protection change that belongs to the repository owner and is not made here."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn26336-boot-check
    statement: "A runtime-affecting pull request boots the real composed kernel under the dev limits and fails when a call holds the event loop over the bound or /health is not answered within its bound."
    acceptance:
      - id: AC1
        statement: "AC1: on a runtime-affecting pull request the check boots the real kernel with the full dev contract set at cpus=1 and the dev memory limit against a containerized broker and database, and is red when /health does not answer within the declared bound -- falsifier: uv run pytest tests/ci -q -k boot_health_bound passes with /health delayed past the bound"
      - id: AC2
        statement: "AC2: reintroducing a synchronous wire_from_manifest call in the bootstrap coroutine turns the check red -- falsifier: uv run pytest tests/ci -q -k sync_wire_from_manifest_regression passes with the check green"
      - id: AC3
        statement: "AC3: the check is red when any call holds the event loop over 1 s, read from a stack sampler that names the call -- falsifier: uv run pytest tests/ci -q -k loop_hold_over_one_second passes on a call that sleeps 1.5 s in the loop"
      - id: AC4
        statement: "AC4: a regression test built from the recorded 2026-11-21 startup logs and job records (31.6 s and 12.4 s holds, fixture path named in the pull request) fails on the broken code and passes on the fix -- falsifier: uv run pytest tests/ci -q -k startup_hold_2026_11_21"
evidence_requirements:
  - kind: tests
    description: "The four named falsifier selections of tests/ci/test_composed_boot_loop_hold_check.py."
    command: "uv run pytest tests/ci/test_composed_boot_loop_hold_check.py -q --no-cov"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-omn26336-ac1
    description: "The probe, run against a local server that answers only after the bound, is red; against one that answers inside the bound it is green; a 503 body counts as an answer; the dev limits are read from the infra declarations and the applied container limits are read back against them."
    source: manual
    binds_ac: [AC1]
    checks:
      - check_type: test_passes
        check_value: >-
          uv run pytest tests/ci/test_composed_boot_loop_hold_check.py -q --no-cov -k "boot_health_bound or limits or override"
  - id: dod-omn26336-ac2
    description: "A bootstrap coroutine that calls a synchronous wire_from_manifest across several items is red and the sampler names it; the same work handing the loop back between items is green."
    source: manual
    binds_ac: [AC2]
    checks:
      - check_type: test_passes
        check_value: >-
          uv run pytest tests/ci/test_composed_boot_loop_hold_check.py -q --no-cov -k sync_wire_from_manifest_regression
  - id: dod-omn26336-ac3
    description: "A call that sleeps 1.5 s on a real loop is named by the sampler and turns the verdict red; a 0.4 s call and many short calls stay green."
    source: manual
    binds_ac: [AC3]
    checks:
      - check_type: test_passes
        check_value: >-
          uv run pytest tests/ci/test_composed_boot_loop_hold_check.py -q --no-cov -k loop_hold_over_one_second
  - id: dod-omn26336-ac4
    description: "The recorded 2026-11-21 holds (tests/ci/fixtures/startup_hold_2026_11_21.json) are red on the broken code and green on the fix; the 31.6 s hold is marked unrecorded in the fixture."
    source: manual
    binds_ac: [AC4]
    checks:
      - check_type: test_passes
        check_value: >-
          uv run pytest tests/ci/test_composed_boot_loop_hold_check.py -q --no-cov -k startup_hold_2026_11_21
  - id: dod-omn26336-deploy-contract
    description: "Hosted deploy check: the composed-runtime-boot workflow drives the node with its three boot-check steps, in the one existing job."
    source: manual
    checks:
      - check_type: command
        check_value: >-
          test "$(grep -c 'node_composed_boot_loop_hold_check' .github/workflows/runtime-boot-composed.yml)" -ge 3
        cwd: .
  - id: dod-omn26336-integration-proof
    description: "Local Done gate only, so it binds no criterion here: on a lab host the focused boot-check tests run at the pushed head through onex lab-work, the placement the lanes use for a run beyond one file."
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: >-
          onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-26336 --kind test -- uv run --frozen pytest tests/ci/test_composed_boot_loop_hold_check.py -q --no-cov
        cwd: .
