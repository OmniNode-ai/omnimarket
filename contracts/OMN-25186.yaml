dod_evidence:
- id: dod-omn25186-ac1-ac4-ac5-items-read-the-alarm
  description: The AC4 item of the OMN-24874 contract needs the squash commit of the alarm pull request on origin/dev as an ancestor of the alarm unit's installed revision and an alarm row stamped at or after the install; the AC5 item needs a CLEAN row at the head of each of the two pull requests. A temp repo with hostname shim, install record and ledger rows shows each passing and failing.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/test_omn24874_contract_checks.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn25186-ac2-async-twin-controls
  description: The async ceiling twin's control takes the overlay call's arguments (metered, headroom 0.0, the same cost) with only the tier changed and asserts its one statement is the budget upsert.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/delegation/test_omn24874_tenant_overlay_budget_readers.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn25186-ac2-real-postgres
  description: The real-Postgres file of the cost fix, whose async ceiling control is now the overlay call's arguments with only the tier changed, runs on a lab host against a disposable postgres:16-alpine container that the command starts and removes; it fails when any of the file's tests is skipped. Local Done gate only.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --bus-lane dev --omnibase-path "${OMNI_HOME:?}" --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-real-postgres-25186 --kind test -- sh -c 'PW=$(head -c 18 /dev/urandom | base64 | tr -dc A-Za-z0-9); N=dod-omn24874-pg-$$; OUT=/tmp/$N.out; docker run -d --rm --name "$N" -e POSTGRES_PASSWORD="$PW" -e POSTGRES_DB=omnibase_infra -p 127.0.0.1::5432 postgres:16-alpine >/dev/null; trap "docker rm -f $N >/dev/null; rm -f $OUT" EXIT; for i in $(seq 1 40); do docker exec "$N" pg_isready -U postgres -q && break; sleep 1; done; PORT=$(docker port "$N" 5432/tcp | head -1 | sed "s/.*://"); INTEGRATION_POSTGRES_PASSWORD="$PW" INTEGRATION_POSTGRES_HOST=127.0.0.1 INTEGRATION_POSTGRES_PORT="$PORT" env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/test_omn24874_tenant_overlay_cost_real_postgres.py -q --no-cov -n 0 -p no:randomly -rs > "$OUT" 2>&1; R=$?; cat "$OUT"; ! grep -q skipped "$OUT" && exit $R'
    cwd: .
- id: dod-omn25186-ac3-comments-name-findings-and-head
  description: 'The PR holds a comment starting Lab: head= with the full head of the checkout, and a comment naming each of findings 3 to 6 of this review round. Local Done gate only: it reads the pull request comments and a sha.'
  source: manual
  binds_ac:
  - AC3
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: 'sh -c ''C=$(onex scm pr-view OmniNode-ai/omnimarket#6335 --comments) && printf %s "$C" | grep -qF "Lab: head=$(git rev-parse HEAD)" && for n in 3 4 5 6; do printf %s "$C" | grep -qF "OMN-25186 finding $n" || exit 1; done'''
    cwd: .
- id: dod-omn25186-integration-proof
  description: The contract check tests, the ceiling budget reader tests and the tenant overlay pricing tests run on a lab host at the pushed head through the lab work runner; hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --bus-lane dev --omnibase-path "${OMNI_HOME:?}" --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-25186 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/test_omn24874_contract_checks.py tests/unit/delegation/test_omn24874_tenant_overlay_budget_readers.py tests/unit/delegation/test_omn24874_tenant_overlay_terminal_cost.py -q --no-cov -n 0 -p no:randomly
    cwd: .
