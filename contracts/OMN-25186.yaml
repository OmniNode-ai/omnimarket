    statement: 'AC3: each non-blocking finding 3 to 6 is fixed in the push or argued with evidence in a PR comment, and a PR comment starting `Lab: head=<full new head sha>` names the sha, the lab command and exit 0 -- falsifier: `onex scm pr-view OmniNode-ai/omnimarket#6335 --comments` shows no comment naming findings 3 to 6, or a Lab comment without the full sha, the command or exit 0'
