  acceptance:
  - id: AC1
    statement: 'AC1: the AC4 item of contracts/OMN-24874.yaml needs the alarm unit''s install record on h053 and a row newer than it or moves to 6353, the AC5 item needs a CLEAN row at 6353''s head, and the summary lines in the contract are corrected, with a test built on a temp repo -- falsifier: `uv run --frozen pytest tests/test_omn24874_contract_checks.py -q` passes with the AC4 item reading any old src=alarm row'
- id: req-omn25186-ac2
