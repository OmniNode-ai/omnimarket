schema_version: 1.0.0
ticket_id: OMN-25291
title: The emit daemon contract names the answer a caller waits for
summary: 'node_emit_daemon names its two answer topics only under runtime_dispatch.terminal_events (success and failure) and has no top-level terminal_event key, which the route resolver of onex run-node
  (omnibase_core.cli.cli_run_node._resolve_node_topics) requires; onex run-node refuses the node with "contract ... does not declare a terminal_event", so no demand reaches the node on the dev runtime. The
  contract gains a top-level terminal_event naming the success answer, and a new test file holds the golden, the error chain and a failing control. Not in this change: the run-node overlay that declares
  the bus lane for the node, and the run through the running dev runtime (AC3).'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn25291-terminal-event
  statement: The emit daemon contract declares a top-level terminal_event that the route resolver of onex run-node reads, and the failure answer stays under runtime_dispatch.terminal_events.failure.
  acceptance:
  - id: AC1
    statement: 'AC1: the contract of node_emit_daemon declares terminal_event with the topic onex.evt.omnimarket.emit-daemon-lifecycle-completed.v1, and the contract loader of onex run-node resolves it
      -- falsifier: pytest tests/unit/nodes/node_emit_daemon/test_terminal_event_seam.py -q fails at the base, where the loader refuses the contract for declaring no terminal_event'
  - id: AC2
    statement: 'AC2: a contract whose terminal_event differs from its runtime_dispatch success topic is refused -- falsifier: the control test in the same file passes only if the refusal names both topics'
  - id: AC3
    statement: 'AC3: integrated: onex run-node node_emit_daemon with the action status, run against the dev bus, returns the lifecycle completed event from the running dev runtime, read after the runtime carries
      this change and the run-node overlay for the node is declared -- falsifier: the run still ends with a refusal naming terminal_event or the missing overlay'
evidence_requirements:
- kind: tests
  description: The terminal event seam test passes at the pushed head.
  command: uv run --frozen pytest tests/unit/nodes/node_emit_daemon/test_terminal_event_seam.py -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
