schema_version: 1.0.0
ticket_id: OMN-22015
title: The omnimarket lab host row model accepts cap 0, so the host table that sets the orchestrator Mac lane cap to 0 stays readable and lab-run places again
summary: ModelLabHostRow.cap becomes ge=0. The launcher lab_run_hosts.yaml h200 row carries cap 0, which the model refused, so every reader of the table raised and every lab-run placement exited 69 (could_not_check).
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn22015-lab-host-cap-zero
  statement: A lab host table whose h200 row carries cap 0 is refused whole by every reader that validates it through ModelLabHostRow, so lab placement refuses every unit with could_not_check and exit 69.
  acceptance:
  - id: AC1
    statement: 'AC1: ModelLabHostsTable accepts a row with cap 0 and still refuses a negative cap -- falsifier: uv run pytest tests/unit/lab_work -q -k cap_zero'
  - id: AC2
    statement: 'AC2: ModelLabHostRow accepts unit_slots between 1 and 64 (the lab-work serve unit count a host row declares) and refuses 0 and 65 -- falsifier: uv run pytest tests/unit/lab_work -q -k unit_slots'
evidence_requirements:
- kind: tests
  description: The lab work host table suite.
  command: uv run pytest tests/unit/lab_work -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn22015-ac1
  description: AC1 a cap 0 row validates and a negative cap is refused.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/lab_work/test_lab_work_host_table.py -q --no-cov --tb=line -k cap_zero
    cwd: .
- id: dod-omn22015-ac2
  description: AC2 unit_slots validates between 1 and 64 and is refused outside.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/lab_work/test_lab_work_host_table.py -q --no-cov --tb=line -k unit_slots
    cwd: .
- id: dod-omn22015-integration-proof
  description: The pushed head places a unit on a lab host over the bus with the launcher host table in force (its h200 row carries cap 0) and exits 0. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-22015 -- true
    cwd: .
