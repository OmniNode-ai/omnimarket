schema_version: "1.0.0"
ticket_id: "OMN-26454"
title: "opentelemetry 1.44.0 in omnimarket uv.lock turns Dependency Security Scan red on every omnimarket PR, and CI Summary fails closed on it"
summary: "Safety advisories SFTY-20261022-15927 (opentelemetry-api) and SFTY-20261018-93041 (opentelemetry-exporter-otlp-proto-http) turned the Safety step of Dependency Security Scan red on every omnimarket pull request; the lock moves opentelemetry to 1.45.2."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-omn26454-lock-floor"
    statement: |-
      omnimarket uv.lock pins opentelemetry-api and opentelemetry-exporter-otlp-proto-http 1.45.2 or later, moves only opentelemetry packages, and every work-contract uv.lock sha256 pin matches the new uv.lock.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: omnimarket uv.lock pins opentelemetry-api and opentelemetry-exporter-otlp-proto-http 1.45.2 or later, moves only opentelemetry packages, and every work-contract uv.lock sha256 pin matches the new uv.lock -- falsifier: uv run pytest tests/ci/test_omn26454_opentelemetry_lock_floor.py -q fails
  - id: "req-omn26454-scan-clean"
    statement: |-
      The Safety step of Dependency Security Scan reports neither advisory on a pull request opened after the bump.
    acceptance:
      - id: "AC2"
        statement: |-
          AC2: the Safety step of Dependency Security Scan reports neither advisory on a pull request opened after the bump -- falsifier: safety 3.8.1 check on the exported lock reports SFTY-20261022-15927 or SFTY-20261018-93041
evidence_requirements:
  - kind: "tests"
    description: "The lock-floor test reads uv.lock and fails while either package is below 1.45.2; the work-contract pin test fails while any pin names another lock hash."
    command: "uv run pytest tests/ci/test_omn26454_opentelemetry_lock_floor.py tests/nodes/test_work_contract_pins_current.py -q -n 0 --no-cov"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn26454-ac1-lock-floor"
    description: "The lock-floor test parses uv.lock and asserts both opentelemetry packages are 1.45.2 or later, with planted 1.44.0 and missing-package controls. Fails at the merge base, whose lock pins 1.44.0."
    source: "manual"
    binds_ac: ["AC1", "AC2"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_omn26454_opentelemetry_lock_floor.py -q -n 0 --no-cov"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn26454-integration-proof"
    description: >-
      Run the opentelemetry lock-floor test and the work-contract pin test on a lab host at the pushed
      revision, against the synced environment of that lock. This local completion proof carries
      no hosted AC bindings.
    source: "manual"
    execution_scope: "local_done_gate"
    checks:
      - check_type: "command"
        check_value: >-
          env PYTHONDONTWRITEBYTECODE=1 onex lab-work run
          --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)"
          --lane dod-integration-proof-26454 --kind test --
          uv run --frozen pytest
          tests/ci/test_omn26454_opentelemetry_lock_floor.py tests/nodes/test_work_contract_pins_current.py
          -q -n 0 --no-cov --refuse-skips
        cwd: "."
