---
schema_version: "1.0.0"
ticket_id: "OMN-19609"
title: "The work ledger query node narrows a rows read by row type and lane in the store, so readers can move off the ledger file"
summary: "node_work_ledger_query_effect read every row of the window from work_ledger_rows and filtered kind and lane in Python, so each rows read took seconds and the query node answers one read at a time. A rows or rulings read that names a start now asks the store for the asked row types and the rows whose text holds the lane (a superset of what the lane filter keeps); the handler still applies every filter, so the answer is unchanged. Readers without the narrowing method and every other answer read the window whole as before."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-omn19609-ac1-same-answer"
    statement: "A rows read narrowed in the store answers exactly as the whole-window read, for every row type and lane of the fixture, a MSG addressed to the lane included."
    acceptance:
      - id: "AC1"
        statement: "AC1: a narrowed rows read answers as the whole-window read and the store is asked to narrow -- falsifier: uv run pytest tests/unit/nodes/node_work_ledger_query_effect/test_rows_read_narrowed_in_store.py -q"
evidence_requirements:
  - kind: "tests"
    description: "AC1: every kind, every lane and every kind-and-lane pair of the fixture answer the same narrowed and whole; a read with no start reads the window whole."
    command: "uv run pytest tests/unit/nodes/node_work_ledger_query_effect/test_rows_read_narrowed_in_store.py -q --no-cov"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn19609-ac1-same-answer"
    description: "AC1 compares the handler's answer through a reader that narrows in the store against the whole-window reader for every kind and lane of the golden chain fixture, and asserts the narrowing method was the one called."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/nodes/node_work_ledger_query_effect/test_rows_read_narrowed_in_store.py -q --no-cov --tb=line"
        cwd: "."
    binds_ac: ["AC1"]
  - id: "dod-omn19609-query-narrowing-integration-proof"
    description: "The pushed head ran the work ledger query node suite on a lab host and exited 0. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check."
    source: "manual"
    execution_scope: "local_done_gate"
    checks:
      - check_type: "command"
        check_value: "uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha \"$(git rev-parse HEAD)\" --lane dod-integration-proof-19609 -- uv run --frozen pytest tests/unit/nodes/node_work_ledger_query_effect tests/test_golden_chain_work_ledger_query.py -q --no-cov"
        cwd: "."
  - id: "dod-omn19609-deploy-source-readback"
    description: "Hosted-runner deploy check: read the published reader source at the evaluated checkout revision from the repository host and require the store-side narrowing method and its row-type and text filters. A published revision without the method, or without either filter, fails. This reads the published source, not the running node; the live read below is the local Done gate's."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: "curl --fail --silent --show-error --location --max-time 30 \"https://raw.githubusercontent.com/OmniNode-ai/omnimarket/$(git rev-parse HEAD)/src/omnimarket/nodes/node_work_ledger_query_effect/handlers/work_ledger_query_reader.py\" | python3 -c 'import sys; src = sys.stdin.read(); assert \"def read_rows_matching\" in src; assert \"row_type = ANY(%s)\" in src; assert \"strpos(raw_row, %s) > 0\" in src; print(\"OMN-19609 deploy source readback: store-side narrowing PASS\")'"
        cwd: "."
    binds_ac: ["AC1"]
  - id: "dod-omn19609-deployed-parity-read"
    description: "The piece 6 parity read, as the reading writer sends it through the read command, answers on the dev bus in under 60 seconds and returns the parity rows of the 36 hour window. A query node that reads the whole window, or one that is not deployed, fails the read or the bound. Only the local Done gate runs it, because hosted CI cannot reach the lab bus."
    source: "manual"
    execution_scope: "local_done_gate"
    checks:
      - check_type: "command"
        check_value: "bash -c 'set -euo pipefail; now=$(date -u +%Y-%m-%dT%H:%M:%SZ); since=$(date -u -d \"36 hours ago\" +%Y-%m-%dT%H:%M:%SZ); printf \"{\\\"query\\\":\\\"rows\\\",\\\"since\\\":\\\"%s\\\",\\\"until\\\":\\\"%s\\\",\\\"kinds\\\":[\\\"STATUS\\\"],\\\"limit\\\":20000,\\\"lane\\\":\\\"work-ledger-parity\\\"}\" \"$since\" \"$now\" | timeout 60 uv run onex ledger query --stdin | python3 -c \"import json,sys; a = json.load(sys.stdin); assert a[\\\"matched\\\"] >= 1 and len(a[\\\"rows\\\"]) == a[\\\"matched\\\"], a[\\\"matched\\\"]\"'"
        cwd: "."
