---
schema_version: "1.0.0"
ticket_id: "OMN-21908"
title: "A host table row decides which lab hosts take Docker work"
summary: "Bus placement checked `--need docker` against the advertised tool list, which is one constant on every host, so a host with no Docker passed. Operator RULING 2026-11-01T20:24:40Z takes Docker off the Macs, so the host table gains a `docker` capability column the placement node judges."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-omn21908-docker-column"
    statement: |-
      A caller's need for a tool that names a host capability column is judged against the host table row, so a row declaring `docker: false` takes no Docker unit though it advertises the tool.
    acceptance:
      - id: "AC1"
        statement: "AC1: a unit needing docker is refused on a `docker: false` row with a reason naming the capability, and is placed on a row that takes Docker; alone with such a row it is refused as HOST_TABLE."
  - id: "req-omn21908-other-units-unchanged"
    statement: |-
      A unit with no such need still runs on a `docker: false` row, and a tool that names no capability column stays a plain tool check.
    acceptance:
      - id: "AC2"
        statement: "AC2: a unit with no Docker need is placed on a `docker: false` row, and a need for `gh` is decided by the advertised tools alone."
evidence_requirements:
  - kind: "tests"
    description: "The lab host table placement tests pass, the Docker column ones among them."
    command: "uv run pytest tests/unit/lab_work/test_lab_work_host_table.py -q --no-cov"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn21908-docker-refused"
    description: "A Docker unit is refused on a no-Docker row and placed on a row that takes Docker."
    source: "manual"
    binds_ac: ["AC1"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/lab_work/test_lab_work_host_table.py -q --no-cov -k docker_unit"
        cwd: "."
  - id: "dod-omn21908-other-units"
    description: "Units without a Docker need are unchanged on that row."
    source: "manual"
    binds_ac: ["AC2"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/lab_work/test_lab_work_host_table.py -q --no-cov -k 'no_docker_still_runs or not_a_capability_column'"
        cwd: "."
