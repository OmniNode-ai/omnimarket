schema_version: "1.0.0"
ticket_id: "OMN-26767"
title: "OmniDash 1.1.17 ships the dashboard window, rollout and failed-read fixes and the safe markdown run page"
summary: >-
  Acceptance for OMN-26767 in omnimarket. omnimarket pins OmniDash v1.1.17 (sha256
  51cb5486a086a6aa35e968055c171adf80081007018312816f7fc14f8bf76def), the release that ships 23687cd7
  (omnidash#543, OMN-26665) and the OMN-26646 safe markdown run page (omnidash#542). AC3 is bound to
  tests/projection/test_dashboard_bundle_pin_omn23212.py; AC1 and AC2 are proved in omnidash
  (omnidash#546 and the v1.1.17 tag), so this contract lists only AC3.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-omn26767-omnimarket-pin-1117"
    statement: >-
      omnimarket pins the OmniDash v1.1.17 bundle that carries the dashboard window, rollout and
      failed-read fixes and the safe markdown run page.
    acceptance:
      - id: "AC3"
        statement: >-
          omnimarket dev pins OmniDash v1.1.17, with the packaged bundle parts matching the pinned sha256
          -- falsifier: the omnimarket dashboard bundle pin test fails on the v1.1.16 pin and passes on the
          v1.1.17 pin
evidence_requirements: []
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn26767-ac3-bundle-pin-1117"
    description: >-
      AC3: the pin test reads v1.1.17, its sha256 and asset from the pin and verifies the packaged parts;
      it fails on the v1.1.16 pin.
    source: "manual"
    binds_ac: ["AC3"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/projection/test_dashboard_bundle_pin_omn23212.py -q -p no:randomly"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn26767-integration-proof"
    description: >-
      Run the v1.1.17 pin's integration cases on a lab host at the pushed head: the pinned asset verifies
      through ensure_bundle, carries the cursor walk and v1.1.13's pages and writes a zero amount with its
      cents, and the release sidecar names the pinned digest. Hosted CI cannot reach the lab, so only the
      local Done gate runs this unbound check.
    source: "manual"
    execution_scope: "local_done_gate"
    checks:
      - check_type: "command"
        check_value: >-
          env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha
          "$(git rev-parse HEAD)" --lane dod-integration-proof-26767 --kind test -- env
          PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/projection/test_dashboard_bundle_pin_omn23212.py
          -m integration -q --no-cov
        cwd: "${OMNI_HOME}/omnimarket"
