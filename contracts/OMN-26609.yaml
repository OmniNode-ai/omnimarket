schema_version: 1.0.0
ticket_id: OMN-26609
title: dev work-ledger answerer times out at about 121 s, so the pr-create duplicate guard reads unchecked and every lane's PR create is refused
summary: The work-ledger query request carries its caller's deadline and the answerer drops a request whose deadline has passed without touching the store; the claims reader stamps the deadline it will wait to; the lab alarm's broker lag condition alarms on a watched group's lag above a declared ceiling, with the bound and the owner as overlay data.
is_seam_ticket: false
interface_change: true
interfaces_touched:
- public_api
requirements:
- id: req-omn26609-expired-reads-not-worked
  statement: A request whose caller's deadline has passed is answered with a typed deadline_expired error and never reaches the query work; a live request answers; a request with no deadline keeps today's behaviour.
  acceptance:
  - id: AC5
    statement: 'AC5: a regression test built from the recorded reader output of this incident (the exit 69 bus-session answers and the consumer or ACL reading, fixture path named in the pull request or the comment) fails on the broken state and passes on the fix, or, for a unit restart with no code change, one check names this class and alerts after the first lane that hits it -- falsifier: uv run pytest of that test or check over the recorded fixture fails when the fixture is replaced by a healthy answer'
evidence_requirements:
- kind: tests
  description: The deadline, reader stamping and lag ceiling tests pass at the pushed head.
  command: uv run pytest tests/unit/nodes/node_work_ledger_query_effect/test_request_deadline_omn26609.py tests/unit/nodes/node_work_ledger_reader_effect/test_reader_request_deadline_omn26609.py tests/nodes/node_lab_alarm/test_lab_alarm_lag_ceiling_omn26609.py -q -n 0 --no-cov -p no:cacheprovider
