  - id: "dod-omn20866-deploy-withheld-reason-on-transitions"
    description: "Deploy probe on the lab dev lane once the deploy agent rolls this change: the landing orchestrator's transition events on the dev broker carry a withheld_reason naming a held or unproven head (ledger_hold_in_force, ledger_holds_unknown, lab_pass_missing or lab_pass_unknown). Run with KAFKA_BOOTSTRAP_SERVERS set to the dev lane broker (bus-local); it exits nonzero on a runtime that predates this change, which publishes no withheld_reason. Hosted CI has no dev broker, so only the local Done gate runs it."
    source: "manual"
    execution_scope: "local_done_gate"
    checks:
      - check_type: "command"
        check_value: "kcat -C -b \"${KAFKA_BOOTSTRAP_SERVERS:?set KAFKA_BOOTSTRAP_SERVERS to the dev lane broker}\" -t onex.evt.omnimarket.pr-landing-transitioned.v1 -o -500 -e -q | grep -Eq '\"withheld_reason\": ?\"(ledger_hold_in_force|ledger_holds_unknown|lab_pass_missing|lab_pass_unknown):'"
        cwd: "${OMNI_HOME}/omnimarket"
