    description: "AC1: the contract's landing_config decides each repository's mode; a handler on the code default fails."
    command: "uv run pytest tests/unit/nodes/node_pr_landing_orchestrator/test_pr_landing_leaves_shadow_omn_20866.py -q -k config"
  - kind: "tests"
    description: "AC2: the omnimarket canary, companion-exempt, reaches READY then ARMED with an enforce arm on recorded check runs; reruns stay dry_run; a declined companion outside the exempt set needs an agent."
    command: "uv run pytest tests/unit/nodes/node_pr_landing_orchestrator/test_pr_landing_leaves_shadow_omn_20866.py -q -k enforce"
  - kind: "tests"
    description: "AC2 landing step: a green canary PR GitHub reports clean, with no auto-merge armed, is merged at its exact head (mergePullRequest with expectedHeadOid) instead of armed; real dev-lane PR-state records reach READY through the contract route."
