schema_version: "1.0.0"
ticket_id: "OMN-20866"
title: "The PR landing orchestrator leaves shadow mode on the lab dev lane: its config comes from the contract and companion commands stop being sent as dry runs"
summary: "node_pr_landing_orchestrator builds PrLandingOrchestratorConfig from the landing_config block of its contract.yaml (mode per repository, companion-exempt, queue and observed-prompt repositories, arm policy), wires classify_head_checks as its head-check classifier with the base branch's required contexts read by the GitHub landing effect, and runs the omnimarket canary in enforce for reads and the arm, companion-exempt, with rerun_runs, update_branch and disarm kept dry_run everywhere. AC3 is read live on the dev lane after the deploy agent rolls it."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-ac1"
    statement: "The handler builds PrLandingOrchestratorConfig from contract.yaml, and a test refuses a handler that ignores the declared mode."
    acceptance:
      - id: "AC1"
        statement: "AC1: the handler builds PrLandingOrchestratorConfig from contract.yaml and a test refuses a handler that ignores the declared mode -- falsifier: uv run pytest tests/unit/nodes/node_pr_landing_orchestrator/test_pr_landing_leaves_shadow_omn_20866.py -q -k config"
  - id: "req-ac2"
    statement: "For a canary repository in enforce, a companion command is sent with dry_run false or the repository is companion-exempt, and a replay test reaches READY then ARMED for a green PR."
    acceptance:
      - id: "AC2"
        statement: "AC2: for a canary repository in enforce, a companion command is sent with dry_run false, or the repository is companion-exempt, and a replay test reaches READY then ARMED for a green PR -- falsifier: uv run pytest tests/unit/nodes/node_pr_landing_orchestrator/test_pr_landing_leaves_shadow_omn_20866.py -q -k enforce"
evidence_requirements:
