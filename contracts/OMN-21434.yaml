schema_version: 1.0.0
ticket_id: OMN-21434
title: 'The capability map reads graded runs that record the machine that served each model, so it writes rated cells on the dev lane'
summary: 'A graded grid run records, on every capability verdict row, the backend it asked (backend_id), the host that backend''s endpoint lives on (host) and the backend that answered (answering_backend). The grid handler takes a grade that names the serving machine and stamps the answering backend and the served model into the row identity, so an answer from another backend or model is refused as identity_mismatch and one with no answering backend as identity_field_missing. A committed lab command, python -m omnimarket.nodes.node_projection_delegation_capability_map.lab_grid_run grid-run, answers each distinct stored prompt of delegation_eval_items on each backend of a backends file through that backend''s endpoint, grades the answer with the class rubric, writes the content-free verdict rows as JSON lines and hands the map run to the capability map writer. The labelled-item seed also carries host and answering_backend from delegation_events.'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn21434-graded-run-serving-identity
  statement: Graded runs record the machine that served each answer, so the capability map writes rated cells on the dev lane.
  acceptance:
  - id: AC1
    statement: 'AC1: a graded run on the dev lane produces verdict rows whose backend_id, host and answering_backend are all non-empty -- falsifier: a query of the run''s verdict rows that counts any row with one of the three empty'
  - id: AC2
    statement: 'AC2: the capability map run over those rows writes at least one cell and refuses none as identity_field_missing -- falsifier: the map_run summary shows 0 cells written or a non-zero identity_field_missing count'
evidence_requirements:
- kind: tests
  description: The graded-run serving identity tests pass at the head; at the merge base the grade model and the grid lab command do not exist, so the module fails to import.
  command: uv run pytest tests/nodes/node_delegation_capability_map_compute/test_graded_run_serving_identity_omn21434.py -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
