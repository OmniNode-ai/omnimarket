schema_version: 1.0.0
ticket_id: OMN-26091
title: The code graph lookup finds its overlay and its clones on every host through the overlay root resolver
summary: The code graph node's overlay load resolves its roots through the overlay root resolver (the store root, the canonical overlays clone beside the registry root, then the declared roots), and the clones root falls back to the registry root when the overlay's repos_root_env variable is unset. A host whose declared overlay roots hold only the plugin's overlay folder, or that sets no clones root variable, answers the lookup with no hand copy and no shell profile edit.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn26091-resolved-roots
  statement: The code graph lookup finds node_code_graph_effect/overlay.yaml through the overlay root resolver and takes the clones root from the registry root when its variable is unset.
  acceptance:
  - id: AC2
    statement: "AC2: the Mac's ONEX_SKILL_OVERLAY_ROOTS resolves node_code_graph_effect/overlay.yaml through the declared overlay-store refresh unit (ai.omninode.overlay-store-refresh) with no hand copy -- falsifier: the lookup command above prints INDETERMINATE NodeOverlayNotFoundError on the Mac before the change and an answer after the unit's next tick, and git diff of the change touches no hand-copied file under a host overlay root"
evidence_requirements:
- kind: tests
  description: The node's overlay load and clones root with only a plugin overlay folder declared and the clones root variable unset, through the node's own CLI on real git clones.
  command: env -u PYTHONPATH uv run --frozen pytest tests/nodes/node_code_graph_effect/test_code_graph_resolved_roots.py -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn26091-ac2-resolved-roots-tests
  description: With ONEX_SKILL_OVERLAY_ROOTS naming only a directory with no code graph overlay and the canonical overlays clone beside the registry root holding one, the lookup finds the overlay and answers from real git clones with the clones root variable unset; the explicit clones root variable and the declared roots still win where they apply; with nothing resolving the load refuses with the typed not-configured message and an unset clones root with no registry root names the variable and both registry root variables. The tests fail on the code before the change and pass after it.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_code_graph_effect/test_code_graph_resolved_roots.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn26091-ac2-integration-proof
  description: Hosted CI holds no registry clones or overlays clone, so only the local Done gate runs this check, so it binds no criterion here (the hosted base control refuses a bound item it cannot run); AC2 is bound by the resolved-roots tests above. On a lab host, with the overlay roots naming only a directory that holds no code graph overlay and the clones root variable unset, it asks the importers of the overlay reader and fails on a LOOKUP line that is not found.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-26091 --kind test -- sh -c 'env -u ONEX_CODE_GRAPH_REPOS_ROOT ONEX_SKILL_OVERLAY_ROOTS="$HOME" OMNIBASE_PATH="$OMNI_HOME" uv run --frozen python -m omnimarket.nodes.node_code_graph_effect lookup --question importers --repo omnimarket --path src/omnimarket/handlers/node_overlay_reader.py | grep -qE "^LOOKUP .*status=found "'
    cwd: .
