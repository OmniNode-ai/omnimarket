schema_version: 1.0.0
ticket_id: OMN-22452
title: the pre-push stage hooks of a repository are evaluated against a lane's pending push range before the lane pushes, by an omnimarket node
summary: The remote-lane hook-preflight ran the repository's commit-stage hooks only, so a lane that passed it was still refused at push by a pre-push hook and lost the whole run. node_prepush_preflight_effect runs pre-commit's pre-push stage over the range the push would carry (the branch's upstream or the landing branch, to HEAD, with the staged change as its tip) and returns each refusal with its hook id and finding. The remote-lane script makes one call to it.
is_seam_ticket: false
interface_change: true
interfaces_touched: ["public_api"]
requirements:
- id: req-omn22452-prepush-evaluation
  statement: A lane learns of a pre-push hook refusal, with the hook id and its finding, before it pushes.
  acceptance:
  - id: AC1
    statement: 'AC1: the handler runs the repository''s pre-push stage hooks against the pending push range and reports each refusal with its hook id and finding -- falsifier: uv run pytest tests/nodes/node_prepush_preflight_effect -q --no-cov -k "refusing_pre_push or staged_change or passing or commit_stage or report or landing_branch"'
  - id: AC2
    statement: 'AC2: a transcript carrying the recorded refusals of check-node-boundary-imports and ticket-contract-prerequisite yields both refusals, and a skip variable in the environment skips nothing -- falsifier: uv run pytest tests/nodes/node_prepush_preflight_effect -q --no-cov -k "recorded_refusals or skip_variable or capped"'
evidence_requirements:
- kind: tests
  description: The handler runs real pre-commit over a scratch repository with pre-push stage hooks; the parser replays the recorded refusals. At the merge base the node does not exist.
  command: uv run pytest tests/nodes/node_prepush_preflight_effect -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn22452-ac1
  description: AC1 a refusing pre-push hook is reported with its id and finding, the staged change is in the range, and a commit-stage hook is not run by the pre-push stage.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_prepush_preflight_effect -q --no-cov --tb=line -k "refusing_pre_push or staged_change or passing or commit_stage or report or landing_branch"
    cwd: .
- id: dod-omn22452-ac2
  description: AC2 the recorded refusals of the two hooks are both parsed, and SKIP in the environment does not skip a hook.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_prepush_preflight_effect -q --no-cov --tb=line -k "recorded_refusals or skip_variable or capped"
    cwd: .
- id: dod-omn22452-deploy-probe
  description: 'Deploy probe: the handler GitHub serves at the checked-out commit carries the pre-push stage run.'
  source: manual
  checks:
  - check_type: command
    check_value: |-
      bash -o pipefail -c 'gh api "repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_prepush_preflight_effect/handlers/handler_prepush_preflight.py?ref=$(git rev-parse HEAD)" --jq .content | base64 -d | grep -F "pre-push" > /dev/null'
    cwd: .
- id: dod-omn22452-integration-proof
  description: The pushed head, run on a lab host, passes the handler tests with real pre-commit. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: |-
      uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane prepush-preflight-0240 -- uv run --frozen pytest tests/nodes/node_prepush_preflight_effect -q --no-cov
    cwd: .
