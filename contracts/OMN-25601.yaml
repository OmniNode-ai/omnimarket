schema_version: 1.0.0
ticket_id: OMN-25601
title: 'The omnimarket ledger-file census returns to its ratchet of 186: the two files that raised it to 188 read through the bus or the ledger reader node'
summary: >-
  The census counted 188 files against a ratchet of 186 after a tick runtime
  and a contract falsifier began naming the ledger file path. Dev already
  removed the contract reference. This branch sends tick appends through the
  bus command declared by the unit. The ratchet file is byte-identical to dev.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn25601-census-back-at-ratchet
  statement: The census counts 186 files or fewer and the two files that raised it no longer hold an executable read of the ledger file.
  acceptance:
  - id: AC1
    statement: 'AC1: the two files that raised the omnimarket census from 186 to 188 are named with the commit that added each, found by git log on origin/dev against the census''s own per-file listing -- falsifier: the lane report lacks two file paths each with a commit sha, or running the census on the commit before the first of them does not print files=186'
  - id: AC2
    statement: 'AC2: after the change the census on the branch counts files at or below 186 and ratchet.yaml is byte-identical to origin/dev -- falsifier: env ONEX_LEDGER_CENSUS_ROOT=. uv run python -m omnimarket.nodes.node_work_ledger_file_census_effect --repos omnimarket --directory omnimarket=. exits non-zero on origin/dev and zero on the branch, and git diff origin/dev -- src/omnimarket/nodes/node_work_ledger_file_census_effect/ratchet.yaml is empty'
  - id: AC3
    statement: 'AC3: a regression test built from the recorded census output of the incident fails on the broken code and passes on the fix -- falsifier: uv run pytest tests/unit/nodes/node_work_ledger_file_census_effect -q --no-cov, red on origin/dev and green on the branch'
  - id: AC4
    statement: 'AC4: neither moved read opens the ledger file; each reads through the bus or the existing ledger reader node node_work_ledger_reader_effect -- falsifier: uv run pytest tests/unit/nodes/node_work_ledger_reader_effect/test_no_file_readings.py -q --no-cov'
evidence_requirements:
- kind: tests
  description: The incident regression test, the census node tests and the temporal alarm appender tests pass at the pushed head.
  command: uv run pytest tests/unit/nodes/node_work_ledger_file_census_effect tests/nodes/node_temporal_health_alarm_effect tests/unit/nodes/node_work_ledger_reader_effect/test_no_file_readings.py -q --no-cov -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn25601-ac1
  description: >-
    AC1 the recorded census lists runtime_temporal_health_alarm.py (added by
    0679e4ad9a, 186 to 187) and contracts/OMN-24791.yaml (added by ebd9d70b23,
    187 to 188). The prior commit 8dc0976d36 counts 186 files. The full
    incident test checks the recorded count and classifies both listed files
    so the evidence fails while either file still contributes to the census.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/nodes/node_work_ledger_file_census_effect/test_incident_two_files.py -q --no-cov -p no:randomly
    cwd: .
- id: dod-omn25601-ac2
  description: >-
    AC2 the live census checks the repository against its ratchet and verifies
    that neither incident file contributes to the count. The merge base
    meets the ratchet and still counts the alarm runtime. The integration
    proof separately compares the ratchet file with dev.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: >-
      uv run pytest
      tests/unit/nodes/node_work_ledger_file_census_effect/test_incident_two_files.py::test_live_census_excludes_incident_files
      -q --no-cov -p no:randomly
    cwd: .
- id: dod-omn25601-ac3
  description: AC3 the regression test built from the recorded incident listing fails while either file holds an executable read of the ledger file (origin/dev) and passes on the branch.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/nodes/node_work_ledger_file_census_effect -q --no-cov -p no:randomly
    cwd: .
- id: dod-omn25601-ac4
  description: AC4 the tick appends through the bus append command its unit names and never names the ledger file (appender tests); the seven no-file readings stay green.
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_temporal_health_alarm_effect/test_bus_appender.py tests/unit/nodes/node_work_ledger_reader_effect/test_no_file_readings.py -q --no-cov -p no:randomly
    cwd: .
- id: dod-omn25601-integration-proof
  description: the focused tests and the census run on a lab host at the pushed head; hosted CI cannot reach the lab, so only the local Done gate runs this unbound check
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-omn25601 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/nodes/node_work_ledger_file_census_effect tests/nodes/node_temporal_health_alarm_effect tests/unit/validators/test_ledger_file_census.py -q --no-cov -n 0 -p no:randomly
  - check_type: command
    check_value: git diff --exit-code origin/dev -- src/omnimarket/nodes/node_work_ledger_file_census_effect/ratchet.yaml
    cwd: .
