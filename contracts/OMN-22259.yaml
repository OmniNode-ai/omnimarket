---
schema_version: "1.0.0"
ticket_id: "OMN-22259"
title: "T1 compute half: node_transcript_session_facts_compute and the work_classification models"
summary: "A pure, definition-B compute node turns one transcript's JSONL text into ModelSessionFacts (record, tool, hook, error, compaction, cost-state and pull-request-link counts, written paths, stream kind with agent id, a source revision of the parsed bytes, and a sha256 digest of the first operator prompt with no prompt text). This pull request carries the compute half only and is proven on fixtures: the scan effect waits on the store port, and the lab step waits on the bucket credential references."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-session-facts"
    statement: "The facts compute counts each record type of a fixture transcript, reports unknown types, tells a subagent stream, is deterministic, orders revisions by record count then byte length, enforces the revision a close requires, and holds no prompt text."
    acceptance:
      - id: "AC1"
        statement: "AC1 (compute part): a fixture with one record of each listed type parses to ModelSessionFacts with each count equal to the fixture's, an unknown record type is counted under unknown_record_types, and a subagent file yields stream_kind subagent with its agent id and the parent's session id -- falsifier: the test fails on the base branch and passes on the branch."
      - id: "AC4"
        statement: "AC4: two runs on the same text give equal results by value, and a one-byte edit to a tool call changes exactly the matching count -- falsifier: either differs."
      - id: "AC5"
        statement: "AC5 (compute part): a fixture read at 11 records satisfies a close that requires 10, and a read shorter than required fails the run -- falsifier: either differs."
      - id: "AC6"
        statement: "AC6: a longer copy compares greater even when the appended record carries an earlier timestamp -- falsifier: either comparison differs."
      - id: "AC7"
        statement: "AC7: no prompt text appears in any serialized result -- falsifier: the unique prompt token appears."
evidence_requirements:
  - kind: "tests"
    description: "AC1, AC4, AC5, AC6 and AC7 in the facts compute tests."
    command: "uv run pytest tests/nodes/node_transcript_session_facts_compute -q -p no:randomly --no-cov"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn22259-ac1"
    description: "AC1 compute part: record counts, unknown record types and the subagent stream on fixtures."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_transcript_session_facts_compute/test_session_facts.py -q -p no:randomly --no-cov -k 'each_record_type or unknown_record_type or subagent_file'"
    binds_ac: ["AC1"]
  - id: "dod-omn22259-ac4"
    description: "AC4: determinism and the one-byte tool edit."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_transcript_session_facts_compute/test_session_facts.py -q -p no:randomly --no-cov -k 'deterministic'"
    binds_ac: ["AC4"]
  - id: "dod-omn22259-ac5"
    description: "AC5 compute part: a longer read satisfies the required revision and a shorter one fails."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_transcript_session_facts_compute/test_session_facts.py -q -p no:randomly --no-cov -k 'longer_read'"
    binds_ac: ["AC5"]
  - id: "dod-omn22259-ac6"
    description: "AC6: revision ordering by record count then byte length, timestamps ignored."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_transcript_session_facts_compute/test_session_facts.py -q -p no:randomly --no-cov -k 'source_revision or byte_length'"
    binds_ac: ["AC6"]
  - id: "dod-omn22259-ac7"
    description: "AC7: the unique prompt token is absent from the serialized facts."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_transcript_session_facts_compute/test_session_facts.py -q -p no:randomly --no-cov -k 'no_prompt_text'"
    binds_ac: ["AC7"]
  - id: "dod-omn22259-contracts"
    description: "The node contract declares its topics, resolves its handler, is an onex.nodes entry point and imports no event envelope."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_transcript_session_facts_compute/test_contracts.py -q -p no:randomly --no-cov"
  - id: "dod-omn22259-integration-proof"
    description: >-
      The local Done gate dispatches the installed facts node through the onex
      runtime on a two-record fixture and asserts the typed result: one user and
      one pr-link record, a record count of 2, one pull-request link and a sha256
      digest of the first prompt with no prompt text in the output. Fixture
      proof only; no bucket is read.
    source: "manual"
    execution_scope: local_done_gate
    checks:
      - check_type: "command"
        check_value: |
          env PYTHONDONTWRITEBYTECODE=1 ONEX_LANE=omn22259-integration-proof .venv/bin/onex node node_transcript_session_facts_compute --input <(printf '%s' '{"transcript_text":"{\"type\":\"user\",\"sessionId\":\"s1\",\"promptSource\":\"terminal\",\"message\":{\"content\":\"hello\"}}\n{\"type\":\"pr-link\",\"prUrl\":\"https://example.test/pr/1\"}\n"}') --state-root "$(mktemp -d)" --backend event_bus=inmemory --timeout 30 --output receipt --omnibase-path "$PWD" | uv run --locked python -c '
          import json
          import sys
          receipt = json.load(sys.stdin)
          assert receipt["status"] == "success" and receipt["exit_code"] == 0, receipt
          result = receipt["result"]
          assert result["source_revision"]["record_count"] == 2, result
          assert result["record_counts"] == {"pr-link": 1, "user": 1}, result
          assert result["pr_link_count"] == 1, result
          assert result["first_prompt_sha256"] == "2cf24dba5fb0a30e26e83b2ac5b9e29e1b161e5c1fa7425e73043362938b9824", result
          assert "hello" not in json.dumps(result), result
          print("ok")'
