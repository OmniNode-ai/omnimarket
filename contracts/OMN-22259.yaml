---
schema_version: "1.0.0"
ticket_id: "OMN-22259"
title: "T1: node_transcript_session_scan_effect, node_transcript_session_facts_compute and the work_classification models"
summary: "A read-side scan effect lists transcript files under overlay-named roots through the spi transcript store port into one manifest (path, size, sha256, source revision, stream kind, stream id), and a pure compute turns one transcript's JSONL text into ModelSessionFacts with no prompt text. The pull request is proven on fixtures: the omnimarket store handlers, the mirror and the bucket read reference belong to another task, so the lab step over the filled bucket is unproven."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-session-facts"
    statement: "The scan lists and the facts compute counts each record type of a fixture transcript, reports unknown types, tells a subagent stream, is deterministic, orders revisions by record count then byte length, enforces the revision a close requires, and holds no prompt text."
    acceptance:
      - id: "AC1"
        statement: "AC1: a fixture with one record of each listed type parses to ModelSessionFacts with each count equal to the fixture's, an unknown record type is counted under unknown_record_types, and a subagent file yields stream_kind subagent with its agent id and the parent's session id, and the scan reports the same file as a subagent stream by its path -- falsifier: the test fails on the base branch and passes on the branch."
      - id: "AC4"
        statement: "AC4: two runs on the same text give equal results by value, and a one-byte edit to a tool call changes exactly the matching count -- falsifier: either differs."
      - id: "AC5"
        statement: "AC5: a fixture read at 11 records satisfies a close that requires 10, and a read shorter than required fails the run -- falsifier: either differs."
      - id: "AC6"
        statement: "AC6: a longer copy compares greater even when the appended record carries an earlier timestamp -- falsifier: either comparison differs."
      - id: "AC7"
        statement: "AC7: no prompt text appears in any serialized result -- falsifier: the unique prompt token appears."
      - id: "AC2"
        statement: "AC2: the manifest count equals the file count of the root measured by find, and a fixture with two top-level and five subagent files reports 2 and 5 -- falsifier: either differs."
      - id: "AC3"
        statement: "AC3: an overlay bucket root without a credential reference refuses at load naming the key -- falsifier: the overlay loads."
      - id: "AC8"
        statement: "AC8: the pull-request link and compaction totals over a fixture snapshot equal the independent grep counts, as record totals and as containing-file totals -- falsifier: either total differs."
      - id: "AC9"
        statement: "AC9: the scan and facts scenario projects the same under the in-memory baseline and a Redpanda profile in the binding parity run, the overlay holds the three keys, and the scan names no literal root, topic or model call -- falsifier: the comparison reports a difference or the contract test fails."
evidence_requirements:
  - kind: "tests"
    description: "AC1 to AC9 in the facts compute and scan effect tests."
    command: "uv run pytest tests/nodes/node_transcript_session_facts_compute tests/nodes/node_transcript_session_scan_effect -q -p no:randomly --no-cov"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
