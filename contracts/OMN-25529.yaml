schema_version: 1.0.0
ticket_id: OMN-25529
title: A host whose link replays only part of the overlay store snapshot topic in one window still reaches its newest record
summary: The snapshot reader listened for one window from the earliest retained offset under a fresh consumer group every tick, so a link that took only part of the topic in a window answered with an old prefix of the log and wrote it over the snapshot. The reader now listens under a stable consumer group once its snapshot is readable, so each window resumes where the last stopped, and an older version never replaces a newer snapshot.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn25529-resume-snapshot-window
  statement: A host that reads the overlay store snapshot topic over a link too slow to replay it in one window reaches the newest record within a few ticks, and a version older than its snapshot never replaces it.
  acceptance:
  - id: AC1
    statement: 'AC1: the cause of the stop is named from the unit journal and exit codes on h053 and is fixed in the declaration that owns it, with a regression test built from the recorded journal or error text that fails on the broken declaration and passes on the fix -- falsifier: `uv run pytest -q` on the test file the PR names, red at the base commit and green at the head'
evidence_requirements:
- kind: tests
  description: The slow link tests, red at the base commit and green at the head.
  command: uv run --frozen pytest tests/unit/nodes/node_overlay_store/test_snapshot_slow_link_resume.py -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn25529-slow-link-resume
  description: Runs the tests of a link that delivers four of ten versions per window (each tick reaches closer to the newest, a window with nothing new keeps the snapshot and reports no store error, a host with no snapshot listens under a fresh group, an older version never replaces a newer snapshot). Absent at the merge base, so the command fails there.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/nodes/node_overlay_store/test_snapshot_slow_link_resume.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn25529-integration-proof
  description: The pushed head ran the slow link tests on a lab host through the lab work runner and exited 0. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: 'uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-25529 -- uv run --frozen pytest tests/unit/nodes/node_overlay_store/test_snapshot_slow_link_resume.py -q --no-cov -n 0 -p no:randomly'
    cwd: .
- id: dod-omn25529-deploy-conditions
  description: 'Deploy probe the hosted runner can run: the snapshot reader at the checked-out commit declares the resumes property for a stable consumer group; the line does not exist at the merge base, so the probe fails there.'
  source: manual
  checks:
  - check_type: command
    check_value: bash -o pipefail -c 'gh api "repos/OmniNode-ai/omnimarket/contents/src/omnimarket/handlers/overlay_store/store_bus_snapshot.py?ref=$(git rev-parse HEAD)" --jq .content | base64 -d | grep -F "def resumes" > /dev/null'
    cwd: .
