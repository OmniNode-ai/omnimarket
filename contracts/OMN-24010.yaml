schema_version: 1.0.0
ticket_id: OMN-24010
title: Count runtime starts per dev roll and fail a roll with more starts than declared
summary: 'node_dev_roll_verify_compute counts the runtime starts of one finished dev roll from typed start events and verdicts the roll against declared_starts_per_roll, an overlay value (five whys R5,
  decision D9 option (a): one start per roll with the hot patch inside it). The deploy agent''s start event has no producer yet; this node pins its shape.'
is_seam_ticket: true
interface_change: true
interfaces_touched:
- topics
- public_api
requirements:
- id: req-omn24010-count
  statement: A finished dev roll is verdicted against the declared starts per roll from its start events.
  acceptance:
  - id: AC1
    statement: 'AC1: node_dev_roll_verify_compute counts runtime starts per finished dev roll against declared_starts_per_roll read from its overlay, and returns passed, too_many_starts, no_start or start_count_unknown
      -- falsifier: the replay of the four rolls of 2026-11-10 (two starts each) reads passed under a declared count of one'
  - id: AC2
    statement: 'AC2: a roll whose start events cannot be read is never passed, and facts that contradict themselves (a start for another roll, a start after the snapshot, a duplicate event, an unfinished
      roll) are refused with a typed reason -- falsifier: a roll with unreadable starts reads passed, or a contradicting fact is dropped without a refusal event'
  - id: AC3
    statement: 'AC3: the node''s start event and branch install shapes are pinned against the roll record of the roll batching node and the build manifest of the running revision node -- falsifier: renaming
      a field on either side leaves the seam test green'
- id: req-omn24010-integrated
  statement: The verdict is read from the running dev runtime.
  acceptance:
  - id: AC4
    statement: 'AC4: integrated: after the node is on the running dev runtime and the deploy agent publishes start events, a verdict event for the latest roll is read on the dev bus lane with the start
      count of that roll -- falsifier: the dev bus lane carries no verdict event for a roll that finished after the node was running'
evidence_requirements:
- kind: tests
  description: The node's handler, golden chain, error chain, seam and replay tests pass at the pushed head.
  command: uv run --frozen pytest tests/unit/nodes/node_dev_roll_verify_compute -q --no-cov -p no:cacheprovider
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24010-ac1
  description: The replay of the four rolls of 2026-11-10 reads too_many_starts under a declared one; the control shows the same facts pass under a declared two.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/nodes/node_dev_roll_verify_compute -q --no-cov -p no:cacheprovider
    cwd: .
- id: dod-omn24010-ac2
  description: Unreadable starts read start_count_unknown and contradicting facts are refused on the refused topic.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/nodes/node_dev_roll_verify_compute -q --no-cov -p no:cacheprovider
    cwd: .
- id: dod-omn24010-ac3
  description: The seam test pins the start event, the branch install shape, the three topics and the roll record of node_dev_roll_request_compute.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/nodes/node_dev_roll_verify_compute -q --no-cov -p no:cacheprovider
    cwd: .
- id: dod-omn24010-ac4
  description: The tests behind the integrated reading pass at the head; the reading itself needs the deploy agent's start event producer and is named in the pull request as the step left.
  source: manual
