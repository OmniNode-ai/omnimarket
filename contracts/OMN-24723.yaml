# Component replay and opt-in installed Mac proof; parent integration remains separate.
# Delegation: none; paid inference excluded by user. Direct local drafting authorized.
schema_version: 1.0.0
ticket_id: OMN-24723
parent_ticket_id: OMN-23413
parent_ac_label: AC33
repository: OmniNode-ai/omnimarket
title: Implement the hook delegation node and process adapter used by prompt and Agent/Task hooks
summary: >-
  Component contribution only: typed hook-node handlers and their process boundary,
  deterministic replay, bounded history and independent switch reads. This contract
  binds only this child's four criteria. It does not prove installed paired hooks,
  CLI/TUI controls, native Claude turns, parent AC6 or parent AC33.
  Parent integration obligations remain unchanged under OMN-23413 and setup PR5813.
proof_class: replay-proven
is_seam_ticket: true
interface_change: true
interfaces_touched: [public_api]
context:
  proposal_source_head: e7d7cf78b51f01396624f59d8c52e15afdf60f65
  prerequisite_prompt_repair: 0a2a0472817f5fc4b90fe81959dd61006b1a9cf5
  evidence_boundary: >-
    Hosted checks prove container-built replay and fixture subprocesses only.
    The separate local Done gate requires the installed component and an actual
    existing unpaid model through the approved Mac route at the exact pushed SHA. This is not
    a shared-lane deployment or the parent's installed customer-flow proof.
  schema_choice: >-
    Uses the repository's existing 1.0.0 caller-contract convention and the pinned
    verifier's command/test_passes execution path. This is not a schema migration.
requirements:
  - id: req-omn24723-typed-outcomes
    statement: Container-built handlers return typed answers or explicit fallback outcomes.
    acceptance:
      - id: AC1
        statement: >-
          Accepted, declined, malformed, failed, missing-process and timed-out inputs
          return the declared answer or fallback; an unanswered run never blocks its caller.
        falsifier: Lose an accepted answer or accept a malformed/failed/unanswered receipt.
        integrated: false
  - id: req-omn24723-process-boundary
    statement: The default container resolves the concrete process adapter and actual subprocess behavior is checked.
    acceptance:
      - id: AC2
        statement: >-
          The default container resolves HandlerDelegateCli, not the protocol declaration.
          A real fixture subprocess preserves argv/output and enforces its deadline;
          a missing executable returns its declared state. A separate installed Mac
          run returns a real local-model answer with model/run provenance and proves
          the missing-executable fallback on that installed revision.
        falsifier: Bind the protocol stub or change adapter argv/output/deadline handling.
        integrated: true
  - id: req-omn24723-history-and-switches
    statement: History, sensitivity, turn isolation and independent hook switches preserve node behavior.
    acceptance:
      - id: AC3
        statement: >-
          History deduplicates and drains once, sensitive history is withheld, turn reset
          and concurrent reuse remain correct, and a paused hook delegates no work while
          the other hook remains independent.
        falsifier: Duplicate history, leak sensitive text, reuse another turn or couple the switches.
        integrated: false
  - id: req-omn24723-component-evidence
    statement: This component's checks are executable from its own PR head and fail without the node.
    acceptance:
      - id: AC4
        statement: >-
          Every named test path exists at the component head, the focused node suite runs,
          and the checks fail at the merge base without the node. The copied parent setup
          contract is absent from this component diff; no child binding claims parent AC6
          or AC33. The parent's complete setup/integration contract remains on PR5813.
        falsifier: Remove a named node test, keep the copied parent contract in this diff, or run the checks at the node-free base.
        integrated: false
evidence_requirements:
  - kind: tests
    description: Deterministic component replay and real fixture subprocess controls; no installed customer or model claim.
    command: uv run --frozen pytest src/omnimarket/nodes/node_hook_delegate_effect/tests -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn24723-ac1-outcomes
    description: Typed accepted/declined/failure/timeout and malformed-receipt behavior through container-built handlers.
    source: manual
    execution_scope: hosted_and_local
    binds_ac: [AC1]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest src/omnimarket/nodes/node_hook_delegate_effect/tests/test_hook_delegate.py src/omnimarket/nodes/node_hook_delegate_effect/tests/test_hook_decline.py src/omnimarket/nodes/node_hook_delegate_effect/tests/test_prompt_delegate.py -q --no-cov -n 0 -p no:randomly
        cwd: .
  - id: dod-omn24723-ac2-adapter
    description: Resolve the actual default service, then exercise real fixture subprocess argv/output, timeout and missing-executable behavior.
    source: manual
    execution_scope: hosted_and_local
    binds_ac: [AC2]
    checks:
      - check_type: command
        check_value: >-
          uv run --frozen python -B -c 'from omnimarket.nodes.node_hook_delegate_effect.container import create_hook_delegate_container; from omnimarket.nodes.node_hook_delegate_effect.handlers.handler_hook_delegate import CLI_PROTOCOL; from omnimarket.nodes.node_hook_delegate_effect.protocols.protocol_delegate_cli import ProtocolDelegateCli; from omnimarket.nodes.node_hook_delegate_effect.adapters.adapter_delegate_cli import HandlerDelegateCli; runner=create_hook_delegate_container().get_service(CLI_PROTOCOL); assert isinstance(runner, HandlerDelegateCli); assert isinstance(runner, ProtocolDelegateCli); assert type(runner).run is not ProtocolDelegateCli.run'
        cwd: .
      - check_type: test_passes
        check_value: uv run --frozen pytest src/omnimarket/nodes/node_hook_delegate_effect/tests/test_hook_delegate.py::test_the_real_adapter_reports_a_missing_onex src/omnimarket/nodes/node_hook_delegate_effect/tests/test_hook_delegate.py::test_the_real_adapter_runs_onex_and_honours_the_limit src/omnimarket/nodes/node_hook_delegate_effect/tests/test_hook_delegate.py::test_the_onex_beside_this_python_is_used_before_path -q --no-cov -n 0 -p no:randomly
        cwd: .
  - id: dod-omn24723-ac3-state
    description: Node history, sensitivity, concurrent turn reuse and per-event switch behavior. This is not CLI/TUI or installed-registration proof.
    source: manual
    execution_scope: hosted_and_local
    binds_ac: [AC3]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest src/omnimarket/nodes/node_hook_delegate_effect/tests/test_prompt_delegate.py src/omnimarket/nodes/node_hook_delegate_effect/tests/test_hook_turn.py src/omnimarket/nodes/node_hook_delegate_effect/tests/test_hook_review.py src/omnimarket/nodes/node_hook_delegate_effect/tests/test_hook_switches.py -q --no-cov -n 0 -p no:randomly
        cwd: .
  - id: dod-omn24723-ac4-contract
    description: Validate this child's exact ID/bindings and named test paths, reject a parent-contract edit in this diff, then execute the focused component suite.
    source: manual
    execution_scope: hosted_and_local
    binds_ac: [AC4]
    checks:
      - check_type: command
        check_value: >-
          uv run --frozen python -B -c 'from pathlib import Path; import shlex, subprocess; from omnibase_core.models.ticket.model_ticket_contract import ModelTicketContract; c=ModelTicketContract.from_yaml(Path("contracts/OMN-24723.yaml").read_text()); assert c.ticket_id == "OMN-24723"; assert c.parent_ticket_id == "OMN-23413"; assert {a for item in c.dod_evidence for a in item.binds_ac} == {"AC1", "AC2", "AC3", "AC4"}; assert not subprocess.check_output(["git", "diff", "--name-only", "origin/dev...HEAD", "--", "contracts/OMN-23413.yaml"]).strip(); paths=[arg.split("::")[0] for item in c.dod_evidence for check in item.checks if check.check_type.value == "test_passes" for arg in shlex.split(str(check.check_value)) if arg.startswith("src/")]; assert paths and all(Path(path).exists() for path in paths)'
        cwd: .
      - check_type: test_passes
        check_value: uv run --frozen pytest src/omnimarket/nodes/node_hook_delegate_effect/tests -q --no-cov -n 0 -p no:randomly
        cwd: .
  - id: dod-omn24723-integration-proof
    description: >-
      Run the installed component on the approved Mac against an existing unpaid
      model through a loopback endpoint, including an own-account SSH forward to
      the existing lab model server. Require an actual answer and model/run provenance,
      exact pushed SHA, isolated local-only configuration and missing-CLI fallback.
      Supply the approved wf wrapper, installed branch Python, local URL and served model explicitly;
      missing inputs, skipped tests and unavailable runtime dependencies fail closed.
      The initial draft may precede this proof under the approved delivery amendment;
      ready/landing may not. The test output retains HOOK_INTEGRATION_PROOF.
      This Mac execution is not a governed lab bus-runner receipt.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: >-
          env OMN_ALLOW_LIVE_LADDER=1
          ONEX_HOOK_PROOF_LOCAL_URL="${ONEX_HOOK_PROOF_LOCAL_URL:?name the existing loopback server}"
          ONEX_HOOK_PROOF_LOCAL_MODEL="${ONEX_HOOK_PROOF_LOCAL_MODEL:?name its served model}"
          ONEX_HOOK_PROOF_SHA="$(git rev-parse HEAD)"
          "${ONEX_HOOK_PROOF_WF:?name the approved wf wrapper}"
          pytest "${ONEX_HOOK_PROOF_PYTHON:?name the installed branch Python}" -m pytest
          src/omnimarket/nodes/node_hook_delegate_effect/tests/test_hook_live.py
          -p tests.refuse_skips --refuse-skips -q -s --no-cov -n 0 -p no:randomly
        cwd: .
