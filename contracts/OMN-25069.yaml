---
schema_version: "1.0.0"
ticket_id: "OMN-25069"
title: "Removing the last local model leaves valid delegation configuration"
summary: >-
  Model removal writes an empty backend list instead of YAML null. Legacy null
  backend overlays inherit the committed backend declarations on both loading paths.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-remove-last-local-model"
    statement: "Removing the last local model preserves a usable delegation configuration."
    acceptance:
      - id: "AC1"
        statement: "Removing the only local model leaves backends absent or an empty list, never null, with unrelated keys unchanged."
      - id: "AC2"
        statement: "A legacy overlay with null backends preserves the committed backends and passes validation."
      - id: "AC3"
        statement: "An isolated-home add, remove, delegate incident regression fails on the broken code and passes on the fix."
evidence_requirements:
  - kind: "tests"
    description: "Model removal, legacy overlay loading and the installed CLI incident replay."
    command: "uv run pytest tests/unit/nodes/node_model_setup_effect/test_emptied_overlay_keeps_routing.py -q -n 0 --refuse-skips"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn25069-removal"
    description: "E1 (shipped in omnimarket#5813) and E5: removing the last local model writes no null backends and keeps every other key of the routes file."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: 'uv run pytest tests/unit/nodes/node_model_setup_effect/test_emptied_overlay_keeps_routing.py -q -n 0 --refuse-skips -k "removing_the_last_local_model_writes_no_null_backends or preserves_other_overlay_keys"'
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC1"]
  - id: "dod-omn25069-legacy-null-overlay"
    description: "E2 and E3 (shipped in omnimarket#5813): a bare backends line keeps the contract backends for the loader and for delegate routing."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: 'uv run pytest tests/unit/nodes/node_model_setup_effect/test_emptied_overlay_keeps_routing.py -q -n 0 --refuse-skips -k "a_bare_backends_line_keeps_the_contracts_backends or delegate_routing_reads_a_bare_backends_line"'
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC2"]
  - id: "dod-omn25069-cli-incident"
    description: "E4: the incident replayed through the installed onex (add, remove, delegate, isolated HOME) refuses the removed backend instead of crashing on null backends."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/nodes/node_model_setup_effect/test_emptied_overlay_keeps_routing.py -q -n 0 --refuse-skips -k remove_last_local_then_delegate"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC3"]
  - id: "dod-omn25069-integration-proof"
    description: >-
      Run the installed CLI incident replay and null-overlay checks on a lab host
      at the pushed revision. This local completion proof carries no hosted AC bindings.
    source: "manual"
    execution_scope: "local_done_gate"
    checks:
      - check_type: "command"
        check_value: >-
          env PYTHONDONTWRITEBYTECODE=1 onex lab-work run
          --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)"
          --lane dod-integration-proof-25069 --kind test --
          env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest
          tests/unit/nodes/node_model_setup_effect/test_emptied_overlay_keeps_routing.py
          -q -n 0 --no-cov --refuse-skips
        cwd: "."
