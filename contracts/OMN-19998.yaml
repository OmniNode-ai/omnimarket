schema_version: 1.0.0
ticket_id: OMN-19998
title: A plain ledger append names no optional field it does not use
summary: Ledger append requests omit optional fields whose value is None, so an older host can validate a plain append from a newer writer. Set fields remain on the wire and are refused by a host that cannot honor them. Queued requests and the bus caller use the same serialization. Earlier heal-read retry criteria and evidence remain unchanged.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn19998-heal-read-retry
    statement: A heal read answered with a gateway error is retried a bounded number of times, and nothing else is.
    acceptance:
      - id: AC1
        statement: 'AC1: a read that gets HTTP 502, 503 or 504 is retried and succeeds on a later attempt, gives up after four attempts naming GitHub''s error, and a 404, a rate limit or a write is attempted once -- falsifier: uv run pytest tests/ci/test_pr_stale_red_heal_omn19852.py -q --no-cov'
  - id: req-omn19998-ledger-additive-wire
    statement: A newer ledger writer omits unused optional fields without silently dropping a requested operation.
    acceptance:
      - id: AC2
        statement: 'AC2: plain and queued requests omit unset optional fields and reach an older host through the bus caller; a set optional field survives serialization and is refused by an older host; the rule also applies to a future optional field -- falsifier: uv run pytest tests/unit/work_ledger_bus/test_request_additive_wire.py -q --no-cov -n 0 -p no:randomly'
  - id: req-omn19998-code-edit-scope-move
    statement: The installed scope node derives exact named tracked files and checks through its declared command and completed event.
    acceptance:
      - id: AC3
        statement: 'AC3: scope derivation preserves first-mention order, deduplication, the 20-file cap, unknown-path refusal and declared checks; installed discovery and infra auto-wiring publish the result on the declared completed topic for both named and unknown files -- falsifier: uv run pytest tests/nodes/test_code_edit_scope_node.py -q --no-cov'
  - id: req-omn19998-pool-probe-overlay
    statement: The Claude pool refill passes a lane overlay to the credential probe that requires it.
    acceptance:
      - id: AC4
        statement: 'AC4: the refill probe writes a lane overlay binding the host process environment and file overlay documents and passes it with --overlay to runtime_claude_probe; typed probe receipts remain classified as ok, limited, timeout or unavailable -- falsifier: uv run --frozen pytest tests/nodes/node_claude_pool_refill_effect/test_claude_pool_refill.py -q --no-cov -k "probe"'
  - id: req-omn19998-snapshot-record-boundary
    statement: Snapshot publication refuses a complete Kafka record larger than the runner-owned producer accepts before opening the transport.
    acceptance:
      - id: AC5
        statement: 'AC5: the default bound equals the runner-owned producer limit; keys, headers and record framing count toward the bound; recorded oversized records are refused before producer creation, exact-limit records are accepted, and the source advances only after durable quarantine -- falsifier: uv run --frozen pytest tests/unit/projection/test_snapshot_record_boundary.py -q --no-cov'
  - id: req-omn19998-tracked-operator-items
    statement: Operator item folds retain accountability, source sentence dispositions and explicit reply linkage.
    acceptance:
      - id: AC6
        statement: 'AC6: the pure tracked-item fold retains an accountable owner in every state, requires completion evidence beyond a terminal outcome, keeps unclassified prompts visible and reads ruling completion from supplied mechanism audit rows -- falsifier: uv run pytest tests/unit/nodes/node_ask_state_compute/test_tracked_items.py -q --no-cov -n 0'
      - id: AC7
        statement: 'AC7: every sentence of a mixed operator prompt has a source-linked disposition, including chat, and replay yields no new rows -- falsifier: uv run pytest tests/unit/nodes/node_operator_capture_compute/test_sentence_dispositions.py -q --no-cov -n 0'
      - id: AC8
        statement: 'AC8: operator message arrivals stay unanswered until an explicit reply, and both item-fold nodes publish typed results through installed contract discovery and in-memory runtime wiring -- falsifier: uv run pytest tests/unit/nodes/node_operator_message_state_compute/test_message_state.py tests/unit/nodes/node_ask_state_compute/test_tracked_items.py -q --no-cov -n 0'
  - id: req-omn19998-item-transitions
    statement: Item transitions are append-only, evidence-checked and fenced by content revision and CLAIM run.
    acceptance:
      - id: AC9
        statement: 'AC9: replay appends no second STATUS row; open PRs and stale runs or revisions cannot complete an item; failed terminals retain ownership with no running lane; a two-process race retains the later stamped transition with completion evidence -- falsifier: uv run pytest tests/unit/nodes/node_ask_state_compute/test_item_transition.py tests/unit/nodes/node_ask_state_transition_effect/test_item_transition_effect.py tests/unit/nodes/node_ask_state_transition_effect/test_golden_chain_item_transition.py -k item_transition -q --no-cov -n 0 -m "not kafka"'
evidence_requirements:
  - kind: tests
    description: The retry tests and the existing heal decision, collection and CLI tests run at the pushed head.
    command: uv run pytest tests/ci/test_pr_stale_red_heal_omn19852.py -q --no-cov
  - kind: tests
    description: The additive-wire suite exercises model serialization, queued requests, and the bus caller against the pre-field host model.
    command: uv run pytest tests/unit/work_ledger_bus/test_request_additive_wire.py -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn19998-snapshot-record-boundary
    description: Recorded delegation-writer retry sizes are refused before producer creation using the driver's complete record-size calculation. The exact-limit control remains accepted and oversized keys and headers are refused. The runner records an error and durably quarantines before committing the source. This focused proof does not assert the controller timer criteria or a live installation.
    source: manual
    binds_ac:
      - AC5
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/projection/test_snapshot_record_boundary.py -q --no-cov
        cwd: .
  - id: dod-omn19998-deploy-ledger-additive-wire
    description: Hosted serialization and deployment smoke uses the real bus caller and host with an in-memory transport and the pre-field host model, plus outbox replay and set-field refusal. The future optional-field test fails at the merge base because its null field is serialized. This is a hosted wiring smoke, not a live host installation readback.
    source: manual
    binds_ac:
      - AC2
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/work_ledger_bus/test_request_additive_wire.py -q --no-cov -n 0 -p no:randomly
        cwd: .
  - id: dod-omn19998-ac1
    description: AC1 runs the heal tests; the gateway-error retry tests fail at the merge base because GhCli.open_pull_requests makes one attempt and the module has no read-attempt bound.
    source: manual
    binds_ac:
      - AC1
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/ci/test_pr_stale_red_heal_omn19852.py -q --no-cov --tb=line
        cwd: .
  - id: dod-omn19998-integration-proof
    description: Run the heal tests on a lab host at the pushed head. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-19998 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/ci/test_pr_stale_red_heal_omn19852.py -q --no-cov
        cwd: .
  - id: dod-omn19998-code-edit-scope-move
    description: The scope node preserves the six derivation cases and its installed contract routes a bus request to a completed event. This migration check does not assert the controller timer criteria.
    source: manual
    binds_ac:
      - AC3
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/nodes/test_code_edit_scope_node.py -q --no-cov --tb=line
        cwd: .
  - id: dod-omn19998-code-edit-scope-deploy
    description: Hosted deployment smoke discovers the installed scope entry point, auto-wires its contract through infra, and checks completed event payloads for named and unknown files on the declared topic using an in-memory bus.
    source: manual
    binds_ac:
      - AC3
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/nodes/test_code_edit_scope_node.py -q --no-cov --tb=line -k runtime_command
        cwd: .
  - id: dod-omn19998-pool-probe-overlay
    description: The refill tests check the required overlay argument and both dependency bindings, typed receipt classification, token rotation and dry-run behavior. The overlay regression test fails before this PR's handler change because the probe command supplies no --overlay.
    source: manual
    binds_ac:
      - AC4
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/nodes/node_claude_pool_refill_effect/test_claude_pool_refill.py -q --no-cov --tb=line
        cwd: .
  - id: dod-omn19998-pool-probe-overlay-deploy
    description: Hosted deployment smoke checks that the generated remote probe script invokes the credential probe with a lane overlay binding the host environment and file documents, and that typed receipts are read and classified. It needs no lab access or live credential and does not claim a live host installation readback.
    source: manual
    binds_ac:
      - AC4
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/nodes/node_claude_pool_refill_effect/test_claude_pool_refill.py -q --no-cov --tb=line -k probe
        cwd: .
  - id: dod-omn19998-snapshot-record-deploy
    description: Hosted deployment smoke invokes the runner snapshot publication path and the installed Kafka driver's serializer with the two recorded oversized records. It checks refusal before producer creation, durable quarantine, and no source commit when quarantine fails. No broker, lab route or live installation is required or asserted.
    source: manual
    binds_ac:
      - AC5
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/projection/test_snapshot_record_boundary.py -q --no-cov -k recorded_retry
        cwd: .
  - id: dod-omn19998-tracked-operator-items
    description: Synthetic regression replay checks all tracked kinds and states, persistent owners, live claims, audit input, input time and row order. This does not assert the unavailable operator gold corpus, reconciled samples or a live Redpanda replay.
    source: manual
    binds_ac: [AC6]
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/nodes/node_ask_state_compute/test_tracked_items.py -q --no-cov -n 0
        cwd: .
  - id: dod-omn19998-source-dispositions
    description: The producer regression checks two asks and two chat sentences, omitted delegated sentences, decimal versions and idempotent replay.
    source: manual
    binds_ac: [AC7]
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/nodes/node_operator_capture_compute/test_sentence_dispositions.py -q --no-cov -n 0
        cwd: .
  - id: dod-omn19998-message-state-runtime
    description: Arrival/reply regression and deployment smoke through discovered contracts, production auto-wiring and the real in-memory event bus. No broker or live host installation is asserted.
    source: manual
    binds_ac: [AC8]
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/nodes/node_operator_message_state_compute/test_message_state.py tests/unit/nodes/node_ask_state_compute/test_tracked_items.py -q --no-cov -n 0
        cwd: .
  - id: dod-omn19998-item-transitions
    description: Focused revision and run fences, checked completion, retained ownership, append replay and real two-process races through the existing canonical ledger writer.
    source: manual
    binds_ac: [AC9]
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/nodes/node_ask_state_compute/test_item_transition.py tests/unit/nodes/node_ask_state_transition_effect/test_item_transition_effect.py -k item_transition -q --no-cov -n 0
        cwd: .
  - id: dod-omn19998-item-transition-deploy
    description: Installed entry-point discovery, production auto-wiring and dependency injection publish typed results through the declared in-memory overlay and canonical ledger bus caller, then replay without appending rows.
    source: manual
    binds_ac: [AC9]
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/nodes/node_ask_state_transition_effect/test_golden_chain_item_transition.py -k item_transition -q --no-cov -n 0 -m "not kafka"
        cwd: .
  - id: dod-omn19998-item-transition-redpanda
    description: The same discovered node, injected canonical writer and replay through the Redpanda overlay on an authenticated scratch broker, torn down by the existing test harness.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/nodes/node_ask_state_transition_effect/test_golden_chain_item_transition.py -k item_transition -q --no-cov -n 0 -m kafka
        cwd: .
