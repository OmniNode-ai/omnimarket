schema_version: 1.0.0
ticket_id: OMN-19998
title: A plain ledger append names no optional field it does not use
summary: Ledger append requests omit optional fields whose value is None, so an older host can validate a plain append from a newer writer. Set fields remain on the wire and are refused by a host that cannot honor them. Queued requests and the bus caller use the same serialization. Earlier heal-read retry criteria and evidence remain unchanged.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn19998-floor-current-gate
    statement: The floor uses the newest verdict across the gate's configured wave spellings and names a failed check's recorded cause.
    acceptance:
      - id: AC12
        statement: 'AC12: later subjects 0, G0 and W0 supersede the October 31 failure by timestamp; the November 2 failure cause and date reach the line blocker, passing verdicts clear it, and an overlay can change the wave spelling -- falsifier: uv run --frozen pytest tests/nodes/node_factory_floor_compute/test_gate_verdict_readback.py -q --no-cov -n 0 -p no:randomly'
  - id: req-omn19998-floor-stop-ownership
    statement: Manifest and fallback table lines attribute failing CI only to their own PR work.
    acceptance:
      - id: AC11
        statement: 'AC11: the recorded dependency update and other-ticket PRs are excluded from a ticketed task; title and branch matches retain genuine red stops, inferred owned PRs reach fallback items, and unread explicit links remain visible -- falsifier: uv run --frozen pytest tests/nodes/node_factory_floor_compute/test_stop_pr_ownership.py -q --no-cov -n 0 -p no:randomly'
  - id: req-omn19998-heal-read-retry
    statement: A heal read answered with a gateway error is retried a bounded number of times, and nothing else is.
    acceptance:
      - id: AC1
        statement: 'AC1: a read that gets HTTP 502, 503 or 504 is retried and succeeds on a later attempt, gives up after four attempts naming GitHub''s error, and a 404, a rate limit or a write is attempted once -- falsifier: uv run pytest tests/ci/test_pr_stale_red_heal_omn19852.py -q --no-cov'
  - id: req-omn19998-ledger-additive-wire
    statement: A newer ledger writer omits unused optional fields without silently dropping a requested operation.
    acceptance:
      - id: AC2
        statement: 'AC2: plain and queued requests omit unset optional fields and reach an older host through the bus caller; a set optional field survives serialization and is refused by an older host; the rule also applies to a future optional field -- falsifier: uv run pytest tests/unit/work_ledger_bus/test_request_additive_wire.py -q --no-cov -n 0 -p no:randomly'
  - id: req-omn19998-code-edit-scope-move
    statement: The installed scope node derives exact named tracked files and checks through its declared command and completed event.
    acceptance:
      - id: AC3
        statement: 'AC3: scope derivation preserves first-mention order, deduplication, the 20-file cap, unknown-path refusal and declared checks; installed discovery and infra auto-wiring publish the result on the declared completed topic for both named and unknown files -- falsifier: uv run pytest tests/nodes/test_code_edit_scope_node.py -q --no-cov'
  - id: req-omn19998-ticket-read-secret-reason
    statement: A ticket read whose consumer cannot resolve LINEAR_API_KEY answers secret_unavailable, and a missing bus config names its fix.
    acceptance:
      - id: AC3
        statement: 'AC3: an unresolved Linear key answers reason secret_unavailable with finding linear_api_key_unresolved instead of operation_failed, and a missing lane declaration answers bus_unavailable with detail and fix naming ONEX_WORKSPACE_CONFIG_ROOT -- falsifier: uv run pytest tests/nodes/node_linear_ticket_write_effect -q --no-cov -n 0 -p no:randomly'
  - id: req-omn19998-pool-probe-overlay
    statement: The Claude pool refill passes a lane overlay to the credential probe that requires it.
    acceptance:
      - id: AC4
        statement: 'AC4: the refill probe writes a lane overlay binding the host process environment and file overlay documents and passes it with --overlay to runtime_claude_probe; typed probe receipts remain classified as ok, limited, timeout or unavailable -- falsifier: uv run --frozen pytest tests/nodes/node_claude_pool_refill_effect/test_claude_pool_refill.py -q --no-cov -k "probe"'
  - id: req-omn19998-snapshot-record-boundary
    statement: Snapshot publication refuses a complete Kafka record larger than the runner-owned producer accepts before opening the transport.
    acceptance:
      - id: AC5
        statement: 'AC5: the default bound equals the runner-owned producer limit; keys, headers and record framing count toward the bound; recorded oversized records are refused before producer creation, exact-limit records are accepted, and the source advances only after durable quarantine -- falsifier: uv run --frozen pytest tests/unit/projection/test_snapshot_record_boundary.py -q --no-cov'
  - id: req-omn19998-quiet-host-capture-repair
    statement: The migrated alarm effect keeps quiet-host findings while independently observing and safely repairing capture per declared host.
    acceptance:
      - id: AC8
        statement: 'AC8: recorded quiet-host incidents retain their alarm; each safe host repair preserves backlog, persists a cooldown and requires a newer post-attempt event for capture recovery; unknown reads, cycling broker failures, failed installs and stale or future readbacks never report recovery -- falsifier: uv run --frozen pytest tests/nodes/node_silent_failure_alarm_compute/test_golden_chain_silent_failure_alarm_compute.py -q --no-cov -n 0'
      - id: AC9
        statement: 'AC9: the installed alarm node is discovered and routes its declared bus command to a correlated terminal event; the existing registry installer renders its clean branch checkout, configuration path and revision -- falsifier: uv run --frozen pytest tests/nodes/node_silent_failure_alarm_compute/test_golden_chain_silent_failure_alarm_compute.py -q --no-cov -n 0 -k "installed_node_discovery or registry_installer"'
  - id: req-omn19998-delegation-floor-read
    statement: The floor reads delegation projection events through the node's public runtime without circular handler imports.
    acceptance:
      - id: AC7
        statement: 'AC5: fixed two-hour and twenty-four-hour windows distinguish runs, attempts, terminal outcomes, missing local traffic and unread sources; the installed report runner supports runtime annotation introspection -- falsifier: uv run --frozen pytest tests/nodes/node_factory_floor_publish_effect/test_delegation_report.py -q --no-cov'
  - id: req-omn19998-delegation-floor-publish
    statement: The floor and report catalogue publish the projection-backed delegation report.
    acceptance:
      - id: AC6
        statement: 'AC6: the report manifest publishes delegation data and the read-only tick entry never enters publishing -- falsifier: uv run --frozen pytest tests/nodes/node_factory_floor_publish_effect/test_reports_site.py tests/nodes/node_factory_floor_publish_effect/test_delegation_report.py -q --no-cov'
  - id: req-omn19998-checkpoint-prior-drivers
    statement: A checkpoint read names the running workflows of the session that stopped before the current one.
    acceptance:
      - id: AC6
        statement: 'AC6: a newest-checkpoint read prints one PRIOR line for each running or queued workflow of the prior session that the current checkpoint does not carry by task id, run id or named script; relaunched, stopped and stale prior workflows are not named, and the stopped session''s own read has no PRIOR lines -- falsifier: uv run --frozen pytest tests/nodes/node_session_checkpoint_compute/test_resume_names_prior_drivers.py -q --no-cov'
  - id: req-omn19998-publish-recovery
    statement: Finished lane commits survive a moving PR head through the remote-lane effect node.
    acceptance:
      - id: AC8
        statement: 'AC8: the publish operation preserves the original commit on a pushed recovery branch, replays a clean lane delta onto the current head, pins every target push to an ancestor head, and reports conflicts and push refusals with the recovery branch named; failed preservation requires keeping the original worktree -- falsifier: uv run --frozen pytest tests/nodes/node_remote_lane_effect/test_publish_recovery.py -q --no-cov'
  - id: req-omn19998-install-only-preserve
    statement: A declared install-only node missing from a replacement stage is retained from the live install.
    acceptance:
      - id: AC6
        statement: 'A second install whose source omits the guard retains the live guard, prints INSTALL-SUPERSET-CONTAINED guard=first and records SUPERSET guard=first; stage versions win and undeclared nodes are not carried.'
  - id: req-omn19998-cloud-limit-ending
    statement: Cloud placement distinguishes a terminal limit ending from subscription telemetry and uses recorded credit balances.
    acceptance:
      - id: AC6
        statement: 'AC6: the recorded completed session with rejected weekly telemetry and 167 credit remains eligible; the recorded weekly-limit error session closes limited and records a hold; zero recorded credit excludes an account, while rate-only readings and migrated inferred holds do not -- falsifier: uv run --frozen pytest tests/nodes/node_cloud_session_placement_effect/test_cloud_hold_subscription_rate.py -q --no-cov --confcutdir=tests/nodes/node_cloud_session_placement_effect'
  - id: req-omn19998-process-range
    statement: The Process page plots a chosen measure and recalculates details for the selected range against the immediately preceding equal-length window.
    acceptance:
      - id: AC8
        statement: 'AC8: selected ranges change counts; browser values match the typed compute for counts, shares, durations and medians; partial coverage and sub-bucket ranges remain unmeasured; custom times use Eastern across clock changes -- falsifier: uv run --frozen pytest tests/nodes/node_factory_floor_publish_effect/test_process_range.py -q --no-cov'
  - id: req-omn19998-capture-provenance
    statement: The work-event projection retains supplied capture attribution and explicit causal edges alongside the governed directory shape.
    acceptance:
      - id: AC8
        statement: 'Supplied principal, correlation_id and causation_id survive the four hook projection routes and their snapshot deltas; absent attribution and causation stay absent, replay is idempotent and distinct provenance does not collapse.'
  - id: req-omn19998-morning-readme-heading
    statement: The morning README tool selects a unique exact heading before considering substring matches and refuses ambiguous matches.
    acceptance:
      - id: AC8
        statement: 'AC8: through the registered morning_readme tool, a normalized exact heading wins in either document order, ambiguous substring and duplicate exact matches are refused, and unique substring, missing-heading, listing and section-boundary behavior are covered -- falsifier: uv run --frozen pytest tests/nodes/node_morning_ground_state_orchestrator/test_morning_report_phase_tools.py -q --no-cov -k readme'
  - id: req-omn19998-plan-ticket-window
    statement: The plan-state tool reads every tracked plan before filtering its date window and paginating the results.
    acceptance:
      - id: AC8
        statement: 'AC8: registered plan_ticket_states requests for 30 and 120 days return every eligible plan and resolved ticket state across all pages from a committed Git listing larger than 4,000 characters, including October 2-8; future and invalid dates are excluded and command reports stay bounded -- falsifier: uv run --frozen pytest tests/nodes/node_morning_ground_state_orchestrator/test_plan_ticket_states_window.py -q --no-cov'
  - id: req-omn19998-floor-source-wiring
    statement: The floor reuses the existing fleet observation and delegation projection producers across publishing hosts.
    acceptance:
      - id: AC8
        statement: 'The publisher mirrors the deployed runner projection file before computing the floor, records a failed read as unread, and the floor renders projection delegation windows with exact zero counts and escaped unread causes; standalone fleet delivery saves the same observation file.'
  - id: req-omn19998-host-model-serving
    statement: A typed lab host declares model serving independently of lane and unit placement, defaulting to its existing availability when omitted.
    acceptance:
      - id: AC8
        statement: 'AC8: the typed host resolver accepts separate model_serving booleans; omitted values inherit available, including its true default; enabling serving never admits an unavailable host to placement; malformed and unknown fields remain refused -- falsifier: uv run --frozen pytest tests/unit/lab_work/test_lab_host_model_serving.py -q --no-cov'
  - id: req-omn19998-prepush-missing-base
    statement: The ticket-contract hook resolves its comparison base before checking the outgoing commit, fetching only an absent configured remote branch.
    acceptance:
      - id: AC10
        statement: 'AC10: a single-branch worker clone missing origin/dev fetches its base through the shipped hook adapter; explicit titles and alternate remote refs work, existing bases work offline, and missing contracts, missing runtime proof, unreadable heads, local-only missing refs and fetch errors remain refusals -- falsifier: uv run --frozen pytest tests/nodes/node_ticket_contract_prerequisite_effect/test_missing_base.py -q --no-cov -n 0 -p no:randomly'
  - id: req-omn19998-ruling-failed-recovery
    statement: A failed mechanism lane remains unfinished work for the existing ruling recovery dispatcher and its retry limit.
    acceptance:
      - id: AC11
        statement: 'A recorded failed mechanism run is offered once after the two-hour grace period with its run and error retained; a second unfinished attempt becomes one durable orchestrator exception; later claims and finished terminals suppress recovery -- falsifier: uv run --frozen pytest tests/nodes/test_ruling_recovery.py -q --no-cov -n 0'
  - id: req-omn19998-finished-clone-retention
    statement: Final remote run retention archives reports before removing a clean clone whose commits are reachable on remote refs.
    acceptance:
      - id: AC8
        statement: 'A finished clean clone is removed; uncommitted work, unpushed commits, unfinished ownership, unsafe paths and repositories holding a peer worktree git directory are preserved with a reason -- falsifier: uv run --frozen pytest tests/nodes/node_remote_lane_effect/test_run_retention.py -q --no-cov -n 0'
  - id: req-omn19998-floor-publish-interval
    statement: The existing floor publisher keeps large process series off the shared floor payload, retains lossless report detail, and renders a prepared timer environment with its declared projection host.
    acceptance:
      - id: AC10
        statement: 'AC10: an oversized recorded-shape series publishes a bounded summary and lossless compressed detail; the browser rejects mixed generations; the timer avoids sync and persists its declared runtime SSH host; a floor refresh refusal still permits shared report pages -- falsifier: uv run --frozen pytest tests/nodes/node_factory_floor_publish_effect/test_publish_interval_regression.py -q --no-cov -n 0 -p no:randomly'
  - id: req-omn19998-floor-phoenix-timer-env
    statement: The installed floor timer persists the Phoenix URL the floor reads its trace count and newest span age from.
    acceptance:
      - id: AC11
        statement: 'AC11: the rendered factory-floor-publish unit carries the floor contract''s Phoenix URL variable from the request or the installing shell, sets none when neither names one, and refuses a URL that is not http or https -- falsifier: uv run --frozen pytest tests/nodes/node_factory_floor_effect/test_phoenix_timer_environment.py -q --no-cov -n 0 -p no:randomly'
  - id: req-omn19998-ledger-detail-reference-retention
    statement: Ledger detail retention preserves old units cited by declared local readers and refuses removal when readers cannot be checked or change during archival.
    acceptance:
      - id: AC12
        statement: 'AC12: declared reader globs preserve cited old details, unreadable or changing readers prevent removal, and the shipped cleanup node reports cited units kept and uncited units eligible -- falsifier: uv run --frozen pytest tests/nodes/test_omn17427_file_retention.py -q --no-cov -n 0 -p no:randomly'
  - id: req-omn19998-delegation-daily-cap
    statement: A recorded daily provider cap blocks the credential until reset, and delegation moves past the blocked route without spending its transient retry allowance.
    acceptance:
      - id: AC8
        statement: 'AC8: recorded OpenRouter daily-cap fields select a provider-scoped reset block, ordinary model throttles keep their existing cooldown, capped BYOK routes make one attempt before the next registered key, and transient failures retain their existing bounded retries -- falsifier: uv run --frozen pytest tests/unit/delegation/test_openrouter_daily_cap.py tests/unit/nodes/node_delegate_skill_orchestrator/test_byok_escalation_omn20607.py tests/unit/delegation/test_omn18265_provider_error_in_200_body.py -q --no-cov'
  - id: req-omn19998-lab-host-toolchain
    statement: The existing toolchain nodes declare build and script tools and reject masked missing-command results.
    acceptance:
      - id: AC11
        statement: 'AC11: every declared lab host requires make, jq and python alongside node, pnpm, onex and pyright; missing tools are named, overlay installers are re-probed and idempotent, and both shell missing-command diagnostics fail even at exit zero -- falsifier: uv run --frozen pytest tests/nodes/node_lane_toolchain_provision_effect/test_lab_host_tools.py -q --no-cov -n 0'
  - id: req-omn19998-remote-ref-before-send
    statement: Remote lane ref resolution checks the default branch and requested branch before send and returns typed refusals.
    acceptance:
      - id: AC13
        statement: 'AC13: an unpushed lane branch is refused as BRANCH_NOT_PUSHED with the default branch named, the same branch resolves once pushed, and an empty remote is refused as NO_DEFAULT_BRANCH through the contract-bound handler and real Git -- falsifier: uv run --frozen pytest tests/nodes/node_remote_lane_effect/test_branch_check_before_send.py -q --no-cov -n 0 -p no:randomly'
evidence_requirements:
  - kind: tests
    description: Recorded gate subject spellings and named causes run through the production ledger parser and contract handler.
    command: uv run --frozen pytest tests/nodes/node_factory_floor_compute/test_gate_verdict_readback.py -q --no-cov -n 0 -p no:randomly
  - kind: tests
    description: Floor PR ownership regressions exercise the watcher source adapter and the contract handler for manifest and fallback table lines.
    command: uv run --frozen pytest tests/nodes/node_factory_floor_compute/test_stop_pr_ownership.py -q --no-cov -n 0 -p no:randomly
  - kind: tests
    description: The registered plan-state tool reads a Git directory larger than the command-report tail before applying the requested date window and pagination.
    command: uv run --frozen pytest tests/nodes/node_morning_ground_state_orchestrator/test_plan_ticket_states_window.py -q --no-cov
  - kind: tests
    description: The retry tests and the existing heal decision, collection and CLI tests run at the pushed head.
    command: uv run pytest tests/ci/test_pr_stale_red_heal_omn19852.py -q --no-cov
  - kind: tests
    description: The additive-wire suite exercises model serialization, queued requests, and the bus caller against the pre-field host model.
    command: uv run pytest tests/unit/work_ledger_bus/test_request_additive_wire.py -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn19998-floor-current-gate
    description: Replays the October 31 and November 2 subject mismatch through parse_ledger_text and HandlerFactoryFloor.handle. Positive pass and fail controls cover each spelling and configurable aliases. This scoped proof does not assert controller timer criteria or that the alignment gate passes.
    source: manual
    binds_ac: [AC12]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/nodes/node_factory_floor_compute/test_gate_verdict_readback.py -q --no-cov -n 0 -p no:randomly
        cwd: .
  - id: dod-omn19998-floor-current-gate-deploy
    description: Hosted smoke exercises the production ledger adapter and contract-loaded configuration through the floor handler; no live gate or ledger is mutated.
    source: manual
    binds_ac: [AC12]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/nodes/node_factory_floor_compute/test_gate_verdict_readback.py -q --no-cov -n 0 -p no:randomly -k latest_gate_alias
        cwd: .
  - id: dod-omn19998-floor-stop-ownership
    description: The recorded dependency-update title and branch no longer stop an unrelated ticket's line. Owned red PRs still stop with their check and evidence named; unread explicit links remain visible. This scoped proof does not assert the controller timer criteria.
    source: manual
    binds_ac: [AC11]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/nodes/node_factory_floor_compute/test_stop_pr_ownership.py -q --no-cov -n 0 -p no:randomly
        cwd: .
  - id: dod-omn19998-floor-stop-ownership-deploy
    description: Hosted smoke loads the recorded watcher shape through the production source adapter and invokes HandlerFactoryFloor.handle with its contract configuration. It needs no broker, host installation or credential.
    source: manual
    binds_ac: [AC11]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/nodes/node_factory_floor_compute/test_stop_pr_ownership.py -q --no-cov -n 0 -p no:randomly -k recorded-dependency-update
  - id: dod-omn19998-remote-ref-before-send
    description: Replay the unpushed branch case through the contract-bound ref handler and local Git adapter. The default branch and typed refusal assertions fail against the base handler; the pushed branch is the positive control. This scoped proof does not assert the controller timer criteria or adoption by an external caller.
    source: manual
    binds_ac: [AC13]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/nodes/node_remote_lane_effect/test_branch_check_before_send.py -q --no-cov -n 0 -p no:randomly
        cwd: .
  - id: dod-omn19998-ledger-detail-reference-retention
    description: Scoped retention regression only. Declared reader globs preserve cited old details, unreadable readers prevent removal, and reader changes during archive verification prevent removal. This does not assert a ledger writer fix, a live cleanup installation, or the controller timer criteria.
    source: manual
    binds_ac: [AC12]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/nodes/test_omn17427_file_retention.py -q --no-cov
        cwd: .
  - id: dod-omn19998-ledger-detail-retention-wiring
    description: Hosted wiring smoke passes a dry-run request through NodeRetentionCleanup and its shipped ledger-detail policy with temporary reader files. It reports a cited detail kept and an uncited detail eligible, with no files removed or archived. No host cleanup is run.
    source: manual
    binds_ac: [AC12]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/nodes/test_omn17427_file_retention.py -q --no-cov -k declared_reader_globs
        cwd: .
  - id: dod-omn19998-lab-host-toolchain
    description: Replay the recorded missing-tool and masked-zero shapes through the existing parity and provisioning handlers, including a real POSIX shell, overlay installer re-probes and working-version controls. Does not assert the unrelated controller timer criteria or live host installation.
    source: manual
    binds_ac: [AC11]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/nodes/node_lane_toolchain_provision_effect/test_lab_host_tools.py -q --no-cov -n 0
        cwd: .
  - id: dod-omn19998-lab-host-toolchain-deploy
    description: Hosted wiring smoke discovers and auto-wires the provisioning contract, then invokes its declared handler and typed request with the real host adapter. The recorded POSIX shell probe exits zero after pnpm is not found; it must name an operator step, while a working probe stays unchanged. The masked-failure case fails at the merge base. Live host installation remains separate evidence.
    source: manual
    binds_ac: [AC11]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/nodes/node_lane_toolchain_provision_effect/test_golden_chain_lane_toolchain_provision_effect.py -q --no-cov -n 0
        cwd: .
  - id: dod-omn19998-ruling-failed-recovery
    description: The recorded failed run is replayed through the throughput tick effect, including its corrected mechanism link and recovered repository brief. Four regressions fail before the change. This scoped recovery proof does not assert that all process rulings have mechanisms or that a host timer is installed.
    source: manual
    binds_ac: [AC11]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/nodes/test_ruling_recovery.py -q --no-cov -n 0
        cwd: .
  - id: dod-omn19998-ruling-failed-recovery-deploy
    description: Hosted wiring smoke exercises the same HandlerLabFill entry used by the throughput tick, recovers the original repository from a brief, dispatches through a local runner and observes one sent-key receipt on repeated ticks. It uses a structural projection of the recorded ledger case and no external services; live runtime adoption remains unmeasured.
    source: manual
    binds_ac: [AC11]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/nodes/test_ruling_recovery.py -q --no-cov -n 0 -k recorded_failed_mechanism
        cwd: .
  - id: dod-omn19998-prepush-missing-base
    description: Replay the recorded exit-128 origin/dev resolution failure with a real single-branch clone and local git remote through the shipped CLI, including negative controls. This scoped hook proof does not assert the controller timer criteria.
    source: manual
    binds_ac: [AC10]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/nodes/node_ticket_contract_prerequisite_effect/test_missing_base.py -q --no-cov -n 0 -p no:randomly
        cwd: .
  - id: dod-omn19998-prepush-missing-base-deploy
    description: Hosted hook-adapter smoke invokes the contract-backed node CLI as a subprocess in a real worker clone, observes the fetched tracking ref and unchanged head and worktree, and needs no credential. Host hook installation remains the publishing runner's responsibility.
    source: manual
    binds_ac: [AC10]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/nodes/node_ticket_contract_prerequisite_effect/test_missing_base.py -q --no-cov -n 0 -p no:randomly -k missing_remote_base_is_fetched
        cwd: .
  - id: dod-omn19998-floor-publish-interval
    description: Scoped regression over the measured large process-health series, report-reader boundary, missing timer environment, and independent report publication. Five cases failed before the change. This does not assert the original landing-controller criteria or a live installed timer tick.
    source: manual
    binds_ac: [AC10]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/nodes/node_factory_floor_publish_effect/test_publish_interval_regression.py -q --no-cov -n 0 -p no:randomly
        cwd: .
  - id: dod-omn19998-floor-publish-wiring
    description: Hosted wiring smoke renders the timer from its installer contract and passes that rendered environment through the projection report handler. Live installation and next-tick observation remain required on the publishing host.
    source: manual
    binds_ac: [AC10]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/nodes/node_factory_floor_publish_effect/test_publish_interval_regression.py -q --no-cov -n 0 -p no:randomly -k timer_persists
        cwd: .
  - id: dod-omn19998-publish-recovery
    description: Local bare remotes reproduce the recorded head-moved, non-fast-forward and generic push-failed interleavings, conflicts, repeated overlapping phase commits, branch collisions and bounded head movement. These tests exercise publish recovery and do not assert the controller timer criteria.
    source: manual
    binds_ac:
      - AC8
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/nodes/node_remote_lane_effect/test_publish_recovery.py -q --no-cov --tb=line
