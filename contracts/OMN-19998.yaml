        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC1"]
  - id: "dod-omn19998-omn19401-selection-names-test-file"
    description: "The repo evidence test passes at the head and fails at the merge base, where contracts/OMN-19401.yaml's dod-omn19401-ac1-step-by-step-selection runs pytest over a directory instead of naming the reducer test file that holds its step_by_step tests."
