schema_version: "1.0.0"
ticket_id: "OMN-19998"
title: "omnimarket dev binds every repo contract criterion to repo pytest evidence again"
summary: "omnimarket#3783 added dod-omnimarket-pr-3775-deploy-probe to contracts/OMN-20074.yaml with binds_ac AC10, but the item's only check is a gh api deploy probe. tests/ci/test_repo_evidence_caller_workflow.py::test_every_repo_contract_binds_every_criterion requires every binds_ac item to carry uv run pytest evidence naming a repo test file, so that test fails on dev 6b43215db and turns Tests (Split 14/20) red on every pull request whose shard carries it. The deploy probe stays as deploy evidence without binds_ac, as the merged deploy probes in contracts/OMN-20676.yaml and others do, and AC10 stays bound by dod-omnimarket-pr-3775-rejection to its rejection test file."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-repo-contracts-bind-pytest-evidence"
    statement: "Every repo-owned contracts/OMN-*.yaml on dev binds each acceptance criterion only through dod_evidence items that name an existing repo pytest file, so the repo evidence test passes on dev."
    acceptance:
      - id: "AC1"
        statement: "AC1: contracts/OMN-20074.yaml's dod-omnimarket-pr-3775-deploy-probe carries no binds_ac, AC10 stays bound by dod-omnimarket-pr-3775-rejection, and test_every_repo_contract_binds_every_criterion passes -- falsifier: uv run pytest tests/ci/test_repo_evidence_caller_workflow.py -q -k test_every_repo_contract_binds_every_criterion fails at the merge base"
  - id: "req-merge-queue-base-queues-behind-green"
    statement: "On a base that lands through a GitHub merge queue, the landing decision queues a green behind PR as it is and never update-branches it first; a red behind PR is still updated, and a base with no queue still updates first."
    acceptance:
      - id: "AC2"
        statement: "AC2: decide_landing emits merge, not update_branch, for every green behind PR whose facts carry merge_queue=true, waits on a pending one, leaves an armed owned one alone, and still updates a red one or one with no queue -- falsifier: uv run pytest tests/unit/nodes/node_pr_landing_decision_compute/test_landing_decision_merge_queue.py -q fails with the handler at the merge base"
  - id: "req-reviewer-rerun-red-is-real"
    statement: "A reviewer-pool red at a head that already had its one rerun is the PR's own red: the reviewer-pool rule presents it as a product red with its reviewer checks, never as pending, so the landing decision sends a fix worker or escalates."
    acceptance:
      - id: "AC3"
        statement: "AC3: omniclaude#2752's shape (both hostile-review checks failed at head 6b3bf7bcb3 after its one rerun) is presented as a product red with both reviewer checks, the decision dispatches a real_red worker leased on those checks, and with the worker ladder spent it reports escalation_exhausted -- falsifier: uv run pytest tests/unit/nodes/node_pr_lifecycle_triage_compute/test_reviewer_pool_rerun_red.py -q fails at the merge base"
  - id: "req-budget-cancel-evidence-check-readiness"
    statement: "The cancellation evidence check waits for the blocked provider call before triggering handler budget expiry, so interpreter boot cannot change the stage it tests."
    acceptance:
      - id: "AC4"
        statement: "AC4: both spawned customer-route cancellation scenarios retain their exact inference stage, routing, credential and attempt evidence even when total child startup consumes the original 12-second handler budget -- falsifier: delay spawn startup and run uv run pytest tests/unit/nodes/node_delegate_skill_orchestrator/test_budget_cancel_keeps_evidence.py -q with the test at the merge base"
  - id: "req-repo-status-check-per-tick"
    statement: "Operator RULING 2026-10-15T00:42:51Z: the merge-throughput tick decision gives every repository with open non-draft PRs and zero merges in the window one typed status verdict (merging normally, waiting on CI, base branch red, merge queue ejecting, shared red unowned, parked or escalated), deduped per repository while its unit is open, and an unowned shared red or an ejecting merge queue is a MISSING line whose FIX names one cause lane or the controller."
    acceptance:
      - id: "AC5"
        statement: "AC5: given repo_status facts, a repository with two open PRs red on the same check and no cause lease is shared_red_unowned with a MISSING repo-status line naming one cause lane, a base_blocked ejection is merge_queue_ejecting, an open unit with the same verdict emits no event, and the verdicts ride the node's result over the in-memory bus -- falsifier: uv run pytest tests/nodes/node_throughput_tick_decision_compute/test_repo_status_throughput_tick_decision_compute.py -q fails at the merge base"
  - id: "req-expired-dep-health-allowlist-row-removed"
    statement: "The committed dep-health allowlist carries no row past its expires_at: the task-delegated legacy compat row expired 2026-10-15 and is removed, so the allowlist expiry test passes on dev and in every shard that runs it."
    acceptance:
      - id: "AC6"
        statement: "AC6: src/dep_health_allowlist.yaml carries no row for onex.evt.omniclaude.task-delegated.v1, test_this_repo_allowlist_has_no_expired_entries passes, and the dependency health sweep reports no finding for that topic -- falsifier: uv run pytest tests/nodes/test_dep_health_contract_topology.py -q -k test_this_repo_allowlist_has_no_expired_entries fails at the merge base once the UTC date is past 2026-10-15"
  - id: "req-construction-terminal-consumer-first"
    statement: "The delegate-skill consumer accepts the declared construction-result keys, preserving a null score and the gate's own flag and retaining the construction-result fields through JSON serialization."
    acceptance:
      - id: "AC7"
        statement: "AC7: response and failed-topic JSON decode construction failure with either gate flag and a null score; conversion retains the distinction, contradictory evidence and unknown keys are refused, legacy defaults stay intact, the declared construction outcome, content verdict and failure reason round-trip through JSON serialization, and empty rule evaluations retain their omission -- falsifier: uv run pytest tests/unit/delegation/test_construction_consumer_first_omn19998.py -q refuses a receiver that discards these fields"
  - id: "req-capture-item-identity-node-in-omnimarket"
    statement: "The shared item identity, per-stream producer sequence and barrier fields that omniclaude's two capture hooks stamp are owned by an omnimarket node in canonical shape (contract, node, handler), and the capture-redaction owner contract classifies the new record fields verbatim."
    acceptance:
      - id: "AC8"
        statement: "AC8: node_capture_item_identity_effect resolves a content record id, claims one event id shared by the two hooks of a call in either order, issues 1,000 gap-free sequence numbers to eight concurrent writers, declares its topics in its contract, loads by file path with standard-library imports only, and the owner redaction contract keeps content_record_id, producer_seq, stream and the barrier fields verbatim -- falsifier: uv run pytest tests/test_capture_item_identity_effect.py tests/test_golden_chain_capture_item_identity_effect.py tests/unit/nodes/node_event_emit_effect/test_capture_identity_fields_omn18531.py -q fails at the merge base"
  - id: "req-external-deadman-check-node-in-omnimarket"
    statement: "The external dead-man check that judges the two watchdog legs' mirror variables, the open issues and the clock is an omnimarket node in canonical shape (contract, node, handler) with its topics declared in its contract."
    acceptance:
      - id: "AC9"
        statement: "AC9: node_external_deadman_check_compute raises when both mirrors are stale or unreadable, when a fresh mirror reports an episode undelivered or unrecorded past its due time plus the escalation bound, or when the day's canary is past its receipt deadline, keeps one issue, and declares its command and event topics in its contract -- falsifier: uv run pytest tests/test_external_deadman_omn20808.py tests/test_golden_chain_external_deadman_check_compute.py -q fails at the merge base"
  - id: "req-release-gates-accept-git-pin"
    statement: "omnimarket's release-gated checks grade the commit a consumer pins instead of waiting for a release: the Wire Compatibility Gate replays against the omnimarket commit omniclaude dev's uv.lock pins, the sibling pins steps accept a uv.lock git source locked to one commit and check omnibase_infra out at it, and a dev merge dispatches omnimarket-dev-moved to omniclaude."
    acceptance:
      - id: "AC12"
        statement: "AC12: check_wire_compatibility.py --consumer-ref grades the pinned commit and fails closed on an unresolvable ref, the gate step passes omniclaude's pin, every pins step accepts a commit-locked git source and refuses a moving one, and runtime-rebuild-trigger.yml dispatches omnimarket-dev-moved on a dev merge -- falsifier: uv run pytest tests/ci/test_omniclaude_pin_follows_dev_omn19998.py -q, uv run pytest tests/ci/test_check_wire_compatibility_omn18868.py -q -k 'pinned_consumer or unresolvable_consumer_ref' and uv run pytest tests/ci/test_sibling_pins_omn20001.py -q -k commit_pin fail at the merge base"
  - id: "req-release-staleness-advisory"
    statement: "Operator RULING 2026-10-16T07:34:18Z (no release wait; no users yet): Release Staleness (OMN-18010) keeps running unconditionally in ci.yml and keeps its 24-hour STALE measurement, but CI Summary lists it in SOFT_ALLOWLIST instead of STRICT_GATE_JOBS, so a stale, failed, absent or running Release Staleness job never fails or holds CI Summary, while any other failed job still fails it."
    acceptance:
      - id: "AC10"
        statement: "AC10: Release Staleness (OMN-18010) is in SOFT_ALLOWLIST and in neither STRICT_GATE_JOBS nor SKIPPABLE_GATE_JOBS, CI Summary evaluates SUCCESS with that job failed, cancelled, absent or running, an unregistered failed job still yields FAILURE, and the job stays unconditional with its STALE controls -- falsifier: uv run pytest tests/ci/test_release_staleness_gate_omn18010.py -q fails at the merge base"
  - id: "req-dev-merge-tag-on-every-dev-push"
    statement: "Operator RULING 2026-10-16T09:35:49Z: in the lab omnimarket deploys from a tag cut automatically on each dev merge, not from a PyPI release. Every push to dev gets a lightweight tag dev-<UTC YYYYMMDDHHMMSS>-<sha12> on the pushed commit, idempotent per commit, and no other ref gets one."
    acceptance:
      - id: "AC11"
        statement: "AC11: .github/workflows/dev-merge-tag.yml triggers only on push to dev, and its tag step, run against a throwaway repository with a +05:30 committer date, pushes one lightweight tag named dev-<committer time in UTC>-<sha12> at the commit, pushes nothing on a second run or when a dev tag for that sha already exists, pushes nothing in a dry run, and refuses a value that is not a full sha -- falsifier: uv run pytest tests/ci/test_dev_merge_tag_workflow_omn19998.py -q fails at the merge base, where the workflow does not exist"
  - id: "req-mirror-durable-merge-outbox"
    statement: "The git query mirror persists merge payloads before moving its scan watermark and marks a PR published only after its Kafka adapter returns from the broker acknowledgement; a restarted handler republishes pending payloads with their original event IDs."
    acceptance:
      - id: "AC12"
        statement: "AC12: publish failure leaves the merge pending and unpublished, a new process republishes the saved payload, the Kafka adapter waits for acknowledgement before the published marker is written, partial batches retry only unacknowledged merges, and failures before the scan or published-marker write retain recoverable state -- falsifier: uv run pytest tests/nodes/node_git_query_mirror_effect/test_omn19834_mirror_merge_events.py -q fails with the mirror and handler at the merge base"
  - id: "req-github-check-run-create"
    statement: "The existing GitHub repository write effect accepts typed check-run creation through its declared command topic and existing transport and auth."
    acceptance:
      - id: "AC13"
        statement: "AC13: check_run_create validates name, head_sha, status, conclusion and output title/summary, posts the recorded request shape, returns check_run_id, html_url and head_sha on the completed topic, and retains dry-run, quota, failure and in-process replay behavior -- falsifier: uv run pytest tests/unit/nodes/node_github_repo_write_effect/test_handler_github_repo_write.py tests/test_golden_chain_github_repo_write_effect.py -q -k check_run_create fails at the merge base"
evidence_requirements:
  - kind: "tests"
    description: "Every repo contract binds each criterion to repo pytest evidence."
    command: "uv run pytest tests/ci/test_repo_evidence_caller_workflow.py -q -k test_every_repo_contract_binds_every_criterion"
  - kind: "tests"
    description: "A reviewer red rerun at its head gets a worker or an escalation, never pending."
    command: "uv run pytest tests/unit/nodes/node_pr_lifecycle_triage_compute/test_reviewer_pool_rerun_red.py tests/unit/nodes/node_pr_lifecycle_triage_compute/test_landing_red_rules.py -q"
  - kind: "tests"
    description: "The committed dep-health allowlist has no expired row."
    command: "uv run pytest tests/nodes/test_dep_health_contract_topology.py -q -k test_this_repo_allowlist_has_no_expired_entries"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn19998-mirror-durable-outbox"
    description: "Mirror outbox regression tests cover publish failure, process restart, broker acknowledgement ordering, partial batch delivery, disk write failure and crash boundaries."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_git_query_mirror_effect/test_omn19834_mirror_merge_events.py -q"
        cwd: "${OMNI_HOME}/omnimarket"
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_git_query_mirror_effect/test_golden_chain_git_query_mirror_effect.py -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC12"]
  - id: "dod-omn19998-mirror-outbox-deploy-probe"
    description: "Hosted-runner source probe requires the mirror's publication path to await adapter.publish before mark_merge_published; the base has no such path and fails. This source probe does not claim successful live broker delivery."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: >-
          python3 -c 'import ast; from pathlib import Path; p=Path("src/omnimarket/nodes/node_git_query_mirror_effect/handlers/handler_git_query_mirror.py"); t=ast.parse(p.read_text()); f=next(n for n in ast.walk(t) if isinstance(n,ast.AsyncFunctionDef) and n.name=="_publish_pending"); a=[n for n in ast.walk(f) if isinstance(n,ast.Await)]; publish=next(n.lineno for n in a if "adapter.publish" in ast.unparse(n)); ack=next(n.lineno for n in a if "mirror.mark_merge_published" in ast.unparse(n)); assert publish < ack'
  - id: "dod-omn19998-construction-consumer-first"
    description: "The consumer JSON decode and terminal conversion tests preserve the gate fact and null score, retain the declared construction-result fields, and refuse contradictory evidence and unknown keys."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/delegation/test_construction_consumer_first_omn19998.py -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC7"]
  - id: "dod-omn19998-construction-consumer-deploy-probe"
    description: "Hosted-runner decode through the consumer's JSON API at this head accepts an unscored construction failure, retains the gate flag and empty rule evaluations, and round-trips the declared construction outcome, content verdict and failure reason; a receiver that discards or changes the construction pair or failure reason fails."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: >-
          uv run python -c 'import json; from omnimarket.models.delegation.wire.model_delegate_skill_response import ModelDelegateSkillFailed; p={"correlation_id":"4d97ece9-97cc-4837-9f67-fc0c29bc53ef","task_type":"document","status":"failed","quality_gate_passed":True,"quality_score":None,"operational_outcome":"terminal_construction_failed","content_verdict":"undetermined","terminal_failure_reason":"terminal_construction_failed","rule_evaluations":[]}; r=ModelDelegateSkillFailed.model_validate_json(json.dumps(p)); assert r.quality_gate_passed is True and r.quality_score is None; d=r.model_dump(mode="json"); assert all(d[k] == p[k] for k in ("operational_outcome","content_verdict","terminal_failure_reason")); assert r.rule_evaluations == () and "rule_evaluations" not in d; assert ModelDelegateSkillFailed.model_validate_json(r.model_dump_json()).model_dump(mode="json") == d'
