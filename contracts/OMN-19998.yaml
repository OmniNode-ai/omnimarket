schema_version: "1.0.0"
ticket_id: "OMN-19998"
title: "omnimarket dev binds every repo contract criterion to repo pytest evidence again"
summary: "omnimarket#3783 added dod-omnimarket-pr-3775-deploy-probe to contracts/OMN-20074.yaml with binds_ac AC10, but the item's only check is a gh api deploy probe. tests/ci/test_repo_evidence_caller_workflow.py::test_every_repo_contract_binds_every_criterion requires every binds_ac item to carry uv run pytest evidence naming a repo test file, so that test fails on dev 6b43215db and turns Tests (Split 14/20) red on every pull request whose shard carries it. The deploy probe stays as deploy evidence without binds_ac, as the merged deploy probes in contracts/OMN-20676.yaml and others do, and AC10 stays bound by dod-omnimarket-pr-3775-rejection to its rejection test file."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-repo-contracts-bind-pytest-evidence"
    statement: "Every repo-owned contracts/OMN-*.yaml on dev binds each acceptance criterion only through dod_evidence items that name an existing repo pytest file, so the repo evidence test passes on dev."
    acceptance:
      - id: "AC1"
        statement: "AC1: contracts/OMN-20074.yaml's dod-omnimarket-pr-3775-deploy-probe carries no binds_ac, AC10 stays bound by dod-omnimarket-pr-3775-rejection, and test_every_repo_contract_binds_every_criterion passes -- falsifier: uv run pytest tests/ci/test_repo_evidence_caller_workflow.py -q -k test_every_repo_contract_binds_every_criterion fails at the merge base"
  - id: "req-merge-queue-base-queues-behind-green"
    statement: "On a base that lands through a GitHub merge queue, the landing decision queues a green behind PR as it is and never update-branches it first; a red behind PR is still updated, and a base with no queue still updates first."
    acceptance:
      - id: "AC2"
        statement: "AC2: decide_landing emits merge, not update_branch, for every green behind PR whose facts carry merge_queue=true, waits on a pending one, leaves an armed owned one alone, and still updates a red one or one with no queue -- falsifier: uv run pytest tests/unit/nodes/node_pr_landing_decision_compute/test_landing_decision_merge_queue.py -q fails with the handler at the merge base"
  - id: "req-reviewer-rerun-red-is-real"
    statement: "A reviewer-pool red at a head that already had its one rerun is the PR's own red: the reviewer-pool rule presents it as a product red with its reviewer checks, never as pending, so the landing decision sends a fix worker or escalates."
    acceptance:
      - id: "AC3"
        statement: "AC3: omniclaude#2752's shape (both hostile-review checks failed at head 6b3bf7bcb3 after its one rerun) is presented as a product red with both reviewer checks, the decision dispatches a real_red worker leased on those checks, and with the worker ladder spent it reports escalation_exhausted -- falsifier: uv run pytest tests/unit/nodes/node_pr_lifecycle_triage_compute/test_reviewer_pool_rerun_red.py -q fails at the merge base"
  - id: "req-budget-cancel-evidence-check-readiness"
    statement: "The cancellation evidence check waits for the blocked provider call before triggering handler budget expiry, so interpreter boot cannot change the stage it tests."
    acceptance:
      - id: "AC4"
        statement: "AC4: both spawned customer-route cancellation scenarios retain their exact inference stage, routing, credential and attempt evidence even when total child startup consumes the original 12-second handler budget -- falsifier: delay spawn startup and run uv run pytest tests/unit/nodes/node_delegate_skill_orchestrator/test_budget_cancel_keeps_evidence.py -q with the test at the merge base"
  - id: "req-repo-status-check-per-tick"
    statement: "Operator RULING 2026-10-15T00:42:51Z: the merge-throughput tick decision gives every repository with open non-draft PRs and zero merges in the window one typed status verdict (merging normally, waiting on CI, base branch red, merge queue ejecting, shared red unowned, parked or escalated), deduped per repository while its unit is open, and an unowned shared red or an ejecting merge queue is a MISSING line whose FIX names one cause lane or the controller."
    acceptance:
      - id: "AC5"
        statement: "AC5: given repo_status facts, a repository with two open PRs red on the same check and no cause lease is shared_red_unowned with a MISSING repo-status line naming one cause lane, a base_blocked ejection is merge_queue_ejecting, an open unit with the same verdict emits no event, and the verdicts ride the node's result over the in-memory bus -- falsifier: uv run pytest tests/nodes/node_throughput_tick_decision_compute/test_repo_status_throughput_tick_decision_compute.py -q fails at the merge base"
  - id: "req-expired-dep-health-allowlist-row-removed"
    statement: "The committed dep-health allowlist carries no row past its expires_at: the task-delegated legacy compat row expired 2026-10-15 and is removed, so the allowlist expiry test passes on dev and in every shard that runs it."
    acceptance:
      - id: "AC6"
        statement: "AC6: src/dep_health_allowlist.yaml carries no row for onex.evt.omniclaude.task-delegated.v1, test_this_repo_allowlist_has_no_expired_entries passes, and the dependency health sweep reports no finding for that topic -- falsifier: uv run pytest tests/nodes/test_dep_health_contract_topology.py -q -k test_this_repo_allowlist_has_no_expired_entries fails at the merge base once the UTC date is past 2026-10-15"
  - id: "req-construction-terminal-consumer-first"
    statement: "The released delegate-skill consumer accepts construction-result keys before the producer declares them, preserving a null score and the gate's own flag without emitting the new keys."
    acceptance:
      - id: "AC7"
        statement: "AC7: response and failed-topic JSON decode construction failure with either gate flag and a null score; conversion retains the distinction, contradictory evidence and unknown keys are refused, legacy defaults stay intact, and the four forthcoming keys are absent from serialization -- falsifier: uv run pytest tests/unit/delegation/test_construction_consumer_first_omn19998.py -q fails at the merge base"
  - id: "req-capture-item-identity-node-in-omnimarket"
    statement: "The shared item identity, per-stream producer sequence and barrier fields that omniclaude's two capture hooks stamp are owned by an omnimarket node in canonical shape (contract, node, handler), and the capture-redaction owner contract classifies the new record fields verbatim."
    acceptance:
      - id: "AC8"
        statement: "AC8: node_capture_item_identity_effect resolves a content record id, claims one event id shared by the two hooks of a call in either order, issues 1,000 gap-free sequence numbers to eight concurrent writers, declares its topics in its contract, loads by file path with standard-library imports only, and the owner redaction contract keeps content_record_id, producer_seq, stream and the barrier fields verbatim -- falsifier: uv run pytest tests/test_capture_item_identity_effect.py tests/test_golden_chain_capture_item_identity_effect.py tests/unit/nodes/node_event_emit_effect/test_capture_identity_fields_omn18531.py -q fails at the merge base"
  - id: "req-external-deadman-check-node-in-omnimarket"
    statement: "The external dead-man check that judges the two watchdog legs' mirror variables, the open issues and the clock is an omnimarket node in canonical shape (contract, node, handler) with its topics declared in its contract."
    acceptance:
      - id: "AC9"
        statement: "AC9: node_external_deadman_check_compute raises when both mirrors are stale or unreadable, when a fresh mirror reports an episode undelivered or unrecorded past its due time plus the escalation bound, or when the day's canary is past its receipt deadline, keeps one issue, and declares its command and event topics in its contract -- falsifier: uv run pytest tests/test_external_deadman_omn20808.py tests/test_golden_chain_external_deadman_check_compute.py -q fails at the merge base"
  - id: "req-release-staleness-advisory"
    statement: "Operator RULING 2026-10-16T07:34:18Z (no release wait; no users yet): Release Staleness (OMN-18010) keeps running unconditionally in ci.yml and keeps its 24-hour STALE measurement, but CI Summary lists it in SOFT_ALLOWLIST instead of STRICT_GATE_JOBS, so a stale, failed, absent or running Release Staleness job never fails or holds CI Summary, while any other failed job still fails it."
    acceptance:
      - id: "AC10"
        statement: "AC10: Release Staleness (OMN-18010) is in SOFT_ALLOWLIST and in neither STRICT_GATE_JOBS nor SKIPPABLE_GATE_JOBS, CI Summary evaluates SUCCESS with that job failed, cancelled, absent or running, an unregistered failed job still yields FAILURE, and the job stays unconditional with its STALE controls -- falsifier: uv run pytest tests/ci/test_release_staleness_gate_omn18010.py -q fails at the merge base"
evidence_requirements:
  - kind: "tests"
    description: "Every repo contract binds each criterion to repo pytest evidence."
    command: "uv run pytest tests/ci/test_repo_evidence_caller_workflow.py -q -k test_every_repo_contract_binds_every_criterion"
  - kind: "tests"
    description: "A reviewer red rerun at its head gets a worker or an escalation, never pending."
    command: "uv run pytest tests/unit/nodes/node_pr_lifecycle_triage_compute/test_reviewer_pool_rerun_red.py tests/unit/nodes/node_pr_lifecycle_triage_compute/test_landing_red_rules.py -q"
  - kind: "tests"
    description: "The committed dep-health allowlist has no expired row."
    command: "uv run pytest tests/nodes/test_dep_health_contract_topology.py -q -k test_this_repo_allowlist_has_no_expired_entries"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn19998-construction-consumer-first"
    description: "The consumer JSON decode and terminal conversion tests reject the base's extra-key and null-score refusals, preserve the gate fact, and keep the forthcoming producer fields off the wire."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/delegation/test_construction_consumer_first_omn19998.py -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC7"]
  - id: "dod-omn19998-construction-consumer-deploy-probe"
    description: "Hosted-runner decode through the consumer's JSON API at this head accepts an unscored construction failure while retaining the gate flag and emitting none of its forthcoming fields; the base rejects that payload."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: >-
          uv run python -c 'import json; from omnimarket.models.delegation.wire.model_delegate_skill_response import ModelDelegateSkillFailed; p={"correlation_id":"4d97ece9-97cc-4837-9f67-fc0c29bc53ef","task_type":"document","status":"failed","quality_gate_passed":True,"quality_score":None,"operational_outcome":"terminal_construction_failed","content_verdict":"undetermined","terminal_failure_reason":"terminal_construction_failed","rule_evaluations":[]}; r=ModelDelegateSkillFailed.model_validate_json(json.dumps(p)); assert r.quality_gate_passed is True and r.quality_score is None; assert not {"operational_outcome","content_verdict","terminal_failure_reason","rule_evaluations"}.intersection(r.model_dump())'
  - id: "dod-omn19998-repo-contracts-bind-pytest-evidence"
    description: "The repo evidence test passes at the head and fails at the merge base, where contracts/OMN-20074.yaml binds AC10 to a command-only deploy probe."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/structure/test_deploy_probe_evidence_binding_omn19998.py -q"
        cwd: "${OMNI_HOME}/omnimarket"
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_repo_evidence_caller_workflow.py -q -k test_every_repo_contract_binds_every_criterion"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC1"]
  - id: "dod-omn19998-omn19401-selection-names-test-file"
    description: "The repo evidence test passes at the head and fails at the merge base, where contracts/OMN-19401.yaml's dod-omn19401-ac1-step-by-step-selection runs pytest over a directory instead of naming the reducer test file that holds its step_by_step tests."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/structure/test_deploy_probe_evidence_binding_omn19998.py -q -k omn19401"
        cwd: "${OMNI_HOME}/omnimarket"
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_repo_evidence_caller_workflow.py -q -k test_every_repo_contract_binds_every_criterion"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC1"]
  - id: "dod-omn19998-merge-queue-base-queues-behind-green"
    description: "The merge-queue scenarios pass at the head; with the handler at the merge base, the three green behind PRs on one merge-queue base each get update_branch instead of merge."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/nodes/node_pr_landing_decision_compute/test_landing_decision_merge_queue.py -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC2"]
  - id: "dod-omn19998-reviewer-rerun-red-is-real"
    description: "The omniclaude#2752 scenario passes through the reviewer-pool rule and the landing decision at the head and fails at the merge base, where the rerun head is presented as pending."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/nodes/node_pr_lifecycle_triage_compute/test_reviewer_pool_rerun_red.py -q"
        cwd: "${OMNI_HOME}/omnimarket"
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/nodes/node_pr_lifecycle_triage_compute/test_landing_red_rules.py -q -k reviewer_pool"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC3"]
  - id: "dod-omn19998-reviewer-rerun-red-deploy-probe"
    description: "Hosted-runner probe reads the reviewer-pool rule at this commit and requires the rerun-head branch that presents a product red; the base lacks it and fails."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: >-
          gh api "repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_pr_lifecycle_triage_compute/handlers/handler_apply_reviewer_pool.py?ref=$(git rev-parse HEAD)" --jq .content | base64 -d | grep -Fq 'if p["head_sha"] in rerun.get(p["pr"], set()):'
  - id: "dod-omn19998-budget-cancel-evidence-readiness"
    description: "Both real spawned-effect scenarios trigger the handler timeout only after the blocked provider call starts, and retain every existing terminal and attempt assertion."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/nodes/node_delegate_skill_orchestrator/test_budget_cancel_keeps_evidence.py -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC4"]
  - id: "dod-omn19998-repo-status-check-per-tick"
    description: "The repo-status scenarios pass at the head and fail at the merge base, whose request model refuses repo_status."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_throughput_tick_decision_compute/test_repo_status_throughput_tick_decision_compute.py -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC5"]
  - id: "dod-omn19998-repo-status-check-deploy-probe"
    description: "Hosted-runner probe reads the throughput-tick decision handler at this commit and requires the repo-status check; the base lacks it and fails."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: >-
          gh api "repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_throughput_tick_decision_compute/handlers/handler_throughput_tick_decision.py?ref=$(git rev-parse HEAD)" --jq .content | base64 -d | grep -Fc 'def check_repo_status('
  - id: "dod-omn19998-expired-allowlist-row-removed"
    description: "The allowlist expiry test passes at the head and fails at the merge base, where the task-delegated row is past its expires_at of 2026-10-15."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/test_dep_health_contract_topology.py -q -k 'test_this_repo_allowlist_has_no_expired_entries or test_this_repo_allowlist_has_no_task_delegated_row'"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC6"]
  - id: "dod-omn19998-expired-allowlist-deploy-probe"
    description: "Hosted-runner probe reads the dep-health allowlist at this commit and requires the diagnostic row to remain and the task-delegated row to be gone; the base still carries the expired row and fails."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: >-
          gh api "repos/OmniNode-ai/omnimarket/contents/src/dep_health_allowlist.yaml?ref=$(git rev-parse HEAD)" --jq .content | base64 -d | awk '/onex.evt.diagnostic.daemon-health.v1/{a=1} /onex.evt.omniclaude.task-delegated.v1/{b=1} END{exit !(a&&!b)}'
  - id: "dod-omn19998-capture-item-identity-node"
    description: "The node's handler, golden chain and contract tests and the redaction owner fields pass at the head; at the merge base the node package does not exist and every test file fails at collection."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/test_capture_item_identity_effect.py tests/test_golden_chain_capture_item_identity_effect.py tests/unit/nodes/node_event_emit_effect/test_capture_identity_fields_omn18531.py -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC8"]
  - id: "dod-omn19998-capture-item-identity-deploy-probe"
    description: "Hosted-runner probe reads the item identity handler at this commit and requires claim_event_id; the base has no such file and the probe finds no match."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: >-
          gh api "repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_capture_item_identity_effect/handlers/handler_item_identity.py?ref=$(git rev-parse HEAD)" --jq .content | base64 -d | grep -c '^def claim_event_id('
  - id: "dod-omn19998-external-deadman-check-node"
    description: "The node's handler and golden-chain tests pass at the head; at the merge base the node package does not exist and both test files fail at collection."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/test_external_deadman_omn20808.py tests/test_golden_chain_external_deadman_check_compute.py -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC9"]
  - id: "dod-omn19998-external-deadman-check-deploy-probe"
    description: "Hosted-runner probe reads the dead-man handler at this commit and requires its handler class; the base has no such file and the probe finds no match."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: >-
          gh api "repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_external_deadman_check_compute/handlers/handler_external_deadman_check.py?ref=$(git rev-parse HEAD)" --jq .content | base64 -d | grep -c '^class HandlerExternalDeadmanCheck'
  - id: "dod-omn19998-release-staleness-advisory"
    description: "The release-staleness registration and CI Summary verdict tests pass at the head; at the merge base the job is a strict gate, so a failed or absent Release Staleness fails or holds CI Summary and six tests fail."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_release_staleness_gate_omn18010.py -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC10"]
  - id: "dod-omn19998-staleness-advisory-deploy-probe"
    description: "Hosted-runner probe parses scripts/ci/ci_summary_gate.py at this commit and requires Release Staleness in SOFT_ALLOWLIST and out of STRICT_GATE_JOBS; at the base it is strict and the probe fails."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: >-
          gh api "repos/OmniNode-ai/omnimarket/contents/scripts/ci/ci_summary_gate.py?ref=$(git rev-parse HEAD)" --jq .content | base64 -d | python3 -c 'import ast,sys; t=ast.parse(sys.stdin.read()); v={n.target.id: ((ast.literal_eval(n.value.args[0]) if n.value.args else ()) if isinstance(n.value, ast.Call) else ast.literal_eval(n.value)) for n in t.body if isinstance(n, ast.AnnAssign) and isinstance(n.target, ast.Name) and n.target.id in ("STRICT_GATE_JOBS","SOFT_ALLOWLIST")}; j="Release Staleness (OMN-18010)"; assert j in v["SOFT_ALLOWLIST"] and j not in v["STRICT_GATE_JOBS"], "Release Staleness still gates CI Summary"'
