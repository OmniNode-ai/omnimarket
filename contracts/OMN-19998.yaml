schema_version: 1.0.0
ticket_id: OMN-19998
title: The repo-evidence binding of the review prompt-cache contract names a pytest file, so the contract-binds test passes again on dev and Tests (Split 15/20) stops failing on every open PR
summary: tests/ci/test_repo_evidence_caller_workflow.py::test_every_repo_contract_binds_every_criterion failed on dev because contracts/OMN-22343.yaml bound AC1 to a bare grep command, which binds no test file. Every pull request run of Tests (Split 15/20) carries that test and failed on it. The AC1 evidence item now runs the existing pytest test that reads config.prompt_cache from the gateway contract.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn19998-binding-names-a-test
    statement: Every repo-owned contract binds each of its criteria to a pytest check that names an existing test file, so the contract-binds test passes on dev.
    acceptance:
      - id: AC1
        statement: 'AC1: tests/ci/test_repo_evidence_caller_workflow.py::test_every_repo_contract_binds_every_criterion passes on the head, and fails at the merge base because contracts/OMN-22343.yaml dod-omn22343-ac1 is a command check -- falsifier: uv run pytest tests/ci/test_repo_evidence_caller_workflow.py -q --no-cov'
evidence_requirements:
  - kind: tests
    description: The contract-binds test and the review prompt-cache tests run at the pushed head.
    command: uv run pytest tests/ci/test_repo_evidence_caller_workflow.py tests/unit/nodes/node_claude_review_gateway_effect/test_review_prompt_cache_omn22343.py -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn19998-ac1
    description: AC1 runs the contract-binds test; it fails at the merge base with the OMN-22343 AC1 violation and passes once that item is a test_passes check naming the review prompt-cache test file.
    source: manual
    binds_ac:
      - AC1
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/ci/test_repo_evidence_caller_workflow.py -q --no-cov --tb=line
        cwd: .
  - id: dod-omn19998-integration-proof
    description: Run the contract-binds test and the review prompt-cache tests on a lab host at the pushed head. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-19998 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/ci/test_repo_evidence_caller_workflow.py tests/unit/nodes/node_claude_review_gateway_effect/test_review_prompt_cache_omn22343.py -q --no-cov
        cwd: .
