schema_version: 1.0.0
ticket_id: OMN-19998
title: A scoped RELEASE of a fixer HOLD lifts only the PRs it names, so the landing controller stops dispatching fix workers to the rest of the held repository
summary: fixer_hold_reasons treated every RELEASE carrying re=<hold id> as ending the whole repository HOLD, so a RELEASE scoped to one PR (pr=repo#n) emptied the HOLD and every other red PR in that repository was dispatched fix workers. A RELEASE that names pr= now leaves the HOLD in force and is reported through fixer_hold_released_prs; the landing facts carry it as fixer_hold_released_prs and the decision lifts the hold for those PRs only.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn19998-scoped-release
    statement: A fixer HOLD stays in force for a repository after a scoped RELEASE, and only the PRs that RELEASE names are dispatched.
    acceptance:
      - id: AC1
        statement: 'AC1: a scoped RELEASE leaves the repository HOLD in force and lifts only its named PRs, while an unscoped RELEASE still ends the HOLD -- falsifier: uv run pytest tests/unit/nodes/node_pr_landing_decision_compute/test_landing_fixer_hold_scoped_release.py -q'
evidence_requirements:
  - kind: tests
    description: The scoped-release tests and the existing landing decision, ledger facts and fill tests run at the pushed head.
    command: uv run pytest tests/unit/nodes/node_pr_landing_decision_compute tests/unit/nodes/node_pr_landing_ledger_facts_compute tests/nodes/node_idle_slot_fill_effect -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn19998-ac1
    description: AC1 runs the scoped-release tests; a red PR in a held repository dispatches nothing while a PR named by a scoped RELEASE dispatches, and the tests are red at the merge base.
    source: manual
    binds_ac:
      - AC1
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/nodes/node_pr_landing_decision_compute/test_landing_fixer_hold_scoped_release.py -q --no-cov --tb=line
        cwd: .
  - id: dod-omn19998-integration-proof
    description: Run the scoped-release tests and the landing decision and ledger facts suites on a lab host at the pushed head. A scoped RELEASE leaves the repository HOLD in force, so the scoped-release tests are red at the merge base. The hosted verifier cannot dispatch lab work, so this unbound check belongs to the local Done gate.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-19998 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/nodes/node_pr_landing_decision_compute tests/unit/nodes/node_pr_landing_ledger_facts_compute -q --no-cov
        cwd: .
