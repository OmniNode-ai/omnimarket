schema_version: 1.0.0
ticket_id: OMN-22712
title: The additive dispatch-venv reconcile pass updates only the moved packages in place with an atomic install and rollback
summary: A new omnimarket effect node installs only the packages whose locked version (or source commit) moved into a staging directory, exchanges each package's units with the live venv in place, journals every step, and restores every exchanged unit from the journal when the pass fails.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-additive-venv-in-place
  statement: The additive pass touches only the packages that moved and leaves the live venv's file listing unchanged when it fails.
  acceptance:
  - id: AC1
    statement: 'AC1: the additive pass installs only the packages whose locked version moved, into a staging directory, and exchanges each package directory in place -- falsifier: uv run pytest -q on the new node''s unit test with a fixture venv of three packages of which one moved, red on main'
  - id: AC2
    statement: 'AC2: an install failure part-way restores every exchanged package from the journal and leaves the live venv''s file listing identical to the one before the pass -- falsifier: uv run pytest -q on the node''s error-chain test with an injected failure after the first exchange'
  - id: AC3
    statement: 'AC3: on a copy of a venv of about 37,000 files one pass makes at most 40,000 file events, against the recorded 121,929 before -- falsifier: strace -f -c on the pass over the copy on a lab host, read next to the recorded before figure'
  - id: AC4
    statement: 'AC4: the canonical-file-shape ratchet passes with no baseline entry raised -- falsifier: uv run pytest -q tests for the canonical-file-shape ratchet in omnibase_infra'
evidence_requirements:
- kind: tests
  description: Venv atomic install node tests.
  command: uv run pytest tests/nodes/node_venv_atomic_install_effect -q --no-cov --tb=line
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn22712-ac1
  description: AC1 bound to the fixture-venv unit test.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_venv_atomic_install_effect -q --no-cov --tb=line -k "ac1 or shared_namespace or nothing_moved or git_sourced"
    cwd: ${OMNI_HOME}/omnimarket
- id: dod-omn22712-ac2
  description: AC2 bound to the error-chain tests with the injected failure after the first exchange.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_venv_atomic_install_effect -q --no-cov --tb=line -k "ac2 or error_chain or readback or installer_failure or dead_pass"
    cwd: ${OMNI_HOME}/omnimarket
- id: dod-omn22712-ac3
  description: AC3 bound to the recorded strace reading of one pass over a copy of the dispatch venv on h202.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_venv_atomic_install_effect/test_measured_event_budget.py -q --no-cov --tb=line -k "not ac4"
    cwd: ${OMNI_HOME}/omnimarket
- id: dod-omn22712-ac4
  description: AC4 bound to this repository's canonical-file-shape ratchet test and to the node-shape test; the ratchet baseline is not touched.
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/ci/test_canonical_file_shape_burndown_omn21524.py -q --no-cov --tb=line
    cwd: ${OMNI_HOME}/omnimarket
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_venv_atomic_install_effect/test_measured_event_budget.py -q --no-cov --tb=line -k ac4
    cwd: ${OMNI_HOME}/omnimarket
- id: dod-omn22712-integration-proof
  description: The node's tests run on a lab host at the pushed head through the lab-work node.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-22712 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_venv_atomic_install_effect -q --no-cov
    cwd: .
