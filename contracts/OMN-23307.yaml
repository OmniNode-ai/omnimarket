title: The agent-prompt gh-read refusal runs as a node that pre_tool_use_agent_model_guard.sh calls
summary: node_agent_prompt_gh_read_guard_effect judges an Agent or Workflow dispatch with the lane-text gh-read scan and refuses a prompt that tells a subagent to read GitHub through gh, naming the onex scm verb that answers it; a prompt using the mirror verb is admitted. The omniclaude PreToolUse agent model guard hook calls it through its process entry and stays a thin shim.
