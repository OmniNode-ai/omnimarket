schema_version: 1.0.0
ticket_id: OMN-23964
title: Make the rerun-request command's topics exist on the development broker
summary: The request topic of onex scm rerun-request is declared in the landing tick contract only as a consumed event, so boot provisioning never creates it. The request flow's decision node now lists it in its event_bus publish topics, where boot provisioning reads it, and a test fails when a topic of the rerun_request section is in no boot provisioning set.
is_seam_ticket: true
interface_change: true
interfaces_touched:
- topics
requirements:
- id: req-omn23964-rerun-request-topics
  statement: Every topic the rerun-request command publishes to or waits on is in the set boot provisioning creates for the loaded contracts.
  acceptance:
  - id: AC1
    statement: "AC1: every topic the rerun-request command publishes to or waits on is declared in the landing tick contract's rerun_request section and is in the boot provisioning set of the two rerun nodes -- falsifier: uv run pytest tests/nodes/node_pr_landing_tick_orchestrator/test_rerun_request_topics_provisioned.py -q -p no:randomly --no-cov fails at the merge base for the command topic"
  - id: AC2
    statement: "AC2: the command topics declared only as consumed or externally produced are named in the test so a new one is a visible decision -- falsifier: the same test, test_consumed_only_command_topics_are_named, fails when a consumed-only command topic is added to a contract without being named"
  - id: AC3
    statement: "AC3: integrated: after the development runtime rebuilds from the merge, the three rerun topics exist on the development broker and onex scm rerun-request gets an answer or a typed refusal instead of a topic-not-found error -- falsifier: the dev-lane topic probe reads the three topics missing before and present after"
evidence_requirements:
- kind: tests
  description: The rerun request topic seam test and the tick orchestrator topic tests pass at the pushed head.
  command: uv run pytest tests/nodes/node_pr_landing_tick_orchestrator/test_rerun_request_topics_provisioned.py tests/nodes/node_pr_landing_tick_orchestrator/test_tick_facts_topic_provisioned.py tests/nodes/node_pr_landing_tick_orchestrator/test_tick_compared_grants_seam.py -q -p no:randomly --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23964-ac1
  description: 'AC1: the provisioning test passes at the head and its command topic case fails at the merge base.'
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_pr_landing_tick_orchestrator/test_rerun_request_topics_provisioned.py -q -p no:randomly --no-cov
    cwd: .
- id: dod-omn23964-ac2
  description: 'AC2: the named-list test passes at the head and fails at the merge base.'
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_pr_landing_tick_orchestrator/test_rerun_request_topics_provisioned.py -q -p no:randomly --no-cov -k consumed_only
    cwd: .
- id: dod-omn23964-ac3
  description: 'hosted proxy for AC3: the seam tests that stand in for the broker pass here; the dev-lane topic probe readings before and after are posted as a pull request comment naming the head.'
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_pr_landing_tick_orchestrator/test_rerun_request_topics_provisioned.py tests/nodes/node_pr_landing_tick_orchestrator/test_tick_facts_topic_provisioned.py -q -p no:randomly --no-cov
    cwd: .
- id: dod-omn23964-integration-proof
  description: the rerun request topic tests run on a lab host at the pushed head, including the command topic case that fails at the merge base; hosted CI cannot reach the lab, so only the local Done gate runs this unbound check
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23964 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_pr_landing_tick_orchestrator/test_rerun_request_topics_provisioned.py -q --no-cov -p no:randomly
