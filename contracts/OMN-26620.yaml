requirements:
- id: req-omn26620-tui-refresh
  statement: "The onex TUI header, task cards, footer, themes, icons and status seeding are driven by tui_design.yaml with no new literal in code."
  acceptance:
  - id: AC2
    statement: 'AC2: the start screen header is at most four lines and the full tips show only on the first launch; Falsifier: tests/unit/nodes/node_onex_setup_effect/test_header.py::test_header_no_taller_than_four_lines'
  - id: AC3
    statement: 'AC3: each delegated task shows as a card with a coloured state bar and one facts line; Falsifier: tests/unit/nodes/node_onex_setup_effect/test_task_card.py::test_task_card_renders'
  - id: AC4
    statement: 'AC4: the footer lists every key at 140 columns and does not wrap at 80; Falsifier: tests/unit/nodes/node_onex_setup_effect/test_footer.py::test_footer_all_keys_at_140'
  - id: AC5
    statement: 'AC5: /theme applies the chosen theme and it is restored on restart; Falsifier: tests/unit/nodes/node_onex_setup_effect/test_theme.py::test_theme_applies'
  - id: AC6
    statement: 'AC6: Nerd Font icons appear only when switched on and every icon has a plain fallback; Falsifier: tests/unit/nodes/node_onex_setup_effect/test_icons.py::test_every_icon_has_fallback'
  - id: AC7
    statement: 'AC7: the status bar shows the last known state at once while a slow reader runs; Falsifier: tests/unit/nodes/node_onex_setup_effect/test_status_seeded.py::test_status_seeded_from_last_known'
  - id: AC8
    statement: 'AC8: no new colour, word or glyph is written in code, with a planted-word positive control; Falsifier: tests/unit/nodes/node_onex_setup_effect/test_literal_scan.py::test_literal_scan_positive_control'
