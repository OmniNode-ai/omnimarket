- id: dod-omn26620-integration-proof
  description: The headless TUI tests for the seven criteria run on a lab host at the pushed head, against the real onex command tree. Hosted CI cannot reach the lab runner, so only the local Done gate runs this unbound item.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-26620 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/nodes/node_onex_setup_effect/test_header.py tests/unit/nodes/node_onex_setup_effect/test_task_card.py tests/unit/nodes/node_onex_setup_effect/test_footer.py tests/unit/nodes/node_onex_setup_effect/test_theme.py tests/unit/nodes/node_onex_setup_effect/test_icons.py tests/unit/nodes/node_onex_setup_effect/test_status_seeded.py tests/unit/nodes/node_onex_setup_effect/test_literal_scan.py tests/unit/nodes/node_onex_setup_effect/test_theme_live_colours.py tests/unit/nodes/node_onex_setup_effect/test_theme_store_honest.py tests/unit/nodes/node_onex_setup_effect/test_icons_mode_only.py tests/unit/nodes/node_onex_setup_effect/test_late_reads.py tests/unit/nodes/node_onex_setup_effect/test_literal_scan_wide.py -q -n 0 --no-cov -p no:cacheprovider
