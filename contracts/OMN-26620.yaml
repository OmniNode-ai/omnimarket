- kind: tests
  description: The twelve OMN-26620 test files pass.
  command: uv run pytest tests/unit/nodes/node_onex_setup_effect/test_header.py tests/unit/nodes/node_onex_setup_effect/test_task_card.py tests/unit/nodes/node_onex_setup_effect/test_footer.py tests/unit/nodes/node_onex_setup_effect/test_theme.py tests/unit/nodes/node_onex_setup_effect/test_icons.py tests/unit/nodes/node_onex_setup_effect/test_status_seeded.py tests/unit/nodes/node_onex_setup_effect/test_literal_scan.py tests/unit/nodes/node_onex_setup_effect/test_theme_live_colours.py tests/unit/nodes/node_onex_setup_effect/test_theme_store_honest.py tests/unit/nodes/node_onex_setup_effect/test_icons_mode_only.py tests/unit/nodes/node_onex_setup_effect/test_late_reads.py tests/unit/nodes/node_onex_setup_effect/test_literal_scan_wide.py -q -n 0 --no-cov -p no:cacheprovider
