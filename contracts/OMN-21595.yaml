  statement: 'an AST check over `src/omnimarket/nodes/node_llm_delegation_call_effect` and `src/omnimarket/nodes/node_delegation_orchestrator` finds no executable `os.environ`, `os.getenv` or `os.environ.get` access (a docstring or comment mention does not count, so the ratchet is a test over the syntax tree and not a text search) -- falsifier: an access found.'
  acceptance:
  - id: AC1
    statement: 'AC1: an AST check over `src/omnimarket/nodes/node_llm_delegation_call_effect` and `src/omnimarket/nodes/node_delegation_orchestrator` finds no executable `os.environ`, `os.getenv` or `os.environ.get` access (a docstring or comment mention does not count, so the ratchet is a test over the syntax tree and not a text search) -- falsifier: an access found.'
- id: req-omn21595-ac2
  statement: 'The same handler tests pass with an overlay binding in-memory dependencies and with one binding the durable ones, with no source difference -- falsifier: a test that branches on the binding.'
