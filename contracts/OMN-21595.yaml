ticket_id: OMN-21595
title: 'Contract hot loading A7: Handler dependencies are declared in contracts and bound by overlay through dependency injection (omnimarket half)'
summary: node_llm_delegation_call_effect declares its handler dependencies in its contract, the lane overlay binds them, its handlers receive them through the container, and neither node reads os.environ.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
