    statement: 'AC3: A contract with a dependency the overlay does not bind is refused `DEPENDENCY_UNBOUND` before any subscription -- falsifier: a subscription exists.'
- id: req-omn21595-ac4
  statement: 'The announcer''s bus, the catalog''s store, the lazy-start budget and the reaper''s interval are each read from the overlay and from nowhere else -- falsifier: a constant in code that a test changes by overlay and the behaviour does not follow. Covered here: the four settings as the overlay file carries them; the announcer, catalog and reaper consumers wait on their own changes.'
  acceptance:
  - id: AC4
    statement: 'AC4: The announcer''s bus, the catalog''s store, the lazy-start budget and the reaper''s interval are each read from the overlay and from nowhere else -- falsifier: a constant in code that a test changes by overlay and the behaviour does not follow. Covered here: the four settings as the overlay file carries them; the announcer, catalog and reaper consumers wait on their own changes.'
