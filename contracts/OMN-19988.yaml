schema_version: "1.0.0"
ticket_id: "OMN-19988"
title: "The local environment's verdicts, alerts and per-service rows, and the migrations that store them"
summary: "First of two omnimarket steps. This change adds the shared environment report and health types, the pure local alert compute with its three rules and freshness deadline declared in its contract, the store-neutral write of one report and the verdicts it moves (applied to the local SQLite store), and the three local_environment migrations with the declaration of who owns the table. The projection node's contract, its Postgres writer and the local-environment.v1 exposure follow after an omnibase_infra release grants the table, as OMN-19987 landed. What this step proves is the fold and compute half of AC1, and the table's tenant isolation on a real Postgres. AC2 and AC3 are lab page reads, declared and bound by the change that lands the producers and the panel."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-omn19988-verdicts-and-alerts-from-environment-reports"
    statement: |-
      Each local service's latest report is stored once per tenant, mode and service, with the verdict (RUNNING, DOWN, UNHEALTHY or STALE) and the open alert the pure local alert compute gives it under the rules its contract declares; a report of any service re-judges its tenant's other services at that time, and a replayed or late report changes no row. The criteria below are transcribed from the ticket body.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: In mode 2 stopping one compose service turns its row `DOWN` and opens one `SERVICE_DOWN` alert with nobody running a status command; a failing health check turns `UNHEALTHY`; losing the observer or broker turns every row `STALE` after the deadline; a replay of the same health events changes no row -- falsifier: the omnimarket test run with uv run pytest fails any case
      - id: "AC3"
        statement: |-
          AC3: A mode 1 install shows mode `native` and its versions with no compose rows -- falsifier: the lab step's page read
evidence_requirements:
  - kind: "tests"
    description: "The compute and the store-neutral write give DOWN with one SERVICE_DOWN alert for a stopped service, UNHEALTHY for a failing health check, STALE after the deadline and not before, and no change on a replayed or late report, through the real SQLite adapter; they cannot be collected at the merge base, where the modules do not exist."
    command: "uv run pytest tests/test_omn19988_local_environment.py -q"
  - kind: "tests"
    description: "The migration proof passes at the head against a real Postgres and fails at the merge base, where the migration files do not exist."
    command: "uv run pytest tests/test_omn19988_local_environment_migrations_real_postgres.py -q --refuse-skips"
  - kind: "tests"
    description: "Ownership half only; the cursor sequence is declared once, with its domain and owner."
    command: "uv run pytest tests/test_omn19988_local_environment_cursor_ownership_declared.py -q"
  - kind: "tests"
    description: "Mode 1: a dashboard start writes one native row carrying the installed versions and no compose rows, through the store-neutral write on a real SQLite store; the handler and the test do not exist at the merge base."
    command: "uv run pytest tests/test_omn19988_native_environment_report.py -q"
  - kind: "tests"
    description: "Mode 2: the compose observer probes the catalog's services on its contract-declared interval and publishes local-environment-status.v1 reports, one per service, with a real HTTP and TCP prober against a closed port; the writer stores them, opens one SERVICE_DOWN alert for a stopped service, turns a silent sibling STALE after the deadline, and writes nothing on a replay or an older report."
    command: "uv run pytest tests/test_golden_chain_local_environment_observe_effect.py tests/test_omn19988_local_environment_writer.py -q"
  - kind: "tests"
    description: "The writer on a real Postgres: types, replay, late and stale siblings under the tenant setting."
    command: "uv run pytest tests/test_omn19988_local_environment_writer_real_postgres.py -q --refuse-skips"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn19988-ac1-verdicts-alerts-and-replay"
    description: "The fold and compute half of AC1. Five services boot RUNNING through the store-neutral write on a local SQLite store; one reported down turns DOWN with exactly one SERVICE_DOWN alert, critical, since the report; one reported unhealthy turns UNHEALTHY with SERVICE_DEGRADED; with one service reporting 75 s later every silent row turns STALE with HEALTH_UNKNOWN, and a row is RUNNING at 60 s and STALE at 61 s; replaying every report, and a late older report, leave the whole table byte for byte. The rules and the 60 s deadline are read from the compute's contract, and each rule has a fixture that raises it and one that does not. The case where nothing reports at all (the observer or the broker is gone) cannot write a row; it is served as stale by the exposure's freshness, which lands with the node and is bound then."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/test_omn19988_local_environment.py -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC1"]
  - id: "dod-omn19988-table-tenant-isolation"
    description: "On a real Postgres the create and FORCE migrations apply twice; the key is (tenant_id, mode, service); row-level security is enabled and forced under the single tenant_isolation policy; the table refuses an unknown mode, state, verdict or severity, an empty service, and an alert missing its code, severity or start, with two accepted rows as the control; the Postgres table and the local SQLite store carry the same 21 columns; a session bound to one tenant writes its own row, is refused and cannot rewrite another tenant's, and reads only its own; a session with no tenant set reads none and is refused every insert. Run with --refuse-skips, so it cannot pass where no database is provisioned."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/test_omn19988_local_environment_migrations_real_postgres.py -q --refuse-skips"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn19988-ac1-cursor-sequence-ownership"
    description: "Ownership half only. The cursor sequence is declared exactly once, in the tenant domain, owned by the projection migration runner. It does not prove the verdicts, the store or the panel."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/test_omn19988_local_environment_cursor_ownership_declared.py -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC1"]
  - id: "dod-omn19988-ac3-native-row-store-half"
    description: "The store half of AC3, mode 1. A start of the dashboard through HandlerLocalDashboardServe writes exactly one native row and no compose rows, carrying the installed versions and the store, over a real local SQLite store; an install with no tenant gets no row. It does not prove the page read on a lab host, which is AC3's own falsifier."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/test_omn19988_native_environment_report.py -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC3"]
  - id: "dod-omn19988-ac1-mode2-observer-and-writer"
    description: "The mode 2 half of AC1, with nobody running a status command. The compose observer, driven by its contract-declared runtime interval, probes each catalog service over HTTP or TCP and publishes one local-environment-status.v1 report per service (a closed port reads down); with no canonical tenant it probes nothing. The writer stores each report under its tenant, opens exactly one SERVICE_DOWN alert in the stored row for a stopped service, turns a silent sibling STALE after the deadline and publishes both, and writes nothing for a replayed or older report. Neither the observer nor the writer exists at the merge base, so these tests fail there. A stopped service on a lab host read on the page is AC2's own falsifier, not this check."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/test_golden_chain_local_environment_observe_effect.py tests/test_omn19988_local_environment_writer.py -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC1"]
  - id: "dod-omn19988-ac1-writer-real-postgres"
    description: "The writer on a real Postgres under the tenant setting: stored types, a replay that changes no row, a late older report that writes nothing, and silent siblings turned STALE. Run with --refuse-skips, so it cannot pass where no database is provisioned; absent at the merge base."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/test_omn19988_local_environment_writer_real_postgres.py -q --refuse-skips"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC1"]
  - id: "dod-omn19988-environment-writer-deploy-probe"
    description: "Deploy probe. The local environment writer GitHub serves at the checked-out commit exists; the probe reads handler_local_environment_writer.py from GitHub at that commit and exits nonzero on a tree without its writer class (the file is absent at the merge base), so it fails there."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: "gh api \"repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_projection_local_environment/handlers/handler_local_environment_writer.py?ref=$(git rev-parse HEAD)\" --jq .content | base64 -d | grep -c 'class LocalEnvironmentProjectionWriter' | grep -qv '^0$'"
