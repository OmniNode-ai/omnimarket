schema_version: 1.0.0
ticket_id: OMN-24906
title: 'Review findings 1 to 9 on omnimarket PR 6333 at head 4703534352e4 are fixed or argued: the fill order is tested, a failed pool read refuses and raises the alarm, and the scheduled alarm effect writes a row'
summary: 'One writer lane fixes the review findings of the floor fill live pool seam and alarm rule pull request: a failed host pool read refuses, IDLE reads an independent pool, the alarm check effect writes the row, the measured-cause test is built from the recorded floor, and the contract checks of the parent ticket are tightened.'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24906-review-findings
  statement: The review findings on the floor fill live pool seam and alarm rule are fixed or argued with evidence.
  acceptance:
  - id: AC1
    statement: 'AC1: the three-tier fill order is implemented and a test whose name matches fill_order selects and passes, or AC2 of OMN-24873 is moved to another ticket in a PR comment -- falsifier: `uv run --frozen pytest src/omnimarket/nodes/node_floor_fill_orchestrator/tests -k fill_order -q` collects zero tests or fails at the new head'
  - id: AC2
    statement: 'AC2: a failed host pool read refuses with `pool-unread:pool-snapshot:...` and is distinct from zero free slots, IDLE takes free slots from an independent pool read and alarms on an unread pool, and tests cover both with an OK exit code asserted -- falsifier: `uv run --frozen pytest src/omnimarket/nodes -k "floor_fill_alarm or measured_cause_sends" -q` passes with the unread-pool refusal removed'
  - id: AC3
    statement: 'AC3: a scheduled effect reads the runs and the ledger and writes the alarm row, with a test on the written row, and the boundary tests fire at free 6 and 6 and stay quiet at 5 and 6 -- falsifier: `uv run --frozen pytest src/omnimarket/nodes -k floor_fill_alarm -q` passes with the threshold changed to greater than threshold plus one'
  - id: AC4
    statement: 'AC4: the measured-cause test is built from the recorded floor with the live seams bound or AC3 of OMN-24873 narrowed, an away host with free slots does not fill, lane_slots and free_slots differ, and a non-claude engine is exercised -- falsifier: `uv run --frozen pytest src/omnimarket/nodes/node_floor_fill_orchestrator/tests -k measured_cause_sends -q` passes with the refusal filter and the pool_engine read removed'
  - id: AC5
    statement: 'AC5: the contract checks of the PR bind their acceptance criteria (AC1 more than one word, AC5 sending runs, CLAIM rows, the alarm run and installed=, AC6 `Lab: head=` and no handoff row), and a PR comment starting `Lab: head=<full new head sha>` names the sha, the command and exit 0 with every required check-run of omnimarket#6333 success at the new head -- falsifier: `onex scm pr-checks OmniNode-ai/omnimarket#6333` lists a required context that is not success at the new head, or the Lab comment lacks the full sha, the command or exit 0'
  - id: AC6
    statement: 'AC6: non-blocking findings 10 to 12 are fixed or argued in a PR comment (the four new required settings keys against the deployed overlays, the positional arguments to the stamped snapshot pool, the claim_at and sent_at order, the minutes wording and the pyproject entry point) -- falsifier: `uv run --frozen pytest src/omnimarket/nodes -k floor_fill_alarm -q` passes with the claim_at before sent_at case removed'
evidence_requirements:
- kind: tests
  description: The alarm rule, alarm check and measured-cause tests.
  command: uv run --frozen pytest src/omnimarket/nodes/node_floor_fill_orchestrator/tests/test_floor_fill_measured_cause_sends.py src/omnimarket/nodes/node_floor_fill_alarm_compute/tests src/omnimarket/nodes/node_floor_fill_alarm_effect/tests -q
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24906-ac1
  description: 'The three-tier fill order: not implemented in the reviewed PR; this check fails (collects zero tests) until the order lands or AC2 of the parent ticket is moved.'
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest src/omnimarket/nodes/node_floor_fill_orchestrator/tests -k fill_order -q
    cwd: .
- id: dod-omn24906-ac2
  description: A failed host pool read refuses as pool-unread:pool-snapshot, IDLE takes its slots from an independent pool read, an unread pool alarms, with the OK or DEGRADED exit code asserted.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest src/omnimarket/nodes -k "floor_fill_alarm or measured_cause_sends" -q
    cwd: .
- id: dod-omn24906-ac3
  description: The alarm rule boundary (fires at 6 and 6, quiet at 5 and 6) and the alarm check effect writing the STATUS row.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest src/omnimarket/nodes -k floor_fill_alarm -q
    cwd: .
- id: dod-omn24906-ac4
  description: 'The measured-cause test on the recorded floor: an away host with slots does not fill, lane slots differ from the cap, a non-claude engine is exercised.'
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest src/omnimarket/nodes/node_floor_fill_orchestrator/tests -k measured_cause_sends -q
    cwd: .
- id: dod-omn24906-ac5
  description: 'The pull request''s Lab: head= comment and its required check-runs are read from the watcher state by the local Done gate.'
  source: manual
  execution_scope: local_done_gate
  binds_ac:
  - AC5
  checks:
  - check_type: command
    check_value: onex scm pr-checks OmniNode-ai/omnimarket#6333 | grep -q success
- id: dod-omn24906-ac6
  description: The claim_at before sent_at case, the minutes wording and the dedupe key, each tested in the alarm rule tests.
  source: manual
  binds_ac:
  - AC6
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest src/omnimarket/nodes -k floor_fill_alarm -q
    cwd: .
- id: dod-omn24906-integration-proof
  description: 'Hosted CI cannot reach a lab host, so only the local Done gate runs this unbound check: the alarm rule, alarm check and measured-cause tests run on a lab host at the sha.'
  source: manual
  execution_scope: local_done_gate
  binds_ac:
  - AC2
  checks:
  - check_type: command
    check_value: onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24906 --kind test -- uv run --frozen pytest src/omnimarket/nodes -k "floor_fill_alarm or measured_cause_sends" -q
