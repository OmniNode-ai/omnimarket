---
schema_version: "1.0.0"
ticket_id: "OMN-20890"
title: "The landing decision parks a shared red cause with a default ladder and asks the operator only for a decision, approval or credential"
summary: "node_pr_landing_decision_compute gives a cause whose two attempts failed one more attempt by the opus engine with a diagnosis brief, then parks it with one ticket carrying the attempts and no operator question, retries it when its repo's base head changes, and asks the operator once only when a worker returns a decision, approval or credential blocker."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-omn20890-default-ladder"
    statement: |-
      A spent shared cause follows a default ladder that never asks the operator: one opus diagnosis attempt, a ticket, a park, a retry on the base head moving.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: a cause that fails two attempts is dispatched once more with the opus model and a diagnosis brief, and no operator MSG is written before that attempt -- falsifier: uv run pytest tests/unit/nodes/node_pr_landing_decision_compute -k park_default_third_attempt (omnimarket)
      - id: "AC2"
        statement: |-
          AC2: a third failure files one ticket carrying the attempts and leaves the cause parked with zero MSG rows to the operator -- falsifier: uv run pytest tests/unit/nodes/node_pr_landing_decision_compute -k park_default_files_ticket (omnimarket)
      - id: "AC3"
        statement: |-
          AC3: a parked cause is re-dispatched on the tick after the base head sha changes and not before -- falsifier: uv run pytest tests/unit/nodes/node_pr_landing_decision_compute -k park_retry_on_base_head (omnimarket)
  - id: "req-omn20890-operator-only-needs"
    statement: |-
      The operator is asked once, and only for what only the operator can give.
    acceptance:
      - id: "AC4"
        statement: |-
          AC4: a cause whose blocker is classed as needing a decision, approval or credential still produces exactly one operator question -- falsifier: uv run pytest tests/unit/nodes/node_pr_landing_decision_compute -k park_operator_only_needs (omnimarket)
  - id: "req-omn20890-wired"
    statement: |-
      The park-ladder tests run in the pre-commit hook and in the required lint job, so the ruling cannot regress unseen.
    acceptance:
      - id: "AC5"
        statement: |-
          AC5: the landing-decision-park-ladder pre-commit hook and the Landing decision park ladder step of the ci.yml lint job both run the park-ladder test file -- falsifier: uv run pre-commit run landing-decision-park-ladder --all-files (omnimarket)
      - id: "AC6"
        statement: |-
          AC6: the park-ladder tests fail when a parked cause is no longer retried on the base head moving -- falsifier: make _base_moved return False in a scratch copy and run the park-ladder test file (omnimarket)
evidence_requirements:
  - kind: "tests"
    description: "AC1 to AC4: the park-ladder tests of the landing decision node."
    command: "uv run pytest tests/unit/nodes/node_pr_landing_decision_compute/test_landing_decision_causes.py -q -k 'park_default or park_retry or park_operator'"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn20890-ac1-third-attempt"
    description: "AC1: after two failed attempts the cause is dispatched once more with the opus engine and a diagnosis brief carrying the earlier attempts, with no operator question and no ticket yet."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/nodes/node_pr_landing_decision_compute/test_landing_decision_causes.py -q -k park_default_third_attempt"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC1"]
  - id: "dod-omn20890-ac2-files-ticket"
    description: "AC2: the third failure files exactly one ticket action carrying the attempts, leaves the cause parked, and emits no operator question over later ticks."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/nodes/node_pr_landing_decision_compute/test_landing_decision_causes.py -q -k park_default_files_ticket"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC2"]
  - id: "dod-omn20890-ac3-retry-on-base-head"
    description: "AC3: a parked cause holds through 48 hours with the base head unchanged and is re-dispatched on the tick the head differs."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/nodes/node_pr_landing_decision_compute/test_landing_decision_causes.py -q -k park_retry_on_base_head"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC3"]
  - id: "dod-omn20890-ac4-operator-only-needs"
    description: "AC4: a decision, approval or credential blocker asks the operator exactly once and files no ticket; every other blocker kind asks nobody."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/nodes/node_pr_landing_decision_compute/test_landing_decision_causes.py -q -k park_operator_only_needs"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC4"]
  - id: "dod-omn20890-ac1-selectors-name-a-file"
    description: "AC1: every pytest check this contract binds names an existing repo test file, so the repo evidence gate and the selector test accept the contract."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_contract_evidence_selector_names_file_omn17427.py -q -p no:randomly -k omn20890_park_ladder_checks_name_the_causes_test_file"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC1"]
  - id: "dod-omn20890-ac5-hook-and-ci-step"
    description: "AC5: regression tests require the pre-commit hook and the required lint step to run the full causes test file, including the retry tests."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/nodes/node_pr_landing_decision_compute/test_landing_decision_causes.py -q -p no:randomly -k park_ladder_wiring"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC5"]
  - id: "dod-omn20890-ac6-negative-control"
    description: "AC6: the wiring tests require both enforcement commands to run the full causes file; the retry tests reject a cause that does not retry when the base head moves. The selector exercises both wiring and retry behavior."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/nodes/node_pr_landing_decision_compute/test_landing_decision_causes.py -q -p no:randomly -k 'park_ladder_wiring or park_retry_on_base_head'"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC6"]
