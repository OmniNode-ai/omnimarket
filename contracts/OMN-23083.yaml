schema_version: 1.0.0
ticket_id: OMN-23083
title: Join J2 passes - rebuild piece 2 (hosts and capacity) integrates with piece 3 (bus, runtime and seams)
summary: The J2 join check (omnimarket#5284, handlers/join_j2.py, runtime verb join-j2) was built and tested and never run, so the served floor held no J2 chain and read the join broken. The publish node's contract gains one input step, join_j2 (module omnimarket.nodes.node_host_reading_effect.runtime_host_reading, args join-j2 on the overlay's bus lane, concurrent with the other input steps, required false, timeout 90 s), so the join runs in every publish cycle before the floor steps read the receipts and writes the canary chain (piece 2) and the seam chain (piece 3) under one correlation id. The join overlay gains an optional host list (empty means every pooled host). No check, bound or window of the receipts is changed.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23083-join-j2-publish-step
  statement: The publish cycle runs join J2 before the floor reads its receipts, a step that exits non-zero is recorded failed without stopping the floor steps, and with the step removed from the contract the focused tests fail.
  acceptance:
  - id: AC1
    statement: 'AC1: the publish cycle calls the join-j2 verb before the floor reads its receipts, and a failing control that removes the step makes the focused tests fail -- falsifier: uv run pytest of the publish step tests, failures without the step'
evidence_requirements:
- kind: tests
  description: The J2 publish-step tests, the publish tests and the cycle bound test, with the failing control that takes the contract without the step.
  command: uv run --frozen pytest tests/nodes/node_factory_floor_publish_effect/test_join_j2_step.py tests/nodes/node_factory_floor_publish_effect/test_factory_floor_publish.py tests/nodes/node_factory_floor_publish_effect/test_cycle_bound.py -q --no-cov
emergency_bypass:
