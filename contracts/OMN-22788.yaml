schema_version: 1.0.0
ticket_id: OMN-22788
title: The landing decision updates the branch of a red pull request whose reds the base already passes
summary: node_pr_landing_decision_compute gains one pull request fact, lacks_base_head, and one tick fact, base_green_checks. A red product-class head that lacks its base's newest head, and whose every red check outside the follower checks is green on that base head, gets one update_branch per head before any rerun or fix worker. Recorded case, web-app#496 at head ba2e445 on 2026-11-06, red on pnpm audit and CI Summary from an advisory dev had fixed; two fix workers wrote nothing_to_fix and the branch was never updated. This pull request is the node; the controller facts builder that fills the two facts is a separate pull request.
