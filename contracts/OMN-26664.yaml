schema_version: 1.0.0
ticket_id: OMN-26664
title: The rows loader reads a since/until history range and process_health reads the ledger through it
summary: >-
  node_ledger_rows_loader_effect gains --since, --until and --kind on its command line (a history
  range at any age the store holds, refused as range-wider-than-store when it starts before the store
  does, never answered from the file). node_process_health_effect reads its ledger rows through that
  range read instead of opening the ledger file and its archive splits.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn26664-history-range-read
    statement: The rows loader answers a since/until range, refuses a range wider than the store, and process_health reads no ledger file.
    acceptance:
      - id: AC1
        statement: >-
          AC1: the rows loader command line takes --since and --until in place of --window-hours and
          refuses a range wider than the store holds with range-wider-than-store -- falsifier: the
          history range tests fail, or a too-wide range prints rows
      - id: AC2
        statement: >-
          AC2: process_health reads its ledger rows and its HOLD and RELEASE rows through the range
          read and opens no ledger file -- falsifier: the process_health tests fail, or
          source_readers.py opens the ledger file
evidence_requirements:
  - kind: tests
    description: The loader range tests, the via-node range tests and the process_health tests pass at the pushed head.
    command: uv run --frozen pytest tests/unit/nodes/node_ledger_rows_loader_effect tests/unit/handlers/test_ledger_rows_via_node_range.py src/omnimarket/nodes/node_process_health_effect/tests tests/unit/nodes/node_work_ledger_reader_effect/test_reader_range_max_pages.py -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn26664-range-tests
    description: The history range tests of the loader and of the via-node read pass.
    source: manual
    binds_ac: [AC1]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/nodes/node_ledger_rows_loader_effect/test_rows_loader_history_range.py tests/unit/handlers/test_ledger_rows_via_node_range.py -q --no-cov -n 0 -p no:randomly
        cwd: .
  - id: dod-omn26664-process-health-tests
    description: The process_health tests pass with the ledger read through the range read.
    source: manual
    binds_ac: [AC2]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest src/omnimarket/nodes/node_process_health_effect/tests tests/unit/nodes/node_work_ledger_reader_effect/test_reader_range_max_pages.py -q --no-cov -n 0 -p no:randomly
        cwd: .
  - id: dod-omn26664-no-ledger-file-open
    description: source_readers.py holds no read of the ledger file.
    source: manual
    binds_ac: [AC2]
    checks:
      - check_type: command
        check_value: "! grep -n 'archive_glob\\|live.is_file\\|path.open' src/omnimarket/nodes/node_process_health_effect/handlers/source_readers.py"
        cwd: .
  - id: dod-omn26664-integration-proof
    description: On a lab host, with the branch checked out at its pushed sha, the history range tests of the rows loader and the process_health tests run. Hosted CI holds no lab host, so only the local Done gate runs this unbound check (the lab reading is in the PR's Lab line).
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-26664-history-range --kind test -- uv run --frozen pytest tests/unit/nodes/node_ledger_rows_loader_effect/test_rows_loader_history_range.py src/omnimarket/nodes/node_process_health_effect/tests tests/unit/nodes/node_work_ledger_reader_effect/test_reader_range_max_pages.py -q --no-cov -n 0 -p no:randomly
        cwd: .
