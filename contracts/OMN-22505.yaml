schema_version: 1.0.0
ticket_id: OMN-22505
title: Wire relay admission and S8 stop authorization
summary: The criteria of omnimarket#5068, moved unchanged from the shared contract of OMN-19998.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn19998-relay-effect
  statement: Operator relays have explicit effects and targets, and S8 repairs unauthorized task stops through typed node seams.
  acceptance:
  - id: AC8
    statement: 'AC8: both ledger boundaries call the core relay_requires evaluator; closeout retains withdrawn and its citation; S8 distinguishes current task, revision, run, lane and unreleased HOLD authority, and an interrupted repair resumes once before the durable cursor advances -- falsifier: uv run --frozen pytest tests/test_golden_chain_relay_effect.py -k relay_effect -q'
- id: req-omn19998-relay-dependency-security
  statement: The relay runtime resolves dependencies outside the Mako and multidict advisory ranges reported by Dependency Security Scan.
  acceptance:
  - id: AC13
    statement: 'AC13: the lock pins Mako above 1.4.1 and multidict above 6.9.0, and the packaged relay compute contracts still dispatch through RuntimeLocal. -- falsifier: uv run --frozen pytest tests/test_omn19998_lock_dependency_floors.py -q --no-cov'
- id: req-omn19998-node-wiring-budget
  statement: Every discovered node is checked through the real runtime within the per-test wiring budget.
  acceptance:
  - id: AC14
    statement: 'AC14: every discovered contract is included exactly once in bounded wiring batches; failed or quarantined handlers and stale baseline entries are still refused, with the same real topology, container and in-memory bus -- falsifier: uv run --frozen pytest tests/unit/contracts/test_every_node_auto_wires_in_process_omn17427.py -q --no-cov --timeout=300 --timeout-method=thread'
evidence_requirements:
- kind: tests
  description: Wire relay admission and S8 stop authorization
  command: uv run --frozen pytest tests/test_omn19998_lock_dependency_floors.py -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn19998-relay-dependency-security
  description: Read every Mako and multidict lock entry and refuse pins in the affected ranges from SFTY-20261005-32026 and SFTY-20261005-09094. Missing lock entries also fail. The same run dispatches the packaged relay compute contracts through RuntimeLocal, so the check fails on a tree without the relay nodes.
  source: manual
  binds_ac:
  - AC13
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/test_omn19998_lock_dependency_floors.py tests/test_golden_chain_relay_effect.py -k "lock_pins_package_above_advisory_floor or packaged_node_runtime" -q --no-cov
    cwd: .
- id: dod-omn19998-relay-dependency-security-deploy
  description: Hosted runtime smoke dispatches the packaged relay compute contracts through RuntimeLocal with the updated dependency lock. It needs no broker or live lane.
  source: manual
  binds_ac:
  - AC13
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/test_golden_chain_relay_effect.py -k packaged_node_runtime -q --no-cov
    cwd: .
- id: dod-omn19998-relay-terminal-routing-deploy
  description: Hosted runtime smoke dispatches the packaged compute nodes and checks the S8 success and failure terminal topics through the runtime's contract reader. The effect regression uses the node's public bus writer adapter for durable repair and cursor recovery. No live lane or installed durable tick is asserted.
  source: manual
  binds_ac:
  - AC8
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/test_golden_chain_relay_effect.py -k "packaged_node_runtime or runtime_terminal_routes or bus_refusals_and_durable_repair_cursor" -q --no-cov
    cwd: .
- id: dod-omn19998-relay-effect
  description: Focused node and bus fixtures exercise admission, closeout serialization, authorization scope and crash recovery on an in-memory bus and an isolated Redpanda broker. The core evaluator is a typed contract double until the core companion installs; recorded-break replay and durable-tick installation are separate outstanding evidence.
  source: manual
  binds_ac:
  - AC8
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/test_golden_chain_relay_effect.py -k relay_effect -m "not kafka" -q --no-cov
    cwd: .
- id: dod-omn19998-relay-effect-runtime
  description: Hosted package smoke dispatches the compute contracts through RuntimeLocal and checks serialized withdrawn-by and cursor data. This does not assert an installed durable tick or the runner forwarding companion.
  source: manual
  binds_ac:
  - AC8
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/test_golden_chain_relay_effect.py -k packaged_node_runtime -q --no-cov
    cwd: .
- id: dod-omn19998-node-wiring-budget
  description: Run every discovered contract through real infra wiring in bounded batches under the unchanged 300-second per-test timeout. Preserve resolution failure, quarantine and shrink-only baseline assertions. A batching test requires every discovered contract in exactly one batch, including the two relay nodes of this change, so it fails on a tree without them. This makes no deployment claim.
  source: manual
  binds_ac:
  - AC14
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/contracts/test_every_node_auto_wires_in_process_omn17427.py -q --no-cov --timeout=300 --timeout-method=thread
    cwd: .
- id: dod-omn22505-integration-proof
  description: Run this pull request's own check on a lab host at the pushed head. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-22505 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/test_omn19998_lock_dependency_floors.py -q --no-cov
    cwd: .
