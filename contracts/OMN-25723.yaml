schema_version: 1.0.0
ticket_id: OMN-25723
title: The push-time contract check refuses a runtime change whose contract holds no probe the hosted deploy gate accepts
summary: >-
  The required check deploy-gate / deploy-gate is red the same way on omnimarket pull requests
  6317, 6345, 6374 and 6403. Each touches runtime paths and its own contracts/OMN-n.yaml holds no
  check the pinned deploy-gate validator accepts as a live-surface probe in command position. Three
  carry `uv run onex lab-work run ...` as their only live probe: the validator reads the command head
  as written and stops at `uv`, while the push-time ticket-contract prerequisite resolved it through
  `uv run`, so the push passed and the hosted check refused. The prerequisite now applies the hosted
  rule to the contract at the push.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn25723-hosted-probe-at-push
    statement: A runtime push whose contract holds no check the hosted deploy gate accepts is refused by the push-time prerequisite, naming why.
    acceptance:
      - id: AC2
        statement: >-
          AC2: one pull request on the default branch of the repository that owns the cause fixes it
          at the source, with a test that fails on the unfixed code and passes on the fix -- falsifier:
          `uv run pytest <the new test path> -q` run at the unfixed base commit passes, or `onex scm
          pr-view` shows no such pull request
      - id: AC3
        statement: >-
          AC3: the fix widens or bypasses no check, so the diff removes no assertion and adds no skip,
          xfail, loosened threshold or changed required-check list -- falsifier: `git diff <base>
          <head> -- tests/ .github/` shows a removed assert, a new skip or xfail marker or a changed
          required-check list
evidence_requirements:
  - kind: tests
    description: The new probe tests and the prerequisite node tests pass at the pushed head; the new through-git refusal test fails at the base.
    command: uv run --frozen pytest tests/nodes/node_ticket_contract_prerequisite_effect -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn25723-ac1-cause
    description: The STATUS row of the lane names the cause and the job ids of the four pull requests. The ledger is on the launching host, so only the local Done gate runs this unbound check.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: >-
          grep -F "lane=cause25-2211" "${ONEX_LEDGER_PATH:?set ONEX_LEDGER_PATH}" | grep -F "STATUS" | grep -F "43808783765" | grep -F "44138392244" | grep -F "44108687191"
        cwd: .
  - id: dod-omn25723-ac2-tests
    description: The hosted-probe tests, including the through-git refusal of a contract whose only probe is `uv run onex`, pass at the head; the refusal test fails with the base handler (red then green in the PR body).
    source: manual
    binds_ac: [AC2]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/nodes/node_ticket_contract_prerequisite_effect/test_deploy_gate_probe_omn25723.py -q --no-cov -n 0 -p no:randomly
        cwd: .
  - id: dod-omn25723-ac3-no-widening
    description: The existing prerequisite suites pass with no assertion removed; two fixtures now write the proof probe as `onex ...` instead of `uv run onex ...`, which the hosted gate refuses.
    source: manual
    binds_ac: [AC3]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/nodes/node_ticket_contract_prerequisite_effect tests/ci/test_ticket_contract_prerequisite_omn20864.py -q --no-cov -n 0 -p no:randomly
        cwd: .
  - id: dod-omn25723-ac4-ready-with-lab-line
    description: The pull request is open, not a draft, and its body carries a Lab line. The pull request read is local, so only the local Done gate runs this unbound check.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: >-
          onex scm pr-view OmniNode-ai/omnimarket --head omn-25723-deploy-gate-uv-run-probe | grep -F '"draft": false'
        cwd: .
  - id: dod-omn25723-deploy
    description: 'Deploy probe the hosted runner can run: the hosted-probe check module exists at the checked-out commit on GitHub and defines check_deploy_gate_probe; it does not exist at the merge base, so the probe fails there.'
    source: manual
    checks:
      - check_type: command
        check_value: >-
          bash -o pipefail -c 'gh api "repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_ticket_contract_prerequisite_effect/handlers/deploy_gate_probe_check.py?ref=$(git rev-parse HEAD)" --jq .content | base64 -d | grep -F "def check_deploy_gate_probe" > /dev/null'
        cwd: .
  - id: dod-omn25723-integration-proof
    description: The pushed head ran the prerequisite node tests on a lab host through the bus and exited 0. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: >-
          onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane cause25-2211 -- uv run --frozen pytest tests/nodes/node_ticket_contract_prerequisite_effect -q --no-cov -n 0 -p no:randomly
        cwd: .
