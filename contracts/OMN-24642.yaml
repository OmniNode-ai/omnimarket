schema_version: 1.0.0
ticket_id: OMN-24642
title: The code graph is read against each repository tip, refreshed through its declared node when stale, and kept fresh by a refresh on merge
summary: The code graph's only refresh was a nightly timer, so a merge waited up to a day to reach it. The node gains a refresh verb and a ten minute timer unit rendered from its contract; the refresh compares each declared repository's head with the heads of the last build and runs the existing writing build only when one moved and the last build is at least fifteen minutes old. The build leaves a marker of its time and heads in the state directory; a failed run or a drill never touches it.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24642-refresh-on-merge
  statement: A merge to a declared repository reaches the code graph through a standing refresh, which builds once per burst of merges and never reports fresh when it cannot read a head.
  acceptance:
  - id: AC1
    statement: 'AC1: the refresh decides fresh, deferred, refreshed or failed from the heads of the last build and the declared repositories, and the build marker is written only by a completed clean run -- falsifier: uv run pytest tests/nodes/node_code_graph_effect/test_code_graph_refresh.py -q -k "fresh or defers or marker" fails when a head comparison, the interval or the marker rule is removed'
  - id: AC2
    statement: 'AC2: the lookup answers which files import a module file from the code graph version of a repository -- falsifier: uv run pytest tests/nodes/node_code_graph_effect/test_code_graph_lookup.py -q -k importers fails when the importers answer drops a file'
  - id: AC3
    statement: 'AC3: the refresh builds when a head moved and does not build when none moved -- falsifier: uv run pytest tests/nodes/node_code_graph_effect -q -k refresh fails when the refresh does not fire for a moved head'
  - id: AC4
    statement: 'AC4: the node renders a refresh unit and a ten minute timer from its contract that run the refresh verb -- falsifier: uv run pytest tests/nodes/node_code_graph_effect/test_code_graph_refresh.py -q -k schedule fails when the unit runs another verb or the cadence changes'
evidence_requirements:
- kind: tests
  description: The refresh, lookup and schedule tests of the code graph node.
  command: env -u PYTHONPATH uv run --frozen pytest tests/nodes/node_code_graph_effect -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24642-ac1-refresh-decision
  description: The refresh decision and the marker rule hold.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_code_graph_effect/test_code_graph_refresh.py -q --no-cov -n 0 -p no:randomly -k "fresh or defers or marker"
    cwd: .
- id: dod-omn24642-ac2-importers
  description: The importers question is answered from the repository's graph version.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_code_graph_effect/test_code_graph_lookup.py -q --no-cov -n 0 -p no:randomly -k importers
    cwd: .
- id: dod-omn24642-ac3-refresh-fires
  description: The refresh fires for a moved head and stays quiet for none.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_code_graph_effect -q --no-cov -n 0 -p no:randomly -k refresh
    cwd: .
- id: dod-omn24642-ac4-unit-renders
  description: The refresh unit and timer render from the contract.
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_code_graph_effect/test_code_graph_refresh.py -q --no-cov -n 0 -p no:randomly -k schedule
    cwd: .
- id: dod-omn24642-integration-proof
  description: Hosted CI cannot reach a lab host, so only the local Done gate runs this unbound check. It runs the refresh verb of the code graph node at the sha on a lab host against the lab clones and a scratch state directory, and fails unless the verb prints its REFRESH line.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24642 --kind test -- sh -c 'ONEX_CODE_GRAPH_STATE_DIR="$(mktemp -d)" uv run --frozen python -m omnimarket.nodes.node_code_graph_effect refresh | grep -q "^REFRESH outcome="'
    cwd: .
