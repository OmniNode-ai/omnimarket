schema_version: 1.0.0
ticket_id: OMN-24642
title: The code graph and the architecture graph are read against each repository tip, refreshed through their declared nodes when stale, and the code graph is kept fresh by a refresh on merge
summary: The code graph's only refresh was a nightly timer, so a merge waited up to a day to reach it. The node gains a refresh verb and a ten minute timer unit rendered from its contract; the refresh compares each declared repository's head with the heads of the last build and runs the existing writing build only when one moved and the last build is at least fifteen minutes old. The build leaves a marker of its time and heads in the state directory only when the ledger holds its row; a probe, a failed run or a drill never touches it. A failed build is recorded as an attempt that defers the next ticks, and one lock in the state directory lets one writing build run at a time. This change fixes neither the unreadable architecture graph (ARCH_GRAPH_BOLT_URI is unbound on lab hosts, owner OMN-14572) nor the missing code graph query path.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24642-refresh-on-merge
  statement: A merge to a declared repository reaches the code graph through a standing refresh, which builds once per burst of merges and never reports fresh when it cannot read a head.
  acceptance:
  - id: AC1
    statement: 'AC1: a STATUS row per graph, code graph and architecture graph, states when the graph was built, from which repository revisions, and whether it is stale -- falsifier: the ledger holds one STATUS row per graph for the lane, and the architecture graph row reads NOT MET (ARCH_GRAPH_BOLT_URI is unbound on lab hosts; the owner is OMN-14572, which this change does not fix) until a reading of it is written'
  - id: AC2
    statement: 'AC2: the query "who imports node_host_table_keys_ingest_effect" is run against the refreshed graph and its answer recorded in the lane report -- falsifier: the same query rerun through the node''s own entry point returns the recorded importers. NOT MET: this change runs no such query (it adds no code graph query path, and the architecture graph is unreadable because ARCH_GRAPH_BOLT_URI is unbound on lab hosts, owner OMN-14572); the local Done gate check dod-omn24642-ac2-query-recorded fails until a lane report records the query and its answer'
  - id: AC3
    statement: 'AC3: a merge to a declared repository reaches the code graph through a standing refresh, a polling timer being allowed in place of a merge subscription; it builds once per burst of merges, never reports fresh when it cannot read a head, writes its built marker only after a build whose row the ledger holds, and defers after a failed attempt and while another build holds the state directory lock -- falsifier: uv run pytest tests/nodes/node_code_graph_effect/test_code_graph_refresh.py -q -k "fresh or defers or marker or tick or failed or unset or readback or attempt or lock" fails when a head comparison, the interval, the attempt record, the lock or the marker rule is removed'
  - id: AC4
    statement: 'AC4: the refresh unit is installed on h053, the schedule host, from the merged code after the pull request merges, and observed running (no branch install is done: a branch install does not outlast the branch) -- falsifier: the local Done gate check dod-omn24642-ac4-installed-unit reads the installed onex-code-graph-refresh unit and a code-graph-refresh log whose last REFRESH line is not outcome=failed and whose last entry is under 30 minutes old, and fails while the unit is installed nowhere or every tick fails'
evidence_requirements:
- kind: tests
  description: The refresh, lookup and schedule tests of the code graph node.
  command: env -u PYTHONPATH uv run --frozen pytest tests/nodes/node_code_graph_effect -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24642-ac1-status-rows
  description: Only the local Done gate runs this unbound check, which reads the ledger. It fails unless a STATUS row for the code graph names OMN-24642 and carries graph_built= (a time), revisions= (a revision) and stale= (true or false). The architecture graph stays NOT MET in AC1 and has no check here until a reading of it exists (owner OMN-14572).
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: |-
      grep -E '[|] STATUS [|].*ticket=OMN-24642 .*graph=code-graph' $OMNI_HOME/docs/tracking/ROLLING_WORK_*.md | grep -E 'graph_built=[0-9]{4}-[0-9]{2}-[0-9]{2}T' | grep -E 'revisions=[^ |]*[0-9a-f]{7}' | grep -Eq 'stale=(true|false)( |$)'
    cwd: .
- id: dod-omn24642-ac2-stated-not-met
  description: AC2 is NOT MET and the contract says so. This hosted check binds the criterion to the test that reads the contract's own statement of it (the ticket's wording and the NOT MET mark); the importers query itself is checked only by the local Done gate item dod-omn24642-ac2-query-recorded.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_code_graph_effect/test_code_graph_refresh.py -q --no-cov -n 0 -p no:randomly -k contract_states
    cwd: .
- id: dod-omn24642-ac2-query-recorded
  description: Only the local Done gate runs this unbound check, which reads the lane report. It fails unless the report records the importers query.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: |-
      grep -q 'Query: who imports' "$OMNI_HOME"/.claude_scratch/reports/graphfresh-2300-*.md
    cwd: .
- id: dod-omn24642-ac1-readback
  description: After a build the refresh result reports built_at and built_heads read back from the rewritten marker, and fails when the marker was not rewritten.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_code_graph_effect/test_code_graph_refresh.py -q --no-cov -n 0 -p no:randomly -k readback
    cwd: .
- id: dod-omn24642-ac3-refresh
  description: The refresh decides fresh, deferred, refreshed or failed from the last build's marker and the heads now, and the marker, attempt and lock rules hold.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_code_graph_effect/test_code_graph_refresh.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24642-ac4-unit-renders
  description: The refresh unit and timer render from the contract and run the refresh verb every ten minutes.
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_code_graph_effect/test_code_graph_refresh.py -q --no-cov -n 0 -p no:randomly -k schedule
    cwd: .
- id: dod-omn24642-ac4-installed-unit
  description: Hosted CI cannot reach the schedule host, so only the local Done gate runs this unbound check. It reads the installed onex-code-graph-refresh unit on h053 and fails unless the unit runs the refresh verb, its log took an entry in the last 30 minutes and the last REFRESH line of that log is outcome=refreshed, fresh or deferred, so Done cannot pass with the unit installed nowhere or with every tick failing. It writes nothing on h053.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-installed-unit-24642 --kind other --host h053 -- sh -c 'grep -q "node_code_graph_effect refresh$" "$HOME/.config/systemd/user/onex-code-graph-refresh.service" && log="$(find /data/omninode -maxdepth 4 -name code-graph-refresh.out.log -mmin -30 | head -n 1)" && [ -n "$log" ] && grep "^REFRESH outcome=" "$log" | tail -n 1 | grep -Eq "^REFRESH outcome=(refreshed|fresh|deferred) "'
    cwd: .
- id: dod-omn24642-integration-proof
  description: Hosted CI cannot reach a lab host, so only the local Done gate runs this unbound check. It runs the refresh verb of the code graph node at the sha on a lab host against the lab clones and a scratch state directory, and fails unless the verb prints a REFRESH line whose outcome is refreshed, fresh or deferred. With the empty scratch state directory the verb runs a writing build, so each run of this check appends one operational code graph row to the ledger; a failed outcome fails the check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24642 --kind test -- sh -c 'ONEX_CODE_GRAPH_STATE_DIR="$(mktemp -d)" uv run --frozen python -m omnimarket.nodes.node_code_graph_effect refresh | grep -Eq "^REFRESH outcome=(refreshed|fresh|deferred) "'
    cwd: .
