schema_version: 1.0.0
ticket_id: OMN-23007
title: Rebuild piece 8 emits its golden and error chain events so the floor can read it end to end
summary: The central test harness node (node_lab_test_harness_effect) emits one chain per run to the floor's emission journal (a start, then a success or a typed failure) and the planted broken input going red as its own drill chain with a typed failure, and writes the same events as ledger STATUS rows for a floor on another host, so piece 8 holds a golden and an error receipt.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23007-piece8-chain
  statement: A harness run that ends as required emits a golden chain and the planted failure's typed error chain for piece 8 (in the floor's emission journal and as ledger rows for a floor on another host), and each injected break ends the run chain in a typed failure code; a harness that drops the emission leaves the floor row at no events yet.
  acceptance:
  - id: AC1
    statement: 'AC1: piece 8 emits its golden event on a successful run and a typed error event on a planted failure, both reach the floor, and the row clears by its own rule, with a failing control that drops the emission -- falsifier: uv run pytest tests/test_chain_events_lab_test_harness.py -q'
evidence_requirements:
- kind: tests
  description: The piece 8 chain event tests, the existing harness tests and the floor read of the row
  command: uv run --frozen pytest tests/test_chain_events_lab_test_harness.py tests/test_golden_chain_lab_test_harness.py tests/test_runtime_lab_test_harness.py -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23007-chain-events
  description: A good harness run emits a golden chain and a planted typed error chain that the floor folds into piece 8 receipts (the row reads golden and error ages instead of no events yet); each injected break ends the run chain in a typed failure; dropping the emission leaves the row at no events yet.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/test_chain_events_lab_test_harness.py -q --no-cov
    cwd: .
- id: dod-omn23007-integration-proof
  description: The branch's harness ran its cases on the lab bus from h053 and wrote piece 8's golden row and the planted failure's typed error row to the work ledger, which read back over the dev bus.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: onex ledger query --query rows --lane central-test-harness --since 2026-11-07T15:00:00Z | grep -Eq 'piece=8 [|] verdict=(WORKING|NOT_WORKING)'
    cwd: .
