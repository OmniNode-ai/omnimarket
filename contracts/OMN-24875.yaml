schema_version: 1.0.0
ticket_id: OMN-24875
title: A corrupt refused file is left out of the outbox drain, each stored-refusal reuse is logged and bounded by age, and the two outbox contracts say what their evidence shows
summary: The review of the outbox reuse pull request found that a refused file holding non-object JSON made every drain raise, that a reuse logged nothing and had no age bound although the append handler reads only the live ledger file, and that two contract lines were inverted or unclear. The lookup now leaves out a file that is not a JSON object, the drain logs one line per reuse, a stored refusal is reused only for six hours after it was written, and the contract lines are corrected.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24875-outbox-reuse-review-fixes
  statement: The outbox reuse path leaves a corrupt refused file out, logs each reuse, is bounded by age, and its two contracts read as the review asked.
  acceptance:
  - id: AC1
    statement: 'AC1: a drain over a refused file holding non-object JSON (a list, null) leaves that request out and the drain returns, with a corrupt-file test red at c91b6efced5e and green at the new head -- falsifier: `uv run pytest tests/ -q -k "outbox and corrupt"` in omnimarket exits non-zero at c91b6efced5e or zero tests are selected'
  - id: AC2
    statement: 'AC2: the reuse path logs one line per reuse, and a test through the wired drain caller shows the bus-binding-outbox-refused occurrence count unchanged on a replay (or the PR comment shows no caller raises one from the refused count) -- falsifier: `uv run pytest tests/ -q -k "outbox and reuse"` in omnimarket exits non-zero at the new head'
  - id: AC3
    statement: 'AC3: the reuse is bounded by age or stored principal, or a test shows the append handler still sees the id after the ledger rolls and the refused folder is not pruned -- falsifier: `uv run pytest tests/ -q -k "outbox and bound"` in omnimarket exits non-zero at the new head'
  - id: AC4
    statement: 'AC4: contracts/OMN-24827.yaml AC1 reads each bound selection exits non-zero at the base with the falsifier exits zero and one -k, and contracts/OMN-24250.yaml says AC2 is a preservation criterion -- falsifier: `uv run pytest tests/ -q -k "contract and (OMN_24827 or OMN_24250 or OMN_24875 or OMN_24921)"` in omnimarket exits non-zero at the new head, or the two contract files differ from the findings text'
  - id: AC5
    statement: 'AC5: the PR carries a comment starting `Lab: head=<new head>` with the suite run on the lab (parts named if split), the required checks read success at the new head, and the TERMINAL names the head -- falsifier: `onex scm pr-checks OmniNode-ai/omnimarket#6052` lists a required context that is not success at the new head'
evidence_requirements:
- kind: tests
  description: The corrupt-file, reuse, bound, window, refused-at and contract-text tests pass at the pushed head; the log, age-bound, window and contract-text tests, and four of the five corrupt-file shapes, fail at c91b6efced5e.
  command: uv run pytest tests/handlers/bus_binding/test_outbox_refused_receipt_reuse.py tests/handlers/bus_binding/test_outbox_contract_text.py -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24875-ac1
  description: 'AC1: five corrupt refused-file shapes (a list, null, a string, a number, broken JSON) leave the request out of the lookup, the request is sent and the drain returns, and a replay through select.replay_outbox survives them and the reporter that reads refused/ (with two object shapes whose refusal is not an object). At c91b6efced5e the list, null, string and number shapes raise AttributeError; broken JSON raises ValueError there, which the lookup caught, so that shape is green at c91b6efced5e and is the positive control.'
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/handlers/bus_binding -q --no-cov -p no:cacheprovider -k "outbox and corrupt"
    cwd: .
- id: dod-omn24875-ac2
  description: 'AC2: each reuse logs one line with the request id; a replay through select.replay_outbox, the caller the CLI runs, emits no second exception-queue row and sends nothing, because that caller reports from the files in refused/ and never from the drain result''s refused count.'
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest -q --no-cov -p no:cacheprovider tests/handlers/bus_binding/test_outbox_refused_receipt_reuse.py::test_outbox_reuse_logs_one_line_per_reuse tests/handlers/bus_binding/test_outbox_refused_receipt_reuse.py::test_outbox_reuse_through_the_wired_caller_raises_no_occurrence
    cwd: .
- id: dod-omn24875-ac3
  description: 'AC3: a stored clash refusal is reused for six hours after it was written (its refused_at cell, else the queue stamp in its file name); past that the replay is sent, and after the ledger rolls the append handler, which reads only the live ledger file, accepts it. A stamp that is unparsable, not a string or after the clock reads as expired. A clash refused again past the window over the same rows is written into the file that already holds it, so a stuck id leaves one refused file and one report and costs one send per window. The refused folder is not pruned by any code, so age is the only bound.'
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/handlers/bus_binding -q --no-cov -p no:cacheprovider -k "outbox and (bound or window or refused_at)"
    cwd: .
- id: dod-omn24875-ac4
  description: 'AC4: the bound-tests contract reads each bound selection exits non-zero at the merge base, with the falsifier exits zero and one -k, and the reuse contract says its AC2 is a preservation criterion; tests read both files, and one test drives the loaded outbox module (a clash refusal is not sent twice), so it fails with the merge-base outbox module loaded, which sends every replay. The selection names all four contract tickets.'
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/handlers/bus_binding -q --no-cov -p no:cacheprovider -k "contract and (OMN_24827 or OMN_24250 or OMN_24875 or OMN_24921)"
    cwd: .
- id: dod-omn24875-ac5
  description: 'AC5, the required checks half: this check is bound to AC5 and can fail. onex scm pr-checks itself exits 0 whatever the head''s state (read at 7c5d0b219491, where four required contexts were red), so the command reads its JSON and exits 0 only when head_sha equals git rev-parse HEAD, class is green and no context is red or pending; a stale head, empty output or any other class exits 1. The watcher is not reachable from hosted CI, so only the local Done gate runs it; the Lab comment half of AC5 is read from the PR comments, not by this check.'
  source: manual
  execution_scope: local_done_gate
  binds_ac:
  - AC5
  checks:
  - check_type: command
    check_value: sh -c 'onex scm pr-checks OmniNode-ai/omnimarket#6052 | python3 -c "import json,subprocess,sys; L=[json.loads(l) for l in sys.stdin if l.startswith(chr(123))]; r=L[-1][\"result\"] if L else {}; h=subprocess.run([\"git\",\"rev-parse\",\"HEAD\"],capture_output=True,text=True).stdout.strip(); print(r.get(\"head_sha\"),h,r.get(\"class\"),r.get(\"red\"),r.get(\"pending\")); sys.exit(0 if h and r.get(\"head_sha\")==h and r.get(\"class\")==\"green\" and not r.get(\"red\") and not r.get(\"pending\") else 1)"'
    cwd: .
- id: dod-omn24875-integration-proof
  description: the outbox reuse tests and the neighbouring outbox suites run on a lab host at the pushed head; hosted CI cannot reach the lab, so only the local Done gate runs this unbound check
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24875 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/handlers/bus_binding tests/nodes/node_bus_binding_reducer/test_outbox_request_id_clash.py -q --no-cov
    cwd: .
