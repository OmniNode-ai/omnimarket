---
schema_version: "1.0.0"
ticket_id: "OMN-21951"
title: "Runtime and tenant inventory for the work ledger bus path: the reader half, a node that checks an inventory overlay against a recorded host snapshot"
summary: >-
  node_work_ledger_runtime_inventory_effect loads a runtime inventory overlay and its recorded host snapshot from a
  location the request, an environment variable or the overlay roots name, and checks the row shape, distinct non-blank
  DNS-style tenant slugs that reuse no reserved slug, a reason on every exclusion, the required exclusion classes and the
  reconciliation of every observed token against the rows and exclusions. The package ships the schema and a small neutral
  synthetic fixture only; the inventory data and the recorded host snapshot live in the private configuration repository as
  overlay data. This contract covers the reader half. AC3 as the ticket words it (the diff lists no path outside
  omnimarket) cannot hold once the inventory is placed as overlay data, and is not bound here; replacement wording is
  proposed on the ticket for the orchestrator to apply.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-omn21951-reader"
    statement: |-
      The reader checks an inventory overlay and a recorded host snapshot, reconciling every observed runtime against a row or a recorded exclusion, and requires distinct non-blank tenant slugs.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: the inventory has one row per runtime with its id, host, lane, overlay, current tenant, proposed distinct tenant slug and forwarder instance, and is reconciled against the deployed processes, the host launchd jobs and the hosts that wrote ledger rows in the window, with zero unmatched runtimes and every exclusion recorded with its reason -- falsifier: uv run pytest tests -k runtime_inventory -q over the committed inventory and a recorded host snapshot
      - id: "AC2"
        statement: |-
          AC2: the proposed tenant slugs are distinct and non-blank across the inventory rows -- falsifier: uv run pytest tests -k "runtime_inventory and distinct_tenant" -q
evidence_requirements:
  - kind: "tests"
    description: "AC1 and AC2 (reader half): shape, slug and reconciliation checks, each with a planted violation, over the neutral fixture."
    command: "uv run pytest tests/nodes/node_work_ledger_runtime_inventory_effect -q -p no:randomly --no-cov"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn21951-ac1"
    description: "AC1, reader half: the fixture passes with its row and exclusion counts, and each planted violation (unmatched observed token, stale row match, row and exclusion conflict, missing reason, missing required class, unreadable file, no declared location) fails the check. The real inventory and snapshot are exercised by pointing the overlay root at the private configuration repository, quoted in the pull request."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests -k runtime_inventory -q -p no:randomly --no-cov"
        cwd: "."
    binds_ac: ["AC1"]
  - id: "dod-omn21951-ac2"
    description: "AC2: duplicate, blank, reserved and non-DNS-label slugs each fail the check."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests -k \"runtime_inventory and distinct_tenant\" -q -p no:randomly --no-cov"
        cwd: "."
    binds_ac: ["AC2"]
  - id: "dod-omn21951-deploy-runtime"
    description: "Hosted-runner runtime probe: run the reader as shipped against the neutral fixture root and assert it prints PASS with the fixture's row and exclusion counts. The merge base lacks the node."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: |-
          set -eu;
          gh api "repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_work_ledger_runtime_inventory_effect/runtime_inventory_check.py?ref=$(git rev-parse HEAD)" --jq .content | base64 -d | grep -c 'def main';
          out=$(uv run python -m omnimarket.nodes.node_work_ledger_runtime_inventory_effect.runtime_inventory_check --overlay-root tests/fixtures/runtime_inventory);
          printf '%s\n' "$out";
          test "$out" = "PASS rows=3 exclusions=4 observed=9"
        cwd: "."
  - id: "dod-omn21951-integration-proof"
    description: "The pushed head ran the reader suite on a lab host and exited 0. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check."
    source: "manual"
    execution_scope: "local_done_gate"
    checks:
      - check_type: "command"
        check_value: "uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha \"$(git rev-parse HEAD)\" --lane dod-integration-proof-21951 -- uv run --frozen pytest tests/nodes/node_work_ledger_runtime_inventory_effect -q -p no:randomly --no-cov"
        cwd: "."
