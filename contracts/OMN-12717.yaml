  acceptance:
  - id: AC1
    statement: Test-generation outputs must include runnable pytest tests and @pytest.mark.unit
      when the task contract requires it.
- id: req-pytest-attribute-resolves
  statement: A test artifact that reads a pytest attribute the installed pytest does
