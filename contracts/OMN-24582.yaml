schema_version: 1.0.0
ticket_id: OMN-24582
title: 'Stability slice S2: tag departure form and instance owner receipt fields on the deploy command publisher and reader'
summary: node_branch_deploy_command_effect gains the explicit tag_departure form and a sibling_tags field in the deploy agent request shape; the receipt reader models keep instance, host, lane_mirror and sibling_refs, derive accepted_as_ours and read the route_unconfirmed reason. omnimarket only, no new node; step S2 of the stability lane slice.
is_seam_ticket: true
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24582-s2
  statement: The publisher can carry a tag departure and the receipt reader retains the ownership fields, each with a failing control.
  acceptance:
  - id: AC1
    statement: 'AC1: the rebuild command publisher signs and publishes a tag departure request (explicit form, no pull request number, sibling tags in the deploy agent''s own shape) once, and every ordinary request publishes the same bytes as before -- falsifier: pytest tests/nodes/node_branch_deploy_command_effect -q goes red when the envelope always carries sibling tags or a tag departure still carries an open pull request'
  - id: AC2
    statement: 'AC2: the receipt reader keeps instance, host, lane mirror and sibling refs, derives accepted-as-ours only when instance and host are present and the status is success, and reads the route-unconfirmed refusal -- falsifier: pytest tests/test_deploy_receipt_reader_instance_owner_omn19998.py -q goes red when the reader drops the instance field or the status condition is removed'
  - id: AC3
    statement: 'AC3: the sender''s envelope stays inside the deploy agent''s own request model, sibling tags included -- falsifier: the wire seam test goes red when sibling tags is dropped from the agent''s field list fixture'
  - id: AC4
    statement: 'AC4: integrated: on a lab host running the publisher node from this change, one tag departure request is published on the dev command topic and read back from the topic by its correlation id, and the dev agent''s reply for it is read through the receipt reader -- falsifier: with the signing key unset the node answers refused and the topic holds no record for the correlation id'
evidence_requirements:
- kind: tests
  description: The S2 tests pass at the pushed head.
  command: uv run --frozen pytest tests/nodes/node_branch_deploy_command_effect/test_tag_departure_sibling_tags_omn19998.py -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24582-ac1
  description: 'Golden: one tag departure signed once and published once. Error: malformed tag, malformed key, wrong form combination and a missing signing key publish nothing. Failing control: the envelope always carrying sibling_tags and a tag departure carrying open_pr turn tests red; ordinary requests publish the committed fixture bytes.'
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_branch_deploy_command_effect/test_tag_departure_sibling_tags_omn19998.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24582-ac2
  description: 'Assertions after parsing and after forwarding over four committed fixtures; failing controls: the reader losing instance and the status condition removed.'
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/test_deploy_receipt_reader_instance_owner_omn19998.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24582-ac3
  description: 'Seam: the published tag departure envelope stays inside the agent request fields of the wire fixture; dropping sibling_tags from the fixture turns it red.'
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_branch_deploy_command_effect/test_wire_seam.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24582-ac4
  description: The tests behind the integrated reading pass; the live reading is step S4 of the slice and is recorded in the Lab comment of the pull request when taken.
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_branch_deploy_command_effect/test_tag_departure_sibling_tags_omn19998.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24582-integration-proof
  description: Run the S2 tests on a lab host at the pushed head. Hosted CI cannot reach the lab hosts, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24582 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_branch_deploy_command_effect tests/test_deploy_receipt_reader_instance_owner_omn19998.py -q --no-cov -n 0 -p no:randomly
