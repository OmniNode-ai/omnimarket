schema_version: 1.0.0
ticket_id: OMN-22914
title: "Piece 6's first task: the J5 join test: a ledger append under a store-resolved identity lands as a durable row and a projected row, with a golden and an error case"
summary: The append node gains a J5 join handler. An append under an identity the store resolves returns a receipt with the durable ledger position and the same row reads back from the projection; an identity the store cannot resolve is refused with a typed upstream failure that never started, and no row lands in either place. The handler answers piece 5's chain on the floor's emission contract under the same correlation id, so the floor's own receipt fold reads the pair as golden and error. Appends in the tests go to an in-memory ledger or a scratch file, never the live ledger file. The running wiring on the dev bus is not part of this change.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn22914-j5-join
  statement: A ledger append under a store-resolved identity lands as a durable row and a projected row, with a golden and an error case.
  acceptance:
  - id: AC1
    statement: "AC1: golden join test: an append under an identity resolved from the store returns a receipt with ledger_seq and the same row reads back from the projection -- falsifier: uv run --frozen pytest tests/unit/nodes/node_work_ledger_append_effect/test_join_j5.py -q --no-cov -n 0 -p no:randomly -k golden"
  - id: AC2
    statement: "AC2: error join test: an append whose identity cannot be resolved is refused typed and writes no row in either place -- falsifier: uv run --frozen pytest tests/unit/nodes/node_work_ledger_append_effect/test_join_j5.py -q --no-cov -n 0 -p no:randomly -k error"
  - id: AC3
    statement: "AC3: both run on the dev bus and the floor shows J5 with ages -- falsifier: curl -s the served floor-simple.json and read pieces[4].joins[0].state"
evidence_requirements:
- kind: tests
  description: The acceptance tests of this ticket at the pushed head.
  command: uv run --frozen pytest tests/unit/nodes/node_work_ledger_append_effect/test_join_j5.py -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
- id: dod-omn22914-j5-golden
  description: The golden join tests pass, in memory and on a scratch file ledger; on the dev source they fail at collection because the join handler does not exist.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/nodes/node_work_ledger_append_effect/test_join_j5.py -q --no-cov -n 0 -p no:randomly -k golden
    cwd: .
- id: dod-omn22914-j5-error
  description: The error join tests pass; the control tests show the reading the floor gave before this handler (broken) and two injected breaks turning the golden and error assertions red.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/nodes/node_work_ledger_append_effect/test_join_j5.py -q --no-cov -n 0 -p no:randomly -k error
    cwd: .
- id: dod-omn22914-j5-floor
  description: The served floor reads J5 as something other than broken. Hosted CI cannot reach the floor host (the URL is in FLOOR_SIMPLE_URL), so only the local Done gate runs this unbound check. It reads broken until the handler runs on the dev bus under piece 5's correlation ids (not part of this change).
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: "curl -s -m 20 \"${FLOOR_SIMPLE_URL:?set FLOOR_SIMPLE_URL to the served floor-simple.json}\" | python3 -c \"import json,sys; d=json.load(sys.stdin); sys.exit(0 if d['pieces'][4]['joins'][0]['state'] != 'broken' else 1)\""
    cwd: .
- id: dod-omn22914-j5-floor-fold
  description: The floor's own receipt fold reads the golden and error chains of this handler together as passed, in process. This is the hosted part of AC3; on the dev source it fails at collection because the join handler does not exist. The served floor itself is read by the local Done gate check above.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/nodes/node_work_ledger_append_effect/test_join_j5.py -q --no-cov -n 0 -p no:randomly -k together_read_passed
    cwd: .
- id: dod-omn22914-integration-proof
  description: The pushed head ran the J5 join tests and the append node suite on a lab host through the lab work runner and exited 0. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: 'uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-22914 -- uv run --frozen pytest tests/unit/nodes/node_work_ledger_append_effect -q --no-cov -n 0 -p no:randomly'
    cwd: .
