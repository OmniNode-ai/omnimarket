schema_version: 1.0.0
ticket_id: OMN-24012
title: One reader of every topic a contract declares, with a parity test
summary: Boot provisioning, the removal node's declared scan, the topic graph validator and the ACL derive each read a different subset of the topics a node contract declares. The new compute node node_contract_topic_reader_compute reads all twelve shapes and reports unreadable contracts and non-matching literals instead of dropping them, and a parity test holds each other reader to the hand-written set it is documented to read.
is_seam_ticket: true
interface_change: true
interfaces_touched:
- topics
requirements:
- id: req-omn24012-topic-reader
  statement: Every reader of a contract's declared topics is held to the one reader by a test that fails when either side changes shape.
  acceptance:
  - id: AC1
    statement: "AC1: the one reader returns the hand-written topic of every declared shape and reports unreadable contracts and non-matching literals instead of dropping them -- falsifier: uv run pytest tests/nodes/node_contract_topic_reader_compute/test_contract_topic_reader.py -q fails when the reader stops reading one shape"
  - id: AC2
    statement: "AC2: boot provisioning, the removal node's declared scan and the topic graph validator each return exactly the hand-written set they are documented to read, and every real contract's provisioning equals the reader's event_bus, dlq and projection shapes -- falsifier: uv run pytest tests/nodes/node_contract_topic_reader_compute/test_reader_parity.py -q fails when either side changes shape"
  - id: AC3
    statement: "AC3: integrated: after the development runtime rebuilds from the merge, the reader node is loaded and a run on the real contracts returns the 1,139 contracts read with no unreadable one -- falsifier: the running image revision does not contain the merge, or the run reports an unreadable contract"
evidence_requirements:
- kind: tests
  description: The reader and parity tests pass at the pushed head.
  command: uv run pytest tests/nodes/node_contract_topic_reader_compute -q -p no:randomly --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24012-ac1
  description: 'AC1: the reader tests pass at the head; making the reader skip the dlq_topics shape turned four tests red.'
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_contract_topic_reader_compute/test_contract_topic_reader.py -q -p no:randomly --no-cov
    cwd: .
- id: dod-omn24012-ac2
  description: 'AC2: the parity tests pass at the head on the fixture and on the real contract tree.'
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_contract_topic_reader_compute/test_reader_parity.py -q -p no:randomly --no-cov
    cwd: .
- id: dod-omn24012-ac3
  description: 'hosted proxy for AC3: the tests pass here; the reading on the development runtime after its rebuild is posted as a pull request comment naming the head.'
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_contract_topic_reader_compute -q -p no:randomly --no-cov
    cwd: .
- id: dod-omn24012-integration-proof
  description: the reader and parity tests run on a lab host at the pushed head; hosted CI cannot reach the lab, so only the local Done gate runs this unbound check
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24012 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_contract_topic_reader_compute -q --no-cov -p no:randomly
