---
schema_version: "1.0.0"
ticket_id: "OMN-20844"
title: "Customers choose their own OpenRouter model when they add their key"
summary: "A customer who brings their own OpenRouter key names the model it runs: key registration takes the model, checks it against the provider's list for that key and stores it; onex delegate takes a per-call model; no free model is picked for the customer, and the delegation names the chosen model."
is_seam_ticket: false
interface_change: true
interfaces_touched:
  - "public_api"
requirements:
  - id: "req-customer-chooses-openrouter-model"
    statement: |-
      The customer chooses the OpenRouter model their own key runs.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: onex models add, onex secret set and onex secret register-tenant-key take --model, and the hosted intake takes model; the model is checked against the provider's list for the key, a model the list does not name is refused with nothing stored, and a listed model is stored with the customer's credential.
      - id: "AC2"
        statement: |-
          AC2: ModelDelegateSkillRequest declares an optional model field, omitted from the wire when unset; the delegate handler passes it to the dispatch port only when set; the in-process port runs the customer's own route on it and refuses it for any other route; the runtime port refuses it.
      - id: "AC3"
        statement: |-
          AC3: onboarding selects the default OpenRouter model declared in the onboarding overlay, with no model id in code, and the customer can change it with one documented command (`onex models add openrouter --model <id>`) -- falsifier: uv run pytest tests/unit/cli/test_omn20844_onboarding_default_model_overlay.py -q -p no:randomly; with no model named and none declared, a terminal is asked for one and a script or the hosted intake is refused with BYOK_MODEL_NOT_CHOSEN, and a model the customer named is never re-aimed at a catalogue pick.
      - id: "AC4"
        statement: |-
          AC4: the delegation result names the chosen model, and onex models add fails its test when the answer names another model than the chosen one.
      - id: "AC5"
        statement: |-
          AC5: the OpenRouter catalogue row declares customer_chooses_model and its billing is pay_as_you_go, not free_tier.
  - id: "req-ci-check-prerequisite"
    statement: "The separate check-only prerequisite for OmniNode-ai/omnimarket#3838 accepts unrelated CI additions while retaining the characterized pin and release-staleness requirements."
    acceptance:
      - id: "AC6"
        statement: |-
          AC6: workflow action comparisons accept added uses of characterized action/commit pairs in the same workflow while refusing missing uses, moved pins, unknown actions and unknown workflows; release-staleness checks require unconditional jobs and steps, one strict CI Summary registration and no skippable registration, ordered after Canonical File Shape and before CI Summary, regardless of unrelated jobs added around it, with positive and negative controls.
evidence_requirements:
  - kind: "tests"
    description: "Registration, intake, catalogue, effect and delegate-request tests with the provider's model list and the provider faked."
    command: "uv run pytest tests/unit/cli/test_omn20844_openrouter_model_choice.py tests/test_omn20844_chosen_model_never_re_aimed.py tests/unit/nodes/node_delegate_skill_orchestrator/test_delegate_model_choice_omn20844.py -q -p no:randomly"
  - kind: "tests"
    description: "AC7 and AC8: the real R3b prompts and two stored refused answers pass the fixed gate; numbered listing, cat -n listing, diff hunk, line N and path:N inputs keep the rule and an answer citing nothing is refused; an empty stored answer stays refused."
    command: "uv run pytest tests/unit/delegation/test_omn20844_line_citation_needs_numbered_input.py tests/unit/delegation/test_omn19432_rule_waived_by_prompt_layout.py -q -p no:randomly"
  - kind: "tests"
    description: "AC9 and AC10: the class table, driver plumbing, tiered corpus and scorer controls."
    command: "uv run pytest benchmarks/delegation_ladder/tests/test_class_table.py benchmarks/delegation_ladder/tests/test_tiered_corpus.py -q -p no:randomly"
  - kind: "tests"
    description: "AC11 and AC12: the committed rescore covers every saved cell and its flip list equals the diff of recorded and rescored verdicts, with a negative control."
    command: "uv run pytest benchmarks/delegation_ladder/tests/test_rescored_28_task.py -q -p no:randomly"
  - kind: "tests"
    description: "AC13 and AC14: the local port's quality-refused terminal names its stop reason on the hard-tier fixture, the budget case and the already-tried-route case."
    command: "uv run pytest tests/unit/nodes/node_delegate_skill_orchestrator/test_local_dispatch_ladder_stop_reason_omn20844.py -q -p no:randomly"
  - kind: "tests"
    description: "AC16: the tier thresholds, tier table, first-failing-tier rule and unpinned-ladder trace, each with a negative control, and the existing per-class table tests."
    command: "uv run pytest benchmarks/delegation_ladder/tests/test_difficulty_tiers.py benchmarks/delegation_ladder/tests/test_rung_table.py -q -p no:randomly"
  - kind: "tests"
    description: "AC20 to AC22: workflow, escalation COMPUTE, routing reducer and in-process port tests for a pinned run, with the unpinned controls."
    command: "uv run pytest tests/unit/delegation/test_pinned_backend_never_moves_omn20844.py tests/unit/delegation/test_exact_backend_pin_routing_omn15539.py tests/unit/nodes/node_delegate_skill_orchestrator/test_local_dispatch_pin_never_moves_omn20844.py -q -n 0 -p no:randomly --no-cov"
  - kind: "tests"
    description: "AC30: the declared-literal shape, the literals the gate accepts under it, and the empty, filler, refusal and undeclared-prompt controls that stay refused."
    command: "uv run pytest tests/unit/delegation/test_declared_literal_answer_not_content_free_omn20844.py -q -p no:randomly"
  - kind: "tests"
    description: "AC16 and AC17: the three stored answers that read pytest without importing it are refused; four scorer-passed stored answers to the same tasks and a no-import fragment are accepted."
    command: "uv run pytest tests/unit/delegation/test_omn20844_unit_mark_needs_bound_pytest.py tests/unit/delegation/test_pytest_attribute_resolves_omn12717.py -q -p no:randomly"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
