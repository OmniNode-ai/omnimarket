    description: "The OpenRouter default model onboarding registers is read from the node_model_setup_effect overlay (or ONEX_OPENROUTER_DEFAULT_MODEL), refused naming the overlay when none declares it, stored nowhere by the read, and replaced by the one documented command. Every model id in the tests is a fixture the test declares."
    source: "manual"
