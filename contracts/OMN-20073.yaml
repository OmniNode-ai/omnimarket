---
schema_version: "1.0.0"
ticket_id: "OMN-20073"
title: "Prepare omnimarket's repo-owned evidence prerequisite"
summary: "Move PR CI-start pollers to repo-owned evidence and enforce that verdict through CI Summary. Full OCC retirement remains pending OR.2 queue support and cutover proof."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-repo-evidence-prerequisite-preparation"
    statement: "Prepare the PR evidence prerequisite while retaining existing OCC enforcement until the full cutover is ready."
    acceptance:
      - id: "AC1"
        statement: "The six PR CI-start pollers admit only a successful repo-evidence / dod-verify check from GitHub Actions on the current head; absent, nonpassing and newer pending verdicts refuse admission."
      - id: "AC2"
        statement: "CI Summary enforces repo evidence on PR admission and retains the existing OCC queue contexts until OR.2 supports merge_group."
      - id: "AC3"
        statement: "The repo-evidence caller pins the omnibase_core reusable whose caller-evidence dod-verify job exempts dependency bots and a pin-only writer-app bump, so a bot version bump is not refused for binding no evidence of its own."
      - id: "AC4"
        statement: "The skip-token caller pins the omniclaude reusable that runs the token scan with no nested change-control preflight (omniclaude#2540), and CI Summary and the required-checks manifest stop naming the nested preflight context, while the standalone occ-preflight / eligibility context stays expected -- falsifier: uv run pytest tests/ci/test_reject_skip_caller_without_preflight_omn20073.py -q"
      - id: "AC5"
        statement: "The repo-evidence caller passes compare-with-occ \"false\" once dev branch protection requires no OCC context, so the reusable's difference step no longer waits for an occ-preflight / eligibility verdict, and verifier-version stays a release that ships the classifier for a rollback -- falsifier: uv run pytest tests/ci/test_repo_evidence_caller_workflow.py -q -k s6_cutover"
  - id: "req-occ-callers-removed"
    statement: "Remove omnimarket's OCC callers and OCC merge requirements."
    acceptance:
      - id: "AC6"
        statement: "omnimarket deletes the callers that mint, heal, wait on or verify a PR's OCC companion (call-occ-preflight.yml, call-occ-autobind.yml, occ-autobind-mint-verify.yml, occ-companion-merge-heal.yml, occ-receipt-runner.yml, call-receipt-gate.yml, the OCC Companion Merged Gate job); CI Summary expects no companion context (occ-preflight / eligibility, verify / verify) and keeps the two emitter tests; the required-checks manifest names none of the four OCC contexts branch protection dropped; so a pull request merges gated by repo-evidence / dod-verify with no OCC companion -- falsifier: uv run pytest tests/ci/test_occ_callers_removed_omn20073.py -q"
      - id: "AC7"
        statement: "omnimarket deletes the report-only OCC observers that computed, planned or attested a PR's OCC companion (call-occ-companion-observe.yml, call-occ-companion-author.yml, call-occ-attestation-observe.yml), so no pull_request workflow in omnimarket reads or writes an OCC companion or observation -- falsifier: uv run pytest tests/ci/test_occ_callers_removed_omn20073.py -q -k observer"
  - id: "req-queue-hold"
    statement: "A queued PR is not admitted around its hold while the repo-evidence context is not produced for merge_group."
    acceptance:
      - id: "AC8"
        statement: |-
          AC8: no merge queue is active on omnimarket dev, so no queued pull request exists to be admitted around its hold, repo-evidence / dod-verify is required there by an active ruleset and the caller does not run on merge_group, and every auto-merge arming step is gated on the hold check -- falsifier: uv run pytest tests/ci/test_ruleset_readback_omn20073.py -q -k queue_not_admitted
# Linear AC4 (the rollback drill restores the pre-cutover context set) is deliberately
# not declared, so it is unbound. A drill reads back the context set after a protection
# change, and no workflow consumes a protection payload, so a fixture test would prove
# nothing about the rollback. The drill needs a protection write on a scratch branch;
# the exact steps went to orchestrator-9f8a.
evidence_requirements:
  - kind: "tests"
    description: "Execute the workflow pollers against success, failure, absence, skip, cancellation, app identity and newer-head-check fixtures."
    command: "uv run pytest tests/ci/test_repo_evidence_prerequisite_workflow.py -q -k poller_admission"
  - kind: "tests"
    description: "Exercise CI Summary's repo-owned verdict and queue context policy."
    command: "uv run pytest tests/ci/test_repo_evidence_prerequisite_workflow.py -q -k summary"
  - kind: "tests"
    description: "The caller pins the reusable that carries the bot version-bump exemption."
    command: "uv run pytest tests/ci/test_repo_evidence_caller_workflow.py -q -k bot_bump_exemption"
  - kind: "tests"
    description: "The skip-token caller carries no nested change-control preflight and nothing here still expects its context."
    command: "uv run pytest tests/ci/test_reject_skip_caller_without_preflight_omn20073.py -q"
  - kind: "tests"
    description: "The repo-evidence caller turns the OCC difference step off after the cut-over."
    command: "uv run pytest tests/ci/test_repo_evidence_caller_workflow.py -q -k s6_cutover"
  - kind: "tests"
    description: "The OCC companion callers are deleted and CI Summary and the manifest expect no companion context."
    command: "uv run pytest tests/ci/test_occ_callers_removed_omn20073.py -q"
  - kind: "tests"
    description: "The report-only OCC observer callers are deleted."
    command: "uv run pytest tests/ci/test_occ_callers_removed_omn20073.py -q -k observer"
  - kind: "tests"
    description: "No merge queue is active on dev, the evidence context is not a merge_group context, and arming is gated on the hold check."
    command: "uv run pytest tests/ci/test_ruleset_readback_omn20073.py -q -k queue_not_admitted"
  - kind: "tests"
    description: "Every arming step of auto-merge.yml carries the hold condition."
    command: "uv run pytest tests/ci/test_auto_merge_hold_omn18179.py -q -k every_arming_step_is_gated_on_the_hold_check"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-repo-prerequisite-pollers"
    description: "Repo-owned evidence admits PR CI without relying on OCC eligibility."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_repo_evidence_prerequisite_workflow.py -q -k poller_admission"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC1"]
  - id: "dod-repo-prerequisite-summary"
    description: "CI Summary requires the repo-owned PR verdict and preserves current queue enforcement."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_repo_evidence_prerequisite_workflow.py -q -k summary"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC2"]
  - id: "dod-repo-evidence-bot-bump-exemption"
    description: "The repo-evidence caller pins an omnibase_core reusable that carries the dependency-bot and pin-only writer-app exemption in its dod-verify job."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_repo_evidence_caller_workflow.py -q -k bot_bump_exemption"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC3"]
  - id: "dod-reject-skip-caller-without-preflight"
    description: "The skip-token caller pins the preflight-free reusable and CI Summary and the manifest drop the nested preflight context; the test fails at the merge base, whose caller pins 61761f04a and whose CI Summary still expects the nested context."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_reject_skip_caller_without_preflight_omn20073.py -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC4"]
  - id: "dod-repo-evidence-compare-with-occ-off"
    description: "The repo-evidence caller passes compare-with-occ \"false\"; the test fails at the merge base, whose caller still passes \"true\"."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_repo_evidence_caller_workflow.py -q -k s6_cutover"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC5"]
  - id: "dod-occ-callers-removed"
    description: "PR admission requires repo-owned evidence with no OCC companion."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_occ_callers_removed_omn20073.py -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC6"]
  - id: "dod-occ-observers-removed"
    description: "No pull_request workflow in omnimarket computes, plans or attests an OCC companion; the test fails at the merge base, where the three observer callers still exist."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_occ_callers_removed_omn20073.py -q -k observer"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC7"]
  - id: "dod-queue-not-admitted-around-hold"
    description: "The live rules show no merge queue on dev, the caller has no merge_group trigger and the evidence context is required from GitHub Actions; the arming steps are gated on the hold check."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_ruleset_readback_omn20073.py -q -k queue_not_admitted"
        cwd: "${OMNI_HOME}/omnimarket"
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_auto_merge_hold_omn18179.py -q -k every_arming_step_is_gated_on_the_hold_check"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC8"]
