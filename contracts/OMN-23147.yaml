schema_version: "1.0.0"
ticket_id: OMN-23147
title: "Stage 2 of unused-code removal: of each duplicated node contract name the copy dev loads is kept and the others go through quarantine and removal with their tests"
summary: >-
  node_code_quarantine_effect gains HandlerStage2Duplicates. For each node contract name found in more than one repository
  it reads which copy dev loads, keeps that copy and never hands it to the quarantine handler, quarantines every other copy
  with its tests, and later removes them with a tag and a catalog row, one repository per batch. A loaded copy that cannot
  be read (no reading, a reading that does not list the name, or files that cannot be seen) keeps every copy and the group is
  reported once as unread; a clean reading that names none of the copies keeps them all too. The dev reading file reader is
  part of the change; the runtime entry for stage 2, the overlay key naming the reading file, and the first live run are
  follow-ups named in the pull request.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn23147-stage-2-duplicates
    statement: Of each duplicated contract name the copy dev loads is kept, the others are quarantined and then removed with their tests, and a name whose loaded copy cannot be read keeps every copy and is reported as unread.
    acceptance:
      - id: AC1
        statement: 'AC1: for each duplicated contract name the copy loaded on dev is kept and the others are quarantined and then removed with their tests -- falsifier: uv run pytest src/omnimarket/nodes/node_code_quarantine_effect -q -k stage_2_loaded_copy_kept'
      - id: AC2
        statement: 'AC2: a duplicate whose loaded copy cannot be read is kept and reported as unread, not removed -- falsifier: uv run pytest src/omnimarket/nodes/node_code_quarantine_effect -q -k stage_2_unread_copy_kept'
evidence_requirements:
  - kind: tests
    description: The stage 2 acceptance reads and their named source mutations, on the in-memory rig and on the real files and git rig, and the quarantine node's own suite beside them.
    command: uv run --frozen pytest src/omnimarket/nodes/node_code_quarantine_effect -q --no-cov
