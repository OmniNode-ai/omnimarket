schema_version: 1.0.0
ticket_id: OMN-23503
title: Answer the ledger append failures at the ledger to process controls hand-off, with a seam test
summary: Join J6 (piece 6, ledger and state, to piece 7, process spine) read broken on the served board with 65 downstream_missing_typed_failure findings. The 65 are the failure chains the J5 join handler (node_work_ledger_append_effect, piece 6) writes to the emission journal when the durable row lands and the projection never hears it. The join refusal node answered piece 6's failures from ledger rows only, and the J6 entry of its overlay named no journal rule, so piece 7 never answered those chains. This change adds the journal_upstream rule to the J6 entry (overlays repository) and the J6 seam test here, which runs the real J5 handler as the producer, the real join refusal node as the consumer and the floor's own receipt fold as the judge.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23503-j6-journal-seam
  statement: Piece 7 answers each real failure chain the J5 join handler writes to the emission journal, and the seam test fails when the handler's node or the overlay rule changes shape.
  acceptance:
  - id: AC1
    statement: 'AC1: the J6 entry of the join refusal overlay names the J5 handler''s piece 6 chain node in journal_upstream and never names the J5 refusal node -- falsifier: tests/test_join_refusal_j6.py in the overlays repository, 3 of its 9 tests red at the base'
  - id: AC2
    statement: 'AC2: golden and error chain tests: the real J5 handler''s projected_row_missing chain is answered once with piece 7''s upstream_projected_row_missing and the floor fold reads J6 error_only with no finding; a drill chain, the identity-unresolved refusal chain, a success chain and an unreadable ledger are never answered -- falsifier: uv run --frozen pytest tests/nodes/node_join_refusal_effect/test_join_j6_journal_seam.py -q --no-cov -n 0 -k "golden or error"'
  - id: AC3
    statement: 'AC3: the overlay without the journal rule, a journal that drops piece 7 and a planted rename of the producer node each leave J6 broken, and the same answer crosses the in-memory bus and the real broker -- falsifier: uv run --frozen pytest tests/nodes/node_join_refusal_effect/test_join_j6_journal_seam.py -q --no-cov -n 0 -k "control or parity", with JOIN_J6_PARITY_BOOTSTRAP naming the lab broker for the Redpanda leg'
  - id: AC4
    statement: 'AC4: integrated: after the overlay reaches the serving host and the next publish cycle, the join:J6 cause on the served board reads no downstream_missing_typed_failure and the 65 chains read answered -- falsifier: the join J6 state and chain findings of the served floor-simple.json'
evidence_requirements:
- kind: tests
  description: The J6 seam test at the pushed head, golden, error, control and parity legs.
  command: uv run --frozen pytest tests/nodes/node_join_refusal_effect/test_join_j6_journal_seam.py -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23503-ac2-seam-test
  description: The J6 seam test passes at the pushed head, including its failing controls (an overlay without the journal rule, a journal that drops piece 7, a planted rename of the producer node). The file is absent at the merge base, so the command fails there.
  source: manual
  binds_ac:
  - AC2
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_join_refusal_effect/test_join_j6_journal_seam.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn23503-ac1-overlay-rule
  description: The overlay rule is tested in the overlays repository (tests/test_join_refusal_j6.py, 9 tests; 3 red against the merge base). Hosted CI of this repository cannot read that repository, so only the local Done gate runs this unbound check.
  source: manual
  binds_ac:
  - AC1
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: 'cd "${OVERLAYS_HOME:?set OVERLAYS_HOME to an overlays checkout at the pushed branch}" && uv run --no-project --with pytest --with pyyaml pytest tests/test_join_refusal_j6.py -q -p no:cacheprovider'
    cwd: .
- id: dod-omn23503-j6-floor
  description: The served floor reads join J6 as not broken with no J6 chain finding. Hosted CI cannot reach the floor host (the URL is in FLOOR_SIMPLE_URL), so only the local Done gate runs this unbound check.
  source: manual
  binds_ac:
  - AC4
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: "curl -s -m 20 \"${FLOOR_SIMPLE_URL:?set FLOOR_SIMPLE_URL to the served floor-simple.json}\" | python3 -c \"import json,sys; d=json.load(sys.stdin); j=[j for p in d['pieces'] if p['piece']==6 for j in p['joins'] if j['id']=='J6'][0]; sys.exit(0 if j['state']!='broken' and not [f for f in d['chain_findings'] if 'J6' in f['subject']] else 1)\""
    cwd: .
- id: dod-omn23503-integration-proof
  description: The pushed head ran the J6 seam test on a lab host through the lab work runner and exited 0. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: 'env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23503 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_join_refusal_effect/test_join_j6_journal_seam.py -q --no-cov'
    cwd: .
