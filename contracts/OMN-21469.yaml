---
schema_version: "1.0.0"
ticket_id: "OMN-21469"
title: "onex dashboard serves the current OmniDash: omnidash v1.1.11 released and pinned by omnimarket"
summary: "onex dashboard pins omnidash v1.1.11, the first bundle with the seven-page navigation and one Settings page; the pinned digest is the published asset's, verified through the bundle code. AC1 (the version bump) is bound in omnidash's contracts/OMN-21469.yaml."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-current-dashboard-bundle"
    statement: |-
      onex dashboard serves the omnidash release cut from the current dashboard, pinned by the digest of its published asset.
    acceptance:
      - id: "AC2"
        statement: |-
          AC2: tag v1.1.11 sits on that bump PR's merge commit, and its GitHub release carries omnidash-bundle-v1.1.11.tar.gz and omnidash-bundle-v1.1.11.tar.gz.sha256 from a successful publish-dashboard-bundle run -- falsifier: gh api repos/OmniNode-ai/omnidash/releases/tags/v1.1.11 lacks either asset, the tag commit differs from the merge commit, or the run for the tag did not conclude success
      - id: "AC3"
        statement: |-
          AC3: omnimarket dev pins dashboard_bundle version v1.1.11 with the sha256 of that published asset, and onex dashboard from that build serves the seven-page navigation with Settings -- falsifier: the pinned sha256 differs from sha256sum of the downloaded asset, or the served page read shows no Settings entry in its navigation
evidence_requirements:
  - kind: "tests"
    description: "AC2: the v1.1.11 tag peels to omnidash#471's merge commit 3149cd09 (git ls-remote), the release carries the bundle (verified by ensure_bundle against its digest) and the .sha256 sidecar naming that digest and asset, and the publish-dashboard-bundle run for the tag on that commit concluded success; with the pin floor, so the item is about the release omnimarket pins."
    command: 'uv run pytest tests/projection/test_dashboard_bundle_pin_omn21469.py -q -p no:randomly -k "seven_page_release or release_tag_peels or bundle_and_its_sidecar or publish_run_for_the_tag"'
  - kind: "tests"
    description: "AC3: the pin is v1.1.11 or later, and the pinned asset, fetched and verified through ensure_bundle, lists Settings in its navigation entries. At the v1.1.10 pin both fail."
    command: 'uv run pytest tests/projection/test_dashboard_bundle_pin_omn21469.py -q -p no:randomly -k "seven_page_release or lists_settings_in_its_navigation"'
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn21469-ac2-release-v1-1-11"
    description: "AC2: the v1.1.11 tag peels to omnidash#471's merge commit 3149cd09 (git ls-remote), the release carries the bundle (fetched and verified by ensure_bundle against e231574d...) and the .sha256 sidecar naming that digest and asset, and the publish-dashboard-bundle run for the tag on that commit concluded success; and omnimarket's pin names that release (the floor case), so this item fails at a merge base still pinning v1.1.10. Each case fails when its part is missing or wrong: a tag on another commit, an absent or different sidecar, no successful run, or a pin below v1.1.11."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: 'uv run pytest tests/projection/test_dashboard_bundle_pin_omn21469.py -q -p no:randomly -k "seven_page_release or release_tag_peels or bundle_and_its_sidecar or publish_run_for_the_tag"'
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC2"]
  - id: "dod-omn21469-ac3-bundle-pin-1-1-11"
    description: "AC3: onex dashboard pins omnidash v1.1.11 or later, and the pinned asset, fetched and verified through ensure_bundle, the path onex dashboard serves from, carries the Settings entry in its primary navigation list (page local-settings, label Settings), not only the word, which the route map and page heading also use. At the v1.1.10 pin the floor case fails and the verified v1.1.10 bundle has no such entry."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: 'uv run pytest tests/projection/test_dashboard_bundle_pin_omn21469.py -q -p no:randomly -k "seven_page_release or lists_settings_in_its_navigation"'
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC3"]
