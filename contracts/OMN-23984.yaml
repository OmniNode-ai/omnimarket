schema_version: 1.0.0
ticket_id: OMN-23984
title: Host-down reading from a lab machine, read by placement
summary: A sweep run from a lab host probes every available host of the lab host table, reads each host up, suspect, down or unknown with node_host_down_compute, stores and publishes the readings; lab placement
  skips a host read down and re-places a lane pinned to it.
is_seam_ticket: true
interface_change: true
interfaces_touched:
- topics
requirements:
- id: req-omn23984-host-down-reading
  statement: A lab host that stays silent for the down bound reads down from a lab host, and lab placement takes no lane to it and re-places a lane pinned to it.
  acceptance:
  - id: AC1
    statement: 'AC1: a machine whose probes fail for the down bound with no capacity announcement reads down, and not before the bound -- falsifier: pytest tests/unit/nodes/node_host_down_compute/test_host_down_rules.py
      -q'
  - id: AC2
    statement: 'AC2: a sweep from a machine outside the allowed observers fails with a typed code and probes nothing -- falsifier: pytest tests/unit/nodes/node_host_down_reading_effect/test_sweep_chain.py
      -q -k observer'
  - id: AC3
    statement: 'AC3: lab placement skips a machine the reading reads down and places a lane pinned to it elsewhere, on the in-memory bus and on the real broker -- falsifier: pytest tests/unit/nodes/node_host_down_reading_effect/test_down_reading_seam.py
      -q'
  - id: AC4
    statement: 'AC4: integrated: the sweep run from a lab machine under its declared unit publishes a reading for every available machine of the lab host table, and the placement decision for a lane pinned
      to an unreachable test address names it re-placed -- falsifier: onex node run node_host_down_reading_effect sweep on a lab host, then read the reading and the placement decision there'
evidence_requirements:
- kind: tests
  description: The host-down compute, sweep, seam and placement tests pass at the pushed head.
  command: uv run pytest tests/unit/nodes/node_host_down_reading_effect tests/unit/nodes/node_host_down_compute -q -p no:randomly --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23984-ac1
  description: 'AC1: the named tests pass at the head and fail with the corresponding rule or reading removed.'
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/nodes/node_host_down_compute/test_host_down_rules.py -q -p no:randomly --no-cov
    cwd: .
- id: dod-omn23984-ac2
  description: 'AC2: the named tests pass at the head and fail with the corresponding rule or reading removed.'
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/nodes/node_host_down_reading_effect/test_sweep_chain.py -q -p no:randomly --no-cov -k observer
    cwd: .
- id: dod-omn23984-ac3
  description: 'AC3: the named tests pass at the head and fail with the corresponding rule or reading removed.'
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/nodes/node_host_down_reading_effect/test_down_reading_seam.py tests/unit/nodes/node_host_down_reading_effect/test_placement_skips_down_host.py -q -p no:randomly
      --no-cov
    cwd: .
- id: dod-omn23984-ac4
  description: 'hosted proxy for AC4: the tests that stand in for the sweep and the placement pass here; the reading from a lab host under its unit and the placement decision for a pinned unreachable test
    address are posted as a pull request comment naming the head.'
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/nodes/node_host_down_reading_effect tests/unit/nodes/node_host_down_compute -q -p no:randomly --no-cov
    cwd: .
- id: dod-omn23984-integration-proof
  description: the host-down tests run on a lab host at the pushed head through the lab-work node, including the seam and placement tests that fail without the reading; hosted CI cannot reach the lab, so
    only the local Done gate runs this unbound check
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23984 --kind test -- env PYTHONDONTWRITEBYTECODE=1
      uv run --frozen pytest tests/unit/nodes/node_host_down_reading_effect tests/unit/nodes/node_host_down_compute -q --no-cov -p no:randomly
