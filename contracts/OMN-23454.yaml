  statement: 'The ledger append command''s error exit keeps the tail of its stderr next to the exit code, so a scheduled unit''s error log names why the bus could not be reached.'
  acceptance:
  - id: AC2
    statement: 'AC2: the R2 unit''s ledger append succeeds inside the unit (the cause of exit 69 is named: environment, login or path) and a failed append''s stderr is kept in the unit''s journal, with a test for the kept stderr -- falsifier: journalctl for the unit after a forced append failure'
