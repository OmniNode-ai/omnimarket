title: 'A failed ledger append inside a scheduled unit keeps the reason the command gave'
summary: 'The ledger append command''s error exit keeps the tail of its stderr next to the exit code, so a scheduled unit''s error log names why the bus could not be reached.'
is_seam_ticket: true
interface_change: true
