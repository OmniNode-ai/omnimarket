- id: dod-omn23196-ac2-dev-lag-samples
  description: 'The AC2 measurement itself: the lag samples taken on dev over at least two hours after the deploy agent installed this change, written as a JSON list of {at, nonzero_groups} by the lab alarm sampler and judged by the rule above. Fails until that file exists; the hosted gate cannot reach dev, so only the local Done gate runs it.'
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: >-
      uv run python -c 'import json,os; from omnimarket.handlers.lag_sample_verdict import lag_samples_meet_bar; d=json.load(open(os.path.expandvars("$OMNI_HOME/.claude_scratch/reports/writer-pool-1420/ac2-lag-samples.json"))); assert lag_samples_meet_bar(d, min_samples=60, max_nonzero_share=0.5), len(d)'
    cwd: .
- id: dod-omn23196-integration-proof
  description: Run this pull request's own check on a lab host at the pushed head. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23196 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/test_omn23196_runtime_writer_long_lived_pool.py tests/test_omn21288_projection_writers_in_runtime.py -q --no-cov
    cwd: .
