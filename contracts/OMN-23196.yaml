schema_version: 1.0.0
ticket_id: OMN-23196
title: The runtime projection writers reuse one database pool per process, so offsets commit without opening and closing two pools for every delivery
summary: RuntimeProjectionWriter.handle ran each delivery under its own asyncio.run and opened then closed one pool per topology binding, so every offset commit waited on that setup and the consumer-group lag alarm read the delay as growth. The writer now runs its runner on one dedicated event loop for the process, opens the bindings on the first delivery and keeps them, and closes them when the writer is closed or the process exits. Each statement still commits in its own transaction on a pooled connection, deliveries still run one at a time, and a connection-class failure closes the pools so the next delivery attests fresh ones. The alarm's growth rule and bound are unchanged.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23196-long-lived-writer-pool
  statement: A runtime projection writer holds one pool per binding for its process lifetime and commits each delivery on its own.
  acceptance:
  - id: AC1
    statement: 'AC1: each runtime projection writer holds one pool for its process lifetime and still commits each delivery in its own transaction, closing the pool on shutdown -- falsifier: a test counting pool creations over 100 deliveries (2 per delivery before, 1 per process after) and a delivery-failure test that still rolls back alone'
  - id: AC2
    statement: 'AC2: on dev, consumer-group lag samples read non-zero in fewer than half the samples over two hours with the alarm''s bound unchanged -- falsifier: the lab alarm''s lag samples before and after the deploy'
evidence_requirements:
- kind: tests
  description: The pool-creation count over 100 deliveries, the per-delivery transaction log, the failing delivery that rolls back alone, the connection-failure reopen and the close tests pass, with the existing runtime-writer tests updated for a pool that outlives the delivery.
  command: uv run --frozen pytest tests/test_omn23196_runtime_writer_long_lived_pool.py tests/test_omn21288_projection_writers_in_runtime.py tests/test_omn21288_projection_writer_handflip_parity.py tests/test_omn23043_savings_hook_event_skip.py -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23196-ac1-tests
  description: Runs the real writer, runner, topology resolution and AsyncpgAdapter over a fake asyncpg driver and reads create_pool calls over 100 deliveries, each delivery's transaction ending, a failing delivery rolling back alone, a connection failure reopening, and close closing every pool.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/test_omn23196_runtime_writer_long_lived_pool.py tests/test_omn21288_projection_writers_in_runtime.py tests/test_omn21288_projection_writer_handflip_parity.py tests/test_omn23043_savings_hook_event_skip.py -q --no-cov
    cwd: .
- id: dod-omn23196-ac2-lag-sample-rule
  description: Runs the rule the dev lag samples are judged by on samples that meet it and samples that do not, including the measured baseline of 107 non-zero samples in 148, too few samples, and a malformed sample.
  source: manual
  binds_ac:
  - AC2
  checks:
