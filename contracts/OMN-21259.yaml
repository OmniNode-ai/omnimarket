    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/cli/test_omn21259_failed_key_not_routed.py -q -n 0 -k \"list_shows_the_failed_key\""
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC2"]
  - id: "dod-omn21259-ac3-failed-model-named"
