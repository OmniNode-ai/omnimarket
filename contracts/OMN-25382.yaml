schema_version: 1.0.0
ticket_id: OMN-25382
title: Review findings 1 to 6 on omnimarket PR 5611 at the third review of head 4558b91140c5 are fixed or argued
summary: 'The third review of omnimarket#5611 at head 4558b91140c5: the producer test runs the real count, the refused branch never stamps 0 over a routed row, the rule for a recorded zero under a later no-count terminal is decided and pinned, the omnibase_infra copy is read where a runner names it, the Postgres twin cannot skip, and the head carries a Lab receipt.'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn25382-ac1
  statement: 'every required check-run of omnimarket#5611 reads success at the new head, and a PR comment starting `Lab: head=<new head>` names the sha, the command and the Postgres tests passed, not skipped'
  acceptance:
  - id: AC1
    statement: 'AC1: every required check-run of omnimarket#5611 reads success at the new head, and a PR comment starting `Lab: head=<new head>` names the sha, the command and the 4 Postgres tests passed, not skipped -- falsifier: `onex scm pr-checks OmniNode-ai/omnimarket#5611` lists a required context that is not success at the new head, or the Lab comment lacks the sha, the command or the 4 passed'
- id: req-omn25382-ac2
  statement: a test runs HandlerDelegateSkill through an escalated run with compliance repairs and asserts its stored attempts_count differs from len(attempts), and the terminal projection counts a skill count as reported only from a producer-emitted value
  acceptance:
  - id: AC2
    statement: 'AC2: a test runs HandlerDelegateSkill through an escalated run with compliance repairs and asserts its stored attempts_count differs from len(attempts), and the terminal projection counts a skill count as reported only from a producer-emitted value -- falsifier: `uv run pytest tests/unit/delegation/test_terminal_turn_count_omn18534.py -q -p no:cacheprovider` passes with the fixture count hand-copied and no producer run'
- id: req-omn25382-ac3
  statement: the refused branch of handler_projection_delegation also requires that no model ran (not _ran_inference), on the row and on the stored row; a refused test over a routed row holding NULL and no tokens stores NULL, and the skill refusal row is checked the same way
  acceptance:
  - id: AC3
    statement: 'AC3: the refused branch of handler_projection_delegation also requires not _ran_inference(row), a refused test over a routed row holding NULL and no tokens stores NULL, and the skill refusal row is checked the same way -- falsifier: `uv run pytest tests/unit/delegation/test_terminal_turn_count_omn18534.py -q -p no:cacheprovider` passes with `and not _ran_inference(row)` deleted from the zero-stamp condition of `_stamp_not_routed`'
- id: req-omn25382-ac4
  statement: the rule for a reported 0 over a later no-count terminal that names a model is decided and pinned by a test with a not-routed and a routed later terminal, contracts/OMN-18534.yaml lines 4 and 48 state the decision, and a Postgres twin case shows the upsert does not COALESCE a NULL over a stored 0
  acceptance:
  - id: AC4
    statement: 'AC4: the rule for a reported 0 over a later no-count terminal that names a model is decided and pinned by a test with a not-routed and a routed later terminal, OMN-18534.yaml lines 4 and 48 state the decision, and a Postgres twin case shows the upsert does not COALESCE a NULL over a stored 0 -- falsifier: `uv run pytest tests/unit/delegation/test_terminal_turn_count_omn18534.py tests/test_omn18534_turn_count_real_postgres.py -q -p no:cacheprovider` passes with a reported 0 on a terminal that did not fail nulled by a later routed no-count terminal, or with a stamped 0 on an untyped failure kept under that terminal (the twin''s NULL case)'
- id: req-omn25382-ac5
  statement: the omnibase_infra dev tip migration 0069 hashes to cbbdc167 after the comment rewrite, the test reads the infra copy where a runner names it and fails when it cannot read or differs, the PR title names 0069, and a PR comment settles the read node's missing-column refusal
  acceptance:
  - id: AC5
    statement: 'AC5: the omnibase_infra dev tip migration 0069 hashes to cbbdc167 after the comment rewrite, the test reads the infra copy or fails when it cannot, the PR title names 0069, and a PR comment settles the read node''s missing-column refusal -- falsifier: `uv run pytest tests/unit/delegation/test_terminal_turn_count_omn18534.py -q -p no:cacheprovider` passes with one byte of the omnibase_infra copy changed'
- id: req-omn25382-ac6
  statement: _base_dsn and _provisioned_runner never skip, no addopts or conftest deselects the integration marker, and the guard test scans every file and helper that holds the twin
  acceptance:
  - id: AC6
    statement: 'AC6: _base_dsn and _provisioned_runner of tests/test_omn18534_turn_count_real_postgres.py never call pytest.skip, no addopts or conftest deselects the integration marker, and the guard test in tests/test_omn18534_turn_count_postgres_guard.py scans every file that holds the twin -- falsifier: `uv run pytest tests/test_omn18534_turn_count_postgres_guard.py -q -p no:cacheprovider` passes with a pytest.skip added to _provisioned_runner'
- id: req-omn25382-ac7
  statement: the non-blocking findings 7 to 9 are fixed or argued in a PR comment
  acceptance:
  - id: AC7
    statement: 'AC7: the non-blocking findings 7 to 9 are fixed or argued in a PR comment: the timing merge before fold_terminal_ownership keeps the OMN-19448 timing tests green, the skill count field is strict and has no attemptsCount alias, and the refactors of earlier finding 10 are split out or argued -- falsifier: `uv run pytest tests/unit/delegation -q -p no:cacheprovider -k timing` passes with the merge order reverted'
