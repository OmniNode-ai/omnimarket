schema_version: 1.0.0
ticket_id: OMN-26663
title: Lab and runtime alerts are one projection the dashboard can read
summary: node_projection_lab_alerts folds each lab alert transition (raised or cleared) from onex.evt.omnimarket.lab-alert-transitioned.v1 into one row per source and subject, with severity, owner and times, and serves the rows on the bus-backed snapshot topic onex.snapshot.projection.lab.alerts.v1, the route the dashboard's other panels read. The read's shape is written in docs/reference/lab-alerts-projection-read.yaml. Drawing the alerts is the dashboard owner's.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn26663-lab-alerts
  statement: Every alert the lab raises can be a bus event that one projection holds, open or cleared, with severity, owner and times, and the dashboard reads it through the projection route.
  acceptance:
  - id: AC1
    statement: 'AC1: each alert source in the lab (the 106 scheduled jobs mapped by obsmap-1640 and the alarm nodes) is listed with whether its alerts reach the bus -- falsifier: a source missing from the list'
  - id: AC2
    statement: 'AC2: one projection in the shared store holds open and cleared alerts with severity, owner and times, read through the same projection route the dashboard uses -- falsifier: a raised test alert on the dev lane is not in the read within 60 seconds'
  - id: AC3
    statement: 'AC3: the read''s shape is written for the dashboard owner with one example -- falsifier: a field with no meaning stated'
evidence_requirements:
- kind: tests
  description: The projection's focused tests, each failing before the change and passing on it.
  command: uv run pytest tests/test_omn26663_lab_alerts_projection.py -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn26663-projection
  description: A raised test alert is written to the one row for its source and subject and published to the snapshot topic; a clear updates that row with its clear time; replaying the transitions in any order changes no row; an older transition writes nothing; a transition with no owner, no detail or a bad severity is refused.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/test_omn26663_lab_alerts_projection.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn26663-shape-document
  description: The shape document states a meaning for every exposed column and carries one example row whose columns are the exposure's.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/test_omn26663_lab_alerts_projection.py -q --no-cov -n 0 -p no:randomly -k 'shape_document'
    cwd: .
  - check_type: command
    check_value: test -s docs/reference/lab-alerts-projection-read.yaml
    cwd: .
- id: dod-omn26663-source-list
  description: Every alarm source node_lab_alarm declares is listed in docs/reference/lab-alert-sources.yaml with whether its alerts reach the bus as a lab alert transition; a source missing from the list fails the test. The scheduled jobs outside the alarm nodes are not in this list.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/test_omn26663_lab_alerts_projection.py -q --no-cov -n 0 -p no:randomly -k 'alarm_source or listed_as_publishing'
    cwd: .
- id: dod-omn26663-hosted-deploy-check
  description: 'Deploy check the hosted runner can run: the contract declares the transition topic and the bus-backed exposure, and the node is registered as an onex.nodes entry point. This binds no criterion by itself.'
  source: manual
  checks:
  - check_type: command
    check_value: grep -q 'onex.snapshot.projection.lab.alerts.v1' src/omnimarket/nodes/node_projection_lab_alerts/contract.yaml
    cwd: .
  - check_type: command
    check_value: grep -q 'node_projection_lab_alerts = ' pyproject.toml
    cwd: .
- id: dod-omn26663-integration-proof
  description: On a lab host, at the pushed sha, the projection's real-Postgres tests and focused tests run against a reachable database, and the writer's upsert keeps one row per alert across a raise, a clear and a replay. Hosted CI holds no lab bus, so only the local Done gate runs this unbound check; the dev-lane reading of AC2 (a raised test alert in the read within 60 seconds) is separate and is recorded in the PR once the runtime carries the node.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-26663 --kind test -- uv run --frozen pytest tests/test_omn26663_lab_alerts_projection.py tests/test_golden_chain_node_projection_lab_alerts.py tests/test_lab_alerts_projection_real_postgres.py -q --no-cov -n 0 -p no:randomly
    cwd: .
