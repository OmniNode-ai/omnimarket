---
schema_version: "1.0.0"
ticket_id: "OMN-23615"
title: "The work log read answers a kind or search read from the database, not from the whole log"
summary: "A rows read that names a row kind, a lane or an ASCII search term and has no start date is narrowed in the store (kind, lane, term) and takes its parity window from the ledger's oldest row, which the store names itself; the handler's own filters still run, so the answer is unchanged. A store that cannot name its oldest row is read whole."
is_seam_ticket: false
interface_change: true
interfaces_touched:
  - "public_api"
requirements:
  - id: "req-omn23615-narrow-no-start"
    statement: |-
      The work ledger query node narrows a rows or rulings read with no start in the store and answers exactly as the whole read does; a store failure is an error answer.
    acceptance:
      - id: "AC1"
        statement: "AC1: a rows read that names a row kind, a lane or a search term and has no start is answered from a store read narrowed by them, and the rows the store hands back stay within a measured budget of the matching rows -- falsifier: pytest tests/unit/nodes/node_work_ledger_query_effect/test_rows_read_narrowed_without_start.py -q -k budget"
      - id: "AC2"
        statement: "AC2: the narrowed read answers exactly as the whole read does, matched count, rows and parity window included, for every kind, lane and search term of the fixture -- falsifier: pytest tests/unit/nodes/node_work_ledger_query_effect/test_rows_read_narrowed_without_start.py -q -k same_answer"
      - id: "AC3"
        statement: "AC3: a store failure on the narrowed read is an error answer and never an empty one, and a store that cannot name its oldest row is read whole -- falsifier: pytest tests/unit/nodes/node_work_ledger_query_effect/test_rows_read_narrowed_without_start.py -q -k \"error or whole\""
      - id: "AC4"
        statement: "AC4: integrated: on the dev runtime after the merged code runs, onex ledger query --bus-lane dev --kind TERMINAL --limit 1 answers in under 8 seconds (the same command took 17 to 22 seconds before) -- falsifier: time that command from a lab host and find 8 seconds or more"
evidence_requirements:
  - kind: "tests"
    description: "The narrowed-without-start tests and the work ledger query node's existing tests."
    command: "uv run pytest tests/unit/nodes/node_work_ledger_query_effect tests/test_golden_chain_work_ledger_query.py -q --no-cov"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn23615-unit"
    description: "The narrowed-without-start budget, same-answer, error and whole-read tests pass; the failing control (the base handler, which reads the whole table) hands back every row and fails the budget test."
    source: "manual"
    binds_ac: ["AC1", "AC2", "AC3"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/nodes/node_work_ledger_query_effect/test_rows_read_narrowed_without_start.py -q --no-cov"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn23615-integration-hosted"
    description: "Hosted proxy for AC4: the narrowed-without-start tests show the store is asked for the matching rows only and answers as the whole read does. At the merge base the budget and error tests fail, so the control fails there. The lab run is the unbound local item below, because the hosted must-fail control can never run a local_done_gate item."
    source: "manual"
    binds_ac: ["AC4"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/nodes/node_work_ledger_query_effect/test_rows_read_narrowed_without_start.py -q --no-cov"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn23615-integration-proof"
    description: "Run the narrowed-without-start tests on a lab host at the pushed head. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check; the hosted proxy above binds AC4. The one-row kind read timed on the dev runtime (AC4) is read after the deploy agent rolls the merged code."
    source: "manual"
    execution_scope: "local_done_gate"
    checks:
      - check_type: "command"
        check_value: "env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha \"$(git rev-parse HEAD)\" --lane dod-integration-proof-23615 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/nodes/node_work_ledger_query_effect/test_rows_read_narrowed_without_start.py -q --no-cov"
        cwd: "."
