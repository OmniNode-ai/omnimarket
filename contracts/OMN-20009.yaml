---
schema_version: "1.0.0"
ticket_id: "OMN-20009"
title: "Overview shows the run-locally share and the average saving per call from served exposures"
summary: "The producer half of OMN-20009. The delegation model-routing view serves local_call_count, total_call_count and local_call_share in by_tier (migration 0055): local runs over ALL runs, not-tier-routed ones included, so the Overview's Run locally card reads a served share instead of dividing in the browser. The metering-summary fold writes savings_per_measured_run_usd, savings_usd over runs_measured to the millionth and null, never zero, without a measured run or a resolved baseline (migration 0002), and metering-summary.v1 lists the column. Compression and Cache hit rate, and their halves of AC1 and AC2, belong to OMN-20226; the Compression criterion was withdrawn from the ticket on 2026-10-04. The Overview cards themselves are omnidash's half."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-transcribed-acceptance-criteria"
    statement: |-
      The acceptance criteria declared on the OMN-20009 ticket body, as read on 2026-10-05. The ticket body is the source and this block is the copy. The body records that the compression and cache-hit halves of AC1 and AC2 are owned by OMN-20226 and that the Compression criterion was withdrawn on 2026-10-04; the remaining criteria keep their labels.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: Each of the four figures reads from a served exposure -- falsifier: the page contract test finds one whose data is not a served exposure
      - id: "AC2"
        statement: |-
          AC2: A figure with no measurement behind it renders its typed reason, never `0` and never a blank -- falsifier: a fresh store shows `0` for any of the four
      - id: "AC4"
        statement: |-
          AC4: Run-locally share equals the local-tier call count over total calls for the window -- falsifier: the two disagree
evidence_requirements:
  - kind: "tests"
    description: "The metering-summary fold writes savings_per_measured_run_usd and metering-summary.v1 serves it unchanged; null, never zero, without a measured run or a resolved baseline. Dividing by runs_total, writing 0 for an unmeasured row, rounding to cents or leaving the column off the exposure each fails a test; at the merge base 7 of the 8 fail."
    command: "uv run pytest tests/nodes/node_projection_metering_summary/test_omn20009_savings_per_measured_run.py -q -p no:randomly"
  - kind: "tests"
    description: "On real Postgres the model-routing view serves local_call_share as local runs over all runs for each tenant, a measured 0 for a tenant with runs but none local, no row for a tenant with no runs, with the existing by_tier keys and security_invoker unchanged. A tier-routed denominator fails a test; at the merge base 3 of the 6 fail."
    command: "uv run pytest tests/test_omn20009_local_call_share_real_postgres.py -q -p no:randomly"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn20009-saving-per-measured-run"
    description: "The metering-summary fold writes savings_per_measured_run_usd as savings_usd over runs_measured, rounded half-even to the millionth, null (never zero) without a measured run or a resolved baseline, negative when the local run cost more, identical on replay, and the served metering-summary.v1 read returns the stored value unchanged."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_projection_metering_summary/test_omn20009_savings_per_measured_run.py -q -p no:randomly"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC1", "AC2"]
  - id: "dod-omn20009-local-call-share-real-postgres"
    description: "Migration 0055 applied with every node_projection_delegation migration to a scratch schema on real Postgres: for 6 local, 2 not-tier-routed and 2 cloud runs the view serves local_call_count 6, total_call_count 10 and local_call_share 0.6, not the tier-routed 0.75; a tenant with only cloud runs serves 0; a tenant with no runs serves no row; another tenant's runs never enter the counts; tiers, total_tasks, tier_routed_total and not_tier_routed_count are unchanged; security_invoker survives the replace."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/test_omn20009_local_call_share_real_postgres.py -q -p no:randomly"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC4"]
