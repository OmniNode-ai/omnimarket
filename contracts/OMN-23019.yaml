schema_version: 1.0.0
ticket_id: OMN-23019
title: The quiet-host alarm counts only lane rows, never host timer or reading-node rows, as a host's activity
summary: The quiet-host alarm reads the stamps of CLAIM, STATUS and TERMINAL rows that name a pool host as lane activity on it. The host-drift timer rows (actor prefix timer) were already skipped. A reading node (actor prefix node) also writes STATUS rows whose host cell names the host it probed, and it runs no lane there. On 2026-11-09 two such rows (18:35:06Z and 18:35:19Z) were the only rows naming h053 after its last hook event at 18:25:43Z, while its full disk kept the lab fill from placing any lane on it, and the alarm read h053 as quiet with "lanes ran on it for 35m" at 19:10:06Z. The lane-stamp read now skips rows whose actor cell starts with the prefix node, as well as the prefix timer. Lane rows are counted as before.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23019-non-lane-rows
  statement: A row written by a host timer or a reading node is not read as a lane on the host it names, and a lane's own rows still make a host read quiet.
  acceptance:
  - id: AC1
    statement: 'AC1: the quiet-host read ignores rows whose actor is a timer and still raises on lane rows, with a failing control replayed from the 16:45Z and 16:51Z ledger rows -- falsifier: uv run pytest of the quiet-host read''s tests'
evidence_requirements:
- kind: tests
  description: The timer-row and reading-node-row tests of the quiet-host alarm and the existing alarm effect tests.
  command: uv run pytest tests/nodes/node_silent_failure_alarm_effect -q
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23019-ac1
  description: The timer-row tests of the quiet-host alarm (omnimarket#5354, in the merge base) and the reading-node-row tests added here pass; the node-only test fails at the merge base, which counts a node row, and the controls with lane rows raise.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_silent_failure_alarm_effect/test_quiet_host_timer_rows_omn22778.py tests/nodes/node_silent_failure_alarm_effect/test_quiet_host_node_rows_omn23019.py -q
- id: dod-omn23019-integration-proof
  description: Run the alarm effect tests on a lab host at the pushed head. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23019 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_silent_failure_alarm_effect -q --no-cov
