---
schema_version: "1.0.0"
ticket_id: "OMN-21108"
title: "TA.6 node_session_context_sources_effect, pinned mode first"
summary: "A context source in the TC.1 shape reads the session tiers of a context pack. Pinned mode reads one case of the T0.2 compaction replay bundle under ONEX_CONTEXT_REPLAY_ROOT, only its pinned bytes, and returns OPERATOR_WORDS_UNRECORDED by the carry rule (section 5 item 2, decision D10) and REPO_STATE as unavailable where the case excludes it. Live mode returns REPO_STATE unavailable and refuses the other factors with a typed error until its captured-row reader is built."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-pinned-session-sources"
    statement: "Pinned mode reads only the pinned case bytes and carries operator words by the carry rule; failures are typed."
    acceptance:
      - id: "AC1"
        statement: "AC1 (pinned slice): on a fixed pinned bundle, the result is byte-identical across two runs -- falsifier: a diff of the two dumps."
      - id: "AC3"
        statement: "AC3: a two-instruction prompt with a ruling covering one instruction is carried whole; a cited prompt with a whitespace-only residual is absent; an uncited prompt is present verbatim; an uncited one-character reply (a checkmark, a cross, a thumbs-up emoji) is present verbatim; a cited prompt whose residual is a lone symbol is present whole -- falsifier: fixture table."
      - id: "AC4"
        statement: "AC4 (D10, pinned slice): with a RULING row carrying reviewed=<range> in the pinned ledger prefix, prompts inside the range are absent and counted as reviewed and prompts outside it stay verbatim -- falsifier: fixture table. Supersession of a review row waits on the TA.5 reducer."
      - id: "AC5"
        statement: "AC5 (synthetic two-boundary case in the T0.2 bundle format): an unrecorded instruction given before the first boundary is present verbatim, and no compact summary text is -- falsifier: the instruction absent, or summary text present."
      - id: "AC7"
        statement: "AC7: in pinned mode, a ruling written after the case's boundary is absent from every factor served -- falsifier: it appears."
      - id: "AC9"
        statement: "AC9: a missing ONEX_CONTEXT_REPLAY_ROOT in pinned mode fails with a typed error, and sources with no timestamp fail with NO_SOURCE_TIMESTAMP -- falsifier: either returns ok."
      - id: "AC11"
        statement: "AC11 (live half): live mode returns REPO_STATE as unavailable and never fills it from the request's cwd -- falsifier: a live REPO_STATE artifact."
evidence_requirements:
  - kind: "tests"
    description: "The carry-rule fixture table, the pinned bundle reads and the contract tests."
    command: "uv run pytest tests/nodes/node_session_context_sources_effect -q -p no:randomly --no-cov"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn21108-ac1"
    description: "AC1: two pinned reads of one bundle dump byte-identical JSON."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_session_context_sources_effect/test_session_context_sources.py -q -p no:randomly --no-cov -k 'two_runs_are_byte_identical'"
    binds_ac: ["AC1"]
  - id: "dod-omn21108-ac3"
    description: "AC3: the carry-rule fixture table."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_session_context_sources_effect/test_session_context_sources.py -q -p no:randomly --no-cov -k 'carry_rule_fixture_table or citation_of_another_prompt or pinned_ruling_covering'"
    binds_ac: ["AC3"]
  - id: "dod-omn21108-ac4"
    description: "AC4: a review range of five prompts naming the second to the fourth, in the pure rule and from a pinned ledger row."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_session_context_sources_effect/test_session_context_sources.py -q -p no:randomly --no-cov -k 'reviewed_range or review_range or review_row_removes or unresolved_not_empty'"
