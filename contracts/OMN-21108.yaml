        check_value: "uv run pytest tests/nodes/node_session_context_sources_effect/test_session_context_sources.py -q -p no:randomly --no-cov -k 'written_after_the_boundary'"
    binds_ac: ["AC7"]
  - id: "dod-omn21108-ac9"
    description: "AC9: an unset or empty replay root, and a chain record with no timestamp, are typed errors."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_session_context_sources_effect/test_session_context_sources.py -q -p no:randomly --no-cov -k 'missing_replay_root or no_source_timestamp'"
    binds_ac: ["AC9"]
