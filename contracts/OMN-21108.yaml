        check_value: "uv run pytest tests/nodes/node_replay_bundle_writer_effect/test_replay_bundle_writer.py -q -p no:randomly --no-cov -k 'no_default_root or unset_home_variable or path_escaping'"
  - id: "dod-omn21108-deploy-container-pinned-read"
    description: "Hosted deploy probe. An ephemeral Python 3.12 uv bookworm container (including Git for the locked infra dependency) installs the read-only checkout without dev dependencies, builds a one-boundary replay bundle with the T0.2 manifest builder under /tmp, reads OPERATOR_WORDS_UNRECORDED through the product handler and asserts the operator prompt is carried verbatim with status resolved, and that an unset replay root is the typed REPLAY_ROOT_MISSING error. It fails at the merge base, which has no such handler. The hosted runner can run it; no lab route is required."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: |-
          docker run --rm --volume "$PWD:/workspace:ro" --workdir /workspace \
          --env UV_PROJECT_ENVIRONMENT=/tmp/omnimarket-venv \
          --env PYTHONDONTWRITEBYTECODE=1 \
          ghcr.io/astral-sh/uv:python3.12-bookworm \
          uv run --frozen --no-dev --no-editable python -c '
          import yaml
          from datetime import datetime, UTC
          from pathlib import Path
          from omnimarket.handlers import context_compaction_bundle as io
          from omnimarket.nodes.node_context_compaction_manifest_compute.handlers.handler_compaction_manifest import HandlerReplayManifestBuilder as B
          from omnimarket.nodes.node_context_compaction_manifest_compute import models as M
          from omnimarket.nodes.node_session_context_sources_effect.handlers.handler_session_context_sources import HandlerSessionContextSources as H
          from omnibase_core.enums.enum_context_factor import EnumContextFactor as F
          from omnibase_core.models.context.model_context_access import ModelContextAccess as A
          from omnibase_core.models.context.model_context_source_request import ModelContextSourceRequest as Q
          def t(m): return datetime(2025, 2, 15, 0, m, tzinfo=UTC)
          def r(i, k, m, c): return M.ModelCapturedRecord(event_id=i, session_id="s", content_kind=k, emitted_at=t(m), content=c)
          w = "keep the retry budget"
          spec = M.ModelCaseSpec(case_id="c", finding="f", census_status="CONFIRMED", census_ref="x", session_id="s", boundary_pre_event_ids=("pre",), expected_statements=(M.ModelExpectedStatement(statement_id="S", prompt_event_id="op", required_spans=(w,)),), post_boundary_evidence=(M.ModelPostBoundaryEvidence(event_id="late", kind="RESTATED", required_spans=("retry",)),), question="q", expected_answer="a")
          pre = M.ModelHookBoundaryEvent(event_id="pre", session_id="s", hook_event_name=M.EnumBoundaryHook.PRE, emitted_at=t(40), trigger="manual")
          b = B().handle(M.ModelBuildManifestRequest(specs=(spec,), events=(pre,), records=(r("op", "operator_prompt", 10, w), r("late", "prompt", 50, "retry again")), ledger_files=(M.ModelLedgerFile(name="l.md", content=b"2025-02-15T00:01:00Z | STATUS | lane=a | x\n"),), census_ref="x"))
          root = Path("/tmp/omn21108-replay")
          io.write_bundle_files(root, b.bundle_files)
          (root / "manifest.yaml").write_text(b.manifest_yaml)
          pin = yaml.safe_load(b.manifest_yaml)["cases"][0]["transcript_chain"]["sha256"]
          def q(): return Q(factor=F.OPERATOR_WORDS_UNRECORDED, scopes=("case:c",), access=A(tenant_id="t"), revision=pin)
          res = H(env={"ONEX_CONTEXT_REPLAY_ROOT": str(root)}).handle(q())
          assert res.status.value == "resolved" and [x.text for x in res.entries] == [w], res
          miss = H(env={}).handle(q())
          assert miss.error_message.startswith("REPLAY_ROOT_MISSING"), miss
          print(res.entries[0].text_sha256, dict(res.entry_counts))'
  - id: "dod-omn21108-deploy-writer-disk-readback"
    description: "Hosted deploy probe: install the locked product without dev dependencies, build one replay case, write it through the default local filesystem under a temporary overlay root, read every file back from disk and require one verified case. A wrong pin and an undeclared host must be refused. No private overlay or lab service is required; the merge base has no writer module."
    source: "manual"
    binds_ac: ["AC12"]
    checks:
      - check_type: "command"
        check_value: |-
          uv run --frozen --no-dev python -c '
          import json
          import tempfile
          from datetime import UTC, datetime
          from pathlib import Path

          import yaml

          from omnimarket.nodes.node_context_compaction_manifest_compute import models as M
          from omnimarket.nodes.node_context_compaction_manifest_compute.handlers.handler_compaction_manifest import HandlerReplayManifestBuilder as B
          from omnimarket.nodes.node_replay_bundle_writer_effect.handlers.handler_replay_bundle_writer import HandlerReplayBundleWriter as W
          from omnimarket.nodes.node_replay_bundle_writer_effect.models import ModelReplayBundleWriteRequest as Q


          def t(minute):
              return datetime(2025, 2, 15, 0, minute, tzinfo=UTC)


          def r(i, kind, minute, content):
              return M.ModelCapturedRecord(event_id=i, session_id="s", content_kind=kind, emitted_at=t(minute), content=content)


          words = "keep the retry budget"
          spec = M.ModelCaseSpec(case_id="c", finding="f", census_status="CONFIRMED", census_ref="x", session_id="s", boundary_pre_event_ids=("pre",), expected_statements=(M.ModelExpectedStatement(statement_id="S", prompt_event_id="op", required_spans=(words,)),), post_boundary_evidence=(M.ModelPostBoundaryEvidence(event_id="late", kind="RESTATED", required_spans=("retry",)),), question="q", expected_answer="a")
          pre = M.ModelHookBoundaryEvent(event_id="pre", session_id="s", hook_event_name=M.EnumBoundaryHook.PRE, emitted_at=t(40), trigger="manual")
          built = B().handle(M.ModelBuildManifestRequest(specs=(spec,), events=(pre,), records=(r("op", "operator_prompt", 10, words), r("late", "prompt", 50, "retry again")), ledger_files=(M.ModelLedgerFile(name="l.md", content=b"2025-02-15T00:01:00Z | STATUS | lane=a | x\n"),), census_ref="x"))
          with tempfile.TemporaryDirectory(prefix="omn21108-writer-") as tmp:
              home = Path(tmp)
              overlay = home / "overlay.yaml"
              overlay.write_text(yaml.safe_dump({"schema": "replay_root.v1", "hosts": {"probe": {"root": "$HOME/bundle"}}}))
              request = Q(manifest_yaml=built.manifest_yaml, bundle_files=built.bundle_files, overlay_path=str(overlay), host_id="probe")
              writer = W(environ={"HOME": tmp})
              result = writer.handle(request)
              assert result.status.value == "written" and result.cases_verified == 1, result
              assert len(result.files) == len(built.bundle_files) > 0 and all(f.verified for f in result.files), result
              for file in built.bundle_files:
                  assert (home / "bundle" / file.path).read_bytes() == file.content
              manifest = yaml.safe_load(built.manifest_yaml)
              manifest["cases"][0]["transcript_chain"]["sha256"] = "0" * 64
              mismatch = writer.handle(request.model_copy(update={"manifest_yaml": yaml.safe_dump(manifest)}))
              assert mismatch.status.value == "refused_hash_mismatch" and mismatch.cases_verified == 0, mismatch
              missing = writer.handle(request.model_copy(update={"host_id": "undeclared"}))
              assert missing.status.value == "refused_root_undeclared" and missing.root is None, missing
              print(json.dumps({"status": result.status.value, "cases_verified": result.cases_verified, "files_verified": len(result.files), "pin_mismatch": mismatch.status.value, "undeclared_root": missing.status.value}, sort_keys=True))
          '
