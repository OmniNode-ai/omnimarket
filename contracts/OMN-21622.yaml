schema_version: "1.0.0"
ticket_id: OMN-21622
title: "Machine login profile: the ledger serve takes newly declared machines as writers without a reinstall"
summary: >-
  The work-ledger serve read its writers once, from the --writer-principal list its installer rendered, so a machine declared afterwards could not append until the serve unit was rendered again. The serve now also reads the deployment's developer.principal overlay at start and whenever the file changes, and serves every row whose role the append node's contract names as writing (writer_overlay, roles [machine]). The host retakes its subscriptions when the set changes and each group resumes from its committed offset, so rows published before the machine was declared are appended then. An unreadable or malformed overlay keeps the writers already served.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn21622-ledger-serve-machine-writers
    statement: >-
      Declaring a machine's overlay row is the one step that lets it append to the ledger; the serve is never reinstalled for it.
    acceptance:
      - id: AC1
        statement: >-
          AC1: a machine row added to the overlay while the serve runs is served and its rows are attributed to it, with no restart -- falsifier: tests/unit/work_ledger_bus/test_writer_overlay_watch.py fails at the merge base (the module does not exist) and passes at the head
evidence_requirements:
  - kind: tests
    description: >-
      Only rows of a writing role are writers; a malformed overlay is refused and keeps the served writers; a machine row declared while serving is subscribed and attributed, and removing it stops serving it; the serve wiring reads the overlay under the declared root.
    command: uv run --frozen pytest tests/unit/work_ledger_bus/test_writer_overlay_watch.py -q -n 0
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn21622-ac1-serve-follows-overlay
    description: >-
      The mechanism's own tests, including the planted case: a machine's command is not consumed before its row is declared and is accepted and attributed after.
    source: manual
    checks:
      - check_type: test_passes
        check_value: env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/work_ledger_bus/test_writer_overlay_watch.py -q -n 0 -p no:cacheprovider
        cwd: ${OMNI_HOME}/omnimarket
    binds_ac: [AC1]
  - id: dod-omn21622-deploy-overlay-runtime
    description: >-
      Hosted-runner deploy smoke: install this checkout with its frozen dependencies in
      an isolated Python 3.12 Linux container and run the writer-overlay runtime scenarios.
      The in-memory bus must subscribe a newly declared machine, accept and attribute its
      row without reinstalling, retain writers after malformed input, and stop serving a
      removed machine. No lab route, credentials, broker or production ledger is used.
      This proves the evaluated checkout in a disposable runtime, not a production rollout.
    source: manual
    checks:
      - check_type: command
        check_value: |
          docker run --rm --mount "type=bind,source=$PWD,target=/workspace,readonly" --workdir /workspace \
            --env PYTHONDONTWRITEBYTECODE=1 --env UV_PROJECT_ENVIRONMENT=/tmp/writer-overlay-venv \
            --env UV_CACHE_DIR=/tmp/uv-cache \
            ghcr.io/astral-sh/uv@sha256:e5b65587bce7de595f299855d7385fe7fca39b8a74baa261ba1b7147afa78e58 sh -ec '
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends git ca-certificates
              uv run --frozen --python 3.12 pytest tests/unit/work_ledger_bus/test_writer_overlay_watch.py \
                -q -n 0 --no-cov -p no:cacheprovider --basetemp=/tmp/writer-overlay-tests --refuse-skips
            '
        cwd: .
