---
schema_version: "1.0.0"
ticket_id: OMN-26223
title: "Every scheduled job the orchestrator runs reads and writes its inputs and outputs through contract models, so a malformed bundle cannot be written and a reader gets a typed error"
summary: "The closeout sweep's scope files, the hourly comment sweep's held drafts and counts, the integration batch's record and the fill tick's approved-work file each have a strict model; producers validate before writing and readers raise a typed error naming the file and the field."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn26223-scheduled-job-contracts
    statement: "A scheduled job's input or output is never a file that producer and reader each check by hand: the producer validates a model before it writes, and every reader parses with the same model."
    acceptance:
      - id: AC1
        statement: "AC1: each scheduled job's input and output (dod closeout sweep scope bundle, hourly tick comment sweep bundle and held drafts, integration batch, fill tick inputs) is a Pydantic model in its owning node's models, validated at the producer, and every reader parses it with that model and raises a typed error naming the field on a malformed file -- falsifier: uv run pytest tests/unit -k scheduled_job_contract -q in omnimarket"
      - id: AC2
        statement: "AC2: a test built from the recorded incident (a bundle whose held is not an array) fails to be written by the producer and is refused by the reader with a typed error, never an empty or zero result -- falsifier: uv run pytest -k bundle_held_not_array -q in omnimarket"
      - id: AC3
        statement: "AC3: no scheduled-job script parses its bundle with hand-written field checks any more -- falsifier: uv run pytest -k no_hand_parsed_bundle -q in omnimarket, a grep test over the converted readers"
      - id: AC4
        statement: "AC4: a closeout sweep text-state row carrying the producer's error field is accepted by the scope reader and deferred as a text-state-unread finding, never refused as an extra input and never read as a ticket with no closeout comment -- falsifier: uv run pytest tests/unit/test_scheduled_job_contract.py -k text_state_error -q in omnimarket"
evidence_requirements:
  - kind: tests
    description: "The scheduled-job contract tests."
    command: uv run pytest tests/unit/test_scheduled_job_contract.py -q --no-cov
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-omn26223-ac1
    description: "AC1 proven by its named tests."
    source: manual
    binds_ac: [AC1]
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit -q --no-cov -k scheduled_job_contract
  - id: dod-omn26223-ac2
    description: "AC2 proven by its named tests."
    source: manual
    binds_ac: [AC2]
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit -q --no-cov -k bundle_held_not_array
  - id: dod-omn26223-ac3
    description: "AC3 proven by its named tests."
    source: manual
    binds_ac: [AC3]
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit -q --no-cov -k no_hand_parsed_bundle
  - id: dod-omn26223-ac4
    description: "AC4 proven by the text-state error-field tests."
    source: manual
    binds_ac: [AC4]
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/test_scheduled_job_contract.py -q --no-cov -k text_state_error
  - id: dod-omn26223-integration-proof
    description: "Run the scheduled-job contract tests on a lab host at the pushed head; the local Done gate runs this unbound check."
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-26223 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/test_scheduled_job_contract.py -q --no-cov
