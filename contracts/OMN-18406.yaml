---
schema_version: "1.0.0"
ticket_id: "OMN-18406"
title: "dod_verify honours a supersedes_ac_binding retirement of evidence bound to a deleted criterion"
summary: "A merged dod_evidence entry is immutable, and since OMN-20858 dod_verify refuses evidence bound to a criterion the live ticket no longer carries, so a contract whose criterion was deleted could not pass by any append. dod_verify now reads the existing supersedes_ac_binding record (the shape the change-control binding gate already honours) for a deleted criterion: when every item claim on the label is retired, the label is not reported as deleted and an item claiming only retired criteria stops counting. A no_longer_applicable retirement of an independently accepted binding is honoured only when the ticket no longer carries the label, and refuses with CRITERIA_DRIFT kind retired_live when it does. An untyped retirement no longer owns its pair, so the typed entry appended to replace it takes effect. The ticket's own criteria cover the change-control gate's re-acceptance rule, which landed in onex_change_control; the items below evidence this repository's change and bind none of them."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
evidence_requirements:
  - kind: "tests"
    description: "A contract carrying evidence for a deleted criterion plus a retirement record passes dod_verify, and the appended retirement passes the append-only validator."
    command: "uv run pytest tests/unit/nodes/node_dod_verify/test_omn_18406_retire_deleted_criterion.py -q -k \"ac1_retired_deleted_criterion or typed_retirement_appended_after_an_untyped or bound_only_to_the_retired_criterion\""
  - kind: "tests"
    description: "The same contract without the retirement record is still refused CRITERIA_DRIFT, as is a partial retirement and a retirement of a criterion the ticket still carries."
    command: "uv run pytest tests/unit/nodes/node_dod_verify/test_omn_18406_retire_deleted_criterion.py -q -k \"ac2_deleted_criterion_without_retirement or claim_left_unretired or still_declared_by_the_contract or accepted_binding_of_a_live_criterion\""
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn18406-retired-deleted-criterion-passes"
    description: "Lane AC1: a contract whose ticket dropped AC2, with AC2 removed from its editable requirements and a supersedes_ac_binding item appended that retires every AC2 claim (two accepted bindings), verifies with no criteria drift, and omnibase_core's append-only validator reports no violation for the append (and does report one for the in-place edit it replaces). A typed retirement appended after an untyped one takes effect, and an item claiming only the retired criterion is skipped even when its check fails. Fails at the merge base, where the same contract is refused CRITERIA_DRIFT."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/nodes/node_dod_verify/test_omn_18406_retire_deleted_criterion.py -q -k \"ac1_retired_deleted_criterion or typed_retirement_appended_after_an_untyped or bound_only_to_the_retired_criterion\""
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC1"]
  - id: "dod-omn18406-unretired-deleted-criterion-refuses"
    description: "Lane AC2: the same contract without the retirement is still refused CRITERIA_DRIFT naming AC2 deleted and both items; a retirement of one claim of two still refuses naming the other; a criterion the requirements still declare is not retired; and a retirement of an accepted binding whose criterion the ticket still carries refuses with retired_live, while the same contract without it verifies."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/nodes/node_dod_verify/test_omn_18406_retire_deleted_criterion.py -q -k \"ac2_deleted_criterion_without_retirement or claim_left_unretired or still_declared_by_the_contract or accepted_binding_of_a_live_criterion or verifies_without_that_retirement\""
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC2"]
  - id: "dod-omn18406-deploy-criterion-retirement"
    description: "Deploy probe against the explicitly selected runtime container. Its loaded criteria-drift code reports an unretired deleted AC2 as deleted, reports nothing once a supersedes_ac_binding entry retires the accepted AC2 binding, and reports retired_live when the ticket still carries AC2. The probe fails on a runtime without this change, whose loaded code still reports the retired AC2 as deleted. Recorded criterion text is used; this probe does not read Linear. Run only at the local Done gate, where the selected container is available."
    source: "manual"
    execution_scope: "local_done_gate"
    checks:
      - check_type: "command"
        check_value: |
          env docker exec "${RUNTIME_CONTAINER:?set RUNTIME_CONTAINER to the runtime under test}" python -c 'from omnimarket.nodes.node_dod_verify.services.criteria_drift import extract_criteria_pins, compare_criteria; from omnimarket.occ_contract_pin import criterion_hash; rec=lambda l: {"label": l, "criterion_hash": criterion_hash(l + ": kept"), "proposed_by": "occ-autobind", "accepted_by": "reviewer-lane"}; item={"id": "probe-item", "binds_ac": ["AC1", "AC2"], "ac_bindings": [rec("AC1"), rec("AC2")]}; retire={"id": "probe-retire", "supersedes_ac_binding": [{"item": "probe-item", "label": "AC2", "reason_kind": "no_longer_applicable", "reason": "the ticket dropped AC2", "retired_by": "probe", "retired_at": "2026-10-13T14:00:00Z"}]}; body="## Acceptance criteria\n- AC1: kept\n"; drift=lambda items: [d.kind.value + ":" + d.label for d in compare_criteria(extract_criteria_pins({}, items), "OMN-18406", body)[0]]; unretired=drift([item]); retired=drift([item, retire]); live=[d.kind.value + ":" + d.label for d in compare_criteria(extract_criteria_pins({}, [item, retire]), "OMN-18406", body + "- AC2: kept\n")[0]]; assert unretired == ["deleted:AC2"], unretired; assert retired == [], retired; assert live == ["retired_live:AC2"], live; print("LAB_CRITERION_RETIREMENT_READBACK unretired=deleted:AC2 retired=clean live=retired_live:AC2")'
        cwd: "${OMNI_HOME}/omnimarket"
