---
schema_version: 1.0.0
ticket_id: OMN-21989
title: Dev runtime mutation guard refuses read-only docker calls (compose up --dry-run, docker events)
summary: The dev runtime mutation guard refused two kinds of read-only call. A compose up carrying --dry-run was classified as the mutating verb up, because the guard policy listed no dry-run rule. A docker events call was reported could-not-judge (exit 1) because the omniclaude hook ran the node with an interpreter that cannot import omnimarket, which fails every call that names docker and a lifecycle word. The node contract's guard_policy now declares compose_dry_run (flag, verbs, true values), and the handler treats a listed verb as a no-op only when the flag is a bare flag or carries a true value inside the compose call itself; every mutating verb stays refused without a grant. The hook change is a separate omniclaude pull request.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn21989-readonly-docker-calls
  statement: Read-only docker calls and a compose up with --dry-run are classified non-mutating, a mutating verb stays refused without a grant, and a --dry-run text that is not the compose call's own switch smuggles nothing.
  acceptance:
  - id: AC1
    statement: 'AC1: docker events, ps, inspect, logs, and docker compose config or up with --dry-run, aimed at the omnibase-infra project locally or over ssh, are classified non-mutating and never refused or reported could-not-judge -- falsifier: uv run pytest tests/unit/nodes/node_dev_runtime_mutation_guard_effect -k readonly_allow in omnimarket, failing on origin/dev before the fix'
  - id: AC2
    statement: 'AC2: every mutating verb (up without --dry-run, down, rm, restart, stop, kill, start, create) aimed at omnibase-infra stays refused without a grant -- falsifier: uv run pytest tests/unit/nodes/node_dev_runtime_mutation_guard_effect -k refuse'
  - id: AC3
    statement: 'AC3: a regression test built from the recorded refused calls (fixture path in the PR) fails on the unfixed guard and passes on the fix, and the hook-level test covers the same calls -- falsifier: uv run pytest tests/hooks/test_dev_runtime_mutation_guard_hook.py in omniclaude'
