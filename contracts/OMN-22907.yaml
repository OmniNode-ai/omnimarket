schema_version: 1.0.0
ticket_id: OMN-22907
title: 'Piece 3''s first task: the J2 join test, a canary on each host publishes one command, placement consumes the host''s capacity advertisement and one correlated result returns on the dev bus, golden and error'
summary: Adds the J2 join (rebuild plan section 4.1, piece 2 to piece 3) as a handler of node_host_reading_effect with its settings in the node overlay. For each pooled host a canary chain (piece 2) reads the host's newest capacity advertisement and a seam chain (piece 3) places one command on that host and reads one correlated result, both emitted under one correlation id in the floor's emission contract. A host with no or a stale advertisement fails the canary chain typed, the seam chain holds a typed upstream refusal and no command is published. A receipt for another unit, a timeout, a refused placement and a command that ended non-zero each end the seam chain typed and none is read as success. The join-j2 verb runs it on the in-memory or the dev bus. No bound is changed and nothing is muted.
