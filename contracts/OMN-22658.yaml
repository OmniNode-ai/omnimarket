schema_version: 1.0.0
ticket_id: OMN-22658
title: Each projection delivery parses the deployment topology and the writer contract once per process, not once per delivery
summary: The runtime-dispatched projection writers re-parsed two checked-in YAML files with the pure-Python loader on every delivery, which held the dev runtime's GIL for 36 percent of its samples; each file is now parsed once per process.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn22658-parse-once
  statement: The topology profile and each writer contract are parsed once per process, each caller keeps its own copy of a contract, and no failure is remembered.
  acceptance:
  - id: AC1
    statement: 'AC1: many deliveries through the runner connect path and many runner constructions parse the topology profile once and each contract file once per file state, and each caller keeps its own copy of the contract -- falsifier: uv run --frozen pytest tests/projection/test_delivery_cache_omn22658.py -q --no-cov -p no:randomly'
  - id: AC2
    statement: 'AC2: a failing profile load and a missing or malformed contract raise on every call, so the cache remembers no failure -- falsifier: uv run --frozen pytest tests/projection/test_delivery_cache_omn22658.py -q --no-cov -p no:randomly -k error_chain'
  - id: AC3
    statement: 'AC3: the seven runtime-dispatched writers still construct and pass their node tests after the change -- falsifier: uv run --frozen pytest src/omnimarket/nodes/node_projection_live_events src/omnimarket/nodes/node_projection_savings src/omnimarket/nodes/node_projection_registration -q --no-cov -p no:randomly'
evidence_requirements:
- kind: tests
  description: Parse-once cache for the topology profile and the writer contracts
  command: uv run --frozen pytest tests/projection/test_delivery_cache_omn22658.py -q --no-cov -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn22658-parse-once
  description: The golden tests count yaml.safe_load and load_topology_profile calls over many deliveries and see one; the error tests show a missing file, a malformed file and a failing profile raising on every call.
  source: manual
  binds_ac:
  - AC1
  - AC2
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/projection/test_delivery_cache_omn22658.py -q --no-cov -p no:randomly
    cwd: .
- id: dod-omn22658-integration-proof
  description: Run this pull request's own tests, including the real-Postgres delivery test, on a lab host at the pushed head. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check. The dev runtime read (YAML share of a py-spy GIL read, container CPU) follows the roll through the deploy agent.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-22658 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/projection/test_delivery_cache_omn22658.py tests/test_omn22658_delivery_cache_real_postgres.py -q --no-cov
    cwd: .
