schema_version: 1.0.0
ticket_id: OMN-25381
title: 'Review findings 1 to 8 on omnimarket PR 6344 at head 41b59ca61db7 are fixed or argued: the full tests run exits 0,
  the open criteria are declared, max_tokens is clamped or metered, prompt is required and the Lab comment is at the new head'
summary: 'Seventh review follow-up of omnimarket#6344. Finding 1: the rule the contracts follow is the tested rule of tests/ci;
  no ledger row states another. Finding 2: each contract with open criteria carries a local Done gate item that refuses while
  a criterion is open, an owner ticket is null or the hosted dev run is null. Finding 3: a word of 12 or more characters that
  holds a digit counts one token per byte, overlapping case switches are counted, and clamp_max_tokens cuts max_tokens at
  dispatch to the window of the resolved backend. Finding 4: prompt has no default on the routing selection functions and
  every caller passes it. Finding 5: the member bound is the resolved backend''s window less its max_tokens less the wrapper
  margin. Finding 6: the AC1 run target is the recorded repository.'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn25381-review-follow-up
  statement: Every blocking finding of the seventh review of omnimarket#6344 is fixed or argued with evidence.
  acceptance:
  - id: AC1
    statement: 'AC1: the owner ruling for the contract rule is recorded, every part of the full tests run exits 0 on the lab,
      and a comment starting `Lab: head=<full head sha>` names each command and the parts of any split run -- falsifier: `uv
      run pytest tests/ -q` run in parts on the lab, any part at nonzero exit, or no Lab comment at the pushed head'
  - id: AC2
    statement: 'AC2: the criteria of OMN-24980 (AC1 to AC3), OMN-25284 (AC1, AC5) and the contract''s AC7 are declared in
      context.open_criteria with checks that fail until met, the Done gate refuses while they are open, and the review_ticket,
      dev_run_record and owner_tickets tests of dod-omn25320-ac2 fail on null -- falsifier: `uv run pytest tests/ -q -k ''open_criteria
      or contract_proof or dod_omn25320''` fails with the tickets and hosted run null and passes at the new head'
  - id: AC3
    statement: 'AC3: max_tokens is clamped at dispatch or the input is counted with the tokenizer, and a test meters the space-separated
      12-hex-character-word sample, the 96256-letter sample and the non-overlapping case-switch sample against the bound --
      falsifier: `uv run pytest tests/ -q -k ''input_token_bound or clamp''` fails on the old counting and passes at the new
      head'
  - id: AC4
    statement: 'AC4: prompt is a required argument of the bound gate and its callers, every caller and the second pass after
      the routing step pass it, and a test that calls without it fails -- falsifier: `uv run pytest tests/ -q -k ''prompt_required
      or input_token_bound''` fails with prompt defaulted to an empty string and passes at the new head'
  - id: AC5
    statement: 'AC5: the bound is taken from the resolved backend (the peer''s served per-slot window and max_tokens, and
      the rungs 131072), and a test through the real placement fails when a spread substitutes the peer after the tier filter
      -- falsifier: `uv run pytest tests/ -q -k ''resolved_backend or placement or spread''` fails with the hard-coded 48128
      and passes at the new head'
  - id: AC6
    statement: 'AC6: the base and head run target the owning repository and not only a synthetic one, and the item that runs
      it is named -- falsifier: `uv run pytest tests/ -q -k contract_proof` fails with a synthetic-only run target and passes
      at the new head'
evidence_requirements:
- kind: tests
  description: Focused tests of every file the change touches.
  command: uv run pytest tests/nodes/node_delegation_routing_reducer/test_input_bound_omn25381.py tests/nodes/node_delegation_routing_reducer/test_contract_proof_open_criteria_omn25381.py
    tests/nodes/node_delegation_routing_reducer/test_contract_proof_omn24980.py tests/nodes/node_delegation_routing_reducer/test_local_rung_context_ceiling_omn24980.py
    tests/ci/test_repo_evidence_caller_workflow.py -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn25381-ac1
  description: The repository rule the contracts follow (no binds_ac on a local_done_gate item, every declared criterion bound
    to a hosted test_passes check) is the tested rule of tests/ci; no ledger row states another. The full tests run is in
    parts on the lab, each part and exit listed in the Lab comment of the new head.
  source: manual
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/ci/test_repo_evidence_caller_workflow.py -q -p no:cacheprovider --no-cov -k 'no_repo_contract_binds_a_local_done_gate_item
      or every_repo_contract_binds_every_criterion'
    cwd: .
  binds_ac:
  - AC1
- id: dod-omn25381-ac2
  description: Each open criterion is recorded in context.open_criteria and the local Done gate item of each contract refuses
    while any is open, an owner ticket is null or the hosted dev run is null.
  source: manual
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_delegation_routing_reducer/test_input_bound_omn25381.py tests/nodes/node_delegation_routing_reducer/test_contract_proof_open_criteria_omn25381.py
      tests/nodes/node_delegation_routing_reducer/test_contract_proof_omn24980.py tests/nodes/node_delegation_routing_reducer/test_local_rung_context_ceiling_omn24980.py
      -q -p no:cacheprovider --no-cov -k 'open_criteria or contract_proof or dod_omn25320'
    cwd: .
  binds_ac:
  - AC2
- id: dod-omn25381-ac3
  description: The bound counts a 12-hex-character-word, a mixed-case-letter word and an overlapping case-switch sample at
    least one token per character, and max_tokens is clamped at dispatch to the window of the resolved backend.
  source: manual
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_delegation_routing_reducer/test_input_bound_omn25381.py tests/nodes/node_delegation_routing_reducer/test_contract_proof_open_criteria_omn25381.py
      tests/nodes/node_delegation_routing_reducer/test_contract_proof_omn24980.py tests/nodes/node_delegation_routing_reducer/test_local_rung_context_ceiling_omn24980.py
      -q -p no:cacheprovider --no-cov -k 'input_token_bound or clamp'
    cwd: .
  binds_ac:
  - AC3
- id: dod-omn25381-ac4
  description: prompt has no default on the routing selection functions, every caller in src passes it and a call without
    it raises.
  source: manual
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_delegation_routing_reducer/test_input_bound_omn25381.py tests/nodes/node_delegation_routing_reducer/test_contract_proof_open_criteria_omn25381.py
      tests/nodes/node_delegation_routing_reducer/test_contract_proof_omn24980.py tests/nodes/node_delegation_routing_reducer/test_local_rung_context_ceiling_omn24980.py
      -q -p no:cacheprovider --no-cov -k 'prompt_required or input_token_bound'
    cwd: .
  binds_ac:
  - AC4
- id: dod-omn25381-ac5
  description: The member bound is window less output reserve less margin, taken from the resolved backend's max_tokens, and
    a loaded spread placement never picks the peer for a prompt above its bound.
  source: manual
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_delegation_routing_reducer/test_input_bound_omn25381.py tests/nodes/node_delegation_routing_reducer/test_contract_proof_open_criteria_omn25381.py
      tests/nodes/node_delegation_routing_reducer/test_contract_proof_omn24980.py tests/nodes/node_delegation_routing_reducer/test_local_rung_context_ceiling_omn24980.py
      -q -p no:cacheprovider --no-cov -k 'resolved_backend or placement or spread'
    cwd: .
  binds_ac:
  - AC5
- id: dod-omn25381-ac6
  description: The AC1 check of OMN-24980 resolves its run target from the recorded repository (a repository named omnimarket
    is run at base_ref and head; a repository the home does not hold is refused), and dod-omn24980-ac1-live at the local Done
    gate is the item that runs it.
  source: manual
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_delegation_routing_reducer/test_input_bound_omn25381.py tests/nodes/node_delegation_routing_reducer/test_contract_proof_open_criteria_omn25381.py
      tests/nodes/node_delegation_routing_reducer/test_contract_proof_omn24980.py tests/nodes/node_delegation_routing_reducer/test_local_rung_context_ceiling_omn24980.py
      -q -p no:cacheprovider --no-cov -k 'contract_proof'
    cwd: .
  binds_ac:
  - AC6
- id: dod-omn25381-ac7
  description: 'AC7 is met by the PR comment starting `Lab: head=<full head sha>` and cannot be met by a contract check; this
    local Done gate item reads the head the watcher holds so the comment''s head can be compared by eye. It binds nothing.'
  source: manual
  checks:
  - check_type: command
    check_value: onex scm pr-view OmniNode-ai/omnimarket#6344
    cwd: .
  execution_scope: local_done_gate
- id: dod-omn25381-open-criteria-gate
  description: The local Done gate refuses while AC7 is open; it reads context.open_criteria and exits 1 naming each. It binds
    no criterion.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: python3 -c 'import sys, yaml; c = yaml.safe_load(open("contracts/OMN-25381.yaml")).get("context") or {};
      p = ["open criterion " + k for k in (c.get("open_criteria") or {})]; print(chr(10).join(p), file=sys.stderr); sys.exit(1
      if p else 0)'
    cwd: .
- id: dod-omn25381-integration-proof
  description: Run the focused routing and contract-proof tests on a lab host at the pushed head. Hosted CI cannot reach the
    lab, so only the local Done gate runs this unbound check; it binds no acceptance criterion.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)"
      --lane dod-integration-proof-25381 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_delegation_routing_reducer/test_input_bound_omn25381.py
      tests/nodes/node_delegation_routing_reducer/test_contract_proof_open_criteria_omn25381.py tests/nodes/node_delegation_routing_reducer/test_contract_proof_omn24980.py
      tests/nodes/node_delegation_routing_reducer/test_local_rung_context_ceiling_omn24980.py -q --no-cov
    cwd: .
context:
  open_criteria:
    AC7: 'AC7: each blocking finding (1 to 6) is fixed with a test red at head 41b59ca61db7 and green at the new head or argued
      with evidence in a PR comment, findings 7 and 8 are fixed or argued, and the Lab comment is at the new head -- falsifier:
      `onex scm pr-view OmniNode-ai/omnimarket#6344` shows a head that differs from the head named in the Lab: comment, or
      no Lab: comment'
  open_criteria_reason: AC7 is met by the Lab comment at the new head, which a contract check cannot read.
