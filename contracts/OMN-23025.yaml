- kind: tests
  description: The lane-reasons tests with their controls, and the alarm's existing compute and effect tests.
  command: uv run --frozen pytest tests/nodes/node_silent_failure_alarm_compute tests/nodes/node_silent_failure_alarm_effect -q --no-cov
- kind: tests
  description: The lane-states tests, the rules-reader tests with their controls, and the lab fill suites.
  command: uv run --frozen pytest tests/nodes/node_lab_fill_plan_compute tests/nodes/node_lab_fill_effect -q --no-cov
