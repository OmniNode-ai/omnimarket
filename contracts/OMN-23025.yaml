schema_version: 1.0.0
ticket_id: OMN-23025
title: The placement alarm reads each lane of a lab-fill run from the ledger's own rows and names the reason every unplaced lane carries
summary: On 2026-11-08 the placement alarm read two lab-fill runs as 9 of 33 lanes placed and named no reason (no-refusal-reported). The fill writes its STATUS row while its detached send jobs are still building, so 24 lanes read pending there and every one got its CLAIM row one to ten minutes later; the 23 lanes the fill skipped named their reason in the same row; and the runner's lane-end report has been a STATUS row since OMN-21822 while the alarm read only MSG rows. The alarm now settles a run from the ledger rows, reads lane-end STATUS rows, names each unplaced lane with its reason in a lane-reasons cell, and judges a pending lane inside the fill's send cap neither way. No threshold, share, window or check is changed. On 2026-11-08 the lab fill's STATUS rows counted lanes it never started in states=never-started:N and named none of them (refusals=none), counted a lane placed only if it had started when the row was written (its send job was still building), and labelled any brief-assembly exit 2 as brief-rules-unreadable with the detail left in a send log on the launching host. The omnimarket lab fill node now carries the exception text of the rules reader (its stderr and exit code name the lane_rules_block.py script and the rules file it could not read) in the skip detail, and the lab-fill plan node gains one operation, settle_lab_fill_lane_states, that settles each lane (a pending lane with a CLAIM on a host is placed) and writes the states and refusals cells with every never-started lane named by its skip reason. No threshold, share, window or check is changed.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23025-placement-lane-reasons
  statement: The placement alarm settles each lab-fill run from the CLAIM rows of its pending lanes, reads the runner's lane-end STATUS rows, and writes the reason of every unplaced lane into its FRICTION row; the unfixed reader fails the same tests.
  acceptance:
  - id: AC1
    statement: 'AC1: pending lanes with a CLAIM row read placed and raise nothing, pending lanes with no CLAIM past the send cap alarm and each is named with send-job-no-claim, lanes inside the cap are judged neither way, lanes the fill skipped are named by the fill reason, and lane-end STATUS rows with a non-zero exit name the runner refusal -- falsifier: uv run --frozen pytest tests/nodes/node_silent_failure_alarm_effect/test_placement_lane_reasons_omn23025.py -q --no-cov'
- id: req-omn23025-lab-fill-status-lane-states
  statement: The omnimarket lab fill reports the cause of a rules read failure, and its plan node settles the placed count from CLAIM rows and names each never-started lane in the refusals cell; the unfixed code fails the same tests.
  acceptance:
  - id: AC1
    statement: 'AC1: a rules reader that exits non-zero yields a skip detail that names lane_rules_block.py, the exit code and the reader stderr, and the recorded 2026-11-08T09:10Z STATUS lanes cell settles to placed 9 with both never-started lanes named in refusals -- falsifier: uv run --frozen pytest tests/nodes/node_lab_fill_plan_compute/test_lab_fill_lane_states.py tests/nodes/node_lab_fill_effect/test_local_adapters_lab_fill_effect.py -q --no-cov'
- id: req-omn23025-lab-fill-skip-cause
  statement: The lab fill plan node's lane-states settle names the step a skipped brief failed, from the send job's log tail, where the dispatch labelled every brief-build exit brief-rules-unreadable; the unfixed handler fails the same tests.
  acceptance:
  - id: AC3
    statement: 'AC3: a never-started lane whose skip reason is brief-rules-unreadable is named by the step its log tail shows failed (the rules file, the rules checkout, the standing-rules marker, the rules script, a Linear rate limit, the missing ticket_mirror overlay), and a reason or detail no rule knows keeps the dispatch label -- falsifier: uv run --frozen pytest tests/nodes/node_lab_fill_plan_compute/test_lab_fill_skip_cause.py -q --no-cov'
