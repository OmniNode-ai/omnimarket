- id: req-omn13967
  statement: The quality gate must accept a legitimately terse answer only when the prompt declared a short shape, and must keep refusing a one-word reply to a prose request.
  acceptance:
  - id: AC1
    statement: 'AC1: a closed response-shape directive recognises a bare say-word prompt as a declared short answer, so the recorded say-ok run 1aeccaa6 passes through short_form_adequacy with no reliance on finish_reason -- falsifier: uv run pytest tests/unit/delegation/test_omn13967_short_complete_answer_passes.py -q -k "bare_say_word or recorded_prompt_declares or declared_short_answer_passes"'
  - id: AC2
    statement: 'AC2: finish_reason=stop no longer lifts the single-word rule for a request that declared no short shape, so a one-word reply such as Done to a document-class prose request is refused -- falsifier: uv run pytest tests/unit/delegation/test_omn13967_short_complete_answer_passes.py -q -k one_word_reply'
  - id: AC3
    statement: 'AC3: the READY probe f037b9be, the dd548066 replay and the OMN-18278 truncation set still behave as committed -- falsifier: uv run pytest over the committed OMN-13967, OMN-19016 and OMN-18278 fixture tests'
