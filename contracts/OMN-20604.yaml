---
schema_version: "1.0.0"
ticket_id: "OMN-20604"
title: "Lab job reducer decides every job transition as a pure function"
summary: "node_lab_job_reducer is a pure handle(input) -> output with no clock and no I/O. AC1 to AC3 are bound to the reducer's tests. The lab readback is recorded in the pull request body and is not bound."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-lab-job-reducer-transitions"
    statement: "The reducer applies each event to a job row and returns the next row and its intents. The criteria below are the ones the reducer's tests cover; each id is the label the binding item claims through binds_ac."
    acceptance:
      - id: "AC1"
        statement: "AC1: every transition in the table yields its expected state, and every non-terminal state has an exit -- falsifier: uv run pytest tests/test_lab_job_reducer.py -k 'transition_table or has_an_exit' -q in omnimarket"
      - id: "AC2"
        statement: "AC2: exactly one runtime takes a job, and a restart is built from the original brief -- falsifier: uv run pytest tests/test_lab_job_reducer.py -k 'one_takes or original_brief' -q in omnimarket"
      - id: "AC3"
        statement: "AC3: the alert dedup key is stable across resends, and stale attempt events are dropped -- falsifier: uv run pytest tests/test_lab_job_reducer.py -k 'dedup_key or stale_attempt' -q in omnimarket"
      - id: "AC4"
        statement: "AC4: the lane-liveness wire models are defined once in omnimarket.models.liveness and the compute node re-exports them, so one definition serves every importer -- falsifier: uv run pytest tests/unit/test_liveness_shared_models.py -q in omnimarket fails when a model is defined twice or is missing from the shared package"
      - id: "AC5"
        statement: "AC5: the lab job submit command catches a broker ACL refusal, prints the refusal to stderr, and exits 69 with no traceback and nothing published -- falsifier: uv run pytest tests/unit/nodes/node_lab_job_submit_effect/test_lab_job_submit_cli.py -k bus_publish_refused_exits_69 -q in omnimarket fails at the merge base, where the test does not exist"
      - id: "AC6"
        statement: "AC6: node_lab_job_check_schedule_compute returns a nonterminal sweep request on the one runtime tick that opens each 300-second window and nothing on every other tick, holding no state -- falsifier: uv run pytest tests/unit/nodes/node_lab_job_check/test_lab_job_check_schedule.py tests/test_golden_chain_lab_job_check_schedule_compute.py -q in omnimarket fails at the merge base, where the node does not exist"
      - id: "AC7"
        statement: "AC7: on a recorded ledger window the check effect keys attribution on the lane since its own CLAIM, counts a TERMINAL only when it is newer than the CLAIM, and reports elapsed deadlines and the PR state read for the done rule -- falsifier: uv run pytest tests/unit/nodes/node_lab_job_check/test_lab_job_check_effect.py -k 'recorded_window or newer_than_the_claim or reused_lane or per_lane or deadlines or pr_never_observed' -q in omnimarket fails at the merge base, where the node does not exist"
      - id: "AC8"
        statement: "AC8: every statement the check effect issues through its store is a SELECT in a read-only transaction, and the guard refuses INSERT, UPDATE, DELETE, DDL and multi-statement text before the driver sees it -- falsifier: uv run pytest tests/unit/nodes/node_lab_job_check/test_lab_job_check_effect.py -k 'selects_only or select_only_guard or accepts_every_statement' -q in omnimarket fails at the merge base, where the node does not exist"
      - id: "AC9"
        statement: "AC9: on an in-memory bus a runtime tick ends as one lab-job-checked record per open job -- falsifier: uv run pytest tests/test_golden_chain_lab_job_check_effect.py -q in omnimarket fails at the merge base, where the node does not exist"
  - id: "req-lab-job-projection"
    statement: "node_projection_lab_job is a pure fold plus an in-process writer: the writer stores the newest state row per job and every transition once, ordered by the CAS-assigned seq."
    acceptance:
      - id: "AC10"
        statement: "AC10: the lab job projection writer refuses an older seq, an equal seq and a redelivered transition, so a replay writes nothing -- falsifier: uv run pytest tests/test_lab_job_projection.py -k 'older_transition or redelivered or equal_seq' -q in omnimarket fails at the merge base, where the node does not exist"
      - id: "AC11"
        statement: "AC11: only the writer is routed and it declares in-process dispatch, while the pure fold writes no rows -- falsifier: uv run pytest tests/test_golden_chain_projection_lab_job.py -k 'trap or routes_only_the_writer' -q in omnimarket fails at the merge base, where the node does not exist"
evidence_requirements:
  - kind: "tests"
    description: "AC1 to AC3 hosted probe. The reducer tests pass at the head and fail at the merge base, where the reducer does not exist."
    command: "env -u PYTHONPATH uv run pytest tests/test_lab_job_reducer.py -q"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn20604-ac1-transitions"
    description: "AC1 hosted probe. The transition table and the exit for every non-terminal state hold."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/test_lab_job_reducer.py -k 'transition_table or has_an_exit' -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC1"]
  - id: "dod-omn20604-ac2-one-runtime-original-brief"
    description: "AC2 hosted probe. One runtime takes a job and a restart uses the original brief."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/test_lab_job_reducer.py -k 'one_takes or original_brief' -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC2"]
  - id: "dod-omn20604-ac3-dedup-and-stale"
    description: "AC3 hosted probe. The alert dedup key is stable and stale attempt events are dropped."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/test_lab_job_reducer.py -k 'dedup_key or stale_attempt' -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC3"]
  - id: "dod-omn20604-ac4-liveness-shared-models"
    description: "AC4 hosted probe. The lane-liveness models live in the shared package and the node re-exports them. The test file exists only at the head, so the check fails at the merge base."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/test_liveness_shared_models.py -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC4"]
  - id: "dod-omn20604-ac5-submit-acl-refusal-exits-69"
    description: "AC5 hosted probe. A broker ACL refusal on submit exits 69 with the refusal on stderr and no traceback. The test exists only at the head, so the check fails at the merge base."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/nodes/node_lab_job_submit_effect/test_lab_job_submit_cli.py -k bus_publish_refused_exits_69 -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC5"]
  - id: "dod-omn20604-ac6-check-schedule"
    description: "AC6 hosted probe. The tick that opens a window requests one sweep; no other tick does. The test files exist only at the head, so the check fails at the merge base."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/nodes/node_lab_job_check/test_lab_job_check_schedule.py tests/test_golden_chain_lab_job_check_schedule_compute.py -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC6"]
  - id: "dod-omn20604-ac7-check-evidence"
    description: "AC7 hosted probe. Per-lane attribution, the TERMINAL-after-CLAIM filter, deadlines and PR-state reads over the recorded window."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/nodes/node_lab_job_check/test_lab_job_check_effect.py -k 'recorded_window or newer_than_the_claim or reused_lane or per_lane or deadlines or pr_never_observed' -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC7"]
  - id: "dod-omn20604-ac8-check-selects-only"
    description: "AC8 hosted probe. The check effect issues SELECT statements only, and the guard refuses every write."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/nodes/node_lab_job_check/test_lab_job_check_effect.py -k 'selects_only or select_only_guard or accepts_every_statement' -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC8"]
  - id: "dod-omn20604-ac9-check-golden-chain"
    description: "AC9 hosted probe. Golden chain on an in-memory bus: tick, request, one checked record per open job."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/test_golden_chain_lab_job_check_effect.py -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC9"]
  - id: "dod-omn20604-check-deploy-probe"
    description: "Deploy probe. The lab job check schedule handler at the checked-out commit passes the tick's scheduled_at to the shared window rule; the probe reads it from GitHub at that commit and exits nonzero on a tree without it, so it fails at the merge base, where the node does not exist. The dev-lane readout after the deploy agent rolls it is one lab-job-check-requested record on onex.cmd.omnimarket.lab-job-check-requested.v1 per 300-second window."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: "gh api \"repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_lab_job_check_schedule_compute/handlers/handler_lab_job_check_schedule.py?ref=$(git rev-parse HEAD)\" --jq .content | base64 -d | grep -cF 'scheduled_at=request.scheduled_at'"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn20604-ac10-projection-ordering-guard"
    description: "AC10 hosted probe. An older seq, an equal seq and a redelivered transition are refused by the writer's statements. The test file exists only at the head, so the check fails at the merge base."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/test_lab_job_projection.py -k 'older_transition or redelivered or equal_seq' -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC10"]
  - id: "dod-omn20604-ac11-projection-golden-chain"
    description: "AC11 hosted probe. Only the writer is routed and dispatched in process; the pure fold writes nothing. The test file exists only at the head, so the check fails at the merge base."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/test_golden_chain_projection_lab_job.py -k 'trap or routes_only_the_writer' -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC11"]
  - id: "dod-omn20604-projection-deploy-probe"
    description: "Deploy probe. The lab job projection writer at the checked-out commit declares in-process dispatch; the probe reads it from GitHub at that commit and exits nonzero on a tree without it, so it fails at the merge base, where the node does not exist. The dev-lane readout after the deploy agent rolls it is one omninode_internal.lab_job_state row per job after a lab-job-transitioned event."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: "gh api \"repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_projection_lab_job/handlers/handler_lab_job_writer.py?ref=$(git rev-parse HEAD)\" --jq .content | base64 -d | grep -cF 'onex_runtime_inprocess_dispatch = True'"
        cwd: "${OMNI_HOME}/omnimarket"
