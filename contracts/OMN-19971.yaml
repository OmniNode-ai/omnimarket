---
schema_version: "1.0.0"
ticket_id: "OMN-19971"
title: "The two merged Projection API exposure fixes are verified on the lab dev lane, tenant and filter pinned"
summary: "The projection reader serves an exposure that declares no cursor from its newest rows, reads a key that is unique per row without the recursive per-key scan, and runs one window query per page. Both defects came in with omnimarket#3208 and kept AC1 from passing on the dev lane. This contract binds AC1 to the unit test file this change adds, which pins both reader defects. The dev-lane readback AC1 names runs after merge and the deploy agent's normal rebuild, and is not claimed here."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-projection-reader-newest-window-unique-key"
    statement: |-
      A read without since of an exposure that declares no cursor serves that exposure's newest rows, dated rows before undated ones; an exposure that declares a cursor still walks from its oldest row; a key that is unique per row is read straight from the relation, while a mutable key still gets one row per key; one page request runs one window query.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: Every read exposure answers 200 with the same key set as its writer for the pinned tenant and filter, or its declared typed status -- falsifier: a 503 or 5xx on an exposure the contract declares bus-backed, or a key-set mismatch, in the recorded lab read
evidence_requirements:
  - kind: "tests"
    description: "The reader unit tests pass at the head and fail at the merge base, where an exposure without a cursor serves its oldest window and every keyed exposure runs the per-key scan."
    command: "uv run pytest tests/unit/projection/test_omn19971_newest_window_unique_key.py -q"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn19971-ac1-newest-window-unique-key"
    description: "The reader unit tests: an exposure without a cursor serves its newest rows on page one, dated rows first; a cursor exposure still walks; a key covered by a valid, full, plain unique index over NOT NULL columns (or declared immutable) skips the per-key scan, and a mutable key keeps one row per key; one window query per page; the unique-index lookup is bound, cached per relation and read again after 60 s; one exposure's failed freshness read fails only that exposure on the status page."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/projection/test_omn19971_newest_window_unique_key.py -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC1"]
