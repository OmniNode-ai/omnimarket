schema_version: "1.0.0"
ticket_id: OMN-26433
title: "The duplicate guard's claims read answers within a declared bound on lab hosts or falls back to a declared bounded read, so a lab lane's pr-create opens its pull request instead of refusing on a bus session timeout"
summary: >
  The guard's claims read is two narrow reads through the ledger reader node (the CLAIM, TERMINAL and RELEASE rows of 168 hours
  and every row of the last hour), each bounded by a wait declared in the snapshot node contract, with the legacy whole-window
  read as the declared fallback and an unchecked refusal when neither answers. node_pr_create_refusal_alert_compute names the
  pr-create refusals in lane STATUS and TERMINAL rows by cause and raises one alert for each new cause. The dev broker's
  slow replies to the work-ledger query (55 to 137 seconds a page on 2026-11-22) are a runtime matter this change does not touch.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-bounded-claims-read"
    statement: |-
      The guard reads its claims within declared bounds, falls back to a declared read, and never prints clear without having read claims.
    acceptance:
      - id: "AC2"
        statement: |-
          AC2: the claims read answers within a bound declared in the node contract, or the guard falls back to a declared bounded read -- falsifier: uv run pytest tests/unit/handlers/scm/test_scm_duplicate_guard_reader_timeout.py -q fails on origin/dev
      - id: "AC3"
        statement: |-
          AC3: with the primary read timing out or exiting 69 the guard answers from the declared fallback with rows or refuses unchecked, and never prints clear without having read claims -- falsifier: uv run pytest tests/unit/handlers/scm/test_scm_duplicate_guard_reader_timeout.py -k never_clear_unread -q
      - id: "AC4"
        statement: |-
          AC4: a regression test built from the recorded reader output of 2026-11-22 fails on the broken code and passes on the fix -- falsifier: uv run pytest tests/unit/handlers/scm/test_scm_duplicate_guard_reader_timeout.py -k recorded_2026_11_22 -q on the code before the fix passes
  - id: "req-refusal-alert"
    statement: |-
      A pr-create refusal with reader exit 69 or a pr-create timeout, read from lane STATUS or TERMINAL rows, raises one alert after the first lane that hits it.
    acceptance:
      - id: "AC5"
        statement: |-
          AC5: a check names this class and raises one alert after the first lane -- falsifier: uv run pytest tests/test_golden_chain_pr_create_refusal_alert.py -q over the recorded refusals fails when the check reads none of them
evidence_requirements:
  - kind: tests
    description: "The claims read is bounded by the node contract, falls back, and refuses unchecked when unread"
    command: "uv run pytest tests/unit/handlers/scm/test_scm_duplicate_guard_reader_timeout.py tests/unit/handlers/scm/test_scm_duplicate_guard.py tests/unit/handlers/scm/test_scm_duplicate_guard_reader_hosts.py -q"
  - kind: tests
    description: "The recorded refusals of 2026-11-22 raise one alert per cause"
    command: "uv run pytest tests/test_golden_chain_pr_create_refusal_alert.py -q"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-ac2-bounded-claims-read
    description: "the guard's claims read waits at most the bounds declared in config.ledger_read of the snapshot node contract, and falls back to the declared whole-window read"
    source: manual
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/unit/handlers/scm/test_scm_duplicate_guard_reader_timeout.py -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC2"]
  - id: dod-ac3-never-clear-unread
    description: "with every read failing the guard refuses unchecked after trying, and prints clear only after rows were read"
    source: manual
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/unit/handlers/scm/test_scm_duplicate_guard_reader_timeout.py -k never_clear_unread -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC3"]
  - id: dod-ac4-recorded-2026-11-22
    description: "the recorded exit 69 bus-session-failed-timeouterror answers of h053, h201 and h202 no longer refuse pr-create"
    source: manual
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/unit/handlers/scm/test_scm_duplicate_guard_reader_timeout.py -k recorded_2026_11_22 -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC4"]
  - id: dod-ac5-refusal-alert
    description: "the three recorded refusals raise one alert per cause, naming the first lane"
    source: manual
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/test_golden_chain_pr_create_refusal_alert.py -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC5"]
  - id: "dod-omn26433-deploy-assessment"
    description: "Deploy assessment: the PR changes the duplicate guard's read of the ledger reader node and adds the pure compute node node_pr_create_refusal_alert_compute. No migration, no prod mutation, no new Kafka topic. The guard reaches the lab through the package install. The check reads the snapshot contract and fails when config.ledger_read is missing."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: "grep -q 'ledger_read:' src/omnimarket/nodes/node_pr_duplicate_snapshot_effect/contract.yaml"
        cwd: "."
  - id: "dod-omn26433-integration-proof"
    description: "The pushed head ran the guard's claims-read tests and the refusal alert tests on a lab host with its real installed dependencies and exited 0. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check."
    source: "manual"
    execution_scope: "local_done_gate"
    checks:
      - check_type: "command"
        check_value: "onex lab-work run --repo OmniNode-ai/omnimarket --sha \"$(git rev-parse HEAD)\" --lane dupguard-0330 -- uv run --frozen pytest tests/unit/handlers/scm/test_scm_duplicate_guard_reader_timeout.py tests/test_golden_chain_pr_create_refusal_alert.py -q --no-cov"
        cwd: "."
