schema_version: "1.0.0"
ticket_id: "OMN-21257"
title: "The OpenAI chat request sends max_tokens, so every gpt-5, gpt-6 and o-series model a developer chooses answers HTTP 400"
summary: "The catalogue row model gains token_limit_field (default max_tokens); the openai row declares max_completion_tokens; both chat-completion body builders (HandlerLlmDelegationCall._post_one_call and HandlerInferenceIntent._call_llm_on_resolved_model) take the field name from the row of the endpoint they post to, so an OpenAI request carries max_completion_tokens and every other endpoint keeps max_tokens; the openai row's comment no longer says gpt-5/o-series are excluded."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-openai-takes-max-completion-tokens"
    statement: |-
      The OpenAI chat request carries max_completion_tokens, and every other endpoint keeps max_tokens.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: requests to the byok-openai endpoint carry `max_completion_tokens`, never `max_tokens` -- falsifier: a handler test asserting the outbound body for provider openai
      - id: "AC2"
        statement: |-
          AC2: other OpenAI-style providers (openrouter, gemini, local) keep `max_tokens` -- falsifier: the same test per provider
      - id: "AC3"
        statement: |-
          AC3: the openai row's comment about excluding gpt-5/o-series is removed or updated
evidence_requirements:
  - kind: "tests"
    description: "The handler test asserts the outbound body for provider openai carries max_completion_tokens, and the same test per provider keeps max_tokens for openrouter, gemini and local."
    command: "uv run pytest tests/unit/delegation/test_omn21257_openai_max_completion_tokens.py -q -p no:randomly"
