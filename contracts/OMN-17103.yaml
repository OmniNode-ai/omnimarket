---
schema_version: "1.0.0"
ticket_id: "OMN-17103"
title: "Remaining model readers resolve their endpoints and models through the Bifrost contract"
summary: "Model policies, delegation tiers and thread replies resolve endpoint and model from the canonical Bifrost contract and overlay binding used by the bridge. Parked endpoints stay disabled despite legacy GLM and coder environment settings, and the cost demo reads cloud baseline model metadata from the same contract without issuing inference. Each acceptance criterion is bound to the pull request's own tests."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-bifrost-readers"
    statement: |-
      Every remaining model reader must take its endpoint and served model from the Bifrost contract and overlay binding, never from legacy environment variables.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: the policy contract decides the endpoint and model, and legacy environment settings cannot override a parked endpoint -- falsifier: uv run pytest tests/unit/test_remaining_bifrost_readers.py -q -k "policy_contract_decides_endpoint_and_model"
      - id: "AC2"
        statement: |-
          AC2: the cost demo uses contract model metadata even when the backend is parked -- falsifier: uv run pytest tests/unit/test_remaining_bifrost_readers.py -q -k "cost_demo_uses_contract_model_metadata_even_when_parked"
      - id: "AC3"
        statement: |-
          AC3: a bound overlay is used, and a broken contract binding raises instead of falling back to legacy environment -- falsifier: uv run pytest tests/unit/test_remaining_bifrost_readers.py -q -k "bound_overlay_is_used or broken_contract_raises"
evidence_requirements:
  - kind: "tests"
    description: "The remaining-reader, direct-caller, cost demo, delegation router, model policy and bridge loader tests."
    command: "uv run pytest tests/unit/test_remaining_bifrost_readers.py tests/unit/test_glm_direct_callers_omn20173.py tests/unit/test_cli_delegation_cost_demo.py tests/unit/test_bridge_config_loader.py -q"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-bifrost-readers-ac1"
    description: "The policy contract decides the endpoint and model."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/test_remaining_bifrost_readers.py -q -k \"policy_contract_decides_endpoint_and_model\""
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC1"]
  - id: "dod-bifrost-readers-ac2"
    description: "The cost demo uses contract model metadata even when parked."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/test_remaining_bifrost_readers.py -q -k \"cost_demo_uses_contract_model_metadata_even_when_parked\""
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC2"]
  - id: "dod-bifrost-readers-ac3"
    description: "A bound overlay is used and a broken contract binding raises."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/test_remaining_bifrost_readers.py -q -k \"bound_overlay_is_used or broken_contract_raises\""
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC3"]
