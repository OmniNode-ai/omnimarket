---
schema_version: "1.0.0"
ticket_id: OMN-24062
title: "Lane trace: label each tool call as ok, failed, refused or timed out"
summary: "A pure compute node labels one finished tool call ok, failed, refused or timeout and names the refusing component from refusal lines held in an overlay."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn24062-typed-tool-outcome
    statement: One finished tool call is classified as ok, failed, refused or timeout, a refusal names its component from the overlay's refusal lines, and every rule value comes from the overlay.
    acceptance:
      - id: AC1
        statement: 'AC1: the pure outcome rule classifies a finished tool call as ok, failed, refused or timeout and names the refusing component from the overlay''s refusal lines -- falsifier: pytest tests/unit/nodes/node_hook_tool_outcome_compute/test_tool_outcome_golden.py -q goes red when the rule table is emptied'
      - id: AC2
        statement: 'AC2: a refusal printed with exit code 0 reads as refused, a code-text line that merely starts with REFUSED_ reads ok, and a tool other than Bash is never read for refusals -- falsifier: pytest tests/unit/nodes/node_hook_tool_outcome_compute/test_tool_outcome_golden.py -k refus -q'
      - id: AC3
        statement: 'AC3: an absent or invalid overlay refuses with an error that names the setting, and the overlay example equals the shape the node reads -- falsifier: pytest tests/unit/nodes/node_hook_tool_outcome_compute/test_tool_outcome_errors.py tests/unit/nodes/node_hook_tool_outcome_compute/test_tool_outcome_overlay_seam.py -q'
      - id: AC4
        statement: 'AC4: integrated: on the running dev runtime, the stored output of one named lane''s calls is classified through the node and at least one stored refusal line reads back as refused with its component -- falsifier: the read of that lane''s calls returns outcome ok for a call whose stored output starts with a REFUSED line'
evidence_requirements:
  - kind: "tests"
    description: "Outcome node tests: golden chain, error chain, failing control (empty rules read a refusal as ok), command line chain, overlay seam"
    command: "uv run pytest tests/unit/nodes/node_hook_tool_outcome_compute -q --no-cov"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-omn24062-ac1
    description: "AC1: the golden chain tests pass at the head and fail at the merge base, where the node does not exist; with an empty rule table the golden refusals read ok (test_without_the_rules_a_refusal_reads_as_ok)."
    source: manual
    binds_ac: [AC1]
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/unit/nodes/node_hook_tool_outcome_compute/test_tool_outcome_golden.py -q -p no:randomly --no-cov"
        cwd: "."
  - id: dod-omn24062-ac2
    description: "AC2: the refusal cases (exit code 0, REFUSED_ code text, a non-Bash tool) pass at the head and fail at the merge base."
    source: manual
    binds_ac: [AC2]
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/unit/nodes/node_hook_tool_outcome_compute/test_tool_outcome_golden.py -k refus -q -p no:randomly --no-cov"
        cwd: "."
  - id: dod-omn24062-ac3
    description: "AC3: the error chain and overlay seam tests pass at the head and fail at the merge base."
    source: manual
    binds_ac: [AC3]
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/unit/nodes/node_hook_tool_outcome_compute/test_tool_outcome_errors.py tests/unit/nodes/node_hook_tool_outcome_compute/test_tool_outcome_overlay_seam.py -q -p no:randomly --no-cov"
        cwd: "."
  - id: dod-omn24062-ac4
    description: "hosted proxy for AC4: the command line chain and the overlay seam tests pass here; the reading of one lane's stored calls through the node on h051 is posted as a pull request comment naming the head."
    source: manual
    binds_ac: [AC4]
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/unit/nodes/node_hook_tool_outcome_compute/test_tool_outcome_cli.py tests/unit/nodes/node_hook_tool_outcome_compute/test_tool_outcome_overlay_seam.py -q -p no:randomly --no-cov"
        cwd: "."
  - id: dod-omn24062-integration-proof
    description: "The pushed head ran the outcome node tests on a lab host and exited 0. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check."
    source: manual
    execution_scope: "local_done_gate"
    checks:
      - check_type: command
        check_value: uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24062 -- uv run --frozen pytest tests/unit/nodes/node_hook_tool_outcome_compute -q -p no:randomly --no-cov
        cwd: "."
  - id: dod-omn24062-live-read
    description: "Through the node's command line, with the overlays clone's root named, a stored refusal line reads back as refused with its component."
    source: manual
    execution_scope: "local_done_gate"
    checks:
      - check_type: command
        check_value: >-
          bash -o pipefail -c 'printf "%s\n" "{\"id\":\"live\",\"request\":{\"tool_name\":\"Bash\",\"hook_event_name\":\"PostToolUse\",\"tool_response\":\"{\\\"stdout\\\":\\\"REFUSED factory-floor-publish: the required step failed\\\",\\\"stderr\\\":\\\"\\\",\\\"interrupted\\\":false}\",\"exit_code\":0}}" | ONEX_SKILL_OVERLAY_ROOTS="$OMNI_HOME/overlays/overlays" uv run --frozen python -m omnimarket.nodes.node_hook_tool_outcome_compute | grep -F refused | grep -F factory-floor-publish'
        cwd: "."
  - id: dod-omn24062-deploy-hosted-probe
    description: "Deploy probe the hosted runner can run: the handler GitHub serves at the checked-out commit defines the outcome node's handler class, which the merge base does not. The node's command line chain also runs from a fresh frozen sync of this head."
    source: manual
    binds_ac: [AC3]
    checks:
      - check_type: command
        check_value: |-
          bash -o pipefail -c 'gh api "repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_hook_tool_outcome_compute/handlers/handler_hook_tool_outcome.py?ref=$(git rev-parse HEAD)" --jq .content | base64 -d | grep -F "class HandlerHookToolOutcome" > /dev/null'
        cwd: "."
      - check_type: test_passes
        check_value: "env ONEX_DEPLOY_PROBE=OMN-24062 uv run --frozen pytest tests/unit/nodes/node_hook_tool_outcome_compute/test_tool_outcome_cli.py -q -p no:randomly --no-cov"
        cwd: "."
