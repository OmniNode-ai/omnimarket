  description: AC1-AC4 tests.
  command: uv run --frozen pytest -q --no-cov tests/unit/nodes/node_onex_setup_effect/test_onex_tui_speed.py tests/ci/test_omninode_onex_install_sh_omn25070.py
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
