- id: dod-omn26611-ac5
  description: 'AC5: before and after open times for /config, /model, /delegation and /dashboard on a clean Mac install, measured with `uv run pytest -s -n 0 tests/unit/nodes/node_onex_setup_effect/test_onex_tui_speed.py -k opens_in_under_one_second` (it prints each tab''s shown and settled seconds), are recorded beside this contract (contracts/evidence/OMN-26611/clean-mac-timings.json, the same figures as the ticket comment). Read back at the local Done gate; it fails until the Mac run is recorded.'
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: "env PYTHONDONTWRITEBYTECODE=1 uv run --frozen python - <<'READBACK'\nimport json\nimport platform\nfrom pathlib import Path\n\n# The before and after open times from a clean Mac install, read back from the\n# record committed beside this contract. Absent until that run is recorded, so\n# the local Done gate fails without it.\nrecord = json.loads(Path('contracts/evidence/OMN-26611/clean-mac-timings.json').read_text())\nassert record['platform'] == 'Darwin', record['platform']\nfor tab in ('config', 'model', 'delegation', 'dashboard'):\n    before, after = record['before'][tab], record['after'][tab]\n    assert before > 2.0, (tab, before)\n    assert after < 1.0, (tab, after)\nprint('OMN-26611 AC5: clean Mac before and after open times recorded for four tabs')\nREADBACK"
    cwd: .
  binds_ac:
  - AC5
- id: dod-omn26611-integration-proof
  description: Run the OMN-26611 test files and the changed TUI tests on a lab host at the pushed revision. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-26611 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/nodes/node_onex_setup_effect/test_onex_tui_speed.py tests/ci/test_omninode_onex_install_sh_omn25070.py tests/unit/nodes/node_onex_setup_effect/test_onex_tui_local_servers.py tests/unit/nodes/node_onex_setup_effect/test_onex_tui.py tests/unit/nodes/node_onex_setup_effect/test_onex_command_cancel.py -m 'not e2e' -q -n 0 --no-cov --refuse-skips
    cwd: .
