schema_version: 1.0.0
ticket_id: OMN-26611
title: The onex TUI answers every action in under 1 second and always shows that it is working
summary: TUI actions run read and setup commands inside the running TUI instead of starting a new onex program; every wait shows a spinner with its step name and Esc cancels; the model list opens from saved data and refreshes in the background; the installer shows progress during its silent steps. AC5 (before and after timings on a clean Mac install, recorded on the ticket) is a disposition at the local Done gate.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn26611-ac1
  statement: TUI actions run the command inside the already-running TUI instead of starting a new onex program, so /config, /model, /delegation and /dashboard each open in under 1 second (over 2 seconds on dev).
  acceptance:
  - id: AC1
    statement: 'AC1: TUI actions run the command inside the already-running TUI instead of starting a new onex program, so /config, /model, /delegation and /dashboard each open in under 1 second (over 2 seconds on dev). falsifier: uv run pytest -q tests/unit/nodes/node_onex_setup_effect/test_onex_tui_speed.py -k ''runs_its_commands_in_the_running_tui or opens_in_under_one_second'''
- id: req-omn26611-ac2
  statement: Any action that waits on the network or a model shows a spinner and what it is doing within 0.2 seconds, with Esc to cancel.
  acceptance:
  - id: AC2
    statement: 'AC2: Any action that waits on the network or a model shows a spinner and what it is doing within 0.2 seconds, with Esc to cancel. falsifier: uv run pytest -q tests/unit/nodes/node_onex_setup_effect/test_onex_tui_speed.py -k ''spinner'''
- id: req-omn26611-ac3
  statement: The model list opens from saved data at once and refreshes in the background.
  acceptance:
  - id: AC3
    statement: 'AC3: The model list opens from saved data at once and refreshes in the background. falsifier: uv run pytest -q tests/unit/nodes/node_onex_setup_effect/test_onex_tui_speed.py -k saved_data'
- id: req-omn26611-ac4
  statement: The installer shows a spinner with a plain step name during every silent step longer than 1 second.
  acceptance:
  - id: AC4
    statement: 'AC4: The installer shows a spinner with a plain step name during every silent step longer than 1 second. falsifier: uv run pytest -q tests/ci/test_omninode_onex_install_sh_omn25070.py -k ''silent_step or uv_download or quick_steps'''
- id: req-omn26611-ac5
  statement: Before and after timings measured on a clean Mac install are recorded on the ticket.
  acceptance:
  - id: AC5
    statement: 'AC5: before and after timings measured on a clean Mac install are recorded on the ticket -- falsifier: the readback of contracts/evidence/OMN-26611/clean-mac-timings.json fails when it is absent or any tab''s after time is 1 second or more.'
