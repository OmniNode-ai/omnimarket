    description: "AC1: the recorded fixture carries the OCC sha and the generating command and covers the whole differential."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/nodes/node_dod_verify/test_omn_15390_contract_entry_supersession.py -q -p no:randomly -k test_the_recorded_occ_verdicts_carry_their_provenance"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC1"]
  - id: "dod-omn20938-ac2-differential-discriminates"
