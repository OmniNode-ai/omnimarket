  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/ci/test_sibling_core_pin_pair_omn17427.py tests/ci/test_infra_pin_aa87c2dd6abe_work_contracts_omn23865.py -q -n 0 --no-cov -p no:cacheprovider
    cwd: .
- id: dod-omn24079-ac2
  description: The seam test passes on the new pin; its pin check fails on a core older than omnibase_core#2316.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/delegation/test_omn24039_task_class_seam.py -q -n 0 --no-cov -p no:cacheprovider
    cwd: .
- id: dod-omn24079-ac3
  description: The tests behind the integrated reading pass at the head; the reading itself (a reasoning call over 120 s finishing in the dev runtime) needs this change rolled on dev and is the pull request's Lab line; hosted CI cannot reach it.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/delegation/test_omn24039_task_class_seam.py tests/unit/delegation/test_inference_call_ceiling_overlay.py -q -n 0 --no-cov -p no:cacheprovider
    cwd: .
- id: dod-omn24079-integration-proof
  description: The seam test and the two pin tests run on a lab host at the pushed head through the lab work node. The reading on the running dev runtime (a reasoning call over 120 s) is the pull request's Lab line; hosted CI cannot reach it.
