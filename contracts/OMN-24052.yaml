schema_version: 1.0.0
ticket_id: OMN-24052
title: The settings store projection runs in the shared services and reads and writes the main broker
summary: The overlay store reader node_overlay_store_read_effect read the projection's snapshot topic from the one broker its overlay names, while the projection node now runs in the dev runtime, which listens on the dev broker only. The reader overlay gains an optional snapshot_bus_lane that names the lane the snapshot is read from; the reader's own readings, fleet record and fleet projection stay on the broker the overlay names today, where the floor reads them. Without the key the reader behaves exactly as before, and the key is refused for a backend with no bus. The overlay with the values, the loader's move to the dev lane and the broker rows for the lab host logins are a separate pull request in the overlays repository, held as a draft until this code is on dev.
is_seam_ticket: true
interface_change: true
interfaces_touched:
- topics
- public_api
requirements:
- id: req-omn24052-snapshot-bus-lane
  statement: The reader reads the projection's snapshot topic from the bus lane its overlay names in snapshot_bus_lane and keeps every other publish and read on the broker it names today.
  acceptance:
  - id: AC1
    statement: 'AC1: the overlay store reader reads the projection snapshot from the bus lane its overlay names in snapshot_bus_lane and keeps its readings, fleet record and fleet projection on the broker it names today -- falsifier: uv run pytest tests/unit/nodes/node_overlay_store/test_snapshot_bus_lane.py -q -n 0 --no-cov fails when the reader opens the old broker for the snapshot'
  - id: AC2
    statement: 'AC2: an overlay without snapshot_bus_lane reads exactly as before, and a lane name given with no broker backend is refused -- falsifier: uv run pytest tests/unit/nodes/node_overlay_store/test_snapshot_bus_lane.py -q -n 0 --no-cov -k "absent or refused"'
  - id: AC3
    statement: 'AC3: the loader publish topic, the projection subscribe and publish topics and the reader snapshot topic are the same names, and a snapshot lane that refuses ends in a reading reported on the store broker -- falsifier: uv run pytest tests/unit/nodes/node_overlay_store/test_snapshot_bus_lane.py -q -n 0 --no-cov -k "seam or error_chain"'
  - id: AC4
    statement: 'AC4: integrated: after the merge reaches the running runtime and one loader tick, the projection consumer group on the dev broker has a member and lag 0 -- falsifier: the group shows no member or a lag above 0 after the tick'
  - id: AC5
    statement: 'AC5: integrated: after the same tick every overlay in the store on h053 has a loaded_at stamp under one hour old and the lab_hosts snapshot shows h106 available false -- falsifier: any stamp older than one hour, or h106 without available false, on h053 after the tick'
- id: req-omn24052-store-unit-workspace-root
  statement: The installer units overlay-store-load-systemd, overlay-store-refresh-systemd and overlay-store-refresh carry OMNIBASE_PATH and ONEX_WORKSPACE_CONFIG_ROOT in their environment so the overlay's bus lane declaration can be located.
  acceptance:
  - id: AC6
    statement: 'AC6: the three store units carry the workspace root in their environment -- falsifier: uv run pytest tests/nodes/node_host_installer_registry_units/test_overlay_store_load_unit.py -q -n 0 --no-cov -k workspace_root fails when the contract change is removed'
evidence_requirements:
- kind: tests
  description: The overlay store tests pass at the pushed head.
  command: uv run pytest tests/unit/nodes/node_overlay_store -q -n 0 --no-cov -p no:cacheprovider
emergency_bypass:
