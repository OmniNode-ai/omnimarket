- id: dod-omn24052-settings-store-provision
  description: 'the dev settings store is declared and provisioned by a node: a lane the contract does not declare and a role outside the writer are refused before any secret read or Valkey call, the writer password is generated create-only into the secret store and never appears in a result or log, the writer row is applied and the login is checked on the store database, a second run changes nothing, a database held by another user and a login holding another password are refused, and a stale row that accepts the stored password is applied again.'
  source: manual
