  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest src/omnimarket/nodes/node_floor_fill_candidates_compute -q --no-cov --tb=line -k fixture_verdicts
    cwd: .
- id: dod-omn22199-ac2
