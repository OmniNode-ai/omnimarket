schema_version: 1.0.0
ticket_id: OMN-22199
title: 'node_floor_fill_candidates_compute: a pure node names, per factory-floor line, the next startable task from the published floor record, whatever the line''s pill says'
summary: A new pure compute node reads the published floor record and, per line, names the ready tasks a lane may be started for (STARTABLE, NEEDS-TICKET, UNTICKETABLE with a cause), AT-CAPACITY, NO-STARTABLE, or one global FLOOR-UNREAD; the pill is never read.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn22199-floor-fill-candidates
  statement: The stopped-line fill has no node that names, per line, the ready tasks whatever the line's pill says.
  acceptance:
  - id: AC1
    statement: 'AC1: On the 10:40Z fixture with every ticket input `usable`, the node returns `STARTABLE` for all six lines, each carrying all its ready tasks in record order (the first is the line''s next task; both pinned in the test), because a line''s cause does not make its ready tasks unstartable; with no entry tickets and every payload verdict ok it returns `NEEDS-TICKET` for the same tasks -- falsifier: `-k fixture_verdicts` asserts both exact tables.'
  - id: AC2
    statement: 'AC2: The pill never changes a verdict: the same line with the pill rewritten to `building`, `stopped` and `queued` returns the same verdict -- falsifier: parametrized over the three pills.'
  - id: AC3
    statement: 'AC3: A task with an open PR, or whose key is held by a `RESERVED` or windowed `SENT` entry, is never returned, and the next ready task is returned while the line has capacity left (with capacity used up the line is `AT-CAPACITY` and none is) -- falsifier: fixture with `prs` on `T0.2` and an entry for `T0.1`, with `max_fill_lanes_per_line` 2 and 1.'
  - id: AC4
    statement: 'AC4: A stale, absent or malformed record returns the one global `FLOOR-UNREAD` verdict and zero candidates, never an empty backlog -- falsifier: three cases, a record aged `max_age_minutes + 1`, none, and invalid JSON.'
  - id: AC5
    statement: 'AC5: Each `UNTICKETABLE` cause is its own verdict and never a send, and the node holds no ticket id and no umbrella list of its own -- falsifier: `-k dispatch_verdicts` (one fixture per cause) and `cd omnimarket && d=src/omnimarket/nodes/node_floor_fill_candidates_compute && test -d "$d" && { grep -rnE ''OMN-[0-9]+'' "$d" --include=''*.py''; [ $? -eq 1 ]; }` exits 0.'
  - id: AC6
    statement: 'AC6: Capacity is net of entries: with `max_fill_lanes_per_line = 2` and one capacity-consuming entry (`RESERVED`, or `SENT` and not ended) on a line the line is not at capacity and every ready usable task is returned, with two it is `AT-CAPACITY` and none is, and an ended entry consumes none; with `= 1`, three ready tasks and a first that is `UNTICKETABLE`, both other tasks are returned (no cutoff) and the first is listed beside them -- falsifier: `-k capacity_net_of_entries` and `-k no_cutoff_by_capacity`.'
  - id: AC7
    statement: 'AC7: Same input twice returns byte-identical output -- falsifier: run twice, compare `model_dump_json`.'
  - id: AC8
    statement: 'AC8: G-NODE holds, and the fixture scenario gives equal decision projections on the in-memory and Redpanda legs -- falsifier: `-k floor_fill_candidates_parity` with the Redpanda receipt in the PR body.'
  - id: AC9
    statement: 'AC9: the task''s lab step has been run and its output is in the pull request''s Lab line (host, command, exit code, observation), or the step is none for a pure node -- falsifier: handoff_row.sh (the pr-handoff lab-line check) accepts the pull request at its live head, and uv run pytest over the task''s focused command exits 0 on a lab host through lab-run'
evidence_requirements:
- kind: tests
  description: The node's focused suite.
  command: uv run pytest src/omnimarket/nodes/node_floor_fill_candidates_compute -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
