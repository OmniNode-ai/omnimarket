    check_value: 'bash -o pipefail -c ''gh api "repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_floor_fill_candidates_compute/contract.yaml?ref=$(git rev-parse HEAD)" --jq .content | base64 -d | grep -F "name: node_floor_fill_candidates_compute" > /dev/null'''
    cwd: .
- id: dod-omn22199-integration-proof
  description: The pushed head ran the node's tests, the Redpanda parity leg included, on a lab host through the bus and exited 0. Hosted CI cannot reach the lab broker, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane slf-t1-1102 -- uv run --frozen pytest src/omnimarket/nodes/node_floor_fill_candidates_compute -q --no-cov
    cwd: .
