  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/nodes/node_dev_roll_failure_capture_effect/test_golden_chain_dev_roll_failure_capture.py tests/unit/nodes/node_dev_roll_failure_capture_effect/test_error_chain_dev_roll_failure_capture.py -q --no-cov -p no:cacheprovider
    cwd: .
