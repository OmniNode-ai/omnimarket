schema_version: 1.0.0
ticket_id: OMN-24071
title: The roll failure capture node carries the incident's failed phase into the roll terminal, and its incident model is read against the deploy agent's own
summary: 'Child of OMN-24048. The deploy agent (omnibase_infra#5924) publishes the dev roll incident with a new optional failed_phase field (preflight when the roll failed before the boot guard existed). node_dev_roll_failure_capture_effect now reads failed_phase on its tolerant incident model and carries it into the typed roll terminal, for a recovered, an unrecovered and an unknown terminal alike; an incident without the field reads as before. The seam test no longer relies only on a field list spelled in this repository: it imports the deploy agent''s own incident model from the pinned omnibase-infra and requires its field set to equal the capture node''s incident model, so a field added, dropped or renamed on either side fails a test. The omnibase-infra pin moves to the dev tag that carries failed_phase.'
is_seam_ticket: true
interface_change: true
interfaces_touched:
- topics
- public_api
requirements:
- id: req-omn24071-failed-phase
  statement: The failed phase of a failed dev roll reaches the typed roll terminal, and the two incident models are one description.
  acceptance:
  - id: AC1
    statement: 'AC1: the capture node reads the incident''s failed_phase and carries it into the typed roll terminal, for a recovered, an unrecovered and an unknown (issuer missing) terminal alike -- falsifier: a preflight incident with failed_phase set yields a terminal whose failed_phase is empty'
  - id: AC2
    statement: 'AC2: the capture node''s incident model and the deploy agent''s incident model are one description: a seam test compares their field sets and fails when either side adds, drops or renames a field -- falsifier: renaming failed_phase on either side leaves the seam tests green'
  - id: AC3
    statement: 'AC3: an incident without failed_phase reads as before, with an empty failed_phase on its terminal -- falsifier: an old-shape incident raises or yields a changed outcome'
- id: req-omn24071-integrated
  statement: The failed phase is read on the terminal from the running dev runtime.
  acceptance:
  - id: AC4
    statement: 'AC4: integrated: after the capture node and the deploy agent with these changes run on the dev runtime, a dev roll that fails its preflight (or a recorded fixture roll) shows a terminal carrying the issuer and failed_phase on the dev bus lane -- falsifier: a dev roll fails in preflight after both run and the dev bus lane carries no terminal naming the failed phase'
evidence_requirements:
- kind: tests
  description: The node's handler, golden chain, error chain and seam tests pass at the pushed head; the seam test fails when failed_phase is removed from the capture node's incident model.
  command: uv run --frozen pytest tests/unit/nodes/node_dev_roll_failure_capture_effect -q --no-cov -p no:cacheprovider
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
