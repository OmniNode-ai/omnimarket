schema_version: 1.0.0
ticket_id: OMN-22337
title: 'T18c group 3: serve GET /v1/plans and GET /v1/usage/privileges from runtime catalog nodes'
summary: >
  Two public catalog reads move from the hosted onex-api into the runtime as one
  node each, node_plan_list and node_usage_privileges, each with its own contract
  and a contract-declared HTTP mount on the narrowest prefix (the route path). The
  plan route is anonymous; the privileges route refuses every request before any
  catalog read unless a caller-identity resolver bound by DI resolves a tenant. The
  recorded replay (AC3) is pending on the T18b corpus; no caller is switched and the
  onex-api container is untouched.
is_seam_ticket: false
interface_change: true
interfaces_touched: [public_api, protocols]
requirements:
  - id: catalog-routes-in-runtime
    statement: Serve the two catalog reads from runtime nodes through contract-declared HTTP mounts.
    acceptance:
      - id: AC1
        statement: 'AC1: GET /v1/plans and GET /v1/usage/privileges are each answered by the runtime through a contract-declared http_mount, one node contract per route, and the moved onex-api tests for both routes pass under the in-memory and the Redpanda profile -- falsifier: uv run pytest over the two new node test directories in both profiles, run on a lab host through lab-run'
      - id: AC2
        statement: 'AC2: GET /v1/usage/privileges refuses a caller with no resolved identity, and also when no identity resolver is bound, before any catalog read, while GET /v1/plans answers an anonymous caller -- falsifier: a pytest case on the mounted app that fails unless the unauthenticated privileges request is refused with no repository call and the anonymous plans request succeeds'
      - id: AC3
        statement: 'AC3: the T18b fixture subset for these two method-and-path identities replays against the mounted app with no unmasked difference -- falsifier: a pytest replay test that reads the T18b corpus (OMN-22158) for the two identities and fails on any unmasked difference'
evidence_requirements:
  - kind: tests
    description: Route behaviour, fail-closed refusals and the real runtime mount for both nodes.
    command: uv run --frozen pytest tests/nodes/node_plan_list tests/nodes/node_usage_privileges -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: catalog-http-in-memory
    description: >
      Both nodes' ported route tests and the real runtime mount (the contract
      discovery, the mount bridge, the typed handlers) on the in-memory profile.
    source: manual
    binds_ac: [AC1]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/nodes/node_plan_list tests/nodes/node_usage_privileges -q --no-cov
        cwd: .
  - id: catalog-http-redpanda
    description: >
      The same two test directories with the runtime pointed at an isolated
      auth-required Redpanda broker through the existing harness. Hosted CI runs
      this leg in the customer-path job.
    source: manual
    binds_ac: [AC1]
    checks:
      - check_type: test_passes
        check_value: env ONEX_CATALOG_HTTP_TEST_PROFILE=redpanda uv run --frozen pytest tests/nodes/node_plan_list/test_http_runtime_profiles.py tests/nodes/node_usage_privileges/test_http_runtime_profiles.py -q --no-cov --refuse-skips
        cwd: .
  - id: privileges-fails-closed
    description: >
      The unauthenticated, unresolved and unbound privileges requests are refused
      with no repository call, and the anonymous plans request succeeds.
    source: manual
    binds_ac: [AC2]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/nodes/node_usage_privileges/test_fail_closed.py -q --no-cov --refuse-skips
        cwd: .
  - id: t18b-replay-machinery
    description: >
      AC3 is OPEN. The T18b corpus (OMN-22158) is not recorded yet, so no replay
      against recorded pairs has run. This hosted prerequisite runs the replay
      reader on a synthetic corpus with skips refused: it proves the replay tests
      compare, fail on an unmasked difference and refuse a missing corpus, and it
      does not prove AC3. t18b-replay-pending is the local Done check that closes it.
    source: manual
    binds_ac: [AC3]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/nodes/node_plan_list/test_replay_reader.py tests/nodes/node_usage_privileges/test_replay_reader.py -q --no-cov --refuse-skips
        cwd: .
  - id: t18b-replay-pending
    description: >
      AC3 is OPEN. The T18b corpus (OMN-22158) is not recorded yet. This check
      runs the replay tests with skips refused, so it fails while the corpus
      location is unset or holds neither identity and passes only once pairs are
      present and replay with no unmasked difference. It is a local Done gate and
      is unbound because the hosted runner has no corpus and never runs it;
      t18b-replay-machinery binds the hosted prerequisite.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/nodes/node_plan_list/test_t18b_replay.py tests/nodes/node_usage_privileges/test_t18b_replay.py -q --no-cov --refuse-skips
        cwd: .
  - id: catalog-integration-proof
    description: >
      The pushed head ran both node test directories on a lab host through the
      bus and exited 0; the Redpanda profile leg runs the same way with
      ONEX_CATALOG_HTTP_TEST_PROFILE=redpanda. Hosted CI cannot reach the lab, so
      only the local Done gate runs this check.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: >-
          uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane t18c-g3-resume-1415 -- uv run --frozen pytest tests/nodes/node_plan_list tests/nodes/node_usage_privileges -q --no-cov
        cwd: .
  - id: catalog-published-source-probe
    description: >
      Hosted deploy check of the published source at this checkout's exact commit:
      both contracts declare their narrow mount prefix and both handlers exist. It
      checks the published artifact and does not attest a running deployment.
    source: manual
    checks:
      - check_type: command
        check_value: |-
          set -euo pipefail;
          probe_dir=$(mktemp -d);
          trap 'rm -rf "$probe_dir"' EXIT;
          root="https://raw.githubusercontent.com/OmniNode-ai/omnimarket/$(git rev-parse HEAD)/src/omnimarket/nodes";
          curl --fail --silent --show-error --location --max-time 30 "$root/node_plan_list/contract.yaml" --output "$probe_dir/plans.yaml";
          curl --fail --silent --show-error --location --max-time 30 "$root/node_usage_privileges/contract.yaml" --output "$probe_dir/privileges.yaml";
          grep -q 'path_prefix: "/v1/plans"' "$probe_dir/plans.yaml";
          grep -q 'path_prefix: "/v1/usage/privileges"' "$probe_dir/privileges.yaml"
        cwd: .
