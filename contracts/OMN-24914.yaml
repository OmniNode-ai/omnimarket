    check_value: "bash -c 'onex scm pr-checks OmniNode-ai/omnimarket#6204 | grep \"^{\\\"verb\\\"\" | python3 -c \"import sys,json; r=json.loads(sys.stdin.read())[\\\"result\\\"]; sys.exit(0 if not r[\\\"red\\\"] and not r[\\\"pending\\\"] else 1)\"'"
