---
schema_version: "1.0.0"
ticket_id: "OMN-16987"
title: "Provider-rung liveness canary effect node (omnimarket node slice)"
summary: "An effect node, node_provider_rung_canary_effect, sends one authenticated minimal chat completion per credentialed cloud rung of the merged bifrost delegation contract and returns a typed verdict per declared backend: LIVE, AUTH_DEAD, QUOTA_DEAD, UNREACHABLE, UNRESOLVED, PROTOCOL_ERROR, HTTP_ERROR, PROBE_ERROR or SKIPPED_NO_ENDPOINT, SKIPPED_NO_SECRET_REF, SKIPPED_SUPPRESSED. A key reference that does not resolve sends nothing; a z.ai 1310 that states its reset instant suppresses the backend until then; each probed endpoint also gets a deliberately invalid key that must read AUTH_DEAD. The result carries key names and verdicts only. The onex skill mapping row for provider_rung_canary, the thin scheduled workflow over it, the PR-time test pinning the workflow to the mapping and entry point, and the live dispatch table belong to omnibase_infra and are not in this slice."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-provider-rung-canary-node"
    statement: "The canary node of OMN-16987: probe, grade, suppress, and never leak a key."
    acceptance:
      - id: "AC1"
        statement: "AC1: N backends with endpoint_url and secret_ref give exactly N probed verdicts -- falsifier: a credentialed backend with no verdict or two."
      - id: "AC2"
        statement: "AC2: fake transport 200/401/429/connect-error/non-chat body maps to LIVE/AUTH_DEAD/QUOTA_DEAD/UNREACHABLE/PROTOCOL_ERROR -- falsifier: a status mapped to another verdict."
      - id: "AC3"
        statement: "AC3: an unresolvable secret_ref gives UNRESOLVED and no HTTP request -- falsifier: a request recorded for an unresolved ref."
      - id: "AC4"
        statement: "AC4: no key material in any verdict, log or summary -- falsifier: a sentinel key found in the result, summary table or captured log."
      - id: "AC5"
        statement: "AC5: z.ai 1310 vs 1113 are distinguished, and 1310 with a reset instant suppresses the re-probe in the window -- falsifier: a request sent inside the window, or 1113 suppressed."
evidence_requirements:
  - kind: "tests"
    description: "AC1 to AC5 in the node tests and the golden chain."
    command: "uv run pytest tests/nodes/node_provider_rung_canary_effect tests/test_golden_chain_provider_rung_canary_effect.py -q -p no:randomly --no-cov"
emergency_bypass:
