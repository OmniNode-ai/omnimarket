  - id: "dod-omn16987-contract"
    description: "The contract resolves its handler and models, declares one command and one terminal event, and the node is an onex.nodes entry point."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/test_golden_chain_provider_rung_canary_effect.py -q -p no:randomly --no-cov"
  - id: "dod-omn16987-deploy-hosted-unresolved"
    description: "Hosted deploy probe. The hosted runner runs uv run --frozen --no-dev in the checkout and drives the product handler over the committed contract with one endpoint set, a resolver that returns nothing and a transport that fails the run if called; it asserts the backend reads UNRESOLVED and no request was sent. It fails at the merge base, which has no such handler. The hosted runner can run it; no lab route is required."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: |-
          uv run --frozen --no-dev python -c '
          import asyncio, yaml, tempfile, pathlib
          from omnimarket.nodes.node_provider_rung_canary_effect.handlers import HandlerProviderRungCanary as H
          from omnimarket.nodes.node_provider_rung_canary_effect.models import ModelProviderRungCanaryRequest as R
          src = pathlib.Path("src/omnimarket/configs/bifrost_delegation.yaml")
          d = yaml.safe_load(src.read_text())
          for b in d["backends"]:
              b["endpoint_url"] = "https://openrouter.ai/api/v1/chat/completions" if b["backend_id"] == "openrouter-nemotron-ultra" else None
          p = pathlib.Path(tempfile.mkdtemp()) / "c.yaml"
          p.write_text(yaml.safe_dump(d))
          async def none(ref, env): return None
          def boom(*a): raise SystemExit("request sent for an unresolved ref")
          r = asyncio.run(H(none, boom).handle(R(contract_path=str(p))))
          v = {x.backend_id: x.verdict.value for x in r.rungs}
          assert v["openrouter-nemotron-ultra"] == "UNRESOLVED" and sum(1 for x in r.rungs if x.probed) == 1, v
          print(v["openrouter-nemotron-ultra"], len(r.rungs))'
  - id: "dod-omn16987-deploy-container-smoke"
    description: "Hosted deploy probe: a disposable container mounts the checked-out source read-only and checks that the canary handler class, its UNRESOLVED verdict branch, the UNRESOLVED enum member and the onex.nodes entry point are present. The probe is absent at the merge base and present at the head. A container that installed the package and ran the handler exceeded the verifier's 30 second per-check budget on a hosted runner, so the behavioural proof that an unresolved secret reads UNRESOLVED with no request sent stays in dod-omn16987-deploy-hosted-unresolved and dod-omn16987-ac3."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: |-
          sh -c 'docker run --rm -v "${PWD}:/workspace:ro" -w /workspace postgres:16-alpine sh -c "set -eu; d=src/omnimarket/nodes/node_provider_rung_canary_effect; grep -Fq \"class HandlerProviderRungCanary\" \$d/handlers/handler_provider_rung_canary.py; grep -Fq \"verdict=V.UNRESOLVED\" \$d/handlers/handler_provider_rung_canary.py; grep -Fq \"UNRESOLVED = \" \$d/models/model_provider_rung_canary.py; grep -Fq \"node_provider_rung_canary_effect = \" pyproject.toml"'
