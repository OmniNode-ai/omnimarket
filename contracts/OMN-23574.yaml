schema_version: 1.0.0
ticket_id: OMN-23574
title: 'Landing units install: start check uses the unit''s own settings and the snapshot unit''s settings-file path follows the overlay roots'
summary: The host installer registry node runs a unit's start check with the environment the unit will be rendered with (the request's path overrides applied) instead of the installing shell's, and the landing-snapshot-cutover unit's overlay file path resolves from the first of the unit's own overlay roots, so one overlay-root override corrects both. Nothing here changes what a unit runs or writes.
is_seam_ticket: true
interface_change: true
interfaces_touched:
- public_api
requirements:
- id: req-omn23574-installer-start-check
  statement: A unit whose overlay root comes only from the install request installs, and the cutover snapshot unit's overlay file follows that root.
  acceptance:
  - id: AC1
    statement: 'AC1: the host installer registry node''s start check runs with the rendered unit''s environment, the request''s path overrides applied -- falsifier: a unit whose overlay root comes only from the request override is refused at the merge base and passes with the change'
  - id: AC2
    statement: 'AC2: the cutover snapshot unit''s overlay file path is derived from the same overlay roots the unit carries, so one overlay-root override corrects both -- falsifier: the render test with the overlay-root override at the merge base still names the path under the registry root'
  - id: AC3
    statement: 'AC3: a seam test fails when the installer''s request or result model changes shape -- falsifier: the test with one request field renamed'
  - id: AC4
    statement: 'AC4: integrated: one unit is installed on a lab host through the fixed installer from a shell without the overlay root in its environment and observed running -- falsifier: the same install at the merge base ends overlay_refused'
evidence_requirements:
- kind: tests
  description: The start check environment, the overlay root placeholder and the installer seam tests
  command: uv run --frozen pytest tests/nodes/node_host_installer_registry_units/test_start_check_environment.py tests/nodes/node_host_installer_registry_units/test_installer_seam.py tests/nodes/node_host_installer_registry_units/test_landing_cutover_units.py -q --no-cov -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23574-start-check
  description: The start check of a launchd and a systemd unit runs through env with exactly the variables the rendered unit carries; a proof without the unit's overlay roots is refused.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_host_installer_registry_units/test_start_check_environment.py -q --no-cov -p no:randomly
    cwd: .
- id: dod-omn23574-overlay-root
  description: The cutover snapshot unit renders its overlay file from the first root of the effective overlay roots, and a unit with no overlay roots refuses the unfilled placeholder.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_host_installer_registry_units/test_start_check_environment.py tests/nodes/node_host_installer_registry_units/test_landing_cutover_units.py -q --no-cov -p no:randomly -k "overlay"
    cwd: .
- id: dod-omn23574-seam
  description: The request and result fields, the contract topics and the environment names the cutover units declare against their nodes are pinned.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_host_installer_registry_units/test_installer_seam.py -q --no-cov -p no:randomly
    cwd: .
- id: dod-omn23574-integration-hosted
  description: 'Integrated, hosted proxy for AC4: an install whose overlay root comes only from the request override reaches its start check with that root and succeeds. At the merge base the proof carries no unit environment, so the control fails there. The install on a lab host is the unbound local item below.'
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_host_installer_registry_units/test_start_check_environment.py -q --no-cov -p no:randomly -k "start_check_runs_with_the_environment"
    cwd: .
- id: dod-omn23574-integration-proof-lab
  description: 'Integrated: on a lab host the fixed installer, run from a shell that holds no ONEX_SKILL_OVERLAY_ROOTS, installs a unit whose overlay root comes only from the request override and the unit''s next tick is read. Hosted CI cannot reach a lab host, so only the local Done gate runs this unbound item; the hosted proxy above binds AC4.'
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: 'env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23574 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_host_installer_registry_units/test_start_check_environment.py -q --no-cov -p no:randomly'
    cwd: .
