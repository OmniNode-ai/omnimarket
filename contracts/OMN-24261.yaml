schema_version: 1.0.0
ticket_id: OMN-24261
title: The lab fill picker is listed so the dev runtime loads it
summary: node_lab_fill_selection_compute lives in omnimarket with a contract but carried no onex.nodes entry point, so the dev runtime image never discovered it. Its request and result models become typed pydantic models, its contract declares a typed local invocation (the shape the runtime dogfood audit accepts), the entry point is added, it leaves the expected-missing set of the dogfood audit, and the batch-1 entry point test names it.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24261-entry-point
  statement: node_lab_fill_selection_compute is registered under onex.nodes in the omnimarket package metadata and declares a typed local invocation, so the runtime image build discovers it and the runtime dogfood audit accepts it.
  acceptance:
  - id: AC1
    statement: 'AC1: node_lab_fill_selection_compute is listed under the onex.nodes entry points of the omnimarket package and declares a typed local invocation the runtime dogfood audit accepts -- falsifier: with its entry removed from pyproject.toml, uv run pytest tests/test_entry_points_node_move_batch1.py -n 0 --no-cov fails on that node'
  - id: AC2
    statement: 'AC2: the runtime dogfood audit reports zero failures with the node listed and no longer expected-missing -- falsifier: with its model reverted to a dataclass, uv run pytest tests/test_entry_points_node_move_batch1.py -n 0 --no-cov fails the local invocation check'
  - id: AC3
    statement: 'AC3: integrated: after the dev runtime rolls to a tag at or past the merge, its node registry lists node_lab_fill_selection_compute -- falsifier: the dev runtime registry read, taken after the roll, lacks the name'
evidence_requirements:
- kind: tests
  description: The entry point, dogfood audit and lab fill selection tests pass at the pushed head.
  command: uv run pytest tests/test_entry_points_node_move_batch1.py tests/test_market_node_runtime_dogfood.py tests/nodes/node_lab_fill_selection_compute -q -n 0 --no-cov -p no:cacheprovider
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24261-ac1
  description: 'AC1: the entry point test passes at the head and fails on a pyproject.toml without the entry.'
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/test_entry_points_node_move_batch1.py -q -n 0 --no-cov -p no:cacheprovider
    cwd: .
- id: dod-omn24261-ac2
  description: 'AC2: the local invocation test, the runtime dogfood audit and the lab fill selection node tests pass at the head.'
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/test_entry_points_node_move_batch1.py tests/test_market_node_runtime_dogfood.py tests/nodes/node_lab_fill_selection_compute -q -n 0 --no-cov -p no:cacheprovider
    cwd: .
- id: dod-omn24261-ac3
  description: 'hosted proxy for AC3: the entry point test passes; the dev runtime registry reading is taken after the roll and posted as a comment on the pull request.'
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/test_entry_points_node_move_batch1.py -q -n 0 --no-cov -p no:cacheprovider
    cwd: .
- id: dod-omn24261-integration-proof
  description: Run the entry point and local invocation tests on a lab host at the pushed head. Hosted CI cannot reach the lab hosts, so only the local Done gate runs this unbound check; it binds no criterion for the hosted check. The dev runtime registry reading after the roll is posted as a pull request comment.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24261 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/test_entry_points_node_move_batch1.py -q --no-cov -n 0 -p no:randomly
    cwd: .
