schema_version: 1.0.0
ticket_id: OMN-23374
title: The lab fill enumerate node reads sprint tickets and approved work through node operations and local adapters
summary: node_lab_fill_effect gains the enumerate_lab_fill_approved_work and enumerate_lab_fill_sprint_tickets operations. The approved-work operation validates the declared approved-work file row by row and judges each valid row against the PR watcher, the clones' merged history and Linear, with the old script's skip order. The sprint operation reads the sprint project's issues, the defect issues, the red or stalled PRs the watcher holds and the triage fences. Each fact stage has its own budget floor, and a cut or unreadable stage marks only itself. The facts arrive through typed ports with local adapters; the old row rules, skip order and attachment readers are proven equal to a recorded run of the old enumerate. The switch of the caller and the deletion of the old enumerate from the frozen lab-fill script are a separate move-and-delete pull request that waits on an omnimarket release.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23374-enumerate-reads
  statement: The enumerate node returns the sprint tickets and approved work the old enumerate returned for the same inputs, and a slow or cut source marks only its own stage.
  acceptance:
  - id: AC1
    statement: "AC1: the enumerate node returns the sprint tickets and approved work the old enumerate returned for the same inputs, through node operations and local adapters -- falsifier: uv run pytest over the enumerate node tests with a recorded old-enumerate output as fixture fails today"
  - id: AC2
    statement: "AC2: the floor row stoppage:lab-source-unreadable stops rising after the caller switches -- falsifier: the row's count on the served floor still rises an hour after the switch"
evidence_requirements:
- kind: tests
  description: The lab fill effect node tests, the recorded old-enumerate parity file included, pass at the pushed head.
  command: uv run --frozen pytest tests/nodes/node_lab_fill_effect -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
- id: dod-omn23374-ac1-recorded-parity
  description: Replays the recorded run of the old enumerate (its row validation, skip order and attachment readers, executed unchanged over rows of the declared approved-work file and every combination of the deciding facts) through the node, and the whole approved-work operation over the same rows. With the node's required-cell list or its done states altered, 98 recorded cases disagree and the file fails.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_lab_fill_effect/test_enumerate_old_parity_lab_fill.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn23374-ac1-sprint-and-approved-chains
  description: The golden and error chains of both operations through node operations with scripted local ports; the failing controls (stage floor 0, a stale watcher, an unreadable file, a cut history read) end in a named stage and state, never an empty list.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_lab_fill_effect/test_enumerate_approved_work_lab_fill.py tests/nodes/node_lab_fill_effect/test_enumerate_sprint_tickets_lab_fill.py tests/nodes/node_lab_fill_effect/test_enumerate_local_facts_lab_fill.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn23374-deploy-readback
  description: Deploy probe. The approved-work handler is present in the tree this change ships, read through gh api at the checked-out commit so hosted CI can run it before merge. It fails at a base that has no such handler.
  source: manual
  checks:
  - check_type: command
    check_value: gh api "repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_lab_fill_effect/handlers/handler_lab_fill_approved_work.py?ref=$(git rev-parse HEAD)" --jq .content | base64 -d | grep '^class HandlerLabFillApprovedWork' > /dev/null
    cwd: .
- id: dod-omn23374-floor-row-cause
  description: The node-side cause of the row. The row counts reads that ended unread because an earlier slow source took the shared budget. With the stage floor set to 0 (the old shared budget) the later stage of each operation is left with nothing, and with the floor set it is given its share; an unreadable source is named, never an empty list. These tests fail at the merge base, which has neither operation. The live read of the row on the served floor after the caller switches is the unbound check below.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_lab_fill_effect/test_enumerate_approved_work_lab_fill.py tests/nodes/node_lab_fill_effect/test_enumerate_sprint_tickets_lab_fill.py -q --no-cov -n 0 -p no:randomly -k "ac1 or error_chain"
    cwd: .
- id: dod-omn23374-floor-row
  description: After the caller in the frozen repository is switched to the node, the served floor's stoppage:lab-source-unreadable cause is no longer still occurring. The floor address comes from the FLOOR_SIMPLE_URL environment variable of the host. Hosted CI cannot reach the served floor, so only the local Done gate runs this unbound check; it reads the cause by id and fails when the row is still occurring.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: curl -s "$FLOOR_SIMPLE_URL" | python3 -c "import json,sys; c=[x for x in json.load(sys.stdin)['causes'] if x['id']=='stoppage:lab-source-unreadable']; sys.exit(1 if c and c[0].get('still_occurring') else 0)"
    cwd: .
- id: dod-omn23374-integration-proof
  description: The pushed head ran the lab fill effect suite, the recorded old-enumerate parity file included, on a lab host through the lab work runner and exited 0. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: 'uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23374 -- uv run --frozen pytest tests/nodes/node_lab_fill_effect -q --no-cov -n 0 -p no:randomly'
    cwd: .
