---
schema_version: "1.0.0"
ticket_id: OMN-25632
title: "Delegation Health Check is red on omnimarket pull requests because the C17 customer-surface verdict on dev is red: the customer option surface drops the registry-root variable"
summary: The required check Delegation Health Check reads the newest scheduled run of the C17 customer-surface verdict workflow on dev and fails every pull request while that run is red. The newest dev run fails its parameter_audit clause with eight findings, all on parameters that bind or name the internal registry root on the customer-facing onex option surface (onex setup --workspace and onex repo-state unit install and render --omni-root). The two option definitions drop the registry-root variable; the probe, the check and the required-check list are unchanged.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn25632-no-omni-home-surface
    statement: No parameter on the onex setup and onex repo-state option surface binds or names the internal registry root, onex setup --workspace still reads OMNIBASE_PATH, and no check, probe or required-check list is changed.
    acceptance:
      - id: AC1
        statement: "AC1: the failure text of the Delegation Health Check job is read through the declared scm read path on three of the six PRs and on one base dev run, with job ids and quoted lines in a lane STATUS row that names the shared cause or lists per PR what each lacks -- falsifier: the ledger holds no STATUS row from the lane naming the cause with job ids and quotes for three PRs"
      - id: AC2
        statement: "AC2: one pull request on the default branch of the repository that owns the cause fixes it at the source, with a test that fails on the unfixed code and passes on the fix, and no second pull request is opened for a cause an existing open draft covers -- falsifier: `uv run pytest <the new test path> -q` run at the unfixed base commit passes, or `onex scm pr-list OmniNode-ai/omnimarket` shows two open pull requests for the same cause"
      - id: AC3
        statement: "AC3: the fix widens or bypasses no check, so the diff removes no assertion and adds no skip, xfail, loosened threshold or changed required-check list -- falsifier: `git diff <base> <head> -- tests/ .github/` shows a removed assert, a new skip or xfail marker or a changed required-check list"
      - id: AC4
        statement: "AC4: the pull request is open and ready (not draft) with a line starting `Lab:` in its body, and the lane TERMINAL names its head -- falsifier: `onex scm pr-view` shows the pull request as a draft, or the body carries no line starting `Lab:`"
evidence_requirements:
  - kind: tests
    description: The customer-surface test fails at origin/dev and passes at the pushed head.
    command: uv run pytest tests/nodes/node_onex_setup_effect/test_customer_surface_no_omni_home_omn25632.py -q --no-cov -p no:cacheprovider
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-omn25632-ac1
    description: "AC1: the failure text is recorded in the lane STATUS row and in the PR body; the hosted proxy is the walk test reaching the setup and repo-state unit commands the audit flagged."
    source: manual
    binds_ac: [AC1]
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/nodes/node_onex_setup_effect/test_customer_surface_no_omni_home_omn25632.py -k walk_reaches -q --no-cov -p no:cacheprovider
        cwd: .
  - id: dod-omn25632-ac2
    description: "AC2: the test fails at the merge base on both flagged definitions (eight findings) and passes at the head."
    source: manual
    binds_ac: [AC2]
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/nodes/node_onex_setup_effect/test_customer_surface_no_omni_home_omn25632.py -k no_omni_home_on_the_customer -q --no-cov -p no:cacheprovider
        cwd: .
  - id: dod-omn25632-ac3
    description: "AC3: the change edits two option definitions, one docstring and adds one test; the seeded-control test proves the scan is not blind, and no probe, workflow or required-check list is touched."
    source: manual
    binds_ac: [AC3]
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/nodes/node_onex_setup_effect/test_customer_surface_no_omni_home_omn25632.py -k seeded_control -q --no-cov -p no:cacheprovider
        cwd: .
  - id: dod-omn25632-ac4
    description: "AC4: the customer's workspace variable still binds on onex setup --workspace; the pull request state is read by the lane through the watcher."
    source: manual
    binds_ac: [AC4]
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/nodes/node_onex_setup_effect/test_customer_surface_no_omni_home_omn25632.py -k omnibase_path -q --no-cov -p no:cacheprovider
        cwd: .
  - id: dod-omn25632-integration-proof
    description: 'Run the customer-surface test on a lab host at the pushed head. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check. It binds no acceptance criterion: the clean install of the branch and the probe grading are recorded in the PR body.'
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-25632 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_onex_setup_effect/test_customer_surface_no_omni_home_omn25632.py -q --no-cov
        cwd: .
