    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24487 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/handlers/test_code_edit_loop_overlay.py -q --no-cov -p no:randomly
    cwd: .
- id: dod-omn24487-ac3-hosted-proxy
  description: 'hosted proxy for AC3: the shared-file test reads one document through the loop reader and the bus reader and both name the same bus.'
  source: manual
