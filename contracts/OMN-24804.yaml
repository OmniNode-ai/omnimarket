interfaces_touched: []
requirements:
- id: req-omn24804-unblock-6219
  statement: The causes of the red checks on omnimarket PR 6219 are named from their failure text, those inside the pull request are fixed on its own branch, and those outside it are recorded with their evidence.
  acceptance:
  - id: AC1
    statement: 'AC1: omnimarket PR 6219 reads ci=GREEN with no red check at a new head -- falsifier: `python3 $OMNI_PLUGIN_ROOT/skills/merge-drain/scripts/pr_state_local.py --pr OmniNode-ai/omnimarket#6219` prints a head other than ff0e9d39a4dc and no red= list'
  - id: AC2
    statement: 'AC2: the cause of each red check is named from its failure text at the head, or a STATUS row names a shared cause with its evidence -- falsifier: a grep of the rolling work ledger for omnimarket#6219 shows no STATUS row with cause= and shared=yes and no PR comment starting `Lab: head=`'
evidence_requirements:
- kind: tests
  description: The market node inventory test that was red at ff0e9d39a4dc for the missing node_projection_eval_results entry point passes at the pushed head.
  command: uv run --frozen pytest tests/test_market_node_runtime_dogfood.py -k "inventory_fails_on_a_missing_or_extra_node and _without_entry_point" -q -n 0 --no-cov -p no:randomly
