schema_version: 1.0.0
ticket_id: OMN-24804
title: unblock omnimarket PR 6219 (red CI Summary, imperative-contract-guard / Imperative Contract Guard, state-coverage-gate and the checks that report the same failures)
summary: The Model tests tab pull request is cut from an older head of the eval-results projection pull request, so it lacked that pull request's later fixes (the onex.nodes entry point for node_projection_eval_results, the per-topic handler routing the mixed-category gate reads, and the topics read from the contract). This change brings the stack parent's current head into the branch. The Event Chain Gate collection failure reads a missing omnibase_infra grant for tenant_projection_writer on public.eval_item_scores, a cause outside this repository that this change does not patch around.
