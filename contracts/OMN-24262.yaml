schema_version: 1.0.0
ticket_id: OMN-24262
title: Run the lane result sweep from the runtime's own schedule
summary: 'Adds the lane result sweep as a scheduled job node on the runtime schedule path of OMN-24029: it gates on its overlay interval, runs the sweep over the overlay window through a shared tick module and emits one typed run event.'
is_seam_ticket: true
interface_change: true
interfaces_touched:
- topics
requirements:
- id: req-omn24262-lane-result-sweep-scheduled
  statement: The lane result sweep runs on the runtime tick from overlay values and records each run as a typed event, failed by name when its overlay or ledger route cannot be read.
  acceptance:
  - id: AC1
    statement: 'AC1: On a runtime tick inside the interval the node returns no event, and on the tick that is due it runs the lane result sweep once and returns one run event -- falsifier: pytest src/omnimarket/nodes/node_lane_result_sweep_scheduled_effect/tests -q fails with the gate removed'
  - id: AC2
    statement: 'AC2: A missing or refused schedule settings file gives a failed run event that names the cause, never a silent skip -- falsifier: the error chain test passes a refused overlay and expects outcome failed'
  - id: AC3
    statement: 'AC3: The interval, window and sweep settings come only from the settings file in the overlays repo, and the contract and handler hold no value -- falsifier: the overlay test in the overlays repo fails when a key is removed'
  - id: AC4
    statement: 'AC4: integrated: the dev runtime runs the node on its own tick and a schedule-run event for it with outcome completed is read on the bus -- falsifier: no schedule-run event for job lane_result_sweep within two intervals of the runtime tick'
evidence_requirements:
- kind: tests
  description: The golden and error chain tests of the lane result sweep scheduled node and the ACL seam test
  command: uv run --frozen pytest tests/nodes/node_lane_result_sweep_scheduled_effect tests/nodes/node_schedule_run_reducer/test_runtime_role_acl_seam.py -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24262-ac1
  description: AC1 and AC2 proven by the named tests, with the window failing control; AC4's runtime reading is taken on the dev runtime after the deploy and named in the pull request.
  source: manual
  binds_ac:
  - AC1
  - AC2
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_lane_result_sweep_scheduled_effect -q --no-cov
    cwd: .
- id: dod-omn24262-ac3
  description: AC3 proven by the seam test, which fails when a contract grant and the derived role rows disagree; the overlay values are proven by the overlays repository's overlay test.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_schedule_run_reducer/test_runtime_role_acl_seam.py -q --no-cov
    cwd: .
- id: dod-omn24262-deploy-lane-result-sweep-scheduled
  description: 'Deploy probe the hosted runner can run: the scheduled node contract at the checked-out commit on GitHub names its handler class; the file does not exist at the merge base, so the probe fails there. AC4 is read on the dev runtime after the dev deploy through the deploy agent.'
  source: manual
  checks:
  - check_type: command
    check_value: 'bash -o pipefail -c ''gh api "repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_lane_result_sweep_scheduled_effect/contract.yaml?ref=$(git rev-parse HEAD)" --jq .content | base64 -d | grep -F "HandlerLaneResultSweepScheduled" > /dev/null'''
    cwd: .
- id: dod-omn24262-integration-proof
  description: AC4 is read on the dev runtime after the dev deploy through the deploy agent; the pushed head is run on a lab host first and the deployed reading is named in the pull request.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane integ-omm-a-6798 -- uv run --frozen pytest tests/nodes/node_lane_result_sweep_scheduled_effect -q --no-cov
    cwd: .
