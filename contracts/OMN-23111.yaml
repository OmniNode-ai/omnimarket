schema_version: "1.0.0"
ticket_id: OMN-23111
title: "The piece 4 reader resolves its launchd log directory on a host whose registry root is an external volume"
summary: >-
  A registry tick unit in node_host_installer_registry_units may declare log_directory, relative to the home. The launchd
  plist template writes the unit's out and err logs there; a unit that declares none keeps its logs in its state
  directory. The overlay store reader unit declares a directory under the home, so launchd opens its logs on a host whose
  registry root links to an external volume (h101 ended every run with exit 78, EX_CONFIG, and no log before this).
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn23111-reader-log-directory
    statement: The overlay store reader's launchd logs sit under the home, not under the registry root.
    acceptance:
      - id: AC1
        statement: 'AC1: a pull request titled with this ticket carries the log-directory fix, and the three tests it adds fail on the base and pass on the branch -- falsifier: uv run pytest of the reader''s launchd unit test file on the base and on the branch'
      - id: AC2
        statement: 'AC2: the reader installed from the branch on h101 stays running under launchd for one hour with a fresh reading each tick -- falsifier: launchctl list of the reader label on h101 shows a non-zero pid and the reader''s output log carries a reading newer than 15 minutes'
evidence_requirements:
  - kind: tests
    description: The log-directory tests of the registry unit installer node.
    command: uv run --frozen pytest tests/nodes/node_host_installer_registry_units/test_log_directory.py -q --no-cov
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-omn23111-log-directory-tests
    description: The three log-directory tests pass with the change; the golden and the reader declaration read red on the base without it.
    source: manual
    execution_scope: hosted_and_local
    binds_ac: [AC1]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/nodes/node_host_installer_registry_units/test_log_directory.py -q --no-cov
        cwd: .
  - id: dod-omn23111-integration-proof-h101
    description: The reader unit installed from this branch through the registry unit installer reads LOADED with a fresh heartbeat and its logs under the home; hosted CI cannot reach the lab host, so only the local Done gate runs this unbound check, and the h101 read is in the pull request comment that names the head.
    source: manual
    execution_scope: local_done_gate
    binds_ac: [AC2]
    checks:
      - check_type: command
        check_value: 'onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23111-reader --kind test -- bash -c ''echo "{\"unit\": \"overlay-store-refresh\", \"mode\": \"status\", \"home\": \"$HOME\", \"registry_root\": \"$OMNI_HOME\"}" | uv run --frozen python -m omnimarket.nodes.node_host_installer_registry_units'''
        cwd: .
