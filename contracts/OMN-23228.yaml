schema_version: 1.0.0
ticket_id: OMN-23228
title: The size-band falsifier selects a medium-request test when run with -k medium_stays_free
summary: The size-band paid-rule test file parametrized its small and medium cases by prompt text, so the pytest selector medium_stays_free matched no test. The two cases now carry the ids small_stays_free and medium_stays_free, so the selector runs the medium case, which skips the paid rung and ends returned_to_caller. The test body, the contract and every bound are unchanged.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23228-medium-selector
  statement: The selector medium_stays_free chooses the medium-request case of the size-band paid-rule test.
  acceptance:
  - id: AC1
    statement: 'AC1: the selector medium_stays_free chooses exactly one test in the size-band paid-rule file and it passes -- falsifier: `uv run pytest tests/unit/delegation/test_size_band_paid_rule.py -k medium_stays_free -q`'
evidence_requirements:
