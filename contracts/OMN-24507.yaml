schema_version: 1.0.0
ticket_id: OMN-24507
title: 'The delegation step reads its engine order: the order handler answers when run as a command'
summary: The delegation step (delegation_step.py, OMN-24044) asks omnimarket.handlers.delegation_step_order for its first engine by running it as a command and reading the last stdout line as JSON. The module had no entry point (OMN-24044 added step_order() only), so the command printed nothing and exited 0, the step read that as no answer ("the step order handler gave no answer (exit 0)" on every receipt) and kept its old default, GLM first for text and before the lab for code, whatever the routing overlay says. The module gains main(), which prints one JSON line with the choice and the receipt fields, exits 1 with the reason on stderr for a refused kind and 2 for a wrong argument count. Measured on h051 and h053, ten text steps each way, every run succeeding either way - the median is 67.4 s and 67.1 s GLM first and 23.3 s and 16.1 s lab first. The routing overlay's code order is lab first for code_generation, which the step would then follow; that differs from the operator's note that code drafts belong to GLM, so this pull request is a draft until the orchestrator decides it. Not in this change - the overlay's code order, the GLM harness turn count (4 to 6 turns of 23 thousand input tokens for a two sentence answer) and the lab agent absent on h053.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24507-order-entry
  statement: The step order handler answers when the step runs it as a command, with the same answer step_order() gives, and refuses a bad kind with a non-zero exit.
  acceptance:
  - id: AC1
    statement: "AC1: running the step order handler as a command prints one line of JSON carrying the choice and the receipt fields the step reads, and exits 1 with a reason on stderr when the kind or class is refused -- falsifier: pytest tests/handlers/test_delegation_step_order_main.py -q"
  - id: AC2
    statement: "AC2: a text step with no engine flag records order_source routing_order_node and drafts on the lab model first -- falsifier: delegation_step.py text on h051 shows engine lab and no order_fallback in its receipt"
  - id: AC3
    statement: "AC3: integrated: ten text steps with no flag on h051 and h053 all succeed with a median under 40 seconds -- falsifier: the median of the ten receipts' elapsed_sec on either host is 40 or more"
evidence_requirements:
- kind: tests
  description: The step order tests at the pushed head; all six new tests fail against the handler before this change.
  command: uv run pytest tests/unit/handlers/test_delegation_step_order_main.py -q -n 0 --no-cov -p no:cacheprovider
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24507-ac1
  description: 'AC1: the handler answers as a command with one JSON line; against the handler before this change main does not exist and the command exits 1.'
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: command
    check_value: >-
      uv run python -c "import io, json; from omnimarket.handlers.delegation_step_order import main; o = io.StringIO(); assert main(['text', 'document'], read=lambda c: ('ladder', 'claude-glm'), out=o) == 0; a = json.loads(o.getvalue()); assert a['choice'] == 'lab' and a['fields']['order_source'] == 'routing_order_node'"
    cwd: .
- id: dod-omn24507-ac2
  description: 'AC2 hosted proxy: the module run as a command refuses a bad kind with exit 1; before this change it exited 0 and printed nothing, which is why the step kept its default.'
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: command
    check_value: >-
      uv run python -c "import subprocess, sys; r = subprocess.run([sys.executable, '-m', 'omnimarket.handlers.delegation_step_order', 'bogus', 'document'], capture_output=True, text=True); assert r.returncode == 1 and 'kind must be one of' in r.stderr"
    cwd: .
- id: dod-omn24507-ac3-hosted-proxy
  description: 'AC3 hosted proxy: the same golden answer, lab first for the overlay chain that places the lab tier ahead of GLM.'
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: command
    check_value: >-
      uv run python -c "import io, json; from omnimarket.handlers.delegation_step_order import main; o = io.StringIO(); assert main(['text', 'document'], read=lambda c: ('ladder', 'claude-glm'), out=o) == 0; a = json.loads(o.getvalue()); assert a['choice'] == 'lab' and a['fields']['order_source'] == 'routing_order_node'"
    cwd: .
- id: dod-omn24507-integration-proof
  description: 'AC2 and AC3 lab proof: the step order tests run on a lab host at the pushed head; the ten text steps on h051 and h053 after the merge are read from the lane report and are not claimed by this local check'
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24507 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/handlers/test_delegation_step_order_main.py -q --no-cov -p no:randomly
    cwd: .
