schema_version: 1.0.0
ticket_id: OMN-24284
title: The board refresh log says what its source memory did
summary: The board's source read cache writes a small receipt per step (hits, misses, source reads, why it was off) and nothing printed it, because the publisher captures each step's output. The publish run's result now carries one source-cache line for each receipt written during the run, read by a new reader in the cache node (read_tally_lines), and the publisher's tick prints them after its summary line, so a refresh log shows a cache hit, a miss or the reason the cache was off.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24284-cache-log-line
  statement: A publish run's log names what the source read cache did for each board step in the run, and a record from an earlier run is never reported as this run's.
  acceptance:
  - id: AC1
    statement: 'AC1: a publish run reports one source-cache line for each step record written during the run and none for a record left by an earlier run -- falsifier: uv run pytest tests/nodes/node_factory_floor_publish_effect/test_source_cache_lines_step.py -q fails without the change'
  - id: AC2
    statement: 'AC2: each step record becomes one line with its hit, miss and source-read counts or the reason the cache was off, and a damaged record becomes an unreadable line naming only the error class -- falsifier: uv run pytest tests/nodes/node_source_read_cache_effect/test_tally_receipt_lines.py -q fails without the change'
  - id: AC3
    statement: 'AC3: integrated: on the publishing Mac after install, one refresh''s log holds a source-cache line for the factory floor step with the Valkey backend and hits above zero on the second refresh -- falsifier: a refresh log with no source-cache line, or a line whose off= names a reason, fails this criterion'
evidence_requirements:
- kind: tests
  description: The publisher line test and the receipt reader test pass at the pushed head.
  command: uv run pytest tests/nodes/node_factory_floor_publish_effect/test_source_cache_lines_step.py tests/nodes/node_source_read_cache_effect/test_tally_receipt_lines.py -q -n 0 --no-cov -p no:cacheprovider
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24284-ac1
  description: 'AC1: a receipt written during the run is in the run result with its counts, a receipt from an hour earlier is not, an unreadable receipt is reported and the run still publishes, and no receipt gives no lines.'
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_factory_floor_publish_effect/test_source_cache_lines_step.py -q -n 0 --no-cov -p no:cacheprovider
    cwd: .
- id: dod-omn24284-ac2
  description: 'AC2: the reader gives the golden line for a receipt the cache node itself wrote, skips a receipt older than the start, names the error class for a receipt that is not JSON, carries the off reason, and gives no lines for a missing directory.'
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_source_read_cache_effect/test_tally_receipt_lines.py -q -n 0 --no-cov -p no:cacheprovider
    cwd: .
- id: dod-omn24284-ac3
  description: 'hosted proxy for AC3: the tests above pass; the two Mac refreshes and their log lines are read on the publishing Mac after install and named in the pull request.'
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_factory_floor_publish_effect/test_source_cache_lines_step.py tests/nodes/node_source_read_cache_effect/test_tally_receipt_lines.py -q -n 0 --no-cov -p no:cacheprovider
    cwd: .
- id: dod-omn24284-integration-proof
  description: the publisher line test and the receipt reader test run on a lab host at the pushed head; hosted CI cannot reach the lab, so only the local Done gate runs this unbound check
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24284 --kind test -- env PYTHONDONTWRITEBYTECODE=1
      uv run --frozen pytest tests/nodes/node_factory_floor_publish_effect/test_source_cache_lines_step.py tests/nodes/node_source_read_cache_effect/test_tally_receipt_lines.py
      -q --no-cov
