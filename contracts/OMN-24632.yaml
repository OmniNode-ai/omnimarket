schema_version: 1.0.0
ticket_id: OMN-24632
title: 'PR duplicate guard: shared removals stay duplicates; only distinct added content clears'
summary: The PR duplicate guard scores one share over the added and the removed lines together, less the declared shared catalog fingerprint lines. Two pull requests that delete the same many lines stay duplicates whatever each adds, while a catalog fingerprint line that both replace does not count, so the eval-grants case still clears.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24632-shared-removals
  statement: The guard reads shared removed lines as part of one share with the added lines, except the declared shared catalog lines.
  acceptance:
  - id: AC1
    statement: 'AC1: two pull requests that delete the same 20 lines and add different lines are refused as duplicates -- falsifier: uv run pytest tests -k "duplicate_guard and shared_removals" -q'
  - id: AC2
    statement: 'AC2: the eval-grants case, with one shared catalog line and distinct added content, still clears -- falsifier: uv run pytest tests -k "duplicate_guard and eval_grants" -q'
  - id: AC3
    statement: 'AC3: the loosened refusal test is restored to its original strength and passes on the fixed guard -- falsifier: uv run pytest tests -k "duplicate_guard and replaces" -q'
evidence_requirements:
- kind: tests
  description: The guard tests and the replaces suite pass at the pushed head.
  command: uv run --frozen pytest tests/nodes/node_pr_duplicate_guard_compute tests/unit/handlers/scm/test_scm_duplicate_guard_replaces.py -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24632-ac1
  description: Two diffs that delete the same 20 lines and add different lines are refused with lines evidence.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests -k "duplicate_guard and shared_removals" -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24632-ac2
  description: The recorded eval-grants diff against the state-panel diff, sharing one catalog fingerprint line, still clears.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests -k "duplicate_guard and eval_grants" -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24632-ac3
  description: The replaces suite is the origin/dev file unchanged, and passes on the fixed guard.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests -k "duplicate_guard and replaces" -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24632-integration-proof
  description: Run the guard tests on a lab host at the pushed head. Hosted CI cannot reach the lab hosts, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24632 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_pr_duplicate_guard_compute tests/unit/handlers/scm/test_scm_duplicate_guard_replaces.py -q --no-cov -n 0 -p no:randomly
    cwd: .
