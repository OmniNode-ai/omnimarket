  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/nodes/node_claude_review_gateway_effect -q --no-cov --tb=line
    cwd: .
- id: dod-omn22176-ac2
  description: One workflow test per decision, plus the gate-accept node cases of the plan, run the workflow's own steps and the node's handler.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/ci/test_hostile_review_agent_accept.py tests/unit/nodes/node_agent_review_gate_accept_effect/test_gate_accept.py -q --no-cov --tb=line
    cwd: .
- id: dod-omn22176-ac3
  description: The step-shape test pins the added step to one node call and the enforcement step's run text by digest.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/ci/test_hostile_review_accept_step_shape.py -q --no-cov --tb=line
    cwd: .
- id: dod-omn22176-ac4
  description: The workflow tests assert every required context after each voter verdict and decision.
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/ci/test_hostile_review_agent_accept.py -q --no-cov --tb=line
    cwd: .
- id: dod-omn22176-ac5
  description: The gateway test reports the key billed out through a provider-free double and reads reason credit_exhausted in the 503.
  source: manual
  binds_ac:
  - AC5
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/nodes/node_claude_review_gateway_effect/test_gateway_typed_reason.py -q --no-cov --tb=line
    cwd: .
- id: dod-omn22176-ac6
  description: The profile check runs every node test in the in-memory and the Redpanda overlay profile.
  source: manual
  binds_ac:
  - AC6
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/nodes/node_agent_review_gate_accept_effect -q --no-cov --tb=line
    cwd: .
- id: dod-omn22176-integration-proof
  description: The pushed head ran the gate-accept node suites in both profiles, the gateway suites and the workflow tests on a lab host and exited 0. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-22176 -- uv run --frozen pytest tests/unit/nodes/node_agent_review_gate_accept_effect tests/unit/nodes/node_claude_review_gateway_effect tests/ci/test_hostile_review_agent_accept.py tests/ci/test_hostile_review_accept_step_shape.py -q -p no:randomly --no-cov
    cwd: .
