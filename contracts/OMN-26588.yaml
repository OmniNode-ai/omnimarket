---
schema_version: "1.0.0"
ticket_id: OMN-26588
title: "Delegated code tasks: an empty answer after spent output tokens climbs, a thinking budget leaves the answer room, and an untagged answer is parsed as the language the prompt asked for"
summary: "Three fixes from the 2026-11-23 why-code five whys of the local-model code_generation gate failures. (1) An empty answer for which the provider billed output tokens is a spent output budget and carries the WEAK_OUTPUT verdict, not MALFORMED. (2) A thinking budget, whoever sets it, is cut to half the output cap so the answer keeps at least as many tokens as the reasoning. (3) An unfenced or untagged answer is parsed as YAML or JSON when the prompt names exactly that one language and no Python. No gate threshold and no task-class contract value is lowered."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn26588-empty-after-spent-output
    statement: "An empty answer after spent output tokens is a climbable WEAK_OUTPUT verdict; an empty answer that billed none stays MALFORMED."
    acceptance:
      - id: AC1
        statement: "AC1: delta with an empty answer and output_tokens_spent=8192 returns a WEAK_OUTPUT reason and the dispatch port threads the billed tokens into the gate -- falsifier: uv run pytest tests/unit/delegation/test_empty_answer_after_spent_output_omn26588.py -q --no-cov -n 0; the file fails at the merge base (delta takes no output_tokens_spent)"
  - id: req-omn26588-thinking-budget-answer-room
    statement: "The request that leaves the dispatch port carries a thinking budget of at most half the output cap."
    acceptance:
      - id: AC2
        statement: "AC2: bound_thinking_budget_to_answer_room cuts both server spellings to half the cap and the port's effect request carries the bounded value -- falsifier: uv run pytest tests/unit/delegation/test_thinking_budget_leaves_answer_room_omn26588.py -q --no-cov -n 0; the file fails at the merge base (no such function)"
  - id: req-omn26588-prompt-language-parse
    statement: "An unfenced or untagged answer is parsed as the language the prompt names when it names exactly YAML or JSON and no Python."
    acceptance:
      - id: AC3
        statement: "AC3: a YAML answer to a YAML prompt passes compiles_without_errors and code_artifact_present, invalid YAML or JSON still fails under its own parser, and a prompt that names Python, both languages or neither keeps the Python parse -- falsifier: uv run pytest tests/unit/delegation/test_quality_gate_prompt_language_omn26588.py -q --no-cov -n 0; four of its tests fail at the merge base"
evidence_requirements:
  - kind: tests
    description: "The three focused test files and the gate and port tests they sit beside pass at the pushed head."
    command: "uv run --frozen pytest tests/unit/delegation/test_empty_answer_after_spent_output_omn26588.py tests/unit/delegation/test_thinking_budget_leaves_answer_room_omn26588.py tests/unit/delegation/test_quality_gate_prompt_language_omn26588.py -q --no-cov -n 0 -p no:randomly"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-omn26588-ac1
    description: "AC1: an empty answer with spent output tokens is WEAK_OUTPUT and the port passes the billed tokens to the gate."
    source: manual
    binds_ac: [AC1]
    checks:
      - check_type: test_passes
        check_value: >-
          uv run --frozen pytest tests/unit/delegation/test_empty_answer_after_spent_output_omn26588.py -q --no-cov -n 0 -p no:randomly
        cwd: .
  - id: dod-omn26588-ac2
    description: "AC2: the thinking budget on the request leaves at least half the output cap for the answer."
    source: manual
    binds_ac: [AC2]
    checks:
      - check_type: test_passes
        check_value: >-
          uv run --frozen pytest tests/unit/delegation/test_thinking_budget_leaves_answer_room_omn26588.py -q --no-cov -n 0 -p no:randomly
        cwd: .
  - id: dod-omn26588-ac3
    description: "AC3: the parse reads the language the prompt asked for and keeps the Python parse otherwise."
    source: manual
    binds_ac: [AC3]
    checks:
      - check_type: test_passes
        check_value: >-
          uv run --frozen pytest tests/unit/delegation/test_quality_gate_prompt_language_omn26588.py -q --no-cov -n 0 -p no:randomly
        cwd: .
  - id: dod-omn26588-integration-proof
    description: "Local Done gate only, so it binds no criterion here: the three focused test files run on a lab host at the pushed head."
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: >-
          onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-26588 --kind test -- uv run --frozen pytest tests/unit/delegation/test_empty_answer_after_spent_output_omn26588.py tests/unit/delegation/test_thinking_budget_leaves_answer_room_omn26588.py tests/unit/delegation/test_quality_gate_prompt_language_omn26588.py -q --no-cov
        cwd: .
