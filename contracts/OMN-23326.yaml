schema_version: 1.0.0
ticket_id: OMN-23326
title: "J6 runs: the caller that answers each piece 6 reading with a stop in the gate store"
summary: The J6 join test was on dev but nothing called the join handler, so the floor read J6 not_run and chains:broken carried J6 piece 6 to 7 downstream_missing_typed_failure. The gate store node gains HandlerGateStoreJoinJ6Run, a caller that answers each piece 6 golden reading not yet answered by piece 7 with a stop committed in the in-memory gate store, reads the durable and projected audit rows back, checks the stopped piece is refused and another piece is admitted, and writes piece 7's chain under the reading's correlation id; once per window it writes piece 7's own error chain, the fence drill. The Postgres backend of the gate store, the deployed overlay and the join refusal entry for J6 are not part of this change.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23326-j6-caller
  statement: A piece 6 reading that calls for a stop is answered by a committed stop in the gate store with a golden and an error chain, and after the install the served floor reads join J6 passed.
  acceptance:
  - id: AC1
    statement: "AC1: a piece 6 reading that calls for a stop is answered by a committed stop in the gate store, golden and error -- falsifier: uv run pytest tests -q -k j6_caller in omnimarket, failing with the caller removed"
  - id: AC2
    statement: "AC2: after install the served floor reads J6 run, with no chains:broken entry for J6 -- falsifier: curl of the served floor shows join J6 state passed"
evidence_requirements:
- kind: tests
  description: The J6 caller tests at the pushed head, golden, error and the failing controls.
  command: uv run --frozen pytest tests/unit/nodes/node_gate_store_effect/test_j6_caller_run.py -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
- id: dod-omn23326-j6-caller-golden-error
  description: The golden and error chain tests of the J6 caller pass, judged by the floor's own receipt fold. On the dev source they fail at collection because the caller module does not exist.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/nodes/node_gate_store_effect/test_j6_caller_run.py -k "golden or error" -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn23326-j6-caller-controls
  description: The failing controls pass as assertions of failure, so the reading can fail for real. Without the run and the refusal the join reads broken with downstream_missing_typed_failure, the named break drop-audit-row leaves the join not golden with the typed failure on the journal, and a drill that does not hold writes no error receipt.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/nodes/node_gate_store_effect/test_j6_caller_run.py -k "control" -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn23326-served-floor-j6
  description: The served floor reads join J6 passed after the install on the floor host. The served floor is not reachable from the hosted runner, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  binds_ac:
  - AC2
  checks:
  - check_type: command
    check_value: |-
      curl -fsS "${FLOOR_SERVE_URL:?}/floor-simple.json" | python3 -c 'import json,sys; d=json.load(sys.stdin); j=[j for p in d["pieces"] for j in p["joins"] if j["id"]=="J6"]; assert j and j[0]["state"]=="passed", j; assert not any("J6" in c["detail"] for c in d["causes"] if c["id"]=="chains:broken")'
    cwd: .
- id: dod-omn23326-integration-proof
  description: The pushed head ran the J6 caller tests on a lab host through the lab work runner and exited 0. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: 'uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23326 -- uv run --frozen pytest tests/unit/nodes/node_gate_store_effect/test_j6_caller_run.py -q --no-cov -n 0 -p no:randomly'
    cwd: .
