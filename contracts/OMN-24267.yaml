schema_version: 1.0.0
ticket_id: OMN-24267
title: Pin the coding draft time limit read and its sizing ceiling with tests
summary: 'Two tests in tests/unit/handlers/test_delegation_call_budget_reader.py. One plants the code_generation call budget at 180, reads 180, rewrites the overlay to 600 and reads 600. The other
  sizes drafts whose slowest completed time is 593.6 seconds and expects node_delegation_code_budget_compute to refuse with over_ceiling and no budget.'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24267-budget-read-and-ceiling-pinned
  statement: The code_generation call budget follows the overlay on every read, and a sizing over the overlay ceiling is refused.
  acceptance:
  - id: AC1
    statement: 'AC1: a test plants the settings value 180 for code_generation, reads 180, rewrites it to 600 and reads 600 -- falsifier: the test goes red when the budget reader returns a fixed value'
  - id: AC2
    statement: 'AC2: a test sizes drafts whose slowest completed time is 593.6 seconds and the node refuses with over_ceiling and no budget -- falsifier: the test goes red when the node''s ceiling check
      is removed'
  - id: AC3
    statement: 'AC3: integrated: one code_generation draft run through the lane delegation step on a lab host records call_budget_s 600 with call_budget_source overlay in its harness receipt --
      falsifier: the receipt shows 180 or source default'
evidence_requirements:
- kind: tests
  description: The reader tests pass at the pushed head.
  command: uv run pytest tests/unit/handlers/test_delegation_call_budget_reader.py -q -n 0 --no-cov -p no:cacheprovider
