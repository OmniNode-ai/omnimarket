---
schema_version: "1.0.0"
ticket_id: "OMN-21126"
title: "The git source and the corpus select computes: the invariants select compute"
summary: >-
  node_context_invariants_select_compute selects, from an invariant registry read at a pinned
  commit, the active entries tagged with a profile's scopes, each as a context-source entry whose
  text is the registry item's own lines, stamped path@sha#id with its line span and labelled a
  paraphrase, and lists every superseded entry as excluded. It applies no token budget and
  computes no pack hash.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-invariants-select-compute"
    statement: "The invariants tier of the context service is an omnimarket compute node in canonical shape (contract, node, handler) with its topics declared in its contract."
    acceptance:
      - id: "AC1"
        statement: "AC1: on a registry at a pinned sha, a request with scope delegation gets exactly the active entries tagged delegation in file order, each statement and enforcement line byte-equal to the file's inside an entry text that is a contiguous substring of the file at its stamped line span, labelled paraphrase, and every superseded entry listed as excluded with its successor -- falsifier: uv run pytest tests/nodes/node_context_invariants_select_compute/test_golden_chain_context_invariants_select.py -q -n 0 fails at the merge base, where the node package does not exist"
      - id: "AC2"
        statement: "AC2: the select compute applies no token budget and computes no hash over the selection: an oversize fixture of 300 entries returns all 300, and the result model has no budget or hash field -- falsifier: uv run pytest tests/nodes/node_context_invariants_select_compute/test_golden_chain_context_invariants_select.py -q -n 0 -k no_budget fails at the merge base"
      - id: "AC3"
        statement: "AC3: no file the change adds names a private repository -- falsifier: grep -rliE 'knowledge.base.internal|omninode.infra|omnibase.internal' over the node package and its tests lists a file"
  - id: "req-adr-select-compute"
    statement: "The ADR tier of the context service is an omnimarket compute node in canonical shape (contract, node, handler) with its topics declared in its contract."
    acceptance:
      - id: "AC4"
        statement: "AC4: on public ADR files at a pinned sha, only status accepted entries with empty superseded_by and a topic in the request's topics are admitted, in path order, each body byte-equal to the file after its frontmatter and stamped path@sha with its line span; not-accepted and superseded entries in topic are listed as excluded -- falsifier: uv run pytest tests/nodes/node_context_adr_select_compute/test_golden_chain_context_adr_select.py -q -n 0 fails at the merge base, where the node package does not exist"
      - id: "AC5"
        statement: "AC5: two files sharing the id ADR-0010 are distinct entries keyed by path -- falsifier: uv run pytest tests/nodes/node_context_adr_select_compute/test_golden_chain_context_adr_select.py -q -n 0 -k sharing_an_id fails at the merge base"
      - id: "AC6"
        statement: "AC6: the ADR select compute applies no token budget and computes no hash over the selection: an oversize fixture of 300 ADRs returns all 300, and the result model has no budget or hash field -- falsifier: uv run pytest tests/nodes/node_context_adr_select_compute/test_golden_chain_context_adr_select.py -q -n 0 -k no_budget fails at the merge base"
      - id: "AC7"
        statement: "AC7: no file the ADR select change adds names a private repository -- falsifier: grep -rliE 'knowledge.base.internal|omninode.infra|omnibase.internal' over the ADR node package and its tests lists a file"
  - id: "req-doc-section-select-compute"
    statement: "The shape, pattern and plan tiers of the context service are an omnimarket compute node in canonical shape (contract, node, handler) with its topics declared in its contract."
    acceptance:
      - id: "AC8"
        statement: "AC8 (ticket AC3): every doc-section and plan excerpt is a contiguous slice of its source at the stamped sha with a line span, a plan whose lifecycle row is not active or not listed is excluded, and a shape section that two named documents define differently returns ambiguous with both excluded -- falsifier: uv run pytest tests/nodes/node_context_doc_section_select_compute/test_golden_chain_context_doc_section_select.py -q -n 0 -k 'contiguous_substring or plan_not_active or ambiguous' fails at the merge base, where the node package does not exist"
      - id: "AC9"
        statement: "AC9 (ticket AC5): the doc-section select compute applies no token budget and computes no hash over the selection: an oversize fixture of 300 sections returns all 300, and the result model has no budget or hash field -- falsifier: uv run pytest tests/nodes/node_context_doc_section_select_compute/test_golden_chain_context_doc_section_select.py -q -n 0 -k no_budget fails at the merge base"
      - id: "AC10"
        statement: "AC10 (ticket AC7): sections named always_inject by the request's rule data are returned unconditionally, triggers come only from that data, and an unknown rule key fails validation -- falsifier: uv run pytest tests/nodes/node_context_doc_section_select_compute/test_golden_chain_context_doc_section_select.py -q -n 0 -k 'always_inject or unknown_rule_key' fails at the merge base"
      - id: "AC11"
        statement: "AC11 (ticket AC9): every cited path in a doc-section excerpt is checked against a tree index built from the pinned commit's paths, and a path absent from the tree is reported ungrounded -- falsifier: uv run pytest tests/nodes/node_context_doc_section_select_compute/test_golden_chain_context_doc_section_select.py -q -n 0 -k ungrounded fails at the merge base"
      - id: "AC12"
        statement: "AC12 (ticket AC4): no file the doc-section change adds names a private repository -- falsifier: grep -rliE 'knowledge.base.internal|omninode.infra|omnibase.internal' over the doc-section node package and its tests lists a file"
  - id: "req-pinned-git-source"
    statement: "The context Git source reads configured repository paths at an exact overlay pin behind the canonical context-source request and result boundary."
    acceptance:
      - id: "AC13"
        statement: "The source returns exact UTF-8 blob bytes, blob sha, commit sha and the pinned tree, ignoring dirty checkout files; unsafe paths, non-commit pins, symlinks and missing objects cannot produce resolved entries."
      - id: "AC14"
        statement: "A tenant absent from the tier overlay, a different repository or a different revision is denied before the injected object reader is called (ticket AC6)."
      - id: "AC15"
        statement: "Every entry carries the overlay policy_id and freshness flag; old or oversize documents remain whole, and source keys preserve distinct source parameters (ticket AC5, AC8 and AC10)."
      - id: "AC16"
        statement: "The same allowed and denied context exchange works through typed runtime dispatch and the in-memory bus; the packaged onex node CLI returns the exact pinned bytes."
evidence_requirements:
  - kind: "tests"
    description: "Pinned Git source, access, provenance and local runtime tests."
    command: "env UV_FROZEN=true uv run pytest tests/nodes/node_context_source_git_effect/test_golden_chain_context_source_git.py -q -n 0 --no-cov"
  - kind: "tests"
    description: "Invariants select compute for OMN-21126."
    command: "uv run pytest tests/nodes/node_context_invariants_select_compute/test_golden_chain_context_invariants_select.py -q -n 0"
  - kind: "tests"
    description: "ADR select compute for OMN-21126."
    command: "uv run pytest tests/nodes/node_context_adr_select_compute/test_golden_chain_context_adr_select.py -q -n 0"
  - kind: "tests"
    description: "Doc-section select compute for OMN-21126."
    command: "uv run pytest tests/nodes/node_context_doc_section_select_compute/test_golden_chain_context_doc_section_select.py -q -n 0"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn21126-ac13-pinned-git-source"
    description: "Real Git objects prove exact bytes and stamps independently of a dirty checkout. Missing or unsupported objects return unavailable without partial entries. The new node is absent at the merge base."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "env UV_FROZEN=true uv run pytest tests/nodes/node_context_source_git_effect/test_golden_chain_context_source_git.py -q -n 0 --no-cov -k 'reads_pinned or missing or unsafe or symlink or invalid_utf8 or object_type or integrity'"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC13"]
  - id: "dod-omn21126-ac14-git-tenant-denial"
    description: "Denied requests cannot reach the injected object reader. Missing or malformed deployment configuration fails closed."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "env UV_FROZEN=true uv run pytest tests/nodes/node_context_source_git_effect/test_golden_chain_context_source_git.py -q -n 0 --no-cov -k 'denied_before or overlay_file or policy_is_strict'"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC14"]
  - id: "dod-omn21126-ac15-git-freshness-no-budget"
    description: "Age is reported without dropping authority text, oversize text is whole, and distinct source parameters do not collapse."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "env UV_FROZEN=true uv run pytest tests/nodes/node_context_source_git_effect/test_golden_chain_context_source_git.py -q -n 0 --no-cov -k 'no_age_drop or oversize'"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC15"]
  - id: "dod-omn21126-ac16-git-runtime-bindings"
    description: "The same resolved and denied requests traverse typed runtime dispatch and an in-memory bus, with a separate installed CLI probe. No external service or secret is required."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "env UV_FROZEN=true uv run pytest tests/nodes/node_context_source_git_effect/test_golden_chain_context_source_git.py -q -n 0 --no-cov -k 'same_context_exchange or packaged_node_cli'"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC16"]
  - id: "dod-omn21126-git-deploy-probe"
    description: "Hosted-runner probe invokes the packaged onex node CLI with event_bus=inmemory, a temporary repository and a strict temporary deployment overlay, and requires the runtime result to contain the exact pinned blob bytes. It fails at the merge base where the package and entry point do not exist."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: "uv run --frozen pytest tests/nodes/node_context_source_git_effect/test_golden_chain_context_source_git.py -q -n 0 --no-cov -k packaged_node_cli_inmemory"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn21126-ac1-invariants-select"
    description: "The select tests pass at the head; at the merge base the node package does not exist and the file fails at collection."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_context_invariants_select_compute/test_golden_chain_context_invariants_select.py -q -n 0"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC1"]
  - id: "dod-omn21126-ac2-no-budget"
    description: "The oversize fixture returns every entry and the result model carries no budget or hash field."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_context_invariants_select_compute/test_golden_chain_context_invariants_select.py -q -n 0 -k no_budget"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC2"]
  - id: "dod-omn21126-ac3-no-private-names"
    description: "The node handler exists and no file under the node package or its tests names a private repository; at the merge base the handler is absent and the check fails."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_context_invariants_select_compute/test_golden_chain_context_invariants_select.py -q -n 0 -k no_private_names"
        cwd: "${OMNI_HOME}/omnimarket"
      - check_type: "command"
        check_value: >-
          test -f src/omnimarket/nodes/node_context_invariants_select_compute/handlers/handler_context_invariants_select.py && ! grep -rqiE 'knowledge.base.internal|omninode.infra|omnibase.internal' src/omnimarket/nodes/node_context_invariants_select_compute tests/nodes/node_context_invariants_select_compute
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC3"]
  - id: "dod-omn21126-deploy-probe"
    description: "Hosted-runner probe reads the handler at this commit and requires its handler class; the base has no such file and the probe finds no match."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: >-
          gh api "repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_context_invariants_select_compute/handlers/handler_context_invariants_select.py?ref=$(git rev-parse HEAD)" --jq .content | base64 -d | grep -c '^class HandlerContextInvariantsSelect'
  - id: "dod-omn21126-ac4-adr-select"
    description: "The ADR select tests pass at the head; at the merge base the node package does not exist and the file fails at collection."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_context_adr_select_compute/test_golden_chain_context_adr_select.py -q -n 0"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC4"]
  - id: "dod-omn21126-ac5-adr-shared-id"
    description: "Two files sharing ADR-0010 come back as two entries keyed by path."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_context_adr_select_compute/test_golden_chain_context_adr_select.py -q -n 0 -k sharing_an_id"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC5"]
  - id: "dod-omn21126-ac6-adr-no-budget"
    description: "The oversize fixture of 300 ADRs returns every entry and the result model carries no budget or hash field."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_context_adr_select_compute/test_golden_chain_context_adr_select.py -q -n 0 -k no_budget"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC6"]
  - id: "dod-omn21126-ac7-adr-no-private-names"
    description: "The ADR select handler exists and no file under its node package or tests names a private repository; at the merge base the handler is absent and the check fails."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_context_adr_select_compute/test_golden_chain_context_adr_select.py -q -n 0 -k no_private_names"
        cwd: "${OMNI_HOME}/omnimarket"
      - check_type: "command"
        check_value: >-
          test -f src/omnimarket/nodes/node_context_adr_select_compute/handlers/handler_context_adr_select.py && ! grep -rqiE 'knowledge.base.internal|omninode.infra|omnibase.internal' src/omnimarket/nodes/node_context_adr_select_compute tests/nodes/node_context_adr_select_compute
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC7"]
  - id: "dod-omn21126-adr-deploy-probe"
    description: "Hosted-runner probe reads the ADR select handler at this commit and requires its handler class; the base has no such file and the probe finds no match."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: >-
          gh api "repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_context_adr_select_compute/handlers/handler_context_adr_select.py?ref=$(git rev-parse HEAD)" --jq .content | base64 -d | grep -c '^class HandlerContextAdrSelect'
  - id: "dod-omn21126-ac8-doc-section-verbatim"
    description: "Excerpts are contiguous slices at their spans, inactive and unlisted plans are excluded, and a conflicting shape definition excludes both."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_context_doc_section_select_compute/test_golden_chain_context_doc_section_select.py -q -n 0 -k 'contiguous_substring or plan_not_active or ambiguous or identical_definitions'"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC8"]
  - id: "dod-omn21126-ac9-doc-section-no-budget"
    description: "The oversize fixture returns every section and the result model carries no budget or hash field."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_context_doc_section_select_compute/test_golden_chain_context_doc_section_select.py -q -n 0 -k 'no_budget'"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC9"]
  - id: "dod-omn21126-ac10-doc-section-data-policy"
    description: "always_inject sections are unconditional, triggers come from rule data, and an unknown rule key fails validation."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_context_doc_section_select_compute/test_golden_chain_context_doc_section_select.py -q -n 0 -k 'always_inject or unknown_rule_key'"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC10"]
  - id: "dod-omn21126-ac11-doc-section-grounding"
    description: "Cited paths absent from the tree index are reported ungrounded."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_context_doc_section_select_compute/test_golden_chain_context_doc_section_select.py -q -n 0 -k 'ungrounded'"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC11"]
  - id: "dod-omn21126-ac12-doc-section-no-private-names"
    description: "The doc-section handler exists and no file under its node package or tests names a private repository; at the merge base the handler is absent and the check fails."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_context_doc_section_select_compute/test_golden_chain_context_doc_section_select.py -q -n 0 -k no_private_names"
        cwd: "${OMNI_HOME}/omnimarket"
      - check_type: "command"
        check_value: >-
          test -f src/omnimarket/nodes/node_context_doc_section_select_compute/handlers/handler_context_doc_section_select.py && ! grep -rqiE 'knowledge.base.internal|omninode.infra|omnibase.internal' src/omnimarket/nodes/node_context_doc_section_select_compute tests/nodes/node_context_doc_section_select_compute
