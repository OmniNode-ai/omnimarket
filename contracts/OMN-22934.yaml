schema_version: 1.0.0
ticket_id: OMN-22934
title: A lane that ended partial or blocked with work left is a floor candidate and gets a continuation lane
summary: The floor record lists, under floor.stopped, every lane whose newest TERMINAL is partial, blocked or failed, whose ticket is in the goal's scope, that names a branch, an ask or a next step, and that no lane on the same work has claimed since. The floor-fill candidates compute turns each into a stopped candidate whose brief inlines the predecessor's last rows and report and the rule to push and continue. A lane that ended done, or ended short and names nothing, is not listed.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn22934-stopped-lane
  statement: A stopped lane is listed on the floor record and becomes a candidate with its predecessor's rows and report in its brief; a done lane is not.
  acceptance:
  - id: AC1
    statement: 'AC1: a lane whose newest TERMINAL is partial, blocked or failed, whose ticket is in scope, that names a branch, an ask or a next step, and that no live lane has claimed since, is listed on the floor as stopped and becomes a candidate whose brief carries the predecessor''s rows and report; a lane that ended done with nothing left is not, with a failing control from tonight''s ledger -- falsifier: uv run pytest of the candidates compute''s stopped-lane tests'
evidence_requirements:
- kind: tests
  description: The golden and error chain tests of the stopped-lane source, built from the ledger of 2026-11-07, and the injected-break controls.
  command: uv run --frozen pytest tests/nodes/node_factory_floor_compute/test_stopped_lanes.py tests/nodes/node_floor_fill_candidates_compute/test_stopped_chain.py src/omnimarket/nodes/node_floor_fill_candidates_compute -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn22934-ac1
  description: The stopped-lane tests pass on the branch, listing the partial lane that names its branch and leaving out the done lane, the lane a successor took and the lanes that name nothing, and fail on origin/dev source.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_factory_floor_compute/test_stopped_lanes.py tests/nodes/node_floor_fill_candidates_compute/test_stopped_chain.py src/omnimarket/nodes/node_floor_fill_candidates_compute -q --no-cov
- id: dod-omn22934-integration-proof
  description: Run the floor compute, effect and candidates tests on a lab host at the pushed head. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-22934 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_factory_floor_compute tests/nodes/node_factory_floor_effect tests/nodes/node_floor_fill_candidates_compute -q --no-cov
