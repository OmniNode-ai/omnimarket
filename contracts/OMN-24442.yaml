schema_version: 1.0.0
ticket_id: OMN-24442
title: Dev runtime rolls once per window and joins its command nodes in time
summary: node_dev_roll_window_gate_effect holds each dev deploy command the deploy effect forwards (envelope on onex.cmd.omnimarket.dev-roll-hold.v1) in a durable store and releases every held command together,
  oldest first, once node_dev_roll_request_compute's batching decision (live mode) says roll now, at most once per overlay interval and never while the previous roll has no completion. Every value is an
  overlay value. The integrated reading is the dev roll count over two hours and the six command node groups' join time after one roll, read from the running dev runtime.
is_seam_ticket: true
interface_change: true
interfaces_touched:
- topics
- public_api
requirements:
- id: req-omn24442-gate
  statement: Dev deploy commands wait for one roll window and are released together.
  acceptance:
  - id: AC1
    statement: 'AC1: a new node holds each dev deploy command in a durable store and releases every held command together, oldest first, when the batching decision says roll now, with the window, minimum start interval and every other value read from an overlay -- falsifier: a held command released before the window ends, a command lost across a restart of the node, or a window value written in the node''s code'
  - id: AC2
    statement: 'AC2: never more than one release per minimum start interval and never a release while the previous roll has not finished -- falsifier: a two-hour simulation with a merge every four minutes that shows more releases than the interval allows, or a release while the previous roll has no completion'
  - id: AC3
    statement: 'AC3: the deploy effect forwards a dev command to the gate only when the gate overlay says live, publishes exactly as before when the overlay is off or absent, and the gate''s release is published without being held again -- falsifier: a live-mode dev command published straight to the deploy agent, or a released command held a second time'
  - id: AC4
    statement: 'AC4: golden chain, error chain, join and seam tests run on the in-memory bus and on the real broker and each fails against a named injected break -- falsifier: renaming a field the gate reads from the deploy command, the facts or the completion event leaves a seam test green'
- id: req-omn24442-integrated
  statement: The roll count and the join times are read from the running dev runtime.
  acceptance:
  - id: AC5
    statement: 'AC5: integrated: after merge and one roll of the running dev runtime, the six command node groups each have a member within 150 seconds, a fresh run-node send to each node is answered, and the number of dev rolls over the next two hours read from the deploy agent''s job records is at most the window allows -- falsifier: a roll count above the window''s bound, a group with no member 150 seconds after the container start, or a send with no answer'
