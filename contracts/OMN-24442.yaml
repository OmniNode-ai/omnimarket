  description: The node and seam tests at the pushed head.
  command: uv run --frozen pytest tests/unit/nodes/node_dev_roll_window_gate_effect tests/nodes/node_redeploy_deploy_effect/test_dev_roll_hold_arm.py -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
