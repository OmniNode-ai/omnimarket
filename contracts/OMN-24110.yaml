schema_version: 1.0.0
ticket_id: OMN-24110
title: "The lane inbox guard finds its settings through the one shared lookup"
summary: >-
  The message-board guard of a running worker reads its settings from one file and, where that file is not found, quietly checks nothing. This is the omnimarket half of the change: the typed model the settings repository validates the guard's settings file through, and a command line for the one overlay root resolver so the guard (a plain python hook) can call it through an omnimarket interpreter. The settings file and the guard change are separate pull requests of the same ticket in the overlays repository and the lane plugin repository.
is_seam_ticket: true
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24110-guard-overlay
  statement: The guard's settings are a typed document held in the overlays repository, and the guard resolves them through the overlay root resolver; a missing document is a stated refusal.
  acceptance:
  - id: AC1
    statement: "AC1: the lane-inbox guard overlay is held in the overlays repository and validated through an omnimarket model at a pinned merged revision -- falsifier: python -m pytest tests/test_lane_inbox_guard_overlay.py -q in the overlays repository fails when a key is removed or a bound is changed"
  - id: AC2
    statement: "AC2: the guard resolves its overlay through the overlay root resolver and not only the declared roots, and an overlay that no root holds is a stated refusal of the lane's next call naming the roots tried -- falsifier: python -m pytest tests/test_lane_inbox_guard_overlay_resolution.py -q in the lane plugin repository fails when the resolver call is removed or the refusal is turned into a pass"
  - id: AC3
    statement: "AC3: seams: the guard's overlay keys, the omnimarket model's fields and the overlays document name the same keys, read on the in-memory bus and on the real broker from a lab host -- falsifier: the seam tests in all three repositories fail when one side adds or drops a key"
  - id: AC4
    statement: "AC4: integrated: a lab lane launched with the guard reads its inbox on its first call and a message sent after the lane starts is seen, read in the lane's journal file lane-inbox-journal.jsonl on the lab host -- falsifier: the journal holds no show entry for the planted message"
evidence_requirements:
- kind: tests
  description: The model and resolver command line tests pass at the pushed head.
  command: uv run pytest tests/unit/models/test_lane_inbox_guard_overlay_document_omn24110.py tests/nodes/node_overlay_roots_resolve_effect -q -p no:randomly --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24110-ac1
  description: 'AC1 (omnimarket side): the model refuses a missing key, an unknown key, a non-positive or non-integer number and a pattern that does not compile; the overlays repository holds the document and its pin in its own pull request.'
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/models/test_lane_inbox_guard_overlay_document_omn24110.py -q -p no:randomly --no-cov
    cwd: .
- id: dod-omn24110-ac2
  description: 'AC2 (omnimarket side): the resolver command line prints the ordered roots as one JSON line and exits 2 with its finding when no root is present; the guard side is the lane plugin repository pull request.'
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_overlay_roots_resolve_effect -q -p no:randomly --no-cov
    cwd: .
- id: dod-omn24110-ac3
  description: 'AC3 (omnimarket side): the model field set equals the expected 22 keys, held by a test that fails when the model adds or drops one; the resolver command line was run on lab host h053 with the real filesystem and printed the store root, the canonical overlays clone and the declared root.'
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/models/test_lane_inbox_guard_overlay_document_omn24110.py -q -p no:randomly --no-cov
    cwd: .
- id: dod-omn24110-ac4
  description: 'hosted proxy for AC4: the tests pass here; the lane reading of the guard is posted as a pull request comment naming the host, the revision running and the journal entry.'
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_overlay_roots_resolve_effect -q -p no:randomly --no-cov
    cwd: .
- id: dod-omn24110-integration-proof
  description: the model and resolver command line tests run on a lab host at the pushed head; hosted CI cannot reach the lab, so only the local Done gate runs this unbound check
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24110 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/models/test_lane_inbox_guard_overlay_document_omn24110.py tests/nodes/node_overlay_roots_resolve_effect -q --no-cov -p no:randomly
