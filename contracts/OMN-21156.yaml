schema_version: 1.0.0
ticket_id: OMN-21156
title: Canonical claim resolver handler with reproducible equivalence
summary: 'The existing typed resolver entrypoint is renamed from verify(request) to handle(request), and
  its CLI and unit callers use the canonical entrypoint. Resolver business logic is unchanged. Both debt
  lists remove the node. The equivalence producer re-executes twelve inputs against the legacy implementation
  from git. The recorded draft and revision account for two attempts, one accepted and one rejected: 50
  percent, below the 70 percent bar.'
is_seam_ticket: false
interface_change: true
interfaces_touched:
- public_api
requirements:
- id: req-canonical-rewrite
  statement: The claim resolver exposes the canonical runtime entrypoint with unchanged resolver behavior
    and recorded acceptance accounting.
  acceptance:
  - id: AC1
    statement: 'AC1: each rewritten omnimarket node leaves the non-canonical list with its line removed
      and the shape check passing -- falsifier: canonical_handler_shape.py for omnimarket exits non-zero,
      or the node''s line is still in the list'
  - id: AC2
    statement: 'AC2: every rewrite is proved equivalent by re-execution, never by a self-reported file
      -- falsifier: verify_flip_bundle.py or equivalence_producer''s byte comparison fails for the node,
      or the verbatim-body proof does not re-derive from git'
  - id: AC3
    statement: 'AC3: attempted, accepted and rejected rewrites are recorded against the roadmap''s 70%
      bar -- falsifier: the ticket has no such table'
evidence_requirements:
- kind: tests
  description: Canonical dispatch goldens, both baseline removals, and recorded attempt accounting. The
    existing CI shape and flip-bundle gates also consume the adequacy and reproducible equivalence artifacts.
  command: uv run pytest tests/unit/nodes/node_claim_resolver/test_claim_resolver_canonical_replay.py
    -q
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn21156-ac1-canonical-shape
  description: The contract-declared handler accepts a single typed request and is absent from both debt
    baselines. The existing canonical-handler-shape CI job independently classifies it.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/nodes/node_claim_resolver/test_claim_resolver_canonical_replay.py
      -q -k canonical_shape_and_baselines
- id: dod-omn21156-ac2-replay
  description: Twelve canonical dispatch cases match outputs captured from the legacy implementation.
    The committed equivalence_replay.v2 declaration is independently re-executed and byte-compared by
    the existing flip-bundle CI gate; the full module AST matches its git base after normalizing the sole
    method rename. Replay coverage is 37.09 percent with an explicit adequacy waiver for unchanged command-backed
    and import-time code.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/nodes/node_claim_resolver/test_claim_resolver_canonical_replay.py
      -q -k "contract_handler_replays_legacy or mismatch_oracle"
- id: dod-omn21156-ac3-attempt-accounting
  description: 'The recorded dataset retains a rejected draft and a verifier-accepted revision in the
    denominator: 1/2 accepted, 50 percent against 70 percent. The matching ticket-table comment is prepared
    for publication by the launching host. This is one node and does not claim the 30-day no-revert observation.'
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/nodes/node_claim_resolver/test_claim_resolver_canonical_replay.py
      -q -k rewrite_attempt_accounting
- id: dod-omn21156-deploy-entrypoint-probe
  description: 'Hosted deployment source probe at the evaluated commit: require the canonical handle method
    in the published claim-resolver handler. Fails on the merge-base source, which exposes verify instead.
    This checks the published revision, not a production rollout.'
  source: manual
  checks:
  - check_type: command
    check_value: gh api "repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_claim_resolver/handlers/handler_claim_resolver.py?ref=$(git
      rev-parse HEAD)" --jq '.content | gsub("\n"; "") | @base64d | contains("    def handle(")' | grep
      -qx true
