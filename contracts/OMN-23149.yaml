schema_version: "1.0.0"
ticket_id: OMN-23149
title: "Stage 4 of unused-code removal: a module referenced only by tests leaves with those tests, and a skill never seen goes only after a rare-path check names no drill that uses it"
summary: >-
  node_code_quarantine_effect gains the two reads of stage 4. A quarantine request whose entity kind is test-only-module is
  refused when it names a test file as the module, names no test that references the module, or leaves a referencing test out
  of the tests that leave with it, so the tests never go alone. A request whose entity kind is skill-never-seen is refused
  unless it carries a rare-path check that names its evidence and read at least one drill, and is refused when any drill read
  uses the skill. The kind is stored on the record. Requests without a kind read as before. Two new typed outcomes carry the
  refusals, four named source mutations each turn the stage-4 chain red, and the acceptance reads run on the in-memory rig and
  on the real files and git rig. Reading the code graph and the drills, and the standing run that publishes the verdicts, are
  not part of this change.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn23149-stage-4-quarantine-reads
    statement: A module referenced only by tests leaves with its tests, and a skill never seen leaves only after a rare-path check that names no drill using it, by the quarantine node.
    acceptance:
      - id: AC1
        statement: 'AC1: a module referenced only by tests is removed together with those tests and never the tests alone -- falsifier: uv run pytest src/omnimarket/nodes/node_code_quarantine_effect -q -k stage_4_tests_go_with_module'
      - id: AC2
        statement: 'AC2: a skill never seen goes only after a rare-path check names no drill that uses it -- falsifier: uv run pytest src/omnimarket/nodes/node_code_quarantine_effect -q -k stage_4_skill_rare_path'
evidence_requirements:
  - kind: tests
    description: The quarantine node's acceptance reads, golden, error and stage-4 chains and named mutations, on the in-memory rig and on the real files and git rig.
    command: uv run --frozen pytest src/omnimarket/nodes/node_code_quarantine_effect -q --no-cov
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
