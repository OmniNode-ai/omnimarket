schema_version: 1.0.0
ticket_id: OMN-23343
title: Define the launch candidate manifest and its verifier node (unit half of the launch candidate check)
summary: Defines the launch candidate manifest model and a verifier node, node_release_candidate_verify_effect, that reads an installed environment, a plugin install, PyPI facts and ancestry facts and refuses any mismatch with the file, entry point or launcher line named. The release train publishes the candidate; the manifest names what it must publish.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23343-manifest-verifier
  statement: A launch candidate manifest and a verifier that refuses an installed environment, a plugin install, a PyPI read or a cut that does not match it.
  acceptance:
  - id: AC1
    statement: 'AC1: the launch candidate manifest model and the verifier node refuse an install whose packages differ from the manifest -- falsifier: uv run pytest tests/nodes/node_release_candidate_verify_effect -q'
  - id: AC2
    statement: 'AC2: the verifier''s mutation cases each read installed_matches_manifest=false and the clean case reads true -- falsifier: uv run pytest tests/nodes/node_release_candidate_verify_effect -q -k mutation'
evidence_requirements:
- kind: tests
  description: The verifier's tests over stub candidate wheels installed by real uv tool, pipx and venv installs, with mutation cases.
  command: uv run pytest tests/nodes/node_release_candidate_verify_effect -q
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23343-ac1-verifier
  description: The verifier node's tests refuse an installed environment, a plugin install, a PyPI read and a cut that differ from the manifest, naming the file, entry point or launcher line, and the golden and error chain tests over the declared topics pass.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_release_candidate_verify_effect -q --no-cov -p no:randomly
    cwd: .
- id: dod-omn23343-ac2-mutation
  description: Each mutation case (module edit, entry_points edit, extra onex.cli distribution, second owner of onex, launcher retarget, early exit, replaced call, launcher outside the environment, launcher missing from the path) reads installed_matches_manifest=false naming the file, entry point or launcher line; the untouched uv tool, pipx and venv installs read true.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_release_candidate_verify_effect/test_installed_content.py -q --no-cov -p no:randomly -k mutation
    cwd: .
- id: dod-omn23343-ac2-clean
  description: The clean installs (uv tool, pipx and a venv with pip) read installed_matches_manifest=true over the same stub candidate wheels, the control that the mutation cases are measured against.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_release_candidate_verify_effect/test_installed_content.py -q --no-cov -p no:randomly -k untouched
    cwd: .
- id: dod-omn23343-integration-proof
  description: Run the verifier's tests on a lab host at the pushed head, over real uv tool, pipx and venv installs of the stub candidate wheels. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23343 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_release_candidate_verify_effect -q --no-cov
