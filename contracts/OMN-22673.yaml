schema_version: 1.0.0
ticket_id: OMN-22673
title: The factory floor site gets a Machines tab with one card per host of the host table
summary: The factory floor site had machine status only inside the Dashboard's machine rows and the Factory floor tab's bays, and since the simple floor took the site address the detail page behind its Details link carried no free disk, no heartbeat age and no Docker reading. The floor record now carries one host_status row per host of the host table, each value read from the host table, the pool read, the capacity advertisement, the slot markers or the host-drift fleet projection and marked stale past its source's bound or unread with the reason, and the detail page draws them in a Machines tab.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn22673-machines-tab
  statement: The floor record's host_status holds a row per host of the host table whose every value is read, stale or unread with its source and reason, and the detail page's Machines tab draws each row without ever drawing an unread or aged source as read.
  acceptance:
  - id: AC1
    statement: 'AC1: the floor record carries one host_status row per host of the host table (nine today), each with availability and the table''s reason, slots used of cap, the occupying lanes by name, ticket and run minutes, landing workers, lab-run job count, load per core, free memory and pressure, free disk, heartbeat age, Docker present and the reading age, every value read from the host table, the pool read, the capacity advertisement, the slot markers or the host-drift fleet file -- falsifier: uv run --frozen pytest tests/nodes/node_factory_floor_compute/test_host_status.py -q --no-cov'
  - id: AC2
    statement: 'AC2: a value with no source today, a missing source and a reading older than its bound each draw as unread with the reason or as stale, never as a number or as healthy, and a test with the staleness check removed fails -- falsifier: uv run --frozen pytest tests/nodes/node_factory_floor_compute/test_host_status.py -q --no-cov'
  - id: AC3
    statement: 'AC3: the detail page has a Machines tab that draws every host_status row and refreshes with the publish cycle -- falsifier: uv run --frozen pytest src/omnimarket/nodes/node_factory_floor_publish_effect/tests/test_machines_tab.py -q --no-cov'
  - id: AC5
    statement: 'AC5: after a branch install of the publisher, curl of the factory-floor.json of the lab site (the address in the deployment overlay of the publisher) shows nine host_status rows and a screenshot of the Machines tab shows them -- falsifier: curl of the served factory-floor.json read after one publish tick and counted for host_status rows'
evidence_requirements:
- kind: tests
  description: The per-host record from a recorded pool read, the error and stale cases, the failing control, and the tab drawn from the record
  command: uv run --frozen pytest tests/nodes/node_factory_floor_compute/test_host_status.py src/omnimarket/nodes/node_factory_floor_publish_effect/tests/test_machines_tab.py tests/nodes/node_factory_floor_publish_effect -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn22673-host-status-and-tab
  description: The per-host record reads each value from its own source and marks a missing source unread and an aged one stale, and the tab draws the record's rows with those states. For AC5 this item reads the part a test can read, the tab drawn from the compute node's record with nine hosts; it does not read the served site, which the item below checks at the local Done gate and binds to no criterion.
  source: manual
  binds_ac:
  - AC1
  - AC2
  - AC3
  - AC5
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_factory_floor_compute/test_host_status.py src/omnimarket/nodes/node_factory_floor_publish_effect/tests/test_machines_tab.py -q --no-cov
    cwd: .
- id: dod-omn22673-integration-proof
  description: Run this pull request's own check on a lab host at the pushed head. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-22673 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_factory_floor_compute tests/nodes/node_factory_floor_publish_effect src/omnimarket/nodes/node_factory_floor_publish_effect/tests -q --no-cov
    cwd: .
- id: dod-omn22673-ac5-served-record
  description: 'Evidence for no criterion, read at the local Done gate. The served factory-floor.json carries one host_status row per host of the host table.'
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: uv run python -c 'import json,os,urllib.request; d=json.load(urllib.request.urlopen(os.environ["FLOOR_SITE_URL"].rstrip("/") + "/factory-floor.json", timeout=30)); n=len(d["floor"]["host_status"]); assert n >= 9, n'
    cwd: .
