schema_version: 1.0.0
ticket_id: OMN-24557
title: Host hygiene job settings accept the shared message bus line so one run can be asked for on demand
summary: The overlay of node_host_hygiene_orchestrator holds the schedule, the cleanups and the hosts, and its model (ModelHostHygieneOrchestratorOverlay, extra=forbid) has no event_bus key, so the one overlay file the bus overlay reader needs for an on-demand run through onex run-node is refused on that key. The model gains the optional event_bus key, which the orchestrator never reads, the way the loop overlay model of omnimarket#6237 carries it. The overlays side (the event_bus block in the deployed file and its pin) is a separate pull request of the same ticket. Not in this change - the cleanup rules, the schedule and the dispatch.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24557-shared-overlay
  statement: The host hygiene orchestrator settings model accepts the one overlay file the bus reader also reads, and still refuses an event_bus block with an unknown key.
  acceptance:
  - id: AC1
    statement: "AC1: the host hygiene orchestrator's settings model accepts the optional shared event_bus key, and a settings file that carries it loads -- falsifier: a test that loads the packaged example settings with an event_bus block and fails with the extra-key refusal on the previous model"
  - id: AC2
    statement: "AC2: the deployed settings file of the job names the bus kind and lane, and its pin names a commit that has the key -- falsifier: the overlays repository test of the job's settings fails when the block is removed"
  - id: AC3
    statement: "AC3: integrated: with the change running, one on-demand run is asked for through the node command and its terminal answer is read in the dev runtime -- falsifier: the demand answers with the missing-key refusal instead of a terminal event"
evidence_requirements:
- kind: tests
  description: The overlay model tests at the pushed head; the event_bus key tests fail against the model before this change.
  command: uv run pytest tests/unit/nodes/node_host_hygiene_orchestrator/test_overlay_model.py -q -n 0 --no-cov -p no:cacheprovider
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24557-ac1
  description: 'AC1: the event_bus key tests pass with the change; against the model before it the key and shared-file tests fail with the extra-forbidden refusal.'
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/nodes/node_host_hygiene_orchestrator/test_overlay_model.py -q -n 0 --no-cov -p no:cacheprovider -k 'event_bus or shared_file'
    cwd: .
- id: dod-omn24557-ac2
  description: 'AC2 seam: the overlay file is read alike by the model and the bus reader; the overlays repository holds the deployed block and its own test in the overlays pull request of this ticket.'
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/nodes/node_host_hygiene_orchestrator/test_overlay_model.py -q -n 0 --no-cov -p no:cacheprovider -k shared_file
    cwd: .
- id: dod-omn24557-integration-proof
  description: 'AC3 lab proxy: the overlay model tests run on a lab host at the pushed head; the on-demand run through onex run-node in the dev runtime is read in the pull request comment and is not claimed by this local check'
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24557 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/nodes/node_host_hygiene_orchestrator/test_overlay_model.py -q --no-cov -p no:randomly
    cwd: .
- id: dod-omn24557-ac3-hosted-proxy
  description: 'hosted proxy for AC3: the shared-file test reads one document through the model and the bus reader and both name the same bus.'
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/nodes/node_host_hygiene_orchestrator/test_overlay_model.py -q -n 0 --no-cov -p no:cacheprovider -k shared_file
    cwd: .
