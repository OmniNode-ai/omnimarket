schema_version: 1.0.0
ticket_id: OMN-25017
title: The Mac factory-floor-publish step factory_floor finishes inside its limit by fixing what it waits on, so its R9 lines are published
summary: The factory_floor step's cold ledger window read read every split archive one reader subprocess after another (38.5 s measured on lab host h051, 15 archives, 185,739 rows) because the deployed overlay named no read_workers (the overlays change that names it is an open draft). The floor effect's contract now declares the worker count (4) and the archive cache time (172800 s) the read uses when the overlay names none; the step's 45 s limit is not raised.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn25017-factory-floor-inside-limit
  statement: The factory_floor step's cold window read finishes inside the publisher's 45 s step limit, so the step is ok and the cycle publishes its R9 lines.
  acceptance:
  - id: AC1
    statement: 'AC1: the 45 s wait is measured and named (which read, query or probe, and its duration) with the evidence in the PR body -- falsifier: the draft PR body read for a Diagnosis line naming the step''s wait and its measured seconds'
  - id: AC2
    statement: 'AC2: a regression test built from the recorded err-log line fails on main and passes on the fix, both runs on the lab -- falsifier: uv run pytest on the new test file under the factory floor publish node''s tests in omnimarket, red on origin/main and green on the branch'
  - id: AC3
    statement: 'AC3: the factory_floor step finishes inside its limit and publishes its R9 lines, with no timeout raise unless the PR body cites the measurement that the work needs it -- falsifier: the publish-status file of one cycle on the branch shows factory_floor ok and a non-zero R9 line count'
evidence_requirements:
- kind: tests
  description: The cold window read test under the factory floor publish node's tests.
  command: env -u PYTHONPATH uv run --frozen pytest tests/nodes/node_factory_floor_publish_effect/test_factory_floor_cold_archive_reads.py -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn25017-ac1-measured-wait
  description: The cold window read's measured seconds (38.5 s one archive at a time, 20.2 s four at a time) are modelled in the test against the recorded 45 s limit; the PR body carries the Diagnosis line.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_factory_floor_publish_effect/test_factory_floor_cold_archive_reads.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn25017-ac2-regression-test
  description: The regression test built from the recorded err-log line is red on origin/dev and green on the branch.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_factory_floor_publish_effect/test_factory_floor_cold_archive_reads.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn25017-ac3-inside-limit
  description: A cold cycle of the floor effect under the deployed overlay reads the archives together, the contract declares the count, and the step limit is not raised.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_factory_floor_publish_effect/test_factory_floor_cold_archive_reads.py tests/nodes/node_factory_floor_publish_effect/test_unresolved_step_seam.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn25017-integration-proof
  description: Hosted CI cannot reach a lab host, so only the local Done gate runs this unbound check. It runs the cold window read test and the floor effect's archive read tests at the sha on a lab host, where the floor effect reads its split archives through the plugin's ledger reader subprocess.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-25017 --kind test -- env -u PYTHONPATH uv run --frozen pytest tests/nodes/node_factory_floor_publish_effect/test_factory_floor_cold_archive_reads.py tests/nodes/node_factory_floor_effect/test_ledger_window_by_archive.py -q --no-cov -n 0 -p no:randomly
    cwd: .
