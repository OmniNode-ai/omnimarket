- id: dod-omn22478-integration-proof
  description: The pushed head ran the run engine node tests on a lab host through the bus and exited 0; with RUN_ENGINE_TEMPORAL_OVERLAY set on the host the same suite also runs against the host's own Temporal server. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: |-
      uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane rm-e1-run-engine-0630 -- uv run --frozen pytest tests/nodes/node_run_engine_effect -q --no-cov
