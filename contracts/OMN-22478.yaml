    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_reading_compute/test_reading_compute.py::test_planted_input_yields_the_expected_reading tests/nodes/node_reading_writer_effect/test_reading_writer.py::test_every_declared_piece_gets_a_row_and_the_rows_pass_the_ledger_grammar -q --no-cov --refuse-skips"
