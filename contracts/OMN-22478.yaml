        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn22478-integration-proof"
    description: >-
      The pushed head ran the reading nodes' suites on a lab host through the lab work runner and exited 0.
      The hourly unit's installation and its runs on the pool host are read after merge from the installed unit and its rows.
    source: "manual"
    execution_scope: local_done_gate
    checks:
      - check_type: "command"
        check_value: 'uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-22478 -- uv run --frozen pytest tests/nodes/node_reading_compute tests/nodes/node_reading_writer_effect -q -p no:randomly --no-cov'
        cwd: "."
  - id: "dod-omn22478-deploy-runtime-container"
    description: >-
      A hosted runner starts the reading writer in an isolated Python 3.12 container. The hourly
      verb must append one row per declared piece and the probe must append nothing. This runs
      the PR's source and configured transport end to end without a pool host or private overlay.
    source: "manual"
    execution_scope: hosted_and_local
    binds_ac: ["AC1", "AC7"]
    checks:
      - check_type: "command"
        check_value: 'docker run --rm -e PYTHONDONTWRITEBYTECODE=1 -e UV_PROJECT_ENVIRONMENT=/tmp/reading-venv -v "$PWD:/workspace:ro" -w /workspace ghcr.io/astral-sh/uv:python3.12-bookworm uv run --frozen pytest tests/nodes/node_reading_writer_effect/test_reading_cli.py::test_hourly_writes_one_row_per_piece_for_a_window_through_the_configured_routes tests/nodes/node_reading_writer_effect/test_reading_cli.py::test_probe_writes_nothing -q --no-cov -p no:randomly -p no:cacheprovider'
        cwd: "."
