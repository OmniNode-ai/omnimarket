schema_version: "1.0.0"
ticket_id: "OMN-22478"
title: "B0: the reading writer node and the hourly read-only probes"
summary: >-
  B0 of the base-first plan adds node_reading_compute (a reading as a pure function of ledger rows in a window
  closed at a fixed time plus ten minutes) and node_reading_writer_effect (the only writer of reading rows, with
  the hourly probes and their own systemd user timer, installed and rolled back by the node).
is_seam_ticket: false
interface_change: true
interfaces_touched:
  - "public_api"
requirements:
  - id: "req-omn22478-reading-writer"
    statement: >-
      A reading is a pure function of ledger rows in a closed window, only the reading writer writes reading rows,
      and each failure is a typed event and a ledger row.
    acceptance:
      - id: "AC1"
        statement: "AC1: A planted ledger yields the expected reading row: verdict, outcome, reason, window, key, content, manifest and the injected fault, and the row passes the ledger row grammar."
      - id: "AC2"
        statement: "AC2: A planted conflicting duplicate fails the window; an identical duplicate is dropped by key."
      - id: "AC3"
        statement: "AC3: A replay under the same key with different content is a replay failure and the first row stands."
      - id: "AC4"
        statement: "AC4: A stale source reads NOT WORKING (fail, not warn); an unreadable source and a piece with no producer read UNKNOWN with a reason, never blank."
      - id: "AC5"
        statement: "AC5: The golden chain ends in the success event under one correlation id, every error chain ends in its typed failure event with a ledger row, and each named injected break turns a chain assertion red."
      - id: "AC6"
        statement: "AC6: The ledger is read through the route the overlay names: it follows the variable when the path moves, the old path is refused, and an unset variable refuses naming itself."
      - id: "AC7"
        statement: "AC7: Only the reading writer node builds reading rows, and a probe appends nothing."
      - id: "AC8"
        statement: "AC8: The hourly unit renders from the contract, survives a reboot (Persistent timer), installs only on a declared host and rolls back by uninstall."
  - id: "req-omn22478-host-readings"
    statement: >-
      Read-only hourly probes read state that exists only on a writing host (its ledger outbox, its old ledger
      names), one row per probe per run, in the same reading shape, each shown failing by a named injected break.
    acceptance:
      - id: "AC9"
        statement: "AC9: A stale queued request (over the bound), a refused file or an unreadable queued file reads the outbox NOT WORKING on both backends; a queue inside the bound reads WORKING."
      - id: "AC10"
        statement: "AC10: An old ledger name restored to a regular file, removed or pointed elsewhere reads NOT WORKING on both backends; a configured path that is itself an old name cannot pass."
      - id: "AC11"
        statement: "AC11: The golden chain ends in the success event under one correlation id; an unreadable source, an append that does not land, a bad payload and an undeclared host each end in a typed failure, and the schedule installs and rolls back on systemd and launchd."
  - id: req-omn22478-host-row-ledger-path
    statement: The lab host row model takes the ledger_path column the lab host table carries, under the launcher's rule.
    acceptance:
      - id: AC12
        statement: 'AC12: a row declaring ledger_path loads with it and a relative one refuses -- falsifier: the table is refused whole at the base'
  - id: req-omn22478-registry-overlay-documents
    statement: The overlay home holds typed models for the registry-wide configuration documents, and a document with no pinned model is refused.
    acceptance:
      - id: AC13
        statement: 'AC13: the registry-wide overlay documents load through ModelRegistryDocuments models, the vocabulary overlay keeps an open key set while refusing any value that is not a list of strings, a stamp or a day count -- falsifier: uv run --frozen pytest tests/unit/models/test_registry_overlay_documents_omn22478.py -q --no-cov'
evidence_requirements:
  - kind: "tests"
    description: "The focused test files."
    command: "uv run pytest tests/nodes/node_reading_compute tests/nodes/node_reading_writer_effect -q --no-cov --refuse-skips"
  - kind: "tests"
    description: "CI Summary's external layers pass with no reviewer row, and the reviewer starts no run."
    command: "uv run --frozen pytest tests/ci/test_review_gate_removed_omn22478.py -q --no-cov"
  - kind: tests
    description: The registry-wide overlay documents load through their models the way the overlay home loads them.
    command: uv run --frozen pytest tests/unit/models/test_registry_overlay_documents_omn22478.py -q --no-cov
  - kind: tests
    description: CI Summary's external layers pass with no reviewer row, and the reviewer starts no run.
    command: uv run --frozen pytest tests/ci/test_review_gate_removed_omn22478.py -q --no-cov
  - kind: tests
    description: The composed-runtime-boot job writes its own broker budget into the env file and reads the broker's start arguments back before it boots the stack.
    command: uv run --frozen pytest tests/unit/docker/test_composed_boot_broker_budget_omn22478.py -q --no-cov
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
