        check_value: "uv run pytest tests/nodes/node_reading_compute/test_reading_compute.py::test_a_conflicting_duplicate_fails_the_window tests/nodes/node_reading_compute/test_reading_compute.py::test_an_identical_duplicate_is_dropped_by_key tests/nodes/node_reading_writer_effect/test_reading_chain_events.py::test_error_chain_a_conflicting_duplicate_fails_the_window_for_that_piece -q --no-cov --refuse-skips"
        cwd: "${OMNI_HOME}/omnimarket"
