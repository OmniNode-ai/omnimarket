schema_version: 1.0.0
ticket_id: OMN-25188
title: 'Review findings 1 to 5 on omnimarket PR 6343 at head 9da8aaff1b30 are fixed or argued: the contract tests load the real loader, AC1 and AC2 bind to their own falsifiers, every terminal event is
  published and granted, the result topic has a reader grant, and the Lab comment is at the new head'
summary: The tests for the host table keys ingest result topic now load the node contract through the runtime's own discovery and wiring and watch one dispatch end as a result event on the bus; the evidence
  contract of the parent ticket binds its AC1 and AC2 to their own falsifiers and leaves them open on the hosted gate; the absence of a bus reader of the result topic is asserted.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn25188-review-findings
  statement: Every blocking review finding on the pull request is fixed with a test that fails on the old shape, or argued with evidence in a pull request comment.
  acceptance:
  - id: AC1
    statement: 'AC1: every blocking finding (1 to 5) of the review at head 9da8aaff1b30 is fixed with a test that is red on that head and green on the new head, or argued with evidence in a PR comment --
      falsifier: `uv run pytest tests/nodes/node_host_table_keys_ingest_effect -q` on the lab at the new head passes while the new tests fail against the source files of head 9da8aaff1b30'
  - id: AC2
    statement: 'AC2: a test loads the node contract through the runtime''s own loader and asserts the result route and result applier are wired, the contract schema accepts externally_consumed_topics and
      terminal_event, and every terminal event topic is published and granted WRITE -- falsifier: `uv run pytest tests/nodes/node_host_table_keys_ingest_effect -q -k ''loader or terminal or applier''` fails
      with the two new keys or the applier wiring removed'
  - id: AC3
    statement: 'AC3: contract AC1 and AC2 of contracts/OMN-24932.yaml are bound to their own falsifiers (a docker logs grep on h201 and a ledger `grep -F omnimarket#5924` for the STATUS row) or left open,
      the description of the h201 read is reworded, and the reader principal of the result topic holds a READ and DESCRIBE grant that is added or cited with where the topic is provisioned -- falsifier:
      `uv run pytest tests/nodes/node_host_table_keys_ingest_effect -q -k ''contract or grant''` fails when the YAML-shape pytest is restored as the AC1 binding or the reader grant is removed'
  - id: AC4
    statement: 'AC4: a PR comment starting `Lab: head=<full head sha>` names exactly the pushed head after the required suites ran on the lab (a whole-suite timeout rerun in named parts), with the base
      and head runs of the packet command attached and the draft state confirmed -- falsifier: `onex scm pr-view OmniNode-ai/omnimarket#6343` shows a head that differs from the head named in the Lab: comment,
      or no Lab: comment'
evidence_requirements:
- kind: tests
  description: The host table keys ingest node's tests, including the runtime-loader and bus tests of the result topic.
  command: uv run --frozen pytest tests/nodes/node_host_table_keys_ingest_effect -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn25188-ac1-node-tests
  description: 'The node''s tests pass at the head; the new tests fail on the base commit (the base and head runs are attached to the pull request in a Lab: comment).'
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_host_table_keys_ingest_effect -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn25188-ac2-loader-applier
  description: The loader, terminal-event and applier tests fail with the two top-level keys or the publish declaration removed.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_host_table_keys_ingest_effect -q --no-cov -n 0 -p no:randomly -k 'loader or terminal or applier'
    cwd: .
- id: dod-omn25188-ac3-contract-grant
  description: The evidence-contract and grant tests fail when the YAML-shape pytest is bound to AC1 or AC2 again or a grant row is removed.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_host_table_keys_ingest_effect -q --no-cov -n 0 -p no:randomly -k 'contract or grant'
    cwd: .
- id: dod-omn25188-ac4-lab-comment
  description: 'AC4 runs on the local Done gate only, since hosted CI cannot read the pull request''s Lab: comment: the pull request head it prints must be the head the Lab: comment names.'
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: onex scm pr-view OmniNode-ai/omnimarket#6343
    cwd: .
  binds_ac:
  - AC4
- id: dod-omn25188-integration-proof
  description: 'Integration proof: the pushed head''s ingest node tests ran on a lab host through the lab work runner and exited 0. Hosted CI cannot reach the lab, so only the local Done gate runs this
    unbound check.'
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-25188 --kind test -- env PYTHONDONTWRITEBYTECODE=1
      uv run --frozen pytest tests/nodes/node_host_table_keys_ingest_effect -q --no-cov
