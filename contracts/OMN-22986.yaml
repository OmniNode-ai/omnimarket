schema_version: 1.0.0
ticket_id: OMN-22986
title: The lab fill nodes decide what lab-fill.js decides, cell by cell on recorded ticks, with a planted divergence control
summary: The node_lab_fill_plan_compute dispatch plan lacked what lab-fill.js gained since the nodes were ported (the lane priority class order, the open-count gate, the landing controller's cause and escalation, the source kinds and the PR value with a cause suffix). The plan now carries them, the run's classes and repositories come from its configuration, and a replay of 156 ticks recorded from the current lab-fill.js pure block compares capacity, selection and send flags cell by cell.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn22986-parity
  statement: The lab fill nodes answer every recorded tick with the cells lab-fill.js answered, and a planted divergence turns the replay red.
  acceptance:
  - id: AC1
    statement: 'AC1: the omnimarket node produces the same selection and send decisions as lab-fill.js on a replay of recorded ticks, cell by cell -- falsifier: uv run pytest src/omnimarket/nodes/node_lab_fill_orchestrator -q -k parity_with_lab_fill_js'
  - id: AC3
    statement: 'AC3: a planted divergence between the node and the replay turns the parity test red -- falsifier: uv run pytest src/omnimarket/nodes/node_lab_fill_orchestrator -q -k planted_divergence'
evidence_requirements:
- kind: tests
  description: The parity replay and its planted divergence controls.
  command: uv run --frozen pytest src/omnimarket/nodes/node_lab_fill_orchestrator/tests -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn22986-ac1
  description: The 156 recorded ticks replay with no divergent cell, and fail on the dev plan source.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest src/omnimarket/nodes/node_lab_fill_orchestrator/tests -q --no-cov -k parity_with_lab_fill_js
- id: dod-omn22986-ac3
  description: A recorded cell changed, and a node setting changed, are each named as divergent by the replay.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest src/omnimarket/nodes/node_lab_fill_orchestrator/tests -q --no-cov -k planted_divergence
- id: dod-omn22986-integration-proof
  description: Run the lab fill parity replay and the plan node tests on a lab host at the pushed head. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-22986 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest src/omnimarket/nodes/node_lab_fill_orchestrator/tests tests/nodes/node_lab_fill_plan_compute -q --no-cov
