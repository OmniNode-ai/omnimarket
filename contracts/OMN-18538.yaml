schema_version: 1.0.0
ticket_id: OMN-18538
title: A failure-explanation node turns raw delegation failures into a readable account, marked commentary and never evidence
summary: A pure compute node groups recorded delegation failures by their recorded cause and writes a readable account of each group; every output carries a machine-readable commentary marker, no gate, closer or receipt path consumes it, and a failure with no recorded cause reads unknown.
