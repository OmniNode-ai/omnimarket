schema_version: 1.0.0
ticket_id: OMN-18538
title: A failure-explanation node turns raw delegation failures into a readable account, marked commentary and never evidence
summary: A pure compute node groups recorded delegation failures by their recorded cause and writes a readable account of each group; every output carries a machine-readable commentary marker, no gate, closer or receipt path consumes it, and a failure with no recorded cause reads unknown.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn18538-failure-explanation
  statement: node_delegation_failure_explanation_compute takes recorded failures from held surfaces, groups them by recorded cause, and returns an account per group marked commentary, with an explicit unknown group for failures that carry no cause.
  acceptance:
  - id: AC1
    statement: 'AC1: it is a compute node over data already held, with no new collection -- falsifier: it reads a surface that does not exist today'
  - id: AC2
    statement: 'AC2: every output carries a machine-readable commentary marker -- falsifier: an output indistinguishable from a probe result'
  - id: AC3
    statement: 'AC3: no gate, closer or receipt path consumes its output -- falsifier: a test plants an explanation output in an evidence position and something accepts it'
  - id: AC4
    statement: 'AC4: grouping is by recorded metadata, not by the model''s own judgement about category -- falsifier: the grouping key comes from the generated text'
  - id: AC5
    statement: 'AC5: a failure with no recorded cause produces an explicit unknown rather than an invented one -- falsifier: an account asserting a cause the input does not carry'
evidence_requirements:
- kind: tests
  description: The node's focused tests pass, each criterion with its failing control
  command: uv run --frozen pytest tests/nodes/node_delegation_failure_explanation_compute -q --no-cov -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn18538-held-surfaces
  description: Every input field maps to a run_trace column or a client-verdict field that exists today, and the node declares no effect; the failing control shows a column that does not exist is found missing.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_delegation_failure_explanation_compute/test_failure_explanation.py -q --no-cov -p no:randomly -k ac1
    cwd: .
- id: dod-omn18538-marker
  description: Every output and every group carries the commentary marker; the failing control shows an output cannot be built without or with another marker, or with is_evidence true.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_delegation_failure_explanation_compute/test_failure_explanation.py -q --no-cov -p no:randomly -k ac2
    cwd: .
- id: dod-omn18538-no-consumer
  description: No source file outside the node imports it and no other contract subscribes to its topics; an explanation output planted in the receipt request and in the client verdict is refused; the failing control shows the scans catch a planted consumer.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_delegation_failure_explanation_compute/test_failure_explanation.py -q --no-cov -p no:randomly -k ac3
    cwd: .
- id: dod-omn18538-grouping
  description: Groups are keyed by the recorded cause fields only; the failing control injects a narrator that names another category and the group keys do not move.
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_delegation_failure_explanation_compute/test_failure_explanation.py -q --no-cov -p no:randomly -k ac4
    cwd: .
- id: dod-omn18538-unknown
  description: A failure with no recorded cause is grouped and worded as unknown and never reaches a narrator; the failing control injects a narrator that invents a cause.
  source: manual
  binds_ac:
  - AC5
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_delegation_failure_explanation_compute/test_failure_explanation.py -q --no-cov -p no:randomly -k ac5
    cwd: .
- id: dod-omn18538-chain
  description: The golden chain (sample failures grouped through the registered contract on the in-memory bus) and the error chain (blank correlation id refused with no result) pass. A regression check that binds no criterion.
  source: manual
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_delegation_failure_explanation_compute/test_golden_chain_delegation_failure_explanation_compute.py -q --no-cov -p no:randomly
    cwd: .
- id: dod-omn18538-integration-proof
  description: On a lab host the node's golden and error chain event tests and its criterion tests run at the pushed head through the lab work runner, so the node runs as registered rather than only in the lane. Hosted CI cannot reach the lab runner, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: 'env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-18538 --kind test -- uv run --frozen pytest tests/nodes/node_delegation_failure_explanation_compute -q --no-cov -p no:randomly'
    cwd: .
