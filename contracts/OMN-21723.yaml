---
schema_version: "1.0.0"
ticket_id: OMN-21723
title: 'Sub-issues of a parent in project Ready are created with project none, because the create step clears the project Linear inherits from the parent'
summary: 'node_create_ticket clears an inherited project with a direct issueUpdate(projectId: null), reads it back, and repairs the lane-created tickets of one UTC day that Linear put in a project'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn21723-clear-inherited-project
    statement: A lane-created child of a parent in a project comes out with no project, and the tickets that already came out in Ready are cleared, through the one spelling Linear accepts.
    acceptance:
      - id: AC1
        statement: 'AC1: node_create_ticket clear_project clears a ticket project with a direct issueUpdate(projectId: null) and reports success only when an independent readback shows an explicit null project, and repair_project for 2026-11-02 and 2026-11-03 leaves no lane-created ticket of those days in project Ready -- falsifier: with LINEAR_API_KEY set, uv run python -m omnimarket.nodes.node_create_ticket --operation clear_project --ticket-id OMN-21723 prints "project_cleared": true, and uv run python -m omnimarket.nodes.node_create_ticket --operation repair_project --day 2026-11-02 --from-project Ready --dry-run prints "candidate_ids": [], and the same for --day 2026-11-03'
      - id: AC2
        statement: 'AC2: step 8 of the create-ticket skill names the one executable command that clears the project and reads it back, in place of the project=null spelling the Linear MCP cannot send, and its test fails for a step that names no command -- falsifier: in the plugin repository that owns the skill, uv run pytest plugins/omni/skills/create-ticket/tests/test_project_readback.py -q'
evidence_requirements:
  - kind: "tests"
    description: "The clear, the readback, the repair and the create path against recorded Linear responses, with a RED control"
    command: "uv run pytest tests/nodes/node_create_ticket/test_ticket_project.py -q --no-cov"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn21723-ac1-tests"
    description: "AC1 clear_project, repair_project and the create path against the recorded Linear responses, including the control where Linear ignores the update and the node reports failure"
    source: "manual"
    binds_ac: [AC1]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_create_ticket/test_ticket_project.py -q --no-cov --tb=line"
        cwd: "."
  - id: "dod-omn21723-ac1-live-integration-proof"
    description: "AC1 through the host LINEAR_API_KEY, no ticket of 2026-11-02 in project Ready is left for a lane-created ticket. Hosted CI holds no Linear key, so only the local Done gate runs this unbound check."
    source: "manual"
    execution_scope: "local_done_gate"
    checks:
      - check_type: "command"
        check_value: >-
          bash -o pipefail -c 'uv run python -m omnimarket.nodes.node_create_ticket --operation repair_project --day 2026-11-02 --from-project Ready --dry-run | grep -F "\"candidate_ids\": []" > /dev/null'
        cwd: "."
  - id: "dod-omn21723-ac2-skill-step"
    description: "AC2 the skill step and its test live in the plugin repository that owns the skill, checked there by its own validate-plugin gate; here the node command the step names must exist in the CLI."
    source: "manual"
    binds_ac: [AC2]
    checks:
      - check_type: "command"
        check_value: >-
          bash -o pipefail -c 'uv run python -m omnimarket.nodes.node_create_ticket --help | grep -F "clear_project" > /dev/null'
        cwd: "."
  - id: "dod-omn21723-deploy-probe"
    description: "Deploy probe: the handler GitHub serves at the checked-out commit defines clear_inherited_project, which the merge base does not."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: >-
          bash -o pipefail -c 'gh api "repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_create_ticket/handlers/handler_ticket_project.py?ref=$(git rev-parse HEAD)" --jq .content | base64 -d | grep -F "def clear_inherited_project" > /dev/null'
        cwd: "."
  - id: "dod-omn21723-lab-integration-proof"
    description: "The pushed head ran the create-ticket node tests on a lab host through the bus and exited 0. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check."
    source: "manual"
    execution_scope: "local_done_gate"
    checks:
      - check_type: "command"
        check_value: >-
          uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane fix-project-clear-21723-1103 -- uv run --frozen pytest tests/nodes/node_create_ticket -q --no-cov
        cwd: "."
