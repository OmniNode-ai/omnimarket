schema_version: 1.0.0
ticket_id: OMN-21723
title: A ticket created through node_create_ticket comes out with no project, whatever its parent's project
summary: The create mutation sends an explicit null project, and every create is read back by a separate
  query and cleared through issueUpdate with projectId null when a project is still set.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn21723-create-null-project
  statement: node_create_ticket never files a ticket that reads back with a project.
  acceptance:
  - id: AC1
    statement: 'AC1: node_create_ticket clear_project clears a ticket project with a direct issueUpdate(projectId:
      null) and reports success only when an independent readback shows an explicit null project -- falsifier:
      pytest tests/nodes/node_create_ticket/test_ticket_project.py'
  - id: AC3
    statement: 'AC3: the create mutation sends an explicit null project and every create is read back and
      cleared when a project is still set -- falsifier: pytest tests/nodes/node_create_ticket/test_ticket_create_null_project.py'
evidence_requirements:
- kind: tests
  description: The node_create_ticket project tests, offline.
  command: uv run pytest tests/nodes/node_create_ticket -q --no-cov -n 0
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn21723-ac1-clear-project
  description: 'AC1: clear_project clears with an explicit null and reports success only on a null readback'
  source: manual
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_create_ticket/test_ticket_project.py -q --no-cov -n 0
    cwd: .
  binds_ac:
  - AC1
- id: dod-omn21723-ac3-create-null-project
  description: 'AC3: the create sends an explicit null project and reads every new ticket back'
  source: manual
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_create_ticket/test_ticket_create_null_project.py -q --no-cov
      -n 0
    cwd: .
  binds_ac:
  - AC3
- id: dod-omn21723-integration-proof
  description: The pushed head, run on a lab host, passes the node_create_ticket create-path tests (explicit null project, readback, clear). Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: |-
      uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane ticket-project-fix-2213 -- uv run --frozen pytest tests/nodes/node_create_ticket/test_ticket_create_null_project.py -q --no-cov
    cwd: .
