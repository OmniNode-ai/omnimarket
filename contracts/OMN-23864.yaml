schema_version: 1.0.0
ticket_id: OMN-23864
title: Routing order step answers which engines a code task tries, in what order, from settings
summary: A compute node, node_delegation_routing_order_compute, reads the escalation chain of a task class from the routing overlay bound by DELEGATION_ROUTING_OVERLAY_PATH, resolves it with resolve_class_escalation_chain, and answers the rungs in order with each ladder tier's backends and max_retries plus one attempts and each harness rung's backend and refusals. Its request and answer models are the core library's. An unbound overlay, a missing or invalid chain, an unreadable routing contract or a chain that does not open on the lab tier is a typed refusal with no rungs and no default order. It replaces the earlier order effect node built to the wrong design, which is left untouched.
is_seam_ticket: true
interface_change: true
interfaces_touched:
- topics
- public_api
requirements:
- id: req-omn23864-order-from-overlay
  statement: The answer's rungs and attempts come from the bound overlay and the routing tiers file; a changed overlay or max_retries changes the answer with no code change, and a setting that cannot be read is a typed refusal.
  acceptance:
  - id: AC1
    statement: 'AC1: for a fixture overlay the routing order step answers exactly local, Codex, GLM through Claude Code, the lab agent, cheap_frontier, cheap_cloud, claude with the local tier backends and max_retries plus one attempts, and an overlay change changes the answer -- falsifier: uv run pytest tests/nodes/node_delegation_routing_order_compute/test_order_and_attempts_read.py -q'
  - id: AC2
    statement: 'AC2: an unbound overlay, a missing chain, an invalid chain, an unreadable contract or a chain not opening on the lab tier is a typed refusal with no rungs and no default order -- falsifier: uv run pytest tests/nodes/node_delegation_routing_order_compute/test_order_unreadable.py -q'
  - id: AC3
    statement: 'AC3: no third router exists: the code budget node has no chain operation and no delegation.code_chain key is read anywhere -- falsifier: uv run pytest tests/unit/routing/test_no_code_chain_router.py -q'
  - id: AC4
    statement: 'AC4: the node answer shape is the core library shape and the command and answer topics are fixed by a seam test that fails when either side changes, run on the in-memory bus and on the real broker -- falsifier: uv run pytest tests/nodes/node_delegation_routing_order_compute/test_routing_order_seam.py -q'
evidence_requirements:
- kind: tests
  description: The routing order node tests pass at the pushed head.
  command: uv run --frozen pytest tests/nodes/node_delegation_routing_order_compute tests/unit/routing/test_no_code_chain_router.py -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
