    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23864 --kind test -- env RUN_REDPANDA_ROUTING_ORDER=1 PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_delegation_routing_order_compute/test_routing_order_seam.py -q --no-cov -n 0 -p no:randomly
