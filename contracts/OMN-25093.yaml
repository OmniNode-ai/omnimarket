schema_version: 1.0.0
ticket_id: OMN-25093
title: The host job claim read runs on each lab host from a declared installer unit and puts its run on the bus
summary: node_host_job_claim_compute had no caller, no schedule and no publish topic, so a merged change read NOT RUNNING. The host installer declares a systemd unit (host-job-claim-systemd) that runs the node's tick hourly on the host it is installed on; the tick reads that host's unit files against the node's overlay, publishes the run-completed topic the contract declares and writes the unit's evidence file.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn25093-host-job-claim-runs
  statement: The host job claim read runs on a lab host from a unit the declared installer renders and installs, and each run's result is on the bus and in an evidence file.
  acceptance:
  - id: AC1
    statement: 'AC1: the tick reads the host named by ONEX_LEDGER_HOST_NAME against the overlay, publishes the contract run-completed topic and exits 0 in sync and 1 on a duplicate, and a bus that refuses the record is indeterminate -- falsifier: pytest tests/nodes/node_host_job_claim_compute/test_runtime_host_job_claim_tick.py -q fails when the publish is removed'
  - id: AC2
    statement: 'AC2: the declared installer renders an hourly systemd unit for the tick that names the host and refuses an install without the host name -- falsifier: pytest tests/nodes/node_host_installer_registry_units/test_host_job_claim_unit.py -q fails when the unit is removed from the installer contract'
  - id: AC3
    statement: 'AC3: a missing overlay or a host with no declared role leaves its reason in the evidence file instead of a clean run -- falsifier: pytest tests/nodes/node_host_job_claim_compute/test_runtime_host_job_claim_tick.py -k "overlay or role" -q'
evidence_requirements:
- kind: tests
  description: The tick tests and the installer unit tests, each with its failing control.
  command: uv run --frozen pytest tests/nodes/node_host_job_claim_compute tests/nodes/node_host_installer_registry_units/test_host_job_claim_unit.py -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn25093-ac1
  description: The tick tests publish the contract topic, exit by verdict and treat a refused publish as indeterminate.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_host_job_claim_compute/test_runtime_host_job_claim_tick.py -q --no-cov
    cwd: .
- id: dod-omn25093-ac2
  description: The unit test renders the unit against the node's contract and shows the install refused without the host name.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_host_installer_registry_units/test_host_job_claim_unit.py -q --no-cov
    cwd: .
- id: dod-omn25093-ac3
  description: The overlay and role failing controls leave their reason in the evidence file.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_host_job_claim_compute/test_runtime_host_job_claim_tick.py -k "overlay or role" -q --no-cov
    cwd: .
- id: dod-omn25093-integration-proof
  description: Run the tick and the unit tests at the pushed head on a lab host. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check; it binds no criterion for the hosted check. The live install and the run on h051 are recorded in the pull request's Lab line.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-25093 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_host_job_claim_compute tests/nodes/node_host_installer_registry_units/test_host_job_claim_unit.py -q --no-cov
    cwd: .
