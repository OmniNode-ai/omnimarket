---
schema_version: "1.0.0"
ticket_id: "OMN-16831"
title: "The tenant authority regression gate examines both failure paths"
summary: "The projection write-path regression gate examined only DLQ failure reasons, while current write-path failures surface as ProjectionNotMaterializedError wrapping ProjectionTenantContextError. The gate now examines both DLQ and offset-withholding failures, and a real-adapter test covers every declared tenant read, upsert and upsert_returning operation. The AC4 row drives an unattributed terminal through the real dispatch and requires the refusal to fail the callback. No runtime source is changed."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-tenant-authority-gate-both-failure-paths"
    statement: "The tenant authority regression gate fails when the mandatory-authority requirement is restored, whichever failure path carries the refusal."
    acceptance:
      - id: "AC1"
        statement: "AC1: every declared tenant relation reaches SQL without a bound authority, through the real adapter and topology -- falsifier: uv run pytest tests/chains/test_event_chain_gate_projection_write.py -q finds a relation whose operation is refused for missing authority"
      - id: "AC4"
        statement: "AC4: a tenant refusal on a projection write fails the dispatch and is never acked -- falsifier: uv run pytest tests/chains/test_event_chain_gate_projection_write.py -k test_a_tenant_refusal_on_the_projection_write_fails_the_dispatch -q finds the unattributed terminal's TenantRequiredError DLQ'd and acked, a terminal published, or a row stored"
evidence_requirements:
  - kind: "tests"
    description: "AC4 hosted probe. The unattributed delegation terminal fails the real dispatch with its typed refusal and stores no row; the same terminal with a registered tenant stores exactly one."
    command: "env -u PYTHONPATH uv run pytest tests/chains/test_event_chain_gate_projection_write.py -k test_a_tenant_refusal_on_the_projection_write_fails_the_dispatch -q"
  - kind: "tests"
    description: "AC1 hosted probe. The chain gate test passes at the head, and the new test is absent at the merge base."
    command: "env -u PYTHONPATH uv run pytest tests/chains/test_event_chain_gate_projection_write.py -q"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn16831-ac1-tenant-relations-reach-sql"
    description: "AC1 hosted probe. The chain gate test passes at the head, and the new test is absent at the merge base."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/chains/test_event_chain_gate_projection_write.py -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC1"]
  - id: "dod-omn16831-ac4-tenant-refusal-fails-dispatch"
    description: "AC4 hosted probe. The unattributed delegation terminal fails the real dispatch with its typed refusal and stores no row; the same terminal with a registered tenant stores exactly one."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/chains/test_event_chain_gate_projection_write.py -k test_a_tenant_refusal_on_the_projection_write_fails_the_dispatch -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC4"]
  - id: "dod-omn16831-ac3-delegation-row-matches-terminal"
    description: "AC3 lab readback, not bound to the ticket's AC3 line (the hosted check carries only this repository and cannot reach the lab dev lane). A terminal published by `onex delegate` on the lab dev lane (run dca9bc8d-860e-46e0-9d4d-67c9f16e86f9, correlation 4a58bbb3-7963-4259-bae5-64274b2df78f, 2026-10-14T23:40Z) reported 298 input and 59 output tokens in its receipt; the delegation_events projection holds exactly one row with that correlation_id, the same two token counts, the lane and ticket the terminal named, terminal_ok true and a tenant. The check exits 0 only when that count is 1 and exits 1 when either token count is changed."
    source: "manual"
    execution_scope: "local_done_gate"
    checks:
      - check_type: "command"
        check_value: |-
          ssh -o BatchMode=yes "$ONEX_RUNTIME_SSH_HOST" 'docker exec -i omnibase-infra-postgres psql -X -q -U postgres -d omnidash_analytics -tA' <<'SQL' | grep -Fx 1
          SET default_transaction_read_only = on;
          SELECT count(*) FROM delegation_events WHERE correlation_id = '4a58bbb3-7963-4259-bae5-64274b2df78f' AND tokens_input = 298 AND tokens_output = 59 AND ticket_id = 'OMN-16831' AND caller_lane = 'rem-16831' AND terminal_ok IS TRUE AND tenant_id IS NOT NULL;
          SQL
  - id: "dod-omn16831-ac4-terminal-row-readback"
    description: "AC4 hosted dispatch/readback probe. Success and quality-refused terminals without a tenant fail the callback and store no row. With a registered tenant, each stores exactly one row matching its token counts, ticket, caller lane, outcome, failure cause, score and tenant, and publishes the projection terminal. Complements the separate AC3 lab readback without binding it to an unread criterion."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/chains/test_event_chain_gate_projection_write.py -k test_a_tenant_refusal_on_the_projection_write_fails_the_dispatch -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC4"]
