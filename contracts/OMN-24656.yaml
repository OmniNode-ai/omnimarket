ticket_id: OMN-24656
title: The review gateway's key-state topics have dev broker ACL rows and the key-credit probe's schedule is declared in omnimarket
summary: The key-credit probe of the review gateway (onex models review-gateway-key-probe) had no scheduled home outside the frozen internal repository. This change declares its launchd unit, review-key-credit-probe, in the host installer's registry units beside the Claude token pool rotation tick it is shaped on, with a tick module that runs the probe command from the node's own overlay and writes the unit's heartbeat. The broker ACL rows for the gateway's two key-state topics are declared in the deployment overlays, in a separate pull request.
