schema_version: 1.0.0
ticket_id: OMN-26045
title: The lab alarm's container-restarts verb can be scheduled
summary: container-restarts joins the lab alarm's schedulable verbs, so a condition_schedules entry for it renders a launchd or systemd unit that runs the verb. Before this, the verb had a command topic with no producer and no schedule could declare it.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn-26045-container-restarts-schedulable
  statement: A condition_schedules entry keyed container-restarts loads, and the rendered unit runs the container-restarts verb.
  acceptance:
  - id: AC1
    statement: 'AC1: container-restarts is a schedulable verb and the golden launchd and systemd renders run it -- falsifier: uv run pytest tests/nodes/node_lab_alarm/test_lab_alarm_condition_schedule.py -q --no-cov -k container-restarts (selects nothing and exits 5 at the merge base, passes at the head)'
evidence_requirements:
- kind: tests
  description: Per-verb schedule goldens, which parametrize over SCHEDULABLE_VERBS and read the example overlay
  command: uv run --frozen pytest tests/nodes/node_lab_alarm/test_lab_alarm_condition_schedule.py -q --no-cov -k container-restarts
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn-26045-tests
  description: AC1 proven by the per-verb schedule goldens.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_lab_alarm/test_lab_alarm_condition_schedule.py -q --no-cov -k container-restarts
    cwd: .
- id: dod-omn-26045-deploy
  description: 'Deploy probe the hosted runner can run: the overlay model at the checked-out commit lists container-restarts as schedulable; the line does not exist at the merge base.'
  source: manual
  checks:
  - check_type: command
    check_value: grep -F '"container-restarts",' src/omnimarket/nodes/node_lab_alarm/overlay.py
    cwd: .
- id: dod-omn-26045-integration-proof
  description: The change is run on a lab host at the pushed head and the reading is named in the pull request.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane l0act-dev2 -- uv run --frozen pytest tests/nodes/node_lab_alarm/test_lab_alarm_condition_schedule.py -q --no-cov -k container-restarts
    cwd: .
