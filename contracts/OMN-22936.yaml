schema_version: 1.0.0
ticket_id: OMN-22936
title: "Piece 7's first task: the J6 join test: a stop committed in the gate store lands as a durable and a projected audit row, and another send of that piece is refused at once, golden and error"
summary: The gate store node gains a J6 join handler. A stop committed in the in-memory gate store lands one durable audit row and one projected row for the same piece and the next send of that piece is refused by the store; a stop whose commit gets no answer by its deadline leaves the piece's send fence closed, with an audit row of its own, and a send of another piece is admitted. A sink that drops the audit row turns both scenarios red. The running wiring on the bus and the Postgres backend of the store are not part of this change.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn22936-j6-join
  statement: A stop committed in the gate store lands as a durable and a projected audit row and fences the piece's sends, with a golden and an error case.
  acceptance:
  - id: AC1
    statement: "AC1: golden join test: a stop committed in the in-memory gate store lands one durable audit row and one projected row for the same piece and a second send of that piece is refused -- falsifier: uv run pytest tests/integration/test_join_j6.py -q -k golden"
  - id: AC2
    statement: "AC2: error join test: a stop whose commit gets no answer by its deadline refuses the send (fence fails closed) and a send of another piece is admitted -- falsifier: uv run pytest tests/integration/test_join_j6.py -q -k error"
  - id: AC3
    statement: "AC3: a named mutation that drops the audit row turns both tests red -- falsifier: uv run pytest tests/integration/test_join_j6.py -q -k mutation"
evidence_requirements:
- kind: tests
  description: The acceptance tests of this ticket at the pushed head.
  command: uv run --frozen pytest tests/integration/test_join_j6.py -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
- id: dod-omn22936-j6-golden
  description: The golden join tests pass; on the dev source they fail at collection because the join handler does not exist.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/integration/test_join_j6.py -q --no-cov -n 0 -p no:randomly -k golden
    cwd: .
- id: dod-omn22936-j6-error
  description: The error join tests pass, including a stop with no answer by a 0.05 second deadline, a store that raises, a store refusal and a projection that never hears the row.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/integration/test_join_j6.py -q --no-cov -n 0 -p no:randomly -k error
    cwd: .
- id: dod-omn22936-j6-mutation
  description: The named mutation drop_audit_row turns the golden and the error scenario red, each with a control run of the same scenario that passes without the mutation.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/integration/test_join_j6.py -q --no-cov -n 0 -p no:randomly -k mutation
    cwd: .
- id: dod-omn22936-integration-proof
  description: The pushed head ran the J6 join tests on a lab host through the lab work runner and exited 0. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: 'uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-22936 -- uv run --frozen pytest tests/integration/test_join_j6.py -q --no-cov -n 0 -p no:randomly'
    cwd: .
- id: dod-omn22936-deploy-source-read
  description: The pushed branch carries the J6 join handler module and the gate store contract binds it under cli_handlers. Read live from GitHub at the branch head, so it fails if the handler is missing from the pushed source.
  source: manual
  checks:
  - check_type: command
    check_value: gh api "repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_gate_store_effect/contract.yaml?ref=omn-22936-j6-gate-store-join" --jq .content | base64 -d | grep -q 'HandlerGateStoreJoinJ6'
    cwd: .
