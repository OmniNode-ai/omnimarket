schema_version: 1.0.0
ticket_id: OMN-20033
title: 'goal contract: closing a goal starts its verification through a closure orchestrator'
summary: A new orchestrator node, node_goal_verification_orchestrator, starts one verifier run per goal id and contract revision when a result event closes a goal or a delegation terminal ends a call goal. The closing event ids are provenance, not part of the key. The start command is published before the attempt is recorded, a disposition is recorded and starts nothing, a quiet verifier is retried to the contract's bound and then written as a missing-verdict obligation, and every close without a verdict is listed. The store, the goal contract reader and the publisher are injected; the in-memory store is the default profile.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn20033-closure-orchestrator
    statement: Each acceptance criterion has a test in tests/nodes/node_goal_verification_orchestrator that fails without the node.
    acceptance:
      - id: AC1
        statement: 'AC1: Closing a goal produces a verdict with no manual step -- falsifier: after a real close on the dev lane, `select count(*) from omninode_internal.dod_verify_runs where goal_id = ''<the lab goal id>''` returns 0.'
      - id: AC2
        statement: 'AC2: A duplicated close starts one run -- falsifier: `uv run pytest tests/nodes/node_goal_verification_orchestrator -k duplicate_close_one_run -v` selects no test or starts two.'
      - id: AC3
        statement: 'AC3: A goal closed with no verdict is listed, not lost -- falsifier: `uv run pytest tests/nodes/node_goal_verification_orchestrator -k unverified_close_listed -v` selects no test or the list is empty.'
evidence_requirements:
  - kind: tests
    description: The node's suite runs at the pushed head on a lab host.
    command: uv run pytest tests/nodes/node_goal_verification_orchestrator -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn20033-ac1
    description: AC1 build proof. A result event that closes a goal reaches the orchestrator through the registered contract and the same event delivered to the engine publishes one verifier start command carrying the goal id, the revision and the goal contract items, with no manual verifier command. The dev-lane read of dod_verify_runs for a real close is the live acceptance and is not run by this check.
    source: manual
    binds_ac:
      - AC1
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/nodes/node_goal_verification_orchestrator -q --no-cov --tb=line -k "closing_a_goal_starts_one_verifier_run or golden_chain or a_delegation_terminal_for_a_call_goal"
        cwd: .
  - id: dod-omn20033-ac2
    description: AC2 delivers one close twice, two distinct closing events for one revision, and a redelivery after a crash between publish and record; each starts one verifier run. The injected break that ignores the recorded run starts two and the reading sees it.
    source: manual
    binds_ac:
      - AC2
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/nodes/node_goal_verification_orchestrator -q --no-cov --tb=line -k "duplicate_close_one_run or a_late_disposition or control_a_close_that_ignores"
        cwd: .
  - id: dod-omn20033-ac3
    description: AC3 leaves a close with no verdict (a publish that failed, a goal contract that could not be read, a verifier lost past the bound) and reads it back through the listing query as pending or exhausted with its reason; a verdict bound later removes it.
    source: manual
    binds_ac:
      - AC3
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/nodes/node_goal_verification_orchestrator -q --no-cov --tb=line -k "unverified_close_listed or control_a_run_dropped or retried_up_to_the_bound or late_verdict"
        cwd: .
  - id: dod-omn20033-deploy-local-runtime
    description: The hosted runner dispatches the packaged goal closure orchestrator through the ONEX local runtime with the in-memory backend. A result event that closes a goal returns one decision for that goal and revision; with no goal contract reader wired the close is listed as pending (contract_unread), not lost. No broker or Docker daemon is required.
    source: manual
    checks:
      - check_type: command
        check_value: |
          set -eu;
          export PYTHONDONTWRITEBYTECODE=1;
          export PATH="$(uv run --frozen python -c 'import sys; from pathlib import Path; print(Path(sys.executable).parent)'):$PATH";
          probe_dir="$(mktemp -d)";
          trap 'rm -rf "$probe_dir"' EXIT;
          uv run --frozen python -c '
          import json
          import sys
          from datetime import UTC, datetime
          from pathlib import Path
          from uuid import UUID
          from omnibase_core.enums.enum_work_outcome import EnumWorkOutcome
          from omnibase_core.models.events.work import ModelSessionActor
          from omnibase_core.models.events.work.model_work_result_recorded import ModelWorkResultRecorded
          event = ModelWorkResultRecorded(
              event_id=UUID("00000000-0000-4000-8000-000000000001"),
              emitted_at=datetime(2026, 11, 9, 12, 0, tzinfo=UTC),
              actor=ModelSessionActor(session_handle="deploy-smoke", agent_kind="build-lane"),
              summary="closed the goal",
              outcome=EnumWorkOutcome.TERMINAL,
              closes_claims=frozenset({UUID("747a3ba5-2ae9-4fa3-8c98-4d7475ce30c5")}),
              contract_revision=UUID("00000000-0000-4000-8000-0000000000a1"),
              friction_none=True,
          )
          Path(sys.argv[1], "close.json").write_text(event.model_dump_json())
          ' "$probe_dir";
          onex node node_goal_verification_orchestrator --input "$probe_dir/close.json" --state-root "$probe_dir/state" --backend event_bus=inmemory --timeout 30 --output receipt --omnibase-path "$PWD" > "$probe_dir/receipt.json";
          uv run --frozen python -c '
          import json
          import sys
          from pathlib import Path
          receipt = json.loads(Path(sys.argv[1], "receipt.json").read_text())
          assert receipt["status"] == "success" and receipt["exit_code"] == 0, receipt
          [decision] = receipt["result"]["decisions"]
          assert decision["action"] == "contract_unread" and decision["goal_id"] == "747a3ba5-2ae9-4fa3-8c98-4d7475ce30c5", decision
          print(json.dumps({"run_id": receipt["run_id"], "decision": decision}, sort_keys=True))
          ' "$probe_dir"
        cwd: .
  - id: dod-omn20033-integration-proof
    description: The pushed head ran the node's suite on a lab host and exited 0. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-20033 -- uv run --frozen pytest tests/nodes/node_goal_verification_orchestrator -q --no-cov
        cwd: .
