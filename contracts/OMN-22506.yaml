    check_value: uv run --no-project --with 'omnibase-core @ git+https://github.com/OmniNode-ai/omnibase_core@031148215620031436cba30619bbae67c0bb38ad' python -m omnibase_core.validators.no_noncanonical_lifecycle_classes --check-stale --allowlist .onex_ratchets/noncanonical_class_allowlist.yaml src/omnimarket
