  description: AC1 the handler renders one UPSERT per row, binds a TIMESTAMPTZ as a datetime, passes the envelope tenant to the adapter, refuses an unsafe identifier before any statement, the request model has no injected keys, and the fold-result model module imports no database adapter. At the merge base the node does not exist, so these fail on import.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/test_golden_chain_projection_write_effect.py -q --no-cov --tb=line
    cwd: .
- id: dod-omn18883-ac1-real-postgres
  description: AC1 the effect node writes a fold result through a real AsyncpgAdapter and the rows exist in Postgres, with UUID, TIMESTAMPTZ and JSONB columns bound as their own types and a second write updating in place.
  source: manual
