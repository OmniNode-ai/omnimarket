schema_version: 1.0.0
ticket_id: OMN-23469
title: Refresh the test timing list so every test file has an entry
summary: The committed per-file test duration record (config/test_file_durations.json) lacked 38 of the repository's test files at dev be2d853fd, 12 short of the freshness test's limit of 50. This change adds one entry for each at the median of the record's positive entries (0.17 s), the declared weight an unrecorded file already takes in the shard plan, leaves every existing entry as it was, and adds a provenance entry. The freshness test and its limit are unchanged.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23469-record-refresh
  statement: Every test file in the tree has an entry in the committed duration record, so the shard plan and the freshness test have headroom again.
  acceptance:
  - id: AC1
    statement: 'AC1: config/test_file_durations.json holds an entry of 0.17 for each of the 38 test files unrecorded at dev be2d853fd, existing entries unchanged, with a matching provenance entry -- falsifier: uv run pytest tests/unit/test_ci_duration_record_supplement.py -k omn23469 -q fails at the merge base (38 entry checks and the provenance check)'
  - id: AC2
    statement: 'AC2: the freshness test and its limit of 50 are unchanged and the unrecorded count on the branch is 0 -- falsifier: git diff origin/dev -- tests/unit/test_ci_shard_plan_record_freshness_omn17427.py is empty'
evidence_requirements:
- kind: tests
  description: The supplement tests for this refresh, the freshness test and the shard plan test.
  command: uv run pytest tests/unit/test_ci_duration_record_supplement.py tests/unit/test_ci_shard_plan_record_freshness_omn17427.py tests/unit/test_ci_shard_plan_omn19684.py -q
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23469-ac1
  description: The supplement tests pass on the branch; run against the merge base's record they fail for all 38 entries and the provenance entry.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/test_ci_duration_record_supplement.py -k omn23469 -q
- id: dod-omn23469-ac2
  description: The test that none of the 38 files is unrecorded and that the freshness test's limit is still 50 passes on the branch; at the merge base the 38 files are unrecorded, so it fails there. The freshness test itself passes at both, so it cannot be the control.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/test_ci_duration_record_supplement.py -k omn23469_pinned_files_are_recorded -q
- id: dod-omn23469-integration-proof
  description: Run the duration record tests on a lab host at the pushed head. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23469 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/test_ci_duration_record_supplement.py tests/unit/test_ci_shard_plan_record_freshness_omn17427.py -q --no-cov
