schema_version: 1.0.0
ticket_id: OMN-24523
title: Age out the root disk temporary folder on lab host h053
summary: 'The temp retention overlay of node_temp_retention_effect names only /data/lab-run/runs/.tmp for h053, while its h051 row also names /tmp. On h053 the root disk holds /tmp (5,784 entries, 512 pytest-tmp folders,
  92 percent of the root disk inodes in use, read 2026-11-14). The h053 row gains /tmp with the h051 protected name pattern, with a test that reports a row without it.'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24523-h053-tmp-root
  statement: The h053 row of the temp retention overlay ages out the root disk /tmp like the h051 row does.
  acceptance:
  - id: AC1
    statement: 'AC1: the packaged temp retention overlay lists /tmp for h053 with the h051 protected name pattern -- falsifier: pytest tests/nodes/node_temp_retention_effect/test_retention_schedule.py -q -k h053 fails when the /tmp entry is removed from the h053 row'
  - id: AC2
    statement: 'AC2: a run of the node on h053 from the changed overlay removes /tmp entries past the window and reports them -- falsifier: the run''s JSON receipt lists removed paths under /tmp and df -i / on h053 shows fewer inodes in use than before the run'
  - id: AC3
    statement: 'AC3: integrated: onex-temp-retention.service on h053, reinstalled from the merged overlay, logs a pass whose windows name /tmp -- falsifier: journalctl --user -u onex-temp-retention.service on h053 shows a pass with /tmp among its windows'
evidence_requirements:
- kind: tests
  description: The overlay tests of the node, including the failing control that reports a row without /tmp.
  command: env -u PYTHONPATH uv run --frozen pytest tests/nodes/node_temp_retention_effect/test_retention_schedule.py -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24523-ac1-overlay-test
  description: The packaged overlay reads clean for h053 and a copy without /tmp is reported.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_temp_retention_effect/test_retention_schedule.py -q --no-cov -n 0 -p no:randomly -k h053
    cwd: .
- id: dod-omn24523-ac2-removal-test
  description: The node removes entries past the window under a declared root and reports them.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_temp_retention_effect/test_temp_retention.py -q --no-cov -n 0 -p no:randomly -k "not read_only_directory"
    cwd: .
- id: dod-omn24523-ac3-install-test
  description: The installed unit renders the overlay row for the host, so its pass names the row's windows.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_temp_retention_effect/test_retention_schedule.py -q --no-cov -n 0 -p no:randomly -k units_carry
    cwd: .
- id: dod-omn24523-ac2-h053-dry-run-reading
  description: The node run on h053 from the packaged overlay names /tmp among its windows; it fails when the h053 row has no /tmp (the pass then reports only the other root).
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env -u PYTHONPATH uv run --frozen python -m omnimarket.nodes.node_temp_retention_effect run --host h053 --overlay src/omnimarket/nodes/node_temp_retention_effect/overlay.yaml --dry-run | python3 -c "import json,sys; d=json.load(sys.stdin); sys.exit(0 if d['host'] == 'h053' and '/tmp' in d['windows'] else 1)"
    cwd: .
- id: dod-omn24523-ac3-h053-journal-reading
  description: The installed unit on h053 logged a pass whose windows name /tmp in the last two hours; it fails when the unit's pass names only the other root.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: ssh h053 journalctl --user -u onex-temp-retention.service --since -2h --no-pager | grep -q '"windows":{[^}]*"/tmp":'
    cwd: .
- id: dod-omn24523-ac2-run-on-h053
  description: The node run on h053 from the branch overlay removed /tmp entries; the receipt names removed paths under /tmp and a count above zero, read from the receipt and not only checked for existence.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: python3 -c "import json; d = json.load(open('.claude_scratch/reports/disk-triage-6803/h053_tmp_real.json')); import sys; sys.exit(0 if d['host'] == 'h053' and not d['dry_run'] and d['removed_count'] > 0 and any(p.startswith('/tmp/') for p in d['removed']) else 1)"
    cwd: .
- id: dod-omn24523-ac3-integration-proof
  description: Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check. The pushed head ran the node overlay tests on a lab host through the lab work runner and exited 0. The running reading (the installed unit on h053 naming /tmp in its next pass, read from its journal after the reinstall) is read from the lab receipt comment on the ticket.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24523 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_temp_retention_effect/test_retention_schedule.py -q --no-cov -n 0 -p no:randomly
    cwd: .
