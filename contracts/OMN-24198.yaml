schema_version: 1.0.0
ticket_id: OMN-24198
title: A scheduled convergence orchestrator runs clone sync on the three lab machines from the shared workflow system
summary: 'New omnimarket node node_convergence_orchestrator: on a runtime tick it sends one convergence command per declared host (h051, h053, h201 in the deployment overlay) as a lab work unit and publishes one run event holding one typed result per host, plus one schedule run event. The overlay mode decides the command: observe runs the new read-only --observe form of the dirty-converge command and changes nothing, act runs the existing dirty-converge tick. A clone the host cannot converge is a typed refusal naming the clone and the reason and the run ends failed. Every host, mode, command, repository, commit and cadence is in the overlay. Not in this change: the deployment overlay, the real-broker run of the lab-work join, the dev runtime reading, and the retirement of the three host timers.'
is_seam_ticket: true
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24198-convergence-orchestrator
  statement: A scheduled orchestrator in the runtime sends one convergence command per lab host over the lab-work service and publishes one typed result per host; in observe mode it changes no clone.
  acceptance:
  - id: AC1
    statement: 'AC1: given a runtime tick and an overlay naming three hosts, the scheduled entry sends one convergence command per host and ends with one typed result per host -- falsifier: the focused test for the scheduled entry fails on origin/dev without the change (no convergence orchestrator exists) and passes with it'
  - id: AC2
    statement: 'AC2: a clean clone and a dirty clone each return their typed result -- falsifier: the golden chain test asserts both results and fails when the dirty clone result is returned for the clean one'
  - id: AC3
    statement: 'AC3: a clone the node cannot converge returns a typed refusal naming the clone and the reason, and the run terminal is failed, not completed -- falsifier: the error chain test with an injected conflicting clone asserts the refusal fields and the failed terminal'
  - id: AC4
    statement: 'AC4: in observe mode the run changes nothing, and the act overlay value changes the clone -- falsifier: with the observe value the injected clones are byte-identical after the run, and with the act value the parked clone is not'
  - id: AC5
    statement: 'AC5: the seam with the lab-work topics fails when either side changes shape, run on the in-memory bus (the real-broker run is the integrated check on the lab) -- falsifier: renaming a lab-work topic in the orchestrator contract turns the seam test red'
  - id: AC6
    statement: 'AC6: the one C row of this slice that was not yet a node step (the observe form of the clone sync) has its own broken-input test before it is scheduled -- falsifier: a child with no readable repository does not read as clean'
  - id: AC7
    statement: 'AC7: integrated: in the running dev runtime the schedule-run record for the convergence job holds a completed or failed run for the three hosts under 10 minutes old, and the three host timers are then absent -- falsifier: no schedule-run event for the job on the dev bus in the last 10 minutes'
evidence_requirements:
- kind: tests
  description: The node's focused tests pass at the pushed head.
  command: env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/nodes/node_convergence_orchestrator tests/chains/convergence -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
