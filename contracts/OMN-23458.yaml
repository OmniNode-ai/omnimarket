schema_version: 1.0.0
ticket_id: OMN-23458
title: The new landing workflow's first step runs on a schedule and its record is read, the last wiring before one repository switches over
summary: The landing snapshot step gets a declared installer unit on the landing controller's host (every 60 s), the landing tick orchestrator gets a real topic reader in src that opens a declared bus lane, the snapshot join test's real-broker leg resolves its broker from a declared lane, and act mode on a cutover repository the old controller rules out of scope writes the recorded decision it needs. The snapshot step's overlay is in the overlays repository (overlays#196).
is_seam_ticket: true
interface_change: true
interfaces_touched:
- topics
- protocols
requirements:
- id: req-omn23458-landing-snapshot-wiring
  statement: The snapshot step runs on a declared unit, its record is read from the bus by the tick orchestrator through a reader in src on a declared lane, and act mode for an out-of-scope cutover repository finds or writes its recorded decision.
  acceptance:
  - id: AC2
    statement: 'AC2: node_host_installer_registry_units declares a unit that runs the snapshot step on its interval on the host that holds the controller''s facts, with the installer''s render test failing at the merge base -- falsifier: the render test at the merge base'
  - id: AC3
    statement: 'AC3: the tick orchestrator reads the snapshot record from the real bus through a reader factory in src, and the join test''s real-broker leg resolves its broker from a declared bus lane (no typed address), failing when either side renames a field -- falsifier: rename one record field and run the join test on the real broker'
  - id: AC4
    statement: 'AC4: act mode for a repository the old controller treats as out of scope finds or writes the decision record it needs, with a golden chain and an error chain for the missing-record case -- falsifier: the act-mode chain test with the record absent'
evidence_requirements:
- kind: tests
  description: The landing snapshot unit's render tests, the tick orchestrator's reader, overlay and act-mode tests, and the snapshot join test
  command: uv run --frozen pytest tests/nodes/node_pr_landing_tick_orchestrator tests/nodes/node_pr_landing_snapshot_effect/test_join_landing_snapshot_tick.py tests/nodes/node_host_installer_registry_units/test_landing_snapshot_unit.py -q --no-cov -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23458-snapshot-unit
  description: Renders and installs the landing-snapshot unit from a branch checkout. The unit runs python -m omnimarket.nodes.node_pr_landing_snapshot_effect every 60 s and at load, with the overlays canonical clone first on ONEX_SKILL_OVERLAY_ROOTS and OMNIBASE_PATH at the registry root; a checkout without the step's entry file is refused. At the merge base the installer declares no landing-snapshot unit, so the command fails there.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_host_installer_registry_units/test_landing_snapshot_unit.py tests/nodes/node_host_installer_registry_units/test_run_timeout.py -q --no-cov -p no:randomly
    cwd: .
- id: dod-omn23458-bus-reader
  description: The tick orchestrator's bus reader in src opens the declared lane (no broker address) and subscribes under the overlay's group from the earliest record; a redpanda overlay with no injected factory reads through it; an overlay naming neither or both of bus_lane and bootstrap_servers is refused. The join test reads every record the snapshot step publishes and refuses a record whose provenance field is renamed or whose facts are missing; its real-broker leg publishes through the step's lane publisher and reads through the orchestrator's own reader on the lane LANDING_SNAPSHOT_JOIN_LANE names.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_pr_landing_tick_orchestrator/test_tick_topic_reader.py tests/nodes/node_pr_landing_tick_orchestrator/test_overlay_backends_pr_landing_tick_orchestrator.py tests/nodes/node_pr_landing_snapshot_effect/test_join_landing_snapshot_tick.py -q --no-cov -p no:randomly
    cwd: .
- id: dod-omn23458-act-out-of-scope
  description: Act mode with no recorded decision, for a cutover repository on the overlay's script_out_of_scope_repositories, writes the recorded decision as no action and compares that repository's subjects only (golden chain, success with recorded_written); for a cutover repository the old controller decides for it ends in RECORDED_DECISION_MISSING naming the repository (error chain); observe mode never writes a record. At the merge base the handler takes no cutover repository, so the command fails there.
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_pr_landing_tick_orchestrator/test_act_out_of_scope_record.py -q --no-cov -p no:randomly
    cwd: .
- id: dod-omn23458-integration-proof-lab
  description: Runs the touched nodes' tests at the pushed head on a lab host through the lab work runner. Hosted CI cannot reach the lab runner, so only the local Done gate runs this unbound item.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: 'env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23458 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_pr_landing_tick_orchestrator tests/nodes/node_pr_landing_snapshot_effect tests/nodes/node_host_installer_registry_units/test_landing_snapshot_unit.py -q --no-cov -p no:randomly'
    cwd: .
