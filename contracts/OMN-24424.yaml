schema_version: 1.0.0
ticket_id: OMN-24424
title: 'Morning installer as a node: refresh only the supporting code on a plugin update'
summary: Starts the omnimarket home of the morning-workflows installer, which lives only in a frozen repository (launchd/morning-workflows/morning_trigger_install.sh, RULING 2026-11-03T18:40:27Z). This first slice is a pure compute node that plans what the installer copies for a mode, with the mode rules in a packaged overlay. The lib-only mode, the behaviour of the frozen repository's pull request 1572, refreshes only the package lib and touches no bin file and reloads no launchd label.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24424-lib-only-plan
  statement: The morning installer's lib-only mode is planned by a node from an overlay, refreshes only the package lib and leaves the bin files and the launchd labels alone.
  acceptance:
  - id: AC1
    statement: 'AC1: a node in omnimarket plans a morning-workflows install in refresh-lib-only mode and returns the supporting-code files and no program files, with every path and name taken from an overlay -- falsifier: pytest src/omnimarket/nodes/node_morning_trigger_install_compute/tests -q -k lib_only fails when the lib-only branch is removed'
  - id: AC2
    statement: 'AC2: the same node refuses an unknown mode with a typed refusal and plans the full install in the default mode, shown by a golden chain test and an error chain test -- falsifier: pytest src/omnimarket/nodes/node_morning_trigger_install_compute/tests -q -k "golden or error"'
  - id: AC3
    statement: 'AC3: integrated: on the Mac the plugin updater''s morning step ran through the node and the node''s receipt shows the lib-only plan with no program file touched while the morning-workflows labels stayed loaded -- falsifier: launchctl list shows the ai.omninode.morning-workflow label loaded with its pid or last exit unchanged across the updater run, and the node receipt on the Mac names the lib-only plan'
evidence_requirements:
- kind: tests
  description: The morning installer compute node tests pass at the pushed head, including the failing control that plans bin files when the mode is ignored.
  command: env -u PYTHONPATH uv run --frozen pytest -q --no-cov src/omnimarket/nodes/node_morning_trigger_install_compute/tests
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24424-ac1
  description: The lib-only plan holds only the lib artifact and reloads no label; the failing control (the old behaviour that ignores the mode) plans a bin file.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: env -u PYTHONPATH uv run --frozen pytest -q --no-cov src/omnimarket/nodes/node_morning_trigger_install_compute/tests/test_golden_chain.py -k lib_only
    cwd: .
- id: dod-omn24424-ac2
  description: The golden chain tests plan install and lib-only; the error chain test refuses an unknown mode with a typed refusal.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: env -u PYTHONPATH uv run --frozen pytest -q --no-cov src/omnimarket/nodes/node_morning_trigger_install_compute/tests/test_golden_chain.py -k "golden or error"
    cwd: .
- id: dod-omn24424-seam
  description: The seam between the packaged overlay and the compute node (the overlay's mode keys) is tested; this is the part of AC3 hosted CI can run. The Mac reading is not part of this slice and is named in the pull request.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: env -u PYTHONPATH uv run --frozen pytest -q --no-cov src/omnimarket/nodes/node_morning_trigger_install_compute/tests/test_golden_chain.py -k seam
    cwd: .
- id: dod-omn24424-deploy-probe
  description: Deploy probe. The installer handler at the checked-out commit defines HandlerMorningTriggerInstall; the probe reads it from GitHub at that commit and exits nonzero on a tree without it, so it fails at the merge base.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: command
    check_value: gh api "repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_morning_trigger_install_compute/handlers/handler_morning_trigger_install.py?ref=$(git rev-parse HEAD)" --jq .content | base64 -d | grep -c '^class HandlerMorningTriggerInstall'
    cwd: .
- id: dod-omn24424-integration-proof
  description: The pushed head ran the node's tests on a lab host through the bus and exited 0. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check; the Mac reading of the plugin updater through the node is not part of this first slice.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane cause-ci-internal4-6803 -- uv run --frozen pytest src/omnimarket/nodes/node_morning_trigger_install_compute/tests -q --no-cov
    cwd: .
