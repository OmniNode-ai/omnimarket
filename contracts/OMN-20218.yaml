- id: dod-omn20218-deploy-probe
  description: Deploy smoke on the runtime after the deploy agent rolls this change - load the node contract from the
    running container and assert that delegation_answer_check routes to HandlerDelegationAnswerCheck with
    ModelAnswerCheckRequest and delegation_doc_check routes to HandlerDelegationDocCheck with ModelDocCheckRequest
    while the other two operations keep their handlers. The command exits nonzero when the deployed image lacks the
    change, including the merge-base image. It reads deployed code, not this contract or a receipt. Hosted CI has no
    runtime; the local Done gate must execute this unbound deployment check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: |-
      bash -c 'docker exec "${RUNTIME_CONTAINER:-omninode-runtime}" python -c "import importlib.resources as r, yaml; c = yaml.safe_load((r.files(\"omnimarket.nodes.node_delegation_rubric_check_compute\") / \"contract.yaml\").read_text()); h = {e[\"operation\"]: e[\"handler\"] for e in c[\"handler_routing\"][\"handlers\"]}; assert h[\"delegation_answer_check\"][\"name\"] == \"HandlerDelegationAnswerCheck\"; assert h[\"delegation_answer_check\"][\"input_model\"].endswith(\"ModelAnswerCheckRequest\"); assert h[\"delegation_doc_check\"][\"name\"] == \"HandlerDelegationDocCheck\"; assert h[\"delegation_doc_check\"][\"input_model\"].endswith(\"ModelDocCheckRequest\"); assert h[\"delegation_route_check\"][\"name\"] == \"HandlerDelegationRouteCheck\"; assert h[\"delegation_rubric_check\"][\"name\"] == \"HandlerDelegationRubricCheck\""'
    cwd: ${OMNI_HOME}/omnimarket
- id: dod-omn20218-deploy-hosted-runtime
  description: Hosted-runner runtime smoke dispatches the answer-check operation from a JSON payload on the local bus,
    reads back a PASS verdict and the draw run directory, and checks the resolved payload model. It fails when the
    checked-out runtime cannot route or execute this operation. The separate local Done gate probe reads deployed code.
  source: manual
  execution_scope: hosted_and_local
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_delegation_rubric_check_compute/test_answer_check.py -q --no-cov -k answer_operation_runs_on_the_local_bus
    cwd: .
- id: dod-omn20218-deploy-hosted-runtime-doc
  description: Hosted-runner runtime smoke dispatches the documentation-check operation from a JSON payload on the
    local bus and reads back a PASS verdict with the draw run directory. It fails when the checked-out runtime cannot
    route or execute this operation.
  source: manual
  execution_scope: hosted_and_local
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_delegation_rubric_check_compute/test_doc_check.py -q --no-cov -k runs_on_the_local_bus
    cwd: .
