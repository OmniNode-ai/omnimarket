schema_version: 1.0.0
ticket_id: OMN-20218
title: 'Walker W2 walks the eight delegation cases: the documentation-case oracle becomes a node operation'
summary: node_delegation_rubric_check_compute routes an operation, delegation_doc_check, to its own handler and its own
  request model. The handler grades a documentation draw (the retry_delay docstring case) against the original function
  the way appendix A.3 check_doc.py of the delegation sprint test matrix does, and returns a typed PASS or FAIL verdict
  that carries the draw's run directory and names every claim that failed, so the DOC-L and DOC-C draws of the walk are
  graded by one oracle rather than by each walker's transcribed copy. The answer text is parsed and never executed;
  doctest examples are evaluated by a restricted evaluator against the caller's reference function. The walk itself
  (machine record, three counted draws per case, the code and test oracles) is not part of this change.
is_seam_ticket: false
interface_change: true
interfaces_touched:
- public_api
requirements:
- id: req-doc-check-operation
  statement: The rubric-check node routes delegation_doc_check to a documentation-check handler that validates its own
    request model and grades a documentation answer by the appendix A.3 rules, without disturbing the other operations.
  acceptance:
  - id: AC1
    statement: 'AC1: contract.yaml routes operation delegation_doc_check to HandlerDelegationDocCheck with
      ModelDocCheckRequest while delegation_rubric_check and delegation_route_check keep their handlers -- falsifier: a
      contract whose handler_routing lacks the operation, or an operation that resolves to another operation''s
      handler'
  - id: AC2
    statement: 'AC2: the 28 controls of appendix A.3 are ported as tests and the handler returns each control''s expected
      verdict, the same verdict the appendix checker gives -- falsifier: a test file carrying fewer than 28 controls, or
      a control whose verdict differs from its label'
  - id: AC3
    statement: 'AC3: the verdict carries the draw''s run directory and names what was wrong, the answer text is never
      executed, and the operation runs on the local bus from a JSON payload -- falsifier: a verdict whose run_directory
      differs from the request, an answer whose doctest imports a module or runs a large power that is not refused, or
      a local-bus dispatch that does not return a PASS or FAIL payload'
evidence_requirements:
- kind: tests
  description: The documentation-check operation resolves to its own handler and model, and the 28 appendix A.3
    controls give their expected verdicts.
  command: uv run pytest tests/nodes/node_delegation_rubric_check_compute/test_doc_check.py -q -p no:randomly --no-cov -n 0
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn20218-d1-operation-routing
  description: The documentation-check operation resolves to HandlerDelegationDocCheck with ModelDocCheckRequest, and
    the rubric-check and route-check operations still resolve to their own handlers.
  source: manual
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_delegation_rubric_check_compute/test_doc_check.py -q -p no:randomly --no-cov -n 0 -k "doc_operation_selects or other_operations_keep"
  binds_ac:
  - AC1
- id: dod-omn20218-d2-appendix-controls
  description: The 28 labelled appendix A.3 controls each return their expected verdict.
  source: manual
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_delegation_rubric_check_compute/test_doc_check.py -q -p no:randomly --no-cov -n 0 -k "test_appendix_doc_controls or twenty_eight_controls"
  binds_ac:
  - AC2
- id: dod-omn20218-d3-verdict-and-bus
  description: The verdict carries the run directory, failures name what was wrong, the answer is never executed, and
    the operation runs on the local bus from a JSON payload.
  source: manual
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_delegation_rubric_check_compute/test_doc_check.py -q -p no:randomly --no-cov -n 0 -k "failures_name or run_directory or never_executed or runs_on_the_local_bus"
  binds_ac:
  - AC3
- id: dod-omn20218-deploy-probe
  description: Deploy smoke on the runtime after the deploy agent rolls this change - load the node contract from the
    running container and assert that delegation_doc_check routes to HandlerDelegationDocCheck with
    ModelDocCheckRequest while the other operations keep their handlers. The command exits nonzero when the deployed
    image lacks the change, including the merge-base image. It reads deployed code, not this contract or a receipt.
    Hosted CI has no runtime; the local Done gate must execute this unbound deployment check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: |-
      bash -c 'docker exec "${RUNTIME_CONTAINER:-omninode-runtime}" python -c "import importlib.resources as r, yaml; c = yaml.safe_load((r.files(\"omnimarket.nodes.node_delegation_rubric_check_compute\") / \"contract.yaml\").read_text()); h = {e[\"operation\"]: e[\"handler\"] for e in c[\"handler_routing\"][\"handlers\"]}; assert h[\"delegation_doc_check\"][\"name\"] == \"HandlerDelegationDocCheck\"; assert h[\"delegation_doc_check\"][\"input_model\"].endswith(\"ModelDocCheckRequest\"); assert h[\"delegation_route_check\"][\"name\"] == \"HandlerDelegationRouteCheck\"; assert h[\"delegation_rubric_check\"][\"name\"] == \"HandlerDelegationRubricCheck\""'
    cwd: ${OMNI_HOME}/omnimarket
