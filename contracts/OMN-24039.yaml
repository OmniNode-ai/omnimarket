    description: The reader and the effect ceiling tests pass at the pushed head.
    command: uv run pytest tests/unit/handlers/test_delegation_call_budget_reader.py tests/unit/delegation/test_inference_call_ceiling_overlay.py -q -n 0 --no-cov -p no:cacheprovider
