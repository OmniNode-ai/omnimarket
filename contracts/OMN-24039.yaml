schema_version: 1.0.0
ticket_id: OMN-24039
title: The delegation call time limit for each kind of task is a setting in the overlays repository
summary: The inference effect's per-call time ceiling was a constant in its contract (120 s, 150 s for glm-5.3), so a local reasoning call that asked for 300 s was cut at 120.000 s on 2026-11-13. This pull request makes the ceiling the call budget of the intent's task class in the code budget overlay (class_budgets_s of node_delegation_code_budget_compute), read on every call through the existing call budget reader, with a strict require_call_budget_s that refuses a class the overlay does not name and require_call_ceiling_s for an intent that names no class. The contract holds no ceiling and the loader of it is removed. The overlays repository names reasoning at 300 s and every other class the effect serves. The omnibase_core field task_type that carries the class is a separate pull request; this change stays a draft until that is on dev and pinned.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn24039-call-ceiling-overlay
    statement: The per-call time ceiling of the inference effect is an overlay value of the intent's task class, read through the call budget reader, refused when the overlay names none, and held by no constant in code or contract.
    acceptance:
      - id: AC1
        statement: 'AC1: the budget reader has a strict read that raises a typed error when the overlay names no budget for a task class and returns the overlay value otherwise -- falsifier: uv run pytest tests/unit/handlers/test_delegation_call_budget_reader.py -q -n 0 --no-cov -k strict'
      - id: AC2
        statement: 'AC2: the inference call effect''s per-call ceiling is the overlay budget of the intent''s task class, refuses a call whose task class the overlay does not name, and holds no ceiling in its contract -- falsifier: uv run pytest tests/unit/delegation/test_inference_call_ceiling_overlay.py -q -n 0 --no-cov'
      - id: AC4
        statement: 'AC4: integrated: a local reasoning call that runs past 120 s finishes under the overlay ceiling on a lab host, and after the overlay value is changed the new ceiling applies with no code change -- falsifier: read the INFERENCE_CALL_TIMEOUT line or its absence and the call''s elapsed seconds in the lab runtime log for the run, and the resolved ceiling before and after the overlay change; a call cut at 120.000 s fails this criterion'
evidence_requirements:
