schema_version: 1.0.0
ticket_id: OMN-26508
title: The work-ledger reader's bus-session route reads replies through a consumer that joins no group, so a read does not pay a group join
summary: A lane-liveness read through the work-ledger reader took 7.4 s on a lab host while the query node answered in 0.26 s; KafkaTransport.start() in the infra query client took 4.07 s joining a fresh uuid consumer group and priming the first fetch. The reader's route factory now builds GrouplessLedgerQueryClient, the infra handler over a transport that assigns the reply partitions by hand and seeks to the end, with no group and no committed offset.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn26508-groupless-reply
  statement: The reader's bus-session route reads replies from the end of the completed topic through hand-assigned partitions and joins no consumer group.
  acceptance:
  - id: AC5
    statement: 'AC5: a test that drives the reader route over a fake aiokafka fails at the merge base (a consumer is built with a uuid group id) and passes on the branch (no consumer carries a group id) -- falsifier: uv run pytest tests/unit/nodes/node_work_ledger_reader_effect/test_reader_no_group_join_omn26508.py -q -n 0 --no-cov passes on origin/dev'
  - id: AC6
    statement: 'AC6: the reader node tests stay green -- falsifier: uv run pytest tests/unit/nodes/node_work_ledger_reader_effect -q -n 0 --no-cov fails on the branch'
evidence_requirements:
- kind: tests
  description: The groupless reply tests pass at the pushed head, the no-group-join test fails at the merge base, and the reader node tests stay green.
  command: uv run pytest tests/unit/nodes/node_work_ledger_reader_effect/test_reader_no_group_join_omn26508.py tests/unit/nodes/node_work_ledger_reader_effect/test_groupless_reply_omn26508.py -q -n 0 --no-cov -p no:cacheprovider
