schema_version: 1.0.0
ticket_id: OMN-26548
title: "Five merged omnimarket nodes (6613, 6606, 6601, 6594 and 6502) are each read SEEN RUNNING or NOT RUNNING on dev, with one evidence line each"
summary: "Reading omnimarket 6613 running on dev found the gateway workflow terminal writer refusing every delivery (ValueError: delivery '' is not declared by the contract): the runtime's typed dispatch arm hands the handler the flat wire object with no topic and no event type. Each contract route now names its own handler class, which carries the route's status."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn26548-verdicts
  statement: Each of the five merged nodes has one verdict read on dev, and the verdicts reach the orchestrator by one ledger message.
  acceptance:
  - id: AC1
    statement: "AC1: each merge named above has one verdict, SEEN RUNNING or NOT RUNNING, with the evidence line (log line, row or command output) quoted beside it -- falsifier: grep the lane report for one verdict line per merge each followed by a non-empty evidence line returns fewer lines than merges today"
  - id: AC2
    statement: "AC2: every SEEN RUNNING verdict names the log, database or journal read that holds its line, and every NOT RUNNING verdict names the declared caller that was invoked and the missing piece with its fix -- falsifier: the report's verdict table read for a row with an empty source or fix cell"
  - id: AC3
    statement: "AC3: the verdicts are sent to orchestrator-31d9-swarm by one ledger MSG -- falsifier: grep the rolling ledger for a MSG row from proof1-1-1210 to=orchestrator-31d9-swarm returns zero rows today"
evidence_requirements:
- kind: tests
  description: The route-bound status tests and the node's golden chain pass at the pushed head.
  command: uv run pytest tests/nodes/node_gateway_workflow_terminal_effect -q -p no:randomly --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn26548-ac1
  description: "AC1: the lane report holds one verdict line per merge, each followed by an evidence line; read on the launching host where the report is written."
  source: manual
  execution_scope: local_done_gate
  binds_ac:
  - AC1
  checks:
  - check_type: command
    check_value: sh -c 'test "$(grep -hcE "^(SEEN RUNNING|NOT RUNNING) omnimarket#(6613|6606|6601|6594|6502):" "$OMNI_HOME"/.claude_scratch/reports/proof1-1-1210-*.md | paste -sd+ | bc)" -ge 5'
    cwd: .
- id: dod-omn26548-ac2
  description: "AC2: the verdict table of the lane report names a source read for each SEEN RUNNING verdict and the invoked caller plus the fix for each NOT RUNNING verdict."
  source: manual
  execution_scope: local_done_gate
  binds_ac:
  - AC2
  checks:
  - check_type: command
    check_value: sh -c 'grep -hE "^\| omnimarket#(6613|6606|6601|6594|6502) " "$OMNI_HOME"/.claude_scratch/reports/proof1-1-1210-*.md | awk -F"|" "NF>=6 && \$4 ~ /[A-Za-z]/ && \$6 ~ /[A-Za-z]/" | wc -l | grep -qx 5'
    cwd: .
- id: dod-omn26548-ac3
  description: "AC3: the lane report records the one message row sent to orchestrator-31d9-swarm, by its request id."
  source: manual
  execution_scope: local_done_gate
  binds_ac:
  - AC3
  checks:
  - check_type: command
    check_value: |-
      sh -c 'grep -hcE "^MSG to orchestrator-31d9-swarm: req=[0-9a-f-]{36}" "$OMNI_HOME"/.claude_scratch/reports/proof1-1-1210-*.md | grep -qx 1'
    cwd: .
- id: dod-omn26548-route-bound-status
  description: "The gateway terminal writer writes the status of the route a topic-less delivery arrived on; the new test file fails on omnimarket dev ac4bd461d0 with the dev runtime's own error and passes at the pushed head."
  source: manual
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_gateway_workflow_terminal_effect -q -p no:randomly --no-cov
    cwd: .
- id: dod-omn26548-integration-proof
  description: the route-bound status tests run on a lab host at the pushed head; hosted CI cannot reach the lab, so only the local Done gate runs this unbound check
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-26548 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_gateway_workflow_terminal_effect/test_route_bound_status.py -q --no-cov
    cwd: .
