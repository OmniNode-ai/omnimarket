schema_version: 1.0.0
ticket_id: OMN-24615
title: The local dashboard serves savings, spend, pass rate, tokens and run duration under more than one definition
summary: 'The local savings figure credited runs the quality gate refused and runs whose provider usage is unknown, the savings topic served a NULL baseline, the baseline was fixed in code, and stored spend included a routing tier''s flat rate on models with no price. This change makes the metering fold save nothing on a run with any failure cause and count it in a served runs_failed column, count a run whose calls were not all provider-measured as unknown tokens, read the configured pricing.baseline_model before the code default, take a run''s cost as spend only when the pricing manifest prices the model that ran, and replace the local savings view with one that serves each run''s modelled saving with its baseline model and pricing version. Recorded cost rows are not rewritten (decision D1); each local store recomputes its derived per-run savings once, so the savings view and the headline read one figure. Metering and usage-by-model-day serve the same token totals: a run with no call record has unknown tokens in both, and a call with no tokens and no cost is unmeasured (an escalation attempt booked 0/0 with its own measured cost keeps it, decision 3). Not in this change: pass rate, per-model grouping and the daily view (AC4, AC6, AC7, in a separate pull request), run duration (AC8) and GET /models (AC9). This contract declares the criteria this pull request delivers, AC1, AC2, AC3 and AC5, each bound to its check.'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24615-one-savings-definition
  statement: The local backend serves one savings figure over runs that succeeded with measured usage and a named price, against the configured baseline, and counts every excluded run by reason.
  acceptance:
  - id: AC1
    statement: 'AC1: the backend serves one savings figure per window, the sum of modelled savings over runs that ended without a failure cause and whose cost and usage are measured, with the baseline model, pricing version and the excluded runs counted by reason, and every local page reads that figure -- falsifier: uv run pytest over a store fixture holding a refused run, an unknown-usage run and a measured run fails unless the served saving equals the measured run''s saving alone and both exclusions are counted by reason'
  - id: AC2
    statement: 'AC2: the savings baseline model comes from the configured pricing.baseline_model before the code default, and the savings topic serves the baseline model and pricing version, never NULL or 0 -- falsifier: uv run pytest that configures a different baseline model fails unless the served saving is priced against it and names it'
  - id: AC3
    statement: 'AC3: spend counts only costs priced from a named price source; a flat tier rate on a model with no price is served as unpriced and counted, not as spend -- falsifier: uv run pytest with a '':free'' model run costed at the tier rate fails unless spend excludes it and the unpriced count includes it'
  - id: AC5
    statement: 'AC5: metering-summary.v1 and usage-by-model-day.v1 serve the same token totals for the same window, or serve the difference with the runs that have no call record, and a call with 0 input and 0 output tokens is not a measured call -- falsifier: uv run pytest with a run that has no call record and a zero-token call fails unless the totals reconcile and the zero-token call is not counted as measured'
evidence_requirements:
- kind: tests
  description: The savings, baseline and spend tests pass at the pushed head.
  command: uv run pytest tests/unit/projection/test_omn24615_metering_unknown_usage.py tests/unit/projection/test_omn24615_configured_pricing_model.py tests/unit/projection/test_omn24615_priced_spend.py tests/unit/projection/test_omn24615_savings_view_one_definition.py tests/unit/projection/test_omn24615_run_savings_recompute.py tests/unit/projection/test_omn24615_zero_token_call.py tests/unit/projection/test_omn24615_token_totals_reconcile.py tests/unit/delegation/test_omn24615_failed_run_saves_nothing.py -q -p no:randomly --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24615-ac1
  description: 'AC1: a store holding a measured, a refused, an unknown-usage, an estimated-usage and a no-call run serves the measured run''s saving alone, with runs_failed 1 and runs_unknown_tokens 3; fails when the headline credits the others.'
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/projection/test_omn24615_metering_unknown_usage.py -q -p no:randomly --no-cov -k saves_only_the_measured_run
    cwd: .
- id: dod-omn24615-ac2
  description: 'AC2: with pricing.baseline_model set in the ONEX home config the headline is priced against that model and names it; fails when the code default is used.'
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/projection/test_omn24615_configured_pricing_model.py -q -p no:randomly --no-cov -k prices_and_names_the_headline
    cwd: .
- id: dod-omn24615-ac3
  description: 'AC3: a '':free'' model run costed at the tier rate and a run on a model with no price are left out of spend and counted in runs_unknown_spend; fails when the tier rate is summed.'
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/projection/test_omn24615_priced_spend.py -q -p no:randomly --no-cov -k only_named_prices_are_summed
    cwd: .
- id: dod-omn24615-ac5
  description: 'AC5: a measured run, an unknown-usage run, a run with no call record and a zero-token, no-cost call; metering and usage-by-model-day both read 313 in and 16 out and the zero-token call is unmeasured; fails when metering sums the no-call run or drops the unknown-usage run.'
  source: manual
  binds_ac:
  - AC5
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/projection/test_omn24615_token_totals_reconcile.py tests/unit/projection/test_omn24615_zero_token_call.py -q -p no:randomly --no-cov
    cwd: .
- id: dod-omn24615-integration-proof
  description: the savings, baseline and spend tests run on a lab host at the pushed head; hosted CI cannot reach the lab, so only the local Done gate runs this unbound check
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24615 --kind test -- env PYTHONDONTWRITEBYTECODE=1
      uv run --frozen pytest tests/unit/projection/test_omn24615_metering_unknown_usage.py tests/unit/projection/test_omn24615_configured_pricing_model.py tests/unit/projection/test_omn24615_priced_spend.py -q --no-cov
    cwd: .
