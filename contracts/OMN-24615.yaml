schema_version: 1.0.0
ticket_id: OMN-24615
title: The local dashboard serves savings, spend, pass rate, tokens and run duration under more than one definition
summary: 'The local SQLite projection views counted never-evaluated runs as failed quality checks (quality_gate_passed and the token columns are NOT NULL DEFAULT 0 in the local store), dropped runs whose data_source is NULL from the summary, grouped per-model figures by the delegated_to alias, and tested IS NULL on columns that cannot be NULL in the daily view. This change adds four view revisions as new one-time store steps after the steps that created their views (quality-gate v2, summary v3, model-routing v3, daily v2): a check is a run with quality_gates_checked other than 0 and a verdict, a NULL data_source is kept, experiment runs stay out of the aggregate views, per-model figures name the model that ran, and the per-day counts use the store''s own markers. Not in this change: savings, spend and tokens (AC1, AC2, AC3, AC5), run duration (AC8) and GET /models (AC9). This contract declares the criteria this pull request delivers, AC4, AC6 and AC7, each bound to its check; the later pull requests for this ticket add AC1, AC2, AC3, AC5, AC8 and AC9 to it with their bindings.'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24615-one-definition-per-figure
  statement: The local backend serves one pass rate over evaluated runs, groups per-model figures by the model that ran, and counts unrecorded runs per day from the store's own markers.
  acceptance:
  - id: AC4
    statement: 'AC4: one pass rate per window, runs that passed the quality gate over runs that were evaluated, with not-evaluated runs counted separately; the summary, quality-gate and model-routing views serve the same rate, and no view drops a run whose data_source is NULL -- falsifier: uv run pytest with a not-evaluated run and a NULL-data_source run fails unless all three views serve the same rate and run count'
  - id: AC6
    statement: 'AC6: every served per-model figure is grouped by the model that ran, with the backend served as its own field -- falsifier: uv run pytest with Beam runs through the byok-reflection backend fails unless model-routing.v1 serves one Beam-1.0-501B-A23B group'
  - id: AC7
    statement: 'AC7: the daily view serves unrecorded runs and unmeasured tokens from the store''s own markers (both token counts 0, quality never evaluated), matching metering-summary.v1 -- falsifier: uv run pytest with a run that has no tokens recorded fails unless daily.v1 counts it as unrecorded'
evidence_requirements:
- kind: tests
  description: The evaluated-runs and served-model view tests pass at the pushed head.
  command: uv run pytest tests/unit/projection/test_omn24615_evaluated_runs_and_served_model.py -q -p no:randomly --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24615-ac4
  description: 'AC4: only evaluated runs are quality checks, a NULL-data_source run is kept, experiment runs stay out, and the summary, quality-gate and model-routing views serve one run count and one pass rate; fails on the previous view steps.'
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/projection/test_omn24615_evaluated_runs_and_served_model.py -q -p no:randomly --no-cov -k "quality_gate_counts_only_evaluated_runs or summary_keeps_a_null_data_source_run or experiment_run_stays_out or three_views_serve_one_run_count"
    cwd: .
- id: dod-omn24615-ac6
  description: 'AC6: one model reached through a backend alias is one group in model-routing.v1; fails when the view groups by delegated_to.'
  source: manual
  binds_ac:
  - AC6
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/projection/test_omn24615_evaluated_runs_and_served_model.py -q -p no:randomly --no-cov -k one_model_reached_through_a_backend_is_one_group
    cwd: .
- id: dod-omn24615-ac7
  description: 'AC7: the daily view counts a never-evaluated run as unrecorded and a run without tokens as unmeasured; fails when it tests IS NULL on NOT NULL DEFAULT 0 columns.'
  source: manual
  binds_ac:
  - AC7
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/projection/test_omn24615_evaluated_runs_and_served_model.py -q -p no:randomly --no-cov -k daily_counts_a_never_evaluated_run
    cwd: .
- id: dod-omn24615-integration-proof
  description: the view store steps and their tests run on a lab host at the pushed head; hosted CI cannot reach the lab, so only the local Done gate runs this unbound check
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24615 --kind test -- env PYTHONDONTWRITEBYTECODE=1
      uv run --frozen pytest tests/unit/projection/test_omn24615_evaluated_runs_and_served_model.py -q --no-cov
    cwd: .
