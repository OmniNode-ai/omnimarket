schema_version: 1.0.0
ticket_id: OMN-24615
title: The local dashboard serves savings, spend, pass rate, tokens and run duration under more than one definition
summary: 'The local savings figure credited runs the quality gate refused and runs whose provider usage is unknown, the savings topic served a NULL baseline, the baseline was fixed in code, and stored spend included a routing tier''s flat rate on models with no price. This change makes the metering fold save nothing on a run with any failure cause and count it in a served runs_failed column, count a run whose calls were not all provider-measured as unknown tokens, read the configured pricing.baseline_model before the code default, take a run''s cost as spend only when the pricing manifest prices the model that ran, and replace the local savings view with one that serves each run''s modelled saving with its baseline model and pricing version. Recorded cost rows are not rewritten (decision D1); each local store recomputes its derived per-run savings once, so the savings view and the headline read one figure. Metering and usage-by-model-day serve the same token totals: a run with no call record has unknown tokens in both, and a call with no tokens and no cost is unmeasured (an escalation attempt booked 0/0 with its own measured cost keeps it, decision 3). GET /models (AC9) serves every provider onex models list prints, with no dashboard allow-list; this supersedes OMN-20816 decision (b). Run duration (AC8): a failed or timed-out call stored at latency 0 stores no latency, and the metering summary serves one run duration (execution_ms, labelled Duration) with its definition, which the dashboard pages read; the dashboard half and its Playwright check are in the omnidash pull request. This contract declares the criteria these changes deliver, AC1 to AC9, each bound to its check. The local SQLite projection views counted never-evaluated runs as failed quality checks (quality_gate_passed and the token columns are NOT NULL DEFAULT 0 in the local store), dropped runs whose data_source is NULL from the summary, grouped per-model figures by the delegated_to alias, and tested IS NULL on columns that cannot be NULL in the daily view. This change adds four view revisions as new one-time store steps after the steps that created their views (quality-gate v2, summary v3, model-routing v3, daily v2): a check is a run with quality_gates_checked other than 0 and a verdict, a NULL data_source is kept, experiment runs stay out of the aggregate views, per-model figures name the model that ran, and the per-day counts use the store''s own markers.'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24615-one-savings-definition
  statement: The local backend serves one savings figure over runs that succeeded with measured usage and a named price, against the configured baseline, and counts every excluded run by reason.
  acceptance:
  - id: AC1
    statement: 'AC1: the backend serves one savings figure per window, the sum of modelled savings over runs that ended without a failure cause and whose cost and usage are measured, with the baseline model, pricing version and the excluded runs counted by reason, and every local page reads that figure -- falsifier: uv run pytest over a store fixture holding a refused run, an unknown-usage run and a measured run fails unless the served saving equals the measured run''s saving alone and both exclusions are counted by reason'
  - id: AC2
    statement: 'AC2: the savings baseline model comes from the configured pricing.baseline_model before the code default, and the savings topic serves the baseline model and pricing version, never NULL or 0 -- falsifier: uv run pytest that configures a different baseline model fails unless the served saving is priced against it and names it'
  - id: AC3
    statement: 'AC3: spend counts only costs priced from a named price source; a flat tier rate on a model with no price is served as unpriced and counted, not as spend -- falsifier: uv run pytest with a '':free'' model run costed at the tier rate fails unless spend excludes it and the unpriced count includes it'
  - id: AC8
    statement: 'AC8: the backend serves one run duration with its definition, the Runs table and the run detail both show it, and a stored latency of 0 on a failed call is not a measured duration -- falsifier: uv run pytest over a fixture with a failed run stored at latency 0 fails unless that run has no measured duration, and npx playwright test fails unless Runs and the run detail show the same duration'
  - id: AC9
    statement: 'AC9: GET /models serves every provider that onex models list --json lists on the same install, with the same set-up and last-test values, and no provider allow-list remains in the dashboard serve path -- falsifier: uv run pytest that registers a reflection key in a temporary ONEX home fails unless GET /models serves reflection as set up'
  - id: AC5
    statement: 'AC5: metering-summary.v1 and usage-by-model-day.v1 serve the same token totals for the same window, or serve the difference with the runs that have no call record, and a call with 0 input and 0 output tokens is not a measured call -- falsifier: uv run pytest with a run that has no call record and a zero-token call fails unless the totals reconcile and the zero-token call is not counted as measured'
- id: req-omn24615-one-definition-per-figure
  statement: The local backend serves one pass rate over evaluated runs, groups per-model figures by the model that ran, and counts unrecorded runs per day from the store's own markers.
  acceptance:
  - id: AC4
    statement: 'AC4: one pass rate per window, runs that passed the quality gate over runs that were evaluated, with not-evaluated runs counted separately; the summary, quality-gate and model-routing views serve the same rate, and no view drops a run whose data_source is NULL -- falsifier: uv run pytest with a not-evaluated run and a NULL-data_source run fails unless all three views serve the same rate and run count'
  - id: AC6
    statement: 'AC6: every served per-model figure is grouped by the model that ran, with the backend served as its own field -- falsifier: uv run pytest with Beam runs through the byok-reflection backend fails unless model-routing.v1 serves one Beam-1.0-501B-A23B group'
  - id: AC7
    statement: 'AC7: the daily view serves unrecorded runs and unmeasured tokens from the store''s own markers (both token counts 0, quality never evaluated), matching metering-summary.v1 -- falsifier: uv run pytest with a run that has no tokens recorded fails unless daily.v1 counts it as unrecorded'
evidence_requirements:
- kind: tests
  description: The savings, baseline and spend tests pass at the pushed head.
  command: uv run pytest tests/unit/projection/test_omn24615_metering_unknown_usage.py tests/unit/projection/test_omn24615_configured_pricing_model.py tests/unit/projection/test_omn24615_priced_spend.py tests/unit/projection/test_omn24615_savings_view_one_definition.py tests/unit/projection/test_omn24615_run_savings_recompute.py tests/unit/projection/test_omn24615_zero_token_call.py tests/unit/projection/test_omn24615_token_totals_reconcile.py tests/unit/delegation/test_omn24615_failed_run_saves_nothing.py -q -p no:randomly --no-cov
- kind: tests
  description: The evaluated-runs and served-model view tests pass at the pushed head.
  command: uv run pytest tests/unit/projection/test_omn24615_evaluated_runs_and_served_model.py -q -p no:randomly --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
