schema_version: 1.0.0
ticket_id: OMN-21455
title: Codex harness attempt prerequisite for model work comparisons
summary: 'Partial lane scope: extend the existing delegation effect with a host-invoked Codex attempt and typed
  receipt. The original benchmark acceptance criteria below are preserved verbatim and remain pending; this change
  does not claim the 50-contract comparison, reporting or budget-reservation implementation. A nested lab attempt
  reports startup_refused because the parent sandbox denies the existing Codex installation_id read/write open.
  Successful inference must be proved by a host dispatcher outside the agent tool sandbox, with the child sandbox
  retained.'
is_seam_ticket: false
interface_change: true
interfaces_touched:
- public_api
requirements:
- id: req-model-work-comparison
  statement: Original ticket scope; the harness attempt is a prerequisite only.
  acceptance:
  - id: AC1
    statement: 'AC1: the trial table has one row per attempt (50 contracts x 3 draws x each arm run) joined from
      the receipts by contract id, and no row has verdict unjoined -- falsifier: uv run pytest tests/reports/test_model_work_comparison.py
      -q -k every_attempt_joined'
  - id: AC2
    statement: 'AC2: the report gives per arm pass rate with a Wilson interval, tokens per pass, minutes per pass,
      cost per pass (MEASURED only, UNKNOWN stated where the engine reports none) and iterations to pass, and every
      figure recounts from the trial table -- falsifier: uv run pytest tests/reports/test_model_work_comparison.py
      -q -k figures_recount_from_table'
  - id: AC3
    statement: 'AC3: the report states which of the Phase 1 findings listed in the plan section Phase 2 shape it
      settles, each with the number that settles it -- falsifier: uv run pytest tests/reports/test_model_work_comparison.py
      -q -k decision_findings_present'
  - id: AC4
    statement: 'AC4: the run stays inside the stated budget, with a hard stop recorded in the run''s own log if
      the summed MEASURED cost passes 150 USD -- falsifier: uv run pytest tests/reports/test_model_work_comparison.py
      -q -k budget_stop_recorded'
  - id: AC5
    statement: 'AC5: a per-pass figure is computed only over attempts whose tokens, wall time and verdict are all
      MEASURED, the report states each figure''s denominator and the excluded count per arm, and a Claude-arm attempt
      that started after the runner release with UNKNOWN tokens fails the run -- falsifier: uv run pytest tests/reports/test_model_work_comparison.py
      -q -k metric_completeness_denominators'
  - id: AC6
    statement: 'AC6: arm manifests are exact (sonnet and codex 50 contracts by 3 draws, opus only 20 DoD contracts
      by 3 draws and only after the operator ruling), the 150 USD stop applies per Claude arm and is reserved before
      dispatch from each contract max_usd with UNKNOWN cost counted at max_usd, and a run halted by the stop is
      reported as an incomplete outcome -- falsifier: uv run pytest tests/reports/test_model_work_comparison.py
      -q -k per_arm_budget_reservation_and_incomplete_outcome'
evidence_requirements:
- kind: tests
  description: Focused Codex attempt behavior tests.
  command: uv run pytest tests/nodes/node_llm_delegation_call_effect/test_codex_harness_attempt.py -q --no-cov --tb=line
- kind: manual
  description: 'deploy: execute the packaged host CLI against a controlled child; no live dependencies required.'
  command: uv run pytest tests/nodes/node_llm_delegation_call_effect/test_codex_harness_attempt.py -q --no-cov --tb=line
    -k "public_surface_imports or cli_stdin_and_receipt"
