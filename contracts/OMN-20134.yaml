---
schema_version: 1.0.0
ticket_id: OMN-20134
title: 'Receipt-gate caller pins advance on core''s dev-merge tag: omnimarket''s caller moves, and a compute node
  plus an effect node keep every caller current'
summary: No receipt-gate caller pin carried the fix-parent control fallback (control_uses_fix_parent) and nothing
  advanced a caller pin when the gate changed. omnimarket's caller moves to the omnibase_core dev-merge tag dev-20261030152335-66d35d2283c3,
  whose receipt-gate.yml carries the fallback, and tests/ci/receipt_gate_pin.py holds that pin as the one test-side
  constant. node_receipt_gate_pin_advance_compute reads the callers' pin sites from its contract and plans one pull
  request per caller whose pinned gate differs from the newest dev tag's; node_receipt_gate_pin_advance_effect,
  triggered by the dev-merge tag event the webhook ingress now folds, publishes one branch per stale caller and
  opens the pull request through node_github_repo_write_effect. The updater emits one typed outcome event per caller
  outcome with the caller's pin kind (sha or tag), node_projection_receipt_gate_pin_friction folds each observation into one row per pin
  pull request, node_receipt_gate_pin_friction_report_compute shows the comparison per pin kind over a window, and
  node_receipt_gate_pin_friction_ledger_effect writes a failed or touched pin pull request as a FRICTION row with
  class=pin-advance.
is_seam_ticket: false
interface_change: true
interfaces_touched:
- events
- topics
requirements:
- id: req-caller-pins-fix-parent-dev-tag
  statement: omnimarket's Repo Evidence Gate caller pins the omnibase_core receipt-gate reusable at a dev-merge
    tag whose receipt-gate.yml carries the fix-parent control fallback, keeping its job id and inputs.
  acceptance:
  - id: AC1
    statement: 'AC1: .github/workflows/call-repo-evidence-gate.yml pins receipt-gate.yml at the dev-merge tag dev-20261030152335-66d35d2283c3
      -- falsifier: uv run pytest tests/ci/test_receipt_gate_caller_pin_omn20134.py -q -p no:randomly --no-cov fails
      at the merge base, where the caller pins dev-20261022114039-578228977721'
- id: req-pin-advance-planned-from-contract-data
  statement: A compute node reads the callers' receipt-gate pin sites from its contract, with no repository, path
    or pin in code, and detects a caller whose pinned gate differs from the newest dev tag's, planning the pin line
    and its test constant as one edit set.
  acceptance:
  - id: AC2
    statement: 'AC2: a planted stale pin at every declared caller is detected as stale and planned to the newest
      tag, and applying the plan reaches a fixed point where every caller is current -- falsifier: uv run pytest
      tests/nodes/node_receipt_gate_pin_advance_compute/test_receipt_gate_pin_advance_compute.py -q -p no:randomly
      --no-cov -k "planted_stale_pin or fixed_point" fails at the merge base, where the node does not exist'
  - id: AC3
    statement: 'AC3: a plan edits the workflow pin line and the test constant together, keeps a sha with its tag
      beside it where the caller is held to a sha, and a pin that is a commit sha where a dev-merge tag is declared,
      names no known tag, or disagrees across its sites gets a typed verdict; a site that does not match as declared
      is refused with no edits -- falsifier: uv run pytest tests/nodes/node_receipt_gate_pin_advance_compute/test_receipt_gate_pin_advance_compute.py
      -q -p no:randomly --no-cov fails at the merge base, where the node does not exist'
- id: req-pin-advance-opens-prs-on-the-tag-event
  statement: On the source repository's dev-merge tag event an effect node publishes one branch with one commit
    per stale caller and opens the pull request through node_github_repo_write_effect, once per caller and tag.
  acceptance:
  - id: AC4
    statement: 'AC4: the effect opens one pull request per stale caller through the write node''s pr_create, a redelivered
      tag opens nothing twice, dry_run writes nothing, a tag of another repository is ignored and one refused pull
      request does not stop the others -- falsifier: uv run pytest tests/nodes/node_receipt_gate_pin_advance_effect/test_golden_chain_receipt_gate_pin_advance_effect.py
      -q -p no:randomly --no-cov fails at the merge base, where the node does not exist'
  - id: AC5
    statement: 'AC5: the webhook ingress folds the creation of a dev-<UTC14>-<sha12> tag into one observation on
      onex.evt.github.dev-merge-tag.v1 and folds no other tag, move or deletion -- falsifier: uv run pytest tests/nodes/node_github_webhook_ingress_effect/test_webhook_fold.py
      -q -p no:randomly --no-cov -k DevMergeTag fails at the merge base, where a tag push folds to nothing'
- id: req-pin-friction-measured-per-pin-kind
  statement: Ruling 2026-10-31T00:13:02Z keeps omnibase_infra's caller on a full sha (its pull_request_target audit
    requires one) and lets four repositories' pin tests accept a dev-merge tag or a sha, "but we should measure friction
    overtime". The updater emits one typed event per caller outcome, a reducer folds each observation into one row per pin pull request,
    a query shows the comparison per pin kind over a window, and an updater failure or a touched pin pull request
    writes a FRICTION ledger row with class=pin-advance and the site.
  acceptance:
  - id: AC6
    statement: 'AC6: the updater emits, after its completed event, one PinOutcomeEvent per caller outcome (opened, replayed,
      refused, failed) carrying the caller''s pin kind (sha or tag), the core tag, the seconds from the tag to the pull
      request and a refusal class, and none for a dry run or an ignored tag -- falsifier: uv run pytest tests/nodes/node_receipt_gate_pin_advance_effect/test_golden_chain_receipt_gate_pin_advance_effect.py
      -q -p no:randomly --no-cov -k "outcome or refused or redelivered or dry_run" fails at the merge base, where the
      updater emits no outcome event'
  - id: AC7
    statement: 'AC7: the reducer folds the outcome, the merge, the head changes, the workflow-run attempts and the red
      checks into the row of the pin pull request (prior row in, next row out), counting a merge with no fix push and no CI
      re-run as untouched, recording audit, guard and conflict refusals, and flagging a failed updater run or a first
      touch exactly once -- falsifier:
      uv run pytest tests/nodes/node_projection_receipt_gate_pin_friction -q -p no:randomly --no-cov fails at the
      merge base, where the node does not exist'
  - id: AC8
    statement: 'AC8: a query over the projection''s rows and a window returns, per pin kind, the pull requests opened,
      the number merged untouched, the median time to merge, the touches per pull request and the refusals -- falsifier:
      uv run pytest tests/nodes/node_receipt_gate_pin_friction_report_compute -q -p no:randomly --no-cov fails at the
      merge base, where the node does not exist'
  - id: AC9
    statement: 'AC9: a pin friction event is appended to the rolling ledger as a FRICTION row with class=pin-advance, the
      site, a parseable cost and an existing ticket, which the friction rollup counts by class, and the append is answered
      accepted, duplicate, refused, error or pending -- falsifier: uv run pytest tests/nodes/node_receipt_gate_pin_friction_ledger_effect
      -q -p no:randomly --no-cov fails at the merge base, where the node does not exist'
  - id: AC10
    statement: 'AC10: the webhook ingress folds a workflow run''s attempt number onto its observation, so an attempt above
      1 is a CI re-run -- falsifier: uv run pytest tests/nodes/node_github_webhook_ingress_effect/test_webhook_fold_red_checks.py
      -q -p no:randomly --no-cov -k RunAttempt fails at the merge base, where the observation carries no attempt'
evidence_requirements:
- kind: tests
  description: The caller's reusable pin is the dev-merge tag.
  command: uv run pytest tests/ci/test_receipt_gate_caller_pin_omn20134.py -q -p no:randomly --no-cov
- kind: tests
  description: 'AC2 and AC3: the compute node plans from contract data.'
  command: uv run pytest tests/nodes/node_receipt_gate_pin_advance_compute/test_receipt_gate_pin_advance_compute.py
    -q -p no:randomly --no-cov
- kind: tests
  description: 'AC4 and AC5: the effect, its ports and the ingress tag fold.'
  command: uv run pytest tests/nodes/node_receipt_gate_pin_advance_effect/test_golden_chain_receipt_gate_pin_advance_effect.py
    tests/nodes/node_github_webhook_ingress_effect/test_webhook_fold.py -q -p no:randomly --no-cov
- kind: tests
  description: 'AC6: the updater''s outcome events.'
  command: uv run pytest tests/nodes/node_receipt_gate_pin_advance_effect/test_golden_chain_receipt_gate_pin_advance_effect.py
    -q -p no:randomly --no-cov -k "outcome or refused or redelivered or dry_run"
- kind: tests
  description: 'AC7: the reducer fold and handler.'
  command: uv run pytest tests/nodes/node_projection_receipt_gate_pin_friction -q -p no:randomly --no-cov
- kind: tests
  description: 'AC8: the per-pin-kind query.'
  command: uv run pytest tests/nodes/node_receipt_gate_pin_friction_report_compute -q -p no:randomly --no-cov
- kind: tests
  description: 'AC9: the FRICTION ledger row.'
  command: uv run pytest tests/nodes/node_receipt_gate_pin_friction_ledger_effect -q -p no:randomly --no-cov
- kind: tests
  description: 'AC10: the workflow-run attempt on the ingress observation.'
  command: uv run pytest tests/nodes/node_github_webhook_ingress_effect/test_webhook_fold_red_checks.py -q -p no:randomly --no-cov
    -k RunAttempt
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn20134-caller-pins-dev-tag
  description: 'AC1: the Repo Evidence Gate caller pins the omnibase_core receipt-gate reusable at the dev-merge
    tag dev-20261030152335-66d35d2283c3.'
  source: manual
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/ci/test_receipt_gate_caller_pin_omn20134.py -q -p no:randomly --no-cov
  binds_ac:
  - AC1
- id: dod-omn20134-plan-from-contract
  description: 'AC2 and AC3: the compute node detects a planted stale pin, plans the pin line and test constant
    together, and reaches a fixed point.'
  source: manual
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_receipt_gate_pin_advance_compute/test_receipt_gate_pin_advance_compute.py
      -q -p no:randomly --no-cov
  binds_ac:
  - AC2
  - AC3
- id: dod-omn20134-effect-opens-prs
  description: 'AC4: the effect opens one pull request per stale caller through pr_create, idempotently.'
  source: manual
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_receipt_gate_pin_advance_effect/test_golden_chain_receipt_gate_pin_advance_effect.py
      -q -p no:randomly --no-cov
  binds_ac:
  - AC4
- id: dod-omn20134-ingress-tag-fold
  description: 'AC5: the webhook ingress folds a created dev-merge tag into onex.evt.github.dev-merge-tag.v1.'
  source: manual
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_github_webhook_ingress_effect/test_webhook_fold.py -q -p no:randomly
      --no-cov -k DevMergeTag
  binds_ac:
  - AC5
- id: dod-omn20134-deploy-shared-model-readback
  description: >-
    Hosted-runner deploy artifact check: read the published shared pin model at
    the evaluated checkout revision and require the stale-pin verdict and edit
    fields used by the effect. A missing artifact, missing verdict or missing
    edit field fails. This reads the source artifact, not a running deployment.
    The effect golden-chain check exercises the corresponding runtime path.
  source: manual
  checks:
  - check_type: command
    check_value: |-
      curl --fail --silent --show-error --location --max-time 30 "https://raw.githubusercontent.com/OmniNode-ai/omnimarket/$(git rev-parse HEAD)/src/omnimarket/models/model_receipt_gate_pin_advance.py" | python3 -c '
      import ast, sys
      tree = ast.parse(sys.stdin.read())
      classes = {node.name: node for node in tree.body if isinstance(node, ast.ClassDef)}
      verdicts = {node.targets[0].id: ast.literal_eval(node.value) for node in classes["EnumCallerVerdict"].body if isinstance(node, ast.Assign)}
      assert verdicts["STALE"] == "stale", verdicts
      fields = {node.target.id for node in classes["ModelCallerPlan"].body if isinstance(node, ast.AnnAssign)}
      assert {"edits", "target_tag", "target_commit_sha", "base_head_sha", "idempotency_key"} <= fields, fields
      print("OMN-20134 deploy artifact readback: stale verdict and atomic edit plan PASS")
      '
  - check_type: test_passes
    check_value: env PYTHONDONTWRITEBYTECODE=1 uv run pytest tests/nodes/node_receipt_gate_pin_advance_effect/test_golden_chain_receipt_gate_pin_advance_effect.py -q -p no:randomly --no-cov
  binds_ac:
  - AC2
  - AC3
  - AC4
- id: dod-omn20134-outcome-events
  description: 'AC6: the updater emits one typed outcome event per caller outcome with the pin kind and the tag-to-PR time.'
  source: manual
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_receipt_gate_pin_advance_effect/test_golden_chain_receipt_gate_pin_advance_effect.py
      -q -p no:randomly --no-cov -k "outcome or refused or redelivered or dry_run"
  binds_ac:
  - AC6
- id: dod-omn20134-friction-projection
  description: 'AC7: the reducer folds observations into one row per pin pull request and flags a failed updater run or a first touch once.'
  source: manual
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_projection_receipt_gate_pin_friction -q -p no:randomly --no-cov
  binds_ac:
  - AC7
- id: dod-omn20134-friction-report
  description: 'AC8: the per-pin-kind comparison over a window.'
  source: manual
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_receipt_gate_pin_friction_report_compute -q -p no:randomly --no-cov
  binds_ac:
  - AC8
- id: dod-omn20134-friction-ledger-row
  description: 'AC9: a pin friction event is a FRICTION ledger row with class=pin-advance and the site.'
  source: manual
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_receipt_gate_pin_friction_ledger_effect -q -p no:randomly --no-cov
  binds_ac:
  - AC9
- id: dod-omn20134-run-attempt
  description: 'AC10: the ingress folds a workflow run attempt number.'
  source: manual
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_github_webhook_ingress_effect/test_webhook_fold_red_checks.py -q -p no:randomly
      --no-cov -k RunAttempt
  binds_ac:
  - AC10
