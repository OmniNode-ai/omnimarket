- id: dod-omn20134-effect-opens-prs
  description: 'AC4: the effect opens one pull request per stale caller through pr_create, idempotently.'
  source: manual
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_receipt_gate_pin_advance_effect -q -p no:randomly --no-cov
