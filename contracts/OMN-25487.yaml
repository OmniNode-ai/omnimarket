schema_version: 1.0.0
ticket_id: OMN-25487
title: 'Finished sprint tickets are closed: a Temporal schedule on h051 reads each open ticket against its checks and sets Done only on a pass'
summary: 'node_sprint_closer_effect: a Temporal workflow with one activity per sprint ticket and a 2 hour schedule; every Linear read and write is a request to node_linear_ticket_write_effect through the
  node''s declared CLI, which gains list_open and an assignee on read; node_worktree_prune_temporal_effect runs the worktree prune per host on the same pattern.'
is_seam_ticket: false
interface_change: true
interfaces_touched:
- protocols
requirements:
- id: req-omn25487-closer
  statement: Finished sprint tickets are closed on passing checks only, by one durable workflow whose every Linear call is a node request.
  acceptance:
  - id: AC1
    statement: 'AC1: every open ticket of the current sprint has been read once and either set Done with a comment naming each passing check or reading, or left with a comment naming exactly what is missing,
      and a journal lists every change -- falsifier: a Linear list of the sprint project''s open tickets with no closer-1915 comment on one of them, plus the journal file'
  - id: AC2
    statement: 'AC2: the eligibility function never returns close for a ticket with an unbound criterion, a failing check, or no SEEN RUNNING reading when its checks are absent, and returns close for a
      ticket with all checks passing -- falsifier: uv run pytest -m unit on the eligibility tests in the omnimarket node, which fails when the rule is loosened'
  - id: AC3
    statement: 'AC3: the workflow test shows one activity per ticket, a failed ticket activity is retried and resumed without re-running the finished tickets, and a ticket assigned to a collaborator yields
      a comment and no state change -- falsifier: uv run pytest -m unit on the workflow replay test'
  - id: AC4
    statement: 'AC4: the Temporal schedule every 2 hours and the signal run on a SEEN RUNNING mark are registered on h051 and one scheduled run is read completing with a per-ticket decision list -- falsifier:
      temporal schedule describe on h051 returns the 2 hour schedule, and the run history lists one completed scheduled run'
  - id: AC5
    statement: 'AC5: the effect node is installed from the branch on the lab and its run is read there -- falsifier: the install receipt names the host and revision and one run line of the node is read
      on that host'
evidence_requirements:
- kind: tests
  description: The closer, linear-node and prune workflow tests pass at the pushed head.
  command: uv run --frozen pytest tests/nodes/node_sprint_closer_effect/test_sprint_closer_workflow.py tests/nodes/node_sprint_closer_effect/test_sprint_closer_eligibility.py tests/nodes/node_sprint_closer_effect/test_sprint_closer_linear_node.py
    tests/nodes/node_worktree_prune_temporal_effect -q --no-cov -m unit -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn25487-ac1
  description: 'AC1: every Linear read and write of the closer is a node request and the workflow reads each ticket once; the hosted run executes these tests, the live dry run is read on the lab in the integration-proof item.'
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_sprint_closer_effect/test_sprint_closer_linear_node.py -q --no-cov -m unit -p no:randomly
    cwd: .
- id: dod-omn25487-ac2
  description: 'AC2: the eligibility tests, which fail when the rule is loosened.'
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_sprint_closer_effect/test_sprint_closer_eligibility.py -q --no-cov -m unit -p no:randomly
    cwd: .
- id: dod-omn25487-ac3
  description: 'AC3: one activity per ticket, a failed ticket retried and resumed without re-running the finished tickets, a collaborator''s ticket commented with its state left.'
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_sprint_closer_effect/test_sprint_closer_workflow.py -q --no-cov -m unit -p no:randomly
    cwd: .
- id: dod-omn25487-ac4
  description: 'AC4: the schedule first-fire offset keeps the cadence and the signal start records the SEEN RUNNING mark; the hosted run executes these tests, the h051 schedule describe is read on the lab in the integration-proof item.'
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_worktree_prune_temporal_effect/test_worktree_prune_workflow.py -k first_fire_offset -q --no-cov -m unit -p no:randomly
    cwd: .
- id: dod-omn25487-ac5
  description: 'AC5: the effect nodes workflow and report tests pass at the pushed head; the lab install receipt is read in the integration-proof item.'
  source: manual
  binds_ac:
  - AC5
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_worktree_prune_temporal_effect tests/nodes/node_sprint_closer_effect/test_sprint_closer_workflow.py -q --no-cov -m unit -p no:randomly
    cwd: .
- id: dod-omn25487-integration-proof
  description: the closer, linear-node and prune workflow tests run on a lab host at the pushed head through the lab work runner; hosted CI cannot reach the lab, so only the local Done gate runs this unbound
    check
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-omn25487 --kind test -- uv run --frozen pytest tests/nodes/node_sprint_closer_effect
      tests/nodes/node_worktree_prune_temporal_effect tests/nodes/node_create_ticket -q --no-cov -m unit
