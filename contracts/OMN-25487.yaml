schema_version: 1.0.0
ticket_id: OMN-25487
title: 'Finished sprint tickets are closed: a Temporal schedule on h051 reads each open ticket against its checks and sets Done only on a pass'
summary: 'node_sprint_closer_effect: one eligibility rule (decide_eligibility) that closes a ticket only when every acceptance criterion has a passing dod_verify check, or, checks absent, the integration ledger
  reads the change SEEN RUNNING and every criterion is ticked; a Temporal workflow with one activity per ticket, started by a 2-hour schedule and by a SEEN RUNNING mark; a run-once verb for the one-time sprint triage.'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn25487-sprint-closer
  statement: Finished sprint tickets are set Done only on a passing check or an accepted SEEN RUNNING reading, and every other open sprint ticket gets one comment naming what is missing.
  acceptance:
  - id: AC1
    statement: 'AC1: every open ticket of the current sprint has been read once and either set Done with a comment naming each passing check or reading, or left with a comment naming exactly what is missing, and a journal lists every change -- falsifier: a Linear list of the sprint project''s open tickets with no closer-1915 comment on one of them, plus the journal file'
  - id: AC2
    statement: 'AC2: the eligibility function never returns close for a ticket with an unbound criterion, a failing check, or no SEEN RUNNING reading when its checks are absent, and returns close for a ticket with all checks passing -- falsifier: uv run pytest -m unit on the eligibility tests in the omnimarket node, which fails when the rule is loosened'
  - id: AC3
    statement: 'AC3: the workflow test shows one activity per ticket, a failed ticket activity is retried and resumed without re-running the finished tickets, and a ticket assigned to a collaborator yields a comment and no state change -- falsifier: uv run pytest -m unit on the workflow replay test'
  - id: AC4
    statement: 'AC4: the Temporal schedule every 2 hours and the signal run on a SEEN RUNNING mark are registered on h051 and one scheduled run is read completing with a per-ticket decision list -- falsifier: temporal schedule describe on h051 returns the 2 hour schedule, and the run history lists one completed scheduled run'
  - id: AC5
    statement: 'AC5: the effect node is installed from the branch on the lab and its run is read there -- falsifier: the install receipt names the host and revision and one run line of the node is read on that host'
evidence_requirements:
- kind: tests
  description: The eligibility tests and the workflow tests against Temporal's time-skipping test server.
  command: uv run pytest -m unit tests/nodes/node_sprint_closer_effect -q --no-cov -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn25487-ac1
  description: The handler writes one comment per ticket naming each passing check (close) or exactly what is missing (left), and a collaborator's ticket gets the evidence comment with no state change. The
    live journal of the one-time triage is the unbound local Done gate check below.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest -m unit tests/nodes/node_sprint_closer_effect/test_sprint_closer_eligibility.py -q --no-cov -p no:randomly -k 'collaborator or owner_ticket'
    cwd: .
- id: dod-omn25487-ac2
  description: decide_eligibility never closes on an unbound criterion, a failing or unrun check, or absent checks without a SEEN RUNNING reading, and closes when every check passes.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest -m unit tests/nodes/node_sprint_closer_effect/test_sprint_closer_eligibility.py -q --no-cov -p no:randomly
    cwd: .
- id: dod-omn25487-ac3
  description: One activity per ticket; a failing ticket activity is retried and the finished tickets are not re-run; a collaborator's ticket yields a comment and no state change.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest -m unit tests/nodes/node_sprint_closer_effect/test_sprint_closer_workflow.py -q --no-cov -p no:randomly -k 'one_activity_per_ticket or resumes_without_rerunning'
    cwd: .
- id: dod-omn25487-ac4
  description: A run started by a SEEN RUNNING mark (signal-with-start) records the mark and completes with a per-ticket decision list. The live h051 schedule is the unbound local Done gate check below.
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run pytest -m unit tests/nodes/node_sprint_closer_effect/test_sprint_closer_workflow.py -q --no-cov -p no:randomly -k 'seen_running'
    cwd: .
- id: dod-omn25487-ac5
  description: The node is registered under the onex.nodes entry point and its CLI loads.
  source: manual
  binds_ac:
  - AC5
  checks:
  - check_type: command
    check_value: uv run python -m omnimarket.nodes.node_sprint_closer_effect --help
    cwd: .
- id: dod-omn25487-live-schedule
  description: 'Hosted CI cannot reach the h051 Temporal server, so only the local Done gate runs this unbound check: the 2-hour schedule is registered on the h051 Temporal server.'
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: sh -c '"$HOME/.local/share/onex-temporal/cli/v1.10.1/temporal" schedule describe --address 127.0.0.1:7233 --schedule-id sprint-closer-every-2h'
    cwd: .
- id: dod-omn25487-integration-proof
  description: 'Hosted CI cannot reach Linear or the h051 Temporal server, so only the local Done gate runs this unbound check: on a lab host at the sha, the closer reads one live ticket in dry run
    and prints its decision line.'
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-25487 --kind test -- sh -c 'uv run --frozen python -m omnimarket.nodes.node_sprint_closer_effect
      run-once --ticket OMN-25487'
    cwd: .
