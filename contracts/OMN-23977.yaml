schema_version: 1.0.0
ticket_id: OMN-23977
title: Work record readers get one rows loader step with a counted file fallback
summary: A new loader node answers the rows of a window of the work ledger from the bus-fed reader (the rows read of OMN-23958) and, when that read is not fresh, falls back to the ledger file with a log line and a running count of file reads. The count is the cutover measure and must reach zero before the file is retired. A failed read with the fallback retired is unreadable, never an empty list.
is_seam_ticket: true
interface_change: true
interfaces_touched:
- public_api
requirements:
- id: req-omn23977-rows-loader
  statement: The shared loaders take their rows from the bus-fed reader, and a file read is a counted, logged fallback.
  acceptance:
  - id: AC1
    statement: 'AC1: a rows window read answers from the reader and names source=node, with no file lines used. -- falsifier: uv run pytest tests/unit/nodes/node_ledger_rows_loader_effect -k answers_from_the_node'
  - id: AC2
    statement: 'AC2: a reader outage returns the file lines with source=file-fallback, a logged line and a fallback count raised by exactly one per read. -- falsifier: uv run pytest tests/unit/nodes/node_ledger_rows_loader_effect -k "outage_reads_the_fallback_and_counts"'
  - id: AC3
    statement: 'AC3: with the fallback retired in the overlay an outage is UNREADABLE with no rows, never an empty list. -- falsifier: uv run pytest tests/unit/nodes/node_ledger_rows_loader_effect -k "retired or never_empty"'
  - id: AC4
    statement: 'AC4: the loader against the real reader handler and query node on the in-memory bus returns the file''s rows for the window, and on a seeded outage reads the fallback and counts it. -- falsifier: uv run pytest tests/unit/nodes/node_ledger_rows_loader_effect -k reader_seam'
  - id: AC5
    statement: 'AC5: integrated: on a lab host running this revision the loader reads a window from the running runtime and prints source=node with fallback_count. -- falsifier: run python -m omnimarket.nodes.node_ledger_rows_loader_effect --reader drain-map --window-hours 1 on the lab host and read stderr for source=node'
evidence_requirements:
- kind: tests
  description: The rows loader tests pass at the pushed head.
  command: uv run --frozen pytest tests/unit/nodes/node_ledger_rows_loader_effect -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
