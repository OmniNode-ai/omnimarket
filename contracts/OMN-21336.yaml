---
schema_version: "1.0.0"
ticket_id: "OMN-21336"
title: "TA.13b compaction receipts projection writer"
summary: >-
  Materialize install-confirm results as durable compaction receipts. The node
  follows the lab-proof receipts projection's pure fold and effect-class writer
  shape, retains the boundary identity and measured verdict, and declares the
  exposure used by the projection read effect. The ownership declaration from
  stage (a) is retained; the node-owned migrations now ship with the writer.
  Infrastructure vendored the migrations and grant (omnibase_infra#5308); live
  AC2 validation waits for deployment.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-compaction-receipts-writer"
    statement: >-
      Consume the install-confirm compute's completed result, record one receipt
      per captured compaction boundary, preserve measured installation verdicts,
      refuse malformed events, and make the receipts readable after deployment.
    acceptance:
      - id: "AC1"
        statement: >-
          AC1: a projection writer node in omnimarket writes one receipt row per compaction with the boundary uuid and the install verdict from the install-confirm compute -- falsifier: uv run pytest tests -q -k compaction_receipts_projection_writer
      - id: "AC2"
        statement: >-
          AC2: after a /compact on a lab host the projection reads installed with the boundary uuid -- falsifier: onex node node_projection_read_effect for the compaction receipts projection returns no installed row for that session
      - id: "AC3"
        statement: >-
          AC3: the bus_backed compaction-receipts.v1 exposure carries a reasoned consumers opt-out until a reader lands, so omnibase_infra's exposure-reader-coverage gate passes against this tree -- falsifier: uv run pytest tests/test_compaction_receipts_projection_writer.py -q -k reasoned_reader_opt_out
evidence_requirements:
  - kind: "tests"
    description: "AC1: recorded producer output for every verdict, SQL-bound payloads, replay and malformed-event refusal."
    command: "uv run pytest tests -q -k compaction_receipts_projection_writer"
  - kind: "tests"
    description: "AC2 preparation only: the shipped read exposure returns the installed row and boundary from a local store. A live /compact read remains pending deploy."
    command: "uv run pytest tests/test_compaction_receipts_projection_writer.py -q -k projection_read_returns_installed_with_boundary_uuid"
  - kind: "tests"
    description: "AC1: real PostgreSQL proof with the shipped migrations, a non-superuser role, measured verdicts, replay and uncertainty resolution."
    command: "uv run pytest tests/test_compaction_receipts_projection_writer_real_postgres.py -q --refuse-skips"
  - kind: "tests"
    description: "AC2 preparation: captured compact chunks and published activations assemble into the install-confirm request, and the chained test reads installed with the captured boundary uuid through the writer's fold. The effect that reads session_content, stores activations and publishes the command, and the live /compact read, remain pending."
    command: "uv run pytest tests/nodes/node_context_install_confirm_request_compute/test_handler_context_install_confirm_request.py -q"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn21336-ac1-writer"
    description: "AC1: the recorded merged compute output is written with each verdict and boundary; malformed events perform no database I/O, redelivery converges and uncertainty cannot downgrade decided receipts."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/test_compaction_receipts_projection_writer.py -q"
    binds_ac: ["AC1"]
  - id: "dod-omn21336-ac2-read-preparation"
    description: "AC2 preparation: the contract-owned exposure is accepted by discovery and the actual projection read handler returns installed with the recorded session, activation and boundary uuid from a local SQLite store populated with the writer's returned rows. This is not the pending live /compact read."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/test_compaction_receipts_projection_writer.py -q -k projection_read_returns_installed_with_boundary_uuid"
    binds_ac: ["AC2"]
  - id: "dod-omn21336-deploy-writer-and-read-exposure"
    description: "Falsifiable hosted deployment preparation smoke: the local topology at the pinned omnibase_infra revision grants omninode_runtime the compaction_receipts table, and the focused tests import the packaged writer, resolve its contract's sole runtime handler, require the install-confirm terminal as its subscription, and read installed with its boundary through the shipped exposure. These tests fail at the merge base where the node and exposure are absent. No lab route, broker or live database is required. After deployment, run /compact on a lab session and read node_projection_read_effect with topic onex.snapshot.projection.compaction-receipts.v1; require verdict installed and that session's boundary uuid. Live AC2 remains pending until that read succeeds."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/test_compaction_receipts_projection_writer.py -q -k 'consumer_contract_and_read_exposure or projection_read_returns_installed_with_boundary_uuid'"
      - check_type: "command"
        check_value: "gh api 'repos/OmniNode-ai/omnibase_infra/contents/src/omnibase_infra/topology/instances/local.yaml?ref=3078fa4ec02b3c242502a6de8ca21729b66cc48a' -H 'Accept: application/vnd.github.raw' | grep -q -- '- compaction_receipts'"
    binds_ac: ["AC2"]
  - id: "dod-omn21336-ac3-exposure-reader-opt-out"
    description: "AC3: no Omnidash component, local page or typed status-page backend reader reads onex.snapshot.projection.compaction-receipts.v1, so omnibase_infra's exposure-reader-coverage gate reported it as no_reader against omnimarket dev f014086a6 with omnidash dev 03338b97. The exposure now declares consumers: none with a reason; the change that adds a reader deletes both keys. The test fails at the merge base, where the exposure has no opt-out."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/test_compaction_receipts_projection_writer.py -q -k reasoned_reader_opt_out"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC3"]
  - id: "dod-omn21336-ac2-install-confirm-request-assembly"
    description: "AC2 preparation: captured compact chunks and published activations assemble into the install-confirm request, and the chained test reads installed with the captured boundary uuid through the writer's fold. The effect that reads session_content, stores activations and publishes the command, and the live /compact read, remain pending."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_context_install_confirm_request_compute/test_handler_context_install_confirm_request.py -q"
    binds_ac: ["AC2"]
