schema_version: 1.0.0
ticket_id: OMN-26316
title: The lab alarm's dev deploy agent condition also reads the agent's systemd user unit, so a stopped unit alarms on its own streak and a wrong scope or name reads indeterminate
summary: >-
  This pull request is the goal item 1 alarm of lane devagent-1715 and is filed under OMN-26316 because that is the
  ticket the lane was dispatched on. It does NOT meet OMN-26316's own four acceptance criteria (the runtime's /health
  inside its compose start period); those stay open on the ticket and are carried by its own fix pull request.
  The change extends HandlerDevTagHeartbeat in node_lab_alarm with an optional unit block: systemctl --user show of
  the declared unit, USER scope fixed in the adapter, LoadState not-found or unreadable is INDETERMINATE, a loaded unit
  whose ActiveState is not active breaches on the same persistence bound as a repository.
  A second change, filed under the same ticket for the same reason, makes the dev roll window gate end a released roll
  on the completion of any command of its batch (requirement req-omn26316-gate-batch-completion); it does not meet
  OMN-26316's own four acceptance criteria either.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn26316-unit-alarm
  statement: The dev tag heartbeat condition in node_lab_alarm optionally reads the deploy agent's systemd user unit (USER scope only) and alarms on a stopped unit.
  acceptance:
  - id: AC1
    statement: 'AC1: a loaded user unit whose ActiveState is not active breaches on the persistence bound, a not-found or unreadable unit is INDETERMINATE and never an alarm, and the adapter reads USER scope only -- falsifier: uv run --frozen pytest tests/nodes/node_lab_alarm/test_lab_alarm_deploy_agent_unit.py -q --no-cov -p no:randomly fails on dev (the unit source does not exist) and passes at this head'
  - id: AC2
    statement: 'AC2: with no unit block declared every existing dev tag heartbeat behaviour is unchanged -- falsifier: uv run --frozen pytest tests/nodes/node_lab_alarm/test_lab_alarm_dev_tag_heartbeat.py -q --no-cov -p no:randomly passes at this head'
- id: req-omn26316-gate-batch-completion
  statement: The dev roll window gate ends a released roll on the completion of any command of the released batch, so a batch whose newest command the deploy agent skips no longer holds every later merge until the completion deadline.
  acceptance:
  - id: AC3
    statement: 'AC3: replaying the 2026-11-23T23:38Z shape (an overdue roll abandoned with no completion, then twelve commands released at once, the newest one the agent skips) ends the roll on the completion of a released command that is not the newest -- falsifier: uv run --frozen pytest tests/unit/nodes/node_dev_roll_window_gate_effect/test_roll_gate_batch_completion.py -q --no-cov -p no:randomly fails at the commit that adds the test and passes at this head'
  - id: AC4
    statement: 'AC4: a completion of a command outside the released batch, of a command still held, or of an abandoned roll''s batch changes no gate state -- falsifier: the same test file, the cases named test_roll_gate_batch_completion_outside_the_batch_changes_nothing, test_roll_gate_batch_completion_of_a_command_still_held_changes_nothing and test_roll_gate_batch_completion_after_an_abandon_is_not_the_next_rolls, fail at this head'
  - id: AC5
    statement: 'AC5: the completion deadline abandon and the held-age alarm keep their behaviour -- falsifier: uv run --frozen pytest tests/unit/nodes/node_dev_roll_window_gate_effect -q --no-cov -p no:randomly fails at this head'
- id: req-omn26316-hygiene-tick-publishes
  statement: The host hygiene orchestrator's runtime-tick route publishes each due lab work unit on the lab work command topic and returns, and the unit receipts settle the run, so the tick no longer holds a runtime dispatch for the sum of the units' timeouts.
  acceptance:
  - id: AC6
    statement: 'AC6: a tick whose hosts never answer returns at once with one command per due unit and no run event, and the run event appears only when the last receipt arrives -- falsifier: uv run --frozen pytest tests/unit/nodes/node_host_hygiene_orchestrator/test_tick_publishes_units_and_returns.py tests/chains/host_hygiene/test_tick_receipt_chain_host_hygiene_orchestrator.py -q --no-cov -p no:randomly fails at origin/dev and passes at this head'
  - id: AC7
    statement: 'AC7: the in_memory backend, the on-demand route and the existing scheduled-route cases keep their behaviour -- falsifier: uv run --frozen pytest tests/unit/nodes/node_host_hygiene_orchestrator tests/chains/host_hygiene -q --no-cov -p no:randomly fails at this head'
evidence_requirements:
- kind: tests
  description: The deploy agent unit tests and the existing dev tag heartbeat tests pass at the pushed head.
  command: uv run --frozen pytest tests/nodes/node_lab_alarm/test_lab_alarm_deploy_agent_unit.py tests/nodes/node_lab_alarm/test_lab_alarm_dev_tag_heartbeat.py -q --no-cov -p no:randomly
