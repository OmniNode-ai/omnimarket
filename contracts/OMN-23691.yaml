schema_version: 1.0.0
ticket_id: OMN-23691
title: Work-state projection reads the ledger source through the bus read command named by the schedule overlay
summary: 'The scheduled work-state projection in the dev runtime ran clean but read nothing: its ledger source was a file path the runtime does not have. The schedule overlay gains a ledger_read route (the bus read command, its timeout and row limit); when it is set the file_sources profile reads ledger rows through that command and never from a file, and a read that fails, is truncated or has no command configured leaves the ledger source named unread in the projected event. The other seven sources are unchanged.'
is_seam_ticket: true
interface_change: true
interfaces_touched:
- public_api
- events
requirements:
- id: req-omn23691-ledger-route
  statement: The work-state projection reads the work ledger through the bus, with the route in the overlay, so lane placement has lane rows to work from.
  acceptance:
  - id: AC1
    statement: 'AC1: the work-state overlay carries a ledger_read route (command, with the env name of the bus read command) and the projection reads ledger rows through it with no file path -- falsifier: uv run --frozen pytest tests/nodes/node_work_state_projection_effect/test_ledger_read_route.py -q --no-cov -n 0 -p no:randomly'
  - id: AC2
    statement: 'AC2: a bus read that fails or answers truncated leaves the ledger source unread with its cause and never falls back to a file or reads as empty -- falsifier: uv run --frozen pytest tests/nodes/node_work_state_projection_effect/test_ledger_read_route.py -q --no-cov -n 0 -p no:randomly -k unread'
  - id: AC3
    statement: 'AC3: a golden chain (tick to projected event with the ledger read) and an error chain (failed read to unread entry in the projected event) pass, with the seam to the work ledger query node pinned and a planted rename turning it red -- falsifier: uv run --frozen pytest tests/nodes/node_work_state_projection_scheduled_effect -q --no-cov -n 0 -p no:randomly -k ledger_route'
  - id: AC4
    statement: 'AC4: integrated: the scheduled work-state event published by the dev runtime lists the ledger source as read and no ledger entry in unread -- falsifier: read the work-state-projected event of node_work_state_projection_scheduled_effect on the dev runtime and see ledger in unread'
evidence_requirements:
- kind: tests
  description: The route, chain and seam tests at the pushed head.
  command: uv run --frozen pytest tests/nodes/node_work_state_projection_effect/test_ledger_read_route.py -q --no-cov -n 0 -p no:randomly && uv run --frozen pytest tests/nodes/node_work_state_projection_scheduled_effect -q --no-cov -n 0 -p no:randomly -k ledger_route
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23691-ac1-route
  description: The projection's ledger rows come through the overlay's command route and the file route is not consulted when a route is given.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_work_state_projection_effect/test_ledger_read_route.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn23691-ac2-unread
  description: A failed or truncated bus read, or an unset command variable, names the ledger source unread with its cause; the old file route unset reads unread too (failing control).
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_work_state_projection_effect/test_ledger_read_route.py -q --no-cov -n 0 -p no:randomly -k unread
    cwd: .
- id: dod-omn23691-ac3-chains
  description: Golden and error chain through the scheduled handler, and the seam between the command source's request and the work ledger query node with a planted rename of the answer key.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_work_state_projection_scheduled_effect -q --no-cov -n 0 -p no:randomly -k ledger_route
    cwd: .
- id: dod-omn23691-ac4-hosted
  description: 'The hosted side of AC4: the scheduled handler on the real file_sources profile with the command route reads the ledger and lists nothing for it in unread. The read of the dev runtime''s own event is the unbound local item below.'
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_work_state_projection_scheduled_effect -q --no-cov -n 0 -p no:randomly -k ledger_route
    cwd: .
- id: dod-omn23691-integration-proof
  description: The pushed head ran the route, chain and seam tests on a lab host through the lab work runner and exited 0. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23691 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_work_state_projection_effect/test_ledger_read_route.py -q --no-cov -n 0 -p no:randomly tests/nodes/node_work_state_projection_scheduled_effect -k ledger_route
    cwd: .
