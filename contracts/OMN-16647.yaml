schema_version: "1.0.0"
ticket_id: "OMN-16647"
title: "Host the route-runner reusable workflow in omnimarket"
summary: "omnimarket hosts .github/workflows/route-runner-reusable.yml with the same interface as the omniclaude copy, checking out omnibase_infra at a pinned sha so the workflow is self-sufficient."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-route-runner-reusable-hosted"
    statement: "The hosted reusable keeps its inputs, outputs, optional secrets, job id and job name, pins every action and the omnibase_infra checkout to a full sha, and reads nothing from omniclaude."
    acceptance:
      - id: "AC1"
        statement: "The hosted reusable workflow interface and pins are enforced -- falsifier: uv run pytest tests/ci/test_route_runner_reusable_omn16647.py -q"
      - id: "AC2"
        statement: "A workflow_call-only reusable must pin omnibase_infra by a full 40-hex sha while workflows this repo runs keep the uv.lock tag equality -- falsifier: uv run pytest tests/ci/test_sibling_pins_omn20001.py -q"
evidence_requirements:
  - kind: "tests"
    description: "Route-runner reusable interface, pin and sibling-pin tests."
    command: "uv run pytest tests/ci/test_route_runner_reusable_omn16647.py tests/ci/test_sibling_pins_omn20001.py -q"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-route-runner-reusable-interface"
    description: "The hosted reusable keeps its interface and full-sha pins."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_route_runner_reusable_omn16647.py -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC1"]
  - id: "dod-hosted-reusable-infra-sha-pin"
    description: "Hosted reusables pin omnibase_infra by full sha; repo-run workflows keep the lock tag."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_sibling_pins_omn20001.py -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC2"]
