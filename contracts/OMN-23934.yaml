schema_version: 1.0.0
ticket_id: OMN-23934
title: The lab alarm node raises container_restarts when a container restarts more often than its declared bound
summary: node_lab_alarm gains the container_restarts condition ported from the old lab alarm script; it reads the docker restart count of every container the lane manifest gives a restart_bound for the overlay's census lane, reads ALARM for each container past its own bound and INDETERMINATE when a container or the manifest cannot be read, and hands its verdict to node_lab_alarm_deliver_effect.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23934-container-restarts
  statement: Container restart counts are watched by node_lab_alarm with the old script's reading, the lane, the manifest, the docker command and the read bound come from the overlay, and an unreadable source never reads as healthy.
  acceptance:
  - id: AC1
    statement: "AC1: node_lab_alarm raises container_restarts for exactly the behaviour of the old script, per-container docker restart count over its bound, bounds from the lane-manifest restart_bound entries (config keys lane_manifest, census_lane, docker_command read over ssh), and a healthy fact does not raise -- falsifier: uv run pytest tests/nodes/node_lab_alarm/test_lab_alarm_container_restarts.py -q -k container_restarts"
  - id: AC2
    statement: "AC2: an unreadable source reads INDETERMINATE with its reason and never reads as healthy, and the reader is a protocol with an in-memory and a runtime adapter as HandlerBrokerLag has -- falsifier: uv run pytest tests/nodes/node_lab_alarm/test_lab_alarm_container_restarts.py -q -k indeterminate"
  - id: AC3
    statement: "AC3: integrated: the alarm is seen raised and delivered by node_lab_alarm on the Mac unit (a drilled fact posts to the notifications channel and writes one FRICTION row), and container_restarts is removed from scripts/lab_alarm.py in omnibase_infra and its config -- falsifier: read the channel post and the ledger FRICTION row after the drill, and grep -c container_restarts scripts/lab_alarm.py returns 0"
evidence_requirements:
- kind: tests
  description: The lab alarm node's and the delivery node's focused tests pass at the pushed head.
  command: uv run pytest tests/nodes/node_lab_alarm tests/nodes/node_lab_alarm_deliver_effect -q -n 0 --no-cov -p no:cacheprovider
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
