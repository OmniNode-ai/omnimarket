requirements:
- id: req-omn19998-memory-pilot-cognee-node
  statement: The memory pilot node ingests and answers through an overlay-chosen backend on a frozen bar, runs only for a matching frozen hash, makes no model call off the overlay's allowed hosts, keeps telemetry off, and enables nothing by default.
  acceptance:
  - id: AC14
    statement: 'AC14: a golden request ingests then answers and publishes started and completed on the contract topics; each typed failure (unfrozen pilot, endpoint off the allow list, lab model down, backend error, query before ingest) publishes started and failed on the contract topics, records a failure row and reads NOT_WORKING; the Cognee environment turns telemetry off and a spy on the library shows no event queued with it and one queued without it -- falsifier: uv run --frozen pytest tests/nodes/node_memory_pilot_effect -q --no-cov -n 0 -p no:randomly'
evidence_requirements:
- kind: tests
  description: The memory pilot node's golden chain, error chain, frozen-file, overlay and telemetry tests run at the pushed head; the telemetry spy test needs the optional package and skips where it is absent.
  command: uv run --frozen pytest tests/nodes/node_memory_pilot_effect -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn19998-memory-pilot-cognee-node
  description: Hosted wiring smoke runs the node's handler against an in-memory bus and recorder on the default backend and on injected faults, and checks the event topics against the contract. With the optional package installed on a lab host the telemetry spy test passes, and with the telemetry switches removed from the pilot environment the environment test and the spy test fail. No live runtime installation, broker overlay or enablement is asserted.
  source: manual
  binds_ac:
  - AC14
  checks:
