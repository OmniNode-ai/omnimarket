    acceptance:
      - id: AC1
        statement: "AC1: the text-state handler's row and the scope bundle's model agree on the error field (one typed model, no relaxed extra=allow) -- falsifier: a test feeding a text-state row with an error field to the bundle reader still raises `Extra inputs are not permitted`"
evidence_requirements:
