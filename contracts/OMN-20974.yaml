schema_version: "1.0.0"
ticket_id: "OMN-20974"
title: "The nightly rung eval reads the team's provider keys as the dogfood tenant, by reference"
summary: "The cloud rung of the nightly per-rung eval is an onex delegate pinned to a backend and run as the dogfood tenant, so the eval holds no provider key; its row names the tenant that answered and the credential reference the run used, and a run that answers as another tenant or on a non-tenant credential is an error row. The workflow no longer references the Actions secret, and a ratchet refuses any workflow that references a provider key secret. Not in this change: a live nightly run whose cloud-rung row names the dogfood tenant (it needs the lab runtime to read tenant references and the repository variables set), and deleting the Actions secret after that run."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-cloud-rung-as-tenant"
    statement: "The cloud rung runs as the dogfood tenant through onex delegate with a backend pin, holds no key, and its row names the tenant and credential reference."
    acceptance:
      - id: "AC1"
        statement: "AC1: the cloud rung is a pinned onex delegate run as the configured tenant on a tenant credential reference, and a run that answers as another tenant or on a house credential is refused -- falsifier: a cloud-rung row that carries no tenant, or an answer from another tenant that is graded"
  - id: "req-no-provider-key-in-workflows"
    statement: "No workflow in omnimarket references a provider key secret."
    acceptance:
      - id: "AC2"
        statement: "AC2: the ratchet finds no provider key secret in .github/workflows and flags a planted one -- falsifier: a workflow that references RUNG_EVAL_CLOUD_OPENROUTER_API_KEY or another provider key secret"
evidence_requirements:
