schema_version: 1.0.0
ticket_id: OMN-26487
title: A pyproject.toml change narrows by the OMN-26275 rules at or above the closure stage, where the file-level closure applies no data-file narrowing
summary: 'At or above the policy''s file_level_closure_stage the file-level closure read no pyproject.toml, so a pyproject.toml or uv.lock change had no section narrowing there. The adjacency map now
  carries closure_stage_pyproject_rule (seeds, or full_suite for an absent entry), and the shipped file declares seeds (option b): the closure runs and the section rule''s tests join its selection, the
  allowlist pyproject_narrowable_keys, the lock''s own version-line rule and pyproject_reader_globs reused unchanged. An escalation of the section rule (a key off the allowlist, an unparseable or unread
  diff, a lock change beyond the version line) takes the full suite with reason test_infrastructure whatever else the closure selected. The code is in the selector node''s closure handler and models;
  scripts/ci/detect_test_paths.py passes base_ref to the closure at zero net lines. The section switch (pyproject_section_selection_enabled) stays off and selection_stage stays 0, so nothing a pull
  request runs changes with this change.'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn26487-closure-stage-pyproject
  statement: A pyproject.toml change narrows by the same section rule at or above the closure stage as below it, through a reviewed entry in the adjacency file, and fails closed on every key, side or lock change outside the rule.
  acceptance:
  - id: AC1
    statement: 'AC1: the chosen rule for pyproject changes at or above the closure stage is written in the selector node''s policy or adjacency file with the OMN-26275 allowlist keys it reuses -- falsifier: `uv run pytest tests/nodes/node_test_selection_selector_compute/ -q --no-cov -k closure_stage_pyproject_rule` fails when the policy entry is removed'
  - id: AC2
    statement: 'AC2: with `selection_stage` at or above the closure stage, a pyproject change that only touches an allowlisted key selects what the OMN-26275 replay receipt expects, and a key off the allowlist escalates to the full suite -- falsifier: `-k closure_stage_pyproject_unknown_key_escalates` with fixture key `tool.example.setting`; add it to the allowlist and the test must fail'
  - id: AC3
    statement: 'AC3: the three dependency merges `cdbc99eb4a`, `d970dcb251` and `c62d5b24d5` still run the full suite under closure -- falsifier: `uv run pytest tests/nodes/node_test_selection_selector_compute/test_pyproject_sections.py -q --no-cov -k closure_stage_pyproject_sections` over the receipt lists fails on any other split'
  - id: AC4
    statement: 'AC4: integrated: a pull request on omnimarket dev that changes only an allowlisted pyproject key gets its narrowed selection from the deployed selector at the closure stage, on the dev lane -- falsifier: the CI run of that pull request on dev, its detect-test-paths output read back, names the narrowed set; with the policy entry removed the same run selects the full suite'
evidence_requirements:
- kind: tests
  description: The closure-stage pyproject tests and the existing selector tests pass at the pushed head.
  command: uv run --frozen pytest tests/nodes/node_test_selection_selector_compute tests/unit/scripts/test_detect_test_paths.py -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn26487-ac1
  description: 'AC1: scripts/ci/test_selection_adjacency.yaml declares closure_stage_pyproject_rule: seeds beside the pyproject_* keys it reuses, with the decision and its reason; the test reads the entry from the shipped file, so removing it fails the test, and an absent entry takes the full suite.'
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_test_selection_selector_compute/test_pyproject_sections.py -q --no-cov -n 0 -p no:randomly -k closure_stage_pyproject_rule
    cwd: .
- id: dod-omn26487-ac2
  description: 'AC2: at stage 3 an allowlisted entry-point change selects the readers, the new node and the always set; a key tool.example.setting escalates with test_infrastructure, alone and beside a source file, and the test''s control adds it to the allowlist and sees the change narrow.'
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_test_selection_selector_compute/test_pyproject_sections.py -q --no-cov -n 0 -p no:randomly -k closure_stage_pyproject_unknown_key_escalates
    cwd: .
- id: dod-omn26487-ac3
  description: 'AC3: the 18 pyproject merges replayed through the closure handler split as below the closure stage: cdbc99eb4a, d970dcb251 and c62d5b24d5 stay full, 79f31e93f5 stays full (its lock changes beyond the own version line), the other 14 narrow; each merge is resolved twice and the two answers compared.'
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_test_selection_selector_compute/test_pyproject_sections.py -q --no-cov -n 0 -p no:randomly -k closure_stage_pyproject_sections
    cwd: .
- id: dod-omn26487-ac4
  description: 'AC4 is integrated and its own reading is the CI run of a pull request on dev that changes only an allowlisted pyproject key, its detect-test-paths output read back after merge; that reading is not claimed met by this change. The bound check is the hosted proxy for it: the selector at stage 3 over the shipped adjacency file narrows a pyproject change that touches an allowlisted key, and the control with the closure_stage_pyproject_rule entry removed selects the full suite.'
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_test_selection_selector_compute/test_pyproject_sections.py -q --no-cov -n 0 -p no:randomly -k "closure_stage_pyproject_rule_seeds_select_the_readers_at_the_closure_stage or closure_stage_pyproject_rule_removed_entry_takes_the_full_suite"
    cwd: .
- id: dod-omn26487-integration-proof
  description: the selector tests run on a lab host at the pushed head; hosted CI cannot reach the lab, so only the local Done gate runs this unbound check
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-26487 --kind test -- env PYTHONDONTWRITEBYTECODE=1
      uv run --frozen pytest tests/nodes/node_test_selection_selector_compute/test_pyproject_sections.py -q --no-cov
    cwd: .
