schema_version: 1.0.0
ticket_id: OMN-24646
title: The plan-owner check reads UNKNOWN because the work ledger reader node has no overlay.yaml under the overlay root
summary: The reader overlay and the plan owner overlay both exist in the overlays repository and were never renamed or dropped, so the UNKNOWN comes from a process whose ONEX_SKILL_OVERLAY_ROOTS names the plugin overlay tree and not the overlays clone. When no overlay is found, node_plan_owner_check_effect raised NodeOverlayNotFoundError and exited 1 with a traceback, the code that reads as MISSING. It now prints one UNKNOWN line that names the overlay and the roots searched and exits 2. The deployment root list itself is not changed by this PR. A join test pins the root layout <root>/<node>/overlay.yaml, where a root without the reader overlay reads UNKNOWN (exit 2) and a root holding both overlays reads a verdict (exit 0). The change also carries the one-line priced_spend call fix that keeps strict mypy green over src/omnimarket/.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24646-unknown-names-roots
  statement: An overlay that cannot be loaded is one UNKNOWN line that names the overlay and the roots searched, with exit 2, and never a traceback.
  acceptance:
  - id: AC4
    statement: 'AC4: a test red-first for the missing overlay fails on main and passes on the branch -- falsifier: `uv run pytest tests -k plan_owner -q` in the omnimarket clone'
- id: req-omn24646-overlay-root-join
  statement: The plan owner check and its reader node find their overlays under an overlay root laid out as <root>/<node>/overlay.yaml, and a test pins both the absent-root and the present-root case.
  acceptance:
  - id: AC2
    statement: 'AC2: the ledger reader node reads its overlay (or its declared default) from the overlay root with no missing-overlay error -- falsifier: `uv run python -m omnimarket.nodes.node_work_ledger_reader_effect` run with ONEX_SKILL_OVERLAY_ROOTS set to the overlay root prints no NodeOverlayNotFoundError'
  - id: AC3
    statement: 'AC3: the plan-owner check returns an owner reading and not UNKNOWN -- falsifier: `uv run python -m omnimarket.nodes.node_plan_owner_check_effect` returns a reading whose state is not UNKNOWN'
evidence_requirements:
- kind: tests
  description: The plan owner check runtime tests, including the two missing-overlay cases.
  command: env -u PYTHONPATH uv run --frozen pytest tests/unit/nodes/node_plan_owner_check_effect/test_runtime_plan_owner_check.py -q --no-cov -n 0 -p no:randomly
- kind: tests
  description: The plan owner overlay root join tests pass at the pushed head.
  command: uv run pytest tests/unit/nodes/node_plan_owner_check_effect/test_plan_owner_overlay_root_join.py -q -n 0 --no-cov -p no:cacheprovider
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24646-ac4-missing-overlay-test
  description: The two missing-overlay tests (reader overlay absent, owner overlay absent) fail against the base runtime_plan_owner_check.py (NodeOverlayNotFoundError raised) and pass at head.
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/nodes/node_plan_owner_check_effect/test_runtime_plan_owner_check.py -q --no-cov -n 0 -p no:randomly -k missing
    cwd: .
  - check_type: test_passes
    check_value: uv run pytest tests/unit/nodes/node_plan_owner_check_effect/test_plan_owner_overlay_root_join.py -q -n 0 --no-cov -p no:cacheprovider
    cwd: .
- id: dod-omn24646-ac2
  description: 'AC2: with the reader node overlay absent from the root the loader raises NodeOverlayNotFoundError naming the node and the root, and with it present under the root the overlay loads.'
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/nodes/node_plan_owner_check_effect/test_plan_owner_overlay_root_join.py -q -n 0 --no-cov -p no:cacheprovider
    cwd: .
- id: dod-omn24646-ac3
  description: 'AC3: with both overlays under the root the plan owner check exits 0 with OWNED and no verdict=UNKNOWN line; with only its own overlay it exits 2 with UNKNOWN plan-owner.'
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/nodes/node_plan_owner_check_effect/test_plan_owner_overlay_root_join.py -q -n 0 --no-cov -p no:cacheprovider
    cwd: .
- id: dod-omn24646-integration-proof
  description: Hosted CI cannot reach a lab host, so only the local Done gate runs this unbound check. It runs the node's own command at the sha on a lab host with an overlay root that holds no overlay for the node, and fails unless the command prints one UNKNOWN line naming the roots and exits 2.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24646 --kind test -- sh -c 'mkdir -p /tmp/omn24646_empty_root && ONEX_SKILL_OVERLAY_ROOTS=/tmp/omn24646_empty_root uv run --frozen python -m omnimarket.nodes.node_plan_owner_check_effect > /tmp/omn24646_out.txt || test $? -eq 2 && grep -q "^UNKNOWN plan-owner | node_work_ledger_reader_effect:" /tmp/omn24646_out.txt && grep -q /tmp/omn24646_empty_root /tmp/omn24646_out.txt'
    cwd: .
