schema_version: 1.0.0
ticket_id: OMN-21975
title: Compaction ground truth derived from the ledger
summary: A pure compute node reads a pinned ledger prefix at a boundary instant and returns the must-survive set of eight kinds (rulings in force, consents, open claims, open asks, sent promises, unsent drafts, holds, unacknowledged messages), each with its quote, required spans, expected conduct and the stamps of its covering rows, using the work-ledger reducer for what is in force. A second operation audits a derived set against positive and negative lists and the TE.1 labelled propositions. The node declares no topic and is reachable only by direct invocation.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn21975-ground-truth
    statement: The compaction measurement derives its must-survive set from the ledger with no hand labels, and the derived set is a strict, audited selection.
    acceptance:
      - id: AC1
        statement: 'AC1: every TE.1 proposition that names a covering ledger row is in the derived set for its boundary -- falsifier: a labelled proposition with a covering row and no derived item'
      - id: AC2
        statement: 'AC2: every item''s stamp exists in the pinned ledger prefix -- falsifier: a stamp not found by `grep -c` on the prefix'
      - id: AC3
        statement: 'AC3: a superseded ruling is not in the set; an amended ruling and its amender are one item carrying both rows; a correction is carried with its target -- falsifier: `uv run pytest -k "superseded_not_in_force or amendment_composes or correction_closure"`, matching TA.5''s reducer'
      - id: AC4
        statement: 'AC4: the same inputs give the same set and hash -- falsifier: a differing hash on rerun'
      - id: AC5
        statement: 'AC5: the derived set is a strict selection: on the 8 lab boundaries the plan author audits, row by row, a positive list and a negative list per kind (closed, irrelevant and out-of-scope rows that must be absent), and the node''s set equals the audited positives and contains none of the negatives -- falsifier: a negative-list row in the set, a positive-list row missing, or a set whose size equals the number of rows in the prefix'
evidence_requirements:
  - kind: tests
    description: The ground-truth node suite runs at the pushed head on a lab host.
    command: uv run pytest tests/nodes/node_compaction_ground_truth_compute -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn21975-ac1
    description: AC1 at fixture level. The audit handler fails a labelled proposition whose covering row (the labels.yaml ledger_coverage cell) is in no derived item, and the TE.1 labels file loads into the proposition model. The row-by-row comparison on the 8 lab boundaries needs the pinned ledger prefix and is owed to the lab readback.
    source: manual
    binds_ac:
      - AC1
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/nodes/node_compaction_ground_truth_compute/test_audit.py -q --no-cov --tb=line -k "labelled_propositions or covering_cell or labels_yaml"
        cwd: .
  - id: dod-omn21975-ac2
    description: AC2 checks that every row stamp of every item, at three boundaries of the synthetic ledger, occurs in the prefix text.
    source: manual
    binds_ac:
      - AC2
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/nodes/node_compaction_ground_truth_compute/test_ground_truth.py -q --no-cov --tb=line -k every_stamp_is_in_the_prefix
        cwd: .
  - id: dod-omn21975-ac3
    description: AC3 runs the three named tests against the shared work-ledger reducer, with the superseded ruling absent, the amender composed into one item with both rows and both stamps in the required spans, and the correction carried with its target.
    source: manual
    binds_ac:
      - AC3
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/nodes/node_compaction_ground_truth_compute -q --no-cov --tb=line -k "superseded_not_in_force or amendment_composes or correction_closure"
        cwd: .
  - id: dod-omn21975-ac4
    description: AC4 derives the same boundary twice and expects equal sets and equal hashes, and a different hash for a different boundary or a changed row.
    source: manual
    binds_ac:
      - AC4
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/nodes/node_compaction_ground_truth_compute/test_ground_truth.py -q --no-cov --tb=line -k "same_inputs_same_set_and_hash or hash_ignores_nothing"
        cwd: .
  - id: dod-omn21975-ac5
    description: AC5 at fixture level. The synthetic ledger carries closed, irrelevant and out-of-scope rows; the exact set per boundary is asserted, the audit fails on a present negative, a missing positive, an unexpected item and a set the size of the prefix. The audit on the 8 lab boundaries is a plan-author audit owed to the lab readback.
    source: manual
    binds_ac:
      - AC5
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/nodes/node_compaction_ground_truth_compute -q --no-cov --tb=line -k "expected_set or absent or selection or audited_set or negative or positive or item_outside or size_of_the_prefix"
        cwd: .
  - id: dod-omn21975-integration-proof
    description: The pushed head ran the ground-truth node suite on a lab host and exited 0. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-21975 -- uv run --frozen pytest tests/nodes/node_compaction_ground_truth_compute -q --no-cov
        cwd: .
  - id: dod-omn21975-deploy-probe-contract
    description: 'Deploy probe: the checked-out contract declares the audit operation and no topic, and the entry point is registered.'
    source: manual
    checks:
      - check_type: command
        check_value: "grep -F 'operation: audit_ground_truth' src/omnimarket/nodes/node_compaction_ground_truth_compute/contract.yaml"
        cwd: .
      - check_type: command
        check_value: grep -F 'node_compaction_ground_truth_compute = "omnimarket.nodes.node_compaction_ground_truth_compute"' pyproject.toml
        cwd: .
