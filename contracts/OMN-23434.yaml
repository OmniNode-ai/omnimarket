schema_version: 1.0.0
ticket_id: OMN-23434
title: Handing code-writing to cheaper models works again on the lab machines
summary: Adds the join test for the seam between the lane delegation step, the code-edit node and the delegate terminal (golden and error chains, pinned wire, three planted renames), and adds node_delegation_code_budget_compute, whose overlay carries the code step's call budget sized from measured drafts. The join test reads red against a core that rejects ceiling_source and green against one that carries it.
is_seam_ticket: true
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23434-code-draft-seams
  statement: A code draft sent through the lane delegation step returns a diff on each lab host, and the seams it crosses fail a test when either side changes shape.
  acceptance:
  - id: AC1
    statement: "AC1: omnimarket#5703 merges with this ticket's contract (join test with the three planted renames, node_delegation_code_budget_compute) and overlays#188 merges -- falsifier: the join test with one field renamed"
evidence_requirements:
- kind: tests
  description: The join test (golden and error chains, pinned wire, three planted renames) and the budget node's golden, error and mutation tests.
  command: uv run --frozen pytest tests/nodes/node_delegated_code_edit_orchestrator/test_join_delegation_step_seam.py tests/nodes/node_delegation_code_budget_compute -q --no-cov -p no:cacheprovider
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23434-ac1-join
  description: The in-memory profile passes the golden, error and pinned wire checks; each planted rename (the step's flag, the node's delegate_run_ids, the core's budget field) turns a chain red with CODE_EDIT_SEAM_MUTATE set.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_delegated_code_edit_orchestrator/test_join_delegation_step_seam.py -q --no-cov -p no:cacheprovider
    cwd: .
- id: dod-omn23434-ac1-budget-node
  description: The budget node's golden chain, error chain and mutation tests pass; a sized value that drops the margin or the rounding step reads red.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_delegation_code_budget_compute -q --no-cov -p no:cacheprovider
    cwd: .
- id: dod-omn23434-deploy-probe
  description: Hosted structural probe that needs no lab route or broker. GitHub serves the join test at the checked-out HEAD with the planted-rename switch, and serves the budget node contract at the same HEAD. It fails at the merge base, which holds neither file.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: command
    check_value: >-
      bash -o pipefail -c 'gh api "repos/OmniNode-ai/omnimarket/contents/tests/nodes/node_delegated_code_edit_orchestrator/test_join_delegation_step_seam.py?ref=$(git rev-parse HEAD)" --jq .content | base64 -d | grep -F "CODE_EDIT_SEAM_MUTATE" > /dev/null && gh api "repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_delegation_code_budget_compute/contract.yaml?ref=$(git rev-parse HEAD)" --jq .content | base64 -d | grep -F "node_name: node_delegation_code_budget_compute" > /dev/null'
- id: dod-omn23434-integration-proof
  description: The pushed head runs the join test and the budget node's tests on a lab host through the lab work runner, so the seam and the node are exercised on a live surface rather than only in unit scope. The real-broker profile of the join test (CODE_EDIT_SEAM_LANE) is read separately on h051, where it reads red against a core that rejects ceiling_source and green against a core that carries it. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: 'env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23434 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_delegated_code_edit_orchestrator/test_join_delegation_step_seam.py tests/nodes/node_delegation_code_budget_compute -q --no-cov'
    cwd: .
