schema_version: "1.0.0"
ticket_id: "OMN-26721"
title: "Lane work orchestrator task 6: the orchestrator node folds worker, effect and tick inputs one at a time and hands off through the real PR handoff nodes"
summary: >-
  Acceptance for OMN-26721 (task 6 of the lane work orchestrator plan). The node
  node_lane_work_orchestrator classifies a result, folds it through the lane work reducer,
  publishes the transition receipt, then each output the receipt lists (step reply, STATUS row,
  effect commands, terminal), and only then commits the input. Overlapping inputs are folded one
  at a time with consecutive seq values. A worker is told only to read a log, find a cause, fix,
  merge, commit or push.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-omn26721-lane-work-orchestrator"
    statement: >-
      The lane work loop runs on the bus through one orchestrator whose fold is serial, whose
      receipts commit before its outputs, and which hands a proven change to the PR handoff nodes.
    acceptance:
      - id: "AC1"
        statement: >-
          one run goes from queued to handed_off and one to blocked on the in-memory bus, and a crash between any two publishes loses no output and duplicates no receipt -- falsifier: the unit and integration tests under tests/unit/nodes/node_lane_work_orchestrator and tests/integration/nodes/node_lane_work_orchestrator, with a crash injected at each position
      - id: "AC2"
        statement: >-
          overlapping inputs are folded one at a time with consecutive seq values and one receipt per accepted input -- falsifier: test_runtime_dispatch.py publishes a worker event, an effect completion, a PR observation and a tick at once and asserts consecutive seq and no lost input
      - id: "AC3"
        statement: >-
          a worker never receives prove, post or hand-off as next_action, and no address, host or topic is hard-coded in the handlers -- falsifier: a test over every next_action with actor=agent, and grep -nE "onex.(cmd|evt|intent).|h0[0-9]{2}|192.168|:9092" handlers/*.py prints nothing
evidence_requirements: []
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn26721-ac1-flow-and-crash"
    description: >-
      AC1: a run reaches handed_off and one reaches blocked, and a crash injected at every publish position of both runs loses no output and duplicates no receipt.
    source: "manual"
    binds_ac: ["AC1"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/nodes/node_lane_work_orchestrator/test_orchestrator_flow.py tests/integration/nodes/node_lane_work_orchestrator/test_inmemory_bus.py -q --no-cov -n 0 -p no:randomly"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn26721-ac2-overlapping-inputs"
    description: >-
      AC2: a worker event, an effect completion, a PR observation and a tick published at once under the runtime's dispatch engine each get one receipt, with consecutive seq.
    source: "manual"
    binds_ac: ["AC2"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/nodes/node_lane_work_orchestrator/test_runtime_dispatch.py tests/unit/nodes/node_lane_work_orchestrator/test_fold_contract.py -k 'overlapping or consecutive_seq or duplicate' -q --no-cov -n 0 -p no:randomly"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn26721-ac3-worker-actions-and-no-literals"
    description: >-
      AC3: every next_action given to a worker is in the allowed kinds, and the handlers hold no topic, host or address literal.
    source: "manual"
    binds_ac: ["AC3"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/nodes/node_lane_work_orchestrator/test_fold_contract.py -k 'never_told or next_action or hard_coded' -q --no-cov -n 0 -p no:randomly"
        cwd: "${OMNI_HOME}/omnimarket"
      - check_type: "command"
        check_value: "! grep -nE 'onex[.](cmd|evt|intent)[.]|h0[0-9]{2}|192[.]168|:9092' src/omnimarket/nodes/node_lane_work_orchestrator/handlers/*.py"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn26721-contract-gates"
    description: >-
      The contract's topics are fully routed and declared: every subscribed topic has a handler_routing entry (the lab proof failure reaches the intake), the step reply is declared as read by callers, and the reducer names its caller.
    source: "manual"
    binds_ac: ["AC1", "AC3"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/nodes/node_lane_work_orchestrator/test_contract_topics.py -q --no-cov -n 0 -p no:randomly"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn26721-help-seam-and-overlay"
    description: >-
      Review round 3 of the plan (sections 12.2 to 12.4): the orchestrator's overlay is one document and one model with the eight-tier help chain at its top level, a start whose worker tier is not in the chain is refused with a receipt and begins no workflow, and entering help_requested publishes exactly one message on the help topic and no ledger MSG row of the fold's own.
    source: "manual"
    binds_ac: ["AC1", "AC3"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/nodes/node_lane_work_orchestrator/test_help_seam.py tests/unit/nodes/node_lane_work_orchestrator/test_overlay_document.py -q --no-cov -n 0 -p no:randomly"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn26721-integration-proof"
    description: >-
      The node's unit and integration tests pass on a lab host at the pushed head.
    source: "manual"
    execution_scope: "local_done_gate"
    checks:
      - check_type: "command"
        check_value: "env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha \"$(git rev-parse HEAD)\" --lane dod-integration-proof-26721 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/nodes/node_lane_work_orchestrator tests/integration/nodes/node_lane_work_orchestrator -q --no-cov -n 0 -p no:randomly"
        cwd: "."
  - id: "dod-omn26721-handler-binding-and-gates"
    description: >-
      Every handler_*.py of the node is bound by its contract (the fold engine lives under orchestration/), the help topic is declared as consumed outside the node, and the reducer's state machine declares only keys the typed FSM models know.
    source: "manual"
    binds_ac: ["AC3"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/nodes/node_lane_work_orchestrator/test_handlers_are_bound.py tests/unit/contracts/test_walkable_state_machines.py -q --no-cov -n 0 -p no:randomly"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn26721-runtime-image-core-has-lane-work"
    description: >-
      The omnibase-core that the pinned omnibase-infra tag locks carries the lane work models, so the composed runtime image can auto-wire the orchestrator (a known bad infra tag locks a core with none).
    source: "manual"
    binds_ac: ["AC1"]
    checks:
      - check_type: "command"
        check_value: "grep -q 'omnibase_infra.git\", tag = \"dev-20261128050503-277c1f2fe0b2\"' pyproject.toml"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn26721-overlay-optional-bootstrap"
    description: >-
      The three lane work nodes each carry a bootstrap overlay.example.yaml and declare their overlay optional, so the added-nodes overlay check does not ask the overlay source for a document none of them reads from there (a known bad node holding only the example file reads as requiring one).
    source: "manual"
    binds_ac: ["AC1"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/nodes/node_lane_work_reducer/test_overlay_requirement.py -q --no-cov -n 0 -p no:randomly"
        cwd: "${OMNI_HOME}/omnimarket"
