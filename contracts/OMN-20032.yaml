---
schema_version: "1.0.0"
ticket_id: "OMN-20032"
title: "omnimarket's Repo Evidence Gate caller pins the receipt-gate reusable that carries the verifier floor"
summary: "Operator ruling 2026-10-10T11:04:11Z (R2) makes node_dod_verify refuse a contract whose acceptance criteria are only partly bound, in every repository. omnibase_core#1932 adds VERIFIER_FLOOR 0.4.303 to the receipt-gate reusable's verifier install step, which exits 1 when a caller's verifier-version is below it. omnimarket's caller moves from the omnibase_core#1914 pin, which has no floor, to the #1932 squash commit and keeps verifier-version at 0.4.305."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-caller-repin-verifier-floor"
    statement: |-
      omnimarket's Repo Evidence Gate caller pins the omnibase_core receipt-gate reusable at omnibase_core#1932's squash commit, whose verifier install step refuses a verifier-version below the floor, and passes a verifier-version at or above that floor, with job ids and inputs otherwise unchanged.
    acceptance:
      - id: "AC3"
        statement: |-
          AC3: .github/workflows/call-repo-evidence-gate.yml pins receipt-gate.yml at 4e4f5e0404d364e296c5d37db6aa3ab9e07f8ffa (omnibase_core#1932) -- falsifier: uv run pytest tests/ci/test_repo_evidence_caller_verifier_floor_omn20032.py -q -k carries_the_verifier_floor fails at the merge base
      - id: "AC4"
        statement: |-
          AC4: the caller passes verifier-version at or above VERIFIER_FLOOR 0.4.303 to the floor-enforcing reusable, the comparison refuses 0.4.280 and 0.4.302 and admits 0.4.303 and 0.4.305 -- falsifier: uv run pytest tests/ci/test_repo_evidence_caller_verifier_floor_omn20032.py -q -k "at_or_above_the_floor or floor_comparison" fails at the merge base because the old reusable does not enforce the floor
  - id: "req-wire-every-criterion-bound"
    statement: |-
      The test that proves node_dod_verify refuses a partly bound contract runs in a pre-commit hook and in the required lint job.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: the pre-commit hook dod-verify-every-criterion-bound and the required lint job both run tests/test_dod_verify_every_criterion_bound.py, and that test fails when the unbound-criteria demotion is removed -- falsifier: uv run pytest tests/ci/test_dod_verify_criterion_bound_wiring_omn20032.py -q
      - id: "AC2"
        statement: |-
          AC2: the guarding test passes at the head -- falsifier: uv run pytest tests/ci/test_dod_verify_criterion_bound_wiring_omn20032.py tests/test_dod_verify_every_criterion_bound.py -q -p no:randomly --no-cov fails at the merge base because the hook and the lint step are absent
evidence_requirements:
  - kind: "tests"
    description: "The caller pins the floor-carrying reusable."
    command: "uv run pytest tests/ci/test_repo_evidence_caller_verifier_floor_omn20032.py -q -k carries_the_verifier_floor"
  - kind: "tests"
    description: "The caller passes a version at or above the floor to the floor-enforcing reusable, with a refusing and an admitting comparison case."
    command: "uv run pytest tests/ci/test_repo_evidence_caller_verifier_floor_omn20032.py -q -k \"at_or_above_the_floor or floor_comparison\""
  - kind: "tests"
    description: "The hook and the lint job run the guarding test, and the guarding test passes."
    command: "uv run pytest tests/ci/test_dod_verify_criterion_bound_wiring_omn20032.py tests/test_dod_verify_every_criterion_bound.py -q -p no:randomly --no-cov"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn20032-caller-pins-floor-reusable"
    description: "The caller pins omnibase_core#1932's receipt-gate reusable."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_repo_evidence_caller_verifier_floor_omn20032.py -q -k carries_the_verifier_floor"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC3"]
  - id: "dod-omn20032-caller-verifier-at-floor"
    description: "The caller passes a version at or above the floor to the floor-enforcing reusable and the comparison has a refusing and an admitting case."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_repo_evidence_caller_verifier_floor_omn20032.py -q -k \"at_or_above_the_floor or floor_comparison\""
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC4"]
  - id: "dod-omn20032-wiring"
    description: "The pre-commit hook and the lint job run the guarding test, and the guarding test passes at the head."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_dod_verify_criterion_bound_wiring_omn20032.py tests/test_dod_verify_every_criterion_bound.py -q -p no:randomly --no-cov"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC1", "AC2"]
