  description: A refusal is logged and started in observe mode and refused in enforce mode; the mode is per path with a default.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest src/omnimarket/nodes/node_start_admission_effect -q --no-cov -n 0 -p no:randomly -k observe_vs_enforce
    cwd: .
- id: dod-omn22939-reservation-epoch
  description: A consumed reservation cannot be consumed again, a consume after an epoch advance is refused, and the refused reservation is released while the request re-decides.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest src/omnimarket/nodes/node_start_admission_effect -q --no-cov -n 0 -p no:randomly -k reservation_epoch
    cwd: .
- id: dod-omn22939-no-answer
  description: A store with no answer by a 0.05 second deadline, or one that raises, lets a start proceed as unadmitted and does not let an outward action proceed, in both modes.
  source: manual
