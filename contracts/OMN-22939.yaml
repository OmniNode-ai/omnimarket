schema_version: 1.0.0
ticket_id: OMN-22939
title: "The start-admission effect decides and logs what it would refuse at each start path, with a single-use reservation and an epoch, and refuses nothing until the drill passes there"
summary: A new effect node, node_start_admission_effect, takes one start request, reserves the piece in the gate store, consumes the reservation once at the epoch it was decided at, and answers whether the start proceeds. In observe mode a refusal is logged and the start proceeds; in enforce mode it is refused; the mode of each path is an overlay setting. A consume after an epoch advance is refused by the store, so the effect releases the reservation and re-decides. A store with no answer by the deadline lets a start proceed logged as unadmitted and does not let an outward action proceed. The gate store gains an optional expected epoch on consume. No start path calls the effect yet, and the Postgres backend of the store is not part of this change.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn22939-start-admission
  statement: A start-admission effect decides and logs what it would refuse, with a single-use reservation fenced by the epoch, observe before enforce.
  acceptance:
  - id: AC1
    statement: "AC1: in observe mode a request the policy would refuse is logged as refused and started, and in enforce mode it is refused -- falsifier: uv run pytest src/omnimarket/nodes/node_start_admission_effect -q -k observe_vs_enforce"
  - id: AC2
    statement: "AC2: a reservation is single-use, never consumed after an epoch advance, and released while the request re-decides -- falsifier: uv run pytest src/omnimarket/nodes/node_start_admission_effect -q -k reservation_epoch"
  - id: AC3
    statement: "AC3: an admission request with no answer by its deadline proceeds logged as unadmitted and an outward action with no answer does not proceed -- falsifier: uv run pytest src/omnimarket/nodes/node_start_admission_effect -q -k no_answer"
evidence_requirements:
- kind: tests
  description: The acceptance tests of this ticket at the pushed head.
  command: uv run --frozen pytest src/omnimarket/nodes/node_start_admission_effect -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
