---
schema_version: "1.0.0"
ticket_id: "OMN-20676"
title: "The merge sweep's lane plan, dispatch cap and lane retry decisions are the node node_merge_sweep_plan_compute"
summary: "The first shard of OMN-20676 adds the pure compute node node_merge_sweep_plan_compute, which ports the merge-sweep skill's lane plan and the sweep workflow's dispatch cap and lane retry loop, with its topics declared in its contract. The workflow stays the live path: the lane runner, the reader and the callers are not moved in this shard. AC1 and AC2 are bound to the parity tests recorded from the old tools, and AC3 to the entry-point and metadata test."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-merge-sweep-plan-node"
    statement: "The lane plan of a merge sweep is the pure node node_merge_sweep_plan_compute, equal to the skill's own plan rule over generated readings."
    acceptance:
      - id: "AC1"
        statement: "AC1: the lanes, skipped PRs, placement flag and load per core of node_merge_sweep_plan_compute equal the skill's own plan rule on the recorded parity cases -- falsifier: uv run pytest tests/nodes/node_merge_sweep_plan_compute/test_merge_sweep_parity.py -q fails on a broken owner gate"
  - id: "req-merge-sweep-workflow-decisions"
    statement: "The dispatch cap and the lane retry loop of the sweep workflow are operations of the same node, equal to the workflow run with scripted runner exits."
    acceptance:
      - id: "AC2"
        statement: "AC2: the dispatched and deferred lane counts and every start and wait of a lane equal the real merge_sweep.js run with scripted runner exit codes on the recorded cases -- falsifier: uv run pytest tests/nodes/node_merge_sweep_plan_compute/test_merge_sweep_parity.py -q fails on a wrong no-host exit code"
  - id: "req-merge-sweep-plan-registration"
    statement: "The node is a package-form entry point with valid metadata and its topics are declared in its contract."
    acceptance:
      - id: "AC3"
        statement: "AC3: the entry point is package-form, the metadata passes the schema test and the contract declares the command and terminal topics -- falsifier: uv run pytest tests/test_merge_sweep_plan_registration.py tests/nodes/node_merge_sweep_plan_compute/test_golden_chain_merge_sweep_plan_compute.py -q"
  - id: "req-merge-sweep-reading-node"
    statement: "The reading of a merge sweep is the pure node node_merge_sweep_reading_compute over facts gathered from the PR watcher's state by node_merge_sweep_effect, equal to the old reader's reading on the recorded sweep."
    acceptance:
      - id: "AC4"
        statement: "AC4: the product merges, controller stall, escalations, red PRs with owners and classes, chain heads and claim-time rechecks of the node chain equal the old sweep reader's on the recorded sweep, and the plan over them equals the old plan -- falsifier: uv run pytest tests/nodes/node_merge_sweep_reading_compute/test_merge_sweep_reading_parity.py -q fails on a broken owner gate or a broken class rule"
  - id: "req-merge-sweep-dispatch"
    statement: "The brief of each lane and its dispatch through the remote-lane runner are operations of the plan and effect nodes, equal to the real merge_sweep.js run with scripted runner exit codes on the recorded sweep."
    acceptance:
      - id: "AC5"
        statement: "AC5: every brief, runner command, start, wait and receipt of a sweep through the nodes equals the real merge_sweep.js run with scripted runner exit codes on the recorded cases -- falsifier: uv run pytest tests/nodes/node_merge_sweep_effect/test_merge_sweep_dispatch_parity.py -q fails on a broken brief"
  - id: "req-merge-sweep-shard2-registration"
    statement: "The reading and effect nodes are package-form entry points with valid metadata, their topics are declared in their contracts and the effect refuses a state that is not fresh."
    acceptance:
      - id: "AC6"
        statement: "AC6: the entry points are package-form, the metadata passes the schema test, the contracts declare their topics and a stale or incomplete watcher state is refused with no reading -- falsifier: uv run pytest tests/test_merge_sweep_nodes_registration.py tests/nodes/node_merge_sweep_reading_compute/test_golden_chain_merge_sweep_reading_compute.py tests/nodes/node_merge_sweep_effect -q"
  - id: "req-merge-sweep-orchestrator"
    statement: "One request to node_merge_sweep_orchestrator runs a whole sweep through the reading, plan and effect nodes, equal to the real merge_sweep.js run with scripted runner exit codes on the recorded sweep."
    acceptance:
      - id: "AC7"
        statement: "AC7: the starts, waits, runner commands, briefs, lane receipts and deferred count of a sweep run by one request to the orchestrator equal the real merge_sweep.js run with scripted runner exit codes on the recorded cases, and its plan equals the old plan -- falsifier: uv run pytest tests/nodes/node_merge_sweep_orchestrator/test_merge_sweep_orchestrator_parity.py -q fails on a broken brief or a retry that never waits"
      - id: "AC8"
        statement: "AC8: the orchestrator contract declares its topics and a wiring plan naming only operations the sibling nodes declare, the entry point is package-form, the metadata passes the schema test, and a stale or missing watcher state is refused with no lane started -- falsifier: uv run pytest tests/nodes/node_merge_sweep_orchestrator/test_golden_chain_merge_sweep_orchestrator.py tests/nodes/node_merge_sweep_orchestrator/test_error_chain_merge_sweep_orchestrator.py -q"
  - id: "req-merge-sweep-bus-entry"
    statement: "A caller requests a whole merge sweep over the bus: the orchestrator contract declares its command and terminal topics in event_bus, and the local runtime publishes the request on the command topic and reads the result from the completed topic."
    acceptance:
      - id: "AC9"
        statement: "AC9: a sweep requested on the orchestrator's declared command topic through the canonical local runtime completes with the handler's plan, and a sweep whose watcher state is missing answers ok false with no lane started -- falsifier: uv run pytest tests/nodes/node_merge_sweep_orchestrator/test_bus_cycle_merge_sweep_orchestrator.py -q fails with the node's handler file removed"
  - id: "req-merge-sweep-scheduled-request"
    statement: "A scheduled window of the merge sweep becomes the orchestrator's typed run request on the bus: the pure node node_merge_sweep_request_compute turns one scheduled fire into one request, the runtime publishes it on the orchestrator's command topic, and the orchestrator answers on its completed topic."
    acceptance:
      - id: "AC10"
        statement: "AC10: two scheduled windows through the three packaged contracts on the canonical in-memory bus produce exactly two requests on the orchestrator's command topic and two correlated completions, a window whose watcher state is missing completes ok false with no lane started, and the request handler returns nothing for a fire of another workflow and reads no deployment configuration while handling -- falsifier: uv run pytest tests/nodes/node_merge_sweep_orchestrator/test_bus_cycle_merge_sweep_orchestrator.py -q -k 'scheduled_ticks_request_and_complete or scheduled_request_uses_only_supplied_template' fails with the request node's handler file removed"
evidence_requirements:
  - kind: "tests"
    description: "AC10: the scheduled window is requested over the bus and completed by the orchestrator, and the request handler is pure."
    command: "uv run pytest tests/nodes/node_merge_sweep_orchestrator/test_bus_cycle_merge_sweep_orchestrator.py -q -p no:randomly -k 'scheduled_ticks_request_and_complete or scheduled_request_uses_only_supplied_template'"
  - kind: "tests"
    description: "Focused tests of the merge-sweep plan node."
    command: "uv run pytest tests/nodes/node_merge_sweep_plan_compute tests/nodes/node_merge_sweep_reading_compute tests/nodes/node_merge_sweep_effect tests/test_merge_sweep_plan_registration.py tests/test_merge_sweep_nodes_registration.py -q"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn20676-ac1-plan-parity"
    description: "AC1 lane plan parity tests."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_merge_sweep_plan_compute/test_merge_sweep_parity.py -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC1"]
  - id: "dod-omn20676-ac2-workflow-parity"
    description: "AC2 dispatch cap and retry parity tests."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_merge_sweep_plan_compute/test_merge_sweep_parity.py tests/nodes/node_merge_sweep_plan_compute/test_error_chain_merge_sweep_plan_compute.py -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC2"]
  - id: "dod-omn20676-ac3-registration"
    description: "AC3 entry point, metadata and contract topic tests."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/test_merge_sweep_plan_registration.py tests/nodes/node_merge_sweep_plan_compute/test_golden_chain_merge_sweep_plan_compute.py -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC3"]
  - id: "dod-omn20676-ac4-reading-parity"
    description: "AC4 reading and claim-check parity tests."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_merge_sweep_reading_compute/test_merge_sweep_reading_parity.py -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC4"]
  - id: "dod-omn20676-ac5-dispatch-parity"
    description: "AC5 brief and dispatch parity tests."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_merge_sweep_effect/test_merge_sweep_dispatch_parity.py -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC5"]
  - id: "dod-omn20676-ac6-shard2-registration"
    description: "AC6 entry point, metadata, contract topic and refusal tests."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/test_merge_sweep_nodes_registration.py tests/nodes/node_merge_sweep_reading_compute/test_golden_chain_merge_sweep_reading_compute.py tests/nodes/node_merge_sweep_effect -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC6"]
  - id: "dod-omn20676-ac7-orchestrator-parity"
    description: "AC7 whole-sweep parity tests."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_merge_sweep_orchestrator/test_merge_sweep_orchestrator_parity.py -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC7"]
  - id: "dod-omn20676-ac8-orchestrator-registration"
    description: "AC8 contract, wiring plan, entry point, metadata and refusal tests."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_merge_sweep_orchestrator/test_golden_chain_merge_sweep_orchestrator.py tests/nodes/node_merge_sweep_orchestrator/test_error_chain_merge_sweep_orchestrator.py -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC8"]
  - id: "dod-omn20676-ac9-bus-entry"
    description: "AC9 sweep requested over the bus through the local runtime."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_merge_sweep_orchestrator/test_bus_cycle_merge_sweep_orchestrator.py tests/nodes/node_merge_sweep_orchestrator/test_golden_chain_merge_sweep_orchestrator.py -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC9"]
  - id: "dod-omn20676-deploy-probe"
    description: "Deploy probe. The merge-sweep orchestrator contract the runtime loads at the checked-out commit carries the event_bus block this change adds; the probe reads it from GitHub at that commit and exits nonzero on a tree without it, so it fails at the merge base."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: "gh api \"repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_merge_sweep_orchestrator/contract.yaml?ref=$(git rev-parse HEAD)\" --jq .content | base64 -d | grep -c '^event_bus:'"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn20676-ac10-scheduled-bus-cycle"
    description: "AC10: two scheduled windows are requested on the orchestrator's command topic and completed by the real sweep handler, and a window with no watcher state completes ok false with no lane started. The request node's contract and handler do not exist at the merge base, so this fails there."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_merge_sweep_orchestrator/test_bus_cycle_merge_sweep_orchestrator.py -q -p no:randomly -k scheduled_ticks_request_and_complete"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC10"]
  - id: "dod-omn20676-ac10-scheduled-request-handler"
    description: "AC10: the request handler returns nothing for a fire of another workflow, returns the same request for the same fire, and reads no deployment configuration while handling. The handler module does not exist at the merge base, so this fails there."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_merge_sweep_orchestrator/test_bus_cycle_merge_sweep_orchestrator.py -q -p no:randomly -k scheduled_request_uses_only_supplied_template"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC10"]
  - id: "dod-omn20676-ac10-deploy-probe"
    description: "Deploy probe. The scheduled request handler at the checked-out commit carries the class this change adds; the probe reads the file from GitHub at that commit, strips the line breaks of the contents API's base64 and tests the symbol inside jq so the pipe is read to its end, and exits nonzero on a tree without it, so it fails at the merge base."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: "gh api \"repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_merge_sweep_request_compute/handlers/handler_merge_sweep_scheduled_request.py?ref=$(git rev-parse HEAD)\" --jq '.content | split(\"\\n\") | join(\"\") | @base64d | contains(\"class HandlerMergeSweepScheduledRequest\")' | grep -qx true"
        cwd: "${OMNI_HOME}/omnimarket"
