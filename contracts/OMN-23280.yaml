schema_version: 1.0.0
ticket_id: OMN-23280
title: Give the silent-failure alarm unit a dispatch_command so an exit-1 streak sends a fix lane
summary: >-
  The silent-failure alarm unit's installer declaration did not set dispatch_command, so an exit-1 streak (the lab
  broker-lag alarm unit, five exits of 1 in a row on 2026-11-09) opened an episode and sent no fix lane. The unit
  declaration now renders dispatch_command from a new installer input remote_lane_runner, config_file.optional_keys names
  the key so a reinstall with no runner path still succeeds, and the alarm no longer reports a lane dispatched when the
  command names an absolute path that is absent. No bound, alarm or threshold is changed.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23280-dispatch-command
  statement: The silent-failure alarm unit declares a dispatch_command and an exit-1 streak sends one fix lane request.
  acceptance:
  - id: AC1
    statement: 'AC1: the alarm unit''s contract declares a dispatch_command and an exit-1 streak at the bound sends exactly one fix lane request -- falsifier: uv run pytest tests -q -k dispatch_command in omnimarket, failing with the declaration removed'
  - id: AC2
    statement: 'AC2: omnimarket#5554 carries this ticket and merges -- falsifier: onex scm pr-view OmniNode-ai/omnimarket#5554 shows MERGED and uv run pytest tests -q -k silent_failure passes on main'
evidence_requirements:
- kind: tests
  description: The dispatch_command tests of the installer unit and the alarm handler.
  command: uv run --frozen pytest tests/nodes/node_host_installer_registry_units/test_alarm_dispatch_command.py -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23280-ac1-dispatch
  description: >-
    The installer renders dispatch_command from remote_lane_runner, the alarm built from that document runs an exit-1 job
    through one tick and starts the runner exactly once, and a run with no dispatch_command starts it zero times. The named
    break is the base source, which has no remote_lane_runner input, so the rendering test fails there.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_host_installer_registry_units/test_alarm_dispatch_command.py -q --no-cov -k dispatch_command
    cwd: .
- id: dod-omn23280-ac2-silent-failure
  description: The silent-failure alarm effect and compute tests pass with the change.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_silent_failure_alarm_effect tests/nodes/node_silent_failure_alarm_compute -q --no-cov
    cwd: .
- id: dod-omn23280-integration-proof
  description: The dispatch_command tests run on a lab host at the pushed head through the lab-work node.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23280 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_host_installer_registry_units/test_alarm_dispatch_command.py -q --no-cov
    cwd: .
