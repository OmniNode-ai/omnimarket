schema_version: 1.0.0
ticket_id: OMN-23537
title: A new test file that the durations record misses is caught when the change merges, not hours later
summary: 'A change that adds a test file records it as one small entry file under config/test_file_durations.d/ (written by the check''s --sidecar --record command), which the shard planner and every unrecorded-count read merge with the shared list, so two changes never edit the same path. The per-change check (the lint job step and the pre-commit hook) still refuses a test file with no entry and now accepts either form. A new push-to-dev workflow runs the node''s freshness operation over the commits of each push and names the first commit that takes the unrecorded count to the limit of 50. Not in this change: a scheduled refresh of the shared list (the entry files stay valid measurements until one folds them in), and the running dev branch run, which can only happen after this change merges.'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23537-catch-at-merge
  statement: A new test file with no durations entry is named in its own change's checks, and the merge that takes the unrecorded count to the limit is the one that goes red.
  acceptance:
  - id: AC1
    statement: 'AC1: a change that adds a test file absent from config/test_file_durations.json is reported in that change''s own checks with the file named -- falsifier: a branch that adds one new test file and no record entry fails the check, and the same branch with the entry passes'
  - id: AC2
    statement: 'AC2: the freshness test runs on the dev branch after every merge, so the first merge that makes the unrecorded count reach 50 is the one that fails -- falsifier: a pytest that feeds the check a history where one merge takes the count from 49 to 50 and expects that merge named'
  - id: AC3
    statement: 'AC3: the design does not require every change to edit the shared list: two branches that each add a test file both pass the per-change check and merge without a conflict in the list -- falsifier: the golden chain test merges both and fails if the list conflicts'
  - id: AC4
    statement: 'AC4: integrated: on the running dev branch a planted unrecorded test file on a lab branch turns the post-merge run red with the file named, and removing it turns it green -- falsifier: the lab run of the planted branch reads green'
evidence_requirements:
- kind: tests
  description: The node tests, the freshness test and the shard planner tests pass at the pushed head.
  command: uv run --frozen pytest tests/nodes/node_test_duration_record_check_effect tests/unit/test_ci_shard_plan_record_freshness_omn17427.py tests/unit/test_ci_shard_plan_omn19684.py -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23537-ac1-ac3
  description: 'AC1 and AC3: a branch that adds a test file with no entry is refused with the file named and passes with its entry; two branches that each add a test file and an entry file pass and merge without a conflict, while the control of two branches that each edit the shared list conflicts.'
  source: manual
  binds_ac:
  - AC1
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_test_duration_record_check_effect/test_freshness_and_sidecar.py -q --no-cov -n 0 -p no:randomly -k "ac1 or ac3"
    cwd: .
- id: dod-omn23537-ac2
  description: 'AC2: a history where one merge takes the count from 49 to 50 names that merge; a push that stays at 49 is green; the workflow runs on every push to dev with the push before and head.'
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_test_duration_record_check_effect/test_freshness_and_sidecar.py tests/nodes/node_test_duration_record_check_effect/test_freshness_workflow.py -q --no-cov -n 0 -p no:randomly -k "ac2 or workflow"
    cwd: .
- id: dod-omn23537-ac4
  description: 'hosted proxy for AC4: the command run on a real git branch names a planted commit and clears when the file is removed; the lab run of the planted branch is named in the pull request, and the run on the running dev branch needs this change merged first.'
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_test_duration_record_check_effect/test_freshness_and_sidecar.py -q --no-cov -n 0 -p no:randomly -k ac4
    cwd: .
- id: dod-omn23537-ac4-integration-proof-lab
  description: Runs the node's tests at the pushed head on a lab host through the lab work runner, among them the planted-commit run of the freshness command on a real git branch (red with the file named, green once it is removed). Hosted CI cannot reach the lab runner, so only the local Done gate runs this unbound item; the run on the running dev branch is read after the merge, from the first push to dev.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: 'env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23537 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_test_duration_record_check_effect -q --no-cov -n 0 -p no:randomly'
    cwd: .
