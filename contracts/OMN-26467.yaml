schema_version: 1.0.0
ticket_id: OMN-26467
title: The dev provisioning node creates any named dev user and tenant and never resets an existing user by accident
summary: "The command of node_dev_identity_provision_effect takes username, email and password_key_id as optional input (each defaulting to the overlay user's), reset_existing (default False) and allow_protected (default False); the overlay model gains the required protected_usernames list; an existing user is refused unless reset_existing and a protected username is refused unless allow_protected, both before any write."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn26467-dev-identity-input
  statement: The dev identity node provisions any named dev user and tenant from command input and never resets an existing or protected user unless the command says so.
  acceptance:
  - id: AC1
    statement: 'AC1: the command model takes username, email, password_key_id and the tenant display name as optional input, each defaulting to the overlay value, with the dev_only lane and realm guard unchanged, and the CLI exposes them as flags -- falsifier: uv run pytest tests -q -k dev_identity_provision_new_user (a new username creates a new user and tenant)'
  - id: AC2
    statement: 'AC2: an existing user is never given a new password unless the command carries reset_existing=True (default False); creating an existing user without it is a typed refusal naming the user, with no HTTP write -- falsifier: uv run pytest tests -q -k dev_identity_provision_existing_refuses'
  - id: AC3
    statement: 'AC3: any username in the overlay''s protected_usernames list is refused by name without the explicit flag and with no HTTP write, and the R8 user is in that list in the overlays repo -- falsifier: uv run pytest tests -q -k dev_identity_provision_protected'
  - id: AC4
    statement: 'AC4: with no flags the node still provisions the overlay''s user as before for the R8 scenario -- falsifier: uv run pytest tests -q -k dev_identity_provision_default_overlay'
  - id: AC5
    statement: 'AC5: the overlay''s Keycloak and onex-api addresses are the omni-201 tailnet address (the onex-api port taken from the dev compose port map, or reported as a finding when none exists) -- falsifier: uv run pytest tests -q -k dev_identity_provision_overlay_addresses, which refuses a 192.168 address in the overlay'
  - id: AC6
    statement: 'AC6: the node unit tests and mypy --strict pass on the lab for both pull requests (omnimarket against dev, overlays) -- falsifier: uv run pytest tests -q and uv run mypy src --strict exit 0 on the lab host'
evidence_requirements:
- kind: tests
  description: 'The node''s focused tests at the pushed head.'
  command: uv run --frozen pytest tests/nodes/node_dev_identity_provision_effect -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn26467-ac1-new-user
  description: 'A new username with its own email and password key id creates a new user and a new tenant through the fakes; the result names the user and tenant and no password. The tenant display name is not carried: onex-api''s provision endpoint takes no request body.'
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_dev_identity_provision_effect -k dev_identity_provision_new_user -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn26467-ac2-existing-refuses
  description: 'An existing user without reset_existing is refused as user_exists_refused naming the user with zero writes; reset_existing is the only path that sends the reset-password PUT.'
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_dev_identity_provision_effect -k dev_identity_provision_existing_refuses -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn26467-ac3-protected
  description: 'A protected username is refused as user_protected naming the user with no request sent, no secret read and no key generated; allow_protected is the explicit override. The overlays change that lists the R8 user is a separate pull request.'
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_dev_identity_provision_effect -k dev_identity_provision_protected -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn26467-ac4-default-overlay
  description: 'With no flags and an overlay whose user is not protected, the call order and bodies of the existing golden chain are unchanged.'
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_dev_identity_provision_effect -k dev_identity_provision_default_overlay -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn26467-ac5-overlay-addresses
  description: 'The example overlay holds no 192.168 address and the check refuses one. The overlay data itself is in the overlays pull request.'
  source: manual
  binds_ac:
  - AC5
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_dev_identity_provision_effect -k dev_identity_provision_overlay_addresses -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn26467-integration-proof
  description: 'The pushed head ran the node''s tests on a lab host through the lab work runner and exited 0. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check. The node itself is never run against a live Keycloak or onex-api.'
  source: manual
  execution_scope: local_done_gate
  binds_ac:
  - AC6
  checks:
  - check_type: command
    check_value: 'env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-26467 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_dev_identity_provision_effect -q --no-cov'
    cwd: .
