schema_version: 1.0.0
ticket_id: OMN-25052
title: Run the second local benchmark arm on the dev runtime's tick
summary: Adds a scheduled effect node that, on the runtime tick and from overlay values, sends one delegate run pinned on the second local arm's backend id and returns a typed run event naming the backend that answered, so the arm of omnimarket#5798 has a consumer on the dev runtime instead of a hand-run script. No bound, check or setting is changed.
is_seam_ticket: true
interface_change: true
interfaces_touched:
- topics
requirements:
- id: req-omn25052-second-arm-tick
  statement: The second benchmark arm runs on the runtime tick from overlay values and reports a typed run event naming the backend that answered, or the single cause it failed.
  acceptance:
  - id: AC1
    statement: 'AC1: a STATUS row on the rolling ledger reads kv pr=omnimarket#5798 installed=<host>:<revision> observed=<what ran> read_at=<UTC>, written by the lane after it read one run on the dev runtime on h201 itself (a log line, a dispatch, a health read or a job record) -- falsifier: a search of the rolling ledger for pr=omnimarket#5798 with installed= finds no row'
  - id: AC2
    statement: 'AC2: the change of omnimarket#5798 handles one run on the dev runtime, or the STATUS row names the single measured cause that keeps it from running and who must act -- falsifier: the dev runtime log and job record on h201 show no run line and the STATUS row names no cause and no actor'
  - id: AC3
    statement: 'AC3: no host file, unit or plist was edited by hand: every change went through the declared installer, read from the installer own receipt -- falsifier: the STATUS row cites no installer receipt, or the installed unit differs from the revision the receipt names'
evidence_requirements:
- kind: tests
  description: The golden and error chain tests of the second arm scheduled node
  command: uv run --frozen pytest tests/nodes/node_delegation_second_arm_scheduled_effect -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn25052-ac1-hosted-proxy
  description: AC1 hosted proxy. The ledger row is a lab reading and cannot be read by the hosted runner; the node it names does not exist at the merge base, so this test file fails there. The lab reading is the local_done_gate item below.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_delegation_second_arm_scheduled_effect -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn25052-ac2-hosted-proxy
  description: AC2 hosted proxy. A due tick sends one pinned run and returns a completed event naming the answering backend, and a run another backend answered, a failed status, no receipt or a timeout is a failed event that names it.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_delegation_second_arm_scheduled_effect/test_golden_chain_second_arm_scheduled.py -q --no-cov -n 0 -p no:randomly -k "error or golden"
    cwd: .
- id: dod-omn25052-ac3-hosted-proxy
  description: AC3 hosted proxy. The node declares its tick subscription and its run event topic in its contract, so no host unit carries the schedule; the dev runtime reads the node through the declared installer.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_delegation_second_arm_scheduled_effect/test_contract_topics.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn25052-deploy-check
  description: 'Deploy probe the hosted runner can run: the second arm scheduled effect contract at the checked-out commit on GitHub names its handler class; the file does not exist at the merge base, so the probe fails there.'
  source: manual
  checks:
  - check_type: command
    check_value: 'bash -o pipefail -c ''gh api "repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_delegation_second_arm_scheduled_effect/contract.yaml?ref=$(git rev-parse HEAD)" --jq .content | base64 -d | grep -F "HandlerSecondArmScheduled" > /dev/null'''
    cwd: .
- id: dod-omn25052-integration-proof
  description: The pushed head is run on a lab host; the reading on the dev runtime on h201 is named in the pull request and in the STATUS row of the lane. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-25052 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_delegation_second_arm_scheduled_effect -q --no-cov -n 0 -p no:randomly
    cwd: .
