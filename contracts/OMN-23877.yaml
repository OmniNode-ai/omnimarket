    check_value: uv run --frozen pytest tests/nodes/node_floor_emissions_publish_effect/test_floor_emissions_publish_omn23877.py -q -n 0 -p no:randomly --no-cov -k "not redpanda"
    cwd: .
- id: dod-omn23877-ac6
  description: 'AC6 is the runtime reading on the lab: the projection node run from this branch, its snapshot read back on the dev broker, host and revision named in a ticket comment; hosted CI cannot reach the lab broker, so the hosted part is the in-memory chain test.'
  source: manual
  binds_ac:
  - AC6
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_floor_emissions_publish_effect/test_floor_emissions_publish_omn23877.py -q -n 0 -p no:randomly --no-cov -k "node_itself"
    cwd: .
- id: dod-omn23877-integration-proof-floor-emissions
  description: 'AC6 on the lab runtime: the projection node runs from the branch against the dev broker and publishes the floor_emissions projection; its result must read published with its event count. Hosted CI cannot reach the broker, so only the local Done gate runs this check, from a lab host whose login holds the permission rows of overlays/broker_acls_floor_emission_topics.'
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: ONEX_FLOOR_EMISSIONS_OVERLAY="${ONEX_FLOOR_EMISSIONS_OVERLAY:?set ONEX_FLOOR_EMISSIONS_OVERLAY to the overlay of the emissions publisher}" uv run --frozen python -m omnimarket.nodes.node_floor_emissions_publish_effect --home "${OMNI_HOME:?}" | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['published'] and d['projection_id']=='floor_emissions' and d['events']>=0, d"
    cwd: .
