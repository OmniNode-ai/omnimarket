ticket_id: OMN-24827
title: The outbox reuse pull request's own contract binds AC2 and AC4 to tests that fail before the change
summary: The repo-evidence dod-verify base control refused the outbox reuse pull request because the tests bound to its AC2 and AC4 also passed at the merge base, so they could not show the change. The still-sent criterion now includes a stored-refusal lookup test and the integrated criterion's hosted proxy includes a replay-adds-no-new-report test, and both fail against the merge-base outbox module, which has neither the lookup nor the reuse.
