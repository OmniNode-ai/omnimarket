  acceptance:
  - id: AC1
    statement: 'AC1: each bound selection of the outbox reuse contract exits non-zero against the merge-base outbox module and zero at the pushed head -- falsifier: uv run pytest tests/handlers/bus_binding/test_outbox_refused_receipt_reuse.py -q --no-cov -k "stored_refusal_lookup or no_new_report" exits zero with the merge-base outbox module loaded'
