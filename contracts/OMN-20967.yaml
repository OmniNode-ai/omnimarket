---
schema_version: "1.0.0"
ticket_id: "OMN-20967"
title: "A Claude API key carries its Anthropic workspace id: register-tenant-key --workspace-id stores it with the key and the review gateway sends it on every request made with that key"
summary: "Each company Claude API key belongs to one Anthropic workspace and is answered only when the request names it in the anthropic-workspace-id header. register-tenant-key gains --workspace-id (anthropic keys only, a closed header-safe charset). workspace_id rides the registration request, the response, the credential-registered event and the catalog row (migration 0008, nullable, COALESCE on re-delivery). The review gateway reads it from the catalog row and puts it in the delegation call's extra headers; the model-list reads at registration and at a model-not-found re-resolution carry it too."
is_seam_ticket: false
interface_change: true
interfaces_touched:
  - "events"
  - "public_api"
requirements:
  - id: "req-omn20967-registration"
    statement: |-
      A key registered with a workspace id records it on the response, the event and the catalog row, and the registration-time model read names it.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: register-tenant-key --workspace-id records workspace_id on the response, the credential-registered event and this machine's catalog row, sends it in the model-list read, and refuses it for a non-anthropic key or a value that cannot ride in a header, storing nothing -- falsifier: uv run pytest tests/unit/cli -k workspace_id
  - id: "req-omn20967-gateway"
    statement: |-
      The review gateway names the key's workspace in every Anthropic request it makes with that key.
    acceptance:
      - id: "AC2"
        statement: |-
          AC2: the review gateway's delegation call carries anthropic-workspace-id for a key with a workspace id and no such header for a key without one, and a model-list read during that call keeps the header -- falsifier: uv run pytest tests/unit/cli -k workspace
  - id: "req-omn20967-catalog"
    statement: |-
      The catalog projection writes the workspace id and a key without one projects as null.
    acceptance:
      - id: "AC3"
        statement: |-
          AC3: the catalog projection writes workspace_id with COALESCE, the SQLite store writes and keeps it, an unset key projects null, migration 0008 is one nullable column and the exposure lists it -- falsifier: uv run pytest tests/test_omn16316_tenant_credentials_projection.py -k workspace_id
evidence_requirements:
  - kind: "tests"
    description: "The workspace tests pass at the head and fail on the base, where register-tenant-key has no --workspace-id option and migration 0008 does not exist."
    command: "uv run pytest tests/unit/cli/test_omn20967_workspace_id_key_registration.py tests/test_omn16316_tenant_credentials_projection.py -k 'workspace' -q"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn20967-ac1-registration"
    description: "--workspace-id is printed, published on the event and stored in the catalog row; a non-anthropic key and a header-breaking value are refused with nothing stored or published."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/cli/test_omn20967_workspace_id_key_registration.py -k 'register_tenant_key or request or event or models_read or discovery' -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC1"]
  - id: "dod-omn20967-ac2-gateway"
    description: "The gateway key carries the catalogued workspace id, the delegation call names it in extra_headers, and the model-list re-resolution inside the call keeps it."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/cli/test_omn20967_workspace_id_key_registration.py -k 'gateway or delegation_call or model_list' -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC2"]
  - id: "dod-omn20967-ac3-catalog"
    description: "The Postgres projection writes workspace_id with COALESCE, the SQLite store writes and keeps it, an unset key projects null, migration 0008 is one nullable column, and the exposure lists it."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/test_omn16316_tenant_credentials_projection.py -k workspace_id -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC3"]
  - id: "dod-omn20967-deploy-probe-migration"
    description: "Deploy probe: the migration GitHub serves at the checked-out commit adds the workspace_id column; the file does not exist at the merge base, so the content read fails there."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/test_omn16316_tenant_credentials_projection.py -k workspace_id_migration -q"
        cwd: "${OMNI_HOME}/omnimarket"
      - check_type: "command"
        check_value: "gh api \"repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_projection_tenant_credentials/migrations/0008_tenant_credentials_workspace_id.sql?ref=$(git rev-parse HEAD)\" --jq '.content | gsub(\"\\n\";\"\") | @base64d | contains(\"ADD COLUMN IF NOT EXISTS workspace_id TEXT\")' | grep -qx true"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC3"]
