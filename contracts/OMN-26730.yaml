---
schema_version: "1.0.0"
ticket_id: OMN-26730
title: "A customer's own-key registration is read by routing, so the model the customer chose is the one that answers"
summary: The tenant credentials projection resolves a slug-carrying registration to the tenant UUID through tenant_registry_mirror and writes both tables under the UUID the router reads; a slug the registry does not know is refused and writes nothing.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn26730-slug-registration-read-by-router
    statement: A registration made by slug is stored under the tenant UUID and read by the router for that tenant; an unknown slug is refused with a typed reason and writes nothing.
    acceptance:
      - id: AC1
        statement: "AC1: a registration made by slug is written under the tenant's UUID and read by the router for that tenant -- falsifier: a unit test registering by slug finds the router still reading the older row"
      - id: AC2
        statement: "AC2: an unknown slug is refused with a typed reason and writes nothing -- falsifier: a unit test with an unknown slug finds a row written"
evidence_requirements:
  - kind: tests
    description: The slug-to-UUID registration tests, which fail on the base source (a registration by slug is never read by the resolver) and pass with the change.
    command: uv run pytest tests/test_omn26594_registration_slug_writes_tenant_uuid.py -q --no-cov
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-omn26730-registration-slug-to-uuid
    description: "A key registered under a tenant slug was stored in tenant_inference_credentials and delegation_routing_tenant_overlay under the slug while the router reads the overlay by tenant UUID, so the registration was never read. The credentials projection now resolves the slug through tenant_registry_mirror and writes under the UUID; a registration by slug is read by the resolver for that tenant, a second registration replaces the first, another tenant's rows are never read."
    source: manual
    binds_ac: [AC1]
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/test_omn26594_registration_slug_writes_tenant_uuid.py -q --no-cov
        cwd: .
  - id: dod-omn26730-unknown-slug-refused
    description: "A slug the registry does not know raises TenantRegistryResolutionError and writes nothing; the projection and slug-writer tests, including the unknown-slug test, pass."
    source: manual
    binds_ac: [AC2]
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/test_omn26594_registration_slug_writes_tenant_uuid.py tests/test_omn16316_tenant_credentials_projection.py tests/e2e/test_setup_tenant_endpoint_registration.py -k "unknown or Unknown or registered or deployed" -q --no-cov
        cwd: .
  - id: dod-omn26730-integration-proof
    description: "Run the slug-to-UUID registration tests and the credentials projection tests on a lab host at the pushed head; the local Done gate runs this unbound check."
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-26730 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/test_omn26594_registration_slug_writes_tenant_uuid.py tests/test_omn16316_tenant_credentials_projection.py -q --no-cov
        cwd: .
