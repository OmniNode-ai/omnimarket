schema_version: 1.0.0
ticket_id: OMN-24242
title: Lab host table names the real overlays path on h202 and a check compares hand-set local config
summary: 'A new pure compute node, node_host_local_config_drift_compute, compares one host''s declared local configuration (ssh aliases, git safe.directory entries, allowed repo-local git keys, env file directories with a backup bound)
  with a measured snapshot of names, and names each difference. Its declarations are an overlay of the overlays repository. The lab host table row of h202 is corrected in the overlays repository by a separate pull request.'
is_seam_ticket: true
interface_change: true
interfaces_touched:
- public_api
requirements:
- id: req-omn24242-local-config-drift
  statement: A host's hand-set local configuration is compared with its declaration and every difference is named.
  acceptance:
  - id: AC2
    statement: 'AC2: the host drift check reports an undeclared ssh alias, an undeclared git safe.directory entry and an undeclared env backup file on a host and passes once each is declared -- falsifier: pytest of the node''s golden
      and error chain tests fails when the check is removed'
evidence_requirements:
- kind: tests
  description: The node's reading, golden chain, error chain and overlay tests pass at the pushed head.
  command: uv run --frozen pytest tests/nodes/node_host_local_config_drift_compute -q -p no:randomly --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24242-ac2
  description: 'AC2: the readings fail for an undeclared ssh alias, the wildcard git safe.directory entry and backups over the declared bound, and pass once declared; the golden and error chain tests cover the events.'
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_host_local_config_drift_compute -q -p no:randomly --no-cov
    cwd: .
- id: dod-omn24242-entry-point
  description: 'AC2 follow-up: the node is registered under onex.nodes in pyproject.toml, so the market inventory test finds no node directory without an entry point.'
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/test_market_node_runtime_dogfood.py -q -p no:randomly --no-cov -k inventory
    cwd: .
- id: dod-omn24242-integration-proof
  description: the node's tests run on a lab host at the pushed head; hosted CI cannot reach the lab, so only the local Done gate runs this unbound check
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24242 --kind test -- env PYTHONDONTWRITEBYTECODE=1
      uv run --frozen pytest tests/nodes/node_host_local_config_drift_compute -q --no-cov -p no:randomly
