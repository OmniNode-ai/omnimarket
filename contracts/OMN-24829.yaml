schema_version: 1.0.0
ticket_id: OMN-24829
title: Omnimarket pull request 5737 no longer conflicts with its base and its required checks read green at its new head
summary: 'The branch of omnimarket pull request 5737 had fallen 389 commits behind dev and conflicted with it in pyproject.toml, uv.lock and 70 work-contract files. This change merges the current dev into the branch. Dev already locks omnibase-spi 0.23.15, so the conflicted spi tag, the lock and the work-contract uv.lock hashes take dev''s content and the pull request keeps only its floor raise, its floor test, its contract and its duration record. No check, ratchet or workflow file is touched. pypi-pin-resolvability is red at this head because this change raises the floor to 0.23.15 while the newest published omnibase-infra pins an older omnibase-spi; that red belongs to this pull request, is not recorded as shared, and the pull request holds until a published omnibase-infra admits omnibase-spi>=0.23.15. delegation-health-check is red on dev as well and is recorded as shared.'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn24829-pr5737-mergeable
    statement: The pull request branch contains the current dev and its diff against dev touches no check, ratchet or workflow file.
    acceptance:
      - id: AC1
        statement: 'AC1: omnimarket pull request 5737 no longer conflicts with its base and its required checks read green at the new head -- falsifier: the branch does not contain origin/dev, the floor test fails at the head, or pypi-pin-resolvability, which this change causes by raising the floor, reads not success at the head'
      - id: AC2
        statement: 'AC2: the fix is made on the pull request''s own branch with no check widened, skipped or bypassed, and a PR comment starting Lab: head=<full 40-character head sha> carries the lab proof for the new head -- falsifier: the diff against dev touches a file under .github, .onex_ratchets or scripts/ci, or the newest Lab comment names a sha that is not the full 40-character head'
      - id: AC3
        statement: 'AC3: when the cause is outside the pull request, the lane writes a STATUS row with shared=yes and patches nothing around it -- falsifier: none applies, the cause was inside the pull request (a stale branch) and AC1 holds'
evidence_requirements:
  - kind: tests
    description: The omnibase-spi floor tests pass at the merged head.
    command: uv run --frozen pytest tests/ci/test_omn23518_spi_lock_floor.py -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn24829-ac1-floor-test
    description: AC1. At the merged head the lock and floors agree and the lane process types import, and the branch contains origin/dev.
    source: manual
    binds_ac:
      - AC1
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/ci/test_omn23518_spi_lock_floor.py -q --no-cov -n 0 -p no:randomly
        cwd: .
      - check_type: command
        check_value: git merge-base --is-ancestor origin/dev HEAD
        cwd: .
  - id: dod-omn24829-ac2-no-check-touched
    description: AC2. The diff against dev changes no workflow, ratchet or CI script file, and the floor is raised in both places.
    source: manual
    binds_ac:
      - AC2
    checks:
      - check_type: command
        check_value: test -z "$(git diff --name-only origin/dev...HEAD -- .github .onex_ratchets scripts/ci)" && test "$(grep -c 'omnibase-spi>=0.23.15,<0.24.0' pyproject.toml)" = 2
        cwd: .
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/ci/test_omn23518_spi_lock_floor.py -q --no-cov -n 0 -p no:randomly -k lab_comment
        cwd: .
  - id: dod-omn24829-ac2-lab-comment-full-head
    description: AC2. The newest Lab comment of the pull request names the full 40-character head. The read needs the pull request's comments, which the hosted check cannot take, so it is scoped local_done_gate and carries no binds_ac; the comparison it runs is the one the lab_comment tests above exercise.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: gh pr view 5737 --repo OmniNode-ai/omnimarket --json comments | uv run --frozen python -c 'import json,subprocess,sys; sys.path.insert(0,"tests/ci"); import test_omn23518_spi_lock_floor as t; c=[x["body"] for x in json.load(sys.stdin)["comments"]]; h=subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip(); assert t.lab_comment_head_is_full(c,h), (h,[x[:60] for x in c if x.startswith("Lab:")])'
        cwd: .
  - id: dod-omn24829-ac1-published-infra-admits-floor
    description: AC1. The newest published omnibase-infra pins an omnibase-spi release inside the floor range 0.23.15 to below 0.24.0, which is what clears pypi-pin-resolvability. It is scoped local_done_gate because it reads the package index, so it cannot carry binds_ac; it fails until omnibase_infra publishes a release that admits the floor.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: curl -fsS https://pypi.org/pypi/omnibase-infra/json | uv run --frozen python -c 'import json,sys; sys.path.insert(0,"tests/ci"); import test_omn23518_spi_lock_floor as t; r=json.load(sys.stdin)["info"]["requires_dist"]; assert t.published_pin_admits_floor_range(r), r'
        cwd: .
  - id: dod-omn24829-ac3-status-row-read-exercised
    description: AC3. The ledger read of the cause outside this pull request is run, as the contract spells it, against an empty ledger, which it must refuse, and against ledgers whose rows name another pull request, another check or no shared=yes, which it must refuse, and against the matching row, which it must accept. The read itself is scoped local_done_gate and cannot be bound, so this bound check is the one that exercises it.
    source: manual
    binds_ac:
      - AC3
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/contracts/test_omn24829_contract_evidence.py -q --no-cov -n 0 -p no:randomly -k "ledger_status or ac3_bound"
        cwd: .
      - check_type: command
        check_value: test -z "$(git diff --name-only origin/dev...HEAD -- .github .onex_ratchets scripts/ci)"
        cwd: .
  - id: dod-omn24829-ac3-status-row-delegation-health
    description: AC3. One STATUS row for omnimarket#5737 carries shared=yes and check=delegation-health-check; the row is read through the ledger query node (`onex ledger query --stdin`).
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: |-
          now=$(date -u +%Y-%m-%dT%H:%M:%SZ); printf '{"query":"rows","since":"2026-11-01T00:00:00Z","until":"%s","kinds":["STATUS"],"pr":"omnimarket#5737","limit":20000}' "$now" | timeout 60 uv run onex ledger query --stdin | python3 -c 'import json,sys; a = json.load(sys.stdin); assert a["error"] is None, a["error"]; n = sum(1 for r in a["rows"] if "shared=yes" in r["text"] and "check=delegation-health-check" in r["text"]); assert n >= 1, n'
        cwd: .
