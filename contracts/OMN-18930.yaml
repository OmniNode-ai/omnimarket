---
schema_version: "1.0.0"
ticket_id: "OMN-18930"
title: "delegation_events validates the complete cohort key before recording it"
summary: "omnimarket validates a carried cohort key against the released omnibase_infra ModelDelegationCohortKey before the delegation projection records it. A key missing or malforming any nested identity, policy or retry field is recorded as a named refusal with no cohort key or digest, the delegation row itself is kept, and a valid key is stored as the original wire value with its original digest. Each acceptance criterion is bound to the pull request's own tests."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-complete-cohort-key"
    statement: |-
      delegation_events must record a cohort key only when every nested field of the released cohort key model is present and valid, and must record a named refusal otherwise.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: the projection fold refuses a cohort key with a missing or malformed nested identity, policy or retry field, naming the field path and error type with no cohort key or digest, and keeps a valid key as the original wire value and digest -- falsifier: uv run pytest tests/unit/delegation/test_delegation_cohort_key_projection_omn18930.py -q
      - id: "AC2"
        statement: |-
          AC2: against PostgreSQL 16, the sync writer persists the delegation row with the refusal and a null cohort key when the nested key is incomplete -- falsifier: uv run pytest tests/test_omn18930_cohort_key_projection_real_postgres.py -q -k "refuses_incomplete_nested_key"
evidence_requirements:
  - kind: "tests"
    description: "The cohort key fold unit tests."
    command: "uv run pytest tests/unit/delegation/test_delegation_cohort_key_projection_omn18930.py -q"
  - kind: "tests"
    description: "The real PostgreSQL cohort key projection test."
    command: "uv run pytest tests/test_omn18930_cohort_key_projection_real_postgres.py -q -k \"refuses_incomplete_nested_key\""
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-complete-cohort-key-ac1"
    description: "The projection fold refuses an incomplete or malformed nested cohort key by field path and keeps a valid key as its original wire value and digest."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/delegation/test_delegation_cohort_key_projection_omn18930.py -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC1"]
  - id: "dod-complete-cohort-key-ac2"
    description: "Against PostgreSQL 16 the sync writer keeps the delegation row and records the refusal with a null cohort key for an incomplete nested key."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/test_omn18930_cohort_key_projection_real_postgres.py -q -k \"refuses_incomplete_nested_key\""
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC2"]
  - id: "dod-omn18930-lab-first-step"
    description: "Lab-first step, run 2026-10-15 on the lab dev lane (bus kafka, lane dev, runtime-effects image built from omnibase_infra revision f32d46c8965d57f23d12127e41c86bddf8a1d9c7 at 2026-10-15T00:02:27Z, image digest sha256:90bbc284f4938a216f8137faba4c04354739040a43be709fd80a415dfe541838, build provenance sha256 1e17c6f6ddb9b6d68187dbdb90e356214f454cab33ec2af1c24b31159a767d2a). Complete cohort keys were assembled by scripts/assemble_delegation_cohort_key.py in omnibase_infra from each run's receipt and a readback taken from the consuming container (omnimarket node_delegation_orchestrator 0.5.0) right after the terminal, and checked by scripts/validate_delegation_cohort_keys.py. Two runs of one summarization request, both with the first hop pinned to backend local-heavy-reasoning (correlations 203d9af1-5bc8-4b59-a5d7-76f2c7887619 and c77b746b-2a2e-4555-baec-959cfe5dbbc1 share one key): key sha256 03165a6a2a64786b3db3af10fea6025387b2a04ade8e4fcffdac06c9532fb167, SAME_COHORT. The same request unpinned, sent twice, was placed on different first hops by spread routing (correlation a09df1e9-cb25-4874-8ec8-04d9982a80e6 on backend local-heavy-reasoning, correlation a15cc120-43cf-4800-acfe-091dfec3b84a on backend local-omnipc2-chat, which is served by the second lab host) and the comparison was refused: CROSS_COHORT first_hop_identity. A run pinned to backend local-coder (correlation affe8ff3-7312-4f0b-bad4-ac51af7ee6c0) differed from the first key in first_hop_identity only. A key with retry_bounds removed was refused at construction (Field required). The first key with a different routing_tiers_sha256 was refused: CROSS_COHORT provider_policy. The key from the recorded 2026-09-24 capture A differed from the first key in prompt_sha256, build_identity, consumer_identity, first_hop_identity and provider_policy: CROSS_COHORT. Not done: a second capture after a deliberate build or provider-policy change on the running lane, which needs a redeploy or a policy edit that