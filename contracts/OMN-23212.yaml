schema_version: "1.0.0"
ticket_id: "OMN-23212"
title: "onex dashboard serves the new OmniDash release: omnimarket's dashboard bundle pin moves to the new tag with its sha256"
summary: "Amendment 2 (2026-11-18): onex dashboard pins omnidash v1.1.14 with the sha256 of its published asset (f3718ee2...), verified through the bundle code and shipped in the package as two parts; the release (tag on omnidash#527's merge ac14f48d) carries the version bump #529 and #528, so a measured zero cost is written with its cents, and still the decisions walk past the newest 500 runs and v1.1.13's pages. AC2 is read after an omnimarket release candidate carries this pin."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-dashboard-bundle-pin-v1-1-14"
    statement: |-
      onex dashboard serves omnidash v1.1.14, pinned by the digest of its published asset.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: the pin's version and sha256 equal the new tag's asset computed from the downloaded bytes -- falsifier: the existing dashboard bundle pin test in omnimarket plus a lab `onex dashboard` start that serves the new version
evidence_requirements:
  - kind: "tests"
    description: "AC1: the pin is v1.1.14 with sha256 f3718ee2...; the pinned asset, verified through ensure_bundle, carries the next_cursor walk and v1.1.13's pages (Run steps is unavailable, per million tokens) and no longer drops the cents from a zero amount; the release's .sha256 sidecar names that digest and asset. At the v1.1.13 pin the pin, zero-cents and sidecar cases fail."
    command: 'uv run pytest tests/projection/test_dashboard_bundle_pin_omn23212.py -q -p no:randomly'
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn23212-ac1-bundle-pin-1-1-14"
    description: "AC1 (Amendment 2): onex dashboard pins omnidash v1.1.14 with the sha256 of its published asset, computed from the downloaded bytes; the pinned asset, verified through ensure_bundle (the path onex dashboard serves from), carries the next_cursor walk and v1.1.13's pages and writes a zero amount with its cents, and the release's .sha256 sidecar names the pinned digest and asset. At the v1.1.13 pin the pin, zero-cents and sidecar cases fail."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: 'uv run pytest tests/projection/test_dashboard_bundle_pin_omn23212.py -q -p no:randomly'
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC1"]
  - id: "dod-omn23212-integration-proof"
