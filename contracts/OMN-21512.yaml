- id: dod-omn21512-delegation-join
  description: 'Delegation join (DS-6 and DS-7). The code in this head was drafted by Codex thread 01a1852b-ca7d-7b70-82cd-7d0ee9912083 (receipt delegation-receipts/t-s8b-0035/2026-10-29T010342Z-codex-build.json) and the commit message by `onex delegate` text step run 7d6d2268-f032-4cd6-a38a-4093751a36a6 (GLM through Claude Code). Lane t-s8b-0035 reviewed every diff and ran the focused tests. The join reads those ids against the lane receipts and the delegation_events rows for ticket OMN-21512 and caller lane t-s8b-0035, and the head sha of the pushed branch against the lab receipt row named on the PR; it is a lab readback that the hosted runner cannot reach.'
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: |-
      set -eu;
      test -f "$OMNI_HOME/.claude_scratch/delegation-receipts/t-s8b-0035/2026-10-29T010342Z-codex-build.json";
      grep -q 01a1852b-ca7d-7b70-82cd-7d0ee9912083 "$OMNI_HOME/.claude_scratch/delegation-receipts/t-s8b-0035/2026-10-29T010342Z-codex-build.json"
    cwd: .
- id: dod-omn21512-deploy-packaged-decision
  description: Hosted deploy smoke dispatches the installed decision node through the ONEX CLI with an in-memory backend. Typed receipts must refuse an absent scope scope-unread before an observation, refuse an
    out-of-scope repository repo-out-of-landing-scope, and keep the no-observation wait for an in-scope repository. No broker, credentials or lab service is required; this checks the packaged checkout rather
    than a production rollout.
  source: manual
  checks:
  - check_type: command
    check_value: |
      set -eu;
      export PYTHONDONTWRITEBYTECODE=1;
      probe_dir="$(mktemp -d)";
      trap 'rm -rf "$probe_dir"' EXIT;
      uv sync --locked;
      runtime_bin="$(uv run --locked python -c 'import sys; from pathlib import Path; print(Path(sys.executable).parent)')";
      "$runtime_bin/python" -c '
      import json
      import sys
      from pathlib import Path
      root = Path(sys.argv[1])
      request = {"request": {"correlation_id": "6f0c3a52-8d2b-4a51-9a50-55a1d3f2b0c4", "repo": "scope-probe", "pr_number": 1, "expected_head_sha": "abcdef0", "lane": "deploy-probe", "requesting_host": "hosted-runner", "requested_at": "2026-10-28T00:00:00Z"}, "now": "2026-10-28T00:01:00Z"}
      for case, scope in (("refused", ["other-probe"]), ("in_scope", ["scope-probe"]), ("absent", None)):
          payload = dict(request)
          if scope is not None:
              payload["landing_scope"] = scope
          (root / f"{case}.json").write_text(json.dumps(payload))
      ' "$probe_dir";
      for case in refused in_scope absent; do
        env -u PYTHONPATH ONEX_LANE=omn21512-deploy-probe "$runtime_bin/onex" node node_pr_handoff_decision_compute --input "$probe_dir/$case.json" --state-root "$probe_dir/$case.state" --backend event_bus=inmemory --timeout 30 --output receipt --omnibase-path "$PWD" > "$probe_dir/$case.receipt.json";
      done;
      "$runtime_bin/python" -c '
      import json
      import sys
      from pathlib import Path
      from omnimarket.models.pr_handoff import ModelPrHandoffDecision
      root = Path(sys.argv[1])
      for case in ("refused", "in_scope", "absent"):
          receipt = json.loads((root / f"{case}.receipt.json").read_text())
          assert receipt["status"] == "success" and receipt["exit_code"] == 0, receipt
          decision = ModelPrHandoffDecision.model_validate(receipt["result"])
          if case == "refused":
              assert decision.verdict.value == "refuse", decision
              assert decision.error_code.value == "repo-out-of-landing-scope", decision
          elif case == "in_scope":
              assert decision.verdict.value == "wait", decision
              assert decision.wait_reason.value == "pr_not_observed", decision
          else:
              assert decision.verdict.value == "refuse", decision
              assert decision.error_code.value == "scope-unread", decision
              assert decision.rows is None and decision.refusal_row is None, decision
          print(json.dumps({"case": case, "run_id": receipt["run_id"], "verdict": decision.verdict.value}, sort_keys=True))
      print("packaged handoff decision: 3 receipts verified")
      ' "$probe_dir"
    cwd: ${OMNI_HOME}/omnimarket
