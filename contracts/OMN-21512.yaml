schema_version: 1.0.0
ticket_id: OMN-21512
title: 'T-S8b: handoff refusal on an absent scope, and its caller passes the scope'
summary: The handoff decision refuses a request whose landing scope is absent, unreadable or invalid with the new error code scope-unread, before any other rule. node_pr_handoff_orchestrator reads the landing_scope overlay
  when its handler is composed and passes it to every decision, so an out-of-scope handoff is refused through the orchestrator's real path. The factory line contract's sm_07 reads ModelPrHandoffDecisionRequest
  and its fixture copies are updated. Pure local invocation; the hosted deploy smoke exercises the packaged decision node without external services.
is_seam_ticket: false
interface_change: true
interfaces_touched:
- public_api
requirements:
- id: req-handoff-scope-fails-closed
  statement: The handoff refusal fails closed on a missing scope and its caller passes the scope.
  acceptance:
  - id: AC1
    statement: 'AC1: A request whose scope is absent, unreadable or invalid is refused `scope-unread` and never decided ready -- falsifier: three pytest cases'
  - id: AC2
    statement: 'AC2: `node_pr_handoff_orchestrator` loads `landing_scope` at composition and passes it, and an out-of-scope handoff is refused through the orchestrator''s real path -- falsifier: the pytest case
      through the orchestrator, and the same case with the scope load removed, which must refuse `scope-unread`'
  - id: AC3
    statement: 'AC3: The factory line contract''s `sm_07` changes from `gap: GAP-6` to `shape: ModelPrHandoffDecisionRequest` -- falsifier: T-S1''s fixture-copy test, updated in the same PR'
  - id: AC4
    statement: 'AC4: Configuration: the scope is the `landing_scope` overlay -- falsifier: the same request is refused under one fixture overlay and ready under another'
  - id: AC5
    statement: 'AC5: Bindings: the decision stays pure, and the orchestrator keeps its declared row -- falsifier: byte-identical decisions in process and through the local in-process entry of the parity harness
      (T-B2), and T-B1''s check over the orchestrator''s contract'
evidence_requirements:
- kind: tests
  description: T-S8b tests.
  command: env PYTHONDONTWRITEBYTECODE=1 uv run pytest tests/unit/nodes/node_pr_handoff_decision_compute tests/unit/nodes/node_pr_handoff_orchestrator tests/chains/pr_handoff tests/unit/work_ledger_bus/test_pr_handoff_cli.py tests/nodes/node_seam_read_orchestrator tests/nodes/node_binding_conformance_compute -q --no-cov --tb=line
emergency_bypass:
