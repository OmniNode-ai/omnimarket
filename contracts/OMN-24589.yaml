schema_version: 1.0.0
ticket_id: OMN-24589
title: The broker permission node reads its two non-login names from the declaration file
summary: The broker permission reconcile node (node_broker_acl_reconcile_effect) refuses to run on the lab hosts while any ${NAME} placeholder in a node contract's broker_acl_grants is unset. Nine of the eleven unset names are logins, filled by roles of the broker_acl_principals overlay (an overlay change in the overlays repository). Two are not logins held by a dev role (a consumer group package name, and a login of the stability broker). The principals overlay model gains placeholder_values for them, the node reads them with the roles' logins (placeholder_fills), and a name a role also holds, a lowercase name, an empty or blank value, a value holding an unexpanded ${NAME} or whitespace, and a blank login on a role that fills a placeholder are each refused by name. When an overlay is found it is the one source of the fills for both the driver path and the legacy command path; the environment fills no name, so a name the overlay lacks is refused as unset.
is_seam_ticket: true
interface_change: true
requirements:
- id: req-omn24589-placeholder-values
  statement: The reconcile node fills a contract placeholder from the principals overlay's placeholder_values when no role holds it and the environment does not set it, and refuses by name a malformed or doubly named value.
  acceptance:
  - id: AC1
    statement: "AC1: the permission node fills a contract placeholder from the declaration file's placeholder_values when no role holds it and no environment variable is set -- falsifier: pytest tests/nodes/node_broker_acl_reconcile_effect/test_role_placeholders.py -k placeholder_value_fills -q fails on the base branch"
  - id: AC2
    statement: "AC2: a placeholder_values name that a role also holds, a lowercase name, an empty or blank value, a value holding an unexpanded placeholder or whitespace, and a name with no value anywhere are each refused naming the name and the reason -- falsifier: pytest tests/nodes/node_broker_acl_reconcile_effect/test_role_placeholders.py -k \"refused\" -q"
  - id: AC3
    statement: "AC3: the dry run on a lab host from this branch with the declaration branch no longer stops at unset names and lists the rows for the capture silence watch login as to add -- falsifier: the dry run prints an unset: refusal or omits those rows"
  - id: AC4
    statement: "AC4: integrated: the next tick of the capture silence watch unit on the h201 lab host after the add side is applied exits 2 (an alarm delivered for a silent source, which is the unit working; it exited 3 before the apply) -- falsifier: the unit's error log shows a TopicAuthorizationFailedError line after the apply, or the tick exits 3"
  - id: AC5
    statement: "AC5: when the declaration file is found it is the one source of the ${NAME} fills in the driver path and the legacy command path, and a name it lacks is refused as unset even when the environment sets it -- falsifier: pytest tests/nodes/node_broker_acl_reconcile_effect/test_role_placeholders.py -k \"environment_does_not_fill or ignores_the_environment\" -q fails on the base branch"
evidence_requirements:
- kind: tests
  description: The placeholder role and value tests, including the failing controls, and the neighbouring broker permission node tests.
  command: env -u PYTHONPATH uv run --frozen pytest tests/nodes/node_broker_acl_reconcile_effect/test_role_placeholders.py -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24589-ac1-golden
  description: The golden test applies with an overlay whose placeholder_values holds the fleet package name and no environment variable, and the group rows carry the name.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_broker_acl_reconcile_effect/test_role_placeholders.py -q --no-cov -n 0 -p no:randomly -k placeholder_value_fills
    cwd: .
- id: dod-omn24589-ac2-error-chain
  description: A missing value is refused by name with exit code 2 and no broker change; a name a role also holds, a lowercase name and an empty value are refused by the overlay model, naming the name.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_broker_acl_reconcile_effect/test_role_placeholders.py -q --no-cov -n 0 -p no:randomly -k refused
    cwd: .
- id: dod-omn24589-ac3-hosted-half
  description: The hosted half of AC3. The node's placeholder tests pass, which is the same loading of the declaration file the lab dry run depends on.
  source: manual
  binds_ac:
  - AC3
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_broker_acl_reconcile_effect/test_role_placeholders.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24589-ac5-one-source
  description: With the declaration file found and the environment setting a name the file lacks, apply and the legacy command path are refused naming the name and change nothing on the broker; with no file found the environment still fills (the neighbouring node tests).
  source: manual
  binds_ac:
  - AC5
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_broker_acl_reconcile_effect -q --no-cov -n 0 -p no:randomly -k "environment_does_not_fill or ignores_the_environment or legacy_command_path"
    cwd: .
- id: dod-omn24589-seam-placeholder-list
  description: The seam test compares the contracts' broker placeholder names with what the node itself demands (demanded_placeholders), so no list is spelled in the test; its two failing controls show a new name seen by both and a name in a key the node does not read seen by the scan only.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_broker_acl_reconcile_effect/test_contract_placeholder_seam.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24589-ac4-integration-proof
  description: Hosted CI cannot reach the dev broker, so only the local Done gate runs this unbound check. The pushed head ran the placeholder and seam tests on a lab host through the lab work runner and exited 0. The running reading (dry run counts, the apply, the readback, the capture silence watch tick on h201) is read from the lab receipt in the pull request comment.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-omn24589 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_broker_acl_reconcile_effect/test_role_placeholders.py tests/nodes/node_broker_acl_reconcile_effect/test_contract_placeholder_seam.py -q --no-cov -n 0 -p no:randomly
