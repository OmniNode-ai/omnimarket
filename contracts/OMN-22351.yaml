schema_version: 1.0.0
ticket_id: OMN-22351
title: onex scm reads its broker from the node's contract overlay and refuses on a degraded binding instead of hosting the GitHub node on the host
summary: Without --bus-lane every host exited 69 "names no broker", and a host with no lane login degraded to the in-memory fallback, which hosted node_github_repo_write_effect inside the CLI and failed credential_unavailable. scm_cli now reads event_bus (type kafka with a lane, or inmemory) from the node's overlay under the workspace config root when no bus flag is given, and a degraded lane binding refuses with exit 69 naming the bus login the host lacks; no source-control node is hosted in process as a fallback, and the refusal is not retried.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn22351-overlay-broker
  statement: onex scm selects its bus from the node's contract overlay when no bus flag is given.
  acceptance:
  - id: AC1
    statement: 'AC1: with no --bus-lane, a Redpanda overlay (event_bus type kafka, lane dev) selects lane dev and an in-memory overlay hosts the node and answers a pr-create dry run with a real terminal -- falsifier: uv run pytest tests/unit/handlers/scm/test_scm_broker_overlay_omn22351.py -k overlay'
- id: req-omn22351-degraded-refusal
  statement: A degraded lane binding refuses the scm GitHub verbs instead of hosting the node on the host.
  acceptance:
  - id: AC2
    statement: 'AC2: a degraded lane binding refuses pr-create and gateway reads with exit 69 naming the missing bus login, hosts no node in process and is not retried -- falsifier: uv run pytest tests/unit/handlers/scm/test_scm_broker_overlay_omn22351.py -k degraded'
evidence_requirements:
- kind: tests
  description: The overlay selection, the in-memory dry run and the degraded refusals run against the real CLI with the binding selector replaced; no broker is dialed.
  command: uv run pytest tests/unit/handlers/scm/test_scm_broker_overlay_omn22351.py -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn22351-ac1
  description: AC1 the Redpanda overlay selects lane dev with no flag, an explicit --bus-lane wins, and the in-memory overlay answers a pr-create dry run from the canonical node. At the merge base the CLI names no broker, so these fail.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/handlers/scm/test_scm_broker_overlay_omn22351.py -q --no-cov --tb=line -k overlay
    cwd: .
- id: dod-omn22351-ac2
  description: AC2 a degraded binding refuses with exit 69 naming the missing bus login and never calls open_scm_inprocess; a degraded read is not retried. At the merge base the node is hosted in process, so these fail.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/handlers/scm/test_scm_broker_overlay_omn22351.py -q --no-cov --tb=line -k degraded
    cwd: .
- id: dod-omn22351-deploy-probe
  description: 'Deploy probe: the scm CLI GitHub serves at the checked-out commit carries the overlay selection, which the merge base does not.'
  source: manual
  checks:
  - check_type: command
    check_value: |-
      bash -o pipefail -c 'gh api "repos/OmniNode-ai/omnimarket/contents/src/omnimarket/handlers/scm/scm_cli.py?ref=$(git rev-parse HEAD)" --jq .content | base64 -d | grep -F "def _bus_selection" > /dev/null'
    cwd: .
- id: dod-omn22351-integration-proof
  description: The pushed head, run on a lab host with no bus flag, opens the scm write node's dry run through the dev runtime with the lane read from the node overlay. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: |-
      uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane scm-overlay-h106-1400 -- uv run --frozen pytest tests/unit/handlers/scm/test_scm_broker_overlay_omn22351.py -q --no-cov
    cwd: .
