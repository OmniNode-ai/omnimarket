schema_version: 1.0.0
ticket_id: OMN-23201
title: A red hourly seam reading is read again within minutes, so a dev runtime redeploy window does not hold floor piece 3 red for the hour
summary: >-
  Piece 3 (bus, runtime and seams) read NOT WORKING with source-fail:seams because the hourly seam deadline probe ran one to two minutes
  after the dev runtime was recreated by the deploy agent (14:33Z and 15:34Z on 2026-11-09), while the runtime was still attaching its
  contracts, so the work-ledger-query seam gave no result by its 30 s deadline. The newest row then stayed red for the rest of the hour
  after the seam answered again. The node now installs a second timer that runs `read --recheck`: it re-reads only while the last real run
  read red, at most six times at five-minute ticks, and writes the same row an hourly run writes. The seam deadline, the row freshness
  bound and the hourly cadence are unchanged; red rows are never removed.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23201-recheck
  statement: A red hourly seam reading is followed by re-reads until one reads WORKING or the contract's attempts are used up.
  acceptance:
  - id: AC1
    statement: 'AC1: the served floor reads piece 3 WORKING after the next publish once a recheck row reads WORKING -- falsifier: uv run pytest tests/nodes/node_seam_deadline_probe_effect/test_seam_deadline_recheck.py -q -k golden, failing when the hourly run records no state'
  - id: AC2
    statement: 'AC2: the recheck timer is installed by the node''s own schedule installer and skips while the last run read WORKING -- falsifier: systemctl --user list-timers on h053 lists onex-seam-deadline-recheck.timer and a recheck tick prints RECHECK skipped reason=skip-last-run-working'
evidence_requirements:
- kind: tests
  description: The recheck tests (golden incident replay, silent seam counts and stops, working or no run skips, drill neither records nor rechecks, corrupt state skips, unit render and rollback, deadline and bounds unchanged).
  command: uv run --frozen pytest tests/nodes/node_seam_deadline_probe_effect -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23201-ac1-recheck
  description: >-
    The test replays the incident through the node's CLI: the hourly run reads the seam silent and writes a NOT_WORKING row, the runtime
    comes up, and `read --recheck` writes a WORKING row after it with the red row still on the ledger. The named break is the hourly run
    recording no state: the recheck then skips and the newest row stays NOT_WORKING, so the test fails.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_seam_deadline_probe_effect/test_seam_deadline_recheck.py -q --no-cov -k golden
    cwd: .
- id: dod-omn23201-ac2-unit
  description: >-
    The tests install the node's schedule against the example overlay: the recheck service runs `read --recheck`, its timer ticks every
    five minutes, uninstall removes both timers, and the deadline, freshness bound and hourly cadence read the same values as before.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_seam_deadline_probe_effect/test_seam_deadline_recheck.py -q --no-cov -k "install or unit_does_not_change"
    cwd: .
- id: dod-omn23201-seam-recheck-integration-proof
  description: The pushed head ran the seam deadline node tests on a lab host through the lab work runner and exited 0. Hosted CI cannot reach the lab, so only the local Done gate runs this check; it is bound to no criterion, the hosted items above carry AC1 and AC2.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: 'env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23201 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_seam_deadline_probe_effect -q --no-cov'
    cwd: .
