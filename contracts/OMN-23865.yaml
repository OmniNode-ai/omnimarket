schema_version: 1.0.0
ticket_id: OMN-23865
title: Each lab host reports its disk use by kind on the bus, kept in one stored table the board reads
summary: node_lab_disk_watermark_effect measures the consumers of a host's disk by class (the lane package cache grouped by package and revision, docker images, build cache, volumes and exited containers, worktrees, lab-run folders) and publishes one host-disk-read event per run, or a typed host-disk-read-failed event; node_projection_host_disk keeps the newest reading per host and class. Every root, topic, tolerance and the interval is an overlay value; the reading file placement reads is unchanged.
is_seam_ticket: true
interface_change: true
interfaces_touched:
- topics
- public_api
requirements:
- id: req-omn23865-reading
  statement: A run publishes one typed host disk event with the volumes and the consumers by class, from overlay values only.
  acceptance:
  - id: AC1
    statement: 'AC1: the reading publishes one typed event per host run carrying free and total bytes per declared volume and the consumers by class: lane package cache entries grouped by package and revision with size and last-use age, docker images, build cache, volumes and exited containers, worktrees, and lab-run folders -- falsifier: uv run pytest tests/nodes/node_lab_disk_watermark_effect/test_host_disk_reading_classes.py -q fails on dev, where the reading has no class breakdown and no bus event'
  - id: AC2
    statement: 'AC2: every host, volume, class root and the reading schedule come from overlays/node_lab_disk_watermark_effect/overlay.yaml in the overlays repository, and a class root missing from the overlay is a typed unread class, never a default path -- falsifier: uv run pytest tests/nodes/node_lab_disk_watermark_effect/test_host_disk_reading_overlay_only.py -q'
- id: req-omn23865-projection
  statement: The projection keeps the newest reading per host and class.
  acceptance:
  - id: AC3
    statement: 'AC3: the projection keeps the newest reading per host and class with its read time, and the board''s disk card reads only that projection -- falsifier: uv run pytest tests/nodes/node_projection_host_disk/ -q plus a grep of the board''s disk card source for any host read other than the projection'
- id: req-omn23865-control
  statement: A reading that cannot be sound is a typed failure and the golden test reddens when the publish is dropped.
  acceptance:
  - id: AC4
    statement: 'AC4: failing control: a reading whose class sizes do not add up to the volume''s used bytes within the overlay tolerance, or whose publish fails, is a typed failure event, and an injected break that drops the publish turns the golden test red -- falsifier: uv run pytest tests/nodes/node_lab_disk_watermark_effect/test_host_disk_reading_control.py -q'
  - id: AC5
    statement: 'AC5: golden chain and error chain tests (requested, reading published, projection applied; and unreadable volume, publish refused) pass on the in-memory bus and on the real dev broker overlay -- falsifier: uv run pytest tests/chains/host_disk/test_chain_host_disk_reading.py -q with the in-memory and the dev broker overlays'
- id: req-omn23865-integrated
  statement: The reading runs on h202 and its projection row is read there.
  acceptance:
  - id: AC6
    statement: 'AC6: integrated: the reading is installed from the branch on h202 through the host installer with its rollback proven first, one scheduled run is observed publishing on the dev bus, and the projection row for h202 shows the lane package cache size and its revision count, receipt named in the lane''s TERMINAL -- falsifier: no projection row for h202 newer than the install time, or the installer log shows no rollback proof before the install'
evidence_requirements:
- kind: tests
  description: The reading's classes, overlay-only, control, the projection and the golden and error chains (AC1 to AC5, in-memory half).
  command: uv run pytest tests/nodes/node_lab_disk_watermark_effect tests/nodes/node_projection_host_disk tests/chains/host_disk -q -n 0 -p no:randomly --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
