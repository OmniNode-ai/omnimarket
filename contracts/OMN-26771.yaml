schema_version: "1.0.0"
ticket_id: "OMN-26771"
title: "dod_verify runs an onex lab-work bus-lane check with its workspace root set"
summary: >-
  Acceptance for OMN-26771 in omnimarket. The verifier's command-check environment for an
  onex lab-work item carries the workspace root (OMNIBASE_PATH, else OMNI_HOME) so the CLI can
  locate the lane declaration. AC1 is bound to tests/unit/lab_work/test_bus_lane_env.py; AC2 is a
  live reading (dod_verify OMN-26117 on h201) recorded on the pull request's Lab line.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-omn26771-workspace-root"
    statement: >-
      dod_verify hands an onex lab-work item the workspace root the CLI declares it reads.
    acceptance:
      - id: "AC1"
        statement: >-
          dod_verify passes the workspace root (OMNIBASE_PATH or the declared equivalent) into each
          check subprocess, so an onex lab-work run --bus-lane dev item runs -- falsifier: the
          verifier test whose check runs a bus-lane command with no OMNIBASE_PATH in the parent
          environment fails on today's verifier
evidence_requirements: []
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn26771-ac1-workspace-root"
    description: >-
      AC1: a lab-work check with no OMNIBASE_PATH in the parent environment reads the root from
      OMNI_HOME; a caller-set root is kept; other commands get none.
    source: "manual"
    binds_ac: ["AC1"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/lab_work/test_bus_lane_env.py -q -p no:randomly"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn26771-integration-proof"
    description: >-
      Run the workspace-root test file on a lab host at the pushed head through onex lab-work on the
      dev bus lane, the very command shape this change makes the verifier able to run. Hosted CI
      cannot reach the lab, so only the local Done gate runs this unbound check.
    source: "manual"
    execution_scope: "local_done_gate"
    checks:
      - check_type: "command"
        check_value: >-
          env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --bus-lane dev --repo OmniNode-ai/omnimarket
          --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-26771 --kind test -- env
          PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/lab_work/test_bus_lane_env.py -q --no-cov
        cwd: "${OMNI_HOME}/omnimarket"
