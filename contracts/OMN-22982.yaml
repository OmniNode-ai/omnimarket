schema_version: 1.0.0
ticket_id: OMN-22982
title: Piece 16's generated golden and error chain event tests exist and a named mutation turns each red
summary: Piece 16 (context, memory and evals) holds the pilot manifest check node and the J15 join of the eval corpus reader node. The chain test file generates its scenarios from the two contract.yaml files (the command and terminal topics, the floor's emission topics, the typed failure codes, the statuses), runs each over the in-memory bus and, with the flag set, over a real broker of the declared test lane on disposable topics tagged drill, and records eleven named mutations, each run against its unbroken control first.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn22982-piece16-chain
  statement: Piece 16 has a golden and an error chain event test generated from its contracts, and a named injected break turns each of the two red.
  acceptance:
  - id: AC1
    statement: 'AC1: golden and error chain event tests generated from piece 16 contracts run on the in-memory bus, and on the real broker when RUN_REDPANDA_PIECE16=1 -- falsifier: uv run --frozen pytest tests/chains/piece16/test_piece16_chain.py -q --no-cov'
  - id: AC2
    statement: 'AC2: a named mutation turns each of the two red, each recorded in NAMED_MUTATIONS -- falsifier: uv run --frozen pytest tests/chains/piece16/test_piece16_chain.py -q --no-cov -k mutation'
