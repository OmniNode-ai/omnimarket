    description: "Declared names, refusals, manifest-sourced registries and enum-sourced engine names all behave as stated."
    source: "manual"
    binds_ac: ["AC2"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/test_node_model_names_contract.py -q --no-cov"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn21805-check-clean"
