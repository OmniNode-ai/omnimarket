    source: "manual"
    binds_ac: ["AC1"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/test_node_model_names_contract.py -k slice_has_no_literal_model_name_findings -q --no-cov"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn21805-lab-proof"
    description: "The unit tests of the slice pass on a lab host at the PR head; the receipt path is in the PR body."
    source: "manual"
    binds_ac: ["AC3"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/test_node_model_names_contract.py -q --no-cov"
