schema_version: 1.0.0
ticket_id: OMN-22687
title: A pure node renders the hook parse probe, so an unmounted external volume is named and no longer read as a manifest fault
summary: node_hook_parse_probe_compute renders the probe script a lab host runs, with the host overlay's volumes root injected. A directory marketplace whose directory is missing reads volume-not-mounted-<root>/<name> when it resolves onto an unmounted volume and directory-source-missing-<path> otherwise; the host is still refused. The landing placement script calls the node and loses the script it carried.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn22687-hook-parse-probe-node
  statement: The hook parse probe script is rendered by a node with a contract, typed models, a golden chain test and an error chain test, and the tests fail when the missing-directory check is removed.
  acceptance:
  - id: AC1
    statement: 'AC1: the node golden and error chain tests pass -- falsifier: uv run --frozen pytest tests/nodes/node_hook_parse_probe_compute -q --no-cov'
  - id: AC2
    statement: 'AC2: with the missing-directory check removed from the rendered script the recorded layout reads the old manifest-fault reason, so the golden test reads the check -- falsifier: uv run --frozen pytest tests/nodes/node_hook_parse_probe_compute -q --no-cov -k failing_control'
evidence_requirements:
- kind: tests
  description: The hook parse probe node tests pass
  command: uv run --frozen pytest tests/nodes/node_hook_parse_probe_compute -q --no-cov
