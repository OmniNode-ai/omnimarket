schema_version: 1.0.0
ticket_id: OMN-22974
title: Piece 14's generated golden and error chain event tests exist and a named mutation turns each red
summary: Piece 14 (agent review) is the review dispatch node. The chain test file reads the dispatch contract.yaml (the command topic and the three terminal topics) and the node's own enums, generates one golden chain and four error chains from them (an unreachable first rung, no rung able to answer, a stale head, an exceeded deadline), runs each through the real dispatch handler over the in-memory bus and, with the flag set, over a real broker of the declared test lane on disposable topics tagged drill, and records eight named mutations, each run against its unbroken control first.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn22974-piece14-chain
  statement: Piece 14 has a golden and an error chain event test generated from its contract, and a named injected break turns each of the two red.
  acceptance:
  - id: AC1
    statement: 'AC1: golden and error chain event tests generated from piece 14 contracts run on the in-memory bus, and on the real broker when RUN_REDPANDA_PIECE14=1 -- falsifier: uv run --frozen pytest tests/chains/piece14/test_piece14_chain.py -q --no-cov'
  - id: AC2
    statement: 'AC2: a named mutation turns each of the two red, each recorded in NAMED_MUTATIONS -- falsifier: uv run --frozen pytest tests/chains/piece14/test_piece14_chain.py -q --no-cov -k mutation'
evidence_requirements:
