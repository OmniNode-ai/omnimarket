schema_version: 1.0.0
ticket_id: OMN-25506
title: The tenant outbox flush overlay document has a shared model ahead of its node
summary: The overlay document of node_tenant_outbox_flush_effect gets a typed model in omnimarket.models.overlay_documents, so an overlay can be pinned to a merged omnimarket commit that already holds it. The node itself is not part of this change.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn25506-outbox-flush-overlay-model
  statement: The tenant outbox flush node's overlay document has a typed model in omnimarket that its overlay document can be pinned to ahead of the node.
  acceptance:
  - id: AC5
    statement: 'AC5: ModelTenantOutboxFlushOverlay validates the overlay document of the tenant outbox flush node and refuses a malformed one -- falsifier: tests/unit/models/test_tenant_outbox_flush_overlay_document_omn25506.py fails collection or any of its tests fails'
evidence_requirements:
- kind: tests
  description: The cited tests pass at the PR head.
  command: uv run pytest tests/unit/models/test_tenant_outbox_flush_overlay_document_omn25506.py -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn25506-outbox-flush-overlay-model-tests
  description: The overlay document model for the tenant outbox flush node accepts a valid document and refuses malformed ones; the test file fails at collection with ModuleNotFoundError before the model module exists and passes after.
  source: manual
  binds_ac:
  - AC5
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/models/test_tenant_outbox_flush_overlay_document_omn25506.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn25506-integration-proof
  description: the overlay model tests run on a lab host at the pushed head; hosted CI cannot reach the lab, so only the local Done gate runs this unbound check
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-25506 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/models/test_tenant_outbox_flush_overlay_document_omn25506.py -q --no-cov -n 0 -p no:randomly
