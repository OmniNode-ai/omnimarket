schema_version: 1.0.0
ticket_id: OMN-23132
title: The omnimarket Coverage Sweep Gate red on the open pull requests is fixed by a pull request with a failing control
summary: The astral-sh/setup-uv release download answered HTTP 504 three times in the detect-changes, test and coverage-sweep-gate jobs on the census path, so the Coverage Sweep Gate refused or died on ARTIFACT_MISSING. Each of the three Install uv steps now hands a failure to a PyPI install of uv. The gate's refusal and aggregate steps are unchanged.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-uv-install-fallback
  statement: The census path survives a failed uv release download without weakening the gate.
  acceptance:
  - id: AC1
    statement: "AC1: the cause shared by the red Coverage Sweep Gate runs is fixed by one omnimarket pull request whose test fails on the base commit and passes on its head -- falsifier: uv run pytest on the new test file at the base commit, expecting failure, then at the head, expecting a pass"
  - id: AC2
    statement: "AC2: the Coverage Sweep Gate reads green on the exact head of that pull request -- falsifier: gh api repos/OmniNode-ai/omnimarket/commits/HEAD/check-runs read for the Coverage Sweep Gate conclusion success and uv run pytest on the new test file"
evidence_requirements:
- kind: tests
  description: Focused workflow-structure tests for the uv install fallback.
  command: uv run pytest tests/ci/test_coverage_sweep_gate_cause_uv_install_fallback.py -q --no-cov --tb=line
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23132-ac1
  description: AC1 falsifier test passes on the head; at the base commit the file is absent and the same command fails.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/ci/test_coverage_sweep_gate_cause_uv_install_fallback.py -q --no-cov --tb=line
    cwd: ${OMNI_HOME}/omnimarket
- id: dod-omn23132-ac2
  description: AC2 falsifier test passes; the Coverage Sweep Gate conclusion is read from the check run of the pushed head.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/ci/test_coverage_sweep_gate_cause_uv_install_fallback.py -q --no-cov --tb=line -k 'gate_still_refuses'
    cwd: ${OMNI_HOME}/omnimarket
- id: dod-omn23132-deploy
  description: 'Hosted deploy check: the new workflow-structure tests run on the hosted runner with no live dependency.'
  source: manual
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/ci/test_coverage_sweep_gate_cause_uv_install_fallback.py -q --no-cov --tb=line
    cwd: ${OMNI_HOME}/omnimarket
- id: dod-omn23132-deploy-probe
  description: 'Deploy probe: ci.yml read from GitHub at the checked-out commit names the PyPI fallback step. The merge base lacks it, so the probe fails there.'
  source: manual
  execution_scope: hosted_and_local
  checks:
  - check_type: command
    check_value: gh api "repos/OmniNode-ai/omnimarket/contents/.github/workflows/ci.yml?ref=$(git rev-parse HEAD)" --jq .content | base64 -d | grep -c 'Install uv from PyPI when the release download failed (OMN-23132)'
    cwd: ${OMNI_HOME}/omnimarket
