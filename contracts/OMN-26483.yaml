    command: "uv run pytest tests/nodes/node_failure_alarm_router_effect/test_controller_refusal.py -k controller_refusal_alarm -q --no-cov"
  - kind: "tests"
    description: "AC2: the focused tests named *controller_refusal_resolved*."
