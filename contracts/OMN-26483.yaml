---
schema_version: "1.0.0"
ticket_id: "OMN-26483"
title: "A landing controller that refuses three ticks in a row writes one alarm naming the refusal kind to the live orchestrator lane within 15 minutes"
summary: "A failure alarm router node reads failure classes from ledger rows and the controller tick lines, and delivers one alarm per cause to the live orchestrator inbox and the operator push channel, with a resolved row carrying the minutes."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-omn26483-ac1"
    statement: |-
      three consecutive refused ticks write exactly one alarm row and one MSG naming the refusal kind and the first refused tick, and a fourth refused tick writes none.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: three consecutive refused ticks write exactly one alarm row and one MSG naming the refusal kind and the first refused tick, and a fourth refused tick writes none -- falsifier: uv run pytest -k controller_refusal_alarm exits non-zero
  - id: "req-omn26483-ac2"
    statement: |-
      the first deciding tick after a refusal run writes one resolved row carrying the minutes the refusal lasted.
    acceptance:
      - id: "AC2"
        statement: |-
          AC2: the first deciding tick after a refusal run writes one resolved row carrying the minutes the refusal lasted -- falsifier: uv run pytest -k controller_refusal_resolved exits non-zero
  - id: "req-omn26483-ac3"
    statement: |-
      a regression test built from the recorded ticks.jsonl lines of the controller host for 2026-11-22T17:48Z to 18:51Z (fixture path in the PR) fails on the broken code and passes on the fix.
    acceptance:
      - id: "AC3"
        statement: |-
          AC3: a regression test built from the recorded ticks.jsonl lines of the controller host for 2026-11-22T17:48Z to 18:51Z (fixture path in the PR) fails on the broken code and passes on the fix -- falsifier: uv run pytest -k controller_refusal_incident_replay exits non-zero
  - id: "req-omn26483-ac4"
    statement: |-
      a drill on the controller host that points ONEX_LEDGER_ROWS_SOURCE at an empty file raises the alarm row within 15 minutes, read 2026-11-29.
    acceptance:
      - id: "AC4"
        statement: |-
          AC4: a drill on the controller host that points ONEX_LEDGER_ROWS_SOURCE at an empty file raises the alarm row within 15 minutes, read 2026-11-29 -- falsifier: the drill shows no alarm row in the ledger within 15 minutes of its first refused tick
