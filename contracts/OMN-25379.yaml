  Evidence only. The fifth review of the pull request that records the accepted
  AC2 binding of the OMN-21217 contract. The Tests (Split 2/20) run at
  63b11bfe0bb4 is recorded with its run and job id; the run receipts name one
  host and a test refuses any other host-shaped token in them; every -k
  selection of the contracts is tested for its run time against the local Done
  gate budget and the unsplit ac2 selection is split; the AC2 check of the
  OMN-21217 contract carries no pipefail prefix (the verifier's own runner supplies
  pipefail, and a prefix made the check indeterminate) and a local item reads the
  verifier tag and requires the recorded runner lines to equal it; the gate's
  control is read from the gate source at the pin; the reader stage of the live
  hash item runs against a stand-in handler; and the merged guard runs on real
  onex scm pr-view output. No product code changes.
