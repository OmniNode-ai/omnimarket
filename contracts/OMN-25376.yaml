    this contract.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_delegation_scenario_alarm_effect/test_contract_checks_omn25071.py -k "contract_checks_omn25071 and paths" -q --no-cov -n 0 -p no:randomly
    cwd: .
