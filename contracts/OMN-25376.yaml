schema_version: 1.0.0
ticket_id: OMN-25376
title: 'Review findings 1 to 7 on omnimarket PR 6353 at head 43bc9673d0c1 are fixed or argued: the alarm stamp comes from the record and bucket, the contract items name files that exist at the head, the
  Lab comment and a real pr-view fixture are at the new head'
summary: The alarm row stamp is a function of the record and the bucket, so a second tick is a duplicate; the OMN-25071 contract names only files that exist at the head and a test reads each named path;
  the tick leaves a failure last-run record on exit 2 and on an appender exception; the comment check shim is compared to a committed answer of the gateway's own reader.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn25376-ac1
  statement: A failed record with a future ran_at, a fresh record concluding stale and a fractional ran_at each give the same alarm bytes on a second tick, which ends as a duplicate with exit 0 through
    HandlerWorkLedgerAppendEffect.
  acceptance:
  - id: AC1
    statement: 'AC1: a failed record with a future ran_at, a fresh record concluding stale and a fractional ran_at each give the same alarm bytes on a second tick, which ends as a duplicate with exit 0
      through HandlerWorkLedgerAppendEffect -- falsifier: `uv run --frozen pytest tests/nodes -k "omn24874 and alarm and second_tick" -q` fails on the min(moment, now) stamp'
- id: req-omn25376-ac2
  statement: The OMN-25071 contract items AC3 to AC6 name only files that exist at the head, or they move to the contract of omnimarket 6335, and a test reads each named path.
  acceptance:
  - id: AC2
    statement: 'AC2: the OMN-25071 contract items AC3 to AC6 name only files that exist at the head, or they move to the contract of omnimarket 6335, and a test reads each named path -- falsifier: `uv run
      --frozen pytest tests/nodes -k "contract_checks_omn25071 and paths" -q` fails when a named path is absent at the head'
- id: req-omn25376-ac3
  statement: The Lab comment for the new head shows the output of the comment checks of the OMN-25071, OMN-25206 and OMN-25281 contracts at that head with the command and exit 0, and names the three tests
    part 2 skipped.
  acceptance:
  - id: AC3
    statement: 'AC3: the Lab comment for the new head shows the output of the comment checks of the OMN-25071, OMN-25206 and OMN-25281 contracts at that head with the command and exit 0, and names the three
      tests part 2 skipped -- falsifier: `uv run --frozen pytest tests/nodes -k "contract_checks_omn25071 and lab" -q` fails on a Lab comment that names no exit'
- id: req-omn25376-ac4
  statement: A real `onex scm pr-view --source bus` answer with comments is committed as a fixture and the shim is compared to it.
  acceptance:
  - id: AC4
    statement: 'AC4: a real `onex scm pr-view --source bus` answer with comments is committed as a fixture and the shim is compared to it -- falsifier: `uv run --frozen pytest tests/nodes -k "pr_comment_check
      and real_fixture" -q` fails with a hand-copied shape the real command never prints'
- id: req-omn25376-ac5
  statement: A tick_exit test asserts exit 0 on the rendered argv, the omn24874 token is in test or class names, the contract check fails on a missing falsifier path, and the discovery test calls the real
    effects wiring.
  acceptance:
  - id: AC5
    statement: 'AC5: a tick_exit test asserts exit 0 on the rendered argv, the omn24874 token is in test or class names, the contract check fails on a missing falsifier path, and the discovery test calls
      the real effects wiring -- falsifier: `uv run --frozen pytest tests/nodes -k "omn24874 and tick_exit" -q` collects no test or fails when the tick exits 1'
- id: req-omn25376-ac6
  statement: Non-blocking findings 6 and 7 are fixed with a test red then green each or argued with evidence in a PR comment.
  acceptance:
  - id: AC6
    statement: 'AC6: non-blocking findings 6 and 7 are fixed with a test red then green each or argued with evidence in a PR comment -- falsifier: `uv run --frozen pytest tests -k "omn24874 and alarm and
      last_run" -q` fails when exit 2 leaves no last-run record'
