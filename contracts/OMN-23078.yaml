schema_version: 1.0.0
ticket_id: OMN-23078
title: 'Validators run as one workflow: an orchestrator picks validators from contracts and a reducer holds verdicts and ratchet baselines'
summary: Two omnimarket nodes. node_validator_workflow_orchestrator picks the validators the overlay lists whose omnibase_core node contract marks them canonical (compute, pure, tagged validator_node) and whose validation contract target_patterns match a changed path, then runs the read effect, the validator compute nodes (Canonical File Shape first), node_validator_verdict_reducer, and the emit and gate effects. node_validator_verdict_reducer folds the findings into a verdict per pull request, holds ratchet baselines as one-way state (a reading against the declared direction is refused) and counts the canonical validators that have run. Both have contracts, overlays and injected dependencies, an in-memory default and a real backend (git reader, file trace spool, file gate, file state store).
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23078-validator-workflow
  statement: Validators run as one workflow, an orchestrator picking them from contracts and a reducer holding verdicts and ratchet baselines.
  acceptance:
  - id: AC1
    statement: 'AC1: the orchestrator runs a planted change through the read effect, the canonical validators chosen by contract, and the emit and gate effects, and the reducer''s verdict matches -- falsifier: uv run pytest of the orchestrator and reducer tests on both backends'
  - id: AC2
    statement: 'AC2: a ratchet baseline held in the reducer can only move in its allowed direction, and a planted growth is refused -- falsifier: uv run pytest of the reducer''s ratchet test'
