---
schema_version: "1.0.0"
ticket_id: "OMN-26422"
title: "The delegation acceptance judge publishes its terminal event on its own topic so the judged topic carries only judged events"
summary: "The judge contract declares its terminal event and publish topic as onex.evt.omnimarket.delegation-acceptance-judge-completed.v1, so the judged topic that node_projection_eval_results subscribes to carries only judged-acceptance events from the publish effect node. A contract test asserts that no node publishes its terminal event onto a topic it consumes."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-judge-terminal-event-off-the-judged-topic"
    statement: "The judge's render, check, score and events results no longer reach the judged topic the eval-results projection refuses them on. The criteria below are transcribed from the ticket body; each id is the label its binding item claims through binds_ac."
    acceptance:
      - id: "AC1"
        statement: "AC1: the judge contract's terminal_event is a topic other than onex.evt.omnimarket.delegation-acceptance-judged.v1 and other than every topic the judge subscribes to, and the judged topic stays declared only for the judged events the node emits -- falsifier: uv run pytest tests -q -k judge_terminal_topic fails at the merge base and passes on the PR branch"
      - id: "AC2"
        statement: "AC2: a contract test asserts that no node publishes its terminal event onto a topic it consumes and that the judge's result shape is never published on a topic the eval-results projection subscribes to -- falsifier: uv run pytest tests -q -k terminal_event_topic_not_consumed fails at the merge base and passes on the PR branch"
      - id: "AC3"
        statement: "AC3: the PR changes no prod manifest, no deploy setting and no health gate -- falsifier: git diff origin/main --stat on the PR branch lists only the judge contract, its handler and tests, run with uv run pytest tests -q -k judge_terminal_topic"
evidence_requirements:
  - kind: "tests"
    description: "AC1 and AC2 hosted probes. The judge_terminal_topic tests read the judge, publish-effect and projection contracts and the runtime route; the terminal_event_topic_not_consumed tests read every node contract. Each set fails at the merge base and passes at the head."
    command: "uv run pytest tests -q -k 'judge_terminal_topic or terminal_event_topic_not_consumed'"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn26422-ac1-judge-terminal-topic"
    description: "AC1 hosted probe. The judge terminal topic tests show the terminal event is onex.evt.omnimarket.delegation-acceptance-judge-completed.v1, none of the judge's subscribed topics, and not the judged topic, which only the publish effect node declares. They pass at the head and fail at the merge base, where the terminal event is the judged topic."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_delegation_acceptance_judge_compute/test_judge_terminal_topic.py -q -k judge_terminal_topic"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC1"]
  - id: "dod-omn26422-ac2-terminal-event-topic-not-consumed"
    description: "AC2 hosted probe. The contract test reads every node contract and refuses a node that publishes its terminal event onto a topic it consumes, with a frozen debt list that only shrinks, and refuses the judge's result topic appearing among the eval-results projection's subscriptions. The projection test passes at the head and fails at the merge base."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/gates/test_terminal_event_topic_not_consumed.py -q -k terminal_event_topic_not_consumed"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC2"]
  - id: "dod-omn26422-ac3-scope"
    description: "AC3 hosted probe. The change touches the judge contract, the tests that read it and this ticket contract. It changes no prod manifest, deploy setting or health gate, and the judge terminal topic tests pass at the head."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests -q -k judge_terminal_topic"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC3"]
  - id: "dod-omn26422-deploy-probe"
    description: "Deploy probe: the judge contract read from GitHub at the checked-out commit declares the judge-completed topic as its terminal event. A head still carrying the judged topic there fails the probe."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: "gh api \"repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_delegation_acceptance_judge_compute/contract.yaml?ref=$(git rev-parse HEAD)\" --jq .content | base64 -d | grep -cF 'terminal_event: onex.evt.omnimarket.delegation-acceptance-judge-completed.v1'"
  - id: "dod-omn26422-integration-proof"
    description: "The judge topic tests and the contract gate tests run on a lab host at the pushed head; hosted CI cannot reach the lab, so only the local Done gate runs this unbound check"
    source: "manual"
    execution_scope: local_done_gate
    checks:
      - check_type: "command"
        check_value: "env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha \"$(git rev-parse HEAD)\" --lane dod-integration-proof-26422 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_delegation_acceptance_judge_compute tests/gates tests/golden_chains/delegation_acceptance_judge -q"
        cwd: "."
