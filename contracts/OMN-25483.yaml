schema_version: 1.0.0
ticket_id: OMN-25483
title: The work ledger is graphed from its own typed columns and five typed queries answer ownership, review, red-check, ruling and seen-running questions without an agent reading rows
summary: A compute node derives a graph from work ledger rows by their own key=value cells with no model call, and a query effect answers five typed queries over it; an unreadable graph answers an error.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn25483-graph
  statement: The work ledger graph is derived from the rows' own cells and five typed queries answer over it.
  acceptance:
  - id: AC1
    statement: 'AC1: a compute node derives the graph from work_ledger_rows by the rows'' own columns with no model call, and two runs over the same rows give byte-identical output -- falsifier: uv run pytest tests/unit/nodes/node_work_ledger_graph_compute -q (determinism test and a no-model-import test, red on a planted model call)'
  - id: AC2
    statement: 'AC2: a query effect answers each of the five questions as one typed query with a golden case and an error case per query, and an unreadable graph answers an error, never an empty answer -- falsifier: uv run pytest tests/unit/nodes/node_work_ledger_graph_query_effect -q'
evidence_requirements:
- kind: tests
  description: The compute and query effect unit tests.
  command: uv run pytest tests/unit/nodes/node_work_ledger_graph_compute -q --no-cov -n 0 -p no:randomly && uv run pytest tests/unit/nodes/node_work_ledger_graph_query_effect -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn25483-ac1-compute
  description: Determinism, edges-from-cells and no-model-import tests (the last red on a planted model call).
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/nodes/node_work_ledger_graph_compute -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn25483-ac2-query
  description: A golden and an error case per query; an unreadable, corrupt, tampered or empty graph answers status=error.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/nodes/node_work_ledger_graph_query_effect -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn25483-integration-proof
  description: Hosted CI cannot reach a lab host, so only the local Done gate runs this unbound check. It runs the compute node and the five queries at the sha on a lab host through onex lab-work.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-25483 --kind test -- uv run pytest tests/test_golden_chain_node_work_ledger_graph_query_effect.py tests/unit/nodes/node_work_ledger_graph_compute tests/unit/nodes/node_work_ledger_graph_query_effect -q --no-cov -n 0 -p no:randomly
    cwd: .
