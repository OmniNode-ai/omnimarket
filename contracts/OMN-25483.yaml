schema_version: 1.0.0
ticket_id: OMN-25483
title: The work ledger is graphed from its own typed columns and five typed queries answer ownership, review, red-check, ruling and seen-running questions without an agent reading rows
summary: 'node_work_ledger_graph_compute derives the work ledger graph from rows of work_ledger_rows by the rows'' own key=value cells (no model call, byte-identical on a rerun); node_work_ledger_graph_query_effect reads a window of work_ledger_rows, derives the graph with the same shared pure derivation (omnimarket.handlers.work_ledger_graph_derive) and answers five typed queries, each with a golden and an error case. The dev reading, the spot checks, the cost measurements and the similarity measurement are read on the lab and posted as the pull request Lab line or a Lab comment.'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn25483-ac1
  statement: 'a compute node derives the graph from work_ledger_rows by the rows'' own columns with no model call, and two runs over the same rows give byte-identical output'
  acceptance:
  - id: AC1
    statement: 'AC1: a compute node derives the graph from work_ledger_rows by the rows'' own columns with no model call, and two runs over the same rows give byte-identical output -- falsifier: uv run pytest tests/unit/nodes/node_work_ledger_graph_compute -q (determinism test and a no-model-import test, red on a planted model call)'
- id: req-omn25483-ac2
  statement: 'a query effect answers each of the five questions as one typed query with a golden case and an error case per query, and an unreadable graph answers an error, never an empty answer'
  acceptance:
  - id: AC2
    statement: 'AC2: a query effect answers each of the five questions as one typed query with a golden case and an error case per query, and an unreadable graph answers an error, never an empty answer -- falsifier: uv run pytest tests/unit/nodes/node_work_ledger_graph_query_effect -q'
- id: req-omn25483-ac3
  statement: 'on the dev lane, each question''s answer matches the raw ledger for 5 spot-checked answers per question'
  acceptance:
  - id: AC3
    statement: 'AC3: on the dev lane, each question''s answer matches the raw ledger for 5 spot-checked answers per question -- falsifier: run the five queries on dev, grep the raw ledger for 5 answers of each, and find any answer that differs'
- id: req-omn25483-ac4
  statement: 'each query''s cost in seconds and tokens is measured on dev and set against today''s agent read of 3 to 8 million tokens a round'
  acceptance:
  - id: AC4
    statement: 'AC4: each query''s cost in seconds and tokens is measured on dev and set against today''s agent read of 3 to 8 million tokens a round -- falsifier: run each query on dev and find a query with no recorded measurement or one that takes over 30 seconds'
- id: req-omn25483-ac5
  statement: 'the change is installed from its branch on dev and one run of each query is read handled on the dev runtime on h201, recorded as installed=<host>:<revision> and observed=<what ran> in the PR''s Lab line'
  acceptance:
  - id: AC5
    statement: 'AC5: the change is installed from its branch on dev and one run of each query is read handled on the dev runtime on h201, recorded as installed=<host>:<revision> and observed=<what ran> in the PR''s Lab line -- falsifier: read the Lab line and the h201 run lines and find a query with no handled run'
- id: req-omn25483-ac6
  statement: 'two similarity queries (existing RULING rows that answer a new question; earlier rows with the same blocker and how they were resolved) are measured against today''s word-overlap matching with precision on 10 spot-checked cases each'
  acceptance:
  - id: AC6
    statement: 'AC6: two similarity queries (existing RULING rows that answer a new question; earlier rows with the same blocker and how they were resolved) are measured against today''s word-overlap matching with precision on 10 spot-checked cases each -- falsifier: run both queries on dev and the word-overlap baseline over the same 10 cases each and find a case with no recorded result'
evidence_requirements:
- kind: tests
  description: The two nodes' tests pass at the pushed head.
  command: uv run --frozen pytest tests/unit/nodes/node_work_ledger_graph_compute tests/unit/nodes/node_work_ledger_graph_query_effect -q -p no:cacheprovider --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn25483-ac1
  description: 'The compute tests pass: two runs and shuffled or reversed row order give byte-identical canonical output and digest, edges come from cells and never from free text, the derivation modules import no model or network client, and the import check goes red on five planted model calls.'
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/nodes/node_work_ledger_graph_compute -q -p no:cacheprovider --no-cov
    cwd: .
- id: dod-omn25483-ac2
  description: 'The query effect tests pass: a golden case for each of the five queries, and for each query an error answer when the rows cannot be read, when the window is empty and when the graph digest does not match its content.'
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/nodes/node_work_ledger_graph_query_effect -q -p no:cacheprovider --no-cov
    cwd: .
- id: dod-omn25483-ac3
  description: 'The spot checks need the dev database on the lab; hosted CI cannot reach it. They are read on the lab against the raw markdown ledger and posted in the pull request Lab comment and the lane report. Hosted proxy: the query effect tests.'
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/nodes/node_work_ledger_graph_query_effect -q -p no:cacheprovider --no-cov
    cwd: .
- id: dod-omn25483-ac4
  description: 'Seconds per query are read on the lab against the dev database (each answer carries elapsed_seconds) and tokens are zero model tokens by construction; posted in the Lab comment. Hosted proxy: the query effect tests.'
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/nodes/node_work_ledger_graph_query_effect -q -p no:cacheprovider --no-cov
    cwd: .
- id: dod-omn25483-ac5
  description: 'The handled runs on h201 need the lab; hosted CI cannot reach it. They are recorded as installed= and observed= in the Lab line or a Lab comment naming the head. Hosted proxy: both nodes'' tests.'
  source: manual
  binds_ac:
  - AC5
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/nodes/node_work_ledger_graph_compute tests/unit/nodes/node_work_ledger_graph_query_effect -q -p no:cacheprovider --no-cov
    cwd: .
- id: dod-omn25483-ac6
  description: 'The similarity measurement needs the lab embedding endpoint; hosted CI cannot reach it. It is read on the lab and posted in the Lab comment; until then AC6 stays open. Hosted proxy: the compute tests.'
  source: manual
  binds_ac:
  - AC6
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/nodes/node_work_ledger_graph_compute -q -p no:cacheprovider --no-cov
    cwd: .
- id: dod-omn25483-integration-proof
  description: the five queries run on the lab against the dev work_ledger_rows at the pushed head; hosted CI cannot reach the lab database, so only the local Done gate runs this unbound check. The handled runs on h201 are the pull request's Lab line or Lab comment.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-25483 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/nodes/node_work_ledger_graph_query_effect tests/test_golden_chain_work_ledger_graph_query_effect.py -q --no-cov
