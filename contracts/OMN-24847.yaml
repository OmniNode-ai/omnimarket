schema_version: 1.0.0
ticket_id: OMN-24847
title: 'Agents reach the code graph: one lookup command returns importers'
summary: node_code_graph_effect bound a code_graph_lookup operation but its command line had no verb that asks it, so an agent could not ask the graph for the importers of a file and fell back to grep. The node's CLI gains a lookup verb that answers the five lookup questions through the same answer_lookup the bound handler calls, one MATCH row per answer and a LOOKUP summary line.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24847-lookup-verb
  statement: One command an agent runs returns the importers of a file from the code graph.
  acceptance:
  - id: AC3
    statement: 'AC3: one lookup (the importers of a known symbol) returns rows from the Mac and from one lab host, red before the change and green after -- falsifier: the same command run on each host before the change returns an error or zero rows, and after it returns the same nonzero rows, each with its time'
evidence_requirements:
- kind: tests
  description: The lookup verb through the node's own CLI on real git clones.
  command: env -u PYTHONPATH uv run --frozen pytest tests/nodes/node_code_graph_effect/test_code_graph_lookup_cli.py -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24847-ac3-lookup-cli
  description: The lookup verb returns the importers of a file as MATCH rows and exits 0; with no lookup block in the overlay it exits 1 and names the cause.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_code_graph_effect/test_code_graph_lookup_cli.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24847-integration-proof
  description: Hosted CI holds no registry clones, so only the local Done gate runs this unbound check. On a lab host it asks the importers of the overlay reader through the declared overlay and fails on zero rows.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24847 --kind test -- sh -c 'ONEX_SKILL_OVERLAY_ROOTS="$OMNI_HOME/overlays/overlays:$OMNI_HOME/../overlays/overlays" ONEX_CODE_GRAPH_REPOS_ROOT="$OMNI_HOME" uv run --frozen python -m omnimarket.nodes.node_code_graph_effect lookup --question importers --repo omnimarket --path src/omnimarket/handlers/node_overlay_reader.py | grep -q "^MATCH "'
    cwd: .
