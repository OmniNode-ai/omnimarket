schema_version: 1.0.0
ticket_id: OMN-26435
title: The done-items projection writer has a standing alarm for stopped or refused events
summary: 'node_projection_freshness_alert_effect gains a contract-declared done_items_coverage check: done events in work_ledger_rows older than max_age_seconds and inside lookback_seconds, folded with the shared done_items_fold, that have no matching done_items row raise one Slack alarm through the existing slack-publish command; no done events is IDLE and quiet; an unreadable source is UNKNOWN, logged at ERROR, never an alert; refused ledger rows never hide an alarm. The AC3 lab drill runs after a release carrying this change reaches the lab.'
is_seam_ticket: false
interface_change: true
interfaces_touched:
  - public_api
requirements:
  - id: req-omn26435-alarm
    statement: A scheduled check raises an alarm when the work ledger holds a done event older than a set threshold with no matching done_items row.
    acceptance:
      - id: AC1
        statement: 'AC1: a scheduled check raises an alarm when the work ledger holds a done event older than a set threshold with no matching done_items row -- falsifier: uv run --frozen pytest tests/test_omn26435_done_items_coverage_alarm.py tests/test_omn26435_done_items_coverage_reader.py -q -n 0 -p no:randomly --no-cov -k "done_items_alarm_fires_on_unprojected_done_event or end_to_end_from_a_ledger_row or classifier_states or test_reader_"; with the handler''s STALE publish suppressed, or an unprojected ticket classed covered, or the reader''s supply comparison flipped, the AC1 test fails'
  - id: req-omn26435-quiet
    statement: The check stays quiet when the work ledger holds no new done events.
    acceptance:
      - id: AC2
        statement: 'AC2: the check stays quiet when the work ledger holds no new done events -- falsifier: uv run --frozen pytest tests/test_omn26435_done_items_coverage_alarm.py -q -n 0 -p no:randomly --no-cov -k "done_items_alarm_quiet_without_done_events or classifier_states"; with the alarm also published on IDLE, or no done events classed FRESH, the AC2 test fails'
  - id: req-omn26435-contract
    statement: This file is the definition of done for the ticket and names the runnable checks.
    acceptance:
      - id: AC7
        statement: 'AC7: this definition-of-done contract exists at contracts/OMN-26435.yaml -- falsifier: the dod-verify check in CI'
evidence_requirements:
  - kind: tests
    description: The done-items coverage alarm cases.
    command: uv run --frozen pytest tests/test_omn26435_done_items_coverage_alarm.py -q -n 0 -p no:randomly --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn26435-ac1
    description: AC1 is the alarm and reader cases.
    source: manual
    binds_ac:
      - AC1
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/test_omn26435_done_items_coverage_alarm.py tests/test_omn26435_done_items_coverage_reader.py -q -n 0 -p no:randomly --no-cov -k "done_items_alarm_fires_on_unprojected_done_event or end_to_end_from_a_ledger_row or classifier_states or test_reader_"
        cwd: .
  - id: dod-omn26435-ac2
    description: AC2 is the quiet cases.
    source: manual
    binds_ac:
      - AC2
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/test_omn26435_done_items_coverage_alarm.py -q -n 0 -p no:randomly --no-cov -k "done_items_alarm_quiet_without_done_events or classifier_states"
        cwd: .
  - id: dod-omn26435-ac7
    description: AC7 is this contract read by dod-verify against the pull request; the check runs the classifier the merge base lacks.
    source: manual
    binds_ac:
      - AC7
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/test_omn26435_done_items_coverage_alarm.py -q -n 0 -p no:randomly --no-cov -k classifier_states
        cwd: .
  - id: dod-omn26435-integration-proof
    description: The coverage reader SQL runs against real Postgres on a lab host; hosted CI cannot dispatch lab work, so only the local Done gate runs this unbound check.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-26435 --kind test -- env PYTHONDONTWRITEBYTECODE=1 OMN_REQUIRE_REAL_DB=1 uv run --frozen pytest tests/test_omn26435_done_items_coverage_real_postgres.py -q --no-cov
        cwd: .
