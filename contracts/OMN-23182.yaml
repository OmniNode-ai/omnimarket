schema_version: 1.0.0
ticket_id: OMN-23182
title: Scenario R3 runs every six hours on the lab as an omnimarket node, a free rung that answers 503 forces one move to a paid rung that answers, and a real paid model reports measured usage and a cost above zero
summary: The readiness plan put the R3 producer in a workflow of the cloud repository. It now lives in omnimarket as node_delegation_scenario_r3_effect, scheduled every six hours on the lab by its own timer. One run drives the delegation skill handler with a synthetic request on a large input and rungs-mode probe ladders whose first rung is a free loopback stub answering 503 on every call. Leg a puts a paid stub with a fixed answer second; the free rung shows its declared attempts typed model_unavailable, the run makes one move, the accepted attempt is the paid rung and its bytes equal the fixed answer. Leg b puts a real OpenRouter model second, called through the delegation effect on the probe key with max_tokens 16; the accepted attempt reports usage source measured and a cost above zero. A control ladder with both rungs down ends returned_to_caller. It writes one ledger STATUS row (the row the green-days reading counts) and emits the result on the bus.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23182-r3-forced-escalation
  statement: A free rung that answers 503 forces exactly one move to a paid rung; the paid rung's answer is the fixed answer and a real paid model's accepted attempt carries measured usage and a cost above zero; with both rungs down the run ends returned_to_caller.
  acceptance:
  - id: AC1
    statement: 'AC1: the committed R3 inputs pass their own schema test -- falsifier: `uv run pytest tests/nodes/node_delegation_scenario_r3_effect/test_r3_inputs.py -q`'
  - id: AC2
    statement: 'AC2: the golden chain is green and each injected break (a paid rung down, a free rung that answers, an untyped free failure, a wrong answer, a zero measured cost, an unpaid tier, a small input, an empty probe key, leg b switched off, an answering control ladder) turns the scenario red for its named reason -- falsifier: `uv run pytest tests/nodes/node_delegation_scenario_r3_effect/test_golden_chain_scenario_r3_effect.py -q`'
