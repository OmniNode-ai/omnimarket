schema_version: 1.0.0
ticket_id: OMN-25958
title: omnimarket release commits CHANGELOG.md to dev, which the removed-prose test refuses
summary: 'The release PR for omnimarket 0.4.321 added CHANGELOG.md at the repository root, a file the removed-prose test lists in REMOVED_PROSE, so that test failed on dev and on every pull request based on it. This change deletes the file again. Whether the release writer stops committing it is a separate criterion (AC2), decided by the release-train owner.'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn25958-no-changelog-on-dev
  statement: CHANGELOG.md is absent from dev, as the removed-prose test requires.
  acceptance:
  - id: AC1
    statement: 'AC1: CHANGELOG.md is absent from omnimarket dev and the removed-prose test passes there -- falsifier: uv run pytest tests/ci/test_repository_prose_removed_omn17427.py -q'
- id: req-omn25958-receipt-gate-pin
  statement: omnimarket's call-repo-evidence-gate.yml pins the omnibase_core dev-merge tag that first accepts a
    changelog-free release cut, so this repository's release pull requests can pass the receipt gate.
  acceptance:
  - id: DoD1
    statement: 'DoD1: .github/workflows/call-repo-evidence-gate.yml and tests/ci/receipt_gate_pin.py pin
      receipt-gate.yml at dev-20261122081426-c5dc44467b01 or a later dev-merge tag -- falsifier: uv run pytest
      tests/ci/test_receipt_gate_pin_changelog_free_release_omn25958.py -q fails at the merge base, which pins dev-20261120161913-d3ba14c48d02.'
- id: req-omn25958-changelog-free-cut
  statement: The ticket-contract prerequisite admits a release cut that adds no CHANGELOG.md.
  acceptance:
  - id: AC3
    statement: 'AC3: omnimarket''s release-cut gate accepts a release that adds no CHANGELOG.md, and after the next release dev never carries the file -- falsifier: a release-cut gate test that fails on omnimarket dev today, where a cut without CHANGELOG.md is refused'
evidence_requirements:
- kind: tests
  description: The removed-prose test passes at the pushed head.
  command: uv run pytest tests/ci/test_repository_prose_removed_omn17427.py -q -p no:randomly --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn25958-ac1
  description: 'AC1: test_removed_prose_file_is_absent[CHANGELOG.md] passes with the file removed; it fails at dev 5bf30a3f, where the release PR added the file.'
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/ci/test_repository_prose_removed_omn17427.py -q -p no:randomly --no-cov
    cwd: .
- id: dod-omn25958-dod1-caller-pin
  description: The caller pins the receipt-gate reusable at a dev-merge tag at or after dev-20261122081426-c5dc44467b01,
    and the test-side copy of the pin matches it. Fails at the merge base, which pins dev-20261120161913-d3ba14c48d02.
  source: manual
  binds_ac:
  - DoD1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/ci/test_receipt_gate_pin_changelog_free_release_omn25958.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn25958-ac3-changelog-free-cut
  description: 'AC3: the ticket-contract prerequisite exempts a cut of pyproject.toml and uv.lock with no CHANGELOG.md; test_changelog_free_release_cut_needs_no_contract and test_version_bump_only_release_cut_needs_no_contract fail at dev 4e7e2a09, where the cut is refused for carrying no contract.'
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/ci/test_ticket_contract_release_cut_exempt_omn17427.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn25958-ac3-gate-lists-no-changelog
  description: 'AC3: the release-cut gate (_RELEASE_CUT_PATHS in the ticket-contract prerequisite handler), which the release train reads to choose where release notes go, lists no CHANGELOG.md, so the next cut writes none; test_release_cut_gate_does_not_list_changelog fails at dev fb7dff0b, where the gate lists it and release 0.4.330 re-added the file.'
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/ci/test_release_cut_gate_lists_no_changelog_omn25958.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn25958-integration-proof
  description: 'Run the focused release-cut gate test file of this change on a lab host at the pushed revision. This local completion proof carries no hosted AC bindings.'
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: >-
      env PYTHONDONTWRITEBYTECODE=1 onex lab-work run
      --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)"
      --lane dod-integration-proof-25958 --kind test --
      env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest
      tests/ci/test_ticket_contract_release_cut_exempt_omn17427.py
      tests/ci/test_repository_prose_removed_omn17427.py
      tests/ci/test_release_cut_gate_lists_no_changelog_omn25958.py
      -q -n 0 --no-cov --refuse-skips
    cwd: .
