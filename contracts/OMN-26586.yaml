schema_version: 1.0.0
ticket_id: OMN-26586
title: A declared path provisions a stability tenant and its gateway key, so C16 and the stability probes can authenticate
summary: node_stability_gateway_key_provision_effect declares stability as its only allowed lane, creates the one stability tenant and one active gateway key row, and keeps the key value only in the secret store; prod and the cloud lanes are refused before any secret read or database write.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn26586-stability-gateway-key
  statement: A declared node provisions one stability tenant and one active gateway API key, refuses every other lane, and never outputs the key value.
  acceptance:
  - id: AC1
    statement: 'AC1: a contract-declared node or runbook names stability as an allowed lane for creating one tenant and one active API key, with the key value written only to the stability secret store and never to a log, receipt or ledger row -- falsifier: uv run pytest on the node''s test that provisions on lane stability and asserts no output field holds the key value'
  - id: AC2
    statement: 'AC2: the path refuses prod and the cloud lanes before any secret read or database write -- falsifier: uv run pytest on the node''s test that passes lane prod and lane cloud and asserts a refusal with zero writes'
  - id: AC3
    statement: 'AC3: after the path runs on a freshly emptied stability database, the C16 submit answers 202 and not 401 -- falsifier: the c16-receipt-identity artifact of the next chain-canary-c16-receipt-identity.yml run shows submit=202'
evidence_requirements:
- kind: tests
  description: The stability gateway key provision node tests pass at the pushed head.
  command: uv run pytest tests/nodes/node_stability_gateway_key_provision_effect -q -n 0 --no-cov -p no:cacheprovider
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn26586-ac1
  description: 'AC1: the contract names stability as the only allowed lane; the provision test on lane stability asserts the result, its JSON and repr, the log records and the rows handed to the identity store hold no key value, and the result model has no field that can hold one.'
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_stability_gateway_key_provision_effect/test_provision_stability.py -q -n 0 --no-cov -p no:cacheprovider
    cwd: .
- id: dod-omn26586-ac2
  description: 'AC2: the guard test passes lane prod, lane cloud (and dev, public, empty, and a non-stability overlay lane) and asserts refused_lane_not_allowed with zero calls to the key generator, the settings store and the identity store; a failing control with a contract declaring another lane runs the flow.'
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_stability_gateway_key_provision_effect/test_stability_only_guard.py -q -n 0 --no-cov -p no:cacheprovider
    cwd: .
- id: dod-omn26586-ac3
  description: 'hosted proxy for AC3: the key row the node writes resolves to its tenant through the gateway''s own PostgresApiKeyTenantIdentity (same sha256 and prefix scheme), and a run on an emptied database with the key already in the store provisions again. AC3 itself is pending: it needs this PR merged and a roll the orchestrator makes, then the node run through the declared dispatch path on the stability lane and the next chain-canary-c16-receipt-identity.yml run showing submit=202; it is not met by this change alone.'
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_stability_gateway_key_provision_effect/test_identity_store.py -q -n 0 --no-cov -p no:cacheprovider
    cwd: .
- id: dod-omn26586-integration-proof
  description: the stability gateway key provision node tests run on a lab host at the pushed head; hosted CI cannot reach the lab, so only the local Done gate runs this unbound check
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-26586 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_stability_gateway_key_provision_effect -q --no-cov
