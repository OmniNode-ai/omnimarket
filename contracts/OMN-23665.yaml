schema_version: 1.0.0
ticket_id: OMN-23665
title: The landing tick workflow in watching mode is compared with the old controller's real decision and carries the controller's recorded state
summary: In watching mode the composed landing workflow was compared with a made-up no action for the cutover repository, and started each tick with no state, so it would send a worker for a pull request the old controller holds. The snapshot step now reads the old controller's finished tick (its facts file, tick receipt and decision log) during the cutover period, carries its state onto the workflow's own facts and publishes the tick on the record; the compare step decides the controller's facts with the same decision node and compares per pull request.
is_seam_ticket: true
interface_change: true
interfaces_touched:
- topics
- public_api
requirements:
- id: req-omn23665-real-controller-decision
  statement: A tick record carries the controller's finished tick; the compare step uses the controller's own decision for it, and the carried state makes a held pull request read no action where the same facts without it dispatch a worker.
  acceptance:
  - id: AC1
    statement: 'AC1: a recorded tick that carries the old landing controller''s state decides no action for a pull request the controller holds behind another pull request, where the same tick without that state dispatches a worker -- falsifier: uv run pytest tests/nodes/node_pr_landing_snapshot_effect/test_controller_carry.py -q -k held'
  - id: AC2
    statement: 'AC2: a genuinely new red pull request still dispatches a worker in the same replay -- falsifier: uv run pytest tests/nodes/node_pr_landing_snapshot_effect/test_controller_carry.py -q -k new_red'
  - id: AC3
    statement: 'AC3: the compare step reads the controller''s decision from the recorded tick and no longer pairs omnimemory with a synthetic no-action -- falsifier: uv run pytest tests/nodes/node_pr_landing_tick_orchestrator/test_controller_compare.py -q'
  - id: AC4
    statement: 'AC4: integrated: the landing-tick-orchestrator unit on the lab, in observe mode over the real omnimemory facts, prints compared with every pull request counted and each difference named -- falsifier: run python -m omnimarket.nodes.node_pr_landing_tick_orchestrator on the lab runtime and read a compared line whose divergent list is empty or named'
evidence_requirements:
- kind: tests
  description: The carry, compare and replay tests at the pushed head; on the dev head the carry model and the controller source do not exist so each fails at import.
  command: env -u PYTHONPATH uv run pytest tests/nodes/node_pr_landing_snapshot_effect/test_controller_carry.py tests/nodes/node_pr_landing_tick_orchestrator/test_controller_compare.py tests/nodes/node_pr_landing_tick_orchestrator/test_controller_replay.py -q
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23665-ac1-held
  description: The held pull request reads no action with the carried state and dispatches a worker without it.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_pr_landing_snapshot_effect/test_controller_carry.py -q --no-cov -n 0 -p no:randomly -k held
    cwd: .
- id: dod-omn23665-ac2-new-red
  description: A genuinely new red pull request still dispatches a worker after the carry.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_pr_landing_snapshot_effect/test_controller_carry.py -q --no-cov -n 0 -p no:randomly -k new_red
    cwd: .
- id: dod-omn23665-ac3-compare
  description: The compare step uses the controller's decision from the record, and the error chain refuses a log it cannot reproduce.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_pr_landing_tick_orchestrator/test_controller_compare.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn23665-replay
  description: The replay of the recorded ticks through the compare step reads every pull request equal; this test file does not exist at the merge base, so it fails there. It is the hosted half of AC4; the lab half is the unbound local item below.
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_pr_landing_tick_orchestrator/test_controller_replay.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn23665-integration-proof
  description: The pushed head ran the carry, compare and replay tests on a lab host through the lab work runner and exited 0. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: 'env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23665 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_pr_landing_snapshot_effect/test_controller_carry.py tests/nodes/node_pr_landing_tick_orchestrator/test_controller_compare.py tests/nodes/node_pr_landing_tick_orchestrator/test_controller_replay.py -q --no-cov'
    cwd: .
