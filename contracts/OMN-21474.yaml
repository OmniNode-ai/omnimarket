  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_binding_parity_orchestrator/test_parity.py -q --no-cov -k 'identical_projections or content_difference or order_difference or missing_row or count_difference or two_stub_bindings'
    cwd: .
- id: dod-omn21474-ac3-refusal
  description: 'AC3: a profile list with no baseline, and one with no other profile, refuse naming factory_bindings.profiles.'
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_binding_parity_orchestrator/test_parity.py -q --no-cov -k 'without_a_baseline or no_other_profile'
    cwd: .
- id: dod-omn21474-ac4-suites
