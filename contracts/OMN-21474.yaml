schema_version: 1.0.0
ticket_id: OMN-21474
title: 'T-B2: the parity run, one scenario under two or more binding profiles'
summary: 'New orchestrator node node_binding_parity_orchestrator (operation run_parity) whose execution_graph is the binding-layers graph, with the compare_runs verdicts, stub bindings for the bus, state-store and clock protocols, the BUS and STO conformance suites with mutation stubs and recorded transcripts, and a run_local entry that runs any packaged node operation on the in-memory bus.'
is_seam_ticket: false
interface_change: true
interfaces_touched:
- public_api
requirements:
- id: req-omn21474-parity-run
  statement: One scenario runs under the baseline profile and every other profile of the factory_bindings overlay, and the semantic projections are compared.
  acceptance:
  - id: AC1
    statement: 'AC1: The contract''s `execution_graph` equals the fragment of 0d.6 and loads with `ModelContractWorkflowDefinition` -- falsifier: the fixture-copy comparison test as in T-S1'
  - id: AC2
    statement: 'AC2: A scenario that gives identical semantic projections under the baseline and one other stub profile passes (the `binding=` and other provenance fields may differ and are validated on their own), and one that differs in a row''s content, a row order, a missing row or a count fails naming the first difference -- falsifier: five pytest cases, one passing and four failing'
  - id: AC3
    statement: 'AC3: A profile list without a baseline, or with no other profile, refuses naming the overlay key -- falsifier: two pytest cases'
  - id: AC4
    statement: 'AC4: The BUS and STO suites pass on the in-memory and disk bindings and on recorded Kafka and Postgres transcripts, and each stub of the 0d.4 matrix fails them; the STO suite covers `exists` and `list_keys` and the enumeration of head witnesses, where the highest sequence is chosen as an integer (sequence 10 outranks 9) -- falsifier: the suites'' parametrized runs, the mutation stubs, and a stub that orders keys as text'
  - id: AC5
    statement: 'AC5: Configuration: the profile ids and each profile''s bindings are the `factory_bindings` overlay; no profile name is a literal in the node -- falsifier: a fixture overlay with profiles `alpha` and `beta` runs, and the node source has no `local`, `lab` or `cloud` literal'
  - id: AC6
    statement: 'AC6: Bindings: this node is the check; its own dependencies are BUS and CLK -- falsifier: the parity run of its own stub scenario passes under the baseline and one other stub profile, and fails when one stub drops a row'
evidence_requirements:
- kind: tests
  description: Parity and conformance tests of the node.
  command: uv run pytest tests/nodes/node_binding_parity_orchestrator -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
