  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_binding_parity_orchestrator/test_conformance.py -q --no-cov
    cwd: .
- id: dod-omn21474-ac5-configuration
  description: 'AC5: a fixture overlay with profiles alpha and beta runs and the node source holds no profile name.'
  source: manual
