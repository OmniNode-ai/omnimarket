  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_binding_parity_orchestrator/test_parity.py -q --no-cov -k 'fixture_overlay or no_profile_name_literal or changing_the_overlay'
    cwd: .
- id: dod-omn21474-ac6-bindings
  description: 'AC6: the own stub scenario passes under two profiles and fails when one stub drops a row.'
  source: manual
  binds_ac:
  - AC6
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_binding_parity_orchestrator/test_parity.py -q --no-cov -k 'own_stub_scenario'
    cwd: .
- id: dod-omn21474-deploy-parity-run
  description: 'Hosted package deploy smoke: dispatch run_parity through the installed ONEX CLI with an in-memory bus. The matching profiles pass and a profile whose bus drops a row fails, naming the first difference. No credentials, broker or lab service is required. This checks the evaluated checkout package, not a production rollout.'
  source: manual
  checks:
  - check_type: command
    check_value: |
      set -eu;
      export PYTHONDONTWRITEBYTECODE=1;
      probe_dir="$(mktemp -d)";
      trap 'rm -rf "$probe_dir"' EXIT;
      uv sync --locked;
      runtime_bin="$(uv run --locked python -c 'import sys; from pathlib import Path; print(Path(sys.executable).parent)')";
      "$runtime_bin/python" -c '
      import json
      import sys
      from pathlib import Path
      root = Path(sys.argv[1])
      for case, beta_bus in (("same", "reference"), ("drops", "drops_row")):
          request = {
              "scenario": {"kind": "stub_rows", "fixture": {"topic": "parity.demo", "messages": ["m1", "m2", "m3"]}},
              "overlay": {
                  "profiles": [{"id": "alpha", "baseline": True}, {"id": "beta"}],
                  "bindings": {"alpha": {"BUS": "reference", "CLK": "fixed"}, "beta": {"BUS": beta_bus, "CLK": "fixed"}},
                  "proof_bindings": ["alpha", "beta"],
              },
              "fixed_now": "2026-10-28T06:00:00Z",
          }
          (root / f"{case}.json").write_text(json.dumps(request))
      ' "$probe_dir";
      for case in same drops; do
        env -u PYTHONPATH ONEX_LANE=omn21474-deploy-probe "$runtime_bin/onex" node node_binding_parity_orchestrator --input "$probe_dir/$case.json" --state-root "$probe_dir/$case.state" --backend event_bus=inmemory --timeout 30 --output receipt --omnibase-path "$PWD" > "$probe_dir/$case.receipt.json";
      done;
      "$runtime_bin/python" -c '
      import json
      import sys
      from pathlib import Path
      root = Path(sys.argv[1])
      same = json.loads((root / "same.receipt.json").read_text())
      drops = json.loads((root / "drops.receipt.json").read_text())
      for receipt in (same, drops):
          assert receipt["status"] == "success" and receipt["exit_code"] == 0, receipt
      assert same["result"]["passed"] is True, same["result"]
      assert drops["result"]["passed"] is False, drops["result"]
      assert drops["result"]["first_difference"].startswith("beta: verdict at index 0"), drops["result"]
      assert same["result"]["steps"] == ["contract", "overlay", "resolve", "run_baseline", "run_others", "parity"], same["result"]
      print("packaged parity run: matching profiles pass, a dropped row fails")
      ' "$probe_dir"
    cwd: .
