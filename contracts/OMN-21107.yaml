schema_version: "1.0.0"
ticket_id: "OMN-21107"
title: "Ruling relationships and correction closure in the work-ledger projection fold"
summary: >-
  The work-ledger projection fold (node_projection_work_ledger, work_ledger_fold.py)
  folds each relationship cell to a link: supersedes=, amends= and extends= on a
  RULING or OPERATOR-CONSENT row, and corrects= with operator_span= on a CORRECTION
  row, which before was only logged. close_relationships resolves the links against
  the folded state by the target row's timestamp: supersedes closes the target,
  amends and extends link without closing, corrects lists the correcting row on its
  target of any kind, and a hold past its until reads expired at as_of. Links are
  re-derived from the stored raw_row, so no table is added. This is the projection
  half. The parity check (parity.py) compares, per row, the projected raw_row
  with the markdown row text and the authority fields parsed from each, and per
  entity the relationship closure re-derived from each side's rows. The
  omnibase_core reducer twin follows.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-projection-fold-relationships"
    statement: "The projection fold folds every TA.5 fixture to its expected open or closed state and links, identically under every arrival order."
    acceptance:
      - id: "AC1"
        statement: >-
          AC1: fixtures for a superseded ruling, an amended ruling, a consent continued
          by extends=, a corrected ruling, a released hold, a hold before and past its
          until at a given as_of, a claim closed by TERMINAL and by RELEASE, and an
          ACKed MSG each fold through fold_row and close_relationships to the expected
          state and links under every arrival permutation -- falsifier:
          tests/unit/nodes/node_projection_work_ledger/test_work_ledger_relationships.py
          fails
      - id: "AC2"
        statement: >-
          AC2: the real D1 pair (RULING 2026-10-02T11:25:17Z and CORRECTION
          2026-10-02T11:30:10Z, each matching its recorded sha256) folds to one open
          ruling entity whose state lists the correction -- falsifier: the d1 test in
          test_work_ledger_relationships.py fails
      - id: "AC3"
        statement: >-
          AC3: against a real Postgres, rows projected with the superseding and
          correcting rows first and redelivered read back from work_ledger_rows and
          work_ledger_state to a closed superseded ruling listing its correction --
          falsifier: tests/test_work_ledger_real_postgres_write_path.py::test_the_closure_read_back_from_the_tables_is_order_independent
          fails with INTEGRATION_POSTGRES set
      - id: "AC4"
        statement: >-
          AC4: negative control: a projection copy in which one RULING row's words are
          changed while its id and timestamps are kept reports row_text_differs, and one
          in which a corrects= link is dropped reports row_text_differs,
          row_authority_differs and state_relations_differ on the corrected ruling --
          falsifier:
          tests/unit/nodes/node_projection_work_ledger/test_work_ledger_parity_text_relations.py
          fails
      - id: "AC5"
        statement: >-
          AC5: the extended parity check reports exact parity on a faithful projection
          with every row's text, parsed authority fields and relationship closure
          compared, through compare() and the CLI over a JSON export (the code half of
          the ticket's AC3; the full-UTC-day run against the lab projection is a
          separate post-merge read) -- falsifier: the faithful-projection tests in
          test_work_ledger_parity_text_relations.py or test_work_ledger_parity.py fail
evidence_requirements:
  - kind: "tests"
    description: "AC4 and AC5: the extended parity check, its negative controls and the database loader."
    command: "uv run pytest tests/unit/nodes/node_projection_work_ledger/test_work_ledger_parity_text_relations.py tests/unit/nodes/node_projection_work_ledger/test_work_ledger_parity.py -q -p no:randomly --no-cov"
  - kind: "tests"
    description: "AC1 and AC2: the fold fixtures, permutations and the D1 pair."
    command: "uv run pytest tests/unit/nodes/node_projection_work_ledger/test_work_ledger_relationships.py -q -p no:randomly --no-cov"
  - kind: "tests"
    description: "AC3: the real-Postgres read-back of the closure."
    command: "uv run pytest tests/test_work_ledger_real_postgres_write_path.py -q -p no:randomly --no-cov"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn21107-ac1-fixtures"
    description: "Each TA.5 fixture folds to its expected state and links under every arrival permutation."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/nodes/node_projection_work_ledger/test_work_ledger_relationships.py -q -n 0 -k 'fixture or amends_and_extends or correction or target_stamp or links_for_rows or unresolved'"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC1"]
  - id: "dod-omn21107-ac2-d1-pair"
    description: "The real D1 RULING and CORRECTION rows, pinned by sha256, fold to one open ruling listing the correction."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/nodes/node_projection_work_ledger/test_work_ledger_relationships.py -q -n 0 -k 'd1_pair'"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC2"]
  - id: "dod-omn21107-ac3-real-postgres"
    description: "The closure read back from a real Postgres is order-independent."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/test_work_ledger_real_postgres_write_path.py -q -n 0 -k 'closure_read_back'"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC3"]
  - id: "dod-omn21107-ac4-negative-controls"
    description: "A changed RULING row's words and a dropped corrects= link each make the extended parity report a mismatch of the right kind."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/nodes/node_projection_work_ledger/test_work_ledger_parity_text_relations.py -q -n 0 -k 'negative_control or dropped or without_its_text or no_longer_parses'"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC4"]
  - id: "dod-omn21107-ac5-faithful-exact"
    description: "A faithful projection is exact over text, authority fields and relationship closure, through compare(), the JSON CLI and the database loader."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/nodes/node_projection_work_ledger/test_work_ledger_parity_text_relations.py tests/unit/nodes/node_projection_work_ledger/test_work_ledger_parity.py -q -n 0 -k 'faithful or cli or receipt or database_reads_state_live or do_not_run'"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC5"]
  - id: "dod-omn21107-deploy-probe"
    description: "Deploy probe: the parity check read from GitHub at the checked-out commit defines the relationship mismatch kind and the raw-row loader. A head without the extension fails the probe."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: "gh api \"repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_projection_work_ledger/parity.py?ref=$(git rev-parse HEAD)\" --jq .content | base64 -d | grep -c 'def load_projection_raw_rows_json'"
        cwd: "${OMNI_HOME}/omnimarket"

  - id: "dod-omn21107-ac3-required-parity-evidence"
    description: "TA.5 code contribution: exact parity refuses absent or partial projected text through the in-memory bus, injected spool transport and JSON CLI; changed words and dropped correction links remain mismatches. The full UTC-day live projection proof remains a separate required check."
    source: "manual"
    binds_ac: ["AC3", "AC4"]
    checks:
      - check_type: "test_passes"
        check_value: "env UV_FROZEN=true uv run pytest tests/unit/nodes/node_projection_work_ledger/test_work_ledger_parity_required_text.py -q --no-cov"
        cwd: "${OMNI_HOME}/omnimarket"

  - id: "dod-omn21107-deploy-required-parity-evidence"
    description: "Hosted-runner probe reads the published parity module at the checked-out head and executes its missing-text negative control. The old module returns no missing-text mismatch and fails. No runtime host or application credential is required."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: |-
          set -euo pipefail
          probe=$(mktemp -d)
          trap 'rm -rf "$probe"' EXIT
          gh api "repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_projection_work_ledger/parity.py?ref=$(git rev-parse HEAD)" --jq .content | base64 -d > "$probe/parity.py"
          uv run --frozen python - "$probe/parity.py" <<'PYPROBE'
          import hashlib
          import runpy
          import sys
          from datetime import UTC, datetime
          compare = runpy.run_path(sys.argv[1])["compare"]
          raw = "2026-10-01T12:00:00Z | STATUS | lane=probe | evidence"
          rid = hashlib.sha256(raw.encode()).hexdigest()
          result = compare(file_rows=[raw], projection_rows={rid: raw[:20]}, projection_state={}, since=datetime(2026, 10, 1, tzinfo=UTC), until=datetime(2026, 10, 2, tzinfo=UTC))
          assert not result.exact
          assert [(m.kind.value, m.key) for m in result.mismatches] == [("row_text_missing_in_projection", rid)]
          PYPROBE
        cwd: "${OMNI_HOME}/omnimarket"
