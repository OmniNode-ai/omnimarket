schema_version: "1.0.0"
ticket_id: "OMN-21107"
title: "Ruling relationships and correction closure in the work-ledger projection fold"
summary: >-
  The work-ledger projection fold (node_projection_work_ledger, work_ledger_fold.py)
  folds each relationship cell to a link: supersedes=, amends= and extends= on a
  RULING or OPERATOR-CONSENT row, and corrects= with operator_span= on a CORRECTION
  row, which before was only logged. close_relationships resolves the links against
  the folded state by the target row's timestamp: supersedes closes the target,
  amends and extends link without closing, corrects lists the correcting row on its
  target of any kind, and a hold past its until reads expired at as_of. Links are
  re-derived from the stored raw_row, so no table is added. This is the projection
  half; the omnibase_core reducer twin and the parity extension follow.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-projection-fold-relationships"
    statement: "The projection fold folds every TA.5 fixture to its expected open or closed state and links, identically under every arrival order."
    acceptance:
      - id: "AC1"
        statement: >-
          AC1: fixtures for a superseded ruling, an amended ruling, a consent continued
          by extends=, a corrected ruling, a released hold, a hold before and past its
          until at a given as_of, a claim closed by TERMINAL and by RELEASE, and an
          ACKed MSG each fold through fold_row and close_relationships to the expected
          state and links under every arrival permutation -- falsifier:
          tests/unit/nodes/node_projection_work_ledger/test_work_ledger_relationships.py
          fails
      - id: "AC2"
        statement: >-
          AC2: the real D1 pair (RULING 2026-10-02T11:25:17Z and CORRECTION
          2026-10-02T11:30:10Z, each matching its recorded sha256) folds to one open
          ruling entity whose state lists the correction -- falsifier: the d1 test in
          test_work_ledger_relationships.py fails
      - id: "AC3"
        statement: >-
          AC3: against a real Postgres, rows projected with the superseding and
          correcting rows first and redelivered read back from work_ledger_rows and
          work_ledger_state to a closed superseded ruling listing its correction --
          falsifier: tests/test_work_ledger_real_postgres_write_path.py::test_the_closure_read_back_from_the_tables_is_order_independent
          fails with INTEGRATION_POSTGRES set
evidence_requirements:
  - kind: "tests"
    description: "AC1 and AC2: the fold fixtures, permutations and the D1 pair."
    command: "uv run pytest tests/unit/nodes/node_projection_work_ledger/test_work_ledger_relationships.py -q -p no:randomly --no-cov"
  - kind: "tests"
    description: "AC3: the real-Postgres read-back of the closure."
    command: "uv run pytest tests/test_work_ledger_real_postgres_write_path.py -q -p no:randomly --no-cov"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn21107-ac1-fixtures"
    description: "Each TA.5 fixture folds to its expected state and links under every arrival permutation."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/nodes/node_projection_work_ledger/test_work_ledger_relationships.py -q -n 0 -k 'fixture or amends_and_extends or correction or target_stamp or links_for_rows or unresolved'"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC1"]
  - id: "dod-omn21107-ac2-d1-pair"
    description: "The real D1 RULING and CORRECTION rows, pinned by sha256, fold to one open ruling listing the correction."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/nodes/node_projection_work_ledger/test_work_ledger_relationships.py -q -n 0 -k 'd1_pair'"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC2"]
  - id: "dod-omn21107-ac3-real-postgres"
    description: "The closure read back from a real Postgres is order-independent."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/test_work_ledger_real_postgres_write_path.py -q -n 0 -k 'closure_read_back'"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC3"]
  - id: "dod-omn21107-deploy-probe"
    description: "Deploy probe: the fold read from GitHub at the checked-out commit defines close_relationships. A head without it fails the probe."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: "gh api \"repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_projection_work_ledger/handlers/work_ledger_fold.py?ref=$(git rev-parse HEAD)\" --jq .content | base64 -d | grep -c 'def close_relationships'"
        cwd: "${OMNI_HOME}/omnimarket"
