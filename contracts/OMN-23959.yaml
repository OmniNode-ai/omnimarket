schema_version: "1.0.0"
ticket_id: OMN-23959
title: "The board step limit is 45 seconds"
summary: >-
  The board publisher refused whole cycles when its required factory_floor step passed its 30 s limit (measured 18 to 23 s
  at Mac load 10 to 12; the step passes 30 s near load 13). The step's timeout_seconds is now 45 and cycle.bound_seconds is
  255, so the declared longest path (253 s) stays under the bound. Operator decision 2026-11-12: update the board limit to 45 seconds.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn23959-step-limit
    statement: The factory_floor step has at least 1.5 times the measured maximum, and the longest path fits the cycle bound.
    acceptance:
      - id: AC1
        statement: 'AC1: the factory floor step limit is 45 seconds and the cycle bound is 255 seconds with the longest declared path under the bound -- falsifier: uv run --frozen pytest tests/unit/nodes/node_factory_floor_publish_effect/test_board_limits_overlay.py -q --no-cov fails on the base commit (limit 30 is under 1.5 times the measured 23 seconds) and passes on the branch'
      - id: AC3
        statement: 'AC3: integrated: the board publish cycle running on the Mac from the merged revision reads the 45 second limit and publishes a fresh record -- falsifier: the served publish-status.json read on the Mac shows the 30 second limit, or a record older than one publish cycle'
evidence_requirements:
  - kind: tests
    description: The step limit and longest path tests, and the existing publisher contract tests.
    command: uv run --frozen pytest tests/unit/nodes/node_factory_floor_publish_effect/test_board_limits_overlay.py tests/nodes/node_floor_delegation_effect/test_contract_and_publish.py tests/unit/test_factory_floor_page_limits.py -q --no-cov
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-omn23959-step-limit
    description: The step limit test passes with the change; with the contract from the base branch the limit test fails (30 is under 34.5).
    source: manual
    execution_scope: hosted_and_local
    binds_ac: [AC1]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/nodes/node_factory_floor_publish_effect/test_board_limits_overlay.py -q --no-cov
        cwd: .
  - id: dod-omn23959-integration-proof
    description: The step limit test run on a lab host at the pushed head through the lab work node. The reading on the Mac itself (the served publish-status.json after the orchestrator's reinstall) is the orchestrator's and is named in the pull request; hosted CI cannot reach it, so only the local Done gate runs this unbound check.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: 'env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23959 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/nodes/node_factory_floor_publish_effect/test_board_limits_overlay.py -q --no-cov'
        cwd: .
  - id: dod-omn23959-ac3
    description: The tests that stand behind the integrated reading pass at the head and fail at the merge base; the reading itself is the Mac's served publish-status.json after reinstall.
    source: manual
    binds_ac: [AC3]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/nodes/node_factory_floor_publish_effect/test_board_limits_overlay.py -q --no-cov
        cwd: .
