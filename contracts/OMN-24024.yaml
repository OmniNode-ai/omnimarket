schema_version: 1.0.0
ticket_id: OMN-24024
title: Validate the lab endpoint settings document in the private repository's checks
summary: The private overlay repository's CI loads each overlay document through the model its pin names, and refuses a document no model loads. The lab endpoint address is moving from a public contract file into a new overlay document, llm_endpoints. This adds the pydantic model that validates it (version 1, a map of slot names to http(s) base addresses with an explicit port; no path, query or fragment; trailing slash stripped), so the overlay repository can pin it. No value lives here and nothing that runs today changes.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24024-llm-endpoints-overlay-model
  statement: The shared code holds a model that accepts the llm_endpoints overlay document and refuses each malformed form listed in its test.
  acceptance:
  - id: AC1
    statement: "AC1: the checker accepts a settings document with a version of 1 and a map of slot names to base addresses with explicit ports, and refuses each malformed document listed in its test -- falsifier: python -m pytest tests/unit/models/test_llm_endpoints_overlay_document_omn24017.py -q fails at the merge base"
  - id: AC2
    statement: "AC2: integrated: the private settings repository's CI loads the llm_endpoints document through the merged checker at the pinned revision and passes -- falsifier: the overlays CI step that lists overlays loaded by no checker still names llm_endpoints"
evidence_requirements:
- kind: tests
  description: The overlay document model tests pass at the pushed head.
  command: uv run pytest tests/unit/models/test_llm_endpoints_overlay_document_omn24017.py -q -p no:randomly --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24024-ac1
  description: 'AC1: the model tests pass at the head; at the merge base the module does not exist, so the same test file cannot even import it.'
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/models/test_llm_endpoints_overlay_document_omn24017.py -q -p no:randomly --no-cov
    cwd: .
- id: dod-omn24024-ac2
  description: 'hosted proxy for AC2: the model tests pass here; the overlays CI reading after the pin moves to the merge commit is posted as a pull request comment naming the head.'
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/models/test_llm_endpoints_overlay_document_omn24017.py -q -p no:randomly --no-cov
    cwd: .
- id: dod-omn24024-integration-proof
  description: the model tests run on a lab host at the pushed head; hosted CI cannot reach the lab, so only the local Done gate runs this unbound check
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24024 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/models/test_llm_endpoints_overlay_document_omn24017.py -q --no-cov -p no:randomly
