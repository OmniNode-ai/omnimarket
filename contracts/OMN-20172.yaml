schema_version: 1.0.0
ticket_id: OMN-20172
title: "Delegation shrink before escalate: on a rubric failure a decomposable task is swapped, split and retried on the same model before the chain escalates"
summary: >-
  The local delegation dispatch climbs a ladder on a typed rubric_failed: one configuration swap on the same model and backend with the next-best MET configuration, then shrink (the split compute cuts the request, the units run on the same model and backend, the recombine compute joins them and the class rubric checks the whole), then the existing escalation. A new pure node, node_delegation_shrink_retry_compute, decides each rung; the caps come from the class contract. A TLA+ model with seven mutations backs the policy. The ladder is dormant until a class rubric is configured MET.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn20172-shrink-retry
  statement: On a rubric failure the ladder is configuration swap, shrink on the same model, then escalate.
  acceptance:
  - id: AC1
    statement: "AC1: a rubric-failed decomposable attempt is split, its units run on the same model and backend, and the recombined whole must pass the class rubric before it is accepted -- falsifier: uv run pytest tests/unit/delegation -k shrink_retry_same_model_then_whole_check -v in omnimarket"
  - id: AC2
    statement: "AC2: a not-decomposable failure, or a recombined whole that fails its rubric, escalates to the next responder in the class chain -- falsifier: uv run pytest tests/unit/delegation -k \"not_decomposable_escalates or whole_fail_escalates\" -v in omnimarket"
  - id: AC3
    statement: "AC3: splitting stops at depth 2 and unit attempts stop at the class cap, after which the chain escalates -- falsifier: uv run pytest tests/unit/delegation -k shrink_caps_then_escalate -v in omnimarket"
  - id: AC4
    statement: "AC4: the TLA+ model of the policy passes its design config and each mutation (unbounded split, accept without the whole check, a second terminal on redelivery) fails its invariant -- falsifier: the TLC run over omnimarket formal/delegation_shrink_retry with the design config and each mutation config"
  - id: AC6
    statement: "AC6: a rubric-failed attempt whose model has a second MET configuration for the class and band is retried once on the same model and backend with that configuration before any split or escalation, and a second swap on the same model is refused by the cap -- falsifier: uv run pytest tests/unit/delegation -k \"config_swap_before_shrink or config_swap_capped\" -v in omnimarket"
  - id: AC7
    statement: "AC7: with no second MET configuration the swap rung is skipped and the ladder goes to shrink or escalate -- falsifier: uv run pytest tests/unit/delegation -k config_swap_skipped_without_met_cell -v in omnimarket"
  - id: AC8
    statement: "AC8: the TLA+ model includes the swap rung, and a mutation that swaps configurations without a cap fails its invariant -- falsifier: the TLC run over omnimarket formal/delegation_shrink_retry with the uncapped-swap mutation config"
evidence_requirements:
- kind: tests
  description: The acceptance tests of this ticket at the pushed head.
  command: uv run --frozen pytest tests/unit/delegation/test_shrink_retry_ladder_omn20172.py tests/unit/delegation/test_shrink_retry_local_port_omn20172.py -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
- id: dod-omn20172-shrink-retry-same-model
  description: A rubric-failed code_review is split per file, each unit runs on the failed backend and model, and the recombined whole is checked by the class rubric before it is accepted; with no caps declared the same failure escalates and no part is cut.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: 'uv run --frozen pytest tests/unit/delegation/test_shrink_retry_ladder_omn20172.py tests/unit/delegation/test_shrink_retry_local_port_omn20172.py -q --no-cov -n 0 -p no:randomly -k shrink_retry_same_model_then_whole_check'
    cwd: .
- id: dod-omn20172-escalates
  description: A planning request, a one-hunk diff and a request with no measured band escalate with no unit run; a recombined whole that fails its rubric escalates and is never accepted.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: 'uv run --frozen pytest tests/unit/delegation/test_shrink_retry_ladder_omn20172.py tests/unit/delegation/test_shrink_retry_local_port_omn20172.py -q --no-cov -n 0 -p no:randomly -k "not_decomposable_escalates or whole_fail_escalates"'
    cwd: .
- id: dod-omn20172-caps
  description: A failed unit splits to depth 2 and no further, a depth cap of 1 sends it to the next responder alone, and a unit that would pass twice the unit count in attempts escalates alone.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: 'uv run --frozen pytest tests/unit/delegation/test_shrink_retry_ladder_omn20172.py tests/unit/delegation/test_shrink_retry_local_port_omn20172.py -q --no-cov -n 0 -p no:randomly -k shrink_caps_then_escalate'
    cwd: .
- id: dod-omn20172-tla
  description: TLC passes four design configs and fails each of the seven mutations on its one invariant, as the committed results and the reviewed VERDICT record.
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: 'uv run --frozen pytest tests/formal/test_delegation_shrink_retry_model.py -q --no-cov -n 0 -p no:randomly'
    cwd: .
- id: dod-omn20172-swap
  description: The next-best MET cell is the swapped configuration, it is tried before any split, and a second swap on the same model is refused, both in the policy and through the local dispatch port.
  source: manual
  binds_ac:
  - AC6
  checks:
  - check_type: test_passes
    check_value: 'uv run --frozen pytest tests/unit/delegation/test_shrink_retry_ladder_omn20172.py tests/unit/delegation/test_shrink_retry_local_port_omn20172.py -q --no-cov -n 0 -p no:randomly -k "config_swap_before_shrink or config_swap_capped"'
    cwd: .
- id: dod-omn20172-swap-skipped
  description: With only the current configuration MET, or no cells, no second configuration is found and the ladder shrinks or escalates.
  source: manual
  binds_ac:
  - AC7
  checks:
  - check_type: test_passes
    check_value: 'uv run --frozen pytest tests/unit/delegation/test_shrink_retry_ladder_omn20172.py tests/unit/delegation/test_shrink_retry_local_port_omn20172.py -q --no-cov -n 0 -p no:randomly -k config_swap_skipped_without_met_cell'
    cwd: .
- id: dod-omn20172-tla-swap
  description: M4_uncapped_swap lifts the swap cap and violates SwapsAtMostCap in the committed TLC output.
  source: manual
  binds_ac:
  - AC8
  checks:
  - check_type: test_passes
    check_value: 'uv run --frozen pytest tests/formal/test_delegation_shrink_retry_model.py -q --no-cov -n 0 -p no:randomly -k uncapped_swap'
    cwd: .
- id: dod-omn20172-deploy-source-read
  description: The pushed branch carries the shrink-retry handler class, read live from GitHub at the branch head.
  source: manual
  checks:
  - check_type: command
    check_value: gh api "repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_delegate_skill_orchestrator/handlers/handler_shrink_retry.py?ref=omn-20172-shrink-retry-ladder" --jq .content | base64 -d | grep -c 'class HandlerShrinkRetry' | grep -qv '^0$'
