schema_version: 1.0.0
ticket_id: OMN-25407
title: One review lock per pull request head refuses a second review of the same head, and a fixer push that adds files is held for a scope check
summary: node_review_lock_effect is the command the review workflow calls before it dispatches a review. acquire takes one lock keyed repo, pull request and head, recorded as one STATUS row written through
  the ledger writer; a second acquire for the same key, or a key whose head already has a verdict STATUS row, is refused with the first review's pointer and exit code 3. check-scope compares the first reviewed
  head's file set with the new head's and the fixer comment, and holds a push (exit code 3, the added files listed) that adds files outside the scope unless the comment names a finding for each added file;
  the scope is the paths the ticket contract names when it is passed, else the first head's file set, and the result says which. This pull request adds the node and its tests only; the orchestrator wires
  the two call lines into the fill tick and review-act after it merges, and AC3 is read 24 hours after that install.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn25407-ac1
  statement: a review lock keyed repo, pull request and head refuses a second review of the same head
  acceptance:
  - id: AC1
    statement: 'AC1: every review dispatcher (the fill tick and review-act) takes one lock keyed repo, pull request and head before dispatching, and refuses when that lock or a verdict for that head exists
      -- falsifier: `node --test` over a fixture replaying the 2026-11-17 dispatch order for omnibase_infra 6047 (1139, 1225, 1243, 1310, 1340, 1345, 1448) dispatches four reviews, not seven'
- id: req-omn25407-ac2
  statement: a fixer push that adds files outside the first reviewed head's file set is held until the comment names the finding for each
  acceptance:
  - id: AC2
    statement: 'AC2: a fixer push whose diff adds files outside the file set of the first reviewed head is held from review until the fixer comment names the finding that asked for each added file -- falsifier:
      `node --test` with the 6047 file lists at 7ce37985d13c and fca8c3ea6891 holds the push and releases it when the finding is named'
- id: req-omn25407-ac3
  statement: no two verdict files share repository, pull request and head 24 hours after install
  acceptance:
  - id: AC3
    statement: 'AC3: 24 hours after install no two verdict files share repository, pull request and head -- falsifier: a group-by-head count over the scratchpad verdict files, quoted in a STATUS row'
evidence_requirements:
- kind: tests
  description: The review lock node tests pass at the pushed head.
  command: uv run --frozen pytest tests/nodes/node_review_lock_effect -q --no-cov -p no:cacheprovider --refuse-skips
