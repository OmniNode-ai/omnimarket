schema_version: 1.0.0
ticket_id: OMN-21492
title: 'T-R1: release classifier and decision'
summary: node_release_action_classify_compute (operation classify_release_action) decides admit, refuse
  or blocked for a release action from facts, grant facts and the release_gate overlay policy. The train
  and the tagger identity are admitted on the identity the run carries, a person in a grantor role list
  of the overlay (and not an agent) may cut a version tag, a package publish or a GitHub release, every
  other actor is refused naming the kind, and missing or unreadable facts are blocked.
is_seam_ticket: false
interface_change: true
interfaces_touched:
- public_api
requirements:
- id: req-omn21492-release-classify
  statement: A release action is admitted only on the train's identity, a role holder's own release or
    a grant bound to the change; an unreadable input blocks.
  acceptance:
  - id: AC1
    statement: 'AC1: The train''s own release (the actor and branch the overlay names as the train) is
      admitted unchanged, and a dev-merge tag written by the tagger identity is `dev_merge_tag` and admitted
      -- falsifier: two pytest cases with the train''s and the tagger''s real shapes'
  - id: AC2
    statement: 'AC2: Each of the four release kinds from a non-train actor with no grant is refused naming
      the kind -- falsifier: four pytest cases'
  - id: AC3
    statement: 'AC3: An action that touches a version file and matches no known shape is refused, not
      passed -- falsifier: the pytest case with an unrecognised event that edits a version file'
  - id: AC4
    statement: 'AC4: A refused action never becomes admitted because the grant facts are missing: missing
      or unreadable grant facts are `blocked` -- falsifier: the pytest case with no grant facts'
  - id: AC5
    statement: 'AC5: Configuration: the release shapes, the train identity and the agent identities are
      the `release_gate` overlay; the node names no login, repository or branch -- falsifier: the same
      action is refused under one overlay and admitted under an overlay that names its actor as the train'
  - id: AC6
    statement: 'AC6: Bindings: depends on no protocol (it takes facts) -- falsifier: byte-identical results
      in process and through the local in-process entry of the parity harness (T-B2), and the conformance
      check (T-B1) fails if a `protocol_dependencies` entry appears in its contract'
evidence_requirements:
- kind: tests
  description: The classifier's focused test files and the binding conformance suite.
  command: uv run pytest tests/nodes/node_release_action_classify_compute tests/nodes/node_binding_conformance_compute
    -q --no-cov --refuse-skips
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
