- id: dod-omn21492-deploy-import
  description: 'Hosted deploy check: the classifier package imports from the installed omnimarket and
    resolves its onex.nodes entry point. Fails at the merge base, where the package and entry point are
    absent.'
  source: manual
  checks:
  - check_type: command
    check_value: 'uv run --locked python -c "from importlib.metadata import entry_points; eps={e.name:
      e for e in entry_points(group=''onex.nodes'')}; eps[''node_release_action_classify_compute''].load();
      print(''entry point loads'')"'
    cwd: ${OMNI_HOME}/omnimarket
- id: dod-omn21492-delegation-join
  description: 'Delegation join, not bound to a criterion line (DS-6 and DS-7 of the delegation seam).
    Four Codex draft runs of this pull request''s head (code drafts f5d492ce and dbbd6199, test drafts
    a1bbbeea and 5126b14f; full ids in the check) each published a terminal that the delegation_events
    projection holds as one row with the lane release-gate-r1r2-1945 and terminal_ok true. The check exits
    0 only when exactly those four rows are present and exits 1 when one id is changed. It is a lab readback:
    it reads the lab projection over ssh, so the hosted deploy check does not run it.'
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: |-
      ssh -o BatchMode=yes "$ONEX_RUNTIME_SSH_HOST" 'docker exec -i omnibase-infra-postgres psql -X -q -U postgres -d omnidash_analytics -tA' <<'SQL' | grep -Fx 4
      SET default_transaction_read_only = on;
      SELECT count(*) FROM delegation_events WHERE correlation_id::text IN ('f5d492ce-11f3-4c5a-9cc0-edacfdb7a0ef', 'dbbd6199-350d-4f5f-8518-2b2372d8247b', 'a1bbbeea-611f-428b-b5e4-6926bfabbca1', '5126b14f-6f1f-47d5-9815-20d2d514e581') AND caller_lane = 'release-gate-r1r2-1945' AND terminal_ok IS TRUE;
      SQL
