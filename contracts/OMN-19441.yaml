  - id: "dod-omn19441-ac4-command-keyed"
    description: "Commands sharing a correlation each hold a terminal of their own, and a replay keeps the delivery id and the first deadline."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/nodes/node_delegate_skill_orchestrator/test_delegation_reaper_omn19441.py -q -k 'shared_correlation or replay_keeps_delivery_id'"
