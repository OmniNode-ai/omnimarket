schema_version: "1.0.0"
ticket_id: OMN-23144
title: "An unused entity leaves the build with its tests for 7 days, comes back with the clock reset when the build or the lab start goes red, and is removed only with a tag and a catalog row"
summary: >-
  node_code_quarantine_effect quarantines an unused entity: the entity and its tests leave the build (an exclusion set the
  build and the lab runtime start read) with nothing deleted, and a clock starts. A red clean build, a red lab runtime start
  or a missing reading restores the entity and resets the clock. A removal is accepted only for an entity whose clock has run
  its days, only with a git tag that exists in the repository and a catalog row (entity, tag, sha, reason) for every entity of
  the batch, one repository per batch. The days, repository roots, gate commands and report are overlay data. The node has an
  in-memory backend and a real backend (state file, catalog file, git, gate commands), one suite on both, a golden chain and an
  error chain run on both, and nine named source mutations that each turn a chain red. The build and the lab start reading the
  exclusion set, and the first live quarantine, are follow-ups named in the pull request.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn23144-code-quarantine-node
    statement: Unused code leaves the build with its tests, comes back on a red gate, and is removed only with a tag and a catalog row, by a node whose every setting is overlay data.
    acceptance:
      - id: AC1
        statement: 'AC1: quarantining an entity removes it and its tests from the build while the file stays in the repository, and the 7-day clock starts -- falsifier: uv run pytest src/omnimarket/nodes/node_code_quarantine_effect -q -k quarantine_starts_clock'
      - id: AC2
        statement: 'AC2: a red clean build, a red lab runtime start or a missing reading restores the entity and resets the clock -- falsifier: uv run pytest src/omnimarket/nodes/node_code_quarantine_effect -q -k failure_restores_and_resets'
      - id: AC3
        statement: 'AC3: a removal batch with no tag or no catalog row is refused, and a batch with both is accepted -- falsifier: uv run pytest src/omnimarket/nodes/node_code_quarantine_effect -q -k removal_needs_tag_and_catalog'
      - id: AC4
        statement: 'AC4: generated golden and error chain tests exist and a named mutation turns each red -- falsifier: uv run pytest src/omnimarket/nodes/node_code_quarantine_effect -q -k chain'
evidence_requirements:
  - kind: tests
    description: The quarantine node's acceptance reads, golden chain, error chain and named mutations, on the in-memory rig and on the real files and git rig.
    command: uv run --frozen pytest src/omnimarket/nodes/node_code_quarantine_effect -q --no-cov
