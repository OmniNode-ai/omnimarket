---
schema_version: 1.0.0
ticket_id: OMN-21795
title: 'Guard: dev runtime containers are recreated only by a deployment or a grant'
summary: The dev runtime compose project had no guard against a hand recreate, removal or restart from a Claude session. node_dev_runtime_mutation_guard_effect refuses such a docker or docker compose command unless a live grant row on the rolling work ledger names the project; the omniclaude PreToolUse Bash entrypoint calls it. The protected project, its containers and compose files, the verbs and the grant row shape are declared in the node contract and extended only by the node's deployment overlay.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn21795-dev-runtime-mutation-guard
  statement: A docker or docker compose command from a Claude session that would recreate, remove, stop or restart a dev runtime container is refused unless a live ledger grant names the project, and read-only calls and other projects pass.
  acceptance:
  - id: AC1
    statement: 'AC1: a PreToolUse Bash hook refuses docker or docker compose up, down, rm, restart, stop, kill, start or create aimed at the omnibase-infra project (by -p, COMPOSE_PROJECT_NAME, its compose file, its project label or a declared container name, locally or over ssh) unless a live grant row on the ledger names compose:omnibase-infra; planted refusal tests fail on the unguarded hook and pass on the guard -- falsifier: uv run pytest tests/nodes/node_dev_runtime_mutation_guard_effect -q'
  - id: AC2
    statement: 'AC2: the protected projects, their container names and compose files, the mutating verbs and the grant row shape are read from the node contract and an optional overlay, never from code constants -- falsifier: uv run pytest tests/nodes/node_dev_runtime_mutation_guard_effect -k overlay -q'
  - id: AC3
    statement: 'AC3: read-only docker calls (ps, logs, inspect, events, compose config or ps) and every other compose project are never refused by this hook -- falsifier: uv run pytest tests/nodes/node_dev_runtime_mutation_guard_effect -k allow -q'
evidence_requirements:
- kind: tests
  description: The node's unit suite, run on a lab host at the pushed head.
  command: uv run pytest tests/nodes/node_dev_runtime_mutation_guard_effect -q --no-cov --tb=line
