---
schema_version: "1.0.0"
ticket_id: "OMN-21676"
title: "The hosted dod-verify holds no Linear credential and delegates the criteria comparison to a trusted pre-merge check"
summary: "The criteria-drift check (OMN-20858) read live Linear from the hosted dod-verify job, which holds no credential, so every contract that records criteria ended VERIFICATION_UNRESOLVED ticket_unavailable. A hosted run with no ticket reader now reads nothing and records criteria_delegated on its verdict. node_dod_criteria_check_effect makes the comparison before the merge, on a lab host that the landing controller starts it on, reading the PR head, the contracts its title cites and the live tickets through the project tracker the ticketing nodes use, with the credential in the lab key store. Drift and anything unreadable block the merge. The direct Linear read that took its key from the environment by name is removed."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-omn21676-criteria-delegation"
    statement: "Hosted verification delegates criteria comparison to a trusted check that refuses drift and unreadable tickets."
    acceptance:
      - id: "AC1"
        statement: "AC1: a ticket contract that records a requirements list verifies in the hosted audience with no Linear credential in the environment, and its verdict names the criteria check as delegated, never unresolved ticket_unavailable -- falsifier: uv run pytest tests/unit/nodes/node_dod_verify -q -k hosted_criteria_delegated_without_credential"
      - id: "AC2"
        statement: "AC2: a contract whose pinned criterion differs from the live ticket text still refuses with CRITERIA_DRIFT naming the criterion at the trusted point the check is delegated to, and the delegated hosted verdict is not accepted as proof of the criteria revision there -- falsifier: uv run pytest tests/unit/nodes/node_dod_verify -q -k delegated_criteria_drift_still_refuses"
      - id: "AC3"
        statement: "AC3: an unreadable ticket at the trusted point still refuses ticket_unavailable, so delegation never turns an unreadable ticket into an unchanged one -- falsifier: uv run pytest tests/unit/nodes/node_dod_verify -q -k delegated_ticket_unavailable_still_refuses"
evidence_requirements:
  - kind: "tests"
    description: "A contract with a requirements list verifies hosted with no credential; real drift and an unreadable ticket block at the trusted check."
    command: "uv run pytest tests/unit/nodes/node_dod_verify/test_omn_21676_criteria_delegation.py tests/unit/nodes/node_dod_criteria_check_effect/test_omn_21676_criteria_check.py tests/test_golden_chain_node_dod_criteria_check_effect.py -q --no-cov"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn21676-hosted-delegation"
    description: "A hosted run with no ticket reader and no credential verifies a contract that records criteria, builds no tracker and records criteria_delegated; the local Done gate still refuses an unreadable ticket."
    source: "manual"
    binds_ac: ["AC1"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/nodes/node_dod_verify/test_omn_21676_criteria_delegation.py tests/unit/nodes/node_dod_verify/test_omn_20858_criteria_drift.py tests/unit/nodes/node_dod_verify/test_omn_20858_ticket_effect_and_pins.py -q --no-cov"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn21676-trusted-check"
    description: "The trusted check passes unchanged criteria, blocks an edited or deleted criterion, an unreadable ticket, a missing Linear credential, a moved head and anything GitHub cannot answer, and does not block a contract that records no criteria."
    source: "manual"
    binds_ac: ["AC2"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/nodes/node_dod_criteria_check_effect/test_omn_21676_criteria_check.py tests/test_golden_chain_node_dod_criteria_check_effect.py -q --no-cov"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn21676-unreadable-ticket"
    description: "An unreadable ticket or missing Linear credential blocks the trusted check; the local Done gate still reports ticket_unavailable."
    source: "manual"
    binds_ac: ["AC3"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/nodes/node_dod_criteria_check_effect/test_omn_21676_criteria_check.py tests/unit/nodes/node_dod_verify/test_omn_21676_criteria_delegation.py -k 'unreadable_ticket or no_linear_credential' -q --no-cov"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn21676-falsifier-hosted-delegated"
    description: "The AC1 falsifier selector as the ticket states it selects a test, and the hosted run it selects verifies with no credential and names the criteria check as delegated."
    source: "manual"
    binds_ac: ["AC1"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/nodes/node_dod_verify -q --no-cov -k hosted_criteria_delegated_without_credential"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn21676-falsifier-drift-refuses"
    description: "The AC2 falsifier selector as the ticket states it selects a test: the trusted check refuses an edited criterion with CRITERIA_DRIFT naming it, reading the ticket itself, and takes no hosted verdict as input."
    source: "manual"
    binds_ac: ["AC2"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/nodes/node_dod_verify -q --no-cov -k delegated_criteria_drift_still_refuses"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn21676-falsifier-ticket-unavailable-refuses"
    description: "The AC3 falsifier selector as the ticket states it selects tests: an unreadable ticket, or a key store with no Linear credential, blocks the trusted check and the reason names ticket_unavailable."
    source: "manual"
    binds_ac: ["AC3"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/nodes/node_dod_verify -q --no-cov -k delegated_ticket_unavailable_still_refuses"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn21676-integration-proof-trusted-check-node"
    description: "The trusted criteria check runs as the node itself through the ONEX CLI on the Done-gate host and fails closed: a request for a pull request head that is not an open head it can verify comes back merge_blocked with a CRITERIA_UNREADABLE reason, never a pass. The live-ticket read path (ticket_unavailable) is covered by the unit falsifiers above, not by this probe."
    source: "manual"
    execution_scope: "local_done_gate"
    binds_ac: ["AC3"]
    checks:
      - check_type: "command"
        check_value: "onex node node_dod_criteria_check_effect --input tests/unit/nodes/node_dod_criteria_check_effect/fixtures/refused_request_omn_21676.json --state-root .onex_state/omn21676_probe --backend event_bus=inmemory --timeout 60 --output receipt --omnibase-path . | python3 -c \"import json,sys; r=json.load(sys.stdin); assert r['status']=='success' and r['result']['merge_blocked'] is True and r['result']['reason'].startswith('CRITERIA_UNREADABLE'), r\""
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn21676-deploy-published-source-readback"
    description: |-
      Hosted-runner source-artifact readback: fetch the published verifier and trusted-check sources at the
      evaluated commit and fail if the verifier still publishes the direct Linear read or the trusted check does not answer a merge_blocked verdict. This checks the published source artifact and
      does not assert a live runtime rollout.
    source: "manual"
    checks:
      - check_type: "command"
        check_value: |-
          base="https://raw.githubusercontent.com/OmniNode-ai/omnimarket/$(git rev-parse HEAD)/src/omnimarket/nodes"
          verify="$(curl --fail --silent --show-error --location --max-time 20 "$base/node_dod_verify/services/evidence_collector.py")"
          check="$(curl --fail --silent --show-error --location --max-time 20 "$base/node_dod_criteria_check_effect/models/model_dod_criteria_check.py")"
          printf '%s' "$verify" | grep -q '_criteria_delegated'
          if curl --fail --silent --location --max-time 20 --output /dev/null "$base/node_dod_verify/handlers/handler_dod_ticket_criteria_linear_effect.py"; then
            echo "the direct Linear read is still published"
            exit 1
          fi
          printf '%s' "$check" | grep -q 'merge_blocked'
          echo "Published criteria-delegation readback: PASS"
        cwd: "."
