schema_version: 1.0.0
ticket_id: OMN-24531
title: Plan gate refuses a new plan with no clean first slice review
summary: A new compute node, node_plan_review_ladder_compute, decides the next move of a plan's review from its history. Whole-plan rounds repeat only while an open blocking finding remains and stop in favour of the first slice once none does; the first slice is reviewed until a round is clean, then each later rung when it is next. The first-slice check node's verdict is an input and any verdict but ok returns the plan to its author. The knowledge base gate and the plan review skill are separate pull requests under the same ticket.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24531-ladder-node
  statement: A node decides the plan review ladder's next move from the review history, so the stop of whole-plan rounds and the next rung are read from a node's result.
  acceptance:
  - id: AC2
    statement: 'AC2: a plan review run stops whole-plan rounds once no blocking finding remains and names the next piece to review, decided by a node in omnimarket -- falsifier: `onex run-node node_plan_review_ladder_compute` with an open blocking finding returns a full-plan round, and with none returns the first-slice review'
evidence_requirements:
- kind: tests
  description: The ladder node tests at the pushed head; with the node absent they fail at import, and the three injected-break tests show the stop, the return to the author and the non-blocking reading failing for real.
  command: uv run pytest tests/unit/nodes/node_plan_review_ladder_compute -q -p no:randomly --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
