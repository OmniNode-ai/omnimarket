- id: req-omn21764-caller-groupless
  statement: The lab-work caller joins no consumer group, the node contract declares it, and many calls create no group beyond the serving host's one stable group.
  acceptance:
  - id: AC1
    statement: 'AC1: the caller reads the capacity and terminal topics with no consumer group, and the node contract declares that mode -- falsifier: uv run pytest tests/unit/lab_work/test_caller_groupless.py -q'
  - id: AC2
    statement: 'AC2: many dispatch calls create at most a fixed number of consumer groups, zero for the caller -- falsifier: uv run pytest tests/unit/lab_work/test_caller_groupless.py -k many_calls -q'
