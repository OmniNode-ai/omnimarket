ticket_id: OMN-21764
title: The lab-work caller reads with no consumer group, so a lab-run call leaves none on the CI bus
summary: The lab-work caller built a fresh consumer group for every call and read its topics in it, so each call left a group behind on the broker. The caller now reads with no consumer group, the node contract declares that mode as caller_subscription.mode, and a caller on a bus without that call is refused at construction.
