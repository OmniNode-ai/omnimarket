schema_version: 1.0.0
ticket_id: OMN-22801
title: The lab host row model accepts volumes_root, so the host table with the h101 volume mount root is no longer refused whole by every placement read
summary: ModelLabHostRow gains the optional cell volumes_root (an absolute directory, never the root). The packaged host table carries it on the h101 row since OMN-22688, and the row model forbade it, so every table read answered could_not_check.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn22801-volumes-root
  statement: A host row with volumes_root loads, a row without it loads, and a relative or root value is refused.
  acceptance:
  - id: AC1
    statement: "AC1: an absolute volumes_root loads, an omitted one loads and a relative or root one is refused -- falsifier: uv run --frozen pytest tests/unit/models/test_lab_host_row_volumes_root_omn22788.py -q --no-cov -n 0 -p no:randomly"
  - id: AC2
    statement: "AC2: the packaged host table loads on h053 with its h101 volumes_root cell, and the same read on origin/dev refuses naming hosts.1.volumes_root -- falsifier: uv run pytest tests/unit/models/test_lab_host_row_volumes_root_omn22788.py -q --no-cov -n 0 -p no:randomly -k packaged_table"
evidence_requirements:
- kind: tests
  description: The acceptance tests of this ticket at the pushed head.
  command: uv run --frozen pytest tests/unit/models/test_lab_host_row_volumes_root_omn22788.py -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
- id: dod-omn22801-volumes-root
  description: The row model tests pass, including the packaged table read where ONEX_LAB_RUN_HOSTS names the table file.
  source: manual
  binds_ac:
  - AC1
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/models/test_lab_host_row_volumes_root_omn22788.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn22801-integration-proof
  description: The pushed head ran the row model tests on a lab host through the lab work runner and exited 0. Hosted CI cannot reach the lab, so only the local Done gate runs this check.
  source: manual
  execution_scope: local_done_gate
  binds_ac:
  - AC1
  checks:
  - check_type: command
    check_value: 'uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-22801 -- uv run --frozen pytest tests/unit/models/test_lab_host_row_volumes_root_omn22788.py -q --no-cov'
    cwd: .
