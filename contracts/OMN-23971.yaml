schema_version: 1.0.0
ticket_id: OMN-23971
title: 'Hold checks answer from the shared record, with a logged file fallback'
summary: The pause check's question, whether a hold in force applies to a pull request, is decided by a new effect node from the holds lines of the bus-fed query node read through the moved ledger reader. A hold only in the database answers HELD, a failed read is UNDECIDED and never CLEAR, and an answer from the file is stamped source=file-fallback until the overlay retires it. The moved reader also asks for open rulings by ticket. No bound is changed and nothing is muted.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23971-hold-verdict-from-the-projection
  statement: A hold verdict is decided from the bus-fed projection, never CLEAR after a failed read, with the file fallback logged and retirable by overlay.
  acceptance:
  - id: AC1
    statement: 'AC1: a hold that exists only in the database answers HELD through the reader and the hold verdict node. -- falsifier: uv run pytest tests/unit/nodes/node_ledger_hold_verdict_effect -k only_in_the_database_state'
  - id: AC2
    statement: 'AC2: a failed database read answers UNDECIDED and never CLEAR. -- falsifier: uv run pytest tests/unit/nodes/node_ledger_hold_verdict_effect -k "database_fault or unreadable"'
  - id: AC3
    statement: 'AC3: an answer from the file is logged with source=file-fallback, and an overlay that retires the fallback makes it UNDECIDED. -- falsifier: uv run pytest tests/unit/nodes/node_ledger_hold_verdict_effect -k "file_fallback or retired"'
  - id: AC4
    statement: 'AC4: a moved reader answers open rulings from the query node and refuses an open-rulings read with no ticket. -- falsifier: uv run pytest tests/unit/nodes/node_work_ledger_reader_effect/test_reader_open_rulings.py'
  - id: AC5
    statement: 'AC5: integrated: on a lab host running the merged revision, the hold verdict command reads the running bus and prints a log line with source=node. -- falsifier: run python -m omnimarket.nodes.node_ledger_hold_verdict_effect --pr omnimarket#1 --lane ledger-cut-a-5930 on the lab host and read stderr for source=node, with one event in its journal'
evidence_requirements:
- kind: tests
  description: The hold verdict golden, error and failing-control tests, the reader seam test and the open-rulings reader tests.
  command: uv run --frozen pytest tests/unit/nodes/node_ledger_hold_verdict_effect tests/unit/nodes/node_work_ledger_reader_effect -q --no-cov
