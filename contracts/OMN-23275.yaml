schema_version: 1.0.0
ticket_id: OMN-23275
title: The running-vs-merged fold-absence read lives in omnimarket node_silent_failure_alarm_compute
summary: A host-drift fleet fold that does not exist is a declaration question. The running-vs-merged decision names the hosts that declare the host-drift unit and whether the reading host is one of them, instead of a bare missing-file error. The read is ported from an internal tooling pull request (OMN-17427), whose unit, manifest, installer and ticket words ride on the request.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23275-fold-absence
  statement: With the fleet fold absent and a fold-absence fact on the request, the running-vs-merged decision is UNKNOWN with a finding that names the declaring hosts and a fix that exists on the host it names; without the fact it keeps the file error.
  acceptance:
  - id: AC1
    statement: "AC1: the fold-absence read lives in omnimarket node_silent_failure_alarm_compute with tests that fail when the read is removed and pass with it -- falsifier: uv run pytest tests -q -k fold_absence in the omnimarket clone, run once with the read stubbed out (fails) and once on main (passes)"
evidence_requirements:
- kind: tests
  description: The silent-failure alarm compute node tests at the pushed head.
  command: uv run --frozen pytest tests/nodes/node_silent_failure_alarm_compute -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
- id: dod-omn23275-fold-absence
  description: With the fold absent the decision names the declaring host, the declaring-host-without-plist case names the installer, the installed-but-silent case reads its own run, and the nobody-declares case names the ticket. With the read stubbed out, four of these six tests fail.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_silent_failure_alarm_compute -q --no-cov -n 0 -p no:randomly -k fold_absence
    cwd: .
- id: dod-omn23275-caller-fact
  description: The caller builds the fold-absence fact in omnimarket. With the fold file absent and the host-drift declaration overlay read, the request carries the declaring hosts, whether the reading host is one and whether its plist is installed, and the real decision handler turns each of the four cases into its finding. With the declaration withheld, a path that is not a missing file, or a fold that exists, the request carries no fact. With the absence build stubbed out, four of the ten tests fail.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_silent_failure_alarm_effect -q --no-cov -n 0 -p no:randomly -k fold_absence
    cwd: .
- id: dod-omn23275-integration-proof
  description: The pushed head ran the silent-failure alarm compute node tests on a lab host through the lab work runner and exited 0. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23275 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_silent_failure_alarm_compute -q --no-cov
    cwd: .
