schema_version: 1.0.0
ticket_id: OMN-24006
title: The lab code step ends itself with a record and retries a request that never started
summary: The delegated code edit loop retries a delegate turn that never started in process and keeps the rest of its turns in process, and ends itself with a receipt when its wall budget cannot fit another turn, so a lane that sets a time limit gets a record instead of a SIGKILL with none.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24006-code-step-ends-with-record
  statement: A lab code step that runs out of its wall budget ends with a loop receipt, and a turn that never started is retried in process; a request with no wall budget behaves as before.
  acceptance:
  - id: AC1
    statement: 'AC1: a delegate turn whose receipt reads queued_not_started is retried once in process, and the later turns of that loop go straight in process -- falsifier: uv run pytest tests/unit/delegated_code_edit/test_loop_ports.py -q -n 0 --no-cov -p no:cacheprovider -k never_started'
  - id: AC2
    statement: 'AC2: a code edit loop whose next turn cannot finish inside its wall budget ends itself with a receipt (status budget_exhausted, the changed paths named) instead of being ended with none, and a request with no wall budget behaves as before -- falsifier: uv run pytest tests/nodes/node_delegated_code_edit_orchestrator/test_wall_budget.py -q -n 0 --no-cov -p no:cacheprovider'
  - id: AC3
    statement: 'AC3: the option --wall-budget-s of onex code-edit run reaches the loop request, an overlay key supplies it when the option is absent, and an absent overlay key leaves no limit -- falsifier: uv run pytest tests/unit/cli/test_cli_code_edit_wall_budget.py -q -n 0 --no-cov -p no:cacheprovider'
  - id: AC4
    statement: 'AC4: integrated: one real lane code step on a lab host, run on the changed loop, answers within its budget and leaves a loop receipt -- falsifier: read the lane''s delegation receipt for the step (delegation_step.py cells) and the loop_receipt.json under the runs root of that host; a receipt reading ''timeout after'' with turns 0 fails this criterion'
evidence_requirements:
- kind: tests
  description: The loop ports, the wall budget and the CLI wall budget tests pass at the pushed head.
  command: uv run pytest tests/unit/delegated_code_edit/test_loop_ports.py tests/nodes/node_delegated_code_edit_orchestrator/test_wall_budget.py tests/unit/cli/test_cli_code_edit_wall_budget.py -q -n 0 --no-cov -p no:cacheprovider
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
