---
schema_version: "1.0.0"
ticket_id: "OMN-26657"
title: "Prometheus and Grafana show every lab host's health on one page: first slice, the installer node, two hosts"
summary: "A host observability installer node renders Prometheus, alert rules and one Grafana page from settings and the lab_hosts table, installs the containers through the container unit installer node, and reads back every lab_hosts row's reading age from Prometheus. First slice: AC1 and AC3 for two hosts, with AC5 for the installer. AC2 and AC4 are not met by this slice."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn26657-readback
  statement: "Every lab_hosts row is read back from Prometheus with its reading age, and a row with no target up or a reading older than the declared bound is named."
  acceptance:
  - id: AC1
    statement: 'AC1: every lab host in the lab_hosts settings, and the orchestrating Mac, reports CPU, load, memory, swap, disk and inode use, and GPU memory where it has one, at most 60 seconds old -- falsifier: a host in lab_hosts with no target up'
- id: req-omn26657-one-page
  statement: "One Grafana page shows all hosts, the failed services and the oldest reading, with the read time on it."
  acceptance:
  - id: AC3
    statement: 'AC3: one Grafana page shows all hosts, the failed services and the oldest reading, with the read time on it -- falsifier: stopping one exporter leaves the page unchanged after 3 minutes'
- id: req-omn26657-installed-from-settings
  statement: "The services are installed through the container unit installer from settings, with no address, port or path literal in code, and retention bounded."
  acceptance:
  - id: AC5
    statement: 'AC5: the services are installed through the host installer node from settings, with no address, port or path literal in code, and retention bounded -- falsifier: a hand-started container or a literal host address in the change'
evidence_requirements:
- kind: tests
  description: Rendering, install, readback and the no-literal check of the host observability installer node.
  command: uv run pytest tests/nodes/node_host_observability_install_effect -q -n 0 --no-cov -p no:cacheprovider
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn26657-ac1
  description: 'AC1 (readback half): the readback names READ, STALE, DOWN and NO TARGET for each lab_hosts row and exits non-zero unless every row reads fresh.'
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_host_observability_install_effect/test_observability_install.py -k readback -q -n 0 --no-cov -p no:cacheprovider
    cwd: .
- id: dod-omn26657-ac3
  description: 'AC3 (page half): the rendered dashboard carries the read time, the oldest reading and the failed services panels.'
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_host_observability_install_effect/test_observability_install.py::test_dashboard_shows_read_time_oldest_reading_and_failed_services -q -n 0 --no-cov -p no:cacheprovider
    cwd: .
- id: dod-omn26657-ac5
  description: 'AC5: the install runs the container unit installer per unit from the overlay, the source holds no address or host path literal, and the retention bounds are rendered into the Prometheus command.'
  source: manual
  binds_ac:
  - AC5
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_host_observability_install_effect/test_observability_install.py -k "install or literal or container_unit_overlay" -q -n 0 --no-cov -p no:cacheprovider
    cwd: .
- id: dod-omn26657-integration-proof
  description: 'Integration proof on a live surface: the node suite at the pushed head runs on a lab host and exits 0. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.'
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-26657 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_host_observability_install_effect -q --no-cov
    cwd: .
