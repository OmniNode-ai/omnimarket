schema_version: 1.0.0
ticket_id: OMN-22855
title: The fill's own tick unit (the orchestrator installs its own systemd user timer) and the prompt-submit hook entry
summary: node_floor_fill_orchestrator renders, installs and removes its own systemd user timer (schedule install|uninstall|status|run-now) that runs the node through its runtime module, the dispatch venv's interpreter on `omnimarket.nodes.node_floor_fill_orchestrator.runtime_floor_fill_orchestrator --overlay-json <the overlay's floor_fill section> --this-host <floor_fill.host_id> tick`, every floor_fill.tick_interval_seconds; the host must be an available row of the lab host table. The prompt-submit hook entry in the omni plugin is the same module's `lines` command.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn22855-floor-fill-tick-unit
  statement: 'The fill owns its schedule: the node renders and installs the unit that runs its own tick at the overlay''s interval on the overlay''s host, and the hook entry is its runtime module''s `lines` command.'
  acceptance:
  - id: AC1
    statement: 'AC1: The unit runs exactly `<dispatch venv>/bin/python -m omnimarket.nodes.node_floor_fill_orchestrator.runtime_floor_fill_orchestrator --overlay-json <the overlay''s floor_fill section as JSON> --this-host <floor_fill.host_id> tick` on the overlay''s host at the overlay''s interval: two overlay values give two rendered intervals, a key left out is refused naming it, and an overlay naming a host that is not an available row of the lab host table is refused naming `floor_fill.host_id` -- falsifier: `-k floor_fill_schedule_interval_from_overlay`, `-k floor_fill_schedule_exec_is_the_runtime_module_form`, `-k floor_fill_schedule_missing_key_refused` and `-k floor_fill_schedule_host_must_be_available`, over `schedule install --dry-run`; the dry-run render on the host in the lab step equals the installed unit.'
  - id: AC2
    statement: 'AC2: Nothing outside the permitted places changes. The omnimarket PR''s changed files are all under `src/omnimarket/nodes/node_floor_fill_orchestrator/`; the sibling plugin PR''s are `plugins/omni/hooks/hooks.json` and its test. No file is named `throughput_tick`, `queue_status`, `hook.sh` or `onex_remote_lane` and no path is outside those places. Falsifier: `-k no_script_edit`, which lists each PR''s changed files and fails on a match or a path outside those places.'
  - id: AC3
    statement: 'AC3: The hook entry is the node''s plain runtime-module command: the entry''s command string equals `"${OMNI_HOME}/.onex-dispatch-venv/bin/python" -m omnimarket.nodes.node_floor_fill_orchestrator.runtime_floor_fill_orchestrator --overlay-json "${ONEX_FLOOR_FILL_OVERLAY_JSON}" --this-host "${ONEX_LEDGER_HOST_NAME}" lines` exactly and contains no `bash`, `sh -c`, `|`, `;`, `$(`, backtick, `run-node` or `python3`, and `python` only once, in the interpreter path -- falsifier: `-k hook_entry_plain_node_command`.'
  - id: AC4
    statement: 'AC4: The entry prints the stored lines, the stale line and the absent line as T13 criterion 10 says, and an orchestrator that does not answer makes it print `UNKNOWN floor-fill-unreachable` and exit 75 -- falsifier: `-k lines_entry_prints_stored_answer` and `-k lines_entry_unreachable_prints_diagnostic`.'
evidence_requirements:
- kind: tests
  description: The focused tests of the floor fill orchestrator node.
  command: uv run pytest src/omnimarket/nodes/node_floor_fill_orchestrator -q --no-cov --tb=line
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn22855-ac1
  description: 'AC1: two overlay intervals render two timers, a missing key and a host that is not an available lab host row are refused naming the key, and the installed unit equals the dry-run render.'
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest src/omnimarket/nodes/node_floor_fill_orchestrator -q --no-cov --tb=line -k "floor_fill_schedule or floor_fill_runtime"
    cwd: .
- id: dod-omn22855-ac2
  description: 'AC2: the commits of this pull request change only files under the node directory, and the checker fails on each forbidden name and on a stray path.'
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest src/omnimarket/nodes/node_floor_fill_orchestrator -q --no-cov --tb=line -k "no_script_edit"
    cwd: .
- id: dod-omn22855-ac3
  description: 'AC3: the entry''s exact command string is asserted in the sibling plugin pull request''s test; here the runtime module answers that command, `lines`, from another host by forwarding and relaying, and refuses an empty or unreadable overlay JSON with a named line.'
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest src/omnimarket/nodes/node_floor_fill_orchestrator -q --no-cov --tb=line -k "lines_entry_prints_stored_answer"
    cwd: .
- id: dod-omn22855-ac4
  description: 'AC4: the stored, stale and absent lines, and the unreachable diagnostic with exit 75.'
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run pytest src/omnimarket/nodes/node_floor_fill_orchestrator -q --no-cov --tb=line -k "lines_entry_prints_stored_answer or lines_entry_unreachable_prints_diagnostic"
    cwd: .
- id: dod-omn22855-integration-proof
  description: The focused node tests exit 0 on a lab host through lab-run, and the dry-run render on the fill host equals the installed unit. The hosted verifier cannot dispatch lab work, so this unbound check belongs to the local Done gate.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-focused-22855 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest src/omnimarket/nodes/node_floor_fill_orchestrator -q --no-cov
    cwd: .
- id: dod-omn22855-deploy-probe
  description: 'Deploy probe: GitHub serves the schedule handler at the checked-out commit. The probe fails before the handler exists and runs on the hosted verifier with GitHub access.'
  source: manual
  checks:
  - check_type: command
    check_value: 'bash -o pipefail -c ''curl --fail --silent --show-error --header "Authorization: Bearer ${GH_TOKEN:?}" --header "Accept: application/vnd.github.raw+json" "https://api.github.com/repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_floor_fill_orchestrator/handlers/handler_floor_fill_schedule.py?ref=$(git rev-parse HEAD)" | grep -q "class HandlerFloorFillSchedule"'''
    cwd: .
