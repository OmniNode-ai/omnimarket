schema_version: 1.0.0
ticket_id: OMN-22124
title: 'node_lab_placement_compute: a lane takes the class of its repository, and a plugin parity read ignores the .orphaned_at marker'
summary: The lab placement node gains two pure operations whose rules are its contract's data, lane_priority (declared class, then ticket, then repository, then other, with the holdback and the no-free-slot refusal) and plugin_parity (an installed plugin tree against its shipped revision, leaving out the runtime markers .in_use and .orphaned_at directly under the install path).
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn22124-lane-class-and-orphan-marker
  statement: Placement charged an omnibase_infra lane to other and refused it PRIORITY-HOLDBACK with a slot free, and refused a pinned lane PARITY-FAILED for the .orphaned_at file.
  acceptance:
  - id: AC1
    statement: 'AC1: a lane whose repository the placement contract lists as mvp-landing takes the mvp-landing class when no --priority-class is given, so its holdback share is not charged to it as other -- falsifier: uv run pytest tests/nodes/node_lab_placement_compute -q -k priority_class_of_repo'
  - id: AC2
    statement: 'AC2: a plugin parity read ignores the .orphaned_at marker so a pinned lane is not refused PARITY-FAILED for it -- falsifier: uv run pytest tests/nodes/node_lab_placement_compute -q -k orphan_marker'
  - id: AC3
    statement: 'AC3: a regression test built from the incident''s recorded data (fixture path tests/nodes/node_lab_placement_compute/fixtures/no_host_1102) fails on the broken code and passes on the fix, with the slots=0 refusals as negative controls that still refuse -- falsifier: uv run pytest tests/nodes/node_lab_placement_compute -q'
  - id: AC4
    statement: 'AC4: the fixed placement is installed and running on a lab host, and a lane dispatched for omnibase_infra with one free slot held for mvp-landing is placed, recorded as installed=host:revision with observed=what ran -- falsifier: the next remote-lane receipt for an omnibase_infra lane names a host and not no-host'
evidence_requirements:
- kind: tests
  description: The node's focused suite.
  command: uv run pytest tests/nodes/node_lab_placement_compute -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
