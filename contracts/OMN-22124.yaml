  description: AC1 an omnibase_infra lane with no declared class takes mvp-landing and is not held back.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_lab_placement_compute -q --no-cov --tb=line -k priority_class_of_repo
    cwd: .
- id: dod-omn22124-ac2
  description: AC2 the .orphaned_at file directly under the install path is left out of the plugin tree comparison.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_lab_placement_compute -q --no-cov --tb=line -k orphan_marker
    cwd: .
- id: dod-omn22124-ac3
  description: AC3 the incident fixture tests pass, with the no-free-slot refusals as negative controls.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_lab_placement_compute -q --no-cov --tb=line
    cwd: .
- id: dod-omn22124-ac4
  description: AC4 the remote-lane runner asks this node for the lane's class. Runs only at the local Done gate on a host that has the registry; it fails until the runner is wired to the node.
  source: manual
  binds_ac:
  - AC4
  execution_scope: local_done_gate
  checks:
