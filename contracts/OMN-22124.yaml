    check_value: grep -lF HandlerLabLanePriority "$OMNI_HOME"/*/plugins/omni/skills/remote-lane/scripts/onex_remote_lane.py
    cwd: .
- id: dod-omn22124-deploy-probe
  description: 'Deploy probe: the contract GitHub serves at the checked-out commit names the node.'
  source: manual
