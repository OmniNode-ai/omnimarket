schema_version: 1.0.0
ticket_id: OMN-22263
title: 'T4 first slice: rubric data, ROUTE parse, rules, brief strata, unit cell, report and the local-only lab-model fallback'
summary: Adds the work-classification models, the work-type rubric and run-style rules as data, three nodes (route line parse compute, work classify compute, work intent classify effect), and the fixtures
  that prove them. The orchestrator, the projection reducer with its migration, the profile parity falsifier, the sample over real units and the lab step are not in this pull request; the ticket stays open.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-t4-first-slice
  statement: Rules, parse, fallback and unit cell as listed in the acceptance statements; AC9 and AC13 are not claimed here.
  acceptance:
  - id: AC1
    statement: 'AC1: the ROUTE line parse returns band, score and seven dimensions with the score equal to their sum, refuses a differing score naming the field, and a rubric id the enum lacks fails the
      load naming the id -- falsifier: the tests fail on the base branch and pass on the branch.'
  - id: AC2
    statement: 'AC2: the enum and the rubric''s declared ids are equal sets -- falsifier: delete one id from either; the load test fails naming it.'
  - id: AC3
    statement: 'AC3: no number, threshold or id list appears in handler code -- falsifier: the literal scan over the handlers is empty and a planted literal is reported.'
  - id: AC4
    statement: 'AC4: rule-set precision on the labelled sample is at least the bar overall and per kept rule -- falsifier: a planted wrong rule drops precision and the load refuses the rubric.'
  - id: AC5
    statement: 'AC5: the lab-model step is reachable only for undetermined -- falsifier: a unit decided by a rule produces no delegation request.'
  - id: AC6
    statement: 'AC6: the route is local-only -- falsifier: an overlay naming a cloud backend is refused at load naming the key, and the request log holds no host outside the declared lab hosts.'
  - id: AC7
    statement: 'AC7: no prompt text is in any projection -- falsifier: a fixture prompt containing a unique token is absent from every result.'
  - id: AC8
    statement: 'AC8: an existing classifier is a rule input only if its measured precision reaches the bar -- falsifier: below the bar it is excluded and the exclusion is a recorded result.'
  - id: AC10
    statement: 'AC10: every model is frozen with no default for a fact the source may lack -- falsifier: a unit without a ROUTE line carries route None, not a default band.'
  - id: AC11
    statement: 'AC11: identical inputs give one stored fallback result -- falsifier: sequential and concurrent calls store one work type and a different second result is refused and counted.'
  - id: AC12
    statement: 'AC12: a lane whose later session ran on a different model keeps the root session''s cell -- falsifier: a Sonnet root and an Opus second session land in the Sonnet cell and add the second
      session''s tokens.'
