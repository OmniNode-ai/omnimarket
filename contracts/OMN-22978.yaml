schema_version: 1.0.0
ticket_id: OMN-22978
title: "Piece 16's first task: the J15 join test: a delegated result and its cost land in the eval corpus through a corpus reader, golden and error"
summary: A new node, node_eval_corpus_reader_effect, holds the corpus reader and the J15 join handler. A delegated result and its cost row are written to the eval corpus and read back through the corpus reader; a result with no cost row is written typed missing and the read lists it, so nothing is dropped; a corpus that does not return a joined run is a typed failure. The handler answers piece 16 on the floor's emission contract under piece 15's correlation id, so the floor's own receipt fold reads the pair as golden and error. The corpus is in memory by default and a JSON-lines journal by overlay. The sources of the join are ports; their real adapters and the running wiring on the dev bus are not part of this change.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
