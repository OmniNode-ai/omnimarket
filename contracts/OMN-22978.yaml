- id: req-omn22978-j15-join
  statement: A delegated result and its cost land in the eval corpus through a corpus reader, with a golden and an error case.
  acceptance:
  - id: AC1
    statement: "AC1: golden join test: a delegated result and its cost appear in the eval corpus read by the corpus reader -- falsifier: uv run --frozen pytest tests/unit/nodes/node_eval_corpus_reader_effect/test_join_j15.py -q --no-cov -n 0 -p no:randomly -k golden"
  - id: AC2
    statement: "AC2: error join test: a result with no cost row is typed missing in the corpus and no silent drop occurs -- falsifier: uv run --frozen pytest tests/unit/nodes/node_eval_corpus_reader_effect/test_join_j15.py -q --no-cov -n 0 -p no:randomly -k error"
