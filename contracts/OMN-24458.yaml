    check_value: uv run pytest tests/unit/projection/test_omn24458_windowed_read_and_page_cache.py -k "w1 or w2 or w6" -q -n 0 --no-cov -p no:cacheprovider
    cwd: .
- id: dod-omn24458-ac6
  description: 'AC6: a page is held for the contract expiry and recomputed after it.'
  source: manual
