schema_version: 1.0.0
ticket_id: OMN-24458
title: The projection query node reads one window of the history and holds the page in Valkey for a declared expiry
summary: A projection page read can carry a window (24h, 7d); the store read is bounded by it and by a row cap, and the page is held in the shared Valkey for the page_cache.ttl_seconds the node contract declares, with a Valkey outage served from the windowed read and said so in the answer.
is_seam_ticket: false
interface_change: true
interfaces_touched:
- public_api
requirements:
- id: req-omn24458-window-and-cache
  statement: A windowed projection read reads only rows inside the window, and a page is served from Valkey inside the contract's expiry.
  acceptance:
  - id: AC5
    statement: 'AC5: a window=7d request reads only rows inside the last 7 days and at most one page plus one row, and a window=24h request reads fewer rows than window=7d -- falsifier: uv run pytest tests/unit/projection/test_omn24458_windowed_read_and_page_cache.py -k "w1 or w2 or w6" -q'
  - id: AC6
    statement: 'AC6: a second request inside page_cache.ttl_seconds is served from the cache, a request after it is not, and the expiry is the contract value, not a literal in a handler -- falsifier: uv run pytest tests/unit/projection/test_omn24458_windowed_read_and_page_cache.py -k "c1 or c2" -q'
  - id: AC7
    statement: 'AC7: a Valkey that raises serves the windowed store read with cache.fallback true, never an empty or invented page -- falsifier: uv run pytest tests/unit/projection/test_omn24458_windowed_read_and_page_cache.py -k "c3 or c5" -q'
  - id: AC8
    statement: 'AC8: a page read after page_cache.ttl_seconds and inside page_cache.stale_seconds more is answered from the held page with cache.state stale and its age, without waiting for the store, and the store read that refreshes it runs behind the response -- falsifier: uv run pytest tests/unit/projection/test_omn24458_windowed_read_and_page_cache.py -k "s1 or s2" -q'
  - id: AC9
    statement: 'AC9: one page is refreshed by one store read across repeated stale reads and across runtimes (a claim in the shared Valkey), a failed refresh keeps the held page and releases the claim, and a page past the stale window is recomputed before it is answered -- falsifier: uv run pytest tests/unit/projection/test_omn24458_windowed_read_and_page_cache.py -k "s3 or s4 or s5 or s6" -q'
evidence_requirements:
- kind: tests
  description: The windowed read and page cache tests pass at the pushed head.
  command: uv run pytest tests/unit/projection/test_omn24458_windowed_read_and_page_cache.py -q -n 0 --no-cov -p no:cacheprovider
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
