  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/projection/test_omn24458_windowed_read_and_page_cache.py -k "c1 or c2" -q -n 0 --no-cov -p no:cacheprovider
    cwd: .
- id: dod-omn24458-ac7
