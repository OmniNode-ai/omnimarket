schema_version: 1.0.0
ticket_id: OMN-24301
title: Connect the scheduled ticket closer to its real readers and writer in the runtime
summary: 'node_ticket_closer_scheduled_effect was merged with in-memory defaults only: no schedule overlay exists and nothing builds its real candidate source, verifier or done writer, so in the dev runtime it
  refuses its overlay and never examines a ticket (read 2026-11-13T15:41Z by an earlier lane). This change adds the bound profile: when the schedule overlay names reading_source contract_clones, the handler builds the
  contract-clone candidate source, the DoD verifier reader and the ticket write node writer from overlay values, a ticket reader and a node-side ticket bus call, and the PR watcher open-pull-request source; a profile that
  cannot be built, or a source that cannot read, is reported in the run result with its reason and writes nothing.'
is_seam_ticket: true
interface_change: true
interfaces_touched:
- topics
requirements:
- id: req-omn24301-bound-closer
  statement: The scheduled closer binds its real readers and writer from its overlay, and every run reports why it read nothing.
  acceptance:
  - id: AC1
    statement: 'AC1: a schedule overlay for node_ticket_closer_scheduled_effect exists in the overlays repository with every value (interval, candidate limit, lane, audience, done state, reading source) and the handler binds the real candidate source, verifier and Done writer when the overlay names the bound profile -- falsifier: pytest tests/nodes/node_ticket_closer_scheduled_effect -q fails when the bound profile still builds the in-memory source'
  - id: AC2
    statement: 'AC2: with the bound profile, a verifier that cannot run, an unread candidate source and a refused ticket write each leave every ticket open and appear in the run result with their reason -- falsifier: the error chain test in tests/nodes/node_ticket_closer_scheduled_effect fails when the handler swallows a refusal'
  - id: AC3
    statement: 'AC3: integrated: in the dev runtime one scheduled run publishes a result event on the closer terminal topic naming each examined ticket, flips one eligible ticket to Done with the ticket state and the receipt read together, and refuses one with missing evidence -- falsifier: read the terminal topic on the dev lane and the ticket state after one run and find no event or no state change'
evidence_requirements:
- kind: tests
  description: The closer node's golden chain, error chain, failing-control, adapter, bound profile and seam tests pass at the pushed head.
  command: uv run pytest tests/nodes/node_ticket_closer_scheduled_effect -q -n 0 --no-cov -p no:cacheprovider
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24301-ac1
  description: 'AC1: the bound profile builds the contract-clone source, the DoD verifier reader and the ticket write node writer from overlay values and refuses by name when a value or the scope overlay is missing; the control shows a handler that ignored reading_source reporting the unread wording.'
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_ticket_closer_scheduled_effect/test_bound_profile.py tests/nodes/node_ticket_closer_scheduled_effect/test_overlay_reading_source.py -q -n 0 --no-cov -p no:cacheprovider
    cwd: .
- id: dod-omn24301-ac2
  description: 'AC2: an unread source, a ticket the reader could not read, an open-pull-request source that is stale and a ticket bus call that times out each leave every ticket open and are reported with a reason.'
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_ticket_closer_scheduled_effect/test_ticket_reader.py tests/nodes/node_ticket_closer_scheduled_effect/test_watcher_open_prs.py tests/nodes/node_ticket_closer_scheduled_effect/test_ticket_bus_call.py tests/nodes/node_ticket_closer_scheduled_effect/test_golden_chain_ticket_closer.py -q -n 0 --no-cov -p no:cacheprovider
    cwd: .
- id: dod-omn24301-ac3
  description: 'hosted proxy for AC3: the contract topics test and the ticket write seam test pass; the dev-runtime tick reading is taken after install and named in the pull request.'
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_ticket_closer_scheduled_effect/test_contract_topics.py tests/nodes/node_ticket_closer_scheduled_effect/test_seam_ticket_write.py -q -n 0 --no-cov -p no:cacheprovider
    cwd: .
- id: dod-omn24301-integration-proof
  description: the closer node's tests run on a lab host at the pushed head; hosted CI cannot reach the lab, so only the local Done gate runs this unbound check
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24301 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_ticket_closer_scheduled_effect -q --no-cov
