schema_version: 1.0.0
ticket_id: OMN-24505
title: The factory reads its own wiring and lists every mismatched connection
summary: A new compute node pins the checkouts of the code repositories and the settings repository, reads every node contract through the one topic reader, and reports nine kinds of mismatch at the seams between nodes with a count and the first ones of each kind. Every pattern, marker and directory is an overlay value.
is_seam_ticket: true
interface_change: true
interfaces_touched:
- topics
- public_api
requirements:
- id: req-omn24505-seam-graph-defects
  statement: node_seam_graph_defects_compute derives the defect table from the declared contracts, overlay rows, imports and handler sources of the pinned checkouts, with every class present at count zero when clean, and refuses an empty scan, a missing checkout and a bad marker pattern.
  acceptance:
  - id: AC1
    statement: 'AC1: the defect derivation returns all nine kinds in order with exact counts for one synthetic graph, and clearing each cause drops its kind to zero -- falsifier: uv run pytest tests/nodes/node_seam_graph_defects_compute/test_golden_chain_seam_graph_defects.py -q --no-cov -k "golden or failing_control"'
  - id: AC2
    statement: 'AC2: the facts loader reads topics through the one topic reader, counts a cross-repository import as covered only when the owning repository''s own tests name the module exactly, and refuses an unreadable contract list, a missing checkout, a non-directory and a bad marker pattern by name -- falsifier: uv run pytest tests/nodes/node_seam_graph_defects_compute/test_seam_graph_facts_loader.py -q --no-cov'
  - id: AC3
    statement: 'AC3: a seam test fails when the topic reader gains a topic shape the loader does not bucket, or when the node contract''s command, terminal or projection topics change shape -- falsifier: uv run pytest tests/nodes/node_seam_graph_defects_compute/test_seam_graph_facts_loader.py -q --no-cov -k seam'
  - id: AC4
    statement: 'AC4: every pattern, marker, scan directory and bound sits in the overlay, and the example overlay validates against the rule model -- falsifier: uv run pytest tests/nodes/node_seam_graph_defects_compute -q --no-cov -k "overlay"'
  - id: AC5
    statement: 'AC5: integrated: the scan command run in the dev runtime over the pinned checkouts returns the defect table with nine kinds on the completed event -- falsifier: read the completed event of the scan on the dev bus and find fewer than nine kinds or a zero node count'
evidence_requirements:
- kind: tests
  description: Golden, failing-control, error-chain and seam tests of the seam graph defects node
  command: uv run --frozen pytest tests/nodes/node_seam_graph_defects_compute -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24505-tests
  description: AC1 to AC4 proven by the named tests, which fail when the derivation, the import seam-test rule or the topic bucketing is broken (injected breaks named in the pull request); AC5 is read on a lab runtime and named in the pull request.
  source: manual
  binds_ac:
  - AC1
  - AC2
  - AC3
  - AC4
  - AC5
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_seam_graph_defects_compute -q --no-cov
    cwd: .
- id: dod-omn24505-deploy-conditions
  description: 'Deploy probe the hosted runner can run: the node contract at the checked-out commit declares its terminal topic; the line does not exist at the merge base, so the probe fails there.'
  source: manual
  checks:
  - check_type: command
    check_value: bash -o pipefail -c 'gh api "repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_seam_graph_defects_compute/contract.yaml?ref=$(git rev-parse HEAD)" --jq .content | base64 -d | grep -F "seam-graph-defects-completed.v1" > /dev/null'
    cwd: .
- id: dod-omn24505-integration-proof
  description: The node is run on a lab host at the pushed head over the pinned checkouts and the defect table is read; the reading is named in the pull request.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane seam-graph-6803 -- uv run --frozen pytest tests/nodes/node_seam_graph_defects_compute -q --no-cov
    cwd: .
