schema_version: "1.0.0"
ticket_id: OMN-23073
title: "The omnimarket converge step honors the deploy build lock so an off-lineage deploy on h201 does not fail"
summary: >
  node_canonical_clone_dirty_converge_effect declares the deploy agent's reconcile-host lock directories
  (build_lock_dirs) and the age past which a held lock is stale (build_lock_max_age_seconds). A tick leaves
  every clone alone, with status skipped, while one declared lock is held and younger than that age, so the
  canonical clone sync no longer hard-resets the build clone in the middle of an off-lineage image build.
  Installing the change on h201 and running an off-lineage deploy is the AC2 reading and is not part of the
  code change.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-converge-honors-build-lock"
    statement: |-
      The dirty-converge tick skips a clone while the deploy agent's build lock is held and younger than the declared age.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: a regression test built from the recorded failure (converge ignores the build lock) fails on dev and passes on the branch -- falsifier: uv run pytest of the converge build-lock test in omnimarket
  - id: "req-offlineage-deploy"
    statement: |-
      An off-lineage deploy on h201 reaches success with the change installed.
    acceptance:
      - id: "AC2"
        statement: |-
          AC2: an off-lineage deploy on h201 succeeds with the branch installed -- falsifier: the deploy-agent job for that deploy reaches status success (onex deploy-agent job read)
evidence_requirements:
  - kind: tests
    description: "A dirty or detached clone is skipped while a declared build lock is live; a lock past its declared age does not hold it"
    command: "uv run pytest tests/unit/clone_dirty_converge/test_canonical_clone_dirty_converge.py -q --no-cov -k build_lock"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-converge-build-lock-test
    description: "the build-lock cases of the dirty-converge test file pass on the branch; on dev the same cases fail (6 failed, 20 passed)"
    source: manual
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/unit/clone_dirty_converge/test_canonical_clone_dirty_converge.py -q --no-cov -k \"build_lock or image_build\""
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC1"]
  - id: dod-converge-offlineage-deploy
    description: "the deploy-agent job of an off-lineage deploy on h201 with the branch installed reaches status success; read after the install, recorded on the pull request"
    source: manual
    execution_scope: "local_done_gate"
    checks:
      - check_type: "command"
        check_value: "test -n \"$ONEX_DEPLOY_JOB_ID\""
        cwd: "."
    binds_ac: ["AC2"]
  - id: "dod-omn23073-deploy-assessment"
    description: "Deploy assessment: the change edits one effect node's contract declaration, model and handler; no new topic, migration or prod mutation. It reaches the runtime through the package on the next standard image rebuild and deploy cycle."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: "grep -q build_lock_dirs src/omnimarket/nodes/node_canonical_clone_dirty_converge_effect/contract.yaml"
        cwd: "."
