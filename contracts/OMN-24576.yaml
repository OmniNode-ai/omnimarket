schema_version: 1.0.0
ticket_id: OMN-24576
title: Install the machine principal grant audit timer on the lab host
summary: The machine principal grant audit of the dev lane's issuer was declared in the host drift record and in the automation liveness overlay and never installed, because no declared installer carried it. The marketplace now has a node that runs the existing audit from a timer tick, reading every path, container name, role and bound from its overlay, and the host installer registry declares the unit that installs it.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24576-grant-audit-node
  statement: A node runs the existing audit on the issuer container, returns a typed result and a distinct exit for drift and for an unreadable audit, and the registry installer declares the unit that installs its timer on the host.
  acceptance:
  - id: AC1
    statement: 'AC1: the grant audit node runs the existing audit on the lab host''s issuer container and returns a typed result with exit 0 for a clean audit, 1 for drift and 2 for an unreadable container or audit error -- falsifier: env -u PYTHONPATH uv run --frozen pytest tests/nodes/node_principal_grant_audit_effect -q --no-cov -n 0 -p no:randomly fails at the merge base because the node does not exist'
  - id: AC2
    statement: 'AC2: every path, name, role and timeout comes from the node overlay and a document with a stray, blank or mistyped key is refused -- falsifier: env -u PYTHONPATH uv run --frozen pytest tests/nodes/node_principal_grant_audit_effect/test_overlay.py tests/unit/models/test_node_overlay_documents_omn22478.py -q --no-cov -n 0 -p no:randomly'
  - id: AC3
    statement: 'AC3: the registry installer declares the unit principal-grant-audit-systemd with label onex-principal-grant-audit and a 900 second interval -- falsifier: env -u PYTHONPATH uv run --frozen pytest tests/nodes/node_host_installer_registry_units/test_principal_grant_audit_unit.py -q --no-cov -n 0 -p no:randomly'
evidence_requirements:
- kind: tests
  description: The node, unit declaration and overlay document tests at the pushed head; at the merge base the node does not exist so each fails at import.
  command: env -u PYTHONPATH uv run --frozen pytest tests/nodes/node_principal_grant_audit_effect tests/nodes/node_host_installer_registry_units/test_principal_grant_audit_unit.py tests/unit/models/test_node_overlay_documents_omn22478.py -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn-24576-ac1
  description: 'Golden chain: a clean audit is status ok and exit 0, drift with MISSING lines is exit 1; error chain: an unreadable container runs no audit and exits 2, audit exit 2, 124 and 127 and an empty audit exit 2; failing control: EXTRA lines with exit 0 stay ok.'
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_principal_grant_audit_effect/test_principal_grant_audit_effect.py tests/nodes/node_principal_grant_audit_effect/test_golden_chain_principal_grant_audit_effect.py tests/nodes/node_principal_grant_audit_effect/test_tick.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn-24576-ac2
  description: 'Error chain: an unreadable, wrong-keys, blank, bool or non-positive timeout overlay is refused with the source named and exit 3 from the tick.'
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_principal_grant_audit_effect/test_overlay.py tests/unit/models/test_node_overlay_documents_omn22478.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn-24576-ac3
  description: The unit declaration renders the module, overlay root, probe and the 900 second interval.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_host_installer_registry_units/test_principal_grant_audit_unit.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn-24576-integration-proof
  description: The pushed head's tests ran on a lab host and exited 0. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check; the install and one tick on h201 are read there after merge.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24576 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_principal_grant_audit_effect tests/nodes/node_host_installer_registry_units/test_principal_grant_audit_unit.py -q --no-cov -p no:randomly
    cwd: .
