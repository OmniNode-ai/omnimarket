schema_version: 1.0.0
ticket_id: OMN-24059
title: The ledger rows loader's per-machine settings become a service step in the market repository
summary: The plugin's shared ledger readers took the rows loader command from an environment variable a person set on each machine. node_ledger_rows_loader_settings_effect resolves it instead from the machine's row of the ledger_rows_loader_hosts overlay, with the call bound and the loader overlay's file fallback flag, found under the overlay roots through node_overlay_reader (so the one overlay root resolver's answer is the roots). A host with no row is host-row-missing; a missing or malformed overlay is refused with the overlay and the fields named; no source supplies a default command. The reader falls back to the file only when the loader overlay allows it. The plugin's drain_map calls the node through the dispatch venv with --run, which runs the host's loader and answers by exit code whether the reader may read the file (a separate pull request).
is_seam_ticket: true
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24059-loader-settings
  statement: A reader that needs the ledger rows loader on a machine gets its command, bound and fallback flag from overlays, and a missing or malformed overlay is a named refusal, never a default.
  acceptance:
  - id: AC1
    statement: 'AC1: a market-repository service step resolves a machine''s loader command, its call bound and the file-fallback flag from the loader overlay and the hosts overlay found under the overlay roots, and refuses a missing or malformed overlay by naming it. -- falsifier: run the step''s golden chain and error chain tests in the market repository and read the 21 cases (the plugin patch carries the same cases as tests/test_ledger_rows_loader_settings_node.py)'
  - id: AC2
    statement: 'AC2: the plugin''s drain_map.load_rows calls the step through the dispatch environment, grows by no code line, and reads the file only when the overlay allows it, counting each fallback with its reason. -- falsifier: uv run pytest plugins/omni/skills/merge-drain/tests/test_load_rows_bus.py with the loader stubbed out and the overlay flag set to false, which must raise with the reason'
  - id: AC3
    statement: 'AC3: integrated: a queue status run on the operator Mac prints the ledger line source=node and fallback_count=0. -- falsifier: run queue_status.py on the Mac with ONEX_LEDGER_ROWS_LOADER_COMMAND unset and read its ledger line'
evidence_requirements:
