schema_version: 1.0.0
ticket_id: OMN-22546
title: Restore the cwd line that git's union dropped from three dod entries on omnimarket dev
summary: Three test_passes checks in contracts/OMN-19998.yaml lost their cwd line when omnimarket#5078, #5103 and #5112 merged; the closer binding rule no-cwd refuses a command check that names no working directory.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn22546-restore-cwd
  statement: The three dod entries of the shared contract name their working directory again, and a test holds it.
  acceptance:
  - id: AC1
    statement: 'AC1: the three named entries carry cwd . on every check on dev after the merge -- falsifier: uv run --frozen pytest tests/contracts/test_omn19998_check_cwd.py -q --no-cov'
  - id: AC2
    statement: 'AC2: the same test fails on dev 31481f690 with the test file overlaid, so it binds the restored lines and nothing else -- falsifier: uv run --frozen pytest tests/contracts/test_omn19998_check_cwd.py -q --no-cov run in a worktree of 31481f690 exits non-zero'
evidence_requirements:
- kind: tests
  description: The three dod entries name their working directory
  command: uv run --frozen pytest tests/contracts/test_omn19998_check_cwd.py -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn22546-cwd-restored
  description: Reads contracts/OMN-19998.yaml and requires cwd . on every check of dod-omn19998-lane-failure-runtime, dod-omn19998-automatic-fix-install-deploy and dod-omn19998-brief-frozen-destinations-deploy. The test fails on the merge base, where the three lines are missing.
  source: manual
  binds_ac:
  - AC1
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/contracts/test_omn19998_check_cwd.py -q --no-cov
    cwd: .
- id: dod-omn22546-integration-proof
  description: Run this pull request's own check on a lab host at the pushed head. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-22546 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/contracts/test_omn19998_check_cwd.py -q --no-cov
    cwd: .
