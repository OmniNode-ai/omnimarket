schema_version: 1.0.0
ticket_id: OMN-22959
title: The daily baselines route shows a timestamped command, a correlated runtime result and a comparison receipt, and a planted regression publishes NOT WORKING
summary: A pure compare node takes one scheduled baseline run (the timestamped command, the runtime result that answers it, the frozen baseline), compares counts before times, and publishes a receipt that reads WORKING, NOT WORKING or UNKNOWN. A worse count or time, a metric the run did not report, a result that does not answer the command, or no result by its deadline reads NOT WORKING and carries one cause-lane request keyed to the run. This pull request adds the node and its falsifier tests. It does not add the schedule that sends the command, the runtime that answers it, or the consumer of the cause-lane request topic.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn22959-receipt
  statement: A scheduled baseline run produces a comparison receipt that holds the command's timestamp, the correlated runtime result and the comparisons, counts before times, and a planted worse count or time reads NOT WORKING with a cause-lane request.
  acceptance:
  - id: AC1
    statement: 'AC1: a scheduled baseline run shows the command timestamp, the correlated runtime result and a comparison receipt, counts compared before times -- falsifier: uv run pytest src/omnimarket/nodes/node_workflow_baseline_compare_compute -q -k scheduled_route_receipt'
  - id: AC2
    statement: 'AC2: a planted worse count or time against the frozen baseline publishes NOT WORKING and opens a cause lane -- falsifier: uv run pytest src/omnimarket/nodes/node_workflow_baseline_compare_compute -q -k planted_regression'
evidence_requirements:
- kind: tests
  description: The compare node's scheduled-route-receipt and planted-regression tests, with the golden and error chain tests of the node.
  command: uv run pytest src/omnimarket/nodes/node_workflow_baseline_compare_compute tests/nodes/node_workflow_baseline_compare_compute -q
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
