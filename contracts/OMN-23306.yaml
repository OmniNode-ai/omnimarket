schema_version: 1.0.0
ticket_id: OMN-23306
title: "A start-path census and refusal drill node runs and writes its reading, and the admission effect keeps an observe log"
summary: A new effect node, node_start_path_drill_effect, holds the census of every start path (the plan's nine and the six the second reader names, each with a binding of bound, unbound or dead) and drives, on a test gate store in enforce mode, a planted start on a stopped piece (it must be refused) and a control start on an open piece (it must be admitted) through the start-admission effect for each path. It writes one reading row with the census size, the bindings and the count refused and admitted, and a daily systemd user timer runs it on a lab host. The start-admission effect gains a ledger adapter of its log port, so every admission decision is one observe-log row, and a drill tag on the request, the log row and the result. No start path calls the effect yet; each path binds in its own change.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23306-start-path-drill
  statement: A census and refusal drill node reads every start path and writes one reading, and the admission effect keeps an observe log of every decision.
  acceptance:
  - id: AC1
    statement: "AC1: a census and refusal drill node enumerates every start path, drives a refused start through each, and writes one reading with the count refused and admitted -- falsifier: uv run pytest tests -q -k start_path_drill in omnimarket, failing with a start path left out of the census"
  - id: AC2
    statement: "AC2: the admission effect appends one observe-log row per admission decision, and after install the drill's reading and the observe log are read on the running system -- falsifier: the ledger shows the drill's reading row and observe-log rows after one scheduled run"
evidence_requirements:
- kind: tests
  description: The acceptance tests of this ticket at the pushed head.
  command: uv run --frozen pytest tests/nodes/node_start_path_drill_effect tests/nodes/node_start_admission_effect -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
- id: dod-omn23306-census-and-drill
  description: The census holds the 15 declared start paths, the drill refuses a planted start on each and admits a control start on each, and the reading row carries the counts; a path left out of the census, a gate that admits everything, a gate that refuses everything and an observe log that takes no rows each turn the reading NOT WORKING.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_start_path_drill_effect -q --no-cov -n 0 -p no:randomly -k start_path_drill
    cwd: .
- id: dod-omn23306-observe-log
  description: The admission effect appends one STATUS row to the ledger per decision, tagged drill when the request is a drill, and keeps a row the ledger did not take.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_start_admission_effect -q --no-cov -n 0 -p no:randomly -k observe_log
    cwd: .
- id: dod-omn23306-integration-proof
  description: The pushed head ran the drill and start-admission tests on a lab host through the lab work runner and exited 0. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: 'uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23306 -- uv run --frozen pytest tests/nodes/node_start_path_drill_effect tests/nodes/node_start_admission_effect -q --no-cov -n 0 -p no:randomly'
    cwd: .
- id: dod-omn23306-deploy-source-read
  description: The pushed branch carries the start-path drill handler class. Read live from GitHub at the branch head, so it fails if the handler is missing from the pushed source.
  source: manual
  checks:
  - check_type: command
    check_value: gh api "repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_start_path_drill_effect/handlers/handler_start_path_drill.py?ref=omn-23306-start-path-drill" --jq .content | base64 -d | grep -c 'class HandlerStartPathDrill' | grep -qv '^0$'
    cwd: .
