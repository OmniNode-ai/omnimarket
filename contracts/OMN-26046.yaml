schema_version: 1.0.0
ticket_id: OMN-26046
title: The delegation check node's customer machine runs the C13 delegation and the C14 routing walk in a clean install
summary: CleanInstallCustomerMachine run_delegation and collect_routing install the guide's own line in a clean tool environment, run one real onex delegate behind an in-path egress recorder, walk the routing of every customer-visible task class through the installed reducer's helpers, and return what grade_c13 and grade_c14 read. Every host, model and window comes from the responder row's chain; a failed install reads FAIL and an instrument that did not run reads PRECONDITION-ABSENT.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn26046-c13-c14-collector
  statement: The customer machine of the delegation check node collects the delegation observation and the routing collection for C13 and C14 from a clean install, so neither check reads PRECONDITION-ABSENT for want of a collector.
  acceptance:
  - id: AC3
    statement: 'AC3: a known good run (the local model answers and the chain ends) passes C13 and C14, and a known bad one (a wrong expected model, an external connect recorded) fails -- falsifier: a grader clause that passes on the bad observation'
  - id: AC4
    statement: 'AC4: the collector takes every host, model and window from the responder chain and runs the install, the delegation and the routing walk once per responder -- falsifier: a literal host in a handler of the node, or a second install for the second check'
evidence_requirements:
- kind: tests
  description: The collector's focused tests, failing first on the missing observer module, then passing.
  command: uv run pytest tests/nodes/node_delegation_check_probe_effect/test_c13_c14_routing_collector.py -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn26046-ac3-known-good-and-bad
  description: A document shaped as the in-machine driver prints it, for a local answer that ends the chain, passes every clause of C13 and C14; a wrong expected model fails local_model, an external connect recorded fails zero_provider and the reviewer row, a blind control, a recorder that saw nothing, a distribution from a path and a non-bindable tier each fail their own clause.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_delegation_check_probe_effect/test_c13_c14_routing_collector.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn26046-ac4-settings-values-one-install
  description: The driver is handed the responder row's base, served model and window, runs on the install's own bin path under an isolated interpreter, and C13 and C14 of one tick install once; no handler of the node names a host address or port.
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_delegation_check_probe_effect/test_c13_c14_routing_collector.py -q --no-cov -n 0 -p no:randomly -k "handed_the_responder_row or install_once"
    cwd: .
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_delegation_check_probe_effect/test_gateway_checks.py -q --no-cov -n 0 -p no:randomly -k names_a_host_address
    cwd: .
- id: dod-omn26046-hosted-deploy-check
  description: 'Deploy check the hosted runner can run: the machine hands the in-machine routing driver to the installed interpreter and reads its document through the observer. This binds no criterion by itself.'
  source: manual
  checks:
  - check_type: command
    check_value: grep -q 'clean_machine_routing_driver' src/omnimarket/nodes/node_delegation_check_probe_effect/handlers/adapter_clean_install_machine.py
    cwd: .
  - check_type: command
    check_value: grep -q 'routing_from_document' src/omnimarket/nodes/node_delegation_check_probe_effect/handlers/adapter_clean_install_machine.py
    cwd: .
- id: dod-omn26046-integration-proof
  description: On a lab host, with the branch checked out at its pushed sha, the collector's focused tests run the contract-bound machine through the handler with a known good document (C13 and C14 pass) and known bad ones (wrong expected model, external connect recorded). Hosted CI holds no lab host, so only the local Done gate runs this unbound check (the lab reading of the real clean install against a live responder is in the PR's Lab line).
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-26046-c14-collector --kind test -- uv run --frozen pytest tests/nodes/node_delegation_check_probe_effect/test_c13_c14_routing_collector.py -q --no-cov -n 0 -p no:randomly
    cwd: .
