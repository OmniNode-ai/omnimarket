schema_version: 1.0.0
ticket_id: OMN-21931
title: The factory floor shows merged-and-running work per day and idle slots per host, from a node that counts only merges with running evidence and never a hand-off
summary: The merged-and-running count gains the reader that supplies evidence kind deployed from the dev lane lab-pass receipt, idle slots that name their source and cause, the additive optional field merged_running on the floor section filled by the floor effect, and a page panel for the Eastern day.
is_seam_ticket: false
interface_change: true
interfaces_touched:
  - public_api
  - protocols
requirements:
  - id: req-omn21931-merged-running-daily
    statement: The floor draws, for the Eastern day, merged, running, not running and the idle slots per host, from the count node, with evidence kind deployed read from the dev lane lab-pass receipt and a hand-off never counted.
    acceptance:
      - id: AC1
        statement: 'AC1: an unmerged hand-off, armed or queued pull request leaves merged and running at 0, and the same pull request merged without evidence counts merged 1 and running 0 -- falsifier: uv run pytest tests/nodes/node_merged_running_count_compute -k handoff -q'
      - id: AC2
        statement: 'AC2: a reader supplies evidence kind deployed from the dev lane lab-pass receipt for the delivered sha, and a runtime-served merge with that receipt moves running by exactly one -- falsifier: uv run pytest tests/nodes/node_merged_running_count_effect -k deployed -q'
      - id: AC3
        statement: 'AC3: idle slots per host are the host placement advertisement minus live lanes, fall back to the table cap only with the cause named, and an unread host reads unread and not zero -- falsifier: uv run pytest tests/nodes/node_merged_running_count_compute tests/nodes/node_merged_running_count_effect -k idle -q'
      - id: AC4
        statement: 'AC4: the floor record carries merged_running as an additive optional field and the page draws merged, running, not running and idle slots for the Eastern day, and a record without the field draws nothing for it -- falsifier: uv run pytest tests/nodes/node_factory_floor_publish_effect tests/nodes/node_factory_floor_effect -k merged_running -q'
      - id: AC5
        statement: 'AC5: a real readback for today from the preview address on h051 gives the day merged and running counts, and each difference from a hand count by git first-parent history per canonical clone is explained or listed with its cause -- falsifier: curl of the preview factory-floor.json and the hand-count output side by side in the PR body'
      - id: AC6
        statement: 'AC6: the suites pass on a lab host through lab-run -- falsifier: lab-run receipt with exit code 0 for the three suites at the pushed head'
evidence_requirements:
  - kind: tests
    description: The suites live under tests/nodes; the node directories under src hold none, so a pytest over them collects nothing and exits 5.
    command: uv run pytest tests/nodes/node_merged_running_count_compute tests/nodes/node_merged_running_count_effect tests/nodes/node_factory_floor_publish_effect tests/nodes/node_factory_floor_effect -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn21931-ac1
    description: AC1 hand-offs, armed and queued pull requests never add to the count.
    source: manual
    binds_ac:
      - AC1
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/nodes/node_merged_running_count_compute -k handoff -q --no-cov --tb=line
  - id: dod-omn21931-ac2
    description: AC2 the lab-pass receipt of the dev lane moves running by exactly one, a FAIL or another lane's receipt moves nothing, an unreadable source is named.
    source: manual
    binds_ac:
      - AC2
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/nodes/node_merged_running_count_effect -k deployed -q --no-cov --tb=line
  - id: dod-omn21931-ac3
    description: AC3 idle slots name the placement advertisement or the table cap with its cause, and an unread host reads unread.
    source: manual
    binds_ac:
      - AC3
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/nodes/node_merged_running_count_compute tests/nodes/node_merged_running_count_effect -k idle -q --no-cov --tb=line
  - id: dod-omn21931-ac4
    description: AC4 the floor section field, the floor effect wiring and the page panel.
    source: manual
    binds_ac:
      - AC4
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/nodes/node_factory_floor_publish_effect tests/nodes/node_factory_floor_effect -k merged_running -q --no-cov --tb=line
  - id: dod-omn21931-ac5
    description: AC5 the preview readback and the hand count are in the pull request body; the preview is on h051 and not reachable from the hosted runner.
    source: manual
    binds_ac:
      - AC5
  - id: dod-omn21931-ac6
    description: AC6 the lab-run receipt (host, sha, exit code) is in the pull request body.
    source: manual
    binds_ac:
      - AC6
  - id: dod-omn21931-integration-proof
    description: The pushed head ran the merged-running suites on a lab host with real git and its real dependencies and exited 0. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane merged-running-daily-2-1102 -- uv run --frozen pytest tests/nodes/node_merged_running_count_compute tests/nodes/node_merged_running_count_effect tests/nodes/node_factory_floor_publish_effect tests/nodes/node_factory_floor_effect -q --no-cov
        cwd: .
