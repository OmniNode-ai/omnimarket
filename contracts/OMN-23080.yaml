schema_version: 1.0.0
ticket_id: OMN-23080
title: The floor's validator estate reading counts canonical generic validators and those that emit bus traces, from a live read of the core validator table
summary: node_validator_estate_reading_effect reads the repositories through git at the refs its overlay names and appends one shadow reading row (lane validator-estate) that the floor draws under piece 4. It counts the canonical generic validators (a generic ValidatorBase subclass whose rules resolve from a rule document and whose module holds no rule table or pattern in code) against every other validator, the share of the canonical ones that emit a trace on the bus, and the validators plan's tasks merged. A repository that cannot be read gives outcome source-unreadable and no numbers, and the row carries the age it stays fresh for on the floor.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23080-validator-estate-reading
  statement: The validator estate reading counts canonical generic validators and those that emit bus traces from a live read of the validator table in git, drops the canonical count when a rule table is planted in a canonical validator, and gives no numbers when the core repository cannot be read; the floor draws the row as the Validators line with its own age.
  acceptance:
  - id: AC1
    statement: 'AC1: the reading counts canonical generic validators and those emitting bus traces from a live read, and a planted rule table drops the canonical count -- falsifier: uv run pytest of the validator estate reading tests with the core-unreadable fault in omnimarket'
  - id: AC2
    statement: 'AC2: the floor draws the Validators line from the reading with a fresh timestamp -- falsifier: curl of the served floor-simple.json shows the validators line read within its max age'
evidence_requirements:
- kind: tests
  description: The estate reading tests pass (golden numbers and row, the planted rule table, the core-unreadable and unreadable-repository errors, the refused append, and the floor's own shadow reader drawing the row)
  command: uv run --frozen pytest tests/nodes/node_validator_estate_reading_effect -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23080-estate-tests
  description: Runs the estate reading tests; the golden read counts the canonical generic validators and the share that emit bus traces, and the named break plants a rule table in a canonical validator and the canonical count falls from 1 to 0.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_validator_estate_reading_effect/test_validator_estate.py -q --no-cov
    cwd: .
- id: dod-omn23080-core-unreadable
  description: Runs the core-unreadable error test; a core repository that cannot be read gives outcome source-unreadable and no numbers, never an empty estate.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_validator_estate_reading_effect/test_validator_estate.py -q --no-cov -k core_unreadable
    cwd: .
- id: dod-omn23080-floor-draws-row
  description: Runs the floor shadow reader test; the floor's own ModelLedgerShadowRule draws the reading row as the Validators line with the row's published time and max age.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_validator_estate_reading_effect/test_validator_estate.py -q --no-cov -k floor_shadow_reader
    cwd: .
- id: dod-omn23080-integration-proof
  description: The pushed head ran the estate reading tests on a lab host through the lab work runner and exited 0. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: 'uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23080 -- uv run --frozen pytest tests/nodes/node_validator_estate_reading_effect -q --no-cov'
    cwd: .
- id: dod-omn23080-served-floor-line
  description: The served floor board carries the Validators line read within its max age. Hosted CI cannot reach the floor, so only the local Done gate runs this unbound check.
  source: manual
  binds_ac:
  - AC2
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: 'curl -fsS "$ONEX_FLOOR_SIMPLE_JSON_URL" | grep -F "Validators"'
    cwd: .
- id: dod-omn23080-deploy-probe
  description: Deploy probe. The estate handler, HandlerValidatorEstate in handler_validator_estate.py, is read from GitHub at the checked-out commit; the probe exits nonzero on a tree without it, so it fails at the merge base.
  source: manual
  checks:
  - check_type: command
    check_value: gh api "repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_validator_estate_reading_effect/handlers/handler_validator_estate.py?ref=$(git rev-parse HEAD)" --jq .content | base64 -d | grep '^class HandlerValidatorEstate' > /dev/null
    cwd: .
- id: dod-omn23080-deploy-golden
  description: 'Hosted deploy smoke, runnable on the hosted runner with no lab route, broker or GitHub read: runs the node''s golden test, which reads a planted estate and requires the canonical and bus-trace counts and the appended row.'
  source: manual
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_validator_estate_reading_effect/test_validator_estate.py -q --no-cov -k golden_estate_numbers_and_row
    cwd: .
