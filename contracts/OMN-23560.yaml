schema_version: 1.0.0
ticket_id: OMN-23560
title: Refuse a new test file that is not in the test timing list
summary: A change that adds a test file must add its time to config/test_file_durations.json in the same change. A new effect node, node_test_duration_record_check_effect, reads the files the change adds (git), refuses any test file pytest would collect that the record lacks and prints the exact command that times it and records it; the same node runs as a pre-commit hook and as a CI step of the lint job. The threshold test test_committed_record_leaves_fewer_than_fifty_test_files_unrecorded stays as the backstop and its limit is unchanged. This adds a check on changes; it widens no existing check.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23560-record-check
  statement: A pull request that adds a test file is refused unless the same change records the file's time in the committed duration record, and the refusal prints the command that records it.
  acceptance:
  - id: AC1
    statement: 'AC1: a change that adds a test file missing from config/test_file_durations.json is refused by the new check, naming the file and the exact command that records it -- falsifier: pytest tests/nodes/node_test_duration_record_check_effect -q fails at the merge base (node absent) and, with the record entry removed, the check exits 1'
  - id: AC2
    statement: 'AC2: the command the refusal prints measures the new file and writes its entry, after which the check admits the change -- falsifier: the golden test runs the record command on a fixture file and the next check run exits 0; an injected break (command writes nothing) leaves exit 1'
  - id: AC3
    statement: 'AC3: the same node runs as a pre-commit hook and as a CI step, and its settings are in a policy file, not in code -- falsifier: the wiring test fails when either entry or the policy key is removed'
  - id: AC4
    statement: 'AC4: the node agrees with the splitter about which files count as test files -- falsifier: the seam test compares the node''s file set with scripts/ci/merge_test_durations.py over the real tree and fails if either side changes'
  - id: AC5
    statement: 'AC5: integrated: after the merge, the count of test files missing from the record on the development branch stays under 50 for 24 hours with no hand refresh -- falsifier: the freshness test run through lab-run on the development tip reads 50 or more at the start or after 24 hours'
evidence_requirements:
- kind: tests
  description: The node's unit, golden chain, error chain and seam tests
  command: uv run --frozen pytest tests/nodes/node_test_duration_record_check_effect -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23560-ac1-check-refuses
  description: The node's tests pass at the head; at the merge base the node does not exist, so they cannot run.
  source: manual
  binds_ac:
  - AC1
  - AC2
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_test_duration_record_check_effect/test_check_and_record.py tests/nodes/node_test_duration_record_check_effect/test_seams.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn23560-ac3-wiring
  description: The wiring seam test finds the pre-commit hook and the CI step that run the node and the settings in policy.yaml.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_test_duration_record_check_effect/test_seams.py -k wiring -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn23560-ac5-freshness-at-head
  description: The freshness test, whose limit of 50 is unchanged, passes at the head with this change's own three test files recorded. The 24 hour reading on the development tip is the runtime step, taken after the merge through the item below.
  source: manual
  binds_ac:
  - AC5
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/test_ci_shard_plan_record_freshness_omn17427.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn23560-ac5-integration-proof-lab
  description: Runs the freshness test at the pushed head on a lab host through the lab work runner. Hosted CI cannot reach the lab runner, so only the local Done gate runs this unbound item. The 24 hour reading on the development tip is taken after the merge.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: 'env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23560 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/test_ci_shard_plan_record_freshness_omn17427.py -q --no-cov -p no:randomly'
    cwd: .
