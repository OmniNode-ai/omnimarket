schema_version: 1.0.0
ticket_id: OMN-26438
title: The stall responder node gets a declared schedule trigger and the review replay set freeze keeps its declared on-demand trigger, each under a contract test
summary: node_stall_responder_compute declares config.stall_responder.schedule on the runtime tick, routes the tick to a scheduled-fire handler and subscribes to the tick topic, in the schedule shape the throughput tick uses. node_review_replay_set_effect is on demand by design and keeps its declared external trigger, the operator's onex run-node command that publishes the freeze command. A contract test in each node's test directory fails when the contract declares no trigger.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn26438-declared-triggers
  statement: Each of the two merged nodes declares what triggers it, and a contract test fails when it declares none.
  acceptance:
  - id: AC1
    statement: 'AC1: a schedule entry or a producer of the command topic is declared in the contract of node_stall_responder_compute -- falsifier: uv run pytest tests/nodes/node_stall_responder_compute -q with a contract test that fails when no trigger is declared'
  - id: AC2
    statement: 'AC2: a producer or schedule of the freeze command of node_review_replay_set_effect is declared in its contract -- falsifier: uv run pytest tests/nodes -q -k review_replay_set with a contract test that fails when no trigger is declared'
evidence_requirements:
- kind: tests
  description: The trigger contract tests of both nodes pass.
  command: uv run pytest tests/nodes/node_stall_responder_compute tests/nodes/node_review_replay_set_effect -q
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn26438-ac1
  description: The stall responder contract declares a schedule routed to a real handler; its trigger test names the schedule and returns no trigger for the contract without it.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_stall_responder_compute -q --no-cov
- id: dod-omn26438-ac2
  description: The review replay set contract declares the operator command that publishes the freeze command; its trigger test returns no trigger for the contract without it.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes -q --no-cov -k review_replay_set
- id: dod-omn26438-integration-proof
  description: Run both nodes' trigger tests on a lab host at the pushed head. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-26438 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_stall_responder_compute tests/nodes/node_review_replay_set_effect -q --no-cov
