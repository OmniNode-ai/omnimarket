schema_version: 1.0.0
ticket_id: OMN-26438
title: Two merged layer-0 nodes get a declared trigger
summary: 'The stall responder gets a producer node that runs on the runtime tick, reads the THROUGHPUT STALL rows from the ledger and publishes the responder command; the review replay set freeze command names its on-demand operator producer. A contract test per node fails when no trigger is declared.'
is_seam_ticket: true
interface_change: true
interfaces_touched:
- topics
requirements:
- id: req-omn26438-declared-triggers
  statement: A merged node nothing triggers has a declared trigger; the stall responder runs on the runtime tick through a producer node and the replay set freeze command names its on-demand producer.
  acceptance:
  - id: AC1
    statement: 'AC1: a producer of the command topic is declared in the contract of node_stall_responder_compute -- falsifier: uv run pytest tests/nodes/node_stall_responder_compute -q with a contract test that fails when no trigger is declared'
  - id: AC2
    statement: 'AC2: a producer or schedule of the freeze command of node_review_replay_set_effect is declared in its contract -- falsifier: uv run pytest tests/nodes -q -k review_replay_set with a contract test that fails when no trigger is declared'
  - id: AC3
    statement: 'AC3: after a healthy dev build carrying both, one run line per node is read in the omni-201 omninode-runtime log -- falsifier: docker logs omninode-runtime piped to grep for each node run line returns zero lines today'
evidence_requirements:
- kind: tests
  description: The trigger contract tests of both nodes and the producer node's handler tests
  command: uv run --frozen pytest tests/nodes/node_stall_responder_compute tests/nodes/node_stall_responder_schedule_effect tests/nodes/node_review_replay_set_effect -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn26438-ac1
  description: AC1 proven by the trigger contract test of the responder and the producer node's handler tests (a due tick reads the stall rows and requests the responder, a tick inside the interval requests nothing, an unreadable ledger publishes nothing).
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_stall_responder_compute tests/nodes/node_stall_responder_schedule_effect -q --no-cov
    cwd: .
- id: dod-omn26438-ac2
  description: AC2 proven by the replay set trigger contract test, which fails when the freeze command names no producer.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_review_replay_set_effect -q --no-cov
    cwd: .
- id: dod-omn26438-deploy-stall-responder-schedule
  description: 'Deploy probe the hosted runner can run: the producer node contract at the checked-out commit on GitHub names its handler class; the file does not exist at the merge base, so the probe fails there. AC3 is read on the dev runtime after the dev deploy.'
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: command
    check_value: 'bash -o pipefail -c ''gh api "repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_stall_responder_schedule_effect/contract.yaml?ref=$(git rev-parse HEAD)" --jq .content | base64 -d | grep -F "HandlerStallResponderSchedule" > /dev/null'''
    cwd: .
- id: dod-omn26438-integration-proof
  description: AC3 is read on the dev runtime after the dev deploy through the deploy agent; the pushed head is run on a lab host first and the deployed reading is named in the pull request.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane trigdecl-0415 -- uv run --frozen pytest tests/nodes/node_stall_responder_compute tests/nodes/node_stall_responder_schedule_effect tests/nodes/node_review_replay_set_effect -q --no-cov
    cwd: .
