    checks:
    - check_type: test_passes
      check_value: uv run pytest tests/unit/nodes/node_agent_review_dispatch_orchestrator/test_harness_rungs.py -q -n 0 -p no:randomly --no-cov --tb=line
      cwd: .
  - id: dod-omn22345-ac11
    description: 'AC11: lab step, recorded as a ledger receipt by the proof lane (review-proof-1525). Not met by this change alone.'
    source: manual
    binds_ac:
    - AC11
