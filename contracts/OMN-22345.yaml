schema_version: "1.0.0"
ticket_id: "OMN-22345"
title: "The agent review roster approves one Codex and one Sonnet voter beside the lab rung, and a review-only cloud lane returns its review to the dispatch node"
summary: "This omnimarket slice builds the code side: the cloud placement node gains the review-only lane kind (route, a cloud prompt that asks for no push and no pull request, a session read that takes the ended session's final message and review file from the sessions API events, a strict parse into the typed unsigned review in the v2 compact verdict format, and the close decision under which a review-only lane with a parsed review ends done with no PR and one with none ends cloud-review-unparsed, outcome failed, never blocked); a new node node_agent_review_cloud_rung_effect renders the review-only brief for one voter of rung cloud, runs it through the remote-lane runner with every secret-shaped name dropped from the child environment, emits one delegation event and returns the vote unsigned. AC1 to AC4 (the roster and verifier overlay data of the sibling data pull request) and AC7 (the lab proof) are not this pull request's criteria; each is a disposition entry at the local Done gate."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-omn22345-cloud-rung"
    statement: "A cloud session never holds the shared signing secret; the cloud rung returns the review unsigned and the dispatch node signs it."
    acceptance:
      - id: "AC5"
        statement: "AC5: A cloud session never holds the shared signing secret and the dispatch node signs its unsigned review -- falsifier: `uv run pytest` of the cloud rung port test finds the secret name or value in the rendered session prompt or environment, or a review carrying a signature from the session"
  - id: "req-omn22345-return-channel"
    statement: "A review-only cloud lane reads the ended session's final message or review file back, parses the typed review and ends done with no PR."
    acceptance:
      - id: "AC6"
        statement: "AC6: A review-only cloud lane reads the session final message or its review file back into the dispatch node and ends done with no PR -- falsifier: `uv run pytest` of the remote-lane runner tests for a review-only cloud lane with a final message and no PR closes it cloud-no-pr or outcome blocked, or the dispatch node receives no review"
  - id: req-omn22345-ac8
    statement: 'AC8: The signing key is read by the overlay signing_key_store reference, and no path reads it from the process environment or the host env file'
    acceptance:
    - id: AC8
      statement: 'AC8: The signing key is read by the overlay signing_key_store reference, and no path reads it from the process environment or the host env file -- falsifier: `uv run pytest tests/unit/nodes/node_agent_review_dispatch_orchestrator/test_production_ports.py -k "key" -q` shows a build that succeeds with LOCAL_LLM_SHARED_SECRET in the environment and no store reference read, or the store is asked for a reference other than the overlay block'
  - id: req-omn22345-ac9
    statement: 'AC9: An absent store identity or an unreadable store ends the request before any port is called and names the missing setting, never a value'
    acceptance:
    - id: AC9
      statement: 'AC9: An absent store identity or an unreadable store ends the request before any port is called and names the missing setting, never a value -- falsifier: the same test file finds a bind that returns ports after the store refused, or an error text holding the key or the client secret'
  - id: req-omn22345-ac10
    statement: 'AC10: The store identity names never reach a voter child process'
    acceptance:
    - id: AC10
      statement: 'AC10: The store identity names never reach a voter child process -- falsifier: `uv run pytest tests/unit/nodes/node_agent_review_dispatch_orchestrator/test_harness_rungs.py -q` finds INFISICAL_ADDR, INFISICAL_CLIENT_ID, INFISICAL_CLIENT_SECRET or INFISICAL_PROJECT_ID in a harness child environment or request'
  - id: req-omn22345-ac11
    statement: 'AC11: Lab step: from a lab host, the request entry for one pull request head binds the signer from the store, runs the Codex and Sonnet rungs and posts or stores one signed receipt naming both voters'
    acceptance:
    - id: AC11
      statement: 'AC11: Lab step: from a lab host, the request entry for one pull request head binds the signer from the store, runs the Codex and Sonnet rungs and posts or stores one signed receipt naming both voters -- falsifier: the entry exits 1 with a not-bound line, or the stored receipt lists fewer than two counted non-lab voters'
  - id: req-omn22345-ac12
    statement: 'AC12: The source-control bus of the dispatch reads the lane declaration under the registry root, and a spool file a peer emitter already took is not an error'
    acceptance:
    - id: AC12
      statement: 'AC12: The source-control bus of the dispatch reads the lane declaration under the registry root, and a spool file a peer emitter already took is not an error -- falsifier: `uv run pytest tests/unit/nodes/node_agent_review_dispatch_orchestrator/test_production_ports.py -k "lane_declaration or in_memory_bus" -q` or `uv run pytest tests/unit/nodes/node_event_emit_effect/test_spool_outbox.py -k "peer" -q` fails'
evidence_requirements:
  - kind: "tests"
    description: "The cloud rung's tests on the in-memory overlay (the Redpanda overlay case runs under the kafka marker): the brief and the runner's child environment hold no secret name or value, a vote has no signature, a review of another head is refused, a foreign model or endpoint is returned as written, no delegation event means no vote. None exists at the merge base."
    command: "uv run pytest tests/unit/nodes/node_agent_review_cloud_rung_effect/test_cloud_rung.py -q -m 'not kafka' --no-cov"
  - kind: "tests"
    description: "The review-only return channel of the cloud placement node: route, prompt, the session events read run end to end over a stubbed sessions API, the strict parse with its typed refusals, and the close (done with no PR; cloud-review-unparsed and failed, never blocked). Twelve of its cases fail at the merge base."
    command: "uv run pytest tests/nodes/node_cloud_session_placement_effect/test_cloud_review_only.py -q --no-cov"
  - kind: tests
    description: The dispatch node suite under both profiles and the literal scan.
    command: uv run pytest tests/unit/nodes/node_agent_review_dispatch_orchestrator -q --no-cov
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
