schema_version: "1.0.0"
ticket_id: "OMN-21328"
title: "Retire the private plugin repository: skills move to omnimarket and omniclaude, private config to overlays, default plugin shows only delegation, repo archived"
summary: "Epic contract. The epic's four original criteria are disposition entries pending at the local Done gate; AC5 and AC6 are this slice's. The first move slice rebuilds the standup skill's draft checker script as node_standup_draft_check_compute in omnimarket: contract, node shell, handler, typed models and a python -m entry point that reads the draft on stdin and the fact sheet as --facts-json text and keeps the script's output lines and exit codes, with the script's tests ported. No caller switches in this pull request; the thin standup skill switches in a later group."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-omn21328-first-move-slice"
    statement: "The first move slice of the retirement plan rebuilds the standup skill's draft checker script as a pure omnimarket compute node with the script's tests ported, and switches no caller."
    acceptance:
      - id: "AC5"
        statement: "AC5: node_standup_draft_check_compute applies the script's rules, constants, findings and warnings to a draft, through its handler and its typed request and result models -- falsifier: uv run pytest tests/nodes/node_standup_draft_check_compute/test_standup_draft_check.py -q fails"
      - id: "AC6"
        statement: "AC6: python -m omnimarket.nodes.node_standup_draft_check_compute reads the draft on stdin and the fact sheet as --facts-json text and prints the script's output lines with exit codes 0, 1 and 2 -- falsifier: uv run pytest tests/nodes/node_standup_draft_check_compute/test_standup_draft_check.py -q -k cli fails"
  - id: "req-omn21328-slice3-remaining-nodes"
    statement: "The two placement nodes that slice 3 of the scripts migration counts beside the five already moved, node_codex_sandbox_probe_compute and node_clone_parity_compute, are ported to omnimarket with their tests; the private data clone name is read from the repos overlay and the registry-root variable in rendered shell is a parameter. No caller switches in this pull request."
    acceptance:
      - id: "AC7"
        statement: "AC7: node_codex_sandbox_probe_compute renders the Codex roots and sandbox probe lines, grants the sibling clone named by repos.private_data and refuses with repos.private_data named when no overlay or argument supplies it -- falsifier: uv run pytest tests/nodes/node_codex_sandbox_probe_compute/test_codex_sandbox_probe.py tests/nodes/node_codex_sandbox_probe_compute/test_golden_chain_codex_sandbox_probe_compute.py -q fails"
      - id: "AC8"
        statement: "AC8: node_clone_parity_compute renders the clone parity probe and judges its lines, and both nodes are onex.nodes entry points -- falsifier: uv run pytest tests/nodes/node_clone_parity_compute/test_clone_parity.py tests/nodes/node_clone_parity_compute/test_golden_chain_clone_parity_compute.py -q fails, or either entry point is missing"
evidence_requirements:
  - kind: "tests"
    description: "The standup draft check node's ported tests: the checker rules, the CLI parity cases and the handler through its request and result models. None exists at the merge base."
    command: "uv run pytest tests/nodes/node_standup_draft_check_compute/test_standup_draft_check.py tests/nodes/node_standup_draft_check_compute/test_registration.py -q --no-cov"
  - kind: "tests"
    description: "The two remaining slice 3 nodes' tests: the ported Codex sandbox probe tests, the repos.private_data overlay read and refusal, the registry-root variable parameter, and the clone parity probe. None exists at the merge base."
    command: "uv run pytest tests/nodes/node_codex_sandbox_probe_compute/test_codex_sandbox_probe.py tests/nodes/node_codex_sandbox_probe_compute/test_golden_chain_codex_sandbox_probe_compute.py tests/nodes/node_clone_parity_compute/test_clone_parity.py tests/nodes/node_clone_parity_compute/test_golden_chain_clone_parity_compute.py -q --no-cov"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn21328-ac1"
    description: "Epic criterion AC1: a Codex-reviewed plan with a disposition table for every review finding is merged in the private plans repository. Pending: the plan PR in the private plans repository carries the Codex review disposition table and is not merged by this pull request. A disposition is required at the local Done gate."
    source: "manual"
    checks:
      - check_type: "disposition"
        check_value: "dod-omn21328-ac1"
    execution_scope: "local_done_gate"
  - id: "dod-omn21328-ac2"
    description: "Epic criterion AC2: every skill, hook, script, node and package in the private plugin repository has one recorded destination in the plan's inventory. Pending: the inventory is in the plan, outside this repository. This pull request moves one inventoried file, the standup draft checker, to its recorded destination node. A disposition is required at the local Done gate."
    source: "manual"
    checks:
      - check_type: "disposition"
        check_value: "dod-omn21328-ac2"
    execution_scope: "local_done_gate"
  - id: "dod-omn21328-ac3"
    description: "Epic criterion AC3: a fresh Claude Code profile that installs from the public marketplace shows only delegation by default. Pending: the default plugin surface is locked by a later task in omniclaude. This pull request adds no plugin or skill. A disposition is required at the local Done gate."
    source: "manual"
    checks:
      - check_type: "disposition"
        check_value: "dod-omn21328-ac3"
    execution_scope: "local_done_gate"
  - id: "dod-omn21328-ac4"
    description: "Epic criterion AC4: the private plugin repository is archived read-only with no lab host, launchd unit or installer reading from it. Pending: the archive is the plan's last step. This pull request changes no host table, installer or launchd unit. A disposition is required at the local Done gate."
    source: "manual"
    checks:
      - check_type: "disposition"
        check_value: "dod-omn21328-ac4"
    execution_scope: "local_done_gate"
  - id: "dod-omn21328-ac5-standup-node-tests"
    description: "AC5: the standup draft check node's tests pass, covering every checker test of the source script that does not read the skill's SKILL.md, plus the handler through its typed models and the node's registration."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_standup_draft_check_compute/test_standup_draft_check.py tests/nodes/node_standup_draft_check_compute/test_registration.py -q --no-cov"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC5"]
  - id: "dod-omn21328-ac6-standup-node-cli"
    description: "AC6: the CLI tests pass: stdin input, --facts-json, --json output, invalid UTF-8 and invalid JSON exit 2, usage errors exit 2."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_standup_draft_check_compute/test_standup_draft_check.py -q --no-cov -k cli"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC6"]
  - id: "dod-omn21328-standup-node-deploy-probe"
    description: "Deploy probe. GitHub serves the standup draft check handler at the checked-out HEAD with its handler class and its check, milestone and M4 warning functions. It fails at the merge base, which has no such node, and needs only GitHub access and Python on the hosted runner."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: >-
          gh api "repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_standup_draft_check_compute/handlers/handler_standup_draft_check.py?ref=$(git rev-parse HEAD)" --jq .content | base64 -d | python3 -c 'import sys; source = sys.stdin.read(); assert all(name in source for name in ("class HandlerStandupDraftCheck", "def check(", "def milestone_warnings(", "def m4_delegation_warnings(")); print("standup draft check deploy probe: PASS")'
  - id: "dod-omn21328-ac7-codex-sandbox-probe-node"
    description: "AC7: the Codex sandbox probe node's tests pass, including the ported roots program, write probe and lane-lock tests, the repos.private_data overlay read, its refusal and the explicit argument."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_codex_sandbox_probe_compute/test_codex_sandbox_probe.py tests/nodes/node_codex_sandbox_probe_compute/test_golden_chain_codex_sandbox_probe_compute.py -q --no-cov"
    binds_ac: ["AC7"]
  - id: "dod-omn21328-ac8-clone-parity-node"
    description: "AC8: the clone parity node's tests pass and both nodes resolve as onex.nodes entry points."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_clone_parity_compute/test_clone_parity.py tests/nodes/node_clone_parity_compute/test_golden_chain_clone_parity_compute.py -q --no-cov"
      - check_type: "command"
        check_value: "uv run python -c \"from importlib.metadata import entry_points; names={e.name for e in entry_points(group='onex.nodes')}; need={'node_codex_sandbox_probe_compute','node_clone_parity_compute'}; missing=need-names; assert not missing, missing\""
    binds_ac: ["AC8"]
  - id: "dod-omn21328-slice3-remaining-deploy-import"
    description: "Hosted deploy check, runnable on the hosted runner with no lab route, broker or database: the two node packages load from their onex.nodes entry points in the installed omnimarket and the sandbox probe handler renders its probe with an explicit private data clone name. Fails at the merge base, where the packages and entry points are absent."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: "uv run --locked python -c \"from importlib.metadata import entry_points; eps={e.name: e for e in entry_points(group='onex.nodes')}; [eps[n].load() for n in ('node_codex_sandbox_probe_compute','node_clone_parity_compute')]; from omnimarket.nodes.node_codex_sandbox_probe_compute.handlers.handler_codex_sandbox_probe import codex_roots_probe_sh; assert 'CODEX_ROOTS_BESIDE=repo-a' in codex_roots_probe_sh(private_data='repo-a')\""
