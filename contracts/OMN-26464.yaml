- id: dod-omn26464-integration-proof-real-postgres
  description: 'Integration proof: the pushed head ran the writer''s single transaction (lock, status-guarded update, concurrent opposite outcomes with exactly one winner, tenant isolation, replay with unchanged timestamps, every writable starting status, ambiguity) and the submit status guard against a real Postgres on a lab host through the repository integration marker and the lab work runner, and exited 0. The lab host supplies INTEGRATION_POSTGRES_PASSWORD from its own environment; no password is written here. Hosted CI never runs a local_done_gate item, so only the local Done gate runs this unbound check; the AC2 and AC6 bindings above are the hosted ones. The dev read of a workflow row and its receipt after the roll is the orchestrator''s AC2 and AC6 readback.'
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: 'env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-26464 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_gateway_workflow_terminal_effect -m integration -q --no-cov -n 0 -p no:randomly'
    cwd: .
- id: dod-omn26464-ac4-rung-chain
  description: 'AC4 (hosted proxy): the scripted probe harness classifies 401 and 403 through failure_class_for_status, the one classifier the real delegation effect uses, and the rung chain tests show the OpenRouter rung answering after an unreachable local rung, the Claude API rung answering after two unreachable rungs, and a rejected own key refused with no successor called. The runs on the running dev runtime are not claimed here.'
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/handlers/routing/test_omn26464_gateway_rung_chain.py -q -m unit --no-cov -n 0 -p no:randomly
    cwd: .
