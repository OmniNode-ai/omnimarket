schema_version: 1.0.0
ticket_id: OMN-26461
title: The goal scope ticket rule's ticket_roots is a settable setting and load_goal_ticket_rule reads the settings store first, so a goal's tickets reach the landing gate through the store
summary: node_overlay_setting_set_effect declares goal_scope_ticket_rule / ticket_roots as a settable setting validated against a whole-document model in omnimarket.models.overlay_documents, and goal_scope_overlay.load_goal_ticket_rule reads the injected omnibase_spi overlay store protocol first, then the overlay file root and the plugin path. The overlay's own ticket_roots data stays the ticket's and is not changed here.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn26461-settable-row-and-store-first-reader
  statement: A ticket_roots list can be set through the settings store and the rule reader takes it before any file.
  acceptance:
  - id: AC4
    statement: 'AC4: contract.yaml declares overlay goal_scope_ticket_rule key ticket_roots with a document_model, and a set of a valid list passes and an invalid one is refused with nothing written -- falsifier: uv run pytest tests/unit/nodes/node_overlay_setting_set/test_setting_set_goal_scope_ticket_rule.py fails on a contract with no such row and on a model that accepts a non-ticket string or a wrong type'
  - id: AC5
    statement: 'AC5: load_goal_ticket_rule reads the injected store reader first, refuses a broken store document without falling through, and reads the file root then the plugin path when the store holds none -- falsifier: uv run pytest src/omnimarket/nodes/node_goal_scope_admission_compute/tests/test_goal_scope_overlay_settings_store.py fails on a reader that ignores the store or falls through to the files after a broken store document'
  - id: AC6
    statement: 'AC6: the reader consumes the existing store protocol and defines no second one -- falsifier: grep of the diff for a new Protocol or store-reader class returns none, and the import names omnibase_spi.protocols.storage'
evidence_requirements:
- kind: tests
  description: The two focused test files, each failing against the base first and passing on the change.
  command: uv run pytest tests/unit/nodes/node_overlay_setting_set src/omnimarket/nodes/node_goal_scope_admission_compute/tests -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn26461-settable-row
  description: The contract declares the ticket_roots row with its path and document model; a valid list is set and stored, and a non-ticket string, an empty list or a wrong type is refused with nothing published.
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/nodes/node_overlay_setting_set/test_setting_set_goal_scope_ticket_rule.py -q --no-cov -n 0 -p no:randomly
    cwd: .
  - check_type: command
    check_value: 'grep -q ''overlay_id: goal_scope_ticket_rule'' src/omnimarket/nodes/node_overlay_setting_set_effect/contract.yaml'
    cwd: .
- id: dod-omn26461-store-first-reader
  description: The reader returns the store's document when the injected store holds one, refuses a broken store document naming the store and the overlay id without reading the files, and reads the file root then the plugin path when the store holds none.
  source: manual
  binds_ac:
  - AC5
  checks:
  - check_type: test_passes
    check_value: uv run pytest src/omnimarket/nodes/node_goal_scope_admission_compute/tests/test_goal_scope_overlay_settings_store.py src/omnimarket/nodes/node_goal_scope_admission_compute/tests/test_goal_scope_overlay_store_first.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn26461-no-second-protocol
  description: The reader imports ProtocolOverlayStore from omnibase_spi and declares no Protocol class of its own.
  source: manual
  binds_ac:
  - AC6
  checks:
  - check_type: test_passes
    check_value: uv run pytest src/omnimarket/nodes/node_goal_scope_admission_compute/tests/test_goal_scope_overlay_no_second_protocol.py -q --no-cov -n 0 -p no:randomly
    cwd: .
  - check_type: command
    check_value: grep -q 'from omnibase_spi.protocols.storage import ProtocolOverlayStore' src/omnimarket/handlers/goal_scope_overlay.py
    cwd: .
  - check_type: command
    check_value: '! grep -q ''(Protocol)'' src/omnimarket/handlers/goal_scope_overlay.py'
    cwd: .
- id: dod-omn26461-hosted-deploy-check
  description: 'Deploy check the hosted runner can run: the contract declares the setting and the model module exists. This binds no criterion.'
  source: manual
  checks:
  - check_type: command
    check_value: grep -q 'model_goal_scope_ticket_rule_overlay:ModelGoalScopeTicketRuleOverlay' src/omnimarket/nodes/node_overlay_setting_set_effect/contract.yaml
    cwd: .
  - check_type: command
    check_value: test -f src/omnimarket/models/overlay_documents/model_goal_scope_ticket_rule_overlay.py
    cwd: .
- id: dod-omn26461-integration-proof
  description: On a lab host, at the pushed sha, the two focused test files and the existing store-first file tests pass, so the row and the reader are exercised outside the lane's own tree.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-26461 --kind test -- uv run --frozen pytest tests/unit/nodes/node_overlay_setting_set src/omnimarket/nodes/node_goal_scope_admission_compute/tests -q --no-cov -n 0 -p no:randomly
    cwd: .
