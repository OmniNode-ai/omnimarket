---
schema_version: "1.0.0"
ticket_id: OMN-26222
title: "Awaiting-reply runs as typed nodes that answer Slack and Linear asks under the AUTO rules, so a malformed read is refused with the field named"
summary: "A compute node classifies typed Slack and Linear reads as AUTO or ESCALATE and an effect node sends the AUTO replies to allowlisted people and logs each one on the ledger."
is_seam_ticket: false
interface_change: true
interfaces_touched:
  - topics
requirements:
  - id: req-omn26222-awaiting-reply-nodes
    statement: "The awaiting-reply check is two nodes with typed inputs and outputs: a malformed read is refused naming the field, AUTO replies go only to allowlisted people, and each send is logged."
    acceptance:
      - id: AC1
        statement: "AC1: node_awaiting_reply_compute takes typed Slack and Linear read items and returns waiting items with class, basis, drafted reply and escalation stage, the excluded items with reasons and per-source read status, and refuses a malformed item naming the field -- falsifier: uv run pytest tests/nodes/node_awaiting_reply_compute -q --no-cov -k awaiting_reply_compute"
      - id: AC2
        statement: "AC2: each AUTO test of the skill is a unit test, including a Linear ask from an allowlisted person with a recorded basis being AUTO -- falsifier: uv run pytest tests/nodes/node_awaiting_reply_compute -q --no-cov -k awaiting_reply_auto_rules"
      - id: AC3
        statement: "AC3: node_awaiting_reply_effect sends an AUTO reply to Slack with the agent footer or as a Linear comment whose first line is the actor line, logs one row per send, sends to nobody else, and returns a typed record for a refusal -- falsifier: uv run pytest tests/nodes/node_awaiting_reply_effect -q --no-cov -k awaiting_reply_effect"
      - id: AC4
        statement: "AC4: a read bundle whose held entry is a string fails on the unvalidated path and is refused by the typed model naming held -- falsifier: uv run pytest tests/nodes/node_awaiting_reply_compute -q --no-cov -k awaiting_reply_malformed_bundle"
evidence_requirements:
  - kind: tests
    description: "The compute and effect node tests of the awaiting-reply check."
    command: uv run pytest tests/nodes/node_awaiting_reply_compute tests/nodes/node_awaiting_reply_effect -q --no-cov
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-omn26222-ac1
    description: "AC1 proven by its named tests."
    source: manual
    binds_ac: [AC1]
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/nodes/node_awaiting_reply_compute -q --no-cov -k awaiting_reply_compute
  - id: dod-omn26222-ac2
    description: "AC2 proven by its named tests."
    source: manual
    binds_ac: [AC2]
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/nodes/node_awaiting_reply_compute -q --no-cov -k awaiting_reply_auto_rules
  - id: dod-omn26222-ac3
    description: "AC3 proven by its named tests."
    source: manual
    binds_ac: [AC3]
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/nodes/node_awaiting_reply_effect -q --no-cov -k awaiting_reply_effect
  - id: dod-omn26222-ac4
    description: "AC4 proven by its named test."
    source: manual
    binds_ac: [AC4]
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/nodes/node_awaiting_reply_compute -q --no-cov -k awaiting_reply_malformed_bundle
  - id: dod-omn26222-deploy-registered
    description: "Both nodes are registered as onex.nodes entry points in the installed package, which a hosted runner can read."
    source: manual
    execution_scope: hosted_and_local
    checks:
      - check_type: command
        check_value: >-
          uv run python -c "import importlib.metadata as m; names = {e.name for e in m.entry_points(group='onex.nodes')}; assert {'node_awaiting_reply_compute', 'node_awaiting_reply_effect'} <= names, names"
        cwd: .
  - id: dod-omn26222-integration-proof
    description: "Run both awaiting-reply nodes' focused tests on a lab host at the pushed head; the local Done gate runs this unbound check."
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-26222 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_awaiting_reply_compute tests/nodes/node_awaiting_reply_effect -q --no-cov
        cwd: .
