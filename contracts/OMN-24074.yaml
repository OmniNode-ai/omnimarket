schema_version: 1.0.0
ticket_id: OMN-24074
title: Run the promise check on the runtime's own schedule
summary: 'Adds the commitment check runner as a scheduled job node on the runtime schedule path of OMN-24029: it gates on its overlay interval, runs the runner through a shared tick module and emits one typed run event.'
is_seam_ticket: true
interface_change: true
interfaces_touched:
- topics
requirements:
- id: req-omn24074-commitment-check-scheduled
  statement: The commitment check runner runs on the runtime tick from overlay values and records each run as a typed event, failed by name when its overlay or ledger source cannot be read.
  acceptance:
  - id: AC1
    statement: 'AC1: a scheduled job node runs the commitment check runner on the runtime tick from overlay values and emits one typed run event, failed by name when the overlay or the ledger source cannot be read -- falsifier: uv run --frozen pytest tests/nodes/node_commitment_check_scheduled_effect -q --no-cov'
  - id: AC2
    statement: 'AC2: the runtime login''s broker grants of the new job equal the rows the principals role derives, and a changed topic on one side fails -- falsifier: uv run --frozen pytest tests/nodes/node_schedule_run_reducer/test_runtime_role_acl_seam.py -q --no-cov'
  - id: AC3
    statement: 'AC3: integrated: on the dev runtime one run event from the commitment check job is read on onex.evt.omnimarket.schedule-run.v1 and the verdict event judges it -- falsifier: read the topic and the verdict topic on the dev broker after the deploy; no run event within 30 minutes fails it'
evidence_requirements:
- kind: tests
  description: The golden and error chain tests of the commitment check scheduled node and the ACL seam test
  command: uv run --frozen pytest tests/nodes/node_commitment_check_scheduled_effect tests/nodes/node_schedule_run_reducer/test_runtime_role_acl_seam.py -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24074-ac1
  description: AC1 proven by the named tests.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_commitment_check_scheduled_effect -q --no-cov
    cwd: .
- id: dod-omn24074-ac2
  description: AC2 proven by the seam test, which fails when a contract grant and the derived role rows disagree.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_schedule_run_reducer/test_runtime_role_acl_seam.py -q --no-cov
    cwd: .
- id: dod-omn24074-deploy-commitment-check-scheduled
  description: 'Deploy probe the hosted runner can run: the commitment check scheduled node contract at the checked-out commit on GitHub names its handler class; the file does not exist at the merge base, so the probe fails there. AC3 is read on the dev runtime after the dev deploy through the deploy agent.'
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: command
    check_value: 'bash -o pipefail -c ''gh api "repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_commitment_check_scheduled_effect/contract.yaml?ref=$(git rev-parse HEAD)" --jq .content | base64 -d | grep -F "HandlerCommitmentCheckScheduled" > /dev/null'''
    cwd: .
- id: dod-omn24074-integration-proof
  description: AC3 is read on the dev runtime after the dev deploy through the deploy agent; the pushed head is run on a lab host first and the deployed reading is named in the pull request.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane triggers4-6734 -- uv run --frozen pytest tests/nodes/node_commitment_check_scheduled_effect -q --no-cov
    cwd: .
