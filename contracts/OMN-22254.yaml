schema_version: 1.0.0
ticket_id: OMN-22254
title: Host reconcile replaces a live ~/.local/bin/onex link to the dispatch venv's own console script with the sanctioned wrapper link
summary: On a lab host the host reconcile failed on the onex-path-shadow surface because ~/.local/bin/onex was a live symlink to the dispatch venv's own console script. The effect handler repaired only a dangling link, and the check printed a uv tool uninstall fix line that does not apply to that link, so the installer left the shadow and the host never reached a passing reconcile. The effect handler now recognises that link, and in repair mode moves it aside and links the canonical wrapper, which execs that same console script.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn22254-dispatch-link
  statement: The declared installer clears a ~/.local/bin/onex link to the dispatch venv's own console script in repair mode, and says so in check mode, instead of leaving it for a hand fix.
  acceptance:
  - id: AC1
    statement: 'AC1: check mode reports a live link to the dispatch venv console script as SHADOWED with a repair-mode fix line and touches nothing -- falsifier: uv run pytest tests/test_host_reconcile_effect.py -k dispatch_venv_link_is_reported_in_check_mode'
  - id: AC2
    statement: 'AC2: repair mode moves that link aside, links the canonical wrapper, and a second run is idempotent -- falsifier: uv run pytest tests/test_host_reconcile_effect.py -k dispatch_venv_link_repair'
  - id: AC3
    statement: 'AC3: a link to any other onex is still reported SHADOWED and left in place -- falsifier: uv run pytest tests/test_host_reconcile_effect.py -k other_onex'
evidence_requirements:
- kind: tests
  description: The dispatch-venv link shape is reported in check mode, replaced by the wrapper link in repair mode, idempotent, and any other onex link is left alone.
  command: uv run pytest tests/test_host_reconcile_effect.py tests/test_host_reconcile_compute.py -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn22254-ac1
  description: AC1 the recorded lab-host shape (a live link to the dispatch venv console script) is reported in check mode with the repair-mode fix line and left untouched.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/test_host_reconcile_effect.py -q --no-cov --tb=line -k dispatch_venv_link_is_reported_in_check_mode
    cwd: .
- id: dod-omn22254-ac2
  description: AC2 repair mode moves the link aside, links the wrapper, and a second run reads ALREADY_AT_TARGET with one moved link kept.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/test_host_reconcile_effect.py -q --no-cov --tb=line -k dispatch_venv_link_repair
    cwd: .
- id: dod-omn22254-ac3
  description: AC3 a link to some other onex stays SHADOWED and is not moved.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/test_host_reconcile_effect.py -q --no-cov --tb=line -k other_onex
    cwd: .
- id: dod-omn22254-integration-proof
  description: The host reconcile effect and compute suites run on a lab host. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-22254 -- uv run --frozen pytest tests/test_host_reconcile_effect.py tests/test_host_reconcile_compute.py -q --no-cov
    cwd: .
- id: dod-omn22254-deploy-source-readback
  description: Hosted-runner source-artifact readback requires the published handler at the evaluated commit to match this checkout, contain the dispatch-venv link repair, and name no deployment host. This checks the source artifact; it does not claim the fix is installed on a host.
  source: manual
  checks:
  - check_type: command
    check_value: |
      set -eu;
      readback_dir="$(mktemp -d)";
      trap 'rm -rf "$readback_dir"' EXIT;
      revision="$(git rev-parse HEAD)";
      path=src/omnimarket/nodes/node_host_reconcile_effect/handlers/handler_host_reconcile_effect.py;
      curl --fail --silent --show-error --location --max-time 30 \
        "https://raw.githubusercontent.com/OmniNode-ai/omnimarket/$revision/$path" \
        --output "$readback_dir/handler.py";
      cmp "$path" "$readback_dir/handler.py";
      grep -F 'is_dispatch_link = (' "$readback_dir/handler.py";
      grep -F 'or is_dispatch_link' "$readback_dir/handler.py";
      if grep -En '\bh[0-9]{3}\b' "$readback_dir/handler.py"; then exit 1; fi;
      printf 'host reconcile handler source readback matched %s\n' "$revision"
