schema_version: 1.0.0
ticket_id: OMN-24549
title: R8 stops at its send step and names the platform's refusal
summary: Scenario R8's send_delegate ignored the status of the onex delegate answer, so a refused delegation (probe tenant with no provider key) looked like a row with no tokens and R8 failed at organic_run_has_values.
  send_delegate now raises the failed answer's failure reason, with the status key, the failed status value and the reason keys declared in the node contract.
is_seam_ticket: true
interface_change: true
interfaces_touched: []
requirements:
- id: req-omn24549-send-refusal
  statement: A delegation answer marked failed fails R8 at runs_sent with the answer's own reason.
  acceptance:
  - id: AC1
    statement: 'AC1: a delegate command answer whose status is failed makes R8''s send step raise the answer''s failure reason, and an answer with no failed status is read as before -- falsifier: pytest
      tests/nodes/node_delegation_scenario_r8_effect/test_send_delegate_failed_terminal.py -q fails with the check removed from the send step'
  - id: AC2
    statement: 'AC2: R8 run end to end with a refused delegation ends failed at runs_sent and its detail carries the refusal text -- falsifier: pytest tests/nodes/node_delegation_scenario_r8_effect/test_bus_lane.py
      -k refused_delegation -q fails when the refusal text is dropped from the detail'
  - id: AC3
    statement: 'AC3: integrated: on lab host h053 the installed R8 unit run once ends failed at runs_sent with the platform''s refusal text on the delegation tracker -- falsifier: the delegation tracker''s
      JSON for R8 still shows organic_run_has_values as the failing step after the unit ran'
evidence_requirements:
- kind: tests
  description: The send failed-terminal tests (golden, error chains, failing control) and the R8 bus lane tests.
  command: env -u PYTHONPATH uv run --frozen pytest tests/nodes/node_delegation_scenario_r8_effect/test_send_delegate_failed_terminal.py tests/nodes/node_delegation_scenario_r8_effect/test_bus_lane.py -q
    --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24549-ac1-send-failed
  description: The send failed-terminal tests; three of four fail with the check removed from send_delegate.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_delegation_scenario_r8_effect/test_send_delegate_failed_terminal.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24549-ac2-runs-sent
  description: R8 end to end with a refused delegation fails at runs_sent carrying the refusal text.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_delegation_scenario_r8_effect/test_bus_lane.py -k refused_delegation -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24549-ac3-integration-proof
  description: Hosted CI cannot reach the lab host, so only the local Done gate runs this unbound check; the running reading is the R8 unit's result on h053 and the tracker, recorded as a receipt comment
    on the ticket.
  source: manual
  execution_scope: local_done_gate
  binds_ac:
  - AC3
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24549 --kind test -- env PYTHONDONTWRITEBYTECODE=1
      uv run --frozen pytest tests/nodes/node_delegation_scenario_r8_effect/test_send_delegate_failed_terminal.py -q --no-cov -n 0 -p no:randomly
    cwd: .
