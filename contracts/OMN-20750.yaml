    acceptance:
      - id: "AC2"
        statement: "AC2 (AC-M9): a green head GitHub reports armed (auto-merge or merge queue) and DIRTY gets exactly one conflict-resolution request from node_pr_landing_orchestrator per (PR, head, base head) and no arm or enqueue; a second record with the same three values emits nothing more; after the base or head moves a new request is allowed -- falsifier: uv run pytest tests/unit/nodes/node_pr_landing_orchestrator/test_dirty_armed_conflict_request_omn_20750.py -q fails when the orchestrator emits nothing for the recorded omnimarket#3722 DIRTY read, emits an arm or enqueue, or emits twice for the same triple"
