schema_version: "1.0.0"
ticket_id: "OMN-20750"
title: "S8: The landing controller's remaining actions move into the landing nodes and the launchd job is retired"
summary: "Slice AC-M9 of S8 (update-branch and conflict handling move into the landing nodes): node_pr_landing_orchestrator answers a green head GitHub's own read reports armed (auto-merge or merge queue) and dirty with exactly one conflict request per (PR, head, base head), node_pr_lifecycle_fix_effect's conflict block reason on its fix-start command topic, and never with an arm or an enqueue. The head needs the orchestrator's own green verdict; a red head gets none. A held, draft or parked PR gets none; a moved head or base allows a new request once the head is green. The request takes update_branch's mode, which the contract keeps dry_run in every repository while the landing controller still owns conflict work. The REST PR read now carries the base branch head (base_sha) for the key."
is_seam_ticket: false
