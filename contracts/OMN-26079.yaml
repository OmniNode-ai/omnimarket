schema_version: 1.0.0
ticket_id: OMN-26079
title: Prove the runner-group exposure reading and delegation scenario units on the lab host
summary: The runner-group write node reads the REST workflow restriction boolean and maps it to the existing result field used by the hourly exposure reader. The status rows, deployed run and installer receipts depend on the lab host and are checked by the local Done gate.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn26079-running
    statement: Read the deployed jobs and record a running observation or an owned blocker for each change.
    acceptance:
      - id: AC2
        statement: 'AC2: each change reads running where it belongs (a log line, a unit exit 0, a health read or a job record), or its STATUS row names the single cause and who must act -- falsifier: a STATUS row carries neither an observed= cell nor a named cause and actor'
evidence_requirements:
  - kind: tests
    description: Runner-group REST response regression tests through the GitHub repo-write node handler.
    command: uv run --frozen pytest -q --no-cov -n 0 -p no:randomly tests/unit/nodes/node_github_repo_write_effect/test_handler_runner_group_get.py
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn26079-ac1-status-rows
    description: The lane has a STATUS row for each in-scope change with a timestamp and an installed observation or a blocker.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: >-
          bash -o pipefail -c '
          python3 "${OMNI_PLUGIN_ROOT:?}/skills/lane-brief/scripts/lane_brief.py" grep "lane=act2050-b" |
          awk -F " [|] " '"'"'
          / \| STATUS \| / && / \| lane=act2050-b \| / && / \| read_at=/ {
            if (($0 ~ / \| installed=/ && $0 ~ / \| observed=/) || $0 ~ / \| blocked=/) {
              for (i = 3; i <= NF; i++) if ($i ~ /^pr=/) seen[$i] = 1
            }
          }
          END { exit !(seen["pr=overlays#707"] && seen["pr=omnimarket#6335"] && seen["pr=overlays#409"]) }
          '"'"''
        cwd: .
  - id: dod-omn26079-ac2-rest-boolean
    description: Hosted regression for AC2. The handler completes for each REST boolean, retains pagination, and still refuses a missing or non-boolean restriction.
    source: manual
    binds_ac: [AC2]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest -q --no-cov -n 0 -p no:randomly tests/unit/nodes/node_github_repo_write_effect/test_handler_runner_group_get.py
        cwd: .
  - id: dod-omn26079-ac2-live-dispositions
    description: Each scoped STATUS row carries a live observation or names both a cause and an owner.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: >-
          bash -o pipefail -c '
          python3 "${OMNI_PLUGIN_ROOT:?}/skills/lane-brief/scripts/lane_brief.py" grep "lane=act2050-b" |
          awk '"'"'
          / \| STATUS \| / && / \| lane=act2050-b \| / && / \| pr=(overlays#707|omnimarket#6335|overlays#409) \| / {
            count++
            if ($0 !~ / \| observed=[^ |]/ &&
                ($0 !~ / \| cause=[^ |]/ || $0 !~ / \| owner=[^ |]/)) invalid = 1
          }
          END { exit !(count && !invalid) }
          '"'"''
        cwd: .
  - id: dod-omn26079-ac3-installer-evidence
    description: The lane's scoped STATUS rows cite installer receipts and record zero shared-dev restarts and manual host edits.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: >-
          bash -o pipefail -c '
          python3 "${OMNI_PLUGIN_ROOT:?}/skills/lane-brief/scripts/lane_brief.py" grep "lane=act2050-b" |
          awk '"'"'
          / \| STATUS \| / && / \| lane=act2050-b \| / && / \| pr=(overlays#707|omnimarket#6335|overlays#409) \| / {
            count++
            if ($0 !~ / \| installer_receipt=[^ |]/ ||
                $0 !~ / \| shared-dev-restarts=0( \| |$)/ ||
                $0 !~ / \| manual-host-edits=0( \| |$)/ ||
                $0 ~ / \| restart=true( \| |$)/) invalid = 1
          }
          END { exit !(count && !invalid) }
          '"'"''
        cwd: .
  - id: dod-omn26079-integration-proof
    description: Dispatch the installed hourly exposure unit to the lab host after dev adoption and require a new live provider reading with a ledger receipt. Hosted deploy validation can classify this probe without access to the lab.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: >-
          onex lab-work run --bus-lane dev --omnibase-path "${OMNI_HOME:?}"
          --host h053 --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)"
          --lane dod-integration-proof-26079 --kind test --
          bash -euc '
          log="${OMNI_HOME:?}/.onex_state/runner-group-exposure/exposure.out.log";
          test -f "$log";
          before=$(tail -n 1 "$log");
          systemctl --user start --wait onex-runner-group-exposure-hourly.service;
          after=$(tail -n 1 "$log");
          test "$after" != "$before";
          printf "%s\n" "$after" |
          grep -E "^READING host=h053 backend=github .* outcome=read ledger=(written|already-written) key=[^ ]+ calls=[1-9][0-9]* ";
          '
        cwd: .
