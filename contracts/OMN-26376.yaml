schema_version: 1.0.0
ticket_id: OMN-26376
title: The lab fill unit runs on a lab host, finds its work in live state and a fresh pool snapshot instead of refusing with FileNotFoundError and a stale snapshot
summary: 'node_lab_fill_effect reads its work live in goal order (the integration ledger NOT RUNNING lines no lane owns, the red goal pull requests of the PR watcher state, the open tickets of the Linear snapshot), each source declared in the unit overlay; a declared source that is absent, unreadable or stale refuses the pass naming the source. The host installer''s registry units declare lab-fill-tick-systemd (a systemd timer, every 1200 s, run limit 1020 s) and the launchd entry lab-fill-tick is removed. The pool snapshot''s 180 s bound is unchanged.'
is_seam_ticket: true
interface_change: true
interfaces_touched:
- public_api
requirements:
- id: req-omn26376-lab-fill-finds-its-work-and-runs-on-a-lab-host
  statement: The lab-fill unit runs as a systemd timer on a lab host and reads its work from declared live sources, refusing with the source named when one is unreadable.
  acceptance:
  - id: AC1
    statement: 'AC1: the approved-work input the tick reads exists at the path the unit declares, produced by its owner on the declared path (no manual file copy) -- falsifier: the err log lab-fill-tick.err.log after the next run still shows reason=approved-work'
  - id: AC2
    statement: 'AC2: the pool snapshot the tick reads is no older than its 180 s bound when the tick runs, by fixing the producer cadence or the declared read, never by widening the bound -- falsifier: the err log shows reason=pool-snapshot after the fix, or the diff changes the 180 s value'
  - id: AC3
    statement: 'AC3: one scheduled run after the fix exits 0 -- falsifier: `launchctl print gui/$(id -u)/ai.omninode.lab-fill` shows last exit code other than 0 after the fix time'
  - id: AC4
    statement: 'AC4: the dev version is ahead of the published v0.4.325 after the post-release bump -- falsifier: pyproject.toml [project].version still reads 0.4.325 or a work contract pins a stale uv.lock digest'
evidence_requirements:
- kind: tests
  description: The live work source readers, the unit entry golden and refusal chains, the seam and the installer unit tests run at the pushed head.
  command: uv run pytest tests/nodes/node_lab_fill_effect/test_live_work_source.py tests/nodes/node_lab_fill_effect/test_runtime_lab_fill_tick.py tests/nodes/node_lab_fill_effect/test_runtime_lab_fill_tick_refusals.py tests/nodes/node_lab_fill_effect/test_seam_lab_fill_pool_snapshot_to_tick.py tests/nodes/node_host_installer_registry_units/test_lab_fill_tick_unit.py -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn26376-ac1
  description: 'AC1 read for the unit on its new host: no stored list is read; the work comes from declared live sources in goal order and an absent, unreadable or stale declared source refuses the pass with reason=work-source:<name> and never reason=approved-work.'
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_lab_fill_effect/test_live_work_source.py tests/nodes/node_lab_fill_effect/test_runtime_lab_fill_tick_refusals.py -q --no-cov --tb=line
    cwd: .
- id: dod-omn26376-ac2
  description: 'AC2 read for the unit on its new host: the pool snapshot is read under its unchanged 180 s bound and a stale or missing snapshot refuses with reason=pool-snapshot; the overlay change leaves the bound as it was.'
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_lab_fill_effect/test_runtime_lab_fill_tick_refusals.py tests/nodes/node_lab_fill_effect/test_seam_lab_fill_pool_snapshot_to_tick.py -q --no-cov --tb=line -k "snapshot"
    cwd: .
- id: dod-omn26376-ac3
  description: 'AC3 node half: the registry units declare lab-fill-tick-systemd (1200 s, run limit 1020 s) and no launchd unit carries the fill; a dry install renders the timer and service naming the module. The read of one scheduled run on the host is the lab install readback, not this check.'
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_host_installer_registry_units/test_lab_fill_tick_unit.py tests/nodes/node_lab_fill_effect/test_runtime_lab_fill_tick.py -q --no-cov --tb=line
    cwd: .
- id: dod-omn26376-integration-proof
  description: The pushed head ran the live work readers, the unit entry, the seam and the installer unit tests on a lab host through the lab work runner and exited 0. Hosted CI cannot reach the lab, so only the local Done gate runs this check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-26376 -- uv run --frozen pytest tests/nodes/node_lab_fill_effect/test_live_work_source.py tests/nodes/node_lab_fill_effect/test_runtime_lab_fill_tick.py tests/nodes/node_lab_fill_effect/test_runtime_lab_fill_tick_refusals.py tests/nodes/node_lab_fill_effect/test_seam_lab_fill_pool_snapshot_to_tick.py tests/nodes/node_host_installer_registry_units/test_lab_fill_tick_unit.py -q --no-cov
    cwd: .
- id: dod-omn26376-missing-line-and-writer-order
  description: 'A stale or absent pool snapshot or work source ends the fill pass with the line MISSING <source> age=<s> bound=<s> written first, before the REFUSED line, and the pool snapshot writer stores the snapshot and its record before the emission mirror is touched; the 180 s bound is unchanged.'
  source: manual
  binds_ac:
  - AC1
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_lab_fill_effect/test_runtime_lab_fill_tick_missing_line.py tests/nodes/node_lane_host_pool_snapshot_effect/test_pool_snapshot_write_before_mirror.py -q --no-cov --tb=line
    cwd: .
- id: dod-omn26376-post-release-bump-0-4-326
  description: 'Post-release bump after the 0.4.325 cut: pyproject.toml and uv.lock move to 0.4.326 through scripts/ci/post_release_dev_bump.py, the 70 work contracts that pin the uv.lock digest move with it, and the CHANGELOG.md the release commit re-added is deleted as the removed-prose test requires. At dev 5b1931de8a the version equals v0.4.325, the script declares bump and the release-identity hook refuses packaged-source commits.'
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/ci/test_post_release_dev_bump_omn18010.py tests/ci/test_post_release_dev_bump_omn26376.py tests/ci/test_repository_prose_removed_omn17427.py tests/nodes/test_work_contract_pins_current.py -q -p no:randomly --no-cov
    cwd: .
