schema_version: "1.0.0"
ticket_id: OMN-26385
title: "Dev's overlay row declares a boot set so the dev runtime wires only the contracts it needs and starts the rest on first request"
summary: "The runtime contract hot-load lane overlay document model accepts the optional lazy_start block on a lane row exactly as the runtime's own policy model does (same fields, same refusals), so the overlay home can carry a boot set for one lane. The overlay home's own tests (boot set, gateway, single lane, unknown contract) are bound in that repository's pull request; the live criteria AC6 is read from the dev runtime after the orchestrator's roll."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn26385-lane-row-accepts-lazy-start
    statement: "The lane row model accepts an optional lazy_start block and refuses what the runtime's ModelLazyStartPolicy refuses: a blank or repeated name, a budget of zero or less, retries below zero, an undeclared key."
    acceptance:
      - id: AC1
        statement: "AC1: the lane row model accepts an optional lazy_start block with ingress_contract, boot_contracts, budget_seconds and max_retries, and refuses what the runtime's own policy model refuses -- falsifier: the seam test's lazy_start cases fail on the model before this change and pass after it"
evidence_requirements:
  - kind: tests
    description: "The seam test of the lane overlay document model, with the lazy_start cases."
    command: "uv run pytest tests/unit/models/test_contract_hotload_lane_overlay_document_omn24215.py -q --no-cov"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-omn26385-ac1-model
    description: "The model side of AC1: a lane row with a lazy_start block validates, a row without one holds None, and each refusal of the runtime's policy model is refused here (4 of the new cases fail on the old model)."
    source: manual
    binds_ac: [AC1]
    checks:
      - check_type: test_passes
        check_value: >-
          uv run pytest tests/unit/models/test_contract_hotload_lane_overlay_document_omn24215.py -q --no-cov
  - id: dod-omn26385-integration-proof
    description: "Local Done gate only, so it binds no criterion here: on a lab host the seam test runs at the pushed head through onex lab-work, the placement the lanes use for a run beyond one file."
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: >-
          onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-26385 --kind test -- uv run --frozen pytest tests/unit/models/test_contract_hotload_lane_overlay_document_omn24215.py -q --no-cov
