schema_version: 1.0.0
ticket_id: OMN-22370
title: 'Lean line board T5: stage counts and the thirteen stop kinds with evidence in the floor compute'
summary: >-
  Every line of the factory floor compute carries its work tasks counted per stage (planned, building, pr-open, merged, running, or unread), its owner (the lane holding a live CLAIM on one of its tickets), and its stops. A stop is one of thirteen kinds, in the contract's order, each with a sentence, a time, a non-empty evidence tuple (ledger rows, pull request check contexts, source health entries, merges, running reads) and a cause row or the line cause not recorded. A task is counted at no stage its evidence does not prove: a recorded done, a terminal outcome or a closed ticket proves none; a task is merged only when every pull request it names that is not closed unmerged is merged, and running only when each of those merges has running evidence. A line with a stop beyond a soft andon cause reads stopped, and its percent built, line evidence and progress count only work that is merged, running and proven. The stop kinds, their sentences, the stage order, the sources each class of line depends on, the outcomes, the run-chain length and the idle bar are the contract's line_stops block; deleting a key fails closed naming it. The effect now draws all six line classes, names its source health after the plan's eight dependencies, and reads an absent pull request watcher state, ledger or plans directory as unread instead of refusing. T2's seven frozen cases and their repaired variants pass with the strict expected-failure wrapper removed.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn22370-line-stops
  statement: Every line states, per task, the stage its evidence proves and every reason it is stopped with the evidence behind each reason, and an unread source is unread, never a zero or fine.
  acceptance:
  - id: AC1
    statement: 'AC1: S1 to S6, the unread case and their repaired variants pass -- falsifier: uv run pytest tests/nodes/node_factory_floor_compute/test_line_board_cases.py -q'
  - id: AC2
    statement: 'AC2: for every stop kind an item carrying it is counted at no stage its evidence does not prove, and percent_built, line_evidence, pill, progress and board text show no progress the evidence does not prove -- falsifier: one mixed-line fixture per stop kind in uv run pytest tests/nodes/node_factory_floor_compute -q -k "stop or stage or line_board"'
  - id: AC3
    statement: 'AC3: an unread source gives unread, never a zero, fine or a missing stop -- falsifier: one fixture per source health state in uv run pytest tests/nodes/node_factory_floor_compute -q -k "stop or stage or line_board"'
  - id: AC4
    statement: 'AC4: an unanswered ask on the same subject gives blocked-on-person, and an ask on another subject, an answered ask or none gives person-blocker-unverified -- falsifier: four fixtures in uv run pytest tests/nodes/node_factory_floor_compute -q -k "stop or stage or line_board"'
  - id: AC5
    statement: 'AC5: a stop with an empty evidence tuple cannot be built, and every stop without a cause row says cause not recorded at any age -- falsifier: a constructor-raises test and the S2 fixture at 101 minutes in uv run pytest tests/nodes/node_factory_floor_compute -q'
  - id: AC6
    statement: 'AC6: every value is contract config and deleting stop_kinds fails closed naming the key -- falsifier: a test with the key removed in uv run pytest tests/nodes/node_factory_floor_compute -q'
  - id: AC7
    statement: 'AC7: on h051 a second reader agrees with 10 of 10 stops sampled at random against the ledger and the watcher -- falsifier: any disagree in the recorded sample'
