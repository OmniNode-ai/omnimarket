  description: The stop and stage tests with their named injected breaks (an ask that ignores its subject, a task merged when any pull request merged, a stop that may carry no evidence, an unread source read as fine) and the rest of the factory floor compute and effect tests.
  command: uv run pytest tests/nodes/node_factory_floor_compute tests/nodes/node_factory_floor_effect -q --no-cov
