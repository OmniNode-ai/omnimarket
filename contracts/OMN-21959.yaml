        statement: 'AC3: a detector test recognises the classes bus-binding-degraded, bus-binding-outage and bus-binding-outbox-refused from their recorded evidence blocks and the actor resolves each in code, emitting to the exception queue only a case it cannot resolve -- falsifier: uv run pytest tests -q -k bus_binding_exception_actor'
evidence_requirements:
