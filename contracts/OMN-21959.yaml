---
schema_version: 1.0.0
ticket_id: OMN-21959
title: A ledger guard's refusal of a replayed bus-binding append is read and settled in code, and the one case code cannot settle stays open with what is missing named
summary: Seven recorded exception-queue cases of class bus-binding-outbox-refused were refused by a ledger guard (the friction guard OMN-18274, the worktree cell guard OMN-20148), not by a request-id clash. A detector reads the guard and the lane from the case's own words, and an actor settles each case in code. A lane whose CLAIM a TERMINAL already closes is superseded. A case whose cause has since been made good (a FRICTION row now exists, the removed tree is gone, the cell names the CLAIM's worktree) has its refused rows appended again, unchanged. A case that needs a fact only the lane has (a cost, which of two trees was used) stays open once, with that fact named. A decision row is never resolved. A friction replay scenario replays the seven recorded cases against a real queue as recorded and after the causes are made good.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
