schema_version: 1.0.0
ticket_id: OMN-21959
title: The bus binding reports degraded, naming the missing topic, when appends are queued and a required topic is unknown; a clash on a request id names both digests; the three bus-binding exception classes resolve in code
summary: The binding reducer counts a durable bus with a queued outbox and an unknown required topic as failed instead of healthy, and open_bound_bus takes a topic probe that feeds it. The ledger append handler names the request id and both digests when a request id already belongs to different rows, and a replay of the same rows stays a duplicate. A detector recognises bus-binding-degraded, bus-binding-outage and bus-binding-outbox-refused from their evidence blocks, and an actor resolves each in code or emits the one case it cannot. The default topic probe against a broker is not part of this change.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn21959-bus-binding-exceptions
    statement: The recorded bus-binding rows become fixtures, and each acceptance criterion has a test that fails without the change.
    acceptance:
      - id: AC1
        statement: 'AC1: a regression test built from the recorded 2026-11-02T02:29:40Z STATUS row and the three exception-queue evidence blocks (fixture path under the node tests) fails on the current reducer when pending_outbox is above zero and a topic is unknown, and passes once the binding reports a degraded state naming the missing topic instead of healthy -- falsifier: uv run pytest tests -q -k bus_binding_outbox_degraded'
      - id: AC2
        statement: 'AC2: a test asserts a queued append whose request id is already on the ledger is settled as a duplicate, never moved to refused as a loss, and a differing payload under the same id is refused with the id and both digests named -- falsifier: uv run pytest tests -q -k outbox_request_id_clash'
      - id: AC3
        statement: 'AC3: a detector test recognises the classes bus-binding-degraded, bus-binding-outage and bus-binding-outbox-refused from their recorded evidence blocks and the actor resolves each in code, emitting to the exception queue only a case it cannot resolve -- falsifier: uv run pytest tests -q -k bus_binding_exception_actor'
  - id: req-omn21959-wired-degraded-settlement
    statement: The bus binding runs its declared degraded exception settlement on client commands.
    acceptance:
      - id: AC4
        statement: 'open_bound_bus resolves this lane''s recorded non-decision bus-binding-degraded rows on a healthy durable command with empty outbox, without needing remembered episode, while decision rows and rows with queued requests stay open -- falsifier: env PYTHONDONTWRITEBYTECODE=1 uv run pytest tests/nodes/node_bus_binding_reducer/test_bus_binding_degraded_wired.py --no-cov -q -k "recorded_row_left_open or decision_row or requests_still_queued"'
      - id: AC5
        statement: 'one degraded episode appends only one alarm row even after external closure, and a subsequent episode appends a new row -- falsifier: env PYTHONDONTWRITEBYTECODE=1 uv run pytest tests/nodes/node_bus_binding_reducer/test_bus_binding_degraded_wired.py --no-cov -q -k episode'
evidence_requirements:
  - kind: tests
    description: The bus-binding suites run at the pushed head on a lab host.
    command: uv run pytest tests/nodes/node_bus_binding_reducer tests/unit/bus_binding tests/handlers/bus_binding -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn21959-ac1
    description: AC1 feeds the recorded STATUS row to the tick reader and the reducer and asserts a degraded state on the in-memory binding naming the missing topic, with each of the two facts alone leaving the health read as it was.
    source: manual
    binds_ac:
      - AC1
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/nodes/node_bus_binding_reducer/test_bus_binding_outbox_degraded.py -q --no-cov --tb=line
        cwd: .
  - id: dod-omn21959-ac2
    description: AC2 replays a landed request through the outbox drain and expects a duplicate with nothing in refused, then queues a different payload under the same id and expects a refusal naming the id and both digests.
    source: manual
    binds_ac:
      - AC2
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/nodes/node_bus_binding_reducer/test_outbox_request_id_clash.py -q --no-cov --tb=line
        cwd: .
  - id: dod-omn21959-ac3
    description: AC3 replays the recorded evidence blocks through the detector and the actor against a temporary exception queue and expects resolved cases to emit nothing and unresolved ones to emit once.
    source: manual
    binds_ac:
      - AC3
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/nodes/node_bus_binding_reducer/test_bus_binding_exception_actor.py -q --no-cov --tb=line
        cwd: .
  - id: dod-omn21959-integration-proof
    description: The pushed head ran the bus-binding suites, including the replay of the recorded degraded rows through the detector and the actor, on a lab host and exited 0. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-21959 -- uv run --frozen pytest tests/nodes/node_bus_binding_reducer -q --no-cov
        cwd: .
  - id: dod-omn21959-deploy-probe-detector
    description: 'Deploy probe: the detector module GitHub serves at the checked-out commit defines classify_block, and the checked-out actor calls it. The module is absent at the merge base, so the content read fails there.'
    source: manual
    checks:
      - check_type: command
        check_value: bash -o pipefail -c 'gh api "repos/OmniNode-ai/omnimarket/contents/src/omnimarket/handlers/bus_binding/detector.py?ref=$(git rev-parse HEAD)" --jq .content | base64 -d | grep -F "def classify_block" > /dev/null'
        cwd: .
      - check_type: command
        check_value: grep -F 'cls = classify_block(row)' src/omnimarket/handlers/bus_binding/exception_actor.py
        cwd: .
  - id: dod-omn21959-ac3-recorded-outage-replay
    description: AC3 replays all three recorded outage rows through the detector and the exception actor, checking healthy-bus resolution, one emitted row during an outage, missing-identity diagnostics, and decision-row refusal.
    source: manual
    binds_ac:
      - AC3
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/nodes/node_bus_binding_reducer/test_bus_binding_outage_replay.py -q --no-cov --tb=line
        cwd: .
  - id: dod-omn21959-guard-refusal
    description: The replay puts the seven recorded guard-refusal cases in a real exception queue and expects none resolved as recorded, then expects the superseded, now-valid and still-open cases told apart after the causes are made good, with nothing appended for a superseded case and a decision row left alone.
    source: manual
    binds_ac:
      - AC3
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/handlers/bus_binding/test_bus_binding_outbox_refused_guard.py -q --no-cov --tb=line
        cwd: .
  - id: dod-omn21959-deploy-probe-guard-refusal
    description: 'Deploy probe: the guard-refusal actor GitHub serves at the checked-out commit defines settle_guard_refusals. The module is absent at the merge base, so the content read fails there.'
    source: manual
    checks:
      - check_type: command
        check_value: bash -o pipefail -c 'gh api "repos/OmniNode-ai/omnimarket/contents/src/omnimarket/handlers/bus_binding/guard_refusal.py?ref=$(git rev-parse HEAD)" --jq .content | base64 -d | grep -F "def settle_guard_refusals" > /dev/null'
        cwd: .
      - check_type: command
        check_value: grep -F 'def settle_guard_refusals' src/omnimarket/handlers/bus_binding/guard_refusal.py
        cwd: .
  - id: dod-omn21959-wired-ac4
    description: open_bound_bus resolves this lane's recorded non-decision bus-binding-degraded rows on a healthy durable command with empty outbox, without needing remembered episode, while decision rows and rows with queued requests stay open
    source: manual
    binds_ac:
      - AC4
    checks:
      - check_type: test_passes
        check_value: env PYTHONDONTWRITEBYTECODE=1 uv run pytest tests/nodes/node_bus_binding_reducer/test_bus_binding_degraded_wired.py --no-cov -q -k "recorded_row_left_open or decision_row or requests_still_queued"
        cwd: .
  - id: dod-omn21959-wired-ac5
    description: one degraded episode appends only one alarm row even after external closure, and a subsequent episode appends a new row
    source: manual
    binds_ac:
      - AC5
    checks:
      - check_type: test_passes
        check_value: env PYTHONDONTWRITEBYTECODE=1 uv run pytest tests/nodes/node_bus_binding_reducer/test_bus_binding_degraded_wired.py --no-cov -q -k episode
        cwd: .
  - id: dod-omn21959-deploy-probe-wired-policy
    description: 'this hosted smoke checks the runtime settlement policy loaded from node_bus_binding_reducer/contract.yaml: alarm_scope episode and settle_on_healthy_read bus-binding-degraded'
    source: manual
    execution_scope: hosted_and_local
    checks:
      - check_type: test_passes
        check_value: env PYTHONDONTWRITEBYTECODE=1 uv run pytest tests/nodes/node_bus_binding_reducer/test_bus_binding_degraded_wired.py --no-cov -q -k the_contract_declares_the_settlement_step
        cwd: .
