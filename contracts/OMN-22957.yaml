schema_version: 1.0.0
ticket_id: OMN-22957
title: "Piece 11's first task: the J10 join test: a runtime-affecting merge yields a PASS lab receipt keyed by its sha and the running runtime reads back that exact sha, golden and error"
summary: The dev deploy reading node gains a J10 join handler. For one merge it reads the lab pass receipts of the exact merged sha through an injected reader and asks the running runtime one request carrying the join's correlation id through an injected probe. A PASS receipt on the required lane inside the deadline, with a runtime that answers functionally, reports the merged sha and echoes the correlation id, answers piece 11's chain on the floor's emission contract with a start then a success. Past the deadline a missing, late, failed or unreadable receipt, or a stale, broken or uncorrelated runtime, is named in a typed failure and piece 11 emits a start then a failure. Inside the deadline it emits nothing. A merge that is not runtime-affecting is exempt. The real backends (the lane-health projection and an HTTP read of the runtime) take every address and key name from an overlay model; the tests bind them to a loopback socket. The running wiring on the dev bus and the live overlay values are not part of this change.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn22957-j10-join
  statement: A runtime-affecting merge yields a PASS lab receipt keyed by its sha and the running runtime reads back that exact sha and answers one correlated functional request, with a golden and an error case.
  acceptance:
  - id: AC1
    statement: "AC1: golden join test: a runtime-affecting merge yields a PASS receipt keyed by its sha and the runtime answers one correlated functional request at that sha -- falsifier: uv run pytest tests/integration/test_join_j10.py -q -k golden"
  - id: AC2
    statement: "AC2: error join test: a PASS receipt beside a stale or broken runtime fails the join -- falsifier: uv run pytest tests/integration/test_join_j10.py -q -k error"
