---
schema_version: 1.0.0
ticket_id: OMN-21478
title: omnimarket enforces the internal sibling pins and reads omnibase_core, omnibase_spi and omninode-memory from their dev merge tags
summary: omnimarket calls omnibase_core's reusable Internal Sibling Pins check on every pull request, merge group and dev push, lists it as a required check, and pins omnibase_core, omnibase_spi and omninode-memory to dev merge tags in pyproject.toml and uv.lock so the core fix of OMN-21478 reaches omnimarket.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn21478-omnimarket-sibling-pins
  statement: omnimarket must run the core Internal Sibling Pins check as a required context and resolve its internal siblings from dev merge tags.
  acceptance:
  - id: AC1
    statement: 'AC1: omnimarket CI calls the core reusable at a full 40-hex sha and the context is a required row of .github/required-checks.yaml and asserted by the CI Summary gate -- falsifier: uv run pytest tests/unit/workflows/test_internal_sibling_pins_omn21478.py tests/unit/scripts/ci/test_l4_event_scope_omn18963.py -q'
  - id: AC2
    statement: 'AC2: pyproject.toml pins omnibase-core, omnibase-spi and omninode-memory to dev merge tags in [tool.uv.sources] and uv.lock locks those tags -- falsifier: uv run pytest tests/unit/workflows/test_internal_sibling_pins_omn21478.py -q -k dev_merge_tag'
  - id: AC3
    statement: 'AC3: at the bumped omnibase_core dev tag, omnimarket reads the sibling pin policy from core''s first_party_ref contract and calls the moved core node modules, so the dependency provenance check and the generated event chains run -- falsifier: uv run pytest tests/scripts/test_check_dep_provenance.py -q -k dev_tag_pattern_controls_verdict'
  - id: AC4
    statement: 'AC4: the pinned infra adapter imports with the pinned core after the Done-write gate moved into its node package -- falsifier: uv run pytest tests/ci/test_runtime_sweep_import_check.py -q --no-cov -k real_repo_all_ok'
evidence_requirements:
- kind: tests
  description: The workflow calls the core reusable at a full sha, and the required-checks and CI Summary rows exist.
  command: uv run pytest tests/unit/workflows/test_internal_sibling_pins_omn21478.py tests/unit/scripts/ci/test_l4_event_scope_omn18963.py -q
- kind: tests
  description: pyproject.toml and uv.lock pin each of the three siblings to one dev merge tag.
  command: uv run pytest tests/unit/workflows/test_internal_sibling_pins_omn21478.py -q -k dev_merge_tag
emergency_bypass:
