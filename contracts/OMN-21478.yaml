  - check_type: test_passes
    check_value: uv run pytest tests/unit/workflows/test_internal_sibling_pins_omn21478.py -q -k dev_merge_tag
    cwd: ${OMNI_HOME}/omnimarket
  binds_ac:
  - AC2
- id: dod-omn21478-core-moved-modules
  description: The dependency provenance check takes the dev tag form from core's first_party_ref contract (find_violations accepts tag_pattern, absent at the merge base), and the generated event chains run the walker's node runtime.
  source: manual
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/scripts/test_check_dep_provenance.py -q -k dev_tag_pattern_controls_verdict
    cwd: ${OMNI_HOME}/omnimarket
  binds_ac:
  - AC3
- id: dod-omn21478-deploy-published-imports
  description: 'Hosted source deployment probe: the published duplication sweep handler and linear triage receipt gate at the evaluated checkout commit import the moved core node modules. Fails on the merge base, where both import the removed omnibase_core.handlers paths. Public HTTPS only; proves published source, not activation on a host.'
  source: manual
  checks:
  - check_type: command
    check_value: |
      set -eu;
      ref="$(git rev-parse HEAD)";
      gh api "repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_duplication_sweep/handlers/handler_duplication_sweep.py?ref=${ref}" --jq .content | base64 -d | grep 'node_cross_repo_boundary_check_effect.runtime_migration_conflicts' >/dev/null;
      gh api "repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_linear_triage/services/done_write_receipt_gate.py?ref=${ref}" --jq .content | base64 -d | grep 'node_done_write_receipt_gate_compute.handler_done_write_receipt_gate' >/dev/null
    cwd: .
  binds_ac:
  - AC3
- id: dod-omn21478-infra-core-import-compatibility
  description: The real repository entry-point probe imports node_create_ticket through the pinned infra Linear adapter; the previous infra pin fails on the removed core handler module.
  source: manual
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/ci/test_runtime_sweep_import_check.py -q --no-cov -k real_repo_all_ok
    cwd: ${OMNI_HOME}/omnimarket
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_create_ticket/test_handler_create_ticket.py tests/nodes/node_create_ticket/test_create_ticket_gate.py -q --no-cov
    cwd: ${OMNI_HOME}/omnimarket
  binds_ac:
  - AC4
- id: dod-omn21478-hosted-infra-gate-binding
  description: 'Hosted installed-package probe: resolve the pinned infra Done-write gate from the installed core contract and import the ticket node. The old infra pin fails at import. This checks package composition, not activation on a deployed host.'
  source: manual
  checks:
  - check_type: command
    check_value: uv run python -c 'from omnibase_infra.handlers.done_write_receipt_guard import resolve_done_write_receipt_gate; from omnimarket.nodes.node_create_ticket import HandlerCreateTicket; gate = resolve_done_write_receipt_gate(); assert callable(gate.decide); print("pinned infra/core Done-write binding and ticket node import OK")'
    cwd: .
  binds_ac:
  - AC4
