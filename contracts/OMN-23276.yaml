schema_version: 1.0.0
ticket_id: OMN-23276
title: lane_commit_signing overlay model for the overlays pin check
summary: >-
  omnimarket gains ModelLaneCommitSigningOverlay (src/omnimarket/models/node_overlays), a pure-pydantic typed model of the
  lane_commit_signing overlay: host name to a row with a key path and an optional email, unknown fields refused. The
  overlays repository's check that every overlay has a validating model reads this model.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23276-model
  statement: omnimarket holds a typed lane_commit_signing overlay model whose validation refuses an overlay missing a required field.
  acceptance:
  - id: AC1
    statement: 'AC1: omnimarket holds a typed lane_commit_signing overlay model whose validation refuses an overlay missing a required field -- falsifier: uv run pytest tests -q -k lane_commit_signing in omnimarket, failing with the model removed'
evidence_requirements:
- kind: tests
  description: The lane_commit_signing overlay model tests (golden load, malformed documents refused by field, pydantic-only import probe).
  command: uv run --frozen pytest tests/unit/models/test_lane_commit_signing_overlay_omn22993.py -q --no-cov -k lane_commit_signing
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23276-ac1-model
  description: >-
    The 17 tests load the golden overlay through the model and refuse each of 13 malformed documents (a host row with no key, an empty hosts map,
    a parent-directory segment in the key, a malformed email, unknown fields and the rest) by field. The named break is the model module
    removed: the same command stops at collection with ModuleNotFoundError (exit 2).
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/models/test_lane_commit_signing_overlay_omn22993.py -q --no-cov -k lane_commit_signing
    cwd: .
- id: dod-omn23276-integration-proof
  description: The lane_commit_signing model tests run on a lab host at the pushed head through the lab-work node.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23276 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/models/test_lane_commit_signing_overlay_omn22993.py -q --no-cov -k lane_commit_signing
    cwd: .
