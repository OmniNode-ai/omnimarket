schema_version: "1.0.0"
ticket_id: OMN-17214
title: "The gateway terminal writer hears the delegate-skill failure topic, so C28's dying run reads failed"
summary: "C28 run c28-20261126T142329Z-e6b81d5d failed its invalid_payload_observed clause: the dying run (an unknown task_type sent to onex.cmd.omnimarket.delegate-skill.v1) stayed published and never read failed. The dispatch engine refuses it as publisher_malformed and publishes the typed terminal on the failure topic the delegate-skill contract declares, onex.evt.omnimarket.delegate-skill-failed.v1; node_gateway_workflow_terminal_effect subscribed only to the omnibase-infra delegation pair, so it never heard that terminal. This change subscribes the writer to the delegate-skill failure topic through a route that takes the publisher_malformed terminal and no other failure."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn17214-delegate-skill-malformed-terminal
    statement: "A publisher_malformed terminal published on the delegate-skill failure topic closes the one gateway row of its correlation id as failed; any other failure on that topic is neither written nor dead-lettered by this writer."
    acceptance:
      - id: AC8
        statement: "AC8: the gateway terminal writer declares, subscribes to and holds a broker read grant for the delegate-skill failure topic; a publisher_malformed terminal there closes its row failed, and an ordinary delegate-skill failure leaves the row and the dead-letter topic untouched -- falsifier: uv run pytest tests/nodes/node_gateway_workflow_terminal_effect/test_delegate_skill_failed_route.py -q fails at origin/dev"
evidence_requirements:
  - kind: tests
    description: "The terminal writer's tests pass at the pushed head."
    command: "uv run --frozen pytest tests/nodes/node_gateway_workflow_terminal_effect -q --no-cov -n 0 -p no:cacheprovider -m 'not kafka'"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-omn17214-delegate-skill-malformed-terminal
    description: "AC8: the writer takes the publisher_malformed terminal of the delegate-skill command from its failure topic and closes the row failed, and leaves every other failure on that topic alone. The route test fails at origin/dev (the topic is not routed) and passes with the change."
    source: manual
    binds_ac: [AC8]
    checks:
      - check_type: test_passes
        check_value: >-
          uv run --frozen pytest tests/nodes/node_gateway_workflow_terminal_effect/test_delegate_skill_failed_route.py -q --no-cov -n 0 -p no:cacheprovider
        cwd: .
  - id: dod-omn17214-integration-proof
    description: "Local Done gate only, so it binds no criterion here: the terminal writer's tests run on a lab host at the pushed head."
