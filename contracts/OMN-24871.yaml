schema_version: 1.0.0
ticket_id: OMN-24871
title: The runner group read names the flag GitHub returns, so the hourly reading can read the group
summary: The write node's runner-group-get handler and the exposure node's direct GitHub source read the key restricted_to_selected_workflows from GitHub's runner group body. GitHub names that flag restricted_to_workflows, so the write node answered github_refused (both GETs returned 200) and the hourly reading carried reason=group-read-refused. Both readers now read restricted_to_workflows.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24871-group-flag
  statement: A runner group body carrying GitHub's flag restricted_to_workflows is read; a body carrying only the old key is refused.
  acceptance:
  - id: AC4
    statement: 'AC4: the write node reads restricted_to_workflows from the runner group body and refuses a body that carries only restricted_to_selected_workflows -- falsifier: uv run pytest tests/unit/nodes/node_github_repo_write_effect/test_handler_runner_group_get.py -q fails'
evidence_requirements:
- kind: tests
  description: The runner-group-get handler tests, the bus group read tests, the direct GitHub source tests (test_exposure_probe.py) and the golden chain.
  command: env -u PYTHONPATH uv run --frozen pytest tests/unit/nodes/node_github_repo_write_effect/test_handler_runner_group_get.py tests/nodes/node_runner_group_exposure_effect/test_bus_group_read.py tests/nodes/node_runner_group_exposure_effect/test_exposure_probe.py tests/test_golden_chain_github_repo_write_effect.py -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24871-ac4-handler-tests
  description: The runner-group-get handler reads restricted_to_workflows and refuses the old key.
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/nodes/node_github_repo_write_effect/test_handler_runner_group_get.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24871-ac4-bus-group-read
  description: The exposure node reads a group through the real write node handler behind a hand-written GitHub transport whose body is shaped as GitHub documents it (the one with the flag restricted_to_workflows).
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_runner_group_exposure_effect/test_bus_group_read.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24871-direct-source
  description: The exposure node's direct GitHub source reads restricted_to_workflows, refuses a body that carries only the old key and refuses a null flag instead of reading it as False.
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_runner_group_exposure_effect/test_exposure_probe.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24871-golden-chain
  description: The write node golden chain publishes a runner group read as completed from a body carrying restricted_to_workflows.
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/test_golden_chain_github_repo_write_effect.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24871-running-reading
  description: Hosted CI cannot reach the lab host. Only the local Done gate runs this unbound check; it reads the rolling ledger for a STATUS row naming this fix, pull request omnimarket#6332, installed on h053, and for the newest hourly reading row of host h053 showing a verdict of WORKING or NOT_WORKING with no reason=group-read-refused. It runs where the ledger path is set and fails until the merged fix is installed on h053 and the unit has run there.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: grep -F 'pr=omnimarket#6332' "$ONEX_LEDGER_PATH" | grep -qF 'installed=h053:' && grep -F 'src=runner-group-exposure' "$ONEX_LEDGER_PATH" | grep -F 'host=h053' | tail -n 1 | grep -E 'verdict=(WORKING|NOT_WORKING)' | grep -vF 'reason=group-read-refused'
    cwd: .
- id: dod-omn24871-integration-proof
  description: Hosted CI cannot reach the lab bus. Only the local Done gate runs this unbound check; it asks the deployed GitHub write node on the dev lane to read runner group 7 of the organization that owns the named repository (the group id and the repository are a runner_group_reads pair of its overlay) and fails while the write node answers failed, which it does until the redeployed write node reads restricted_to_workflows.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: onex scm runner-group-get OmniNode-ai/omnimarket --group-id 7 --lane dod-integration-proof-24871 --bus-lane dev | grep -F '"outcome":"completed"'
    cwd: .
