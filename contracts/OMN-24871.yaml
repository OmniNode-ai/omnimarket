schema_version: 1.0.0
ticket_id: OMN-24871
title: The runner group read names the flag GitHub returns, so the hourly reading can read the group
summary: The write node's runner-group-get handler and the exposure node's direct GitHub source read the key restricted_to_selected_workflows from GitHub's runner group body. GitHub names that flag restricted_to_workflows, so the write node answered github_refused (both GETs returned 200) and the hourly reading carried reason=group-read-refused. Both readers now read restricted_to_workflows.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24871-group-flag
  statement: A runner group body carrying GitHub's flag restricted_to_workflows is read; a body carrying only the old key is refused.
  acceptance:
  - id: AC4
    statement: 'AC4: the write node reads restricted_to_workflows from the runner group body and refuses a body that carries only restricted_to_selected_workflows -- falsifier: uv run pytest tests/unit/nodes/node_github_repo_write_effect/test_handler_runner_group_get.py -q fails'
evidence_requirements:
- kind: tests
  description: The runner-group-get handler tests, the bus group read tests and the golden chain.
  command: env -u PYTHONPATH uv run --frozen pytest tests/unit/nodes/node_github_repo_write_effect/test_handler_runner_group_get.py tests/nodes/node_runner_group_exposure_effect/test_bus_group_read.py -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24871-ac4-handler-tests
  description: The runner-group-get handler reads restricted_to_workflows and refuses the old key.
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/nodes/node_github_repo_write_effect/test_handler_runner_group_get.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24871-ac4-bus-group-read
  description: The exposure node reads a group through the real write node handler behind a recorded GitHub transport.
  source: manual
