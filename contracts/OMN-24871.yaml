  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_runner_group_exposure_effect/test_bus_group_read.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24871-running-reading
  description: Hosted CI cannot reach the lab host. Only the local Done gate runs this unbound check; it reads the rolling ledger for a STATUS row naming the merged pull request installed on h053. It runs where the ledger path is set and fails until a lane has read the unit run there.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: grep -F 'pr=omnimarket#6099' "$ONEX_LEDGER_PATH" | grep -F 'installed=h053:'
    cwd: .
- id: dod-omn24871-integration-proof
  description: Hosted CI cannot reach the lab bus. Only the local Done gate runs this unbound check; it asks the deployed GitHub write node on the dev lane to read runner group 7 of the organization and fails while the write node answers failed, which it does until the redeployed write node reads restricted_to_workflows.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: onex scm runner-group-get OmniNode-ai/omnimarket --group-id 7 --lane dod-integration-proof-24871 --bus-lane dev | grep -F '"outcome":"completed"'
    cwd: .
