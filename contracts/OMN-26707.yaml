schema_version: 1.0.0
ticket_id: OMN-26707
title: 'The lane work event classifier: a pure compute node that turns every raw result into a named lane work event'
summary: 'The overlay document of node_lane_work_event_classify_compute has a typed model in the shared overlay documents package, merged ahead of the node (omnimarket#6957), so its overlay document can be pinned to a merged revision that holds the model.'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn26707-overlay-model-ahead
  statement: The lane work event classifier's overlay document has a typed model in omnimarket that its overlay document can be pinned to ahead of the node.
  acceptance:
  - id: AC8
    statement: 'AC8: ModelLaneWorkClassifyOverlay validates the overlay document of the lane work event classifier and refuses a malformed one -- falsifier: tests/unit/models/test_lane_work_classify_overlay_document_omn26707.py fails collection or any of its tests fails'
evidence_requirements: []
dod_evidence:
- id: dod-omn26707-overlay-model-tests
  description: The overlay document model for the lane work event classifier accepts a valid document and refuses malformed ones; the test file fails at collection with ModuleNotFoundError before the model module exists and passes after.
  source: manual
  binds_ac:
  - AC8
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/models/test_lane_work_classify_overlay_document_omn26707.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn26707-overlay-model-spike-fields
  description: The shared overlay model carries evidence_limit, log_timestamp_pattern and the rule fields red_kind and source, the same four fields as the node's own model on omnimarket#6957; the tests that load them, and refuse a missing evidence_limit or a red_kind off a log_read rule, fail before the fields exist and pass after.
  source: manual
  binds_ac:
  - AC8
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/models/test_lane_work_classify_overlay_document_omn26707.py -q --no-cov -n 0 -p no:randomly -k "evidence_limit or log_timestamp or red_kind or source"
    cwd: .
- id: dod-omn26707-overlay-model-integration-proof
  description: Run the overlay model tests on a lab host at the pushed head. This local completion proof carries no hosted AC bindings.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-26707-model --kind test -- uv run --frozen pytest tests/unit/models/test_lane_work_classify_overlay_document_omn26707.py -q -n 0 --no-cov --refuse-skips
    cwd: .
