schema_version: 1.0.0
ticket_id: OMN-23961
title: Removing a scheduled job also clears its failed mark
summary: 'The registry installer''s uninstall of a systemd unit disabled the timer and removed both unit files but left the failed mark of the service and timer, so systemctl --user --failed kept listing a
  job that was removed on purpose. The uninstall now runs systemctl --user reset-failed on the service and the timer after the daemon-reload and ignores a refusal. A new test file holds the call check and the
  refusal check. Not in this change: the run on h053 (AC2), which is read after the branch is installed there.'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23961-reset-failed
  statement: The registry installer's uninstall of a systemd unit clears the failed state of its service and timer, and succeeds when the host refuses.
  acceptance:
  - id: AC1
    statement: 'AC1: the registry installer''s uninstall of a systemd unit clears the failed state of its service and timer, and still succeeds when the host refuses -- falsifier: pytest tests/nodes/node_host_installer_registry_units/test_systemd_uninstall_reset_failed.py
      fails on the base handler'
  - id: AC2
    statement: 'AC2: integrated: on h053 after uninstalling the installer''s landing-watcher-facts and landing-snapshot-cutover systemd units from the branch, systemctl --user --failed no longer lists
      either -- falsifier: systemctl --user --failed lists onex-landing-watcher-facts.service or onex-landing-snapshot-cutover.service'
evidence_requirements:
- kind: tests
  description: The uninstall reset-failed tests pass at the pushed head.
  command: uv run --frozen pytest tests/nodes/node_host_installer_registry_units/test_systemd_uninstall_reset_failed.py -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
