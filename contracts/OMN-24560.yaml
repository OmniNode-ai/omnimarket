schema_version: 1.0.0
ticket_id: OMN-24560
title: Worktree reconcile removes dead and stale-locked working copies and runs on the Mac
summary: The worktree reconcile node prunes a dead worktree (its gitdir is gone) and unlocks and removes a stale-locked one (no live ledger claim, process or unit, quiet past stale_lock_hours), names every removal in the run-completed event, and its schedule installer can install a launchd agent so the Mac runs the node in place of the frozen triage runner.
is_seam_ticket: true
interface_change: true
interfaces_touched:
- public_api
requirements:
- id: req-omn24560-dead-and-stale-lock
  statement: A dead worktree is pruned and reported, a stale-locked tree is unlocked and removed when its work is merged, a live lock is kept and named, and every removal is listed in the run-completed event.
  acceptance:
  - id: AC1
    statement: 'AC1: a linked worktree whose .git file names a gitdir that no longer exists is no longer a probe failure: past stale_hours with prune_dead_worktrees true it is pruned and reported (outcome pruned), with the knob false it is needs_human, and a young one, a held one and one holding a nested repository are never removed -- falsifier: uv run pytest tests/test_worktree_reconcile_dead_and_stale_lock.py -q'
  - id: AC2
    statement: 'AC2: a worktree lock with no live ledger claim, process, unit or ref lock, with a ledger read and quiet past stale_lock_hours, is unlocked and removed only when its work is merged on a merged_only host, while a lock held by a live claim, a young tree, a ref lock or a run with no ledger is kept and named in live_locked_paths -- falsifier: uv run pytest tests/test_worktree_reconcile_dead_and_stale_lock.py -q'
  - id: AC3
    statement: 'AC3: the run-completed event lists every removal (removed_paths, pruned_paths, unlocked_paths, live_locked_paths), old receipts still load, the per-host projection still writes its row, and golden and error chain event tests pass -- falsifier: uv run pytest tests/test_golden_chain_worktree_reconcile.py tests/test_worktree_reconcile_projection.py -q'
  - id: AC4
    statement: 'AC4: the schedule installer renders and installs a launchd agent for a host the overlay declares as launchd, resolves per-host paths with the registry root variable, and leaves the systemd render unchanged -- falsifier: uv run pytest tests/test_worktree_reconcile_schedule.py tests/test_worktree_reconcile_schedule_launchd.py tests/test_worktree_reconcile_schedule_paths.py -q'
  - id: AC5
    statement: 'AC5: integrated: after the orchestrator installs the Mac from the overlay, the Mac''s next scheduled run exits 0 and its receipt removes or names each of the 12 trees the old triage runner failed on, and the h202 unit installed from the branch reads exit 0 -- falsifier: launchctl print of the Mac agent plus the Mac state directory latest.json, and systemctl --user show onex-worktree-reconcile.service -p ExecMainStatus on h202'
evidence_requirements:
- kind: tests
  description: The node's focused tests at the pushed head; the new test file fails on the code before this change (it imports stale_lock, which did not exist).
  command: uv run pytest tests/test_worktree_reconcile_dead_and_stale_lock.py -q
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24560-ac1
  description: 'AC1: a dead worktree is pruned or sent to a person by the knob, never removed young, held or nested; against the code before this change the file fails at import.'
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/test_worktree_reconcile_dead_and_stale_lock.py -q
    cwd: .
- id: dod-omn24560-ac2
  description: 'AC2: a stale lock is unlocked and removed only when merged; a live lock, a young tree, a ref lock and a run with no ledger keep the tree.'
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/test_worktree_reconcile_dead_and_stale_lock.py -q
    cwd: .
- id: dod-omn24560-ac3
  description: 'AC3: the completed event names every removal; golden and error chain tests and the projection tests pass.'
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/test_golden_chain_worktree_reconcile.py tests/test_worktree_reconcile_projection.py -q
    cwd: .
- id: dod-omn24560-ac4
  description: 'AC4: the launchd and path-override schedule tests pass and the systemd render tests are unchanged.'
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/test_worktree_reconcile_schedule.py tests/test_worktree_reconcile_schedule_launchd.py tests/test_worktree_reconcile_schedule_paths.py -q
    cwd: .
- id: dod-omn24560-integration-proof
  description: 'AC5 lab proxy: the node tests run on a lab host at the pushed head; the h202 unit read and the Mac run after the orchestrator install are read by the orchestrator and are not claimed here.'
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24560 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/test_worktree_reconcile_dead_and_stale_lock.py -q
    cwd: .
- id: dod-omn24560-ac5-hosted-proxy
  description: 'hosted proxy for AC5: the rendered launchd agent is read by the Mac unit reader, and the node removes or names each tree in a run; the Mac and h202 readings themselves are read by the unbound integration proof item above.'
  source: manual
  binds_ac:
  - AC5
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/test_worktree_reconcile_schedule_launchd.py -q -k "unit_root"
    cwd: .
