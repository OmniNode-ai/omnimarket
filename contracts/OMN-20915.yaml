---
schema_version: "1.0.0"
ticket_id: "OMN-20915"
title: "GitHub source-control nodes live in omnimarket only: the PR poller and the webhook ingress move from omnibase_infra, on the one omnimarket GitHub transport"
summary: "node_github_pr_poller_effect and node_github_webhook_ingress_effect now live in omnimarket on the same topics and the same event models, registered as onex.nodes entry points. The poller reads GitHub through omnimarket's GitHubHttpTransport (the three PR triage reads folded in there) and resolves its token from its contract's secrets block. The webhook ingress behaves exactly as it did in omnibase_infra, including refusing every delivery on a lane that maps no webhook secret."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-nodes-live-in-omnimarket"
    statement: "The PR poller and the webhook ingress are omnimarket nodes on the same topics and event models, wired from their real contracts."
    acceptance:
      - id: "AC1"
        statement: "AC1 (omnimarket half): node_github_pr_poller_effect and node_github_webhook_ingress_effect are discovered from omnimarket's own contracts on the effects runtime profile, consume and publish the topics they consumed and published in omnibase_infra, and keep their behaviour -- falsifier: uv run pytest tests/nodes/node_github_pr_poller_effect tests/nodes/node_github_webhook_ingress_effect -q fails at the merge base"
  - id: "req-triage-reads-on-one-transport"
    statement: "omnimarket's GitHubHttpTransport serves the PR triage reads, with the poller's error posture: a failed PR list raises, a failed per-PR read degrades to its neutral value."
    acceptance:
      - id: "AC3"
        statement: "AC3 (omnimarket half): the open-PR-for-triage, combined-status and review-state reads exist on omnimarket.github_api.GitHubHttpTransport -- falsifier: uv run pytest tests/test_github_api_triage.py -q fails at the merge base"
# The criterion text above is the lane brief's wording of the omnibase_infra adapter
# fold; the ticket itself was not readable from this lane (the tracker connector
# needs an interactive authorization), so the line is not a copy of the ticket's.
# AC2 (the infra deletions) is bound by the omnibase_infra pull request that
# carries it.
evidence_requirements:
  - kind: "tests"
    description: "AC1: the two moved nodes discover from omnimarket's contracts, wire through the real auto-wiring on an in-memory bus, and keep their poller, fold and refusal behaviour."
    command: "uv run pytest tests/nodes/node_github_pr_poller_effect tests/nodes/node_github_webhook_ingress_effect -q -p no:randomly"
  - kind: "tests"
    description: "AC3: the triage reads on the omnimarket transport return the augmented PR payloads, page, and degrade as the poller expects."
    command: "uv run pytest tests/test_github_api_triage.py -q -p no:randomly"
