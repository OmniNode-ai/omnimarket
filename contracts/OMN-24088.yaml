schema_version: 1.0.0
ticket_id: OMN-24088
title: "The write node's overlay file carries the keys its other two readers need"
summary: The overlay file of the node that writes to the code host is read by three readers, the node's own model, the bus overlay reader behind onex scm and the pull request handoff login reader, and the node model refused any file that held the other two readers' keys. The node model now accepts event_bus and comment_author_logins as optional keys, so the settings repository copy can carry all three and the frozen copy can be deleted.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24088-three-readers
  statement: One overlay document of node_github_repo_write_effect loads through the node model, the bus overlay reader and the login reader.
  acceptance:
  - id: AC1
    statement: "AC1: the write node's overlay model accepts event_bus and comment_author_logins beside pr_label, and one document carrying all three loads through the node model, the bus overlay reader and the login reader -- falsifier: the three-readers test in the write node's unit tests fails at the merge base"
  - id: AC2
    statement: "AC2: integrated: the overlays repository copy of the write node's overlay carries all three keys and an onex scm call with no bus lane reads the dev lane from it on a lane host -- falsifier: the call refuses naming the overlay file it looked for"
evidence_requirements:
- kind: tests
  description: The three-readers tests pass at the pushed head and the model-accepts-the-other-keys test fails at the base commit.
  command: uv run pytest tests/unit/nodes/node_github_repo_write_effect/test_overlay_three_readers_omn24088.py tests/unit/nodes/node_github_repo_write_effect/test_handler_pr_label.py -q --no-cov -p no:cacheprovider
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
