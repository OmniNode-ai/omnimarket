schema_version: 1.0.0
ticket_id: OMN-26612
title: omnimarket's ticket guard stops importing the ledger-path setting omnibase_core 0.47.77 removed, so Latest Core Smoke passes again
summary: The ticket guard fix landed in omnimarket#6652; this adds the tests that hold it -- the guard module names neither the removed core module nor the ledger-path environment variable, and a ledger citation resolves only through an explicitly passed ledger_path, never through the environment.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn26612-latest-core-smoke
    statement: Latest Core Smoke imports every node against omnibase_core 0.47.77.
    acceptance:
      - id: AC1
        statement: 'AC1: Latest Core Smoke passes against omnibase_core 0.47.77; falsifier: the smoke job''s import of every node fails on the merge base'
  - id: req-omn26612-no-ledger-env
    statement: The guard module imports no omnibase_core.cli.cli_work_ledger_render and reads no ledger-path environment variable.
    acceptance:
      - id: AC2
        statement: 'AC2: the guard module imports no omnibase_core.cli.cli_work_ledger_render and reads no ledger-path environment variable; falsifier: uv run pytest tests/nodes/node_create_ticket/test_core_ticket_guard.py -q'
  - id: req-omn26612-explicit-ledger-path
    statement: A guard given an explicit ledger_path resolves a citation in that file, and with none refuses it.
    acceptance:
      - id: AC3
        statement: 'AC3: a guard given an explicit ledger_path resolves a citation in that file, and with none refuses it; falsifier: uv run pytest tests/nodes/node_create_ticket/test_core_ticket_guard.py -q'
evidence_requirements:
  - kind: tests
    description: AC2 and AC3 tests.
    command: uv run --frozen pytest -q --no-cov tests/nodes/node_create_ticket/test_core_ticket_guard.py
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn26612-ac1
    description: Latest Core Smoke imports every node against the newest published omnibase_core.
    source: manual
    binds_ac: [AC1]
    checks:
      - check_type: command
        check_value: uv run --frozen python tests/ci/latest_core_smoke.py
        cwd: .
  - id: dod-omn26612-ac2
    description: The guard module imports no removed core module and reads no ledger-path environment variable.
    source: manual
    binds_ac: [AC2]
    checks:
      - check_type: test_passes
        check_value: uv run pytest -q tests/nodes/node_create_ticket/test_core_ticket_guard.py
        cwd: .
  - id: dod-omn26612-ac3
    description: An explicit ledger_path resolves a citation; none refuses it.
    source: manual
    binds_ac: [AC3]
    checks:
      - check_type: test_passes
        check_value: uv run pytest -q tests/nodes/node_create_ticket/test_core_ticket_guard.py
        cwd: .
  - id: dod-omn26612-integration-proof
    description: Run the guard tests and the create-ticket tests on a lab host at the pushed revision. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: >-
          env PYTHONDONTWRITEBYTECODE=1 onex lab-work run
          --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)"
          --lane dod-integration-proof-26612 --kind test --
          env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest
          tests/nodes/node_create_ticket/test_core_ticket_guard.py
          tests/nodes/node_create_ticket/test_core_ticket_guard.py
          -q -n 0 --no-cov --refuse-skips
        cwd: .
