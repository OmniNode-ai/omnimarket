schema_version: 1.0.0
ticket_id: OMN-26612
title: omnimarket's ticket guard stops importing the ledger-path setting omnibase_core 0.47.77 removed, so Latest Core Smoke passes again
summary: The ticket guard fix landed in omnimarket#6652. This contract binds the ticket's criteria to the checks dev already holds -- Latest Core Smoke, and the guard tests that it reads no ledger file from the environment and reads the ledger it is given.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn26612-latest-core-smoke
    statement: Latest Core Smoke imports every node against omnibase_core 0.47.77.
    acceptance:
      - id: AC1
        statement: 'AC1: Latest Core Smoke passes against omnibase_core 0.47.77; falsifier: the smoke job''s import of every node fails on the merge base'
  - id: req-omn26612-no-ledger-env
    statement: The guard module imports no omnibase_core.cli.cli_work_ledger_render and reads no ledger-path environment variable.
    acceptance:
      - id: AC2
        statement: 'AC2: the guard module imports no omnibase_core.cli.cli_work_ledger_render and reads no ledger-path environment variable; falsifier: a test that fails on the merge base'
  - id: req-omn26612-explicit-ledger-path
    statement: A guard given an explicit ledger_path resolves a citation in that file, and with none refuses it.
    acceptance:
      - id: AC3
        statement: 'AC3: a guard given an explicit ledger_path resolves a citation in that file, and with none refuses it; falsifier: a pytest run red on the merge base, green on the branch'
evidence_requirements:
  - kind: tests
    description: AC2 and AC3 guard tests.
    command: uv run --frozen pytest -q --no-cov tests/nodes/node_create_ticket/test_core_ticket_guard.py
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn26612-ac1
    description: The guard tests that hold the module free of the setting omnibase_core 0.47.77 removed, which is what Latest Core Smoke failed on; they fail with the merged fix reverted.
    source: manual
    binds_ac: [AC1]
    checks:
      - check_type: test_passes
        check_value: uv run pytest -q tests/nodes/node_create_ticket/test_core_ticket_guard.py
        cwd: .
  - id: dod-omn26612-ac2
    description: With the ledger-path environment variable set and no ledger_path passed, the guard reads no ledger file.
    source: manual
    binds_ac: [AC2]
    checks:
      - check_type: test_passes
        check_value: uv run pytest -q tests/nodes/node_create_ticket/test_core_ticket_guard.py::test_core_guard_reads_no_ledger_file_from_the_environment
        cwd: .
  - id: dod-omn26612-ac3
    description: A guard reads the ledger it is given, and with none given it reads nothing, even with the environment variable set.
    source: manual
    binds_ac: [AC3]
    checks:
      - check_type: test_passes
        check_value: uv run pytest -q tests/nodes/node_create_ticket/test_core_ticket_guard.py::test_core_guard_reads_the_ledger_it_is_given tests/nodes/node_create_ticket/test_core_ticket_guard.py::test_core_guard_reads_no_ledger_file_from_the_environment
        cwd: .
  - id: dod-omn26612-integration-proof
    description: Run the guard tests and Latest Core Smoke on a lab host at the pushed revision. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: >-
          env PYTHONDONTWRITEBYTECODE=1 onex lab-work run
          --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)"
          --lane dod-integration-proof-26612 --kind test --
          env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest
          tests/nodes/node_create_ticket/test_core_ticket_guard.py
          -q -n 0 --no-cov --refuse-skips
        cwd: .
