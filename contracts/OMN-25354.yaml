schema_version: 1.0.0
ticket_id: OMN-25354
title: 'Make omnimarket PR 6159 run where it belongs: the code graph lookup gets a runtime consumer and an answer topic'
summary: The code graph node contract declared no subscription, so the runtime had no consumer for the lookup command that PR 6159 added and no answer could be read on the dev runtime. The contract now subscribes to the lookup command topic and names the lookup answered topic as its publish topic and terminal event.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn25354-lookup-consumer
  statement: The dev runtime has a consumer for the code graph lookup command and a topic for its answer, and one lookup is read handled there.
  acceptance:
  - id: AC1
    statement: 'AC1: the dev runtime on h201 runs a build that carries e19122775a, read there by the lane itself as an image or revision read, and one code graph lookup answer from the lookup operation PR 6159 added is read there as a log line, dispatch, health read or job record -- falsifier: ssh read of the dev runtime on h201 shows a revision that does not contain e19122775a (git merge-base --is-ancestor e19122775a <revision> exits non-zero), or the dev runtime log holds no lookup answer after the install'
  - id: AC2
    statement: 'AC2: the change is installed, or the cause is fixed, through the declared installer with no hand edit of a host file, unit or plist; any code change is a draft PR with a Lab: line -- falsifier: the declared installer''s own status read on h201 names no revision carrying PR 6159'
  - id: AC3
    statement: 'AC3: a STATUS row `kv pr=omnimarket#6159 installed=<host>:<revision> observed=<what ran> read_at=<UTC>` is on the work ledger, so the next integration pass marks it SEEN RUNNING -- falsifier: python3 plugins/omni/skills/lane-brief/scripts/lane_brief.py grep ''pr=omnimarket#6159'' returns no row with installed= and observed='
evidence_requirements:
- kind: tests
  description: The contract wiring test for the lookup subscription and answered topic.
  command: env -u PYTHONPATH uv run --frozen pytest tests/nodes/node_code_graph_effect/test_code_graph_lookup_contract_wiring.py -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn25354-ac1-subscription
  description: The contract subscribes to the lookup command topic, publishes the answered topic and the lookup operation stays bound to its handler.
  source: manual
  binds_ac:
  - AC1
  - AC2
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_code_graph_effect/test_code_graph_lookup_contract_wiring.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn25354-lookup-runtime
  description: The lookup handler still answers from a git clone through the overlay. Unbound regression check, since PR 6159 already carries this behaviour and it passes at the merge base too.
  source: manual
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_code_graph_effect/test_code_graph_lookup_runtime.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn25354-integration-proof
  description: Hosted CI cannot reach a lab host, so only the local Done gate runs this unbound check. It runs the lookup wiring and runtime tests at the sha on a lab host through the lab work runner; the read of the lookup on the dev runtime is recorded in the lane's STATUS row.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-25354 --kind test -- uv run --frozen pytest tests/nodes/node_code_graph_effect/test_code_graph_lookup_contract_wiring.py tests/nodes/node_code_graph_effect/test_code_graph_lookup_runtime.py -q --no-cov -n 0 -p no:randomly
    cwd: .
