---
schema_version: "1.0.0"
ticket_id: OMN-17461
title: "The pre-push hook reads pre-commit's version from the interpreter the prepared manifest names"
summary: The prepared manifest records the interpreter that supplied its pre-commit version, and the installed pre-push hook resolves that same interpreter, so the recorded and the resolved pre-commit version are one value while the manifest comparison stays exact.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn17461-one-interpreter
    statement: Preparation and the hook read pre-commit's version from the same interpreter, the one the prepared manifest names.
    acceptance:
      - id: AC1
        statement: "AC1: a prepared manifest records the interpreter that supplied its pre-commit version, and a hook run with a different pre-commit first on PATH resolves the manifest-named interpreter and passes the unchanged manifest comparison -- falsifier: uv run pytest tests/scripts/test_install_prepush_hook.py -k manifest_names -q fails on the base commit with prepared manifest 'pre_commit_version' does not match committed target"
evidence_requirements:
  - kind: tests
    description: The falsifier test and the existing pre-push bootstrap, adapter, lifecycle and provenance tests.
    command: uv run pytest tests/scripts/test_install_prepush_hook.py tests/scripts/test_prepush_snapshot_adapter.py tests/scripts/test_prepush_snapshot_lifecycle.py tests/scripts/test_prepush_snapshot_provenance.py -q --no-cov
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-omn17461-ac1
    description: "A hook run whose PATH holds a pre-commit of another version than the prepared one passes the manifest comparison by using the interpreter the manifest names."
    source: manual
    binds_ac: [AC1]
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/scripts/test_install_prepush_hook.py -k manifest_names -q --no-cov
        cwd: .
  - id: dod-omn17461-integration-proof
    description: "The pushed head ran the pre-push bootstrap, adapter, lifecycle and provenance suites on a lab host and exited 0. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check."
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-17461 -- uv run --frozen pytest tests/scripts/test_install_prepush_hook.py tests/scripts/test_prepush_snapshot_adapter.py tests/scripts/test_prepush_snapshot_lifecycle.py tests/scripts/test_prepush_snapshot_provenance.py -q --no-cov
        cwd: .
