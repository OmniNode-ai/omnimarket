---
schema_version: "1.0.0"
ticket_id: OMN-22243
title: 'Cloud accounts C1: cloud session capacity is counted per claude.ai login in a registry, and the pick ignores a host''s lab availability'
summary: 'node_cloud_session_placement_effect counts cloud capacity per login identity (accounts registry), observes logins each tick, picks by account then transport and never reads a host''s lab availability'
is_seam_ticket: false
interface_change: true
interfaces_touched:
  - public_api
requirements:
  - id: req-omn22243-ac1
    statement: 'two hosts that report one hash pair are one account with one cap and summed running counts, and a consented account whose only fresh login is on a lab-unavailable host is picked'
    acceptance:
      - id: AC1
        statement: 'AC1: two hosts that report one hash pair are one account with one cap and summed running counts, and a consented account whose only fresh login is on a lab-unavailable host is picked -- falsifier: uv run pytest tests/nodes/node_cloud_session_placement_effect/test_cloud_account_registry.py -q -k "one_account or unavailable_host"'
  - id: req-omn22243-ac2
    statement: 'a login whose hash pair is in no account is never picked and is listed with host and hash; a host that logs out, changes identity or fails its probe leaves its old account at the next observation'
    acceptance:
      - id: AC2
        statement: 'AC2: a login whose hash pair is in no account is never picked and is listed with host and hash; a host that logs out, changes identity or fails its probe leaves its old account at the next observation -- falsifier: uv run pytest tests/nodes/node_cloud_session_placement_effect/test_cloud_account_registry.py -q -k "unconsented or transition"'
  - id: req-omn22243-ac3
    statement: 'a recorded hold, a consent_expires reached (a fixture one second before it is picked), a lapsed credit_expires, a zero credit and a full cap each leave the account out with a sentence naming cause and date, none containing "no account"'
    acceptance:
      - id: AC3
        statement: 'AC3: a recorded hold, a consent_expires reached (a fixture one second before it is picked), a lapsed credit_expires, a zero credit and a full cap each leave the account out with a sentence naming cause and date, none containing "no account" -- falsifier: uv run pytest tests/nodes/node_cloud_session_placement_effect/test_cloud_account_registry.py -q -k "skip_sentence"'
  - id: req-omn22243-ac4
    statement: 'transports drops transport_exclude, push:false and contributor:true rows before any probe is requested'
    acceptance:
      - id: AC4
        statement: 'AC4: transports drops transport_exclude, push:false and contributor:true rows before any probe is requested -- falsifier: uv run pytest tests/nodes/node_cloud_session_placement_effect/test_cloud_account_registry.py -q -k "transports"'
  - id: req-omn22243-ac5
    statement: 'the one-time import keeps the newest credit reading, drops h200''s unsourced hold and refuses a recorded hold on a host outside legacy_hosts by name; the registry refuses a duplicate label and a duplicate pair'
    acceptance:
      - id: AC5
        statement: 'AC5: the one-time import keeps the newest credit reading, drops h200''s unsourced hold and refuses a recorded hold on a host outside legacy_hosts by name; the registry refuses a duplicate label and a duplicate pair -- falsifier: uv run pytest tests/nodes/node_cloud_session_placement_effect/test_cloud_account_registry.py -q -k "migration or duplicate"'
  - id: req-omn22243-ac6
    statement: 'a failure before the start call tries the next transport; a failure after it returns start-unknown, tries no second transport and keeps the slot; observe_logins rerun with the same texts leaves the file unchanged except seen_at'
    acceptance:
      - id: AC6
        statement: 'AC6: a failure before the start call tries the next transport; a failure after it returns start-unknown, tries no second transport and keeps the slot; observe_logins rerun with the same texts leaves the file unchanged except seen_at -- falsifier: uv run pytest tests/nodes/node_cloud_session_placement_effect -q --no-cov'
