title: omnimarket dev passes Tests (Split 12/20) - node_lab_alarm_deliver_effect declares one runtime profile set, so the conflicting top-level profile test exits 0 on dev
summary: 'node_lab_alarm_deliver_effect declared top-level runtime_profiles [main] against descriptor.runtime_profiles [main, effects], so tests/validation/test_no_toplevel_runtime_profiles_shadow.py failed on dev itself. Its contract now declares [main, effects] at both levels: the descriptor keeps effects (test_runtime_profile_contracts requires it of a command-consuming effect node), the top-level value agrees with it, the dev runtime (profile main) still owns the node and the command topic route is unchanged.'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn26295-one-profile-set
    statement: The contract of node_lab_alarm_deliver_effect declares one runtime profile set at both levels, and no test is weakened to get there.
    acceptance:
      - id: AC1
        statement: "AC1: the contract of node_lab_alarm_deliver_effect declares one runtime profile set, the top-level and the descriptor value agree, and the routing that omnimarket#6421 added is kept -- falsifier: `uv run pytest tests/validation/test_no_toplevel_runtime_profiles_shadow.py -q --no-cov` exits non-zero at the new head, or `uv run pytest tests/nodes/node_lab_alarm_deliver_effect -q --no-cov` exits non-zero"
      - id: AC2
        statement: "AC2: the cause is fixed at its source and no test is weakened, so the diff removes no assertion, adds no skip or xfail marker and widens no allowlist in tests/validation/ -- falsifier: `git diff <base> <head> -- tests/validation/` shows a removed assertion, a new skip or xfail marker, or a rule that now accepts a contract it refused"
      - id: AC3
        statement: "AC3: a regression test built from the recorded contract text of node_lab_alarm_deliver_effect at 735d7604f6 (fixture path named in the pull request) fails on the broken declaration and passes on the fix -- falsifier: `uv run pytest tests/validation/test_no_toplevel_runtime_profiles_shadow.py -q --no-cov` shows the fixture test passing while the fixture still holds [main] against [main, effects]"
      - id: AC4
        statement: "AC4: the pull request is open and ready with a comment starting `Lab: head=<full head sha>`, its required check Tests (Split 12/20) reads success at that head, and the lane hands it to the landing lane by one ledger MSG -- falsifier: `onex scm commit-check-runs OmniNode-ai/omnimarket --head-sha <head> --check-name \"Tests (Split 12/20)\"` lists a conclusion other than success, or `grep -F 'landing-controller' \"$ONEX_LEDGER\x5FPATH\"` shows no MSG naming the pull request"
