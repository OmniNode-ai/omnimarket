---
schema_version: "1.0.0"
ticket_id: "OMN-20905"
title: "Every operator prompt is taken from the bus, classified by the local delegation model, and every decision, ask, idea or preference is recorded on the ledger with the verbatim words"
summary: "Two nodes, no capture hooks (RULING 2026-10-10T22:40:43Z amends the mechanism: capture runs async off the bus). node_operator_capture_compute holds every decision: it classifies an operator message from the delegated local model's typed answer, accepted only whole, with a deterministic fallback; builds one ledger row per non-chat item with the verbatim words and the session id; flags a decision that re-rules an earlier ruling; and folds open asks and their evidence-backed closures into the digest. node_operator_capture_effect does the I/O, hosted by the work-ledger serve process on the ledger host when started with --operator-capture: it reads only operator_prompt records (prompts whose transcript origin is human, marked by the omniclaude capture producer) from onex.cmd.omniintelligence.content-captured.v1, keeps them in the local store until their rows are appended, classifies through onex delegate on the serve process's own bus lane, appends through that serve process's own ledger append runner, and prints the digest and sends the overdue push on demand. A lane brief never carries that kind and yields no row."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-classify-this-weeks-messages"
    statement: "The classify handler accepts the delegated model's recorded answers to this week's operator messages and maps each to the kinds a reader expects, falls back deterministically when the model cannot answer, and discards an answer whose quote is not an exact substring of the message."
    acceptance:
      - id: "AC1"
        statement: "AC1: the classify handler maps this week's sample operator messages to the expected kinds and refuses a model answer whose quote is not a substring of the message -- falsifier: uv run pytest tests/unit/nodes/node_operator_capture_compute/test_handler_utterance_classify.py tests/unit/nodes/node_operator_capture_compute/test_operator_capture_decisions.py tests/unit/nodes/node_operator_capture_compute/test_golden_chain_operator_capture.py -q"
  - id: "req-rows-on-the-ledger"
    statement: "An operator prompt read from the bus with a decision and an ask yields two ledger rows with the verbatim words and the session id; a lane brief, a tool record and a machine injection yield none; a failed append keeps the prompt and the retry writes no row twice."
    acceptance:
      - id: "AC2"
        statement: "AC2: an operator prompt from the bus with a decision and an ask yields two ledger rows with the verbatim words and session id, and a lane brief or a machine injection yields none -- falsifier: uv run pytest tests/unit/nodes/node_operator_capture_effect -q"
evidence_requirements:
  - kind: "tests"
    description: "AC1: classification of this week's recorded samples, the fallback and the refusal of a non-substring quote; plus the rows, open asks and drift handlers and the golden chain."
    command: "uv run pytest tests/unit/nodes/node_operator_capture_compute/test_handler_utterance_classify.py tests/unit/nodes/node_operator_capture_compute/test_operator_capture_decisions.py tests/unit/nodes/node_operator_capture_compute/test_golden_chain_operator_capture.py -q -p no:randomly"
  - kind: "tests"
    description: "AC2: an operator prompt off the bus to ledger rows, lane briefs and machine injections skipped, retry without duplicates, digest and push."
    command: "uv run pytest tests/unit/nodes/node_operator_capture_effect -q -p no:randomly"
