---
schema_version: "1.0.0"
ticket_id: "OMN-20905"
title: "Every operator prompt is classified by the local delegation model and every decision, ask, idea or preference is recorded on the ledger with the verbatim words"
summary: "Two nodes. node_operator_capture_compute holds every decision: it classifies an operator message from the delegated local model's typed answer, accepted only whole, with a deterministic fallback; builds one ledger row per non-chat item with the verbatim words and the session id; flags a decision that re-rules an earlier ruling; folds open asks and their evidence-backed closures into the session digest; and refuses a main-session dispatch from an uncaptured operator message. node_operator_capture_effect does the I/O: the local capture store (full text stays on the host), the onex delegate and ledger-append ports, the worker, the dispatch guard's transcript read, the digest and the overdue-ask push, and the hook command the user-level entry points call."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-classify-this-weeks-messages"
    statement: "The classify handler accepts the delegated model's recorded answers to this week's operator messages and maps each to the kinds a reader expects, falls back deterministically when the model cannot answer, and discards an answer whose quote is not an exact substring of the message."
    acceptance:
      - id: "AC1"
        statement: "AC1: the classify handler maps this week's sample operator messages to the expected kinds and refuses a model answer whose quote is not a substring of the message -- falsifier: uv run pytest tests/unit/nodes/node_operator_capture_compute/test_handler_utterance_classify.py tests/unit/nodes/node_operator_capture_compute/test_operator_capture_decisions.py tests/unit/nodes/node_operator_capture_compute/test_golden_chain_operator_capture.py -q"
  - id: "req-rows-on-the-ledger"
    statement: "A captured prompt with a decision and an ask yields two ledger rows with the verbatim words and the session id; a machine injection yields none; a failed append keeps the prompt and the retry writes no row twice."
    acceptance:
      - id: "AC2"
        statement: "AC2: a captured prompt with a decision and an ask yields two ledger rows with the verbatim words and session id, and a machine injection yields none -- falsifier: uv run pytest tests/unit/nodes/node_operator_capture_effect/test_operator_capture_effect.py -q"
evidence_requirements:
  - kind: "tests"
    description: "AC1: classification of this week's recorded samples, the fallback and the refusal of a non-substring quote; plus the rows, open asks, drift and guard handlers and the golden chain."
    command: "uv run pytest tests/unit/nodes/node_operator_capture_compute/test_handler_utterance_classify.py tests/unit/nodes/node_operator_capture_compute/test_operator_capture_decisions.py tests/unit/nodes/node_operator_capture_compute/test_golden_chain_operator_capture.py -q -p no:randomly"
  - kind: "tests"
    description: "AC2: inbox to ledger rows, machine injections skipped, retry without duplicates, guard capture-on-refuse, digest and push."
    command: "uv run pytest tests/unit/nodes/node_operator_capture_effect/test_operator_capture_effect.py -q -p no:randomly"
emergency_bypass:
