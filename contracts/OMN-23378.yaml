schema_version: 1.0.0
ticket_id: OMN-23378
title: A job-log filler tick holds a single-run lock on its state directory, and replacing the unit stops the tick the old install left running
summary: A tick of the job-log filler takes an exclusive lock on its state directory and a second one exits without running. The run-limit wrapper ends its command's process group on TERM, INT and HUP as well as at the limit, and the host installer waits for, then stops, a tick still holding the unit's tick lock after it unloads the unit.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23378-single-run
  statement: Two job-log filler ticks never run on one state directory.
  acceptance:
  - id: AC1
    statement: 'AC1: a second tick started while one holds the state directory exits at once without work: it runs no pass, leaves the first tick''s evidence alone and exits 3 -- falsifier: uv run --frozen pytest tests/nodes/node_job_log_filler_effect/test_job_log_filler_single_run.py -q --no-cov -p no:randomly, failing on the base commit'
- id: req-omn23378-unload-stops-tick
  statement: Unloading or replacing the job-log filler unit leaves no tick of the old install running.
  acceptance:
  - id: AC2
    statement: 'AC2: unloading or reinstalling the unit stops a running tick: the run-limit wrapper ends its command''s process group on TERM, INT or HUP, and an install or uninstall of a unit that declares tick_lock_file waits for a running tick to end, then sends it TERM and KILL, and refuses the install of one that will not stop -- falsifier: uv run --frozen pytest tests/nodes/node_host_installer_registry_units/test_stop_running_tick.py -q --no-cov -p no:randomly, failing on the base commit'
evidence_requirements:
- kind: tests
  description: The single-run lock tests, the wrapper signal tests and the installer stop tests, plus the run-limit and unit tests they sit beside
  command: uv run --frozen pytest tests/nodes/node_job_log_filler_effect/test_job_log_filler_single_run.py tests/nodes/node_host_installer_registry_units/test_stop_running_tick.py -q --no-cov -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23378-single-run
  description: Holds tick.lock from the test with a raw flock, runs the tick against the same state directory with a handler that fails the test if it is reached, and reads exit 3, no pass, and the first tick's evidence file unchanged. A tick that ends frees the lock for the next, the lock names its holder's pid, and the unit's declared tick_lock_file equals the tick's lock name. Fails on the base commit, which runs the pass.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_job_log_filler_effect/test_job_log_filler_single_run.py -q --no-cov -p no:randomly
    cwd: .
- id: dod-omn23378-wrapper-signal
  description: Starts the rendered run-limit wrapper around a shell that leaves a sleeping child, sends the wrapper TERM, INT and HUP in turn, and reads that the child is gone and the wrapper's exit is 128 plus the signal. On the base commit the wrapper dies and the child lives on, orphaned.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_host_installer_registry_units/test_stop_running_tick.py -q --no-cov -p no:randomly -k signal_to_the_wrapper
    cwd: .
- id: dod-omn23378-installer-stops-tick
  description: Installs the unit over a real subprocess that holds the tick lock. A holder that ends inside the grace is waited for and never signalled; one that outlives it gets TERM and the install reads the lock free before launchctl bootstrap; one that ignores the signals refuses the install with nothing loaded; an uninstall stops it too. The base commit leaves the holder alive and loads the unit beside it.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_host_installer_registry_units/test_stop_running_tick.py -q --no-cov -p no:randomly
    cwd: .
- id: dod-omn23378-regression
  description: The installer's run-limit tests and the filler tick tests still pass with the changed wrapper, handler and tick. Binds no criterion; a regression check.
  source: manual
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_host_installer_registry_units/test_run_timeout.py tests/nodes/node_job_log_filler_effect/test_job_log_filler_tick.py -q --no-cov -p no:randomly
    cwd: .
- id: dod-omn23378-integration-proof
  description: The new tests run on a lab host at the pushed head through the lab work runner. Hosted CI cannot reach the Mac, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: 'env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23378 --kind test -- uv run --frozen pytest tests/nodes/node_host_installer_registry_units/test_stop_running_tick.py tests/nodes/node_job_log_filler_effect/test_job_log_filler_single_run.py -q --no-cov -p no:randomly'
    cwd: .
