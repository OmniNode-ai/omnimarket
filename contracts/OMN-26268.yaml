---
schema_version: "1.0.0"
ticket_id: OMN-26268
title: "The test selector replays itself over the last 60 dev merges and commits a baseline receipt that every later narrowing is judged against"
summary: The selector node gains the operation replay_selection, which replays stage 0 of the selector over merged history against a frozen tree snapshot, and the repository commits the 60-merge baseline receipt it produced. The receipt holds what the replay measured; where that differs from the plan's figures (9 narrowed and 51 full against 8 and 52, 7 shared-module merges against 8) the receipt states both and the measured value stands.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn26268-replay-and-baseline-receipt
    statement: The selector node replays stage 0 over a list of merges against a frozen tree and the repository commits the baseline receipt, whose counterfactual section re-derives byte for byte and whose observed section is frozen input.
    acceptance:
      - id: AC1
        statement: "AC1: the receipt lists 60 merges with 8 narrowed and 52 full and the seven reason counts of plan section 2, re-derived from the receipt's own changed-file lists -- falsifier: `uv run pytest tests/nodes/node_test_selection_selector_compute/test_selection_replay.py -q --no-cov -k baseline_receipt` fails on any count"
      - id: AC2
        statement: "AC2: total recorded seconds in the receipt equals the sum of `config/test_file_durations.json`, with the 2 entries beyond the 6,032 files listed -- falsifier: change one duration in a fixture copy and `-k baseline_receipt` must fail"
      - id: AC3
        statement: "AC3: the observed section names the ENABLE_SMART_TESTS value, runner minutes (median and p90) and per-shard setup seconds, each with a source run id or the explicit state `unavailable`, and a sample size per statistic -- falsifier: a receipt with a bare number, a missing run id or no sample size fails the model validation test `-k observed_section`"
      - id: AC4
        statement: "AC4: the receipt has 60 rows and its totals equal the sums of the rows, and a cross-tab by SHA of the 22 test_infrastructure merges sums to 22 -- falsifier: edit one row outcome in a fixture copy and `-k receipt_totals` must fail"
      - id: AC5
        statement: "AC5: the counterfactual section re-derives byte for byte from the replay input and tree id, and a stage 0 replay equals the committed baseline -- falsifier: `-k replay_reproducible` fails when one changed-file list is altered and the receipt is not"
evidence_requirements:
  - kind: tests
    description: The replay tests and the node's golden and error chain tests.
    command: uv run pytest tests/nodes/node_test_selection_selector_compute/test_selection_replay.py tests/test_golden_chain_test_selection_replay.py -q --no-cov
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-omn26268-ac1
    description: "The receipt's counts re-derive from its own changed-file lists. The replay measured 9 narrowed and 51 full-suite merges (plan: 8 and 52) and 7 shared-module merges (plan: 8); the receipt's premise_checks state each plan figure beside the measured one and the test pins the measured counts."
    source: manual
    binds_ac: [AC1]
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/nodes/node_test_selection_selector_compute/test_selection_replay.py -q --no-cov -k baseline_receipt
        cwd: .
  - id: dod-omn26268-ac2
    description: "The receipt's total recorded seconds is the sum of the durations file at the pinned tree, with the entries beyond the test files listed; a changed duration in a fixture copy fails the test."
    source: manual
    binds_ac: [AC2]
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/nodes/node_test_selection_selector_compute/test_selection_replay.py -q --no-cov -k baseline_receipt
        cwd: .
  - id: dod-omn26268-ac3
    description: "Each observed value is read from named runs or is the explicit state unavailable; a bare number, a missing run id, no sample size or an omitted key fails the model validation."
    source: manual
    binds_ac: [AC3]
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/nodes/node_test_selection_selector_compute/test_selection_replay.py -q --no-cov -k observed_section
        cwd: .
  - id: dod-omn26268-ac4
    description: "The receipt has 60 rows, its totals equal the sums of its rows, and the cross-tab of the 22 test_infrastructure merges sums to 22; an edited row outcome fails the validation."
    source: manual
    binds_ac: [AC4]
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/nodes/node_test_selection_selector_compute/test_selection_replay.py -q --no-cov -k receipt_totals
        cwd: .
  - id: dod-omn26268-ac5
    description: "The counterfactual section re-derives byte for byte from the replay input and the frozen snapshot, an altered changed-file list does not, and a stage 0 replay equals the committed baseline."
    source: manual
    binds_ac: [AC5]
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/nodes/node_test_selection_selector_compute/test_selection_replay.py -q --no-cov -k 'replay_reproducible or baseline_equals'
        cwd: .
  - id: dod-omn26268-chain-tests
    description: "The operation is bound in the node contract with typed models, and its golden chain and error chain tests pass."
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/test_golden_chain_test_selection_replay.py -q --no-cov
        cwd: .
  - id: dod-omn26268-integration-proof
    description: "Run the replay tests and the node's golden and error chain tests on a lab host at the pushed head; the local Done gate runs this unbound check."
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-26268 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_test_selection_selector_compute/test_selection_replay.py tests/test_golden_chain_test_selection_replay.py -q --no-cov
        cwd: .
