schema_version: 1.0.0
ticket_id: OMN-22098
title: Remote-lane stop effect node
summary: An effect node stops a running remote lane by name. It reads the lane's newest receipt on the dispatching host, signals the engine process tree over the runner's ssh transport (polite signal, bounded wait, forceful signal), cancels a cloud session through its client port, or signals the receipt's pid for a local lane, waits for the tree to exit, cleans the lane's slot marker, and only then writes the lane's TERMINAL outcome=stopped through the ledger writer. An ended lane is a no-op and an unknown lane is refused, both with no signal. The node never runs git or gh and never touches the lane's branch, worktree or PR.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn22098-stop
    statement: The orchestrator and the operator can stop a running remote lane by name, and the lane's ledger record shows it stopped and why.
    acceptance:
      - id: AC1
        statement: 'AC1: a running fake lane is stopped by name and its TERMINAL outcome=stopped is written with the reason and the stopping lane; the test fails on main before the node exists -- falsifier: uv run pytest tests/ -q -k remote_lane_stop_running (in omnimarket)'
      - id: AC2
        statement: 'AC2: an already-ended lane is a no-op with a clear message, and an unknown lane is refused with a typed error and no signal sent -- falsifier: uv run pytest tests/ -q -k remote_lane_stop_ended_or_unknown (in omnimarket)'
      - id: AC3
        statement: 'AC3: the stop never touches the lane branch or PR, and waits for the process exit before it writes the TERMINAL -- falsifier: uv run pytest tests/ -q -k remote_lane_stop_scope (in omnimarket)'
      - id: AC4
        statement: 'AC4: a trivial lane started on a lab host through the runner is stopped by the new command and the lane TERMINAL reads outcome=stopped, read from the ledger -- falsifier: onex-ledger read of the TERMINAL row for the proof lane after the stop command'
evidence_requirements:
  - kind: tests
    description: The stop node suite and the recorded TLC results of the stop model run at the pushed head.
    command: uv run pytest tests/nodes/node_remote_lane_stop_effect tests/formal -q --no-cov -k "remote_lane_stop"
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn22098-boot-routing
    description: The declared stop handler constructs at boot without request-specific ports, then both contract entry points stop a real process group and read its stopped TERMINAL and slot cleanup.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/test_handler_routing_boot_resolvable.py tests/nodes/node_remote_lane_stop_effect/test_remote_lane_stop.py -q --no-cov --tb=line -k 'boot_resolvable or remote_lane_stop_lab_command'
        cwd: .
  - id: dod-omn22098-ac1
    description: AC1 starts a real child process, writes a fake receipt, stops the lane by name and expects the child gone and one TERMINAL outcome=stopped carrying the reason and the stopping lane and closing the lane's CLAIM.
    source: manual
    binds_ac:
      - AC1
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/nodes/node_remote_lane_stop_effect -q --no-cov --tb=line -k remote_lane_stop_running
        cwd: .
  - id: dod-omn22098-ac2
    description: AC2 stops an already-ended lane (final receipt, or a TERMINAL on the ledger) and an unknown lane and expects the typed outcomes already-ended and unknown-lane with no signal sent and no row written.
    source: manual
    binds_ac:
      - AC2
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/nodes/node_remote_lane_stop_effect -q --no-cov --tb=line -k remote_lane_stop_ended_or_unknown
        cwd: .
  - id: dod-omn22098-ac3
    description: AC3 records every command the node runs and expects no git and no gh among them, and the TERMINAL written only after the process is gone, including a survivor that outlives the polite signal and a stop that times out and writes nothing.
    source: manual
    binds_ac:
      - AC3
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/nodes/node_remote_lane_stop_effect -q --no-cov --tb=line -k remote_lane_stop_scope
        cwd: .
  - id: dod-omn22098-ac4
    description: 'Portable AC4 command-path regression: invoke the documented stop command with the real shell transport against a running process in a runner-format context, then read its exact TERMINAL and verify slot cleanup. The transport is local and the ledger is scratch; this does not claim that a lane was started through the live lab runner. The separate local lab-readback remains required for Done.'
    source: manual
    binds_ac:
      - AC4
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/nodes/node_remote_lane_stop_effect/test_remote_lane_stop.py -q --no-cov --tb=line -k remote_lane_stop_lab_command
        cwd: .
  - id: dod-omn22098-ac4-lab-readback
    description: 'Pending live AC4 proof: start a trivial lane through the lab runner and stop it with this head. Supply its receipt path and the stopping lane to read the exact stopped TERMINAL closing that run. An unrelated stopped lane or a missing proof must fail. The previous scratch-ledger demonstration is not this proof.'
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: |-
          uv run python -c 'import json, os
          from pathlib import Path
          from omnimarket.nodes.node_remote_lane_stop_effect.handlers.handler_remote_lane_stop import _claim_and_closer, _lane_rows
          receipt = json.loads(Path(os.environ["ONEX_REMOTE_LANE_STOP_PROOF_RECEIPT"]).read_text())
          lane, run_id, host = receipt["lane"], receipt["run_id"], receipt["host"]
          assert lane and run_id and host, "The runner receipt must identify the proof lane, run and host"
          claim, terminal = _claim_and_closer(_lane_rows(Path(os.environ["ONEX_LEDGER_PATH"]).read_text(), lane), run_id)
          assert claim and claim.get("run") == run_id and claim.get("host") == host, "No matching runner CLAIM"
          assert terminal and terminal.get("closes-CLAIM") == claim["ts"], "No TERMINAL closing the proof CLAIM"
          assert terminal.get("run") == run_id and terminal.get("outcome") == "stopped", "The proof run was not stopped"
          assert terminal.get("stopped-by") == os.environ["ONEX_REMOTE_LANE_STOP_PROOF_STOPPING_LANE"], "The stopping lane does not match"
          assert terminal["ts"] >= claim["ts"], "The TERMINAL precedes its CLAIM"
          print(json.dumps({"lane": lane, "run": run_id, "host": host, "terminal": terminal}, sort_keys=True))'
        cwd: .
  - id: dod-omn22098-integration-proof
    description: The pushed head ran the stop node suite on a lab host and exited 0. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-22098 -- uv run --frozen pytest tests/nodes/node_remote_lane_stop_effect -q --no-cov
        cwd: .
  - id: dod-omn22098-stop-model
    description: The TLC model of the two-closer race and the bounded escalation holds its invariants and each mutation fails its own property, from the recorded results bound to the model digest.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/formal/test_remote_lane_stop_model.py -q --no-cov --tb=line
        cwd: .
  - id: dod-omn22098-deploy-probe-contract
    description: 'Hosted deploy artifact readback: fetch the handler at the checked-out commit and require that it signals through the transport port, waits for the exit and writes the TERMINAL through the ledger writer port. Missing published content fails. This reads published source and does not claim a lane rollout.'
    source: manual
    execution_scope: hosted_and_local
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/test_market_node_runtime_dogfood.py::test_market_node_runtime_dogfood_inventory_classifies_all_entry_points -q --no-cov --tb=line
        cwd: .
      - check_type: command
        check_value: |-
          bash -o pipefail -c 'curl --fail --silent --show-error --location --max-time 30 "https://raw.githubusercontent.com/OmniNode-ai/omnimarket/$(git rev-parse HEAD)/src/omnimarket/nodes/node_remote_lane_stop_effect/handlers/handler_remote_lane_stop.py" | python3 -c '\''import sys
          source = sys.stdin.read()
          required = ["class HandlerRemoteLaneStop", "self._transport.signal_lab", "self._transport.signal_local", "self._transport.lab_tree_alive", "self._ledger.write_terminal"]
          assert all(call in source for call in required), "Published stop handler is incomplete"
          print("Published stop handler signals through the transport and writes through the ledger port")'\'''
        cwd: .
