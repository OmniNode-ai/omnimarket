schema_version: 1.0.0
ticket_id: OMN-22213
title: 'The review gate rule cites_specific_lines refuses a correct review whose line citation is written "Line: new 5"'
summary: "The delegation quality gate's cites_specific_lines rule accepted a labelled line field (Line: 5) but not one whose number carries its diff side (Line: new 5, Line: old 4), so judge-accepted reviews of runs 9ed1a43c and 5b5b01e6 were refused TASK_MISMATCH missing specific line citations. The labelled form now takes an optional new or old before the number. An answer that names no line number is still refused."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn22213-line-new-form
  statement: 'A review answer that cites a diff line as "Line: new 5" satisfies cites_specific_lines, and an answer with no line citation of any form is still refused.'
  acceptance:
  - id: AC1
    statement: 'AC1: a review answer that cites a diff line as "Line: new 5" satisfies cites_specific_lines -- falsifier: uv run pytest tests/unit/delegation/test_cites_specific_lines_forms.py -q -k line_new_form, which is refused today'
  - id: AC2
    statement: 'AC2: a review answer with no line citation of any form is still refused -- falsifier: uv run pytest tests/unit/delegation/test_cites_specific_lines_forms.py -q -k no_citation_refused'
  - id: AC3
    statement: 'AC3: a regression test built from the recorded answers of runs 9ed1a43c and 5b5b01e6 (scrubbed) fails on the current rule and passes on the fix -- falsifier: uv run pytest tests/unit/delegation/test_cites_specific_lines_forms.py -q -k receipt_9ed1a43c'
evidence_requirements:
- kind: tests
  description: The Line new/old form passes, the scrubbed run answers pass, and answers naming no line number are still refused.
  command: uv run pytest tests/unit/delegation/test_cites_specific_lines_forms.py -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn22213-ac1
  description: AC1 Line new N, Line old N, bold and hash labelled forms satisfy cites_specific_lines.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/delegation/test_cites_specific_lines_forms.py -q --no-cov --tb=line -k line_new_form
    cwd: .
- id: dod-omn22213-ac2
  description: AC2 an answer with no line number, including a bare "Line new" label, is still refused.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/delegation/test_cites_specific_lines_forms.py -q --no-cov --tb=line -k no_citation_refused
    cwd: .
- id: dod-omn22213-ac3
  description: AC3 the scrubbed answers of runs 9ed1a43c and 5b5b01e6 pass the rule.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/delegation/test_cites_specific_lines_forms.py -q --no-cov --tb=line -k receipt_9ed1a43c
    cwd: .
- id: dod-omn22213-deploy-probe
  description: 'Deploy probe: the quality gate handler GitHub serves at the checked-out commit accepts the new or old diff side in a labelled line citation, which the merge base does not.'
  source: manual
  checks:
  - check_type: command
    check_value: |-
      bash -o pipefail -c 'gh api "repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_delegation_quality_gate_reducer/handlers/handler_quality_gate.py?ref=$(git rev-parse HEAD)" --jq .content | base64 -d | grep -F "(?:(?:new|old)[ \t]+)?" > /dev/null'
    cwd: .
- id: dod-omn22213-integration-proof
  description: Run the cites_specific_lines test file on a lab host at the pushed head. The hosted verifier cannot dispatch lab work, so this unbound check belongs to the local Done gate.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-22213 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/delegation/test_cites_specific_lines_forms.py -q --no-cov
    cwd: .
