schema_version: 1.0.0
ticket_id: OMN-25196
title: 'Review findings 1 to 3 on omnimarket PR 6297 at the second review of head f4ae1ba6c3c8 are fixed or argued: AC4 binds to a Lab comment that names the head, AC3 and AC4 readings are per sending host at the head, and a non-mapping contract block or an empty overlay id exits 3'
summary: 'The delivery CLI of the dev signing key refuses with exit 3 and no traceback when the node contract''s generated_keys or env_file_deliveries block is a list or a string (the contract loader raises ValueError for a block that is not a mapping) and when --overlay-id is empty (tested with is not None, so an empty id never selects the host env file store). AC4 of the OMN-25181 contract is bound to a check that a comment starting Lab: head= names HEAD and states the merge order against overlays#571; AC3 and AC4 of the OMN-24611 contract require one key check reading per sending host, h051 and h201, at HEAD, and the AC4 reading at HEAD, with tests that run those checks against packets that must fail.'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn25196-review-findings
  statement: Every blocking review finding at head f4ae1ba6c3c8 of the omnimarket pull request is fixed with a test that fails on that head, or argued with evidence in a pull request comment.
  acceptance:
  - id: AC1
    statement: 'AC1: every blocking finding (1 to 3) of the review at head f4ae1ba6c3c8 is fixed with a test that is red on that head and green on the new head, or argued with evidence in a PR comment -- falsifier: `uv run pytest tests/nodes/node_branch_deploy_command_effect tests/unit/nodes/node_secret_store_effect -q` on the lab at the new head passes while the new tests fail against the source files of head f4ae1ba6c3c8'
  - id: AC2
    statement: 'AC2: a contract whose generated_keys or env_file_deliveries block is a list or a string, and an empty overlay id, each make the delivery CLI exit 3 with no traceback and no write to the host env file store -- falsifier: `uv run pytest tests/unit/nodes/node_secret_store_effect -q -k ''cli or overlay_id or non_mapping''` fails with the ValueError and the is-not-None test removed'
  - id: AC3
    statement: 'AC3: AC4 of contracts/OMN-25181.yaml is bound to a check that a Lab: head= comment names HEAD, and AC3 and AC4 of contracts/OMN-24611.yaml require one reading per sending host at HEAD with a 16 hex character check value -- falsifier: the contract checks, run against a packet with no Lab comment, a reading from one host only, or a reading at head d037540c300c, fail'
  - id: AC4
    statement: 'AC4: a PR comment starting `Lab: head=<full head sha>` names the new head after the required suites ran on the lab (a whole-suite timeout rerun in named parts), and the comment states the merge order against overlays PR 571 -- falsifier: `onex scm pr-view OmniNode-ai/omnimarket#6297` shows a head that differs from the head named in the Lab: comment, or no Lab: comment'
evidence_requirements:
- kind: tests
  description: 'The secret store node tests and the sender node tests at the new head.'
  command: uv run pytest tests/nodes/node_branch_deploy_command_effect tests/unit/nodes/node_secret_store_effect -q -n 0 --no-cov -p no:cacheprovider
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn25196-ac1-suites
  description: 'The sender node and secret store node suites pass at the new head; the new tests fail against the source files and contracts of head f4ae1ba6c3c8.'
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_branch_deploy_command_effect tests/unit/nodes/node_secret_store_effect -q -n 0 --no-cov -p no:cacheprovider
    cwd: ${OMNI_HOME}/omnimarket
- id: dod-omn25196-ac2-cli-refusals
  description: 'A contract whose generated_keys or env_file_deliveries block is a list or a string, and an empty or blank overlay id, each make the delivery CLI exit 3 with a typed refusal, no traceback and nothing written under the home.'
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/nodes/node_secret_store_effect -q -n 0 --no-cov -p no:cacheprovider -k 'cli or overlay_id or non_mapping'
    cwd: ${OMNI_HOME}/omnimarket
- id: dod-omn25196-ac3-checks
  description: 'The reading and Lab comment checks of the OMN-24611 and OMN-25181 contracts are run against packets with no comment, a reading from one host only, a reading or a Lab comment at an older head and a Lab comment without the merge order; each must fail, and the matching packets at HEAD must pass.'
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/nodes/node_secret_store_effect/test_contract_reading_checks_omn25196.py -q -n 0 --no-cov -p no:cacheprovider
    cwd: ${OMNI_HOME}/omnimarket
- id: dod-omn25196-ac4-lab-comment
  description: 'The comment of the Lab head is read from the pull request comments, not from a grep of a contract. The check passes only when a comment that starts Lab head= names HEAD of this checkout (or, on a hosted merge checkout, its second parent, the pull request head) and states the merge order against overlays#571. It fails on every head until that comment is posted.'
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: command
    check_value: |-
      gh api repos/OmniNode-ai/omnimarket/issues/6297/comments --paginate --jq '.[].body | @json' | python3 -c '
      import json, re, subprocess, sys
      bodies = [json.loads(line) for line in sys.stdin.read().splitlines() if line.strip()]
      def rev(ref):
          r = subprocess.run(["git", "rev-parse", "--verify", "--quiet", ref], capture_output=True, text=True)
          return r.stdout.strip() if r.returncode == 0 else ""
      heads = {h for h in (rev("HEAD"), rev("HEAD^2")) if h}
      named = [(re.match(r"Lab: head=([0-9a-f]{40})", b), b) for b in bodies]
      ok = [b for m, b in named if m and m.group(1) in heads and "overlays#571" in b and re.search(r"merge order", b, re.I)]
      assert ok, "no comment that starts Lab: head= and names HEAD with the merge order against overlays#571"
      print("AC4 Lab comment: PASS")
      '
    cwd: ${OMNI_HOME}/omnimarket
- id: dod-omn25196-integration-proof
  description: Run the focused tests of the secret store node and of the sender node on a lab host at the pushed head. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check. It binds no acceptance criterion.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-25196 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/nodes/node_secret_store_effect tests/nodes/node_branch_deploy_command_effect -q -n 0 --no-cov
    cwd: .
