schema_version: 1.0.0
ticket_id: OMN-25856
title: A timed-out DoD verify command check kills its whole process tree
summary: The evidence collector runs each command check in its own process group and kills the group when the check times out, so a check's uv and pytest children no longer outlive it inside the runtime container.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn25856-check-process-group
  statement: A DoD verify command check that exceeds its time budget leaves no process of its own running, so it cannot hold the runtime container's CPU quota against the event loop.
  acceptance:
  - id: AC1
    statement: 'AC1: after a command check times out, every process the check started is gone -- falsifier: a process started by the timed-out check is still running 3 s later'
- id: req-omn25856-gateway-marker-rules
  statement: The delegation quality gate refuses a code_generation or refactor answer on its tests and its compile and artifact checks, not on whether the answer text contains tooling words.
  acceptance:
  - id: AC2
    statement: 'AC2: a correct trivial code_generation or refactor answer passes with no TASK_MISMATCH for lacking pytest, ruff, typing, regression or compatibility words, while an answer that breaks a named interface or deletes the tests is refused -- falsifier: a correct short answer fails TASK_MISMATCH on follows_codebase_conventions or no_obvious_regressions, or a test-deleting answer passes'
evidence_requirements:
- kind: tests
  description: The focused regression, failing first with the surviving child process, then passing.
  command: uv run pytest tests/unit/nodes/node_dod_verify/test_omn_25856_timed_out_check_leaves_no_orphan.py -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn25856-ac1-no-orphan-after-timeout
  description: A check whose shell starts a background child and waits is killed at its 1 s ceiling; the child's pid is read back and is not running 3 s later. The test fails on a collector that kills only the shell.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/nodes/node_dod_verify/test_omn_25856_timed_out_check_leaves_no_orphan.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn25856-ac2-marker-rules-waived
  description: The two marker rules apply only when the prompt asks for tests, typing, lint, compatibility or no regression. A correct trivial answer passes with no marker rule evaluated, an answer that breaks a named interface or empties the test file is refused by passes_existing_tests, and a prompt that asks for the rule keeps it. The test fails on a contract that keeps the rules unconditional.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/delegation/test_code_class_markers_waived_unless_asked_omn25856.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn25856-hosted-deploy-check
  description: 'Deploy check the hosted runner can run: the other command-check tests that stub the collector subprocess still pass through the process-group runner. This binds no criterion by itself.'
  source: manual
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/nodes/node_dod_verify/test_omn_15382_fail_closed_command_checks.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn25856-integration-proof
  description: Run the regression on a lab host at the pushed head, where the check's children are real processes under a container CPU quota. Hosted CI cannot place it on the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-25856 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/nodes/node_dod_verify/test_omn_25856_timed_out_check_leaves_no_orphan.py -q --no-cov -n 0 -p no:randomly
