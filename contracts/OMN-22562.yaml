schema_version: "1.0.0"
ticket_id: OMN-22562
title: "The floor shows the overlay store's reads, one subject per host and overlay"
summary: >-
  One floor row for the overlay store, so a stale table that placement still reads is visible, with its golden and error
  chains through the floor's one emission sink.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn22562-floor-overlay-store
    statement: The floor shows the overlay store's reads, one subject per host and overlay.
    acceptance:
      - id: AC1
        statement: 'AC1: a stale or storeless reading draws a subject not ok, and a missing fleet record draws unread rather than blank -- falsifier: uv run --frozen pytest tests/unit/nodes/node_floor_simple_effect/test_overlay_store_source.py -q --no-cov'
evidence_requirements:
  - kind: tests
    description: The floor's overlay store source.
    command: uv run --frozen pytest tests/unit/nodes/node_floor_simple_effect/test_overlay_store_source.py -q --no-cov
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-omn22562-floor-overlay-store
    description: A stale or storeless read is not ok on the floor and is a typed error chain, and a missing fleet record is unread.
    source: manual
    binds_ac: [AC1]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/nodes/node_floor_simple_effect/test_overlay_store_source.py -q --no-cov
        cwd: .
  - id: dod-omn22562-floor-overlay-store-deploy
    description: >-
      The deployed row's receipt fold counts its golden and error chains through the floor's one sink. The installed floor's read
      is the publishing host's install-first obligation.
    source: manual
    binds_ac: [AC1]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/nodes/node_floor_simple_effect/test_overlay_store_source.py -q --no-cov -k deployed
        cwd: .
  - id: dod-omn22562-integration-proof
    description: Run this pull request's own check on a lab host at the pushed head. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-22562 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/nodes/node_floor_simple_effect/test_overlay_store_source.py -q --no-cov
        cwd: .
