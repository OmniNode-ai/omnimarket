schema_version: 1.0.0
ticket_id: OMN-24475
title: Pool status reads the marks source on hosts off the overlay, and mark changes leave a bus event
summary: 'The Claude token pool status verb on a host the pool overlay does not declare (the operator Mac) now reads the limited and revoked marks from the overlay marks source, or prints that it reads an unsynced local copy with its age and names no limited or revoked label (exit 3). Every change of a token mark leaves one typed event (who, at, verb, host, label, change, cause) on topic onex.evt.omnimarket.claude-pool-mark-changed.v1, on the bus the overlay event_bus names.'
is_seam_ticket: true
interface_change: true
interfaces_touched:
- topics
requirements:
- id: req-omn24475-status-reads-source
  statement: Status on a host the overlay does not declare reads the marks from the marks source, or says it is unsynced and names no marked label.
  acceptance:
  - id: AC1
    statement: 'AC1: status on a host the pool overlay does not declare prints marks read from the overlay marks source and never its own stale copy -- falsifier: pytest tests/nodes/node_claude_token_pool_effect/test_status_view.py -q'
  - id: AC2
    statement: 'AC2: with the source unreadable, over its age bound or the overlay unreadable, status prints UNSYNCED with the copy age, names no limited or revoked label and exits 3 -- falsifier: pytest tests/nodes/node_claude_token_pool_effect/test_status_view_seam.py -q'
- id: req-omn24475-mark-events
  statement: Every change of a token mark leaves one typed event on the bus, and a refused publication is named while the mark stands.
  acceptance:
  - id: AC3
    statement: 'AC3: every change of a token mark leaves one typed event (who, at, verb, host, label, change, cause) and a refused publication is named while the mark stands -- falsifier: pytest tests/nodes/node_claude_token_pool_effect/test_pool_mark_events.py -q'
  - id: AC4
    statement: 'AC4: integrated: on the operator Mac, status prints the same limited and revoked labels as the marks-source host h053, and a mark change on a lab host appears as a record on topic onex.evt.omnimarket.claude-pool-mark-changed.v1 read from the running dev broker -- falsifier: run status on the Mac and on h053 and compare the labels; consume the topic after one mark-limited on a lab host'
evidence_requirements:
- kind: tests
  description: The status view, mark event and seam tests pass at the pushed head.
  command: uv run pytest tests/nodes/node_claude_token_pool_effect/test_status_view.py tests/nodes/node_claude_token_pool_effect/test_status_view_seam.py tests/nodes/node_claude_token_pool_effect/test_pool_mark_events.py tests/nodes/node_claude_token_pool_effect/test_pool_mark_event_diff.py -q -p no:randomly --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24475-ac1
  description: 'AC1: a host off the overlay answers from the source marks; the old status of the same stale pool names the revoke the source cleared (failing control in the same file).'
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_claude_token_pool_effect/test_status_view.py -q -p no:randomly --no-cov
    cwd: .
- id: dod-omn24475-ac2
  description: 'AC2: an unreadable or stale source, or no overlay, prints UNSYNCED, names no marked label and exits 3 through main.'
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_claude_token_pool_effect/test_status_view_seam.py -q -p no:randomly --no-cov
    cwd: .
- id: dod-omn24475-ac3
  description: 'AC3: each mark verb leaves one event with who, at, verb, host, label, change and cause; a refused publication is named in the result and on stderr while the mark stands; a pool without a sink says not_configured.'
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_claude_token_pool_effect/test_pool_mark_events.py tests/nodes/node_claude_token_pool_effect/test_pool_mark_event_diff.py -q -p no:randomly --no-cov
    cwd: .
- id: dod-omn24475-ac4
  description: 'hosted proxy for AC4: the status view, seam and mark event tests pass here; the read of status on the Mac against h053 and of the topic on the running dev broker is posted as a pull request comment naming the head once the broker permission rows are applied and the Mac install is done.'
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_claude_token_pool_effect/test_status_view_seam.py tests/nodes/node_claude_token_pool_effect/test_pool_mark_events.py -q -p no:randomly --no-cov
    cwd: .
- id: dod-omn24475-integration-proof
  description: the status view, seam and mark event tests run on a lab host at the pushed head; hosted CI cannot reach the lab, so only the local Done gate runs this unbound check
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24475 --kind test -- env PYTHONDONTWRITEBYTECODE=1
      uv run --frozen pytest tests/nodes/node_claude_token_pool_effect/test_status_view.py tests/nodes/node_claude_token_pool_effect/test_status_view_seam.py tests/nodes/node_claude_token_pool_effect/test_pool_mark_events.py tests/nodes/node_claude_token_pool_effect/test_pool_mark_event_diff.py -q --no-cov -p no:randomly
