---
schema_version: "1.0.0"
ticket_id: OMN-26217
title: "The private hosted minutes watch counts only private repositories, read from GitHub, against the overlay's included minutes"
summary: The watch reads each billed repository's visibility from GitHub, counts month-to-date minutes of private repositories only, reports the rest under uncounted, and alerts at the overlay's included_minutes times alert_fraction.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn26217-private-only-from-github
    statement: Only repositories GitHub reports as private are counted; a failed visibility read is uncounted, never private.
    acceptance:
      - id: AC1
        statement: "AC1: with a billing fixture giving a public repository 175,935 minutes and a private one 10, the handler counts 10 private minutes, reports the 175,935 under uncounted and sends no alert"
  - id: req-omn26217-overlay-threshold
    statement: The alert threshold is the overlay's included_minutes times alert_fraction; no threshold literal is in the node source.
    acceptance:
      - id: AC2
        statement: "AC2: the alert fires at private month-to-date 40,000 and not at 39,999 with the example overlay, and moves with a changed overlay"
  - id: req-omn26217-overlay-refusal
    statement: A missing overlay or an invalid alert_fraction refuses naming ONEX_SKILL_OVERLAY_ROOTS.
    acceptance:
      - id: AC3
        statement: "AC3: a missing overlay or an invalid alert_fraction makes the CLI exit non-zero naming ONEX_SKILL_OVERLAY_ROOTS and writes the heartbeat error"
evidence_requirements:
  - kind: tests
    description: Focused tests of the node and its golden chain.
    command: uv run pytest tests/unit/nodes/node_private_hosted_minutes_watch_effect tests/test_golden_chain_private_hosted_minutes_watch_effect.py -q
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-omn26217-ac1
    description: "Public minutes are uncounted and raise no alert; an unreadable visibility is uncounted."
    source: manual
    binds_ac: [AC1]
    checks:
      - check_type: test_passes
        check_value: >-
          uv run pytest tests/unit/nodes/node_private_hosted_minutes_watch_effect/test_private_scope.py -q -k 'public or unreadable or one_visibility'
  - id: dod-omn26217-ac2
    description: "The threshold comes from the overlay; no literal in the node source."
    source: manual
    binds_ac: [AC2]
    checks:
      - check_type: test_passes
        check_value: >-
          uv run pytest tests/unit/nodes/node_private_hosted_minutes_watch_effect/test_private_scope.py -q -k 'threshold or overlay or literals'
  - id: dod-omn26217-ac3
    description: "A missing or invalid overlay refuses naming the setting and the CLI exits non-zero."
    source: manual
    binds_ac: [AC3]
    checks:
      - check_type: test_passes
        check_value: >-
          uv run pytest tests/unit/nodes/node_private_hosted_minutes_watch_effect/test_private_scope.py -q -k overlay
  - id: dod-omn26217-integration-proof
    description: "Run the focused node and golden chain tests on a lab host at the pushed head; the local Done gate runs this unbound check."
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-26217 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/nodes/node_private_hosted_minutes_watch_effect tests/test_golden_chain_private_hosted_minutes_watch_effect.py -q
        cwd: .
