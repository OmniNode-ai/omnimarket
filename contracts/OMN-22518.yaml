schema_version: 1.0.0
ticket_id: OMN-22518
title: Add a shared job log cache to the GitHub gateway
summary: The criteria of omnimarket#5140, moved unchanged from the shared contract of OMN-19998.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn19998-shared-job-log-cache
  statement: The GitHub gateway reuses completed job-log bytes across window reads and exposes a credential-free cache-only SCM command.
  acceptance:
  - id: AC514001
    statement: 'AC514001: a long job is downloaded once, its ninth window and completed step are reused, concurrent readers share one download, corrupt or incomplete caches fail closed, and cache-only SCM reads terminalize without resolving credentials -- falsifier: uv run --frozen pytest tests/nodes/node_github_repo_gateway_effect/test_job_log_shared_cache.py -q --no-cov -p no:randomly'
evidence_requirements:
- kind: tests
  description: Add a shared job log cache to the GitHub gateway
  command: uv run --frozen pytest tests/nodes/node_github_repo_gateway_effect/test_job_log_shared_cache.py -q --no-cov -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn19998-job-log-cache-transport-role
  description: The cache transport is an internal helper of the bound gateway handler. The unimported-handler gate refuses the prior HandlerJobLogCache declaration and accepts the transport declaration; the existing cache regression and runtime proofs exercise its gateway call path.
  source: manual
  checks:
  - check_type: command
    check_value: uv run --frozen python scripts/ci/check_unimported_handlers.py
    cwd: .
- id: dod-omn19998-shared-job-log-cache
  description: Scoped cache regression and canonical SCM bus wiring smoke. A long job is downloaded once, its ninth window is read without HTTP, existing covered fragments are reused, and cache-only misses never resolve credentials. This evidence does not assert the landing controller timer or the unrelated controller criteria supplied with the lane.
  source: manual
  binds_ac:
  - AC514001
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_github_repo_gateway_effect/test_job_log_shared_cache.py -q --no-cov -p no:randomly
    cwd: .
- id: dod-omn19998-job-log-cache-integration-proof
  description: On h051, dispatch the changed cache-only SCM command through the canonical in-memory runtime against an existing successful GitHub service-log cache. A covered byte window returns on the declared completed topic; this does not assert shared Kafka deployment. The retained service log must remain within its TTL when this local Done gate runs.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src onex scm job-log-cached OmniNode-ai/omnimarket --job-id 127239022819 --offset-bytes 96280 --length-bytes 256 --bus inmemory --timeout-s 10
    cwd: .
- id: dod-omn19998-shared-job-log-cache-deploy
  description: Hosted wiring smoke discovers and dispatches the shipped gateway through the SCM adapter and in-memory event bus, returns a covered window on the completed topic, and terminalizes a cache miss without credential resolution. Shared-runtime deployment and a live quota reading remain unmeasured.
  source: manual
  binds_ac:
  - AC514001
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_github_repo_gateway_effect/test_job_log_shared_cache.py -q --no-cov -p no:randomly -k bus_command
    cwd: .
