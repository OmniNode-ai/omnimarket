requirements:
- id: req-omn19998-host-reconcile-proven-floor
  statement: A repair that cannot stamp the dispatch floor restores the venv to the existing proven omnimarket commit.
  acceptance:
  - id: AC5
    statement: 'AC5: after a repair installs the clone head and a refused clone prevents stamping, the delegate runs again with --proven, the installed commit returns to the floor and the floor stays unchanged; a stamping repair, a repair without a floor and check mode never restore -- falsifier: uv run --frozen pytest tests/test_host_reconcile_effect.py -q --no-cov --refuse-skips -k "cannot_stamp_puts or repair_that_stamps or no_floor_restores or check_mode_never_restores"'
- id: req-omn19998-unreadable-local-base
  statement: An unreadable local comparison base preserves the missing-contract refusal without granting a release-cut exemption or guessing a remote branch.
  acceptance:
  - id: AC12
    statement: 'AC12: a changelog-only commit with an unreadable local base returns the missing-contract refusal; configured remote bases still resolve through the CLI and fetch errors, missing local refs and missing runtime proof remain refusals -- falsifier: uv run --frozen pytest tests/ci/test_ticket_contract_release_cut_exempt_omn17427.py tests/nodes/node_ticket_contract_prerequisite_effect/test_missing_base.py -q --no-cov'
