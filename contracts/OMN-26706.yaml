schema_version: "1.0.0"
ticket_id: "OMN-26706"
title: "The lane work reducer: a pure reducer node whose contract holds the sixteen states and every edge of the lane work loop"
summary: >-
  Acceptance for OMN-26706 (epic OMN-26698, task 3 of the lane work orchestrator plan). The node
  node_lane_work_reducer declares the sixteen states and every edge of plan section 3.4 in the
  state_machine block of its contract.yaml; its handler parses the block into ModelFSMSubcontract,
  looks the edge up by state, trigger, conditions and priority, refuses an input with no edge, and
  applies the repeat rule, the help budget and the armed deadlines.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-omn26706-lane-work-reducer"
    statement: >-
      The lane work loop is a pure reducer whose contract is the only table of its states and edges.
    acceptance:
      - id: "AC1"
        statement: >-
          every declared edge has a test -- falsifier: a test asserts the parametrise list length equals the number of transitions in contract.yaml
      - id: "AC2"
        statement: >-
          no I/O, clock, UUID or model call in the handler -- falsifier: grep -nE "datetime.now|time.time|uuid4|open(|subprocess|httpx|requests|execute_transition" handlers/handler_lane_work_reducer.py prints nothing
      - id: "AC3"
        statement: >-
          the state list has one source -- falsifier: node_fsm_single_source_check_compute passes over the node, and a test asserts EnumLaneWorkState equals the contract state names
      - id: "AC4"
        statement: >-
          the repeat rule counts admissible failures across states and nothing else -- falsifier: the repeat-rule tests
      - id: "AC5"
        statement: >-
          worker deadlines fire only as armed -- falsifier: the deadline tests
      - id: "AC6"
        statement: >-
          replay is byte-deterministic for states and intents -- falsifier: a test folds a 30-event sequence twice and compares the serialized states and intents
      - id: "AC7"
        statement: >-
          an answer for an old handoff request, a handed-off answer naming another head, or a handed-off answer followed by an observation of another head, does not end the workflow -- falsifier: the three ac7 tests
      - id: "AC8"
        statement: >-
          the pull request cites formal/lane_work_loop and its digest -- falsifier: the pull request body read
evidence_requirements: []
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
