schema_version: 1.0.0
ticket_id: OMN-23428
title: When an automatic test run fails, piece 9 answers it under its run id and its ledger-row id, so join J8 reads as passing
summary: "The central test harness (piece 8) writes each failed run twice: a harness_infra_error STATUS ledger row, whose chain id on the floor is the first 32 hex characters of the sha256 of the row, and a chain of its own in the emission journal under the run id. The J8 refusal entry answered ledger rows only. This change adds the test tests/test_join_j8_harness_failure_answered.py: a real failed run written by the real harness handler is answered under both ids by the real refusal node and the floor receipt fold reads J8 as an error join with no finding, from the in-memory sink and the journal file; the failing controls (journal rule removed, piece 9 refusal dropped) read broken. The overlay value (journal_upstream on the J8 entry) merges in overlays pull request 184."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23428-j8-harness-failure-answered
  statement: Piece 9 answers a failed harness run under its run id and its ledger-row id; the test fails on the overlay without journal_upstream.
  acceptance:
  - id: AC1
    statement: "AC1: the J8 harness failure test on branch OMN-23087-j8-chains-end-at-source merges with this ticket's contract: piece 9 answers a failed run under its run id and its ledger-row id, failing on the unfixed overlay; overlays pull request 184 merges with it -- falsifier: uv run pytest on the J8 harness failure test with the old overlay"
  - id: AC2
    statement: "AC2: integrated: the refusal node runs on the floor host with the new overlay, the six chains each end with a typed failure, and join J8 reads PASS on the served floor -- falsifier: the join:J8 row and chain_findings of the served floor after the next J8 reading"
evidence_requirements:
- kind: tests
  description: The J8 harness failure test of this ticket at the pushed head. It answers a real failed run under both the run id and the ledger-row id and fails on the overlay without journal_upstream.
  command: uv run --frozen pytest tests/test_join_j8_harness_failure_answered.py -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23428-ac1-harness-failure-answered
  description: |-
    The ten tests pass; TestFailingControl reads the run id chain broken when the overlay has no journal_upstream.
    must-fail-control: impossible (test-only): this pull request adds a test and no omnimarket code; the changed value is the J8 overlay entry in the overlays repository (pull request 184), and the test's own failing controls build the overlay without it
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/test_join_j8_harness_failure_answered.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn23428-ac2-j8-floor
  description: The served floor reads the J8 row as passed after the failed harness run is answered under both ids. Hosted CI cannot reach the floor host (the URL is in FLOOR_SIMPLE_URL), so only the local Done gate runs this unbound check. It reads passed only after overlays pull request 184 is merged and the refusal node has run on the floor host with the new overlay.
  source: manual
  binds_ac:
  - AC2
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: "curl -s -m 20 \"${FLOOR_SIMPLE_URL:?set FLOOR_SIMPLE_URL to the served floor-simple.json}\" | python3 -c \"import json,sys; d=json.load(sys.stdin); sys.exit(0 if [j for p in d['pieces'] if p['piece']==8 for j in p['joins'] if j['id']=='J8'][0]['state']=='passed' else 1)\""
    cwd: .
- id: dod-omn23428-integration-proof
  description: The pushed head ran the J8 harness failure tests on a lab host through the lab work runner and exited 0. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: 'env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23428 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/test_join_j8_harness_failure_answered.py -q --no-cov -n 0 -p no:randomly'
    cwd: .
