schema_version: 1.0.0
ticket_id: OMN-24408
title: Landing controller decision environment and receipt publish run as nodes
summary: A new node, node_landing_decision_venv_effect, builds the landing controller's decision environment with the exact libraries the decision pin names and refuses an environment whose versions differ from the pin, and the receipt publish command of node_landing_tlc_receipt_effect now imports only that node's own files in CI and reads the state directory only for the sync command.
is_seam_ticket: true
interface_change: true
interfaces_touched:
- public_api
requirements:
- id: req-omn24408-decision-venv-and-receipt-publish
  statement: The decision environment is built and checked by a node, and the receipt publish runs in CI from the receipt node's own files.
  acceptance:
  - id: AC1
    statement: 'AC1: a node builds the decision environment with the exact pinned libraries and refuses an environment whose versions differ from the pin -- falsifier: uv run pytest tests/nodes/node_landing_decision_venv_effect -q --no-cov fails with one pinned version changed'
  - id: AC2
    statement: 'AC2: the receipt publish command imports only the receipt node''s own files when it runs in CI, and reads the state directory only for the sync command -- falsifier: uv run pytest tests/nodes/node_landing_tlc_receipt_effect -q --no-cov fails on the pre-change command module'
  - id: AC3
    statement: 'AC3: integrated: on the Mac after the next pin change, the controller tick reads the new pin from the node-built environment and the tick receipt names that pin -- falsifier: read the controller''s tick receipt after the install; a tick naming the old pin or a missing environment fails it'
evidence_requirements:
- kind: tests
  description: The venv node's focused tests and the receipt node's tests, including the publish import probe
  command: uv run --frozen pytest tests/nodes/node_landing_decision_venv_effect tests/nodes/node_landing_tlc_receipt_effect -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24408-tests
  description: AC1 and AC2 proven by the named tests; AC3 is read on the Mac after the pin change merges and the orchestrator runs the install, and is named in the pull request.
  source: manual
  binds_ac:
  - AC1
  - AC2
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_landing_decision_venv_effect tests/nodes/node_landing_tlc_receipt_effect -q --no-cov
    cwd: .
- id: dod-omn24408-deploy-conditions
  description: 'Deploy probe the hosted runner can run: the venv node contract at the checked-out commit declares its completion topic; the line does not exist at the merge base, so the probe fails there.'
  source: manual
  checks:
  - check_type: command
    check_value: bash -o pipefail -c 'gh api "repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_landing_decision_venv_effect/contract.yaml?ref=$(git rev-parse HEAD)" --jq .content | base64 -d | grep -F "landing-decision-venv-completed" > /dev/null'
    cwd: .
- id: dod-omn24408-integration-proof
  description: The change is run on a lab host at the pushed head, both nodes' focused tests are read there, and the host, revision and exit code are named in the pull request; AC3's reading of the controller's tick receipt is taken after the pin change merges and the orchestrator runs the install.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane fill-ticket-OMN-24408-20261114T1108Z -- uv run --frozen pytest tests/nodes/node_landing_decision_venv_effect tests/nodes/node_landing_tlc_receipt_effect -q --no-cov
    cwd: .
