schema_version: 1.0.0
ticket_id: OMN-26066
title: The review replay set node's two recall operations are requested on their own declared topics
summary: node_review_replay_set_effect declared the freeze_recall_bar and score_recall operations in its handler routing but subscribed to one command topic and published one result topic, so no request could reach them and their results had no topic. Each operation now names its own command topic, its producer and its own result topic in the contract.
is_seam_ticket: false
interface_change: true
interfaces_touched:
- topics
requirements:
- id: req-omn26066-replay-recall-routes
  statement: Each recall operation of the review replay set node has a subscribed command topic with a named producer and a result topic the runtime router maps its result model to.
  acceptance:
  - id: AC1
    statement: 'AC1: each of the six lines has either a merged trigger declaration naming its contract file or a CI-only reason naming the contract file read -- falsifier: grep the six repo and number pairs in the integration ledger NOT RUNNING and CI-ONLY sections'
  - id: AC2
    statement: 'AC2: at least one declared trigger fires and its run line is read on the dev runtime on h201 -- falsifier: dev runtime log grep for the node name after the install'
evidence_requirements:
- kind: tests
  description: Contract route tests of the review replay set node
  command: uv run pytest tests/unit/nodes/node_review_replay_set_effect -q
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn26066-routes
  description: AC1 for the recall bar line is proven by the contract route tests, which read the contract file src/omnimarket/nodes/node_review_replay_set_effect/contract.yaml.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/nodes/node_review_replay_set_effect -q
    cwd: .
- id: dod-omn26066-deploy-conditions
  description: 'Deploy probe the hosted runner can run: the node contract at the checked-out commit declares the score_recall command topic; the line does not exist at the merge base, so the probe fails there.'
  source: manual
  checks:
  - check_type: command
    check_value: bash -o pipefail -c 'grep -F "review-replay-recall-score-requested" src/omnimarket/nodes/node_review_replay_set_effect/contract.yaml > /dev/null'
    cwd: .
- id: dod-omn26066-integration-proof
  description: The branch revision is installed on the dev lane on h201 and the node's run line is read in the dev runtime log; the host, revision and line are named in the pull request.
  source: manual
  binds_ac:
  - AC2
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane layer0-2140 -- uv run pytest tests/unit/nodes/node_review_replay_set_effect -q
    cwd: .
