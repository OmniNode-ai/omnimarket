schema_version: 1.0.0
ticket_id: OMN-23104
title: The real Tessl review findings fixed on branch omn-22955-tessl-review-fixes carry a pull request under their own ticket
summary: The install canary node read the file-list comparison and the revision resolver from the install superset guard node's private handler module, a cross-node private import. The shared helpers move unchanged into src/omnimarket/handlers/install_file_list.py and the canary, the superset guard, its CLI and its test import from there.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23104-shared-file-list
  statement: The install canary reads the file-list comparison and the revision resolver from a shared module, not from the superset guard's private handler module.
  acceptance:
  - id: AC1
    statement: "AC1: no module of the install canary node imports another node, and both nodes use the one shared comparison; on dev two of the three tests fail and the third is the error control -- falsifier: uv run --frozen pytest tests/nodes/node_install_canary_effect/test_no_private_node_imports.py -q --no-cov"
  - id: AC2
    statement: "AC2: this pull request is titled with this ticket and carries this contract -- falsifier: uv run --frozen pytest tests/ci/test_ticket_contract_prerequisite_omn20864.py -q --no-cov"
evidence_requirements:
- kind: tests
  description: The shared-module test and the install node tests pass at the pushed head.
  command: uv run --frozen pytest tests/nodes/node_install_canary_effect/test_no_private_node_imports.py src/omnimarket/nodes/node_install_superset_guard_effect src/omnimarket/nodes/node_install_canary_effect -q --no-cov
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
- id: dod-omn23104-shared-file-list
  description: The canary imports no sibling node and the superset guard and the canary use the one shared comparison; on the dev source two of the three tests fail.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_install_canary_effect/test_no_private_node_imports.py -q --no-cov
    cwd: .
- id: dod-omn23104-install-nodes
  description: The install canary and superset guard node suites still pass after the move.
