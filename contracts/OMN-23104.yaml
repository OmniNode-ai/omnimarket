    check_value: uv run --frozen pytest src/omnimarket/nodes/node_install_superset_guard_effect src/omnimarket/nodes/node_install_canary_effect -q --no-cov
    cwd: .
- id: dod-omn23104-integration-proof
  description: Run this pull request's own check on a lab host at the pushed head. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23104 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_install_canary_effect/test_no_private_node_imports.py src/omnimarket/nodes/node_install_superset_guard_effect src/omnimarket/nodes/node_install_canary_effect -q --no-cov
    cwd: .
