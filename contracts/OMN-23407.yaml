schema_version: 1.0.0
ticket_id: OMN-23407
title: The delegation board reads a lab-node scenario's latest scheduled result, and R2's scheduled run is installed on a lab host
summary: The delegation tracker's scenario reader gains a second declared source, chosen per scenario by the overlay. A scenario whose overlay entry names the lab_node source is read from the bus as the STATUS rows its node writes under its lane (the rows node_delegation_scenario_days_effect reads); the latest scheduled row is the result, a read that stops early is unread, and a hosted-workflow scenario is read as before.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23407-lab-node-source
  statement: The board's delegation reader reads a scenario named as a lab node from the bus, chosen per scenario by overlay, and never reads a missing or unfinished read as a pass.
  acceptance:
  - id: AC1
    statement: 'AC1: the board''s delegation reader has a second declared source, the latest scheduled result of a lab-node scenario read from the bus (the rows node_delegation_scenario_days_effect already reads), chosen per scenario by overlay, with a failing control where a scenario with a passing lab-node result reads not built -- falsifier: uv run pytest on node_floor_delegation_effect''s tests with a planted passing lab-node result fails on the unfixed reader'
evidence_requirements:
- kind: tests
  description: The lab-node source tests of node_floor_delegation_effect (the control, the golden reads and the named error breaks)
  command: uv run --frozen pytest tests/nodes/node_floor_delegation_effect/test_lab_node_source.py -q --no-cov -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23407-lab-node-source
  description: Runs the lab-node source tests. A passing scheduled result planted on the bus for R2 reads pass with source lab_node. The module the tests import (read_lab_node_scenario) is absent at the merge base, so the file fails to import there.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_floor_delegation_effect/test_lab_node_source.py -q --no-cov -p no:randomly
    cwd: .
- id: dod-omn23407-existing-tracker-tests
  description: Runs the golden chain tests of the tracker, which read the hosted-workflow source unchanged.
  source: manual
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_floor_delegation_effect/test_golden_chain_floor_delegation.py -q --no-cov -p no:randomly
    cwd: .
- id: dod-omn23407-integration-proof-lab
  description: Runs the lab-node source tests at the pushed head on a lab host through the lab work runner. Hosted CI cannot reach the lab runner, so only the local Done gate runs this unbound item.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: 'env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23407 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_floor_delegation_effect/test_lab_node_source.py -q --no-cov -p no:randomly'
    cwd: .
