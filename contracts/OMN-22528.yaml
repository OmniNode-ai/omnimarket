  description: Installed package discovery and the runtime dispatch engine carry each entry kind over an in-memory bus and publish the correlated typed verdict. This hosted wiring smoke asserts no live runner installation or Redpanda observation.
  source: manual
  binds_ac:
  - AC9
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/test_dispatch_standing_rules.py -q --no-cov -k installed_runtime
    cwd: .
- id: dod-omn22528-integration-proof
  description: Run this pull request's own check on a lab host at the pushed head. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-22528 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/test_dispatch_standing_rules.py -q --no-cov
