dod_evidence:
- id: dod-omn19998-standing-rules
  description: Controlled-clock rule and effect fixtures exercise required provenance, expiry, unread credit, route order and audit deduplication. These checks cover the omnimarket nodes and do not claim the external runner admission edit, core validator gate or recorded-dispatch replay.
  source: manual
  binds_ac:
  - AC8
  - AC9
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/test_dispatch_standing_rules.py -q --no-cov
