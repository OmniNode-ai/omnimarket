requirements:
- id: req-omn19998-standing-rules-compute
  statement: Standing dispatch rules evaluate caller-read facts and expire from a named fact or an absolute time.
  acceptance:
  - id: AC8
    statement: 'AC8: cloud-first refuses explicit lab placement for an eligible Claude request, routes auto in cloud-first order, excludes Codex and lab resources, refuses unread credit, resolves source rulings and allows lapsed rules -- falsifier: uv run --frozen pytest tests/nodes/test_dispatch_standing_rules.py -q --no-cov'
- id: req-omn19998-standing-rules-effect
  statement: Overlay-bound effects read facts and append one lapse audit row per rule through a discoverable node contract.
  acceptance:
  - id: AC9
    statement: 'AC9: in-memory and file-backed dependency overlays return the same answers, lapse appends are idempotent under repeated and concurrent calls, and installed runtime wiring returns the typed answer for each dispatch kind -- falsifier: uv run --frozen pytest tests/nodes/test_dispatch_standing_rules.py -q --no-cov'
