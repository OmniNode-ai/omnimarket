title: "The dev deploy reading judges every PASS, compares probe age exactly, ignores future-dated receipts and refuses a sha with a trailing newline"
summary: Fixes five findings in node_dev_deploy_reading_compute (a later qualifying PASS is no longer masked by the earliest PASS, a pre-merge PASS no longer fails a merge still pending, a PASS finishing after the read time does not count, the probe age is an exact timedelta, a sha with a trailing newline is refused) and the falsifier paths of the OMN-22958 contract.
