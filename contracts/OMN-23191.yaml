  statement: The dev deploy reading judges all qualifying PASS receipts at the read time, compares the probe age as an exact timedelta and refuses a sha that is not exactly 40 lowercase hex characters.
  acceptance:
  - id: AC1
    statement: 'AC1: a test per finding fails on the code at omnimarket dev 566d7ead09 and passes with the fix -- falsifier: uv run pytest tests/nodes/node_dev_deploy_reading_compute -q, run on the base with the test files copied in (red) and on the fix branch (green)'
  - id: AC2
    statement: 'AC2: a later qualifying PASS is not masked by an earlier PASS, and a PASS finishing after the read time does not count -- falsifier: uv run pytest tests/nodes/node_dev_deploy_reading_compute -q -k "receipt"'
  - id: AC3
    statement: 'AC3: the probe age is compared as an exact timedelta and a sha with a trailing newline is refused -- falsifier: uv run pytest tests/nodes/node_dev_deploy_reading_compute -q -k "probe or sha"'
