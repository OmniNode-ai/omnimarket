      - id: "AC1"
        statement: |-
          AC1: The installed core retired-value policy finds no retired value outside HISTORICAL files -- falsifier: tests/test_no_retired_model_values.py fails on any active file
      - id: "AC2"
        statement: |-
          AC2: The routing tiers contract and the delegation routing reducer pass with the rung removed -- falsifier: tests/test_routing_tiers_contract.py or tests/nodes/node_delegation_routing_reducer fails
evidence_requirements:
