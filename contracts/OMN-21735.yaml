---
schema_version: "1.0.0"
ticket_id: "OMN-21735"
title: "Burn-down of the contracts_and_di literal_timeout findings of omnimarket, slice rf1730-c7: the CI fix and delegated fix nodes declare their timeouts in their contract"
summary: "node_ci_fix_effect and node_pr_delegated_fix_effect held 30 subprocess and HTTP timeout literals in code (13 in handler_ci_fix, 15 in handler_delegated_fix, 2 in diff_classifier). Each value is now declared in its node's contract.yaml under timeouts, with the value it held before, and is read through the shared omnimarket.handlers.node_timeouts_reader adapter. The contracts_and_di check over src/omnimarket reports 580 literal_timeout findings before the slice and 550 after, with no baseline entry or suppression added."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-omn21735-node-timeouts"
    statement: |-
      The two nodes hold no timeout literal in code. Every duration is declared in the node contract with the value it held before, and a name the contract does not declare stops the node.
    acceptance:
      - id: "AC1"
        statement: "AC1: the contracts_and_di literal_timeout count over the two node directories is zero and the repo total drops by 30 -- falsifier: the command of dod-omn21735-check-clean below exits nonzero when a timeout literal returns to either node"
      - id: "AC2"
        statement: "AC2: every moved timeout is taken from the node contract and none remains hard-coded in the touched code -- falsifier: uv run pytest tests/unit/test_omn21735_node_timeouts.py -q --no-cov fails when a declared value or name differs from the table or a literal default returns"
      - id: "AC3"
        statement: "AC3: the slice lands as one PR titled with this ticket id and carries lab proof of the tests and the checker re-run -- falsifier: the lab-run receipt path in the PR body"
evidence_requirements:
  - kind: "tests"
    description: "The contract timeout tests pass."
    command: "uv run pytest tests/unit/test_omn21735_node_timeouts.py -q --no-cov"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn21735-timeouts-contract-tests"
    description: "Declared values, refusals, contract-sourced defaults and the clean checker result all hold."
    source: "manual"
    binds_ac: ["AC2"]
    checks:
      - check_type: "test_passes"
        check_value: "env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/test_omn21735_node_timeouts.py -q --no-cov"
        cwd: "."
  - id: "dod-omn21735-check-clean"
    description: "The pinned contracts_and_di validator scans both node directories; its structured findings contain no literal_timeout rule. Import, scan and path errors fail the probe."
    source: "manual"
    binds_ac: ["AC1"]
    checks:
      - check_type: "test_passes"
        check_value: "env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/test_omn21735_node_timeouts.py -q --no-cov -k test_slice_has_no_literal_timeout_findings"
        cwd: "."
  - id: "dod-omn21735-lab-proof"
    description: "The CI fix and delegated fix golden chains run against this checkout. The lab readback and receipt path are recorded in the PR body."
    source: "manual"
    binds_ac: ["AC3"]
    checks:
      - check_type: "test_passes"
        check_value: "env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_ci_fix_effect/test_golden_chain_ci_fix_effect.py tests/test_golden_chain_pr_delegated_fix_effect.py -q --no-cov"
        cwd: "."
  - id: "dod-omn21735-deploy-timeout-reader-readback"
    description: "Hosted source readback at the evaluated commit: both published fix handlers and the diff classifier load their node's contract timeouts. The behavior checks above exercise those imports and durations without a broker or lab service. This checks published source and wiring, not a production rollout."
    source: "manual"
    binds_ac: ["AC2"]
    checks:
      - check_type: "command"
        check_value: |-
          set -eu;
          head_sha="$(git rev-parse HEAD)";
          root="https://raw.githubusercontent.com/OmniNode-ai/omnimarket/${head_sha}/src/omnimarket/nodes";
          ci="$(curl --fail --silent --show-error --location --max-time 60 "${root}/node_ci_fix_effect/handlers/handler_ci_fix.py")";
          delegated="$(curl --fail --silent --show-error --location --max-time 60 "${root}/node_pr_delegated_fix_effect/handlers/handler_delegated_fix.py")";
          classifier="$(curl --fail --silent --show-error --location --max-time 60 "${root}/node_pr_delegated_fix_effect/handlers/diff_classifier.py")";
          printf '%s\n' "$ci" | grep -Fq '_TIMEOUTS = load_node_timeouts("node_ci_fix_effect")';
          printf '%s\n' "$ci" | grep -Fq 'timeout=_TIMEOUTS.get("test_run_s")';
          printf '%s\n' "$delegated" | grep -Fq '_TIMEOUTS = load_node_timeouts("node_pr_delegated_fix_effect")';
          printf '%s\n' "$delegated" | grep -Fq 'timeout=_TIMEOUTS.get("polish_cli_s")';
          printf '%s\n' "$classifier" | grep -Fq '_TIMEOUTS = load_node_timeouts("node_pr_delegated_fix_effect")';
          printf '%s\n' "$classifier" | grep -Fq 'timeout=_TIMEOUTS.get("git_probe_s")';
          printf 'Published timeout reader wiring verified at %s\n' "$head_sha"
        cwd: "."
      - check_type: "test_passes"
        check_value: "env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/test_omn21735_node_timeouts.py -q --no-cov -k test_module_timeouts_are_the_contract_declarations"
        cwd: "."
