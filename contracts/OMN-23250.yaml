schema_version: 1.0.0
ticket_id: OMN-23250
title: "The lab fill enumerate reads each source on its own budget floor from an omnimarket node, so a slow source cannot starve the last stage, and plans-today is read from a young copy"
summary: node_lab_fill_effect gains the enumerate_lab_fill_sources operation. It reads plan-stalled, ruling-pending, lane-resend and then source-tickets, each stage under its own budget floor (a stage may spend only what is left after the floors of the stages behind it are set aside), keeps every list a cut stage leaves behind and marks only the cut stage stale, and serves plans-today from a saved copy while it is younger than the request's bound. The local adapters run plans_today.py and ruling_mechanisms.py as child processes under the stage budget. The lane-resend and source-tickets local readers are not wired yet and refuse by name. The deletion of the old enumerate code from the frozen lab-fill script is a separate pull request and is not part of this change.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23250-sources
  statement: The enumerate operation reads each list source and the ticket stage under its own budget floor, keeps the lists on a cut, and reads plans-today from a young copy.
  acceptance:
  - id: AC1
    statement: "AC1: the enumerate operation in an omnimarket node reads each source (plan-stalled, ruling-pending, lane-resend, tickets) under its own budget floor, so a slow earlier source cannot leave source-tickets without budget -- falsifier: uv run pytest in omnimarket with a planted 15 s plans-today read, asserting source-tickets still reads (fails on the shared-budget code)"
  - id: AC2
    statement: "AC2: a source cut by its own budget keeps the lists the other sources already read and marks only that source stale -- falsifier: uv run pytest with a planted timeout on one source, asserting the other lists are returned and exactly one stale marker is set"
  - id: AC3
    statement: "AC3: plans-today is read from a young copy and the enumerate does not re-read the whole ledger on each run -- falsifier: uv run pytest asserting a copy younger than its bound is used with zero full-ledger reads, and a copy older than the bound is rebuilt"
evidence_requirements:
- kind: tests
  description: The acceptance tests of this ticket at the pushed head.
  command: uv run --frozen pytest tests/nodes/node_lab_fill_effect -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
- id: dod-omn23250-ac1
  description: With a planted 15 s plans-today read, source-tickets still reads; with the stage floor set to 0 (the shared budget) it is starved. Removing the floors of the stages behind a stage in the handler turns the AC1 and AC2 tests red.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_lab_fill_effect/test_enumerate_sources_lab_fill.py -q --no-cov -n 0 -p no:randomly -k ac1
    cwd: .
- id: dod-omn23250-ac2
  description: A planted timeout on one source returns the other lists and sets exactly one stale marker.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_lab_fill_effect/test_enumerate_sources_lab_fill.py -q --no-cov -n 0 -p no:randomly -k "ac2 or error"
    cwd: .
- id: dod-omn23250-ac3
  description: A copy younger than its bound is used with zero whole-ledger reads and an older one is rebuilt. The real adapter test runs a child process that is cut by its budget.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_lab_fill_effect/test_enumerate_sources_lab_fill.py tests/nodes/node_lab_fill_effect/test_enumerate_local_sources_lab_fill.py -q --no-cov -n 0 -p no:randomly -k "ac3 or plans or planted"
    cwd: .
- id: dod-omn23250-deploy-readback
  description: Deploy probe. The enumerate handler is present in the tree this change ships, read through gh api at the checked-out commit so hosted CI can run it before merge. It fails at the merge base, which has no enumerate handler. The tests of AC1 to AC3 run its golden and error chains.
  source: manual
  checks:
  - check_type: command
    check_value: gh api "repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_lab_fill_effect/handlers/handler_lab_fill_sources.py?ref=$(git rev-parse HEAD)" --jq .content | base64 -d | grep '^class HandlerLabFillSources' > /dev/null
    cwd: .
- id: dod-omn23250-integration-proof
  description: The pushed head ran the enumerate tests and the lab fill effect suite on a lab host through the lab work runner and exited 0. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: 'uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23250 -- uv run --frozen pytest tests/nodes/node_lab_fill_effect -q --no-cov -n 0 -p no:randomly'
    cwd: .
