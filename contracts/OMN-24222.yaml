schema_version: 1.0.0
ticket_id: OMN-24222
title: Daily work log comparison runs its per-question difference count
summary: The parity receipt writer passes the ledger reader command from ONEX_LEDGER_PARITY_VERB_COMMAND to the parity check as --verb-command, so the daily receipt can carry per-verb difference counts instead of verb_diff=not-run (plan step L1). With no command it behaves as before.
is_seam_ticket: true
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24222-verb-command
  statement: The receipt writer can pass the ledger reader command to the parity check.
  acceptance:
  - id: AC1
    statement: 'AC1: with a reading command named in the environment, the receipt writer passes it to the parity check as --verb-command. -- falsifier: uv run pytest tests/nodes/node_work_ledger_parity_receipt_effect/test_verb_command.py -k passes_the_verb_command'
  - id: AC2
    statement: 'AC2: with no reading command, the parity command line is byte for byte what it is today. -- falsifier: uv run pytest tests/nodes/node_work_ledger_parity_receipt_effect/test_verb_command.py -k unchanged_without_a_verb_command'
  - id: AC3
    statement: 'AC3: the flag the writer passes is one the parity check declares, and a receipt row carrying verb_diff counts is accepted as the day''s receipt. -- falsifier: uv run pytest tests/nodes/node_work_ledger_parity_receipt_effect/test_verb_command.py -k seam_with_the_parity_check'
  - id: AC4
    statement: 'AC4: a blank command in the environment is treated as not set and the run reports the same state as today. -- falsifier: uv run pytest tests/nodes/node_work_ledger_parity_receipt_effect/test_verb_command.py -k blank_verb_command'
  - id: AC5
    statement: 'AC5: integrated: on the ledger host running this revision with the command set, the next daily receipt row carries verb_diff counts and not not-run. -- falsifier: read the newest receipt row of lane work-ledger-parity after the install and check its verb_diff cell'
evidence_requirements:
- kind: tests
  description: The receipt writer tests pass at the pushed head.
  command: uv run --frozen pytest tests/nodes/node_work_ledger_parity_receipt_effect/test_verb_command.py tests/nodes/node_work_ledger_parity_receipt_effect/test_golden_chain_parity_receipt.py -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24222-ac1
  description: "The command is passed as --verb-command (golden), also from the unit entry's environment variable."
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_work_ledger_parity_receipt_effect/test_verb_command.py tests/nodes/node_work_ledger_parity_receipt_effect/test_golden_chain_parity_receipt.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24222-ac2
  description: No flag without a command (failing control for AC1).
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_work_ledger_parity_receipt_effect/test_verb_command.py tests/nodes/node_work_ledger_parity_receipt_effect/test_golden_chain_parity_receipt.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24222-ac3
  description: "Seam test: the parity check's own help names the flag and the receipt reader accepts a counted row."
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_work_ledger_parity_receipt_effect/test_verb_command.py tests/nodes/node_work_ledger_parity_receipt_effect/test_golden_chain_parity_receipt.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24222-ac4
  description: A blank command adds no flag and the run still appends the receipt (error chain).
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_work_ledger_parity_receipt_effect/test_verb_command.py tests/nodes/node_work_ledger_parity_receipt_effect/test_golden_chain_parity_receipt.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24222-ac5
  description: "The tests behind the integrated reading pass; the live reading is recorded in the pull request's Lab line once the ledger host runs this revision with the command set."
  source: manual
  binds_ac:
  - AC5
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_work_ledger_parity_receipt_effect/test_verb_command.py tests/nodes/node_work_ledger_parity_receipt_effect/test_golden_chain_parity_receipt.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24222-integration-proof
  description: "Run the receipt writer tests on a lab host at the pushed head. Hosted CI cannot reach the lab hosts, so only the local Done gate runs this unbound check; it binds no criterion for the hosted check. The live reading is recorded in the pull request's Lab line."
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24222 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_work_ledger_parity_receipt_effect/test_verb_command.py -q --no-cov -n 0 -p no:randomly
    cwd: .
