schema_version: 1.0.0
ticket_id: OMN-23976
title: Hook drainer spool drains and every loss raises an alarm
summary: A new effect node carries the hook-emit drainer's dead letters back to its journal when their class is no longer refused, and raises one typed alarm on the emission journal for every loss no alarm covered.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23976-spool-drain-and-alarm
  statement: Dead letters of a class the drainer no longer refuses are carried back to the journal, and a loss with no alarm raises one alarm.
  acceptance:
  - id: AC1
    statement: "AC1: dead letters of a class the drainer no longer refuses are carried back to the journal and the spool reads empty on the next run -- falsifier: uv run pytest tests/unit/nodes/node_hook_spool_reconcile_effect -k golden -q -p no:randomly --no-cov fails at the merge base"
  - id: AC2
    statement: "AC2: a loss with no alarm raises one typed alarm on the emission journal, once, and a dropped alarm reads as unalarmed -- falsifier: uv run pytest tests/unit/nodes/node_hook_spool_reconcile_effect -k 'error or control' -q -p no:randomly --no-cov fails at the merge base"
  - id: AC3
    statement: "AC3: integrated: on h053 the node run from its branch reads the real spool before and after and the alarm is on the emission journal -- falsifier: the probe on h053 with the declared overlay prints no spool counts or no loss alarm"
evidence_requirements:
- kind: tests
  description: The hook spool reconcile tests pass at the pushed head.
  command: uv run pytest tests/unit/nodes/node_hook_spool_reconcile_effect -q -p no:randomly --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23976-ac1
  description: 'AC1: the golden tests pass at the head and fail at the merge base, where the node does not exist.'
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/nodes/node_hook_spool_reconcile_effect -k golden -q -p no:randomly --no-cov
    cwd: .
- id: dod-omn23976-ac2
  description: 'AC2: the error and control tests pass at the head and fail at the merge base; the control drops the alarm and reads the loss as unalarmed.'
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/nodes/node_hook_spool_reconcile_effect -k "error or control" -q -p no:randomly --no-cov
    cwd: .
- id: dod-omn23976-ac3
  description: 'hosted proxy for AC3: the seam and parity tests that stand in for the host pass here; the reading of the h053 spool before and after is posted as a pull request comment naming the head.'
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/nodes/node_hook_spool_reconcile_effect -k "seam or parity" -q -p no:randomly --no-cov
    cwd: .
- id: dod-omn23976-integration-proof
  description: the hook spool reconcile tests run on a lab host at the pushed head; hosted CI cannot reach the lab, so only the local Done gate runs this unbound check
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23976 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/nodes/node_hook_spool_reconcile_effect -q --no-cov -p no:randomly
