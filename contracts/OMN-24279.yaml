schema_version: 1.0.0
ticket_id: OMN-24279
title: Lab host parity reads peers with their fallback targets, never names a parked host, and no longer has a delegation key item
summary: node_lab_ssh_probe_compute renders the lab-ssh half of the parity probe from the host table rows, trying each peer's target and then its declared fallback targets and leaving out rows marked available false. The delegation-key capability is dropped from the probe by operator ruling 2026-11-13.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24279-lab-ssh-node
  statement: The lab-ssh parity line is rendered by a node with a contract, typed models, a golden chain test and an error chain test, and the tests fail when the fallback loop or the parked-host filter is removed.
  acceptance:
  - id: AC1
    statement: 'AC1: a peer whose target does not answer but whose fallback target does reads ok, and a parked peer is never named -- falsifier: uv run --frozen pytest tests/nodes/node_lab_ssh_probe_compute -q --no-cov'
  - id: AC2
    statement: 'AC2: the probe prints no delegation-key line and no lab-ssh line of its own -- falsifier: uv run --frozen pytest tests/nodes/node_host_capability_compute -q --no-cov'
evidence_requirements:
- kind: tests
  description: The lab ssh probe node and host capability tests pass
  command: uv run --frozen pytest tests/nodes/node_lab_ssh_probe_compute tests/nodes/node_host_capability_compute -q --no-cov
