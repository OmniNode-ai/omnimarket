schema_version: 1.0.0
ticket_id: OMN-24279
title: Lab host parity reads peers with their fallback targets, never names a parked host, and no longer has a delegation key item
summary: node_lab_ssh_probe_compute renders the lab-ssh half of the parity probe from the host table rows, trying each peer's target and then its declared fallback targets and leaving out rows marked available false. The delegation-key capability is dropped from the probe by operator ruling 2026-11-13.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24279-lab-ssh-node
  statement: The lab-ssh parity line is rendered by a node with a contract, typed models, a golden chain test and an error chain test, and the tests fail when the fallback loop or the parked-host filter is removed; the delegation-key item is no longer a parity capability.
  acceptance:
  - id: AC1
    statement: "AC1: the lab ssh check of one host tries each peer's declared backup targets in order when its main target does not resolve, and counts a peer reached when any answers -- falsifier: pytest tests/nodes/node_lab_ssh_probe_compute -q fails when the fallback loop is removed"
  - id: AC2
    statement: 'AC2: a peer row marked available false is never named by the lab ssh check -- falsifier: the parked-host test in tests/nodes/node_lab_ssh_probe_compute fails when the filter is removed'
  - id: AC3
    statement: 'AC3: the delegation-key item is no longer a parity capability -- falsifier: a host with no key reads no refusal and pytest tests/nodes/node_host_capability_compute/test_host_capability_parity.py -q fails if the item returns'
  - id: AC4
    statement: 'AC4: integrated: the next parity record for h051, h053 and h202 read from the running placement reads OK on the lab-ssh and delegation items -- falsifier: the record names no-ssh-route or capability:delegation-key'
evidence_requirements:
- kind: tests
  description: The lab ssh probe node and host capability tests pass
  command: uv run --frozen pytest tests/nodes/node_lab_ssh_probe_compute tests/nodes/node_host_capability_compute -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24279-ac1
  description: The probe node tests pass at the head; with the fallback loop removed the h202 case reads missing and the failing control test fails, and at the merge base the node does not exist.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_lab_ssh_probe_compute -q --no-cov
    cwd: .
- id: dod-omn24279-ac2
  description: The parked-host tests pass at the head; with the available filter removed a parked row breaks the line and the failing control test fails, and at the merge base the node does not exist.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_lab_ssh_probe_compute -k parked -q --no-cov
    cwd: .
- id: dod-omn24279-ac3
  description: The host capability parity tests pass at the head and read no delegation-key line; at the merge base the handler still prints the item and the test fails.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_host_capability_compute/test_host_capability_parity.py -q --no-cov
    cwd: .
- id: dod-omn24279-ac4
  description: The seam tests pass at the head, the node's line parses into the capability the host capability reader judges and the host capability handler prints no lab-ssh line; the reading of the running placement's next parity record for h051, h053 and h202 needs the lab and is read there, hosted CI cannot reach it.
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_lab_ssh_probe_compute/test_golden_chain_lab_ssh_probe.py tests/nodes/node_host_capability_compute/test_host_capability_parity.py -k "parses or no_lab_ssh_line" -q --no-cov
    cwd: .
- id: dod-omn24279-integration-proof
  description: Run this pull request's own check on a lab host at the pushed head; hosted CI cannot reach the lab, so only the local Done gate runs this unbound check. The reading of the parity record the running placement wrote for h051, h053 and h202 is the pull request's follow-up Lab comment.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24279 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_lab_ssh_probe_compute -q --no-cov
    cwd: .
