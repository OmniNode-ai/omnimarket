schema_version: 1.0.0
ticket_id: OMN-24902
title: 'Omnimarket PR 6326 at head da6946c35cce answers its review findings, and the next dev delegation-regression-nightly run is judged to pass because of it'
summary: 'Second review round on the nightly runner change. The task text carried no finding list for this round, so no runner or test change is made; the live head is re-verified, its tests are run on the lab at the pushed head and at the base runner, and the verdict on the next nightly is read from the failing job text. AC2 (the Lab comment and the required checks) and AC3 (the ledger TERMINAL verdict) are read from the pull request watcher and the ledger, not from hosted CI.'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24902-6326-round-two
  statement: The nightly runner change on omnimarket#6326 holds at its live head, with its tests red at the base runner and green at the head, and the verdict on the next dev nightly is stated from the failing job text.
  acceptance:
  - id: AC1
    statement: 'AC1: every blocking finding of the review at the live head of omnimarket#6326 is fixed by a change with a test that fails at the base runner and passes at the new head, or argued with evidence in a PR comment -- falsifier: `uv run pytest tests/delegation_golden/test_runner_unterminalised_row_omn24831.py -q -p no:cacheprovider` passes with the runner change reverted to the base'
  - id: AC4
    statement: 'AC4: the change widens or bypasses no check, so the diff removes no assertion and adds no skip, xfail, loosened threshold or changed required-check list -- falsifier: `git diff <base> <head> -- tests/ .github/` shows a removed assert, a new skip or xfail marker, or a changed required-check list'
evidence_requirements:
- kind: tests
  description: The runner tests of the change and the golden layer tests beside them.
  command: env -u PYTHONPATH uv run --frozen pytest tests/delegation_golden -q --no-cov -n 0 -p no:randomly -m "not e2e"
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24902-ac1-tests-pass-at-head
  description: The runner test file of the change passes at the head. Its red at the base runner is the local Done gate check below and the output pasted in the pull request comment.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/delegation_golden/test_runner_unterminalised_row_omn24831.py -q --no-cov -n 0 -p no:randomly -p no:cacheprovider
    cwd: .
- id: dod-omn24902-ac1-fails-on-base
  description: The runner test file is run against a copy of the head tree whose tests/delegation_golden/runner.py is the merge-base file, and the check passes only when that run FAILS. It needs the origin/dev ref, so only the local Done gate runs it.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: |-
      bash -c 'd="$(mktemp -d)" && git archive HEAD | tar -x -C "$d" && git show origin/dev:tests/delegation_golden/runner.py > "$d/tests/delegation_golden/runner.py" && cd "$d" && ! env -u PYTHONPATH uv run --frozen pytest tests/delegation_golden/test_runner_unterminalised_row_omn24831.py -q --no-cov -n 0 -p no:randomly -p no:cacheprovider'
    cwd: .
- id: dod-omn24902-ac4-case-still-fails
  description: Hosted proxy for AC4. The runner test file asserts that the eight nightly hard-failure cases still fail on a row with terminal_ok NULL, that a completed row is still judged on its behaviour and that a wrong terminal keeps its old text, and no assertion, skip, xfail or threshold is changed. The git-diff falsifier below needs the origin/dev ref and runs at the local Done gate only.
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/delegation_golden/test_runner_unterminalised_row_omn24831.py -q --no-cov -n 0 -p no:randomly -p no:cacheprovider -k "the_case_still_fails or StillJudged or still_a_behavioural_miss"
    cwd: .
- id: dod-omn24902-ac4-git-diff
  description: 'Git-diff falsifier for AC4: against the base, the diff of tests/ and .github/ removes no assert line, adds no skip or xfail marker, and leaves .github/ untouched. Needs the origin/dev ref, so only the local Done gate runs it.'
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: |-
      bash -c 'git diff --quiet origin/dev -- .github/ && [ "$(git diff origin/dev -- tests/ .github/ | grep -cE "^-[^-].*[[:space:]]assert[[:space:]]")" = 0 ] && [ "$(git diff origin/dev -- tests/ .github/ | grep -cE "^\+[[:space:]]*(@pytest\.mark\.(skip|skipif|xfail)|.*pytest\.(skip|xfail)\()")" = 0 ]'
    cwd: .
