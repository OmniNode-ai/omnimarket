schema_version: 1.0.0
ticket_id: OMN-24933
title: node_plan_first_slice_compute declares the event_bus section the dev runtime subscribes from
summary: The merged node_plan_first_slice_compute declared runtime_dispatch.command_topic and no event_bus.subscribe_topics, so the dev runtime on h201 subscribed to nothing for it and its command could never produce a run line. The contract now declares the event_bus section (the command topic as its one subscribe topic, the two terminal events as its publish topics) and the main runtime profile, the same shape the landing decision node declares.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24933-subscribe
  statement: The dev runtime subscribes to the command topic of node_plan_first_slice_compute from its contract's event_bus section.
  acceptance:
  - id: AC1
    statement: 'AC1: the node contract names runtime_dispatch.command_topic as its one event_bus.subscribe_topics entry, both terminal events as event_bus.publish_topics, and the main runtime profile -- falsifier: `uv run pytest tests/unit/nodes/node_plan_first_slice_compute -q -k subscribes` fails on KeyError event_bus'
  - id: AC2
    statement: 'AC2: the node keeps passing its golden, error, chain, overlay, contract and injected-break tests with the event_bus section in the contract -- falsifier: `uv run pytest tests/unit/nodes/node_plan_first_slice_compute -q` reports a failure'
evidence_requirements:
- kind: tests
  description: The node tests, with the new contract subscription test.
  command: env -u PYTHONPATH uv run --frozen pytest tests/unit/nodes/node_plan_first_slice_compute -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
