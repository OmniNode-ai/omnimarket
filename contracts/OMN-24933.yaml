- id: dod-omn24933-integration-proof
  description: Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check. The pushed head ran the node tests, the subscription test among them, on a lab host through the lab work runner and exited 0. The running reading (the dev runtime on h201 logging a run of the node after a merged revision is deployed) is read from the lab receipt comment on the ticket.
  source: manual
