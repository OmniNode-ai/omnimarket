    check_value: uv run --frozen pytest tests/unit/nodes/node_secret_store_effect/test_house_model_key.py -q --no-cov
- id: dod-omn22795-integration-proof
  description: After the dispatch venv on the dev host carries this change and the deploy agent starts through exec mode (OMN-22792), the dev runtime-effects container holds a non-empty LLM_TYPESAFE_API_KEY. The check prints no value.
  source: manual
