schema_version: 1.0.0
ticket_id: OMN-24715
title: The two arch graph address pull requests carry their review findings fixed, so the declared address can land
summary: Review fixes on omnimarket#6315 (the ticket contract for OMN-24687, the bolt uri model, the host overlay handler and the two node contract descriptions) and on overlays#577 (the pin line, one bolt_uri plus a hosts list, the test reading lab_hosts). It does not close OMN-24687; AC1, AC4 and AC5 of that ticket stay open because no Memgraph answers on any lab host.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn24715-review-fixes
    statement: Each review finding on the two pull requests is fixed with a test that failed first.
    acceptance:
      - id: AC1
        statement: 'AC1: overlays#577 carries an arch_graph_bolt pin line in .omnimarket-node-pins naming the omnimarket merge commit, with the README cell corrected, and the overlay validation job passes -- falsifier: uv run pytest -q -k arch_graph_bolt in the overlays repository, plus the overlays ci.yml node pin check run on the branch head'
      - id: AC2
        statement: 'AC2: the overlay declares one bolt_uri plus a hosts list and its test reads the lab native names from lab_hosts fallback_targets, written red first -- falsifier: uv run pytest -q tests/test_arch_graph_bolt_overlay.py in the overlays repository'
      - id: AC3
        statement: 'AC3: omnimarket#6315 contracts/OMN-24687.yaml lists all five criteria, binds the host overlay test to AC2 only, carries AC1, AC4 and AC5 as unmet, and has one integration check each with --host h051 and --host h053 asserting output starts with bolt -- falsifier: uv run pytest -q -k arch_graph_bolt in the omnimarket repository plus the dod-verify run on the contract'
      - id: AC4
        statement: 'AC4: the bolt uri model refuses bolt:///, bolt://:7687 and a value with trailing text, the host overlay handler imports the one short host name helper, its refusal carries the reader message, and the two node contract descriptions name the host overlay row as the second source, each with a test red first -- falsifier: uv run pytest -q -k arch_graph_bolt in the omnimarket repository'
evidence_requirements:
  - kind: tests
    description: The arch graph bolt tests of this repository.
    command: uv run pytest -q --no-cov -n 0 -p no:randomly -k arch_graph_bolt tests/handlers tests/models
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn24715-integration-proof-overlays
    description: The overlays repository owns AC1 and AC2. Hosted CI of this repository cannot run that repository's suite, so the local Done gate runs the overlays arch_graph_bolt tests on a lab host at the overlays#577 branch head.
    source: manual
    execution_scope: local_done_gate
    binds_ac:
      - AC1
      - AC2
    checks:
      - check_type: command
        check_value: onex lab-work run --repo OmniNode-ai/overlays --sha "$(git -C "$OMNI_HOME/overlays" rev-parse origin/omn-24687-arch-graph-bolt-host-overlay)" --lane dod-omn24715-overlays --kind test -- uv run --no-project --with pytest --with pyyaml pytest -q -k arch_graph_bolt tests/test_arch_graph_bolt_overlay.py
        cwd: .
  - id: dod-omn24715-ac3-ticket-contract
    description: contracts/OMN-24687.yaml lists all five criteria, binds the host overlay test to AC2 only, carries AC1, AC4 and AC5 as unmet and pins the integration check to h051 and h053.
    source: manual
    binds_ac:
      - AC3
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/handlers/test_arch_graph_bolt_ticket_contract.py -q --no-cov -n 0 -p no:randomly
        cwd: .
  - id: dod-omn24715-ac4-uri-handler-descriptions
    description: The bolt uri model refusals, the one short host name helper, the reader message in the refusal and the two node contract descriptions, each tested.
    source: manual
    binds_ac:
      - AC4
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/models/test_arch_graph_bolt_overlay_model.py tests/handlers/test_arch_graph_bolt_host_overlay.py tests/handlers/test_arch_graph_bolt_node_contracts.py -q --no-cov -n 0 -p no:randomly
        cwd: .
