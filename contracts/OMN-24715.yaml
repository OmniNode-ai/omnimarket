schema_version: 1.0.0
ticket_id: OMN-24715
title: The two arch graph address pull requests carry their review findings fixed, so the declared address can land
summary: Review fixes on omnimarket#6315 (the ticket contract for OMN-24687, the bolt uri model, the host overlay handler and the two node contract descriptions) and on overlays#577 (the pin line, one bolt_uri plus a hosts list, the test reading lab_hosts). It does not close OMN-24687; AC1, AC4 and AC5 of that ticket stay open because no Memgraph answers on any lab host. Only AC3 and AC4 are listed below, because only they are proved by a hosted test of this repository. The two criteria this contract no longer lists are carried by overlays#577 and bound to no hosted test here. AC1 (the arch_graph_bolt pin line in .omnimarket-node-pins naming the omnimarket merge commit, with the README cell corrected, and the overlay validation job passing) is carried by the overlays ci.yml node pin check on that pull request; AC2 (the overlay declares one bolt_uri plus a hosts list and its test reads the lab native names from lab_hosts fallback_targets) is carried by tests/test_arch_graph_bolt_overlay.py in the overlays repository. The unbound local item dod-omn24715-integration-proof-overlays runs that overlays test on a lab host and carries no binds_ac, because the hosted receipt gate runs a local_done_gate item at neither the head nor the merge base.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn24715-review-fixes
    statement: Each review finding on the two pull requests is fixed with a test that failed first.
    acceptance:
      - id: AC3
        statement: 'AC3: omnimarket#6315 contracts/OMN-24687.yaml lists only AC2 in acceptance, binds the host overlay test to AC2 by a hosted test_passes item, states AC1, AC3, AC4 and AC5 in its summary with where each is carried, carries no binds_ac on any local_done_gate item, and keeps one integration check each with --host h051 and --host h053 asserting output starts with bolt as unbound local evidence -- falsifier: uv run pytest tests/handlers/test_arch_graph_bolt_ticket_contract.py in the omnimarket repository plus tests/ci/test_repo_evidence_caller_workflow.py'
      - id: AC4
        statement: 'AC4: the bolt uri model refuses bolt:///, bolt://:7687 and a value with trailing text, the host overlay handler imports the one short host name helper, its refusal carries the reader message, and the two node contract descriptions name the host overlay row as the second source, each with a test red first -- falsifier: uv run pytest -q -k arch_graph_bolt in the omnimarket repository'
evidence_requirements:
  - kind: tests
    description: The arch graph bolt tests of this repository.
    command: uv run pytest -q --no-cov -n 0 -p no:randomly -k arch_graph_bolt tests/handlers tests/models
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn24715-integration-proof-overlays
    description: Unbound local evidence for AC1 and AC2, which are not listed in acceptance. The overlays repository owns AC1 and AC2. Hosted CI of this repository cannot run that repository's suite, so the local Done gate runs the overlays arch_graph_bolt tests on a lab host at origin/main of the declared overlays clone, which holds the overlay file once overlays#577 has merged.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: onex lab-work run --repo OmniNode-ai/overlays --sha "$(git -C "$OMNI_HOME/../overlays" rev-parse origin/main)" --lane dod-omn24715-overlays --kind test -- uv run --no-project --with pytest --with pyyaml pytest -q -k arch_graph_bolt tests/test_arch_graph_bolt_overlay.py
        cwd: .
  - id: dod-omn24715-ac3-ticket-contract
    description: contracts/OMN-24687.yaml lists only AC2, binds the host overlay test to it by a hosted item, states the other four criteria in its summary, binds no local_done_gate item and pins the integration check to h051 and h053.
    source: manual
    binds_ac:
      - AC3
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/handlers/test_arch_graph_bolt_ticket_contract.py -q --no-cov -n 0 -p no:randomly
        cwd: .
  - id: dod-omn24715-ac4-uri-handler-descriptions
    description: The bolt uri model refusals, the one short host name helper, the reader message in the refusal and the two node contract descriptions, each tested.
    source: manual
    binds_ac:
      - AC4
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/models/test_arch_graph_bolt_overlay_model.py tests/handlers/test_arch_graph_bolt_host_overlay.py tests/handlers/test_arch_graph_bolt_node_contracts.py -q --no-cov -n 0 -p no:randomly
        cwd: .
