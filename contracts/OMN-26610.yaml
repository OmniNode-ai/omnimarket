schema_version: 1.0.0
ticket_id: OMN-26610
title: "The onex TUI's / list shows only the 9 commands a customer needs"
summary: "Typing / in the onex TUI lists the nine customer commands declared in tui_design.yaml; a typed internal command says it is not a TUI command; ONEX_CLI_SHOW_ALL_COMMANDS=1 lists every command; /doctor and /metering run in the TUI."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn26610-ac1
    statement: "Typing / in the onex TUI lists exactly /config, /model, /delegation, /dashboard, /doctor, /metering, /clear, /help and /quit, in that order, declared once in tui_design.yaml."
    acceptance:
      - id: AC1
        statement: 'AC1: Typing / in the onex TUI lists exactly /config, /model, /delegation, /dashboard, /doctor, /metering, /clear, /help and /quit, in that order, declared once in tui_design.yaml. falsifier: uv run pytest tests/unit/nodes/node_onex_setup_effect/test_onex_tui_customer_commands.py::test_slash_lists_exactly_the_customer_commands_in_order -q'
  - id: req-omn26610-ac2
    statement: "Typing a hidden command (for example /scm pr-list or /auth lane-login) runs nothing and says Not a TUI command: run onex <command> in a terminal."
    acceptance:
      - id: AC2
        statement: 'AC2: Typing a hidden command (for example /scm pr-list or /auth lane-login) runs nothing and says Not a TUI command: run onex <command> in a terminal. falsifier: uv run pytest tests/unit/nodes/node_onex_setup_effect/test_onex_tui_customer_commands.py::test_a_typed_internal_command_runs_nothing_and_says_where_to_run_it -q'
  - id: req-omn26610-ac3
    statement: "With ONEX_CLI_SHOW_ALL_COMMANDS=1 the TUI lists every command as it does today."
    acceptance:
      - id: AC3
        statement: 'AC3: With ONEX_CLI_SHOW_ALL_COMMANDS=1 the TUI lists every command as it does today. falsifier: uv run pytest tests/unit/nodes/node_onex_setup_effect/test_onex_tui_customer_commands.py::test_the_operator_switch_lists_every_command -q'
  - id: req-omn26610-ac4
    statement: "/doctor and /metering run their CLI command and show their output in the TUI."
    acceptance:
      - id: AC4
        statement: 'AC4: /doctor and /metering run their CLI command and show their output in the TUI. falsifier: uv run pytest tests/unit/nodes/node_onex_setup_effect/test_onex_tui_customer_commands.py::test_doctor_and_metering_run_their_cli_command_and_show_output -q'
evidence_requirements:
  - kind: tests
    description: "AC1-AC4 tests."
    command: uv run --frozen pytest -q --no-cov tests/unit/nodes/node_onex_setup_effect/test_onex_tui_customer_commands.py
