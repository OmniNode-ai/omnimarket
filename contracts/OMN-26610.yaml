title: "The onex TUI lists only the nine commands a customer needs"
summary: "Typing / in the onex TUI lists /config, /model, /delegation, /dashboard, /doctor, /metering, /clear, /help and /quit; every other command stays in the CLI, a typed one runs nothing and says so, and there is no switch that lists them all."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn26610-ac1
  statement: "`/` in the TUI lists exactly /config, /model, /delegation, /dashboard, /doctor, /metering, /clear, /help, /quit in that order, declared once in tui_design.yaml"
  acceptance:
  - id: AC1
    statement: 'AC1: `/` in the TUI lists exactly /config, /model, /delegation, /dashboard, /doctor, /metering, /clear, /help, /quit in that order, declared once in tui_design.yaml; Falsifier: tests/unit/nodes/node_onex_setup_effect/test_onex_tui_customer_commands.py'
- id: req-omn26610-ac2
  statement: "a typed command the TUI does not list runs nothing and says: Not a TUI command: run onex <command> in a terminal"
  acceptance:
  - id: AC2
    statement: 'AC2: a typed command the TUI does not list runs nothing and says: Not a TUI command: run onex <command> in a terminal; Falsifier: tests/unit/nodes/node_onex_setup_effect/test_onex_tui_customer_commands.py'
- id: req-omn26610-ac3
  statement: "the TUI has no list-everything switch and reads no ONEX_CLI_SHOW_ALL_COMMANDS variable: with it set, `/` still lists exactly the nine and a typed hidden command still runs nothing"
  acceptance:
  - id: AC3
    statement: 'AC3: the TUI has no list-everything switch and reads no ONEX_CLI_SHOW_ALL_COMMANDS variable: with it set, `/` still lists exactly the nine and a typed hidden command still runs nothing; Falsifier: tests/unit/nodes/node_onex_setup_effect/test_onex_tui_customer_commands.py'
- id: req-omn26610-ac4
  statement: "/doctor and /metering run and show their output in the TUI"
  acceptance:
  - id: AC4
    statement: 'AC4: /doctor and /metering run and show their output in the TUI; Falsifier: tests/unit/nodes/node_onex_setup_effect/test_onex_tui_customer_commands.py'
