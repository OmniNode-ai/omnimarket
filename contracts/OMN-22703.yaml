schema_version: 1.0.0
ticket_id: OMN-22703
title: The floor judges each piece's event freshness by its own reading schedule
summary: The floor compared every piece's newest golden event with one 15 minute bound, so a nightly piece read stale two hours after its run. The receipt now compares a piece's golden event with that piece's own reading_max_age_s from the floor overlay (900 s for the floor's own piece, 86400 s for a daily piece, 691200 s for the weekly walk). The global bound still draws the page's own age.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn22703-piece-freshness
  statement: A piece's golden event is fresh when it is no older than that piece's own reading_max_age_s, and stale past it.
  acceptance:
  - id: AC2
    statement: 'AC2: a piece whose golden event is two hours old is fresh when its reading_max_age_s is 86400 and stale when it is 900, in the same receipt -- falsifier: uv run --frozen pytest tests/nodes/node_floor_emission_compute -q --no-cov with the bound taken from the global freshness_max_age_s fails the test'
evidence_requirements:
- kind: tests
  description: The per-piece freshness bound of the floor receipt
  command: uv run --frozen pytest tests/nodes/node_floor_emission_compute -q --no-cov
