schema_version: 1.0.0
ticket_id: OMN-24354
title: The node inventory test derives its no-entry-point set from the contracts the drift gate reads
summary: node-drift-gate excuses a node with lifecycle experimental or deprecated from the onex.nodes entry-point check, while the node inventory test kept a literal set EXPECTED_MISSING_ENTRY_POINTS. The
  test now derives that set from the same contract lifecycle (via scripts.validate_node_drift), so the two cannot disagree and no new list or exemption file exists. The test selector rule is not in this
  change.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24354-one-source
  statement: The node inventory test derives the nodes allowed without an onex.nodes entry point from the contract lifecycle the drift gate uses, not from a separate literal set.
  acceptance:
  - id: AC1
    statement: 'AC1: the inventory test derives EXPECTED_MISSING_ENTRY_POINTS from contract lifecycle (experimental or deprecated, no entry point) -- falsifier: the inventory tests fail if the derived set
      omits a lifecycle-exempt node or includes a registered one'
  - id: AC3
    statement: 'AC3: integrated: on the pull request head in omnimarket CI, node-drift-gate and the dogfood inventory test both read success -- falsifier: onex scm pr-checks OmniNode-ai/omnimarket#<n> shows
      node-drift-gate or lint not success'
evidence_requirements:
- kind: tests
  description: The inventory tests pass at the pushed head.
  command: uv run --frozen pytest tests/test_market_node_runtime_dogfood.py -q --no-cov -n 0 -p no:randomly -k "inventory or entry_point"
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24354-ac1
  description: 'AC1: the inventory test derives its set from contract lifecycle and the real inventory has no violations.'
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/test_market_node_runtime_dogfood.py -q --no-cov -n 0 -p no:randomly -k "inventory or entry_point"
    cwd: .
- id: dod-omn24354-ac3
  description: 'hosted proxy for AC3: the inventory tests and the drift gate unit tests pass at the head.'
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/scripts/test_validate_node_drift.py -q --no-cov -n 0 -p no:randomly
    cwd: .
