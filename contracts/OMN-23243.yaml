schema_version: 1.0.0
ticket_id: OMN-23243
title: The floor's red rule reads NOT WORKING when a red row's owner tickets have no running lane, instead of counting a listed owner ticket as carried
summary: >-
  check_red_rule in node_floor_simple_compute gains red_rule.uncarried_red, the id of every red cause that no live lane is
  on (a lane on one of its owner tickets, its parent ticket, its pull requests or its owns= cell), and the state reads NOT
  WORKING while any exist. A ticket id in a cause's owners list is a name, not a carrier. The declared-owner reading
  unowned_red (OMN-22928) is unchanged. The page names the rows.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23243-carrier
  statement: The red rule reads NOT WORKING and names each red row whose owner tickets have no live lane, and passes a red row that has a live lane for one of its owner tickets.
  acceptance:
  - id: AC1
    statement: 'AC1: the red rule fails, state NOT WORKING, naming each red row whose owner tickets have no live lane, and passes a red row that has a live lane for one of its owner tickets -- falsifier: uv run pytest of the node_floor_simple_compute tests with the recorded floor-simple.json of 2026-11-08T23:42:44Z, which reads WORKING on the current handler and must read NOT WORKING naming stoppage:lab-idle, stoppage:unclassified, stoppage:quiet-host and piece:1'
  - id: AC2
    statement: 'AC2: the declared-owner reading is unchanged, so a red row with an empty owners list is still named in unowned_red -- falsifier: the existing unowned-red tests of node_floor_simple_compute pass unchanged under uv run pytest'
  - id: AC3
    statement: 'AC3: after the publisher install the served board names the red rows with no carrier while any exist -- falsifier: curl of the served floor-simple.json, reading red_rule.state and its list of rows with no carrier'
evidence_requirements:
- kind: tests
  description: The red-rule carrier tests and the existing unowned-red tests of node_floor_simple_compute.
  command: uv run --frozen pytest tests/nodes/node_floor_simple_compute -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23243-ac1-carrier
  description: >-
    The recorded board of 2026-11-08T23:42:44Z (five red rows, no lane, served state WORKING) is run through check_red_rule:
    the state reads NOT WORKING and uncarried_red is stoppage:lab-idle, stoppage:unclassified, stoppage:quiet-host and
    piece:1. A red row with a live lane on one of its owner tickets is not named, and a dead, finished or stalled lane
    carries nothing. The named break is the base handler, which reads WORKING on the same board.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_floor_simple_compute/test_red_rule_carrier_omn23243.py -q --no-cov
    cwd: .
- id: dod-omn23243-ac2-unowned
  description: The existing unowned-red tests of node_floor_simple_compute pass unchanged.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_floor_simple_compute/test_unowned_red_floor_omn22862.py -q --no-cov
    cwd: .
- id: dod-omn23243-ac3-served
  description: >-
    After the publisher install the served floor-simple.json carries red_rule.uncarried_red and its state reads NOT WORKING
    while it is not empty. Read after the install, not at this pull request.
  source: manual
  execution_scope: local_done_gate
  binds_ac:
  - AC3
  checks:
  - check_type: command
    check_value: curl -s "$FLOOR_SIMPLE_JSON_URL" | python3 -c "import json,sys; r=json.load(sys.stdin)['red_rule']; assert 'uncarried_red' in r and (r['state']=='NOT WORKING' or not r['uncarried_red']), r['state']"
    cwd: .
- id: dod-omn23243-integration-proof
  description: The node tests run on a lab host at the pushed head through the lab-work node.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23243 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_floor_simple_compute -q --no-cov
    cwd: .
