schema_version: 1.0.0
ticket_id: OMN-23346
title: Drop the stale transport-import exclusion for the merge sweep compute entry point (validator exclusion burn-down, slice 2)
summary: >-
  The static transport-import exclusion list in scripts/ci/check_unimported_handlers.py carried node_merge_sweep_compute/__main__.py although
  that file holds no banned import. The entry is removed, and a guard test fails when any remaining exclusion no longer hides a violation.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23346-stale-exclusion
  statement: The transport-import exclusion list carries no entry that hides nothing, and a test keeps it that way.
  acceptance:
  - id: AC1
    statement: 'AC1: the transport-import exclusion list no longer carries node_merge_sweep_compute/__main__.py and the transport-import check passes without it -- falsifier: uv run pytest -q -k transport_import in omnimarket'
  - id: AC2
    statement: 'AC2: the change merges on dev with contracts/OMN-23346.yaml -- falsifier: uv run pytest tests/contracts -q -k OMN-23346'
evidence_requirements:
- kind: tests
  description: The transport-import gate tests, including the guard that every static exclusion still violates.
  command: uv run --frozen pytest tests/ci/test_dynamic_import_gate.py -q -n 0 --no-cov -p no:randomly -k transport_import
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23346-ac1-exclusion-dropped
  description: >-
    The guard test asks ValidatorTransportImport for each remaining static exclusion and fails if one reports no banned import. The named
    break is the __main__.py entry planted back into the exclusion list: the guard test fails and names node_merge_sweep_compute/__main__.py.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/ci/test_dynamic_import_gate.py -q -n 0 --no-cov -p no:randomly -k transport_import_static_excludes
    cwd: .
- id: dod-omn23346-transport-check-clean
  description: Runs the transport-import check on the tree; it reports 0 violations with the entry removed. A regression check, so it binds no criterion.
  source: manual
  checks:
  - check_type: command
    check_value: uv run --frozen python scripts/ci/check_unimported_handlers.py --transport-imports
    cwd: .
- id: dod-omn23346-ac2-contract
  description: >-
    The exclusion list in the tree this contract ships with no longer names the merge sweep compute entry point, so the guard test fails at the
    merge base, where the entry is still present, and passes at the head. The contract itself is loaded by the ticket-contract schema test below.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/ci/test_dynamic_import_gate.py -q -n 0 --no-cov -p no:randomly -k transport_import_static_excludes_each_still_violate
    cwd: .
- id: dod-omn23346-contract-loads
  description: The ticket-contract schema test loads every contract, this one included. A regression check, so it binds no criterion.
  source: manual
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/ci/test_ticket_contracts_schema_omn17427.py -q -n 0 --no-cov -p no:randomly
    cwd: .
- id: dod-omn23346-integration-proof
  description: On a lab host the guard test runs at the pushed head through the lab work runner. Hosted CI cannot reach a lab host, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: 'env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23346 --kind test -- uv run --frozen pytest tests/ci/test_dynamic_import_gate.py -q --no-cov -p no:randomly -k transport_import_static_excludes'
    cwd: .
