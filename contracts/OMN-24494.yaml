schema_version: 1.0.0
ticket_id: OMN-24494
title: The ticket-closing run reports the largest real reason it closed nothing
summary: The zero-flip reading of node_dod_closeout_sweep_compute counts each unmet criterion's reason text, and the one verify line every ticket shares outvotes unique prose, so the run reports criteria drift as its top reason though it is the smallest of the three largest classes in the three latest runs. The reasons are now counted by class (reason_class in closer_completion_rules), so top_deferral_reason and the held reason counts name the largest class. No ticket decision changes.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24494-reason-classes
  statement: The zero-flip reading counts unmet criteria by the class of their reason, so its top reason and held counts name the largest class.
  acceptance:
  - id: AC1
    statement: 'AC1: the zero-flip reading names the largest reason class, not the line every ticket shares, and its per-class counts replace the one-off sentences -- falsifier: uv run pytest tests/test_closeout_completion.py -q -p no:randomly --no-cov -k "largest_class or by_class"'
  - id: AC2
    statement: 'AC2: every reason the ticket decision writes belongs to a class the counter knows -- falsifier: uv run pytest tests/test_closeout_completion.py -q -p no:randomly --no-cov -k "decide_ticket_writes_has_a_class"'
  - id: AC3
    statement: 'AC3: integrated: the next dod-closeout-sweep run on the Mac after the new revision is installed writes a STATUS row whose held_reasons keys are class names and whose top_reason is the class with the most criteria -- falsifier: the STATUS row of that run in the ledger shows a held_reasons key that is a one-off sentence, or a top_reason that is not the largest class'
evidence_requirements:
- kind: tests
  description: The completion tests at the pushed head; the largest-class test fails on the counting before this change (it returns the shared drift line).
  command: uv run pytest tests/test_closeout_completion.py -q -p no:randomly --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24494-ac1
  description: 'AC1: the top reason is the largest class and the held counts are by class; against the counting before this change the largest-class test fails.'
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/test_closeout_completion.py -q -p no:randomly --no-cov -k "largest_class or by_class"
    cwd: .
- id: dod-omn24494-ac2
  description: 'AC2: every reason the ticket decision writes has a class.'
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/test_closeout_completion.py -q -p no:randomly --no-cov -k "decide_ticket_writes_has_a_class"
    cwd: .
- id: dod-omn24494-integration-proof
  description: 'AC3 lab proxy: the completion tests run on a lab host at the pushed head; the Mac sweep''s next STATUS row after the install is read by the orchestrator and is not claimed here.'
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24494 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/test_closeout_completion.py -q -p no:randomly --no-cov
    cwd: .
- id: dod-omn24494-ac3-hosted-proxy
  description: 'hosted proxy for AC3: the zero-flip reading''s held counts are keyed by class; the Mac sweep row itself is read by the unbound integration proof item above.'
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/test_closeout_completion.py -q -p no:randomly --no-cov -k "held_reason_counts_are_by_class"
    cwd: .
