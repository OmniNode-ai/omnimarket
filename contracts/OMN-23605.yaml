schema_version: 1.0.0
ticket_id: OMN-23605
title: The lab stability lane declares its tenant in the lane table
summary: The CI lane table declares a tenant_id for the lane the chain canary grades, so the canary can stamp the lane tenant on its bus submission (step A1 of the HTTP API removal, parent OMN-23566). Nothing else in the table changes.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23605-lane-tenant
  statement: The lane the chain canary grades carries a tenant_id that is a valid UUID, and no other lane does.
  acceptance:
  - id: AC1
    statement: 'AC1: the lane the chain canary grades declares a tenant_id that is a valid UUID in the lane table -- falsifier: `git -C omnimarket show origin/dev:config/ci_bus_lanes.yaml` shows no `tenant_id` under that lane after merge'
  - id: AC2
    statement: 'AC2: no other lane''s declaration changed -- falsifier: `git -C omnimarket diff origin/dev~1 origin/dev -- config/ci_bus_lanes.yaml` shows a changed line outside that lane''s entry'
  - id: AC3
    statement: 'AC3: the focused test fails at the merge base and passes with the change -- falsifier: `pytest tests/ci/test_omn23566_lane_tenant_key.py` passes on the merge base'
evidence_requirements:
- kind: tests
  description: The lane tenant tests at the pushed head. With config/ci_bus_lanes.yaml restored to origin/dev the first test fails.
  command: env -u PYTHONPATH uv run pytest tests/ci/test_omn23566_lane_tenant_key.py -q
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23605-ac1-tenant
  description: The lane tenant tests pass at the pushed head.
  source: manual
  binds_ac:
  - AC1
  - AC2
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/ci/test_omn23566_lane_tenant_key.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn23605-integration-proof-lab
  description: Runs the lane tenant tests at the pushed head on a lab host through the lab work runner. Hosted CI cannot reach the lab runner, so only the local Done gate runs this unbound item.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: 'env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23605 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/ci/test_omn23566_lane_tenant_key.py -q --no-cov -p no:randomly'
    cwd: .
