schema_version: 1.0.0
ticket_id: OMN-23014
title: The work-state projection reads each source on its own budget and timeout, keeps a cached snapshot, and marks a slow source stale instead of failing the whole read
summary: Each source of the work-state projection (ledger, PR watcher, Linear, plans, receipts, readings) is read on its own thread under its own overlay budget, per-attempt timeout and attempt count. A source over its budget serves its last snapshot marked stale with its age (up to the source's own declared maximum age); a source with no usable snapshot is named in unread. The other sources and the projection still read.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23014-source-budgets
  statement: One slow or stalled source never exhausts a budget shared with the others; it serves its last snapshot marked stale with its age and the projection still reads.
  acceptance:
  - id: AC1
    statement: 'AC1: each source (ledger, PR watcher and controller decisions, Linear, plans, receipts, readings, commitments) is read under its own declared budget and timeout, a source over its budget serves its last snapshot marked stale with its age, and the other sources and the projection still read, with a failing control that stalls one source -- falsifier: uv run pytest of the projection''s per-source budget tests'
evidence_requirements:
- kind: tests
  description: The per-source budget tests of the work-state projection, including the stalled-source control and the stale golden and invalid-budget error chains.
  command: uv run --frozen pytest tests/nodes/node_work_state_projection_compute/test_work_state_source_budgets.py tests/nodes/node_work_state_projection_compute/test_work_state_parity.py -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23014-ac1
  description: The per-source budget tests pass, including the control whose reader blocks until the test ends, the stale-with-age read of a stalled source while the others read fresh, the per-source (not shared) budget, the file snapshot store, the overlay refusing a missing or zero budget, and the bus golden and error chains.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_work_state_projection_compute/test_work_state_source_budgets.py tests/nodes/node_work_state_projection_compute/test_work_state_parity.py -q --no-cov
- id: dod-omn23014-integration-proof
  description: Run the projection node's tests on a lab host at the pushed head. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23014 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_work_state_projection_compute -q --no-cov
