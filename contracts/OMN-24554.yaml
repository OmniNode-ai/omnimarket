schema_version: 1.0.0
ticket_id: OMN-24554
title: R9 checks malformed and hostile tasks over the bus
summary: Scenario R9 ran as a hosted job that called the onex-api web service, which was removed from dev, so it failed every hour from 2026-11-14T18:15Z. R9 is now a lab node (node_delegation_scenario_r9_effect)
  that sends the committed malformed and injected requests as raw bus commands to the delegation runtime, reads each typed refusal terminal and reads R8's bus lane as its positive control; it reuses R8's
  bus adapter and R8's overlay document, and a host installer unit (scenario-r9-systemd) runs it hourly.
is_seam_ticket: true
interface_change: true
interfaces_touched: []
requirements:
- id: req-omn24554-r9-bus
  statement: Each committed bad request is refused over the bus with the declared typed refusal, and an unreachable bus never reads as all refused.
  acceptance:
  - id: AC1
    statement: 'AC1: the R9 lab node sends each committed malformed or injected request to the delegation command topic over the bus and passes only when every one gets a failed terminal carrying the declared
      refusal code, marked not retryable, with the offending field named where the runtime names it -- falsifier: pytest tests/nodes/node_delegation_scenario_r9_effect/test_golden_chain_scenario_r9_effect.py -q fails when
      a terminal carries another code, is retryable, or is a success'
  - id: AC2
    statement: 'AC2: R9 fails when the positive control, a read of the probe customer''s totals over the same bus, does not complete, so an unreachable bus cannot read as all refused -- falsifier: the error
      chain tests in the same file fail when the control failure is read as a pass'
  - id: AC3
    statement: 'AC3: the corpus, the refusal code and the topics are read from the node''s inputs and the runtime''s contract, and the shape R9 shares with R8''s bus adapter is one model -- falsifier: pytest
      tests/nodes/node_delegation_scenario_r9_effect/test_seam_r8_adapter.py -q fails when either side changes a key name'
  - id: AC4
    statement: 'AC4: integrated: on lab host h053 the installed R9 unit runs on its hourly timer and the delegation board shows R9 passing from that scheduled run -- falsifier: the delegation tracker''s
      JSON still shows R9 failing at the lab lane resolve step after the unit ran'
evidence_requirements:
- kind: tests
  description: The R9 node tests (golden chain, error chains, failing controls, seam to the R8 adapter and the runtime contract) and the host installer unit tests.
  command: env -u PYTHONPATH uv run --frozen pytest tests/nodes/node_delegation_scenario_r9_effect tests/nodes/node_host_installer_registry_units/test_scenario_r3_r5_r8_units.py tests/nodes/node_host_installer_registry_units/test_scenario_r8_overlay_root.py
    -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24554-ac1-corpus
  description: The golden chain and error chain tests of the R9 scenario with their failing controls.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_delegation_scenario_r9_effect/test_golden_chain_scenario_r9_effect.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24554-ac2-control
  description: 'The error chain tests of the same file: a control that does not complete fails the run although every case was refused.'
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_delegation_scenario_r9_effect/test_golden_chain_scenario_r9_effect.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24554-ac3-seam
  description: 'The seam tests: the topics from the runtime contract, the payload model, the failed terminal wording and the bus open shared with the R8 adapter.'
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_delegation_scenario_r9_effect/test_seam_r8_adapter.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24554-ac4-integration-proof
  description: Hosted CI cannot reach the lab host, so only the local Done gate runs this unbound check; the running reading is the R9 unit's scheduled result on h053 and the tracker, recorded as a receipt
    comment on the ticket.
  source: manual
  execution_scope: local_done_gate
  binds_ac:
  - AC4
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24554 --kind test -- env PYTHONDONTWRITEBYTECODE=1
      uv run --frozen pytest tests/nodes/node_delegation_scenario_r9_effect -q --no-cov -n 0 -p no:randomly
    cwd: .
