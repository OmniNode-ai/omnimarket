    check_value: uv run pytest tests/unit/nodes/node_work_ledger_reader_effect/test_reader_bus_session.py -q -p no:cacheprovider -k 'one_session_under_the_step_budget or one_process_per_page'
    cwd: .
- id: dod-omn24018-ac2
