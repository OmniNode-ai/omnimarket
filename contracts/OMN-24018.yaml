  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/nodes/node_work_ledger_reader_effect/test_reader_lines_only.py -q -p no:cacheprovider
    cwd: .
- id: dod-omn24018-ac3
  description: 'AC3: the seam tests run the real query node handler in process behind the session route and behind the point read port.'
