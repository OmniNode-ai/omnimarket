schema_version: 1.0.0
ticket_id: OMN-24367
title: Lab hosts announce themselves on the bus
summary: A compute node builds a lab host's announcement (identity, roles, capacity, graphics cards, models served, runtimes, installed software with versions and commits, lane accounts, availability) with a digest of the facts, and an effect node publishes it from the lab-work serve process on start, on a fact change, as a heartbeat and on stop; a host that cannot read its facts publishes a typed failure and no announcement.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24367-host-announce
  statement: Each lab host announces its facts and capacity on the development bus with a facts digest that moves with versions and commits and not with load, and says so when it cannot read its facts.
  acceptance:
  - id: AC1
    statement: 'AC1: the announcement carries identity, roles, capacity, graphics cards, models served, runtimes, installed software with versions and commits, lane accounts and availability, and its facts digest changes when a version or commit changes and not when load changes -- falsifier: pytest tests/nodes/node_host_introspection_compute -q, failing when the digest ignores the runtimes'
  - id: AC2
    statement: 'AC2: the capacity inside the announcement equals the old capacity advertisement for the same machine field for field, on the in-memory bus and on the real broker -- falsifier: pytest tests/nodes/node_host_introspection_announce_effect/test_seams_host_introspection_omn19998.py -q, failing when the capacity gains or loses a field'
  - id: AC3
    statement: 'AC3: a host whose facts cannot be read publishes a typed failure and no announcement, and a failed publish does not spend the start announcement -- falsifier: pytest tests/nodes/node_host_introspection_announce_effect/test_host_announcer_chain_omn19998.py -q, failing when the announcer forgets it has started'
  - id: AC4
    statement: 'AC4: integrated: after install on a lab host from the branch, the host''s announcement is read on the development bus with start, heartbeat and stop reasons in order, and matches its capacity advertisement read in the same minute -- falsifier: onex lab-work hosts and a read of the announced topic on the development lane for that host name'
evidence_requirements:
- kind: tests
  description: The compute node's tests and the announcer's chain and seam tests pass
  command: uv run --frozen pytest tests/nodes/node_host_introspection_compute tests/nodes/node_host_introspection_announce_effect -q --no-cov -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24367-digest
  description: Runs the compute node's tests. The announcement carries each kind of fact, the digest is the same for a quiet and a busy host and for a different reading order, and it differs for a changed version, commit, runtime, card, model, role, account or availability. The failing control that leaves the runtimes out of the digest turns the runtime case red.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_host_introspection_compute -q --no-cov -p no:randomly
    cwd: .
- id: dod-omn24367-capacity-seam
  description: Runs the seam test. One lab-work host beat on the in-memory bus publishes the capacity advertisement and the announcement, and the announcement's capacity equals the advertisement with the field set of the advertisement model. A failing announcement leaves the capacity beat running. The real-broker half of AC2 is read on the lab and recorded on the pull request.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_host_introspection_announce_effect/test_seams_host_introspection_omn19998.py -q --no-cov -p no:randomly
    cwd: .
- id: dod-omn24367-announcer-chain
  description: Runs the announcer chain tests. Start, heartbeat, facts_changed and stop come in that order, an unreadable host publishes a typed failure and no announcement, and a failed publish leaves the start unspent so the next beat announces start again. The failing control that marks the start spent before the publish turns the last case red.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_host_introspection_announce_effect/test_host_announcer_chain_omn19998.py -q --no-cov -p no:randomly
    cwd: .
- id: dod-omn24367-regression
  description: The lab-work host, advertiser and placement tests still pass with the announcer wired into the serve process. Binds no criterion; it is a regression check.
  source: manual
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/lab_work -q --no-cov -p no:randomly
    cwd: .
- id: dod-omn24367-order-and-agreement
  description: Runs the tests that stand behind AC4 on the in-memory bus. One serve beat publishes start, then heartbeat, facts_changed and stop come in that order, and the announcement's capacity equals the capacity advertisement of the same beat. This binds the mechanism of AC4 only; the read on an installed lab host cannot run on a hosted runner and is recorded on the pull request and the ticket.
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_host_introspection_announce_effect -q --no-cov -p no:randomly -k "start_heartbeat_facts_changed_stop_in_order or announced_capacity_equals"
    cwd: .
- id: dod-omn24367-integration-proof
  description: After the branch is installed on a lab host, its announcement is read on the development bus with start, heartbeat and stop reasons in order and matches its capacity advertisement read in the same minute. Hosted CI cannot read the lab hosts, so only the local Done gate runs this check; it needs the publish grant for the two new topics.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: onex lab-work hosts --json
    cwd: .
