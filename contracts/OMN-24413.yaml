schema_version: 1.0.0
ticket_id: OMN-24413
title: Deploy agent key check node answers the expected signing key fingerprint so a wrong key is refused before publish
summary: 'On 2026-11-14 a deploy command signed with a key that differs from the deploy agent''s was dropped by the agent with no job and no word to the sender. The deploy agent''s own files (auth.py, health.py) are baselined by the canonical file shape ratchet and may only shrink, so the agent''s expected key check value is served by a node instead: node_deploy_agent_key_check_effect reads the key from the environment variable the overlay names (filled from the secret store by the runtime) and answers a one-way check value (the first 16 hex characters of an HMAC of a fixed label under the key), never the key. A variable that is not set is a typed refusal. The signer reads this value (the signer change follows on omnimarket 6172). The deploy agent files are not changed.'
is_seam_ticket: true
interface_change: true
interfaces_touched:
- events
- topics
requirements:
- id: req-omn24413-key-check-node
  statement: A node answers the deploy agent's expected signing key check value from the secret store by reference and never returns the key, and the deploy agent's baselined files do not grow.
  acceptance:
  - id: AC1
    statement: 'AC1: a node answers the deploy agent''s expected signing key fingerprint from the secret store by reference and never returns the key -- falsifier: uv run --frozen python -m pytest tests/nodes/node_deploy_agent_key_check_effect -q'
  - id: AC2
    statement: 'AC2: when the signing key differs from the agent''s key the signer refuses at publish time with a typed error naming both fingerprints and publishes nothing -- falsifier: uv run --frozen python -m pytest tests/nodes/node_branch_deploy_command_effect -q -k key_check'
  - id: AC3
    statement: 'AC3: the file shape ratchet baseline files of the deploy agent (auth.py and health.py) do not grow -- falsifier: git diff origin/dev --stat on scripts/deploy-agent/deploy_agent/auth.py and health.py in omnibase_infra shows no change'
  - id: AC4
    statement: 'AC4: integrated: onex node run node_deploy_agent_key_check_effect on the dev bus returns a served fingerprint, read in the running dev runtime -- falsifier: the terminal event on the dev bus reads status refused or carries no fingerprint'
evidence_requirements:
- kind: tests
  description: The key check node's contract, golden chain, error chain and golden vector tests pass at the pushed head.
  command: uv run --frozen pytest tests/nodes/node_deploy_agent_key_check_effect -q -n 0 --no-cov -p no:cacheprovider
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
