schema_version: 1.0.0
ticket_id: OMN-23536
title: A missing settings file is reported as the missing file, not as every setting
summary: load_structured_overlay built its message for an absent overlay file from every field of the model, so a missing file read as thirteen unconfigured settings. The message now names the overlay file and the roots searched (and the file variable when one is given), and keeps the words "is not configured" that callers' hooks match.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23536-absent-file-message
  statement: When no overlay file is found, the refusal names the missing file and the roots searched, not the model's fields.
  acceptance:
  - id: AC1
    statement: 'AC1: load_structured_overlay''s message for an absent overlay file names the missing file and the roots searched and not the model''s fields, and still carries the file variable name when one is given -- falsifier: the loader test run against the merge base fails'
  - id: AC2
    statement: 'AC2: integrated: the landing-snapshot step run on the floor host with its overlay root unset prints a refusal that names the missing file and the roots searched -- falsifier: the step''s printed refusal line on the floor host'
evidence_requirements:
- kind: tests
  description: The loader tests at the pushed head. With node_overlay_reader.py restored to origin/dev, three of the structured-loader tests fail.
  command: python -m pytest tests/unit/handlers/test_node_overlay_reader_structured.py tests/nodes/node_delegation_receipt_verdict_compute/test_golden_chain_receipt_verdict.py -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23536-ac1-absent-file-message
  description: The loader tests pass at the pushed head; with node_overlay_reader.py at origin/dev three of them fail. The caller test that matches the words "not configured" still passes.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/handlers/test_node_overlay_reader_structured.py tests/nodes/node_delegation_receipt_verdict_compute/test_golden_chain_receipt_verdict.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn23536-ac2-step-refusal
  description: The snapshot step's main, run in process with no overlay root and with an empty one, refuses with a line that names the overlay file and the roots searched. With node_overlay_reader.py at origin/dev both tests fail (the line lists every model field). The same refusal printed on the floor host is read by the local Done gate item below.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_pr_landing_snapshot_effect/test_snapshot_absent_overlay.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn23536-floor-refusal
  description: The step's printed refusal on the floor host names the file and the roots. Hosted CI cannot reach the floor host, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: 'test -n "${LANDING_SNAPSHOT_REFUSAL_LINE:?set LANDING_SNAPSHOT_REFUSAL_LINE to the refusal line printed on the floor host}"'
    cwd: .
- id: dod-omn23536-integration-proof
  description: The pushed head ran the loader tests on a lab host through the lab work runner and exited 0. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: 'env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23536 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/handlers/test_node_overlay_reader_structured.py tests/nodes/node_delegation_receipt_verdict_compute/test_golden_chain_receipt_verdict.py -q --no-cov'
    cwd: .
