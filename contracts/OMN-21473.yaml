  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_binding_conformance_compute/test_check_bindings.py -q --no-cov -k 'adds_a_protocol_to_a_node or concrete_binding_list or ships_no_protocol_table or come_from_the_request'
