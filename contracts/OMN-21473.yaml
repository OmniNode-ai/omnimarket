schema_version: 1.0.0
ticket_id: OMN-21473
title: 'T-B1: dependencies declared in contracts and a check that nothing assumes our setup'
summary: 'New pure COMPUTE node node_binding_conformance_compute (operation check_bindings) with its contract, metadata,
  handler, models and tests. The caller supplies node contracts, handler and model sources, the protocol table, the concrete
  bindings, the modules a pure node may not import and the deployment''s private names as data; the check fails a contract
  that declares a different protocol set than its row, a handler that constructs a concrete binding, reads an environment
  variable or holds a path, URL or private name, and a pure handler or model that imports the overlay reader or the contract
  loader. The checked set is a data list in the test data.'
is_seam_ticket: false
interface_change: true
interfaces_touched:
- public_api
requirements:
- id: req-omn21473-binding-conformance
  statement: A node's contract declares exactly its row of protocols and its shipped files assume no deployment's setup, checked by a pure node.
  acceptance:
  - id: AC1
    statement: 'AC1: A fixture effect that constructs a concrete bus adapter fails naming the line -- falsifier: the pytest case'
  - id: AC2
    statement: 'AC2: A fixture contract missing a protocol its 0d.3 row requires fails naming the protocol -- falsifier: the pytest case'
  - id: AC3
    statement: 'AC3: A fixture handler containing an invented repository name, an invented host name or an `os.environ` read fails -- falsifier: three pytest cases'
  - id: AC4
    statement: 'AC4: A pure handler or model that imports the overlay reader or the contract loader fails, and a pure handler''s execution under a guard that raises on any filesystem or environment read still passes with injected configuration -- falsifier: the pytest cases, and a fixture handler that loads its own overlay, which fails'
  - id: AC5
    statement: 'AC5: Every node row of 0d.3 whose node exists when the PR lands passes against its real contract, and the checked set is a data list that each later task extends in its own PR and must pass -- falsifier: the pytest case over the repository''s contracts, which fails for a listed node that declares a different set'
  - id: AC6
    statement: 'AC6: Configuration: the protocol table is data supplied by the caller (it is the 0d.3 table), and the private names come from the caller''s overlays; none is a literal in the node -- falsifier: a fixture table that adds a protocol to a node makes the same contract fail'
  - id: AC7
    statement: 'AC7: Bindings: the node depends on no protocol -- falsifier: identical issues in process and through the local in-process entry of the parity harness (T-B2)'
evidence_requirements:
- kind: tests
  description: Binding conformance node tests.
  command: uv run pytest tests/nodes/node_binding_conformance_compute/test_check_bindings.py -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
