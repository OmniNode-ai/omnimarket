  source: manual
  binds_ac:
  - AC7
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_binding_conformance_compute/test_check_bindings.py -q --no-cov -k 'declares_no_protocol or registered_and_routes or byte_identical'
    cwd: .
- id: dod-omn21473-deploy-check-bindings
  description: 'Hosted package deploy smoke: dispatch the node through the installed ONEX CLI with an in-memory bus. Read the typed receipts for a conforming request and for a request with a missing protocol, an invented host name and an environment read, and assert the verdicts and the named lines. No credentials, broker or lab service is required. This checks the evaluated checkout package, not a production rollout.'
  source: manual
  checks:
  - check_type: command
    check_value: |
      set -eu;
      export PYTHONDONTWRITEBYTECODE=1;
      probe_dir="$(mktemp -d)";
      trap 'rm -rf "$probe_dir"' EXIT;
      uv sync --locked;
      runtime_bin="$(uv run --locked python -c 'import sys; from pathlib import Path; print(Path(sys.executable).parent)')";
      "$runtime_bin/python" -c '
      import json
      import sys
      from pathlib import Path
      root = Path(sys.argv[1])
      table = {"protocols": [{"code": "BUS", "protocol": "fixture.protocols:ProtocolBus"}], "rows": [{"node": "node_fixture_pure", "protocols": []}]}
      contract = {"node": "node_fixture_pure", "path": "contract.yaml", "kind": "contract", "text": "name: node_fixture_pure\n"}
      ok_handler = {"node": "node_fixture_pure", "path": "handlers/handler.py", "kind": "handler", "text": "class H:\n    pass\n"}
      bad_handler = {"node": "node_fixture_pure", "path": "handlers/handler.py", "kind": "handler", "text": "import os\nHOST = \"box-17.fixture.invalid\"\nV = os.environ[\"X\"]\n"}
      ok = {"checked_nodes": ["node_fixture_pure"], "protocol_table": table, "sources": [contract, ok_handler]}
      bad_table = {"protocols": table["protocols"], "rows": [{"node": "node_fixture_pure", "protocols": ["BUS"]}]}
      bad = {"checked_nodes": ["node_fixture_pure"], "protocol_table": bad_table, "private_names": [{"kind": "host", "value": "box-17.fixture.invalid"}], "sources": [contract, bad_handler]}
      (root / "ok.json").write_text(json.dumps(ok))
      (root / "bad.json").write_text(json.dumps(bad))
      ' "$probe_dir";
      for case in ok bad; do
        env -u PYTHONPATH ONEX_LANE=omn21473-deploy-probe "$runtime_bin/onex" node node_binding_conformance_compute --input "$probe_dir/$case.json" --state-root "$probe_dir/$case.state" --backend event_bus=inmemory --timeout 30 --output receipt --omnibase-path "$PWD" > "$probe_dir/$case.receipt.json";
      done;
      "$runtime_bin/python" -c '
      import json
      import sys
      from pathlib import Path
      root = Path(sys.argv[1])
      receipts = {case: json.loads((root / f"{case}.receipt.json").read_text()) for case in ("ok", "bad")}
      for case, receipt in receipts.items():
          assert receipt["status"] == "success" and receipt["exit_code"] == 0, receipt
      ok = receipts["ok"]["result"]
      assert ok["conforming"] is True and ok["issues"] == [], ok
      bad = receipts["bad"]["result"]
      assert bad["conforming"] is False, bad
      found = sorted((issue["rule"], issue["line"]) for issue in bad["issues"])
      assert found == [("contract_missing_protocol", 0), ("env_read", 3), ("private_name", 2)], found
      assert "box-17.fixture.invalid" not in json.dumps(bad), bad
      print("packaged binding conformance check: 2 receipts verified")
      ' "$probe_dir"
    cwd: .
