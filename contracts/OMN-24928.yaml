schema_version: 1.0.0
ticket_id: OMN-24928
title: 'Lab alarms reach a person: fix the alert delivery path'
summary: The lab alarm delivery handler marked a subject active before its post, so a failed post was never retried and every later tick suppressed it. It now marks a subject active only after a delivered post; an already-active subject stays suppressed.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24928-delivery
  statement: A lab alarm whose post failed is posted again on the next tick, and a delivered one is suppressed after.
  acceptance:
  - id: AC1
    statement: 'AC1: the measured cause of the 34 failed deliveries is written with the failed delivery record and its error text, and the bot token resolves through its declared secret path without the value being printed or stored by hand -- falsifier: `onex scm pr-view` on the fix PR shows no cause line, or a grep of the PR diff for the token value finds a match'
  - id: AC2
    statement: 'AC2: the measured cause of the 176 suppressed alarms is written, naming the dedupe or rate rule, and the rule is fixed or shown correct with a test that fails on the old behavior -- falsifier: `uv run pytest tests/ -q -k "lab_alarm and suppress"` in omnimarket exits 0 at the parent of the fix commit'
  - id: AC3
    statement: 'AC3: one real test alarm from a lab alarm reaches the declared alerts channel and its delivery record reads delivered -- falsifier: the delivery record for that alarm reads failed or suppressed, or the alerts channel holds no message for it'
  - id: AC4
    statement: 'AC4: the next real alarm after the fix is read delivered on the delivery record, and the overlays integration line for node_lab_alarm reads running -- falsifier: the next integration pass after the fix reads node_lab_alarm NOT RUNNING or counts a new channel=failed delivery'
evidence_requirements:
- kind: tests
  description: The lab alarm delivery tests.
  command: env -u PYTHONPATH uv run --frozen pytest tests/nodes/node_lab_alarm_deliver_effect -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24928-ac1-credentials
  description: A refused channel is a typed failure naming why and is retried on the next tick; this test fails at the merge base.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_lab_alarm_deliver_effect/test_lab_alarm_delivery.py -k test_a_refused_channel_is_a_typed_failure_and_is_retried_on_the_next_tick -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24928-ac2-active-after-delivered
  description: A failed post leaves the subject not active and is posted again on the next tick; a delivered post marks it active and the next tick suppresses it; an already-active subject stays suppressed.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_lab_alarm_deliver_effect/test_lab_alarm_delivery.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24928-ac3-delivered-path
  description: The handler reads delivered for a new alarm after a refused first post, over the in-memory channel.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_lab_alarm_deliver_effect/test_owner_route.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24928-ac4-owner-and-retry
  description: The retry path posts the alarm again, then the owner push once, and appends no second row.
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_lab_alarm_deliver_effect/test_owner_route.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24928-integration-proof
  description: Hosted CI cannot reach a lab host, so only the local Done gate runs this unbound check. It runs the lab alarm delivery tests at the sha on a lab host through the lab work runner.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24928 --kind test -- uv run --frozen pytest tests/nodes/node_lab_alarm_deliver_effect -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24928-live-delivery-record
  description: Hosted CI cannot read a lab delivery record or the alerts channel, so only the local Done gate runs this unbound check. It reads the lab ledger for a lab alarm delivery row.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: grep -c "DELIVERY channel=delivered" "$ONEX_LEDGER_PATH"
    cwd: .
