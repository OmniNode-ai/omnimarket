schema_version: 1.0.0
ticket_id: OMN-23257
title: The claude_hook_events, session_content and beacon_trace writers hold one asyncpg pool each
summary: The claude_hook_events and session_content writers opened and closed an asyncpg pool on a fresh event loop for every message, and the beacon trace readback opened one for every poll. Each now keeps one pool for its life. The two projection writers run every message on one dedicated loop thread (WriterPoolHost), each message holding one connection, at most the contract's writer_pool max_size at once; the readback opens its pool on the first read and reuses it across polls. Pool sizes and the acquire and command timeouts come from each node contract's writer_pool section, the DSN stays the one the runtime binds. A closed pool raises WriterPoolClosedError and an exhausted one WriterPoolExhaustedError; neither opens a second pool.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23257-one-pool-per-writer
  statement: Each of the three writers holds one asyncpg pool opened once and reused for every message, and a closed or exhausted pool fails with a typed error without reconnecting.
  acceptance:
  - id: AC1
    statement: 'AC1: each of the three writers opens one asyncpg pool at start and reuses it for every message -- falsifier: uv run pytest tests/ -k writer_pool -q (a test that counts connects for 100 messages fails on the per-message code and passes with the pool)'
  - id: AC2
    statement: 'AC2: a writer whose pool is closed or exhausted raises a typed failure and does not reopen a connection per message -- falsifier: uv run pytest tests/ -k writer_pool_failure -q'
evidence_requirements:
- kind: tests
  description: The connect count over 100 messages for each writer (100 on the base, 1 now), the four-in-flight run on one pool, the contract-sized pool, and the closed and exhausted failures, with the existing writer tests updated for a pool that outlives the message.
  command: uv run --frozen pytest tests/test_omn23257_writer_pool.py -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23257-ac1-connect-count
  description: Runs the real writers and the real AsyncpgAdapter over a fake asyncpg create_pool and counts the pools opened for 100 messages of the claude_hook_events writer, 100 of the session_content writer and 100 readback polls of the beacon trace readback, plus four messages in flight at once on one pool and the sizes read from each node contract. The named break is the base code, which opens 100 pools in each.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/test_omn23257_writer_pool.py -k "writer_pool and not writer_pool_failure" -q --no-cov
    cwd: .
- id: dod-omn23257-ac2-typed-failure
  description: A writer whose pool was closed raises WriterPoolClosedError for every later message and opens no pool, and a writer whose max_size connections are all held raises WriterPoolExhaustedError after its acquire timeout and opens no second pool; the same for the readback after close.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/test_omn23257_writer_pool.py -k writer_pool_failure -q --no-cov
    cwd: .
- id: dod-omn23257-existing-writer-tests
  description: The existing hook events, session content and beacon trace tests pass, with the two tests that pinned one adapter per message rewritten to pin the one kept pool.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/test_omn19513_claude_hook_events_projection.py tests/test_golden_chain_projection_claude_hook_events.py tests/unit/nodes/node_projection_session_content tests/unit/nodes/test_golden_chain_session_content_omn19550.py tests/unit/nodes/node_beacon_trace_capture_effect tests/test_node_timeouts_contract.py -q --no-cov
    cwd: .
- id: dod-omn23257-integration-proof
  description: Run this pull request's own check on a lab host at the pushed head. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
