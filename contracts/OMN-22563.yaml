schema_version: 1.0.0
ticket_id: OMN-22563
title: The friction rollup names the class of FRICTION rows written with no class cell
summary: The rollup takes caller-supplied class rules (name, owner, pattern) for rows with no class cell and puts the rule's owner on the class, so the 63 rows the floor listed as a stoppage with no class get named classes and owners.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn22563-class-rules
  statement: A FRICTION row with no class cell is named by the first caller-supplied rule that matches its lane and text, and its class carries the rule's owner.
  acceptance:
  - id: AC1
    statement: 'AC1: a regression test built from the recorded unclassified rows files the machine-written rows under their named classes with an owner and fails on origin/dev where all of them are unclassified -- falsifier: uv run --frozen pytest tests/nodes/node_friction_rollup_compute/test_class_rules.py -q --no-cov'
  - id: AC2
    statement: 'AC2: a row with a class cell keeps its own class whatever the rules say, and a row no rule matches stays unclassified -- falsifier: uv run --frozen pytest tests/nodes/node_friction_rollup_compute/test_class_rules.py -q --no-cov -k "keeps or stays"'
  - id: AC3
    statement: 'AC3: a rule with an empty owner or a pattern that does not compile is refused -- falsifier: uv run --frozen pytest tests/nodes/node_friction_rollup_compute/test_class_rules.py -q --no-cov -k refused'
  - id: AC4
    statement: 'AC4: the recorded tick-liveness class gets its owner from a (class, owner) pair and has none without it -- falsifier: uv run --frozen pytest tests/nodes/node_friction_rollup_compute/test_class_rules.py -q --no-cov -k writer_names'
evidence_requirements:
- kind: tests
  description: The tests named by OMN-22563 AC1 to AC3
  command: uv run --frozen pytest tests/nodes/node_friction_rollup_compute -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
