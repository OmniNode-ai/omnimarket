schema_version: 1.0.0
ticket_id: OMN-23927
title: The hook-events lookup service is added to the platform's startup list
summary: node_hook_events_by_correlation_read_effect gains its line in the pyproject onex.nodes table, its false expected-missing entry is removed, and a new test refuses any contract that declares an http_mount whose node has no such line.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23927-registered
  statement: A node whose contract declares an http_mount is listed in the onex.nodes table, because the runtime discovers a contract, and so mounts its route, only through that table.
  acceptance:
  - id: AC1
    statement: "AC1: the hook-events by-correlation read node is listed in the onex.nodes table and no longer in the expected-missing set -- falsifier: uv run pytest tests/test_market_node_runtime_dogfood.py -q -p no:randomly --no-cov -k \"inventory\" fails when the pyproject line is removed"
  - id: AC2
    statement: "AC2: a contract that declares an http_mount whose node has no onex.nodes line fails a test -- falsifier: uv run pytest tests/test_market_node_runtime_dogfood.py -q -p no:randomly --no-cov -k http_mounted fails at origin/dev and passes at the branch head"
  - id: AC3
    statement: "AC3: integrated: on the dev runtime rebuilt from the merged change, the node is registered and its HTTP route is mounted -- falsifier: a read of the running dev runtime's node registrations (read only) lacks node_hook_events_by_correlation_read_effect, or GET /v1/projections/hook-events/by-correlation is not mounted"
evidence_requirements:
- kind: tests
  description: The dogfood inventory and registration tests pass at the pushed head.
  command: uv run pytest tests/test_market_node_runtime_dogfood.py -q -p no:randomly --no-cov -k "registered or inventory"
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23927-ac1
  description: 'AC1: the inventory test passes with the node listed and the expected-missing entry removed; with the pyproject line removed it reports the node directory has no onex.nodes entry point.'
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/test_market_node_runtime_dogfood.py -q -p no:randomly --no-cov -k "inventory"
    cwd: .
- id: dod-omn23927-ac2
  description: 'AC2: the http_mount registration test passes at the head and fails at the merge base, where the hook-events node has an http_mount and no onex.nodes line.'
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/test_market_node_runtime_dogfood.py -q -p no:randomly --no-cov -k http_mounted
    cwd: .
- id: dod-omn23927-ac3
  description: 'hosted proxy for AC3: the registration tests that stand in for the runtime discovering the contract pass here; the reading of the rebuilt dev runtime is posted as a pull request comment naming the head.'
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/test_market_node_runtime_dogfood.py -q -p no:randomly --no-cov -k "http_mounted or declared_subscribing"
    cwd: .
- id: dod-omn23927-integration-proof
  description: the registration tests run on a lab host at the pushed head, including the http_mount test that fails at the merge base; hosted CI cannot reach the lab, so only the local Done gate runs this unbound check
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23927 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/test_market_node_runtime_dogfood.py -q --no-cov -p no:randomly -k http_mounted
