    check_value: uv run --frozen pytest tests/unit/lab_work/test_lab_host_table_registry_root_candidates.py -q --no-cov
- id: dod-omn23074-registry-root-candidates-ac2
  description: A bus placement against the overlay-store host table places a command and the receipt names the bus route.
  source: manual
