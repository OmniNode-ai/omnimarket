schema_version: "1.0.0"
ticket_id: OMN-23042
title: Step 0 row 3, gate store contract suite and in-memory twin (node_gate_store_effect)
summary: >-
  Adds node_gate_store_effect, the one store behind admission, stops and the holder of rebuild plan section 7.5, with its in-memory twin, a frozen contract suite of 8 checks, 6 named injected breaks that each fail the suite, golden and error chain event tests with 3 named chain breaks, and the gate_store overlay setting set. The Postgres backend is not built: an overlay naming it is refused with a typed error. Nothing calls the node from a start path until the admission effect (step 0 row 4) is built; that, the Postgres backend, the order writer node and the overlay values are separate tickets.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn23042-gate-store-contract
    statement: >-
      The gate store answers every request in one transaction and passes a frozen contract suite on its in-memory twin, and the suite fails for each named break.
    acceptance:
      - id: AC1
        statement: "AC1: the gate store contract suite passes on the in-memory twin and fails for each of the 6 named breaks -- falsifier: uv run pytest tests/nodes/node_gate_store_effect in omnimarket"
      - id: AC2
        statement: "AC2: the golden and error chain event tests for the gate store pass and the three named chain breaks fail them -- falsifier: uv run pytest of the node_gate_store_effect chain tests"
      - id: AC3
        statement: "AC3: the gate_store overlay declares every setting the node reads and no value is hard-coded in the node -- falsifier: the contract validation workflow over the node's contract and overlay"
evidence_requirements:
  - kind: tests
    description: >-
      The whole node_gate_store_effect test directory: the contract suite on the twin, the six named breaks, the chain event tests and the overlay tests.
    command: uv run --frozen pytest tests/nodes/node_gate_store_effect -q -n 0 --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn23042-ac1-contract-suite-and-breaks
    description: >-
      The in-memory twin passes each of the 8 checks of the frozen contract suite, the suite file matches its recorded sha256, and each of the 6 named injected breaks (non-atomic store, unfenced store, partial commit, free on release, no step-key memo, unstopped store) fails the suite. Before this change the node does not exist on omnimarket dev, so the directory does not collect.
    source: manual
    binds_ac:
      - AC1
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/nodes/node_gate_store_effect/test_in_memory_store.py -q -n 0 --no-cov
        cwd: ${OMNI_HOME}/omnimarket
  - id: dod-omn23042-ac2-chain-events
    description: >-
      The golden chain (reserve, consume, release) and the three error chains (a typed refusal answered, a bad payload as a failure event, a store fault as a failure event leaving no trace) pass, and each of the three named chain breaks turns the golden chain red.
    source: manual
    binds_ac:
      - AC2
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/nodes/node_gate_store_effect/test_gate_store_chain_events.py -q -n 0 --no-cov
        cwd: ${OMNI_HOME}/omnimarket
  - id: dod-omn23042-ac3-overlay-settings
    description: >-
      The overlay loads every setting (backend, per-piece limits, reservation lifetime, order), refuses a bad value and a missing key, and an overlay naming the unbuilt Postgres backend is refused with a typed error rather than answered by the twin. The node's contract declares the gate_store overlay and the topics by role; no topic or limit is a literal in the handler.
    source: manual
    binds_ac:
      - AC3
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/nodes/node_gate_store_effect/test_overlay_and_backend.py -q -n 0 --no-cov
        cwd: ${OMNI_HOME}/omnimarket
  - id: dod-deploy-omn23042-node-dispatch
    description: >-
      The node's contract loads and its handler answers a reserve request through the golden chain on the in-memory bus profile, which hosted CI can run; the Postgres profile is a separate ticket.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/nodes/node_gate_store_effect/test_gate_store_chain_events.py -q -n 0 --no-cov -k golden_chain_reserve_consume_release
        cwd: ${OMNI_HOME}/omnimarket
    binds_ac: []
