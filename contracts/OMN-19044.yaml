schema_version: 1.0.0
ticket_id: OMN-19044
title: "Broker authentication refusals are a reading: a client that cannot authenticate against the SASL listener surfaces on the ledger"
summary: A client that dials the dev broker's SASL listener without authenticating (kafka_authentication_exception, Unexpected auth request 3 expected handshake) showed only in the broker's own container log. node_broker_auth_refusal_reading_effect reads that log over a window (host, container, window, needle and bar are overlay values), counts the refusals per UTC minute and appends one reading row (WORKING at or under the bar, NOT_WORKING over it with the count, first and last time and the first line, UNKNOWN when the log cannot be read). An in-memory log is the default and an ssh backend reads the real broker. A named injected break (a reader blind to refusals the broker logged) is the failing control. It reads and appends rows only; it never changes the broker.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn19044-refusal-reading
  statement: The broker's authentication refusals are read over a window and appended as a reading row that goes NOT_WORKING when a client is refused and UNKNOWN when the log cannot be read.
  acceptance:
  - id: AC1
    statement: "AC1: the reading counts the broker's authentication refusals and reads NOT_WORKING over the bar, with a golden and an error chain event and a named injected break that makes it read a false WORKING -- falsifier: uv run pytest tests/nodes/node_broker_auth_refusal_reading_effect -q"
evidence_requirements:
- kind: tests
  description: The acceptance tests of this ticket at the pushed head.
  command: uv run --frozen pytest tests/nodes/node_broker_auth_refusal_reading_effect -q --no-cov -n 0 -p no:randomly
