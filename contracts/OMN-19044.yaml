schema_version: 1.0.0
ticket_id: OMN-19044
title: "Broker authentication refusals are a reading: a client that cannot authenticate against the SASL listener surfaces on the ledger"
summary: "A client that dials the dev broker's SASL listener without authenticating (kafka_authentication_exception, Unexpected auth request 3 expected handshake) showed only in the broker's own container log. node_broker_auth_refusal_reading_effect reads that log over a window (host, container, window, needle and bar are overlay values), counts the refusals per UTC minute and appends one reading row (WORKING at or under the bar, NOT_WORKING over it with the count, first and last time and the first line, UNKNOWN when the log cannot be read). An in-memory log is the default and an ssh backend reads the real broker. The dev deploy's own unauthenticated negative control (OMN-18012, rpk topic list with no credentials, run by a one-shot container on every dev-lane compose up) is told apart from every other client by its marker: its source container and the span of its run. Controls are counted apart in the row, and only the refusals that are not the control are judged against the bar. Named injected breaks (a reader blind to refusals the broker logged; a control marker lost or skewed, so the 2026-11-09T15:32:43Z control refusal reads as another client) are the failing controls. It reads and appends rows only; it never changes the broker, and the control stays."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn19044-refusal-reading
  statement: The broker's authentication refusals are read over a window and appended as a reading row that goes NOT_WORKING when a client is refused and UNKNOWN when the log cannot be read.
  acceptance:
  - id: AC1
    statement: "AC1: the reading counts the broker's authentication refusals and reads NOT_WORKING over the bar, with a golden and an error chain event and a named injected break that makes it read a false WORKING -- falsifier: uv run pytest tests/nodes/node_broker_auth_refusal_reading_effect -q"
  - id: AC2
    statement: "AC2: the deploy's negative control refusal (the 2026-11-09T15:32:43Z line inside its container's run) is counted as a control and does not alarm, the same line with its marker lost or skewed reads NOT_WORKING, a second refusal inside the control's span and one past the per-run count are another client, and the row names the control and other counts -- falsifier: uv run pytest tests/nodes/node_broker_auth_refusal_reading_effect -q -k control"
evidence_requirements:
- kind: tests
  description: The acceptance tests of this ticket at the pushed head.
  command: uv run --frozen pytest tests/nodes/node_broker_auth_refusal_reading_effect -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
- id: dod-omn19044-refusal-reading
  description: The node's tests pass at the head, golden and error through the bus chain, and the blind-reader break reads a false WORKING where the same log reads NOT_WORKING.
  source: manual
  binds_ac:
  - AC1
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_broker_auth_refusal_reading_effect -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn19044-control-classified
  description: The control marker the reader classifies by is real on the dev broker host. The one-shot control container exists there and exited 0, which it does only when its unauthenticated rpk topic list was refused. Hosted CI cannot reach the broker host, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  binds_ac:
  - AC2
  checks:
  - check_type: command
    check_value: 'ssh -o BatchMode=yes -o ConnectTimeout=10 "${ONEX_RUNTIME_SSH_HOST:?set ONEX_RUNTIME_SSH_HOST to the broker host}" "docker inspect --format {{.State.ExitCode}} omnibase-infra-redpanda-sasl-enable" | grep -qx 0'
    cwd: .
- id: dod-omn19044-integration-proof
  description: The pushed head ran the node's tests on a lab host through the lab work runner and exited 0. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: 'uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-19044 -- uv run --frozen pytest tests/nodes/node_broker_auth_refusal_reading_effect -q --no-cov -n 0 -p no:randomly'
    cwd: .
