schema_version: 1.0.0
ticket_id: OMN-26104
title: The code graph lookup answers from Memgraph over Bolt on h201 instead of the file-backed store, with the file store kept only as the typed fallback
summary: The nightly code graph build writes each repository's version (a node per module and per symbol, an edge per import and per definition, one revision label per build) into Memgraph through a Memgraph-backed version store with MERGE-only writes, and the lookup queries Memgraph by Cypher when the Bolt address resolves, falling back to the file store only when Memgraph is unreachable, with an enum reason on the answer.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn26104-memgraph-writer
  statement: The nightly node_code_graph_effect build writes its import graph into Memgraph through a version store beside the file store.
  acceptance:
  - id: AC2
    statement: "AC2: the nightly node_code_graph_effect build writes its import graph into Memgraph (a node per module and symbol, an edge per import and per definition, one revision label per build) through node_architecture_graph_populate_effect or a declared writer, installed from the branch -- falsifier: a Cypher count of nodes and edges for the revision label is zero before the build and nonzero after it, and uv run pytest on the writer's test fails before the change and passes after"
- id: req-omn26104-memgraph-lookup
  statement: The lookup answers from Memgraph by Cypher and names a typed reason when it falls back to the file store.
  acceptance:
  - id: AC3
    statement: "AC3: node_code_graph_effect lookup queries Memgraph by Cypher when the Bolt overlay resolves and falls back to the file store only when Memgraph is unreachable, naming a typed reason in the answer -- falsifier: uv run pytest on the lookup tests fails red on today's main for the Memgraph path and the typed-reason fallback and passes green on the branch"
evidence_requirements:
- kind: tests
  description: The Memgraph version store, the Memgraph-first lookup and the nightly writer, over a fake Bolt session with no network, plus the runtime fallback reasons.
  command: env -u PYTHONPATH uv run --frozen pytest tests/nodes/node_code_graph_effect/test_code_graph_memgraph.py tests/nodes/node_code_graph_effect/test_code_graph_lookup_runtime.py -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn26104-ac2-writer-tests
  description: The nightly run writes one complete revision per repository through the version store, a second run of the same commits writes nothing, a revision whose write died is not read and is rewritten, the retention prunes the oldest revision with its nodes, and an unreachable Memgraph never fails the reading. The tests fail on the code before the change (the store does not exist) and pass after it.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_code_graph_effect/test_code_graph_memgraph.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn26104-ac3-lookup-tests
  description: The lookup answers importers, definition, reach, same-shape and exemplar from Memgraph with the same matches the file store gives, and falls back to the file store with BOLT_URI_UNRESOLVED, CONNECTION_REFUSED, READ_TIMED_OUT or UNREACHABLE only when Memgraph is unreachable; a statement Memgraph refuses is a failed answer and never a fallback. The tests fail on the code before the change and pass after it.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_code_graph_effect/test_code_graph_memgraph.py tests/nodes/node_code_graph_effect/test_code_graph_lookup_runtime.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn26104-ac3-integration-proof
  description: Hosted CI holds no Memgraph, so only the local Done gate runs this check, so it binds no criterion here; the lookup tests above bind AC3. On a lab host that resolves the Bolt address of the dev Memgraph, it asks the importers of the lookup models file and fails on a LOOKUP line that was not answered from Memgraph.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-26104 --kind test -- sh -c 'uv run --frozen python -m omnimarket.nodes.node_code_graph_effect lookup --question importers --repo omnimarket --path src/omnimarket/models/model_code_graph_lookup.py | grep -qE "^LOOKUP .*status=found .*served_from=memgraph "'
    cwd: .
