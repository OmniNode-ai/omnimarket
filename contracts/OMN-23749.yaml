schema_version: 1.0.0
ticket_id: OMN-23749
title: The coding-trial result store keeps size, limits and timings per attempt
summary: The context-ROI result row and table gain the per-attempt columns of a code-eval trial (verdict, unscorable source, row kind, try end, suite digest, size band, sequence id, try ordinal, diff hash, max turns, try timeout, time split), all with defaults so older rows still read. The harness observation carries a required size band that the capability verdict row reads in place of the literal S, and the class line leaves the model defaults for the overlay key delegation.capability_map.line. The migration is mirrored in omnibase_infra and merges first. No second result store is built.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23749-store
  statement: A code-eval try is kept as one row of the existing context-ROI store, with its size band and limits, and the capability cells follow the size band of each observation and the line read from the overlay.
  acceptance:
  - id: AC1
    statement: 'AC1: a result line written before the new columns still reads, and the new columns carry their defaults -- falsifier: uv run pytest tests/nodes/node_projection_context_roi/test_row_backcompat.py -q'
  - id: AC2
    statement: 'AC2: the chain of a trial run into the result store and the refusal of a malformed run to the dead-letter topic both hold -- falsifier: uv run pytest tests/nodes/node_projection_context_roi/test_chains_code_edit_rows.py -q'
  - id: AC3
    statement: 'AC3: the pass-rate cells follow the size and attempt limit of each trial and the pass line read from the setting -- falsifier: uv run pytest tests/nodes/node_delegation_capability_map_compute/test_cells_from_code_eval_run.py -q'
  - id: AC4
    statement: 'AC4: integrated: from this branch the migrated development result table serves its existing lines with the new columns at their defaults -- falsifier: the table row count and one existing line new columns, read on the development lane before and after the migration and recorded on the parent ticket'
  - id: AC5
    statement: 'AC5: with the pass-line setting absent nothing refuses: the read answers not-configured, a map run keeps its rows and builds, the fold makes no cell, and the seam to the projection holds over the bus -- falsifier: uv run pytest tests/nodes/node_delegation_capability_map_compute/test_line_not_configured_safe_alone.py tests/nodes/node_delegation_capability_map_compute/test_seam_capability_line_bus.py -q'
