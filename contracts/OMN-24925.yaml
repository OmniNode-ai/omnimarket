schema_version: 1.0.0
ticket_id: OMN-24925
title: 'Review findings 1 to 11 on omnimarket PR 6326 at head bade8964793e are fixed or argued: the finding list and AC1 of OMN-24902 match Linear, the guard test asserts the exact failure list, and the fails-on-base checks pin the base and the nine failing ids'
summary: 'Answers the eleven findings of the review of omnimarket#6326 at head bade8964793e: the exp.terminal != terminal comparison, the exact failure lists of the guard tests, the consumer scan, the xfail tracking test, the pinned fails-on-base checks that require the nine failing ids, distinct-job and body-line checks, and the merge-base diff checks. The lab runs, the required contexts and the arguments for findings left to the pull request are read from the pull request comment, not from hosted CI.'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24925-review-findings-6326
  statement: The review findings on the nightly runner change at head bade8964793e are fixed or argued with evidence, with a test red then green for each.
  acceptance:
  - id: AC1
    statement: 'AC1: a PR comment starting `Lab: head=<full new head sha>` names the sha, the command and exit 0, the live head is confirmed against bade8964793e before the push, and every required check-run of omnimarket#6326 reads success at the new head -- falsifier: `onex scm pr-checks OmniNode-ai/omnimarket#6326` lists a required context that is not success at the new head, or no PR comment matches `Lab: head=` with the full sha, the command and exit 0'
  - id: AC2
    statement: 'AC2: findings 1 and 2 are answered: contracts/OMN-24902.yaml lines 3 and 4 are corrected against Linear (the ledger comment 6922291635 holds ten findings, the reviewed head is da6946c35ce0, the nightly is not claimed to pass because of this change), and AC2 of OMN-24831 is either met by fixing terminalisation in its owning repository or unbound from its pass-at-head test with the PR landing under a ticket that does not close OMN-24831 -- falsifier: `uv run pytest tests/delegation_golden/test_runner_unterminalised_row_omn24831.py -q -p no:cacheprovider` passes while `grep -n ''carried no finding list'' contracts/OMN-24902.yaml` still matches'
  - id: AC3
    statement: 'AC3: finding 3 is answered: a case declaring terminal unknown on a NULL row is checked against the corpus, the runner compares `exp.terminal != terminal` with a test, and a test shows the I2 and I4 xfail tracking is not keyed on the failure text -- falsifier: `uv run pytest tests/delegation_golden/test_runner_unterminalised_row_omn24831.py -q -p no:cacheprovider` passes with the `exp.terminal != terminal` comparison removed'
  - id: AC4
    statement: 'AC4: finding 4 is answered: the guard test asserts U1''s exact failure list, not only an absence -- falsifier: `uv run pytest tests/delegation_golden/test_runner_unterminalised_row_omn24831.py -q -p no:cacheprovider` passes with U1 returning before the unterminalised-row line of the runner'
  - id: AC5
    statement: 'AC5: finding 5 is answered: the consumer test covers the delegation-health-check workflow and the OMN-18349 path with the needles `terminal: expected` and `tokens: expected positive`, and the dead line is gone -- falsifier: `uv run pytest tests/delegation_golden -m "not e2e" -q -p no:cacheprovider` passes with a consumer string match on the old failure line left in place'
  - id: AC6
    statement: 'AC6: findings 6, 7 and 8 are answered: test ids for the red run at the pinned base 6efbe3ee5027 (the nine failing ids) and the green run at the new head are attached, the required contexts are read, part A''s command is named and its exit is shown, the fails-on-base checks in contracts OMN-24902, OMN-24831 and OMN-24851 pin 6efbe3ee5027 and require the nine failing ids instead of a bare negated pytest, and the OMN-24902 AC1 check fails while findings 3 to 5 are open -- falsifier: `grep -n ''origin/dev'' contracts/OMN-24902.yaml contracts/OMN-24831.yaml contracts/OMN-24851.yaml` matches in a fails-on-base check, or `uv run pytest tests/delegation_golden/test_runner_unterminalised_row_omn24831.py -q -p no:cacheprovider` exits 0 at the pinned base'
  - id: AC7
    statement: 'AC7: findings 9 and 10 are answered: the STATUS row and the PR body are shown, the OMN-24831 AC1 check counts three distinct job ids with a quoted cause line each, its AC4 check requires a PR body line starting `Lab:`, and the OMN-24851 check reads a PR comment with `grep -c ''Lab: head=''` instead of discarding the output of pr-checks -- falsifier: `grep -n ''pr-checks >/dev/null'' contracts/OMN-24851.yaml` still matches, or `uv run pytest tests/delegation_golden -m "not e2e" -q -p no:cacheprovider` exits non-zero at the new head'
  - id: AC8
    statement: 'AC8: the non-blocking finding 11 is fixed or argued in a PR comment (the contract diffs read the merge base and match `marks=pytest.mark.xfail`, OMN-24902 states its AC2 and AC3, the test comment for I10 states the real line count) -- falsifier: `uv run pytest tests/delegation_golden/test_runner_unterminalised_row_omn24831.py -q -p no:cacheprovider` passes while the test comment still says two or three lines for I10'
evidence_requirements:
- kind: tests
  description: The runner tests of the change and the golden layer tests beside them.
  command: env -u PYTHONPATH uv run --frozen pytest tests/delegation_golden -q --no-cov -n 0 -p no:randomly -m "not e2e"
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24925-ac1-lab-comment-and-checks
  description: 'AC1 reading: the pull request carries a comment with a line starting `Lab: head=` and the full sha of the live head; the comment names the required contexts read. The comments are not readable from a lane, so only the local Done gate runs it.'
  source: manual
  binds_ac:
  - AC1
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: 'bash -c ''gh pr view 6326 -R OmniNode-ai/omnimarket --json comments --jq ".comments[].body" | grep -c "^Lab: head=$(git rev-parse HEAD)" | grep -qv "^0$"'''
    cwd: .
- id: dod-omn24925-ac2-findings-1-2
  description: 'Findings 1 and 2: the omn-24902 contract no longer says the task carried no finding list, and omn-24831 no longer binds an AC2 to a pass-at-head test (it is a diagnostic that does not fix the cause).'
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: command
    check_value: bash -c '! grep -n "carried no finding list" contracts/OMN-24902.yaml'
    cwd: .
  - check_type: command
    check_value: 'bash -c ''! grep -nE "^ +- (id: )?AC2$" contracts/OMN-24831.yaml'''
    cwd: .
- id: dod-omn24925-ac3-finding-3
  description: 'Finding 3: the runner compares exp.terminal != terminal, a declared unknown is not short-circuited, the corpus declares no unknown, and the I2 and I4 xfail tracking is not keyed on the failure text.'
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/delegation_golden/test_runner_unterminalised_row_omn24831.py -q --no-cov -n 0 -p no:randomly -p no:cacheprovider -k "TestACaseDeclaringUnknownIsNotShortCircuited or TestXfailTrackingIsNotKeyedOnTheFailureText"
    cwd: .
  - check_type: command
    check_value: grep -nF 'and exp.terminal != terminal' tests/delegation_golden/runner.py
    cwd: .
- id: dod-omn24925-ac4-finding-4
  description: 'Finding 4: the guard tests assert the exact failure lists, U1''s empty list and I9''s token line with the terminal undeclared.'
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/delegation_golden/test_runner_unterminalised_row_omn24831.py -q --no-cov -n 0 -p no:randomly -p no:cacheprovider -k "without_a_declared_terminal_keeps_the_old_path or an_undeclared_terminal_is_judged_by_the_old_lines_exactly"
    cwd: .
- id: dod-omn24925-ac5-finding-5
  description: 'Finding 5: the consumer scan covers the delegation-health-check workflow, the nightly workflow and the OMN-18349 placement and budget tests with the needles terminal: expected and tokens: expected positive, and carries a positive control; the dead needle is gone.'
  source: manual
  binds_ac:
  - AC5
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/delegation_golden/test_runner_unterminalised_row_omn24831.py -q --no-cov -n 0 -p no:randomly -p no:cacheprovider -k "TestNoConsumerClassifiesFailuresByText"
    cwd: .
  - check_type: test_passes
    check_value: uv run pytest tests/delegation_golden -q --no-cov -n 0 -p no:randomly -p no:cacheprovider -m "not e2e"
    cwd: .
- id: dod-omn24925-ac6-findings-6-7-8
  description: 'Findings 6, 7 and 8: the fails-on-base checks pin the base 6efbe3ee5027 and require the nine failing ids, and none of them names the landing-branch tip. The red run at the pinned base (nine failing ids) is the local Done gate check below.'
  source: manual
  binds_ac:
  - AC6
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: bash -c '! grep -nE "origin/dev" contracts/OMN-24902.yaml contracts/OMN-24831.yaml contracts/OMN-24851.yaml'
    cwd: .
  - check_type: command
    check_value: bash -c 'b=6efbe3ee5027f6efb67d0b81a1421f0dda32b4e5; t=tests/delegation_golden/test_runner_unterminalised_row_omn24831.py; d="$(mktemp -d)" && git archive HEAD | tar -x -C "$d" && git show "$b:tests/delegation_golden/runner.py" > "$d/tests/delegation_golden/runner.py" && cd "$d" && out="$(env -u PYTHONPATH uv run --frozen pytest $t -q --no-cov -n 0 -p no:randomly -p no:cacheprovider 2>&1)"; printf "%s\n" "$out" | tail -3; [ "$(printf "%s\n" "$out" | grep -cE "^FAILED .*test_one_failure_names_the_null_terminal_ok\[I(1|10|3|5|6|7|8|9)\]")" = 8 ] && printf "%s\n" "$out" | grep -q "^FAILED .*test_it_does_not_report_telemetry_misses_it_cannot_judge" && printf "%s\n" "$out" | grep -qE "(^| )9 failed"'
    cwd: .
- id: dod-omn24925-ac7-findings-9-10
  description: 'Findings 9 and 10: the omn-24831 AC1 check counts distinct job ids, its AC4 check reads the pull request body for a line starting Lab:, and the omn-24851 check reads a comment for Lab: head= instead of discarding pr-checks output.'
  source: manual
  binds_ac:
  - AC7
  checks:
  - check_type: command
    check_value: bash -c '! grep -n "pr-checks OmniNode-ai/omnimarket#6326 >/dev/null" contracts/OMN-24851.yaml'
    cwd: .
  - check_type: test_passes
    check_value: uv run pytest tests/delegation_golden -q --no-cov -n 0 -p no:randomly -p no:cacheprovider -m "not e2e"
    cwd: .
- id: dod-omn24925-ac8-finding-11
  description: 'Finding 11: the diff checks read the merge base and match any pytest skip or xfail marker, and the I10 comment states one to four lines.'
  source: manual
  binds_ac:
  - AC8
  checks:
  - check_type: command
    check_value: bash -c '! grep -n "two or three lines" tests/delegation_golden/test_runner_unterminalised_row_omn24831.py'
    cwd: .
  - check_type: command
    check_value: bash -c 'grep -q merge-base contracts/OMN-24902.yaml && grep -q merge-base contracts/OMN-24831.yaml'
    cwd: .
