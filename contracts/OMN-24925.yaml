schema_version: 1.0.0
ticket_id: OMN-24925
title: 'Review findings 1 to 11 on omnimarket PR 6326 at head bade8964793e are fixed or argued: the finding list and AC1 of OMN-24902 match Linear, the guard test asserts the exact failure list, and the fails-on-base checks pin the base and the nine failing ids'
summary: 'Answers the eleven findings of the review of omnimarket#6326 at head bade8964793e: the exp.terminal != terminal comparison, the exact failure lists of the guard tests, the consumer scan, the xfail tracking test, the pinned fails-on-base checks that require the nine failing ids, distinct-job and body-line checks, and the merge-base diff checks. The lab runs, the required contexts and the arguments for findings left to the pull request are read from the pull request comment, not from hosted CI.'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24925-review-findings-6326
  statement: The review findings on the nightly runner change at head bade8964793e are fixed or argued with evidence, with a test red then green for each.
  acceptance:
  - id: AC2
    statement: 'AC2: findings 1 and 2 are answered: contracts/OMN-24902.yaml lines 3 and 4 are corrected against Linear (the ledger comment 6922291635 holds ten findings, the reviewed head is da6946c35ce0, the nightly is not claimed to pass because of this change), and AC2 of OMN-24831 is either met by fixing terminalisation in its owning repository or unbound from its pass-at-head test with the PR landing under a ticket that does not close OMN-24831 -- falsifier: `uv run pytest tests/delegation_golden/test_runner_unterminalised_row_omn24831.py -q -p no:cacheprovider` passes while `grep -n ''carried no finding list'' contracts/OMN-24902.yaml` still matches'
  - id: AC3
    statement: 'AC3: finding 3 is answered: a case declaring terminal unknown on a NULL row is checked against the corpus, the runner compares `exp.terminal != terminal` with a test, and a test shows the I2 and I4 xfail tracking is not keyed on the failure text -- falsifier: `uv run pytest tests/delegation_golden/test_runner_unterminalised_row_omn24831.py -q -p no:cacheprovider` passes with the `exp.terminal != terminal` comparison removed'
  - id: AC4
    statement: 'AC4: finding 4 is answered: the guard test asserts U1''s exact failure list, not only an absence -- falsifier: `uv run pytest tests/delegation_golden/test_runner_unterminalised_row_omn24831.py -q -p no:cacheprovider` passes with U1 returning before the unterminalised-row line of the runner'
  - id: AC5
    statement: 'AC5: finding 5 is answered: the consumer test covers the delegation-health-check workflow and the OMN-18349 path with the needles `terminal: expected` and `tokens: expected positive`, and the dead line is gone -- falsifier: `uv run pytest tests/delegation_golden -m "not e2e" -q -p no:cacheprovider` passes with a consumer string match on the old failure line left in place'
  - id: AC6
    statement: 'AC6: findings 6, 7 and 8 are answered: test ids for the red run at the pinned base 6efbe3ee5027 (the nine failing ids) and the green run at the new head are attached, the required contexts are read, part A''s command is named and its exit is shown, the fails-on-base checks in contracts OMN-24902, OMN-24831 and OMN-24851 pin 6efbe3ee5027 and require the nine failing ids instead of a bare negated pytest, and the OMN-24902 AC1 check fails while findings 3 to 5 are open -- falsifier: `grep -n ''origin/dev'' contracts/OMN-24902.yaml contracts/OMN-24831.yaml contracts/OMN-24851.yaml` matches in a fails-on-base check, or `uv run pytest tests/delegation_golden/test_runner_unterminalised_row_omn24831.py -q -p no:cacheprovider` exits 0 at the pinned base'
  - id: AC7
    statement: 'AC7: findings 9 and 10 are answered: the STATUS row and the PR body are shown, the OMN-24831 AC1 check counts three distinct job ids with a quoted cause line each, its AC4 check requires a PR body line starting `Lab:`, and the OMN-24851 check reads a PR comment with `grep -c ''Lab: head=''` instead of discarding the output of pr-checks -- falsifier: `grep -n ''pr-checks >/dev/null'' contracts/OMN-24851.yaml` still matches, or `uv run pytest tests/delegation_golden -m "not e2e" -q -p no:cacheprovider` exits non-zero at the new head'
  - id: AC8
    statement: 'AC8: the non-blocking finding 11 is fixed or argued in a PR comment (the contract diffs read the merge base and match `marks=pytest.mark.xfail`, OMN-24902 states its AC2 and AC3, the test comment for I10 states the real line count) -- falsifier: `uv run pytest tests/delegation_golden/test_runner_unterminalised_row_omn24831.py -q -p no:cacheprovider` passes while the test comment still says two or three lines for I10'
