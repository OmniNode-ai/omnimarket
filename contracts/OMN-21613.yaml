schema_version: 1.0.0
ticket_id: OMN-21613
title: Contract and evidence for node_stability_lane_refresh_effect, the stability lane refresh from a committed dated release pin
summary: node_stability_lane_refresh_effect refreshes a stability lane from a committed dated release pin on a per-host overlay (addresses, box id, consumer groups, ports, caps). A refresh whose tag set differs from the pin and carries no bump exits nonzero; a refresh to the set already applied runs nothing. This contract binds the node's evidence so dod-verify can judge the pull request that adds it.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn21613-stability-refresh-from-pin
  statement: The stability refresh reads one release tag each for omnibase_infra, omnibase_core and omnimarket from the committed pin, refuses a dev tag, a bare sha, a branch or a tag the host's clone does not hold, refuses a requested set that differs from the pin unless bumped, and runs nothing when the pinned set is already applied.
  acceptance:
  - id: AC1
    statement: 'AC1: a refresh whose tag set differs from the committed pin and carries no bump exits nonzero and runs nothing -- falsifier: uv run pytest tests/nodes/node_stability_lane_refresh_effect -q -k stability_pin in omnimarket, failing with the bump check removed'
  - id: AC2
    statement: 'AC2: a refresh to the pin already applied exits 0 and recreates nothing -- falsifier: the same pytest asserting no refresh call through the recording runner, failing with the applied-set check removed'
evidence_requirements:
- kind: tests
  description: The pin, overlay and health tests, the real-profile CLI tests and the golden and error chain event tests of node_stability_lane_refresh_effect
  command: uv run --frozen pytest tests/nodes/node_stability_lane_refresh_effect -q --no-cov -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn21613-pin-guards
  description: Runs the pin guard tests. A requested set other than the pin's without a bump is refused (the failing control for AC1, red with the check removed); a set already applied runs nothing (the failing control for AC2, red with the check removed); a dev tag, sha, branch or a tag absent from the clone is refused before anything runs. Absent at the merge base, so the command fails there.
  source: manual
  binds_ac:
  - AC1
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_stability_lane_refresh_effect/test_stability_lane_refresh.py -q --no-cov -p no:randomly -k stability_pin
    cwd: .
- id: dod-omn21613-chain-events
  description: Runs the golden chain and error chain event tests on the in-memory bus. The golden chain ends in a completed event under one correlation id; the error chains end in a refusal or a failed event; four named breaks each turn a chain assertion red. Absent at the merge base, so the command fails there.
  source: manual
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_stability_lane_refresh_effect/test_stability_lane_chain_events.py -q --no-cov -p no:randomly
    cwd: .
- id: dod-omn21613-real-profile
  description: Runs the real-host profile through the CLI with a stub refresh script, a pin file, a git clone per repository and an overlay file. A regression check for the node's real adapters, not proof of a criterion, so it binds none.
  source: manual
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_stability_lane_refresh_effect/test_stability_lane_real_profile.py -q --no-cov -p no:randomly
    cwd: .
- id: dod-omn21613-integration-proof-stability-lane
  description: The first check runs the node's tests at the pushed head on a lab host through the lab work runner. The second reads the lane's health at the address named in ONEX_STABILITY_LANE_HEALTH_URL after the lane is brought up on the pinned release set through this node, and requires a healthy status and the event bus environment named in ONEX_STABILITY_LANE_ENVIRONMENT. Hosted CI cannot reach the lab runner or the lane, so only the local Done gate runs this unbound item.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: 'env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-21613 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_stability_lane_refresh_effect -q --no-cov -p no:randomly'
    cwd: .
  - check_type: command
    check_value: 'sh -c ''curl -fsS "$ONEX_STABILITY_LANE_HEALTH_URL" | python3 -c "import json,sys,os; d=json.load(sys.stdin); assert d[\"status\"]==\"healthy\" and d[\"details\"][\"event_bus\"][\"environment\"]==os.environ[\"ONEX_STABILITY_LANE_ENVIRONMENT\"], d"'''
    cwd: .
