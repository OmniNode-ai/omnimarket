schema_version: 1.0.0
ticket_id: OMN-23906
title: Broker lag alarm waits for growth to persist before it fires
summary: node_lab_alarm reads an optional lag.growth block (min_growth, persist_runs, streak_path) so a consumer group alarms only after persist_runs samples in a row that each grew by min_growth or more; with the block absent one growth sample alarms at once as before.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23906-growth
  statement: The lab alarm's broker lag condition takes its growth minimum and persistence count from the overlay and keeps each group's streak between ticks.
  acceptance:
  - id: AC1
    statement: "AC1: with the growth block declared, a group alarms only after persist_runs samples in a row that each grew by min_growth or more, and with no block one growth sample alarms at once -- falsifier: pytest tests/nodes/node_lab_alarm/test_lab_alarm_growth_persistence.py -q fails when the persistence count is taken as 1."
  - id: AC2
    statement: "AC2: the overlay refuses a persist_runs of zero and a declared growth block without a streak store refuses at construction -- falsifier: pytest tests/nodes/node_lab_alarm/test_lab_alarm_growth_persistence.py -k 'zero_persist or streak_store' -q fails when either refusal is removed."
  - id: AC3
    statement: "AC3: integrated: across the next dev runtime redeploy the board's lab_state broker_lag reading stays green and the alarm's run log shows no ALARM from a rebalance -- falsifier: the lab_state broker_lag reading or the run log shows ALARM within the redeploy window."
evidence_requirements:
- kind: tests
  description: The node's focused tests pass at the pushed head.
  command: uv run pytest tests/nodes/node_lab_alarm -q -n 0 --no-cov -p no:cacheprovider
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23906-ac1
  description: 'AC1: the growth persistence tests pass; the test file is added by this change and fails at the merge base (the adapters it imports do not exist there).'
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_lab_alarm/test_lab_alarm_growth_persistence.py -q -n 0 --no-cov -p no:cacheprovider
    cwd: .
- id: dod-omn23906-ac2
  description: 'AC2: the overlay and the handler refuse the two bad declarations.'
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_lab_alarm/test_lab_alarm_growth_persistence.py -q -n 0 --no-cov -p no:cacheprovider -k "zero_persist or streak_store"
    cwd: .
- id: dod-omn23906-ac3
  description: 'hosted proxy for AC3: the node tests that read the run record the board reads still pass; the reading across the redeploy is posted as a pull request comment naming the head.'
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_lab_alarm/test_lab_alarm_run_record.py tests/nodes/node_floor_simple_effect/test_broker_lag_from_lag_node.py -q -n 0 --no-cov -p no:cacheprovider
    cwd: .
- id: dod-omn23906-integration-proof
  description: the node's focused tests run on a lab host at the pushed head, including the growth persistence tests that fail at the merge base; hosted CI cannot reach the lab, so only the local Done gate runs this unbound check
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23906 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_lab_alarm/test_lab_alarm_growth_persistence.py -q --no-cov
