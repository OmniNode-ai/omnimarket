schema_version: 1.0.0
ticket_id: OMN-22671
title: The install-confirm trigger takes its session reader as an optional contract dependency and records a typed skip event, so session-content applied events stop going to the dead-letter topic
summary: The trigger handler declared a keyword-only reader that the runtime's dispatcher never passes, and no implementation of the session source exists yet, so every session-content applied event failed at dispatch and went to the dead-letter topic at about 232 records a minute. The reader is now an optional constructor dependency declared in the node contract; with none, the handler returns a typed InstallConfirmSkipped event published on its own topic.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn22671-optional-reader-typed-skip
  statement: The trigger handler is built with no arguments by the runtime, answers an applied event with a typed skip event while no reader is wired, and keeps the confirmation path and its failures when a reader is wired.
  acceptance:
  - id: AC1
    statement: 'AC1: the recorded dead-letter envelope published to the real contract booted through wire_from_manifest on an in-memory bus yields exactly one InstallConfirmSkipped event on the skipped topic and nothing on the completed topic, and the same test sees no skip event on the handler before the change -- falsifier: uv run --frozen pytest tests/nodes/node_context_install_confirm_trigger_effect/test_unwired_reader_dead_letter_omn22478.py -q --no-cov'
  - id: AC2
    statement: 'AC2: a wired reader still takes the confirmation path and a failing reader raises and is never converted into a skip -- falsifier: uv run --frozen pytest tests/nodes/node_context_install_confirm_trigger_effect -q --no-cov'
evidence_requirements:
- kind: tests
  description: The recorded dead-letter envelope is skipped on the real runtime wiring and the confirmation path is unchanged
  command: uv run --frozen pytest tests/nodes/node_context_install_confirm_trigger_effect -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn22671-recorded-envelope
  description: Publishes the envelope recorded from the dead-letter topic to the real contract on an in-memory bus and reads the skip event, and checks that a wired reader and a failing reader behave as before.
  source: manual
  binds_ac:
  - AC1
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_context_install_confirm_trigger_effect -q --no-cov
    cwd: .
- id: dod-omn22671-integration-proof
