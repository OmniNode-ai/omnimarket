schema_version: 1.0.0
ticket_id: OMN-24448
title: Host drift owner lanes survive the end of their service pass
summary: The drift owner dispatch unit's pass starts each lane runner detached in its own session inside a oneshot systemd service, and the service's default kill mode (control group) ends every process left in the unit when the pass ends, so each runner was stopped before it placed its lane (receipts on h053 and h051, 2026-11-14, status interrupted, exit 143). The host installer's systemd registry unit gains an optional kill_mode (process or mixed), rendered as one KillMode line appended to the last line of the service template so a unit that declares none renders the same file as before, and the drift owner dispatch unit declares process.
is_seam_ticket: true
interface_change: false
requirements:
- id: req-omn24448-lane-runners-outlive-pass
  statement: A systemd registry unit may declare kill_mode (process or mixed) and the installer renders it; the drift owner dispatch unit declares process so the lane runners its pass starts are not ended with the pass; every other unit's rendered service file is unchanged.
  acceptance:
  - id: AC1
    statement: "AC1: a systemd unit that declares a kill mode renders it as a KillMode line of its service file, the drift owner dispatch unit declares process, and a unit that declares none renders no such line -- falsifier: pytest tests/nodes/node_host_installer_registry_units/test_kill_mode_unit.py -q, run against the pre-change source it reads 5 failed"
  - id: AC2
    statement: "AC2: every systemd unit that declares no kill mode renders a service file byte for byte equal to the one rendered before the change, and an invalid kill mode and a launchd unit declaring one are refused by name -- falsifier: the golden and error cases in tests/nodes/node_host_installer_registry_units/test_kill_mode_unit.py"
  - id: AC3
    statement: "AC3: integrated: after the host installer reinstalls the drift owner dispatch unit on h053 and h051, one pass places each repair job it starts and the job's receipt is not marked interrupted when the pass ends -- falsifier: integrated: the remote lane receipts of the pass on h053 and h051 show a placed status, not interrupted exit 143, read after the service has become inactive"
evidence_requirements:
- kind: tests
  description: The kill mode tests, with the golden unchanged-output cases, the error cases and the seam test between the unit and the lane runner start, plus the neighbouring host installer unit tests.
  command: env -u PYTHONPATH uv run --frozen pytest tests/nodes/node_host_installer_registry_units -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24448-ac1-kill-mode
  description: The kill mode tests; the drift owner unit declares process and renders the line, a unit with none renders none, and the same tests run against the pre-change source read red.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_host_installer_registry_units/test_kill_mode_unit.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24448-ac2-golden-error
  description: Fourteen systemd units that declare no kill mode render a service file ending in the same last line with no KillMode text; an invalid value and a launchd unit declaring one are refused.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_host_installer_registry_units/test_kill_mode_unit.py tests/nodes/node_host_installer_registry_units/test_host_drift_owner_dispatch_unit.py tests/nodes/node_host_installer_registry_units/test_registry_units_systemd.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24448-ac3-integration-proof
  description: The pushed head ran the kill mode tests on a lab host through the lab work runner and exited 0. The running reading (the reinstalled unit on h053 and h051 and the receipts of one pass after the service ends) is read from the lab receipt comment on the ticket.
  source: manual
  execution_scope: local_done_gate
  binds_ac:
  - AC3
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24448 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_host_installer_registry_units/test_kill_mode_unit.py -q --no-cov -n 0 -p no:randomly
    cwd: .
