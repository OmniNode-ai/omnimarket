schema_version: 1.0.0
ticket_id: OMN-23882
title: The trial driver's orchestrator runs a grid of coding trials on lab machines
summary: A new node, node_code_eval_trial_orchestrator, composes the code eval trial run over the bus. Its contract wires the run, unit answer, score, nudge, capacity and tick routes with a state_io row and a completion bound; its handler folds each message through the pure node_code_eval_trial_reducer, sends the unit commands and score requests it returns, publishes one context-ROI row per verdict and closes the run once. The codec builds the abandoned terminal.
is_seam_ticket: true
interface_change: true
interfaces_touched:
- public_api
- topics
requirements:
- id: req-omn23882-ac1
  statement: the orchestrator's golden chain through its handler gives 12 try rows, 2 control rows, 14 score requests and one close for two tasks, two models and bound 3, the same on redelivery
  acceptance:
  - id: AC1
    statement: 'AC1: the orchestrator contract wires the run, answer, score, nudge, capacity and tick routes, and its golden chain through the handler gives 12 try rows, 2 control rows, 14 score requests and one close for two tasks, two models and bound 3, the same on redelivery -- falsifier: uv run pytest tests/nodes/node_code_eval_trial_orchestrator/test_orchestrator_golden_chain.py -q'
- id: req-omn23882-ac2
  statement: error chain and close rule hold through the handler and the codec
  acceptance:
  - id: AC2
    statement: 'AC2: error chain and close rule through the handler: no close with a try pending, a lost unit or score expires on the nudge, a row past the completion bound yields the closed event with abandoned true from the codec, and a request whose timeouts do not fit under the bound is refused with no row -- falsifier: uv run pytest tests/nodes/node_code_eval_trial_orchestrator/test_orchestrator_close_rule.py -q'
- id: req-omn23882-ac3
  statement: every seam the orchestrator touches has a test that fails when either side changes shape
  acceptance:
  - id: AC3
    statement: 'AC3: every seam the orchestrator touches has a test that fails when either side changes shape -- falsifier: uv run pytest tests/nodes/node_code_eval_trial_orchestrator/test_orchestrator_seams.py -q'
- id: req-omn23882-ac4
  statement: 'integrated: one run request on the development bus runs a three-task set against one local model on a lab machine whose lab-work serve runs this branch, with no worker opened per attempt, and its rows are read back by run id'
  acceptance:
  - id: AC4
    statement: 'AC4: integrated: one run request on the development bus runs a three-task set against one local model on a lab machine whose lab-work serve runs this branch, with no worker opened per attempt, and its rows are read back by run id -- falsifier: the rows read by run id on the development lane beside the closed event''s sequences'
