schema_version: 1.0.0
ticket_id: OMN-23192
title: The stall responder keeps lanes of a shared name prefix apart, catches a replay up in one step and refuses one invalid date alone
summary: Fixes the five findings of the Tessl Review on the stall responder node. A long subject keeps a digest in its lane stem, a live lane covers a key only when its name matches the key's stem whole, a replay with a prior dispatch answers with the newest row past the window, a stall row with an impossible calendar date is refused alone with a typed refusal, and the idle-cost sum refuses an until earlier than since and an impossible date. The node stays pure and starts nothing.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23192-stall-responder
  statement: The stall responder and the idle-cost sum answer each reviewed finding with a refusal or a correct decision, and a test per finding fails on omnimarket dev 566d7ead09.
  acceptance:
  - id: AC1
    statement: 'AC1: a test per finding fails on the code at omnimarket dev 566d7ead09 and passes with the fix -- falsifier: uv run pytest tests/nodes/node_stall_responder_compute -q, run on the base with the test files copied in (red) and on the fix branch (green)'
  - id: AC2
    statement: 'AC2: an invalid calendar date in one stall row yields a typed refusal for that row and does not stop the other rows of the batch -- falsifier: uv run pytest tests/nodes/node_stall_responder_compute -q -k "invalid_date or batch"'
  - id: AC3
    statement: 'AC3: the idle-cost reading refuses an until earlier than since and an impossible month or day -- falsifier: uv run pytest tests/nodes/node_stall_responder_compute -q -k "idle_cost"'
evidence_requirements:
- kind: tests
  description: The stall responder node tests pass, including one test per finding.
  command: uv run pytest tests/nodes/node_stall_responder_compute -q
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23192-ac1
  description: One test per finding in test_stall_responder_findings.py; 12 of its 14 tests fail on the base source of omnimarket dev 566d7ead09 and all pass with the fix.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_stall_responder_compute -q --no-cov
- id: dod-omn23192-ac2
  description: A stall row dated 2026-11-31 is refused with reason invalid-calendar-date and the other rows of the batch are answered.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_stall_responder_compute -q --no-cov -k "invalid_date or batch"
- id: dod-omn23192-ac3
  description: The idle-cost sum raises on an until earlier than since and on an impossible month, day or hour.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_stall_responder_compute -q --no-cov -k "idle_cost"
- id: dod-omn23192-integration-proof
  description: Run the stall responder node's tests on a lab host at the pushed head. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23192 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_stall_responder_compute -q --no-cov
