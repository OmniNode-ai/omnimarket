schema_version: 1.0.0
ticket_id: OMN-24392
title: The CI red rule node names an Actions 504 failure as a service fault from the failure text
summary: 'node_ci_red_kind_rule_compute named a failed check''s kind from the check name only. A rule may now carry a log pattern, read from the settings overlay, matched against the log excerpt in the
  request; the example overlay names an Actions "Unexpected HTTP response: 5xx" line as runner-infra. A rule with neither pattern, or a log pattern that does not compile, is a typed refusal (overlay_invalid);
  an empty log excerpt never matches a log rule. Not in this change: the deployed settings file for the node (it waits for this change to merge and is bound from the merged revision).'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24392-log-rule
  statement: the CI red rule node names a failed check's kind from the failure's own text through a log pattern held in its settings overlay, with no model call.
  acceptance:
  - id: AC1
    statement: 'AC1: a failed check whose log excerpt carries an Actions error line reading Unexpected HTTP response with a 5xx code is named runner-infra by the rule node from its settings overlay with no model call; the 24 consistent items of the experiment label runner-infra and the 3 retry-only items stay unlabelled -- falsifier: pytest tests/nodes/node_ci_red_kind_rule_compute/test_rule_log_fixture.py -q fails on the base tree'
  - id: AC2
    statement: 'AC2: a rule''s log pattern is a settings value, a rule with neither pattern or with a log pattern that does not compile is a typed refusal (overlay_invalid), and an empty log excerpt never matches a log rule -- falsifier: pytest tests/nodes/node_ci_red_kind_rule_compute/test_rule_error.py -q'
  - id: AC3
    statement: 'AC3: the seam holds: the kind the overlay''s log rule names is in the frozen kind taxonomy and declared by the routing settings, and the test fails when either side renames it -- falsifier: pytest tests/nodes/node_ci_red_kind_rule_compute/test_rule_seam.py -q'
  - id: AC4
    statement: 'AC4: integrated: with the deployed settings bound on a lab host from the merged revision, the rule node run over a fresh Actions 504 red''s log excerpt answers runner-infra with model_call_required false, read from the node''s own answer -- falsifier: the answer reads matched false or a refusal'
evidence_requirements:
- kind: tests
  description: The rule node's golden, error, log fixture and seam tests pass at the pushed head.
  command: uv run --frozen pytest tests/nodes/node_ci_red_kind_rule_compute -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24392-ac1-ac3
  description: 'AC1 to AC3: the log fixture names the 24 consistent items runner-infra and leaves the 3 retry-only items unlabelled; the error test refuses a rule with no pattern or an uncompilable one and never matches an empty excerpt; the seam test fails when the overlay kind or the routing setting renames it. The failing control: the log fixture test fails on the base tree, where the node reads no log pattern.'
  source: manual
  binds_ac:
  - AC1
  - AC2
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_ci_red_kind_rule_compute -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24392-integration-proof
  description: 'AC4 hosted proxy: the node tests run on a lab host at the pushed head; the read of the node answering runner-infra over a fresh 504 red with the deployed settings waits for the settings file to exist after merge, so only the local Done gate runs this unbound check'
  source: manual
  binds_ac:
  - AC4
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24392 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_ci_red_kind_rule_compute -q --no-cov -p no:randomly
