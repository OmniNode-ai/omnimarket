schema_version: "1.0.0"
ticket_id: "OMN-22975"
title: "J14: a signed receipt carries a lab-model voter result through the chain of responders, golden and error"
summary: "Join J14 (piece 14 to piece 15) as a golden and an error join test over the existing review dispatch and hosted gate handlers: the signed receipt for a head names the lab-model voters obtained through the chain of responders and the gate accepts it for the exact head; an unreachable rung is typed on the dispatch terminal and never in the votes, and a chain with no rung able to answer signs and posts no receipt. Two named injected breaks show the assertions fail for real."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-join-j14"
    statement: "A signed receipt carries a lab-model voter result obtained through the chain of responders, and an unreachable rung is typed."
    acceptance:
      - id: "AC1"
        statement: "AC1: golden join test: a signed receipt carries a lab-model voter result obtained through the chain of responders -- falsifier: uv run pytest tests/integration/test_join_j14.py -q -k golden"
      - id: "AC2"
        statement: "AC2: error join test: an unreachable rung is typed in the receipt -- falsifier: uv run pytest tests/integration/test_join_j14.py -q -k error"
evidence_requirements:
  - kind: "tests"
    description: "AC1: golden join test: a signed receipt carries a lab-model voter result obtained through the chain of responders."
    command: "uv run pytest tests/integration/test_join_j14.py -q -k golden"
  - kind: "tests"
    description: "AC2: error join test: an unreachable rung is typed in the receipt."
    command: "uv run pytest tests/integration/test_join_j14.py -q -k error"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
