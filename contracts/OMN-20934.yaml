schema_version: 1.0.0
ticket_id: OMN-20934
title: onex scm help text stops naming the internal workspace variable
summary: The onex scm read verbs' --clone help names ONEX_SCM_CLONE_ROOT instead of OMNI_HOME, and default_clone_path reads that declared root first, falling back to OMNI_HOME in code only. A test walks the scm click group and fails on any OMNI_HOME form.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-scm-help-no-omni-home
    statement: No parameter, default, help or envvar binding on the onex scm click group names OMNI_HOME, and the clone default resolves under ONEX_SCM_CLONE_ROOT.
    acceptance:
      - id: AC1
        statement: 'AC1: the onex scm group renders no OMNI_HOME form and the clone default honours ONEX_SCM_CLONE_ROOT -- falsifier: tests/unit/handlers/scm/test_onex_scm_customer_surface.py fails when any scm verb parameter names OMNI_HOME or when a declared root without a clone falls through (uv run pytest on that file)'
evidence_requirements:
  - kind: tests
    description: The customer-surface walk over the scm click group, its positive control and the clone default resolution tests.
    command: uv run pytest tests/unit/handlers/scm/test_onex_scm_customer_surface.py -q
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn20934-ac1-scm-customer-surface
    description: The scm click group names no OMNI_HOME form and the clone default resolves under ONEX_SCM_CLONE_ROOT.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/handlers/scm/test_onex_scm_customer_surface.py -q
    binds_ac:
      - AC1
  - id: dod-omn20934-ac1-deploy-probe
    description: 'AC1 deploy probe: the scm CLI module GitHub serves at the checked-out commit builds the --clone help from the declared clone-root variable. A commit without that change fails the probe.'
    source: manual
    checks:
      - check_type: command
        check_value: |-
          gh api "repos/OmniNode-ai/omnimarket/contents/src/omnimarket/handlers/scm/scm_cli.py?ref=$(git rev-parse HEAD)" --jq '.content | gsub("\n"; "") | @base64d | contains("{CLONE_ROOT_ENV}/<repo>")' | grep -qx true
        cwd: ${OMNI_HOME}/omnimarket
