schema_version: 1.0.0
ticket_id: OMN-26109
title: node_host_retention_effect has a unit in the declared installer registry and runs successfully on h051, h053, h201, h202, h101 and h105
summary: 'This change continues omnimarket#6423. The installer registry (the units block of the node_host_installer_registry_units contract) declares the host retention tick for the Linux hosts as host-retention-uv-cache-systemd and for the Mac hosts as host-retention-uv-cache-launchd, both running only the uv cache class for the host named by the ledger host name input. The h053 unit exited 2 on every run because its project path named a lane worktree that no longer exists on the host; the unit is re-installed through the declared installer, never edited by hand.'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn26109-host-units
  statement: The host retention tick has a declared systemd unit and a declared launchd unit in the installer registry, installed on the six owned hosts through the declared installer, each run read with its freed space or its nothing-to-free reading.
  acceptance:
  - id: AC1
    statement: 'AC1: the node_host_installer_registry_units contract declares a unit for the node_host_retention_effect tick (systemd for the Linux hosts, launchd for the Mac hosts), with a test that loads the contract and asserts the unit and its tick module exist -- falsifier: uv run pytest tests -q -k "host_retention_uv_cache_unit or runtime_host_retention_tick" fails, or grep -c runtime_host_retention_tick src/omnimarket/nodes/node_host_installer_registry_units/contract.yaml prints 0'
  - id: AC2
    statement: 'AC2: the h053 retention unit runs and its last run exits 0, the exit 2 fixed at its cause -- falsifier: systemctl --user show onex-host-retention-uv-cache.service -p ExecMainStatus on h053 prints a value other than ExecMainStatus=0'
  - id: AC3
    statement: 'AC3: the unit is installed from the branch on h051, h053, h201, h202, h101 and h105 with the declared installer, one STATUS row of the ledger carries installed=<host>:<sha> and observed=<run line> per host -- falsifier: the ledger rows of this ticket naming installed= name fewer than the six hosts'
  - id: AC4
    statement: 'AC4: one run per host is read and the table records space freed or nothing to free for each host -- falsifier: a host among the six has no run line in the table, or a run line without a freed-bytes or nothing-to-free reading'
  - id: AC5
    statement: 'AC5: no run removed a path under the cleanup archive or a live lane directory, and no host file, unit or plist was edited by hand -- falsifier: a run line names a removed path under an archive root or a live lane run directory, or a STATUS row cites no installer receipt'
evidence_requirements:
- kind: tests
  description: The host retention tick and both installer registry unit tests pass at the pushed head.
  command: uv run pytest tests/nodes/node_host_retention_effect/test_runtime_host_retention_tick.py tests/nodes/node_host_installer_registry_units/test_host_retention_uv_cache_unit.py tests/nodes/node_host_installer_registry_units/test_host_retention_uv_cache_launchd_unit.py -q -p no:randomly --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
