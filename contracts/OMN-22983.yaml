title: 'Piece 18''s first task: the J17 join test, the customer-facing health line is computed from the floor''s readings and read by the clean-VM walk, and a stale reading makes the walk read NOT WORKING'
summary: Join J17 (piece 17 to piece 18) has a golden and an error join test. Both run the real handlers, the walk reading over a walk receipt, the floor record over the readings, and the customer health line over that record's piece rows, and the walk reads the record as the floor serves it. Golden reads the line WORKING with the ages of the readings it used. Error reads a stale reading as NOT WORKING with the piece named, and the floor's receipt fold reads the chain pair golden_only, error_only and passed. Injected breaks show the assertions can fail.
