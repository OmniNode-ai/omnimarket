schema_version: 1.0.0
ticket_id: OMN-22985
title: Piece 18's generated golden and error chain tests and the customer-path whole-flow golden and error run exist, and a named mutation turns each red
summary: Piece 18 (the customer path) holds the clean-VM onboarding walk node and its weekly reading. The chain test file generates its scenarios from the walk node's contract.yaml (the command, success and failure topics and the documented steps, one error chain per documented step plus the two log-level legs a passing script can hide), carries each over the in-memory bus, and runs a whole-flow golden and error run that takes a clean VM fixture from install to a first delegated result and types each failing leg. Six named mutations are each run against their unbroken control first.
