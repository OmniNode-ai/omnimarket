    statement: 'AC1: the whole-flow golden run takes a clean VM fixture from install to a first delegated result and the error run types each failing leg -- falsifier: uv run --frozen pytest tests/chain/test_piece18_whole_flow.py -q --no-cov'
  - id: AC2
    statement: 'AC2: a named mutation turns each red -- falsifier: uv run --frozen pytest tests/chain/test_piece18_whole_flow.py -q --no-cov -k mutation'
