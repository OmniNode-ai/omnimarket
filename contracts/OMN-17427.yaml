    binds_ac: [AC1742701]
  - id: "dod-omn17427-metering-envelope-postgres"
    description: "AC161: drive both synchronous command entry points against real PostgreSQL and read back the tenant, windows, run count, token counts and timestamp. Refuse skips so an unavailable database cannot count as proof."
    source: manual
    binds_ac: ["AC161"]
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/test_omn17427_metering_store_refresh_real_postgres.py -k runtime_envelope_context_persists_summary -q --no-cov -p no:randomly --refuse-skips"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn17427-metering-envelope-deploy-probe"
    description: "Deploy probe. On the hosted runner, exercise both packaged command entry points with the runtime's envelope keys and assert refreshed tenants and folded row counts. Restoring the fixed context-name list fails validation. Needs only this checkout and locked test dependencies, without a broker, database or credentials. This is a packaged runtime-path probe, not a live deployment attestation."
    source: manual
    checks:
      - check_type: command
        check_value: "env PYTHONDONTWRITEBYTECODE=1 uv run pytest tests/nodes/node_projection_metering_summary/test_omn17427_store_refresh.py::test_the_envelope_context_the_runtime_adds_is_not_payload -q --no-cov -p no:randomly --refuse-skips"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn17427-terminal-cleanup-deadline"
    description: "Slow-close fault injection reproduces the receipt delay on publish success and failure; both deadline cases and the orphaned coroutine control fail at the merge base. Current publication and failed-event durability remain asserted."
    source: "manual"
