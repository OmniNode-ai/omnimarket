              "test_override_floor_fits_the_newest_infra_pin",
          } <= names
          pins = next(node for node in tree.body if isinstance(node, ast.AnnAssign) and getattr(node.target, "id", "") == "INFRA_CORE_PINS")
          assert ast.literal_eval(pins.value) == (("44542e2a0", "0.47.44"), ("291f2f747", "0.47.46"), ("d20586c7d", "0.47.48"))
          root = "tests/ci/fixtures/pin_compat/"
