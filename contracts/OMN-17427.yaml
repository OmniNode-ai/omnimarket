    description: "Deploy probe. In the checked-out package, a home holding one lane guard whose bytes hash to its directory name is read by LocalHostReader and advertises exactly that lane-guard:<sha256> tool, and an empty home advertises none. It fails at the merge base and needs only uv and this checkout on the hosted runner; it does not attest a live host."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: |-
          uv run python - <<'PY'
          import hashlib
          import tempfile
          from pathlib import Path

          from omnimarket.nodes.node_lab_work_unit_effect.protocols.local_host_reader import (
              LocalHostReader,
          )

          body = b"print('guard')\n"
          sha = hashlib.sha256(body).hexdigest()
          with tempfile.TemporaryDirectory() as raw:
              home = Path(raw)
              target = home / ".local" / "share" / "onex-lane-guard" / "sha256" / sha
              target.mkdir(parents=True)
              (target / "lane_guard_host.py").write_bytes(body)
              tools = LocalHostReader(home=home).read([]).tools
              assert [t for t in tools if t.startswith("lane-guard:")] == [f"lane-guard:{sha}"], tools
          with tempfile.TemporaryDirectory() as raw:
              tools = LocalHostReader(home=Path(raw)).read([]).tools
              assert not [t for t in tools if t.startswith("lane-guard:")], tools
          print("lane guard advertisement deploy probe: PASS")
          PY
        cwd: "${OMNI_HOME}/omnimarket"
