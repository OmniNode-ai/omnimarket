      Every node's derived dispatch identifiers fit the limits ModelDispatchRoute declares, and every contract auto-wires in-process through the infra runtime's wire_from_manifest, on every pull request and before every release; the known exceptions are shrink-only.
  - id: "req-auto-wiring-manifest-ignores-active-lane"
