    command: "uv run pytest tests/unit/delegation/test_ambient_tenant_id_scrubbed_omn17427.py -q"
  - kind: "tests"
    description: "The PG16 provision step is bounded and runs apt only when the runner image lacks PG16."
    command: "uv run pytest tests/ci/test_omn18693_native_postgres_ci_wiring.py -q"
  - kind: "tests"
    description: "The caller pins the reusable that derives the writer app's dependency-pin-only exemption in-job."
