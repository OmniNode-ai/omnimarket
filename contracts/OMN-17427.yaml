  - id: "req-morning-overlay-at-run"
    statement: |-
      The morning ground-state and friction-sweep handlers read their deployment overlay when a run starts, so a runtime without the overlay wires every other node and refuses only that run, instead of failing auto-wiring and crash-looping the effects runtime.
  - id: "req-budget-cancel-keeps-evidence"
    statement: |-
      A delegation cancelled at its handler execution budget keeps the routing, model, key source and attempts it had reached on its failed terminal, instead of a fresh timeout terminal that names nothing.
  - id: "req-budget-cancel-cause-timeout"
    statement: |-
      A delegation the handler budget cancelled names timeout as its terminal failure cause, and any earlier quality-gate refusals stay on their own rungs in its attempts.
  - id: "req-tick-codex-headroom"
    statement: |-
      The throughput tick decision reports Codex headroom on a Codex-allowed lab host whose Claude engine is limited, instead of folding the host into no dispatch for both engines.
  - id: "req-deploy-probe-command-only"
    statement: |-
      The AC28 deploy probe evidence item stays a command-only probe that binds no criterion, and AC28 keeps its Codex headroom pytest on its own evidence item, so the deploy probe binding test on dev passes.
  - id: "req-infra-03871-discovery-compatibility"
    statement: |-
      The dependency floor and lock include omnibase_infra 0.38.71's vendored migrations, and architecture discovery supplies the invoke command required by that release's workspace validation API before any agent invocation.
  - id: "req-release-cut-needs-no-contract"
    statement: |-
      The ticket-contract prerequisite exempts a release cut, whose diff against the merge base is the root CHANGELOG.md with optional pyproject.toml and uv.lock, because the receipt gate refuses a cut that carries a contracts/ file.
  - id: "req-hostile-reviewer-retry-budget-pin"
    statement: |-
      The Hostile Reviewer clones omniintelligence at the revision whose retry of an unparseable review reply gets 8192 tokens instead of 4096.
  - id: "req-omn17427-precommit-commit-path"
    statement: "A commit no longer pays for whole-repo scans that CI runs on every pull request, and the staged-paths hygiene scan returns the whole-tree verdict."
  - id: "req-morning-phases-lab-work"
    statement: "The morning ground-state node refuses a phase sent as the unroutable agent_delegation class with a typed error naming the missing capability, and runs each phase as bus lab work instead."
  - id: "req-superseded-run-cancel"
    statement: "A queued or in-progress CI run that a later push or a merge-queue exit left behind is cancelled from the run list and the queue read alone, one event per cancel, and a run on a PR's current head is never cancelled."
  - id: "req-named-test-runner"
    statement: "The default local delegation port grades code answers on the named tests carried inline by their request, and records whether tests ran."
  - id: "req-declared-table-retention"
    statement: "The retention node prunes every registered lab table to its declared window in bounded, committed batches on the runtime tick, and never touches a ledger, credential, tenant registry or migration history table."
  - id: req-verified-delete
    statement: A local file is deleted only after Drive reports the size and md5 of the staged part that holds it.
  - id: req-safety
    statement: The node refuses the landing controller host and never archives protected or fresh files.
  - id: req-throttle
    statement: Staging and upload run under a bounded CPU, IO and bandwidth budget through a CLI uploader, not Drive for desktop.
  - id: req-nightly
    statement: The archive is a nightly Eastern off-peak host tick and an onex verb.
  - id: "req-lab-story-log"
    statement: "The work ledger's week becomes a sanitized story log by a node, with private names replaced by roles from the public-repo hygiene vocabulary, and the log is never written when a private name survives."
  - id: "req-declared-file-retention"
    statement: "The retention node retires the lab hosts' unbounded file paths from the same contract, with a keep window set by each path's readers, archives history before removing it, and reports bytes and files removed and archived per run."
  - id: "req-sweep-root-no-registry-fallback"
    statement: "Sweep orchestrators refuse a stale ONEX_CC_REPO_PATH instead of locating a change-control clone through OMNI_HOME."
  - id: "req-contract-search-declared-roots"
    statement: "EvidenceCollector searches its declared contract roots without an additional working-directory-relative fallback."
  - id: "req-occ-companion-producer-dropped"
    statement: "omnimarket carries no workflow, publisher or check of the OCC companion producer once every caller that still reaches it reads it at an immutable ref."
  - id: "req-duplication-sweep-d3-core-handler"
    statement: "The duplication sweep's D3 migration-conflict check runs omnibase_core's migration-conflict handler in process, so it reads no onex_change_control checkout and runs no external command."
  - id: "req-dod-verify-occ-root-explicit-only"
    statement: "dod_verify's evidence collector locates the change-control clone only through ONEX_CC_REPO_PATH or the contract's own path, never under OMNI_HOME."
  - id: "req-default-repo-lists-off-change-control"
    statement: "The default repository lists of the git mirror sync, the merge sweep and the PR snapshot name no change-control repository, and a checkout of any repository binds a DoD contract as a product repository."
  - id: "req-lab-fill-tick-no-model"
    statement: "One lab-fill tick fills a fire's free slots from the approved-work list with no model call: ownership read once, the Linear assignee and state re-read directly per launch, lanes launched through the remote-lane runner, and a result naming what was dispatched and why the rest was not."
  - id: "req-lab-fill-zero-placement-alarm"
    statement: "A lab-fill tick that leaves free slots unplaced names every unplaced lane with its reason, acts on a second such tick in a row with one deduplicated diagnose lane and an event, and parks a candidate the brief check refused twice instead of retrying it every tick."
  - id: "req-lab-fill-dod-verify-fallback"
    statement: "Lab-fill selection takes tickets it skipped because their implementation merged as DoD-verify lanes for the slots ordinary and pr-land work leave idle, one per ticket and gated by the ticket's lab-fill attempt history, and the dispatch plan ranks them last, scopes them by the kind they were enumerated as and renders a brief that closes the ticket only on a passing DoD receipt."
  - id: "req-review-finding-evidence"
    statement: "The hostile reviewer blocks only on an Important finding the pull request introduced, with a file and line inside its diff, that is not of a style or cleanup class; after three review rounds on one pull request it re-reviews only the new diff and does not repeat a finding it has posted."
  - id: "req-hook-push-rehearsal-caller"
    statement: "A pull request that changes the pre-push set runs omnibase_core's hook push rehearsal before it merges."
  - id: "req-review-finding-parse-veto"
    statement: "A blocking hostile-review finding that claims a Python, YAML or JSON file is syntactically invalid is checked by parsing that file at the pull request head, and dropped with a logged reason when it parses; findings of every other class are left as the reviewers raised them."
  - id: "req-remove-coderabbit"
    statement: "CodeRabbit is removed from the review-gate code: the coderabbit-triage node, skills and registrations are gone, and no arm gate, merge-state, fix-routing, comment-resolution or inventory path counts, waits on or parses CodeRabbit threads."
  - id: "req-core-pin-compatibility"
    statement: "The omnibase-core dependency and override floors must fit the newest recorded omnibase_infra pin, and the recorded incompatible incident pair must be refused."
  - id: "req-session-capability-digest"
    statement: "A session that opens inside a registry root starts with the cached capability digest, a stale or missing digest is named with its fix, and a session elsewhere is not touched, decided by a contract-declared effect node that reads two cached files and never blocks a session."
  - id: "req-ci-red-watcher-facts-only"
    statement: "The CI-red triage reader uses watcher facts without launching gh, and incomplete observations record facts-unavailable without starting an effect."
  - id: "req-repository-prose-removed"
    statement: "Repository prose lives in the public knowledge base; the contribution, security and changelog guides and the unused README, table and evidence text files are removed and the root README is a short signpost."
  - id: "req-docs-assets-evidence-removed"
    statement: "The unreferenced logo set, closed-ticket evidence records and ADR inventory under docs/ live in the knowledge base archive and are removed here; the files a test, script or workflow reads stay."
  - id: "req-linear-triage-local-github"
    statement: "node_linear_triage runs on a host that holds no GitHub token by reading PR state from the PR watcher state and the canonical clones, reports an unreadable state instead of an empty answer, and keeps its implementing-PR gate."
  - id: "req-lab-first-routing-rubric"
    statement: "The task-class contract carries a scoring rubric per class, and a check refuses a contract change that routes a class to a cloud model first unless the class has a recorded measurement below the bar."
  - id: "req-reviewer-eval-gate"
    statement: "The hostile reviewer is scored on every change to it against an eval set from recorded history (true catches a later fix confirmed, blocks later overturned, merged heads with no revert), as recall on true catches and the false-block rate on clean heads, and the change fails when either score is worse than the set's baseline or the set shrinks, relabels a case or lowers its baseline; the score is published as an event."
  - id: "req-review-finding-dispositions"
    statement: "A fix worker's result carries a typed disposition (fixed, wrong, intentional, not_applicable) with the finding's id and class for each hostile-reviewer finding it answered, published as events; a pure compute folds them with the review pass signal into per-repo noise share, one-round pass share and rounds-to-pass, and names each finding class that appears on three distinct PRs inside seven days with one stable dedupe key."
  - id: "req-claude-account-token-pool"
    statement: "Each host keeps a local secret-store entry per Claude account, resolves the first usable token in account order, marks a usage limit on that account and reports token-free pool status."
  - id: "req-claude-pool-revoked-token"
    statement: "A Claude pool token whose OAuth login was revoked is marked revoked on its own label, resolve skips it while another token is usable, one alert names the revoked label, and only a pool with no usable token reports ALARM."
  - id: "req-claude-pool-revoked-not-limited"
    statement: "Revoked Claude tokens do not count as waiting on a limit reset, while a pool with no usable token still raises its alarm."
  - id: "req-context-compaction-task-class"
    statement: "context_compaction is an internal delegation task class: the compaction orchestrator can name it, it is never resolved from prompt text, it declares an execution budget and a ladder it can reach, every market consumer of the task-class universe accepts it, and the summarization-shaped inference protocol profiles shape its requests."
  - id: "req-publisher-fixture-one-copy"
    statement: "omnimarket resolves a golden chain's publisher through the one publisher contract fixture in omnibase_infra and holds no parser or index of its own."
  - id: "req-hostile-reviewer-delegation-route"
