    description: "Deploy probe. The hosted runner checks the subject commit has no process or network imports in the CI-red handler and carries the facts-unavailable decision marker; the prior commit contains subprocess imports. This does not attest a live deployment."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: |-
          python3 - <<'PY'
          import ast
          import subprocess

          path = "src/omnimarket/nodes/node_pr_lifecycle_orchestrator/handlers/handler_ci_red_triage.py"
          source = subprocess.check_output(["git", "show", "HEAD:" + path], text=True)
          tree = ast.parse(source)
          forbidden = {"subprocess", "os", "httpx", "requests", "urllib", "socket"}
          imports = set()
          for node in ast.walk(tree):
              if isinstance(node, ast.Import):
                  imports.update(alias.name.split(".")[0] for alias in node.names)
              elif isinstance(node, ast.ImportFrom):
                  imports.add((node.module or "").split(".")[0])
          assert not (imports & forbidden), imports & forbidden
          assert "start=withheld:facts-unavailable" in source
          print("CI-red watcher facts artifact probe: PASS")
          PY
