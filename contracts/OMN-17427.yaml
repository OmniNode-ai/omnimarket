  - id: "dod-omn17427-ac187-terminal-cleanup-test-clock"
    description: "This PR scopes the terminal cleanup regression's timing to the deadline handed to the publisher session while retaining its 0.3 second allowance. The source check refuses the merge-base test, which measures the whole handle call. The focused runtime tests exercise both publish outcomes and background coroutine cancellation."
    source: "manual"
    binds_ac: ["AC187"]
    checks:
      - check_type: "command"
        check_value: |-
          python3 - <<'PY'
          import ast
          from pathlib import Path

          path = Path('tests/unit/nodes/node_event_emit_effect/test_session_deadline_omn17427.py')
          tree = ast.parse(path.read_text())
          test = next(node for node in tree.body if isinstance(node, ast.FunctionDef) and node.name == 'test_terminal_emit_close_uses_remaining_budget')
          statements = {ast.unparse(node) for node in ast.walk(test)}
          assert 'cleanup_after_budget = finished - session_deadlines[0]' in statements
          assert 'len(session_deadlines) == 1' in statements
          assert 'cleanup_after_budget < 0.3' in statements
          assert 'session_deadlines.append(deadline)' in statements
          assert 'real_session(deadline=deadline)' in statements
          print('terminal cleanup timing is bound to the recorded session deadline with the 0.3 second limit')
          PY
        cwd: "${OMNI_HOME}/omnimarket"
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/nodes/node_event_emit_effect/test_session_deadline_omn17427.py -q -n 0 --no-cov --refuse-skips"
