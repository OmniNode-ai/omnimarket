  - id: "req-terminal-emit-cleanup-deadline"
    statement: "Kafka session cleanup and thread handoff share the terminal emitter's invocation deadline, and a timed-out coroutine is cancelled on the shared event loop."
    acceptance:
      - id: "AC182"
        statement: "AC182: a terminal emit with a slow broker close caps cleanup by its remaining publish/drain deadline on both publish success and failure, keeps failed events spooled, and cancels the timed-out background coroutine -- falsifier: uv run pytest tests/unit/nodes/node_event_emit_effect/test_session_deadline_omn17427.py -q -n 0 --no-cov --refuse-skips fails at the merge base."
  - id: "req-declared-label-set-undeclared-backend"
