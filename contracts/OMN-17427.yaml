schema_version: "1.0.0"
ticket_id: "OMN-17427"
title: "A declared check that cannot reach gh for want of GH_TOKEN is recorded as not run, not FAIL"
summary: "The OCC receipt runner ran declared checks without GH_TOKEN, so a check starting with gh api exited 4 and was filed as a FAIL receipt though the behaviour never ran. Both runner steps now carry the job's own token, and exit 4 together with gh's missing-credential message is recorded as PENDING with exit_code null and listed under not_run, never failures."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-receipt-runner-gh-token"
    statement: |-
      The receipt runner must give declared checks the job's GH_TOKEN, and must record a check that failed only for want of that credential as not run rather than FAIL.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: exit status 4 with gh's missing-credential message is recorded as PENDING with exit_code null and reported under not_run; exit 4 alone, or the message with another exit code, stays FAIL; the workflow sets GH_TOKEN on both runner steps -- falsifier: uv run pytest tests/unit/scripts/test_occ_receipt_runner_gh_token_omn_17427.py -q
evidence_requirements:
  - kind: "tests"
    description: "The receipt runner GH_TOKEN tests pass."
    command: "uv run pytest tests/unit/scripts/test_occ_receipt_runner_gh_token_omn_17427.py -q"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-receipt-runner-gh-token-ac1"
    description: "The GH_TOKEN tests prove a missing credential is recorded as not run and a real exit 4 stays FAIL."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/scripts/test_occ_receipt_runner_gh_token_omn_17427.py -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC1"]
