      statement: 'AC4401: with GITHUB_TOKEN set, the gateway read client reports that the token resolves when asked from inside a running event loop -- falsifier: uv run pytest tests/unit/handlers/scm/test_handler_gateway_read_client.py -q -k token_that_resolves fails at the merge base and passes at the head.'
  - id: req-live-events-poison-quarantine
    statement: The live-events projection writer dead-letters a poison event to the contract's dlq topic and advances the offset instead of crash-looping, and projects a list-valued source as a string.
    acceptance:
    - id: AC21288
      statement: 'AC21288: an oversize snapshot delta and a validation error are published to the contract dlq topic and the offset is committed, a missing publisher holds the offset, and a list source projects a comma-joined string source row -- falsifier: the focused pytest fails at the merge base.'
