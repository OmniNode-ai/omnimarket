    command: "uv run pytest tests/nodes/node_linear_triage/test_omn_17427_sprint_and_secrets.py -q"
  - kind: "tests"
    description: "A summary is grounded within its complete report section and the diagnostic label survives the redactor."
    command: "uv run pytest tests/unit/delegation/test_omn17427_summary_report_grounding.py -q"
  - kind: "tests"
    description: "The unit isolation fixture clears the ambient ONEX_TENANT_ID and a delegation boundary failure yields one terminal."
    command: "uv run pytest tests/unit/delegation/test_ambient_tenant_id_scrubbed_omn17427.py -q"
