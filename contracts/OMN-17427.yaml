    description: "Hosted deploy probe. Exercise the checked-out product scorer with one dropped instruction and three retained tickets. The weighted score must be 0.25 while the original recall remains 0.75, and an empty window must remain unknown. The merge base refuses the weights input and cannot pass. No lab, broker, secret or external endpoint is required."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: |-
          uv run --frozen python -c '
          from omnimarket.nodes.node_compaction_loss_compute.handlers import HandlerCompactionLoss
          from omnimarket.nodes.node_compaction_loss_compute.models import ModelCompactionLossRequest
          body = {"session_id": "probe", "compaction_id": "probe", "pre_text": "OMN-1 OMN-2 OMN-3. Never delete the deployment receipts.", "pre_user_text": "Never delete the deployment receipts.", "post_summary": "OMN-1 OMN-2 OMN-3", "weights": {"operator_instruction": 9}}
          result = HandlerCompactionLoss().handle(ModelCompactionLossRequest.model_validate(body))
          assert result.weighted_recall == 0.25 and result.overall_recall == 0.75, result
          assert result.weights.operator_instruction == 9 and len(result.dropped) == 1, result
          empty = HandlerCompactionLoss().handle(ModelCompactionLossRequest(session_id="probe", compaction_id="empty", post_summary=""))
          assert empty.weighted_recall is None, empty
          print("weighted recall 0.25, original recall 0.75; empty recall unknown")'
