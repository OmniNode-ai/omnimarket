schema_version: "1.0.0"
ticket_id: "OMN-17427"
title: "The routing feedback reducer ignores an unusable latency instead of crashing the dispatcher"
summary: "A terminal event whose latency_ms was NaN or infinite raised out of the routing feedback reducer, and a boolean latency was counted as one millisecond. The reducer now treats a non-finite or boolean latency as no latency, so the event still counts and the running average is unchanged."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-unusable-latency"
    statement: |-
      A delegation terminal whose latency is not a real measurement must be counted without raising and without moving the running average latency.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: a completed terminal with latency_ms of NaN, positive or negative infinity, or a boolean is accumulated as an event with no latency (total_count advances, avg_latency_ms is unchanged) and handle() does not raise -- falsifier: uv run pytest tests/unit/routing/test_delegation_routing_feedback_reducer.py -k unusable_latency -q
evidence_requirements:
  - kind: "tests"
    description: "An unusable latency is counted as no latency and never raises."
    command: "uv run pytest tests/unit/routing/test_delegation_routing_feedback_reducer.py -k unusable_latency -q"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn17427-unusable-latency"
    description: "The reducer counts a NaN, infinite or boolean latency as no latency and does not raise."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/routing/test_delegation_routing_feedback_reducer.py -k unusable_latency -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC1"]
