schema_version: "1.0.0"
ticket_id: "OMN-17427"
title: "A local run states one saving on row and receipt, metering keys on the minted tenant, and the routing feedback reducer ignores an unusable latency"
summary: "The local delegation_events row priced its saving against a hardcoded Opus rate while the receipt priced it against the resolved baseline, and onex metering keyed metering_summary on the literal tenant local. The saving is now computed once against the resolved baseline and written to both the row and the receipt with its pinned counterfactual and manifest version, and metering reads the minted tenant identity and refuses when none exists. A terminal event whose latency_ms was NaN or infinite raised out of the routing feedback reducer, and a boolean latency was counted as one millisecond; the reducer now treats a non-finite or boolean latency as no latency, so the event still counts and the running average is unchanged."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
