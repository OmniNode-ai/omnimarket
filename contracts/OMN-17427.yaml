  - kind: "tests"
    description: "The planner rung's Qwen3.6-35B-A3B gets the vendor non-thinking request and the Qwen3.8-27B rungs keep theirs."
    command: "uv run pytest tests/unit/delegation/test_qwen3_6_35b_planner_vendor_sampling_omn17427.py -q"
  - kind: "tests"
    description: "A shadow-mode red-CI triage records its decision and publishes no start command."
    command: "uv run pytest tests/unit/nodes/node_pr_lifecycle_orchestrator/test_ci_red_triage.py -q -k shadow_mode"
  - kind: "tests"
    description: "Every lane-scoped node contract is owned by the main runtime profile only."
    command: "uv run pytest tests/test_omn17427_lane_scoped_contracts_main_profile.py -q"
  - kind: "tests"
    description: "Every bound pytest check in a repo contract names a test file or a tests directory."
    command: "uv run pytest tests/ci/test_contract_evidence_selector_names_file_omn17427.py -q"
  - kind: "tests"
    description: "The morning ground-state node wires without its overlay and refuses a run without one."
    command: "uv run pytest tests/nodes/node_morning_ground_state_orchestrator/test_overlay.py -q -k \"without_an_overlay or picks_the_overlay_up\""
  - kind: "tests"
    description: "The morning friction-sweep node wires without its overlay and refuses a run without one."
    command: "uv run pytest tests/nodes/node_morning_friction_sweep_orchestrator/test_overlay.py -q -k \"without_an_overlay or picks_the_overlay_up\""
  - kind: "tests"
    description: "A call re-aimed inside the effect and cancelled at its budget keeps its 429 rung and the call in flight on the terminal."
    command: "uv run pytest tests/unit/nodes/node_delegate_skill_orchestrator/test_budget_cancel_keeps_evidence.py -q -k re_aimed_inside_the_effect"
  - kind: "tests"
    description: "A retry on the customer route cancelled at its budget keeps the earlier 429 rung on the terminal."
    command: "uv run pytest tests/unit/nodes/node_delegate_skill_orchestrator/test_budget_cancel_keeps_evidence.py -q -k retry_on_the_customer_route"
  - kind: "tests"
    description: "The AC28 deploy probe is its one command check and binds no criterion; AC28 keeps the Codex headroom pytest."
    command: "uv run pytest tests/unit/structure/test_deploy_probe_evidence_binding_omn20864.py -q"
  - kind: "tests"
    description: "The Hostile Reviewer clones omniintelligence at the retry-budget revision."
    command: "uv run pytest tests/ci/test_hostile_reviewer_pin_retry_budget_omn17427.py -q"
  - kind: "tests"
    description: "The two whole-repo scans run at push and their ci.yml jobs run on every pull request."
    command: "uv run pytest tests/ci/test_prepush_test_leg_retired_omn18162.py -q -k only_the_type_check_remains"
  - kind: "tests"
    description: "The commit-stage hygiene hooks take the staged paths and keep a whole-tree caller job."
    command: "uv run pytest tests/unit/workflows/test_public_repo_hygiene_enforcement_omn20781.py tests/ci/test_precommit_ci_backstops_omn19612.py -q"
  - kind: "tests"
    description: "The morning phases refuse unroutable delegation with a typed error and run as bus lab work."
    command: "uv run pytest tests/nodes/node_morning_ground_state_orchestrator/test_phase_lab_work.py tests/nodes/node_morning_ground_state_orchestrator/test_bus_cycle.py -q"
