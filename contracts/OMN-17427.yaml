---
schema_version: "1.0.0"
ticket_id: "OMN-17427"
title: "A local run states one saving on row and receipt, metering keys on the minted tenant, and the routing feedback reducer ignores an unusable latency"
summary: "The local delegation_events row priced its saving against a hardcoded Opus rate while the receipt priced it against the resolved baseline, and onex metering keyed metering_summary on the literal tenant local. The saving is now computed once against the resolved baseline and written to both the row and the receipt with its pinned counterfactual and manifest version, and metering reads the minted tenant identity and refuses when none exists. A terminal event whose latency_ms was NaN or infinite raised out of the routing feedback reducer, and a boolean latency was counted as one millisecond; the reducer now treats a non-finite or boolean latency as no latency, so the event still counts and the running average is unchanged."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-one-saving"
    statement: |-
      A local run states one saving, computed once against the resolved baseline, on both the row and the receipt, and metering is keyed on the minted tenant.
    acceptance:
      - id: "AC5"
        statement: |-
          AC5: The local row's cost_savings_usd equals the receipt's and pins the counterfactual and manifest version it was priced against -- falsifier: the focused pytest finds a row saving that differs from the receipt, or a row without the counterfactual
      - id: "AC6"
        statement: |-
          AC6: onex metering keys metering_summary on the minted tenant id and refuses when none exists -- falsifier: the focused pytest finds a summary row keyed on the literal local, or a run with no identity that does not refuse
      - id: "AC8"
        statement: |-
          AC8: An inference call whose upstream keeps the body open with keep-alive bytes returns the typed timeout error at the contract ceiling, and a prompt chunked body inside the ceiling still returns its content -- falsifier: the focused pytest finds a call that outlives the ceiling, or a prompt body that is cut off
  - id: "req-infra-pin-0-38-64"
    statement: |-
      The omnibase-infra dependency floors and every literal CI sibling checkout of omnibase_infra must name the 0.38.64 release.
    acceptance:
      - id: "AC7"
        statement: |-
          AC7: the CI bus overlay parity workflow checks out omnibase_infra at v0.38.64 -- falsifier: uv run pytest tests/ci/test_ci_bus_overlay_parity.py -q -k TestParityWorkflowIsWired
  - id: "req-unusable-latency"
    statement: |-
      A delegation terminal whose latency is not a real measurement must be counted without raising and without moving the running average latency.
    acceptance:
      - id: "AC8"
        statement: |-
          AC8: a completed terminal with latency_ms of NaN, positive or negative infinity, or a boolean is accumulated as an event with no latency (total_count advances, avg_latency_ms is unchanged) and handle() does not raise -- falsifier: uv run pytest tests/unit/routing/test_delegation_routing_feedback_reducer.py -k unusable_latency -q
  - id: "req-swe-client-smoke-coverage"
    statement: |-
      The swe_discriminator model client and smoke runner are exercised offline by focused unit tests that block real HTTP.
    acceptance:
      - id: "AC9"
        statement: |-
          AC9: routing, transport, grading, aggregation and smoke CLI behaviour of the swe_discriminator client is asserted offline -- falsifier: uv run pytest tests/unit/delegation/test_swe_discriminator_model_client_smoke.py -q
  - id: "req-ab-runner-branches"
    statement: |-
      The delegation A/B runner handler's default HTTP adapter, model boundary and contract-output branches are pinned by tests.
    acceptance:
      - id: "AC10"
        statement: |-
          AC10: the delegation A/B runner handler branch tests pass, covering the default HTTP adapter, the refusal and timeout outcomes and the completed-output topic contract -- falsifier: uv run pytest tests/nodes/node_delegation_ab_runner/test_handler_delegation_ab_runner_branches.py -q
  - id: "req-hostile-clone-timeout"
    statement: |-
      The hostile reviewer's three sibling clone steps give each fetch attempt a budget at or above the measured fetch floor.
    acceptance:
      - id: "AC11"
        statement: |-
          AC11: each sibling clone attempt in hostile-reviewer.yml is wrapped in a timeout of at least 120 seconds -- falsifier: uv run pytest tests/ci/test_hostile_review_clone_timeout_omn17427.py -q fails on a 20 second budget
  - id: "req-fix-effect-dry-run"
    statement: |-
      A dry_run fix command reaches no adapter and posts no marker, so the landing orchestrator's shadow mode has no live side effect.
    acceptance:
      - id: "AC12"
        statement: |-
          AC12: a PR lifecycle fix command carrying dry_run reaches no injected adapter on any of the eight block reasons and calls no outcome reporter -- falsifier: uv run pytest tests/unit/nodes/node_pr_lifecycle_fix_effect/test_fix_effect_honours_dry_run.py -q fails at the merge base
  - id: "req-heal-repo-evidence-family"
    statement: |-
      The scheduled companion merge heal re-runs the repo-evidence dod-verify job and the Repo Evidence Dependency pollers that waited on a companion which merged afterwards.
    acceptance:
      - id: "AC13"
        statement: |-
          AC13: occ_companion_merge_heal.py admits repo-evidence / dod-verify and Repo Evidence Dependency under the pre-merge control -- falsifier: uv run pytest tests/ci/test_occ_companion_merge_heal_omn18812.py -q fails on the unfixed script
  - id: "req-unbound-local-model-probe"
    statement: |-
      The routing explain CLI reports every provider-local backend that the contract and overlay merge leaves with an endpoint but no model name, the binding the routing reducer refuses at dispatch.
    acceptance:
      - id: "AC14"
        statement: |-
          AC14: python -m omnimarket.cli.cli_explain_routing --fail-on-unbound-local exits 1 and names each local backend with endpoint_url set and blank model_name, and the probe flags exactly the backends _load_bifrost_endpoints refuses -- falsifier: uv run pytest tests/unit/delegation/test_unbound_local_model_probe_omn17427.py -q fails at the merge base
  - id: "req-linear-triage-sprint-scope"
    statement: |-
      The linear triage node sweeps only the declared sprint by default, preserves the sprint project filter on every page, and resolves its Linear credentials from the explicitly mapped secret store refs without falling back to ambient configuration.
    acceptance:
      - id: "AC15"
        statement: |-
          AC15: node_linear_triage refuses an unscoped sweep, keeps the sprint project filter on every page, and resolves declared secrets with no ambient fallback -- falsifier: uv run pytest tests/nodes/node_linear_triage/test_omn_17427_sprint_and_secrets.py -q fails at the merge base
  - id: "req-summary-report-grounding"
    statement: |-
      A summary is grounded against the complete report section it cites, and the generated authority label no longer collides with the secret redactor.
    acceptance:
      - id: "AC16"
        statement: |-
          AC16: a faithful BLOCKED summary whose host blockers sit on later lines of a contract-declared report section is grounded, a neighbouring report does not ground it, and the readable diagnostic survives the redactor -- falsifier: uv run pytest tests/unit/delegation/test_omn17427_summary_report_grounding.py -q fails at the merge base
  - id: "req-ambient-tenant-scrub"
    statement: |-
      The unit test isolation fixture clears the ambient ONEX_TENANT_ID, so a lane shell that exports it cannot change a delegation unit test's outcome.
    acceptance:
      - id: "AC17"
        statement: |-
          AC17: with ONEX_TENANT_ID exported by the shell, a unit test sees it unset and a delegation boundary failure yields exactly one ModelDelegationFailed terminal -- falsifier: uv run pytest tests/unit/delegation/test_ambient_tenant_id_scrubbed_omn17427.py -q fails at the merge base
  - id: "req-pg16-provision-bounded"
    statement: |-
      The PostgreSQL 16 server-tools step in every CI job that runs the native migration proofs skips apt when the runner image already has PG16 and bounds apt when it runs, so a stalled mirror cannot hold a test shard to its job timeout and lose its coverage artifact.
    acceptance:
      - id: "AC18"
        statement: |-
          AC18: the provision step in ci.yml jobs test and integration-guard and in nightly-full-suite.yml job shard has a step timeout of at most 15 minutes and runs apt-get update only inside the branch taken when the PG16 tools are absent, with the fail-closed binary checks after it -- falsifier: uv run pytest tests/ci/test_omn18693_native_postgres_ci_wiring.py -q fails at the merge base
      - id: "AC19"
        statement: |-
          AC19: .github/workflows/call-repo-evidence-gate.yml pins the omnibase_core receipt-gate reusable at 81b34fe91f995e75acd65694e81ecf2c385456a4, whose dod-verify job derives the OCC writer app's dependency-pin-only exemption from the head's diff, so a post-release version bump that changes only pyproject.toml project.version and uv.lock is exempt without an occ-autobind outcome -- falsifier: uv run pytest tests/ci/test_repo_evidence_writer_pin_only_repin_omn17427.py -q fails at the merge base
  - id: "req-qwen36-planner-vendor-sampling"
    statement: |-
      The .200 planner rung's served Qwen3.6-35B-A3B (qwen3.6-35b-a3b) gets the model card's non-thinking request for every class, while the Qwen3.8-27B rungs keep their measured request.
    acceptance:
      - id: "AC20"
        statement: |-
          AC20: every class the planner rung serves, and a class outside the qwen lists, sends top_p 0.8, top_k 20, min_p 0, presence_penalty 1.5, enable_thinking false and default temperature 0.7 for qwen3.6-35b-a3b, and Qwen3.8-27B planning sends only enable_thinking false -- falsifier: uv run pytest tests/unit/delegation/test_qwen3_6_35b_planner_vendor_sampling_omn17427.py -q fails at the merge base
  - id: "req-ci-red-triage-shadow"
    statement: |-
      With ci_red_triage.act false, the red-CI triage records its decision and publishes no pr-lifecycle start command, so a shadow triage starts no PR inventory on the operator's GitHub login.
    acceptance:
      - id: "AC21"
        statement: |-
          AC21: HandlerCiRedTriage with act false records each decision with action_applied false and evidence start=withheld:act=false and publishes no start command, and the contract default is act false -- falsifier: uv run pytest tests/unit/nodes/node_pr_lifecycle_orchestrator/test_ci_red_triage.py -q -k shadow_mode fails at the merge base
  - id: "req-lane-scoped-contracts-main-profile"
    statement: |-
      Every node contract that declares runtime_lanes belongs to the main runtime profile only, because no compose lane's effects runtime declares ONEX_RUNTIME_LANE and a lane-scoped contract owned by effects fails closed on discovery, which holds omninode-runtime-effects Docker-unhealthy.
    acceptance:
      - id: "AC22"
        statement: |-
          AC22: node_branch_claim_check_effect declares runtime_profiles [main] and every contract declaring runtime_lanes is owned by main only -- falsifier: uv run pytest tests/test_omn17427_lane_scoped_contracts_main_profile.py -q fails at the merge base
  - id: "req-bound-selector-names-file"
    statement: |-
      Every pytest check bound to an acceptance criterion in a repo contract names its target by a test file (or a tests directory), because the repo evidence gate refuses a bare directory selector and that refusal turns Tests (Split 2/20) red on every open pull request.
    acceptance:
      - id: "AC23"
        statement: |-
          AC23: every binds_ac pytest check in contracts/OMN-*.yaml names an existing .py file or a /tests directory, and dod-omn-20429-ac4 names the golden chain test file -- falsifier: uv run pytest tests/ci/test_contract_evidence_selector_names_file_omn17427.py -q fails at the merge base
  - id: "req-node-auto-wiring-in-process"
    statement: |-
      Every node's derived dispatch identifiers fit the limits ModelDispatchRoute declares, and every contract auto-wires in-process through the infra runtime's wire_from_manifest, on every pull request and before every release; the known exceptions are shrink-only.
    acceptance:
      - id: "AC24"
        statement: |-
          AC24: the gate reads each limit from ModelDispatchRoute's field metadata, derives ids with infra's own derivation, wires all contracts with a real container and the checked-in local topology, and fails on any unlisted failure or any listed contract that now passes -- falsifier: uv run pytest tests/unit/contracts/test_every_node_auto_wires_in_process_omn17427.py -q fails, or emptying either exception list leaves it green (the two 206-character judged route ids must fail)
