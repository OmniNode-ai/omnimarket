  - id: "req-compaction-build-phase-timings"
    statement: "The compaction build records its phase timings for the TA.12 latency qualification: the context-pack orchestrator times each tier's source read as read_ms, ModelContextPackBuilt.model_section_ms() sums the model-written tiers' reads, the compaction orchestrator times the pack build and carries build_ms on prepared and fallback receipts and model_section_ms on prepared, and ModelCompactionRoundTrip.from_prepared splits a prepared receipt into deterministic_build_ms and model_section_ms."
    acceptance:
      - id: "AC145"
        statement: "AC145: under an injected clock each bound tier's read_ms is the clock delta in milliseconds (an unbound tier None, a raising source still timed), the compaction orchestrator's prepared and fallback receipts carry the build's elapsed build_ms (None when the barrier fails before any build) and prepared carries the package's model_section_ms, and from_prepared gives deterministic_build_ms = build_ms - model_section_ms and refuses a missing timing or a model section longer than the build -- falsifier: the focused tests fail at the merge base, where 23 of them fail because read_ms, build_ms and from_prepared do not exist"
  - id: "req-claims-pending-index"
    statement: "The SQLite claim store carries a partial index over the pending delegate-skill command claims, added once by a store step, so the delegation reaper's pending-claims query reads the index instead of the whole table. The index changes no claim, terminal-slot or reap answer and deletes no row."
    acceptance:
      - id: "AC183"
        statement: "AC183: a fresh store and a store that predates the step both carry delegate_skill_command_claims_pending_idx after one SqliteDatabaseAdapter._connect(), the step is recorded once, and EXPLAIN QUERY PLAN of the adapter's pending-claims statement names the index; a read-only store that predates the step is read with one warning; through DelegationClaimPort over SqliteDatabaseAdapter a redelivered claim loses and is served the recorded terminal, one of two record_terminal calls wins, and stalled_claims returns exactly the overdue pending main claims, the same set as the store with the index dropped; the step leaves the claims row count unchanged (tests/unit/projection/test_omn17427_claims_pending_index.py) -- falsifier: the tests fail at the merge base, where the plan reads SCAN delegate_skill_command_claims with no index."
      - id: "AC185"
        statement: "AC185: a fresh store and a store that predates the step both carry delegate_skill_command_claims_correlation_idx after one SqliteDatabaseAdapter._connect(), the step is recorded once, and EXPLAIN QUERY PLAN of SELECT * FROM delegate_skill_command_claims WHERE correlation_id = :correlation_id names the index; DelegationClaimPort.pending_claims(correlation_id=...) returns the same claims with and without the index, for a correlation with exactly one pending delivery and for one reused by two deliveries, which answers an empty list (tests/unit/projection/test_omn17427_claims_pending_index.py) -- falsifier: the index tests fail at 2609fffacaa621dfe9222c33da3dd8faa447928f, where the plan reads SCAN delegate_skill_command_claims; the pending_claims test fails when the results with and without the index differ."
  - id: "req-tick-roll-up-shared-red"
    statement: "The throughput tick's repository status names the real failing check as the unowned shared red, not a roll-up check (CI Summary, ci, CI Tests Gate) that is red only because that check failed."
    acceptance:
      - id: "AC183"
        statement: "AC183: _repo_verdict counts a roll-up check only for a PR whose reds are all roll-ups, so two PRs red on CI Summary and repo-evidence / dod-verify name repo-evidence / dod-verify, two PRs red on CI Summary alone still name CI Summary, and CI Summary shared only through PRs that each carry another red is no shared red -- falsifier: uv run pytest tests/nodes/node_throughput_tick_decision_compute/test_repo_status_throughput_tick_decision_compute.py -q -k roll_up fails at the merge base, where the node names CI Summary"
  - id: "req-retention-run-budget"
    statement: "A scheduled retention run never holds the runtime's event loop for a whole backlog: it yields after a time budget and resumes the backlog on a short retry."
    acceptance:
      - id: "AC182"
        statement: "AC182: a scheduled retention run ends after the first committed batch that finishes past schedule.max_run_seconds (always after one batch), reports backlog_remaining, and the next tick resumes after backlog_retry_seconds instead of run_interval_seconds -- falsifier: uv run pytest tests/nodes/test_omn17427_retention_cleanup_batched.py -q -n 0 --no-cov -k 'budget or backlog or retry' fails at the merge base, where a run drains to max_batches in one call and the next tick waits the full interval."
      - id: "AC186"
        statement: "AC186: the runtime entry point of NodeRetentionCleanup is handle_async, which runs the run in a worker thread so the event loop keeps running while a batch blocks, and a tick that arrives while a run holds its thread is skipped, not queued -- falsifier: uv run pytest tests/nodes/test_omn17427_retention_cleanup_batched.py -q -n 0 --no-cov -k 'handle_async or event_loop_free or skipped_not_queued' fails at the merge base, where the runtime calls the synchronous handle on its loop."
  - id: "req-install-canary-provisioned-python"
    statement: "Both install-canary jobs keep the Python that setup-uv provisioned when they cross the clean-home boundary, so uv resolves the selected interpreter instead of a system or downloaded one."
    acceptance:
      - id: "AC187"
        statement: "AC187: the canary and planted-bad-pin self-test jobs pass UV_PYTHON and UV_PYTHON_INSTALL_DIR into their isolated install environment, and the real uv finds the selected Python offline from that environment -- falsifier: the workflow interpreter selection cases fail on the base with KeyError UV_PYTHON."
  - id: "req-pack-orchestrator-source-order"
    statement: "The context-pack orchestrator gives each artifact its position in its tier's source result as source_priority, so a pack carries a tier's entries in the order the source answered them rather than in content-hash order."
    acceptance:
      - id: "AC184"
        statement: "AC184: a tier source answering five open_work rows in forward, reversed or shuffled order yields a built pack whose rendered text carries the rows in that same order -- falsifier: uv run pytest tests/nodes/node_context_pack_orchestrator/test_handler_context_pack_orchestrator.py -q -k source_order fails at the merge base, where every artifact keeps the default source_priority 100 and the builder orders a tier's chunks by hash"
  - id: "req-cc0130-committed-contract"
    statement: "The CC0130 migration makes the OMN-13213 ticket contract resolvable from an immutable commit in the product repository."
    acceptance:
      - id: "AC4301"
        statement: "AC4301: the real ticket-contract prerequisite handler resolves OMN-13213 from HEAD's Git blob without a failure; a working-tree-only copy cannot satisfy it -- falsifier: uv run pytest tests/test_omn17427_cc0130_committed_contract.py -q fails at the merge base, whose commit carries no contracts/OMN-13213.yaml."
  - id: "req-emit-publish-circuit"
    statement: "One slow node_event_emit_effect publish no longer spools healthy publishes: the publish-backoff marker is an on-disk circuit for the publish identity that counts consecutive failed invocations, opens only at unreachable_failure_threshold (default 3) for unreachable_backoff_seconds (default 30, 0 disables), probes after the window, closes on any successful publish or drained backlog record, ignores quarantines, reads an old-shape, malformed or other-identity marker as no failures, retries a clean circuit's retryable current-event publish once within the shared 9 s budget, and reports publish_failure_count and publish_circuit_open on ModelEmitResult."
    acceptance:
      - id: "AC184"
        statement: "AC184: after one failed invocation a new handler on the same spool publishes and drains the first record; with threshold 3 invocations 1 to 3 attempt a publish and invocation 4 inside the window attempts none and returns publish_skipped_unreachable=True and publish_circuit_open=True; a success deletes the marker and resets the count; a probe after the window re-opens on failure with a fresh opened_at and on success drains the backlog in the same invocation; a first-call TimeoutError on a clean circuit is retried once to published=True under the 9 s budget, and not retried with a recorded failure or under 1 s left; an old failed_at, malformed or other-identity marker never blocks; a zero window writes no marker and reports publish_failure_count None; a quarantine leaves the count unchanged -- falsifier: uv run pytest tests/unit/nodes/node_event_emit_effect/test_publish_circuit_omn17427.py -q fails at the merge base (13 of 17 fail), where one failure spools every later publish for 120 s"
  - id: "req-moved-contract-omn13213"
    statement: "contracts/OMN-13213.yaml is carried in omnimarket, where the scheduled closer's contract resolver reads it, and loads as omnibase_core's ModelTicketContract with the role placeholder in its branch name."
    acceptance:
      - id: "AC186"
        statement: "AC186: contracts/OMN-13213.yaml loads as ModelTicketContract with ticket_id OMN-13213 and its one dod_evidence item, and names the branch <operator>/omn-13213-d-reclassify-node_emit_daemon-effect-node -- falsifier: uv run pytest tests/ci/test_moved_contract_omn13213_omn17427.py -q fails at the merge base, where the contract is absent"
  - id: "req-tick-base-red-own-branch"
    statement: "The throughput tick's base-branch red counts only check runs whose workflow run belongs to the base branch, and names the real failing check rather than a roll-up, so a release push of the base sha to another branch does not make the base branch read red."
    acceptance:
      - id: "AC186"
        statement: "AC186: _base_red ignores a check row whose workflow run the branch record's runs rows place on another head branch, keeps a row whose run is unlisted, and returns the non-roll-up reds when any exist -- falsifier: uv run pytest tests/nodes/node_throughput_tick_decision_compute/test_repo_status_throughput_tick_decision_compute.py -q -k 'another_branchs_run or base_red_roll_up_beside' fails at the merge base, where a main-push run's CI Summary failure on the dev sha reads as base_branch_red and the verdict names CI Summary"
  - id: "req-step-by-step-prevent-ensure-purpose"
    statement: "The step_by_step_explanation check accepts a correct causal answer walked through with a prevented or ensured result (\", preventing\", \" and preventing\", \", ensuring\", \", meaning\", \" which prevents\") or a purpose clause (\" to ensure that\", \" to prevent\"), and still vetoes an answer that asserts without explaining."
    acceptance:
      - id: "AC188"
        statement: "AC188: the fifteen correct causal answers in tests/unit/delegation/test_step_by_step_causal_prevent_ensure_omn19401.py, nine of them verbatim Qwen3.8-27B answers from a lab model server, pass step_by_step_explanation, and the seven non-explanations, including \"Preventing outages is the goal\", \"the ensuing outage\" and \"meaningful names\", are still vetoed -- falsifier: uv run pytest tests/unit/delegation/test_step_by_step_causal_prevent_ensure_omn19401.py -q fails at the merge base"
  - id: "req-create-ticket-pillar-lane-refusal"
    statement: "node_create_ticket refuses --pillar for a pillar whose owner map entry declares assignable_by_lanes false when the caller is a lane (ONEX_LANE or ONEX_REMOTE_LANE, a subagent session, or a headless session), before the ticket-creation guard records anything; an interactive operator session, a pillar without the flag and a ticket with no pillar are unchanged."
    acceptance:
      - id: "AC188"
        statement: "AC188: a lane's create request, and its dry run, naming a pillar whose entry sets assignable_by_lanes false raises refused for a lane with no assignee and no guard input; an interactive session assigns that owner, a lane assigns an unflagged pillar's owner, a lane with no pillar files under the creator, and handler_lane_intake.lane_caller answers the pillar hook's test over eight environments (tests/nodes/node_create_ticket/test_pillar_lane_refusal.py) -- falsifier: uv run pytest tests/nodes/node_create_ticket/test_pillar_lane_refusal.py -q fails at the merge base, where lane_caller does not exist and the file cannot be collected"
  - id: "req-c28-consumer-flow-writer-throughput"
    statement: "The in-process consumer-flow writer reuses one dispatch loop and pool across heartbeats and concurrent dispatch threads, and batches one heartbeat's deltas without losing ordering or replay refusals."
    acceptance:
      - id: "AC187"
        statement: "AC187: twenty heartbeats open one pool, eight concurrent dispatch threads share one loop and pool, a 477-delta heartbeat uses at most five statements, and a 120-pair heartbeat lands every pair in input order through the real PostgreSQL writer with an older replay refused row by row -- falsifier: the focused consumer-flow dispatch and real-PostgreSQL write-path tests fail when the writer creates a loop per message or replaces its batched statements with per-delta writes."
  - id: "req-morning-phase-tools-only-session"
    statement: "A morning phase agent runs as a tools-only session: claude -p with every built-in tool off, exactly one strict MCP server granted as mcp__<server>, dontAsk permission mode and no setting sources, and the morning orchestrator's tools gateway gives each phase only its declared deterministic typed tools, refusing a phase with no tool set before any session starts."
    acceptance:
      - id: "AC188"
        statement: "AC188: handler_agent_session.py --tools-only builds a session with --tools \"\" and one --strict-mcp-config server, refuse_unless_tools_only exits 65 on a shell, a wider grant, a second or foreign server, bypass or acceptEdits modes, or added directories, settings, agents or plugins, no catalog tool takes a command or a free path, the MCP server lists and runs only the phase's tools, and HandlerMorningPhaseTools refuses a phase with no tool set and a committing phase while session-goal has none -- falsifier: uv run pytest tests/nodes/node_morning_ground_state_orchestrator/test_morning_phase_tools_guard.py tests/nodes/node_morning_ground_state_orchestrator/test_agent_session_boundary.py -q -n 0 --no-cov -p no:randomly fails at the merge base, where the tools package, the gateway and the tools-only transport do not exist"
  - id: "req-in-process-evidence-outcome-verdict"
    statement: "An accepted in-process onex delegate run's delegation_events row states operational_outcome completed and content_verdict usable, as the runtime terminal of an accepted run does, because on that path only the local port's evidence terminal reaches the projection and the bus, and it named neither; a failed in-process run states neither, since the payload does not carry which gate branch refused it."
    acceptance:
      - id: "AC188"
        statement: "AC188: LocalDelegationDispatchPort._project_evidence with quality_passed true publishes operational_outcome completed and content_verdict usable and the delegation projection writes both onto the row; with quality_passed false the payload names neither and the row is not completed/usable -- falsifier: uv run pytest tests/unit/nodes/node_delegate_skill_orchestrator/test_in_process_evidence_outcome_verdict_omn19448.py -q fails at the merge base, where the evidence payload has no operational_outcome"
  - id: "req-job-log-window-and-step-reads"
    statement: "The job_log_tail gateway read (onex scm job-log) can read a bounded window of a job log at a byte offset or the region of one named step, besides the last 64 KiB tail, with paging offsets on the result."
    acceptance:
      - id: "AC187"
        statement: "AC187: job_log_tail with offset_bytes keeps exactly [offset, offset+length) of the log and reports total_bytes, start_offset and next_offset; with step it keeps exactly that step's timestamped lines, refuses an unknown step with the job's step names, and returns an empty result for a skipped step after one call; length_bytes without offset_bytes or step is refused; a plain tail read keeps its old fields; the CLI passes --offset-bytes, --length-bytes and --step into the request -- falsifier: uv run pytest tests/nodes/node_github_repo_gateway_effect/test_github_repo_gateway_scm_reads.py -q -k 'job_log or read_window or step_second' fails at the merge base, where github_landing/github_log_window.py and the window fields are absent"
  - id: "req-sqlite-open-releases-lock-on-failure"
    statement: "Both local SQLite opens (SqliteDatabaseAdapter._connect and the BYOK credential adapter's _connect) close their connection when a setup step raises, so a failed open never keeps the delegation store locked in a long-lived process such as the review gateway."
    acceptance:
      - id: "AC189"
        statement: "AC189: an open whose store step raises after BEGIN IMMEDIATE, and a credential open whose commit is refused by a reader's SHARED lock, each leave the store free for a BEGIN IMMEDIATE with timeout 0 while the raised exception is still referenced -- falsifier: uv run pytest tests/unit/projection/test_sqlite_connect_releases_lock_on_failure_omn17427.py -q fails at the merge base, where the refused connection keeps RESERVED"
  - id: "req-terminal-emit-test-cleanup-clock"
    statement: "The terminal emitter regression test measures cleanup from the shared session deadline, so topic resolution, enrichment and durable spool writes do not consume its cleanup allowance."
    acceptance:
      - id: "AC187"
        statement: "AC187: test_terminal_emit_close_uses_remaining_budget records exactly one publisher session deadline and asserts finished minus that deadline is below 0.3 seconds; both publish outcomes retain the spool and cancellation assertions, and the background-loop cancellation case passes. The source assertion check fails on the merge base, which times the whole handle call."
  - id: "req-unstated-outcome-pair"
    statement: "A delegation_events row whose terminal states neither operational_outcome nor content_verdict, and whose stored row states neither, carries the pair its own terminal evidence decides: completed/usable for an evidenced success (terminal_ok, a model and an accepted rung), the pair its cause maps to for a typed failure. A stated pair is never replaced, and the async writer reconciles a first write the way the sync writer does."
    acceptance:
      - id: "AC190"
        statement: "AC190: through both projection writers a harness-shaped or local delegate-skill success that declares no pair stores completed/usable, a first-written timeout, provider_error or quality_gate_refused failure stores the pair outcome_for_failure_cause gives, a canonical completed/correct survives a later unpaired success, and an unevidenced success, a non-terminal event, a causeless failure and a half-stated pair are left unchanged (tests/test_omn19448_unstated_outcome_pair.py) -- falsifier: the 7 writer tests fail at the merge base with KeyError operational_outcome, where both columns stay unnamed"
  - id: "req-morning-report-phase-tools"
    statement: "The six morning report phases have phase-owned deterministic typed tools, local readbacks and guarded effects, with actionable ledger refusals and bounded child-process lifetimes."
    acceptance:
      - id: "AC4303"
        statement: "AC4303: all six report phases declare their own lane, ticket and tool guide; the server exposes only the phase's typed tools with no command or free-path input; watcher, ledger and artifact readbacks preserve their scope; publishing refuses a dry run; a refused TERMINAL includes the ledger's reason and records friction once; and a timed-out program leaves no running child -- falsifier: the focused morning report phase and tool guard tests fail against the merge-base implementation."
  - id: req-owner-summary-facts
    statement: Owner-summary facts reads the watcher merges and queue, ledger lane outcomes and M4 rows, omits watcher
      authors, and names unreadable sources in errors.
    acceptance:
    - id: AC4351
      statement: 'AC4351: Owner-summary facts reads the watcher merges and queue, ledger lane outcomes and M4 rows,
        omits watcher authors, and names unreadable sources in errors. Falsifier: the focused golden-chain owner-summary
        tests fail when this behavior is absent.'
  - id: req-owner-summary-draft
    statement: Draft check refuses missing footer, over 420 words, token-shaped secrets, home paths, fabricated ticket/PR,
      missing M4 line, and a Friction heading when its data is unavailable.
    acceptance:
    - id: AC4352
      statement: 'AC4352: Draft check refuses missing footer, over 420 words, token-shaped secrets, home paths, fabricated
        ticket/PR, missing M4 line, and a Friction heading when its data is unavailable. Falsifier: the focused golden-chain
        owner-summary tests fail when this behavior is absent.'
  - id: req-owner-summary-watermark
    statement: Watermark has 12-hour default, last sent start, 48-hour cap and facts/check/mark-sent CLI round trip.
    acceptance:
    - id: AC4353
      statement: 'AC4353: Watermark has 12-hour default, last sent start, 48-hour cap and facts/check/mark-sent CLI
        round trip. Falsifier: the focused golden-chain owner-summary tests fail when this behavior is absent.'
  - id: req-owner-summary-coverage
    statement: Draft check requires M4, blocked and partial tickets, the facts' counts, headline,
      unconfirmed-running statement, friction gap and Gaps section. Merged changes, merged-only
      tickets and closed work runs may be omitted only with exact counts by class or outcome
      and the full list link on one Not listed line immediately above the footer.
    acceptance:
    - id: AC4354
      statement: 'AC4354: Draft check accepts counted omissions of merged changes, merged-only tickets
        and closed work runs, refuses missing or wrong omission counts or full list link, and still
        requires M4, blocked and partial tickets, counts, headline, unconfirmed-running statement,
        friction gap and Gaps section. Cited changes stay beside their tickets; shorthand, overclaims
        and unsupported superlatives are refused. Facts supply every non-dependency merged change
        and its class. Falsifier: the focused coverage and omitted-line tests fail without these behaviors.'
  - id: req-owner-summary-review-triage
    statement: Reviewer triage separates explicitly counted omissions from actionable findings.
    acceptance:
    - id: AC4357
      statement: 'AC4357: Recorded review lines about correctly counted omitted changes, merged-only
        tickets and closed work runs are NAMED-OMISSION. Wrong facts, required tickets and omissions
        with incorrect counts remain FINDING. The triage CLI exits nonzero for actionable findings
        and zero for only named omissions or APPROVE. Falsifier: the recorded-findings, wrong-facts,
        incorrect-count and triage CLI tests fail without these behaviors.'
  - id: req-shard-plan-record-freshness
    statement: The committed per-file durations record names all but a handful of the test files, so the shard planner does not weight unrecorded files at the median.
    acceptance:
    - id: AC4400
      statement: 'AC4400: config/test_file_durations.json leaves fewer than 50 test files unrecorded -- falsifier: uv run pytest tests/unit/test_ci_shard_plan_record_freshness_omn17427.py -q fails at the merge base (162 unrecorded) and passes at the head (6).'
  - id: req-gateway-token-under-running-loop
    statement: A host whose GitHub token resolves reads PR facts in process when the read runs under a running event loop, as dod_verify does.
    acceptance:
