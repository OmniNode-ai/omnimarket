        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC152"]
  - id: "dod-omn17427-canonical-baseline-deploy-probe"
    description: "Hosted-runner deploy check of the checked-out package: replaying a canonical completion after runtime_shutdown through both delegation writers retains the baseline that priced its saving. The same command fails at the merge base with a null counterfactual. This is a package regression probe, not a claim of live deployment or historical-row repair."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: "uv run pytest tests/unit/nodes/node_projection_delegation/test_canonical_savings_counterfactual_omn20303.py -q -n 0 --no-cov -k 'test_sync_canonical_saving_keeps_counterfactual or test_async_canonical_keeps_counterfactual_after_shutdown'"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn17427-claude-token-pool-unit"
    description: "Account rotation, reset, all-limited alarm, secret-free metadata and CLI refusal paths run against a temporary local secret store. The test file and node are absent at the merge base."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_claude_token_pool_effect/test_claude_token_pool.py -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC71"]
  - id: "dod-omn17427-claude-token-pool-golden-chain"
    description: "The CLI walks add, resolve, mark-limited, all-limited and reset through the contract-declared handler with fake tokens. The test file and node are absent at the merge base."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_claude_token_pool_effect/test_golden_chain_claude_token_pool_effect.py -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC71"]
  - id: "dod-omn17427-claude-token-pool-deploy-probe"
    description: "Deploy probe. The hosted runner reads the subject commit's token-pool contract, handler and CLI using git and Python's standard library. The merge base has no node. This checks the artifact and does not attest a live deployment."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: |-
          python3 - <<'PY'
          import ast
          import subprocess

          root = "src/omnimarket/nodes/node_claude_token_pool_effect/"
          def committed(path):
              return subprocess.check_output(["git", "show", "HEAD:" + root + path], text=True)

          contract = committed("contract.yaml")
          assert "class: HandlerClaudeTokenPool" in contract
          assert "input_model: omnimarket.nodes.node_claude_token_pool_effect.models.model_claude_token_pool.ModelClaudeTokenPoolRequest" in contract
          handler = ast.parse(committed("handlers/handler_claude_token_pool.py"))
          pool = next(node for node in handler.body if isinstance(node, ast.ClassDef) and node.name == "HandlerClaudeTokenPool")
          assert {"handle", "_add", "_resolve", "_mark"} <= {node.name for node in pool.body if isinstance(node, ast.FunctionDef)}
          cli = ast.parse(committed("__main__.py"))
          assert {"main", "_pasted"} <= {node.name for node in cli.body if isinstance(node, ast.FunctionDef)}
          print("Claude token pool artifact probe: PASS")
          PY
  - id: "dod-omn17427-claude-pool-revoked-unit"
    description: "A revoked token is skipped, the good token resolves after one mark, the alert is raised once, a forced re-add clears it, and a pool with no usable token raises the ALARM, against a temporary local secret store. The revoked tests fail at the merge base."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_claude_token_pool_effect/test_claude_token_pool.py -q -k 'revoked or revocation'"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC101"]
  - id: "dod-omn17427-claude-pool-revoked-deploy-probe"
    description: "Deploy probe. The hosted runner reads the subject commit's token-pool handler and CLI using git and Python's standard library and checks the mark_revoked operation and the mark-revoked verb. The merge base has neither. This checks the artifact and does not attest a live deployment."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: |-
          python3 - <<'PY'
          import ast
          import subprocess

          root = "src/omnimarket/nodes/node_claude_token_pool_effect/"
          def committed(path):
              return subprocess.check_output(["git", "show", "HEAD:" + root + path], text=True)

          handler = ast.parse(committed("handlers/handler_claude_token_pool.py"))
          pool = next(node for node in handler.body if isinstance(node, ast.ClassDef) and node.name == "HandlerClaudeTokenPool")
          assert "_revoke" in {node.name for node in pool.body if isinstance(node, ast.FunctionDef)}
          assert '"mark_revoked"' in committed("models/model_claude_token_pool.py")
          assert '"mark-revoked"' in committed("__main__.py")
          print("Claude token pool revoked-token artifact probe: PASS")
          PY
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn17427-context-compaction-task-class-unit"
    description: "The context_compaction task class is internal, never resolved from a prompt, budgeted, has a reachable ladder, is accepted by both delegation request models, and is listed once on each summarization-shaped inference protocol profile. The protocol-profile tests fail at the merge base."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/delegation/test_context_compaction_task_class_omn17427.py tests/unit/inference/test_task_class_authority_omn15651.py -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC184"]
  - id: "dod-omn17427-context-compaction-deploy-probe"
    description: "Deploy probe. The hosted runner reads the subject commit's task-class contract and delegation request model using git, PyYAML and Python's standard library and checks the context_compaction class, its budget, its Literal member and its listing on the cloud-glm-no-think, cloud-glm-5-3-thinking and openrouter-reasoning-minimal-excluded inference protocol profiles. The merge base lists it on none of those three profiles. This checks the artifact and does not attest a live deployment."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: |-
          python3 - <<'PY'
          import subprocess
          import yaml

          def committed(path):
              return subprocess.check_output(["git", "show", "HEAD:" + path], text=True)

          contracts = yaml.safe_load(committed("src/omnimarket/configs/task_class_contracts.v1.yaml"))
          entry = contracts["task_classes"]["context_compaction"]
