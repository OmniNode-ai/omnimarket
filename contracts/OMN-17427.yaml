    description: "Deploy probe. The checked-out commit contains the five compatibility tests, both recorded infra pins and both recorded TOML fixtures. Python's standard library parses the committed files on the hosted runner without sibling clones or lab services; the merge base has no compatibility test module."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: |-
          python3 - <<'PY'
          import ast
          import subprocess
          import tomllib

          def committed(path):
              return subprocess.check_output(["git", "show", "HEAD:" + path], text=True)

          tree = ast.parse(committed("tests/ci/test_core_pin_compat_omn17427.py"))
          names = {node.name for node in tree.body if isinstance(node, ast.FunctionDef)}
          assert {
              "test_recorded_incident_pair_is_refused",
              "test_floor_at_or_below_the_infra_pin_is_accepted",
              "test_recorded_infra_pins_include_the_incident_pin",
              "test_project_dependency_floor_fits_the_newest_infra_pin",
              "test_override_floor_fits_the_newest_infra_pin",
          } <= names
          pins = next(node for node in tree.body if isinstance(node, ast.AnnAssign) and getattr(node.target, "id", "") == "INFRA_CORE_PINS")
          assert ast.literal_eval(pins.value) == (("44542e2a0", "0.47.44"), ("291f2f747", "0.47.46"), ("d20586c7d", "0.47.48"))
          root = "tests/ci/fixtures/pin_compat/"
          requirement = tomllib.loads(committed(root + "omnimarket_v0.4.316_core_requirement.toml"))
          infra = tomllib.loads(committed(root + "omnibase_infra_44542e2a0_core_pin.toml"))
          assert "omnibase-core>=0.47.46,<0.48.0" in requirement["project"]["dependencies"]
          assert "omnibase-core==0.47.44" in infra["tool"]["uv"]["override-dependencies"]
          print("core pin compatibility deploy probe: PASS")
          PY
        cwd: "${OMNI_HOME}/omnimarket"
