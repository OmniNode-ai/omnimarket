dod_evidence:
  - id: dod-fill-runs-dry
    description: "Green unlanded PRs provide one landing lane per repository while holds, owners and blocked outcomes stay gated; SCM reads the sibling clone."
    source: manual
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/unit/handlers/scm/test_onex_scm_clone_reads.py tests/nodes/node_throughput_tick_decision_compute/test_pr_land_fallback_throughput_tick_decision_compute.py -q"
    binds_ac: [AC1742701]
  - id: "dod-omn17427-metering-envelope-postgres"
    description: "AC161: drive both synchronous command entry points against real PostgreSQL and read back the tenant, windows, run count, token counts and timestamp. Refuse skips so an unavailable database cannot count as proof."
    source: manual
    binds_ac: ["AC161"]
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/test_omn17427_metering_store_refresh_real_postgres.py -k runtime_envelope_context_persists_summary -q --no-cov -p no:randomly --refuse-skips"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn17427-metering-envelope-deploy-probe"
    description: "Deploy probe. On the hosted runner, exercise both packaged command entry points with the runtime's envelope keys and assert refreshed tenants and folded row counts. Restoring the fixed context-name list fails validation. Needs only this checkout and locked test dependencies, without a broker, database or credentials. This is a packaged runtime-path probe, not a live deployment attestation."
    source: manual
    checks:
      - check_type: command
        check_value: "env PYTHONDONTWRITEBYTECODE=1 uv run pytest tests/nodes/node_projection_metering_summary/test_omn17427_store_refresh.py::test_the_envelope_context_the_runtime_adds_is_not_payload -q --no-cov -p no:randomly --refuse-skips"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn17427-terminal-cleanup-deadline"
    description: "Slow-close fault injection reproduces the receipt delay on publish success and failure; both deadline cases and the orphaned coroutine control fail at the merge base. Current publication and failed-event durability remain asserted."
    source: "manual"
    binds_ac: ["AC182"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/nodes/node_event_emit_effect/test_session_deadline_omn17427.py -q -n 0 --no-cov --refuse-skips"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn17427-terminal-cleanup-deploy-probe"
    description: "Hosted deployment check: exercise the packaged terminal emitter with its real background event loop and a local slow-close broker. It fails at the base without network or service access. This is a runtime-path check, not a live deployment attestation."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: "uv run pytest tests/unit/nodes/node_event_emit_effect/test_session_deadline_omn17427.py -q -n 0 --no-cov --refuse-skips"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn17427-ac141-canonical-baseline"
    description: "OMN-20303 AC3 failed its live readback: a runtime_shutdown terminal followed by a canonical completion produced a saving but no stored counterfactual. The regression covers both write paths, terminal orders, an originally pinned baseline, and failed/zero-token controls. It fails at the merge base; post-deploy AC3 readback remains required."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/nodes/node_projection_delegation/test_canonical_savings_counterfactual_omn20303.py -q -n 0 --no-cov"
        cwd: "${OMNI_HOME}/omnimarket"
      - check_type: "test_passes"
