  - id: "req-retire-remaining-change-control-paths"
    statement: "Evidence stays in the product repository and no companion writer or observer is registered."
  - id: "req-cli-run-node-on-expected-missing-list"
    statement: "A node that is run as a CLI and has no onex.nodes entry point is named on the dogfood inventory's expected-missing list, so the inventory check reports no unexplained directory."
  - id: "req-patch-apply-dispatch"
    statement: "The patch apply dispatch workflow lives in the portable node package, with typed bus ingress and host-configured registry, runner and ledger writer."
  - id: "req-gateway-pr-text-cross-repository"
