  - id: "req-dev-cause-lane-receiver"
    statement: "A dev cause-lane request that node_pr_lifecycle_orchestrator publishes for a red landing-branch head reaches a node that starts one cause lane per dispatch key, so ruling 2026-10-14T03:57:46Z item 5 (a component alarm starts a fix lane) has a receiver."
  - id: "req-lab-sli-alerts-board"
    statement: "The lab's own operations have service-level indicators, each with a target, a window, its own severity and its action held as contract data; a collector reads them from existing sources, an alert node acts per severity deduplicated per indicator, and a board renders each indicator with its trend from the kept history."
  - id: "req-rehome-operator-access-mode-and-silent-failure-alarm"
    statement: "The operator access mode effect node and the silent-failure alarm compute node live in the portable node package with their contracts, handlers and focused tests, so the internal copies can be repointed and deleted after a release."
  - id: "req-review-lab-rubric-measured"
    statement: "The review task class records the lab model's measured adequacy against the lab-first bar."
  - id: "req-rehome-leaf-nodes-s2"
    statement: "The friction synthesis and host thermal observe nodes live in omnimarket with their contracts, handlers, models and tests."
  - id: "req-lab-fill-repeat-limit"
    statement: "Lab-fill stops re-dispatching a ticket whose last repeat_limit lanes all ended blocked, partial or no-op: the cooldown no longer releases it, and only a change to the ticket or its pull requests does, for ordinary tickets and for DoD-verify lanes alike."
  - id: "req-summarization-word-limit"
    statement: "A summarization answer longer than the word limit its prompt states is refused by the delegation quality gate."
  - id: "req-hostile-reviewer-overflow-deadline-pin"
    statement: "The Hostile Reviewer clones omniintelligence at the revision whose overflow endpoint is bounded by the vote deadline, not by its chunk share, and skips an endpoint that already failed over in the same vote."
  - id: "req-rehome-automation-liveness-overlay-check"
    statement: "The automation-liveness overlay completeness check lives in the portable node package; the private overlay data stays in the private repository and is passed in by path."
  - id: "req-ci-summary-sweep-provenance-and-unreadable-runs"
    statement: "CI Summary's external sweep reads a check-run's Actions run id from its check suite when its URLs carry none, and an unreadable or malformed workflow-runs file exempts nothing instead of crashing the gate."
  - id: "req-rehome-lab-secret-store-and-worktree-audit"
    statement: "The lab secret-store override and the legacy worktree audit run as omnimarket nodes with their behaviour, refusals and console scripts unchanged."
  - id: "req-rehome-lab-nodes-slice-3"
    statement: "The hourly tick effect, the lab disk growth effect and the lab fill receipt table compute live in the portable node package with their handlers, contracts and bus topics."
  - id: "req-ruling-guard-paths-spelled"
    statement: "The park ladder handler and the operator capture handlers are spelled by path in a required lint step and a pre-commit hook, so the ruling audit reads the rulings they carry as wired."
  - id: "req-hostile-reviewer-codex-fallback"
    statement: "When a hostile-reviewer run's requested review routes produce no review output, the review runs on the Codex route the node contract declares, the completed event records which engine reviewed and which routes it replaced, and a run where no engine reviewed returns FAILED instead of a clean pass."
  - id: "req-dead-occ-observers-deleted"
    statement: "The two report-only OCC observer nodes that no workflow, bus producer or node calls are deleted from omnimarket, so their change-control repository slugs and clone paths leave the code."
  - id: "req-served-model-cache-reconciliation"
    statement: "Both inference boundaries refresh a cached served-model mismatch before refusing a call after a provider replaces its model, and retain the refusal when the refresh is unreadable or still mismatches."
  - id: "req-delegate-skill-trace-id-stored"
    statement: "delegation_events.trace_id is written from the delegate-skill terminal's own trace_id by both projection writers, and a later terminal that carries none keeps the stored value."
  - id: "req-evidence-comment-class"
    statement: "A done-evidence comment is drafted on the lab rung as the internal evidence_comment task class, and a draft that cites an identifier absent from the lane report, skips or reorders a criterion, or restates a criterion as its evidence is refused before use."
  - id: "req-release-staleness-dev-merge-tags"
    statement: "Release staleness counts commits reached by immutable dev merge tags as published while preserving the age limit for untagged packaged commits."
  - id: "req-brief-drafting-class"
    statement: "Lane brief drafting is a task class on the lab Qwen rung alone, accepted only by the brief checker, with the shell parts of a brief filled by code and a refusal in a shell part regenerated by code instead of sent back to the model."
  - id: "req-context-pack-model-roles-declared"
    statement: "The context-pack model roles that omnibase-core 0.47.48 admits on the delegation wire are declared task classes, so the shipped lane_brief, lane_brief_section, session_start and per_prompt profiles resolve with the packaged routing contract and no test fixture."
  - id: "req-pinned-pack-case-scope"
    statement: "A pinned context-pack build names its replay case to the tier sources as case:<manifest_case>, the one pinned mode scope the session source reads, and sends no session: scope beside it, so the pinned session read is reachable from the orchestrator."
  - id: "req-anthropic-protocol-variant-registration"
    statement: "An explicitly selected protocol variant does not trigger billing-plan detection during ordinary Anthropic credential registration."
  - id: "req-rehome-runtime-deploy-effect"
    statement: "The runtime deploy effect node lives in the portable node package with its contract, handlers and focused tests, so the internal copy can be repointed and deleted after a release."
  - id: "req-metering-shared-lane-refresh"
    statement: "On a shared lane every tenant with delegation_events gets metering_summary rows: a delegation terminal and a contract-declared runtime-tick schedule publish a refresh command naming tenants and days, and the metering projection reads each tenant's runs under its own row-level-security context and folds them, because a fold request carrying a large tenant's runs exceeds the bus's 1 MiB message limit."
  - id: "req-dev-push-reuse-queue-off"
    statement: "A dev push is admitted by the queue tree pass whenever a merge_queue rule is active on dev, and while none is active the verdict passes with a warning instead of failing every dev push."
  - id: "req-shard-record-names-the-tree"
    statement: "The committed shard duration record names at least 95% of the discovered test files again, so the shard plan test and its pre-commit hook pass on dev."
  - id: "req-step-by-step-causal-connectives"
    statement: "The step_by_step_explanation check accepts a correct causal explanation walked through with a connective outside the six OMN-19401 shipped, matched only at the start of a word, and still vetoes an answer that asserts without explaining."
  - id: "req-step-by-step-causal-lab-answers"
    statement: "The step_by_step_explanation check accepts a correct short causal answer from a lab delegation walked through with a causative verb (cause, makes, lead to, result in) or a result clause after a comma, and still vetoes an answer that asserts without explaining."
  - id: "req-closer-gateway-loop-and-box-ticks"
    statement: "The gateway read client answers from under a running event loop, and the closer's decide_ticket names the description with exactly the acceptance boxes dod_verify verified ticked, holding open a ticket whose box no verified check covers."
  - id: "req-private-hosted-minutes-watch"
    statement: "Once a day, one read of the organization's billing usage for the month sums GitHub-hosted Actions minutes per repository and per UTC day, appends one ledger STATUS row for the day, and raises one alert through the alert channel when any repository used any billed hosted minute that day."
  - id: "req-sibling-dev-tag-provenance"
    statement: "A registered internal sibling can use its own dev merge tag without a suppression, and foreign sources, branches, raw revisions and malformed tags do not qualify."
  - id: "req-landing-stall-liveness"
    statement: "A stall the landing controller holds (a red cause, a red base branch, an open plugin version bump) is a typed transition that the automation-liveness watchdog judges against a bus-event overlay deadline, so a hold past its bound opens one episode, raises one alarm carrying the cause, the repository, the minutes and the last decision text, and clears when it moves."
  - id: "req-compaction-adapter-invocation-and-verdict"
    statement: "The Claude Code hook adapter mints a fresh invocation_id for every invocation and carries it on the command through the @invocation_id argument source, and the context_compaction_verdict compute installs a compaction reply only when the echoed invocation_id is the adapter's own and its messages hash to the echoed installed_messages_hash; any other reply is native."
  - id: "req-compaction-pack-build-over-pack-orchestrator"
    statement: "The compaction orchestrator's package build has a live port over the context-pack orchestrator: it requests the compaction_orchestrator profile at the command's session barrier for the envelope tenant, installs the built package with the pack's identities, and falls back pack_build_failed on any failed or incomplete build."
  - id: "req-pack-orchestrator-tier-source-binding"
    statement: "The context-pack orchestrator resolves the source node for each tier from its contract's context_tier_sources block, so its zero-argument runtime construction reads operator_rulings, open_work, orchestration_state, operator_words_unrecorded, repo_state, lane_rules and architecture_patterns from their source nodes instead of answering every tier unavailable."
  - id: "req-emit-one-kafka-connection"
    statement: "One node_event_emit_effect invocation publishes its own fan-out records and drains its spool backlog over one Kafka connection, opened at the first publish and closed when the invocation ends; a failed publish drops that connection so the next record opens a fresh one, and a publish outside an invocation still opens and closes its own."
  - id: "req-omn20303-canonical-savings-counterfactual"
    statement: |-
      A canonical completion that produces a saving keeps its token-derived premium counterfactual on the delegation row even when the outer handler ended during runtime shutdown; an originally pinned counterfactual takes precedence.
  - id: "req-compaction-receipts-fold"
    statement: "The compaction receipts fold derives one state per candidate, per activation and per invocation from the set of prepared, activated, fallback, installed, install-mismatch and install-uncertain receipts received, independent of their order and duplicates."
  - id: "req-onex-models-lists-the-catalogue"
    statement: "onex models offers every provider the BYOK customer catalogue lets a customer route a key to, so z.ai's general API (glm) is listed, added and tested through the catalogue's own row, and no endpoint is written into the setup code."
  - id: "req-compaction-loss-weights"
    statement: "The context-service lane's scorer-weights follow-up adds an auditable weighted recall without rewriting the original survival evidence. This slice does not qualify TA.12 latency, install the TA.15 binding, or close the parent integration-pass acceptance."
  - id: "req-in-process-evidence-trace-and-timing"
    statement: "An in-process onex delegate run's delegation_events row stores the command's trace_id, the measured queue wait and the measured execution time, because on that path only the local port's evidence terminal reaches the projection and the bus, and it carried none of the three."
  - id: "req-customer-ledger-in-memory-bus"
    statement: "A customer running OmniNode locally has a work ledger on the in-memory event bus: ledger row events written through the work-ledger emit handler reach an in-memory reader that answers the same query verbs as the lab database reader (RULING 2026-10-19T21:47:42Z)."
  - id: "req-emit-unreachable-backoff"
    statement: "When a node_event_emit_effect publish by one Kafka publish identity (bootstrap servers, security protocol and SASL user, never the password) fails as retryable, later invocations by that identity within the backoff window spool their event and attempt no publish, so an in-process delegate or GLM harness run no longer waits out the 5 s publish cap on a broker it cannot reach; any publish that succeeds clears the backoff, and an adapter with no identity is never backed off."
  - id: "req-compaction-latency-runner"
    statement: "The TA.12 latency qualification has a runner in the hook adapter node: HandlerCompactionLatencyRun drives the adapter in process over recorded PreCompact hook inputs with a compaction binding it supplies (not installed in Claude Code), cold trips on a fresh receipt-mode client each with its construction timed and warm trips on one shared client after a discarded warm-up, records each trip's wall time and the prepared receipt's split into deterministic_build_ms and model_section_ms, and records a refusal instead of a number for a missing or inconsistent timing or an adapter failure."
  - id: "req-delegation-rung-keeps-time-for-next-rung"
    statement: "The in-process delegation ladder bounds each rung by the run's remaining budget less the task class's declared next-rung reserve, so a slow or rejected local rung hands off to the next rung inside the run budget instead of ending the run."
  - id: "req-context-pack-cite-first-allocator"
    statement: "When the required tiers of a context pack are over budget, the cited entries of every trimmable tier are charged first and only the uncited remainder is shared equally, so a pack whose cited entries fit the budget is built even when one tier's cited entries exceed an equal share; with no citations the selection is unchanged."
  - id: "req-delegate-skill-routing-columns-stored"
    statement: "delegation_events.routed_model and answering_backend are written from the delegate-skill terminal's accepting attempt by both projection writers, and a later terminal that carries none keeps the stored values."
  - id: req-ingress-contract-io-terminal
    statement: An ingress contract I/O failure returns a correlated failure before any provider call, and both runtime dispatch ports can consume it on its declared canonical topic.
  - id: "req-pool-host-advertises-lane-guards"
    statement: "A pool host's bus capacity advertisement carries a lane-guard:<sha256> entry in its tools for each installed lane guard whose bytes hash to the sha256 that names its directory, so placement can refuse a host that would exit 78 LANE-GUARD-MISSING in seconds; a host with no guard, an altered copy or a misnamed directory advertises none."
  - id: "req-delegation-target-adapters"
    statement: "The existing delegation call effect owns the target adapters (model-call, claude-code, codex, claude-glm) and consumes canonical lab job submissions through runtime routing; harnesses are adapters inside the one effect node and everything else is a handler (operator RULING 2026-10-20T11:52:25Z)."
  - id: "req-ticket-contract-schema-hook"
    statement: "A ticket contract that omnibase_core's ModelTicketContract refuses is caught by a pre-commit hook before the push, by the same validation CI's Contract Compliance Check runs."
  - id: req-omn20303-harness-counterfactual-readback
    statement: A harness terminal whose token-derived saving is projected keeps the same saving and its premium counterfactual in the delegation projection.
  - id: "req-compaction-latency-command-boundary"
    statement: "The TA.12 runner replays a command accepted by the compaction orchestrator, preserves the recorded input identity and model choice, and counts only adapter install verdicts as phase measurements. This prerequisite does not qualify live latency or enable the TA.15 binding."
  - id: req-delegation-terminal-complete-readback
    statement: The existing terminal migrations and both projection writers are verified together, and lab failure-cause proof refuses an empty window.
  - id: req-qwen-tool-call-experiment
    statement: |-
      Report the fixed local Qwen tool-call experiment without shipping a tool-loop implementation or claiming completion of the umbrella integration-pass ticket.

  - id: "req-rehome-landing-tlc-receipt-effect"
    statement: "The landing controller's model-check (TLC) receipt is built and installed by an omnimarket node: publish builds the receipt from a TLC results directory with the controller's own gate and refuses on any violation, and sync installs a published archive into the landing state directory only after the installed gate re-checks it, whole or not at all."
  - id: "req-evidence-wait-per-verifier-run"
    statement: "Every Repo Evidence Dependency poller gives each repo-evidence / dod-verify run its own wait window, so an edited event that restarts the pull_request_target verifier late in the wait no longer times the poller out while the new run is still verifying, and one stuck run still fails closed at its deadline."
  - id: "req-terminal-emit-cleanup-deadline"
    statement: "Kafka session cleanup and thread handoff share the terminal emitter's invocation deadline, and a timed-out coroutine is cancelled on the shared event loop."
  - id: "req-declared-label-set-undeclared-backend"
    statement: "A declared label set on a backend that does not declare json_schema support sends no provider directive, still refuses an out-of-vocabulary label and records the refusal in attempts, and a payload that omits the new wire fields is read as undeclared."
  - id: "req-compaction-build-phase-timings"
    statement: "The compaction build records its phase timings for the TA.12 latency qualification: the context-pack orchestrator times each tier's source read as read_ms, ModelContextPackBuilt.model_section_ms() sums the model-written tiers' reads, the compaction orchestrator times the pack build and carries build_ms on prepared and fallback receipts and model_section_ms on prepared, and ModelCompactionRoundTrip.from_prepared splits a prepared receipt into deterministic_build_ms and model_section_ms."
  - id: "req-claims-pending-index"
    statement: "The SQLite claim store carries a partial index over the pending delegate-skill command claims, added once by a store step, so the delegation reaper's pending-claims query reads the index instead of the whole table. The index changes no claim, terminal-slot or reap answer and deletes no row."
  - id: "req-tick-roll-up-shared-red"
    statement: "The throughput tick's repository status names the real failing check as the unowned shared red, not a roll-up check (CI Summary, ci, CI Tests Gate) that is red only because that check failed."
  - id: "req-retention-run-budget"
    statement: "A scheduled retention run never holds the runtime's event loop for a whole backlog: it yields after a time budget and resumes the backlog on a short retry."
  - id: "req-install-canary-provisioned-python"
    statement: "Both install-canary jobs keep the Python that setup-uv provisioned when they cross the clean-home boundary, so uv resolves the selected interpreter instead of a system or downloaded one."
  - id: "req-pack-orchestrator-source-order"
    statement: "The context-pack orchestrator gives each artifact its position in its tier's source result as source_priority, so a pack carries a tier's entries in the order the source answered them rather than in content-hash order."
  - id: "req-cc0130-committed-contract"
    statement: "The CC0130 migration makes the OMN-13213 ticket contract resolvable from an immutable commit in the product repository."
  - id: "req-emit-publish-circuit"
    statement: "One slow node_event_emit_effect publish no longer spools healthy publishes: the publish-backoff marker is an on-disk circuit for the publish identity that counts consecutive failed invocations, opens only at unreachable_failure_threshold (default 3) for unreachable_backoff_seconds (default 30, 0 disables), probes after the window, closes on any successful publish or drained backlog record, ignores quarantines, reads an old-shape, malformed or other-identity marker as no failures, retries a clean circuit's retryable current-event publish once within the shared 9 s budget, and reports publish_failure_count and publish_circuit_open on ModelEmitResult."
  - id: "req-moved-contract-omn13213"
    statement: "contracts/OMN-13213.yaml is carried in omnimarket, where the scheduled closer's contract resolver reads it, and loads as omnibase_core's ModelTicketContract with the role placeholder in its branch name."
  - id: "req-tick-base-red-own-branch"
    statement: "The throughput tick's base-branch red counts only check runs whose workflow run belongs to the base branch, and names the real failing check rather than a roll-up, so a release push of the base sha to another branch does not make the base branch read red."
  - id: "req-step-by-step-prevent-ensure-purpose"
    statement: "The step_by_step_explanation check accepts a correct causal answer walked through with a prevented or ensured result (\", preventing\", \" and preventing\", \", ensuring\", \", meaning\", \" which prevents\") or a purpose clause (\" to ensure that\", \" to prevent\"), and still vetoes an answer that asserts without explaining."
  - id: "req-create-ticket-pillar-lane-refusal"
    statement: "node_create_ticket refuses --pillar for a pillar whose owner map entry declares assignable_by_lanes false when the caller is a lane (ONEX_LANE or ONEX_REMOTE_LANE, a subagent session, or a headless session), before the ticket-creation guard records anything; an interactive operator session, a pillar without the flag and a ticket with no pillar are unchanged."
  - id: "req-c28-consumer-flow-writer-throughput"
    statement: "The in-process consumer-flow writer reuses one dispatch loop and pool across heartbeats and concurrent dispatch threads, and batches one heartbeat's deltas without losing ordering or replay refusals."
  - id: "req-morning-phase-tools-only-session"
    statement: "A morning phase agent runs as a tools-only session: claude -p with every built-in tool off, exactly one strict MCP server granted as mcp__<server>, dontAsk permission mode and no setting sources, and the morning orchestrator's tools gateway gives each phase only its declared deterministic typed tools, refusing a phase with no tool set before any session starts."
  - id: "req-in-process-evidence-outcome-verdict"
    statement: "An accepted in-process onex delegate run's delegation_events row states operational_outcome completed and content_verdict usable, as the runtime terminal of an accepted run does, because on that path only the local port's evidence terminal reaches the projection and the bus, and it named neither; a failed in-process run states neither, since the payload does not carry which gate branch refused it."
  - id: "req-job-log-window-and-step-reads"
    statement: "The job_log_tail gateway read (onex scm job-log) can read a bounded window of a job log at a byte offset or the region of one named step, besides the last 64 KiB tail, with paging offsets on the result."
  - id: "req-sqlite-open-releases-lock-on-failure"
    statement: "Both local SQLite opens (SqliteDatabaseAdapter._connect and the BYOK credential adapter's _connect) close their connection when a setup step raises, so a failed open never keeps the delegation store locked in a long-lived process such as the review gateway."
  - id: "req-terminal-emit-test-cleanup-clock"
    statement: "The terminal emitter regression test measures cleanup from the shared session deadline, so topic resolution, enrichment and durable spool writes do not consume its cleanup allowance."
  - id: "req-unstated-outcome-pair"
    statement: "A delegation_events row whose terminal states neither operational_outcome nor content_verdict, and whose stored row states neither, carries the pair its own terminal evidence decides: completed/usable for an evidenced success (terminal_ok, a model and an accepted rung), the pair its cause maps to for a typed failure. A stated pair is never replaced, and the async writer reconciles a first write the way the sync writer does."
  - id: "req-morning-report-phase-tools"
    statement: "The six morning report phases have phase-owned deterministic typed tools, local readbacks and guarded effects, with actionable ledger refusals and bounded child-process lifetimes."
  - id: req-owner-summary-facts
    statement: Owner-summary facts reads the watcher merges and queue, ledger lane outcomes and M4 rows, omits watcher
      authors, and names unreadable sources in errors.
  - id: req-owner-summary-draft
    statement: Draft check refuses missing footer, over 420 words, token-shaped secrets, home paths, fabricated ticket/PR,
      missing M4 line, and a Friction heading when its data is unavailable.
  - id: req-owner-summary-watermark
    statement: Watermark has 12-hour default, last sent start, 48-hour cap and facts/check/mark-sent CLI round trip.
  - id: req-owner-summary-coverage
    statement: Draft check requires M4, blocked and partial tickets, the facts' counts, headline,
      unconfirmed-running statement, friction gap and Gaps section. Merged changes, merged-only
      tickets and closed work runs may be omitted only with exact counts by class or outcome
      and the full list link on one Not listed line immediately above the footer.
  - id: req-owner-summary-review-triage
    statement: Reviewer triage separates explicitly counted omissions from actionable findings.
  - id: req-shard-plan-record-freshness
    statement: The committed per-file durations record names all but a handful of the test files, so the shard planner does not weight unrecorded files at the median.
  - id: req-gateway-token-under-running-loop
    statement: A host whose GitHub token resolves reads PR facts in process when the read runs under a running event loop, as dod_verify does.
  - id: req-live-events-poison-quarantine
    statement: The live-events projection writer dead-letters a poison event to the contract's dlq topic and advances the offset instead of crash-looping, and projects a list-valued source as a string.
  - id: "req-pr4543-rebuild-amd64-runner"
    statement: "The runtime rebuild caller selects the immutable reusable revision carrying the arch-amd64 publisher runner label and passes the merge identity and overlay credentials."
  - id: "req-pr4543-first-party-dev-merge-tags"
    statement: "Workflow references to our own repositories are dev-merge tags, and the pin check is omnibase_core's check-action-pins reading this repository's overlay."
  - id: "req-one-fix-one-pr"
    statement: "A lane about to open a pull request is refused when an open pull request in the same repository already changes the same lines, or the same file under the same title words, or cites the same check or cause, or when another lane holds a live CLAIM with the same cause= cell; the refusal names the pull request to adopt, and a source the check cannot read opens nothing."
  - id: "req-ledger-facts-quoted-cause"
    statement: "The landing ledger facts compute reads a quoted CLAIM cause cell as its quoted text and reports an owner the model refuses instead of raising."
  - id: "req-core-dev-tag-repoint"
    statement: "omnimarket resolves omnibase_core at its dev merge tag dev-20261030152335-66d35d2283c3 and omnibase_infra at dev-20261030213019-091013fd7adb, and the callers of the handler modules those releases moved run the new node homes."
  - id: "req-host-reconcile-owns-schedule"
    statement: "The host reconcile node owns its schedule: its contract declares an hourly repair-mode run, its overlay declares which hosts run the reconciler and what schedules it on each, the package names no host, and a host that declares the reconciler with no scheduler fails by name."
  - id: "req-terminal-wait-excludes-route-discovery"
    statement: "The pre-dispatch failure terminal test runs the runtime port's real route discovery before its terminal wait, so the 10 second deadline times only dispatch and the terminal, not the cold parse of every node contract."
  - id: "req-pr4603-shared-budget-readback"
    statement: "The delegation budget projection uses the infra revision that declares its relation and grants, and the readback measures shared projection rows instead of host-local receipts by default."
  - id: "req-pr4640-test-bus-lane"
    statement: "Integration tests use the broker from the declared test lane and refuse any other lane before constructing a producer."
  - id: "req-core-infra-pins-move-together"
    statement: "omnimarket pins omnibase_core at dev-20261031000524-fc6159b98026 and omnibase_infra at dev-20261031054837-4284f5bf5587, whose own omnibase-core pin is that same tag, so the sibling sources resolve to one core."
  - id: "req-core-5bb91ae7e720-infra-pair"
    statement: "omnimarket pins omnibase_core at dev-20261031202655-5bb91ae7e720 and omnibase_infra at dev-20261101125736-3f93a2cc6f6c (omnibase_infra#5536), whose own omnibase-core pin is that same tag, so the newest reachable core resolves to one source and the core-only bot bumps omnimarket#4652 to #4740 are superseded."
  - id: "req-live-unread-publickey-fix"
    statement: "A lab-headroom UNKNOWN line whose live admission probe was refused by SSH public-key authentication names the hop owner adding the launching host's key as its FIX, since rerunning the tick reads the same refused hop; any other unreadable probe keeps the rerun advice."
  - id: "req-lab-host-row-ssh-route"
    statement: "A lab host table whose rows declare the login, the jump host or the key file of their ssh destination (ssh_user, proxy_jump, ssh_identity) is read by lab placement, not refused whole, and a value ssh could read as an option is refused."
  - id: "req-live-unread-receipt-owner-and-reader"
    statement: "A lab-headroom UNKNOWN line for an unreadable host leads with the owner action the probe receipt's LAUNCHER-GAP tag names, says a rerun clears nothing for any gap the launcher recorded (auth refused, name unresolved, sshd refused, no route), and sends the operator to the hosts-probe receipt readings, the read_pool reading the tick itself used, instead of the listing onex_lab_run.py --hosts prints."
  - id: "req-pr5134-safety-pin-bounded-retry"
    statement: "The Dependency Security Scan installs a pinned safety and retries only a transient exit-1 crash a bounded number of times while a real finding fails at once."
  - id: "req-lock-security-floors"
    statement: "uv.lock holds multidict and mako at versions outside the affected ranges of the advisories the Dependency Security Scan reports, so the scan passes on dev."
  - id: "req-auto-wiring-batch-publish-only-tail"
    statement: "A bounded auto-wiring batch that holds only contracts the runtime never dispatches wires nothing and is not reported as a smoke failure."
    acceptance:
      - id: "AC1742790"
        statement: "AC1742790: a wiring batch whose every contract is skipped for declaring no event_bus.subscribe_topics passes the batch smoke check, while a batch that wired nothing with an unskipped contract still fails -- falsifier: tests/unit/contracts/test_every_node_auto_wires_in_process_omn17427.py::test_a_publish_only_tail_batch_is_not_a_smoke_failure fails at the merge base, where the bare total_wired > 0 assertion reds the batch"
  - id: "req-command-wrapped-pytest-binds-its-file"
    statement: "A dod_evidence check whose check_type is command and whose command runs uv run pytest over an existing repo test file binds that file, so evidence that has to prepare its own environment first is not read as unbound and does not red every open pull request of the repository."
    acceptance:
      - id: "AC2249601"
        statement: "AC2249601: contract_binds_violations reads the pytest argv inside a wrapper command check and binds the file it names, and still refuses a wrapper that runs no pytest and one naming a path not in the tree -- falsifier: tests/ci/test_repo_evidence_caller_workflow.py::test_contract_binds_accepts_a_command_that_wraps_uv_run_pytest fails at the merge base, where only test_passes checks are parsed"
