---
schema_version: "1.0.0"
ticket_id: "OMN-17427"
title: "A local run states one saving on row and receipt, metering keys on the minted tenant, and the routing feedback reducer ignores an unusable latency"
summary: "The local delegation_events row priced its saving against a hardcoded Opus rate while the receipt priced it against the resolved baseline, and onex metering keyed metering_summary on the literal tenant local. The saving is now computed once against the resolved baseline and written to both the row and the receipt with its pinned counterfactual and manifest version, and metering reads the minted tenant identity and refuses when none exists. A terminal event whose latency_ms was NaN or infinite raised out of the routing feedback reducer, and a boolean latency was counted as one millisecond; the reducer now treats a non-finite or boolean latency as no latency, so the event still counts and the running average is unchanged."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-wip-admission"
    statement: "New work is refused while the started-but-unlanded count is at the repository's or the fleet's limit; a fix-forward and a ticket creation are never refused by count, and the limits are Little's law from a measured landing rate."
  - id: req-fill-runs-dry
    statement: "Green unlanded PRs provide one landing lane per repository while holds, owners and blocked outcomes stay gated; SCM reads the sibling clone."
  - id: "req-metering-envelope-context"
    statement: "The metering writer separates underscore-prefixed dispatch context from command payloads before validating either refresh or fold commands."
  - id: "req-one-saving"
    statement: |-
      A local run states one saving, computed once against the resolved baseline, on both the row and the receipt, and metering is keyed on the minted tenant.
  - id: "req-infra-pin-0-38-64"
    statement: |-
      The omnibase-infra dependency floors and every literal CI sibling checkout of omnibase_infra must name the 0.38.64 release.
  - id: "req-unusable-latency"
    statement: |-
      A delegation terminal whose latency is not a real measurement must be counted without raising and without moving the running average latency.
  - id: "req-swe-client-smoke-coverage"
    statement: |-
      The swe_discriminator model client and smoke runner are exercised offline by focused unit tests that block real HTTP.
  - id: "req-ab-runner-branches"
    statement: |-
      The delegation A/B runner handler's default HTTP adapter, model boundary and contract-output branches are pinned by tests.
  - id: "req-hostile-clone-timeout"
