schema_version: "1.0.0"
ticket_id: "OMN-22326"
title: "node_broker_acl_reconcile_effect stops executing the argv a bus request carries"
summary: >-
  The broker ACL reconcile request model no longer declares reconcile_command, and
  the model forbids extra cells, so a request that carries one is refused before the
  handler or any subprocess runs. The handler takes the program only from the
  environment command the contract names. The operator entry point loses its
  --reconcile-command override.
is_seam_ticket: false
interface_change: true
interfaces_touched: [events, protocols]
requirements:
  - id: "req-argv-from-operator-config"
    statement: "The executable of the broker ACL reconcile comes only from trusted operator configuration, never from the transported request."
    acceptance:
      - id: "AC1"
        statement: "A request that carries reconcile_command is refused before any subprocess runs, and the argv comes only from the configured environment command -- falsifier: uv run pytest tests/nodes/node_broker_acl_reconcile_effect -v -rs -k request_command"
      - id: "AC2"
        statement: "The request model no longer declares reconcile_command -- falsifier: uv run pytest tests/nodes/node_broker_acl_reconcile_effect -v -rs -k model_fields"
evidence_requirements:
  - kind: "tests"
    description: "Request refusal before any subprocess, argv from the environment command only, and the model fields."
    command: "env PYTHONDONTWRITEBYTECODE=1 uv run pytest tests/nodes/node_broker_acl_reconcile_effect/test_request_command_is_never_executed.py tests/test_golden_chain_broker_acl_reconcile_effect.py -q --no-cov"
dod_evidence:
  - id: "dod-omn22326-request-command"
    description: "A request carrying reconcile_command is refused before any subprocess; the argv comes only from the environment command."
    source: "manual"
    binds_ac: ["AC1"]
    checks:
      - check_type: "test_passes"
        check_value: "env PYTHONDONTWRITEBYTECODE=1 uv run pytest tests/nodes/node_broker_acl_reconcile_effect/test_request_command_is_never_executed.py -v -rs -k request_command --no-cov"
  - id: "dod-omn22326-model-fields"
    description: "The request model no longer declares reconcile_command."
    source: "manual"
    binds_ac: ["AC2"]
    checks:
      - check_type: "test_passes"
        check_value: "env PYTHONDONTWRITEBYTECODE=1 uv run pytest tests/nodes/node_broker_acl_reconcile_effect/test_request_command_is_never_executed.py -v -rs -k model_fields --no-cov"
  - id: "dod-omn22326-deploy-source-readback"
    description: "Hosted-runner source-artifact readback compares the published request model and handler at the evaluated revision with this checkout, then checks that the model has no reconcile_command field and that the handler takes its command from the operator environment. This probe covers the published source artifact; live broker ACL state is outside its scope."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: |
          set -eu;
          readback_dir="$(mktemp -d)";
          trap 'rm -rf "$readback_dir"' EXIT;
          revision="$(git rev-parse HEAD)";
          model=src/omnimarket/models/broker_acl_reconcile.py;
          handler=src/omnimarket/nodes/node_broker_acl_reconcile_effect/handlers/handler_broker_acl_reconcile.py;
          for path in "$model" "$handler"; do
            curl --fail --silent --show-error --location --max-time 30 \
              "https://raw.githubusercontent.com/OmniNode-ai/omnimarket/$revision/$path" \
              --output "$readback_dir/$(basename "$path")";
            cmp "$path" "$readback_dir/$(basename "$path")";
          done;
          ! grep -Eq '^[[:space:]]+reconcile_command[[:space:]]*:' "$readback_dir/$(basename "$model")";
          grep -F 'command = shlex.split(self._environ.get(settings["reconcile_command_env"], ""))' "$readback_dir/$(basename "$handler")";
          printf 'ACL reconcile source readback matched %s\n' "$revision"
  - id: "dod-omn22326-integration-proof"
    description: "The pushed head ran the reconcile node's request, model and golden-chain tests on a lab host with real git and its real dependencies and exited 0. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check."
    source: "manual"
    execution_scope: "local_done_gate"
    checks:
      - check_type: "command"
        check_value: "uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha \"$(git rev-parse HEAD)\" --lane fix-22326-1140 -- uv run --frozen pytest tests/nodes/node_broker_acl_reconcile_effect tests/test_golden_chain_broker_acl_reconcile_effect.py -q --no-cov"
        cwd: "."
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
