---
schema_version: "1.0.0"
ticket_id: "OMN-21944"
title: "Move routing helpers and escalation models to canonical package locations"
summary: "Ten routing helper modules move to handlers/routing and two escalation models move to models/routing. Importers use those locations, and the helpers still resolve the packaged configuration files under omnimarket/configs."
is_seam_ticket: false
interface_change: true
interfaces_touched:
  - "public_api"
requirements:
  - id: "req-omn21944-canonical-routing"
    statement: "Routing helpers and escalation models use canonical package locations while preserving routing behavior and packaged configuration resolution."
    acceptance:
      - id: "AC1"
        statement: "The moved routing policy helper and escalation models import through handlers/routing and models/routing, and policy validation and escalation precedence retain their behavior."
      - id: "AC2"
        statement: "The relocated tier resolver retains packaged-default resolution, deployment overlay precedence and explicit pin precedence, and delegation provenance retains the routing tiers hash."
      - id: "AC3"
        statement: "Customer-key termination and BYOK plan detection retain typed refusals and provider selection through the relocated routing helpers."
evidence_requirements:
  - kind: "tests"
    description: "Focused policy, escalation, packaged path, provenance and BYOK regressions using the moved module imports."
    command: "uv run pytest tests/unit/test_routing_policy_helpers.py tests/nodes/node_delegation_escalation_decision_compute/test_escalation_precedence.py tests/unit/routing/test_routing_tiers_node_overlay_omn20935.py tests/unit/delegation/test_omn15628_routing_tiers_hash.py tests/test_omn17082_customer_key_terminus.py tests/test_byok_plan_detection.py -q --no-cov"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn21944-canonical-imports"
    description: "Policy and escalation tests import the canonical routing modules and exercise validation and precedence."
    source: "manual"
    binds_ac: ["AC1"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/test_routing_policy_helpers.py tests/nodes/node_delegation_escalation_decision_compute/test_escalation_precedence.py -q --no-cov"
        cwd: "."
  - id: "dod-omn21944-packaged-paths"
    description: "The moved tier resolver preserves packaged defaults, overlay and pin precedence, and config provenance."
    source: "manual"
    binds_ac: ["AC2"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/routing/test_routing_tiers_node_overlay_omn20935.py tests/unit/delegation/test_omn15628_routing_tiers_hash.py -q --no-cov"
        cwd: "."
  - id: "dod-omn21944-customer-routing"
    description: "The customer terminus and BYOK plan detector preserve customer-key behavior and typed refusals after relocation."
    source: "manual"
    binds_ac: ["AC3"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/test_omn17082_customer_key_terminus.py tests/test_byok_plan_detection.py -q --no-cov"
        cwd: "."
  - id: "dod-omn21944-integration-proof"
    description: "Run the moved routing helpers with their real installed package dependencies on a lab host. The hosted verifier does not run this local Done check."
    source: "manual"
    execution_scope: "local_done_gate"
    checks:
      - check_type: "command"
        check_value: 'onex lab-work run --bus-lane dev --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-omn21944 --kind test -- env PYTHONDONTWRITEBYTECODE=1 COMPOSE_PROJECT_NAME=landing-l22846-lab uv run --frozen pytest tests/unit/test_routing_policy_helpers.py tests/test_omn17082_customer_key_terminus.py tests/unit/routing/test_routing_tiers_node_overlay_omn20935.py -q --no-cov'
        cwd: "."
  - id: "dod-omn21944-deploy-source-readback"
    description: "Hosted source-control readback of the exact checked-out revision: the moved tier resolver carries the additional parent traversal for packaged config. This verifies revision contents, not a running deployment. The moved file is absent at the migration base."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: >-
          bash -o pipefail -c 'onex scm file-read OmniNode-ai/omnimarket --clone . --ref "$(git rev-parse HEAD)" --path src/omnimarket/handlers/routing/routing_tiers_path.py | python -c '\''import json, sys; data = json.load(sys.stdin); assert "Path(__file__).parent.parent.parent" in data["result"]["content"]'\'''
        cwd: "."
