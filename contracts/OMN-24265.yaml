schema_version: 1.0.0
ticket_id: OMN-24265
title: Let the code budget and code draft scoring checks be called through the running system
summary: 'node_delegation_code_budget_compute and node_code_contract_score_effect are in the dev runtime and subscribe their command topics, but onex run-node refuses both: their overlay documents name
  no event_bus, and ModelCodeBudgetOverlay and ModelCodeScoreOverlay keep extra=forbid, so the key could not be added. Both models gain an optional event_bus (ModelNodeEventBus, the shape omnimarket#6032
  gave the card limit model), the code score example overlay carries the key, and a new test file holds the golden, the refusals and a failing control for each model. Not in this change: the overlays repository
  entry (its own pull request of this ticket) and the run through the running dev runtime (AC3).'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24265-event-bus
  statement: The code budget and code score overlay models accept an optional event_bus and still refuse every other unknown key.
  acceptance:
  - id: AC1
    statement: 'AC1: the settings models of node_delegation_code_budget_compute and node_code_contract_score_effect accept an optional event_bus of type kafka with a lane, refuse kafka with no lane, and
      still refuse every other unknown key -- falsifier: uv run pytest tests/unit/nodes/test_integ_event_bus_omn19998.py -q -p no:randomly --no-cov fails at the merge base'
  - id: AC2
    statement: 'AC2: the settings repository files of both nodes carry event_bus kafka on the dev lane and load through the models of the pinned revision -- falsifier: the overlays repository test of those
      two files fails when the key is removed or the pin is behind'
  - id: AC3
    statement: 'AC3: integrated: in the running dev runtime, onex run-node node_delegation_code_budget_compute with operation resolve for code_generation returns its resolved event, and onex run-node node_code_contract_score_effect
      with one small draft returns a scored or typed failed event -- falsifier: the run is refused with no event_bus in its overlay, or no terminal event arrives'
evidence_requirements:
- kind: tests
  description: The two overlay model tests pass at the pushed head.
  command: uv run pytest tests/unit/nodes/test_integ_event_bus_omn19998.py -q -p no:randomly --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24265-ac1
  description: 'AC1: both models accept event_bus kafka on a lane, refuse kafka with no lane, an unknown inner key and an unknown top-level key; the failing controls fail at the merge base where the models
    refused the key.'
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/nodes/test_integ_event_bus_omn19998.py -q -p no:randomly --no-cov
    cwd: .
- id: dod-omn24265-ac2
  description: 'hosted proxy for AC2: the shipped code score example overlay carries event_bus and loads through the model at the pull request head; the overlays repository entry is its own pull request and
    is named in this pull request.'
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/nodes/test_integ_event_bus_omn19998.py -q -p no:randomly --no-cov -k shipped
    cwd: .
- id: dod-omn24265-ac3
  description: 'hosted proxy for AC3: the model tests pass at the pull request head; the run through the running dev runtime is read after the overlays pull request merges and is named in the pull request.'
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/nodes/test_integ_event_bus_omn19998.py -q -p no:randomly --no-cov
    cwd: .
- id: dod-omn24265-integration-proof
  description: the model tests run on a lab host at the pushed head; hosted CI cannot reach the lab, so only the local Done gate runs this unbound check
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24265 --kind test -- env PYTHONDONTWRITEBYTECODE=1
      uv run --frozen pytest tests/unit/nodes/test_integ_event_bus_omn19998.py -q --no-cov
