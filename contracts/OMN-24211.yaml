schema_version: 1.0.0
ticket_id: OMN-24211
title: The pause check reads holds from the live work log in one batch read
summary: node_ledger_hold_verdict_effect decides one or many pull requests from a single read of the holds answer of node_work_ledger_reader_effect. With one --pr its output and exit codes are unchanged; with several it prints one verdict line per pull request and exits 2 only when one is undecided. The pause check and the drain map call it, and the shared settings name the node's overlay and the pause-check reader.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24211-batch-hold-read
  statement: The hold verdict command reads the live log once for any number of pull requests, so a caller that runs once per pull request is not slowed by one bus read each.
  acceptance:
  - id: AC1
    statement: 'AC1: the hold verdict command reads the live log once however many pull requests are named, and prints one verdict line per pull request. -- falsifier: uv run pytest tests/unit/nodes/node_ledger_hold_verdict_effect -k reads_the_node_once, which fails when the command reads once per pull request'
  - id: AC2
    statement: 'AC2: a hold that exists only in the live log answers HELD in the pause check, and a failed read answers UNDECIDED, never CLEAR. -- falsifier: uv run pytest tests -k "pause_check and source_bus" in the plugin tree, with the same case read from the text copy answering CLEAR as the control'
  - id: AC3
    statement: 'AC3: the hold verdict step and the pause-check reader are named in the shared settings, so the command runs on a lab host. -- falsifier: python -m omnimarket.nodes.node_ledger_hold_verdict_effect --pr omnimarket#1 on h053 exits 0, 2 or 3 and never prints a missing-overlay traceback'
  - id: AC4
    statement: 'AC4: integrated: on a lab host the running pause check answers from the live log (source=node) for a real pull request, and the count of text-copy fallbacks it prints is 0. -- falsifier: run pause_check.sh on h053 and read the HOLD-VERDICT line on its stderr; source=file-fallback or a missing line fails this'
evidence_requirements:
- kind: tests
  description: The hold verdict node tests, the batch form included.
  command: uv run --frozen pytest tests/unit/nodes/node_ledger_hold_verdict_effect -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24211-ac1
  description: The batch form tests pass; the named control reads the live log once per pull request and fails.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/nodes/node_ledger_hold_verdict_effect -q --no-cov -k "batch"
    cwd: .
- id: dod-omn24211-ac2-ac3-ac4
  description: The pause check tests (plugin tree), the shared settings (settings repository) and the live read on h053 are proven in the pull requests of those repositories; this pull request carries the node side, whose golden and error chains pass here.
  source: manual
  binds_ac:
  - AC2
  - AC3
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/nodes/node_ledger_hold_verdict_effect -q --no-cov
    cwd: .
- id: dod-omn24211-integration-proof
  description: Run this pull request's own tests on a lab host at the pushed head. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24211 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/nodes/node_ledger_hold_verdict_effect -q --no-cov
    cwd: .
