schema_version: 1.0.0
ticket_id: OMN-24055
title: "The shared settings reader uses the one overlay root resolver"
summary: The shared settings reader (find_node_overlay) built its folder list from one environment variable, so a host that sets none, such as the operator Mac, found no settings and the delegation call budget and the projection read binding read as missing. This makes the reader take its folder list from the one overlay root resolver. It stays a draft until the host's local settings copy reads fresh, because that copy is read first.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24055-reader-uses-resolver
  statement: find_node_overlay returns an overlay found under the resolver's roots, so a host that knows only its working folder finds the settings repository beside it.
  acceptance:
  - id: AC1
    statement: "AC1: the shared settings reader builds its folder list from the one resolver -- falsifier: uv run pytest tests/unit/handlers/test_node_overlay_reader_resolved_roots.py -q fails at the merge base"
  - id: AC2
    statement: "AC2: the delegation call budget reader returns the code budget on a host that sets no environment variable and knows only its working folder -- falsifier: the golden test finds no overlay and the budget reads as missing"
  - id: AC3
    statement: "AC3: integrated: on the Mac the call budget reader and the projection read binding read their settings in the running environment -- falsifier: the Mac read prints a missing budget or an unconfigured binding"
evidence_requirements:
- kind: tests
  description: The reader tests and the call budget reader tests pass at the pushed head.
  command: uv run pytest tests/unit/handlers/test_node_overlay_reader_resolved_roots.py tests/unit/handlers/test_delegation_call_budget_reader.py -q -p no:randomly --no-cov
