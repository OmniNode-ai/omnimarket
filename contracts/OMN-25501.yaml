---
schema_version: "1.0.0"
ticket_id: "OMN-25501"
title: "The failure alarm router's interpreter is a declared setting resolved from the running environment, and a missing interpreter refuses by name"
summary: "The router's commands may start with the {python} token, which resolves to the declared python_interpreter setting or the running environment's interpreter; a missing interpreter refuses by name once and never raises FileNotFoundError each tick."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-omn25501-interp"
    statement: |-
      the failure alarm router resolves its interpreter from a declared setting and refuses a missing interpreter by name.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: a missing interpreter refuses by name and the scheduled fire latches one refusal instead of a traceback each tick -- falsifier: uv run pytest tests/nodes/node_failure_alarm_router_effect/test_interpreter_setting.py exits non-zero
evidence_requirements:
  - kind: "tests"
    description: "AC1: the interpreter setting tests."
    command: "uv run pytest tests/nodes/node_failure_alarm_router_effect/test_interpreter_setting.py -q --no-cov"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn25501-interpreter-setting"
    description: "AC1: the router interpreter setting tests pass on the branch. The hosted runner runs them from the repository root with no lab host, no ledger and no network."
    source: "manual"
    binds_ac: ["AC1"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_failure_alarm_router_effect/test_interpreter_setting.py -q --no-cov"
        cwd: "."
  - id: "dod-omn25501-integration-proof"
    description: >-
      Run the router's focused tests on a lab host at the pushed revision. This local completion proof carries no hosted AC bindings.
    source: "manual"
    execution_scope: "local_done_gate"
    checks:
      - check_type: "command"
        check_value: >-
          env PYTHONDONTWRITEBYTECODE=1 onex lab-work run
          --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)"
          --lane dod-integration-proof-25501 --kind test --
          env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest
          tests/nodes/node_failure_alarm_router_effect
          -q -n 0 --no-cov --refuse-skips
        cwd: "."
