schema_version: 1.0.0
ticket_id: OMN-24693
title: The dev runtime logs no undeliverable-output ERROR for node_host_table_keys_ingest_effect, and a real-path test fails on the unfixed shape
summary: node_host_table_keys_ingest_effect drops its unused output_model, handler.output_model and runtime_dispatch.terminal_events, its handler returns no model, and the unused ModelHostTableKeysIngestResult is deleted, so auto-wiring no longer meets a result with no applier on every dispatch.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24693-no-undeliverable-output
  statement: The node declares no result model and its handler returns none, because the node declares no publish topic and nothing consumes a result.
  acceptance:
  - id: AC1
    statement: 'AC1: the node contract declares no output_model and no terminal_events, its handler returns no model, and the unused ModelHostTableKeysIngestResult is deleted -- falsifier: uv run pytest tests/nodes/node_host_table_keys_ingest_effect tests/nodes/node_host_table_keys_read_effect -q --no-cov in omnimarket passes, and grep -rn ModelHostTableKeysIngestResult src tests prints nothing'
  - id: AC2
    statement: 'AC2: a real-path test in omnibase_infra wires a stand-in contract of the fixed shape through wire_from_manifest and asserts the undeliverable-output route is never awaited, and the same test run against the unfixed shape (handler returning a model, no publish_topics) fails -- falsifier: uv run pytest tests/integration/nodes/node_host_table_keys_ingest_effect -q --no-cov passes on the branch and the unfixed-shape case asserts UndeliverableDispatchOutputError is raised once'
  - id: AC3
    statement: 'AC3: the dev runtime log on h201, read 9 minutes after the recreate that runs the merged change, holds zero "no result applier" lines and at least one ingest dispatch line, with the read time recorded -- falsifier: ssh omni-201 docker logs omninode-runtime --since the recreate time piped to grep -c "no result applier" prints 0 (pending until a dev-merge tag rolls)'
evidence_requirements:
- kind: tests
  description: The node's tests and the read effect's tests pass at the pushed head.
  command: uv run --frozen pytest tests/nodes/node_host_table_keys_ingest_effect tests/nodes/node_host_table_keys_read_effect -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24693-ac1
  description: The node's golden chain asserts the contract holds no output_model and no terminal_events and the handler returns None; the error chain asserts a record of another overlay returns None and writes nothing; the read effect's seam test stays green.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_host_table_keys_ingest_effect tests/nodes/node_host_table_keys_read_effect -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24693-ac1-model-deleted
  description: The deleted result model is named nowhere in src or tests. A grep proves an absence, not a test, so this item binds no criterion; the criterion it supports is bound by the item above.
  source: manual
  checks:
  - check_type: command
    check_value: bash -c '! grep -rn ModelHostTableKeysIngestResult src tests'
    cwd: .
- id: dod-omn24693-ac2
  description: The real AC2 check lives in the contract of omnibase_infra#6032, a real-path test in omnibase_infra (tests/integration/nodes/node_host_table_keys_ingest_effect) whose run, red on the unfixed shape and green on the fixed one, is recorded in that pull request. The check bound here is the omnimarket golden chain, which proves AC1's contract shape and is the closest hosted test of this repository.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_host_table_keys_ingest_effect/test_golden_chain_host_table_keys_ingest.py::test_contract_golden_chain -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24693-ac3
  description: The log-read command of the item below, run against fixture log text with a stand-in ssh, exits 0 for a log with zero no-result-applier lines and at least one ingest write line since the recreate, and exits non-zero for a log holding a no-result-applier line, for a log with no write line, for an unset recreate time and for a failed read; the handler logs one INFO line on a write and none on an ignored record. The read on the dev runtime itself is the local-only item below, because the hosted runner cannot reach h201.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/ci/test_omn24693_dev_runtime_log_check.py tests/nodes/node_host_table_keys_ingest_effect/test_host_table_keys_ingest_write_log.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24693-ac3-dev-log-read
  description: The dev runtime log read on h201 once a dev-merge tag that carries this change has rolled, with RECREATE_SINCE set to the recreate time. It exits non-zero unless the count of no-result-applier lines since the recreate is 0 and at least one ingest write line of this node is present. Pending until that tag rolls; the hosted runner cannot reach h201, so only the local Done gate runs this unbound item, and its logic is tested by the item above.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: |-
      bash -c 'set -o pipefail; : "${RECREATE_SINCE:?set RECREATE_SINCE to the dev runtime recreate time}"; log=$(ssh omni-201 docker logs omninode-runtime --since "$RECREATE_SINCE" 2>&1) || { echo "log read failed"; exit 1; }; bad=$(printf "%s\n" "$log" | grep -c "no result applier"); good=$(printf "%s\n" "$log" | grep -c "node_host_table_keys_ingest_effect wrote key="); echo "no-result-applier=$bad ingest-write-lines=$good since=$RECREATE_SINCE"; [ "$bad" -eq 0 ] && [ "$good" -ge 1 ]'
    cwd: .
- id: dod-omn24693-deploy
  description: The change is a contract declaration removal and a handler return type in one node; the node's tests above run on the hosted runner.
  source: manual
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_host_table_keys_ingest_effect -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24693-integration-proof
  description: Run the node's tests and the read effect's tests on a lab host at the pushed head. Hosted CI cannot reach the lab hosts, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24693 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_host_table_keys_ingest_effect tests/nodes/node_host_table_keys_read_effect -q --no-cov -n 0 -p no:randomly
    cwd: .
