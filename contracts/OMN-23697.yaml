schema_version: 1.0.0
ticket_id: OMN-23697
title: 'Broker topic removal: a guarded dry run for unused topics'
summary: The dev broker holds 3,061 partitions on one shard and 2,622 of them are empty, which keeps the bus piece's broker-load reading red. node_broker_topic_removal_effect classifies every topic (declared or undeclared by a contract, produced or never produced), lists the removal candidates with their evidence and the partitions the broker would hold afterwards, and refuses by default any topic with data, a consumer group, a protected prefix or a contract declaration. A dry run is the default; an execute run needs the overlay switch, an approval reference and a per-run cap, and no real remover is wired in this change.
is_seam_ticket: true
interface_change: true
interfaces_touched:
- topics
requirements:
- id: req-omn23697-guarded-dry-run
  statement: The removal plan names only never-produced topics with no data and no consumer group, issues no delete in a dry run, and refuses an execute run that lacks the overlay switch, an approval reference, a wired remover or room under the per-run cap.
  acceptance:
  - id: AC1
    statement: 'AC1: a dry run lists only never-produced topics with no data and no consumer group, refuses a topic with data, a group, a protected prefix or a contract declaration, and issues no delete -- falsifier: env -u PYTHONPATH uv run pytest tests/nodes/node_broker_topic_removal_effect -q'
  - id: AC2
    statement: 'AC2: an execute request is refused unless the overlay enables it and the request names an approval, and a run over the overlay''s per-run cap is refused -- falsifier: env -u PYTHONPATH uv run pytest tests/nodes/node_broker_topic_removal_effect -q -k refus'
  - id: AC3
    statement: 'AC3: the golden and error chain tests and the seam test against the topic listing''s evidence model pass, and fail with the refusal removed -- falsifier: env -u PYTHONPATH uv run pytest tests/nodes/node_broker_topic_removal_effect -q -k "chain or seam"'
  - id: AC4
    statement: 'AC4: integrated: the dry run read the live development broker from a lab host at the pushed head and printed per-class counts that match the broker-load reading''s empty-partition count within the topics created meanwhile -- falsifier: run the dry run command and compare its empty-partition total with the newest broker-load STATUS row'
evidence_requirements:
- kind: tests
  description: The handler, adapter, chain event and seam tests at the pushed head. With the contract-declaration refusal removed from the handler, the declared-topic test fails.
  command: env -u PYTHONPATH uv run pytest tests/nodes/node_broker_topic_removal_effect -q
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23697-ac1-dry-run
  description: The dry run tests pass at the pushed head.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_broker_topic_removal_effect/test_topic_removal.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn23697-ac2-refusals
  description: The execute refusal tests pass at the pushed head.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_broker_topic_removal_effect/test_topic_removal.py -q --no-cov -n 0 -p no:randomly -k refus
    cwd: .
- id: dod-omn23697-ac3-chain-and-seam
  description: The chain event tests and the seam test pass at the pushed head.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_broker_topic_removal_effect/test_removal_chain_events.py tests/nodes/node_broker_topic_removal_effect/test_seam_listing_evidence.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn23697-integration-proof
  description: The pushed head ran the removal tests on a lab host through the lab work runner and exited 0. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  binds_ac:
  - AC4
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: 'env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23697 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_broker_topic_removal_effect -q --no-cov'
    cwd: .
