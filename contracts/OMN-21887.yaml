---
schema_version: "1.0.0"
ticket_id: "OMN-21887"
title: "Ticket definition of done carries an integration proof; dod-verify and the closer refuse a runtime ticket without it"
summary: "RULING 2026-11-01T14:45:51Z holds that work is verified only when the full integration is done, deployed on the runtime and tested with real dependencies. The ticket-contract prerequisite, which pre-push and the CI contract step both run, now reads the paths a push changes against its merge base. A push that changes something that runs (a file under src/, docker/ or deploy/, or a Dockerfile, outside tests and docs) is refused unless the ticket contract carries a dod_evidence item whose id names an integration proof, whose execution scope is the local Done gate, and whose check is an onex command or an asserted read of a live surface. A push that changes only docs, tests, contracts, workflows or scripts owes none. First piece: the prerequisite refusal; the verdict-time refusal in dod-verify and the closer is the next piece."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-omn21887-integration-proof-mechanism"
    statement: |-
      A runtime ticket is refused at the contract prerequisite unless its contract carries a live integration proof.
    acceptance:
      - id: "AC1"
        statement: "AC1: a resolved, wired mechanism enforces RULING 2026-11-01T14:45:51Z lane=orchestrator-31d9, linked to it by a CORRECTION row carrying mechanism=<repo path> -- falsifier: `python3 plugins/omni/skills/queue-status/scripts/ruling_mechanisms.py` no longer lists 2026-11-01T14:45:51Z as unmechanized"
evidence_requirements:
  - kind: "tests"
    description: "A runtime push without an integration proof is refused through real git; one with it, and a docs-only push, pass."
    command: "uv run pytest tests/nodes/node_ticket_contract_prerequisite_effect -q --no-cov"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn21887-refusal"
    description: "The prerequisite refuses a runtime push whose contract has no integration proof, names the runtime paths, rejects an item that is hosted-scoped, unit-test-only, a quoted runner or exit-laundered, and passes a live proof and a docs-only push, through real git."
    source: "manual"
    binds_ac: ["AC1"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_ticket_contract_prerequisite_effect tests/ci/test_ticket_contract_prerequisite_omn20864.py -q -n 0 --no-cov"
        cwd: "."
  - id: "dod-omn21887-integration-proof"
    description: "The pushed head ran the prerequisite node on a lab host with real git and its real dependencies and exited 0. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check."
    source: "manual"
    execution_scope: "local_done_gate"
    checks:
      - check_type: "command"
        check_value: "uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha \"$(git rev-parse HEAD)\" --lane dod-integration-proof-1101 -- uv run --frozen python -m omnimarket.nodes.node_ticket_contract_prerequisite_effect --head \"$(git rev-parse HEAD)\" --base origin/dev"
        cwd: "."
  - id: "dod-omn21887-deploy-probe-handler"
    description: "Deploy probe: the integration-proof handler GitHub serves at the checked-out commit defines HandlerIntegrationProof, and the checked-out prerequisite handler calls check_integration_proof. The module is absent at the merge base, so the content read fails there."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: "bash -o pipefail -c 'gh api \"repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_ticket_contract_prerequisite_effect/handlers/handler_integration_proof.py?ref=$(git rev-parse HEAD)\" --jq .content | base64 -d | grep -F \"class HandlerIntegrationProof\" > /dev/null'"
        cwd: "."
      - check_type: "command"
        check_value: "grep -F 'proof = check_integration_proof(' src/omnimarket/nodes/node_ticket_contract_prerequisite_effect/handlers/handler_ticket_contract_prerequisite.py"
        cwd: "."
