schema_version: 1.0.0
ticket_id: OMN-24287
title: Check out code for build jobs from our own copies over the bus
summary: 'Child of OMN-19998. node_ci_checkout_effect answers a bus request for a repository at a sha from the host''s own git-served sources (bare mirror, then canonical clone, order and urls from its overlay), syncs once through the host''s clone sync on a miss, and replies with the source url; onex ci checkout then fetches the tree from that url with no GitHub remote, and .github/actions/bus-checkout wraps it as one composite action. First slice: the code checkout only. Actions pinned from our clones and the package cache are not in it. Not in this change: the serve process that hosts the node on a runner host, its broker rows and principals, and the reading on a runner (AC4).'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24287-ac1
  statement: 'the checkout node answers a request for a repository at a sha from the host''s own git-served sources, syncs once on a miss, and refuses a sha no source holds'
  acceptance:
  - id: AC1
    statement: 'AC1: the checkout node answers a request for a repository at a sha from the host''s own git-served sources, syncs once on a miss, and refuses a sha no source holds -- falsifier: pytest tests/nodes/node_ci_checkout_effect/test_ci_checkout_handler.py -q fails when the source lookup in the handler is removed'
- id: req-omn24287-ac2
  statement: 'a command on the bus is answered on the completed topic with the served url, a sha no source holds is answered not_found, and a missing overlay ends on the failed topic'
  acceptance:
  - id: AC2
    statement: 'AC2: a command on the bus is answered on the completed topic with the served url, a sha no source holds is answered not_found, and a missing overlay ends on the failed topic -- falsifier: pytest tests/nodes/node_ci_checkout_effect/test_golden_chain_node_ci_checkout_effect.py -q fails when the handler is not wired to the command topic'
- id: req-omn24287-ac3
  statement: 'onex ci checkout lands the exact tree with every route to GitHub blocked, while the plain fetch actions/checkout makes fails in the same environment'
  acceptance:
  - id: AC3
    statement: 'AC3: onex ci checkout lands the exact tree with every route to GitHub blocked, while the plain fetch actions/checkout makes fails in the same environment -- falsifier: pytest tests/nodes/node_ci_checkout_effect/test_ci_checkout_materialize.py tests/nodes/node_ci_checkout_effect/test_ci_checkout_cli.py -q fails when the checkout adds a GitHub remote or fetches from one'
- id: req-omn24287-ac4
  statement: 'integrated: a job on a lab runner host checks out a repository at a sha through the bus-checkout action with the fetch from GitHub counted at zero, read in the running runtime with the time and the bus round trip'
  acceptance:
  - id: AC4
    statement: 'AC4: integrated: a job on a lab runner host checks out a repository at a sha through the bus-checkout action with the fetch from GitHub counted at zero, read in the running runtime with the time and the bus round trip -- falsifier: the job''s reply reads upstream_fetches above zero, or the checkout step reads a GitHub address'
evidence_requirements:
- kind: tests
  description: The node's tests pass at the pushed head.
  command: uv run --frozen pytest tests/nodes/node_ci_checkout_effect -q -p no:cacheprovider --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
