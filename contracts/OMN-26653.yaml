schema_version: 1.0.0
ticket_id: OMN-26653
title: The host retention node's uv cache pass can hold a cache under control by free disk and entry age, with no size measured
summary: node_host_retention_effect gains a free_disk rule for a uv cache. The pass reads the free space of the cache's filesystem once; at or above min_free_gib it does nothing, below it evicts whole entries untouched for keep_days oldest first until their bytes bring the free space to target_free_gib. It never runs uv cache size or uv cache prune, which walked every file of a cache and held about 2.5 cores of the operator Mac for over 30 minutes.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn26653-uv-free-disk-age
  statement: A uv cache is held under control by free disk and entry age and is never measured.
  acceptance:
  - id: AC1
    statement: 'AC1: with enough free disk the pass reads no size, scans no bucket and prunes nothing -- falsifier: uv run pytest tests/nodes/node_host_retention_effect/test_host_retention_uv_free_disk.py -q -k enough_free_disk fails on a handler that calls uv cache size'
  - id: AC2
    statement: 'AC2: with low free disk the pass evicts only entries older than keep_days, oldest first, stops at the target and keeps linked, held and special entries -- falsifier: uv run pytest tests/nodes/node_host_retention_effect/test_host_retention_uv_free_disk.py -q -k "low_free_disk or age_rule" fails on a handler that evicts a new or linked entry'
  - id: AC3
    statement: 'AC3: an overlay that declares both rules, neither, a cap beside free_disk, or a target under the minimum is refused, and a bucket or keep_days outside the contract bounds is refused -- falsifier: uv run pytest tests/nodes/node_host_retention_effect/test_host_retention_uv_free_disk.py -q -k "exactly_one_rule or not_name or floor" fails on a model that loads one of them'
evidence_requirements:
- kind: tests
  description: The node's focused tests, each failing against the broken behavior first and passing on the handler.
  command: uv run pytest tests/nodes/node_host_retention_effect -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn26653-no-size-when-free
  description: With enough free disk the pass keeps the cache as free_disk_ok and the uv port is never called; the test fails on a handler that sizes first.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_host_retention_effect/test_host_retention_uv_free_disk.py -q --no-cov -n 0 -p no:randomly -k enough_free_disk
    cwd: .
- id: dod-omn26653-evict-by-age
  description: With low free disk only entries older than keep_days go, oldest first, until the target; linked, held and special entries are kept.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_host_retention_effect/test_host_retention_uv_free_disk.py -q --no-cov -n 0 -p no:randomly -k "low_free_disk or age_rule or dry_run or two_buckets"
    cwd: .
- id: dod-omn26653-overlay-bounds
  description: The overlay takes exactly one rule and the contract bounds hold for the new rule.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_host_retention_effect/test_host_retention_uv_free_disk.py -q --no-cov -n 0 -p no:randomly -k "exactly_one_rule or not_name or floor"
    cwd: .
