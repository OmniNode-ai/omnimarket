schema_version: "1.0.0"
ticket_id: "OMN-21426"
title: "Landing controller leases on the generic service"
summary: >-
  Slice 3 of the OMN-21279 runtime cluster and generic lease plan, the omnimarket part. Deletes the
  stuck-owner actor (inventory A7, node_stuck_owner_actor_effect) and the lease claim close node
  (inventory A4, node_landing_lease_claim_close_effect), their tests and their onex.nodes entry
  points. The controller lease owner read in node_cause_claim_ownership_effect keeps its behaviour:
  acting and the helpers it reads with move into that node's handler unchanged. The landing lease
  kinds and the fenced push (AC1 and AC2) are the companion omnibase_infra change.
is_seam_ticket: false
interface_change: true
interfaces_touched:
  - "public_api"
requirements:
  - id: "req-omn21426-ac3-nodes-deleted"
    statement: "The stuck-owner actor and the lease claim close node (A7, A4) are deleted."
    acceptance:
      - id: "AC3"
        statement: |-
          AC3: the stuck-owner actor and the lease claim close node (A7, A4) are deleted -- falsifier: either node directory exists on the integration branch
evidence_requirements:
  - kind: "tests"
    description: "The deletion test, the cause claim ownership node tests and the node presence tests."
    command: "uv run pytest tests/unit/test_omn21426_landing_nodes_deleted.py tests/nodes/node_cause_claim_ownership_effect tests/unit/test_session_start_nodes_present.py tests/test_g3_local_invocation.py -q -n 0 --no-cov --refuse-skips"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn21426-ac3-nodes-deleted"
    description: >-
      Neither node directory nor its test directory exists, neither onex.nodes entry point is
      declared, and the cause claim ownership handler reads acting owners without importing the
      stuck-owner actor. Fails at the merge base, where both directories and entry points exist.
    source: "manual"
    binds_ac: ["AC3"]
    checks:
      - check_type: "command"
        check_value: "bash -o pipefail -c 'for n in node_stuck_owner_actor_effect node_landing_lease_claim_close_effect; do test ! -e src/omnimarket/nodes/$n || { echo present $n; exit 1; }; test ! -e tests/nodes/$n || { echo present tests/$n; exit 1; }; done; echo both-node-directories-absent'"
        cwd: "${OMNI_HOME}/omnimarket"
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/test_omn21426_landing_nodes_deleted.py tests/nodes/node_cause_claim_ownership_effect -q -n 0 --no-cov --refuse-skips"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn21426-deploy-entry-points-removed"
    description: >-
      Hosted deploy check, runnable on the hosted runner with no lab route, broker or database:
      gh api reads pyproject.toml at the checked-out commit and finds neither deleted node's
      onex.nodes entry point. At the merge base both entries are present, so the read finds them
      and the check exits nonzero.
    source: "manual"
    binds_ac: ["AC3"]
    checks:
      - check_type: "test_passes"
        check_value: "env PYTHONDONTWRITEBYTECODE=1 uv run pytest tests/unit/test_omn21426_landing_nodes_deleted.py::test_node_entry_point_is_removed -q --no-cov --refuse-skips"
        cwd: "${OMNI_HOME}/omnimarket"
      - check_type: "command"
        check_value: "bash -o pipefail -c 'body=$(gh api \"repos/OmniNode-ai/omnimarket/contents/pyproject.toml?ref=$(git rev-parse HEAD)\" --jq .content | base64 -d) && test -n \"$body\" && ! printf %s \"$body\" | grep -E \"^(node_stuck_owner_actor_effect|node_landing_lease_claim_close_effect) = \"'"
        cwd: "${OMNI_HOME}/omnimarket"
