schema_version: "1.0.0"
ticket_id: "OMN-26710"
title: "AWS Dev: the gateway has a Dev settings document, an example in its node, and a declared way to load settings in the cloud"
summary: >-
  Acceptance for OMN-26710 in omnimarket. The gateway node ships overlay.example.yaml validated against its settings
  model (AC1), its contract declares a settings mount that the gateway reads in the cloud runtime (AC3), and the Dev
  settings document for AWS Dev lives in the settings repository (AC2, proved there and by the model on the lab).
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-omn26710-example-and-mount"
    statement: >-
      The gateway node ships an example settings document and loads settings from a mounted folder in the cloud runtime.
    acceptance:
      - id: "AC1"
        statement: >-
          AC1: the gateway node ships an example settings document and a test loads the example and validates it against the gateway's settings model -- falsifier: uv run pytest tests/nodes/node_workflow_gateway_effect/test_overlay_example_omn26710.py fails on omnimarket dev, where no example exists
      - id: "AC3"
        statement: >-
          AC3: a gateway started with settings from the declared mount path answers non-503 -- falsifier: the same test file fails on omnimarket dev, where the contract declares no settings mount
  - id: "req-omn26710-dev-document"
    statement: >-
      The AWS Dev settings document exists in the settings repository and validates against the gateway's settings model.
    acceptance:
      - id: "AC2"
        statement: >-
          AC2: a Dev settings document for AWS Dev exists in the settings repository with the Dev sign-in issuer https://dev.auth.omninode.ai/realms/omninode and audience onex-api, and validates -- falsifier: the same validation test over the Dev document
evidence_requirements: []
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn26710-ac1-example-validates"
    description: >-
      AC1: the example settings document validates against ModelWorkflowGatewayOverlay and a broken copy is refused.
    source: "manual"
    binds_ac: ["AC1"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_workflow_gateway_effect/test_overlay_example_omn26710.py -q -p no:randomly -k 'example'"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn26710-ac3-settings-mount"
    description: >-
      AC3: the contract declares the settings mount, a gateway with the example at that path answers 401 (not 503) and an
      empty mount still answers 503.
    source: "manual"
    binds_ac: ["AC3"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_workflow_gateway_effect/test_overlay_example_omn26710.py -q -p no:randomly -k 'mount'"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn26710-ac2-dev-document-validates"
    description: >-
      AC2: the aws-dev/node_workflow_gateway_effect/overlay.yaml document in the settings repository validates against
      ModelWorkflowGatewayOverlay with issuer https://dev.auth.omninode.ai/realms/omninode and audience onex-api, and a copy
      with the audience emptied and the issuer removed is refused. Reads the settings repository clone, which hosted CI does
      not hold, so only the local Done gate runs it.
    source: "manual"
    binds_ac: ["AC2"]
    execution_scope: "local_done_gate"
    checks:
      - check_type: "command"
        check_value: >-
          uv run --frozen python -I -c "import yaml,copy,unittest,glob;from omnimarket.nodes.node_workflow_gateway_effect.handlers.http_dependencies import ModelWorkflowGatewayOverlay as M;d=yaml.safe_load(open(glob.glob('${OMNI_HOME}/*/aws-dev/node_workflow_gateway_effect/overlay.yaml')[0]));m=M.model_validate(d);assert m.identity.issuer=='https://dev.auth.omninode.ai/realms/omninode' and m.identity.audience=='onex-api';b=copy.deepcopy(d);b['identity']['audience']='';b['identity'].pop('issuer');unittest.TestCase().assertRaises(Exception,M.model_validate,b);print('DEV-DOC-OK')"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn26710-dnspython-lock-floor"
    description: >-
      The lock pins dnspython at or above 2.9.0 (Safety SFTY-20261027-41384 flags 2.8.0, which turned the required
      Dependency Security Scan and CI Summary red on this pull request), and the work-contract uv.lock pins match it; a
      planted 2.8.0 lock and a lock without the package are both caught.
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_omn26710_dnspython_lock_floor.py tests/nodes/test_work_contract_pins_current.py -q -n 0 --no-cov"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn26710-integration-proof"
    description: >-
      Run the gateway's example and settings-mount tests on a lab host at the pushed head: the example validates against
      the settings model, a gateway with settings at the mount answers 401 instead of 503, an empty mount still answers
      503. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
    source: "manual"
    execution_scope: "local_done_gate"
    checks:
      - check_type: "command"
        check_value: >-
          onex lab-work run --bus-lane dev --repo OmniNode-ai/omnimarket --sha
          "$(git rev-parse HEAD)" --lane dod-integration-proof-26710 --kind test --
          uv run --frozen pytest tests/nodes/node_workflow_gateway_effect/test_overlay_example_omn26710.py
          -q --no-cov
        cwd: "${OMNI_HOME}/omnimarket"
