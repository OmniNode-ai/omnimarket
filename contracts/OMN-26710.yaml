schema_version: "1.0.0"
ticket_id: "OMN-26710"
title: "AWS Dev: the gateway has a Dev settings document, an example in its node, and a declared way to load settings in the cloud"
summary: >-
  Acceptance for OMN-26710 in omnimarket. The gateway node ships overlay.example.yaml validated against its settings
  model (AC1), its contract declares a settings mount that the gateway reads in the cloud runtime (AC3), and the Dev
  settings document for AWS Dev lives in the settings repository (AC2, proved there and by the model on the lab).
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-omn26710-example-and-mount"
    statement: >-
      The gateway node ships an example settings document and loads settings from a mounted folder in the cloud runtime.
    acceptance:
      - id: "AC1"
        statement: >-
          AC1: the gateway node ships an example settings document and a test loads the example and validates it against the gateway's settings model -- falsifier: uv run pytest tests/nodes/node_workflow_gateway_effect/test_overlay_example_omn26710.py fails on omnimarket dev, where no example exists
      - id: "AC3"
        statement: >-
          AC3: a gateway started with settings from the declared mount path answers non-503 -- falsifier: the same test file fails on omnimarket dev, where the contract declares no settings mount
evidence_requirements: []
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn26710-ac1-example-validates"
    description: >-
      AC1: the example settings document validates against ModelWorkflowGatewayOverlay and a broken copy is refused.
    source: "manual"
    binds_ac: ["AC1"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_workflow_gateway_effect/test_overlay_example_omn26710.py -q -p no:randomly -k 'example'"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn26710-ac3-settings-mount"
    description: >-
      AC3: the contract declares the settings mount, a gateway with the example at that path answers 401 (not 503) and an
      empty mount still answers 503.
    source: "manual"
    binds_ac: ["AC3"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_workflow_gateway_effect/test_overlay_example_omn26710.py -q -p no:randomly -k 'mount'"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn26710-integration-proof"
    description: >-
      Run the gateway's example and settings-mount tests on a lab host at the pushed head: the example validates against
      the settings model, a gateway with settings at the mount answers 401 instead of 503, an empty mount still answers
      503. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
    source: "manual"
    execution_scope: "local_done_gate"
    checks:
      - check_type: "command"
        check_value: >-
          onex lab-work run --repo OmniNode-ai/omnimarket --sha
          "$(git rev-parse HEAD)" --lane dod-integration-proof-26710 --kind test --
          uv run --frozen pytest tests/nodes/node_workflow_gateway_effect/test_overlay_example_omn26710.py
          -q --no-cov
        cwd: "${OMNI_HOME}/omnimarket"
