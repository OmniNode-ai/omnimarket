schema_version: "1.0.0"
ticket_id: OMN-22949
title: Group 7 closes to public repositories, and the scan and the readback name a group-7 label and a public-repository run
summary: >-
  The workflow routing scan takes the group-7 labels from its caller (the private overlay home, none is named here) and counts every job of a public repository that selects one, directly, through a seam variable value or through a reusable-workflow callee. The runner-group exposure reading gains a sixth subject, g7_public_repository_jobs, which is NOT WORKING while a run on the group belongs to a public repository whatever its event, and UNKNOWN while a run did not say whether its repository is private. The GitHub group source now reads the run's repository private flag.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn22949-group7-close
    statement: >-
      A reader can prove that no public repository names a group-7 label and that, after the group command, the group allows no public repository and carries no queued or running public-repository run.
    acceptance:
      - id: AC1
        statement: "AC1: no workflow of a public repository names a group-7 label -- falsifier: uv run pytest src/omnimarket/nodes/node_workflow_routing_scan_compute -q -k no_group7_label"
      - id: AC2
        statement: "AC2: after the group command, the group reads allows_public_repositories false and no run is in progress or queued on a group-7 runner for a public repository -- falsifier: uv run pytest tests/unit/test_group7_drain_readback.py -q"
evidence_requirements:
  - kind: tests
    description: >-
      The two new test files, and the runner-group exposure and routing-scan suites whose fixtures now say each job's repository visibility.
    command: uv run --frozen pytest src/omnimarket/nodes/node_workflow_routing_scan_compute tests/unit/test_group7_drain_readback.py tests/nodes/node_runner_group_exposure_compute tests/nodes/node_runner_group_exposure_effect tests/nodes/node_workflow_routing_scan_compute -q -n 0 --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn22949-ac1-no-group7-label
    description: >-
      A planted job on a group-7 label in a public repository makes group7_public_count non-zero, the same job in a private repository does not, and a public caller of a private callee that names the label is counted. At the merge base the request has no group7_labels field and the scan models forbid extras, so every test errors.
    source: manual
    binds_ac:
      - AC1
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest src/omnimarket/nodes/node_workflow_routing_scan_compute -q -n 0 --no-cov -k no_group7_label
        cwd: ${OMNI_HOME}/omnimarket
  - id: dod-omn22949-ac2-drain-readback
    description: >-
      A drained group (allows_public_repositories false, runs on private repositories only) reads WORKING; a group still open reads NOT WORKING; a queued push run of a public repository reads NOT WORKING; a run that did not say its visibility reads UNKNOWN. At the merge base the test module cannot import SUBJECT_PUBLIC_REPOSITORY_JOBS.
    source: manual
    binds_ac:
      - AC2
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/test_group7_drain_readback.py -q -n 0 --no-cov
        cwd: ${OMNI_HOME}/omnimarket
  - id: dod-omn22949-integration-proof
    description: >-
      Run the two new test files and the runner-group exposure and routing-scan suites on a lab host at the pushed head. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-22949 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest src/omnimarket/nodes/node_workflow_routing_scan_compute tests/unit/test_group7_drain_readback.py tests/nodes/node_runner_group_exposure_compute tests/nodes/node_runner_group_exposure_effect tests/nodes/node_workflow_routing_scan_compute -q -n 0 --no-cov
