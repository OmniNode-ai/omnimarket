schema_version: 1.0.0
ticket_id: OMN-23529
title: The new landing decision holds a change that adds a self-starting program missing from the liveness register
summary: node_pr_landing_decision_compute takes an optional liveness-read fact per PR (models/model_landing_liveness.py). A read made on the exact head that names an undeclared installer source holds the head with the land skip reason liveness_undeclared and the files named; an unreadable read, a read of another head, or an absent read where the policy expects one holds nothing and is listed in the decision's liveness_unread. A PR without the fact decides as before. The reader that produces the fact (its overlay of reader, checkout and timeouts), the snapshot-step join and the dev runtime proof are not in this change.
is_seam_ticket: true
interface_change: true
interfaces_touched:
- public_api
requirements:
- id: req-omn23529-liveness-hold
  statement: The landing decision holds a head whose liveness read names an undeclared installer source, and never holds on a read that was not made.
  acceptance:
  - id: AC1
    statement: 'AC1: node_pr_landing_decision_compute takes a liveness-read fact per pull request and returns a hold naming the file when the head adds an undeclared installer source -- falsifier: a decision test with an added undeclared installer fails when the hold branch is removed'
  - id: AC2
    statement: 'AC2: a change whose liveness read is absent or unreadable is not held and the decision says the read was not made -- falsifier: a decision test for the unreadable fact fails when the unreadable case holds the change'
evidence_requirements:
- kind: tests
  description: The liveness hold decision tests (golden, error, controls) and the J8 decision tests beside them.
  command: uv run --frozen pytest tests/unit/nodes/node_pr_landing_decision_compute/test_liveness_hold.py tests/unit/nodes/node_pr_landing_decision_compute/test_join_j8.py -q --no-cov -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23529-hold
  description: A made read on the exact head naming an undeclared timer holds the head with reason liveness_undeclared and the file named; with the hold branch removed the test fails (measured 3 failed, 6 passed). The model does not exist at the merge base, so the control fails there.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/nodes/node_pr_landing_decision_compute/test_liveness_hold.py -q --no-cov -p no:randomly -k "undeclared or golden"
    cwd: .
- id: dod-omn23529-unread
  description: An unreadable read, a read of another head and an absent read where the policy expects one are not held and are listed in liveness_unread; a break that holds the unreadable case fails the control test.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/nodes/node_pr_landing_decision_compute/test_liveness_hold.py -q --no-cov -p no:randomly -k "unreadable or absent or another_head"
    cwd: .
- id: dod-omn23529-integration-proof-lab
  description: Runs the liveness hold decision tests at the pushed head on a lab host through the lab work runner. Hosted CI cannot reach the lab runner, so only the local Done gate runs this unbound item; the dev runtime proof of the ticket's AC5 is owed by a later change that wires the reader.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: 'env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23529 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/nodes/node_pr_landing_decision_compute/test_liveness_hold.py -q --no-cov -p no:randomly'
    cwd: .
