---
schema_version: "1.0.0"
ticket_id: "OMN-16932"
title: "judge the omnimarket venv install against the head the delegate started from"
summary: "The host reconcile effect reads the omnimarket HEAD before the venv delegate runs and accepts an installed commit on the fast-forward from that start head to the current head. A no-op delegate or an install off the clone history still fails."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-ac1-accept-fast-forward"
    statement: "An install that lies on the fast-forward from the start head to the current head passes when the clone advances during the venv delegate."
    acceptance:
      - id: "AC1"
        statement: "AC1: An install that lies on the fast-forward from the start head to the current head passes when the clone advances during the venv delegate."
  - id: "req-ac2-reject-bad-install"
    statement: "A no-op delegate or an install off the clone history still fails when the clone advances."
    acceptance:
      - id: "AC2"
        statement: "AC2: A no-op delegate or an install off the clone history still fails when the clone advances."
evidence_requirements:
  - kind: "tests"
    description: "AC1: An install that lies on the fast-forward from the start head to the current head passes when the clone advances during the venv delegate."
    command: "uv run pytest tests/test_host_reconcile_effect.py -k \"clone_advancing_during_the_venv_delegate or install_from_a_head_the_clone_passed_through\" -q -p no:randomly"
  - kind: "tests"
    description: "AC2: A no-op delegate or an install off the clone history still fails when the clone advances."
    command: "uv run pytest tests/test_host_reconcile_effect.py -k \"delegate_that_installs_nothing_still_fails or install_off_the_clone_history_still_fails\" -q -p no:randomly"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn16932-start-head-install-judged"
    description: "AC1 and AC2: an install on the fast-forward from the start head to the current head passes when the clone advances during the venv delegate, and a no-op delegate or an install off the clone history still fails. The AC2 guards run with the AC1 tests so the check fails before the fix."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/test_host_reconcile_effect.py -k \"clone_advancing_during_the_venv_delegate or install_from_a_head_the_clone_passed_through or delegate_that_installs_nothing_still_fails or install_off_the_clone_history_still_fails\" -q -p no:randomly"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC1", "AC2"]
