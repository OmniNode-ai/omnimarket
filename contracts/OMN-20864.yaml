---
schema_version: "1.0.0"
ticket_id: "OMN-20864"
title: "Idle lab slots default to per-PR landing lanes on parked and escalated PRs"
summary: "Lab-fill selection plans a pr-land lane for every lab slot its ordinary work leaves idle, on an open PR the landing controller parked, escalated or left red with no owner, and the merge-throughput tick's lab-headroom FIX names the same lanes through the same shared rule (omnimarket.handlers.rules_lab_fill_pr_land). The facts arrive typed in the request (pr-state-observed, ci-red-triage-decided, pr-landing-transitioned, the controller's facts and the hold rows). A PR under an in-force HOLD is SKIP_HELD naming the hold; a PR blocked on a cause no lane can fix is SKIP_BLOCKED_UNFIXABLE until its head or that cause changes; an unreadable hold source plans nothing. The lab-fill dispatch plan takes the pr-land kind last and renders a pr-land brief, so the lane launches through the existing lab-fill effect."
is_seam_ticket: false
interface_change: true
interfaces_touched: ["public_api"]
requirements:
  - id: "req-idle-slots-plan-pr-land"
    statement: "Idle lab slots fall back to pr-land lanes on parked, escalated or unowned-red PRs, in lab-fill and in the throughput tick."
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: lab-fill with zero ordinary candidates and at least one parked, escalated or unowned-red open PR dispatches a pr-land lane for it -- falsifier: pytest ratchet test with zero candidates and one parked PR fixture asserts a pr-land dispatch
      - id: "AC2"
        statement: |-
          AC2: the merge-throughput tick's lab-headroom FIX uses the same fallback -- falsifier: pytest test of the headroom FIX with idle slots and a parked PR asserts a pr-land dispatch
      - id: "AC3"
        statement: |-
          AC3: with idle slots and no parked, escalated or unowned-red PRs the fallback dispatches nothing and records why -- falsifier: pytest test asserting no dispatch and a recorded reason
  - id: "req-held-and-unfixable-prs-skipped"
    statement: "The fallback skips held PRs and PRs blocked on a cause no lane can fix."
    acceptance:
      - id: "AC4"
        statement: |-
          AC4 (AC-M1, stay-out hold): given an open PR under a stay-out hold and an idle slot, the selection compute returns SKIP_HELD naming the hold id, no pr-land dispatch is emitted, and the hold list is read in code from the hold source; an unreadable hold source fails loud (typed error) and never dispatches
      - id: "AC5"
        statement: |-
          AC5 (AC-M8, blocked PRs not retried): given a PR whose last landing outcome is blocked on a cause class the lane cannot fix (required-approval, base-red, held, external-owner) and no new head or cause change since, the selection compute returns SKIP_BLOCKED_UNFIXABLE with the cause and no dispatch; a new head sha or a cleared cause makes it eligible again
  - id: "req-repo-contracts-bind-pytest-evidence"
    statement: "Every repo-owned contracts/OMN-*.yaml on dev binds each acceptance criterion only through dod_evidence items that name an existing repo pytest file, so the repo evidence test passes on dev and stops turning Tests (Split 14/20) red on open pull requests."
    acceptance:
      - id: "AC10"
        statement: "AC10: contracts/OMN-17427.yaml's dod-omn17427-ac28-tick-codex-headroom-deploy-probe carries no binds_ac, AC28 stays bound by dod-omn17427-ac28-tick-codex-headroom, and test_every_repo_contract_binds_every_criterion passes -- falsifier: uv run pytest tests/ci/test_repo_evidence_caller_workflow.py -q -k test_every_repo_contract_binds_every_criterion fails at the merge base"
  - id: "req-local-runtime-inventory-checks"
    statement: "The runtime inventory validates declared local invocation separately from bus routes, while the repo-first gate shape check constrains its gate and model identities."
    acceptance:
      - id: "AC6"
        statement: |-
          AC6: a declared local CLI invocation with a resolvable typed handler is counted separately from bus routes; missing handlers, mismatched models, nonempty bus topics, missing triggers and deployed runtime profiles fail. The repo-first shape test retains gate and model identity assertions without freezing unrelated verifier services.
  - id: "req-contractgate-omnimarket-authoring"
    statement: "Operator-authorized contractgate-1d5b slice: refuse missing ticket contracts at push and PR creation, using the verifier's check-only prerequisites. Other repository hook callers and backlog repairs remain separate landing work."
    acceptance:
      - id: "AC7"
        statement: "AC7: omnimarket pre-push and CI invoke the same contract-backed local EFFECT node, which imports the verifier prerequisites and reads the outgoing commit, naming a missing contract."
      - id: "AC8"
        statement: "AC8: M4 pr_create refuses a missing or invalid title-cited contract before POST, reads evidence at an immutable head, and refuses a moved head; a valid contract allows creation."
      - id: "AC9"
        statement: "AC9: the two pipeline-observability exports from emit_daemon and node_event_emit_effect explicitly leave the internal contract graph; removing those declarations produces all four orphaned producer defects."
  - id: "req-throughput-tick-live-admission"
    statement: "The throughput tick reports a host's free slots from the runner's live pool admission, per engine and from one shared slot budget, so it reports zero whenever placement would refuse the host."
    acceptance:
      - id: "AC11"
        statement: |-
          AC11: given the caller's live admission facts, a host placement refuses (0.9% or 7.3% idle CPU, swap traffic, a shared admission bar) reports free Claude slots 0 and free Codex slots 0 as a NOTE with no FIX, a Claude or Codex limit refuses only its engine, an unreadable probe is UNKNOWN, and shared slots are never counted twice for the pr-land fallback -- falsifier: pytest tests/nodes/node_throughput_tick_decision_compute/test_live_admission_throughput_tick_decision_compute.py fails at the merge base, where the facts model rejects the live admission schema
  - id: "req-lab-fill-sprint-tickets"
    statement: "Lab-fill's ticket backlog admits open current or next sprint tickets that no live CLAIM or other assignee owns and that carry parseable criteria, and names the gate that drops every other ticket."
    acceptance:
      - id: "AC12"
        statement: "AC12: omnimarket's plan_ticket_backlog admits an open unassigned ticket in project Sprint 2026-10-26 → 2026-11-01 with an unchecked AC1 criterion on 2026-10-25 as sprint-next, keeps the closed, other-owner, out-of-scope (RULING 2026-10-17T20:42:15Z), dashboard (RULING 2026-10-01T10:53:36Z), open-pr and claimed exclusions, and records one drop reason for every ticket it does not admit -- falsifier: uv run pytest tests/unit/handlers/test_rules_lab_fill_tickets_omn20864.py fails at the merge base, which has no rules_lab_fill_tickets module"
  - id: "req-session-source-relation-inventory"
    statement: "The generated application-relation inventory reflects the live session source's declared readers."
    acceptance:
      - id: "AC13"
        statement: "AC13: the source-derived inventory lists node_session_context_sources_effect as an accessor and reader of session_content and work_ledger_rows, including its contract source, and the checked-in inventory matches the generator."
  - id: "req-remote-lane-claim-reaches-lane-copy"
    statement: "A remote lane starts only with its stamped CLAIM available to mirror, and no-claim handoffs retry while that CLAIM is still reaching the live ledger."
    acceptance:
      - id: "AC14"
        statement: "AC14: a CLAIM the bus queued in the host bus outbox is found for the lane's copy, and a lane whose CLAIM is found nowhere is not started."
      - id: "AC15"
        statement: "AC15: a handoff refused no-claim while the lane's CLAIM has not reached the live ledger is retried, and a no-claim refusal with the CLAIM on the ledger is final."
evidence_requirements:
  - kind: "tests"
    description: "AC1, AC3, AC-M1 and AC-M8: lab-fill selection and the dispatch plan."
    command: "uv run pytest tests/nodes/node_lab_fill_selection_compute/test_lab_fill_pr_land_fallback.py tests/nodes/node_lab_fill_plan_compute/test_lab_fill_pr_land_dispatch.py -q -p no:randomly"
  - kind: "tests"
    description: "AC2 and AC3: the throughput tick's lab-headroom FIX."
    command: "uv run pytest tests/nodes/node_throughput_tick_decision_compute/test_pr_land_fallback_throughput_tick_decision_compute.py -q -p no:randomly"
  - kind: "tests"
    description: "AC11: the throughput tick's live admission headroom."
    command: "uv run pytest tests/nodes/node_throughput_tick_decision_compute/test_live_admission_throughput_tick_decision_compute.py -q -p no:randomly"
  - kind: "tests"
    description: "AC12: the lab-fill sprint ticket rule."
    command: "uv run pytest tests/unit/handlers/test_rules_lab_fill_tickets_omn20864.py -q -p no:randomly"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn20864-nc1"
    description: "AC14: the queued CLAIM incident replay, ledger precedence, request identity and missing-CLAIM controls."
    source: "manual"
    binds_ac: ["AC14"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_remote_lane_handoff_compute/test_remote_lane_handoff.py -q -n 0 -p no:randomly -k claim_mirror"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn20864-nc2"
    description: "AC15: retry delayed no-claim handoffs, refuse when the CLAIM is live or the window is over, and classify all other exits."
    source: "manual"
    binds_ac: ["AC15"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_remote_lane_handoff_compute/test_remote_lane_handoff.py -q -n 0 -p no:randomly -k handoff_retry"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn20864-contractgate-push"
    description: "AC7: missing contracts are refused and the outgoing SHA supplies the contract blob; CI and pre-push call the same module. A direct lab control also refuses an uncommitted repair at the real head."
    source: "manual"
    binds_ac: ["AC7"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_ticket_contract_prerequisite_omn20864.py tests/nodes/node_ticket_contract_prerequisite_effect -q -n 0 -p no:randomly -k 'push or ci_and_hooks or static_prerequisite or refusal_matches or golden_chain or git_read_failure'"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn20864-contractgate-pr-create"
    description: "AC8: positive and missing-contract negative controls in every M4 repo, invalid evidence refusals, and a head that moves during preflight."
    source: "manual"
    binds_ac: ["AC8"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_ticket_contract_prerequisite_omn20864.py -q -n 0 -p no:randomly -k 'pr_create or invalid_contract'"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn20864-contractgate-source-readback"
    description: "Pre-merge source readback at the verifier's commit: GitHub serves the new typed contract_required refusal. The base does not declare it. This does not claim a runtime deployment."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: 'gh api -H "Accept: application/vnd.github.raw" "repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_github_repo_write_effect/models/model_repo_write_io.py?ref=$(git rev-parse HEAD)" | grep -q ''CONTRACT_REQUIRED = "contract_required"'''
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn20864-pipeline-export-closure"
    description: "AC9: real contract parser and defect finder observe both exports and both publishers; deleting the external sink declarations restores exactly four orphaned producers."
    source: "manual"
    binds_ac: ["AC9"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_pipeline_observability_export_closure_omn20864.py -q -n 0 -p no:randomly"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn20864-ac1"
    description: "AC1: zero ordinary candidates and one parked PR plan a pr-land dispatch through the lab-fill dispatch plan."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: 'uv run pytest tests/nodes/node_lab_fill_selection_compute/test_lab_fill_pr_land_fallback.py tests/nodes/node_lab_fill_plan_compute/test_lab_fill_pr_land_dispatch.py -q -p no:randomly -k "ac1 or pr_land_items or brief"'
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC1"]
  - id: "dod-omn20864-ac2"
    description: "AC2: the headroom FIX with idle slots and a parked PR names a pr-land dispatch."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: 'uv run pytest tests/nodes/node_throughput_tick_decision_compute/test_pr_land_fallback_throughput_tick_decision_compute.py -q -p no:randomly -k "ac2 or full_lab or unchanged"'
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC2"]
  - id: "dod-omn20864-ac3"
    description: "AC3: idle slots and no fallback PR plan nothing and record why, in selection and in the tick."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: 'uv run pytest tests/nodes/node_lab_fill_selection_compute/test_lab_fill_pr_land_fallback.py tests/nodes/node_throughput_tick_decision_compute/test_pr_land_fallback_throughput_tick_decision_compute.py -q -p no:randomly -k "ac3"'
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC3"]
  - id: "dod-omn20864-acm1"
    description: "AC-M1: a held PR is SKIP_HELD naming the hold id, holds are read in code, an unreadable hold source is a typed failure."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: 'uv run pytest tests/nodes/node_lab_fill_selection_compute/test_lab_fill_pr_land_fallback.py tests/nodes/node_throughput_tick_decision_compute/test_pr_land_fallback_throughput_tick_decision_compute.py -q -p no:randomly -k "acm1 or hold_source"'
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC4"]
  - id: "dod-omn20864-acm8"
    description: "AC-M8: a PR blocked on an unfixable cause is SKIP_BLOCKED_UNFIXABLE until a new head or a cleared cause."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: 'uv run pytest tests/nodes/node_lab_fill_selection_compute/test_lab_fill_pr_land_fallback.py -q -p no:randomly -k "acm8 or base_or_a_shared_cause"'
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC5"]
  - id: "dod-omn20864-runtime-readback"
    description: "Pre-merge runtime readback: packaged operation contracts resolve the head's selection, throughput decision, dispatch and render handlers; JSON hand-offs dispatch a parked PR only with readable, clear holds. Deployment readback follows the merge on the dev lane."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: 'uv run pytest tests/nodes/node_lab_fill_plan_compute/test_pr_land_runtime_readback.py -q -s -p no:randomly'
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC1", "AC2", "AC4"]
  - id: "dod-omn20864-local-runtime-inventory-checks"
    description: "PR #3829: local invocation classification and malformed-invocation controls, plus the repo-first gate and model identity checks. The head tests fail against the merge base's audit, which lacks local invocation validation."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: 'uv run pytest tests/test_market_node_runtime_dogfood.py tests/unit/nodes/node_dod_verify/test_durable_gate_repo_first_omn_20071.py -q -p no:randomly -k "local_invocation or local_transport or repo_first_lives_in_the_gate_modules"'
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC6"]
  - id: "dod-omn20864-repo-contracts-bind-pytest-evidence"
    description: "AC10: the repo evidence test passes at the head and fails at the merge base, where contracts/OMN-17427.yaml binds AC28 to a command-only deploy probe."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/structure/test_deploy_probe_evidence_binding_omn20864.py -q"
        cwd: "${OMNI_HOME}/omnimarket"
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_repo_evidence_caller_workflow.py -q -k test_every_repo_contract_binds_every_criterion"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC10"]
  - id: "dod-omn20864-live-admission"
    description: "AC11: the live admission cases, including the 0.9% and 7.3% idle-CPU refusal controls and the shared-slot negative control, pass at the head and fail at the merge base."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_throughput_tick_decision_compute/test_live_admission_throughput_tick_decision_compute.py -q -p no:randomly"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC11"]
  - id: "dod-omn20864-ac12-sprint-tickets"
    description: "AC12: an open unassigned next-sprint ticket with an unchecked criterion is admitted; each kept exclusion drops with its reason and no ticket is dropped silently. Fails at the merge base, which has no rules_lab_fill_tickets module."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/handlers/test_rules_lab_fill_tickets_omn20864.py -q -p no:randomly"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC12"]
  - id: "dod-omn20864-ac13-relation-inventory"
    description: "AC13: the checked-in inventory is rebuilt from the repository's ownership declarations and source readers and matches the generator. Scoped to the one test that runs the generator check, so the hosted runner finishes inside the per-check time budget."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/scripts/test_application_relation_inventory.py -q -p no:randomly -k test_checked_in_inventory_is_source_derived_and_current"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC13"]
  - id: "dod-omn20864-deploy-relation-inventory"
