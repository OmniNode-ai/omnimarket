schema_version: 1.0.0
ticket_id: OMN-26563
title: A repository-edit task is replayed in a worktree at its source sha and scored by its own check, never as a bare chat call
summary: 'The real-work replay sent ten repository-edit prompts, taken from harness runs that read a repository, to chat endpoints with no repository and no tools, so no model could pass them. A route decision node now keeps a repository task out of a chat call, refuses one with no repository, no recoverable source sha or no check, scores a worktree task by its own check exit code, and leaves a self-contained prompt as a chat call.'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn26563-replay-repo-task-route
  statement: A replay driver asks the route node before it sends a recorded prompt; a repository-edit task is sent only to a worktree at the source sha and is scored by its own check.
  acceptance:
  - id: AC1
    statement: 'AC1: a repository-edit task with a repository, a recovered source sha and a check routes to a worktree and is scored by the check exit code, and the chat gate verdict never changes its accepted value -- falsifier: uv run pytest on the named focused test file fails at the base branch, where the same request is sent as a chat call and accepted on the chat gate, and passes on the pushed branch'
  - id: AC2
    statement: 'AC2: a repository-edit task with no repository, no recoverable source sha or no check is refused with a typed refusal that names the task, and is never replayed as a chat call -- falsifier: the refusal tests of the named focused test file pass on the pushed branch and fail at the base branch'
  - id: AC3
    statement: 'AC3: a self-contained prompt with no repository still routes to a chat call scored by the chat gate -- falsifier: the self-contained test of the named focused test file fails on the pushed branch'
evidence_requirements:
- kind: tests
  description: The named focused tests pass at the pushed head.
  command: uv run pytest tests/nodes/node_delegation_replay_route_compute -q -p no:randomly --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn26563-ac1
  description: 'AC1: the worktree route and the check-exit-code scoring. At the base branch the handler routes every task to chat and the route and scoring tests fail.'
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_delegation_replay_route_compute -q -p no:randomly --no-cov -k "worktree or check"
    cwd: .
- id: dod-omn26563-ac2
  description: 'AC2: the typed refusals for no repository, no recoverable source sha and no check, each naming the task.'
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_delegation_replay_route_compute -q -p no:randomly --no-cov -k "refused"
    cwd: .
- id: dod-omn26563-ac3
  description: 'AC3: the self-contained prompt still replays as a chat call.'
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_delegation_replay_route_compute -q -p no:randomly --no-cov -k "self_contained"
    cwd: .
- id: dod-omn26563-integration-proof
  description: 'Run the focused test file of this change on a lab host at the pushed revision. This local completion proof carries no hosted AC bindings.'
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: >-
      env PYTHONDONTWRITEBYTECODE=1 onex lab-work run
      --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)"
      --lane dod-integration-proof-26563 --kind test --
      env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest
      tests/nodes/node_delegation_replay_route_compute/test_replay_route.py
      -q -n 0 --no-cov --refuse-skips
    cwd: .
