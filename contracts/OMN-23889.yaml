schema_version: 1.0.0
ticket_id: OMN-23889
title: Machines without a private model list find our own graphics machines through the shared settings
summary: The delegation routing overlay gains an optional local_endpoints section. The bifrost loaders bind each row onto the routing contract's local backends (an override of a contract backend, or a new complete backend), the overlay winning over a machine-local overrides file, so a machine with no such file resolves the local rung. An absent section changes nothing. A row missing its endpoint or model name, naming a non-local provider, pinned-only, duplicated or incomplete is refused naming the backend and the key, never the endpoint value.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23889-binding
  statement: The routing overlay's local_endpoints section binds onto the contract's local backends, and its errors name the backend and the key.
  acceptance:
  - id: AC1
    statement: 'AC1: the delegation routing overlay model accepts a local_endpoints section and the bifrost loaders bind each row onto the contract local backends, the overlay winning over a machine-local file -- falsifier: the focused test file fails on the base revision (10 of 12 fail without the change)'
  - id: AC2
    statement: 'AC2: a bad local_endpoints row is refused naming the backend id and the key and never the endpoint value -- falsifier: the error-chain tests turn red when the validator is removed'
  - id: AC3
    statement: 'AC3: a bound routing overlay with no local_endpoints section resolves exactly as before -- falsifier: test_an_absent_section_changes_nothing fails if the section becomes required'
  - id: AC4
    statement: 'AC4: integrated: onex delegate with the lab rung first, on a machine with no machine-local overrides file and the routing overlay bound, is answered by a local GPU and the receipt names backend and model -- falsifier: the run receipt names a hosted backend or an empty endpoint'
evidence_requirements:
- kind: tests
  description: The focused tests pass at the pushed head.
  command: uv run pytest tests/unit/delegation/test_local_endpoints_overlay_omn23871.py -q -n 0 --no-cov -p no:cacheprovider
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
