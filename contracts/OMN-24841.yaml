schema_version: 1.0.0
ticket_id: OMN-24841
title: 'Review findings 1 to 8 on omnimarket PR 6219 are fixed or argued: the late close cannot change stored rates, an unmapped provider is refused, and the Event Chain Gate grant has a PR'
summary: 'The review of the Model tests tab pull request found eight blocking findings and two non-blocking ones. This change fixes each with a test that fails on the old code: Chart 1 markers at a new task sample, the live week as a date, a late older close, an unmapped provider, the explicit run of Chart 3 and the headline, the capability map comparison, serialised deliveries for one run and node names in void notes. The Event Chain Gate grant lives in another repository and the dev producer lacks two close fields; both are recorded in a pull request comment, not patched around here.'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24841-review-findings
  statement: 'Every blocking review finding on omnimarket PR 6219 is fixed with a red-then-green test or argued with evidence in a PR comment.'
  acceptance:
  - id: AC1
    statement: 'AC1: every required check-run of omnimarket#6219 reads success at the new head, Event Chain Gate included because a PR exists for the omnibase_infra grant, and a PR comment starting `Lab: head=<new head>` names the sha, the command and the parts run -- falsifier: `onex scm pr-checks OmniNode-ai/omnimarket#6219` lists a required context that is not success at the new head, or the Lab comment lacks the sha or the command'
  - id: AC2
    statement: 'AC2: the Delegation Health Check red is either green at the new head or has a STATUS row on the ledger with cause= and shared=yes, and the packet shows a Lab comment for the head -- falsifier: `python3 pr_state_local.py --pr OmniNode-ai/omnimarket#6219` shows Delegation Health Check red at the new head with no STATUS row carrying cause= and shared=yes'
  - id: AC3
    statement: 'AC3: the dev read of the eval results is made: the producer is confirmed to emit series and task_sample_digest on the close event, and the dev snapshot holds runs, with a test that fails when a close event lacks either field so the falsifier cannot pass vacuously -- falsifier: `uv run pytest tests/nodes -k eval_results -q -p no:cacheprovider` passes with series and task_sample_digest removed from the close event fixture'
  - id: AC4
    statement: 'AC4: Chart 1 marks a model version, prompt or scorer change at index 0 when the run is at a new task sample, tested with the changes alone and together -- falsifier: `uv run pytest tests/nodes -k board_chart1 -q -p no:cacheprovider` passes with the `_changes` skip at a new task sample restored'
  - id: AC5
    statement: 'AC5: the board record carries a week date and never the live run id (`live-2026-W46`), and the id-shape test includes a live week -- falsifier: `uv run pytest tests/nodes -k eval_board -q -p no:cacheprovider` passes with `week=week.week` restored'
  - id: AC6
    statement: 'AC6: a late older close cannot change eval_run_rates: the fold keeps the winning record and recounts from it, with a test in both delivery orders -- falsifier: `uv run pytest tests/nodes -k projection_eval_results -q -p no:cacheprovider` passes with the recount taken from the incoming close again'
  - id: AC7
    statement: 'AC7: an unmapped provider is refused as an unmapped tier is, so a hosted model is never stored as local, with a test -- falsifier: `uv run pytest tests/nodes -k eval_results_mapping -q -p no:cacheprovider` passes with the LOCAL default restored'
  - id: AC8
    statement: 'AC8: Chart 3 and the headline choose their run explicitly (tracking runs checked to hold one context arm and one replicate, or the arm named), with a test of a snapshot holding two arms -- falsifier: `uv run pytest tests/nodes -k eval_board -q -p no:cacheprovider` passes with `runs[-1]` restored'
  - id: AC9
    statement: 'AC9: tests/nodes/node_eval_board_compute/test_minimum_count_and_capability_map.py calls the capability map''s own fold, has a 9-task Chart 1 point, `-k every_overlay_model` selects at least one test, and EnumRangeVerdict holds only MET, MISSED and REFUSED or board_sizes.py handles the rest -- falsifier: `uv run pytest tests/nodes/node_eval_board_compute/test_minimum_count_and_capability_map.py -k every_overlay_model -q -p no:cacheprovider` selects no test, or passes with the capability map fold replaced by the same evaluator call'
  - id: AC10
    statement: 'AC10: the non-blocking findings 9 and 10 are fixed or argued in a PR comment: deliveries for one run are serialised, and `plain` matches node\_ names before replacing underscores -- falsifier: `uv run pytest tests/nodes -k "eval_results_store or board_text" -q -p no:cacheprovider` passes with node\_ names left in a void note'
evidence_requirements:
- kind: tests
  description: The eval board compute and eval-results projection tests pass at the pushed head.
  command: uv run --frozen pytest tests/nodes/node_eval_board_compute tests/nodes/node_projection_eval_results -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24841-ac1
  description: 'AC1 read from the watcher: the pull request reads ci green at its head. This check exits non-zero while any required check is red; it runs only in the local Done gate because the watcher state is not on a hosted runner.'
  source: manual
  execution_scope: local_done_gate
  binds_ac:
  - AC1
  checks:
  - check_type: command
    check_value: python3 "$OMNI_PLUGIN_ROOT/skills/merge-drain/scripts/pr_state_local.py" --pr OmniNode-ai/omnimarket#6219 --wait-until green --timeout 60
- id: dod-omn24841-ac2
  description: 'AC2 read from the watcher: the Delegation Health Check is not among the red checks of omnimarket#6219 at its head. This check exits non-zero while it is red; when the red is shared, the STATUS row with its cause and shared flag is the alternative the local Done gate reads from the work ledger. It runs only in the local Done gate because the watcher state is not on a hosted runner'
  source: manual
  execution_scope: local_done_gate
  binds_ac:
  - AC2
  checks:
  - check_type: command
    check_value: sh -c '! python3 "$OMNI_PLUGIN_ROOT/skills/merge-drain/scripts/pr_state_local.py" --pr OmniNode-ai/omnimarket#6219 | grep -q "Delegation Health Check"'
- id: dod-omn24841-ac3
  description: 'AC3: the close-field tests pass: a close with series and task_sample_digest reaches the snapshot as a tracking run, and a close missing either field does not, so a snapshot read for runs fails on a fixture that lacks them; the producer model on the base branch carries neither field, which the PR comment records as an open follow-up'
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_projection_eval_results/test_eval_results_close_fields.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24841-ac4
  description: 'AC4: the board_chart1 tests pass: each of a model version, prompt or settings, and scorer change at a new task sample is marked at index 0, alone and all together; with the change skip at a new task sample restored four of them fail'
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_eval_board_compute/test_markers.py -k board_chart1 -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24841-ac5
  description: 'AC5: the golden record test passes: a live week reaches the record as its Monday date, and the id scan and the overlay pattern both match a live run id'
  source: manual
  binds_ac:
  - AC5
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_eval_board_compute/test_golden_record.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24841-ac6
  description: 'AC6: the late-close tests pass in both delivery orders and on the fold alone; with the recount taken from the incoming close the newer-first order fails'
  source: manual
  binds_ac:
  - AC6
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_projection_eval_results/test_projection_eval_results_late_close.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24841-ac7
  description: 'AC7: the mapping tests pass: a provider outside the table is refused with reason unmapped_provider and never stored as local'
  source: manual
  binds_ac:
  - AC7
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_projection_eval_results/test_eval_results_mapping.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24841-ac8
  description: 'AC8: the latest-run tests pass over every order of a snapshot holding two context arms and two replicates of one run'
  source: manual
  binds_ac:
  - AC8
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_eval_board_compute/test_latest_run_choice.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24841-ac9
  description: 'AC9: the every_overlay_model tests select and pass: each overlay model compares with the capability map''s own fold, and every range verdict has a board verdict of the same name'
  source: manual
  binds_ac:
  - AC9
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_eval_board_compute/test_minimum_count_and_capability_map.py -k every_overlay_model -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24841-ac10
  description: 'AC10: the store-serialisation and board-text tests pass: two overlapping deliveries of one run both count, and a void note carries no node name'
  source: manual
  binds_ac:
  - AC10
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_projection_eval_results/test_eval_results_store_serialised.py tests/nodes/node_eval_board_compute/test_board_text.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24841-integration-proof
  description: the eval board compute and eval-results projection tests run on a lab host at the pushed head; hosted CI cannot reach the lab, so only the local Done gate runs this unbound check
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24841 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_eval_board_compute tests/nodes/node_projection_eval_results -q --no-cov -n 0 -p no:randomly
