schema_version: 1.0.0
ticket_id: OMN-24826
title: unblock omnimarket PR 6192 (red CI Summary, Core-Only Install Gate, Coverage Sweep Gate, Customer Clean-Install Delegate Gate, Repo Evidence Dependency)
summary: The pull request for OMN-23771 binds its AC7 evidence item to a scoped local_done_gate item, which the hosted repo-evidence / dod-verify check runs neither at the head nor at the merge base (its Must-fail control at the merge base step refuses it), and which the repository's own contract-binding test refuses. This ticket leaves that scoped item unbound (the repository convention, empty binds_ac) and binds AC7 to a separate default-scope test_passes item the hosted check can run, so the Repo Evidence Dependency gate stops refusing and Detect Changes and the tests run again. The Core-Only Install Gate and Customer Clean-Install Delegate Gate reds come from the omnibase-core floor naming a release that is not on the package index; that cause is outside this pull request and is not patched here.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24826-unblock-6192
  statement: The pull request's own contract evidence is hosted-runnable and the causes outside the pull request are named, not patched around.
  acceptance:
  - id: AC1
    statement: 'AC1: the contract of the pull request binds no criterion to a local_done_gate item -- falsifier: uv run pytest tests/ci/test_repo_evidence_caller_workflow.py -q -k test_no_repo_contract_binds_a_local_done_gate_item'
  - id: AC2
    statement: 'AC2: every acceptance criterion of every contract in the repository is bound to a test or check the hosted gate can run -- falsifier: uv run pytest tests/ci/test_repo_evidence_caller_workflow.py -q -k test_every_repo_contract_binds_every_criterion'
evidence_requirements:
- kind: tests
  description: The contract-binding tests pass at the pushed head.
  command: uv run --frozen pytest tests/ci/test_repo_evidence_caller_workflow.py -q --no-cov -n 0 -p no:randomly -k "test_no_repo_contract_binds_a_local_done_gate_item or test_every_repo_contract_binds_every_criterion"
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
