schema_version: 1.0.0
ticket_id: OMN-23695
title: 'Delegation check 8: generate the probe key in the runtime and read the probe account over the bus'
summary: 'Scenario R8 reads a probe tenant''s totals and runs through the tenant HTTP interface with a key nobody set. The secret store node gains a generate_key operation: the key is generated inside the runtime, stored create-only in the declared folder and never returned, printed or logged. The scenario reads the probe tenant through a bus backend instead of the HTTP interface, and the two tenant read nodes answer a command topic with a terminal event.'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23695-r8
  statement: The probe tenant's key is generated inside the runtime and stored create-only in the declared folder, and scenario R8 resolves it from the secret store. Acceptance criteria AC2, AC3 and AC4 of the ticket (the bus read backend, the tenant read nodes' command topic, the scheduled run with a conclusion past 'lane not configured') are not delivered by this pull request and stay open on the ticket.
  acceptance:
  - id: AC1
    statement: 'AC1: the secret store step''s generate operation creates a random key of the length its contract declares in the declared folder, create-only, and answers with the outcome and the key name and never the value; a second call reports the key exists and does not replace it -- falsifier: uv run pytest tests/unit/nodes/node_secret_store_effect/test_generate_key.py -q'
evidence_requirements:
- kind: tests
  description: The focused tests of this change pass at the pushed head.
  command: uv run --frozen pytest tests/unit/nodes/node_secret_store_effect/test_generate_key.py tests/nodes/node_delegation_scenario_r8_effect -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23695-ac1
  description: 'The generate_key tests: created, exists on the second call, the value never in the result, logs or repr, an undeclared id refused, an unreachable store typed.'
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/nodes/node_secret_store_effect/test_generate_key.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn23695-key-from-store
  description: 'The tick and key tests pass at the pushed head: the generated key reaches the R8 run''s environment from the store through the settings overlay and never appears in the serialized result, the ledger row or the event journal; a store holding no key leaves the key unset so the lane refuses.'
  source: manual
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_delegation_scenario_r8_effect/test_scenario_r8_tick.py tests/nodes/node_delegation_scenario_r8_effect/test_r8_key_from_store.py -q --no-cov -n 0 -p no:randomly
    cwd: .
