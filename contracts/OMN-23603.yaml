  description: 'Integrated: on a lab host the piece 11 reading node runs its read-only probe verb once at the pushed head under the deployed overlay (ONEX_SKILL_OVERLAY_ROOTS naming the overlays checkout, carrying the lineage section) and prints the reading run event with the lineage rule applied. Hosted CI cannot reach the lab runtime, so only the local Done gate runs this unbound item.'
