schema_version: '1.0.0'
ticket_id: OMN-22126
title: CSV import schema in the contract, saving as a range
summary: node_prompt_cost_estimate_compute declares its CSV import schema in contract.yaml (column names and accepted token-column aliases in precedence order), reports how each row's tokens were obtained, returns the saving as a low-to-high range with the pricing basis named, and declares its command and terminal topics so it runs on both runtime profiles. Changes are in the node's contract, handlers and models and in its tests and fixtures; no new node.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn22126-contract-schema
    statement: The CSV import schema is read from the node's contract, not from literals in handler code.
    acceptance:
      - id: AC1
        statement: 'AC1: the CSV import schema (required and optional columns, token-column aliases in precedence order) is declared in contract.yaml and no declared column name is a literal in handler code -- falsifier: uv run pytest tests/nodes/node_prompt_cost_estimate_compute/test_import_schema_and_range.py -q -k "no_declared_column_name_is_a_literal or alias_added_to_a_contract_copy"'
  - id: req-omn22126-output
    statement: Each row names how its tokens were obtained and the saving is a range around the point figure.
    acceptance:
      - id: AC2
        statement: 'AC2: each row names how its tokens were obtained and the saving is reported as a low-to-high range that holds the point figure, with the pricing basis named -- falsifier: uv run pytest tests/nodes/node_prompt_cost_estimate_compute/test_import_schema_and_range.py -q -k "names_how_its_tokens or saving_is_a_range or basis_names_every_manifest_entry"'
  - id: req-omn22126-fixtures
    statement: Both CSV shapes and a CSV with no model column import to the same result.
    acceptance:
      - id: AC3
        statement: 'AC3: the three fixture CSVs import, the two shapes that name a model give the same result, and the one with no model column prices no row -- falsifier: uv run pytest tests/nodes/node_prompt_cost_estimate_compute/test_import_schema_and_range.py -q -k "both_csv_shapes_same_result or cofounder_csv_imports"'
  - id: req-omn22126-two-profile
    statement: The node declares its command and terminal topics and gives the same result in memory and on the broker.
    acceptance:
      - id: AC4
        statement: 'AC4: the contract declares the command and terminal topics and the in-memory profile leg gives the same result as a direct handler call -- falsifier: uv run pytest tests/nodes/node_prompt_cost_estimate_compute/test_two_profile.py -q -m "not kafka"'
evidence_requirements:
  - kind: tests
    description: The contract-declared schema, the token-method and range output, the fixtures and the in-memory profile leg.
    command: uv run pytest tests/nodes/node_prompt_cost_estimate_compute -q -n 0 -p no:randomly --no-cov -m "not kafka"
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn22126-ac1
    description: AC1 scans handler code for every column name the contract declares and finds none, and reads an alias added to a copy of the contract with no code change; the same tests fail at the merge base, where the contract declares no schema.
    source: manual
    binds_ac:
      - AC1
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/nodes/node_prompt_cost_estimate_compute/test_import_schema_and_range.py -q -n 0 -p no:randomly --no-cov -k 'no_declared_column_name_is_a_literal or alias_added_to_a_contract_copy or contract_declares_the_shipped_csv_schema'
        cwd: .
  - id: dod-omn22126-ac2
    description: AC2 reads token_method on every row, the saving range holding the point figure, the estimated-token widening and the pricing basis.
    source: manual
    binds_ac:
      - AC2
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/nodes/node_prompt_cost_estimate_compute/test_import_schema_and_range.py -q -n 0 -p no:randomly --no-cov -k 'names_how_its_tokens or saving_is_a_range or estimated_token_count_widens or basis_names_every_manifest_entry'
        cwd: .
  - id: dod-omn22126-ac3
    description: AC3 imports the fixture CSVs and compares the two model-naming shapes and the cofounder shape.
    source: manual
    binds_ac:
      - AC3
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/nodes/node_prompt_cost_estimate_compute/test_import_schema_and_range.py -q -n 0 -p no:randomly --no-cov -k 'both_csv_shapes_same_result or cofounder_csv_imports'
        cwd: .
  - id: dod-omn22126-ac4
    description: AC4 reads the command and terminal topics from the contract and runs the in-memory profile leg through the event bus against a direct handler call. The broker leg is marked kafka and is not run by this check.
    source: manual
    binds_ac:
      - AC4
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/nodes/node_prompt_cost_estimate_compute/test_two_profile.py -q -n 0 -p no:randomly --no-cov -m 'not kafka'
        cwd: .
  - id: dod-omn22126-deploy-probe
    description: 'Deploy probe: the node contract GitHub serves at the checked-out commit declares csv_import_schema, which the merge base does not.'
    source: manual
    checks:
      - check_type: command
        check_value: bash -o pipefail -c 'gh api "repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_prompt_cost_estimate_compute/contract.yaml?ref=$(git rev-parse HEAD)" --jq .content | base64 -d | grep -F "csv_import_schema" > /dev/null'
        cwd: .
  - id: dod-omn22126-integration-proof
    description: The pushed head ran the prompt-cost-estimate node tests and its golden chain on a lab host through the bus and exited 0. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: |-
          uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-22126 -- uv run --frozen pytest tests/nodes/node_prompt_cost_estimate_compute tests/test_golden_chain_prompt_cost_estimate_omn20388.py -q --no-cov -m "not kafka"
        cwd: .
