schema_version: 1.0.0
ticket_id: OMN-24116
title: The board's main record step stops testing every lane name for every task
summary: The factory floor record step ran 55 to 58 s on a lab host over the same inputs where its limit is 45 s. A profile put 19 of the compute's 34 s in 4.5 million lane-name tests (every scoped plan
  task tested against every one of about 23,000 lanes), 2.4 s of the 9.8 s ledger parse in one strptime raise per absent stamp cell, and 6.5 s profiled in two functions that sorted the whole ledger once per plan. This change looks
  lanes up through an index of lane-name words, skips the parse of absent cells and sorts only the rows a plan reads; the record is byte-identical over the real 178,461-row window (compared with the base
  source run on the same inputs and clock, home paths aside). The limit is not raised.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24116-floor-record-speed
  statement: The factory floor record step finds the lanes named for a task without testing every lane, and gives the same record as before.
  acceptance:
  - id: AC1
    statement: 'AC1: a plan task named by a lane finds that lane through an index of lane-name words, tests only the lanes that carry its words, and gets the same lanes as testing every lane -- falsifier:
      uv run --frozen pytest tests/nodes/node_factory_floor_compute/test_scoped_task_lane_lookup.py -q --no-cov fails on the base commit and passes on the branch'
  - id: AC2
    statement: 'AC2: the factory floor record step run on a lab host over the same inputs takes under 45 s where the base takes 55 to 58 s -- falsifier: python -m omnimarket.nodes.node_factory_floor_effect
      on the branch, run with the same home on the same host, takes 45 s or more'
  - id: AC3
    statement: 'AC3: integrated: the publish cycle on the Mac installed from the merged revision records the factory_floor step under 45 s and publishes a fresh record -- falsifier: the served publish-status.json
      read on the Mac shows factory_floor at 45 s or more, or a record older than one publish cycle'
evidence_requirements:
- kind: tests
  description: The lane lookup, parse and compute tests pass at the pushed head.
  command: uv run pytest tests/nodes/node_factory_floor_compute/test_scoped_task_lane_lookup.py tests/nodes/node_factory_floor_effect/test_floor_publish_speed.py -q -n 0 --no-cov -p no:cacheprovider
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24116-ac1
  description: 'AC1: the index returns exactly the lanes the full scan returns for ten task ids, and a scoped task over 2002 lanes tests at most five of them; the count control fails on the base commit.'
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_factory_floor_compute/test_scoped_task_lane_lookup.py -q -n 0 --no-cov -p no:cacheprovider
    cwd: .
- id: dod-omn24116-ac2
  description: 'AC2 hosted proxy: the parse and compute tests pass; the step timings before and after, with the record compared byte for byte, are measured on the lab host and named in the pull request.'
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_factory_floor_effect/test_floor_publish_speed.py -q -n 0 --no-cov -p no:cacheprovider
    cwd: .
- id: dod-omn24116-ac3
  description: 'hosted proxy for AC3: the tests above pass; the Mac cycle''s factory_floor step seconds are read on the publishing Mac after install and named in the pull request.'
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_factory_floor_compute/test_scoped_task_lane_lookup.py tests/nodes/node_factory_floor_effect/test_floor_publish_speed.py -q -n 0 --no-cov -p no:cacheprovider
    cwd: .
- id: dod-omn24116-integration-proof
  description: the lane lookup and parse tests run on a lab host at the pushed head; hosted CI cannot reach the lab, so only the local Done gate runs this unbound check
  source: manual
  execution_scope: local_done_gate
  checks:
