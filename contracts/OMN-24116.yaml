    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24116 --kind test -- env PYTHONDONTWRITEBYTECODE=1
      uv run --frozen pytest tests/nodes/node_factory_floor_compute/test_scoped_task_lane_lookup.py tests/nodes/node_factory_floor_effect/test_floor_publish_speed.py -q --no-cov
