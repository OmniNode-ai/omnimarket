  source: manual
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23532 --kind test -- env PYTHONDONTWRITEBYTECODE=1
      uv run --frozen pytest tests/unit/nodes/node_dev_roll_request_compute/test_replay_dev_jobs_2026_11_10.py -q --no-cov -s
    cwd: .
  execution_scope: local_done_gate
