    cwd: .
- id: dod-omn25074-ac2
  description: 'hosted proxy for AC2: stand-in watcher responses validate the strict head and class rule used for the live read. The required-list quote, log excerpts, source audit, lab results and current-head comment remain live evidence posted on the pull request; this hosted proxy does not assert that those comments exist.'
