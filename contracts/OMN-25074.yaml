schema_version: 1.0.0
ticket_id: OMN-25074
title: Address the review of the stored outbox refusal replay
summary: The AC5 selection names its three contract tests, all live checks use the same head and class rule, the emit seam checks the drain lock, and a skipped report is distinguished from an empty pass. AST coverage inventories drain callers and refused-result readers. Live evidence belongs in PR comments.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn25074-review
  statement: Address the eight review findings on the stored outbox refusal replay.
  acceptance:
  - id: AC1
    statement: 'AC1: the AC5 falsifier and dod-omn24985-ac5 in contracts/[OMN-24985](https://linear.app/omninode/issue/OMN-24985).yaml select the three AC5 tests by name (omn_24250_ac1 six-hour, omn_24921_ac6 naive, omn_24875_ac4 falsifier) so the bound check can go red on AC5 -- falsifier: `uv run pytest tests/ -q -k "omn_24250_ac1 or omn_24921_ac6 or omn_24875_ac4"` selects fewer than three tests, or the dod-omn24985-ac5 command in contracts/[OMN-24985](https://linear.app/omninode/issue/OMN-24985).yaml selects a different set'
  - id: AC2
    statement: 'AC2: PR comments carry a pr-checks line at the new head, the `Lab: head=` text, the log lines, the dev 6efbe3ee read, the tests/ diff from 17dfc41, the src/ grep, the 6h, roll and queue-status case and the CLI logging statement, and one comment quotes the dev ruleset required list that settles whether delegation-health-check is required -- falsifier: `onex scm pr-view OmniNode-ai/omnimarket#6052` lists no comment starting `Lab: head=<new head>`'
  - id: AC3
    statement: 'AC3: dod-omn24985-ac1-live applies the same class rule as the other two pr-checks copies, PR_CHECKS_COPIES in tests/test_outbox_contract_text.py holds all three, and stand-in cases for the third copy cover an unreported required context and a differently spelled one -- falsifier: `uv run pytest tests/ -q -k "pr_checks and copies"` exits non-zero or selects zero tests at d7f6739a0992'
  - id: AC4
    statement: 'AC4: a test at the emit seam asserts that a non-blocking flock on .drain.lock from a second handle fails while the reporter runs its loop, so a reporter that frees the lock early goes red -- falsifier: `uv run pytest tests/ -q -k "outbox and refused and lock"` exits non-zero or selects zero tests at d7f6739a0992'
  - id: AC5
    statement: 'AC5: a skipped reporter pass does not read as zero refused, a skipped pass followed by a replay through select reports once, and \_settle_open_guard_cases runs inside the lock if it rewrites refused/ files -- falsifier: `uv run pytest tests/ -q -k "outbox and refused and skipped"` exits non-zero or selects zero tests at d7f6739a0992'
  - id: AC6
    statement: 'AC6: the falsifier lines at contracts/[OMN-24985](https://linear.app/omninode/issue/OMN-24985).yaml:15,19,25 say exits zero at c63e9dec2571 -- falsifier: `grep -c "exits non-zero at c63e9dec2571" contracts/OMN-24985.yaml` prints 0'
  - id: AC7
    statement: 'AC7: the callers test walks the AST so `from ...outbox import drain` is found and the DrainResult.refused readers are checked -- falsifier: `uv run pytest tests/ -q -k "outbox and callers"` exits non-zero or selects zero tests at d7f6739a0992'
  - id: AC8
    statement: 'AC8: the AC1 binds of [OMN-24985](https://linear.app/omninode/issue/OMN-24985), [OMN-24875](https://linear.app/omninode/issue/OMN-24875) and [OMN-24921](https://linear.app/omninode/issue/OMN-24921) are each called a hosted proxy, as [OMN-24250](https://linear.app/omninode/issue/OMN-24250) does, because dod-verify refuses binds_ac on a scoped item -- falsifier: `uv run pytest tests/ -q -k "contract and hosted_proxy"` exits non-zero or selects zero tests at d7f6739a0992'
evidence_requirements:
- kind: tests
  description: Focused contract and reporter regression tests.
  command: uv run pytest tests/handlers/bus_binding/test_outbox_contract_text.py tests/handlers/bus_binding/test_outbox_refused_receipt_reuse.py -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
