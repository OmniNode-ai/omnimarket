schema_version: 1.0.0
ticket_id: OMN-23207
title: "onex setup adds a model step that stores the user's key and ends in a proven delegation, and runs unattended with --workspace, --provider, --model and --url"
summary: "onex setup stopped after the workspace, prerequisites, user config and runtime config steps. It now ends with a model step: the key (hidden at a terminal, or on stdin) is stored through the handler onex models add uses, one delegation pinned to it runs, and its receipt is read back and printed. The unattended form names every choice and refuses, before any step runs, the one that is missing; a wrong key fails the model step with its retry command and keeps the earlier steps; ollama is refused unattended, naming --provider local --url; the key is in no argv, output, log, state file or receipt."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23207-setup-model-step
  statement: "onex setup ends in a proven delegation on the provider and model named, runs unattended from flags and a key on stdin, and never exposes the key."
  acceptance:
  - id: AC1
    statement: 'AC1: on a fresh HOME with a stub key server, the documented unattended invocation with a key on stdin ends with a receipt whose provider and model equal the ones named -- falsifier: uv run pytest tests/unit/nodes/node_onex_setup_effect -q -k model_step_proven_delegation'
  - id: AC2
    statement: 'AC2: each missing input is refused before any step runs, naming the flag: no workspace, no provider, no model, and local without --url -- falsifier: uv run pytest tests/unit/nodes/node_onex_setup_effect -q -k "unattended_missing_workspace or unattended_missing_provider or unattended_missing_model or local_missing_url"'
  - id: AC3
    statement: 'AC3: a wrong key fails the step with exit 1, names the step and the retry command, and leaves the earlier steps kept -- falsifier: uv run pytest tests/unit/nodes/node_onex_setup_effect -q -k wrong_key_resumes'
  - id: AC4
    statement: 'AC4: --provider local --url <stub server> --model M ends with a receipt naming local and M, and --provider ollama in the unattended form exits non-zero before any step naming --provider local --url -- falsifier: uv run pytest tests/unit/nodes/node_onex_setup_effect -q -k "local_url_unattended or unattended_ollama_refused_names_local"'
  - id: AC5
    statement: 'AC5: the key never appears in argv, logs or the receipt: a unique sentinel key is absent from every subprocess argv the step starts, stdout, stderr, every file under the test HOME log and state directories and the receipt, and the test fails if the recorder saw no subprocess -- falsifier: uv run pytest tests/unit/nodes/node_onex_setup_effect -q -k sentinel_key_never_leaks'
evidence_requirements:
- kind: tests
  description: "node_onex_setup_effect model step tests and the existing setup walk tests"
  command: uv run --frozen pytest tests/unit/nodes/node_onex_setup_effect tests/unit/cli/test_setup_command.py tests/unit/cli/test_setup_step_inventory.py -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23207-ac1
  description: "The unattended invocation with a key on stdin ends with a receipt naming the provider and model given."
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/nodes/node_onex_setup_effect -q --no-cov -k model_step_proven_delegation
    cwd: .
- id: dod-omn23207-ac2
  description: "A missing workspace, provider, model or local url is refused before any step runs, naming its flag."
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/nodes/node_onex_setup_effect -q --no-cov -k "unattended_missing_workspace or unattended_missing_provider or unattended_missing_model or local_missing_url"
    cwd: .
- id: dod-omn23207-ac3
  description: "A wrong key fails the model step with exit 1, names the step and the retry command, keeps the earlier steps; the retry with the right key ends."
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/nodes/node_onex_setup_effect -q --no-cov -k wrong_key_resumes
    cwd: .
- id: dod-omn23207-ac4
  description: "A local url ends with a receipt naming local and the model; ollama unattended is refused naming --provider local --url."
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/nodes/node_onex_setup_effect -q --no-cov -k "local_url_unattended or unattended_ollama_refused_names_local"
    cwd: .
- id: dod-omn23207-ac5
  description: "A unique sentinel key is absent from every argv, output, log, state file and receipt, and a key put in the delegation argv turns the scan red."
  source: manual
  binds_ac:
  - AC5
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/nodes/node_onex_setup_effect -q --no-cov -k "sentinel_key_never_leaks or sentinel_scan_catches"
    cwd: .
- id: dod-omn23207-integration-proof
  description: Run this pull request's own onex setup model step tests on a lab host at the pushed head. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23207 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/nodes/node_onex_setup_effect tests/unit/cli/test_setup_command.py -q --no-cov
    cwd: .
