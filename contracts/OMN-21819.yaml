---
schema_version: "1.0.0"
ticket_id: "OMN-21819"
title: "The tenant-credentials writer uses registry UUIDs without breaking existing named rows"
summary: "Stage 1 of the delivery order: the four credential reads accept both a tenant name and its registry UUID before the writer switches to UUID stamping. A shared read-side helper returns the counterpart form from one unique, validated tenant_registry_mirror row; a missing, ambiguous, malformed or disagreeing mirror leaves each reader on its existing exact-string read. Routing credential choice and the key pool (tenant_key_selection.py), the review gateway's query and its tenant filter, and the revocation route lookup read both forms. The writer stage, the replay and the lab exposure readback are later stages."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-omn21819-dual-form-readers"
    statement: |-
      Before UUID stamping is enabled, the routing credential-choice, key-pool, review-gateway and revocation reads accept both a tenant name and its registry UUID without changing the established tenant, expiry or revocation decisions.
    acceptance:
      - id: "AC1"
        statement: "AC1: Before UUID stamping is enabled, routing credential-choice, key-pool, review-gateway and revocation reads accept both a tenant name and its registry UUID without changing the established tenant, expiry or revocation decisions -- falsifier: uv run pytest on dual-form reader cases with active, expired, revoked and other-tenant rows finds a missing eligible row, an admitted ineligible row or a cross-tenant result in any of the four reads."
evidence_requirements:
  - kind: "tests"
    description: "The dual-form credential reader tests pass."
    command: "uv run pytest tests/test_omn21819_dual_form_credential_readers.py -q --no-cov"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn21819-dual-form-readers"
    description: "Each of the four credential reads finds the tenant's rows in either stored form, keeps revocation, expiry, host and tenant limits, and keeps its exact read without a unique mirror pair."
    source: "manual"
    binds_ac: ["AC1"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/test_omn21819_dual_form_credential_readers.py -q --no-cov"
        cwd: "."
  - id: "dod-omn21819-deploy-probe"
    description: "Deploy smoke on the runtime after the deploy agent rolls this change: import the tenant-form helper from the running container, assert it returns a tenant's name and registry UUID from one agreeing mirror row and the name alone when the mirror is empty, and assert the review gateway's host-key filter accepts the tenant forms. The command exits nonzero on an image without this change, including the merge-base image. It reads deployed code, not this contract or a receipt. Hosted CI has no runtime; the local Done gate must execute this unbound deployment check."
    source: "manual"
    execution_scope: "local_done_gate"
    checks:
      - check_type: "command"
        check_value: "docker exec ${RUNTIME_CONTAINER:-omninode-runtime} python -c 'import inspect; from omnimarket.handlers.tenant_identity_forms import sync_tenant_identity_forms as f; from omnimarket.nodes.node_claude_review_gateway_effect.handlers.handler_claude_review_gateway import select_host_keys as s; u = \"6f2b1c3e-0d4a-4f5e-9a8b-7c6d5e4f3a2b\"; D = type(\"D\", (), {\"query\": lambda self, t, p: [{\"tenant_slug\": \"acme\", \"tenant_uuid\": u}]}); E = type(\"E\", (), {\"query\": lambda self, t, p: []}); assert f(D(), \"acme\") == (\"acme\", u); assert f(D(), u) == (u, \"acme\"); assert f(E(), \"acme\") == (\"acme\",); assert \"tenant_forms\" in inspect.signature(s).parameters'"
        cwd: "${OMNI_HOME}/omnimarket"
