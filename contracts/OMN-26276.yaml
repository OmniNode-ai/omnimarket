    check_value: uv run --frozen pytest tests/nodes/node_test_selection_selector_compute/test_data_readers.py -q --no-cov -n 0 -p no:randomly -k "data_readers and (shared_helper or source_file or beside_a_node)"
    cwd: .
- id: dod-omn26276-ac4
