schema_version: 1.0.0
ticket_id: OMN-26678
title: The build-time delegation checks write their result where the runtime can write, and refuse by name when they cannot
summary: The build delegation checks node (node_build_delegation_checks) takes its state root from the runtime's declared environment (ONEX_STATE_DIR, then ONEX_STATE_ROOT) and the overlay's relative history path, refuses a build by name when that root cannot be written (no PermissionError traceback), and records one result row per check on a writable root.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn26678-state-root-and-named-refusal
  statement: The node that runs the delegation checks after each dev build writes its history under the runtime's declared state root, refuses a build by name when that root is unwritable, and records one result row per check on a writable root.
  acceptance:
  - id: AC1
    statement: 'AC1: the node takes its state root from its injected config or declared overlay -- falsifier: a literal /app path decides where it writes'
  - id: AC2
    statement: 'AC2: with an unwritable root it refuses with a named reason and no crash -- falsifier: a PermissionError traceback in the runtime log'
  - id: AC3
    statement: 'AC3: on a dev build one result row per check is written and read back -- falsifier: no row after a build'
evidence_requirements:
- kind: tests
  description: The node's focused tests; the unwritable-root tests failing first with the raw PermissionError, then passing.
  command: uv run pytest tests/nodes/node_build_delegation_checks -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn26678-ac1-state-root-from-config
  description: With the registry root closed to writes and ONEX_STATE_DIR naming a writable directory, the build history lands under that directory and nothing is created under the registry root; the history path is the overlay's relative path, and an absolute or parent-escaping path is refused. The test fails on a handler that derives the path from the registry root or a literal; the probe each check runs gets its own state directory under that root (the {state_root} placeholder), never one under the registry root.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_build_delegation_checks/test_state_root.py -q --no-cov -n 0 -p no:randomly
    cwd: .
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_build_delegation_checks/test_probe_state_dir.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn26678-ac2-named-refusal
  description: With a state root under a regular file, and with a PermissionError making the history directory, the handler answers with status refused and a reason naming the history path, the cause and the ONEX_STATE_DIR key; it raises nothing and runs no check. The tests fail on a store that lets the OSError escape.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_build_delegation_checks/test_state_root.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn26678-ac3-result-row-per-check
  description: After a build on a writable state root the history file holds one row per configured check and the store reads each row back with the build's id. The test fails on a handler that records no row.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_build_delegation_checks/test_state_root.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn26678-ac2-unreadable-history-named-refusal
  description: With an existing history file the process cannot read, or one that is not valid JSON, the store raises the named build-store error (path, cause and the ONEX_STATE_DIR key) and the handler answers with status refused and runs no check; no bare PermissionError or JSONDecodeError leaves the node. The tests fail on a store that reads the history outside the named-error path.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_build_delegation_checks/test_state_root.py -q --no-cov -n 0 -p no:randomly -k "history"
    cwd: .
- id: dod-omn26678-hosted-deploy-check
  description: 'Deploy check the hosted runner can run: the handler resolves the history path through the declared state root helper and answers an unwritable root with the refused status, and the store names the state root keys in its refusal. This binds no criterion by itself.'
  source: manual
  checks:
  - check_type: command
    check_value: grep -q 'resolve_onex_state_root' src/omnimarket/nodes/node_build_delegation_checks/handlers/handler_build_delegation_checks.py
    cwd: .
  - check_type: command
    check_value: grep -q 'EnumBuildChecksStatus.REFUSED' src/omnimarket/nodes/node_build_delegation_checks/handlers/handler_build_delegation_checks.py
    cwd: .
  - check_type: command
    check_value: grep -q 'ONEX_STATE_DIR' src/omnimarket/nodes/node_build_delegation_checks/adapters/file_build_store.py
    cwd: .
- id: dod-omn26678-integration-proof
  description: On a lab host, with the branch checked out at its pushed sha, the state root test runs the contract-bound handler with a known good root (history written and read back) and an unwritable root (refused by name). Hosted CI holds no lab host, so only the local Done gate runs this unbound check (the lab reading is in the PR's Lab comment).
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: onex lab-work run --bus-lane dev --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-26678-state-root --kind test -- uv run --frozen pytest tests/nodes/node_build_delegation_checks/test_state_root.py -q --no-cov -n 0 -p no:randomly
    cwd: .
