schema_version: 1.0.0
ticket_id: OMN-25071
title: 'Run-stable scenario alarms: one row and request id across a bucket boundary, and the golden chain runs the rendered argv'
summary: 'The delegation scenario alarm node keys a failed run with a readable ran_at on ran_at alone, so ticks on each side of a six-hour boundary write one row and one request id; its golden chain passes
  the rendered unit argv to the real parser and asserts exit 0. The pricing and contract findings of the same review ticket (its AC3 and AC4: the cost pull request''s contract item and its overlay test)
  are read by the contract of that pull request, because the files they name are not in this tree.'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn25071-ac1
  statement: Readable failed and refused runs keep an identical row and request id across a six-hour boundary. Missing and stale records recur by bucket.
  acceptance:
  - id: AC1
    statement: 'AC1: a run with a readable ran_at is keyed on ran_at alone (the bucket only for a missing or stale record), so ticks on each side of a six-hour boundary write one row and one request id,
      with a test -- falsifier: `uv run --frozen pytest tests/nodes/node_delegation_scenario_alarm_effect/test_golden_chain_delegation_scenario_alarm.py -k boundary -q` passes with the keying in handler_delegation_scenario_alarm.py
      reverted to the bucket'
- id: req-omn25071-ac2
  statement: The rendered unit arguments reach the real parser; the subprocess appender reads its accepted JSON receipt, and the tick must return zero with no unappended alarms.
  acceptance:
  - id: AC2
    statement: 'AC2: the golden-chain test passes the full rendered argv to the CLI parser, stubs the CLI''s real accepted reply and asserts exit 0 -- falsifier: `uv run --frozen pytest tests/nodes/node_delegation_scenario_alarm_effect/test_golden_chain_delegation_scenario_alarm.py
      -k "rendered or tick_exit" -q` passes with a rendered flag the parser rejects'
- id: req-omn25071-ac5
  statement: The alarm readers and the backdated ledger stamp are tested in this pull request; findings 5 and 7 are on the cost pull request. The comments naming findings 5 to 8 are read from that pull
    request.
  acceptance:
  - id: AC5
    statement: 'AC5: each non-blocking finding 5 to 8 (None endpoint and model into the declared price, the discovery test against the runtime wiring, the AC10 head and backend_id wording, the alarm readers
      and the backdated stamp) is fixed in the push or argued with evidence in a PR comment -- falsifier: `onex scm pr-view --source bus OmniNode-ai/omnimarket#6335` shows no comment that opens with the
      Lab marker for the head and names each of findings 5, 6, 7 and 8'
- id: req-omn25071-ac6
  statement: The Lab comment and required check-runs of the cost pull request are live evidence read by a local Done gate command.
  acceptance:
  - id: AC6
    statement: 'AC6: a PR comment starting `Lab: head=<full new head sha>` names the sha, the lab-work command and exit 0, and every required check-run of omnimarket#6335 reads success at the new head --
      falsifier: `onex scm pr-checks OmniNode-ai/omnimarket#6335` lists a required context that is not success at the new head, or the Lab comment lacks the full sha, the command or exit 0'
evidence_requirements:
- kind: tests
  description: The alarm node golden-chain tests and the registry unit tests.
  command: uv run --frozen pytest tests/nodes/node_delegation_scenario_alarm_effect tests/nodes/node_host_installer_registry_units -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn25071-ac1
  description: Readable failed and refused runs keep an identical row and request id across a six-hour boundary. Missing and stale records recur by bucket.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_delegation_scenario_alarm_effect/test_golden_chain_delegation_scenario_alarm.py -k boundary -q --no-cov -n 0 -p no:randomly
    cwd: .
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_delegation_scenario_alarm_effect/test_golden_chain_delegation_scenario_alarm.py -k "bucketed_stale or second_tick_over_a_failed_run or one_bucket"
      -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn25071-ac2
  description: The rendered unit arguments reach the real parser; the subprocess appender reads its accepted JSON receipt, and the tick must return zero with no unappended alarms.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_delegation_scenario_alarm_effect/test_golden_chain_delegation_scenario_alarm.py -k "rendered or tick_exit" -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn25071-ac5
  description: Findings 6 and 8 (the discovery test against the runtime wiring, the alarm readers and the backdated stamp) are tested in the alarm golden chain; each of findings 5, 6, 7 and 8 is read inside
    the one comment of omnimarket#6335 that opens with the Lab marker for the head the PR watcher records. Local Done gate only.
  source: manual
  binds_ac:
  - AC5
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: uv run --frozen pytest tests/nodes/node_delegation_scenario_alarm_effect/test_golden_chain_delegation_scenario_alarm.py -q --no-cov -n 0 -p no:randomly
    cwd: .
  - check_type: command
    check_value: sh -c 'H=$(python3 "${OMNI_PLUGIN_ROOT:?}/skills/merge-drain/scripts/pr_state_local.py" --pr OmniNode-ai/omnimarket#6335 --json | python3 -c "import json,sys; print(json.load(sys.stdin)[sys.argv[1]][sys.argv[2]])"
      facts head_sha) && test "${#H}" -eq 40 && onex scm pr-view --source bus OmniNode-ai/omnimarket#6335 | python3 tests/nodes/node_delegation_scenario_alarm_effect/pr_comment_check.py --head "$H" --finding
      5 --finding 6 --finding 7 --finding 8'
    cwd: .
- id: dod-omn25071-ac6
  description: The one comment of omnimarket#6335 that opens with the Lab marker for the full 40-character head the PR watcher records names the lab-work command and exit 0 (the first check), and the PR
    watcher reads no red, pending or cancelled check-run at that head through onex scm pr-checks, read from the watcher (the second). Local Done gate only.
  source: manual
  binds_ac:
  - AC6
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: sh -c 'H=$(python3 "${OMNI_PLUGIN_ROOT:?}/skills/merge-drain/scripts/pr_state_local.py" --pr OmniNode-ai/omnimarket#6335 --json | python3 -c "import json,sys; print(json.load(sys.stdin)[sys.argv[1]][sys.argv[2]])"
      facts head_sha) && test "${#H}" -eq 40 && onex scm pr-view --source bus OmniNode-ai/omnimarket#6335 | python3 tests/nodes/node_delegation_scenario_alarm_effect/pr_comment_check.py --head "$H" --lab'
    cwd: .
  - check_type: command
    check_value: sh -c 'H=$(python3 "${OMNI_PLUGIN_ROOT:?}/skills/merge-drain/scripts/pr_state_local.py" --pr OmniNode-ai/omnimarket#6335 --json | python3 -c "import json,sys; print(json.load(sys.stdin)[sys.argv[1]][sys.argv[2]])"
      facts head_sha) && test "${#H}" -eq 40 && onex scm pr-checks --source local OmniNode-ai/omnimarket#6335 | python3 -c "import json,sys; r=json.load(sys.stdin)[sys.argv[2]]; sys.exit(0 if r[sys.argv[3]]==sys.argv[1]
      and not r[sys.argv[4]] and not r[sys.argv[5]] and not r[sys.argv[6]] and r[sys.argv[7]] else 1)" "$H" result head_sha red pending cancelled runs'
    cwd: .
- id: dod-omn25071-integration-proof
  description: The alarm node tests and the installer registry unit tests run on a lab host at the pushed head through the lab work runner; hosted CI cannot reach the lab, so only the local Done gate runs
    this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --bus-lane dev --omnibase-path "${OMNI_HOME:?}" --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-25071
      --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_delegation_scenario_alarm_effect tests/nodes/node_host_installer_registry_units -q --no-cov -n 0 -p no:randomly
    cwd: .
