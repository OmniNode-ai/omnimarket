schema_version: 1.0.0
ticket_id: OMN-25071
title: 'Review round four: run-stable alarms, rendered argv, scoped evidence and observed route pins'
summary: Failed runs retain one request id across alarm buckets; parser and append receipts are exercised; partial live ancestry stays unbound; route pins are checked against host readings.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn25071-ac1
  statement: Readable failed and refused runs keep an identical row and request id across a six-hour boundary. Missing and stale records recur by bucket.
  acceptance:
  - id: AC1
    statement: 'AC1: a run with a readable ran_at is keyed on ran_at alone (the bucket only for a missing or stale record), so ticks on each side of a six-hour boundary write one row
      and one request id, with a test -- falsifier: `uv run --frozen pytest tests/nodes/node_delegation_scenario_alarm_effect -k boundary -q` passes with the keying in handler_delegation_scenario_alarm.py
      reverted to the bucket'
- id: req-omn25071-ac2
  statement: The rendered unit arguments reach the real parser; the subprocess appender reads its accepted JSON receipt, and the tick must return zero with no unappended alarms.
  acceptance:
  - id: AC2
    statement: 'AC2: the golden-chain test passes the full rendered argv to the CLI parser, stubs the CLI''s real accepted reply and asserts exit 0 -- falsifier: `uv run --frozen pytest
      tests/nodes/node_delegation_scenario_alarm_effect/test_golden_chain_delegation_scenario_alarm.py -q` passes with a rendered flag the parser rejects'
- id: req-omn25071-ac3
  statement: The partial R8 installation diagnostic is unbound from AC3. Repository settings read on 2026-11-16 allow squash only (merge commits and rebase are disabled).
  acceptance:
  - id: AC3
    statement: 'AC3: the AC3 item of contracts/[OMN-24874](https://linear.app/omninode/issue/OMN-24874).yaml reads the running revision of the R8 unit, the alarm unit and the dev runtime,
      or is unbound, and the squash merge method is read so the grep cannot match an unsquashed commit, with a test -- falsifier: `uv run --frozen pytest tests -k "omn24874 and contract"
      -q` passes with the item reading only the R8 installed.json'
- id: req-omn25071-ac4
  statement: Probe endpoint and model pins are compared against sanitized overlay and canonical terminal readings, and the catalogue backend endpoint is independently compared with the
    pin.
  acceptance:
  - id: AC4
    statement: 'AC4: the probe endpoint and the R8 model_used literals in test_omn24874_tenant_overlay_terminal_cost.py are read from the overlay row and an R8 terminal on h053 and cited
      with the reading, with a test -- falsifier: `uv run --frozen pytest tests/unit/delegation/test_omn24874_tenant_overlay_terminal_cost.py -q` passes with the probe endpoint changed
      to a form the h053 overlay row does not hold'
- id: req-omn25071-ac5
  statement: Missing endpoint or model stays unpriced, the infrastructure routing resolver ignores the legacy handler block with a positive routing control, the AC10 check names the
    full checkout head, and the append tests cover a nearly six-hour backdated outage row. Findings 5 through 8 are discussed in the review comment.
  acceptance:
  - id: AC5
    statement: 'AC5: each non-blocking finding 5 to 8 (None endpoint and model into the declared price, the discovery test against the runtime wiring, the AC10 head and backend_id wording,
      the alarm readers and the backdated stamp) is fixed in the push or argued with evidence in a PR comment -- falsifier: `onex scm pr-view OmniNode-ai/omnimarket#6335 --comments`
      shows no PR comment that names each of findings 5, 6, 7 and 8'
- id: req-omn25071-ac6
  statement: 'Unbound local diagnostic only: the lane STATUS row must name the full checkout head and lab exit zero. The Lab comment and required check-runs at that new head remain live
    evidence; this check does not attest them.'
  acceptance:
  - id: AC6
    statement: 'AC6: a PR comment starting `Lab: head=<full new head sha>` names the sha, the lab-work command and exit 0, and every required check-run of omnimarket#6335 reads success
      at the new head -- falsifier: `onex scm pr-checks OmniNode-ai/omnimarket#6335` lists a required context that is not success at the new head, or the Lab comment lacks the full sha,
      the command or exit 0'
