schema_version: 1.0.0
ticket_id: OMN-24348
title: The daily landing canary produces a result in the dev runtime instead of a dispatcher error
summary: 'node_landing_canary_scheduled_effect opens its test pull request on one tick and settles it on later ticks. settle_canary built a fresh canary repository instead of the one open_canary used, so on the in-memory backend InMemoryCanaryRepo.state hit its assert and every tick died with an empty AssertionError (dev runtime log, 151 in 45 minutes after the 2026-11-14T01:21Z roll). The pending run now carries the repository that opened it and settle_canary reuses it; the scm backend is stateless and behaves as before.'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24348-canary-resumes-opening-repo
  statement: A later tick settles the landing canary's run through the repository that opened it, so the daily canary ends in a reading or a stated failure and never in an empty AssertionError.
  acceptance:
  - id: AC1
    statement: 'AC1: open_canary followed by settle_canary on the in-memory canary backend settles the run instead of raising -- falsifier: uv run pytest tests/nodes/node_landing_canary_scheduled_effect -q -k resumes_the_opening_repo fails on the unchanged code with AssertionError'
  - id: AC2
    statement: 'AC2: a state read failure on the resumed repository does not raise out of the tick: the run settles at its landing bound with a stated reason -- falsifier: uv run pytest tests/nodes/node_landing_canary_scheduled_effect -q -k state_error fails on the unchanged code'
  - id: AC3
    statement: 'AC3: integrated: in the running dev runtime, the canary''s scheduled tick produces a schedule run event (completed or failed with a stated reason) and no AssertionError dispatcher failure for node_landing_canary_scheduled_effect is logged after the roll -- falsifier: docker logs of the dev runtime container hold a dispatcher failure for node_landing_canary_scheduled_effect after the new revision is running'
evidence_requirements:
- kind: tests
  description: The canary node's focused tests pass at the pushed head.
  command: uv run --frozen pytest tests/nodes/node_landing_canary_scheduled_effect -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
