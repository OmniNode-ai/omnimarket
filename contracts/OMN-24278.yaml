schema_version: 1.0.0
ticket_id: OMN-24278
title: Install the power monitor (NUT) on h201 and h202 from declared settings
summary: 'The UPS data cable is plugged into h201 (CyberPower CP1500PFCLCDa, USB 0764:0601). node_host_installer_net_units could write only /usr/local/sbin and /etc/systemd/system files owned by root, with
  no secret in any payload, so a NUT configuration with monitor passwords had no declared path. The node now has a nut-config kind (files directly under /etc/nut/, group nut), a files-level secrets
  map whose __SECRET_<NAME>__ placeholders are filled from the secret store at plan time and never printed, hashed into a result field or logged (the sha256 pin is the pin of the template before the secret
  is filled), and active_services that must be active before an install counts. node_secret_store_effect declares the two generated keys nut_primary_password and nut_secondary_password. The overlays
  repository declares the h201 primary and h202 secondary units (overlays/nut_ups).'
is_seam_ticket: true
interface_change: true
interfaces_touched:
- public_api
requirements:
- id: req-omn24278-nut-config-with-secrets
  statement: A NUT configuration with monitor passwords is installed from declared overlay values by the host net unit installer, the passwords read from the secret store and never printed.
  acceptance:
  - id: AC1
    statement: 'AC1: the host net unit installer fills a secret from the secret store into a file under /etc/nut with group nut, never prints it, and refuses with a typed reason when the store cannot
      answer -- falsifier: uv run pytest tests/nodes/node_host_installer_net_units/test_host_net_units_secrets.py -q fails at the merge base'
  - id: AC2
    statement: 'AC2: the overlays repository declares the h201 primary and h202 secondary NUT units with every value (UPS model ids, listen address, user names, secret names) as an overlay value and no
      secret in the file -- falsifier: python -m pytest tests/test_nut_ups_overlay.py -q fails when one value is typed outside the values map'
  - id: AC3
    statement: 'AC3: integrated: in the running hosts, upsc on h201 and from h202 returns ups.status, battery.charge, ups.load and battery.runtime for the CyberPower unit, and upsmon on both reports
      the monitor connected -- falsifier: the query from h202 is refused or returns no battery.charge'
evidence_requirements:
- kind: tests
  description: The net unit installer tests pass at the pushed head.
  command: uv run pytest tests/nodes/node_host_installer_net_units -q -n 0 --no-cov -p no:cacheprovider
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24278-ac1
  description: 'AC1: the secret file lands in group nut with the secret in the bytes and nowhere in a result field; an unresolved secret is a typed refusal that writes nothing; the pin is the template pin
    (failing control: a pin of the filled bytes is refused).'
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_host_installer_net_units/test_host_net_units_secrets.py -q -n 0 --no-cov -p no:cacheprovider
    cwd: .
- id: dod-omn24278-ac2
  description: 'hosted proxy for AC2: the seam test of the generated key names (the overlays repository holds the overlay and its own test of the same list) passes; the overlay test runs in the overlays
    repository.'
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_host_installer_net_units/test_host_net_units_secrets.py -q -n 0 --no-cov -p no:cacheprovider -k "generated_keys"
    cwd: .
- id: dod-omn24278-ac3
  description: 'hosted proxy for AC3: the installer tests pass; the in-runtime reading (upsc on h201 and from h202, upsmon connected) is taken on the lab hosts after the install from the branch and named in
    the pull request.'
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_host_installer_net_units -q -n 0 --no-cov -p no:cacheprovider
    cwd: .
- id: dod-omn24278-integration-proof
  description: the net unit installer tests run on a lab host at the pushed head; hosted CI cannot reach the lab, so only the local Done gate runs this unbound check
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24278 --kind test -- env PYTHONDONTWRITEBYTECODE=1
      uv run --frozen pytest tests/nodes/node_host_installer_net_units -q --no-cov
