schema_version: 1.0.0
ticket_id: OMN-23931
title: The emissions view is published on the broker the board reads
summary: node_floor_emissions_publish_effect reads an optional snapshot_kafka_bootstrap in its overlay and publishes the floor emissions snapshot on that broker, reading the emission topics from its own bus; with the key absent it publishes on the read broker as before.
is_seam_ticket: true
interface_change: true
interfaces_touched:
- topics
requirements:
- id: req-omn23931-publish-broker
  statement: The floor emissions publisher takes the broker of its snapshot publication from its overlay and keeps reading the emission topics from its read bus.
  acceptance:
  - id: AC1
    statement: "AC1: the publisher opens the broker its overlay names for the snapshot and the read bus for the emission topics, and opens only the read bus when no snapshot broker is named -- falsifier: pytest tests/nodes/node_floor_emissions_publish_effect/test_publish_broker_omn23931.py -q fails on the base commit (the overlay key is refused as an extra input)."
  - id: AC2
    statement: "AC2: the settings example names the publish broker key as null and the lab settings in the overlays repository name the broker, added after this code is on the landing branch -- falsifier: the overlays settings test fails when the key is absent from the lab settings of the step."
  - id: AC3
    statement: "AC3: integrated: a run of the step on a lab host from the branch publishes the snapshot and a read of the snapshot topic shows it with its chain count and origins -- falsifier: the same read before the run finds no publication; host, revision, chain count and origins are named in a comment on the ticket."
evidence_requirements:
- kind: tests
  description: The node's focused tests pass at the pushed head.
  command: uv run pytest tests/nodes/node_floor_emissions_publish_effect -q -n 0 --no-cov -p no:cacheprovider
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23931-ac1
  description: 'AC1: the publish broker tests pass; the test file is added by this change and fails at the merge base (the overlay refuses the key).'
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_floor_emissions_publish_effect/test_publish_broker_omn23931.py -q -n 0 --no-cov -p no:cacheprovider
    cwd: .
- id: dod-omn23931-ac2
  description: 'AC2 (hosted proxy): the overlay example validates with the key null and validates without it, so an overlay written before this change still loads.'
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_floor_emissions_publish_effect/test_publish_broker_omn23931.py -q -n 0 --no-cov -p no:cacheprovider -k "without_the_key or unknown_key"
    cwd: .
- id: dod-omn23931-ac3
  description: 'hosted proxy for AC3: the seam and golden tests of the publish node pass here; the reading of the snapshot topic on the lab is posted as a pull request comment naming the head.'
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_floor_emissions_publish_effect -q -n 0 --no-cov -p no:cacheprovider -k "not real_broker"
    cwd: .
