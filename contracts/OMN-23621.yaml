schema_version: 1.0.0
ticket_id: OMN-23621
title: 'A declared installer for the code tree a lab host unit runs from'
summary: 'The code tree under a lab host unit (an exported copy of a registry repository with its generated virtual environment) was made once by hand and had no declared way to be brought to a merged revision. A new node installs such a tree from one named commit of a clone, checked equal to the commit blob for blob, keeps only the paths its overlay row names (the virtual environment), runs the row declared sync and smoke commands, swaps the tree in by rename, rolls back on any failed check and records the revision. Each tree is one overlay row; nothing is hard-coded.'
is_seam_ticket: true
interface_change: true
interfaces_touched:
- public_api
requirements:
- id: req-omn23621-unit-tree-install
  statement: A unit row installs the unit code tree from one commit, rolls back on a failed sync or smoke check, and refuses an unknown unit or host, an unreadable ref and a missing root, each with the failing check named.
  acceptance:
  - id: AC1
    statement: 'AC1: a declared unit row installs the unit''s code tree from one named commit of the clone, equal blob for blob to that commit, keeps only the paths the row names from the previous tree, and records the commit; a request for a unit the overlay does not name is refused -- falsifier: pytest tests/nodes/node_unit_tree_install_effect/test_unit_tree_install.py -q'
  - id: AC2
    statement: 'AC2: a failing smoke or sync command puts the previous tree back and names the failed check, and an unreadable clone or ref installs nothing -- falsifier: pytest tests/nodes/node_unit_tree_install_effect/test_error_chain_unit_tree_install.py -q'
  - id: AC3
    statement: 'AC3: golden and error chain event tests pass on the in-memory bus and fail without the change -- falsifier: pytest tests/nodes/node_unit_tree_install_effect/test_golden_chain_unit_tree_install.py tests/nodes/node_unit_tree_install_effect/test_error_chain_unit_tree_install.py -q'
  - id: AC4
    statement: 'AC4: integrated: on h053 the node installs the dev deploy reading''s tree at the merged revision, its install record names that revision, and the next hourly dev-deploy-reading STATUS row after the install is written by that tree -- falsifier: read the install record and the newest dev-deploy-reading STATUS row after the unit''s next run'
evidence_requirements:
- kind: tests
  description: The unit tree install tests pass at the pushed head; with the smoke loop emptied by an injected break, the failing-smoke rollback test fails.
  command: uv run --frozen pytest tests/nodes/node_unit_tree_install_effect -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23621-install-tests
  description: The install, error chain and golden chain tests pass at the pushed head.
  source: manual
  binds_ac:
  - AC1
  - AC2
  - AC3
  checks:
  - check_type: test_passes
    check_value: 'uv run --frozen pytest tests/nodes/node_unit_tree_install_effect -q --no-cov -n 0 -p no:randomly'
    cwd: .
- id: dod-omn23621-runtime-entry
  description: 'Integrated, hosted: the node runs as an operator runs it, python -m omnimarket.nodes.node_unit_tree_install_effect in a subprocess under an overlay root, installs the tree from the overlay row and prints the pass verdict; a unit the overlay does not name exits 1 with nothing written and a missing overlay installs nothing. The entry does not exist at the merge base, so the control fails there. The live install of the dev deploy reading tree on h053 is the unbound local item below.'
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: 'uv run --frozen pytest tests/nodes/node_unit_tree_install_effect -q --no-cov -n 0 -p no:randomly -k runtime_entry'
    cwd: .
- id: dod-omn23621-integration-proof-lab
  description: Runs the tests at the pushed head on a lab host through the lab work runner; hosted CI cannot reach the lab runner, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: 'env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23621 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_unit_tree_install_effect -q --no-cov -n 0 -p no:randomly'
    cwd: .
