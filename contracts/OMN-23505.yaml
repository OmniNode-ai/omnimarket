schema_version: 1.0.0
ticket_id: OMN-23505
title: Move the merge check's list loading into a factory building block
summary: node_ci_summary_registry_compute resolves the CI Summary poller's sweep-exclusion registry and its per-check advisory/blocking registry (check-mode contract plus overlay) from their parsed contents into exclusions, the conclusions each declared check adds to success, and named refusals for a missing or malformed registry. Its runtime module reads the request as JSON on stdin and answers on stdout so the workflow step can keep the result in a file the poller, which runs with no installed packages, reads. This change adds the node and its tests; the gate switch to read it lands with the pull request that needs the room (omnimarket#5397).
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23505-registry-node
  statement: The sweep registries are read and validated by a node, with the same results as the loaders the gate carried, and a bad registry admits nothing.
  acceptance:
  - id: AC1
    statement: 'AC1: a node in omnimarket reads the sweep-exclusion list and the check-mode contract and overlay, and returns the same exclusions, check modes and refusals the poller computed before -- falsifier: uv run --frozen pytest tests/unit/nodes/test_golden_chain_node_ci_summary_registry_compute.py -q -k ''golden or parity'''
  - id: AC2
    statement: 'AC2: a missing, unparsable or malformed list is refused with a named error and admits nothing -- falsifier: uv run --frozen pytest tests/unit/nodes/test_golden_chain_node_ci_summary_registry_compute.py -q -k ''error or refuses'''
evidence_requirements:
- kind: tests
  description: The registry node's golden, parity, error, runtime and failing-control tests.
  command: uv run --frozen pytest tests/unit/nodes/test_golden_chain_node_ci_summary_registry_compute.py -q -n 0 --no-cov -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23505-golden-parity
  description: Resolves the shipped sweep-exclusion file and a check-mode contract with overlay through the node and compares with what the old loader expression produced. At the merge base the node does not exist, so the test module fails to import.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/nodes/test_golden_chain_node_ci_summary_registry_compute.py -q -n 0 --no-cov -p no:randomly -k 'golden or parity'
    cwd: .
- id: dod-omn23505-error-refusals
  description: A malformed overlay entry, a malformed contract, an unreadable file and a malformed exclusion entry are each refused with a named finding, and the failing control (validation removed) shows the refusal test red. At the merge base the node does not exist.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/nodes/test_golden_chain_node_ci_summary_registry_compute.py -q -n 0 --no-cov -p no:randomly -k 'error or refuses or control or runtime or contract'
    cwd: .
- id: dod-omn23505-integration-proof-lab
  description: Runs the node tests at the pushed head on a lab host through the lab work runner. Hosted CI cannot reach the lab runner, so only the local Done gate runs this unbound item.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: 'env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23505 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/nodes/test_golden_chain_node_ci_summary_registry_compute.py -q --no-cov -p no:randomly'
    cwd: .
