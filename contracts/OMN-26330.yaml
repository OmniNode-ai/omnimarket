schema_version: 1.0.0
ticket_id: OMN-26330
title: Ledger-file census, omnimarket runtime readers move to the bus - ruling recovery and the operator capture one-shot commands read the ledger window from the ledger reader node
summary: >-
  The idle-slot-fill ruling recovery and the operator capture's one-shot process and digest commands no
  longer read the ledger file or its path variable: each asks the work ledger reader node for its window
  of rows through the shared rows reader port, and an unread window is named unread, never an empty one.
  The operator capture's appender no longer requires the path variable. Four runtime files leave the
  census and its per-file ratchet rows are lowered; the other runtime files of the group are classified
  in the pull request body and stay, each with the reason.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn26330-readers-to-bus
    statement: A ruling-recovery tick and an operator capture one-shot run read their ledger rows through the ledger reader node with the ledger file path variable unset and no ledger file present.
    acceptance:
      - id: AC1
        statement: >-
          AC1: the census prints no hit for handler_ruling_recovery.py, capture_ports.py,
          runtime_capture_cli.py or the operator capture contract.yaml -- falsifier: the census run
          with --per-file --verbose prints a hit for one of those four files
      - id: AC2
        statement: >-
          AC2: the ratchet rows of the cleared files are lowered with the census node's --lower and no
          row is raised or added -- falsifier: git diff origin/dev -- the ratchet file shows an added
          or raised line, or the census run exits non-zero
      - id: AC3
        statement: >-
          AC3: each moved reader has a test that fails on the old code and passes on the change, and the
          node tests stay green -- falsifier: the focused pytest run below exits non-zero
evidence_requirements:
  - kind: tests
    description: The ruling recovery and operator capture tests pass at the pushed head; the new bus-read tests fail at the merge base.
    command: uv run --frozen pytest tests/nodes/node_idle_slot_fill_effect tests/nodes/test_ruling_recovery.py tests/unit/nodes/node_operator_capture_effect tests/unit/nodes/node_operator_capture_compute -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn26330-ac1-census
    description: The census over this tree exits 0 and prints no hit for the four cleared files (positive control, the same command at the merge base prints the hits).
    source: manual
    binds_ac: [AC1]
    checks:
      - check_type: command
        check_value: >-
          bash -o pipefail -c 'cd "$PWD" && ! env ONEX_LEDGER_CENSUS_ROOT="$(dirname "$PWD")" uv run --frozen python -m omnimarket.nodes.node_work_ledger_file_census_effect --packaged-overlay --repos omnimarket --directory omnimarket="$PWD" --per-file --verbose | grep -E "handler_ruling_recovery.py|node_operator_capture_effect/(contract.yaml|handlers/capture_ports.py|runtime_capture_cli.py)"'
        cwd: .
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/nodes/node_work_ledger_file_census_effect/test_omn26330_cleared_files.py -q --no-cov -n 0 -p no:randomly
        cwd: .
  - id: dod-omn26330-ac2-ratchet
    description: The census exits 0 with the lowered per-file rows, the ratchet total reads 133 and no cleared file keeps a row (at the merge base the ratchet reads 140 and still holds those rows, so this fails there).
    source: manual
    binds_ac: [AC2]
    checks:
      - check_type: command
        check_value: >-
          bash -o pipefail -c 'env ONEX_LEDGER_CENSUS_ROOT="$(dirname "$PWD")" uv run --frozen python -m omnimarket.nodes.node_work_ledger_file_census_effect --packaged-overlay --repos omnimarket --directory omnimarket="$PWD" --per-file && r=src/omnimarket/nodes/node_work_ledger_file_census_effect/ratchet.yaml && grep -qE "^  omnimarket: 133$" "$r" && ! grep -E "handler_ruling_recovery.py|node_operator_capture_effect/(contract.yaml|handlers/capture_ports.py|runtime_capture_cli.py)" "$r"'
        cwd: .
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/nodes/node_work_ledger_file_census_effect/test_omn26330_cleared_files.py -q --no-cov -n 0 -p no:randomly
        cwd: .
  - id: dod-omn26330-ac3-tests
    description: The new bus-read tests (ruling recovery, capture digest, capture process, capture CLI, the appender) pass at the head; each fails at the merge base (red then green in the pull request body).
    source: manual
    binds_ac: [AC3]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/nodes/node_idle_slot_fill_effect/test_ruling_recovery_bus_read.py tests/unit/nodes/node_operator_capture_effect/test_capture_bus_read.py -q --no-cov -n 0 -p no:randomly
        cwd: .
  - id: dod-omn26330-ac3-node-tests
    description: The existing tests of the touched nodes pass with no assertion removed.
    source: manual
    binds_ac: [AC3]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/nodes/node_idle_slot_fill_effect tests/nodes/test_ruling_recovery.py tests/unit/nodes/node_operator_capture_effect tests/unit/nodes/node_operator_capture_compute -q --no-cov -n 0 -p no:randomly
        cwd: .
  - id: dod-omn26330-deploy
    description: 'Deploy probe the hosted runner can run: the rows-narrowing function the capture one-shot commands call exists at the checked-out commit on GitHub; it does not exist at the merge base.'
    source: manual
    checks:
      - check_type: command
        check_value: >-
          bash -o pipefail -c 'gh api "repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_operator_capture_effect/handlers/ledger_read.py?ref=$(git rev-parse HEAD)" --jq .content | base64 -d | grep -F "def bus_relevant_rows" > /dev/null'
        cwd: .
  - id: dod-omn26330-integration-proof
    description: The pushed head ran the touched node tests on a lab host through the bus and exited 0. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: >-
          onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane censusF-0440 -- uv run --frozen pytest tests/nodes/node_idle_slot_fill_effect tests/nodes/test_ruling_recovery.py tests/unit/nodes/node_operator_capture_effect tests/unit/nodes/node_operator_capture_compute -q --no-cov -n 0 -p no:randomly
        cwd: .
