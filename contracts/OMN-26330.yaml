schema_version: 1.0.0
ticket_id: OMN-26330
title: The topic provision apply creates the publish topics a host-timer contract declares
summary: The existing apply of node_topic_provision_dry_run_effect also creates each event_bus publish topic of a contract that declares runtime_dispatch.host_unit, because a host timer is not a runtime node and no runtime boot creates what it publishes. Run by a service login with create rights; creates nothing by hand.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn26330-host-timer-topics
  statement: A topic declared by a host-timer contract can be created from the contract by a service login before the timer's pull request is deployed.
  acceptance:
  - id: AC1
    statement: 'AC1: the apply creates the host-timer contract publish topic once and a second run creates nothing -- falsifier: test_apply_creates_the_host_timer_publish_topic_once fails'
  - id: AC2
    statement: 'AC2: the apply leaves a routed contract publish topic to the runtime boot -- falsifier: test_apply_leaves_a_routed_contracts_topic_to_the_runtime_boot fails'
evidence_requirements:
- kind: tests
  description: The host-timer topic apply tests and the existing topic provision tests pass.
  command: uv run --frozen pytest tests/unit/nodes/node_topic_provision_dry_run_effect tests/unit/nodes/node_topic_provision_plan_compute -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn26330-ac1
  description: 'AC1: the apply creates the host-timer topic once; a second run issues no create.'
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/nodes/node_topic_provision_dry_run_effect/test_host_timer_topic_apply.py -q --no-cov -n 0 -p no:randomly -k "creates_the_host_timer"
    cwd: .
- id: dod-omn26330-ac2
  description: 'AC2: a routed contract topic is not created by the apply.'
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/nodes/node_topic_provision_dry_run_effect/test_host_timer_topic_apply.py -q --no-cov -n 0 -p no:randomly -k "routed"
    cwd: .
- id: dod-omn26330-integration-proof
  description: Hosted CI cannot reach a lab host, so only the local Done gate runs this unbound check. It runs the host-timer topic apply tests at the sha on a lab host, where the apply reads the contract tree the way the provisioning runs it.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-26330 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/nodes/node_topic_provision_dry_run_effect/test_host_timer_topic_apply.py -q --no-cov -n 0 -p no:randomly
    cwd: .
