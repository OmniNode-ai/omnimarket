---
schema_version: "1.0.0"
ticket_id: "OMN-21396"
title: "Lanes start on the cheapest engine that can do them and escalate up the chain, each attempt a ledger row"
summary: >
  node_remote_lane_compute takes optional engine-ladder facts on its placement
  request. It picks the first engine in the order code-edit, GLM, Codex, Claude
  sonnet, Claude opus that the lane's risk class (or kind), the ROUTE ceiling and
  the pins allow and that has capacity, retries a failed, blocked-own-work or
  checks-red attempt on the next engine up, and returns one kind=experiment row
  for the last attempt. The throughput tick prints one line per engine over 24
  hours from those rows. A request without ladder facts places as before.
is_seam_ticket: false
interface_change: true
interfaces_touched:
  - "public_api"
requirements:
  - id: "req-omn21396-start-cheap"
    statement: "A lane starts on the cheapest allowed engine with capacity."
    acceptance:
      - id: "AC1"
        statement: "AC1: the remote lane placement node (omnimarket node_remote_lane_compute) picks the first engine in the order local code-edit, GLM, Codex, Claude sonnet, Claude opus that the lane's kind, risk class and ROUTE ceiling allow and that has capacity"
  - id: "req-omn21396-escalate"
    statement: "A failed attempt is retried on the next engine up, within the ceiling and the pins."
    acceptance:
      - id: "AC2"
        statement: "AC2: an attempt that ends failed, blocked on its own work, or with its declared checks red is retried on the next engine up, never above the ROUTE ceiling, and a lane declaring Required engine: claude never starts below Claude"
  - id: "req-omn21396-experiment-rows"
    statement: "Every attempt yields one kind=experiment STATUS row."
    acceptance:
      - id: "AC3"
        statement: "AC3: every attempt writes one ledger STATUS row with kind=experiment carrying lane, engine, model, outcome, failure cause, duration and next engine"
  - id: "req-omn21396-tick-line"
    statement: "The throughput tick prints one line per engine over 24 hours."
    acceptance:
      - id: "AC4"
        statement: "AC4: the throughput tick prints one line per engine over 24 hours with attempts, successes and escalations"
  - id: "req-omn21396-scm-unanswered-read-retry"
    statement: "Gateway reads retry when the bus is unavailable or gives no terminal event."
    acceptance:
      - id: "AC5"
        statement: "AC5: gateway reads retry an unavailable bus or absent terminal for at most three attempts, pause 20 seconds between attempts, use fresh correlation IDs and report the JSON attempts count; exhausted reads retain exit 69 or 75, and failed terminals and writes are not retried."
  - id: "req-omn21396-codex-sandbox-causes"
    statement: "A Codex lane gets the uv data directory, and a lane needing what the Codex sandbox cannot grant is kept off the Codex rung."
    acceptance:
      - id: "AC6"
        statement: "AC6: the Codex lane's writable roots include $HOME/.local/share/uv and no parent of it, and a lane declaring host-paths-write, host-process-read, linear-write or nested-sandbox skips the Codex rung with reason sandbox-capability while a lane declaring none of them is still placed on Codex; the roots program fits the profile on Linux only and counts a sandbox that times out as fitting."
evidence_requirements:
  - kind: "tests"
    description: "Engine ladder, experiment row and tick line tests pass"
    command: "uv run pytest tests/nodes/node_remote_lane_compute/test_engine_ladder_remote_lane_compute.py tests/nodes/node_remote_lane_compute/test_engine_experiment_rows.py -q --no-cov"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn21396-merge-attribution-producers"
    description: >
      Deploy check: actual executor identity stamps result and TERMINAL cells
      together, overriding model-authored identity; missing or malformed executor
      facts refuse. The historical reader recognizes configured per-host accounts as host only,
      joins a successful worker result to cost engine and host, excludes failed
      or future workers, resolves the closing attempt rather than a reused lane's
      first model, and distinguishes automation and person provenance from engine
      evidence. Hermetic hosted-runner check against the checked-out package; no
      broker, host credentials or production access. Fails before this change.
    source: "manual"
    binds_ac: ["AC3"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_execution_attribution_compute/test_execution_attribution.py tests/nodes/node_merge_attribution_compute/test_merge_attribution.py tests/nodes/node_landing_lease_claim_close_effect/test_golden_chain_landing_lease_claim_close.py -q --no-cov --refuse-skips"
        cwd: "."
  - id: "dod-omn21396-disabled-added-backend"
    description: >
      Deploy check: a complete added backend explicitly disabled by endpoint_url:
      null loads through file, payload and store readers and is excluded from
