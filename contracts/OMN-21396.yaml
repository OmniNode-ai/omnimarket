      - check_type: "command"
        check_value: |-
          uv run --locked python - <<'PROBE'
          from omnimarket.nodes.node_lane_model_policy_compute.handlers.handler_lane_model_policy import resolve_lane_model
          from omnimarket.nodes.node_remote_lane_compute.handlers.handler_remote_lane_placement import HandlerRemoteLanePlacement
          from omnimarket.nodes.node_remote_lane_compute.models import ModelRemoteLanePlacementRequest
          assert resolve_lane_model(lane_kind="build", required_model="sonnet").model == "sonnet"
          assert not resolve_lane_model(lane_kind="build", required_model="opus").allowed
          assert resolve_lane_model(lane_kind="build", required_model="opus", escalation_reason="complexity:B4").model == "opus"
          request = ModelRemoteLanePlacementRequest.model_validate({"engine": "claude_sonnet", "readings": [{"name": "probe", "engines": ["claude_sonnet", "claude_opus"], "lane_slots": 2}], "ladder": {"lane": "probe", "ceiling": "opus", "claude_required": True, "attempts": [{"engine": "sonnet", "model": "sonnet", "outcome": "failed"}]}})
          result = HandlerRemoteLanePlacement().handle(request)
          assert (result.host, result.rung, result.engine) == ("probe", "opus", "claude_opus"), result
          print("opus-escalation deploy probe passed")
          PROBE
