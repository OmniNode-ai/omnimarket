  - id: "dod-omn21396-opus-reason-placement"
    description: >
      Hosted-runner deploy check for the amended escalation rule. A failed
      Sonnet attempt supplies the reason for the next Opus rung, a declared
      complexity reason reaches ladder and legacy placement, and an Opus pin
      without a reason is refused. Runs typed requests through the installed
      policy and placement handlers using supplied capacity readings only;
      no credentials, broker, Docker, remote host or live model is required.
      The inline policy assertion fails at the merge base, whose request model
      rejects escalation_reason. Existing evidence for AC3 through AC6 is retained.
    source: "manual"
    binds_ac: ["AC2"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_remote_lane_compute/test_engine_ladder_remote_lane_compute.py -q --no-cov --refuse-skips -k 'reason or pinned_route'"
