  - id: "dod-omn21396-scm-unanswered-deploy-probe"
    description: "Hosted-runner deploy probe starts the installed onex scm release-list command with incompatible in-memory bus and broker-lane selectors. The real bus opener refuses each attempt. Within 23 seconds, the CLI must report two bus failures and remain pending for its third attempt; the probe then terminates only its own child. The merge-base CLI exits after one failure. This requires no lane credentials or services and does not claim a dev-lane or production rollout."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: |-
          uv run --locked python -c '
          import json
          import subprocess
          child = subprocess.Popen(["onex", "scm", "release-list", "OmniNode-ai/omnimarket", "--source", "bus", "--bus", "inmemory", "--bus-lane", "scm-retry-probe"], stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True)
          pending = False
          try:
              try:
                  stdout, stderr = child.communicate(timeout=23)
              except subprocess.TimeoutExpired:
                  pending = True
                  child.terminate()
                  stdout, stderr = child.communicate(timeout=2)
          finally:
              if child.poll() is None:
                  child.kill()
                  child.communicate()
          errors = [line for line in stderr.splitlines() if line.startswith("bus:")]
          assert pending, (child.returncode, stdout, stderr)
          assert len(errors) == 2, errors
          assert all("in-memory bus has none" in line for line in errors), errors
          assert not stdout.strip(), stdout
          print(json.dumps({"probe": "scm-bus-open-retry", "observed_bus_failures": len(errors), "pending_before_cleanup": pending}, sort_keys=True))
          '
        cwd: "${OMNI_HOME}/omnimarket"
