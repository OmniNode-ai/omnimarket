      and code_generation tasks. Missing fields and invalid values still refuse.
      This fails before the fix: disabling a peer refuses the whole ladder.
      Runs entirely against the checked-out code and temporary fixture files on
      the hosted runner; no lab endpoint, broker or credential is required.
    source: "manual"
    binds_ac: ["AC1"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/routing/test_disabled_added_backend_omn21396.py tests/unit/routing/test_bifrost_overlay_added_backend_validation_omn17099.py -q --no-cov --refuse-skips"
        cwd: "."
  - id: "dod-omn21396-ac1-cheapest-rung"
    description: "A small-fix lane with a free local slot is placed on code-edit; the same lane with no local slot is placed on GLM. Fails at the merge base, which has no ladder."
    source: "manual"
    binds_ac: ["AC1"]
    checks:
