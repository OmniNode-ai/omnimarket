        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn21396-ac2-escalate-and-pin"
    description: "A failed code-edit attempt is retried on GLM; the ceiling stops escalation; a Required engine: claude lane starts on sonnet; a pinned ROUTE only uses its ceiling."
    source: "manual"
    binds_ac: ["AC2"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_remote_lane_compute/test_engine_ladder_remote_lane_compute.py -q --no-cov -k 'ac2_failed_attempt or route_ceiling or claude_required or pinned_route'"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn21396-ac3-two-rows"
    description: "A two-attempt escalation (code-edit failed, GLM done) appended to a ledger with unrelated rows reads back exactly two kind=experiment rows carrying lane, engine, model, outcome, failure cause, duration and next engine."
    source: "manual"
    binds_ac: ["AC3"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_remote_lane_compute/test_engine_experiment_rows.py -q --no-cov -k 'ac3_ac4_two_attempt_ledger_replay'"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn21396-ac4-tick-line"
    description: "Replaying the AC3 rows into the throughput tick prints engine-experiments:code-edit attempts=1 escalations=1 and engine-experiments:glm attempts=1 successes=1, one line per engine."
    source: "manual"
    binds_ac: ["AC4"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_remote_lane_compute/test_engine_experiment_rows.py -q --no-cov -k 'ac3_ac4_two_attempt_ledger_replay or tick_window_boundary'"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn21396-deploy-probe"
    description: "Deploy probe. Read the placement handler from GitHub at the checked-out commit and require the ladder rule in it, with the AC1 test. It fails at the merge base, which has no ladder."
    source: "manual"
    binds_ac: ["AC1"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_remote_lane_compute/test_engine_ladder_remote_lane_compute.py -q --no-cov -k ac1_cheapest_ready_rung"
        cwd: "${OMNI_HOME}/omnimarket"
      - check_type: "command"
        check_value: "bash -o pipefail -c 'gh api \"repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_remote_lane_compute/handlers/handler_remote_lane_placement.py?ref=$(git rev-parse HEAD)\" --jq .content | base64 -d | grep -F \"above-route-ceiling\" > /dev/null'"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn21396-scm-unanswered-read-retry"
    description: "Focused tests exercise gateway read recovery, three-attempt exhaustion, fresh correlation IDs, unchanged exit codes, and no retry for failed terminals or writes."
    source: "manual"
    binds_ac: ["AC5"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/handlers/scm/test_onex_scm_command.py -q --no-cov -k 'read_retries or read_exhausts or read_failed_terminal or write_timeout'"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn21396-scm-unanswered-deploy-probe"
    description: "Hosted-runner deploy probe starts the installed onex scm release-list command with incompatible in-memory bus and broker-lane selectors. The real bus opener refuses each attempt. Within 23 seconds, the CLI must report two bus failures and remain pending for its third attempt; the probe then terminates only its own child. The merge-base CLI exits after one failure. This requires no lane credentials or services and does not claim a dev-lane or production rollout."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: |-
          uv run --locked python -c '
          import json
          import subprocess
          child = subprocess.Popen(["onex", "scm", "release-list", "OmniNode-ai/omnimarket", "--source", "bus", "--bus", "inmemory", "--bus-lane", "scm-retry-probe"], stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True)
          pending = False
          try:
              try:
                  stdout, stderr = child.communicate(timeout=23)
              except subprocess.TimeoutExpired:
                  pending = True
                  child.terminate()
                  stdout, stderr = child.communicate(timeout=2)
          finally:
              if child.poll() is None:
                  child.kill()
                  child.communicate()
          errors = [line for line in stderr.splitlines() if line.startswith("bus:")]
          assert pending, (child.returncode, stdout, stderr)
          assert len(errors) == 2, errors
          assert all("in-memory bus has none" in line for line in errors), errors
          assert not stdout.strip(), stdout
          print(json.dumps({"probe": "scm-bus-open-retry", "observed_bus_failures": len(errors), "pending_before_cleanup": pending}, sort_keys=True))
          '
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn21396-code-edit-timeout-retries-in-process"
    description: >
      Deploy check: a delegated code edit turn sent over the deployed lane that
      times out or ends with no terminal is retried once on the in-process route,
      with the same prompt, pin, lane and ticket; a refusal or an in-process
      timeout is not retried. Measured case: deployed-lane retries after a timeout
      succeeded 0/32 and in-process retries 17/28; after no terminal 0/12 and 10/10
      (fill-exp-retry-by-failure-kind-r0437Z). Fails before the change, which
      returns the first failed reply. Runs against the checked-out code and
      temporary fixture files on the hosted runner; no lab endpoint, broker or
      credential is required.
    source: "manual"
    binds_ac: ["AC2"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/delegated_code_edit/test_loop_ports.py -q --no-cov -k 'retried_once_in_process or refusal_is_not_retried or in_process_timeout_is_not_retried or names_both_causes or retry_checks_the_backend_pin'"
        cwd: "."
  - id: "dod-omn21396-ac6-codex-sandbox-causes"
    description: "Failing-first tests (7 failed at the merge base): the roots lines create and grant $HOME/.local/share/uv by its real path and no parent; each of the four ungrantable capabilities skips the Codex rung with reason sandbox-capability; no capability or docker still places on Codex; a fit that times out or runs off Linux keeps every root (3 more tests that failed at the first head)."
    source: "manual"
    binds_ac: ["AC6"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_codex_sandbox_probe_compute/test_codex_sandbox_probe.py tests/nodes/node_remote_lane_compute/test_engine_ladder_remote_lane_compute.py -q --no-cov -n 0 -k 'uv_data or capabilit or sandbox_timeout or fit_off_linux'"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn21396-ac6-deploy-probe"
    description: "Hosted-runner deploy probe: the installed package's placement node, given a nested-sandbox lane and a host with Codex and sonnet slots, answers rung sonnet and refuses codex with sandbox-capability. It fails at the merge base, whose ladder model forbids required_capabilities. No credentials or services."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: "uv run --locked python -c 'from omnimarket.nodes.node_remote_lane_compute.handlers.handler_remote_lane_placement import HandlerRemoteLanePlacement as H; from omnimarket.nodes.node_remote_lane_compute.models import ModelRemoteLanePlacementRequest as R; r=H().handle(R.model_validate({\"engine\":\"codex\",\"readings\":[{\"name\":\"h201\",\"engines\":[\"codex\",\"claude_sonnet\"],\"lane_slots\":2,\"lane_cap\":4,\"rank_free\":10.0}],\"ladder\":{\"lane\":\"probe\",\"ceiling\":\"sonnet\",\"risk_class\":\"feature\",\"required_capabilities\":[\"nested-sandbox\"]}})); assert r.rung==\"sonnet\", r; assert [v.reason for v in r.rungs if v.engine==\"codex\"]==[\"sandbox-capability\"], r.rungs; print(\"ac6-probe ok\")'"
        cwd: "${OMNI_HOME}/omnimarket"

  - id: "dod-omn21396-serving-identity"
    description: >
      Hosted-runner deploy preparation check: routing rejects a shared alias
      backed by different weight files or quants and rejects a declaration for
      another endpoint host. In-process attempts and bus-history projection
      retain the contract identity. A missing identity is explicitly unrecorded
      and has no scoring key. Labelled capability-map seeds exclude missing
      identities and partition known identities by host, weights, quant and
      context fingerprint. This checks packaged code with hermetic fixtures;
      it does not assert that live overlays or model servers have been changed.
    source: "manual"
    binds_ac: ["AC1", "AC3"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/routing/test_backend_identity_omn21396.py tests/test_golden_chain_projection_delegation_capability_map.py -q --no-cov"
        cwd: "."
