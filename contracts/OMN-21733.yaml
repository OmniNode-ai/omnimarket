---
schema_version: "1.0.0"
ticket_id: "OMN-21733"
title: "The factory floor page is served from h051 on the tailnet, with its JSON projection published to it on every tick"
summary: "node_factory_floor_publish_effect regenerates the factory floor record with node_factory_floor_effect and publishes the packaged page and the record to the directory a static server on the lab serves, over ssh, each file written to a temporary name and renamed into place. The serving host, directory and URL come only from the deployment overlay. The page fetches factory-floor.json, renders it, shows the record's age, and carries no secret, absolute path, hostname or external URL."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-omn21733-factory-floor-host"
    statement: |-
      The factory floor page is hosted in the lab: a static server bound to the tailnet address serves the page and the JSON the factory floor nodes write, and the record is refreshed and published on every tick.
    acceptance:
      - id: "AC1"
        statement: "AC1: node_factory_floor_publish_effect has contract.yaml, metadata.yaml, typed models and a handler whose ssh target, remote directory and source paths come only from the overlay and the contract, and it refuses a run with a missing overlay key -- falsifier: uv run pytest tests/nodes/node_factory_floor_publish_effect -k overlay_or_missing_key -q"
      - id: "AC2"
        statement: "AC2: a publish copies the page and the JSON to a temp name and renames both into place so a reader never sees a partial file, and a failed copy leaves the previous files untouched -- falsifier: uv run pytest tests/nodes/node_factory_floor_publish_effect -k atomic -q"
      - id: "AC3"
        statement: "AC3: the page fetches factory-floor.json, renders lines, stations, bays, shipped, waiting and stoppages from the node record, shows how old the record is, and contains no secret, no absolute path, no hostname and no external URL -- falsifier: uv run pytest tests/nodes/node_factory_floor_publish_effect -k page -q"
      - id: "AC6"
        statement: "AC6: the suite passes on the lab host through the bus placement -- falsifier: lab-run receipt with exit code 0 for uv run pytest tests/nodes/node_factory_floor_publish_effect/test_factory_floor_publish.py tests/nodes/node_factory_floor_publish_effect/test_reports_site.py -q"
  - id: "req-omn21733-reports-site"
    statement: |-
      The lab web server also hosts a reports site: an index of every report with the age of each report's data, the process before-and-after report, the October decision map and the decision-quality report, each drawn from data files that nodes (or, for the two snapshots, a lane) wrote.
    acceptance:
      - id: "AC7"
        statement: "AC7: a publish copies the reports index, each report's page and data and a manifest (written last) to the serving directory, the manifest states each data file's own time and what it is measured from, and a data file that cannot be read is listed unread and not published -- falsifier: uv run pytest tests/nodes/node_factory_floor_publish_effect -k reports -q"
      - id: "AC8"
        statement: "AC8: the report pages carry no secret, absolute path or host, load nothing from another origin except the decision map's two integrity-pinned scripts, escape every character of the data they render, and show an unread source as unread rather than zero -- falsifier: uv run pytest tests/nodes/node_factory_floor_publish_effect -k page_reports -q"
  - id: "req-omn21733-machine-bays"
    statement: |-
      The floor page shows where everything runs: a bay per machine with its placed lanes against its cap, its load, memory, swap, CI runners and unit work, a cloud bay, and for every lane its ticket title, kind, newest status with its age, pull request with CI state, run time, a stalled mark and a link to the assembly-line station it builds, all read from the record.
    acceptance:
      - id: "AC9"
        statement: "AC9: the page draws a bay for every machine in the record with its lanes against its cap, draws a machine the pool could not read as unread and one in repair as repair, draws the cloud bay with its stop lamp, and draws each lane with its title, kind, engine, status, PR and CI state, stalled mark, full detail and station link, escaping every character of the record -- falsifier: uv run pytest tests/nodes/node_factory_floor_publish_effect/test_factory_floor_publish.py -k page_draws -q"
      - id: "AC10"
        statement: "AC10: the publish contract runs the pool read of the machines before the record is computed, a failed pool step is recorded as failed and the machines are then drawn unread -- falsifier: uv run pytest tests/nodes/node_factory_floor_publish_effect/test_factory_floor_publish.py -k refresh -q"
  - id: "req-omn21733-tabs"
    statement: |-
      The site is one page with a tab bar across the top. The first tab is a dashboard that shows at a glance each assembly line's state and stop reason, each machine with its lanes, load and memory, today's merges and reds and the age of every source. The other tabs (Factory floor, Process before and after, Decision map, Decision quality) are drawn inside the page. The tab is in the URL hash and the last tab chosen is remembered in the browser.
    acceptance:
      - id: "AC11"
        statement: "AC11: the tab page has five tabs with the dashboard first, opens the tab the hash names, else the remembered tab, else the dashboard, still opens when the browser blocks storage, and draws the other four pages inside itself -- falsifier: uv run pytest tests/nodes/node_factory_floor_publish_effect -k page_tabs -q"
      - id: "AC12"
        statement: "AC12: the dashboard draws each declared line with its state and its recorded stop reason (a declared line no plan matched drawn as not in the record), each machine with its lanes, load and memory, today's merges and reds from the process-health series, and the age of every source with a stale or unread one marked, and draws an unread source as unread rather than zero -- falsifier: uv run pytest tests/nodes/node_factory_floor_publish_effect -k page_dashboard -q"
  - id: "req-omn21733-drawer"
    statement: |-
      Every drill-down on the site (a line, a station, a machine, a lane, a stoppage, a report) opens in a side panel over the tab the reader is on, never a scroll jump or a page navigation. The panel is a labelled dialog, closes by its button, Escape, the dimmed sheet on a phone or the browser back button, and the URL hash names it.
    acceptance:
      - id: "AC13"
        statement: "AC13: a hash naming a lane, line, machine or station opens a labelled panel over the tab with that item's detail, a name the record does not hold is said so, the panel closes by button, Escape, scrim and back with one history entry per open, the tab underneath never scrolls and each tab keeps its own scroll position -- falsifier: uv run pytest tests/nodes/node_factory_floor_publish_effect -k page_drawer -q"
  - id: "req-omn21733-snapshot-history"
    statement: |-
      Each published factory floor record is retained under the overlay's history_root,
      with contract-declared UTC names and retention, before the live record is replaced.
    acceptance:
      - id: "AC13"
        statement: "AC13: publishing writes a byte-identical snapshot under the contract's history subdirectory with a UTC timestamp, and a second publish preserves the first snapshot while updating the live record."
      - id: "AC14"
        statement: "AC14: publishing to an occupied snapshot name refuses the publish and preserves both the existing snapshot and the live record."
      - id: "AC15"
        statement: "AC15: retention removes the oldest snapshots outside its day window only while their count exceeds max_count, preserving younger snapshots, unrelated files and the live record."
      - id: "AC16"
        statement: "AC16: a missing history_root is refused with NodeOverlayError before transport; the contract declares history naming and retention without a host or absolute path."
  - id: "req-omn21733-undrawn-lines"
    statement: |-
      A declared line the board cannot draw is never silent: it is drawn stopped with its cause, the publish status names it when the record leaves it out, and a lane that ended blocked or an ask to the orchestrator nobody answered stops the line it belongs to, with its age.
    acceptance:
      - id: "AC17"
        statement: "AC17: a declared plan text that matches no plan file is drawn as a stopped line with the cause plan file not found, and a matched plan with no tasks is drawn stopped with the cause no task table -- falsifier: uv run pytest tests/nodes/node_factory_floor_compute/test_undrawn_lines.py -q -k 'undrawn or declared_text or no_task_table or declares_no_line'"
      - id: "AC18"
        statement: "AC18: the publish status marks the factory_floor step not ok and names the declared lines when the record leaves any of them out -- falsifier: uv run pytest tests/nodes/node_factory_floor_publish_effect/test_factory_floor_publish.py -q -k 'one_of_three_declared'"
      - id: "AC19"
        statement: "AC19: a line whose lane ended blocked, or whose ask to the orchestrator has no answer, is drawn stopped with the cause and its age in minutes, and the validators line reads the pill the hold-exemption rule demands -- falsifier: uv run pytest tests/nodes/node_factory_floor_compute/test_undrawn_lines.py -q -k 'blocked_terminal or unanswered or validators'"
  - id: "req-omn21733-reports-plain"
    statement: |-
      The three report pages open on their conclusion in plain words, use the board's type and colour tokens, and print every time in Eastern time with UTC only in a hover title; the dashboard and the floor page print every time in the viewer's own zone with the zone named, judge today by the viewer's day, and age each reading against the real clock.
    acceptance:
      - id: "AC17"
        statement: "AC17: the process, decision map and decision quality pages use the board type and tokens, carry no text below twelve pixels, show Eastern time with UTC only in a title, use the glossary's plain words and open on the conclusion with the provenance folded -- falsifier: uv run pytest tests/nodes/node_factory_floor_publish_effect/test_reports_plain_floor_reports_plain_2303.py -q"
      - id: "AC18"
        statement: "AC18: the dashboard and the floor page print the record time in the viewer's zone with the zone named, warn that the series is behind only when its day is not the viewer's day, and age each reading from the real clock rather than the record time -- falsifier: uv run pytest tests/nodes/node_factory_floor_publish_effect/test_page_local_time.py -q"
  - id: "req-omn21733-floor-tab-plain"
    statement: |-
      The Factory floor tab opens on the lines with one verdict line, carries no second summary, uses the shared glossary's plain words, prints Eastern time with UTC only in a hover title, counts each machine's slots under one legend, collapses lines with no plan file into one sentence, and keeps every text at twelve pixels or more in the body face.
    acceptance:
      - id: "AC22"
        statement: "AC22: the Factory floor tab has one verdict line and no lamp grid, shift report or tally, uses the glossary's plain words, shows Eastern time with UTC only in a title, counts each machine's slots under one legend, collapses lines with no plan file, and carries no text below twelve pixels -- falsifier: uv run pytest tests/nodes/node_factory_floor_publish_effect/test_floor_tab_plain_2302.py -q"
  - id: "req-omn21733-view-tokens-s1"
    statement: |-
      The board's state colours come from the vendored OmniUI theme sets: the page's floor, panel, ink, muted, rule, ok, warn and stop variables alias OmniUI variables, data-theme selects the set through data-onex-theme, and the vendored theme CSS is pinned by sha256.
    acceptance:
      - id: "AC23"
        statement: "AC23: --floor, --panel, --ink, --muted, --rule, --ok, --warn and --stop resolve from the vendored OmniUI theme in both themes; changing one status token in a copy of the CSS changes the stop colour, and removing the alias makes the assertion fail -- falsifier: uv run pytest tests/nodes/node_factory_floor_publish_effect/test_page_theme_s1.py -q -k 'resolve or changing or removing or every_theme'"
      - id: "AC24"
        statement: "AC24: the vendored OmniUI theme CSS is pinned and a pin test fails when a vendored file's sha256 differs from the pin -- falsifier: uv run pytest tests/nodes/node_factory_floor_publish_effect/test_page_theme_s1.py -q -k pin"
      - id: "AC25"
        statement: "AC25: the publish copies the vendored theme files beside the page, ahead of it, under the names the contract declares -- falsifier: uv run pytest tests/nodes/node_factory_floor_publish_effect/test_page_theme_s1.py -q -k 'declared_theme or links_exactly'"
  - id: "req-omn21733-lines-match-reality"
    statement: |-
      The floor's lines match the work: a plan with no manifest and no table is drawn from its own task paragraphs and linked to merged work only through its tickets and pull requests, a plan on an unmerged branch is drawn from that branch until it merges, the one-runtime line reads each lane's application containers over ssh and draws a host it cannot read as UNKNOWN with the cause, and an unread runner fleet names why.
    acceptance:
      - id: "AC27"
        statement: "AC27: a plan whose manifest and plans-today table are both empty is drawn from its bold-led task paragraphs, each task linked only through the tickets and pull requests its lead names and the overlay's task links, never through a bare id such as T5 -- falsifier: uv run pytest tests/nodes/node_factory_floor_effect/test_plan_tasks_and_containers.py tests/nodes/node_factory_floor_compute/test_scoped_tasks.py -q -k 'paragraphs or list_items or links or empty_table or scoped or resumed'"
      - id: "AC28"
        statement: "AC28: a plan that is only on an unmerged ref is read from the ref the overlay names until a plan of the same path is on the clone's branch -- falsifier: uv run pytest tests/nodes/node_factory_floor_effect/test_plan_tasks_and_containers.py -q -k unmerged_ref"
      - id: "AC29"
        statement: "AC29: the effect node reads each declared host's container listing and judges it against the declared budgets, a host it cannot read draws UNKNOWN with the cause and never zero, a dead row with no name in a listing is dropped while a nameless row in any other state still refuses it, and no declared host means no container read -- falsifier: uv run pytest tests/nodes/node_factory_floor_effect/test_plan_tasks_and_containers.py -q -k 'declared_host or cannot_be_read or listing_command or dead_row or nameless_row'"
      - id: "AC30"
        statement: "AC30: an unread runner fleet names the file and why it is unread in the record's sources and on each machine -- falsifier: uv run pytest tests/nodes/node_factory_floor_effect/test_plan_tasks_and_containers.py -q -k runner_fleet"
  - id: "req-omn21733-slot-truth"
    statement: |-
      The floor draws each machine's free slots as the figure the tick's admission reads, and a machine the admission refuses is drawn as refused with the reading's reason, never as free.
    acceptance:
      - id: "AC31"
        statement: "AC31: each machine in the record carries free_slots, which is the pool reading's lane_slots cell when its line has one, else the cap less the placed units, never negative and zero when the reading carries an admission or lane refusal, and an admission object (open, refused or unread, with the reading's reason); the page draws refused with the reason in place of free squares and sums only open machines -- falsifier: uv run pytest tests/nodes/node_factory_floor_compute/test_slot_truth.py tests/nodes/node_factory_floor_publish_effect/test_page_slot_truth.py -q"
  - id: "req-omn21733-cloud-card"
    statement: |-
      The cloud card lists every cloud account that can start a session, draws each account's open sessions as the number open in the session list built from the same receipts, and draws a cap, a credit or an open count that was not read as unread, never as zero.
    acceptance:
      - id: "AC41"
        statement: "AC41: an account draws the number of its sessions that are open in the cloud session list, counted from the same receipts that build the list and never from the entries of the accounts file, an open session the capped list would cut is still listed and counted, and a disagreeing accounts file is said in a stale-entry note beside the account -- falsifier: uv run pytest tests/nodes/node_factory_floor_compute/test_floor_lanes.py tests/nodes/node_factory_floor_publish_effect/test_factory_floor_publish.py -q --no-cov -k 'open_sessions_of_its_own_list or no_stale_note or capped_list_would_cut or the_open_figure'"
      - id: "AC42"
        statement: "AC42: every ready account of the accounts file is drawn, an account with no cap draws its open count with cap unread, an account with no credit draws credit unread, and an open count that could not be read draws open unread and never zero -- falsifier: uv run pytest tests/nodes/node_factory_floor_compute/test_floor_lanes.py tests/nodes/node_factory_floor_publish_effect/test_factory_floor_publish.py -q --no-cov -k 'every_ready_account or both_ready_accounts or never_zero'"
      - id: "AC43"
        statement: "AC43: a signed-in account the overlay does not declare is not drawn as a card but is counted in the cloud note with the cause, not dropped silently -- falsifier: uv run pytest tests/nodes/node_factory_floor_compute/test_floor_lanes.py -q --no-cov -k 'overlay_does_not_declare'"
      - id: "AC44"
        statement: "AC44: the cloud card's headline count of open sessions equals the sum of the open counts of the accounts drawn beneath it -- falsifier: uv run pytest tests/nodes/node_factory_floor_publish_effect/test_factory_floor_publish.py -q --no-cov -k headline_open_count"
  - id: "req-omn21733-floor-p0-projection"
    statement: |-
      The factory floor compute node projects one condition, blocker, progress, gates, line evidence and data age for every line, so every surface reads the same facts: built percent counts merged work tasks only with gates counted apart, unknown is never zero, and a line is complete only when its work is done and every gate has passed.
    acceptance:
      - id: "AC47"
        statement: "AC47: Line B projects progress completed=6, total=48, percent=12.5 with gates passed/failed/waiting counted apart and never in the total -- falsifier: uv run pytest tests/nodes/node_factory_floor_compute -q -k line_b_work_tasks_and_gates"
      - id: "AC48"
        statement: "AC48: a line stopped only by soft causes while a live non-stalled lane works it projects condition building with its blocker kept, and no field reads stopped -- falsifier: uv run pytest tests/nodes/node_factory_floor_compute -q -k one_condition_building_keeps_blocker"
      - id: "AC49"
        statement: "AC49: a missing total projects progress.state unknown with percent None, zero declared tasks projects no_tasks, and a known 0 of 6 projects known with percent 0.0 -- falsifier: uv run pytest tests/nodes/node_factory_floor_compute -q -k unknown_is_not_zero"
      - id: "AC50"
        statement: "AC50: every work task done with a gate failed or waiting never projects condition complete -- falsifier: uv run pytest tests/nodes/node_factory_floor_compute -q -k all_tasks_done_gate_pending_not_complete"
      - id: "AC51"
        statement: "AC51: a task done only by a terminal outcome or a closed ticket counts toward condition and not toward progress.completed, and line_evidence carries merged, running_on_dev and verified apart with None for an unread source -- falsifier: uv run pytest tests/nodes/node_factory_floor_compute -q -k merged_only_percent_and_separate_evidence"
      - id: "AC52"
        statement: "AC52: every line, undrawn lines included, carries data_age -- falsifier: uv run pytest tests/nodes/node_factory_floor_compute -q -k data_age_on_every_line"
      - id: "AC53"
        statement: "AC53: the change is proven by a real publish: the served factory-floor.json carries progress, gates, condition and data_age on its lines after the publish -- falsifier: grep -c '^class ModelFloorProgress' src/omnimarket/nodes/node_factory_floor_compute/models/model_factory_floor_output.py"
evidence_requirements:
  - kind: "tests"
    description: "Tests of the overlay refusals, the atomic remote write (executed through a local shell), the refresh ordering and the page."
    command: "uv run pytest tests/nodes/node_factory_floor_publish_effect/test_factory_floor_publish.py -q --no-cov"
  - kind: "tests"
    description: "The four suites that hold the floor's tests. They live under tests/nodes; the node directories under src hold none, so a pytest over them collects nothing and exits 5."
    command: "uv run pytest tests/nodes/node_factory_floor_compute/test_floor_lanes.py tests/nodes/node_factory_floor_compute/test_handler_factory_floor.py tests/nodes/node_factory_floor_compute/test_hold_exemption.py tests/nodes/node_factory_floor_compute/test_live_lines.py tests/nodes/node_factory_floor_compute/test_one_runtime_containers.py tests/nodes/node_factory_floor_compute/test_scoped_tasks.py tests/nodes/node_factory_floor_compute/test_undrawn_lines.py tests/nodes/node_factory_floor_effect/test_floor_lane_sources.py tests/nodes/node_factory_floor_effect/test_ledger_reader_timeout.py tests/nodes/node_factory_floor_effect/test_plan_tasks_and_containers.py tests/nodes/node_factory_floor_effect/test_runtime_factory_floor.py tests/nodes/node_factory_floor_publish_effect/test_factory_floor_history.py tests/nodes/node_factory_floor_publish_effect/test_factory_floor_publish.py tests/nodes/node_factory_floor_publish_effect/test_floor_tab_plain_2302.py tests/nodes/node_factory_floor_publish_effect/test_page_local_time.py tests/nodes/node_factory_floor_publish_effect/test_reports_plain_floor_reports_plain_2303.py tests/nodes/node_factory_floor_publish_effect/test_reports_site.py tests/nodes/node_lane_container_budget_compute/test_lane_container_budget.py -q --no-cov"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
