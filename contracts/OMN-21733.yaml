  - id: "dod-omn21733-deploy-probe"
    description: "Deploy probe. The reports handler file that GitHub serves at the checked-out commit declares HandlerReportsPublish, the entry this change adds; the probe reads it from GitHub at that commit and exits nonzero on a tree without it, so it fails at the merge base."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: "gh api \"repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_factory_floor_publish_effect/handlers/handler_reports_publish.py?ref=$(git rev-parse HEAD)\" --jq .content | base64 -d | grep -c '^class HandlerReportsPublish:'"
  - id: "dod-omn21733-floor-artwork"
