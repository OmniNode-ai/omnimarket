schema_version: 1.0.0
ticket_id: OMN-24445
title: The hourly tick names a missing owner of the ledger bus-only cutover
summary: A node decides, from the bus-fed open-claims answer of the ledger, whether a live lane CLAIM names a plan, so the hourly tick can print MISSING ledger-cutover-owner when the cutover has no owner (cutover plan wave 0). Never reads the ledger file.
is_seam_ticket: true
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24445-owner-check
  statement: The cutover can never again sit with no live owner unseen.
  acceptance:
  - id: AC1
    statement: 'AC1: a live lane CLAIM whose lane or ticket the rule names answers OWNED, and no such claim on a fresh answer answers MISSING with the rule''s why and fix (golden chain). -- falsifier: uv run --frozen pytest tests/unit/nodes/node_plan_owner_check_effect -q --no-cov -n 0 -p no:randomly -k ''golden or owned or missing'''
  - id: AC2
    statement: 'AC2: a read that failed, a stale answer with no owner, an unreadable claim line and a finding with no rule each answer UNKNOWN and never MISSING (error chain). -- falsifier: uv run --frozen pytest tests/unit/nodes/node_plan_owner_check_effect -q --no-cov -n 0 -p no:randomly -k ''error_chain'''
  - id: AC3
    statement: 'AC3: the claim line the ledger query node renders is the line this node parses; a renamed cell turns the answer into UNKNOWN, never MISSING (seam test over the real query node and the real reader). -- falsifier: uv run --frozen pytest tests/unit/nodes/node_plan_owner_check_effect -q --no-cov -n 0 -p no:randomly -k reader_seam'
  - id: AC4
    statement: 'AC4: the CLI exits 0 when every finding is OWNED, 1 on MISSING, 2 on UNKNOWN, and journals one event per finding. -- falsifier: uv run --frozen pytest tests/unit/nodes/node_plan_owner_check_effect -q --no-cov -n 0 -p no:randomly -k runtime'
  - id: AC5
    statement: 'AC5: integrated: in the running hourly throughput tick, with the node and its overlay installed, the tick prints MISSING ledger-cutover-owner while no live lane CLAIM names the cutover plan, and prints nothing for it while one does. -- falsifier: read the tick output with and without a live ledger-cut lane claim'
- id: req-omn24445-census-ci-step
  statement: The ledger-file census ratchet is enforced in CI and in pre-commit by commands that both name its ratchet file.
  acceptance:
  - id: AC6
    statement: 'AC6: the ledger-file census ratchet runs as a step of the strict lint job that gates CI Summary, and that step and the ledger-file-census pre-commit hook both pass the ratchet file named in the census overlay. -- falsifier: uv run pytest tests/ci/test_ledger_census_wiring.py -q --no-cov'
- id: req-omn24445-census-operator-tests
  statement: The eight operator capture and access mode test files stay cleared of the ledger file name, and the census ratchet holds no row for them.
  acceptance:
  - id: AC7
    statement: 'AC7: the census run over this tree prints no reader or writer hit for any of the eight cleared operator test files, the per-file ratchet table holds no row for them, and the omnimarket ratchet row equals the count of its file rows (a put-back of a reader in one of them fails). -- falsifier: uv run pytest tests/unit/nodes/node_work_ledger_file_census_effect/test_group5_operator_tests_omn24445.py -q --no-cov -n 0 -p no:randomly'
evidence_requirements:
- kind: tests
  description: The node's tests pass at the pushed head.
  command: uv run --frozen pytest tests/unit/nodes/node_plan_owner_check_effect -q --no-cov -n 0 -p no:randomly
- kind: tests
  description: The census wiring test passes at the pushed head.
  command: uv run pytest tests/ci/test_ledger_census_wiring.py -q --no-cov
- kind: tests
  description: The cleared-operator-tests census test passes at the pushed head.
  command: uv run pytest tests/unit/nodes/node_work_ledger_file_census_effect/test_group5_operator_tests_omn24445.py -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24445-ac1
  description: 'Golden chain: OWNED by lane, OWNED by ticket, MISSING past the window.'
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/nodes/node_plan_owner_check_effect -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24445-ac2
  description: 'Error chain: UNKNOWN on failed read, stale, unreadable line and no rule; the named break fails the golden.'
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/nodes/node_plan_owner_check_effect -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24445-ac3
  description: Seam test over the real query node and the real reader; the renamed-cell break.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/nodes/node_plan_owner_check_effect -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24445-ac4
  description: CLI exit codes and journal on the in-memory path.
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/nodes/node_plan_owner_check_effect -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24445-ac5
  description: The tests behind the integrated reading pass; the live reading is recorded in the Lab line and a comment once the tick wiring and overlay run.
  source: manual
  binds_ac:
  - AC5
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/nodes/node_plan_owner_check_effect -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24445-reader-window
  description: 'Seam: the reader sends claims_since for an open-claims read that names a window, the owner check passes its overlay window, and the same read without a window sends none (failing control).'
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/nodes/node_work_ledger_reader_effect/test_reader_open_claims_window.py tests/unit/nodes/node_plan_owner_check_effect/test_runtime_plan_owner_check.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24445-integration-proof
  description: Run the node tests on a lab host at the pushed head. Hosted CI cannot reach the lab hosts, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24445 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/nodes/node_plan_owner_check_effect -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24445-ac6
  description: The census ratchet is run by the strict lint job and by the pre-commit hook, each naming the ratchet file.
  source: manual
  binds_ac:
  - AC6
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/ci/test_ledger_census_wiring.py -q --no-cov
    cwd: .
- id: dod-omn24445-ac7
  description: The census run prints no hit for the eight cleared operator test files, the ratchet table holds no row for them, and the omnimarket row equals its file-row count; the merge-base control has no such test file and fails.
  source: manual
  binds_ac:
  - AC7
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/nodes/node_work_ledger_file_census_effect/test_group5_operator_tests_omn24445.py -q --no-cov -n 0 -p no:randomly
    cwd: .
