schema_version: 1.0.0
ticket_id: OMN-24445
title: The hourly tick names a missing owner of the ledger bus-only cutover
summary: A node decides, from the bus-fed open-claims answer of the ledger, whether a live lane CLAIM names a plan, so the hourly tick can print MISSING ledger-cutover-owner when the cutover has no owner (cutover plan wave 0). Never reads the ledger file.
is_seam_ticket: true
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24445-owner-check
  statement: The cutover can never again sit with no live owner unseen.
  acceptance:
  - id: AC1
    statement: 'AC1: a live lane CLAIM whose lane or ticket the rule names answers OWNED, and no such claim on a fresh answer answers MISSING with the rule''s why and fix (golden chain). -- falsifier: uv run --frozen pytest tests/unit/nodes/node_plan_owner_check_effect -q --no-cov -n 0 -p no:randomly -k ''golden or owned or missing'''
  - id: AC2
    statement: 'AC2: a read that failed, a stale answer with no owner, an unreadable claim line and a finding with no rule each answer UNKNOWN and never MISSING (error chain). -- falsifier: uv run --frozen pytest tests/unit/nodes/node_plan_owner_check_effect -q --no-cov -n 0 -p no:randomly -k ''error_chain'''
  - id: AC3
    statement: 'AC3: the claim line the ledger query node renders is the line this node parses; a renamed cell turns the answer into UNKNOWN, never MISSING (seam test over the real query node and the real reader). -- falsifier: uv run --frozen pytest tests/unit/nodes/node_plan_owner_check_effect -q --no-cov -n 0 -p no:randomly -k reader_seam'
  - id: AC4
    statement: 'AC4: the CLI exits 0 when every finding is OWNED, 1 on MISSING, 2 on UNKNOWN, and journals one event per finding. -- falsifier: uv run --frozen pytest tests/unit/nodes/node_plan_owner_check_effect -q --no-cov -n 0 -p no:randomly -k runtime'
  - id: AC5
    statement: 'AC5: integrated: in the running hourly throughput tick, with the node and its overlay installed, the tick prints MISSING ledger-cutover-owner while no live lane CLAIM names the cutover plan, and prints nothing for it while one does. -- falsifier: read the tick output with and without a live ledger-cut lane claim'
evidence_requirements:
- kind: tests
  description: The node's tests pass at the pushed head.
  command: uv run --frozen pytest tests/unit/nodes/node_plan_owner_check_effect -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24445-ac1
  description: 'Golden chain: OWNED by lane, OWNED by ticket, MISSING past the window.'
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/nodes/node_plan_owner_check_effect -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24445-ac2
  description: 'Error chain: UNKNOWN on failed read, stale, unreadable line and no rule; the named break fails the golden.'
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/nodes/node_plan_owner_check_effect -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24445-ac3
  description: Seam test over the real query node and the real reader; the renamed-cell break.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/nodes/node_plan_owner_check_effect -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24445-ac4
  description: CLI exit codes and journal on the in-memory path.
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/nodes/node_plan_owner_check_effect -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24445-ac5
  description: The tests behind the integrated reading pass; the live reading is recorded in the Lab line and a comment once the tick wiring and overlay run.
  source: manual
  binds_ac:
  - AC5
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/nodes/node_plan_owner_check_effect -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24445-integration-proof
  description: Run the node tests on a lab host at the pushed head. Hosted CI cannot reach the lab hosts, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24445 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/nodes/node_plan_owner_check_effect -q --no-cov -n 0 -p no:randomly
    cwd: .
