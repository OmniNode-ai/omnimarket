schema_version: 1.0.0
ticket_id: OMN-25377
title: 'Review findings 1 to 10 on omnimarket PR 6345 at head 438e88419fa9 are fixed or argued: the AC4 evidence is recorded at the head, the hardened docker row is the deployed row, the dod commands read the deployed overlay and the Lab comment is at the new head'
summary: The fifth review of the ruling register tick and unit found the AC4 evidence absent at the head, a docker row hardened only in the test constant, dod commands that read the example overlay, an AC3 that states the opposite of what register_bound asserts, proof checks that cannot fail for their reason and a serialization that held inside one process only. This round fixes each with a test that fails at the reviewed head or argues it with evidence in a PR comment.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn25377-review-findings-fixed-or-argued
  statement: Every blocking finding of the fifth review is fixed with a test that fails at the reviewed head, or argued with evidence in a PR comment.
  acceptance:
  - id: AC1
    statement: 'AC1: contracts/OMN-24944.yaml AC4 records the install status output, last-run.json, a Lab line, the serial-run record and a REGISTER-VALUES deployed=True line at the new head, and its check does not need the Lab line it records -- falsifier: `uv run pytest tests -k ruling_register_unit -q -p no:cacheprovider` fails when the AC4 evidence is missing or the check reads its own Lab line'
  - id: AC2
    statement: 'AC2: the deployed docker row is the hardened row and the match test no longer accepts DEPLOYED_FOREIGN_CONTAINERS, so a failing docker on h201 reads UNREAD and never TRUE -- falsifier: `uv run pytest tests -k ruling_register_unit -q -p no:cacheprovider` fails when the unhardened row matches the deployed row'
  - id: AC3
    statement: 'AC3: the dod commands of contracts/OMN-25318.yaml (lines 71, 81, 93) and the effect, unit and journal_env tests set ONEX_RULING_REGISTER_DEPLOYED_ROOTS under local_done_gate, so the H201_ROWS comparison and the marker count read the deployed overlay -- falsifier: the local Done gate command `ONEX_RULING_REGISTER_DEPLOYED_ROOTS=/data/omninode/overlays/overlays uv run --frozen pytest tests -k "dod_commands_that_compare or h201_rows_of_the_test_match" -q -p no:cacheprovider` fails when the deployed overlay is absent or the tests read overlay.example.yaml'
  - id: AC4
    statement: 'AC4: AC3 of contracts/OMN-25318.yaml and its falsifier state the span-aware bound that register_bound asserts, not the claim that the worst case is under max_reading_age_seconds -- falsifier: `uv run pytest tests -k ruling_register_effect -q -p no:cacheprovider` fails when the stated bound and the asserted bound differ'
  - id: AC5
    statement: 'AC5: the timeout check requires the 8 ledger row ids answered TRUE or FALSE in $d/last-run.json, reads the env first as OMN-24944:103 does, and the docker exec count check fails when ssh or docker exec fails -- falsifier: `uv run pytest tests -k ruling_register_unit -q -p no:cacheprovider` fails when ssh fails or fewer than 8 ids are answered'
  - id: AC6
    statement: 'AC6: the register runs hold a cross-process lock, or the proof shows the runs did not overlap with the live query service tick -- falsifier: `uv run pytest tests -k ruling_register_effect -q -p no:cacheprovider` fails when two processes read at once'
  - id: AC7
    statement: 'AC7: the default PATH check covers {home}/.local/bin for the unit user, the title check greps the title field and the span widens the bound only when now is None -- falsifier: `uv run pytest tests -k ruling_register -q -p no:cacheprovider` fails when a comment satisfies the title grep or the span widens with now given'
  - id: AC8
    statement: 'AC8: a PR comment starting Lab: head=<full new head sha> names each command with exit 0 (a whole-suite run in named parts if it times out) and each blocking finding is fixed or argued in a comment -- falsifier: `onex scm pr-view OmniNode-ai/omnimarket#6345` shows a head that differs from the head named in the Lab: comment, or no Lab: comment, or a command without exit 0'
evidence_requirements:
- kind: tests
  description: The register tick, effect and unit tests pass at the pushed head.
  command: uv run --frozen pytest tests/unit/nodes/node_ruling_register_effect tests/nodes/node_host_installer_registry_units/test_ruling_register_unit.py -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn25377-ac1
  description: 'The AC4 evidence is read on h201 itself, not from a test that passes without it: the installer''s record names the checked-out head as the installed revision, last-run.json was written after that install and the 8 ledger rows read TRUE or FALSE in it. It fails until the head is installed through the declared installer and its tick has run, so only the local Done gate runs it (hosted CI cannot reach h201). The unit tests of the AC4 check run under contracts/OMN-24944.yaml AC3 and AC4.'
  source: manual
  binds_ac:
  - AC1
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: |-
      sh -c '
      set -eu
      host=${RULING_REGISTER_HOST:-h201}
      on_host() { if [ "$host" = local ]; then "$@"; else ssh "$host" "$@"; fi; }
      rec=$(on_host cat "$(on_host printenv HOME)/.local/state/omni/ruling-register/last-run.json")
      printf "%s\n" "$rec"
      journal=$(printf "%s" "$rec" | sed -n "s/.*\"journal\": \"\([^\"]*\)\".*/\1/p")
      test -n "$journal"
      installed=$(on_host cat "${journal%/*}/ruling-register-systemd.installed.json")
      printf "%s\n" "$installed"
      printf "%s" "$installed" | grep -qF "\"revision\": \"$(git rev-parse HEAD)\""
      read_at=$(printf "%s" "$rec" | sed -n "s/.*\"read_at\": \"\([^\"]*\)\".*/\1/p")
      installed_at=$(printf "%s" "$installed" | tr -d "\n" | sed -n "s/.*\"installed_at\": \"\([^\"]*\)\".*/\1/p")
      test -n "$read_at"
      test -n "$installed_at"
      test "$(printf "%s" "$read_at" | cut -c1-19 | tr -dc 0-9)" -ge "$(printf "%s" "$installed_at" | cut -c1-19 | tr -dc 0-9)"
      for id in new-work-lands-with-a-fable-verdict dev-holds-ready merged-means-running lanes-placed-bottom-up fable-reviews-run-on-the-mac holds-have-an-owner-and-an-unexpired-expiry plan-slice-round-four-needs-a-scope-cut lab-fill-skips-under-a-fifth; do
        printf "%s" "$rec" | grep -qE "\"$id\": \"(TRUE|FALSE)\"" || { echo "row $id is not answered on h201"; exit 1; }
      done
      '
    cwd: .
- id: dod-omn25377-ac2
  description: 'The match test compares each deployed h201 row with the test''s row verbatim and allows no earlier text: an unhardened docker row is a mismatch (control: the hardened row matches). The command names h201''s deployed overlay root (the unit''s ONEX_SKILL_OVERLAY_ROOTS), so it fails while the deployed overlay carries the unhardened docker row and passes only once the overlays repository carries the hardened row and it is deployed; only the local Done gate runs it.'
  source: manual
  binds_ac:
  - AC2
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: sh -c 'ONEX_RULING_REGISTER_DEPLOYED_ROOTS=/data/omninode/overlays/overlays uv run --frozen pytest tests/nodes/node_host_installer_registry_units/test_ruling_register_unit.py -k "h201_rows_of_the_test_match or failing_docker_row" -q --no-cov -n 0 -p no:randomly -p no:cacheprovider'
    cwd: .
- id: dod-omn25377-ac3
  description: The dod commands of contracts/OMN-25318.yaml that compare the deployed register all set ONEX_RULING_REGISTER_DEPLOYED_ROOTS and run under local_done_gate.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/nodes/node_ruling_register_effect/test_ruling_register_effect.py -k "dod_commands_that_compare" -q --no-cov -n 0 -p no:randomly -p no:cacheprovider
    cwd: .
- id: dod-omn25377-ac4
  description: AC3 of contracts/OMN-25318.yaml states the run-limit and span-aware bound; the 720 s worst case is above the 600 s age bound and below the 900 s run limit.
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/nodes/node_ruling_register_effect/test_ruling_register_effect.py -k "ac3_of_the_review or inside_the_unit_run_limit" -q --no-cov -n 0 -p no:randomly -p no:cacheprovider
    cwd: .
- id: dod-omn25377-ac5
  description: The serial proof requires the 8 ledger ids answered TRUE or FALSE in its own record and fails when h201 is mid-tick; the container read fails when ssh or docker exec fails.
  source: manual
  binds_ac:
  - AC5
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_host_installer_registry_units/test_ruling_register_unit.py -k "serial_proof" -q --no-cov -n 0 -p no:randomly -p no:cacheprovider
    cwd: .
- id: dod-omn25377-ac6
  description: 'Two processes never read the ledger rows at once: the second reads them UNREAD while the first holds the lock, and the lock named by ONEX_RULING_REGISTER_LEDGER_LOCK is the one read_register holds.'
  source: manual
  binds_ac:
  - AC6
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/nodes/node_ruling_register_effect/test_ruling_register_effect.py -k "two_processes or ledger_lock" -q --no-cov -n 0 -p no:randomly -p no:cacheprovider
    cwd: .
- id: dod-omn25377-ac7
  description: The AC4 check's default PATH starts with the ssh user's .local/bin and fails when the ssh user is not the unit's user, the title check reads the title field only, and the span widens the bound only when now is unset.
  source: manual
  binds_ac:
  - AC7
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_host_installer_registry_units/test_ruling_register_unit.py -k "default_path or title_check" -q --no-cov -n 0 -p no:randomly -p no:cacheprovider
    cwd: .
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/nodes/node_ruling_register_effect/test_ruling_register_effect.py -k "widen_the_bound" -q --no-cov -n 0 -p no:randomly -p no:cacheprovider
    cwd: .
- id: dod-omn25377-ac8
  description: The PR carries a Lab comment line naming the head with exit=0 and no non-zero exit. A PR comment is not readable on the hosted runner, so only the local Done gate runs this check.
  source: manual
  binds_ac:
  - AC8
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: 'sh -c ''set -eu; lab=$(onex scm pr-view OmniNode-ai/omnimarket#6345 | grep -F "Lab: head=$(git rev-parse HEAD)"); printf "%s\n" "$lab"; printf "%s\n" "$lab" | grep -q "exit=0"; if printf "%s\n" "$lab" | grep -qE "exit[= ][1-9]"; then echo "the Lab line reports a failed command"; exit 1; fi'''
    cwd: .
- id: dod-omn25377-integration-proof
  description: 'An asserted read of the live register record on h201 (read only): the 8 ledger rows are answered TRUE or FALSE in last-run.json and h201''s unit is not mid-tick. It fails while the install on h201 reads the ledger rows UNREAD, so only the local Done gate runs it, after the head is installed through the declared installer.'
  source: manual
  binds_ac:
  - AC1
  - AC6
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: "sh -c '\nset -eu\nrec=$(ssh h201 cat .local/state/omni/ruling-register/last-run.json)\nprintf \"%s\\n\" \"$rec\"\nfor id in new-work-lands-with-a-fable-verdict dev-holds-ready merged-means-running lanes-placed-bottom-up fable-reviews-run-on-the-mac holds-have-an-owner-and-an-unexpired-expiry plan-slice-round-four-needs-a-scope-cut lab-fill-skips-under-a-fifth; do\n  printf \"%s\" \"$rec\" | grep -qE \"\\\"$id\\\": \\\"(TRUE|FALSE)\\\"\" || { echo \"row $id is not answered on h201\"; exit 1; }\ndone\nrc=0; ssh h201 pgrep -f \"[r]untime_ruling_register_tick\" > /dev/null || rc=$?\ncase \"$rc\" in 1) ;; 0) echo \"h201 is mid-tick\"; exit 1 ;; *) echo \"pgrep on h201 did not answer (exit $rc)\"; exit 1 ;; esac\n'"
    cwd: .
