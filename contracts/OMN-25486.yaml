schema_version: 1.0.0
ticket_id: OMN-25486
title: Worktree pruning runs as a scheduled workflow over every lab host so disks stop filling with stale worktrees
summary: >
  A new node, node_worktree_prune_workflow_effect, holds the body of one prune run over every lab host: one host
  activity per host, each retried up to the plan's attempt limit, a finished host never run again when the run is
  resumed, one report row per host with the disk reading before and after, the trees removed with the space freed
  and the trees kept with their reason, and a disk alarm for a host whose use is past its bar. Eligibility is the
  shared worktree reconcile classifier under its merged-only rule, reused, not copied. The contract declares the
  daily schedule and the ticket-closer result as the close trigger. Registering the schedule on the lab Temporal
  server and running it on the shared worker is not in this change.
is_seam_ticket: false
interface_change: true
interfaces_touched: [protocols]
requirements:
- id: req-worktree-prune-workflow
  statement: One prune run covers every lab host with one activity per host, retries, resume, a per-host report and a disk alarm.
  acceptance:
  - id: AC1
    statement: 'AC1: a test over the eligibility classifier shows a dirty tree, an unpushed tree and a tree named by a live CLAIM are never classified removable, and a clean merged tree is -- falsifier: uv run pytest -m unit on the classifier tests in the omnimarket node'
  - id: AC2
    statement: 'AC2: the workflow test shows one activity per host, a failed host activity is retried and resumed without re-running the finished hosts, and every host yields a report row -- falsifier: uv run pytest -m unit on the workflow replay test'
  - id: AC3
    statement: 'AC3: the disk alarm fires for a host whose use is past its bar and stays quiet below it -- falsifier: uv run pytest -m unit on the alarm threshold test'
evidence_requirements:
- kind: tests
  description: The worktree prune workflow node tests pass at the pushed head.
  command: uv run --frozen pytest tests/nodes/node_worktree_prune_workflow_effect/test_worktree_prune_workflow.py -q --no-cov -m unit
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-worktree-prune-ac1
  description: 'AC1: the merged-only eligibility test (dirty, unpushed, live claim and pushed-unmerged trees kept; the clean merged tree removable); at the merge base the node does not exist.'
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_worktree_prune_workflow_effect/test_worktree_prune_workflow.py -q --no-cov -m unit -k eligibility
    cwd: .
- id: dod-worktree-prune-ac2
  description: 'AC2: one activity per host, a failed host retried then resumed without re-running the finished hosts, a row per host.'
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_worktree_prune_workflow_effect/test_worktree_prune_workflow.py -q --no-cov -m unit -k "activity_per_host or resumed or retry"
    cwd: .
- id: dod-worktree-prune-ac3
  description: 'AC3: the disk alarm past the bar and quiet at or below it, and the run report carrying the alarm of the host past its bar.'
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_worktree_prune_workflow_effect/test_worktree_prune_workflow.py -q --no-cov -m unit -k alarm
    cwd: .
- id: dod-worktree-prune-integration-proof
  description: the node tests run on a lab host at the pushed head through the lab work runner; hosted CI cannot reach the lab, so only the local Done gate runs this unbound check
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-worktree-prune --kind test -- uv run --frozen pytest tests/nodes/node_worktree_prune_workflow_effect -q --no-cov -m unit
