  binds_ac:
  - AC4
  checks:
  - check_type: command
    check_value: 'bash -o pipefail -c ''gh api "repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_bus_login_exposure_scheduled_effect/contract.yaml?ref=$(git rev-parse HEAD)" --jq .content | base64 -d | grep -F "HandlerBusLoginExposureScheduled" > /dev/null'''
    cwd: .
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_overlay_drift_scheduled_effect/test_contract_topics.py tests/nodes/node_bus_login_exposure_scheduled_effect/test_contract_topics.py tests/nodes/node_delegation_events_defect_scan_scheduled_effect/test_contract_topics.py tests/nodes/node_c32_probe_scheduled_effect/test_contract_topics.py -q --no-cov
    cwd: .
