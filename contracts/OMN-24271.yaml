schema_version: 1.0.0
ticket_id: OMN-24271
title: Run four daily checks inside the runtime on its schedule
summary: Adds a scheduled effect node for each of the overlay drift read, the bus login exposure probe, the delegation_events defect scan and the C32 auth-boundary probe, so each runs on the runtime tick from overlay values and reports a typed run event.
is_seam_ticket: true
interface_change: true
interfaces_touched:
- topics
requirements:
- id: req-omn24271-four-scheduled-checks
  statement: Each of the four checks runs on the runtime tick from overlay values, records each run as a typed run event, and names an unreadable or unbound source in a failed run event.
  acceptance:
  - id: AC1
    statement: 'AC1: each of the four scheduled jobs gates on its overlay interval, runs its check once per interval and returns one typed run event naming its job -- falsifier: uv run --frozen pytest tests/nodes/node_overlay_drift_scheduled_effect tests/nodes/node_bus_login_exposure_scheduled_effect tests/nodes/node_delegation_events_defect_scan_scheduled_effect tests/nodes/node_c32_probe_scheduled_effect -q --no-cov'
  - id: AC2
    statement: 'AC2: a missing schedule overlay refuses once, and an unreadable or unbound source of a check is a failed run event that names it, never a silent skip -- falsifier: uv run --frozen pytest tests/nodes/node_overlay_drift_scheduled_effect tests/nodes/node_bus_login_exposure_scheduled_effect tests/nodes/node_delegation_events_defect_scan_scheduled_effect tests/nodes/node_c32_probe_scheduled_effect -q --no-cov -k error'
  - id: AC3
    statement: 'AC3: the overlays repository holds each job''s values and the dev runtime login lists each job node, so the broker rows follow from the contracts -- falsifier: uv run pytest tests/test_schedule_job_overlays.py -q in the overlays repository'
  - id: AC4
    statement: 'AC4: integrated: on the dev runtime, one run event from each of the four jobs is read on onex.evt.omnimarket.schedule-run.v1 within 30 minutes of the deploy -- falsifier: read the topic on the dev broker after the deploy; a job with no run event within 30 minutes fails it'
evidence_requirements:
- kind: tests
  description: The golden and error chain tests of the four scheduled nodes
  command: uv run --frozen pytest tests/nodes/node_overlay_drift_scheduled_effect tests/nodes/node_bus_login_exposure_scheduled_effect tests/nodes/node_delegation_events_defect_scan_scheduled_effect tests/nodes/node_c32_probe_scheduled_effect -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
