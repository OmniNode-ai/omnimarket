    check_value: uv run --frozen pytest tests/nodes/node_overlay_drift_scheduled_effect tests/nodes/node_bus_login_exposure_scheduled_effect tests/nodes/node_delegation_events_defect_scan_scheduled_effect tests/nodes/node_c32_probe_scheduled_effect -q --no-cov
