---
schema_version: "1.0.0"
ticket_id: "OMN-24862"
title: "omnimarket PR 5761 runs where it belongs: h053 onex-runner-group-exposure-hourly is installed and read running"
summary: "The hourly runner group reading on h053 reads UNKNOWN with reason group-read-refused. Read through the same bus path the unit uses, the GitHub write node answers two HTTP 200 responses for the group and then refuses its body, because the write node's runner_group_get requires a field named restricted_to_selected_workflows and GitHub names that field restricted_to_workflows. The write node (and the exposure source's own-token read) now read the field GitHub sends, and a refusal names the fields the body lacked."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-omn24862-group-field"
    statement: |-
      The runner group read accepts the body GitHub sends, so the hourly reading can name a verdict, and a refused body names the fields it lacked.
    acceptance:
      - id: "AC2"
        statement: "AC2: the unit's own newest run on h053 records one exposure verdict other than UNKNOWN, or the STATUS row names the single cause that keeps it UNKNOWN and who must act -- falsifier: `systemctl --user status onex-runner-group-exposure-hourly.service` on h053 and the unit's newest reading row show verdict=UNKNOWN with no cause and no named actor"
evidence_requirements:
  - kind: "tests"
    description: "The write node's runner_group_get tests, the bus group read and the exposure probe tests."
    command: "uv run pytest tests/unit/nodes/node_github_repo_write_effect/test_handler_runner_group_get.py tests/nodes/node_runner_group_exposure_effect/test_bus_group_read.py tests/nodes/node_runner_group_exposure_effect/test_exposure_probe.py -q --no-cov"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn24862-group-field"
    description: "The runner_group_get tests pass at the head with a body shaped as GitHub sends it (restricted_to_workflows); with the source files of origin/dev put back, the same tests fail with the refusal the h053 unit reads."
    source: "manual"
    binds_ac: ["AC2"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/nodes/node_github_repo_write_effect/test_handler_runner_group_get.py tests/nodes/node_runner_group_exposure_effect/test_bus_group_read.py tests/nodes/node_runner_group_exposure_effect/test_exposure_probe.py -q --no-cov"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn24862-status-row"
    description: "The lane's STATUS row on the rolling ledger names the installed revision on h053, what ran, the single cause and who acts, and the installer receipt. Hosted CI cannot read the ledger, so only the local Done gate runs this."
    source: "manual"
    execution_scope: "local_done_gate"
    checks:
      - check_type: "command"
        check_value: "sh -c \"grep -F 'pr=omnimarket#5761' \\\"$ONEX_LEDGER_PATH\\\" | grep -F 'installed=h053:' | grep -F 'install_record='\""
        cwd: "."
  - id: "dod-omn24862-integration-proof"
    description: "Run the runner group read tests on a lab host at the pushed head. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check. It binds no acceptance criterion: the runtime reading is read on h053 after the fix is deployed to the dev runtime's write node."
    source: "manual"
    execution_scope: "local_done_gate"
    checks:
      - check_type: "command"
        check_value: "env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha \"$(git rev-parse HEAD)\" --lane dod-integration-proof-24862 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/nodes/node_github_repo_write_effect/test_handler_runner_group_get.py tests/nodes/node_runner_group_exposure_effect/test_bus_group_read.py -q --no-cov"
        cwd: "."
