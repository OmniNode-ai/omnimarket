schema_version: 1.0.0
ticket_id: OMN-22369
title: 'Lean line board T4: every line in progress is a line in the factory floor compute'
summary: >-
  The factory floor compute selects its lines by six classes (declared, plan, goal, ruling, ticket, process), each line once at its lowest class, ordered by class, then the overlay's order, then id. The class vocabulary, the window and the sources each class is chosen from are the contract's line_select block; the new handler module floor_line_select holds the rule and no list. The record gains line_class and ruled_by on each line and a coverage entry per drawn class, taken from the caller's source health (read, read-empty, stale, unread): a stale plans-today output keeps its lines and says stale with its time, and one never read gives unread with no count. A run draws only the classes it names (default declared and plan), so the published record is unchanged until the effect forwards the other classes' facts. The existing line ids of classes declared and plan are unchanged, and the output is a function of the request alone.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn22369-line-select
  statement: Every line in progress is one line of the floor compute, chosen by one of six classes, deduplicated at the lowest class, with the existing line ids unchanged, a replay-deterministic output and honest coverage per class.
  acceptance:
  - id: AC1
    statement: 'AC1: the union and dedup rule yields nine lines for the plan''s nine-line fixture and a mutant that keeps duplicates fails -- falsifier: uv run pytest tests/nodes/node_factory_floor_compute -q -k "select or line_class"'
  - id: AC2
    statement: 'AC2: the six line ids of the 2026-11-03T13:21:32Z record equal those the new compute gives for the same plans -- falsifier: uv run pytest tests/nodes/node_factory_floor_compute -q -k "select or line_class"'
  - id: AC3
    statement: 'AC3: the same request gives byte-equal output at two wall-clock times -- falsifier: a replay test run twice with the clock moved, uv run pytest tests/nodes/node_factory_floor_compute -q'
  - id: AC4
    statement: 'AC4: a stale plans-today output keeps its lines and coverage says stale with its time, and none ever read gives unread and no class 2 count -- falsifier: the two coverage fixtures in uv run pytest tests/nodes/node_factory_floor_compute -q'
  - id: AC5
    statement: 'AC5: on h051 the per-class line counts equal an independent count from the plans-today output, the goal file and the ledger -- falsifier: the lab-run printout of the pairs shows any difference'
evidence_requirements:
- kind: tests
  description: The line selection tests with their named mutants (duplicates kept, an id renamed, the wall clock read) and the rest of the factory floor compute tests.
  command: uv run pytest tests/nodes/node_factory_floor_compute -q --no-cov
