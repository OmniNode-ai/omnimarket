schema_version: 1.0.0
ticket_id: OMN-23457
title: The automatic work-filler's live settings get their own proof-of-done so the change can land
summary: node_floor_fill_orchestrator gains a live profile (--profile live) whose store, floor record, plan texts, ledger file, process runner and clock are bound from the overlay's floor_fill_live section. The pool, tickets, brake and stop-signal seams have no live source yet and are bound by injection; a missing one refuses by name (unbound:pool, unbound:tickets, unbound:brake, unbound:stop-signal) and the pass starts nothing. This contract binds the live profile's evidence so dod-verify can judge the pull request that carries it.
is_seam_ticket: true
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23457-live-profile
  statement: The live profile of the fill binds the seams that have a live source from the overlay, refuses a missing overlay key or an unset store variable by name, and fails closed by name on each seam that has no live binding, so a fill pass never reads an unbound seam as a free pool, an open brake or a clear stop signal.
  acceptance:
  - id: AC1
    statement: 'AC1: omnimarket#5697 is retitled to this ticket and carries this ticket''s contract, whose bound tests fail at the merge base (a failing control for the live profile binding), with dev merged in -- falsifier: the bound tests at the merge base'
  - id: AC2
    statement: 'AC2: each live seam (pool, ticket, brake, stop signal) refuses by name when its binding is missing, shown by one test per seam -- falsifier: remove one binding and run its test'
  - id: AC3
    statement: 'AC3: integrated: with the fill state store reachable, one live tick of the fill orchestrator runs on a lab host from the merged revision and its decision row is read from the ledger; while the store''s change is unmerged, the tick''s typed refusal naming the store is the recorded reading -- falsifier: the tick''s exit and its ledger row on the lab host'
evidence_requirements:
- kind: tests
  description: The live profile binding tests (overlay keys, store variable, profile name, factory, scripted tick), the one-per-seam refusal tests with their all-bound positive control, and the seam test against the floor record reader
  command: uv run --frozen pytest src/omnimarket/nodes/node_floor_fill_orchestrator/tests/test_floor_fill_live_binding.py src/omnimarket/nodes/node_floor_fill_orchestrator/tests/test_floor_fill_live_seams.py -q --no-cov -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23457-live-profile-binding
  description: Runs the live profile binding tests. The entry accepts --profile live and names the unset store variable; a missing floor_fill_live key is refused naming it; the all-seams-bound tick ends OK. At the merge base (dev) the entry refuses the profile as profile-unbound:live and the live container does not exist, so these tests fail there.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest src/omnimarket/nodes/node_floor_fill_orchestrator/tests/test_floor_fill_live_binding.py src/omnimarket/nodes/node_floor_fill_orchestrator/tests/test_floor_fill_live_seams.py -q --no-cov -p no:randomly -k live_profile
    cwd: .
- id: dod-omn23457-seams-refuse-by-name
  description: Runs the one-test-per-seam refusals. With the other three seams bound and the one under test left out, the pool answers pool-unread:unbound:pool, the brake brake-unread:unbound:brake, the stop signal stop-signal-unread:unbound:stop-signal, the tickets UNKNOWN fill-state:unbound:tickets; each pass starts nothing and the stored row stays at version 0. The all-bound tick is the positive control, and the reader seam test reads a floor record whose stopped entries carry a needs cell.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest src/omnimarket/nodes/node_floor_fill_orchestrator/tests/test_floor_fill_live_seams.py -q --no-cov -p no:randomly -k seam
    cwd: .
- id: dod-omn23457-store-refusal-by-name
  description: Runs the live tick test for the store reading. With the store variable unset the live tick ends UNKNOWN naming the variable and never its value, the reading recorded while the fill state store's change is unmerged. At the merge base (dev) the live profile does not exist, so the test fails there.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest src/omnimarket/nodes/node_floor_fill_orchestrator/tests/test_floor_fill_live_binding.py -q --no-cov -p no:randomly -k dsn_unset
    cwd: .
- id: dod-omn23457-integration-proof-lab
  description: Runs the live profile and seam tests at the pushed head on a lab host through the lab work runner. Hosted CI cannot reach the lab runner, so only the local Done gate runs this unbound item; the live tick on the lab host and its ledger reading are recorded in the pull request's Lab line.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: 'env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23457 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest src/omnimarket/nodes/node_floor_fill_orchestrator/tests/test_floor_fill_live_binding.py src/omnimarket/nodes/node_floor_fill_orchestrator/tests/test_floor_fill_live_seams.py -q --no-cov -p no:randomly'
    cwd: .
