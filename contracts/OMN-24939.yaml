schema_version: 1.0.0
ticket_id: OMN-24939
title: 'alarm routing: page only what needs a person, digest the rest, drop the noise'
summary: Every lab alarm source carries one declared severity in node_lab_alarm's contract; the delivery of the node's conditions goes through a severity router that wraps the existing delivery's episode and ledger rules, holds DIGEST sources for one daily digest message, never posts DROP sources and lists FIX-CAUSE sources in one STATUS row.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24939-routing
  statement: Alarm sources route by their declared severity through the existing delivery rules, with no second dedupe layer.
  acceptance:
  - id: AC1
    statement: 'AC1: every alarm source carries a declared severity in the alarm node contract and a source with no severity is refused at load -- falsifier: uv run pytest tests/ -q -k "alarm_severity" exits non-zero on a source with no severity'
  - id: AC2
    statement: 'AC2: a PAGE source posts once per new condition, nothing more while it holds, and one message when it clears -- falsifier: uv run pytest tests/ -q -k "alarm_page_flapping" exits non-zero on the parent of the fix commit'
  - id: AC3
    statement: 'AC3: DIGEST sources post once a day as one summary message -- falsifier: uv run pytest tests/ -q -k "alarm_digest" exits non-zero on the parent of the fix commit'
  - id: AC4
    statement: 'AC4: DROP sources post nothing and still write their ledger rows -- falsifier: uv run pytest tests/ -q -k "alarm_drop" exits non-zero on the parent of the fix commit'
  - id: AC5
    statement: 'AC5: FIX-CAUSE sources stay routed as PAGE and are listed in one STATUS row -- falsifier: uv run pytest tests/ -q -k "alarm_fix_cause" exits non-zero on the parent of the fix commit'
evidence_requirements:
- kind: tests
  description: The severity routing tests.
  command: env -u PYTHONPATH uv run --frozen pytest tests/nodes/node_lab_alarm/test_lab_alarm_severity_routing.py -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
