schema_version: 1.0.0
ticket_id: OMN-25168
title: 'Review findings 1 to 6 on omnimarket PR 6335 at head 671de2919b0d are fixed or argued: the AC3 item pins host, container and revision, and own-key metered cost is excluded from platform spend readers'
summary: 'Fixes for the review of the delegation cost fix: the AC3 item of the OMN-24874 contract reads the running revision of the pinned dev runtime container and tests ancestry, the ceiling budget readers skip the tenant_overlay tier by their own rule, the projection floor rounds like the workflow terminal, and the probe test sets the endpoint.'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn25168-ac1
  statement: 'AC1: the AC3 item of contracts/OMN-24874.yaml pins the host and container, reads the running revision and tests ancestry against the fix, or is unbound, with a behavioural test built on a temp repo and an ssh shim'
  acceptance:
  - id: AC1
    statement: 'AC1: the AC3 item of contracts/OMN-24874.yaml pins the host and container, reads the running revision and tests ancestry against the fix, or is unbound, with a behavioural test built on a temp repo and an ssh shim -- falsifier: `uv run --frozen pytest tests -k "omn24874 and contract" -q` passes with the item reading only the imported symbol'
- id: req-omn25168-ac2
  statement: 'AC2: every reader that sums metered cost_usd (materialize_budget_state, ceilings, billing, savings views) is read, the PR states the read, and a reader that counts the tenant_overlay tier excludes it, with a test'
  acceptance:
  - id: AC2
    statement: 'AC2: every reader that sums metered cost_usd (materialize_budget_state, ceilings, billing, savings views) is read, the PR states the read, and a reader that counts the tenant_overlay tier excludes it, with a test -- falsifier: `uv run --frozen pytest tests -k "omn24874 and tenant_overlay" -q` passes with the exclusion reverted'
- id: req-omn25168-ac3
  statement: 'AC3: the probe in test_omn24874_tenant_overlay_terminal_cost.py sets an endpoint so an unpriced model fails it, the endpoint argument matches the signature and the floor rounding matches the workflow, with a test'
  acceptance:
  - id: AC3
    statement: 'AC3: the probe in test_omn24874_tenant_overlay_terminal_cost.py sets an endpoint so an unpriced model fails it, the endpoint argument matches the signature and the floor rounding matches the workflow, with a test -- falsifier: `uv run --frozen pytest tests/unit/delegation/test_omn24874_tenant_overlay_terminal_cost.py -q` passes with the probe endpoint removed'
evidence_requirements:
- kind: tests
  description: The contract check tests, the ceiling budget reader tests and the tenant overlay pricing tests.
  command: env -u PYTHONPATH uv run --frozen pytest tests/test_omn24874_contract_checks.py tests/unit/delegation/test_omn24874_tenant_overlay_budget_readers.py tests/unit/delegation/test_omn24874_tenant_overlay_terminal_cost.py -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn25168-ac1-ac3-item-reads-revision
  description: The AC3 item of the OMN-24874 contract is pinned to the container omninode-runtime and its compose project label, reads the omnimarket commit the container's build provenance records for its workspace build, tests ancestry of the fix against it, and a temp repo with ssh and hostname shims shows it passing when all hold and failing for an older revision, a wrong project label or container, a dirty or untagged build, a missing omnimarket record, a missing symbol, an unset host variable and an unmerged fix.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/test_omn24874_contract_checks.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn25168-ac2-overlay-excluded-from-ceilings
  description: The sync and async ceiling budget readers skip the tenant_overlay tier even when a registry declares a cap for it, and still draw a budgeted tier; the read of every reader that sums cost_usd is stated in the PR comment.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/delegation/test_omn24874_tenant_overlay_budget_readers.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn25168-ac3-probe-endpoint-and-rounding
  description: The probe event carries the endpoint so the declared model prices and the undeclared model does not, an endpoint-less probe prices nothing, and the projection floor equals the workflow terminal's ten-place figure.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/delegation/test_omn24874_tenant_overlay_terminal_cost.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn25168-ac4-lab-comment-names-head
  description: 'The PR holds a comment starting Lab: head= with the full head of the checkout, and comments that name findings 5 and 6. Local Done gate only: it reads the pull request comments and a sha.'
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: 'sh -c ''C=$(onex scm pr-view OmniNode-ai/omnimarket#6335 --comments) && printf %s "$C" | grep -qF "Lab: head=$(git rev-parse HEAD)" && printf %s "$C" | grep -q "finding 5" && printf %s "$C" | grep -q "finding 6"'''
    cwd: .
- id: dod-omn25168-integration-proof
  description: The contract check tests, the ceiling budget reader tests and the tenant overlay pricing tests run on a lab host at the pushed head through the lab work runner; hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --bus-lane dev --omnibase-path "${OMNI_HOME:?}" --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-25168 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/test_omn24874_contract_checks.py tests/unit/delegation/test_omn24874_tenant_overlay_budget_readers.py tests/unit/delegation/test_omn24874_tenant_overlay_terminal_cost.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn25168-real-postgres
  description: The real-Postgres file of the cost fix, now with the ceiling budget state test, runs on a lab host against a disposable postgres:16-alpine container that the command starts and removes; it fails when any of the file's tests is skipped. Local Done gate only.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --bus-lane dev --omnibase-path "${OMNI_HOME:?}" --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-real-postgres-25168 --kind test -- sh -c 'PW=$(head -c 18 /dev/urandom | base64 | tr -dc A-Za-z0-9); N=dod-omn24874-pg-$$; OUT=/tmp/$N.out; docker run -d --rm --name "$N" -e POSTGRES_PASSWORD="$PW" -e POSTGRES_DB=omnibase_infra -p 127.0.0.1::5432 postgres:16-alpine >/dev/null; trap "docker rm -f $N >/dev/null; rm -f $OUT" EXIT; for i in $(seq 1 40); do docker exec "$N" pg_isready -U postgres -q && break; sleep 1; done; PORT=$(docker port "$N" 5432/tcp | head -1 | sed "s/.*://"); INTEGRATION_POSTGRES_PASSWORD="$PW" INTEGRATION_POSTGRES_HOST=127.0.0.1 INTEGRATION_POSTGRES_PORT="$PORT" env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/test_omn24874_tenant_overlay_cost_real_postgres.py -q --no-cov -n 0 -p no:randomly -rs > "$OUT" 2>&1; R=$?; cat "$OUT"; ! grep -q skipped "$OUT" && exit $R'
    cwd: .
