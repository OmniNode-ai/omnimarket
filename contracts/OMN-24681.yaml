schema_version: 1.0.0
ticket_id: OMN-24681
title: 'omnimarket#6312: the key-credit probe''s schedule unit runs a command its base has, shows a failing probe''s reason, and tests its declared exits'
summary: The review of the key-credit probe's schedule unit returned seven findings. This change makes the unit's tests assert that the command it schedules exists with the options the tick passes (the unit lands after the change that adds the command), passes the probe's stdout and stderr through to the tick's streams, tests the tick's declared exits and wiring, gives the probe its own overlay id, refuses a bare run without a state directory, prints the overlay error message and resolves onex beside the running interpreter.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24681-schedule-unit-review
  statement: The key-credit probe's schedule unit runs a command its base has, shows a failing probe's reason, and has tests for its declared exits and wiring.
  acceptance:
  - id: AC1
    statement: 'AC1: a test reads the `models` group''s `review-gateway-key-probe` command and asserts it has `--tenant`, `--model`, `--host`, `--state-dir` and a `--ledger` bound to ONEX_LEDGER_PATH, and the unit lands after or stacked on omnimarket#6285 -- falsifier: uv run pytest on the new command-exists test fails at a base without the command and passes with it'
  - id: AC2
    statement: 'AC2: a failing probe''s stdout and stderr reach the tick''s own streams, the summary keeps only the flip-count line, and a red run''s reason is asserted on stderr -- falsifier: uv run pytest on the new red-run stderr test fails before the change and passes after'
  - id: AC3
    statement: 'AC3: one test each covers TimeoutExpired giving 124 with a heartbeat, OSError giving 1, an invalid overlay giving 3 with nothing run, an overlay without host passing no --host, key state going to the state-dir keys directory, the probe timeout staying under run_timeout_s, and ONEX_LEDGER_PATH present in the rendered plist -- falsifier: uv run pytest on the seven new schedule tests fails with the matching line removed and passes with it restored'
  - id: AC4
    statement: 'AC4: the probe has its own overlay id so an event_bus or contract section in the node''s overlay no longer makes every tick exit 3, a bare run without --state-dir refuses the pass, the overlay error message is printed, and onex resolves beside sys.executable -- falsifier: uv run pytest on the four new tests fails before the change and passes after'
  - id: AC5
    statement: 'AC5: the schedule suites the pull request requires run on the lab at the pushed head and pass, with any whole-suite timeout split into named parts -- falsifier: onex lab-run uv run pytest tests/unit/nodes/node_claude_review_gateway_effect exits 0 at the pull request head'
