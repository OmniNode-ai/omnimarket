schema_version: 1.0.0
ticket_id: OMN-23663
title: Lane start observe mode, per-start arguments from the fill and host choice that honours the host table
summary: 'The placement chain run of 2026-11-11 placed a lane on a scripted transport only, chose a host the lab host table can mark out of service, and had its floor-line starts refused by the start entry with exit 2. This change adds a start_mode overlay value to the lane start node (observe publishes the whole start it would make and writes nothing: no CLAIM, no receipt, no host call), makes the fill write a brief file and pass the six flags the entry requires for a floor-line start, and makes the start''s placement refuse a host the lab host table marks available false (an unreadable table refuses the start).'
is_seam_ticket: true
interface_change: true
interfaces_touched:
- events
- topics
- public_api
requirements:
- id: req-omn23663-observe-fill-host
  statement: One lane is placeable by the node chain for real beside the runner script, and its would-be start can be read without starting it.
  acceptance:
  - id: AC1
    statement: 'AC1: a lane start with start_mode observe places the lane and publishes the full start it would make and writes nothing else -- falsifier: uv run --frozen pytest src/omnimarket/nodes/node_remote_lane_start_orchestrator/tests/test_remote_lane_start_observe.py -q --no-cov -n 0 -p no:randomly, with the ssh runner and the ledger writer failing if called, and the act control calling them'
  - id: AC2
    statement: 'AC2: the start entry accepts the arguments the fill passes for a floor-line start -- falsifier: uv run --frozen pytest src/omnimarket/nodes/node_remote_lane_start_orchestrator/tests/test_remote_lane_start_fill_seam_bus.py src/omnimarket/nodes/node_remote_lane_start_orchestrator/tests/test_remote_lane_start_seams.py src/omnimarket/nodes/node_floor_fill_orchestrator/tests/test_floor_fill_line_brief.py -q --no-cov -n 0 -p no:randomly, with the planted rename and the dropped flag turning the pin red'
  - id: AC3
    statement: 'AC3: host choice refuses a host the lab host table marks available false, naming its reason, and an unreadable table refuses the start -- falsifier: uv run --frozen pytest src/omnimarket/nodes/node_remote_lane_start_orchestrator/tests/test_remote_lane_start_observe.py src/omnimarket/nodes/node_remote_lane_start_orchestrator/tests/test_remote_lane_start_observe_seam.py -q --no-cov -n 0 -p no:randomly, with the same host in service placed'
  - id: AC4
    statement: 'AC4: integrated: the chain run in observe mode on a lab host against the current real inputs prints the would-be start of a real floor line beside what the script placement chose, and the ledger gains no row -- falsifier: the ledger row count and the receipt directory read before and after, and the onex run-node output of the running node'
evidence_requirements:
- kind: tests
  description: The observe, availability, fill brief and seam tests at the pushed head.
  command: uv run --frozen pytest src/omnimarket/nodes/node_remote_lane_start_orchestrator/tests/test_remote_lane_start_observe.py src/omnimarket/nodes/node_remote_lane_start_orchestrator/tests/test_remote_lane_start_observe_seam.py src/omnimarket/nodes/node_remote_lane_start_orchestrator/tests/test_remote_lane_start_fill_seam_bus.py src/omnimarket/nodes/node_remote_lane_start_orchestrator/tests/test_remote_lane_start_seams.py src/omnimarket/nodes/node_floor_fill_orchestrator/tests/test_floor_fill_line_brief.py -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23663-ac1-observe
  description: The observe-mode start places and publishes the start and makes no CLAIM, receipt, host call or login draw, and the act control calls the runner and writes the CLAIM.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest src/omnimarket/nodes/node_remote_lane_start_orchestrator/tests/test_remote_lane_start_observe.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn23663-ac2-fill-seam
  description: The fill-to-entry seam pins the six flags bridged on the in-memory bus (the broker leg runs when the lab names a bus lane), the planted rename and the dropped flag turn it red, and the fill writes a brief per floor-line start.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest src/omnimarket/nodes/node_remote_lane_start_orchestrator/tests/test_remote_lane_start_fill_seam_bus.py src/omnimarket/nodes/node_remote_lane_start_orchestrator/tests/test_remote_lane_start_seams.py src/omnimarket/nodes/node_floor_fill_orchestrator/tests/test_floor_fill_line_brief.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn23663-ac3-host-table
  description: A host the lab host table marks out is refused with its reason, the same host in service is placed, and an unreadable table refuses the start.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest src/omnimarket/nodes/node_remote_lane_start_orchestrator/tests/test_remote_lane_start_observe.py src/omnimarket/nodes/node_remote_lane_start_orchestrator/tests/test_remote_lane_start_observe_seam.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn23663-ac4-observe-wiring-hosted
  description: 'The hosted side of AC4: the real wiring in observe mode over a spy for the ssh transport''s command runner reaches no host and writes no row or receipt, and the same wiring in act mode reaches the runner and writes the CLAIM. The read of the running node on the lab host against the current real inputs is the unbound local item below.'
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest src/omnimarket/nodes/node_remote_lane_start_orchestrator/tests/test_remote_lane_start_observe_real_wiring.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn23663-integration-proof
  description: The pushed head ran the observe, availability, fill brief and seam tests on a lab host through the lab work runner and exited 0. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23663 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest src/omnimarket/nodes/node_remote_lane_start_orchestrator/tests/test_remote_lane_start_observe.py src/omnimarket/nodes/node_remote_lane_start_orchestrator/tests/test_remote_lane_start_observe_seam.py src/omnimarket/nodes/node_remote_lane_start_orchestrator/tests/test_remote_lane_start_fill_seam_bus.py src/omnimarket/nodes/node_remote_lane_start_orchestrator/tests/test_remote_lane_start_seams.py src/omnimarket/nodes/node_floor_fill_orchestrator/tests/test_floor_fill_line_brief.py -q --no-cov -n 0 -p no:randomly
    cwd: .
