schema_version: 1.0.0
ticket_id: OMN-19362
title: Delegated test loop orchestrator node and its compact result
summary: Owning ticket criteria for the existing loop and compact result. Executable probes cover AC1-AC5 and AC7. AC6 requires the original T1 model path and design-review verdict in the PR; its historical citation is not reverified on this lab host. The original T8 receipts are absent here, so replay proof below uses a newly recorded fake-child loop receipt. No Done claim or rollout authorization is made. This pull request binds only AC5, the compact result it adds; AC1-AC4 and AC7 behaviour is already on dev at the merge base and is run here as unbound head evidence.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-delegated-test-loop
  statement: The existing loop must bound delegate calls, stop for no progress, refuse infrastructure faults, replay recorded child results, and return a compact result without test source.
  acceptance:
  - id: AC1
    statement: 'AC1: No behaviour makes more than three delegate calls. -- falsifier: a fake-child test in `uv run pytest src/omnimarket/nodes/node_delegated_test_loop_orchestrator/tests -q` whose every run fails counts four delegate dispatches.'
  - id: AC2
    statement: 'AC2: Two identical fingerprints in a row stop the loop with `no_progress`. -- falsifier: a fake-child test.'
  - id: AC3
    statement: 'AC3: An infrastructure fault is never accepted. -- falsifier: `test_infra_error_is_never_accepted` with a fake child returning a missing junit file.'
  - id: AC4
    statement: 'AC4: Replaying a recorded loop receipt''s child results through the decision function gives the same status. -- falsifier: a replay test over a recorded loop receipt.'
  - id: AC5
    statement: 'AC5: The serialized result stays under 4 KB. -- falsifier: a test with the maximum digest.'
  - id: AC6
    statement: 'AC6: The model-before-build citation is present. -- falsifier: the PR body lacks the T1 model path and verdict line.'
  - id: AC7
    statement: 'AC7: The node declares no `Plugin*` class. -- falsifier: `omnibase_infra.validators.no_plugin_daemon_classes` over the node.'
evidence_requirements:
