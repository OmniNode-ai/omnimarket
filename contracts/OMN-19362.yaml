  description: Execute the focused orchestrator probes on a lab host. Historical T1 and T8 artifact verification and the central bound dod_verify remain outstanding.
  command: env -u PYTHONPATH uv run pytest tests/nodes/node_delegated_test_loop_orchestrator -q -p no:cacheprovider
