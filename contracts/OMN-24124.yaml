schema_version: 1.0.0
ticket_id: OMN-24124
title: The board's host check skips a parked host and names the host that failed
summary: 'The publish cycle''s join_j2 step failed on every cycle with exit 1 and an empty diagnostic. Cause one: the overlay''s host list names h106, which the host table parks (available false, moving
  to the basement); placement refuses it typed on every run and the run counts as failed. Cause two: the run wrote its per-host failure lines to stdout while the publisher keeps the stderr tail as the step''s
  diagnostic (the same shape as the J5 step, OMN-23717). This change skips hosts the table parks, printing a J2-SKIP line with the table''s reason, and writes one J2-FAILED line naming each failed host
  and its typed failure code to stderr; a host the table does not list is still probed and an unreadable table probes every host.'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24124-j2-parked-host
  statement: The host check probes only hosts the host table has available and says which host failed and why.
  acceptance:
  - id: AC1
    statement: 'AC1: the host check of the publish cycle skips a host the host table marks unavailable, names it and the table''s reason, and still checks every other host -- falsifier: uv run --frozen
      pytest tests/nodes/node_host_reading_effect/test_join_j2_parked_hosts.py -q --no-cov fails on the base commit and passes on the branch'
  - id: AC2
    statement: 'AC2: a failed host check writes one stderr line naming each failed host and its typed failure code, and the publisher''s step diagnostic carries it -- falsifier: the same test file fails
      on the base commit and passes on the branch'
  - id: AC3
    statement: 'AC3: integrated: the publish cycle on the Mac installed from the merged revision reads join_j2 ok when every unparked host is golden -- falsifier: the served publish-status.json read on
      the Mac shows join_j2 failed in a cycle where no unparked host failed, or a failed join_j2 whose log line ends after the colon with no host named'
evidence_requirements:
- kind: tests
  description: The parked-host, failure-report and publisher-seam tests pass at the pushed head.
  command: uv run pytest tests/nodes/node_host_reading_effect/test_join_j2_parked_hosts.py tests/nodes/node_factory_floor_publish_effect/test_join_j2_step.py -q -n 0 --no-cov -p no:cacheprovider
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24124-ac1
  description: 'AC1: a parked host is skipped with the table''s reason and the others are probed; a host the table does not list is probed; an unreadable table probes every host.'
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_host_reading_effect/test_join_j2_parked_hosts.py tests/nodes/node_factory_floor_publish_effect/test_join_j2_step.py -q -n 0 --no-cov -p no:cacheprovider
    cwd: .
- id: dod-omn24124-ac2
  description: 'AC2: the failure report names each failed host and code, and the publisher''s diagnostic carries the runner''s line; a runner that says nothing leaves it empty (the control).'
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_host_reading_effect/test_join_j2_parked_hosts.py tests/nodes/node_factory_floor_publish_effect/test_join_j2_step.py -q -n 0 --no-cov -p no:cacheprovider
    cwd: .
- id: dod-omn24124-ac3
  description: 'hosted proxy for AC3: the tests above pass; the Mac cycle''s join_j2 status is read on the publishing Mac after install and named in the pull request.'
  source: manual
  binds_ac:
