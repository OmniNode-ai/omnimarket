schema_version: 1.0.0
ticket_id: OMN-23748
title: Make the host pool snapshot read the right path on each machine and finish within its time limit
summary: The pool snapshot unit asked each far host for its token pool with the local registry path, expanded by the far shell where it is unset, so every host read zero free slots, and one pass read its
  three slow sources one after another (about 62 s) past the unit's 50 s bound. The far command now walks the lab host table's declared registry roots on the far host, and the advertisement, ledger and
  account reads run at once (about 31 s).
is_seam_ticket: true
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23748-pool
  statement: The snapshot unit publishes a snapshot with real free slots inside its time bound.
  acceptance:
  - id: AC1
    statement: 'AC1: the remote token pool read resolves the registry root from the lab host table''s declared registry root candidates on the far host, never from the local environment -- falsifier: the
      wiring test fails when the far argv carries the local path or an unexpanded placeholder, and a profile with no declared root is refused at wiring'
  - id: AC2
    statement: 'AC2: one pass reads the advertisement, ledger and account sources at once and finishes under the unit''s 50 s bound, naming the same first failure as before when two fail -- falsifier: the
      handler test with sources that wait on each other fails when they are read one after another'
  - id: AC3
    statement: 'AC3: the failed-event topic exists on the dev broker and accepts the unit''s write, shown by the events on it -- falsifier: a read of the topic shows no failed event from the unit after
      a failing tick'
  - id: AC4
    statement: 'AC4: integrated: the installed unit on a lab host publishes one snapshot event with a projection row whose h051 free slots match the remote-lane runner''s pool reading within the running-lane
      movement of the same minute -- falsifier: the unit''s tick times out or ends failed, or the free slots read 0 for a host that has capacity'
evidence_requirements:
- kind: tests
  description: The focused tests of this change pass at the pushed head.
  command: uv run --frozen pytest tests/nodes/node_lane_host_pool_snapshot_effect -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23748-ac1
  description: The far host's argv carries the declared registry roots and never the local path; a profile with none declared is refused.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_lane_host_pool_snapshot_effect/test_pool_snapshot_wiring_roots.py tests/nodes/node_lane_host_pool_snapshot_effect/test_pool_snapshot_sources.py -q
      --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn23748-ac2
  description: The sources are read at once (a barrier test fails if they are read in sequence) and two failures name the advertisement failure first.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_lane_host_pool_snapshot_effect/test_pool_snapshot_handler.py tests/nodes/node_lane_host_pool_snapshot_effect/test_pool_snapshot_sources.py -q --no-cov
      -n 0 -p no:randomly
    cwd: .
- id: dod-omn23748-ac3
  description: The typed failed event path of the runtime tests passes; the existence of the topic on the dev broker is read in the pull request's Lab comment.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_lane_host_pool_snapshot_effect/test_pool_snapshot_runtime.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn23748-ac4
  description: The unit's tick on h051 installed from the branch and its snapshot event and row are read in the pull request's Lab comment.
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_lane_host_pool_snapshot_effect/test_pool_snapshot_runtime.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn23748-integration-proof
  description: Run this pull request's own checks on a lab host at the pushed head. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check; the unit's tick on the lab host is read in the pull request's Lab comment.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23748 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_lane_host_pool_snapshot_effect -q --no-cov -n 0 -p no:randomly
    cwd: .
