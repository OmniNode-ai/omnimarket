schema_version: 1.0.0
ticket_id: OMN-22339
title: Serve the tenant savings and delegations reads from runtime nodes
summary: >
  T18c route group 5. GET /v1/tenants/me/savings and GET /v1/tenants/me/delegations
  each gain a node with its own contract, a contract-declared HTTP mount whose
  prefix equals the route path, and a typed handler. The caller tenant comes from
  an injected identity resolver the hosted edge supplies; with none bound, or with
  no tenant resolved, every request is refused before any projection read. The
  projection reader is a protocol bound by the lane overlay. The recorded-pair
  replay (AC3) runs the T18b pairs (OMN-22158) for the two routes.
  No caller is switched and the onex-api container is untouched.
is_seam_ticket: false
interface_change: true
interfaces_touched: [public_api, protocols]
requirements:
  - id: tenant-delegation-reads-runtime-nodes
    statement: Serve the two tenant delegation reads from runtime nodes through contract-declared HTTP mounts.
    acceptance:
      - id: AC1
        statement: 'AC1: GET /v1/tenants/me/savings and GET /v1/tenants/me/delegations are each answered by the runtime through a contract-declared http_mount, one node contract per route, and the moved onex-api tests for both routes pass under the in-memory and the Redpanda profile -- falsifier: uv run pytest over the new node test directories in both profiles, run on a lab host through lab-run'
      - id: AC2
        statement: 'AC2: both routes refuse a caller with no resolved tenant, and also when no identity resolver is bound, before any projection read, and a resolved tenant reads only its own rows -- falsifier: a pytest case with two seeded tenants that fails unless the unauthenticated and unbound requests are refused with no repository call and each tenant sees none of the other tenant rows'
      - id: AC3
        statement: 'AC3: the T18b fixture subset for these two method-and-path identities replays against the mounted app with no unmasked difference -- falsifier: a pytest replay test that reads the T18b corpus (OMN-22158) for the two identities and fails on any unmasked difference'
evidence_requirements:
  - kind: tests
    description: Moved route tests, the AC2 refusal cases and the real runtime mount in both transport profiles.
    command: uv run --frozen pytest tests/nodes/node_tenant_savings_read_effect tests/nodes/node_tenant_delegations_read_effect -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: tenant-reads-in-memory
    description: >
      The moved route assertions (v1 shapes, data states, 503 taxonomy, bounded
      limit, uuid and text tenant binding at every query site, savings-absent
      fallback) run against the app each contract's mount factory builds, and the
      runtime's real listener serves both mounts on the in-memory profile. The
      corpus replay files run with the rest.
    source: manual
    binds_ac: [AC1]
    checks:
      - check_type: test_passes
        check_value: >-
          uv run --frozen pytest tests/nodes/node_tenant_savings_read_effect tests/nodes/node_tenant_delegations_read_effect -q --no-cov --refuse-skips
        cwd: .
  - id: tenant-reads-redpanda
    description: >
      The same runtime listener test runs beside an isolated, auth-required
      Redpanda broker started through the existing harness, with the canonical
      Kafka event bus adapter live. The reads publish nothing; this profile
      proves the mounts serve with the real bus adapter bound.
    source: manual
    binds_ac: [AC1]
    checks:
      - check_type: test_passes
        check_value: >-
          env ONEX_TENANT_READ_TEST_PROFILE=redpanda uv run --frozen pytest tests/nodes/node_tenant_savings_read_effect/test_http_runtime_profiles.py tests/nodes/node_tenant_delegations_read_effect/test_http_runtime_profiles.py -q --no-cov --refuse-skips
        cwd: .
  - id: tenant-reads-integration-proof
    description: >
      The pushed head ran both profile legs of the new node tests on a lab host
      through lab-work. Hosted CI cannot reach the lab, so only the local Done
      gate runs this check.
    source: manual
    execution_scope: local_done_gate
    binds_ac: [AC1]
    checks:
      - check_type: command
        check_value: >-
          uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-22339 -- env ONEX_TENANT_READ_TEST_PROFILE=redpanda uv run --frozen pytest tests/nodes/node_tenant_savings_read_effect tests/nodes/node_tenant_delegations_read_effect -q --no-cov
        cwd: .
  - id: tenant-reads-fail-closed
    description: >
      Two seeded tenants: an unresolved caller, an unbound identity resolver and a
      failing resolver are each refused with no repository call; each tenant reads
      only its own rows; a tenant named in the query or a header is ignored.
    source: manual
    binds_ac: [AC2]
    checks:
      - check_type: test_passes
        check_value: >-
          uv run --frozen pytest tests/nodes/node_tenant_savings_read_effect/test_fail_closed.py tests/nodes/node_tenant_delegations_read_effect/test_fail_closed.py -q --no-cov --refuse-skips
        cwd: .
  - id: t18b-replay
    description: >
      AC3: the recorded T18b pairs (OMN-22158) for GET /v1/tenants/me/savings and
      GET /v1/tenants/me/delegations replay against the mounted app of each node
      with no unmasked difference. The two pairs travel in
      tests/fixtures/t18b_tenant_reads, so the replay runs on every CI run; it fails
      on zero pairs and on a recorded value the handler does not reproduce.
    source: manual
    binds_ac: [AC3]
    checks:
      - check_type: test_passes
        check_value: >-
          uv run --frozen pytest tests/nodes/node_tenant_savings_read_effect/test_t18b_replay.py tests/nodes/node_tenant_delegations_read_effect/test_t18b_replay.py -q --no-cov --refuse-skips
        cwd: .
  - id: deploy-probe
    description: >
      Hosted smoke check: the real runtime listener discovers the contracts,
      serves both mounts and refuses callers the identity resolver does not
      resolve. This process-local smoke is not a deployed-dev or cutover claim.
    source: manual
    checks:
      - check_type: test_passes
        check_value: >-
          uv run --frozen pytest tests/nodes/node_tenant_delegations_read_effect/test_http_runtime_profiles.py -q --no-cov --refuse-skips
        cwd: .
  - id: tenant-reads-published-source-probe
    description: >
      Hosted deploy check of the published source artifact at this checkout's
      exact commit. Each served contract must declare its GET mount and each
      served handler must define its class. It checks the published artifact and
      does not attest a running deployment.
    source: manual
    binds_ac: [AC1]
    checks:
      - check_type: command
        check_value: |-
          set -euo pipefail;
          probe_dir=$(mktemp -d);
          trap 'rm -rf "$probe_dir"' EXIT;
          root="https://raw.githubusercontent.com/OmniNode-ai/omnimarket/$(git rev-parse HEAD)/src/omnimarket/nodes";
          curl --fail --silent --show-error --location --max-time 30 "$root/node_tenant_savings_read_effect/contract.yaml" --output "$probe_dir/savings.yaml";
          curl --fail --silent --show-error --location --max-time 30 "$root/node_tenant_delegations_read_effect/contract.yaml" --output "$probe_dir/delegations.yaml";
          curl --fail --silent --show-error --location --max-time 30 "$root/node_tenant_savings_read_effect/handlers/handler_tenant_savings_read.py" --output "$probe_dir/savings.py";
          curl --fail --silent --show-error --location --max-time 30 "$root/node_tenant_delegations_read_effect/handlers/handler_tenant_delegations_read.py" --output "$probe_dir/delegations.py";
          grep -q 'path_prefix: "/v1/tenants/me/savings"' "$probe_dir/savings.yaml";
          grep -q 'path_prefix: "/v1/tenants/me/delegations"' "$probe_dir/delegations.yaml";
          grep -q '^class HandlerTenantSavingsRead' "$probe_dir/savings.py";
          grep -q '^class HandlerTenantDelegationsRead' "$probe_dir/delegations.py"
        cwd: .
