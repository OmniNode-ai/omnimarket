schema_version: 1.0.0
ticket_id: OMN-23046
title: "Tessl pilot slice 2 of 6: the real findings on pull requests numbered 2 mod 6 are fixed, each with a test that fails on the base"
summary: Real Tessl Reviewer findings left on omnimarket pull requests numbered 2 mod 6 (5240, 5252, 5258, 5270, 5288, 5294, 5312, 5318, 5324, 5330, 5336, 5342, 5348, 5354) are fixed on the landing branch with tests that fail on dev and pass on this branch, because every one of those pull requests had already merged. Findings already fixed on dev, judged too large for this change or pre-existing are listed with their reason; the two false Criticals named in the ticket are untouched.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23046-slice2
  statement: Each real finding on the pull requests numbered 2 mod 6 is fixed with a test that fails on the base and passes on the fix.
  acceptance:
  - id: AC1
    statement: "AC1: each real finding on the pull requests numbered 2 mod 6 is fixed on that pull request's existing branch with a test that fails on the base and passes on the fix -- falsifier: uv run pytest of each added test, red on the base commit first"
  - id: AC2
    statement: "AC2: the false findings and the two false Criticals are untouched and each skipped finding is listed with its reason in the lane report -- falsifier: the lane report's skipped-findings table, one row per skipped finding"
