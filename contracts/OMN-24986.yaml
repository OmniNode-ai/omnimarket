schema_version: 1.0.0
ticket_id: OMN-24986
title: 'Review findings 1 to 9 on omnimarket PR 6326 at head 2a44175209ba are fixed or argued: the PR no longer closes OMN-24831, every contract check names explicit test ids, the consumer scan reads every consumer, and the Lab comment is at the new head'
summary: 'Answers the nine findings of the review of omnimarket#6326 at head 2a44175209ba: the pull request is retitled to this ticket and contracts/OMN-24831.yaml keeps its AC2 as unmet and the title and body close only this ticket, so the diagnostic change closes no ticket whose root cause it does not fix; the contract checks name explicit node ids and pin the pull request head, the consumer scan reads the layer-2 test file and every workflow, and the guard and verdict tests are strengthened. The lab runs, the red and green ids, the required contexts and the arguments are read from the pull request comment, not from hosted CI.'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24986-review-findings-6326
  statement: The review findings on the nightly runner change at head 2a44175209ba are fixed or argued with evidence, with a test red then green for each.
  acceptance:
  - id: AC2
    statement: 'AC2: finding 1 is answered: the PR title names the diagnostic ticket and carries no closing link to OMN-24831, and contracts/OMN-24831.yaml keeps its AC2 as unmet or the contract is dropped -- falsifier: `onex scm pr-view OmniNode-ai/omnimarket#6326` shows a title starting `OMN-24831:` or a body line that closes OMN-24831, or `uv run pytest tests/delegation_golden -m "not e2e" -q -p no:cacheprovider` exits non-zero at the new head'
  - id: AC3
    statement: 'AC3: finding 2 is answered: each check in contracts OMN-24831, OMN-24851, OMN-24902 and OMN-24925 names one explicit pytest node id per test, so a missing id exits 4, and no check uses a `-k "A or B"` expression -- falsifier: `grep -n -- ''-k "'' contracts/OMN-24831.yaml contracts/OMN-24851.yaml contracts/OMN-24902.yaml contracts/OMN-24925.yaml` still matches a pytest check, or a check exits 0 with one of its named tests removed'
  - id: AC4
    statement: 'AC4: finding 3 is answered: the consumer scan in tests/delegation_golden/test_runner_unterminalised_row_omn24831.py reads test_layer2_live_runner.py and every `.github/workflows/*.yml`, and fails when a consumer matches the old failure line -- falsifier: `uv run pytest tests/delegation_golden/test_runner_unterminalised_row_omn24831.py -q -p no:cacheprovider` passes with a match to the old failure line left in test_layer2_live_runner.py'
  - id: AC6
    statement: 'AC6: finding 5 is answered: the lab-check contracts match the command, `exit 0` and the required contexts, not only the sha, and pin the PR head instead of `git rev-parse HEAD` -- falsifier: `grep -n ''git rev-parse HEAD'' contracts/OMN-24831.yaml contracts/OMN-24851.yaml contracts/OMN-24902.yaml contracts/OMN-24925.yaml` still matches a Done-gate check'
  - id: AC7
    statement: 'AC7: findings 7 and 8 are answered: U1 fails when it returns before the guard line, and the verdict test drives both the list and the verdict through `_result_from_row` -- falsifier: `uv run pytest tests/delegation_golden/test_runner_unterminalised_row_omn24831.py -q -p no:cacheprovider` passes with U1 returning before runner.py line 717 or with the verdict taken from a literal list'
  - id: AC8
    statement: 'AC8: finding 9 is answered or argued in a PR comment: origin/HEAD is shown to resolve to dev and the skip regex also matches `importorskip` and a bare `mark.skip` -- falsifier: `uv run pytest tests/delegation_golden -m "not e2e" -q -p no:cacheprovider` passes while a test using `pytest.importorskip` or a bare `mark.skip` is added to tests/delegation_golden'
evidence_requirements:
- kind: tests
  description: The runner tests of the change and the golden layer tests beside them.
  command: env -u PYTHONPATH uv run --frozen pytest tests/delegation_golden -q --no-cov -n 0 -p no:randomly -m "not e2e"
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24986-ac1-lab-comment-and-checks
  description: 'The pull request head is read from the watcher state, and a comment line starting `Lab: head=` carries that full sha, a `command=` and `exit=0` and a `contexts=` field; `onex scm pr-checks` reads the same head with no red and no pending context. A lane cannot read comments, so only the local Done gate runs it.'
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: 'bash -c ''h="$(python3 "$OMNI_PLUGIN_ROOT/skills/merge-drain/scripts/pr_state_local.py" --pr OmniNode-ai/omnimarket#6326 --json | sed -n "/^{/,\$p" | jq -r .facts.head_sha)"; [ "${#h}" = 40 ] && gh pr view 6326 -R OmniNode-ai/omnimarket --json comments --jq ".comments[].body" | grep -E "^Lab: head=$h .*command=.*pytest tests/delegation_golden( |$).* exit=0 .*contexts=[^ =,]+=success(,[^ =,]+=success)*( |$)" | grep -q . && onex scm pr-checks OmniNode-ai/omnimarket#6326 | jq -e --arg h "$h" ".result.head_sha == \$h and (.result.red | arrays | length) == 0 and (.result.pending | arrays | length) == 0"'''
    cwd: .
- id: dod-omn24986-ac2-contract-keeps-ac2-unmet
  description: contracts/OMN-24831.yaml keeps an item for its AC2 that is local, unbound and fails until a merged pull request of the repository that owns the cause names that ticket, so the ticket's Done gate cannot pass on this diagnostic change; the pull request title and body (read by the local item below) close no such ticket. A hosted test reads the item, and the delegation golden suite passes.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: command
    check_value: grep -n dod-omn24831-ac2-fix-at-the-source contracts/OMN-24831.yaml
    cwd: .
  - check_type: test_passes
    check_value: uv run pytest tests/delegation_golden/test_runner_unterminalised_row_omn24831.py::TestContractTextAnswersTheReview::test_the_nightly_ticket_contract_keeps_its_ac2_unmet -q --no-cov -n 0 -p no:randomly -p no:cacheprovider
    cwd: .
  - check_type: test_passes
    check_value: uv run pytest tests/delegation_golden -q --no-cov -n 0 -p no:randomly -p no:cacheprovider -m "not e2e"
    cwd: .
- id: dod-omn24986-ac2-title-and-body
  description: The live title and body of the pull request, read from the watcher state, name no OMN-24831 (no closing link). Only the local Done gate reads the watcher.
