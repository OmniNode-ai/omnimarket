schema_version: "1.0.0"
ticket_id: OMN-24463
title: "The signed dev rebuild command can be sent from a lab host while the dev runtime is down"
summary: "node_branch_deploy_command_effect signs the deploy agent's rebuild command and publishes it, but it ran only inside the dev runtime, so when the runtime was down from 15:05Z on 2026-11-14 no signed rebuild could be sent. Its overlay model now accepts an optional event_bus key (type kafka, a lane id) and the node has its own entry, python -m omnimarket.nodes.node_branch_deploy_command_effect --input <json>, which hosts the handler in the caller's process, dials the broker the overlay's event_bus names (resolve_dialable_broker) and publishes the signed command to the deploy agent's topic. A missing signing key is refused (exit 1), a publish error is failed (exit 1), an overlay with no event_bus or an unusable lane is indeterminate (exit 3). The overlays repository declares the event_bus key and the broker rows for the lab host logins that send it."
is_seam_ticket: true
interface_change: true
interfaces_touched:
  - public_api
requirements:
  - id: req-omn24463-send-from-outside-runtime
    statement: The signed dev rebuild command is sent from a lab host login on the bus the node's overlay names, with no runtime involved.
    acceptance:
      - id: AC2
        statement: 'AC2: the branch deploy command node reads its bus from an event_bus key on its overlay and the overlay model accepts it, with a golden and an error chain test -- falsifier: pytest tests/nodes/node_branch_deploy_command_effect -q in omnimarket'
      - id: AC3
        statement: 'AC3: the signed rebuild command is sent from a lab host login with the dev runtime stopped, and a seam test fails when the command topic, the overlay key or the broker row changes shape -- falsifier: pytest tests/nodes/node_branch_deploy_command_effect/test_send_from_outside_runtime.py -q in omnimarket'
evidence_requirements:
  - kind: tests
    description: The sender tests and the node's existing tests pass at the pushed head; the sender tests fail on the merge base because the node has no entry and its overlay model refuses the event_bus key.
    command: uv run pytest tests/nodes/node_branch_deploy_command_effect -q -p no:randomly --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn24463-ac2
    description: 'AC2: the overlay model accepts event_bus and refuses a malformed one; the example overlay carries it'
    source: manual
    binds_ac:
      - AC2
    checks:
      - check_type: command
        check_value: uv run pytest tests/nodes/node_branch_deploy_command_effect -q -p no:randomly --no-cov -k "overlay or seam"
        cwd: .
  - id: dod-omn24463-ac3
    description: 'AC3: the sender entry publishes the signed command with no runtime, and refuses and fails by name in the error chain'
    source: manual
    binds_ac:
      - AC3
    checks:
      - check_type: command
        check_value: uv run pytest tests/nodes/node_branch_deploy_command_effect/test_send_from_outside_runtime.py -q -p no:randomly --no-cov
        cwd: .
  - id: dod-omn24463-integration-proof
    description: 'the sender tests run on a lab host at the pushed head; hosted CI cannot reach the lab, so only the local Done gate runs this unbound check. The send to the running deploy agent (AC5 of the ticket) is read after the broker rows are applied and is named in the pull request, not run here, because it publishes a real rebuild command.'
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24463 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_branch_deploy_command_effect/test_send_from_outside_runtime.py tests/nodes/node_branch_deploy_command_effect/test_send_seams_omn19998.py -q --no-cov -p no:randomly
