schema_version: 1.0.0
ticket_id: OMN-24561
title: Review fixes for lab access to the idle platform work steps
summary: The caller derivation of node_broker_acl_overlay_render_compute refuses a called node whose terminal topic is not an event topic, the topic coverage check judges only declared topic uses, and the run-node seam test runs its comparison for real (omnimarket); onex run-node refuses at once, typed, a node no runtime consumer serves (omnibase_core).
is_seam_ticket: true
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24561-review-fixes
  statement: A caller of a node is never granted a read on a topic that is not an event topic, the coverage check ignores undeclared uses, and the run-node seam test fails on a drifted or refused sender.
  acceptance:
  - id: AC1
    statement: 'AC1: a caller derivation refuses a called node whose terminal topic is not an event topic and names it -- falsifier: uv run pytest tests/nodes/node_broker_acl_overlay_render_compute/test_derive_callers.py -q'
  - id: AC2
    statement: 'AC2: the run-node seam test runs its comparison for real, fails when a sender topic drifts and fails on a sender error -- falsifier: uv run pytest tests/nodes/node_broker_acl_overlay_render_compute/test_seam_run_node_topics.py -q'
  - id: AC3
    statement: 'AC3: the topic coverage check ignores a topic use that is not declared -- falsifier: uv run pytest tests/nodes/node_broker_acl_overlay_render_compute/test_coverage_gate.py -q'
  - id: AC4
    statement: 'AC4: integrated: from a lab host with the deployed dispatch environment, onex run-node for each of the first 40 called deferred nodes answers or refuses typed in under 5 s, read in the running dev runtime -- falsifier: onex run-node <node> --input ''{}'' prints an answer or a typed refusal after more than 5 s or a timeout'
evidence_requirements:
- kind: tests
  description: The derivation, coverage and seam tests pass at the pushed head.
  command: uv run --frozen pytest tests/nodes/node_broker_acl_overlay_render_compute -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24561-ac1
  description: 'Error chain: a terminal_event that is a command or snapshot topic refuses with called_node_terminal_not_an_event_topic and derives nothing. Failing control: the same node under an event terminal still derives.'
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_broker_acl_overlay_render_compute/test_derive_callers.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24561-ac2
  description: 'Seam: the comparison runs through one helper for the real sender and for the controls; a drifted sender topic and a sender refusal are each reported, and a sender failure is never skipped.'
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_broker_acl_overlay_render_compute/test_seam_run_node_topics.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24561-ac3
  description: 'Golden and failing control: an undeclared use with no covering row is covered; the same use declared refuses.'
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_broker_acl_overlay_render_compute/test_coverage_gate.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24561-ac4
  description: The tests behind the integrated reading pass; the 40 nodes' answers or typed refusals on the dev runtime are recorded in the Lab comment of this pull request and the lane report.
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_broker_acl_overlay_render_compute -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24561-integration-proof
  description: Run the derivation, coverage and seam tests on a lab host at the pushed head. Hosted CI cannot reach the lab hosts, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24561 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_broker_acl_overlay_render_compute -q --no-cov -n 0 -p no:randomly
