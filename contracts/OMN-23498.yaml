schema_version: 1.0.0
ticket_id: OMN-23498
title: Turn off the automatic version-moving jobs and the merge notice for omnimarket
summary: The sibling pin train has no schedule trigger and the omniclaude pin bump has no repository_dispatch trigger (both keep workflow_dispatch), and the merge-triggered omniclaude pin notice is gone from the runtime rebuild trigger workflow. RULING 2026-11-09T21:54:25Z lane=orchestrator-31d9 (OMN-18594). This contract binds the tests that fail if a trigger is restored, so dod-verify can judge the pull request that turns the jobs off.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23498-train-no-schedule
  statement: The sibling pin train workflow runs by workflow_dispatch only, with its dry_run input, and cites the ruling above its trigger block; a restored schedule is flagged.
  acceptance:
  - id: AC1
    statement: 'AC1: the daily timer trigger of the sibling pin train workflow is gone and only the by-hand trigger remains -- falsifier: a test that restores a schedule trigger passes'
- id: req-omn23498-bump-no-dispatch
  statement: The omniclaude pin bump workflow has no repository_dispatch trigger, keeps workflow_dispatch with a version input, and cites the ruling above its trigger block.
  acceptance:
  - id: AC2
    statement: 'AC2: the omniclaude pin bump workflow no longer starts on the omniclaude release announcement and keeps its by-hand trigger with a version input -- falsifier: test_workflow_receives_notice_flags_a_restored_repository_dispatch passes with the trigger restored'
- id: req-omn23498-notice-removed
  statement: The runtime rebuild trigger workflow carries no merge-triggered omniclaude pin notice step and the CI summary gate no longer expects it.
  acceptance:
  - id: AC3
    statement: 'AC3: the merge-triggered omniclaude pin notice is removed from the runtime rebuild trigger workflow -- falsifier: the workflow still carries the notice step'
- id: req-omn23498-integrated
  statement: After the merge no scheduled or repository_dispatch run of the two jobs starts, and a by-hand dispatch still starts one.
  acceptance:
  - id: AC4
    statement: 'AC4: integrated: in the running dev runtime and on the repository''s scheduler, no sibling pin train or omniclaude pin bump run starts by itself after the merge, and a by-hand dispatch still starts one -- falsifier: a run with event schedule or repository_dispatch appears after the merge'
evidence_requirements:
- kind: tests
  description: The new and changed workflow-trigger tests pass at the head; the new ones are absent at the merge base.
  command: uv run --frozen pytest tests/ci/test_sibling_pin_train_schedule_off_omn23498.py tests/ci/test_omniclaude_release_notice_omn20001.py -q --no-cov -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23498-train-no-schedule
  description: Runs the new sibling pin train trigger test file (live workflow has only workflow_dispatch with dry_run, a restored schedule is flagged, the ruling is cited above the trigger block). The file is absent at the merge base, so the command fails there.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/ci/test_sibling_pin_train_schedule_off_omn23498.py -q --no-cov -p no:randomly
    cwd: .
- id: dod-omn23498-bump-no-dispatch
  description: Runs the three workflow_receives_notice tests that are new in this pull request (a restored repository_dispatch is flagged, a missing workflow_dispatch is flagged, the ruling is cited above the trigger block). They are absent at the merge base, so no test is selected there and the command fails.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/ci/test_omniclaude_release_notice_omn20001.py -q --no-cov -p no:randomly -k "restored_repository_dispatch or missing_workflow_dispatch or cites_the_ruling"
    cwd: .
- id: dod-omn23498-notice-removed
  description: Runs the pin-follows-dev test that is new in this pull request (a dev merge no longer sends the pin refresh to omniclaude; the notify job and its dispatch are absent from the runtime rebuild trigger workflow). It is absent at the merge base, so no test is selected there and the command fails.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/ci/test_omniclaude_pin_follows_dev_omn19998.py -q --no-cov -p no:randomly -k "no_longer_dispatches"
    cwd: .
- id: dod-omn23498-integration-proof
  description: Reads the live workflow files at the checked-out head for the two removed triggers and the kept dispatch trigger. The post-merge reading (no scheduled or repository_dispatch run after the merge) is taken from the repository's run list on the first day after the merge and posted on the ticket. Hosted CI cannot read that run list, so only the local Done gate runs this unbound item.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: 'env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/ci/test_sibling_pin_train_schedule_off_omn23498.py tests/ci/test_omniclaude_release_notice_omn20001.py -q --no-cov -p no:randomly -k "live_workflow or cites_the_ruling"'
    cwd: .
