schema_version: 1.0.0
ticket_id: OMN-22661
title: Piece 2 hosts and capacity, an hourly host-canary probe reads every pooled host's typed canary ending and free disk
summary: The reading writer read piece 2 UNKNOWN every hour because no producer existed. node_host_reading_effect gains a host-canary probe that sends one canary lane to every host the lab host table pools, through the route lanes take, and reads its typed ending, the slots the pool read gave and the host's free disk against the overlay floor. One STATUS row per run; WORKING only when every pooled host ended typed (a typed busy refusal counts) over the floor. A canary cut at its deadline or a host the pool read could not reach is a failed host, never free capacity.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn22661-golden
  statement: A host-canary run reads every pooled host and publishes its golden chain under one correlation id.
  acceptance:
  - id: AC1
    statement: 'AC1: golden chain event test: a host-canary run publishes requested, host-reading-written WORKING and run-completed under one correlation id with every pooled host read -- falsifier: uv run pytest tests/unit/nodes/node_host_reading_effect/test_probe_host_canary.py -q'
- id: req-omn22661-error
  statement: A killed wrapper and a bad command give typed failures.
  acceptance:
  - id: AC2
    statement: 'AC2: error chain event test: a killed wrapper with no typed line gives a NOT_WORKING row naming the host and the reason canary-untyped, and a bad command payload gives run-failed -- falsifier: uv run pytest tests/unit/nodes/node_host_reading_effect/test_probe_host_canary.py -q'
- id: req-omn22661-breaks
  statement: Each named break reads NOT_WORKING or UNKNOWN, never WORKING.
  acceptance:
  - id: AC3
    statement: 'AC3: a stale advertisement, a missing advertisement, a canary cut at its deadline and a disk under the floor each read NOT_WORKING, and an unreadable host table reads UNKNOWN -- falsifier: uv run pytest tests/unit/nodes/node_host_reading_effect/test_probe_host_canary.py -q'
- id: req-omn22661-lab
  statement: The probe runs from the branch on the lab against the real pool, and its failing control reads NOT_WORKING.
  acceptance:
  - id: AC4
    statement: 'AC4: on the lab, a probe run from the branch over the real pool reads every pooled host, and the same run with the wrapper replaced by one that kills itself reads NOT_WORKING -- falsifier: python -m omnimarket.nodes.node_host_reading_effect probe --only host-canary'
evidence_requirements:
- kind: tests
  description: The canary suite and the existing host reading suites
  command: uv run --frozen pytest tests/unit/nodes/node_host_reading_effect tests/nodes/node_host_reading_effect -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn22661-canary-suite
  description: Golden and error chain event tests of the host canary on the in-memory and the real subprocess backends, with each named break.
  source: manual
  binds_ac:
  - AC1
  - AC2
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/nodes/node_host_reading_effect/test_probe_host_canary.py -q --no-cov
    cwd: .
- id: dod-omn22661-integration-proof
  description: Run this pull request's own check on a lab host at the pushed head. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  binds_ac:
  - AC4
  checks:
