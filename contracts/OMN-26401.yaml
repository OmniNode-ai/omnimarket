---
schema_version: "1.0.0"
ticket_id: OMN-26401
title: "The stage gate reads the published nightly attribution records through the repository gateway node and recomputes the clean-night count from them, replacing the in-memory stub"
summary: "The selector node gains HandlerAttributionRecordRead (operation read_attribution_records) and the adapter SourceAttributionRecordsGateway, which implements the stage gate's record source over the repository gateway node's commit_check_runs: for each night a receipt names it reads the check run nightly-attribution:<slot date> on the tested head commit the receipt names, parses its summary as the published record, and returns the records it trusts and the nights it refuses (unparseable, duplicate, bound to another commit, repository, slot or run). commit_check_runs gains an optional output summary behind the request flag include_output, off by default and absent from the wire when unset. A receipt night names its tested head commit. The stage gate's CI test reads the tree through the adapter; the in-memory twin stays as the test double. The pull request is merged and runs on dev before the 02:30 UTC nightly of 2026-11-22; that is read from the dev tag after merge and is not bound to a hosted check here."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn26401-attribution-source
    statement: "The stage gate recomputes its clean-night count from the nightly attribution records read through the repository gateway node, and a missing, unparseable, duplicate or mismatched record is a typed absence, never a clean night."
    acceptance:
      - id: AC1
        statement: "AC1: with the adapter wired, a fixture tree at selection_stage 1 with a valid receipt and seven complete clean published records passes, and the same tree with one night's check run absent fails with record_missing -- falsifier: uv run pytest tests/ci/test_selection_stage_evidence.py -q --no-cov -k attribution_source; this test must fail at the merge base (the in-memory twin cannot read a check run)"
      - id: AC2
        statement: "AC2: the clean-night count the adapter yields is recomputed from the parsed records, so a record with status incomplete, a miss, an unattributable file, or no pull request record is not counted and a receipt claiming it fails with night_not_clean -- falsifier: uv run pytest tests/nodes/node_test_selection_selector_compute -q --no-cov -k adapter_clean_night"
      - id: AC3
        statement: "AC3: an unparseable summary or two records for one slot is a typed absence (record_mismatch or duplicate), and a gateway that cannot be reached keeps the records_unavailable fallback -- falsifier: uv run pytest tests/nodes/node_test_selection_selector_compute -q --no-cov -k adapter_absence"
      - id: AC4
        statement: "AC4: the adapter reads only through the gateway node operation and the contract.yaml handler_routing entry names it, with no gh call and no new script -- falsifier: uv run pytest tests/ci -q --no-cov -k contract_binding"
      - id: AC5
        statement: "AC5: the pull request is merged and the adapter runs on dev before 2026-11-22T02:30Z -- falsifier: uv run pytest tests/ci/test_selection_stage_evidence.py -q --no-cov plus the dev tag readback in the pull request body"
evidence_requirements:
  - kind: tests
    description: "The stage gate tests and the selector node tests pass at the pushed head."
    command: "uv run --frozen pytest tests/ci/test_selection_stage_evidence.py tests/nodes/node_test_selection_selector_compute -q --no-cov -n 0 -p no:randomly"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-omn26401-ac1
    description: "AC1: a tree at stage 1 with a valid receipt and seven complete clean records published as check runs passes through the gateway adapter, the same tree with one night's check run absent fails with record_missing, and an unreachable gateway fails with records_unavailable."
    source: manual
    binds_ac: [AC1]
    checks:
      - check_type: test_passes
        check_value: >-
          uv run --frozen pytest tests/ci/test_selection_stage_evidence.py -q --no-cov -n 0 -p no:randomly -k attribution_source
        cwd: .
  - id: dod-omn26401-ac2
    description: "AC2: a record with status incomplete, a miss, an unattributable file or no pull request record is not counted, and the receipt's own claim of seven clean nights fails with night_not_clean and figure_mismatch."
    source: manual
    binds_ac: [AC2]
    checks:
      - check_type: test_passes
        check_value: >-
          uv run --frozen pytest tests/nodes/node_test_selection_selector_compute -q --no-cov -n 0 -p no:randomly -k adapter_clean_night
        cwd: .
  - id: dod-omn26401-ac3
    description: "AC3: an unparseable or field-extended summary, a missing summary, a running check run, a record for another commit, repository or run is record_mismatch; two check runs for one slot is duplicate_record; a gateway that gives no answer is records_unavailable."
    source: manual
    binds_ac: [AC3]
    checks:
      - check_type: test_passes
        check_value: >-
          uv run --frozen pytest tests/nodes/node_test_selection_selector_compute -q --no-cov -n 0 -p no:randomly -k adapter_absence
        cwd: .
  - id: dod-omn26401-ac4
    description: "AC4: contract.yaml's handler_routing names read_attribution_records and its handler; the files that read the records name only the commit_check_runs operation and no process, network client or gh; no script names the adapter."
    source: manual
    binds_ac: [AC4]
    checks:
      - check_type: test_passes
        check_value: >-
          uv run --frozen pytest tests/ci -q --no-cov -n 0 -p no:randomly -k contract_binding_names_the_handler_route
        cwd: .
  - id: dod-omn26401-deploy-contract
    description: "AC5, the part a hosted runner can run: the stage gate test passes over the real tree through the gateway adapter, which reads nothing at stage 0 and refuses a missing or unreadable record above it. That the merged revision runs on dev is read from the dev tag after the merge, which no hosted job can read."
    source: manual
    binds_ac: [AC5]
    checks:
      - check_type: test_passes
        check_value: >-
          uv run --frozen pytest tests/ci/test_selection_stage_evidence.py -q --no-cov -n 0 -p no:randomly
        cwd: .
  - id: dod-omn26401-integration-proof
    description: "Local Done gate only, so it binds no criterion here: the stage gate tests and the node's directory run on a lab host at the pushed head, and AC5 is read from the dev tag after the merge."
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: >-
          onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-26401 --kind test -- uv run --frozen pytest tests/ci/test_selection_stage_evidence.py tests/nodes/node_test_selection_selector_compute -q --no-cov
        cwd: .
