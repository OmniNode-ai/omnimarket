---
schema_version: "1.0.0"
ticket_id: "OMN-21694"
title: "omnimarket contracts_and_di literal_path burn-down, slice rf1145-c4"
summary: "A slice of the literal_path findings of the contracts_and_di check over omnimarket: the scratch directory of the OMN-20032 benchmark scripts, the runtime repository path of the runtime SHA verifier, the Codex home of the hook registration and the standards directories of the filesystem crawler no longer sit in code as path literals. Each is a required parameter or setting bound by the caller, with no default held in the code, no baseline entry and no suppression."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-omn21694-literal-path-slice"
    statement: |-
      A filesystem location is resolved from a setting the caller injects. The touched modules hold no absolute or home-relative path literal, and a missing setting is refused with a message naming it.
    acceptance:
      - id: "AC1"
        statement: "AC1: the contracts_and_di count for literal_path over the slice paths drops to zero and the repo total drops by the slice size, with no baseline entry or suppression added -- falsifier: onex run of runtime_validator_run with the contracts_and_di reference over omnimarket src before and after, counts compared per rule"
      - id: "AC2"
        statement: "AC2: every moved value is taken through an injected parameter bound from the node contract or overlay and none remains hard-coded in the touched code -- falsifier: uv run pytest tests/unit -q over the touched modules plus the checker re-run on the slice paths"
      - id: "AC3"
        statement: "AC3: the slice lands as one PR titled with this ticket id and carries lab proof of the tests and the checker re-run -- falsifier: uv run pytest tests/unit -q on the lab through lab-run at the PR head, receipt path in the PR body"
evidence_requirements:
  - kind: "tests"
    description: "The slice tests fail on the code that held the literals and pass on the change."
    command: "uv run pytest tests/unit/test_literal_path_slice_omn21694.py -q --no-cov"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn21694-slice-tests"
    description: "The slice tests pass: no path literal in the touched modules, each setting refused when missing."
    source: "manual"
    binds_ac: ["AC2", "AC3"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/test_literal_path_slice_omn21694.py -q --no-cov"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn21694-checker-rerun"
    description: "The contracts_and_di check over the slice paths reports no literal_path finding."
    source: "manual"
    binds_ac: ["AC1"]
    checks:
      - check_type: "command"
        check_value: "uv run python -m omnibase_core.nodes.node_validation_report_write_effect.runtime_validator_run omnibase_core.validation.validator_contracts_and_di:ValidatorContractsAndDi benchmarks/delegation_false_pass_growth src/omnimarket/nodes/node_dod_verify/handlers/handler_runtime_sha_verify.py src/omnimarket/nodes/node_codex_hook_registration_effect/handlers/handler_codex_hook_registration.py src/omnimarket/nodes/node_filesystem_crawler_effect | grep -c literal_path | grep -qx 0"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn21694-deploy-published-source-readback"
    description: |-
      Hosted-runner source-artifact readback: fetch the changed runtime SHA verifier at the
      evaluated published commit and refuse it if it still holds the repository path default.
      No lab service, credentials or broker is required; this checks the published source
      artifact and does not assert a live runtime rollout.
    source: "manual"
    binds_ac: ["AC2"]
    checks:
      - check_type: "command"
        check_value: |-
          curl --fail --silent --show-error --location --max-time 15 "https://raw.githubusercontent.com/OmniNode-ai/omnimarket/$(git rev-parse HEAD)/src/omnimarket/nodes/node_dod_verify/handlers/handler_runtime_sha_verify.py" | python3 -c '
          import sys
          source = sys.stdin.read()
          assert "runtime_repo_path" in source, "verifier source not read"
          assert "/opt/" not in source, "the runtime repository path default is still in the verifier"
          print("Published verifier readback: no path default PASS")
          '
        cwd: "."
