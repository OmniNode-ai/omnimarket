schema_version: 1.0.0
ticket_id: OMN-26583
title: A command-line and an MCP client let any agent platform send and read agent messages, proven between a Claude lane and a Codex session
summary: The node_agent_message_client_effect node provides onex agent-message send and read and a stdio MCP server with a send tool and a read tool, both calling the same two handlers; a Claude lane and a Codex session exchange a message through the topic on dev.
is_seam_ticket: false
interface_change: true
interfaces_touched:
- public_api
requirements:
- id: req-omn26583-client
  statement: Any agent platform can send and read agent messages through a command line and an MCP server that call the agent message node.
  acceptance:
  - id: AC1
    statement: 'AC1: onex send and onex read exchange a message through the topic, with typed refusals for a missing recipient or empty text -- falsifier: uv run pytest -m unit on the command tests fails when send or read is removed'
  - id: AC2
    statement: 'AC2: the MCP server lists a send tool and a read tool and each calls the same node as the command line -- falsifier: uv run pytest -m unit on the MCP tool listing fails when either tool is missing'
  - id: AC3
    statement: 'AC3: a Claude lane and a Codex session on a lab host exchange one message through the topic on dev -- falsifier: the end-to-end run on the lab (pytest -m integration through lab-run) exits non-zero when either side receives nothing'
evidence_requirements:
- kind: tests
  description: The agent message client command and MCP tests pass at the pushed head.
  command: uv run pytest tests/cli/test_agent_message_cli.py tests/cli/test_agent_message_mcp.py -q -m unit -n 0 --no-cov -p no:cacheprovider
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn26583-ac1
  description: 'AC1: send and read round trip through a fake node, and each typed refusal (missing recipient, empty text, unknown platform, unknown kind, undeclared broker) exits non-zero with no stack trace.'
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/cli/test_agent_message_cli.py -q -m unit -n 0 --no-cov -p no:cacheprovider
    cwd: .
- id: dod-omn26583-ac2
  description: 'AC2: the MCP server lists exactly send_agent_message and read_agent_messages, and each call reaches the same node the command line reaches.'
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/cli/test_agent_message_mcp.py -q -m unit -n 0 --no-cov -p no:cacheprovider
    cwd: .
- id: dod-omn26583-ac3
  description: 'hosted proxy for AC3: the command and MCP unit tests pass; the lab end-to-end between a Claude lane and a Codex session is recorded in the pull request Lab line and is not met by hosted CI.'
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/cli/test_agent_message_cli.py tests/cli/test_agent_message_mcp.py -q -m unit -n 0 --no-cov -p no:cacheprovider
    cwd: .
- id: dod-omn26583-integration-proof
  description: the agent message client command and MCP unit tests run on a lab host at the pushed head; hosted CI cannot reach the lab, so only the local Done gate runs this unbound check
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-26583 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/cli/test_agent_message_cli.py tests/cli/test_agent_message_mcp.py -q -m unit --no-cov
