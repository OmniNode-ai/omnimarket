    description: "AC1 hosted probe. The reconciled-schema unit tests pass at the head and fail at the merge base."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/delegation/test_delegation_lineage_projection.py -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC1"]
  - id: "dod-omn20287-ac2-harness-backend-key-tolerance"
    description: "AC2 hosted probe. The tolerance tests pass at the head and fail at the merge base, where the backend model refuses the four keys."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/delegation/test_omn20287_harness_backend_key_tolerance.py -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC2"]
  - id: "dod-omn20287-ac5-deployment-fact-gate"
    description: "AC5 hosted probe. The gate tests pass at the head and fail at the merge base, where the node and the markers do not exist."
    source: "manual"
    checks:
      - check_type: "test_passes"
