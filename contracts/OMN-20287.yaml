---
schema_version: "1.0.0"
ticket_id: "OMN-20287"
title: "Delegation run rows carry parent lineage in the projection consumer"
summary: "Consumer half of delegation lineage, reconciled onto the OMN-20606 schema. delegation_events run rows carry parent_correlation_id, lineage_kind and parent_failure_cause (migration 0055_delegation_events_lineage.sql, shipped in omnibase_infra 0.38.67) through the OMN-20606 fold and both writers; this change drops its own attempt_kind column and migration 0055_delegation_events_run_lineage.sql, so the node declares one lineage kind column. AC1 is bound to the unit tests. The dev-202 or stability-test deployed readback is not bound."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-delegation-run-rows-carry-lineage"
    statement: "The delegation projection node declares one cross-run lineage schema: parent_correlation_id, lineage_kind and parent_failure_cause, added only by 0055_delegation_events_lineage.sql; no migration, contract column, SQLite column or terminal field names attempt_kind, and the cross-run lineage_kind values share none with the in-ladder EnumDelegationAttemptKind. The deployed readback on dev-202 or stability-test is not bound here: this repository's hosted check cannot reach it."
    acceptance:
      - id: "AC1"
        statement: "AC1: the node declares only the OMN-20606 lineage columns and a terminal carrying attempt_kind stores no lineage -- falsifier: uv run pytest tests/unit/delegation/test_delegation_lineage_projection.py -q in omnimarket"
  - id: "req-harness-backend-consumer"
    statement: "The delegation backend model reads kind, harness, surface and tenant_scope, and admits a kind: harness backend only when it is internal surface, house tenant, with no endpoint and no secret_ref; the escalation-chain models and resolve_class_escalation_chain resolve a declared chain and give a harness rung a refusal for a pinned-only backend, a non-house tenant or a non-internal surface. No shipped config declares a harness backend, a harness tier or a chain in this change, so a released consumer decodes every shipped payload before any producer emits the new keys."
    acceptance:
      - id: "AC3"
        statement: "AC3: forged harness declarations parse or are refused as stated, and forged chains resolve with the stated refusals -- falsifier: uv run pytest tests/unit/delegation/test_omn20287_harness_backend_model.py tests/unit/delegation/test_harness_escalation_chain_resolver_omn20287.py -q in omnimarket"
  - id: "req-harness-routing-overlay"
    statement: "House routing (harness backends, harness tiers, per-class escalation chains) is read only from the overlay named by DELEGATION_ROUTING_OVERLAY_PATH; the packaged bifrost_delegation.yaml, routing_tiers.yaml and task_class_contracts.v1.yaml declare no harness backend, no harness tier and no chain; an unbound selector resolves an empty overlay and no chain for any class, and a bound selector naming a missing or invalid file fails with ProtocolConfigurationError."
    acceptance:
      - id: "AC4"
        statement: "AC4: the packaged configs ship no harness backend, tier or chain, an unbound selector resolves no chain, and a synthetic overlay resolves its chains with the stated refusals -- falsifier: uv run pytest tests/unit/delegation/test_harness_escalation_chain_omn20287.py tests/unit/delegation/test_omn20287_harness_backend_contract.py -q in omnimarket"
  - id: "req-deployment-fact-gate"
    statement: "The deployment-fact fields of the packaged routing configs (backends, endpoints, model names, secret refs, providers, routing tiers and per-class orders in bifrost_delegation.yaml, routing_tiers.yaml and task_class_contracts.v1.yaml) carry the deployment_fact marker on their typed models, and node_deployment_fact_gate_effect, wired as the deployment-fact-gate pre-commit hook and the Deployment Fact Gate CI job, refuses a non-neutral value in a marked field and an undeclared key that the base revision did not carry, the base revision being the shrink-only baseline."
    acceptance:
      - id: "AC5"
        statement: "AC5: the omnimarket#3624 config additions are refused, the packaged configs pass against themselves, and a removed fact, an extra occurrence, a reordered class ladder or a new vendor backend is refused -- falsifier: uv run pytest tests/unit/nodes/node_deployment_fact_gate_effect/test_deployment_fact_gate_omn20287.py -q in omnimarket"
  - id: "req-glm-allowance-awareness"
    statement: "How much of the GLM Coding Plan's rolling window and weekly period is left is computed by a definition-B node from the recent usage, the cap refusals and a policy the deployment declared in its private overlay (no window, cap, credit rate or approval is packaged), and the claude-glm rung consults it: near a cap the GLM rungs are dropped so the work goes to the next rung, and with allowance unused an approved class prefers GLM over the costlier rungs. A second definition-B node records each harness run as a usage event with its credits and a cap refusal as its own event, both declared on the bus for the liveness projection."
    acceptance:
      - id: "AC6"
        statement: "AC6: given a synthetic policy and usage, node_glm_allowance_compute returns the window and week left, drops every GLM rung near the window cap, the weekly cap, after a provider refusal, for a class the evals did not approve and for code_review under 600 s, and moves GLM ahead of the costlier rungs only while both periods hold the preferred fraction -- falsifier: uv run pytest tests/unit/nodes/node_glm_allowance_compute/test_glm_allowance.py -q in omnimarket"
      - id: "AC7"
        statement: "AC7: node_glm_usage_record_compute turns one harness run into a usage event with its credits (rated, peak or off-peak) and a 429 or a mapped provider code into a refusal event naming the cap and how the run ended, with both topics declared in its contract -- falsifier: uv run pytest tests/unit/nodes/node_glm_usage_record_compute/test_glm_usage_record.py -q in omnimarket"
  - id: "req-code-edit-turn-names-its-delegate-run"
    statement: "A model reply the delegated code edit loop receives without an onex delegate run id is a failed delegate run: its actions are never applied to the worktree, its turn is recorded as not ok with the reason, and two in a row end the loop as delegate_failed, so every applied turn in a loop receipt names the onex delegate run that served it."
    acceptance:
      - id: "AC8"
        statement: "AC8: a reply with model output and an empty run id writes nothing to the worktree, is recorded as a failed turn naming the missing run id, and two in a row end as delegate_failed -- falsifier: uv run pytest tests/nodes/node_delegated_code_edit_orchestrator/test_unreceipted_model_turn.py -q in omnimarket"
  - id: "req-grounding-budget-per-task-class"
    statement: "The routing contract declares the grounded input budget per task class: a backend's max_grounded_input_tokens_by_task_class names a class with its own budget, every other class keeps the backend default, the packaged local backends give code_generation a budget above 20000 tokens with the measured readback (token counts and delegate run ids) in the contract comment, and a research prompt of 18245 tokens above the default is still sent to the next rung."
    acceptance:
      - id: "AC9"
        statement: "AC9: a 20,000 token code_generation turn is sent to the local rung, a summary-class prompt above the default budget still escalates, the budget resolves per task class, and the code-class value cites its readback -- falsifier: uv run pytest tests/unit/delegation/test_grounded_input_budget_per_task_class_omn20486.py -q in omnimarket"
evidence_requirements:
  - kind: "tests"
    description: "AC1 hosted probe. The reconciled-schema unit tests pass at the head and fail at the merge base, where the lineage columns do not exist."
    command: "env -u PYTHONPATH uv run pytest tests/unit/delegation/test_delegation_lineage_projection.py -q"
  - kind: "tests"
    description: "Execute the GLM allowance and usage record node tests."
    command: "uv run pytest tests/unit/nodes/node_glm_allowance_compute/test_glm_allowance.py tests/unit/nodes/node_glm_usage_record_compute/test_glm_usage_record.py -q"
  - kind: "tests"
    description: "Execute the code edit loop run-id tests."
    command: "uv run pytest tests/nodes/node_delegated_code_edit_orchestrator/test_unreceipted_model_turn.py -q"
  - kind: "tests"
    description: "Execute the per-task-class grounded input budget tests."
    command: "uv run pytest tests/unit/delegation/test_grounded_input_budget_per_task_class_omn20486.py -q"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
