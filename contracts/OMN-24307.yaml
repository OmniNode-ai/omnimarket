schema_version: 1.0.0
ticket_id: OMN-24307
title: The floor fill job runs its live profile so its state row is written
summary: The scheduled floor fill job answered "the live profile is not bound in the runtime yet" for every profile but inmemory, so on the dev runtime the fill kept its state in process memory and floor_fill_state held 0 rows. A due tick on profile live now builds the live fill with the table-backed store, takes the store's connection string from the variable the fill overlay names (never from a file), and answers a failed run event that names the variable when it is unset. The store's connection boundary mark and its test come from omnimarket#6065, which merges first.
is_seam_ticket: true
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24307-live-profile
  statement: A due tick on profile live writes the fill's state through the table-backed store, and a missing connection variable is a named failure, never a silent in-memory run.
  acceptance:
  - id: AC1
    statement: 'AC1: a due runtime tick on profile live with the store DSN variable set builds the live fill through the table-backed store and the store holds the answer row of the tick afterwards, a degraded answer that names each unbound seam -- falsifier: uv run --frozen pytest src/omnimarket/nodes/node_floor_fill_scheduled_effect/tests/test_live_profile.py -k live_golden fails on dev today because live is answered "not bound in the runtime yet"'
  - id: AC2
    statement: 'AC2: the same tick with the DSN variable unset returns a failed run event naming UNKNOWN fill-state:store-dsn-unset and the variable name, never its value -- falsifier: uv run --frozen pytest src/omnimarket/nodes/node_floor_fill_scheduled_effect/tests/test_live_profile.py -k dsn_unset fails if the event carries the DSN value or omits the variable name'
  - id: AC3
    statement: 'AC3: the freestanding imperative-IO scan accepts the store''s declared connection boundary and still flags an unmarked connection -- falsifier: uv run --frozen pytest src/omnimarket/nodes/node_floor_fill_orchestrator/tests/test_floor_fill_store_guard_boundary.py fails on dev today with an active finding'
  - id: AC4
    statement: 'AC4: integrated: after a floor fill tick on the dev runtime the floor_fill_state table holds at least one row -- falsifier: psql on dev, select count(*) from public.floor_fill_state, reads 0 today and reads 1 or more after the tick'
evidence_requirements:
- kind: tests
  description: The live profile tests pass at the pushed head.
  command: uv run --frozen pytest src/omnimarket/nodes/node_floor_fill_scheduled_effect/tests/test_live_profile.py -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24307-ac1-live-golden
  description: 'AC1: a due live tick with the DSN variable set runs the live fill on an injected store and the store holds the answer row afterwards (status DEGRADED, the pool, brake and stop-signal seams named unbound: the pool, tickets, brake and stop seams have no live source yet, so a live tick cannot answer OK); on origin/dev source the profile answers "not bound in the runtime yet" and the test fails.'
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest src/omnimarket/nodes/node_floor_fill_scheduled_effect/tests/test_live_profile.py -q --no-cov -n 0 -p no:randomly -k live_golden
    cwd: .
- id: dod-omn24307-ac2-dsn-unset
  description: 'AC2: with the variable unset the run event is failed and its detail is UNKNOWN fill-state:store-dsn-unset:<variable name>; a set value never appears in the event.'
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest src/omnimarket/nodes/node_floor_fill_scheduled_effect/tests/test_live_profile.py -q --no-cov -n 0 -p no:randomly -k "dsn_unset or unreachable or declared_variable"
    cwd: .
- id: dod-omn24307-ac3-boundary
  description: 'AC3: the freestanding imperative-IO scan over this tree has no active finding, so the store connection carries the boundary mark that omnimarket#6065 adds; the scan is the check, so it fails until that pull request has merged and this branch has been rebased on it. The test of the mark and its unmarked control (test_floor_fill_store_guard_boundary.py) is added by that pull request.'
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: command
    check_value: uv run --frozen check-imperative-contracts --repo-root . --allowlist-path imperative-contract-allowlist.yaml --scan-freestanding
    cwd: .
- id: dod-omn24307-ac4-row-read
  description: 'AC4: after a floor fill tick on the dev runtime the table holds at least one row; the read is a count on the dev database and fails while it reads 0. Hosted CI cannot reach dev, so only the local Done gate runs this unbound check.'
  source: manual
  execution_scope: local_done_gate
  binds_ac:
  - AC4
  checks:
  - check_type: command
    check_value: 'uv run --frozen python -c "import os, psycopg2; cur = psycopg2.connect(os.environ[\"OMNIBASE_INFRA_DB_URL\"]).cursor(); cur.execute(\"select count(*) from public.floor_fill_state\"); raise SystemExit(0 if cur.fetchone()[0] > 0 else 1)"'
    cwd: .
- id: dod-omn24307-deploy-live-binding
  description: 'Deploy probe against the shipped source: the GitHub contents read pins the tick module at the checkout revision and requires the live binding to name the unset variable; it fails at the merge base, whose tick module has no store-dsn-unset error. Runs on hosted runners without a lab host.'
  source: manual
  checks:
  - check_type: command
    check_value: |-
      bash -euo pipefail -c '
      gh api "repos/OmniNode-ai/omnimarket/contents/src/omnimarket/handlers/floor_fill_scheduled_tick.py?ref=$(git rev-parse HEAD)" --jq ".content | gsub(\"\\n\"; \"\") | @base64d | (contains(\"FloorFillStoreDsnUnsetError\") and contains(\"build_live_handler_factory\"))" | grep -qx true'
- id: dod-omn24307-integration-proof
  description: The live profile tests ran on a lab host at the pushed head through the lab work runner and exited 0. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24307 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest src/omnimarket/nodes/node_floor_fill_scheduled_effect/tests/test_live_profile.py -q --no-cov -p no:randomly
