    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-26390 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/handlers/bus_binding tests/nodes/node_bus_binding_reducer/test_outbox_request_id_clash.py -q --no-cov
    cwd: .
