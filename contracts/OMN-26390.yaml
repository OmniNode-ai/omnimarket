schema_version: 1.0.0
ticket_id: OMN-26390
title: The outbox reuse pull request is brought onto current dev so its lint and split checks read against the grants dev already carries
summary: The pull request's lint job failed at the broker permission coverage step because its base predated two topic grants that dev now carries, and one split of the test job timed out in an unrelated test. The pull request now contains current dev; the coverage gate reads covered and the timed-out test passes on the merged tree. No workflow, required-contexts list or ratchet baseline is changed by this ticket.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn26390-pr-green-on-current-dev
  statement: The pull request's tree, merged with current dev, passes the broker permission coverage gate and its own outbox handler tests.
  acceptance:
  - id: AC1
    statement: 'AC1: the broker permission coverage gate reads covered at the pushed head against origin/dev -- falsifier: uv run python -m omnimarket.nodes.node_broker_acl_reconcile_effect.runtime_broker_acl_coverage_gate --base-ref origin/dev exits non-zero at the pushed head'
  - id: AC2
    statement: 'AC2: the outbox handler tests of the pull request pass at the pushed head -- falsifier: uv run pytest tests/handlers/bus_binding -q --no-cov fails at the pushed head'
evidence_requirements:
- kind: tests
  description: The broker permission coverage tests and the outbox handler tests pass at the pushed head.
  command: uv run pytest tests/handlers/bus_binding tests/nodes/node_broker_acl_overlay_render_compute/test_coverage_gate.py -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn26390-ac1
  description: 'AC1: the broker permission coverage gate test passes at the pushed head; at the pull request head before the merge the gate refused with two topic uses lacking a grant.'
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_broker_acl_overlay_render_compute/test_coverage_gate.py -q --no-cov -p no:cacheprovider
    cwd: .
- id: dod-omn26390-ac2
  description: 'AC2: the outbox handler tests of the pull request pass at the pushed head.'
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/handlers/bus_binding -q --no-cov -p no:cacheprovider
    cwd: .
- id: dod-omn26390-integration-proof
  description: the outbox suites run on a lab host at the pushed head; hosted CI cannot reach the lab, so only the local Done gate runs this unbound check
  source: manual
