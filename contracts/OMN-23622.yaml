schema_version: 1.0.0
ticket_id: OMN-23622
title: Broker permission rows get a home in the overlays repository
summary: New broker permission rows can no longer be declared in the frozen internal repository. A scoped overlay in the overlays repository (one folder per scope, the shape the apply tool reads as a declaration) holds them, and a pure compute node renders the desired rows from one overlay and refuses what the apply tool would refuse. The apply stays an operator-run command.
is_seam_ticket: true
interface_change: true
interfaces_touched:
- topics
requirements:
- id: req-omn23622-acl-overlay-render
  statement: A scoped permissions overlay loads through a typed model; the compute node renders its rows sorted with the operator's dry-run and apply commands, and refuses a scope holding a row the apply tool would refuse.
  acceptance:
  - id: AC1
    statement: 'AC1: the permissions overlay of one scope loads through a typed model and the compute node renders its rows sorted, with the operator''s dry-run and apply commands, on the in-memory bus -- falsifier: env -u PYTHONPATH uv run pytest tests/nodes/node_broker_acl_overlay_render_compute/test_render_golden_chain.py -q, red on the dev head where the node is absent'
  - id: AC2
    statement: 'AC2: a row the apply tool would refuse (wildcard name, DELETE on a topic, a read of the write node''s commands, a duplicate, a scope mismatch) refuses the whole scope with a finding code and renders nothing -- falsifier: env -u PYTHONPATH uv run pytest tests/nodes/node_broker_acl_overlay_render_compute/test_render_error_chain.py -q, red on the dev head where the node is absent'
evidence_requirements:
- kind: tests
  description: The golden chain, error chain and seam tests of the render node at the pushed head; on the dev head the node's package does not exist so every one of them fails at import.
  command: env -u PYTHONPATH uv run pytest tests/nodes/node_broker_acl_overlay_render_compute -q
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23622-ac1-golden
  description: The golden chain test passes at the pushed head on the in-memory bus.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_broker_acl_overlay_render_compute/test_render_golden_chain.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn23622-ac2-error
  description: The error chain test passes at the pushed head; each refusal names its finding code and renders no row.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_broker_acl_overlay_render_compute/test_render_error_chain.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn23622-integration-proof
  description: The pushed head ran the render node's golden chain, error chain and seam tests on a lab host through the lab work runner and exited 0. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: 'env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23622 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_broker_acl_overlay_render_compute -q --no-cov'
    cwd: .
