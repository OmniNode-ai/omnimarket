title: A pure drain probe node chooses the records that prove the broker reachable behind a refused hook-emit journal head
summary: node_hook_drain_probe_compute is a pure compute handler that picks the probe records out of a hook-emit journal batch, so the drainer calls it later and hook_emit_drainer.py does not grow.
