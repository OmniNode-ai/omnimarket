  statement: The probe record choice is a node with a contract, typed models, a golden chain test and an error chain test, and its tests fail when the class bound is injected as 1.
  acceptance:
  - id: AC1
    statement: 'AC1: the node golden and error chain tests pass -- falsifier: uv run --frozen pytest tests/nodes/node_hook_drain_probe_compute -q --no-cov'
  - id: AC2
    statement: 'AC2: with the class bound injected as 1 the same tests fail, so the bound is read by the tests -- falsifier: uv run --frozen pytest tests/nodes/node_hook_drain_probe_compute -q --no-cov with the bound patched to 1 exits non-zero'
