schema_version: "1.0.0"
ticket_id: "OMN-26725"
title: "onex ticket transition reaches a terminal on dev, so proven tickets can be closed through the done gate"
summary: "A Done transition runs the done gate's verifier on the consumer for up to 300 s, and the CLI waited 60 s, so a refusal read as no_terminal. The CLI now waits 330 s for a transition. The done gate refuses a ticket whose contract carries an evidence item that only the local Done gate runs (16 verified of 17 for the tenant provisioning ticket), so that ticket's contract drops its unbound local-only item; the tests it names are bound by its other items."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-omn26725-terminal"
    statement: |-
      A Done transition returns a terminal, a completion or a typed refusal, before the CLI stops waiting.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: the cause of the missing terminal is named from the dev runtime's consumer list and log for the ticket transition command topic -- falsifier: the lane report names no consumer, topic and log line
      - id: "AC2"
        statement: |-
          AC2: one `onex ticket transition` for a proven ticket on dev returns a terminal event and the ticket reads Done in Linear -- falsifier: the command output shows no terminal, or the Linear state read after it is not Done
      - id: "AC3"
        statement: |-
          AC3: a transition for a ticket whose evidence fails returns a refusal terminal and leaves the ticket open -- falsifier: no refusal terminal, or the ticket state changes
evidence_requirements:
  - kind: "tests"
    description: "The ticket CLI waits longer than the done gate's verifier run for a transition, and a bus-closed ticket's contract holds no item the hosted gate skips."
    command: "uv run pytest tests/nodes/node_linear_ticket_write_effect/test_ticket_cli.py tests/nodes/node_linear_ticket_write_effect/test_done_gate_contract_scope.py -q -n 0 --no-cov"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn26725-transition-wait-outlasts-gate"
    description: "A transition's default wait is 330 s against the gate's 300 s verifier bound while read and comment keep 60 s; an explicit --timeout-s still wins. The transition case fails at 60 s before the change."
    source: "manual"
    binds_ac: ["AC1", "AC2", "AC3"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_linear_ticket_write_effect/test_ticket_cli.py -q -n 0 --no-cov -k default_wait"
        cwd: "."
  - id: "dod-omn26725-no-skipped-item-in-contract"
    description: "The tenant provisioning ticket's contract holds no local_done_gate item, so the hosted done gate has no skipped check to count against it; the test fails on the contract as it stood."
    source: "manual"
    binds_ac: ["AC2"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_linear_ticket_write_effect/test_done_gate_contract_scope.py -q -n 0 --no-cov"
        cwd: "."
  - id: "dod-omn26725-integration-proof-bound"
    description: "Run the ticket CLI's focused tests on a lab host at the pushed head, addressed to the declared dev bus lane; hosted CI cannot reach the lab, so only the local Done gate runs this unbound check."
    source: "manual"
    execution_scope: local_done_gate
    checks:
      - check_type: "command"
        check_value: "env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --bus-lane dev --omnibase-path \"${OMNI_HOME:?}\" --repo OmniNode-ai/omnimarket --sha \"$(git rev-parse HEAD)\" --lane dod-integration-proof-26725 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_linear_ticket_write_effect -q --no-cov"
        cwd: "."
  - id: "dod-omn26725-lab-work-item-gets-verifier-lane"
    description: "An item that runs onex lab-work with no --bus-lane gets the verifier's bus lane in ONEX_LAB_WORK_BUS_LANE and the CLI reads it, so the lab-work refusal 'names no broker' no longer stops it; a lane the caller set and a --bus-lane flag both win, and a command that is not lab-work gets none. The two lane tests fail on origin/dev."
    source: "manual"
    binds_ac: ["AC2"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run --frozen pytest tests/unit/lab_work/test_bus_lane_env.py -q -n 0 --no-cov -p no:cacheprovider"
        cwd: "."
  - id: "dod-omn26725-lab-env-prefix"
    description: "A lab work unit whose command is env NAME=value then a program parses the assignments into the unit environment and judges the program against the allowlist: the recorded OMN-24028 item is placed and run, and env followed by a program outside the allowlist, a second env, an env option or no command is refused with nothing fetched."
    source: "manual"
    binds_ac: ["AC2", "AC3"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_lab_work_unit_effect/test_env_prefix_omn26725.py -q -n 0 --no-cov"
        cwd: "."
