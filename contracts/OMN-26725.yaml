schema_version: 1.0.0
ticket_id: OMN-26725
title: A skipped local_done_gate item reads verified on a matching published receipt
summary: A local_done_gate run publishes its per-item verdicts bound to the contract revision on the verdict topic; the hosted verifier counts a skipped local_done_gate item verified only when a receipt for that exact item and contract revision reads verified.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn26725-ldg-receipt
  statement: The hosted done-gate verifier and the local done-gate meet through a published receipt, without widening the gate.
  acceptance:
  - id: AC4
    statement: 'AC4: a skipped local_done_gate item reads verified only when a receipt for that exact item and contract revision reads verified -- falsifier: a skipped item with no receipt, or a receipt for another revision, reads verified in the focused test'
evidence_requirements:
- kind: tests
  description: The focused receipt tests, each failing against the unchanged collector and passing on the change.
  command: uv run pytest tests/nodes/node_dod_verify/test_local_done_gate_receipt.py -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn26725-ldg-receipt-gate
  description: A skipped local_done_gate item with no receipt still refuses, a receipt for that item and contract revision clears it, and a receipt for another revision, another item or reading failed refuses.
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_dod_verify/test_local_done_gate_receipt.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn26725-integration-proof
  description: On a lab host, with the branch checked out at its pushed sha, the receipt tests run with a known good (a matching receipt clears the item) and a known bad (a receipt for another revision leaves it refused). Hosted CI holds no lab host, so only the local Done gate runs this check, and it binds no criterion.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-26725-ldg-receipt --kind test -- uv run --frozen pytest tests/nodes/node_dod_verify/test_local_done_gate_receipt.py -q --no-cov -n 0 -p no:randomly
    cwd: .
