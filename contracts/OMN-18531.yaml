- id: dod-omn-18531-deploy-container-checkpoint-fold
  binds_ac:
    - AC2
  description: Deploy probe for the checkpoint content kind. A disposable Linux container from the public ghcr.io/astral-sh/uv:python3.12-bookworm-slim image installs this checkout with uv run --frozen --no-dev, folds a four-chunk checkpoint record through the product fold_session_content and ModelSessionContentRecord, and asserts every row keeps content_kind checkpoint and the reassembled rows hash to the written text's sha256. It fails when the fold drops, reorders or truncates a chunk or rewrites the kind. Hosted Ubuntu with Docker and registry access can run it; no lab route is required.
  source: manual
  checks:
    - check_type: test_passes
      check_value: uv run pytest tests/unit/nodes/node_projection_session_content/test_session_content_checkpoint_kind_omn18531.py::test_a_checkpoint_larger_than_one_chunk_reassembles_to_the_files_sha256 -q
    - check_type: command
      check_value: |-
        env docker run --rm --mount type=bind,source="$PWD",target=/workspace,readonly --workdir /workspace -e UV_PROJECT_ENVIRONMENT=/tmp/omn18531-venv ghcr.io/astral-sh/uv:python3.12-bookworm-slim uv run --frozen --no-dev python -c 'import hashlib, json; from omnimarket.nodes.node_projection_session_content.handlers.session_content_fold import fold_session_content; from omnimarket.nodes.node_projection_session_content.models.model_session_content import ModelSessionContentRecord as R; t = json.dumps({"schema": "omni.session-checkpoint/1", "notes": ["n" * 90 for _ in range(20)]}) + "\n"; d = hashlib.sha256(t.encode()).hexdigest(); ps = [t[i : i + 500] for i in range(0, len(t), 500)]; rows = [fold_session_content(R.model_validate({"session_id": "11111111-2222-3333-4444-555555555555", "turn_id": None, "correlation_id": "11111111-2222-3333-4444-555555555555", "emitted_at": "2026-10-15T06:00:01.000000+00:00", "hook_source": "checkpoint", "actor": "claude", "content_kind": "checkpoint", "tool_name": None, "tool_use_id": None, "chunk_index": i, "chunk_count": len(ps), "content_sha256": d, "original_chars": len(t), "truncated": False, "producer_redaction": {}, "content": p, "redaction_state": "passthrough"})) for i, p in enumerate(ps)]; assert len(ps) > 1 and len(rows) == len(ps), rows; assert {r.content_kind for r in rows} == {"checkpoint"}, rows; got = hashlib.sha256("".join(r.content for r in sorted(rows, key=lambda r: r.chunk_index)).encode()).hexdigest(); assert got == d, (got, d); print(json.dumps({"rows": len(rows), "content_kind": "checkpoint", "sha256": got}))'
      cwd: "${OMNI_HOME}/omnimarket"
