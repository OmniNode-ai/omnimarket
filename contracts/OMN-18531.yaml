schema_version: 1.0.0
ticket_id: OMN-18531
title: 'Claude Code mod: the adapter node, its generated binding, the render compute and the install effect (plan task T0.3)'
summary: 'Plan task T0.3 of the context and delegation adapter plan, built in omnimarket: node_claude_code_hook_adapter_effect (contract with client_bindings.claude_code, generic handler, console entry
  onex-claude-code-hook), node_claude_code_binding_render_compute (deterministic render of the mod module) and node_claude_code_binding_install_effect (write, read back, register). The hook-inventory gate
  that reads client_bindings (AC8) lives in omniclaude and is carried by that repository''s thin-shim PR; the omnibase_infra half (skill mapping entry, receipt-mode library call) is a separate PR in that
  repository.'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn18531-ta4-parser-fields
  statement: parse_ledger_row types prompt_id, covers, prompt_match, confirms, confirmed_by and reviewed on a ruling, the same link fields on an operator consent, and operator_span on a correction, and
    the typed events round-trip through JSON.
  acceptance:
  - id: AC1
    statement: 'AC1: a linked RULING, an ambiguous RULING, a linked OPERATOR-CONSENT and a CORRECTION with operator_span each parse to an event carrying every field and round-trip through the event union
      -- falsifier: `uv run pytest tests/unit/nodes/node_work_ledger_emit_effect/test_prompt_link_fields_omn18531.py -q`'
- id: req-omn18531-t03-adapter-binding
  statement: Claude Code hooks reach the bus through one generic adapter and a generated, untracked binding that holds no logic.
  acceptance:
  - id: AC1
    statement: 'AC1: the exact rendered command, run with recorded hook JSON piped on stdin (one fixture per hook event the bindings name), publishes one command whose payload is built from that JSON, hosts
      no handler (the receipt-mode run reports `host_handlers=False`, and no node module is imported in the adapter process), and prints only the hook''s output shape (`{result}`, `{deny}`, `{messages}`,
      `hookSpecificOutput.additionalContext`, or nothing) -- falsifier: a payload not drawn from stdin, a hosted handler, or a `ModelSkillResult` on stdout.'
  - id: AC2
    statement: 'AC2: the rendered failure table for a host whose client-section maximum is `required` maps "adapter never started" to `{deny}`, and for `observe` or `selective` to `next(e)`; a change of
      that maximum changes only the rendered table literal -- falsifier: a required-host render whose missing-executable branch calls `next(e)`.'
  - id: AC3
    statement: 'AC3: the same contract renders a byte-identical module; changing one deadline in the contract changes only that literal in the output -- falsifier: golden diff beyond the literal.'
  - id: AC4
    statement: 'AC4: the rendered module contains no branching other than the verdict-table lookup and the fixed failure table, measured by an allowlist of AST node kinds over the rendered output, and a
      contract data field containing code is rendered as a string literal -- falsifier: a fixture whose rendered output contains a conditional on request content, or executes a data field.'
  - id: AC5
    statement: 'AC5: the binding passes the adapter nothing but the hook input and the binding name -- falsifier: a rendered argument carrying a mode or any value not drawn from the hook input.'
  - id: AC6
    statement: 'AC6: `claude_code_binding_install` writes the rendered module and records its sha256, and the installed file''s sha256 equals the render''s -- falsifier: a mismatch, or an installed file
      differing from a fresh render.'
  - id: AC7
    statement: 'AC7: no rendered module is tracked in any repository -- falsifier: `git ls-files` in omniclaude or omnimarket lists one.'
  - id: AC9
    statement: 'AC9: the PR''s `canonical-file-shape` check passes with `.onex_ratchets/canonical_file_shape_baseline.txt` unchanged -- falsifier: a baseline line added or the check red.'
  - id: AC10
    statement: 'AC10: a reply split into chunks is reassembled by content-record id and its sha256 checked against the echoed hash -- falsifier: a fixture reply delivered out of order, or with one chunk
      missing, returned as anything but `native` or `{deny}`.'
  - id: AC11
    statement: 'AC11: an `additive` row renders a command-hook registration whose command is exactly `onex-claude-code-hook --binding <name>` (v6; v5 named `onex skill`), byte-identical across renders,
      and the adapter maps `inject` to `hookSpecificOutput.additionalContext` only when the package''s sha256 equals the echoed hash, and every other outcome to no output -- falsifier: a rendered registration
      carrying any other argument, or a hash-mismatch fixture that produces `additionalContext`.'
  - id: AC12
    statement: 'AC12: `claude_code_binding_install` writes additive registrations into the user settings only, renders only rows whose probe rows (P16-P19) the capability report marks supported, and a re-install
      with a row removed removes its registration -- falsifier: a registration surviving its row''s removal, an unsupported row installed, or `git ls-files` listing a rendered registration.'
evidence_requirements:
- kind: tests
  description: The prompt-link parser tests pass, and six of them fail on the parser without the fields.
  command: uv run pytest tests/unit/nodes/node_work_ledger_emit_effect/test_prompt_link_fields_omn18531.py -q
- kind: tests
  description: Adapter, render, install and contract tests
  command: uv run pytest tests/nodes/node_claude_code_hook_adapter_effect -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn-18531-ta4-ac1
  description: The typed events carry the prompt-link fields after parse_ledger_row and after a JSON round trip.
  source: manual
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/nodes/node_work_ledger_emit_effect/test_prompt_link_fields_omn18531.py -q
    cwd: ${OMNI_HOME}/omnimarket
  binds_ac:
  - AC1
- id: dod-omn-18531-deploy-container-parse
  description: Deploy probe. A disposable Linux container from the public ghcr.io/astral-sh/uv:python3.12-bookworm-slim image installs this checkout with uv run --frozen --no-dev and calls the product parse_ledger_row
    on a linked RULING row and a CORRECTION row, then round-trips the ruling through the ModelLedgerRowEvent union. It asserts prompt_id, covers and operator_span survive both steps, so it fails at the
    merge base, whose parser drops those cells. Hosted Ubuntu with Docker and registry access can run it; no lab route is required.
  source: manual
  checks:
  - check_type: command
    check_value: 'docker run --rm --mount type=bind,source="$PWD",target=/workspace,readonly --workdir /workspace -e UV_PROJECT_ENVIRONMENT=/tmp/omn18531-venv ghcr.io/astral-sh/uv:python3.12-bookworm-slim
      uv run --frozen --no-dev python -c ''import json; from pydantic import TypeAdapter; from omnimarket.events.model_ledger_row_event import ModelLedgerRowEvent; from omnimarket.nodes.node_work_ledger_emit_effect.handlers.row_parser
      import parse_ledger_row; p = "6f1c2d3e-4a5b-4c6d-8e7f-0a1b2c3d4e5f"; r = parse_ledger_row("2026-10-15T06:00:00Z | RULING | lane=probe | question=q | prompt_id=" + p + " | covers=12:41 | \"ship it\"
      | recorded"); c = parse_ledger_row("2026-10-15T06:05:00Z | CORRECTION | lane=probe | corrects=2026-10-15T06:00:00Z | operator_span=0:4 | wrong"); a = TypeAdapter(ModelLedgerRowEvent); back = a.validate_json(a.dump_json(r));
      assert (back.prompt_id, back.covers) == (p, "12:41"), back; assert c.operator_span == "0:4", c; print(json.dumps({"prompt_id": back.prompt_id, "covers": back.covers, "operator_span": c.operator_span}))'''
    cwd: ${OMNI_HOME}/omnimarket
