- id: dod-omn-18531-deploy-container-composite-ops
  binds_ac:
    - AC13
  description: Deploy probe for the composite operations. A disposable Linux container from the public ghcr.io/astral-sh/uv:python3.12-bookworm-slim image installs this checkout with uv run --frozen --no-dev, runs the product HandlerCaptureItemIdentity with stamp_content_records and then stamp_lineage_event for one PreToolUse call, and asserts the lineage reference is rebound to the content record's id and both sequences are 1. It fails at the merge base, whose operation enum has no composite. Hosted Ubuntu with Docker and registry access can run it; no lab route is required.
  source: manual
  checks:
    - check_type: command
      check_value: |-
        env docker run --rm --mount type=bind,source="$PWD",target=/workspace,readonly --workdir /workspace -e UV_PROJECT_ENVIRONMENT=/tmp/omn18531-venv ghcr.io/astral-sh/uv:python3.12-bookworm-slim uv run --frozen --no-dev python -c 'import json, tempfile, uuid; from omnimarket.nodes.node_capture_item_identity_effect.handlers.handler_item_identity import HandlerCaptureItemIdentity, content_record_id; from omnimarket.nodes.node_capture_item_identity_effect.models import EnumCaptureItemOperation as O, ModelCaptureItemIdentityRequest as Q; h = HandlerCaptureItemIdentity(); j = tempfile.mkdtemp() + "/journal"; i = {"session_id": "s-1", "tool_use_id": "toolu-1"}; m = uuid.uuid4(); ref = {"field": "tool_input", "value": "x", "length": 1, "content_record_id": str(content_record_id(m, "tool_input"))}; c = h.handle(Q(operation=O.STAMP_CONTENT_RECORDS, journal_dir=j, session_id="s-1", hook_input=i, records=[{"content_kind": "tool_input"}])).records[0]; p = h.handle(Q(operation=O.STAMP_LINEAGE_EVENT, journal_dir=j, hook_input=i, payload={"event_id": str(m), "hook_event_name": "PreToolUse", "lineage": {"session_id": "s-1"}, "content_refs": [ref]})).payload; assert p["content_refs"][0]["content_record_id"] == c["content_record_id"], (p, c); assert (p["producer_seq"], c["producer_seq"]) == (1, 1); print(json.dumps({"content_record_id": c["content_record_id"], "lineage_seq": p["producer_seq"], "content_seq": c["producer_seq"]}))'
      cwd: "${OMNI_HOME}/omnimarket"
