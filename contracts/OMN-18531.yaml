schema_version: "1.0.0"
ticket_id: OMN-18531
title: "The typed ruling, consent and correction events carry the prompt-link fields (plan task TA.4, parser slice)"
summary: Plan task TA.4 of the Claude Code context and delegation adapter plan adds optional prompt-link fields to RULING, OPERATOR-CONSENT and CORRECTION rows. This slice is the row parser and the typed events; the ledger grammar and the recorder are separate pull requests.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn18531-ta4-parser-fields
    statement: parse_ledger_row types prompt_id, covers, prompt_match, confirms, confirmed_by and reviewed on a ruling, the same link fields on an operator consent, and operator_span on a correction, and the typed events round-trip through JSON.
    acceptance:
      - id: AC1
        statement: 'AC1: a linked RULING, an ambiguous RULING, a linked OPERATOR-CONSENT and a CORRECTION with operator_span each parse to an event carrying every field and round-trip through the event union -- falsifier: `uv run pytest tests/unit/nodes/node_work_ledger_emit_effect/test_prompt_link_fields_omn18531.py -q`'
  - id: req-checkpoint-projection-kind
    statement: The session-content projection stores a checkpoint content record as a checkpoint row.
    acceptance:
      - id: AC2
        statement: "A checkpoint larger than one chunk is stored as one row per chunk whose reassembled content hashes to the written file's sha256 -- falsifier: uv run pytest tests/unit/nodes/node_projection_session_content/test_session_content_checkpoint_kind_omn18531.py -q -k 'reassembles or writer_upserts or single_chunk' fails with a missing row or a hash mismatch"
      - id: AC3
        statement: "The operator capture reader leaves a checkpoint record alone -- falsifier: uv run pytest tests/unit/nodes/node_projection_session_content/test_session_content_checkpoint_kind_omn18531.py -q -k operator_capture_reader fails when a checkpoint record reads as an operator prompt"
evidence_requirements:
  - kind: tests
    description: The prompt-link parser tests pass, and six of them fail on the parser without the fields.
    command: uv run pytest tests/unit/nodes/node_work_ledger_emit_effect/test_prompt_link_fields_omn18531.py -q
  - kind: tests
    description: "The checkpoint kind tests pass beside the existing session content projection tests"
    command: "uv run pytest tests/unit/nodes/node_projection_session_content -q"
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn-18531-ta4-ac1
    description: The typed events carry the prompt-link fields after parse_ledger_row and after a JSON round trip.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/nodes/node_work_ledger_emit_effect/test_prompt_link_fields_omn18531.py -q
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac:
      - AC1
  - id: dod-omn-18531-deploy-container-parse
    description: Deploy probe. A disposable Linux container from the public ghcr.io/astral-sh/uv:python3.12-bookworm-slim image installs this checkout with uv run --frozen --no-dev and calls the product parse_ledger_row on a linked RULING row and a CORRECTION row, then round-trips the ruling through the ModelLedgerRowEvent union. It asserts prompt_id, covers and operator_span survive both steps, so it fails at the merge base, whose parser drops those cells. Hosted Ubuntu with Docker and registry access can run it; no lab route is required.
    source: manual
    checks:
      - check_type: command
        check_value: |-
          docker run --rm --mount type=bind,source="$PWD",target=/workspace,readonly --workdir /workspace -e UV_PROJECT_ENVIRONMENT=/tmp/omn18531-venv ghcr.io/astral-sh/uv:python3.12-bookworm-slim uv run --frozen --no-dev python -c 'import json; from pydantic import TypeAdapter; from omnimarket.events.model_ledger_row_event import ModelLedgerRowEvent; from omnimarket.nodes.node_work_ledger_emit_effect.handlers.row_parser import parse_ledger_row; p = "6f1c2d3e-4a5b-4c6d-8e7f-0a1b2c3d4e5f"; r = parse_ledger_row("2026-10-15T06:00:00Z | RULING | lane=probe | question=q | prompt_id=" + p + " | covers=12:41 | \"ship it\" | recorded"); c = parse_ledger_row("2026-10-15T06:05:00Z | CORRECTION | lane=probe | corrects=2026-10-15T06:00:00Z | operator_span=0:4 | wrong"); a = TypeAdapter(ModelLedgerRowEvent); back = a.validate_json(a.dump_json(r)); assert (back.prompt_id, back.covers) == (p, "12:41"), back; assert c.operator_span == "0:4", c; print(json.dumps({"prompt_id": back.prompt_id, "covers": back.covers, "operator_span": c.operator_span}))'
        cwd: "${OMNI_HOME}/omnimarket"
  - id: dod-checkpoint-chunks-reassemble-to-file-hash
    binds_ac:
      - AC2
    description: >
      The projection stores each chunk of a multi-chunk checkpoint as a row and
      the reassembled content hashes to the written file.
    source: manual
    status: verified
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/unit/nodes/node_projection_session_content/test_session_content_checkpoint_kind_omn18531.py -q -k 'reassembles or writer_upserts or single_chunk'"
  - id: dod-checkpoint-not-an-operator-prompt
    binds_ac:
      - AC3
    description: >
      A checkpoint record is not read as an operator prompt by the operator
      capture reader.
    source: manual
    status: verified
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/unit/nodes/node_projection_session_content/test_session_content_checkpoint_kind_omn18531.py -q -k operator_capture_reader"
  - id: dod-omn-18531-deploy-container-checkpoint-fold
    binds_ac:
      - AC2
    description: Deploy probe for the checkpoint content kind. A disposable Linux container from the public ghcr.io/astral-sh/uv:python3.12-bookworm-slim image installs this checkout with uv run --frozen --no-dev, folds a four-chunk checkpoint record through the product fold_session_content and ModelSessionContentRecord, and asserts every row keeps content_kind checkpoint and the reassembled rows hash to the written text's sha256. It fails when the fold drops, reorders or truncates a chunk or rewrites the kind. Hosted Ubuntu with Docker and registry access can run it; no lab route is required.
    source: manual
    checks:
      - check_type: command
        check_value: |-
          docker run --rm --mount type=bind,source="$PWD",target=/workspace,readonly --workdir /workspace -e UV_PROJECT_ENVIRONMENT=/tmp/omn18531-venv ghcr.io/astral-sh/uv:python3.12-bookworm-slim uv run --frozen --no-dev python -c 'import hashlib, json; from omnimarket.nodes.node_projection_session_content.handlers.session_content_fold import fold_session_content; from omnimarket.nodes.node_projection_session_content.models.model_session_content import ModelSessionContentRecord as R; t = json.dumps({"schema": "omni.session-checkpoint/1", "notes": ["n" * 90 for _ in range(20)]}) + "\n"; d = hashlib.sha256(t.encode()).hexdigest(); ps = [t[i : i + 500] for i in range(0, len(t), 500)]; rows = [fold_session_content(R.model_validate({"session_id": "11111111-2222-3333-4444-555555555555", "turn_id": None, "correlation_id": "11111111-2222-3333-4444-555555555555", "emitted_at": "2026-10-15T06:00:01.000000+00:00", "hook_source": "checkpoint", "actor": "claude", "content_kind": "checkpoint", "tool_name": None, "tool_use_id": None, "chunk_index": i, "chunk_count": len(ps), "content_sha256": d, "original_chars": len(t), "truncated": False, "producer_redaction": {}, "content": p, "redaction_state": "passthrough"})) for i, p in enumerate(ps)]; assert len(ps) > 1 and len(rows) == len(ps), rows; assert {r.content_kind for r in rows} == {"checkpoint"}, rows; got = hashlib.sha256("".join(r.content for r in sorted(rows, key=lambda r: r.chunk_index)).encode()).hexdigest(); assert got == d, (got, d); print(json.dumps({"rows": len(rows), "content_kind": "checkpoint", "sha256": got}))'
        cwd: "${OMNI_HOME}/omnimarket"
