  - AC5
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_temporal_health_alarm_effect/test_temporal_health_alarm.py -q --no-cov -n 0 -p no:randomly -k healthy_writes_nothing
    cwd: .
- id: dod-omn24900-integration-proof
  description: Run the node's tests on a lab host at the pushed head. Hosted CI cannot reach the lab hosts, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24900 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_temporal_health_alarm_effect/test_temporal_health_alarm.py -q --no-cov -n 0 -p no:randomly
    cwd: .
