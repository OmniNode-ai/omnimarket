  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_temporal_health_alarm_effect/test_temporal_health_alarm.py -q --no-cov -n 0 -p no:randomly -k once_per_episode
    cwd: .
- id: dod-omn24900-ac5
  description: Pending. The ledger STATUS row with installed=h051 is written by the lane once the units run; until then the lane's STATUS row carries the measured cause.
  source: manual
