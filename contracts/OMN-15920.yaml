requirements:
  - id: req-omn15920-tools-list
    statement: "The MCP server node lists a registry node as a tool only when its contract exposes it, its registration is ACTIVE and the overlay allows it, and reads the registry through a projection-backed reader."
    acceptance:
      - id: AC1
        statement: "AC1: tools/list lists an ACTIVE exposed allowed node and no inactive, unexposed or unallowed one; a duplicate name and an unreadable registry are named refusals -- falsifier: uv run pytest tests/nodes/node_mcp_server_effect/test_handler_mcp_tools_list.py -q fails at origin/dev (the node is absent)"
      - id: AC2
        statement: "AC2: the projection-backed registry reader lists an ACTIVE exposed tool from a projection whose mcp block carries a tools list, and refuses by name (infra_tools_list_absent) when the installed infra drops the list -- falsifier: uv run pytest tests/nodes/node_mcp_server_effect/test_handler_mcp_registry_projection_rows.py -q fails at origin/dev (the node is absent)"
      - id: AC3
        statement: "AC3: the runtime builds HandlerMcpToolsList with no argument, the registry dependency comes from the factory the node contract names, and a request with no overlay lists the tools of the contract's bootstrap overlay (delegate) -- falsifier: uv run pytest tests/nodes/node_mcp_server_effect/test_contract_wiring.py -q fails at the previous head (TypeError, missing registry; empty allow list)"
