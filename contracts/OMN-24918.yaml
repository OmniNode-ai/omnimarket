- id: dod-omn24918-ac7
  description: 'The real-Postgres file runs on a lab host against a disposable postgres:16-alpine container through the lab-work command of dod-omn24874-real-postgres in contracts/OMN-24874.yaml, copied here verbatim; the command fails when any test of the file is skipped or fails, so a Postgres run that fails or skips cannot pass it. Local Done gate only: hosted CI cannot reach the lab.'
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: >-
      env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --bus-lane dev --omnibase-path "${OMNI_HOME:?}" --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-real-postgres-24874 --kind test -- sh -c 'PW=$(head -c 18 /dev/urandom | base64 | tr -dc A-Za-z0-9); N=dod-omn24874-pg-$$; OUT=/tmp/$N.out; docker run -d --rm --name "$N" -e POSTGRES_PASSWORD="$PW" -e POSTGRES_DB=omnibase_infra -p 127.0.0.1::5432 postgres:16-alpine >/dev/null; trap "docker rm -f $N >/dev/null; rm -f $OUT" EXIT; for i in $(seq 1 40); do docker exec "$N" pg_isready -U postgres -q && break; sleep 1; done; PORT=$(docker port "$N" 5432/tcp | head -1 | sed "s/.*://"); INTEGRATION_POSTGRES_PASSWORD="$PW" INTEGRATION_POSTGRES_HOST=127.0.0.1 INTEGRATION_POSTGRES_PORT="$PORT" env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/test_omn24874_tenant_overlay_cost_real_postgres.py -q --no-cov -n 0 -p no:randomly -rs > "$OUT" 2>&1; R=$?; cat "$OUT"; ! grep -q skipped "$OUT" && exit $R'
    cwd: .
- id: dod-omn24918-ac9
  description: The ledger holds a STATUS row with src=alarm and alarm=delegation-scenario-r8-failed or -r9-failed, left by the alarm tick run once over a forced failure. Local Done gate only.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: sh -c 'python3 "${OMNI_PLUGIN_ROOT:?}/skills/lane-brief/scripts/lane_brief.py" grep "src=alarm.*alarm=delegation-scenario-r[89]-failed" | grep -q STATUS'
    cwd: .
- id: dod-omn24918-integration-proof
  description: 'The focused tests of this change run on a lab host at the pushed head through the lab work runner; hosted CI cannot reach the lab, so only the local Done gate runs this unbound check. The PR comment that starts Lab: head= names the head, the command and the exit code (AC10).'
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --bus-lane dev --omnibase-path "${OMNI_HOME:?}" --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24918 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/delegation/test_omn24874_tenant_overlay_terminal_cost.py tests/test_omn24874_contract_checks.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24918-ac10
  description: 'The hand-off of the full checkout head to the landing controller is on the ledger for omnimarket#6335; a row for an older head fails this check. The Lab: head= comment and the check-runs at that head are read from the pull request. Local Done gate only.'
  source: manual
  execution_scope: local_done_gate
  checks:
