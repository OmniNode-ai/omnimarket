schema_version: "1.0.0"
ticket_id: OMN-22561
title: "The overlay store: overlays loaded into the database and read through one node with a last-known snapshot"
summary: >-
  Operator ruling 2026-11-06T00:23:28Z: configuration is an overlay loaded into the database, and the host table goes first.
  Three nodes, general by overlay id, with an in-memory default and a real backend selected by overlay.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn22561-overlay-store
    statement: A loaded overlay reads back equal to its source, and a host keeps reading its last snapshot when the store is down, empty or past its bound.
    acceptance:
      - id: AC1
        statement: 'AC1: a load of an id with no pin line, or of a document its model refuses, publishes nothing, and a valid load publishes one version -- falsifier: uv run --frozen pytest tests/unit/nodes/node_overlay_store/test_error_chain_overlay_store.py -q --no-cov'
      - id: AC2
        statement: 'AC2: the projection stores each version keyed by id and digest and publishes what the store holds, read back after the commit -- falsifier: uv run --frozen pytest tests/unit/nodes/node_overlay_store/test_golden_chain_overlay_store.py -q --no-cov'
      - id: AC3
        statement: 'AC3: a refresh with the store down, empty or invalid leaves the held snapshot byte for byte and the reading says so -- falsifier: uv run --frozen pytest tests/unit/nodes/node_overlay_store/test_error_chain_overlay_store.py -q --no-cov -k snapshot'
evidence_requirements:
  - kind: tests
    description: The overlay store's golden and error chains.
    command: uv run --frozen pytest tests/unit/nodes/node_overlay_store -q --no-cov
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-omn22561-overlay-store-chains
    description: The overlay store's golden chain reads back equal to its source and its error chain leaves a held snapshot unchanged.
    source: manual
    binds_ac: [AC1, AC2, AC3]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/nodes/node_overlay_store -q --no-cov
        cwd: .
  - id: dod-omn22561-overlay-store-deploy
    description: >-
      The deployed path: the real overlay chain travels the contract's topics and leaves a host's snapshot at the root every
      reader takes, through the same code a runtime wires. The live dev lane run waits on the runtime deploy and the broker grants.
    source: manual
    binds_ac: [AC2]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/nodes/node_overlay_store/test_golden_chain_overlay_store.py -q --no-cov -k deployed_chain
        cwd: .
  - id: dod-omn22561-integration-proof
    description: >-
      Run this pull request's own check on a lab host at the pushed head. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-22561 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/nodes/node_overlay_store -q --no-cov
        cwd: .
