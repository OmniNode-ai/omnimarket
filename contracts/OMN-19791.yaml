schema_version: "1.0.0"
ticket_id: "OMN-19791"
title: "Delegation eval sample is deterministic for reordered quotas"
summary: "The same rows, quotas and seed always give the same manifest: quota entries are sorted by outcome name before manifest hashing and serialization."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-sample-manifest-deterministic"
    statement: "The delegation eval sampler produces an identical manifest for the same rows, seed and quotas regardless of quota input order."
    acceptance:
      - id: "AC1"
        statement: "Reversing the quota entries with unchanged values yields the same selected items, the same manifest_id and the same serialized manifest -- falsifier: uv run pytest tests/nodes/node_delegation_eval_sample_compute/test_delegation_eval_sample.py -q -k reordered_quotas"
evidence_requirements:
  - kind: "tests"
    description: "Regression test for quota-order independence of the manifest."
    command: "uv run pytest tests/nodes/node_delegation_eval_sample_compute/test_delegation_eval_sample.py -q -k reordered_quotas"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-reordered-quotas-same-manifest"
    description: "Reordered quotas give the same manifest; the test fails at the merge base, which hashes quotas in input order."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_delegation_eval_sample_compute/test_delegation_eval_sample.py -q -k reordered_quotas"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC1"]
