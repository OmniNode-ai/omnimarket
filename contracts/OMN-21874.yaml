    description: AC1 runs the reaper against an in-memory broker.
    source: manual
    binds_ac:
      - AC1
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/nodes/node_consumer_group_guard_effect/test_consumer_group_reaper.py -q --no-cov --tb=line
        cwd: .
  - id: dod-omn21874-ac2
    description: AC2 runs the reaper against an in-memory broker.
    source: manual
    binds_ac:
      - AC2
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/nodes/node_consumer_group_guard_effect/test_consumer_group_reaper.py -k never_deleted -q --no-cov --tb=line
        cwd: .
  - id: dod-omn21874-ac3
    description: AC3 runs the reaper against an in-memory broker.
    source: manual
    binds_ac:
      - AC3
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/nodes/node_consumer_group_guard_effect/test_consumer_group_reaper.py -k "stops or unhealthy or declared" -q --no-cov --tb=line
        cwd: .
