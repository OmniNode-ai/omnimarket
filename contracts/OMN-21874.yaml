schema_version: 1.0.0
ticket_id: OMN-21874
title: The consumer-group guard deletes long-Empty per-call groups under contract-declared limits
summary: The consumer-group guard now reaps Empty per-call consumer groups on each 300 s tick once they have stayed Empty for the contract minimum age, bounded per run, with a broker health read after every batch, instead of only reporting past the threshold.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn21874-bounded-reap
    statement: The guard deletes only groups Empty in every run for the contract min_empty_age_seconds that match a declared reapable pattern, at most max_deletes_per_run per run in batches of batch_size.
    acceptance:
      - id: AC1
        statement: 'AC1: The guard deletes only groups Empty in every run for the contract min_empty_age_seconds that match a declared reapable pattern, at most max_deletes_per_run per run in batches of batch_size. -- falsifier: uv run pytest tests/unit/nodes/node_consumer_group_guard_effect/test_consumer_group_reaper.py -q'
  - id: req-omn21874-stable-never-deleted
    statement: A stable-named or non-Empty group is never deleted.
    acceptance:
      - id: AC2
        statement: 'AC2: A stable-named or non-Empty group is never deleted. -- falsifier: uv run pytest tests/unit/nodes/node_consumer_group_guard_effect/test_consumer_group_reaper.py -k never_deleted -q'
  - id: req-omn21874-stops-on-error
    statement: The run stops at the first delete error or unhealthy broker reading, and the limits live in contract.yaml.
    acceptance:
      - id: AC3
        statement: 'AC3: The run stops at the first delete error or unhealthy broker reading, and the limits live in contract.yaml. -- falsifier: uv run pytest tests/unit/nodes/node_consumer_group_guard_effect/test_consumer_group_reaper.py -k "stops or unhealthy or declared" -q'
evidence_requirements:
  - kind: tests
    description: The guard suites run on a lab host at the pushed head.
    command: uv run pytest tests/unit/nodes/node_consumer_group_guard_effect tests/test_golden_chain_consumer_group_guard_effect.py -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
