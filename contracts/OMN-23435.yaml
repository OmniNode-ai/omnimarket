schema_version: 1.0.0
ticket_id: OMN-23435
title: The floor's placement reader takes an unknown field on a host capacity advertisement as a degraded reading
summary: The floor publisher read each row of the host capacity advertisement file with the strict writer model, so one field the reader's revision did not know refused every published file (the board stopped for 63 minutes on 2026-11-10). The reader now ignores and names an unknown field, skips and names a row that still fails validation, and records the reading as a placement source-health entry with its cause. The writers' model stays strict.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23435-tolerant-reader
  statement: A new field on a host capacity advertisement row never stops the floor publish; the served floor record names the ignored field.
  acceptance:
  - id: AC1
    statement: 'AC1: the floor placement reader accepts a planted unknown field on a host capacity advertisement as a degraded reading and the floor run still publishes -- falsifier: uv run pytest tests/nodes/node_factory_floor_effect/test_placement_tolerant_reader.py -q at the merge base fails'
evidence_requirements:
- kind: tests
  description: The placement reader tests, including the planted unknown field, the row that fails validation, the end-to-end floor run and the failing control (the strict model refusing the same row).
  command: uv run pytest tests/nodes/node_factory_floor_effect/test_placement_tolerant_reader.py -q
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23435-ac1
  description: The tests pass on the branch. With the loader and handler as origin/dev holds them, the planted unknown field refuses the whole run (SourceRefusedError, Extra inputs are not permitted).
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_factory_floor_effect/test_placement_tolerant_reader.py -q
- id: dod-omn23435-integration-proof
  description: Run the floor effect node tests on a lab host at the pushed head. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23435 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_factory_floor_effect/test_placement_tolerant_reader.py -q --no-cov
