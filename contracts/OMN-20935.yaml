title: "omnimarket routing order, CI bus lanes and lab defaults move to the private overlay"
summary: "The lab defaults in node_database_sweep, node_data_flow_sweep, node_integration_sweep_orchestrator, scripts/cost_event_publisher.py, the delegation cost projection wrapper, the type-debt scout experiment and the memory-to-content benchmark are removed: each reader takes the value from its caller, the environment or the node overlay under ONEX_SKILL_OVERLAY_ROOTS, and refuses naming how to supply it when none does. The swarm endpoint registry ships a neutral registry with no endpoint and is resolved through OMNIMARKET_SWARM_ENDPOINT_REGISTRY or the node overlay. The delegation routing tier resolver reads the node overlay between the DELEGATION_ROUTING_TIERS_PATH pin and the packaged file. The validator corpora fixtures use synthetic private addresses. AC1 is not bound by this change: config/ci_bus_lanes.yaml and the packaged routing_tiers.yaml stay in place until the runtime image build, the runtime lane resolver and the CI workflows in other repositories read the private copies, and the PR body lists those readers."
