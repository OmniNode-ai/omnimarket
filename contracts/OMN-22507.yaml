dod_evidence:
- id: dod-omn19998-merged-check-read-fault
  description: The recorded merged PR head is replayed through the verifier's gateway boundary. Unreadable check listings at resolution and at the later Done gate are retryable read faults, bounded retries exhaust without passing, and a later readable listing resolves the same head. Red checks and malformed contracts remain refusals. This regression does not assert the unrelated controller timer criteria.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/nodes/node_dod_verify/test_dod_verify_repo_first_lookup.py -q -n 0 --no-cov -p no:randomly
    cwd: .
- id: dod-omn19998-merged-check-read-fault-deploy
  description: Hosted source smoke exercises the actual verifier handler and gateway adapter with the recorded merged PR head and injected transport and configuration failures. It does not assert a live deployment or a ticket closure.
  source: manual
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/nodes/node_dod_verify/test_dod_verify_repo_first_lookup.py -q -n 0 --no-cov -p no:randomly -k recorded_merged_head_read_fault
    cwd: .
- id: dod-omn22507-integration-proof
  description: Run this pull request's own check on a lab host at the pushed head. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-22507 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/nodes/node_dod_verify/test_dod_verify_repo_first_lookup.py -q -n 0 --no-cov -p no:randomly
    cwd: .
