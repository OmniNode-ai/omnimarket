schema_version: "1.0.0"
ticket_id: "OMN-26727"
title: "onex dashboard opens the hosted dashboard for the selected environment and asks for onex login first"
summary: "onex dashboard open reads the hosted dashboard address from configuration (dashboard.url in the onex config file), opens it, and starts no local server. With no stored login it says to run onex login and opens nothing. This change covers AC9 and AC10 only; the other criteria live in other repositories."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-omn26727-hosted-dashboard-open"
    statement: |-
      onex dashboard open opens the hosted dashboard only after sign-in.
    acceptance:
      - id: "AC9"
        statement: |-
          AC9: onex dashboard opens the hosted dashboard address read from configuration and starts no local server -- falsifier: a CLI test with a captured browser opener asserts the configured address and fails on today's code, which opens a 127.0.0.1 address
      - id: "AC10"
        statement: |-
          AC10: when the user is not signed in, onex dashboard says to run onex login first and opens nothing -- falsifier: a CLI test with no stored login fails if the browser opener is called or the output does not name onex login
evidence_requirements:
  - kind: "tests"
    description: "CLI tests with a captured browser opener and an injected credential store."
    command: "uv run pytest tests/unit/cli/test_omn26727_dashboard_open_hosted.py -q -n 0 --no-cov"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn26727-open-hosted-address-from-config"
    description: "With the address set in configuration the command opens that address and touches no local dashboard; the tests error on the unmodified tree because the command opens a 127.0.0.1 address."
    source: "manual"
    binds_ac: ["AC9"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/cli/test_omn26727_dashboard_open_hosted.py -q -n 0 --no-cov -k 'hosted_address or configuration or no_local_server or correlation'"
        cwd: "."
  - id: "dod-omn26727-not-signed-in-says-onex-login"
    description: "With no stored login the command exits non-zero, names onex login and never calls the browser opener."
    source: "manual"
    binds_ac: ["AC10"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/cli/test_omn26727_dashboard_open_hosted.py -q -n 0 --no-cov -k not_signed_in"
        cwd: "."
  - id: "dod-omn26727-integration-proof-bound"
    description: "Run the same test body on a lab host at the pushed head, addressed to the declared dev bus lane; hosted CI cannot reach the lab, so only the local Done gate runs this unbound check."
    source: "manual"
    execution_scope: local_done_gate
    checks:
      - check_type: "command"
        check_value: "env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --bus-lane dev --omnibase-path \"${OMNI_HOME:?}\" --repo OmniNode-ai/omnimarket --sha \"$(git rev-parse HEAD)\" --lane dod-integration-proof-26727 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/cli/test_omn26727_dashboard_open_hosted.py -q --no-cov"
        cwd: "."
