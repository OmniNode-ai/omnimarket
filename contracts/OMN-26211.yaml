schema_version: 1.0.0
ticket_id: OMN-26211
title: The factory floor dashboard on h051 serves data less than 15 minutes old and shows a cost-and-throughput panel read from node data, each number with its source
summary: 'A compute node, node_floor_cost_throughput_compute, builds the cost-and-throughput panel for the factory floor from readings other nodes made: merges per hour, changes seen running per hour, delegation calls by engine (Claude, Codex, GLM, local) with token and dollar cells, the cost per change seen running and a 7-day trend read from the day-over-day report. Every figure carries its source (node, data read, read time) and reads UNREADABLE when its source is missing; a dollar cell with no recorded dollar source is never estimated.'
is_seam_ticket: false
interface_change: true
interfaces_touched:
- public_api
requirements:
- id: req-omn26211-cost-throughput-panel
  statement: The factory floor shows a cost-and-throughput panel built from node data, each number with its source, UNREADABLE where the source is missing.
  acceptance:
  - id: AC1
    statement: 'AC1: onex-floor-fill-tick.service on h051 exits 0 from a declared install path and the served floor JSON is less than 15 minutes old, with no hand edit of any unit -- falsifier: ssh h051 systemctl show onex-floor-fill-tick.service -p ExecMainStatus prints a value other than 0, or the generated time in the served floor JSON is more than 15 minutes old'
  - id: AC2
    statement: 'AC2: onex-stability-refresh-serve on h051 is active and not exiting 3 -- falsifier: ssh h051 systemctl is-active onex-stability-refresh-serve prints a value other than active'
  - id: AC3
    statement: 'AC3: a compute node in omnimarket builds the panel (merges per hour, changes seen running per hour, lanes by engine Claude Codex GLM and local with token or call counts, cost per change seen running, a 7-day trend), each number carrying its source and reading UNREADABLE when the source is missing -- falsifier: uv run pytest tests/unit/nodes/node_floor_cost_throughput_compute -q fails on a fixture with one source removed'
  - id: AC4
    statement: 'AC4: the page served by the h051 factory floor web host on port 8088 shows the panel with its 7-day trend, read through the page itself and not through the JSON file alone -- falsifier: a browser read of the page finds no panel heading, or a number with no source shown'
  - id: AC5
    statement: 'AC5: one pull request per repository is handed to the landing controller with the installed revision on h051 recorded -- falsifier: grep -F installed=h051 over the ledger for this ticket returns no STATUS row'
evidence_requirements:
- kind: tests
  description: The panel fold tests pass at the pushed head.
  command: uv run pytest tests/unit/nodes/node_floor_cost_throughput_compute tests/unit/nodes/test_golden_chain_floor_cost_throughput.py -q -p no:randomly --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn26211-ac3
  description: 'AC3: the fold builds the panel from recorded readings; a fixture with one source removed reads UNREADABLE for exactly that source''s figures; at the merge base the compute node does not exist.'
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/nodes/node_floor_cost_throughput_compute -q -p no:randomly --no-cov
    cwd: .
- id: dod-omn26211-ac1
  description: 'AC1: read live on h051 after the install; the hosted runner cannot reach the lab, so only the local Done gate runs this unbound check'
  source: manual
  binds_ac:
  - AC1
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: ssh h051 systemctl --user show onex-floor-fill-tick.service -p ExecMainStatus
    cwd: .
- id: dod-omn26211-ac2
  description: 'AC2: read live on h051; the hosted runner cannot reach the lab, so only the local Done gate runs this unbound check'
  source: manual
  binds_ac:
  - AC2
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: ssh h051 systemctl --user is-active onex-stability-refresh-serve
    cwd: .
- id: dod-omn26211-ac4
  description: 'AC4: the page is read live after the install; the hosted runner cannot reach the lab, so only the local Done gate runs this unbound check'
  source: manual
  binds_ac:
  - AC4
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: ssh h051 curl -s -m 20 http://127.0.0.1:8088/ | grep -c UNREADABLE
    cwd: .
- id: dod-omn26211-ac5
  description: 'AC5: the handoff and the installed revision are read from the ledger; the hosted runner has no ledger, so only the local Done gate runs this unbound check'
  source: manual
  binds_ac:
  - AC5
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: grep -c -F installed=h051 docs/tracking/ROLLING_WORK_LEDGER.md
    cwd: .
- id: dod-omn26211-integration-proof
  description: the panel fold tests run on a lab host at the pushed head; hosted CI cannot reach the lab, so only the local Done gate runs this unbound check
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-26211 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/nodes/node_floor_cost_throughput_compute tests/unit/nodes/test_golden_chain_floor_cost_throughput.py -q --no-cov -p no:randomly
    cwd: .
