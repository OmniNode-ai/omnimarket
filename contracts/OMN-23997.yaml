  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/nodes/node_pr_landing_decision_compute/test_landing_decision_stale_fleet.py -k golden_chain -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn23997-ac2
