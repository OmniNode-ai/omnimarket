    check_value: uv run --frozen pytest tests/unit/nodes/node_pr_lifecycle_triage_compute/test_landing_stale_fleet.py tests/unit/nodes/node_pr_landing_decision_compute/test_landing_decision_stale_fleet.py -k "product or error_chain" -q --no-cov -n 0 -p no:randomly
