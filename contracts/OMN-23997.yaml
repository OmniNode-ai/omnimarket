schema_version: 1.0.0
ticket_id: OMN-23997
title: Landing controller - a red caused by offline runners earns one rerun, never a fix worker
summary: The landing red classifier gains the class stale_fleet. A red whose failing check's job log names runner label sets carried only by offline runners, once fleet-status reads each set carried whole by an online runner, is rerun once per head by the landing decision and never leased to a fix worker. A real product failure still goes to a worker. This change adds the classifier rule, the two optional facts it reads, the decision's rerun class and the tests; the controller's read of job logs and fleet-status follows separately.
is_seam_ticket: true
interface_change: true
interfaces_touched:
- events
requirements:
- id: req-omn23997-stale-fleet
  statement: A stale-fleet red head is rerun once and never given a worker; a product red keeps its worker.
  acceptance:
  - id: AC1
    statement: 'AC1: a red head whose failing check log names offline-only runner label sets that an online runner now carries whole is classed stale_fleet and the landing decision emits one rerun and no worker -- falsifier: uv run --frozen pytest tests/unit/nodes/node_pr_landing_decision_compute/test_landing_decision_stale_fleet.py -k golden_chain -q'
  - id: AC2
    statement: 'AC2: the same head with fleet-status unread, fleet still offline, no log, a log without offline-only text, or a real product failure beside it stays product and a worker is leased -- falsifier: uv run --frozen pytest tests/unit/nodes/node_pr_lifecycle_triage_compute/test_landing_stale_fleet.py tests/unit/nodes/node_pr_landing_decision_compute/test_landing_decision_stale_fleet.py -k "product or error_chain" -q'
  - id: AC3
    statement: 'AC3: the recorded job logs of omnibase_infra 5908 and 5909 each parse to the one offline-only label set and classify stale_fleet -- falsifier: uv run --frozen pytest tests/unit/nodes/node_pr_lifecycle_triage_compute/test_landing_stale_fleet.py -k "stale_fleet_verdict or offline_only_label_sets" -q'
- id: req-omn23997-integrated
  statement: The running landing controller reruns a stale-fleet red head once and leases no worker for it.
  acceptance:
  - id: AC4
    statement: 'AC4: integrated: the landing controller running on the Mac, installed from the merged revision and fed the failing job log and fleet-status, records a rerun action for a stale-fleet red head and leases no worker for it -- falsifier: a worker lease for a head classed stale_fleet in the controller ticks'
evidence_requirements:
- kind: tests
  description: The stale-fleet tests pass at the pushed head.
  command: uv run --frozen pytest tests/unit/nodes/node_pr_lifecycle_triage_compute/test_landing_stale_fleet.py tests/unit/nodes/node_pr_landing_decision_compute/test_landing_decision_stale_fleet.py -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
