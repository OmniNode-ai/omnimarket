    cwd: .
- id: dod-omn23997-integration-proof
  description: Run the stale-fleet tests on a lab host at the pushed head. Hosted CI cannot reach the lab hosts, so only the local Done gate runs this unbound check; it binds no criterion for the hosted check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23997 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/nodes/node_pr_lifecycle_triage_compute/test_landing_stale_fleet.py tests/unit/nodes/node_pr_landing_decision_compute/test_landing_decision_stale_fleet.py -q --no-cov -n 0 -p no:randomly
    cwd: .
