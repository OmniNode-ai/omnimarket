schema_version: 1.0.0
ticket_id: OMN-23614
title: Broker topics are planned only for contracts a running profile loads, and never-produced topics are listed with evidence
summary: Every deploy provisions topics for every contract in the registry, so the dev broker holds thousands of topics, most empty. Two compute nodes in omnimarket make the rule and the read declared. node_topic_provision_plan_compute plans topics only for the contracts a running profile loads, with the rule values in its overlay. node_topic_never_produced_compute lists topics that were never produced, have no consumer group and hold no data, with the evidence for each, and deletes nothing. Neither node is wired into the boot provisioner yet.
is_seam_ticket: true
interface_change: true
interfaces_touched:
- topics
requirements:
- id: req-omn23614-plan-and-list
  statement: A contract outside the running profile gets no topic in the plan, and the never-produced listing names its evidence per topic and issues no delete.
  acceptance:
  - id: AC1
    statement: 'AC1: a contract that no running profile loads gets no topic in the provision plan, a loaded name no contract holds and an empty profile are refused, and the rule values come only from the overlay -- falsifier: env -u PYTHONPATH uv run pytest tests/nodes/node_topic_provision_plan_compute -q'
  - id: AC2
    statement: 'AC2: the never-produced listing lists a topic only with no record ever produced, no data in retention and no consumer group, never lists a topic whose evidence was not read, and issues no delete; its offset facts are read from the topic-activity projection row and a seam test fails when either shape changes -- falsifier: env -u PYTHONPATH uv run pytest tests/nodes/node_topic_never_produced_compute -q'
  - id: AC3
    statement: 'AC3: integrated: both nodes run on a lab host at the pushed head, through the lab work runner, and their tests exit 0 there; wiring the plan into the running boot provisioner and reading the dev broker through it are named follow-ups, not claimed here -- falsifier: onex lab-work run --repo OmniNode-ai/omnimarket --sha <head> --lane dod-integration-proof-23614 --kind test -- uv run --frozen pytest tests/nodes/node_topic_provision_plan_compute tests/nodes/node_topic_never_produced_compute -q --no-cov exits non-zero'
evidence_requirements:
- kind: tests
  description: The plan, listing and seam tests at the pushed head. With the loaded-contract filter removed from the plan handler, three of the nine plan tests fail.
  command: env -u PYTHONPATH uv run pytest tests/nodes/node_topic_provision_plan_compute tests/nodes/node_topic_never_produced_compute -q
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23614-ac1-plan
  description: The plan tests pass at the pushed head; three of nine fail when the loaded-contract filter is removed from the handler.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_topic_provision_plan_compute -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn23614-ac2-listing
  description: The listing tests and the seam test against the topic-activity row pass at the pushed head.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_topic_never_produced_compute -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn23614-integration-proof
  description: The pushed head ran the plan, listing and seam tests on a lab host through the lab work runner and exited 0. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  binds_ac:
  - AC3
  checks:
  - check_type: command
    check_value: 'env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23614 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_topic_provision_plan_compute tests/nodes/node_topic_never_produced_compute -q --no-cov'
    cwd: .
