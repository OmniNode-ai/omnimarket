schema_version: "1.0.0"
ticket_id: OMN-22660
title: "Rebuild piece 4: the overlay drift node validates every overlay in the overlay home through its pinned model in the installed runtime and writes its reading row"
summary: >-
  node_overlay_drift_effect reads each pinned overlay of the overlay home and validates it through the model its pin
  names inside a declared runtime interpreter, so the reading is taken against the omnimarket that runtime has
  installed, not the revision the pin names. One STATUS row lane=overlay-drift per run carries the counts per overlay
  verdict and the failing overlays by id and field. A key the runtime rejects (the rung_order case) reads NOT WORKING.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn22660-overlay-drift-reading
    statement: The overlay drift read writes one reading row per run that reads WORKING only when every pinned overlay is accepted by the runtime's own models, and reads NOT WORKING on a planted key the runtime rejects.
    acceptance:
      - id: AC1
        statement: 'AC1: the golden chain test publishes the run command on the in-memory bus and receives every event in order under one correlation id ending in the run-completed event with a WORKING row, and the error chain tests inject an unreadable pins file, an absent runtime interpreter and a refused append and receive the typed failure events -- falsifier: uv run pytest tests/nodes/node_overlay_drift_effect/test_overlay_drift_chain_events.py -q'
      - id: AC2
        statement: 'AC2: a named injected break (a key the runtime rejects planted in one overlay, the rung_order case) turns the row NOT_WORKING with rejected=1 naming that overlay and field, on both backends -- falsifier: uv run pytest tests/nodes/node_overlay_drift_effect/test_overlay_drift_backends.py -q -k planted'
evidence_requirements:
  - kind: tests
    description: The golden and error chain events on the in-memory bus, and the planted breaks on the in-memory and the separate-process runtime backends.
    command: uv run --frozen pytest tests/nodes/node_overlay_drift_effect -q --no-cov
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-omn22660-overlay-drift-tests
    description: The chain event tests and the both-backend tests pass, the planted rejected key reads NOT_WORKING and the golden assertion turns red on it.
    source: manual
    execution_scope: hosted_and_local
    binds_ac: [AC1, AC2]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/nodes/node_overlay_drift_effect -q --no-cov
        cwd: .
  - id: dod-omn22660-overlay-drift-integration-proof
    description: The pushed head ran the node tests on a lab host through the lab work runner and exited 0. Hosted CI cannot reach the lab, so only the local Done gate runs this check.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: 'env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-22660 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_overlay_drift_effect -q --no-cov'
        cwd: .
