schema_version: 1.0.0
ticket_id: OMN-22892
title: omnimarket gets a chain scenario generator node that builds test cases from a chain scenario declaration, each naming the break it must catch
summary: node_event_chain_generator_compute's generate_scenario_tests operation builds one test case per named break from a node's chain_scenarios declaration and raises ChainScenarioDeclarationError for a declaration whose case names no break or whose named break stayed green in the kept receipts. The omnibase_core validator CLI judges the same output directory, exit 0 for the generated one and exit 1 for the two violation fixtures.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn22892-generator-node
  statement: The generator node builds cases that each name the break they must catch, and refuses a declaration that cannot fail.
  acceptance:
  - id: AC1
    statement: 'AC1: the node generates cases from a declaration and the omnibase_core validator CLI exits 0 on its output (golden test) -- falsifier: a declaration whose receipts are not judged makes the golden pair set differ from the declared one'
  - id: AC2
    statement: 'AC2: a declaration whose case cannot fail or names no break makes the node raise a typed error and the validator exit 1 (violation_generated_test_cannot_fail and violation_case_without_named_breaks fixtures) -- falsifier: with the receipts rule disabled in the generator the cannot-fail fixture does not raise'
evidence_requirements:
- kind: tests
  description: The generator node golden and error tests, run with the omnibase_core chain scenario validator CLI.
  command: uv run --frozen pytest tests/chains/scenarios/test_chain_scenario_generator_node.py tests/chains/scenarios/test_generated_scenario_tests.py -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn22892-ac1
  description: The golden test passes; the validator CLI exits 0 on the generated output.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/chains/scenarios/test_chain_scenario_generator_node.py -q --no-cov -k golden
- id: dod-omn22892-ac2
  description: The error tests pass; the node raises ChainScenarioDeclarationError and the validator CLI exits 1 on both violation fixtures.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/chains/scenarios/test_chain_scenario_generator_node.py -q --no-cov -k error
- id: dod-omn22892-integration-proof
  description: Run this pull request's own generator node tests on a lab host at the pushed head. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-22892 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/chains/scenarios/test_chain_scenario_generator_node.py -q --no-cov
    cwd: .
