schema_version: 1.0.0
ticket_id: OMN-22948
title: Every workflow definition in the 24 repositories is read, and all 208 unresolved routing scenarios resolve to hosted, moved to a node or deleted
summary: A pure scan node reads the workflow definitions of the repositories it is given, expands each job's runs-on into its scenarios and resolves each one to hosted, moved to a lab job node, deleted, or unresolved; an expected repository that was not read counts as one unresolved scenario. This pull request adds the scan and its two falsifier tests. It resolves no definition; the per-repository pull requests that do follow it.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn22948-scan
  statement: A scan reads every workflow definition of all expected repositories and counts the scenarios it cannot resolve, so the count is zero only when every definition was read and resolved.
  acceptance:
  - id: AC1
    statement: 'AC1: a scan reads every workflow definition of all 24 repositories (the missing one included) and emits each scenario''s resolution -- falsifier: uv run pytest src/omnimarket/nodes/node_workflow_routing_scan_compute -q -k all_repositories'
  - id: AC2
    statement: 'AC2: the count of unresolved scenarios is 0 and a planted job that selects a self-hosted label with no resolution makes it non-zero -- falsifier: uv run pytest src/omnimarket/nodes/node_workflow_routing_scan_compute -q -k unresolved_zero'
evidence_requirements:
- kind: tests
  description: The scan node's all-repositories and unresolved-zero tests, with the golden and error chain tests of the node.
  command: uv run pytest src/omnimarket/nodes/node_workflow_routing_scan_compute -q
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn22948-ac1
  description: The all-repositories tests pass on the branch and error at collection without the handler.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest src/omnimarket/nodes/node_workflow_routing_scan_compute -q -k all_repositories
- id: dod-omn22948-ac2
  description: The unresolved-zero tests pass on the branch (a planted self-hosted job makes the count non-zero) and fail under the injected every-label-hosted break.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest src/omnimarket/nodes/node_workflow_routing_scan_compute -q -k unresolved_zero
- id: dod-omn22948-integration-proof
  description: Run the scan node's tests on a lab host at the pushed head. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-22948 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest src/omnimarket/nodes/node_workflow_routing_scan_compute -q --no-cov
