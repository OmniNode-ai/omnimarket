    check_value: onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane overlaygate2-0140 --kind test -- uv run --frozen pytest tests/unit/contracts/test_node_overlay_exists_on_overlays_main.py tests/unit/nodes/node_overlay_main_load_check_effect tests/nodes/node_overlay_main_load_check_effect -q --no-cov -p no:cacheprovider
