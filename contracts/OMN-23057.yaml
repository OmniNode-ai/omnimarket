schema_version: "1.0.0"
ticket_id: OMN-23057
title: The lab alarm records each finished run so the floor reads broker lag from the record and piece 17 reads working
summary: >-
  node_lab_alarm appends one line per finished run to a run record (a drill or a probe never writes it; an unwritable record is a typed failure with exit code 4). node_floor_simple_effect takes the broker lag condition from that record and the other broker conditions from the alarm script's record; a missing or condition-less node record reads as unread, and the reading ages by the older of the two runs.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn23057-lab-alarm-run-record
    statement: >-
      The floor reads broker lag from the lab alarm node's run record, so the orphaned consumer group the old script alarms on no longer sets piece 17's reading.
    acceptance:
      - id: AC1
        statement: "AC1: node_lab_alarm appends each finished run to a run record, drills and probes never write it, and an unwritable record is a typed failure with exit 4 -- falsifier: uv run pytest tests/nodes/node_lab_alarm -q"
      - id: AC2
        statement: "AC2: the floor reads the lag condition from the run record, treats a missing record as unread, and ages the reading by the older of the two runs -- falsifier: uv run pytest tests/nodes/node_floor_simple_effect -q"
      - id: AC3
        statement: "AC3: a failing control: the floor tests fail 8 and the node tests fail 6 against the code before the change -- falsifier: uv run pytest tests/nodes/node_floor_simple_effect tests/nodes/node_lab_alarm -q at the pre-change sources"
evidence_requirements:
  - kind: tests
    description: >-
      The run record tests of node_lab_alarm and the broker-lag-from-lag-node tests of node_floor_simple_effect.
    command: uv run --frozen pytest tests/nodes/node_lab_alarm tests/nodes/node_floor_simple_effect -q -n 0 --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn23057-ac1-run-record
    description: >-
      The node appends a run line in the shape the floor reads, a drill and a probe write nothing, and an unwritable record is the typed failure record-unwritable with exit code 4.
    source: manual
    binds_ac:
      - AC1
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/nodes/node_lab_alarm -q -n 0 --no-cov
        cwd: ${OMNI_HOME}/omnimarket
  - id: dod-omn23057-ac2-floor-reads-record
    description: >-
      The floor takes the lag condition from the node's last run and the other broker conditions from the script's last run; a missing, unparseable or condition-less node record reads as unread; the reading age is the older of the two runs.
    source: manual
    binds_ac:
      - AC2
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/nodes/node_floor_simple_effect -q -n 0 --no-cov
        cwd: ${OMNI_HOME}/omnimarket
  - id: dod-omn23057-ac3-failing-control
    description: >-
      Recorded failing control: with the floor sources, tick handler and contract at the previous version, test_broker_lag_from_lag_node.py fails 8; with an injected break that drops the record write, test_lab_alarm_run_record.py fails 6 and passes 5. The pull request body carries the run on the lab.
    source: manual
    binds_ac:
      - AC3
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/nodes/node_floor_simple_effect tests/nodes/node_lab_alarm -q -n 0 --no-cov
        cwd: ${OMNI_HOME}/omnimarket
