schema_version: 1.0.0
ticket_id: OMN-23133
title: The next real Tessl Reviewer finding on a merged omnimarket pull request is fixed by a pull request with a failing control
summary: The publish phase budget granted a call a whole second when a fraction of a second was left (math.ceil of the remaining time) and its refusal said the previous files on the server are untouched although the copy budget is shared across sequential replacements. The limit now rounds down, so a call never gets more than the phase has left, and the refusal says files already replaced earlier in the phase stay replaced. Both are real Tessl Reviewer findings on merged omnimarket#5348, still present on dev when this change was made.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23133-phase-budget-bound
  statement: The limit given to a publish call never passes what the phase has left, and the refusal does not claim earlier files are untouched.
  acceptance:
  - id: AC1
    statement: "AC1: one real Tessl Reviewer finding from the pilot reports is fixed by one omnimarket pull request whose test fails on the base commit and passes on its head -- falsifier: uv run pytest on the new test file at the base commit, expecting failure, then at the head, expecting a pass"
  - id: AC2
    statement: "AC2: the pull request's required checks read green on its exact head -- falsifier: the required contexts of the head read success and uv run pytest on the new test file passes"
evidence_requirements:
- kind: tests
  description: The acceptance tests of this ticket at the pushed head.
  command: uv run --frozen pytest tests/nodes/node_factory_floor_publish_effect/test_phase_budget_review_findings.py -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
- id: dod-omn23133-phase-budget-test
  description: The four tests pass at the head. On the base commit (dev 294b7a0fe) three of the four fail (the call limit past the time left, a fraction of a second granted as a whole second, the refusal saying untouched) and the control passes on both.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_factory_floor_publish_effect/test_phase_budget_review_findings.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn23133-neighbours
  description: The neighbouring publish tests that read the phase budget (cycle bound, cycle timing, publish) pass at the head.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_factory_floor_publish_effect/test_cycle_bound.py tests/nodes/node_factory_floor_publish_effect/test_cycle_timing.py tests/nodes/node_factory_floor_publish_effect/test_factory_floor_publish.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn23133-integration-proof
  description: The pushed head ran the phase budget tests and the publish node cycle tests on a lab host through the lab work runner and exited 0. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: 'uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23133 -- uv run --frozen pytest tests/nodes/node_factory_floor_publish_effect/test_phase_budget_review_findings.py tests/nodes/node_factory_floor_publish_effect/test_cycle_bound.py tests/nodes/node_factory_floor_publish_effect/test_cycle_timing.py -q --no-cov -n 0 -p no:randomly'
    cwd: .
- id: dod-deploy-omn23133-phase-budget
  description: 'Deploy assessment: the change rounds the publish phase limit down and rewords one refusal in the publish handler. It adds no Kafka topic, migration or prod mutation, and reaches the runtime through the package on the next standard image rebuild. The check runs the phase budget tests, which hosted CI can run, and fails when the handler still rounds up.'
  source: manual
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_factory_floor_publish_effect/test_phase_budget_review_findings.py -q --no-cov -n 0 -p no:randomly
    cwd: .
  - check_type: command
    check_value: 'gh api -H "Accept: application/vnd.github.raw" "repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_factory_floor_publish_effect/handlers/handler_factory_floor_publish.py?ref=omn-23133-publish-phase-budget-bound" | grep -q "math.floor(self.remaining())"'
    cwd: .
