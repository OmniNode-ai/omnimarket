schema_version: 1.0.0
ticket_id: OMN-24041
title: A decision request can be answered by the lab model, switched by a setting
summary: 'node_typed_decision_effect answered every typed decision through one outside service. This adds a local engine behind the same typed interface: the engine is a value of the node''s overlay (node_typed_decision_effect/overlay.yaml: engine jev or local, and for local the routing backend id and abstention threshold), the local engine asks the lab vLLM server with guided decoding constrained to the offered options (structured_outputs choice over one-token option codes) and returns per-option probabilities from the answer token''s logprobs, renormalised to sum to one, in the result shape the Jev engine returns. A site with no overlay keeps the contract-pinned Jev engine; an invalid overlay refuses with the overlay reader''s typed error.'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24041-local-decision-engine
  statement: The typed decision node can answer through the lab model constrained to the offered labels, switched by an overlay value with no code default, and an eval on a frozen set reports accuracy, calibration and latency with Wilson intervals.
  acceptance:
  - id: AC1
    statement: 'AC1: the decision node can answer through the lab model constrained to the offered labels, returning per-label probabilities that sum to one, and a configuration setting switches the engine with no code default -- falsifier: uv run pytest tests/unit/nodes/node_typed_decision_effect/test_local_engine.py -q -n 0 --no-cov fails without the change'
  - id: AC2
    statement: 'AC2: the eval on a frozen decision set reports accuracy, calibration and latency per engine with Wilson intervals -- falsifier: the eval report file lacks any of the three measures for either engine'
  - id: AC3
    statement: 'AC3: integrated: a decision request sent to the running dev runtime is answered by the lab model engine -- falsifier: the terminal event read from the running runtime names the local backend and carries probabilities over the offered labels'
evidence_requirements:
- kind: tests
  description: The typed decision node tests pass at the pushed head.
  command: uv run pytest tests/unit/nodes/node_typed_decision_effect -q -n 0 --no-cov -p no:cacheprovider
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
