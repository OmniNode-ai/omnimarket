    check_value: uv run pytest -m unit tests/nodes/node_prove_running_workflow/test_prove_running_every_line.py tests/nodes/node_prove_running_workflow/test_prove_running_batch.py -q --no-cov -p no:randomly -k 'every_line_read or never_runs or second_batch or unread or row_check or earlier or alarm_row or one_status_row or refire'
    cwd: .
- id: dod-omn26112-ac3
  description: the batch run spawns only node commands; no claude process, agent entry point or agent launcher name appears on any path, and the control spawn of a claude process is detected
  source: manual
