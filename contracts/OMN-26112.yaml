  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest -m unit tests/nodes/node_prove_running_workflow/test_prove_running_every_line.py -q --no-cov -p no:randomly -k 'reads_every_not_running_line'
    cwd: .
- id: dod-omn26112-ac2
