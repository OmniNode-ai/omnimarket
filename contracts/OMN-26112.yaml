schema_version: 1.0.0
ticket_id: OMN-26112
title: The hourly prove-running workflow reads every NOT RUNNING line of the integration ledger and writes one result row per change
summary: 'The hourly prove-running batch on h051 read 3 changes of an integration projection that held 245 NOT RUNNING lines (1553 readings). Measured cause: the contract declared a batch start limit of 3 (batch.limit,
  carried by the schedule plan into the read step) and the starter stopped at it. The limit is removed end to end: the starter selects every NOT RUNNING line (both layer groups), the merge shas are read by a bounded
  worker pool so a projection of hundreds of lines fits the step timeout, and every line ends in exactly one result row. A change the workflow proves or alarms on is answered by its own workflow (result=proven with its
  reading, result=blocked with its owner, or result=next-step with the one next step); a line that was started by an earlier batch, whose merge sha was unread, or whose workflow failed is answered by the batch with its
  own row (the earlier proof, the owner or the next step), never a silent skip. No step starts a Claude agent. The fix rides on the omnimarket 6336 branch.'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn26112-every-line-one-row
  statement: The hourly prove-running workflow reads every NOT RUNNING line of the integration projection with no cap, writes one result row per line (proven, blocked with its owner, or next step), and starts no Claude agent.
  acceptance:
  - id: AC1
    statement: 'AC1: a test whose input holds N NOT RUNNING lines with N above 3, across both layer groups, asserts the workflow reads exactly N lines; it fails at head 12b7bcf8 and passes at the new head -- falsifier: uv run pytest on that test file fails at the new head, or passes at 12b7bcf8'
  - id: AC2
    statement: 'AC2: the workflow writes one result row per change, each row one of proven (carrying its reading), blocked (carrying its owner) or next step, and results written equals lines read -- falsifier: uv run pytest on the result-row test fails when one change yields zero rows or two rows'
  - id: AC3
    statement: 'AC3: the workflow starts no Claude agent for any change -- falsifier: uv run pytest on the no-agent test fails when the workflow code path spawns a claude or agent process'
  - id: AC4
    statement: 'AC4: the new head is installed on h051 through the declared installer and the next hourly run reads lines read equal to the NOT RUNNING count of the integration ledger at that hour and results written equal to lines read -- falsifier: the workflow history of the next hourly run on h051 shows lines read different from the NOT RUNNING count or results written different from lines read'
evidence_requirements:
- kind: tests
  description: The starter, batch, workflow and every-line tests against Temporal's time-skipping test server.
  command: uv run pytest -m unit tests/nodes/node_prove_running_workflow -q --no-cov -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn26112-ac1
  description: the read step reads every NOT RUNNING line of a projection holding 4, 12 and 61 lines across both layer groups; at 12b7bcf8 it returns 3 for each
  source: manual
