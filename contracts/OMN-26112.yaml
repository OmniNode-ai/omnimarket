    check_value: onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --host h051 --lane dod-integration-proof-26112 --kind test -- uv run --frozen --python 3.12 pytest tests/nodes/node_prove_running_workflow/test_prove_running_every_line.py
