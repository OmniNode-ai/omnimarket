schema_version: 1.0.0
ticket_id: OMN-23224
title: The floor's Host disk card counts a host it cannot vouch for as not above the 10 GB bar
summary: read_disk in node_floor_simple_effect counts a host with an unread disk figure, a host the pool receipt holds no line for, and a host whose figure (receipt age plus the probe's cached= age) is over the source bound as not above the bar. The 10 GB bar and the 900 s bound are the overlay's and are unchanged.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23224-disk-card-unread-host
  statement: The Host disk card counts a host under its disk bar, or one whose disk reading is unread or older than its bound, as not above the bar.
  acceptance:
  - id: AC1
    statement: 'AC1: the cause is recorded in the pull request body and the lane report with the files and lines of the card (sources.read_disk), the pool receipt writer (onex_lab_run.record_hosts_probe) and the probe cell text (host_capability.disk_cells) -- falsifier: the replay tests that turn red when the unread-figure, missing-host and aged-figure rules are broken'
  - id: AC2
    statement: 'AC2: the disk card counts a host under its disk bar, or one whose disk reading is unread or older than its bound, as not above the bar -- falsifier: uv run --frozen pytest tests/nodes/node_floor_simple_effect/test_disk_card_unread_host_floor_simple.py -q --no-cov'
evidence_requirements:
