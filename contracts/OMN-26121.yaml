schema_version: 1.0.0
ticket_id: OMN-26121
title: The stability proof lane model carries the lane's tenant_id so the declared lane list can name the tenant C15 stamps its bus submission with
summary: 'ModelLabProofLane gains an optional tenant_id, refused unless it is a lowercase canonical UUID, rendered last in the LAB_PROOF_LANES_JSON value. Chain-canary run 45386962732 failed at step 7 because the declared stability lane names no tenant_id; the overlay that declares the variable cannot name a tenant while the model forbids the key.'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn26121-lane-model-tenant-id
  statement: The lab proof lanes overlay model accepts a lane's tenant_id as a lowercase canonical UUID, renders it after gateway_url, and refuses any other value.
  acceptance:
  - id: AC15
    statement: 'AC15: a lane carrying the house tenant id validates and renders tenant_id as the last key, after gateway_url -- falsifier: uv run pytest tests/unit/models/test_lab_proof_lanes_overlay_document_omn24191.py -k tenant_id -q fails at the new head, or passes at the unchanged base commit'
  - id: AC16
    statement: 'AC16: a tenant_id that is not a lowercase canonical UUID (a slug, an empty string, a truncated id, an upper-case id) is refused -- falsifier: uv run pytest tests/unit/models/test_lab_proof_lanes_overlay_document_omn24191.py -k not_a_lowercase_uuid -q passes at the unchanged base commit'
evidence_requirements:
- kind: tests
  description: The lab proof lanes overlay model tests pass at the pushed head, the new tenant_id tests among them.
  command: uv run pytest tests/unit/models/test_lab_proof_lanes_overlay_document_omn24191.py -q -n 0 --no-cov -p no:cacheprovider
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn26121-ac15-lane-model-tenant-id
  description: 'AC15: the tenant_id render test fails at origin/dev (the model forbids the key, extra_forbidden) and passes at the head.'
  source: manual
  binds_ac:
  - AC15
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/models/test_lab_proof_lanes_overlay_document_omn24191.py -k test_lane_with_tenant_id_renders_it_last -q -n 0 --no-cov -p no:cacheprovider
    cwd: .
- id: dod-omn26121-ac16-lane-model-tenant-id-refused
  description: 'AC16: the four malformed tenant_id cases are refused by name at the head; at origin/dev the key is refused as extra_forbidden, which does not carry the must-be refusal text the test matches, so the test fails there.'
  source: manual
  binds_ac:
  - AC16
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/models/test_lab_proof_lanes_overlay_document_omn24191.py -k test_a_tenant_id_that_is_not_a_lowercase_uuid_refuses -q -n 0 --no-cov -p no:cacheprovider
    cwd: .
- id: dod-omn26121-integration-proof
  description: the lane model tests run on a lab host at the pushed head; hosted CI cannot reach the lab, so only the local Done gate runs this unbound check
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-26121 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/models/test_lab_proof_lanes_overlay_document_omn24191.py -q --no-cov
