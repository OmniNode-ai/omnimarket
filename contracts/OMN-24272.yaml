schema_version: 1.0.0
ticket_id: OMN-24272
title: A message on the code edit orchestrator's input topic starts one run
summary: The delegated code edit orchestrator subscribes to its command topic in its contract and, when a runtime message starts it, builds its loop ports from the node's ports overlay; with no overlay the run is refused with a typed failure and starts nothing. Before this the node declared no event_bus block, so nothing could trigger it. The overlay values for the dev runtime are a separate pull request in the overlays repository.
is_seam_ticket: true
interface_change: true
interfaces_touched:
- topics
requirements:
- id: req-omn24272-input-topic
  statement: One message on the code edit orchestrator's command topic starts exactly one loop run; the loop ports come from the node's ports overlay and an absent overlay refuses the run.
  acceptance:
  - id: AC1
    statement: 'AC1: one message on the code edit orchestrator''s input topic starts exactly one loop run, and a repeat of the same message starts no second one -- falsifier: uv run pytest tests/nodes/node_delegated_code_edit_orchestrator/test_input_topic.py -q -n 0 --no-cov -k "golden or repeat"'
  - id: AC2
    statement: 'AC2: the same message starts no run when the contract does not subscribe the topic, and a message with no ports overlay configured is refused with a typed failure and starts no run -- falsifier: uv run pytest tests/nodes/node_delegated_code_edit_orchestrator/test_input_topic.py -q -n 0 --no-cov -k "control or error"'
  - id: AC3
    statement: 'AC3: the loop ports are built from the node''s ports overlay, an absent overlay builds none, and an overlay with an unknown key refuses -- falsifier: uv run pytest tests/nodes/node_delegated_code_edit_orchestrator/test_ports_from_overlay.py -q -n 0 --no-cov'
  - id: AC4
    statement: 'AC4: integrated: a message sent to the running dev runtime starts one code edit run, read as a run line in the runtime log -- falsifier: read the runtime log of the dev runtime for the correlation id of the sent message; no line for it fails this criterion'
evidence_requirements:
- kind: tests
  description: The input topic and ports overlay tests pass at the pushed head.
  command: uv run pytest tests/nodes/node_delegated_code_edit_orchestrator/test_input_topic.py tests/nodes/node_delegated_code_edit_orchestrator/test_ports_from_overlay.py -q -n 0 --no-cov -p no:cacheprovider
emergency_bypass:
