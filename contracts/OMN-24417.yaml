    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --host h053 --lane dod-ac3-24417 --kind test -- python3 -c 'import json,os,sys; d=json.load(open(os.path.join(os.environ["OMNI_HOME"], ".onex_state/lane-host-pool-snapshot/pool.json.read-at.json"))); r={h["host"]:h for h in d["hosts"]}; sys.exit(0 if r["h053"]["running_lanes"] > 0 else 1)'
    cwd: .
- id: dod-omn24417-ac3-hosted-proxy
