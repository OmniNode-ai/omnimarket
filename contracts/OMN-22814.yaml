schema_version: 1.0.0
ticket_id: OMN-22814
title: The friction rollup unit passes the class rules from the overlay home, so stoppages the rules name are classed on the floor
summary: The friction rollup tick node (node_friction_rollup_tick_effect) reads its class rules and class owners from the overlay home (overlay id node_friction_rollup_compute, file env ONEX_FRICTION_CLASS_OVERLAY, else the overlay roots) instead of the example file the compute node ships, and passes them to the rollup. A missing, unreadable or invalid rules file leaves the rules unapplied; the tick still finishes with exit 3 and the status row, the log line and the report name class-rules=unapplied with the exception type.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn22814-tick-overlay-home
  statement: The friction rollup tick passes the overlay home's class rules to the rollup, so a row with no class cell names the class its text matches, and a rules file that cannot be read is reported as unapplied with its cause.
  acceptance:
  - id: AC1
    statement: 'AC1: the rollup unit reads the class rules from the overlay home and classes the 46 rows the rules name, in a test over today''s rows with a failing control -- falsifier: uv run pytest of the friction rollup unit test on the recorded rows'
  - id: AC2
    statement: 'AC2: a missing rules file is reported on the floor as unclassified with its cause, never as a crash -- falsifier: uv run pytest of the missing-rules error chain test'
evidence_requirements:
- kind: tests
  description: The friction rollup tick tests.
  command: uv run --frozen pytest tests/nodes/node_friction_rollup_tick_effect -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
