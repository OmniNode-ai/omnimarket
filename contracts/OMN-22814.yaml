schema_version: 1.0.0
ticket_id: OMN-22814
title: The floor's friction report is classed with the overlay home's class rules, so a stoppage row names its class and owner
summary: The factory floor publish node gains a friction_rollup step kind and a friction_classed contract step. It reads the ledger and its archive rolls inside the 24-hour window, runs node_friction_rollup_compute with the class_rules and class_owners of the overlay home (overlay id node_friction_rollup_compute, file env ONEX_FRICTION_CLASS_OVERLAY) and writes the 24-hour friction report to the path the floor already reads. A missing or invalid overlay or an unset ledger path fails the step and keeps the previous report. The shipped overlay.example.yaml names every measured family from the 108 unclassified rows.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn22814-friction-classed
  statement: The floor's friction report is built by the rollup node with the class rules in the overlay home, so a row with no class cell names the class its text matches and the owner of that class.
  acceptance:
  - id: AC1
    statement: 'AC1: each measured family of friction rows is named by the shipped class rules and the floor reader sees the class on its row, while a row naming no recorded cause stays unclassified -- falsifier: uv run --frozen pytest tests/nodes/node_factory_floor_publish_effect/test_friction_rollup_step.py -q --no-cov'
  - id: AC2
    statement: 'AC2: the step reads every setting from the contract and the overlay, and a missing overlay, a pattern that does not compile or an unset ledger path fails the step and keeps the previous report -- falsifier: uv run --frozen pytest tests/nodes/node_factory_floor_publish_effect/test_friction_rollup_step.py tests/nodes/node_factory_floor_publish_effect/test_factory_floor_publish.py -q --no-cov'
evidence_requirements:
- kind: tests
  description: The friction step tests and the floor publish tests.
  command: uv run --frozen pytest tests/nodes/node_factory_floor_publish_effect -q --no-cov
