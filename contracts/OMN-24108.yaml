schema_version: 1.0.0
ticket_id: OMN-24108
title: One installer for host units, the registry node gets a command line and a rollback
summary: Two installers render the same host units differently, and the older one drops settings the newer one keeps. This gives node_host_installer_registry_units a command line (onex-host-install-units) with dry-run, install, status, kickstart, uninstall and rollback, a contract command_line block that carries every environment name and default, and a one-level rollback that keeps the files an install replaces for launchd, systemd and copied-tree units. The older command hands the units this node declares to this command in its own pull request.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24108-one-installer-command
  statement: The registry node has a typed command line and a rollback, and the older installer hands over to it.
  acceptance:
  - id: AC1
    statement: "AC1: the newer installer has a typed command line that runs dry-run, install, status, kickstart, uninstall and rollback for a registry unit -- falsifier: pytest omnimarket/tests/nodes/node_host_installer_registry_units -q -k cli fails when the command line is absent"
  - id: AC2
    statement: "AC2: rollback restores the previous unit file and its record, and refuses when none was kept -- falsifier: pytest -k rollback fails when the previous file is not kept"
  - id: AC3
    statement: "AC3: the older installer hands each unit the newer node declares to the newer command and renders none of them itself -- falsifier: a test in the older installer's own repository that runs the old command for a shared unit and fails when it renders locally"
  - id: AC4
    statement: "AC4: integrated, read in the running runtime: one unit is installed through the new command on the operator machine and its next run is read -- falsifier: the unit's install record names the revision and the evidence file is newer than the install"
evidence_requirements:
- kind: tests
  description: The node tests pass at the pushed head.
  command: uv run pytest tests/nodes/node_host_installer_registry_units/test_cli.py tests/nodes/node_host_installer_registry_units/test_rollback.py -q -p no:randomly --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24108-ac1
  description: "AC1: the command-line tests pass at the head; at the merge base the module does not exist, so the test file cannot import it."
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_host_installer_registry_units/test_cli.py -q -p no:randomly --no-cov
    cwd: .
- id: dod-omn24108-ac2
  description: "AC2: the rollback tests pass at the head; at the merge base the request model refuses mode rollback."
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_host_installer_registry_units/test_rollback.py -q -p no:randomly --no-cov
    cwd: .
- id: dod-omn24108-ac3
  description: "hosted proxy for AC3: the seam test that ties the contract command_line block, the request model and the console script passes here; the old command's side is its own pull request in the internal repository, which carries its own contract."
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_host_installer_registry_units/test_cli.py -k 'contract_command_line' -q -p no:randomly --no-cov
    cwd: .
- id: dod-omn24108-ac4
  description: "hosted proxy for AC4: the install-then-rollback tests of a launchd, a systemd and a copied-tree unit pass here, and fail at the merge base where the rollback mode does not exist; the Mac install through the new command and the read of its next run are posted as a pull request comment naming the head."
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_host_installer_registry_units/test_rollback.py -k 'first_and_only_install or rolls_back' -q -p no:randomly --no-cov
    cwd: .
- id: dod-omn24108-integration-proof
  description: the node tests run on a lab host at the pushed head; hosted CI cannot reach the lab, so only the local Done gate runs this unbound check
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24108 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_host_installer_registry_units -q --no-cov -p no:randomly
