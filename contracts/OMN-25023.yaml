schema_version: 1.0.0
ticket_id: OMN-25023
title: 'Review findings 1 to 11 on omnimarket PR 6308 at head 2e62c30f5f1a are fixed or argued: AC2 is restored in the contracts, the AC4 check can fail, the refresh schedule and lock paths are tested, and the Lab comment is at the new head'
summary: 'Review findings on the refresh on merge of node_code_graph_effect (omnimarket#6308): AC2 returns to the contract of OMN-24642 marked NOT MET and the test asserts four ids, the AC6 label of OMN-24659 is dropped, AC4 installs after the merge, the installed-unit check reads the last REFRESH line, the status row check reads the build time, revisions and staleness, the refresh schedule, the state directory and the lock wait are tested, a failed build''s reason is one token, and a stale fetch record fails the head read.'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn25023-review-findings
  statement: Each review finding on the refresh on merge is fixed with a test that fails without the fix, or argued with evidence.
  acceptance:
  - id: AC1
    statement: 'AC1: finding 1 is answered: contracts/OMN-24642.yaml lists four criteria with AC2 worded as OMN-24642 words it and marked NOT MET, and test_code_graph_refresh.py asserts four ids -- falsifier: `uv run pytest tests -k "code_graph_refresh and contract" -q -p no:cacheprovider` passes with AC2 deleted from the acceptance list of contracts/OMN-24642.yaml'
  - id: AC2
    statement: 'AC2: finding 2 is answered: contracts/OMN-24659.yaml states an AC6 in its acceptance list or the dod-omn24659-ac6 label is dropped -- falsifier: `grep -n ''ac6'' contracts/OMN-24659.yaml` lists the check while the acceptance list at its top has no AC6 line'
  - id: AC3
    statement: 'AC3: findings 3 and 10 are answered: AC4 of contracts/OMN-24642.yaml says install after merge or the PR comment cites a ruling, and the AC1 grep matches the build time, revisions and staleness fields of a STATUS row -- falsifier: `grep -n ''before the pull request is handed off'' contracts/OMN-24642.yaml` still matches, or the AC1 check passes on a row with no build time'
  - id: AC4
    statement: 'AC4: finding 4 is answered: the AC4 check matches the last REFRESH line against outcome=(refreshed|fresh|deferred) and a test shows it fails when every tick prints outcome=failed -- falsifier: `uv run pytest tests -k "code_graph_refresh" -q -p no:cacheprovider` passes with the check reduced to a log mtime read'
  - id: AC5
    statement: 'AC5: findings 5, 7 and 8 are answered: a dry-run CLI test covers schedule install --unit refresh through SCHEDULE_BLOCKS, a test covers wait-then-acquire with a nonzero exit or a stated reason, and one test asserts the state_directory of schedule and drill_schedule are equal and the rendered unit sets ONEX_CODE_GRAPH_STATE_DIR -- falsifier: `uv run pytest tests -k "code_graph_refresh or runtime_code_graph" -q -p no:cacheprovider` passes with the refresh entry removed from SCHEDULE_BLOCKS'
  - id: AC6
    statement: 'AC6: findings 6 and 11 are answered: test_failed_build_exits_one_and_leaves_the_marker_untouched asserts the reason, and result.failure goes through reason_token with a test -- falsifier: `uv run pytest tests -k "failed_build_exits_one" -q -p no:cacheprovider` passes with the status != completed branch deleted from handlers/code_graph_refresh.py'
  - id: AC7
    statement: 'AC7: finding 9 is answered: the PR declares what fetches the h053 clones and how often, or head() fails on an old FETCH_HEAD with a test -- falsifier: `uv run pytest tests -k "repo_sources" -q -p no:cacheprovider` passes with a stalled fetch reading fresh'
  - id: AC8
    statement: 'AC8: a PR comment starting `Lab: head=<full new head sha>` names the sha, the command and exit 0 for the suites the PR requires, run on the lab in parts if a whole run times out with the parts named, and every required check-run of omnimarket#6308 reads success at the new head -- falsifier: `onex scm pr-checks OmniNode-ai/omnimarket#6308` lists a required context that is not success at the new head, or no PR comment matches `Lab: head=` with the full sha, the command and exit 0'
