schema_version: 1.0.0
ticket_id: OMN-23955
title: Claude token pool tick prints the limit recheck outcome per limited login
summary: The pool tick already re-tests a limited login on the marks-source host and has the pool execute the compute's typed command, but its printed line carries only the stale-revoke result, so a unit log cannot show whether a limited mark was cleared, replaced or kept. The tick result now carries one typed outcome per limited label with its probe time and the printed line includes it.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23955-typed-outcome-line
  statement: The pool tick result carries a typed outcome per rechecked label (cleared, replaced or kept, with the probe time) and the tick's printed line includes it.
  acceptance:
  - id: AC1
    statement: 'AC1: the pool tick result carries a typed outcome per rechecked label (cleared, replaced or kept, with the probe time) and the tick''s printed line includes it -- falsifier: uv run pytest tests/nodes/node_claude_token_pool_effect/test_limit_recheck_outcome_line.py -q, red at the merge base where the line has no limit_recheck field'
- id: req-omn23955-kept-never-cleared
  statement: A label whose probe answered limited or error prints kept and the label is never reported cleared.
  acceptance:
  - id: AC2
    statement: 'AC2: a label whose probe answered limited or error prints kept and the label is never reported cleared -- falsifier: the same test file, its kept-case failing control reports cleared for a limited answer'
- id: req-omn23955-integrated
  statement: After install from the branch on h053 and h051 the unit's own log shows one run with the recheck outcome per limited label.
  acceptance:
  - id: AC3
    statement: 'AC3: integrated: after install from the branch on h053 and h051 the unit''s own log shows one run with the recheck outcome per limited label -- falsifier: the unit log line has no limit_recheck field or names no probe time'
evidence_requirements:
- kind: tests
  description: The typed-outcome and printed-line tests of the pool tick pass at the pushed head.
  command: uv run --frozen pytest tests/nodes/node_claude_token_pool_effect/test_limit_recheck_outcome_line.py -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23955-ac1
  description: The typed-outcome test holds that a cleared label and a kept label each carry their probe time and that the printed line and the heartbeat carry the same outcomes; at the merge base the outcome model does not exist and the test module fails to import.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_claude_token_pool_effect/test_limit_recheck_outcome_line.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn23955-ac2
  description: The kept-case control holds that a limited or error answer never reports cleared; an injected break that reports cleared for a probed label fails it.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_claude_token_pool_effect/test_limit_recheck_outcome_line.py -q --no-cov -n 0 -p no:randomly -k never_reports_cleared
    cwd: .
- id: dod-omn23955-ac3
  description: The reading is taken after install from the branch on h053 and h051 from each unit's own log; the check is the focused test command behind the line.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_claude_token_pool_effect/test_limit_recheck_outcome_line.py -q --no-cov -n 0 -p no:randomly
    cwd: .
