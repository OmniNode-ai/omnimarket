schema_version: 1.0.0
ticket_id: OMN-23706
title: The host worktree reconcile reads a declared value for a service settings file it may not open
summary: The worktree reconcile node kept every tree on a host where one service keeps its settings in a root-only environment file, because the unit snapshot treated the unreadable file as fatal. The host overlay may now declare, per unreadable file, the absolute paths it holds; the node uses the declared value and still fails on an undeclared unreadable file or a missing one.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23706-declared-env-file
  statement: A systemd EnvironmentFile the run user cannot open does not fail the unit snapshot when the host overlay declares what it holds; an undeclared one still fails.
  acceptance:
  - id: AC1
    statement: 'AC1: a service environment file the run user cannot read, which the host settings declare, no longer fails the unit snapshot and the paths declared for it join the live-path set -- falsifier: env -u PYTHONPATH uv run pytest tests/test_worktree_reconcile_units.py -q -k declared fails at the merge base'
  - id: AC2
    statement: 'AC2: an unreadable environment file the host settings do not declare still fails the snapshot and keeps every tree, and a missing required file still fails -- falsifier: env -u PYTHONPATH uv run pytest tests/test_worktree_reconcile_units.py -q -k ''undeclared or missing'' (the undeclared and missing cases are the failing controls)'
  - id: AC3
    statement: 'AC3: integrated: the scheduled worktree reconcile unit on the lab host, installed from the branch through the declared installer, ends a run with exit 0 and a receipt that has no unit_snapshot_failed -- falsifier: systemctl --user show onex-worktree-reconcile -p Result and the state directory latest.json on the host'
evidence_requirements:
- kind: tests
  description: The declared, undeclared, missing and model-validation tests at the pushed head; on the dev head the reader takes no declared value so each declared test fails with a TypeError.
  command: env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/test_worktree_reconcile_units.py -q --no-cov -n 0 -p no:randomly tests/test_worktree_reconcile_effect.py
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn-23706-ac1
  description: A declared unreadable environment file joins the live set, a declared empty one names nothing, a readable file is read for real, and the golden run chain finishes with no unit_snapshot_failed.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/test_worktree_reconcile_units.py tests/test_worktree_reconcile_schedule.py -q --no-cov -n 0 -p no:randomly -k declared
    cwd: .
- id: dod-omn-23706-ac2
  description: 'The error chain: undeclared unreadable file keeps the tree and counts a failure; a missing file still raises; a relative declared path is refused by the model.'
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/test_worktree_reconcile_units.py -q --no-cov -n 0 -p no:randomly -k 'undeclared or missing or absolute'
    cwd: .
- id: dod-omn23706-ac3-overlay-seam
  description: The host overlay's declared value reaches the unit reader through the scheduled tick (the in-process half of AC3; the lab half is the unbound integration item).
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/test_worktree_reconcile_schedule.py -q --no-cov -n 0 -p no:randomly -k hands_the_overlay
    cwd: .
- id: dod-omn-23706-integration-proof
  description: The pushed head's reader tests ran on a lab host and exited 0, and the unit installed from the branch ran one clean tick.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23706 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/test_worktree_reconcile_units.py tests/test_worktree_reconcile_schedule.py -q --no-cov -p no:randomly
    cwd: .
