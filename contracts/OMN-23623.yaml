schema_version: 1.0.0
ticket_id: OMN-23623
title: Queue commit reports the reviewer-eval check so CI Summary finishes
summary: CI Summary asserts 58 external contexts on a merge-group commit. Read on the queue commit of the first group, 57 are completed success and reviewer-eval has no check-run, because its workflow triggers on pull_request only and the merge-group workflow had no job for it. The rollup stayed pending until its 90 minute deadline. The merge-group workflow now carries a reviewer-eval job that reads the verdict the same context reached on the queued pull request head. No context is dropped and the pull request assertion is unchanged.
is_seam_ticket: true
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23623-queue-reviewer-eval
  statement: Every context CI Summary asserts on a queue commit is produced there, either by a workflow that triggers on merge_group or by one job of the merge-group workflow, and the pull request assertion is unchanged.
  acceptance:
  - id: AC1
    statement: 'AC1: the rollup decision function, given the check-runs a queue commit carries, returns success only when reviewer-eval is reported on the queue commit by the merge-group workflow -- falsifier: env -u PYTHONPATH uv run pytest tests/unit/workflows/test_merge_group_asserted_contexts_covered_omn19998.py -q fails at the base for the merge_group event'
  - id: AC2
    statement: 'AC2: every context the rollup asserts on a queued batch is either produced by a workflow that runs on the queue or reported by exactly one job of the merge-group workflow, and the pull request rule is unchanged -- falsifier: the same test file with the reviewer-eval job deleted from the merge-group workflow goes red'
  - id: AC3
    statement: 'AC3: integrated: a queued batch built after this change shows reviewer-eval as a completed check on the queue commit and its CI Summary job finishes success inside 30 minutes -- falsifier: the check-runs read of the queue commit lists reviewer-eval with no completed row, or CI Summary stays in progress past 30 minutes'
evidence_requirements:
- kind: tests
  description: The coverage and decision tests at the pushed head. With the merge-group workflow restored to origin/dev, three of the five tests fail.
  command: env -u PYTHONPATH uv run pytest tests/unit/workflows/test_merge_group_asserted_contexts_covered_omn19998.py -q
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23623-ac1-decision
  description: The decision test passes at the pushed head; at origin/dev reviewer-eval is covered by nothing and the function returns pending.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/workflows/test_merge_group_asserted_contexts_covered_omn19998.py -q --no-cov -n 0 -p no:randomly -k test_rollup_decision_is_success_for_the_check_runs_a_queue_commit_carries
    cwd: .
- id: dod-omn23623-ac2-coverage
  description: The coverage tests pass at the pushed head, including the control that removes reviewer-eval and reads pending, and the pull request assertion test.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/workflows/test_merge_group_asserted_contexts_covered_omn19998.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn23623-ac3-queue-job
  description: The in-process half of AC3. The merge-group workflow carries exactly one reviewer-eval job and runs on merge_group only, so a queue commit gets the context. The runtime half is the unbound item below.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/workflows/test_merge_group_asserted_contexts_covered_omn19998.py -q --no-cov -n 0 -p no:randomly -k test_reviewer_eval_job_is_one_job_of_the_merge_group_workflow
    cwd: .
- id: dod-omn23623-ac3-runtime
  description: The queue commit of a group built after the merge lists reviewer-eval completed. Hosted CI cannot reach the lab bus, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: 'onex scm run-list OmniNode-ai/omnimarket --event merge_group --workflow ci.yml --limit 1 --bus kafka --bus-lane dev'
    cwd: .
