schema_version: 1.0.0
ticket_id: OMN-23072
title: The floor runs in the one runtime - slice 1, the scheduled compute, the floor document event, the projection and the runtime route for floor-simple.json
summary: Adds node_floor_simple_scheduled_effect (runtime tick, overlay-declared cadence, emits the floor document), node_floor_document_reducer (holds the newest document) and node_floor_page_api_effect (runtime HTTP mount serving floor-simple.json from the projection).
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23072-floor-in-runtime-slice1
  statement: The runtime serves floor-simple.json from a projection of the floor document that a scheduled compute emits on the bus, with no Mac launchd job in the path.
  acceptance:
  - id: AC1
    statement: 'AC1: booting the runtime HTTP mount from the route node contract and reading /floor/floor-simple.json returns the projected document, and a named 503 before any document exists -- falsifier: uv run --frozen pytest tests/nodes/node_floor_page_api_effect/test_runtime_route_floor_simple_json.py -q --no-cov'
  - id: AC2
    statement: 'AC2: the scheduled compute emits one document per overlay interval on the runtime tick and refuses without its overlay -- falsifier: uv run --frozen pytest tests/nodes/node_floor_simple_scheduled_effect -q --no-cov'
  - id: AC3
    statement: 'AC3: the projection holds the newest document and refuses an older or repeated one -- falsifier: uv run --frozen pytest tests/nodes/node_floor_document_reducer -q --no-cov'
evidence_requirements:
- kind: tests
  description: The golden and error chain tests of the three nodes and the runtime route control
  command: uv run --frozen pytest tests/nodes/node_floor_page_api_effect tests/nodes/node_floor_simple_scheduled_effect tests/nodes/node_floor_document_reducer -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23072-ac1
  description: The runtime mount serves the projected document and refuses by name before one exists -- proven by the named test file.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_floor_page_api_effect/test_runtime_route_floor_simple_json.py -q --no-cov
    cwd: .
- id: dod-omn23072-ac2
  description: The scheduled compute gates on the overlay interval and refuses without its overlay -- proven by the named tests.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_floor_simple_scheduled_effect -q --no-cov
    cwd: .
- id: dod-omn23072-ac3
  description: The projection holds the newest document and refuses an older or repeated one -- proven by the named tests.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_floor_document_reducer -q --no-cov
    cwd: .
- id: dod-omn23072-integration-proof
  description: The pushed head, run on a lab host, serves the floor route from the projection through the runtime HTTP mount. The deployed read on the dev runtime follows the dev deploy through the deploy agent and is named in the pull request.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: |-
      uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane floor-in-runtime-2315 -- uv run --frozen pytest tests/nodes/node_floor_page_api_effect/test_runtime_route_floor_simple_json.py -q --no-cov
    cwd: .
- id: dod-omn23072-deploy-runtime-mount
  description: Deploy probe the hosted runner can run. The route node contract at the checked-out commit declares the /floor http_mount and the floor-simple.json route, and the shipped handler reads them from that contract. It fails at the merge base, where neither node exists. The read on the dev runtime follows the dev deploy through the deploy agent.
  source: manual
  checks:
  - check_type: command
    check_value: |-
      uv run --frozen --no-dev python -c 'import yaml; from omnimarket.nodes.node_floor_page_api_effect.handlers.handler_floor_page import contract_mount_prefix, contract_routes; assert contract_mount_prefix() == "/floor"; assert any("floor-simple.json" in str(r) for r in contract_routes())'
    cwd: .
