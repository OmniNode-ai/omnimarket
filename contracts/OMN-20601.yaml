---
schema_version: "1.0.0"
ticket_id: "OMN-20601"
title: "The house routing-overlay write command has a producer and the node declares a runtime profile"
summary: "Adds a publisher in the node_house_routing_overlay_effect package that builds one command on the contract topic and rejects an invalid command, and declares runtime_profiles at the top level of the node contract. AC1 and AC2 are bound to the publisher tests. AC3 is a dev-202 bus readback and is not bound."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-house-overlay-command-has-a-producer"
    statement: "The house-routing-overlay-write command topic declared in the node contract has a producer in the node package, and the contract declares runtime_profiles at the top level. AC3 is not bound here: it reads the dev-202 redpanda, which this repository's hosted check cannot reach."
    acceptance:
      - id: "AC1"
        statement: "AC1: a publisher in the node package builds exactly one command on the topic read from the node contract and rejects an invalid command without publishing -- falsifier: uv run pytest tests/nodes/node_house_routing_overlay_effect/test_publish_house_overlay_command.py -q"
      - id: "AC2"
        statement: "AC2: the node contract declares a top-level runtime_profiles of effects -- falsifier: uv run pytest tests/nodes/node_house_routing_overlay_effect/test_publish_house_overlay_command.py -q -k runtime_profile"
  - id: "req-routing-decisions-come-from-overlays"
    statement: "Routing decisions come from overlays, never from omnimarket code (ruling 2026-10-10T17:54:30Z): every routing selection source is inventoried, the deployment overlay wins over each code default, and a new route-selecting comparison in non-test code fails the Deployment Fact Gate job and its pre-commit hook."
    acceptance:
      - id: "AC5"
        statement: "AC5: an inventory lists every routing selection source in omnimarket, and a resolution site or packaged config missing from it fails -- falsifier: uv run pytest tests/test_routing_sources_omn20601.py -q -k inventory"
      - id: "AC6"
        statement: "AC6: the overlay wins over every code default, for each source in the inventory -- falsifier: uv run pytest tests/test_routing_sources_omn20601.py -q -k overlay_precedence"
      - id: "AC7"
        statement: "AC7: a new routing branch in code fails the deployment-fact gate -- falsifier: uv run pytest tests/unit/nodes/node_deployment_fact_gate_effect/test_routing_in_code_omn20601.py -q -k routing_in_code_refused"
evidence_requirements:
  - kind: "tests"
    description: "AC1 and AC2 hosted probe. The publisher tests pass at the head and fail at the merge base, where the publisher module does not exist."
    command: "env -u PYTHONPATH uv run pytest tests/nodes/node_house_routing_overlay_effect/test_publish_house_overlay_command.py -q"
  - kind: "tests"
    description: "AC5, AC6 and AC7: the inventory, overlay precedence and routing-in-code checks, with the existing outcome-overlay test the inventory cites."
    command: "uv run pytest tests/test_routing_sources_omn20601.py tests/unit/nodes/node_deployment_fact_gate_effect/test_routing_in_code_omn20601.py tests/unit/delegation/test_roi_overlay_routing_omn14001.py -q -p no:randomly --no-cov"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn20601-ac1-ac2-house-overlay-publisher"
    description: "AC1 and AC2 hosted probe. The publisher tests pass at the head and fail at the merge base."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_house_routing_overlay_effect/test_publish_house_overlay_command.py -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC1", "AC2"]
  - id: "dod-omn20601-ac5-routing-source-inventory"
    description: "AC5: the inventory test fails on a resolution site or packaged config the inventory lacks, and the ci.yml lint step and the pre-commit hook run it on every path a new source can arrive by."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/test_routing_sources_omn20601.py -q -k inventory"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC5"]
  - id: "dod-omn20601-ac6-overlay-precedence"
    description: "AC6: for each routing source the overlay, pin or environment wins over the code default."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/test_routing_sources_omn20601.py -q -k overlay_precedence"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC6"]
  - id: "dod-omn20601-ac7-routing-in-code-refused"
    description: "AC7: a new route-selecting comparison in non-test code fails the deployment-fact gate, judged against the base revision."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/nodes/node_deployment_fact_gate_effect/test_routing_in_code_omn20601.py -q -k routing_in_code_refused"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC7"]
  - id: "dod-omn20601-deploy-routing-in-code-gate"
    description: "Deploy probe: at the commit the check runs against, the deployment-fact gate handler of node_deployment_fact_gate_effect calls the routing-in-code judge against the base revision, read from the repository over the GitHub content API, so the check goes red on any commit whose gate does not run it."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: "gh api \"repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_deployment_fact_gate_effect/handlers/handler_deployment_fact_gate.py?ref=$(git rev-parse HEAD)\" --jq .content | base64 -d | grep -cF 'new_branches, branch_inventory = judge_tree(repo_root, request.base_ref)' | grep -qx 1"
        cwd: "${OMNI_HOME}/omnimarket"
