schema_version: 1.0.0
ticket_id: OMN-24517
title: Retire 18 unused context and compaction nodes
summary: Retire 14 omnimarket nodes that the unused-node surveys found with no caller and that were searched again by meaning across the core, interface, infrastructure, market and client repositories and the plugin skills. The node directories, their own tests, their package entry points, their rows in the duration record and the baselines that listed them are removed. No check is widened and no ratchet is lowered other than rows of the removed nodes.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24517-retire
  statement: Each listed node has no caller, schedule, skill, workflow, import, contract dependency or topic partner outside its own tests and registry rows, and is removed with those rows.
  acceptance:
  - id: AC1
    statement: 'AC1: the 18 listed nodes are absent from the market code and from its package entry points -- falsifier: a grep for any of the listed names in pyproject.toml and src returns a hit'
  - id: AC2
    statement: 'AC2: the market lab test run for the change is green with no check widened -- falsifier: the lab runner exits non-zero on the pushed head'
  - id: AC3
    statement: 'AC3: integrated: the development runtime, once running this change, reports fewer deferred contracts than before in its ready read -- falsifier: the ready read still lists any of the listed names'
evidence_requirements:
- kind: tests
  description: The registry and baseline tests pass at the pushed head.
  command: uv run pytest tests/ci/test_retired_context_nodes_omn24517.py tests/ci/test_entry_points_sorted_merge.py tests/ci/test_node_entry_point_guard_wiring.py tests/ci/test_canonical_file_shape_burndown_omn21524.py tests/gates/test_contract_publish_parity.py tests/ci/test_imperative_contract_guard_caller_omn21002.py -q -n 0 --no-cov -p no:cacheprovider
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24517-ac1
  description: 'AC1: none of the 14 node directories exists and none of their entry points remains in pyproject.toml at the head. The ticket text counts the first-pass list; this change retires the 14 named in the pull request after an age and overlap exclusion.'
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: command
    check_value: sh -c 'for n in node_context_adr_select_compute node_context_compaction_receipts_fold_compute node_context_doc_section_select_compute node_context_experiment_compute node_context_exploration_policy_compute node_context_gate_cascade_compute node_context_invariants_select_compute node_context_role_adoption_verdict_compute node_context_round_one_eval_compute node_context_source_git_effect node_delegation_context_pack_budget_compute node_design_plan_context_compute node_report_format_compute node_checkpoint_capture_effect; do test ! -e src/omnimarket/nodes/$n || exit 1; grep -q "^$n = " pyproject.toml && exit 1; done; exit 0'
    cwd: .
  - check_type: test_passes
    check_value: uv run pytest tests/ci/test_retired_context_nodes_omn24517.py -q --no-cov -n 0
    cwd: .
- id: dod-omn24517-ac2
  description: 'AC2: the entry point, baseline and allowlist tests pass at the head.'
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/ci/test_retired_context_nodes_omn24517.py tests/ci/test_entry_points_sorted_merge.py tests/ci/test_node_entry_point_guard_wiring.py tests/ci/test_canonical_file_shape_burndown_omn21524.py tests/gates/test_contract_publish_parity.py tests/ci/test_imperative_contract_guard_caller_omn21002.py -q -n 0 --no-cov -p no:cacheprovider
    cwd: .
- id: dod-omn24517-integration-proof
  description: 'lab proxy: the entry point, baseline and allowlist tests run on a lab host at the pushed head; the ready read of the development runtime after the install is taken by the orchestrator and is not claimed by this local check'
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24517 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/ci/test_retired_context_nodes_omn24517.py tests/ci/test_entry_points_sorted_merge.py tests/ci/test_node_entry_point_guard_wiring.py tests/ci/test_canonical_file_shape_burndown_omn21524.py tests/gates/test_contract_publish_parity.py tests/ci/test_imperative_contract_guard_caller_omn21002.py -q --no-cov -p no:randomly
    cwd: .
- id: dod-omn24517-ac3
  description: 'hosted proxy for AC3: the registry tests pass; the ready read of the development runtime is taken after the merge and recorded on the pull request.'
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/ci/test_retired_context_nodes_omn24517.py tests/ci/test_entry_points_sorted_merge.py tests/ci/test_node_entry_point_guard_wiring.py tests/ci/test_canonical_file_shape_burndown_omn21524.py tests/gates/test_contract_publish_parity.py tests/ci/test_imperative_contract_guard_caller_omn21002.py -q -n 0 --no-cov -p no:cacheprovider
    cwd: .
