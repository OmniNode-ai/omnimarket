schema_version: 1.0.0
ticket_id: OMN-24351
title: 'Closer import cycle stays gone: test that fails on any cycle in the ticket closer node'
summary: 'Code scanning flagged py/unsafe-cyclic-import on the scheduled ticket closer (handler and bound profile importing each other, the back-import guarded by TYPE_CHECKING). The protocols moved to
  their own module in omnimarket#6096. This change adds the test that keeps it that way: it reads every import statement of the closer node''s handler modules, guarded or inside a function included, fails
  on any cycle through them, shows by two controls that both guarded forms are seen, and imports each closer module alone in a fresh interpreter.'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24351-no-cycle
  statement: No import cycle runs through the scheduled ticket closer's modules, and a test fails when one returns.
  acceptance:
  - id: AC1
    statement: 'AC1: a test reads every import statement (guarded by TYPE_CHECKING or inside a function included) of the closer node''s handler modules and fails on any import cycle through them, with controls
      showing both guarded forms are seen -- falsifier: pytest tests/nodes/node_ticket_closer_scheduled_effect/test_import_cycle.py -k ''control or no_closer_module'' -q'
  - id: AC2
    statement: 'AC2: the test fails against the closer handler files as they stood before the cycle fix and passes on the current files -- falsifier: run the same test with bound_profile.py and handler_ticket_closer_scheduled.py
      taken from commit d73f68c804 and read it red'
  - id: AC3
    statement: 'AC3: every closer handler module imports alone in a fresh interpreter -- falsifier: pytest tests/nodes/node_ticket_closer_scheduled_effect/test_import_cycle.py -k imports_alone -q'
  - id: AC4
    statement: 'AC4: integrated: in the running dev runtime the closer node loads without an import error and publishes a ticket-closer-result event within one run interval of a tick -- falsifier: a runtime
      log line naming an import error for node_ticket_closer_scheduled_effect, or no ticket-closer-result event on the dev bus within 900 s of a tick'
evidence_requirements:
- kind: tests
  description: The import cycle test passes at the pushed head.
  command: uv run pytest tests/nodes/node_ticket_closer_scheduled_effect/test_import_cycle.py -q -n 0 --no-cov -p no:cacheprovider
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
