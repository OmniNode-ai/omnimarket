  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_ticket_closer_scheduled_effect/test_import_cycle.py -k no_closer_module -q -n 0 --no-cov -p no:cacheprovider
    cwd: .
- id: dod-omn24351-ac3
  description: 'AC3: each closer module imports alone in a fresh interpreter.'
  source: manual
