    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24351 --kind test -- env PYTHONDONTWRITEBYTECODE=1
      uv run --frozen pytest tests/nodes/node_ticket_closer_scheduled_effect -q --no-cov
