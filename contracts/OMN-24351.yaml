  description: 'AC1: the graph reader and its two controls, and the cycle test over the real closer modules, pass.'
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_ticket_closer_scheduled_effect/test_import_cycle.py -k 'control or no_closer_module' -q -n 0 --no-cov -p no:cacheprovider
    cwd: .
- id: dod-omn24351-ac2
  description: 'AC2: the cycle test over the real closer modules passes on the current files; at the merge base the test file does not exist, so the must-fail control fails there.'
  source: manual
