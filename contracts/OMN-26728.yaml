schema_version: "1.0.0"
ticket_id: OMN-26728
title: "Each of the eight delegation tiers completes one real lane task with a receipt naming its harness and model"
summary: >
  Eight tiers drafted sections of one real pull request body on host h051 on 2026-11-28; seven returned a receipt
  with outcome done, the Codex tier was refused with the typed HarnessPlacementRefused. Each output has a recorded
  used, edited or refused verdict.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-omn26728-eight-tier-receipts"
    statement: "Each delegation tier returns a receipt for one real lane task, and each output has a verdict."
    acceptance:
      - id: "AC1"
        statement: "AC1: one real lane task is sent through each of the eight tiers and each returns a receipt naming the harness, the model, the effort and the outcome -- falsifier: the lane report lists fewer than eight receipts or a receipt without a harness and model"
      - id: "AC2"
        statement: "AC2: each receipt's output was used or edited, and the report says which -- falsifier: a receipt with no used or edited verdict"
      - id: "AC3"
        statement: "AC3: a tier that fails names its typed refusal and has a ticket or a pull request for the fix -- falsifier: a failed tier with no refusal reason or no fix reference"
evidence_requirements:
  - kind: tests
    description: "The contract test reads the receipts, verdicts and refusal recorded in dod_evidence and refuses a contract missing one."
    command: uv run --frozen pytest tests/contracts/test_omn26728_tier_receipts.py -q -n 0 --no-cov -p no:randomly
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
