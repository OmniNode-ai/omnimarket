---
schema_version: "1.0.0"
ticket_id: "OMN-21646"
title: "Lanes' onex scm pr-create and pr-comment wait out a recreate of the dev lane's github write consumer instead of failing with no consumer"
summary: >
  node_github_repo_write_effect is hosted by the effects runtime of the dev lane.
  When that container is recreated it holds no consumer for the command topic
  until it rejoins its group (103 seconds on 2026-10-31), and onex scm pr-create
  and pr-comment, which made one attempt, ended with no_terminal and
  reason=no_consumer_for_topic, so lanes opened pull requests with gh. A write
  that finds no consumer on its command topic is now republished with the same
  idempotency key and a fresh correlation id, up to three attempts with the
  gateway reads' 20 second pause. A write whose consumer is present but unanswered,
  whose consumer evidence is unreadable, or whose bus does not open is not
  republished.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-omn21646-wait-out-recreate"
    statement: "A write finding no consumer on its command topic is republished to the rejoined consumer and writes once."
    acceptance:
      - id: "AC1"
        statement: "AC1: onex scm pr-create and pr-comment, finding no consumer on the write command topic, republish the same command with the same idempotency key and a fresh correlation id for at most three attempts with a 20 second pause, report the attempts count, and exit 75 with reason no_consumer_for_topic when all three find none -- falsifier: uv run pytest tests/unit/handlers/scm/test_onex_scm_command.py -k write_retries_when_no_consumer fails"
  - id: "req-omn21646-no-blind-republish"
    statement: "A write that may already be running is never republished."
    acceptance:
      - id: "AC2"
        statement: "AC2: a write whose consumer is present but unanswered, whose consumer evidence is unreadable, or whose bus does not open makes one attempt and is never republished -- falsifier: uv run pytest tests/unit/handlers/scm/test_onex_scm_command.py -k write_is_not_republished fails"
evidence_requirements:
  - kind: "tests"
    description: "The recreate window of 2026-10-31 (no consumer, then one rejoins) completes on the second attempt; every other unanswered write is attempted once."
    command: "uv run pytest tests/unit/handlers/scm/test_onex_scm_command.py -q --no-cov"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn21646-retry"
    description: "A write that finds no consumer is republished and completes on the rejoined consumer, or exits 75 after three attempts."
    source: "manual"
    binds_ac: ["AC1"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/handlers/scm/test_onex_scm_command.py -k write_retries_when_no_consumer -q --no-cov"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn21646-no-blind-republish"
    description: "A present consumer, unreadable evidence and an unopened bus each make one attempt."
    source: "manual"
    binds_ac: ["AC2"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/handlers/scm/test_onex_scm_command.py -k write_is_not_republished -q --no-cov"
        cwd: "${OMNI_HOME}/omnimarket"
