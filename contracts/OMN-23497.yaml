schema_version: 1.0.0
ticket_id: OMN-23497
title: The board names a failed ledger answer to a good secrets reading
summary: The floor fold read a downstream typed failure under an upstream success as nothing, so join J5 (piece 5 secrets to piece 6 ledger) read error only and "no cycle has run both" while 65 of its 66 runs since 2026-11-08 had ended in a piece 6 failure chain. The fold now names each such answer with the failure code and the join reads broken, for a join whose overlay sets names_failed_answers; the test fixture overlay sets it on J5 alone.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23497-failed-answer
  statement: A piece 6 typed failure under a piece 5 success is a named finding of join J5 with the failure code, and a join whose overlay does not set names_failed_answers reads as before.
  acceptance:
  - id: AC1
    statement: 'AC1: a ledger-side typed failure under a secrets success is named by the floor fold with the failure code, and the join reads broken -- falsifier: tests/nodes/node_floor_emission_compute/test_join_downstream_failed_after_success.py fails when the handler is the origin/dev one'
  - id: AC2
    statement: 'AC2: only a join whose overlay declares names_failed_answers changes reading, and the overlay declares it on J5 alone -- falsifier: the control test with the flag off still reads not_run, and the overlay test fails if a second join declares it'
  - id: AC3
    statement: 'AC3: integrated: after the branch is installed on the publishing host and the overlay change is on overlays main, the served floor-simple.json cause join:J5 detail names the failure code of the ledger-side answers -- falsifier: the cause detail still reads "no cycle has run both"'
evidence_requirements:
- kind: tests
  description: The new fold tests and the J5 floor tests at the pushed head. With the handler file restored to origin/dev, six of them fail.
  command: python -m pytest tests/nodes/node_floor_emission_compute/test_join_downstream_failed_after_success.py tests/unit/nodes/node_work_ledger_append_effect/test_join_j5.py tests/unit/nodes/node_work_ledger_append_effect/test_join_j5_runtime.py -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23497-ac1-fold-tests
  description: The new fold test file passes at the pushed head, including the finding with the failure code and the flag-off control; two of its tests fail on the origin/dev handler.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_floor_emission_compute/test_join_downstream_failed_after_success.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn23497-ac2-only-j5
  description: The overlay test and the flag-off control pass, and the J5 floor tests read broken with the flag on.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_floor_emission_compute/test_join_downstream_failed_after_success.py tests/unit/nodes/node_work_ledger_append_effect/test_join_j5.py tests/unit/nodes/node_work_ledger_append_effect/test_join_j5_runtime.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn23497-j5-floor
  description: The served floor's cause join:J5 names the failure code. Hosted CI cannot reach the floor host (the URL is in FLOOR_SIMPLE_URL), so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  binds_ac:
  - AC3
  checks:
  - check_type: command
    check_value: "curl -s -m 20 \"${FLOOR_SIMPLE_URL:?set FLOOR_SIMPLE_URL to the served floor-simple.json}\" | python3 -c \"import json,sys; d=json.load(sys.stdin); c=[x for x in d['causes'] if x['id']=='join:J5'][0]; sys.exit(0 if 'downstream_failed_after_upstream_succeeded' in c['detail'] else 1)\""
    cwd: .
- id: dod-omn23497-integration-proof
  description: The pushed head ran the new fold tests and the J5 floor tests on a lab host through the lab work runner and exited 0. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: 'env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23497 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_floor_emission_compute/test_join_downstream_failed_after_success.py tests/unit/nodes/node_work_ledger_append_effect/test_join_j5.py -q --no-cov'
    cwd: .
