schema_version: 1.0.0
ticket_id: OMN-24687
title: The architecture graph query node answers from h051, h053 and the operator Mac, with ARCH_GRAPH_BOLT_URI declared once in the overlay both nodes read
summary: The two architecture graph nodes read only ${env.ARCH_GRAPH_BOLT_URI}, which the dev lane runtime policy binds for containers and nothing binds for a lab host or the Mac. This change adds the per-host arch_graph_bolt overlay reader (the shape of the projection read binding host overlay, OMN-23994) that both nodes call after the variable. Only AC2 is listed below, because only AC2 is proved by a hosted test of this repository. The four criteria this contract no longer lists are carried elsewhere, and none is bound to a hosted test here. AC1 (the node count read from the running Memgraph service), AC4 (the graph brought up and populated on the dev lane) and AC5 (a timed graph query answer from a lab host) are live-service outcomes, unmet because the Bolt service omnibase-infra-memgraph was read down on every lab host on 2026-11-16; they are carried by the ticket OMN-24687, which stays open, and by the unbound local reachability item dod-omn24687-ac1-ac4-ac5-unmet. AC3 (a test of the declared overlay that fails when the entry for a lab host or the Mac is missing) is carried by the overlays repository, in tests/test_arch_graph_bolt_overlay.py of overlays#577, and by the unbound local item dod-omn24687-ac3-overlays-test that runs it on a lab host. The local done gate items carry no binds_ac, since the hosted receipt gate runs a local_done_gate item at neither the head nor the merge base, so they stay as unbound local evidence.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24687-reach
  statement: The two architecture graph nodes resolve a Bolt URI on h051, h053 and the operator Mac from one declared overlay, and answer a query there.
  acceptance:
  - id: AC2
    statement: 'AC2: the address of that service is declared once in the declared overlay or env source the two nodes read, never a hand-edited host env file, so that ARCH_GRAPH_BOLT_URI resolves on h051, h053 and the operator Mac -- falsifier: the nodes own config resolver run on each of the three hosts prints the same bolt uri and the unbound-variable error no longer occurs'
evidence_requirements:
- kind: tests
  description: The host overlay resolution tests.
  command: env -u PYTHONPATH uv run --frozen pytest tests/handlers/test_arch_graph_bolt_host_overlay.py -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24687-ac2-resolution
  description: The per-host overlay row resolves for each declared host, the variable wins, and a host with no row or a broken overlay fails closed. Uses a synthetic overlay, so it proves the resolver (AC2) and not the shipped overlay file (AC3, owned by the overlays repository).
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/handlers/test_arch_graph_bolt_host_overlay.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24687-integration-proof-h051
  description: Unbound local evidence for AC2. Hosted CI cannot reach a lab host. The local Done gate runs the query node's own config resolver on h051 with no ARCH_GRAPH_BOLT_URI set and requires the printed address to start with bolt; it fails while h051 has no row in the arch_graph_bolt overlay.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: onex lab-work run --host h051 --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24687-h051 --kind test -- sh -c 'env -u ARCH_GRAPH_BOLT_URI uv run --frozen python -c "from omnimarket.nodes.node_architecture_graph_query_effect.models import ModelArchitectureGraphQueryConfig as C; print(C().bolt_uri)" | grep -q ^bolt'
    cwd: .
- id: dod-omn24687-integration-proof-h053
  description: The same local Done gate check pinned to h053, so a placement on a host with no row cannot give a false red and a printed string that is not a Bolt URI cannot pass.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: onex lab-work run --host h053 --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24687-h053 --kind test -- sh -c 'env -u ARCH_GRAPH_BOLT_URI uv run --frozen python -c "from omnimarket.nodes.node_architecture_graph_query_effect.models import ModelArchitectureGraphQueryConfig as C; print(C().bolt_uri)" | grep -q ^bolt'
    cwd: .
- id: dod-omn24687-ac3-overlays-test
  description: Unbound local evidence for AC3, which is not listed in acceptance. AC3 is owned by the overlays repository (overlays#577, tests/test_arch_graph_bolt_overlay.py), which tests the shipped overlay file. Hosted CI of this repository cannot run that suite, so the local Done gate runs it on a lab host at origin/main of the declared overlays clone, which holds the overlay file once overlays#577 has merged.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: onex lab-work run --repo OmniNode-ai/overlays --sha "$(git -C "$OMNI_HOME/../overlays" rev-parse origin/main)" --lane dod-omn24687-ac3-overlays --kind test -- uv run --no-project --with pytest --with pyyaml pytest -q -k arch_graph_bolt tests/test_arch_graph_bolt_overlay.py
    cwd: .
- id: dod-omn24687-ac1-ac4-ac5-unmet
  description: Unbound local evidence for AC1, AC4 and AC5, which are not listed in acceptance. They are live-service outcomes and stay unmet. This check resolves the declared address and opens a TCP connection to it; it reads red while no Bolt service answers there and turns green only once one does. It proves the service answers, not that the graph is populated or queried.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env -u ARCH_GRAPH_BOLT_URI uv run --frozen python -c "import socket; from urllib.parse import urlsplit; from omnimarket.handlers.arch_graph_bolt_host_overlay import resolve_arch_graph_bolt_uri as r; u = urlsplit(r()); socket.create_connection((u.hostname, u.port or 7687), 10)"
    cwd: .
