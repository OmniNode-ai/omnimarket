schema_version: 1.0.0
ticket_id: OMN-24687
title: The architecture graph query node answers from h051, h053 and the operator Mac, with ARCH_GRAPH_BOLT_URI declared once in the overlay both nodes read
summary: The two architecture graph nodes read only ${env.ARCH_GRAPH_BOLT_URI}, which the dev lane runtime policy binds for containers and nothing binds for a lab host or the Mac. This change adds the per-host arch_graph_bolt overlay reader (the shape of the projection read binding host overlay, OMN-23994) that both nodes call after the variable. AC1, AC4 and AC5 are live-service outcomes (the Bolt service was read down on 2026-11-16) carried by the ticket and the lane report, not by this code change.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24687-reach
  statement: The two architecture graph nodes resolve a Bolt URI on h051, h053 and the operator Mac from one declared overlay, and answer a query there.
  acceptance:
  - id: AC2
    statement: 'AC2: the address of that service is declared once in the declared overlay or env source the two nodes read, never a hand-edited host env file, so that ARCH_GRAPH_BOLT_URI resolves on h051, h053 and the operator Mac -- falsifier: the nodes own config resolver run on each of the three hosts prints the same bolt uri and the unbound-variable error no longer occurs'
  - id: AC3
    statement: 'AC3: a test of the declared overlay fails when the ARCH_GRAPH_BOLT_URI entry for a lab host or the Mac is missing and passes when it is present, written red first -- falsifier: uv run pytest -q -k arch_graph_bolt in the repository that owns the overlay'
evidence_requirements:
- kind: tests
  description: The host overlay resolution tests.
  command: env -u PYTHONPATH uv run --frozen pytest tests/handlers/test_arch_graph_bolt_host_overlay.py -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24687-ac2-ac3-resolution
  description: The per-host overlay row resolves for each declared host, the variable wins, and a host with no row or a broken overlay fails closed.
  source: manual
  binds_ac:
  - AC2
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/handlers/test_arch_graph_bolt_host_overlay.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24687-integration-proof
  description: Hosted CI cannot reach a lab host. The local Done gate runs the query node's own config resolver on a lab host with no ARCH_GRAPH_BOLT_URI set; it fails while the host has no row in the arch_graph_bolt overlay.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24687 --kind test -- sh -c 'env -u ARCH_GRAPH_BOLT_URI uv run --frozen python -c "from omnimarket.nodes.node_architecture_graph_query_effect.models import ModelArchitectureGraphQueryConfig as C; print(C().bolt_uri)"'
    cwd: .
