schema_version: 1.0.0
ticket_id: OMN-22579
title: The worktree reconcile node's host overlay lives in the overlay home and runs on a timer on h051, h053 and h201
summary: The host rows are in the overlay home (overlays#12) and the node's timer runs on h051, h053 and h201. A directory under a registry root that holds a .git directory was dropped from discovery, so h201 scanned 12 of the entries under its root; it is now counted, a clone there goes to a person and a sandbox's leftover directory is an orphan directory, and neither is removed.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn22579-overlay-timer-root
  statement: A run counts every entry under its registry root, including a directory that holds a .git directory. The overlay and timer parts of the ticket are merged elsewhere (overlays#12) and are not changed here.
  acceptance:
  - id: AC4
    statement: 'AC4: h201 scans the trees under its real registry root, not 15 -- falsifier: the h201 latest.json reports scanned equal to the trees under the registry root''s omni_worktrees directory plus its empty directories'
evidence_requirements:
- kind: tests
  description: The worktree reconcile effect and schedule tests pass.
  command: uv run --frozen pytest tests/test_worktree_reconcile_effect.py tests/test_worktree_reconcile_schedule.py -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn22579-ac4-git-dirs-counted
  description: A clone and a sandbox's leftover .git directory under a registry root are discovered beside a linked worktree, and neither classifies as a removal; at the merge base only the linked worktree is discovered and the test fails.
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/test_worktree_reconcile_effect.py -q --no-cov -k a_git_directory_under_a_registry_root_is_counted
    cwd: .
- id: dod-omn22579-integration-proof
  description: Run the discovery test at the pushed head on a lab host. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-22579 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/test_worktree_reconcile_effect.py -q --no-cov -k a_git_directory_under_a_registry_root_is_counted
    cwd: .
