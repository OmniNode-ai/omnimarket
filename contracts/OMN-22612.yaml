schema_version: 1.0.0
ticket_id: OMN-22612
title: The standing-rule admission nodes are taken back out of omnimarket until M0 passes
summary: Reverts omnimarket#5062, which added node_dispatch_standing_rules_compute and node_dispatch_standing_rules_effect. The rebuild plan bars any stop, admission or holder implementation before M0 has a PASS verdict, and nothing calls the nodes.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn22612-nodes-removed
  statement: No onex.nodes entry point, node directory, model, protocol, CI step or pre-commit hook names the standing-rule admission nodes.
  acceptance:
  - id: AC1
    statement: 'AC1: on the branch head no onex.nodes entry point, node directory, model, protocol or CI and pre-commit step names the standing-rule admission nodes -- falsifier: git grep -nE "dispatch_standing_rules|standing_rules_io|models/standing_rules" -- . '':!contracts'' exits 1'
- id: req-omn22612-control
  statement: The same entry-point count read before the revert shows 2 and after it shows 0, so the reading can fail.
  acceptance:
  - id: AC2
    statement: 'AC2: the control on dev before the revert shows both entry points present and the nodes'' own 32 tests passing, and the branch head shows 0 entry points, run on a lab host -- falsifier: the same entry-point count read from pyproject.toml at origin/dev prints 2, at the branch head prints 0'
- id: req-omn22612-checks-hold
  statement: The checks that read the entry points and the node wiring still pass without the nodes.
  acceptance:
  - id: AC3
    statement: 'AC3: the entry-point format check, the node metadata dependency check, the auto-wiring test and the overlay dependency tests pass on the branch head on a lab host -- falsifier: uv run --frozen pytest tests/unit/contracts/test_every_node_auto_wires_in_process_omn17427.py -q --no-cov'
evidence_requirements:
- kind: tests
  description: The auto-wiring test passes without the standing-rule admission nodes
  command: uv run --frozen pytest tests/unit/contracts/test_every_node_auto_wires_in_process_omn17427.py -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn22612-nodes-absent-test
  description: A test reads pyproject.toml and the nodes directory and fails while either standing-rule node is present, as it does at the merge base.
  source: manual
  binds_ac:
  - AC1
  - AC2
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/contracts/test_standing_rule_nodes_absent_omn22612.py -q --no-cov
    cwd: .
- id: dod-omn22612-entry-point-count
  description: The count of standing-rule entry points in pyproject.toml is 0 at the branch head. The control read at origin/dev before the revert prints 2, so the reading can fail.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: command
    check_value: test "$(grep -cE '^node_dispatch_standing_rules_(compute|effect) =' pyproject.toml)" = 0
    cwd: .
- id: dod-omn22612-integration-proof
  description: Run this pull request's own check on a lab host at the pushed head. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-22612 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/contracts/test_every_node_auto_wires_in_process_omn17427.py -q --no-cov
    cwd: .
