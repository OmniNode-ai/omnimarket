schema_version: 1.0.0
ticket_id: OMN-23393
title: The landing controller's shell is ported onto the landing nodes, and the script shrinks to a shim and is deleted
summary: The first pull request of rebuild piece 9 adds the inventory that maps each of the controller script's 218 functions to an existing node, a node to build, or dead code, and the landing workflow contract composed from the existing landing nodes. A test holds the inventory's counts and node names, each workflow step's node and command topic, and the replay of every recorded scenario tick (S1 to S20 and later) through the tick orchestrator.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23393-inventory
  statement: An inventory maps every function of the controller script to an existing node, a node to build, or dead code, and the landing workflow is composed from those nodes in a contract whose steps name existing nodes and their own command topics.
  acceptance:
  - id: AC1
    statement: 'AC1: an inventory maps every function of the controller script to an existing node, a node to build, or dead code, with the landing workflow composed from those nodes -- falsifier: a controller function absent from the inventory'
evidence_requirements:
- kind: tests
  description: The landing workflow and inventory test (counts, node names, topics, the to-build and private-move lists, and the replay of every recorded scenario tick)
  command: uv run --frozen pytest tests/unit/contracts/test_landing_workflow_inventory.py tests/nodes/node_pr_landing_tick_orchestrator/test_tick_github_writer.py -q --no-cov -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23393-inventory-workflow
  description: Runs the landing workflow and inventory test. It reads 218 inventory rows whose counts match the header, every workflow step's node and command topic in that node's contract, and every recorded scenario tick replaying equal. The inventory and the workflow contract are absent at the merge base, so the command fails there.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/contracts/test_landing_workflow_inventory.py -q --no-cov -p no:randomly
    cwd: .
- id: dod-omn23393-tick-writer
  description: Runs the act-mode tick writer test. A recorded tick whose decision merges two PRs, in an enabled act mode with the writer, sends two arm commands on the GitHub landing effect's own command topic, each pinned to its head; an action outside the cutover repository, a non-GitHub action, a missing node id, a missing run id and a moved head are each refused by name; act mode the overlay does not enable sends nothing. The writer is absent at the merge base, so the command fails there.
  source: manual
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_pr_landing_tick_orchestrator/test_tick_github_writer.py -q --no-cov -p no:randomly
    cwd: .
- id: dod-omn23393-integration-proof-lab
  description: Runs the landing workflow and inventory test at the pushed head on a lab host through the lab work runner. Hosted CI cannot reach the lab runner, so only the local Done gate runs this unbound item.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: 'env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23393 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/contracts/test_landing_workflow_inventory.py -q --no-cov -p no:randomly'
    cwd: .
