schema_version: 1.0.0
ticket_id: OMN-23883
title: A verified list of past tasks to measure the local coding models on
summary: >-
  Adds node_code_eval_suite_census_compute and the committed suite benchmarks/code_eval_suite/suite.v1.json: real, already-merged tickets of omnimarket, omnibase_core and omnibase_infra whose contracts bind runnable checks, each with its base commit, diff size, size band, checks and the verdict of the merged scorer node's control (the checks fail at the base and pass with the merged change). The node counts the suite per band and per repository, lists the excluded tasks with their reason, reports the shortfall of each band against the sample size the capability line asks for, and renders the candidate rows the trial driver's run request takes. The line is read from the node's own overlay; the contract holds no value.
is_seam_ticket: true
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23883-suite
  statement: The suite lists only tasks whose control holds, counts them per band and repository against the required sample sizes, and renders candidates the trial driver accepts.
  acceptance:
  - id: AC1
    statement: 'AC1: every task in the suite names its repository, merge commit, base commit, ticket contract, diff size, size band and bound checks, and carries the verdict of the scoring step''s control; the suite reader refuses a task whose control verdict is not pass -- falsifier: uv run pytest tests/nodes/node_code_eval_suite_census_compute/test_failing_controls.py -q'
  - id: AC2
    statement: 'AC2: the count of tasks per size band and per repository, the excluded tasks with their reason, and the shortfall against the required number per band are answered by the node from the committed suite -- falsifier: uv run pytest tests/nodes/node_code_eval_suite_census_compute/test_committed_suite.py -q'
  - id: AC3
    statement: 'AC3: the candidates the node renders are accepted unchanged by the trial driver''s run request model -- falsifier: uv run pytest tests/nodes/node_code_eval_suite_census_compute/test_seam_trial_driver_candidate.py -q'
  - id: AC4
    statement: 'AC4: integrated: the census node run in the dev runtime from its branch answers the same counts as the recount -- falsifier: the answer read from the dev bus by its correlation id beside the recount, recorded on this ticket'
evidence_requirements:
- kind: tests
  description: The node's golden chain, error chain, failing-control, overlay, seam and committed-suite tests.
  command: uv run --frozen pytest tests/nodes/node_code_eval_suite_census_compute -q --no-cov -p no:cacheprovider
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23883-ac1-control
  description: 'A task whose control is fail_check, any fail_* verdict or unscorable never reaches the candidates or an admitted count, and a task model refuses a pass with a source and an unscorable without one. It reads red at the merge base, where the node does not exist.'
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_code_eval_suite_census_compute/test_failing_controls.py -q --no-cov -p no:cacheprovider
    cwd: .
- id: dod-omn23883-ac2-committed-suite
  description: 'The committed suite file validates as the node request, every task in it is recounted by the test from the raw rows (per band, per repository, per band and repository, excluded reasons) and the node answers the same counts; a planted wrong count turns it red.'
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_code_eval_suite_census_compute/test_committed_suite.py -q --no-cov -p no:cacheprovider
    cwd: .
- id: dod-omn23883-ac3-seams
  description: 'The candidate shape is pinned against the trial driver''s ModelCodeEvalCandidate (read from its branch) and the control typing against the scorer''s verdict and source enums; each fails when either side changes a field or a member.'
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_code_eval_suite_census_compute/test_seam_trial_driver_candidate.py tests/nodes/node_code_eval_suite_census_compute/test_seam_scorer_verdict.py tests/nodes/node_code_eval_suite_census_compute/test_overlay_keys.py -q --no-cov -p no:cacheprovider
    cwd: .
- id: dod-omn23883-chains
  description: 'Golden chain: a fixed request answers the exact counts, candidates and required sample sizes of the fixture line. Error chain: an empty task list, a repeated task and an unavailable overlay each end as a typed failure with no candidates.'
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_code_eval_suite_census_compute -q --no-cov -p no:cacheprovider
    cwd: .
- id: dod-deploy-omn23883-node-declared
  description: 'Hosted structural probe: the node''s contract declares the command topic and the answer topic at the checked-out head. It fails at the merge base, which holds no such node.'
  source: manual
  checks:
  - check_type: command
    check_value: grep -F 'code-eval-suite-census-requested.v1' src/omnimarket/nodes/node_code_eval_suite_census_compute/contract.yaml && grep -F 'code-eval-suite-census-measured.v1' src/omnimarket/nodes/node_code_eval_suite_census_compute/contract.yaml
    cwd: .
- id: dod-omn23883-ac4-integration-proof
  description: On a lab host, from the pushed head, the committed suite is published as a request on the dev bus and the answer event is read back by the request's correlation id. Hosted CI cannot reach a lab host, so this unbound check belongs to the local Done gate; AC4 is read there and in the PR's lab comment.
  source: manual
  binds_ac:
  - AC4
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: 'env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23883 --kind test -- uv run --frozen pytest tests/nodes/node_code_eval_suite_census_compute -q --no-cov'
    cwd: .
