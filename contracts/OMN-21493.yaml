schema_version: 1.0.0
ticket_id: OMN-21493
title: 'T-R2: release grant read and the release-gate required check'
summary: node_release_grant_read_effect (operation read_release_grant, with record_authorization_receipt
  and check_release_gate) reads a change's label and push history through the change source, accepts a
  grant only from a person in a grantor role list of the release_gate overlay who applied the label after
  the current head was pushed and did not remove it, writes the authorization receipt at merge, and runs
  the release-gate check fresh at the check, the merge and the release. The required-check workflow and
  ruleset wiring wait for the delivery bootstrap and the release path enforcement tasks.
is_seam_ticket: false
interface_change: true
interfaces_touched:
- public_api
requirements:
- id: req-omn21493-release-grant-read
  statement: A grant is read from the change's history, bound to one head and one repository; an unreadable
    history blocks.
  acceptance:
  - id: AC1
    statement: 'AC1: A label applied by a role holder after the head''s last push is a grant, and the
      same label applied before a later push is not -- falsifier: two pytest cases, the second with a
      push event after the label event'
  - id: AC2
    statement: 'AC2: The label applied by an agent identity, by an app or bot account, or by a login in
      neither role list is not a grant -- falsifier: three pytest cases'
  - id: AC3
    statement: 'AC3: The grant label''s name written in the pull request body or a comment is not a grant
      -- falsifier: the pytest case'
  - id: AC4
    statement: 'AC4: A grant whose label was later removed is not a grant -- falsifier: the pytest case
      with an unlabel event'
  - id: AC5
    statement: 'AC5: An unreadable label history is `blocked` and the required check fails closed -- falsifier:
      a change source that raises on the label read'
  - id: AC6
    statement: 'AC6: A grant that was green and is then revoked stops the merge and the release: grant,
      successful check, label removed, attempted merge and attempted release both refuse -- falsifier:
      the pytest case over the local host with the re-run on the unlabel event and the fresh read at each
      boundary'
  - id: AC7
    statement: 'AC7: A pull request that edits the gate''s workflow file, its caller or the overlay file
      in its own head does not change what runs or what is read: the gate evaluates the base side and
      the private overlay -- falsifier: three pytest cases that edit each in the head and still get the
      refusal'
  - id: AC8
    statement: 'AC8: The train is recognised by the identity the run carries, and an agent run named like
      the train, on the train''s branch name, is refused -- falsifier: the pytest case with a matching
      actor string and branch and a different run identity'
  - id: AC9
    statement: 'AC9: A grant is bound to one head commit and one repository: the same label on another
      pull request does not admit this one. At merge, the effect writes an authorization receipt that
      links the repository, the pull request, the granted head, the resulting merge commit, the grant
      event''s id and the overlay''s policy digest -- falsifier: the pytest case, and one receipt case
      each for squash, merge and rebase'
  - id: AC10
    statement: 'AC10: Configuration: the label name, the role lists and the agent identities are the `release_gate`
      overlay (private); no login is in the node, a test or this plan -- falsifier: the repository''s
      public-name check passes and the same events give a different grant under a fixture overlay with
      different role lists'
  - id: AC11
    statement: 'AC11: Bindings: depends on BUS, LED, CHG and CLK through the contract''s `protocol_dependencies`,
      bound by the `factory_bindings` overlay -- falsifier: this task''s tests run under the `local` profile
      (the local git host records label events as ledger rows) and under the `lab` profile (recorded)
      through the parity run (T-B2) and assert identical grant facts; a stub change source that returns
      the label''s present state without its history makes the comparison fail'
