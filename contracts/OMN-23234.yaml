schema_version: 1.0.0
ticket_id: OMN-23234
title: The friction rollup names the unthrottled ram-spill copy row by its own text
summary: The FRICTION row of 2026-11-08T18:51Z about an unthrottled copy of a ram-spill directory that starved a host install matched none of the 48 shipped class rules, so it stayed in the floor's stoppage:unclassified row. This change adds one class rule to the node's shipped overlay example that names it from its own text, with an owner, and a test that runs the row through the rules as origin/dev holds them and reads it unclassified.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23234-bulk-copy-class-rule
  statement: The row that names an unthrottled rsync of the ram-spill directory is named by one shipped class rule that has an owner, and the same row reads as unclassified through the rules as they stood.
  acceptance:
  - id: AC1
    statement: 'AC1: the row that names an unthrottled rsync of the ram-spill directory is classed by the bulk-copy-on-host-array-starves-host-install rule and no other rule, and the node''s rule list as origin/dev holds it leaves that row unclassified -- falsifier: uv run --frozen pytest tests/nodes/node_friction_rollup_compute/test_class_rules_bulk_copy_2026_11_08.py -q --no-cov'
  - id: AC2
    statement: 'AC2: every earlier class rule test of the friction rollup node still passes at the pushed head -- falsifier: uv run --frozen pytest tests/nodes/node_friction_rollup_compute -q --no-cov'
  - id: AC3
    statement: 'AC3: the nine FRICTION rows written after 2026-11-08T19:46Z that the shipped rules left unclassified are each named by a shipped class rule with an owner (three by the existing prrp-snapshot-stale-on-lab-host class, six by new rules), and the rule list as origin/dev holds it leaves every one unclassified -- falsifier: uv run --frozen pytest tests/nodes/node_friction_rollup_compute/test_class_rules_unclassified_after_1946_2026_11_09.py -q --no-cov'
  - id: AC4
    statement: 'AC4: the five FRICTION rows that the split of the broad local-hooks rule left unclassified are each named by a shipped class rule with an owner (two by the existing hook-preflight-minutes-per-commit class, three by new rules), and the rule list as origin/dev holds it leaves every one unclassified -- falsifier: uv run --frozen pytest tests/nodes/node_friction_rollup_compute/test_class_rules_hook_split_leftovers_2026_11_09.py -q --no-cov'
