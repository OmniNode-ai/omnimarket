schema_version: 1.0.0
ticket_id: OMN-23387
title: The merge-queue pools are declared on two or more hosts in the overlay, a single-host declaration is refused, and no stop can empty the queue's second host
summary: The runner-group reading's private queue overlay becomes a list of pools, each with its runner name prefix, its host and its expected online runners, and a floor of two hosts. The settings refuse to load when the pools resolve to fewer hosts than the floor, the reading reads NOT WORKING when the online queue runners sit on fewer hosts than the floor, and a merge-group job on a runner of either pool proves the queue. The runner-stop idle proof gains the host of each pool and refuses a stop request that names queue runners when the queue runners left online would sit on fewer hosts than the floor. The live drill that stops one host's runners and the installer run on the second host are not part of this change.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23387-two-hosts
  statement: The queue pools read from the overlay span at least two hosts, the loader refuses a declaration that does not, and the stop gate refuses a stop that would leave one host.
  acceptance:
  - id: AC1
    statement: 'AC1: each repository''s merge-queue runners are declared on two or more hosts in the runner overlay -- falsifier: a repository whose merge-queue runner labels resolve to one host in the overlay'
  - id: AC2
    statement: 'AC2: a merge-group run succeeds with one runner host stopped -- falsifier: the drill''s merge-group run waits for a runner on the stopped host'
evidence_requirements:
- kind: tests
  description: The reading node's and the stop idle proof node's tests that name the two-host floor, one file each.
  command: uv run pytest src/omnimarket/nodes/node_runner_group_reading_compute/tests/test_merge_queue_pools_span_two_hosts.py -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23387-ac1-overlay
  description: The overlay declares the queue pools on two hosts, the settings refuse a declaration on one host or a floor below two, and the reading fails under the injected break that accepts one host.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest src/omnimarket/nodes/node_runner_group_reading_compute/tests/test_merge_queue_pools_span_two_hosts.py -q --no-cov
- id: dod-omn23387-ac1-stop-gate
  description: A stop request naming a whole host's queue runners is refused, a part of one host's runners is allowed, and the gate fails under the injected break that never counts the hosts left.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest src/omnimarket/nodes/node_runner_stop_idle_proof_compute/tests/test_queue_pool_spans_two_hosts_after_stop.py -q --no-cov
- id: dod-omn23387-ac2-reading
  description: At the typed reading only, not the live drill. With one host's pool stopped the group reads NOT WORKING and names the stopped host, and a merge-group job on a runner of the other host's pool still proves the queue. The drill that stops a host's runners and reads a real merge-group run is a separate step on the lab.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest src/omnimarket/nodes/node_runner_group_reading_compute/tests/test_merge_queue_pools_span_two_hosts.py -q --no-cov -k "one_host_stopped or a_job_proves_either_pool"
- id: dod-omn23387-integration-proof
  description: Run the two nodes' two-host tests on a lab host at the pushed head. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23387 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest src/omnimarket/nodes/node_runner_group_reading_compute/tests/test_merge_queue_pools_span_two_hosts.py src/omnimarket/nodes/node_runner_stop_idle_proof_compute/tests/test_queue_pool_spans_two_hosts_after_stop.py -q --no-cov
