    check_value: uv run pytest tests/nodes/node_integration_sweep_orchestrator/test_ssh_user_from_host_table.py -q --no-cov -k "argv or without_ssh_user"
    cwd: .
- id: dod-omn22621-ac2-accepted-20261125t1145z
  description: "AC2 binding (accepted 2026-11-25T1145Z, proposed by lane=dod-closeout-bind-2026-11-25T1145Z-c2, accepted by lane=dod-closeout-accept-2026-11-25T1145Z-c2). No .py file under src/omnimarket/nodes/node_integration_sweep_orchestrator has a quoted login literal before an at sign and a brace. Re-run at origin/dev 526156dd8f PASSED; the pattern matches two lines of surface_probes.py at the parent of 85d47ed4e4."
