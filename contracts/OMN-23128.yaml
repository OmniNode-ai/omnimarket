schema_version: 1.0.0
ticket_id: OMN-23128
title: T14 infra routing decisions node declares its handover from the retired consumer group
summary: >-
  node_projection_infra_routing_decisions replaces the omnibase_infra infra_routing_decisions consumer, which committed
  offsets under the bare group id infra-routing-decisions-postgres. Its contract named that group under the inert
  retired_consumer_group key, which the runtime subscribe preflight never reads. The contract now declares
  consumer_group_handover with from_group_id (OMN-21932) and from_auto_offset_reset earliest, and the inert key is removed.
  Retiring the old container is a later deploy step and is not part of this change.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23128-contract-handover
  statement: The node contract declares the handover from the retired consumer group in the shape the preflight reads.
  acceptance:
  - id: AC1
    statement: 'AC1: the node contract declares consumer_group_handover with from_group_id infra-routing-decisions-postgres and from_auto_offset_reset earliest, and no retired_consumer_group key remains -- falsifier: uv run pytest tests/test_golden_chain_projection_infra_routing_decisions.py -q -k handover, red on the base contract'
- id: req-omn23128-infra-model
  statement: omnibase_infra reads the declared block and names the old consumer's group in every environment.
  acceptance:
  - id: AC2
    statement: 'AC2: omnibase_infra''s ModelConsumerGroupHandover parses the declared block and source_group returns the old consumer''s default group id in every environment -- falsifier: uv run pytest tests/test_golden_chain_projection_infra_routing_decisions.py -q -k handover with a planted wrong group id failing it'
evidence_requirements:
- kind: tests
  description: The handover tests of the infra routing decisions node and the folded-writer handover test.
  command: uv run --frozen pytest tests/test_golden_chain_projection_infra_routing_decisions.py tests/test_omn21753_folded_writer_consumer_group_handover.py -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23128-ac1-contract-declares-handover
  description: >-
    The contract declares consumer_group_handover with from_group_id and from_auto_offset_reset earliest and carries no
    retired_consumer_group key. Fails at the merge base, whose contract carries the inert key and no handover block.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/test_golden_chain_projection_infra_routing_decisions.py -q --no-cov -k handover
    cwd: .
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/test_omn21753_folded_writer_consumer_group_handover.py -q --no-cov -k infra_routing
    cwd: .
- id: dod-omn23128-ac2-infra-model-parses
  description: >-
    omnibase_infra's ModelConsumerGroupHandover validates the declared block (extra keys are refused) and source_group
    returns infra-routing-decisions-postgres in dev, ci, qa and prod. A planted wrong group id fails the same
    check (the injected break).
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/test_golden_chain_projection_infra_routing_decisions.py -q --no-cov -k handover
    cwd: .
- id: dod-omn23128-integration-proof
  description: The handover tests run on a lab host at the pushed head through the lab-work node.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane t14node-d-1250 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/test_golden_chain_projection_infra_routing_decisions.py tests/test_omn21753_folded_writer_consumer_group_handover.py -q --no-cov
    cwd: .
