schema_version: "1.0.0"
ticket_id: "OMN-23403"
title: "The factory floor's lane list is read from a bus projection"
summary: "The simple floor drew its lanes from the work-state file that the work-state node wrote on the operator's Mac, so a lane that started on a lab host did not show until the Mac's record caught up. The work-state node now publishes its projection on a snapshot topic with the time it was built, the floor reads it from the projection reader's bundle, and the lanes of the newest publication are on the floor with no Mac record and no work-state file. A lane list older than its bound is a cause on the board and draws no lane."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
evidence_requirements:
  - kind: "tests"
    description: "The work-state publication and the floor's lane list read from the projection, with a lane planted as started on a lab host and the work-state file absent."
    command: "uv run --frozen pytest tests/nodes/node_work_state_projection_effect tests/nodes/node_floor_simple_effect/test_work_state_lanes_floor_simple.py -q --no-cov"
