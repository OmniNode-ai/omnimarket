schema_version: "1.0.0"
ticket_id: OMN-22809
title: "A node reads every declared copy of the lab host table and names each differing field per host with its value in each copy"
summary: >-
  node_host_table_copies_drift_compute reads the copies of the lab host table its overlay declares (the packaged table, the
  config overlay of the internal repository and the overlay home's copy), takes the copy paths from that overlay with no
  default (a missing overlay is refused), reports each differing field per host with its value in each copy, and appends one
  reading row the floor can show.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn22809-copies-drift
    statement: The copies of the lab host table are compared field by field per host, the paths come from the node's overlay, and the result is a reading row.
    acceptance:
      - id: AC1
        statement: 'AC1: three copies differing in one field of one host name the host, the field and each value, and identical copies report none -- falsifier: uv run --frozen pytest tests/nodes/node_host_table_copies_drift_compute -q --no-cov'
      - id: AC2
        statement: 'AC2: the copy paths come from the overlay and a missing overlay is refused -- falsifier: uv run --frozen pytest tests/nodes/node_host_table_copies_drift_compute -q --no-cov -k overlay'
      - id: AC3
        statement: 'AC3: a run on h053 over the three real copies reports the measured differences, and a planted cap change in a scratch copy is named -- falsifier: the READING and DIFF lines of the node run on h053, recorded in the pull request Lab line'
evidence_requirements:
  - kind: tests
    description: The node's focused tests, golden and error chain event tests, and the named breaks.
    command: uv run --frozen pytest tests/nodes/node_host_table_copies_drift_compute -q --no-cov
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-omn22809-drift-tests
    description: The node tests pass with the change; each named break turns its assertion red.
    source: manual
    execution_scope: hosted_and_local
    binds_ac: [AC1, AC2]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/nodes/node_host_table_copies_drift_compute -q --no-cov
        cwd: .
  - id: dod-omn22809-integration-proof-h053
    description: The node run on h053 over the three real copies; hosted CI cannot reach the lab copies, so only the local Done gate runs this unbound check; the h053 run is read in the pull request Lab line.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: 'env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-22809 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_host_table_copies_drift_compute -q --no-cov'
        cwd: .
  - id: dod-omn22809-planted-cap-test
    description: The tests that plant a changed cap in one copy pass with the change and name the host, the field and each value; the h053 run over the real copies is the unbound local Done gate item above.
    source: manual
    execution_scope: hosted_and_local
    binds_ac: [AC3]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/nodes/node_host_table_copies_drift_compute -q --no-cov -k "planted_cap or changed_cap"
        cwd: .
  - id: dod-omn22809-j8-boot-resolvable-tests
    description: HandlerLandingJoinJ8 is bound by the node contract and boot-resolvable; the routing guard, the ownership test and the J8 tests pass.
    source: manual
    execution_scope: hosted_and_local
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/test_handler_routing_boot_resolvable.py tests/validation/test_runtime_profile_contract_ownership.py tests/unit/nodes/node_pr_landing_decision_compute/test_join_j8.py -q --no-cov
        cwd: .
  - id: dod-omn22809-j8-no-arg-construction
    description: HandlerLandingJoinJ8 constructs with no arguments and refuses to emit without a sink; both fail at the merge base.
    source: manual
    execution_scope: hosted_and_local
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/nodes/node_pr_landing_decision_compute/test_join_j8.py -q --no-cov -k "without_injected_dependencies or without_sink"
        cwd: .
  - id: dod-omn22809-j8-bound-grep
    description: The node contract binds HandlerLandingJoinJ8 in handler_routing.
    source: manual
    execution_scope: hosted_and_local
    checks:
      - check_type: command
        check_value: "grep -q 'HandlerLandingJoinJ8' src/omnimarket/nodes/node_pr_landing_decision_compute/contract.yaml"
        cwd: .
  - id: dod-omn22809-j8-integration-proof
    description: "The J8 handler boot-resolution tests run on a lab runner. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check."
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: 'env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-22809-j8 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/test_handler_routing_boot_resolvable.py tests/validation/test_runtime_profile_contract_ownership.py -q --no-cov'
        cwd: .
