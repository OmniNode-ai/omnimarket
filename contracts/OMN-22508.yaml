requirements:
- id: req-omn19998-error-rule-delivery
  statement: Error delivery preserves hints, unmatched occurrences and independent surface liveness through typed node boundaries.
  acceptance:
  - id: AC10
    statement: 'AC10: Recorded tool failures and guard refusals return RULE hints in hint mode, suppress matched hints in shadow and deliver queued non-Bash context through the next PreToolUse; the same tool-use id is handled once across failure and fallback events. -- falsifier: uv run --frozen pytest tests/nodes/node_error_rule_delivery_effect/test_delivery_hook.py -k delivery_hook -q --no-cov -n 0'
  - id: AC11
    statement: 'AC11: A flushed no-match outbox survives process death before or after the queue write, replay acknowledges one occurrence once, and two distinct failures of one class coalesce into one open exception row. -- falsifier: uv run --frozen pytest tests/nodes/node_error_rule_delivery_effect/test_delivery_hook.py -k delivery_hook -q --no-cov -n 0'
  - id: AC12
    statement: 'AC12: Missing delivery probes alarm with no surface traffic, real traffic with zero real matcher calls alarms despite synthetic calls, unread matching returns UNREAD, and the injected fixture p95 stays below the overlay budget. -- falsifier: uv run --frozen pytest tests/nodes/node_error_rule_delivery_effect/test_delivery_hook.py -k delivery_hook -q --no-cov -n 0'
  - id: AC13
    statement: 'AC13: The declared delivery command routes to a correlated result through the in-memory and authorized Redpanda overlay bindings; a selected unavailable broker fails without a skip. -- falsifier: uv run --frozen pytest tests/nodes/node_error_rule_delivery_effect/test_golden_chain_delivery_hook_bus.py -k inmemory -q --no-cov -n 0'
