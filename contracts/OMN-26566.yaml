---
schema_version: "1.0.0"
ticket_id: OMN-26566
title: "The stability gateway key provision overlay model reaches dev before the node that reads it, so the node's overlay document can be added to the overlays repository"
summary: "This change adds only the overlay model of node_stability_gateway_key_provision_effect (overlay.py and metadata.yaml) with a unit test, and no contract.yaml, no overlay.example.yaml and no node wiring, so the overlay required check has nothing to require of it. The overlays repository pins a document to a commit on dev, and the key provision node cannot merge until that document is on overlays main; adding the model first breaks that cycle. It is one step of the fix for the C16 refusal, not the whole fix."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn26566-overlay-model-first
    statement: "The stability gateway key provision overlay model is on dev on its own, importable, validating its document and refusing undeclared keys, with no node contract or wiring added by the same change."
    acceptance:
      - id: AC1
        statement: "AC1: the lane report quotes the recorded refusal body from the newest C16 run read, with the run id, the artifact or log line it came from, and the named cause -- falsifier: the report names a cause with no run id or no quoted refusal body line"
      - id: AC2
        statement: "AC2: the cause is fixed on our side through a PR handed to the landing controller or through dev provisioning, or the report states the cause is omnimarket#6638 not yet merged and stops with no write -- falsifier: a write to prod or the cloud, a widened probe clause, or a PR that merges nothing and is not handed to the landing controller"
      - id: AC3
        statement: "AC3: one STATUS row `crit=C16 probe=c16-receipt-identity verdict=<green|red> read_at=<UTC>` with the failing step of the re-run probe is on the ledger after this ticket's creation -- falsifier: a ledger grep for `crit=C16 probe=c16-receipt-identity` finds no STATUS row dated after this ticket's creation"
evidence_requirements:
  - kind: tests
    description: "The overlay model tests pass at the pushed head."
    command: "uv run --frozen pytest tests/unit/nodes/node_stability_gateway_key_provision_effect -q --no-cov -n 0 -p no:cacheprovider"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-omn26566-ac1
    description: "AC1 is answered in the lane report, not by this change: it names the cause from the recorded refusal body. This change carries only the proxy that the model it adds stands alone; AC1 itself is pending the report."
    source: manual
    binds_ac: [AC1]
    checks:
      - check_type: test_passes
        check_value: >-
          uv run --frozen pytest tests/unit/nodes/node_stability_gateway_key_provision_effect -q --no-cov -n 0 -p no:cacheprovider
        cwd: .
  - id: dod-omn26566-ac2
    description: "AC2: the fix on our side goes through PRs handed to the landing controller. This PR is the first of them: the overlay model alone on dev. The test fails without overlay.py (no module) and passes with it, and covers the document, the refusal of undeclared keys, the lookup under the overlay roots and the identity store build."
    source: manual
    binds_ac: [AC2]
    checks:
      - check_type: test_passes
        check_value: >-
          uv run --frozen pytest tests/unit/nodes/node_stability_gateway_key_provision_effect/test_stability_key_provision_overlay_model.py -q --no-cov -n 0 -p no:cacheprovider
        cwd: .
  - id: dod-omn26566-ac3
    description: "AC3 is a ledger STATUS row the lane writes after the probe is re-run, not a property of this change. It is pending the overlays document, the pin to this PR's merge commit, the key provision node and its run; this change does not meet it alone."
    source: manual
    binds_ac: [AC3]
    checks:
      - check_type: test_passes
        check_value: >-
          uv run --frozen pytest tests/unit/nodes/node_stability_gateway_key_provision_effect -q --no-cov -n 0 -p no:cacheprovider
        cwd: .
  - id: dod-omn26566-integration-proof
    description: "Local Done gate only, so it binds no criterion here: the overlay model tests run on a lab host at the pushed head."
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: >-
          onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-26566 --kind test -- uv run --frozen pytest tests/unit/nodes/node_stability_gateway_key_provision_effect -q --no-cov
        cwd: .
