title: "The installer's start check uses the installed job's own settings, and the snapshot cutover job's settings file can be named by the installer"
summary: "node_host_installer_registry_units runs a unit's module start check (--help) with the environment the unit is rendered with, the request's path overrides applied, instead of the installing shell's environment; and the landing-snapshot-cutover unit declares ONEX_LANDING_SNAPSHOT_OVERLAY_FILE as a request-overridable path like the overlay roots."
is_seam_ticket: false
interface_change: true
interfaces_touched:
  - "public_api"
requirements:
  - id: "req-omn23585-start-check-environment"
    statement: |-
      A unit whose overlay root comes only from the request's path override passes the installer's start check, and a request can name the cutover snapshot unit's overlay file.
    acceptance:
      - id: "AC1"
        statement: "AC1: the host installer registry node's start check runs the unit's module with the rendered unit's environment, the request's path overrides applied, not the installing shell's -- falsifier: the new test where the overlay root comes only from the request's override, run at the merge base"
      - id: "AC2"
        statement: "AC2: the landing-snapshot-cutover unit declares ONEX_LANDING_SNAPSHOT_OVERLAY_FILE as a request-overridable path, so a request can correct it -- falsifier: the new render test with that override, run at the merge base"
      - id: "AC3"
        statement: "AC3: integrated: one unit installs on a lab host through the fixed installer from a shell without the overlay root in its environment and is observed running there -- falsifier: the unit's run record on that host over one interval"
evidence_requirements:
  - kind: "tests"
    description: "The start-check environment tests and the installer's existing proof-argv readers."
    command: "uv run pytest tests/nodes/node_host_installer_registry_units/test_start_check_environment.py -q --no-cov"
emergency_bypass:
  enabled: false
  justification: ""
