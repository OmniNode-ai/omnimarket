---
schema_version: "1.0.0"
ticket_id: "OMN-22037"
title: "Compaction verdict compute refuses a confirmatory run that breaks the CM.14 pre-registration"
summary: >-
  node_compaction_verdict_compute reads a pre-registration block from the thresholds data file and, for a confirmatory run, refuses it unless the data file carries the block, its hash is the file a merged data PR fixed and that PR was merged before the run started, every boundary read is in the held-out split (the calibration and held-out sets are disjoint and their hash is checked at parse), the judged build is the one the data file's selection rule picks from the builds' calibration-split scores and has no confirmatory verdict yet, and every section 3.8 safeguard has a margin. The block holds the recorded calibration, the Jaccard tolerance, one progress-call class list per open-loop kind, the build-selection rule and per safeguard the smallest margin the held-out count can establish (3 divided by that count) beside the margin; a margin below it marks the run EXPLORATORY, which cannot issue HELPS or NO_DIFFERENCE. This change ships the gates and no production numbers: the calibration run, the operator's margin decision and the data PR that records them are not part of it.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-omn22037-preregistration-gates"
    statement: "The verdict node enforces the CM.14 pre-registration on a confirmatory run."
    acceptance:
      - id: "AC1"
        statement: "AC1: a confirmatory run is refused without the pre-registration block, without a record of a merged data PR whose file hash is the data file's hash, and when that PR was not merged before the run -- falsifier: `uv run pytest -k preregistered` has a confirmatory run issued in any of the three cases"
      - id: "AC2"
        statement: "AC2: the data file schema requires the Jaccard tolerance, a progress-call class list for each of the five open-loop kinds, the recorded calibration, and (for a confirmatory run) a margin for every section 3.8 safeguard -- falsifier: a data file missing one of them parses or runs confirmatory"
      - id: "AC3"
        statement: "AC3: the calibration and held-out session sets are disjoint with their hash checked at parse, and a confirmatory run that reads a calibration session, or a session in neither set, is refused -- falsifier: a session id in both sets that parses, or a confirmatory run over a calibration session that is issued"
      - id: "AC4"
        statement: "AC4: the build-selection rule is in the data file, a confirmatory report names the one build it judged, a build the rule does not pick is refused, and a build already judged is refused -- falsifier: a confirmatory report that judges a build another rule would pick, or a second report for one build"
      - id: "AC5"
        statement: "AC5: the data file records per safeguard 3 divided by the held-out count and the margin, a wrong recorded minimum is refused at parse, and a margin below the minimum labels the run EXPLORATORY so it issues no HELPS or NO_DIFFERENCE -- falsifier: a confirmatory run with a margin below its minimum that issues HELPS or NO_DIFFERENCE"
evidence_requirements:
  - kind: "tests"
    description: "Compaction verdict compute tests, including the pre-registration gates."
    command: "uv run pytest tests/nodes/node_compaction_verdict_compute -q --no-cov"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn22037-ac1-data-pr-record"
    description: "A confirmatory run with no block, no data PR record, a hash that differs from the merged file, or a data PR merged at or after the run start is refused."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_compaction_verdict_compute/test_compaction_verdict.py -q --no-cov -k 'preregistered and (without_a_block or without_a_data_pr or edited_after or merged_after)'"
        cwd: "."
    binds_ac: ["AC1"]
  - id: "dod-omn22037-ac2-required-numbers"
    description: "A block missing the tolerance, the progress classes, the build rule or the calibration is refused by name, a missing open-loop kind is refused, and a confirmatory run needs every section 3.8 safeguard."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_compaction_verdict_compute/test_compaction_verdict.py -q --no-cov -k 'preregistered and (missing_a_number or open_loop_kind or every_section_3_8)'"
        cwd: "."
    binds_ac: ["AC2"]
  - id: "dod-omn22037-ac3-disjoint-split"
    description: "Overlapping sets, a tampered split hash, control boundaries outside the calibration split, a calibration session read and a session in neither set are each refused."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_compaction_verdict_compute/test_compaction_verdict.py -q --no-cov -k 'preregistered and (both_sets or split_hash or control_boundaries or calibration_session or neither_set)'"
        cwd: "."
    binds_ac: ["AC3"]
  - id: "dod-omn22037-ac4-build-selection"
    description: "The report names the judged build, a build other than the selected one (including the best score that fails a floor) is refused, ties go to the later commit, no build meeting the floors is refused and a build is judged once."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_compaction_verdict_compute/test_compaction_verdict.py -q --no-cov -k 'preregistered and (build or names_build_split)'"
        cwd: "."
    binds_ac: ["AC4"]
  - id: "dod-omn22037-ac5-feasible-margin"
    description: "The recorded smallest margin is 3 divided by the held-out count and a wrong value is refused; a margin below it gives an EXPLORATORY run that cannot issue HELPS or NO_DIFFERENCE and can still issue HARM."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_compaction_verdict_compute/test_compaction_verdict.py -q --no-cov -k 'preregistered and (smallest_margin or feasible_minimum or feasibility_margin)'"
        cwd: "."
    binds_ac: ["AC5"]
  - id: "dod-omn22037-integration-proof"
    description: "The pushed head ran the compaction verdict node suite on a lab host and exited 0. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check."
    source: "manual"
    execution_scope: "local_done_gate"
    checks:
      - check_type: "command"
        check_value: "uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha \"$(git rev-parse HEAD)\" --lane dod-integration-proof-22037 -- uv run --frozen pytest tests/nodes/node_compaction_verdict_compute -q -p no:randomly --no-cov"
        cwd: "."
  - id: "dod-omn22037-deploy-source-readback"
    description: "Hosted-runner deploy artifact readback for the pure compute node: fetch the published pre-registration gate and verdict handler at the evaluated commit, compare them to the checkout, and require the data hash refusal and confirmatory gate wiring. This checks published source, not a runtime rollout."
    source: "manual"
    execution_scope: "hosted_and_local"
    checks:
      - check_type: "command"
        check_value: |
          set -eu;
          readback_dir="$(mktemp -d)";
          trap 'rm -rf "$readback_dir"' EXIT;
          revision="$(git rev-parse HEAD)";
          node_path=src/omnimarket/nodes/node_compaction_verdict_compute/handlers;
          curl --fail --silent --show-error --location --max-time 30 \
            "https://raw.githubusercontent.com/OmniNode-ai/omnimarket/$revision/$node_path/preregistration_gate.py" \
            --output "$readback_dir/preregistration_gate.py";
          curl --fail --silent --show-error --location --max-time 30 \
            "https://raw.githubusercontent.com/OmniNode-ai/omnimarket/$revision/$node_path/handler_compaction_verdict.py" \
            --output "$readback_dir/handler_compaction_verdict.py";
          cmp "$node_path/preregistration_gate.py" "$readback_dir/preregistration_gate.py";
          cmp "$node_path/handler_compaction_verdict.py" "$readback_dir/handler_compaction_verdict.py";
          grep -F 'if digest != record.data_file_sha256:' "$readback_dir/preregistration_gate.py";
          grep -F 'verify_confirmatory(request, thresholds)' "$readback_dir/handler_compaction_verdict.py";
          printf 'compaction pre-registration source readback matched %s\n' "$revision"
        cwd: "."
