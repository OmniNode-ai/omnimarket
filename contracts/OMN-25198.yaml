      existing_ticket_or_pull_request: "none found"
      searched: "pr_state_local.py --find OMN-21217 lists only this pull request; lane_brief.py grep for the fix commit e1bf8670195d and for composed-boot-demand-start-probe lists only this change's own lane rows and an earlier merge row, read 2026-11-17"
      action: "No ticket or pull request exists for it and this lane mints none; it is named in the lane's terminal for the orchestrator to file."
requirements:
  - id: "req-omn25198-review-findings"
    statement: "Every blocking review finding on the evidence-only pull request is fixed or argued with evidence."
    acceptance:
      - id: "AC1"
        statement: "The failure cause of the pull request's red check is read from the run log or the gate source and recorded with its error text, and the contracts of the pull request satisfy the repository's binding test."
      - id: "AC2"
        statement: "The range of commits from the merge base to the head names exactly one merged fix, names it only in trailer blocks, and the commit it names as removed is not reachable from the head."
      - id: "AC3"
        statement: "The bound AC2 test asserts on the serialized decision, calls the real orchestrator retry and asserts backend identity, and its check requires 2 passed so a skip or expected failure makes it fail, and a pytest failure whose counted line still prints makes it fail."
      - id: "AC4"
        statement: "The control claim is backed by a run on one host: both failures are assertions on the dispatched model, baa835fa277a is an ancestor of 13a7e30415, and the exclusion rule is cited from the gate source."
      - id: "AC5"
        statement: "The contract schema permits the top-level context key, both contracts load in the ticket contract model, and criterion_hash equals the hash recomputed over the ticket's live AC2 text with the gate's own canonicalisation."
      - id: "AC6"
        statement: "The non-blocking findings are fixed or argued, and the pull request-state checks read what a lane reader can read."
evidence_requirements:
  - kind: "tests"
    description: "The AC2 binding check of the OMN-21217 contract passes when both parametrizations run, and fails when both skip, when only one runs and when pytest fails after the counted line prints."
    command: "uv run pytest tests/test_refuse_skips_omn19987.py -q -n 0 --no-cov"
dod_evidence:
  - id: "dod-omn25198-failure-cause-and-binding"
    description: "The failure cause and its error text are recorded from the run and the gate source, and every contract of the pull request satisfies the repository's own binding test."
    source: "manual"
    binds_ac: ["AC1"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_evidence_contracts_omn25208.py tests/ci/test_repo_evidence_caller_workflow.py -q -n 0 --no-cov -k 'failure_causes or binds_every_criterion or binds_a_local_done_gate'"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn25198-commit-trailers"
    description: "From the merge base to the head, exactly one merged fix is named, the token appears only as a trailer, and 7965f64668c6 is not reachable from the head. The gate reads trailers over that range (receipt-gate.yml:1834 at dev-20261113222915-b853619df394), not the head alone. The local Done gate reads the pushed branch."
    source: "manual"
    execution_scope: "local_done_gate"
    checks:
      - check_type: "command"
        check_value: "mb=$(git merge-base origin/dev HEAD) && test \"$(git log --format='%(trailers:key=Binds-Merged-Fix,valueonly)' \"$mb..HEAD\" | sed '/^[[:space:]]*$/d' | sort -u | wc -l)\" = 1 && test \"$(git log --format=%B \"$mb..HEAD\" | grep -c 'Binds-Merged-Fix')\" = \"$(git log --format='%(trailers:key=Binds-Merged-Fix,valueonly)' \"$mb..HEAD\" | sed '/^[[:space:]]*$/d' | wc -l)\" && ! git merge-base --is-ancestor 7965f64668c6 HEAD"
        cwd: "."
  - id: "dod-omn25198-commit-trailers-test"
    description: "The trailer check passes one fix named once in a trailer block and fails two fixes, none, and the token in prose; the gate's range reading is recorded."
    source: "manual"
    binds_ac: ["AC2"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_evidence_contracts_omn25208.py -q -n 0 --no-cov -k 'trailer'"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn25198-ac2-check-cannot-skip"
    description: "The AC2 binding check of the OMN-21217 contract is run for real: it passes with both parametrizations run, fails with both skipped, fails with only one run, and fails when pytest fails after printing the counted line. Fails at the previous head, where the contract's check has neither --refuse-skips nor the count."
    source: "manual"
    binds_ac: ["AC3"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/test_refuse_skips_omn19987.py -q -n 0 --no-cov -k ac2_binding"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn25198-ac2-test-body"
    description: "The bound AC2 test round-trips the routing decision through JSON, drives the real orchestrator, asserts backend id and ref, and fails when the orchestrator is stubbed."
    source: "manual"
    binds_ac: ["AC3"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_evidence_contracts_omn25208.py -q -n 0 --no-cov -k 'bound_ac2 or ac2_source_check'"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn25198-control-ancestry"
    description: "baa835fa277a is an ancestor of 13a7e30415. The control receipts are in context.run_receipts. The local Done gate holds the full history this needs."
    source: "manual"
    execution_scope: "local_done_gate"
    checks:
      - check_type: "command"
        check_value: "git merge-base --is-ancestor baa835fa277a 13a7e30415"
        cwd: "."
  - id: "dod-omn25198-receipts"
    description: "The receipts are run output on one host with their logs named and the exclusion rule is cited from the gate source at a pinned revision."
    source: "manual"
    binds_ac: ["AC4"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_evidence_contracts_omn25208.py -q -n 0 --no-cov -k 'receipts or exclusion_rule'"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn25198-criterion-hash"
    description: "The criterion_hash of the OMN-21217 AC2 binding equals the gate's own hash of the ticket's AC2 line, with the escaped bracket form, and both contracts load in the ticket contract model."
    source: "manual"
    binds_ac: ["AC5"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_evidence_contracts_omn25208.py -q -n 0 --no-cov -k 'ticket_contract_model or criterion_hash or pinned_ac2_line or unescaped or live_ticket or pinned_criterion'"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn25198-pr-checks"
    description: "Every required context of the pull request reads success at its head: the check reads the JSON of onex scm pr-checks, because the verb itself exits 0 on a red read. Hosted CI cannot read the watcher, so only the local Done gate runs this unbound check."
    source: "manual"
    execution_scope: "local_done_gate"
    checks:
      - check_type: "command"
        check_value: "onex scm pr-checks OmniNode-ai/omnimarket#6358 | python3 -c \"import json,subprocess,sys; r=json.load(sys.stdin)['result']; h=subprocess.run(['git','rev-parse','HEAD'],capture_output=True,text=True,check=True).stdout.strip(); sys.exit(0 if r['head_sha']==h and r['class'] not in ('red','pending') and not r['red'] and not r['pending'] and not r['cancelled'] and r['runs'] else 1)\""
        cwd: "."
  - id: "dod-omn25198-lab-comment"
    description: "The pull request's head equals the pushed head. A lane cannot read pull request comments: onex scm pr-view returns state, head and CI class and no comment text, so the Lab: head= comment is read by the orchestrator and named in the lane's terminal, and this check claims only the head. Read from the PR watcher state, which hosted CI cannot reach."
    source: "manual"
    execution_scope: "local_done_gate"
    checks:
      - check_type: "command"
        check_value: "onex scm pr-view OmniNode-ai/omnimarket#6358 | python3 -c \"import json,subprocess,sys; r=json.load(sys.stdin)['result']; h=subprocess.run(['git','rev-parse','HEAD'],capture_output=True,text=True,check=True).stdout.strip(); sys.exit(0 if r['head_sha']==h else 1)\""
        cwd: "."
  - id: "dod-omn25198-pr-state-checks-logic"
    description: "The pr-checks check passes a green read at the head and fails a red, pending, cancelled, stale or empty read; the pr-view read carries no comment and the check does not claim one. The non-blocking findings (follow-up, budget, re-acceptance) are recorded with their sources."
    source: "manual"
    binds_ac: ["AC6"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_evidence_contracts_omn25208.py -q -n 0 --no-cov -k 'pr_checks or follow_up or verifier_budget or reacceptance'"
        cwd: "${OMNI_HOME}/omnimarket"
