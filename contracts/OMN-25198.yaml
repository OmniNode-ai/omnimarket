        command: "uv run --frozen pytest tests/nodes/node_delegation_routing_reducer/test_hosted_ordered_models_omn21217.py::test_hosted_retry_walks_only_the_selected_keys_ordered_models -q -n 0 --no-cov -rs -p no:cacheprovider"
        exit_code: 1
        summary_line: "2 failed in 6.08s"
        assertion: "AssertionError: assert ['chosen-a'] == ['chosen-a', 'chosen-b'] at test_hosted_ordered_models_omn21217.py:155; no ImportError and no collection error"
        log: "attached in the pull request comment starting Lab: head= for the head that carries this contract, under control-reverted"
      unreverted_run:
        host: "h051"
        command: "uv run --frozen pytest tests/nodes/node_delegation_routing_reducer/test_hosted_ordered_models_omn21217.py::test_hosted_retry_walks_only_the_selected_keys_ordered_models -q -n 0 --no-cov -rs -p no:cacheprovider"
        exit_code: 0
        summary_line: "2 passed in 5.81s"
        log: "attached in the pull request comment starting Lab: head= for the head that carries this contract, under control-unreverted"
    exclusion_rule:
      claim: "The must-fail control binds only evidence of the pull request's own; an item carried unchanged from the merge base's contract is exempt, and an id the head repeats is never carried."
      repository: "omnibase_core"
      revision: "dev-20261113222915-b853619df394"
      file: ".github/workflows/receipt-gate.yml"
      lines: "1892-1977"
    exclusion_rule_verifier:
      claim: "The verifier's own control line refuses a pull request whose every bound check is carried unchanged, and judges only the checks not in carried_evidence_ids."
      revision: "dev-20261101000200-949993edf3b7"
      file: "src/omnimarket/nodes/node_dod_verify/services/occ_replay.py"
      lines: "112-135 (carried_evidence_ids), 167-172 (own checks, refusal text)"
    ancestry:
      - claim: "baa835fa277a is an ancestor of 13a7e30415"
        host: "h051"
        command: "git merge-base --is-ancestor baa835fa277a 13a7e30415"
        exit_code: 0
      - claim: "7965f64668c6 is not reachable from the head of the change at its first commit"
        host: "h051"
        command: "git merge-base --is-ancestor 7965f64668c6 HEAD"
        exit_code: 1
    criterion_hash:
      claim: "criterion_hash in context.ac_binding_provenance of the OMN-21217 contract equals the hash the gate's own canonicalisation (omnimarket.occ_contract_pin.criterion_hash) gives the AC2 line of the ticket as the ticket system holds it."
      value: "08bc4215e732d3427c66f80caa5ae09ed98f3650c4888447fa2ec5905a98ae27"
      ticket_line: >-
        AC2: the hosted router tries a tenant key's models in the order stored and never a model outside the list or a house backend -- falsifier: uv run pytest on an overlay routing test with \[a, b\] where a fails retryably, asserting the next attempt is b on the same key
      live_read:
        source: "the ticket system's own text for OMN-21217, read by the lane"
        read_at: "2026-11-17T05:40:00Z"
        line_equals_ticket_line: true
        hash: "08bc4215e732d3427c66f80caa5ae09ed98f3650c4888447fa2ec5905a98ae27"
