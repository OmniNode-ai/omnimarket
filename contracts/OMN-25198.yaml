---
schema_version: "1.0.0"
ticket_id: "OMN-25198"
title: "Review findings 1 to 10 on omnimarket PR 6358 at head 3fac496de483 are fixed or argued: the dod-verify result is attached, the commit message is reworded, the AC2 test cannot skip and the control and hash are shown"
summary: >-
  Evidence only. The AC2 binding of the OMN-21217 contract now asks for
  --refuse-skips and for exactly 2 passed, so a run in which both
  parametrizations skip or only one runs cannot pass; a focused test in
  tests/test_refuse_skips_omn19987.py runs the real check and fails at the
  previous head. The control, ancestry and criterion-hash receipts that were
  free text in the OMN-21217 contract are kept in context.run_receipts of this
  contract, the one place besides a test file where the Binds-Merged-Fix gate
  admits a new path next to a named merged fix. No product code changes.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
context:
  run_receipts:
    control_revert:
      host: "h053"
      base: "13a7e30415faf3707eb4225d569fd1c31014efa9"
      reverted_fix: "baa835fa277a9885b0c1caac7398e5ce6ca52a2a"
      reverted: "every path of the fix that is neither test-side nor a contract (the gate's own rule); the test file is kept"
      command: "uv run --frozen pytest tests/nodes/node_delegation_routing_reducer/test_hosted_ordered_models_omn21217.py::test_hosted_retry_walks_only_the_selected_keys_ordered_models -q -n 0 --no-cov -rs"
      exit_code: 1
      observed: "2 failed in 5.01s; both parametrizations fail at test_hosted_ordered_models_omn21217.py line 155 with AssertionError: assert ['chosen-a'] == ['chosen-a', 'chosen-b'] (the dispatched models); no ImportError and no collection error"
      unreverted: "2 passed in 5.77s at the same base"
    pre_existing_item_under_the_same_revert:
      command: "uv run --frozen pytest tests/unit/docker/test_composed_runtime_boot_delegate_probe_omn21279.py -q -n 0 --no-cov -k 'never_passes or no_offsets'"
      exit_code: 0
      observed: "4 passed, 29 deselected: the check of dod-omn21217-composed-boot-demand-start-probe does not fail with baa835fa27 reverted, which is why the gate's must-fail control excludes evidence carried unchanged from the merge base"
    ancestry:
      - claim: "baa835fa277a is an ancestor of 13a7e30415"
        command: "git merge-base --is-ancestor baa835fa277a 13a7e30415"
        exit_code: 0
      - claim: "7965f64668c6 is not reachable from the head of this change"
        command: "git merge-base --is-ancestor 7965f64668c6 HEAD"
        exit_code: 1
    criterion_hash:
      claim: "criterion_hash in context.ac_binding_provenance of the OMN-21217 contract equals the hash the gate's own canonicalisation (omnimarket.occ_contract_pin.criterion_hash) gives the AC2 line of the ticket"
      value: "08bc4215e732d3427c66f80caa5ae09ed98f3650c4888447fa2ec5905a98ae27"
      ticket_line: >-
        AC2: the hosted router tries a tenant key's models in the order stored and never a model outside the list or a house backend -- falsifier: uv run pytest on an overlay routing test with \[a, b\] where a fails retryably, asserting the next attempt is b on the same key
      note: "The hash pins the ticket's AC2 line; the AC2 statement in the contract's requirements block is a different text and is not what is hashed."
    original_failure:
      cause: "The previous head carried two Binds-Merged-Fix trailers for OMN-21217. The gate step reads them with git's own trailer parser and refuses a ticket that names more than one."
      gate_text: "Binds-Merged-Fix names more than one merged fix; name exactly one"
      log: "The failing step's own log is no longer retrievable (the job log read answers HTTP 404, not cached), so the gate text is quoted from the gate source."
  follow_ups:
    - "AC5 of OMN-21217: the accepted binding of dod-omn21217-composed-boot-demand-start-probe (merged fix e1bf8670195dfefea5c0d9f9ed12d098eb5ae11d) needs its own pull request; the gate allows one Binds-Merged-Fix per ticket in a pull request."
requirements:
  - id: "req-omn25198-review-findings"
    statement: "Every blocking review finding on the evidence-only pull request is fixed or argued with evidence."
    acceptance:
      - id: "AC1"
        statement: "The dod-verify result for the new head and the original error text are attached in a pull request comment, and every required check-run reads success at the new head."
      - id: "AC2"
        statement: "The head commit message holds the trailer token once, in the trailer block only, describes only what the diff changes, and the commit it names as removed is not reachable from the new head."
      - id: "AC3"
        statement: "The bound AC2 test asserts on the serialized decision, calls the real orchestrator retry and asserts backend identity, and its check requires 2 passed so a skip or expected failure makes it fail."
      - id: "AC4"
        statement: "The control claim is backed by a run: both failures are assertions on the dispatched model, baa835fa277a is an ancestor of 13a7e30415, and the every-bound-check reading is shown against the pre-existing check."
      - id: "AC5"
        statement: "The contract schema permits the top-level context key, and criterion_hash equals the hash recomputed over the ticket's AC2 text with the gate's own canonicalisation."
      - id: "AC6"
        statement: "The non-blocking findings are fixed or argued in a pull request comment, and a comment starting Lab: head= names the pushed head with each command and exit 0."
evidence_requirements:
  - kind: "tests"
    description: "The AC2 binding check of the OMN-21217 contract passes when both parametrizations run, and fails when both skip and when only one runs; the same cases fail at the previous head."
    command: "uv run pytest tests/test_refuse_skips_omn19987.py -q -n 0 --no-cov"
dod_evidence:
  - id: "dod-omn25198-pr-checks"
    description: "Every required context of the pull request reads success at its head, read from the PR watcher. Hosted CI cannot read the watcher, so only the local Done gate runs this unbound check."
    source: "manual"
    execution_scope: "local_done_gate"
    binds_ac: ["AC1"]
    checks:
      - check_type: "command"
        check_value: "onex scm pr-checks OmniNode-ai/omnimarket#6358"
        cwd: "."
  - id: "dod-omn25198-head-commit-message"
    description: "The head commit holds the trailer token once and in the trailer block only, and 7965f64668c6 is not reachable from it. The local Done gate reads the pushed branch head."
    source: "manual"
    execution_scope: "local_done_gate"
    binds_ac: ["AC2"]
    checks:
      - check_type: "command"
        check_value: "test \"$(git log -1 --format=%B HEAD | grep -c 'Binds-Merged-Fix')\" = 1 && test \"$(git log -1 --format='%(trailers:key=Binds-Merged-Fix,valueonly)' HEAD | grep -c 'OMN-21217')\" = 1 && ! git merge-base --is-ancestor 7965f64668c6 HEAD"
        cwd: "."
  - id: "dod-omn25198-ac2-check-cannot-skip"
    description: "The AC2 binding check of the OMN-21217 contract is run for real: it passes with both parametrizations run, fails with both skipped and fails with only one run. Fails at the previous head, where the contract's check has neither --refuse-skips nor the count."
    source: "manual"
    binds_ac: ["AC3"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/test_refuse_skips_omn19987.py -q -n 0 --no-cov -k ac2_binding"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn25198-control-ancestry"
    description: "baa835fa277a is an ancestor of 13a7e30415. The control receipts are in context.run_receipts. The local Done gate holds the full history this needs."
    source: "manual"
    execution_scope: "local_done_gate"
    binds_ac: ["AC4"]
    checks:
      - check_type: "command"
        check_value: "git merge-base --is-ancestor baa835fa277a 13a7e30415"
        cwd: "."
  - id: "dod-omn25198-criterion-hash"
    description: "The criterion_hash of the OMN-21217 AC2 binding equals the gate's own hash of the ticket's AC2 line, and the contract's context key loads in the ticket contract model."
    source: "manual"
    binds_ac: ["AC5"]
    checks:
      - check_type: "command"
        check_value: >-
          uv run python -c "import yaml; from omnimarket.occ_contract_pin import criteria_by_label, criterion_hash; c = yaml.safe_load(open('contracts/OMN-25198.yaml'))['context']['run_receipts']['criterion_hash']; v = yaml.safe_load(open('contracts/OMN-21217.yaml'))['context']['ac_binding_provenance']['dod-omn21217-ac2-accepted-20261117t0145z'][0]['criterion_hash']; h = criterion_hash(criteria_by_label('- [ ] ' + c['ticket_line'])['AC2']); assert h == v == c['value'], (h, v, c['value'])"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn25198-lab-comment"
    description: "The pull request carries a comment starting Lab: head= with the pushed head. Read from the PR watcher state, which hosted CI cannot reach."
    source: "manual"
    execution_scope: "local_done_gate"
    binds_ac: ["AC6"]
    checks:
      - check_type: "command"
        check_value: "onex scm pr-view OmniNode-ai/omnimarket#6358"
        cwd: "."
