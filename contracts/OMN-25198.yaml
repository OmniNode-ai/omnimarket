        check_value: "uv run pytest tests/ci/test_repo_evidence_caller_workflow.py -q -n 0 --no-cov -k 'ticket_contract_model or criterion_hash or pinned_ac2_line or unescaped or live_ac2_hash or pinned_criterion'"
        cwd: "${OMNI_HOME}/omnimarket"
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_repo_evidence_caller_workflow.py -q -n 0 --no-cov -k 'reader_stage or read_ticket'"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn25198-live-ac2-hash"
    description: >-
      The hash of the live AC2 line of OMN-21217 is the criterion_hash the
      change records. The item reads the ticket system's own description of
      OMN-21217 with the repository's ticket-text reader (the key is the host's
      and is never printed), hashes the AC2 line with the gate's
      canonicalisation, and requires that hash to equal criterion_hash in the
      OMN-21217 contract's context.ac_binding_provenance, the value recorded in
      this contract and the hash of ticket_line. A criterion_hash changed over an
      unchanged line, a changed ticket_line and a changed live line each fail it;
      tests run its own command against a stand-in reader and prove each. Only
      the local Done gate can read the ticket system, and the item answers the
      same before and after the merge.
    source: "manual"
    execution_scope: "local_done_gate"
    checks:
      - check_type: "command"
        check_value: |-
          uv run --frozen python -c "import json,os; from omnimarket.nodes.node_ticket_text_effect.handlers.handler_ticket_text import read_ticket; print(json.dumps(read_ticket('OMN-21217','https://api.linear.app/graphql',os.environ['LINEAR_API_KEY'])))" | uv run --frozen python -c "
          import json,sys,yaml
          from omnimarket.occ_contract_pin import criteria_by_label, criterion_hash
          live=criterion_hash(criteria_by_label(json.load(sys.stdin)['description'])['AC2'])
          pin=yaml.safe_load(open('contracts/OMN-21217.yaml'))['context']['ac_binding_provenance']['dod-omn21217-ac2-accepted-20261117t0145z'][0]['criterion_hash']
          rec=yaml.safe_load(open('contracts/OMN-25198.yaml'))['context']['run_receipts']['criterion_hash']
          line=criterion_hash(criteria_by_label('- [ ] '+rec['ticket_line'].strip())['AC2'])
          sys.exit(0 if live==pin==rec['value']==line else 1)
          "
        cwd: "."
  - id: "dod-omn25198-verifier-tag-read"
    description: "The verifier tag the caller installs is an object of this clone, and the lines of its runner that tests/ci/verifier_shell.py records are compared with the tag's own file: with REQUIRE_VERIFIER_TAG the comparison fails when the tag is absent, where the hosted run (a shallow checkout) returns without comparing. So the verifier_tag tests cannot pass on literals typed here when this item runs."
    source: "manual"
    execution_scope: "local_done_gate"
    checks:
