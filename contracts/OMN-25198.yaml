---
schema_version: "1.0.0"
ticket_id: "OMN-25198"
title: "Review findings 1 to 10 on omnimarket PR 6358 at head 3fac496de483 are fixed or argued: the dod-verify result is attached, the commit message is reworded, the AC2 test cannot skip and the control and hash are shown"
summary: >-
  Evidence only. The AC2 binding of the OMN-21217 contract asks for
  --refuse-skips and for exactly 2 passed, and the verifier runs a check as
  bash -o pipefail, so a skip, a missing parametrization or a failing pytest
  cannot pass it; focused tests in tests/test_refuse_skips_omn19987.py run the
  real check and a stubbed pytest line, and fail when the shell is not
  pipefail. The control, ancestry and criterion-hash receipts that were free
  text in the OMN-21217 contract are kept in context.run_receipts of this
  contract as run output on one host, with the log of each attached in the
  pull request's Lab comment. tests/ci/test_evidence_contracts_omn25208.py pins
  their shape and the logic of the checks. No product code changes.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
