    description: "The gate source at the pin (receipt-gate.yml of the omnibase_core clone at the revision the caller pins) is read with git show, judged for the control it builds, and every line cited in context.run_receipts.gate_control is compared with the file. A clone without the object fails the item (REQUIRE_GATE_SOURCE); only the local Done gate has that clone."
    source: "manual"
    execution_scope: "local_done_gate"
    checks:
      - check_type: "command"
        check_value: "git -C \"$OMNI_HOME/omnibase_core\" cat-file -e 'dev-20261113222915-b853619df394^{commit}' && REQUIRE_GATE_SOURCE=1 uv run pytest tests/ci/test_repo_evidence_caller_workflow.py -q -n 0 --no-cov -k gate_control_source"
        cwd: "."
  - id: "dod-omn25198-merge-base-names"
    description: >-
      The test names this change's checks must not select (the names the two test
      files held at the merge base) are read from git, not from the list a test
      holds: the item fails when the merge base commit is not in the clone, and
      otherwise runs the test that compares the list with the names of
      13a7e30415 in both files, so a name omitted from the list is seen. A shallow
      hosted checkout does not hold that commit, which is why the item is a
      local_done_gate item.
    source: "manual"
    execution_scope: "local_done_gate"
    checks:
      - check_type: "command"
        check_value: "git cat-file -e '13a7e30415^{commit}' && uv run pytest tests/ci/test_repo_evidence_caller_workflow.py -q -n 0 --no-cov -k 'merge_base_names_equal'"
        cwd: "."
  - id: "dod-omn25198-pr-checks"
    description: "Every required context of the pull request (the contexts and rule contexts that pr_state_local.py --settings prints for dev) reads success at its head: the check reads the JSON of onex scm pr-checks, because the verb itself exits 0 on a red read, and accepts only the classes green, green-unarmed and green-armed at the checked-out head, or the class merged judged on the merged head_sha's runs: a merged read with a pending, red or cancelled context, or a required context without a successful run, fails it (the real merged read of tests/ci/fixtures/onex_scm_pr_checks_merged.json lists CI Summary pending). Hosted CI cannot read the watcher, so only the local Done gate runs this unbound check."
    source: "manual"
    execution_scope: "local_done_gate"
    checks:
      - check_type: "command"
        check_value: "onex scm pr-checks OmniNode-ai/omnimarket#6358 | python3 -c \"import json,subprocess,sys; r=json.load(sys.stdin)['result']; h=subprocess.run(['git','rev-parse','HEAD'],capture_output=True,text=True,check=True).stdout.strip(); t=open(sys.argv[1]).read(); req=[c for k,e in ((' contexts=',' required_reviews='),(' rule_contexts=',' rule_strict=')) for c in t[t.index(k)+len(k):t.index(e,t.index(k)+len(k))].split(',')]; ok={n for n,s,c,_ in r['runs'] if s=='completed' and c=='success'}; sys.exit(0 if (r['class']=='merged' or (r['head_sha']==h and r['class'] in ('green','green-unarmed','green-armed'))) and not r['red'] and not r['pending'] and not r['cancelled'] and r['runs'] and req and all(c in ok for c in req) else 1)\" <(python3 \"$OMNI_PLUGIN_ROOT/skills/merge-drain/scripts/pr_state_local.py\" --settings OmniNode-ai/omnimarket:dev)"
        cwd: "."
  - id: "dod-omn25198-lab-comment"
    description: "The pull request's head equals the pushed head. A lane cannot read pull request comments: onex scm pr-view returns state, head and CI class and no comment text, so the Lab: head= comment is read by the orchestrator and named in the lane's terminal, and this check claims only the head. An open pull request must read the checked-out head; a merged one is judged on its merged head_sha's runs (the pr-checks read must name the same head_sha and list no red, pending or cancelled context). Read from the PR watcher state, which hosted CI cannot reach."
    source: "manual"
    execution_scope: "local_done_gate"
    checks:
      - check_type: "command"
        check_value: "onex scm pr-view OmniNode-ai/omnimarket#6358 | python3 -c \"import json,subprocess,sys; r=json.load(sys.stdin)['result']; h=subprocess.run(['git','rev-parse','HEAD'],capture_output=True,text=True,check=True).stdout.strip(); merged=r['state']=='MERGED'; c=json.load(open(sys.argv[1]))['result'] if merged else {}; sys.exit(0 if ((r['head_sha']==c['head_sha'] and not c['red'] and not c['pending'] and not c['cancelled'] and c['runs']) if merged else r['head_sha']==h) else 1)\" <(onex scm pr-checks OmniNode-ai/omnimarket#6358)"
        cwd: "."
  - id: "dod-omn25198-pr-state-checks-logic"
    description: "The pr-checks check passes a green read at the head and fails a red, pending, cancelled, stale or empty read, and fails the real merged read with CI Summary pending; the pr-view read carries no comment and the check does not claim one. The non-blocking findings (follow-up, budget, re-acceptance) are recorded with their sources."
    source: "manual"
    binds_ac: ["AC6"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_repo_evidence_caller_workflow.py -q -n 0 --no-cov -k 'pr_checks_check or pr_view_check or pr_checks_read_carries or live_pr_checks_items'"
        cwd: "${OMNI_HOME}/omnimarket"
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_repo_evidence_caller_workflow.py -q -n 0 --no-cov -k 'follow_up or verifier_budget or reacceptance or merged_pull_request or state_cannot_be_read'"
        cwd: "${OMNI_HOME}/omnimarket"
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_repo_evidence_caller_workflow.py -q -n 0 --no-cov -k 'real_pr_view or real_pr_checks or merged_guard or pr_checks_item'"
        cwd: "${OMNI_HOME}/omnimarket"
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_repo_evidence_caller_workflow.py -q -n 0 --no-cov -k 'every_selection_of_every_contract or measured_seconds or unsplit_ac2 or covered_once or recorded_split_time or split_2_of_20 or ac2_binding_item_is_split'"
        cwd: "${OMNI_HOME}/omnimarket"
