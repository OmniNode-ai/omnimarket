  - id: "dod-omn25198-commit-trailers"
    description: "From the merge base to the head, exactly one merged fix is named, the token appears only as a trailer, and 7965f64668c6 is not reachable from the head: git merge-base --is-ancestor must exit 1 exactly, so an unknown object (exit 128) fails. The gate reads trailers over that range (receipt-gate.yml:1834 at dev-20261113222915-b853619df394), not the head alone. The item reads the head_sha of the pull request (onex scm pr-view) and judges the range from the merge base with origin/dev to that head_sha, merged or not: a squash merge leaves the branch's commits in the clone, so the merged range is read, and a head_sha the clone lacks fails the item."
    source: "manual"
    execution_scope: "local_done_gate"
    checks:
      - check_type: "command"
        check_value: "h=$(onex scm pr-view OmniNode-ai/omnimarket#6358 | python3 -c \"import json,sys; print(json.load(sys.stdin)['result']['head_sha'])\") && mb=$(git merge-base origin/dev \"$h\") && test \"$(git log --format='%(trailers:key=Binds-Merged-Fix,valueonly)' \"$mb..$h\" | sed '/^[[:space:]]*$/d' | sort -u | wc -l)\" = 1 && test \"$(git log --format=%B \"$mb..$h\" | grep -c 'Binds-Merged-Fix')\" = \"$(git log --format='%(trailers:key=Binds-Merged-Fix,valueonly)' \"$mb..$h\" | sed '/^[[:space:]]*$/d' | wc -l)\" && { git merge-base --is-ancestor 7965f64668c6 \"$h\"; test $? -eq 1; }"
        cwd: "."
  - id: "dod-omn25198-commit-trailers-test"
    description: "The trailer check passes one fix named once in a trailer block and fails two fixes, none, and the token in prose; the gate's range reading is recorded."
    source: "manual"
    binds_ac: ["AC2"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_repo_evidence_caller_workflow.py -q -n 0 --no-cov -k 'trailer'"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn25198-ac2-check-cannot-skip"
    description: "The AC2 binding check of the OMN-21217 contract is run for real: it passes with both parametrizations run, fails with both skipped, fails with only one run, and fails when pytest fails after printing the counted line. Fails at the previous head, where the contract's check has neither --refuse-skips nor the count. The cases are grouped so that no check runs past the local Done gate's 30 s default."
    source: "manual"
    binds_ac: ["AC3"]
    checks:
