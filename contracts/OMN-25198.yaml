  OMN-21217 contract are kept in context.run_receipts of this contract as run
  output on one host (run_receipts.host), with the log of each attached in the
  pull request's Lab comment. tests/ci/test_repo_evidence_caller_workflow.py
  pins their shape and the logic of the checks. No product code changes.
