schema_version: 1.0.0
ticket_id: OMN-26680
title: A repeated correlation_id on POST /v1/workflows returns the original job, so no accepted job stays published forever
summary: The workflow gateway submit handler and its Postgres store find a tenant's existing job under a correlation_id inside the tenant-locked admission transaction, return it (same workflow id, current status) for the same payload, refuse a different payload with a typed 409 conflict, and keep tenants independent.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn26680-correlation-id-idempotent
  statement: One tenant's repeated correlation_id yields one job, so the terminal writer finds exactly one row and every accepted job can reach a final state.
  acceptance:
  - id: AC1
    statement: 'AC1: for one tenant, the same correlation_id with the same payload returns the original workflow id and its current status, and concurrent repeats create one job -- falsifier: two submits with one number return two workflow ids, or ten concurrent submits leave more than one row in the workflow store'
  - id: AC2
    statement: 'AC2: the same correlation_id with a different payload is refused with a typed conflict, and another tenant using the same number is independent -- falsifier: the second payload is accepted, or tenant B''s submit returns or reveals tenant A''s job'
  - id: AC3
    statement: 'AC3: every accepted job reaches one final state on dev with repeats present -- falsifier: a job accepted in the repeat test still reads `published` 15 minutes after its submit'
evidence_requirements:
- kind: tests
  description: The gateway submit tests on the in-memory store and on a real Postgres; the first submit-twice test fails on the old handler with two workflow ids.
  command: uv run pytest tests/nodes/node_workflow_gateway_effect/test_correlation_idempotency.py -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn26680-ac1-repeat-returns-original
  description: Through the mounted route, two submits of one correlation_id and payload return one workflow id and publish once, and ten concurrent submits leave one job. The test fails on a handler that admits every submit.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_workflow_gateway_effect/test_correlation_idempotency.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn26680-ac2-conflict-and-tenant-isolation
  description: A different payload under a used correlation_id answers 409 with code correlation_id_conflict and does not echo the payload; a second tenant using the same number gets its own job. The tests fail on a handler that accepts the second payload.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_workflow_gateway_effect/test_correlation_idempotency.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn26680-ac3-one-row-reaches-final-state
  description: After repeats the tenant holds one row under the number, so the terminal writer (which refuses a number that matches more than one row as ambiguous) applies its final state to it. The unit test fails when a repeat adds a second row; the integration proof below applies the real terminal store to the repeated job on Postgres.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_workflow_gateway_effect/test_correlation_idempotency.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn26680-hosted-deploy-check
  description: 'Deploy check the hosted runner can run: the submit handler computes the submission fingerprint and answers a used correlation_id with the typed conflict code, and the Postgres store reads the existing job inside the tenant lock. This binds no criterion by itself.'
  source: manual
  checks:
  - check_type: command
    check_value: grep -q 'correlation_id_conflict' src/omnimarket/nodes/node_workflow_gateway_effect/handlers/handler_workflow_submit.py
    cwd: .
  - check_type: command
    check_value: grep -q '_SQL_FETCH_BY_CORRELATION' src/omnimarket/nodes/node_workflow_gateway_effect/handlers/store_postgres.py
    cwd: .
- id: dod-omn26680-integration-proof
  description: On a lab host, with the branch at its pushed sha, the real-Postgres test runs the real gateway node and store against a throwaway database (the terminal writer applies to the one job; ten concurrent repeats leave one row). Hosted CI holds no Postgres, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-26680-correlation --kind test -- uv run --frozen pytest tests/nodes/node_workflow_gateway_effect/test_integration_real_postgres_correlation_idempotency.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn26680-ac2-tenant-scoped-wire-correlation
  description: Two tenants sending one correlation_id each get their own job, and the number each tenant's job carries on the wire differs, so the runtime (which keys a job by that number alone) does not drop the second tenant's job as a repeat. Each tenant reads its own number back; a repeat from the first tenant returns its original job. The test fails on a handler that puts the caller's number on the wire unscoped.
  source: manual
  binds_ac:
  - AC2
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_workflow_gateway_effect/test_correlation_idempotency.py -k distinct_wire_correlation_ids -q --no-cov -n 0 -p no:randomly
    cwd: .
