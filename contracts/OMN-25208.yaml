---
schema_version: "1.0.0"
ticket_id: "OMN-25208"
title: "Review findings 1 to 11 on omnimarket PR 6358 at head 2bf71927f97e are fixed or argued: CI is green, the AC2 test round-trips the decision, the check cannot pass on a pytest failure and the hash is verified against the live ticket"
summary: >-
  Evidence only. The second review of the pull request that records the accepted
  AC2 binding of the OMN-21217 contract. The cause of the red check is read from
  the run (two repository tests that refuse a local_done_gate item carrying
  binds_ac), the contracts of the pull request bind every criterion to a test,
  and tests/test_refuse_skips_omn19987.py and
  tests/ci/test_repo_evidence_caller_workflow.py hold the cases that fail when the
  verifier's shell is not pipefail, when the orchestrator is stubbed, when the
  criterion hash is not that of the live ticket line, and when a state check
  could pass on a red or pending read. No product code changes.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-omn25208-review-findings"
    statement: "Every blocking finding of the second review is fixed or argued with evidence, and the non-blocking findings are fixed or argued."
    acceptance:
      - id: "AC1"
        statement: "The failing check's log is read and its error text recorded, and the contracts of the pull request satisfy the repository's binding test."
      - id: "AC2"
        statement: "The test bound at the OMN-25198 contract's AC2 round-trips the decision, drives the real orchestrator and asserts backend id and ref, and the check fails when the orchestrator is stubbed."
      - id: "AC3"
        statement: "The OMN-21217 AC2 check fails when pytest fails but the counted line still prints, under the verifier's bash -o pipefail, with a regression case."
      - id: "AC4"
        statement: "The criterion hash and ticket_line equal the live ticket's AC2 line including the escaped bracket form, and every contract loads in the ticket contract model."
      - id: "AC5"
        statement: "The pull request state checks read the JSON of pr-checks and the head of pr-view, and fail on a red, pending, cancelled, stale or empty read."
      - id: "AC6"
        statement: "The receipts are run output on one host with their logs named, and the exclusion rule is cited from the gate source at a pinned revision."
      - id: "AC7"
        statement: "The commits from the merge base to the head name exactly one merged fix, only in trailer blocks, and the gate reads trailers over that range."
      - id: "AC8"
        statement: "The non-blocking findings are fixed or argued: the follow-up for AC5 is recorded, the verifier budget is read, re-acceptance is decided and the refusal assertions name the refusal text."
evidence_requirements:
  - kind: "tests"
    description: "The evidence tests of this pull request pass: the AC2 check cases and the contract cases."
    command: "uv run pytest tests/test_refuse_skips_omn19987.py tests/ci/test_repo_evidence_caller_workflow.py -q -n 0 --no-cov"
dod_evidence:
  - id: "dod-omn25208-failure-cause-and-binding"
    description: "The failure cause and error text are recorded and the repository's binding test passes for every contract."
    source: "manual"
    binds_ac: ["AC1"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_repo_evidence_caller_workflow.py -q -n 0 --no-cov -k 'failure_causes or this_pull_requests_contracts'"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn25208-ac2-test-body"
    description: "The bound AC2 test is read from its source and run with the orchestrator stubbed in two ways; each fails."
    source: "manual"
    binds_ac: ["AC2"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_repo_evidence_caller_workflow.py -q -n 0 --no-cov -k 'bound_ac2 or ac2_source_check'"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn25208-pipefail-regression"
    description: "A run in which pytest prints 2 passed, 1 error and exits 1 fails the AC2 check under bash -o pipefail and passes without it; the refusal assertions name the refusal text."
    source: "manual"
    binds_ac: ["AC3", "AC8"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/test_refuse_skips_omn19987.py -q -n 0 --no-cov -k 'ac2'"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn25208-criterion-hash"
    description: "The pinned AC2 line hashes to the recorded value with the escaped brackets and every contract loads in the ticket contract model."
    source: "manual"
    binds_ac: ["AC4"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_repo_evidence_caller_workflow.py -q -n 0 --no-cov -k 'ticket_contract_model or criterion_hash or pinned_ac2_line or unescaped or live_ticket or pinned_criterion'"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn25208-pr-state-checks"
    description: "The pr-checks check passes a green read at the head and fails a red, pending, cancelled, stale or empty read; the pr-view read carries no comment and the check does not claim one."
    source: "manual"
    binds_ac: ["AC5"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_repo_evidence_caller_workflow.py -q -n 0 --no-cov -k 'pr_checks or pr_view'"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn25208-receipts"
    description: "The receipts of the OMN-25198 contract are run output on one host with their logs named, and the exclusion rule is cited from the gate source."
    source: "manual"
    binds_ac: ["AC6"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_repo_evidence_caller_workflow.py -q -n 0 --no-cov -k 'receipts or exclusion_rule'"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn25208-commit-trailers"
    description: "The trailer check passes one fix named once in a trailer block and fails two fixes, none, and the token in prose."
    source: "manual"
    binds_ac: ["AC7"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_repo_evidence_caller_workflow.py -q -n 0 --no-cov -k 'trailer'"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn25208-non-blocking-findings"
    description: "The follow-up, the verifier budget and the re-acceptance decision are recorded with their sources."
    source: "manual"
    binds_ac: ["AC8"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_repo_evidence_caller_workflow.py -q -n 0 --no-cov -k 'follow_up or verifier_budget or reacceptance'"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn25208-pr-checks-live"
    description: "Every required context of the pull request reads success at its head. The check is the same JSON read as the OMN-25198 contract's; only the local Done gate runs it."
    source: "manual"
    execution_scope: "local_done_gate"
    checks:
      - check_type: "command"
        check_value: "onex scm pr-checks OmniNode-ai/omnimarket#6358 | python3 -c \"import json,subprocess,sys; r=json.load(sys.stdin)['result']; h=subprocess.run(['git','rev-parse','HEAD'],capture_output=True,text=True,check=True).stdout.strip(); t=open(sys.argv[1]).read(); req=[c for k,e in ((' contexts=',' required_reviews='),(' rule_contexts=',' rule_strict=')) for c in t[t.index(k)+len(k):t.index(e,t.index(k)+len(k))].split(',')]; ok={n for n,s,c,_ in r['runs'] if s=='completed' and c=='success'}; sys.exit(0 if r['head_sha']==h and r['class'] in ('green','green-unarmed','green-armed') and not r['red'] and not r['pending'] and not r['cancelled'] and r['runs'] and req and all(c in ok for c in req) else 1)\" <(python3 \"$OMNI_PLUGIN_ROOT/skills/merge-drain/scripts/pr_state_local.py\" --settings OmniNode-ai/omnimarket:dev)"
        cwd: "."
