    check_value: uv run pytest tests/nodes/node_ticket_closer_scheduled_effect/test_golden_chain_ticket_closer.py tests/nodes/node_ticket_closer_scheduled_effect/test_bound_profile.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24411-ac3-integration-proof
  description: The pushed head ran the focused closer tests on a lab host through the lab work runner and exited 0. The running-runtime reading (a dev runtime rolled from the change shows the closer's tick with no silence in its log longer than the guard's bound) is posted as a ticket comment after the roll.
  source: manual
  execution_scope: local_done_gate
  checks:
