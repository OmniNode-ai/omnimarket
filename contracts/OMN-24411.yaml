schema_version: 1.0.0
ticket_id: OMN-24411
title: The scheduled ticket closer waits without blocking the shared runtime
summary: The scheduled ticket closer's runtime-tick handler was synchronous, so the runtime ran its whole run on the event loop thread while it waited on the ticket write node (up to the overlay's ticket timeout per call), and the ticket write node answers inside that same runtime. The handler is now a coroutine that runs the run on a worker thread, and a tick that arrives while a run is in flight starts no second run. Not in this change - the reading on the rolled dev runtime (AC3), the cause of the dev tick dispatch abandoned after 600 s on 2026-11-14 (its start had rotated out of the runtime log) and the same fault in node_host_drift_orchestrator and node_convergence_orchestrator, whose handlers are synchronous and wait on lab receipts.
is_seam_ticket: false
interface_change: false
requirements:
- id: req-omn24411-closer-tick-off-loop
  statement: The scheduled ticket closer's tick handler is a coroutine and runs its run on a worker thread, so the runtime's event loop keeps serving while the ticket write node's answers are awaited, and one run is in flight at a time.
  acceptance:
  - id: AC1
    statement: "AC1: the closer's entry point is a coroutine that runs its ticket waits off the runtime's event loop, and a second tick during a run starts no second run -- falsifier: pytest tests/nodes/node_ticket_closer_scheduled_effect/test_tick_leaves_loop_free.py -q"
  - id: AC2
    statement: "AC2: the existing closer golden chain and error chain tests pass unchanged in their assertions -- falsifier: pytest tests/nodes/node_ticket_closer_scheduled_effect/test_golden_chain_ticket_closer.py tests/nodes/node_ticket_closer_scheduled_effect/test_bound_profile.py -q"
  - id: AC3
    statement: "AC3: integrated: on the rolled dev runtime the closer's tick completes while a heartbeat on the runtime shows no gap above the guard's bound -- falsifier: runtime log of the dev container shows a silence longer than the bound during a closer tick"
evidence_requirements:
- kind: tests
  description: The focused closer tests at the pushed head; the new loop-freedom test fails against the synchronous handler and its control (the same run on the loop thread) reads the loop held.
  command: env -u PYTHONPATH uv run --frozen pytest tests/nodes/node_ticket_closer_scheduled_effect/test_tick_leaves_loop_free.py tests/nodes/node_ticket_closer_scheduled_effect/test_golden_chain_ticket_closer.py tests/nodes/node_ticket_closer_scheduled_effect/test_bound_profile.py -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24411-ac1-loop-free
  description: The tick runs its run off the event loop and a second tick during a run starts none (new tests); the same run on the loop thread holds the loop and the in-flight flag cleared starts a second run (controls).
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_ticket_closer_scheduled_effect/test_tick_leaves_loop_free.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24411-ac2-chain-tests
  description: The closer golden, error and failing-control chains and the bound profile tests, now async, with no assertion changed.
  source: manual
  binds_ac:
  - AC2
  checks:
