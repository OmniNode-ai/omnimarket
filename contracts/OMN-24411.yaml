    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24411 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_ticket_closer_scheduled_effect/test_tick_leaves_loop_free.py tests/nodes/node_ticket_closer_scheduled_effect/test_golden_chain_ticket_closer.py tests/nodes/node_ticket_closer_scheduled_effect/test_bound_profile.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24411-ac3-hosted-readback
  description: The closer's golden chain and the loop-freedom test pass on a hosted runner with the handler a coroutine; the running-runtime reading is posted as a ticket comment after the roll.
  source: manual
  binds_ac:
