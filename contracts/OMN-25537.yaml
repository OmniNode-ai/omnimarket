schema_version: 1.0.0
ticket_id: OMN-25537
title: A ruling written on the ledger of record reaches the ledger every lab host reads within 5 minutes
summary: The rolling ledger reaches a lab host only through git (the hourly clone fast-forward, which moves tracked files), so on 2026-11-18 the newest canonical row on h051, h053, h201 and h202 was weeks old and the newest ruling 35 days old. node_work_ledger_host_mirror_effect appends the rows the host has not seen, read over the bus from the work ledger read node, to <registry root>/.onex_state/ledger-mirror/host-ledger-mirror.md (authority rows, 1 day) and host-ledger-rulings.md (rulings and consents, 30 days), and a declared systemd user unit (ledger-host-mirror-systemd, installed with onex-host-install-units) ticks it every 120 s.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn25537-ac1
  statement: the staleness of the ledger copy on each of h051, h053, h201 and h202 is measured and written in the PR body, with the sync path named for each
  acceptance:
  - id: AC1
    statement: 'AC1: the staleness of the ledger copy on each of h051, h053, h201 and h202 is measured and written in the PR body, with the sync path named for each -- falsifier: the PR body lacking a per-host age line for any of the four hosts'
- id: req-omn25537-ac2
  statement: a test built from the recorded staleness reading fails on the broken sync declaration and passes on the fix
  acceptance:
  - id: AC2
    statement: 'AC2: a test built from the recorded staleness reading fails on the broken sync declaration and passes on the fix -- falsifier: `uv run pytest -q` on the test file the PR names, red at the base commit and green at the head'
- id: req-omn25537-ac3
  statement: a new RULING or MSG row written on the ledger of record is read on all four hosts within 300 seconds
  acceptance:
  - id: AC3
    statement: 'AC3: a new RULING or MSG row written on the ledger of record is read on all four hosts within 300 seconds -- falsifier: a read on each host of the row''s stamp, taken at most 300 s after the write, absent at the base install'
- id: req-omn25537-ac4
  statement: the PR body carries a Lab line naming the install and its receipt
  acceptance:
  - id: AC4
    statement: 'AC4: the PR body carries a Lab line naming the install and its receipt -- falsifier: the guard-create check of landing_text.py refusing a body with no Lab line'
