- id: dod-omn26413-ac1
  description: 'AC1 (the OMN-26413 ticket''s table): for one store, the headline''s runs_unknown_spend (from the row the delegation path''s refresh stores), the savings view''s unpriced_call_count and model-routing''s summed unmeasured_cost_count agree for no tokens, estimated usage, unknown usage, no call row, returned to the caller, fixture, experiment and a second tenant''s run (plus NULL data_source and NULL tenant guards); each population case fails again when its view filter is removed; fails on omnimarket dev.'
  source: manual
