schema_version: 1.0.0
ticket_id: OMN-26413
title: 'For one store, the metering headline and the savings and model-routing views count different runs as unpriced: a $0 run on an unlisted model whose usage is estimated reads 0, 1 and 1'
summary: 'The metering headline counts a run as unknown spend only if it is a real run (not a fixture or experiment), was not returned to the caller, recorded tokens, has measured call usage and belongs to the tenant. The savings view and model-routing applied none of those filters (routing left out experiment rows only), so for one store the three unpriced counts differed. Savings view revision 8 and model-routing view v6, each a new one-time store step, count unpriced only over the runs the headline classes as priced or unknown spend (not unknown tokens, not returned to the caller); every other served field is unchanged. The headline, its refresh after each delegation and `onex metering`''s staleness check now read only the tenant''s own rows, matched as the projection writer records them (the canonical UUID, a slug resolved through the tenant registry mirror); read_metering_records takes tenant_id as a required argument, as the views and the shared Postgres refresh already do; on a store holding rows with no tenant or another tenant, the headline''s figures fall to the tenant''s own rows.'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn26413-one-unpriced-population
  statement: For one store, the metering headline and the local savings and model-routing views count unpriced runs over the same runs.
  acceptance:
  - id: AC1
    statement: 'AC1: for one store, the metering headline, the savings view and model-routing serve the same unpriced count for each of the eight cases in the table above -- falsifier: a pytest written before the fix that builds each case''s store and fails on omnimarket dev unless the three counts agree'
  - id: AC2
    statement: 'AC2: the same three counts agree for each of the 16 per-run rule cases (NULL cost on a listed and on an unlisted model; unlisted at $0, positive and negative; listed priced at $0 and positive; listed free at $0 and positive; an upper-case name matching a lower-case manifest key; model_name empty or NULL with delegated_to listed; model_name unlisted with delegated_to listed; model_name listed with delegated_to unlisted; both empty; an untiered unlisted $0 run; a store with no call rows) -- falsifier: the same pytest''s rule cases, each shown failing on a deliberate break of the view''s unpriced rule'
evidence_requirements:
- kind: tests
  description: The one-unpriced-population tests pass at the pushed head.
  command: uv run pytest tests/unit/projection/test_omn26413_one_unpriced_population.py -q -p no:randomly --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
