  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/ci/test_check_wire_compatibility_omn18868.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24967-ac4
  description: AC4 no file this change touches names the retired package; the check is the AC's own grep over the diff against origin/dev, so only the local Done gate runs it.
  source: manual
  execution_scope: local_done_gate
  binds_ac:
  - AC4
  checks:
  - check_type: command
    check_value: "bash -c 'out=\"$(git diff --name-only --diff-filter=d origin/dev...HEAD | xargs -r git grep -n -i -E \"omnibase[_-]compat\" --)\"; test -z \"$out\"'"
    cwd: .
- id: dod-omn24967-ac5
