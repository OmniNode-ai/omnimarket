schema_version: '1.0.0'
ticket_id: OMN-22214
title: The delivery gate accepts generated pytest files whose assertions fail against the reference function
summary: The test class shared the code criteria, none of which runs the answer, so a generated pytest file whose assertions fail against the function under test was accepted. When a test task supplies a reference function, HandlerTestClassReferenceRun runs the generated file whole and test by test against it in the named-test sandbox, and the test-class rubric's new generated_tests_pass_reference criterion refuses the file when any test fails or none is named.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn22214-test-class-runs-tests
    statement: A test-class answer is run against the reference function the task supplies, and a file with a failing test is refused while a passing one is still accepted.
    acceptance:
      - id: AC1
        statement: 'AC1: when a task supplies a reference function for the test class, the gate runs the generated tests against it and refuses a file with a failing test -- falsifier: uv run pytest tests/unit/delegation/test_test_class_gate_runs_tests.py -q -k failing_test_refused, the clamp_ratio file with the wrong expected value, which is accepted today'
      - id: AC2
        statement: 'AC2: a test file that passes against the reference function is still accepted -- falsifier: uv run pytest tests/unit/delegation/test_test_class_gate_runs_tests.py -q -k passing_test_accepted'
      - id: AC3
        statement: 'AC3: a regression test built from the recorded answers of runs ec36740b, fdc2c87b and 9fcc7932 (scrubbed) fails on the current gate and passes on the fix -- falsifier: uv run pytest tests/unit/delegation/test_test_class_gate_runs_tests.py -q -k receipt_ec36740b'
evidence_requirements:
  - kind: tests
    description: The focused test-class gate tests (AC1 to AC3) plus the no-reference and runner-spec cases.
    command: uv run pytest tests/unit/delegation/test_test_class_gate_runs_tests.py -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn22214-ac1
    description: The clamp_ratio file with the wrong expected value of run ec36740b is run against the reference and refused by generated_tests_pass_reference, which names the failing test.
    source: manual
    binds_ac: [AC1]
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/delegation/test_test_class_gate_runs_tests.py -q --no-cov -k failing_test_refused
        cwd: .
  - id: dod-omn22214-ac2
    description: A clamp_ratio test file whose tests all pass against the reference is accepted with the criterion PASS.
    source: manual
    binds_ac: [AC2]
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/delegation/test_test_class_gate_runs_tests.py -q --no-cov -k passing_test_accepted
        cwd: .
  - id: dod-omn22214-ac3
    description: Each of the three recorded wrong expected values (runs ec36740b, fdc2c87b, 9fcc7932) is accepted without the reference run and refused with it; the test file does not import on the merge base.
    source: manual
    binds_ac: [AC3]
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/delegation/test_test_class_gate_runs_tests.py -q --no-cov -k receipt_ec36740b
        cwd: .
  - id: dod-omn22214-deploy-probe
    description: 'Deploy probe: the class rubric config GitHub serves at the checked-out commit gives the test class the generated_tests_pass_reference criterion, which the merge base does not.'
    source: manual
    checks:
      - check_type: command
        check_value: >-
          bash -o pipefail -c 'gh api "repos/OmniNode-ai/omnimarket/contents/src/omnimarket/configs/delegation_class_rubrics.v1.yaml?ref=$(git rev-parse HEAD)" --jq .content | base64 -d | grep -F "criterion_id: generated_tests_pass_reference" > /dev/null'
        cwd: .
  - id: dod-omn22214-integration-proof
    description: The pushed head ran the focused tests of this change (the test-class gate refuses a failing generated test and accepts a passing one) on a lab host and exited 0. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-22214 --kind test -- uv run --frozen pytest tests/unit/delegation/test_test_class_gate_runs_tests.py -q --no-cov
        cwd: .
