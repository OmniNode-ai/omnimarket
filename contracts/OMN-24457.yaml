schema_version: 1.0.0
ticket_id: OMN-24457
title: Dev unhealthy alarm reaches the orchestrator
summary: The lab alarm's delivery node gains an owner route. A condition the overlay routes to an owner, when its episode enters the alarm state, delivers one push notice and one ledger MSG row addressed to the owner lane carrying the reading, once per episode under the delivery's dedupe window, retried until it lands, and a failed step reads as a failed run. Every lane, ticket, category and text is the overlay's.
is_seam_ticket: true
interface_change: true
interfaces_touched:
- public_api
requirements:
- id: req-omn24457-owner-route
  statement: node_lab_alarm_deliver_effect delivers one push notice and one MSG row to the overlay's owner lane when a routed condition enters the alarm state, and no second one until the episode ends and the dedupe window passes.
  acceptance:
  - id: AC1
    statement: 'AC1: a container-unhealthy or dev-readiness alarm read from a synthetic snapshot delivers exactly one ledger message addressed to the orchestrator lane, carrying the reading, and one push notice -- falsifier: pytest tests/nodes/node_lab_alarm_deliver_effect/test_owner_route.py -q'
  - id: AC2
    statement: 'AC2: a repeat of the same reading inside the episode delivers nothing further, and an OK reading ends the episode so a new breach delivers again -- falsifier: pytest tests/nodes/node_lab_alarm_deliver_effect/test_owner_route.py -k episode -q'
  - id: AC3
    statement: 'AC3: a failed owner message is kept and retried on the next run and the run reads as failed, never as delivered -- falsifier: pytest tests/nodes/node_lab_alarm_deliver_effect/test_owner_route.py -k failure -q'
  - id: AC4
    statement: 'AC4: integrated: on the lab runtime a synthetic unhealthy reading through the delivery node produces one message to the orchestrator in the rolling ledger -- falsifier: onex node run of the delivery node on lane dev with the synthetic request, then the ledger read shows zero rows addressed to the orchestrator citing the request id'
evidence_requirements:
- kind: tests
  description: Golden, failing-control and error tests of the owner route
  command: uv run --frozen pytest tests/nodes/node_lab_alarm_deliver_effect -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24457-tests
  description: AC1 to AC3 proven by the named tests, which fail on the delivery handler of the merge base; AC4 is read on a lab host and named in the pull request.
  source: manual
  binds_ac:
  - AC1
  - AC2
  - AC3
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_lab_alarm_deliver_effect -q --no-cov
    cwd: .
- id: dod-omn24457-deploy-conditions
  description: 'Deploy probe the hosted runner can run: the delivery node overlay at the checked-out commit declares owner_routes; the line does not exist at the merge base, so the probe fails there.'
  source: manual
  checks:
  - check_type: command
    check_value: bash -o pipefail -c 'gh api "repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_lab_alarm_deliver_effect/overlay.py?ref=$(git rev-parse HEAD)" --jq .content | base64 -d | grep -F "owner_routes" > /dev/null'
    cwd: .
- id: dod-omn24457-integration-proof
  description: The change is run on a lab host at the pushed head with a synthetic unhealthy request and the owner row is read in the ledger; the reading is named in the pull request.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane why-process-6803 -- uv run --frozen pytest tests/nodes/node_lab_alarm_deliver_effect -q --no-cov
    cwd: .
