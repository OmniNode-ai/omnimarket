schema_version: 1.0.0
ticket_id: OMN-26488
title: Omnimarket dev CI Summary is red at 4c9f4e97eb on Tests Split 14/20, and the cause is found and fixed
summary: "The repo contract binding test failed on dev because seven accepted evidence items in contracts/OMN-22016.yaml and contracts/OMN-22020.yaml named their pytest run under check_type command, which the binding check reads as no test file when the run carries uv's --frozen flag. The seven items now use check_type test_passes with the same command text, so the binding test reads each pytest target and finds it in the tree. No check was widened, skipped or retried."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn26488-contract-binding-green
  statement: The repo contract binding test passes on dev again because the accepted evidence items declare their pytest runs as test_passes checks.
  acceptance:
  - id: AC2
    statement: 'AC2: a regression is fixed by a pull request against dev with a test that fails on the broken code and passes on the fix, with no skip and no widened check -- falsifier: uv run pytest on the named test fails at dev head 4c9f4e97eb and passes on the PR head'
  - id: AC3
    statement: 'AC3: the accepted AC14 evidence item in contracts/OMN-22519.yaml declares its pytest run as a test_passes check, so the binding test reads its test file -- falsifier: uv run pytest on the two named binding tests fails at dev head 06cc078369 and passes on the PR head'
