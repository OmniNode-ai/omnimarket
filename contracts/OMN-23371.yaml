schema_version: "1.0.0"
ticket_id: "OMN-23371"
title: "A lab lane's in-process delegate retry is admitted by the local tenant mirror instead of refused for its lab tenant"
summary: "The local tenant mirror requirement (OMN-22221) records, in a local sqlite evidence mirror, the tenant the lab_hosts overlay declares for the lane's own host (the row named by ONEX_LANE_HOST, its tenant_id), so the in-process delegate retry of a lab lane that carries that tenant as ONEX_TENANT_ID is admitted. A tenant the overlay does not declare for this host is refused with the same OMN-22221 refusal. Only a local sqlite target is written; a deployed store is never seeded."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-omn23371-declared-host-tenant-admitted"
    statement: |-
      The local tenant mirror admits the tenant the lab host table declares for this host and refuses every other tenant with the OMN-22221 refusal.
    acceptance:
      - id: "AC1"
        statement: "AC1: an in-process delegate retry under the lab tenant is admitted by the local tenant mirror when that tenant is declared for the host -- falsifier: uv run pytest over the tenant mirror tests with the lab tenant set fails today with the OMN-22221 refusal"
      - id: "AC2"
        statement: "AC2: an undeclared tenant is still refused with the same typed refusal -- falsifier: a pytest case with an unknown tenant that is admitted"
      - id: "AC3"
        statement: "AC3: one lab lane's delegate run that falls back in process returns a receipt with status success -- falsifier: the receipt of a lab-run delegate on h051 after rollout"
evidence_requirements:
  - kind: "tests"
    description: "The declared-host-tenant admission tests and the OMN-22221 refusal tests pass."
    command: "uv run --frozen pytest tests/unit/handlers/test_tenant_mirror_declared_host_tenant.py tests/unit/handlers/test_tenant_identity_unmirrored_loud.py -q --no-cov"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn23371-declared-host-tenant-admitted"
    description: "A tenant declared in the lab host table for the lane's host is admitted and recorded in the local sqlite mirror, an in-process dispatch under it completes with its delegation_events row, and the same tenant refuses at the merge base (the failing control)."
    source: "manual"
    binds_ac: ["AC1"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run --frozen pytest tests/unit/handlers/test_tenant_mirror_declared_host_tenant.py -q --no-cov -k 'declared_host_tenant_is_admitted or declared_host_tenant_admission_is_idempotent or declared_tenant_completes'"
        cwd: "."
  - id: "dod-omn23371-undeclared-refused"
    description: "An unknown tenant, a tenant declared for another host, a lane that names no host, a host with no row, and a non-sqlite target each still raise the OMN-22221 refusal and write no mirror row."
    source: "manual"
    binds_ac: ["AC2"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run --frozen pytest tests/unit/handlers/test_tenant_mirror_declared_host_tenant.py tests/unit/handlers/test_tenant_identity_unmirrored_loud.py -q --no-cov -k 'refused'"
        cwd: "."
  - id: "dod-omn23371-integration-proof-lab-delegate"
    description: "After the branch is installed on a lab host, a lab lane's in-process delegate under the lab tenant returns a receipt with status success. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound item; the lane records the host, run id and receipt in the pull request."
    source: "manual"
    execution_scope: "local_done_gate"
    binds_ac: ["AC3"]
    checks:
      - check_type: "command"
        check_value: "uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha \"$(git rev-parse HEAD)\" --lane tenantmirror-1740 -- uv run --frozen pytest tests/unit/handlers/test_tenant_mirror_declared_host_tenant.py -q --no-cov"
        cwd: "."
  - id: "dod-omn23371-deploy-artifact-readback"
    description: "Hosted-runner deploy artifact readback fetches the tenant mirror requirement at the evaluated commit, compares it with this checkout and requires the declared-host-tenant admission and its call. This checks published source only; it does not establish a lane rollout."
    source: "manual"
    execution_scope: "hosted_and_local"
    checks:
      - check_type: "command"
        check_value: |
          set -eu;
          readback_dir="$(mktemp -d)";
          trap 'rm -rf "$readback_dir"' EXIT;
          revision="$(git rev-parse HEAD)";
          requirement=src/omnimarket/handlers/tenant_mirror_requirement.py;
          curl --fail --silent --show-error --location --max-time 30 \
            "https://raw.githubusercontent.com/OmniNode-ai/omnimarket/$revision/$requirement" \
            --output "$readback_dir/requirement.py";
          cmp "$requirement" "$readback_dir/requirement.py";
          grep -F 'ensure_declared_host_tenant_mirrored(db, tenant_id)' "$readback_dir/requirement.py";
          printf 'declared host tenant deploy artifact readback matched %s\n' "$revision"
        cwd: "."
