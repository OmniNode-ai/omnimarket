schema_version: 1.0.0
ticket_id: OMN-23194
title: The work-ledger rebuild drops the sequence of a replayed unsequenced row, and the guard replay starts a mid-hold window with an empty ledger
summary: The rebuild skipped a row it had already seen, so an unsequenced bootstrap row met later by its sequenced live twin kept a NULL ledger_seq while the live projection promotes it. The guard replay judged every window against an empty ledger, so a window that began inside a HOLD was judged without the rows before it. The rebuild now takes the sequence from the sequenced copy and still refuses two sequences for one row; the replay request carries the rows accepted before the window, and a window whose RELEASE names a hold nothing opened is refused as incomplete.
