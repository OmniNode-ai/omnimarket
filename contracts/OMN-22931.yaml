schema_version: 1.0.0
ticket_id: OMN-22931
title: The floor-fill nodes import their shared models from one floor-fill models package
summary: The models of node_floor_fill_candidates_compute, node_floor_fill_lines_compute and node_floor_fill_reducer move into omnimarket.models.floor_fill, the way the 17a floor models sit in omnimarket.models.floor_17a. The three contracts name the moved models, the node packages hold no models directory, and a new test reads every import in the floor fill nodes and refuses a shared model that comes from a sibling node, which test_no_cross_node_reach_in does not see when the import line goes through a sibling handlers package. The cross-node allowlist gains no entry.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn22931-floor-fill-models
  statement: The floor fill nodes share their models through one package, and no node reaches into a sibling node's handlers or models package for one.
  acceptance:
  - id: AC1
    statement: 'AC1: one floor-fill models package holds the models T1, T4 and T12 share, and T1, T4, T12 and T13 import them from it and from no sibling handlers package -- falsifier: uv run pytest of test_no_cross_node_reach_in, which fails on a node that imports a sibling handlers package'
  - id: AC2
    statement: 'AC2: the cross-node allowlist gains no entry -- falsifier: uv run pytest of test_no_cross_node_reach_in with the allowlist file diffed against origin/dev showing no added line'
  - id: AC3
    statement: 'AC3: each of T1, T4, T12 and T13 passes its own tests after the move, with a failing control that renames one model and fails the importing nodes -- falsifier: uv run pytest of the four nodes test directories'
evidence_requirements:
- kind: tests
  description: The tests of the three nodes on dev, the shared-models import test and the cross-node reach-in test.
  command: uv run --frozen pytest src/omnimarket/nodes/node_floor_fill_candidates_compute src/omnimarket/nodes/node_floor_fill_lines_compute src/omnimarket/nodes/node_floor_fill_reducer tests/nodes/node_floor_fill_candidates_compute tests/nodes/node_floor_fill_reducer tests/test_floor_fill_shared_models.py tests/test_no_cross_node_reach_in.py -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn22931-ac1
  description: The package holds the models of the three nodes, no floor fill node takes a shared model from a sibling node, and the controls show the test finding a model imported through a sibling handlers package and through a sibling models package.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/test_floor_fill_shared_models.py tests/test_no_cross_node_reach_in.py -q --no-cov
- id: dod-omn22931-ac2
  description: The cross-node allowlist file names no floor fill node and still holds its frozen count; it is also the file on origin/dev, byte for byte (git diff --exit-code origin/dev -- tests/test_no_cross_node_reach_in.py).
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/test_floor_fill_shared_models.py tests/test_no_cross_node_reach_in.py -q --no-cov -k "allowlist or known_violations_not_grown"
- id: dod-omn22931-ac3
  description: The node tests of T1, T4 and T12 pass after the move and import their models from the package; T13 is not on dev and takes its retarget in the stacked pull request on its own branch.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest src/omnimarket/nodes/node_floor_fill_candidates_compute src/omnimarket/nodes/node_floor_fill_lines_compute src/omnimarket/nodes/node_floor_fill_reducer tests/nodes/node_floor_fill_candidates_compute tests/nodes/node_floor_fill_reducer tests/test_floor_fill_shared_models.py -q --no-cov
- id: dod-omn22931-integration-proof
  description: Run the tests of the three floor fill nodes, the shared-models import test and the cross-node reach-in test on a lab host at the pushed head. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-22931 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest src/omnimarket/nodes/node_floor_fill_candidates_compute src/omnimarket/nodes/node_floor_fill_lines_compute src/omnimarket/nodes/node_floor_fill_reducer tests/nodes/node_floor_fill_candidates_compute tests/nodes/node_floor_fill_reducer tests/test_floor_fill_shared_models.py tests/test_no_cross_node_reach_in.py -q --no-cov
