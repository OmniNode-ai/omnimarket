    acceptance:
      - id: "AC1"
        statement: |-
          AC1: a clone refused for the declared age converges, source paths on a pushed rescue branch and generated or host-value paths never pushed -- falsifier: uv run pytest tests/unit/clone_dirty_converge -q
      - id: "AC2"
        statement: |-
          AC2: a clone not yet refused for the age, one ahead of its upstream and one whose rescue push fails are left as they were -- falsifier: uv run pytest tests/unit/clone_dirty_converge -q -k "not_yet_refused or ahead_of_its_upstream or failed_rescue_push"
