---
schema_version: "1.0.0"
ticket_id: "OMN-26216"
title: "Failure rows get readers and alarms: a reconcile-failure alert, a tick addressee test, a placed-lane-needs-CLAIM check and CLAIM name binding to the sidecar name"
summary: "A non-zero host reconcile exit writes one FRICTION alarm row and one alert on the first failure; the tick alarms on a MSG addressed to a name that is not a live lane or left unACKed for two ticks; a dispatched lane is placed only by a CLAIM with host= and run= inside five minutes, otherwise the tick writes STATUS unplaced; the placement CLAIM is written under the sidecar lane name."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-omn26216-ac1"
    statement: |-
      a non-zero onex-host-reconcile exit writes one FRICTION row and one alert on the first failure.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: a non-zero onex-host-reconcile exit writes one FRICTION row and one alert on the first failure -- falsifier: uv run pytest tests/ -k reconcile_failure_alert exits non-zero
  - id: "req-omn26216-ac2"
    statement: |-
      a tick MSG whose addressee does not resolve to a live lane fails the build, and one unACKed after two ticks opens the cause lane.
    acceptance:
      - id: "AC2"
        statement: |-
          AC2: a tick MSG whose addressee does not resolve to a live lane fails the build, and one unACKed after two ticks opens the cause lane -- falsifier: uv run pytest tests/ -k tick_addressee_resolves exits non-zero
  - id: "req-omn26216-ac3"
    statement: |-
      a lane counts as placed only when a CLAIM with host= and run= appears within five minutes, otherwise the tick writes STATUS unplaced.
    acceptance:
      - id: "AC3"
        statement: |-
          AC3: a lane counts as placed only when a CLAIM with host= and run= appears within five minutes, otherwise the tick writes STATUS unplaced -- falsifier: uv run pytest tests/ -k placed_needs_claim exits non-zero
  - id: "req-omn26216-ac4"
    statement: |-
      the placement CLAIM carries the sidecar lane name, and a replay of the 18 refused create payloads gives zero refusals.
    acceptance:
      - id: "AC4"
        statement: |-
          AC4: the placement CLAIM carries the sidecar lane name, and a replay of the 18 refused create payloads gives zero refusals -- falsifier: uv run pytest tests/ -k sidecar_name_replay exits non-zero
