schema_version: 1.0.0
ticket_id: OMN-25639
title: A pool snapshot host whose accounts read failed is unread, never zero free slots
summary: The lane host pool snapshot wrote every refusal alike as zero free slots, so a host whose token pool read failed (the command ended 3 on five hosts on 2026-11-18) read as a full host and the snapshot total read 0 while the per-host headroom held about 60 free slots. A host whose accounts read failed now carries no free-slot figure and an accounts_unread marker in its row, adds nothing to free_slots_total, is named in the record's unread_hosts, and the run line names how many hosts are unread. Not in this change - the overlay value that makes the token pool command end 3 (the ssh shell carries no overlay roots) and the shape of the status output the node reads, both of which belong to the overlays repository and a following ticket.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn25639-unread-not-zero
  statement: A host whose accounts could not be read is written as unread in the row and the record and adds nothing to the total, and every other refusal keeps its zero.
  acceptance:
  - id: AC2
    statement: "AC2: a regression test built from the recorded pool.json readings (fixture path in the test) fails on the unfixed head because a host whose accounts read failed is written with zero free slots, and passes on the fix where that host reads unread and adds nothing to free_slots_total -- falsifier: uv run pytest tests/nodes/node_lane_host_pool_snapshot_effect -q -k unread exits 0 on the base head or exits nonzero on the fix head"
  - id: AC3
    statement: "AC3: integrated: the fixed node's run line names the unread hosts and the hosts that were read carry their free slots, checked on a lab host against the pool's own accounts command -- falsifier: a run line with a host that has free slots shown as zero without an unread marker"
evidence_requirements:
- kind: tests
  description: The pool snapshot node tests at the pushed head; the unread tests fail on the base head.
  command: uv run pytest tests/nodes/node_lane_host_pool_snapshot_effect -q -n 0 --no-cov -p no:cacheprovider -k unread
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn25639-ac2
  description: 'AC2: the unread tests, built from the fixture of the recorded readings, pass with the change; on the base head the unread row test fails with "h051 was written with 0".'
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_lane_host_pool_snapshot_effect/test_pool_snapshot_unread.py -q -n 0 --no-cov -p no:cacheprovider
    cwd: .
- id: dod-omn25639-integration-proof
  description: 'AC3 lab proxy: the pool snapshot node tests run on a lab host at the pushed head; the Mac reading of last-run.json and pool.json against the headroom read is taken by the orchestrating session after the merge and is not claimed by this local check'
  source: manual
  execution_scope: local_done_gate
  binds_ac:
  - AC3
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-25639 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_lane_host_pool_snapshot_effect -q --no-cov -p no:randomly
    cwd: .
- id: dod-omn25639-ac3-hosted-record
  description: 'AC3 hosted proxy: the unread tests that assert the read hosts keep their free slots, the unread hosts are named in unread_hosts and carry no zero, run on the hosted runner at the checked-out head. The lab-host reading against the live accounts command stays in dod-omn25639-integration-proof.'
  source: manual
  execution_scope: hosted_and_local
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_lane_host_pool_snapshot_effect/test_pool_snapshot_unread.py -q -n 0 --no-cov -p no:cacheprovider -k "named or not_written"
    cwd: .
