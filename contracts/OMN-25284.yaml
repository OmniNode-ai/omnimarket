schema_version: 1.0.0
ticket_id: OMN-25284
title: 'Review findings 1 to 9 on omnimarket PR 6344 at head 2fe06ada0861 are fixed or argued: the contracts name literal owner
  tickets, AC1 binds to a check that fails until met, the local tier input is bounded by a token upper bound and the Lab comment
  is at the new head'
summary: 'Fifth review follow-up of omnimarket#6344: the local tier declares a tokenizer-free input-token bound sized for the
  smallest spread member, so no dense prompt of the old 35000 budget is sent to a local member; AC1 of the OMN-24980 contract
  is bound to a check that fails until a base-failing test of the cause is recorded; the recorded delegate run is the real CLI
  stdout; the owner tickets of the follow-ups do not exist and are named so, with nothing invented; the dev mount is not updated
  by this lane and the dev run state is recorded.'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn25284-review-follow-up
  statement: Every blocking finding of the fifth review of omnimarket#6344 is fixed or argued with evidence.
  acceptance:
  - id: AC2
    statement: 'AC2: AC1 of the OMN-24980 contract binds to a base-failing test in the owning repository or an owner re-scope
      is recorded, and the recorded delegate_stdout_local.json run fails the AC1 check -- falsifier: `uv run pytest tests/nodes/node_delegation_routing_reducer/test_contract_proof_omn24980.py
      -q -p no:cacheprovider` fails when a one-line summarise run at tier local satisfies the AC1 binding'
  - id: AC3
    statement: 'AC3: max_tokens is clamped at dispatch or the input gate counts tokens with a tokenizer, so a prompt denser than
      the 2.21 characters per token fit of routing_tiers.yaml cannot overflow the window, and a test pins the digit-named code
      text at 140000 characters -- falsifier: `uv run pytest tests/nodes/node_delegation_routing_reducer/test_local_rung_context_ceiling_omn24980.py
      -q -p no:cacheprovider` fails when a near-budget dense prompt is accepted with a max_tokens that overflows the window'
  - id: AC4
    statement: 'AC4: the spread peer window (65536 per slot, a 16384 output reserve, a 49152 ceiling) is read and the input gate
      is sized for the smallest member, with a test that loads the placement -- falsifier: `uv run pytest tests/nodes/node_delegation_routing_reducer/test_local_rung_context_ceiling_omn24980.py
      -q -p no:cacheprovider` fails when a 35000-estimate prompt that meters 63348 is admitted to the peer'
  - id: AC6
    statement: 'AC6: the full tests/ run at the new head passes with the 65536 to 35000 move of local-coder, in named parts if
      a whole run times out, and any existing routing test that cites 65536 is changed or argued -- falsifier: `uv run pytest
      tests -q -p no:cacheprovider` on the lab at the new head exits 0, one named part per timeout'
  - id: AC7
    statement: 'AC7: the texts of contracts/OMN-25102.yaml (lines 15 and 39) and the OMN-24980 contract (lines 63 to 65) no longer
      say escalation and research are tested against the large-window rungs -- falsifier: `uv run pytest tests/nodes/node_delegation_routing_reducer/test_contract_proof_omn24980.py
      -q -p no:cacheprovider` fails while either text carries the claim'
  - id: AC8
    statement: 'AC8: delegate_stdout_local.json is re-recorded from the real CLI stdout and the contract proof test validates
      it with model_validate -- falsifier: `uv run pytest tests/nodes/node_delegation_routing_reducer/test_contract_proof_omn24980.py
      -q -p no:cacheprovider` fails when the recorded runtime_identity is hand-added or out of key order'
  - id: AC9
    statement: 'AC9: the non-blocking finding (the contracts/OMN-25167.yaml and OMN-25185 dod texts against the OMN-24980 contract,
      44313 against 44290 characters, and the live PR title) is fixed or argued in a PR comment -- falsifier: `uv run pytest tests/nodes/node_delegation_routing_reducer/test_contract_proof_omn24980.py
      -q -p no:cacheprovider` fails when the character count in the contract differs from the metered count'
evidence_requirements:
- kind: tests
  description: Focused tests of every file the change touches.
  command: uv run pytest tests/nodes/node_delegation_routing_reducer/test_local_rung_context_ceiling_omn24980.py tests/nodes/node_delegation_routing_reducer/test_contract_proof_omn24980.py
    -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn25284-ac1
  description: The contracts of OMN-24980 and OMN-25214 carry a literal ticket_id; the follow-up owner tickets are literal ids
    or the recorded absence (no owner ticket exists, the orchestrator files it, nothing invented), refused when a null names no
    statement; the Lab comment of the new head is posted after the push.
  source: manual
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_delegation_routing_reducer/test_contract_proof_omn24980.py -q -p no:cacheprovider
      --no-cov
    cwd: .
- id: dod-omn25284-ac2
  description: AC1 of OMN-24980 is bound to a check that fails until a base-failing test of the cause is recorded in its owning
    repository; the recorded one-line summarise run at tier local, accepted, fails that check until then.
  source: manual
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_delegation_routing_reducer/test_contract_proof_omn24980.py -q -p no:cacheprovider
      --no-cov
    cwd: .
  binds_ac:
  - AC2
- id: dod-omn25284-ac3
  description: Each local member takes its own input bound (omnimarket.handlers.routing.input_token_bound), a tokenizer-free upper bound
    on metered input that never undercounts a lab reading; every generated dense prompt of 140000 characters (digit-named code text at 69445 metered tokens included)
    is refused at every local member.
  source: manual
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_delegation_routing_reducer/test_local_rung_context_ceiling_omn24980.py -q -p no:cacheprovider
      --no-cov
    cwd: .
  binds_ac:
  - AC3
- id: dod-omn25284-ac4
  description: The spread peer's window (65536 per slot, 16384 output reserve, 49152 ceiling) is recorded from the lab overlay,
    the peer takes its own input bound (48128), and a test loads the placement and shows the peer receives no dense prompt of the
    old budget.
  source: manual
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_delegation_routing_reducer/test_local_rung_context_ceiling_omn24980.py -q -p no:cacheprovider
      --no-cov
    cwd: .
  binds_ac:
  - AC4
- id: dod-omn25284-ac5
  description: The OMN-24980 contract records the dev lane read (run 6b24f056 answered by openrouter-north-mini-code at 15335
    input tokens) and that no passing hosted dev run exists, because the dev mount is updated only through its owner; in-process
    runs are listed as not counting.
  source: manual
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_delegation_routing_reducer/test_contract_proof_omn24980.py -q -p no:cacheprovider
      --no-cov
    cwd: .
- id: dod-omn25284-ac6
  description: The routing directory runs here; the full tests/ run is on the lab in named parts, listed with their exits in the
    Lab comment of the new head.
  source: manual
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_delegation_routing_reducer -q -p no:cacheprovider --no-cov
    cwd: .
  binds_ac:
  - AC6
- id: dod-omn25284-ac7
  description: contracts/OMN-25102.yaml (AC2 and the output-reserve evidence text) and the OMN-24980 contract no longer say escalation
    and research are tested against the large-window rungs; a test finds the old wording by pattern.
  source: manual
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_delegation_routing_reducer/test_contract_proof_omn24980.py -q -p no:cacheprovider
      --no-cov
    cwd: .
  binds_ac:
  - AC7
- id: dod-omn25284-ac8
  description: delegate_stdout_local.json is the stdout of a real CLI run (a5f1ef93-d5c1-4535-8211-dc8cedc83fda) in the printed
    key order, validated with ModelSkillResult.model_validate; a reordered or late-stamped runtime_identity is refused.
  source: manual
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_delegation_routing_reducer/test_contract_proof_omn24980.py -q -p no:cacheprovider
      --no-cov
    cwd: .
  binds_ac:
  - AC8
- id: dod-omn25284-ac9
  description: The OMN-24980 contract states the repeated-character prompt as 44313 characters (the recorded reading), and the
    OMN-25167 and OMN-25185 dod texts agree with the bound criteria and the 35000 budget with its tier bound; the PR title is
    read with onex scm pr-view and the body is not edited.
  source: manual
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_delegation_routing_reducer/test_contract_proof_omn24980.py -q -p no:cacheprovider
      --no-cov
    cwd: .
  binds_ac:
  - AC9
- id: dod-omn25284-integration-proof
  description: Run the focused routing and contract-proof tests on a lab host at the pushed head. Hosted CI cannot reach the lab,
    so only the local Done gate runs this unbound check; it binds no acceptance criterion.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane
      dod-integration-proof-25284 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_delegation_routing_reducer/test_local_rung_context_ceiling_omn24980.py
      tests/nodes/node_delegation_routing_reducer/test_contract_proof_omn24980.py -q --no-cov
    cwd: .
- id: dod-omn25284-open-criteria-gate
  description: 'The local Done gate refuses while AC1 and AC5 are open: it reads context.open_criteria (and, where the contract records
    them, a null owner ticket or a null passing hosted run) and exits 1 naming each, so no hosted check and no unbound
    item can pass for a criterion this change does not meet. It binds no criterion (a local_done_gate item may not).'
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: |-
      python3 -c 'import sys, yaml; c = yaml.safe_load(open("contracts/OMN-25284.yaml")).get("context") or {}; p = ["open criterion " + k for k in (c.get("open_criteria") or {})]; p += ["owner ticket " + k + " is null" for k, v in (c.get("owner_tickets") or {}).items() if not v.get("ticket")]; r = c.get("dev_ladder_run"); p += ["no passing hosted dev run"] if r is not None and not r.get("passing_hosted_run") else []; print(chr(10).join(p), file=sys.stderr); sys.exit(1 if p else 0)'
    cwd: .
context:
  open_criteria:
    AC1: 'AC1: the ticket fields of the OMN-24980 and OMN-25214 contracts name literal ticket ids instead of null, and a PR
      comment starting `Lab: head=<full new head sha>` names each command with exit 0 (the fail-at-53e3cd0f6050 run and an xdist
      run included) -- falsifier: `uv run pytest tests/nodes/node_delegation_routing_reducer/test_contract_proof_omn24980.py
      -q -p no:cacheprovider` fails when a contract ticket field is null or the asserted ids are absent'
    AC5: 'AC5: the dev mount is updated through its owner and one passing hosted dev run is recorded in the contract -- falsifier:
      `uv run pytest tests/nodes/node_delegation_routing_reducer/test_contract_proof_omn24980.py -q -p no:cacheprovider` fails
      when the contract records no dev run or only in-process runs'
  open_criteria_reason: AC1 needs literal owner ticket ids where the OMN-24980 contract records none exist, and AC5 needs one
    passing hosted dev run that does not exist; neither can be met by this change (it mints no ticket and does not update the
    dev mount). They are recorded here and bound to nothing, so no check passes while they are open.
