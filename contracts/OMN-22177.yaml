schema_version: 1.0.0
ticket_id: OMN-22177
title: 'Agent review dispatch node and the review post: the orchestrator reviews one pull request head with lab models and publishes one signed receipt'
summary: node_agent_review_dispatch_orchestrator takes one command (repo, pr, head_sha) on onex.cmd.omnimarket.agent-review-requested.v1, reads the head through injected ports, reuses the receipt stored under repo#pr#head or runs the lab review, signs a candidate, stores it by insert-if-absent and posts the stored receipt as a pull request review through the new source-control write operation pr_review_post; terminals are completed, refused and failed. Every voter, endpoint, threshold and deadline comes from the node overlay. The ports are injected and tested in memory and under the Redpanda overlay; the production adapters are not part of this change.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn22177-ac1
  statement: 'AC1: A head has at most one stored receipt, and a head with a stored receipt is not reviewed again'
  acceptance:
  - id: AC1
    statement: 'AC1: A head has at most one stored receipt, and a head with a stored receipt is not reviewed again -- falsifier: the contention or crash test in `uv run pytest tests/unit/nodes/node_agent_review_dispatch_orchestrator -v -rs` finds two stored receipts, a posted review carrying an id other than the stored one, or a lab call for a head with a stored receipt'
- id: req-omn22177-ac2
  statement: 'AC2: A head observed stale at either read, and a delivery after a recorded terminal, post no review'
  acceptance:
  - id: AC2
    statement: 'AC2: A head observed stale at either read, and a delivery after a recorded terminal, post no review -- falsifier: a test in the same suite finds a review post after a stale read or on a delivery after a recorded terminal (the delivery returns the recorded terminal marked historical)'
- id: req-omn22177-ac3
  statement: 'AC3: The model of the receipt key comes first and holds'
  acceptance:
  - id: AC3
    statement: 'AC3: The model of the receipt key comes first and holds -- falsifier: `git merge-base --is-ancestor <commit adding test_receipt_key_model> <first commit adding the handler> && uv run pytest tests/unit/nodes/node_agent_review_dispatch_orchestrator -k test_receipt_key_model -v -rs` exits non-zero (the ancestor check fails, the two ids are equal, or the test fails because it does not enumerate two requests with a crash before the lab review, after signing, after storing and after the post, or an interleaving ends with two stored receipts, a posted review with a non-stored id, or no receipt stored and published after the retry)'
- id: req-omn22177-ac4
  statement: 'AC4: A forbidden provider or gateway endpoint causes zero calls'
  acceptance:
  - id: AC4
    statement: 'AC4: A forbidden provider or gateway endpoint causes zero calls -- falsifier: the test counts any call on a fake port after loading a roster that names `provider: anthropic` or a review-gateway endpoint'
- id: req-omn22177-ac5
  statement: 'AC5: The agent path verdict equals the CI gate verdict on the three parity fixtures (clean diff, one-voter finding, two-voter finding)'
  acceptance:
  - id: AC5
    statement: 'AC5: The agent path verdict equals the CI gate verdict on the three parity fixtures (clean diff, one-voter finding, two-voter finding) -- falsifier: the parity test in the same suite finds a differing verdict'
- id: req-omn22177-ac6
  statement: 'AC6: The write operation exists in the source-control node'
  acceptance:
  - id: AC6
    statement: 'AC6: The write operation exists in the source-control node -- falsifier: `onex scm verbs` does not list `pr_review_post`'
- id: req-omn22177-ac7
  statement: 'AC7: No voter, endpoint, threshold, repository, deadline or host is a literal in the node, and both profiles pass'
  acceptance:
  - id: AC7
    statement: 'AC7: No voter, endpoint, threshold, repository, deadline or host is a literal in the node, and both profiles pass -- falsifier: the literal-scan test finds one, or `uv run pytest tests/unit/nodes/node_agent_review_dispatch_orchestrator -v -rs` fails to show one `[inmemory] PASSED` and one `[redpanda_overlay] PASSED` line per test function with equal counts and no SKIPPED line'
- id: req-omn22177-ac8
  statement: 'AC8: Lab step: on the lab dev lane one review of a scratch draft pull request in a registry repository (closed unmerged afterwards) shows the receipt review, and a second dispatch of the same head posts no second receipt id'
  acceptance:
  - id: AC8
    statement: 'AC8: Lab step: on the lab dev lane one review of a scratch draft pull request in a registry repository (closed unmerged afterwards) shows the receipt review, and a second dispatch of the same head posts no second receipt id -- falsifier: `onex run-node node_agent_review_dispatch_orchestrator` on the dev lane for the same head twice yields a second distinct receipt id'
- id: req-omn22177-dod1
  statement: 'DOD1: Merged in omnimarket and the overlay repository, and the node is registered and answers on the lab dev lane at the release tag the lab deploys from'
  acceptance:
  - id: DOD1
    statement: 'DOD1: Merged in omnimarket and the overlay repository, and the node is registered and answers on the lab dev lane at the release tag the lab deploys from -- falsifier: the required context `CI Summary` is not green on the merged omnimarket PR head, or the required context `ci` is not green on the merged overlay repository PR head, or the dev lane reports a tag older than the merge commit'
evidence_requirements:
- kind: tests
  description: The node suite under both profiles, the parity test, the literal scan and the operation-table check.
  command: uv run pytest tests/unit/nodes/node_agent_review_dispatch_orchestrator tests/ci/test_scm_operation_table_omn20912.py -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn22177-ac1
  description: 'AC1: the contention, stored-receipt, failed-run and crash-at-each-step tests find one stored receipt, every posted review carrying its id, and no lab call for a stored head.'
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/nodes/node_agent_review_dispatch_orchestrator -q -n 0 -p no:randomly --no-cov --tb=line -k 'two_simultaneous or stored_receipt or crash_at_each_step or post_that_committed'
    cwd: .
- id: dod-omn22177-ac2
  description: 'AC2: a stale head at the first read and at the re-read post nothing; a delivery after a recorded terminal returns it marked historical and calls no port but the log.'
  source: manual
  binds_ac:
  - AC2
  checks:
