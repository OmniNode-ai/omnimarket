    cwd: .
  - check_type: test_passes
    check_value: uv run pytest tests/unit/nodes/node_agent_review_dispatch_orchestrator -q -n 0 -p no:randomly --no-cov --tb=line -k test_receipt_key_model
    cwd: .
- id: dod-omn22177-ac4
