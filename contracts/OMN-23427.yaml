---
schema_version: "1.0.0"
ticket_id: "OMN-23427"
title: "The picture of all work in progress is published on the message service and fed by tickets, readings and worker receipts"
summary: "The work-state projection is published on onex.snapshot.projection.floor-work-state.v1 by the scheduled projection node, stamped with the time it was built; the floor reads it from the bus (node_floor_projection_read_effect) and the lab fill reads the same bundle entry (work_state_bundle_path), both judging it against its own bound. Three scheduled feeder nodes (the Linear snapshot, the readings and the lane receipts) write the files the projection reads, each on an overlay cadence, each reporting the time of its newest fact, with a join test against the projection's own source readers and a planted field rename."
is_seam_ticket: true
interface_change: true
interfaces_touched:
  - "topics"
  - "events"
  - "public_api"
evidence_requirements:
  - kind: "tests"
    description: "The scheduled projection publishes the projection and the floor projection reader and the lab fill read it back; a stale projection reads unknown."
    command: "uv run --frozen pytest tests/nodes/node_work_state_projection_scheduled_effect tests/nodes/node_lab_fill_effect -q --no-cov -k 'publish_on_schedule or work_state'"
  - kind: "tests"
    description: "Each feeder's golden chain, error chain, contract topics, bus round trip and join test with the projection's source readers, with the planted field rename."
    command: "uv run --frozen pytest tests/nodes/node_work_state_linear_feeder_scheduled_effect tests/nodes/node_work_state_readings_feeder_scheduled_effect tests/nodes/node_work_state_receipts_feeder_scheduled_effect tests/unit/handlers/test_work_state_feeder_scheduled.py -q --no-cov"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn23427-publish-and-read"
    description: "AC1: the scheduled projection publishes on onex.snapshot.projection.floor-work-state.v1 with the projection's own time, the floor's projection reader and the lab fill read it back, and a projection older than its bound reads unknown (the planted stale control)."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run --frozen pytest tests/nodes/node_work_state_projection_scheduled_effect/test_publish_on_schedule.py tests/nodes/node_lab_fill_effect/test_work_state_owners_from_bundle_lab_fill.py -q --no-cov"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC1"]
  - id: "dod-omn23427-feeders"
    description: "AC2: the three feeders are scheduled nodes with contract and overlay values, and each join test reads what the feeder wrote through the projection's own source reader and fails on a planted field rename."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run --frozen pytest tests/nodes/node_work_state_linear_feeder_scheduled_effect tests/nodes/node_work_state_readings_feeder_scheduled_effect tests/nodes/node_work_state_receipts_feeder_scheduled_effect tests/unit/handlers/test_work_state_feeder_scheduled.py -q --no-cov"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC2"]
  - id: "dod-omn23427-integration-proof-lab"
    description: "AC3, runtime integration: the projection read from the lab runtime's bus carries a Linear snapshot, a reading and a receipt each newer than one hour, and the served floor's lane list is drawn from it. Needs the merge and the deploy agent; the host, head and reading are in the pull request comment that names the head. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check."
    source: "manual"
    execution_scope: "local_done_gate"
    checks:
      - check_type: "command"
        check_value: 'env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23427 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_work_state_projection_scheduled_effect tests/nodes/node_work_state_linear_feeder_scheduled_effect tests/nodes/node_work_state_readings_feeder_scheduled_effect tests/nodes/node_work_state_receipts_feeder_scheduled_effect -q --no-cov'
        cwd: "${OMNI_HOME}/omnimarket"
