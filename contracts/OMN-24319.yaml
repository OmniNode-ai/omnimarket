schema_version: 1.0.0
ticket_id: OMN-24319
title: Canonical clone sync must never discard local work
summary: The canonical clone dirty-converge tick no longer resets a clone that holds local work. A clone with a staged file, a modified tracked file, an untracked file or a commit no remote has is refused with a typed reason naming the clone and the kind of work, keeps every byte, and raises one alarm under the condition clone_local_work_refused; only a clone with none is reattached or repaired. Before this the tick ran a hard reset and dropped such work on lab hosts, and the Mac install was held for that reason.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24319-never-drop-local-work
  statement: A canonical clone that holds local work is refused, alarmed and left as found by the converge tick, never reset.
  acceptance:
  - id: AC1
    statement: 'AC1: a clone holding an unpushed commit, a staged file, a modified file or an untracked file is refused with a typed reason naming the clone and the kind of work and keeps every byte, and no reset runs -- falsifier: pytest tests/unit/clone_dirty_converge -q -k "one_kind_of_local_work"'
  - id: AC2
    statement: 'AC2: each refusal raises one alarm under the condition clone_local_work_refused, an alarm that fails to deliver or has no delivery makes the tick exit 1, and a clean tick ends an open episode -- falsifier: pytest tests/unit/clone_dirty_converge -q -k "alarm or seam"'
  - id: AC3
    statement: 'AC3: a clean detached or bare-flagged clone is still reattached or repaired -- falsifier: pytest tests/unit/clone_dirty_converge -q -k "clean_clone or detached or bare_flagged"'
  - id: AC4
    statement: 'AC4: integrated: the changed tick runs on a lab host unit and its journal shows a REFUSED line with the alarm outcome for a planted clone and no dropped work -- falsifier: journalctl --user -u onex-canonical-clone-sync.service on the lab host after the install shows REFUSED with an alarm outcome'
evidence_requirements:
- kind: tests
  description: The converge tick tests, the local-work refusal, alarm and seam cases included.
  command: uv run --frozen pytest tests/unit/clone_dirty_converge -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24319-ac1-ac3
  description: The refusal, alarm and clean-clone cases pass; the refusal cases fail on the base revision, which resets such a clone (read with a scratch A/B run on a lab host).
  source: manual
  binds_ac:
  - AC1
  - AC2
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/clone_dirty_converge -q --no-cov
    cwd: .
- id: dod-omn24319-ac4
  description: The live read on a lab host unit after the merged revision is installed through the host reconciler is recorded in a pull request comment that names the head; not yet read at this commit.
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/clone_dirty_converge -q --no-cov
    cwd: .
- id: dod-omn24319-integration-proof
  description: Run this pull request's own tests on a lab host at the pushed head. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24319 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/clone_dirty_converge -q --no-cov
    cwd: .
