title: "The daily terminal join counts dropped terminals and second outcomes per command id"
summary: "The delegate-skill terminal carries the id of the command that produced it. The daily join reads each command's wire message id and each terminal's command id, and reports per command id the dropped commands, the second logical outcomes, the served replays and the reused correlations. A replay and a reuse are reported as such and are never counted as duplicates."
