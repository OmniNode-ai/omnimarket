interface_change: false
interfaces_touched: []
requirements:
  - id: "req-per-command-join"
    statement: "The join counts dropped terminals and second logical outcomes per command id, and classifies a served replay and a reused correlation apart from a duplicate."
    acceptance:
      - id: "AC3"
        statement: "AC3: a pytest over scripts/delegation_terminal_join.py with a planted served replay and a planted reused correlation asserts zero duplicates, and a planted second outcome asserts one -- falsifier: uv run pytest tests/unit/scripts/test_delegation_terminal_join.py -q -k TestAC3CountsPerCommandId"
evidence_requirements:
  - kind: "tests"
    description: "Run the per-command join tests."
