schema_version: 1.0.0
ticket_id: OMN-26549
title: Five merged changes to the dev boot, deploy agent and lane placement are each read SEEN RUNNING or NOT RUNNING on dev, with one evidence line each
summary: 'The overlay environment probe (node_host_installer_overlay_env_probe) was merged with direct invocation by the host installer as its only trigger and nothing called it. This change declares the caller: the systemd unit overlay-env-probe-systemd of node_host_installer_registry_units runs runtime_overlay_env_probe_tick every 900 s and at load on a lab host, which prints one line per declared name as set or unset (never a value) and keeps the rows in the unit evidence file.'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn26549-overlay-env-probe-caller
  statement: Each merged change is read through its declared caller; the overlay env probe has a declared caller that runs it on a lab host.
  acceptance:
  - id: AC1
    statement: 'AC1: each merge named above has one verdict, SEEN RUNNING or NOT RUNNING, with the evidence line (log line, row or command output) quoted beside it -- falsifier: grep the lane report for one verdict line per merge each followed by a non-empty evidence line returns fewer lines than merges today'
  - id: AC2
    statement: 'AC2: every SEEN RUNNING verdict names the log, database or journal read that holds its line, and every NOT RUNNING verdict names the declared caller that was invoked and the missing piece with its fix -- falsifier: the report''s verdict table read for a row with an empty source or fix cell'
  - id: AC3
    statement: 'AC3: the verdicts are sent to orchestrator-31d9-swarm by one ledger MSG -- falsifier: grep the rolling ledger for a MSG row from proof1-2-1210 to=orchestrator-31d9-swarm returns zero rows today'
evidence_requirements:
- kind: tests
  description: The unit registry holds a unit that invokes the overlay env probe, and the tick prints names and states only.
  command: uv run pytest tests/nodes/node_host_installer_registry_units/test_overlay_env_probe_unit.py tests/nodes/node_host_installer_overlay_env_probe -q -n 0 --no-cov -p no:cacheprovider
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: overlay-env-probe-caller-unit
  description: 'AC2 (the missing piece of the omnimarket 6622 NOT RUNNING verdict): the real unit registry declares a systemd unit whose module is the probe tick; at the merge base the same test fails because no unit invokes the probe.'
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_host_installer_registry_units/test_overlay_env_probe_unit.py -q -n 0 --no-cov -p no:cacheprovider
    cwd: .
- id: overlay-env-probe-tick-no-value
  description: 'AC2: one tick prints one line per declared name as set or unset and keeps the rows in last-run.json, and neither the output nor the record carries a value (a sentinel value set in the environment never appears).'
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_host_installer_overlay_env_probe/test_runtime_overlay_env_probe_tick.py -q -n 0 --no-cov -p no:cacheprovider
    cwd: .
- id: overlay-env-probe-trigger-declared
  description: 'AC2: the probe contract declares runtime_dispatch.host_unit naming the unit, and the node trigger declaration check passes on it (it refuses the contract at the merge base).'
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: command
    check_value: uv run --frozen python -m omnimarket.nodes.node_trigger_declaration_check_effect.runtime_trigger_declaration_check --contract src/omnimarket/nodes/node_host_installer_overlay_env_probe/contract.yaml
    cwd: .
- id: overlay-env-probe-ac1-verdicts-reported
  description: 'AC1 and the probe row of AC2: the verdict report of the lane that read the five merges (proof1-2-1210) holds a verdict line for omnimarket#6622; read on the launching host, which holds the report and the ledger, so only the local Done gate runs it.'
  source: manual
  execution_scope: local_done_gate
  binds_ac:
  - AC1
  checks:
  - check_type: command
    check_value: grep -c "6622" "$OMNI_HOME/.claude_scratch/reports/proof1-2-1210-2026-11-23T1215Z.md"
    cwd: .
- id: overlay-env-probe-ac3-verdict-msg
  description: 'AC3: the verdicts reached orchestrator-31d9-swarm by one ledger MSG from proof1-2-1210 (id 2026-11-23T12:17:21Z-proof1-2-1210), named in the report of that lane; read on the launching host only.'
  source: manual
  execution_scope: local_done_gate
  binds_ac:
  - AC3
  checks:
  - check_type: command
    check_value: grep -c "MSG" "$OMNI_HOME/.claude_scratch/reports/proof1-2-1210-2026-11-23T1215Z.md"
    cwd: .
- id: overlay-env-probe-integration-proof
  description: the probe unit tests and the tick tests run on a lab host at the pushed head; hosted CI cannot reach the lab, so only the local Done gate runs this unbound check
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-26549 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_host_installer_registry_units/test_overlay_env_probe_unit.py tests/nodes/node_host_installer_overlay_env_probe -q --no-cov
