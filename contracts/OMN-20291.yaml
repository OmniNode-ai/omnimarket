---
schema_version: "1.0.0"
ticket_id: "OMN-20291"
title: "Fix the delegated code edit node's failure classes found by the crush replay comparison"
summary: "The OMN-20291 replay of 26 crush tasks found failure classes in the delegated code edit node. This change names the writable files that do not exist yet in the turn prompt, so a model does not view a file it is told to create (replays 0192c135, 8d6e9b45, a0cbacca), and reports an edit whose old_string equals its new_string as changing nothing (replay ab8d7ef6). Each is bound to the pull request's own tests."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-code-edit-replay-failure-classes"
    statement: |-
      The delegated code edit node must tell the model which writable files do not exist yet, and must not report an edit that changes nothing as applied before.
    acceptance:
      - id: "AC7"
        statement: |-
          AC7: the turn prompt names each literal writable path that is not in the worktree as a new file to create with write, until a turn has written it, and names none when every writable path exists -- falsifier: uv run pytest tests/nodes/node_delegated_code_edit_orchestrator/test_handler_delegated_code_edit_orchestrator.py -q -k "do_not_exist_yet or no_new_files_line"
      - id: "AC8"
        statement: |-
          AC8: an edit whose old_string equals its new_string writes nothing and says it changes nothing, not that it was applied before -- falsifier: uv run pytest tests/nodes/node_delegated_code_edit_orchestrator/test_handler_delegated_code_edit_orchestrator.py -q -k "changes_nothing or already_applied"
evidence_requirements:
  - kind: "tests"
    description: "The delegated code edit node's handler tests pass."
    command: "uv run pytest tests/nodes/node_delegated_code_edit_orchestrator/test_handler_delegated_code_edit_orchestrator.py -q"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-code-edit-new-files-ac7"
    description: "The prompt tests prove a writable path missing from the worktree is named as a new file until it is written."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_delegated_code_edit_orchestrator/test_handler_delegated_code_edit_orchestrator.py -q -k \"do_not_exist_yet or no_new_files_line\""
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC7"]
  - id: "dod-code-edit-noop-edit-ac8"
    description: "The edit tests prove a no-op edit is reported as changing nothing and a re-sent edit still as applied before."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_delegated_code_edit_orchestrator/test_handler_delegated_code_edit_orchestrator.py -q -k \"changes_nothing or already_applied\""
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC8"]
