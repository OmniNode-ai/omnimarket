---
schema_version: "1.0.0"
ticket_id: "OMN-20291"
title: "Fix the delegated code edit node's failure classes found by the crush replay comparison"
summary: "The OMN-20291 replay of crush tasks found that a caller's formatter needs import sorting: ruff I001 survives `ruff format`, which does not sort imports. This change makes a task declare an ordered chain of nonempty formatter argvs, runs each against the same writable file, and stops at the first failed command with its output, so `ruff check --select I --fix` can run before `ruff format`. Each criterion is bound to the pull request's own tests."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-code-edit-formatter-chain"
    statement: |-
      The delegated code edit node must run a task's formatter commands as an ordered chain against the written file, stop at the first failed command, and refuse an empty formatter step or a flat argv.
    acceptance:
      - id: "AC10"
        statement: |-
          AC10: the format tool runs each formatter command in order on the same file, so import sorting followed by ruff format leaves a sorted, formatted file, and a failed first command stops the chain with its output before the second runs -- falsifier: uv run pytest tests/unit/delegated_code_edit/test_loop_ports.py -q -k "formatter_chain"
      - id: "AC11"
        statement: |-
          AC11: the request model refuses a formatter chain with an empty step and a flat argv that is not a chain -- falsifier: uv run pytest tests/nodes/node_delegated_code_edit_orchestrator/test_handler_delegated_code_edit_orchestrator.py -q -k "refuses_empty_formatter_steps"
evidence_requirements:
  - kind: "tests"
    description: "The delegated code edit loop port tests pass."
    command: "uv run pytest tests/unit/delegated_code_edit/test_loop_ports.py -q"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-code-edit-formatter-chain-ac10"
    description: "The loop port tests prove the formatter chain sorts imports then formats, and stops at the first failed command."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/delegated_code_edit/test_loop_ports.py -q -k \"formatter_chain\""
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC10"]
  - id: "dod-code-edit-formatter-shape-ac11"
    description: "The request model tests prove an empty formatter step and a flat argv are refused."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_delegated_code_edit_orchestrator/test_handler_delegated_code_edit_orchestrator.py -q -k \"refuses_empty_formatter_steps\""
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC11"]
