        statement: |-
          DoD2: the selection runs from omnimarket: the bundle command reads and writes the examination memory and rotates through the scope, and an unreadable memory is refused by name -- falsifier: test_closer_rank_last_examined_bundle_command_records_and_rotates and test_closer_rank_last_examined_an_unreadable_memory_is_refused_by_name in tests/nodes/node_dod_closeout_sweep_compute/test_closer_rank_last_examined_dod_closeout_sweep_compute.py, which fail with the old oldest-comment tie-break or with no memory read
