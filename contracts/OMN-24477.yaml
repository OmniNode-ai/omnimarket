schema_version: 1.0.0
ticket_id: OMN-24477
title: Landing holds new-work pull requests until the review verdict for their head is clean
summary: A new-work pull request merged at 17:56:57Z on 2026-11-14 before its Fable review finished, and that review then found one high and three medium defects. The pinned landing decision now reads a
  review fact on each pull request (new_work, and the review verdicts recorded per head) and holds a green, clean new-work head from merging unless a CLEAN verdict is recorded for its exact head, naming
  review_missing, review_changes_needed, review_superseded or, when the policy expects the fact and a pull request carries none, review_unread. The ledger facts node derives the fact from STATUS rows (a
  work_kind=new_work mark from any lane; a review=fable verdict row only from an accepted reviewer lane, naming the pull request and the full head). A pull request that is not new work decides exactly as
  before.
is_seam_ticket: true
interface_change: true
interfaces_touched: []
requirements:
- id: req-omn24477-review-gate
  statement: A new-work pull request lands only on a CLEAN review verdict recorded for its exact head; no verdict, a changes-needed verdict or a verdict for another head holds it with a named reason.
  acceptance:
  - id: AC1
    statement: 'AC1: the pure landing decision holds a green, clean pull request marked new work unless a CLEAN review verdict is recorded for its exact head, naming review_missing, review_changes_needed
      or review_superseded -- falsifier: pytest tests/test_landing_review_gate.py -q'
  - id: AC2
    statement: 'AC2: the ledger facts derive the review verdicts from STATUS rows naming the pull request and head, ignoring rows from a lane that is not an accepted reviewer -- falsifier: pytest tests/test_landing_review_gate_seam.py
      -q'
  - id: AC3
    statement: 'AC3: integrated: the landing controller running on the Mac, given a new-work pull request with no verdict, writes a held decision naming review_missing, and lands it after a CLEAN verdict
      row for its head -- falsifier: the controller''s decisions record shows a merge action for a new-work head with no verdict row'
evidence_requirements:
- kind: tests
  description: The review gate tests (golden, error and three injected breaks), the ledger-to-decision seam test and the neighbouring landing decision and ledger facts tests.
  command: env -u PYTHONPATH uv run --frozen pytest tests/unit/nodes/node_pr_landing_decision_compute/test_landing_review_gate.py tests/unit/nodes/node_pr_landing_decision_compute/test_landing_review_gate_seam.py
    tests/unit/nodes/node_pr_landing_ledger_facts_compute -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24477-ac1-review-gate
  description: The review gate tests; they import models and a reader that origin/dev does not hold, so they fail there, and three injected breaks show the assertions can fail for real.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/nodes/node_pr_landing_decision_compute/test_landing_review_gate.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24477-ac2-ledger-seam
  description: The seam test from a ledger STATUS row through the ledger facts to the decision, with the error cases for a lane that is not an accepted reviewer, a non-STATUS row, a short head, another
    engine and a verdict for an older head, and two injected breaks.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/nodes/node_pr_landing_decision_compute/test_landing_review_gate_seam.py tests/unit/nodes/node_pr_landing_ledger_facts_compute -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24477-ac3-integration-proof
  description: Hosted CI cannot reach the Mac controller, so only the local Done gate runs this unbound check. The pushed head ran the review gate tests on a lab host through the lab work runner and exited
    0. The running reading (the controller's decision for a new-work head with no verdict row, then with a CLEAN row) is read from the receipt comment on the ticket.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24477 --kind test -- env PYTHONDONTWRITEBYTECODE=1
      uv run --frozen pytest tests/unit/nodes/node_pr_landing_decision_compute/test_landing_review_gate.py -q --no-cov -n 0 -p no:randomly
    cwd: .
  binds_ac:
  - AC3
