---
schema_version: "1.0.0"
ticket_id: "OMN-21361"
title: "The local metering_summary table gains savings_per_measured_run_usd on open, so the in-process metering refresh stops failing"
summary: "A local sqlite store whose metering_summary table predates savings_per_measured_run_usd made read_summary_row fail validation on every delegation, because no store step added the column. The store now records a one-time step that adds the column, nullable with no default, so a row written before it reads null."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-omn21361-legacy-column"
    statement: |-
      Opening a store whose metering_summary lacks savings_per_measured_run_usd adds the column, and the stored row validates.
    acceptance:
      - id: "AC1"
        statement: "AC1: a regression test that builds a metering_summary table without savings_per_measured_run_usd fails today with the ValidationError and passes once the refresh migrates or tolerates the missing column -- falsifier: uv run pytest tests/unit -q -k metering_summary_legacy_column"
  - id: "req-omn21361-self-heal"
    statement: |-
      A second refresh on a store that lacked the column completes with no failure.
    acceptance:
      - id: "AC2"
        statement: "AC2: after one in-process onex delegate run on a store that lacked the column, a second run prints no metering refresh failure, tested end to end against a temporary sqlite file -- falsifier: uv run pytest tests/unit -q -k metering_refresh_self_heals"
evidence_requirements:
  - kind: "tests"
    description: "The legacy-column regression tests pass."
    command: "uv run pytest tests/unit/projection/test_sqlite_metering_summary_legacy_column_omn21361.py -q --no-cov"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn21361-legacy-column"
    description: "A store without the column gains it on open and its stored row reads."
    source: "manual"
    binds_ac: ["AC1"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/projection/test_sqlite_metering_summary_legacy_column_omn21361.py -q --no-cov -k metering_summary_legacy_column"
        cwd: "."
  - id: "dod-omn21361-self-heal"
    description: "A second refresh on a store that lacked the column completes."
    source: "manual"
    binds_ac: ["AC2"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/projection/test_sqlite_metering_summary_legacy_column_omn21361.py -q --no-cov -k metering_refresh_self_heals"
        cwd: "."
  - id: "dod-omn21361-deploy-probe-store-step"
    description: "Deploy probe: the store module GitHub serves at the checked-out commit names the OMN-21361 store step; the step is absent at the merge base, so the content read answers false there."
    source: "manual"
    binds_ac: ["AC1", "AC2"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/projection/test_sqlite_metering_summary_legacy_column_omn21361.py -q --no-cov"
        cwd: "."
      - check_type: "command"
        check_value: "gh api \"repos/OmniNode-ai/omnimarket/contents/src/omnimarket/projection/sqlite_database.py?ref=$(git rev-parse HEAD)\" --jq '.content | gsub(\"\\n\";\"\") | @base64d | contains(\"omn21361_metering_summary_savings_per_measured_run_column\")' | grep -qx true"
        cwd: "."
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/projection/test_sqlite_metering_summary_legacy_column_omn21361.py -q --no-cov"
        cwd: "."
