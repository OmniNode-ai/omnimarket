title: "Route the test class away from the local coder outside the repair loop"
summary: "The judged matrix accepted 2 of 18 single-shot test answers from the local coder. routing_tiers.yaml drops test from the local-coder use_for list, the test class contract drops the local tier from its escalation order, and the delegated test loop pins --backend-id local-coder so the repair loop keeps the model."
