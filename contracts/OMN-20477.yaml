requirements:
  - id: "req-test-class-leaves-local"
    statement: |-
      An unpinned test request must not select the local rung, and the run-the-tests-and-repair loop must still reach it through its backend pin.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: an unpinned test request routes to cheap_frontier and the test class ladder declares no local tier -- falsifier: uv run pytest tests/unit/delegation/test_judged_matrix_routing_omn20477.py -q -k "unpinned_test_request or ladder_declares_no_local"
      - id: "AC2"
        statement: |-
          AC2: the repair loop pins local-coder on every delegate call and that pin still selects the local rung for test -- falsifier: uv run pytest tests/unit/delegation/test_judged_matrix_routing_omn20477.py -q -k "loop_pin or repair_loop_pins"
evidence_requirements:
