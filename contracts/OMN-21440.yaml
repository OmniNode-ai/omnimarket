- id: dod-omn21440-deploy-pr-gate
  description: 'Hosted package deploy smoke: dispatch the brief gate through the installed ONEX CLI with an in-memory bus. A brief for a repository at its limit and a brief with no Opens PR in line are both refused under an enforcing configuration. No credentials, broker or lab service is required. This checks the evaluated checkout package, not a production rollout.'
  source: manual
  checks:
  - check_type: command
    check_value: |
      set -eu;
      export PYTHONDONTWRITEBYTECODE=1;
      probe_dir="$(mktemp -d)";
      trap 'rm -rf "$probe_dir"' EXIT;
      uv sync --locked;
      runtime_bin="$(uv run --locked python -c 'import sys; from pathlib import Path; print(Path(sys.executable).parent)')";
      "$runtime_bin/python" -c '
      import json
      import sys
      from pathlib import Path
      root = Path(sys.argv[1])
      now = "2026-10-27T12:00:00Z"
      prs = {f"example#{i + 1}": {"facts": {"repo": "example", "number": i + 1, "state": "OPEN", "draft": False}} for i in range(5)}
      policy = {"enforce_ruling": "supplied ruling", "dispatchable_repos": ["example"], "exempt_roles": [], "limits": {"example": {"limit": 5, "merges_per_hour": 1.5, "method": "supplied", "evidence": "supplied"}}}
      config = {"mode": "enforce", "citation": "supplied run"}
      for case, brief in (("full", "# Lane x: y\nOpens PR in: example\n"), ("missing", "# Lane x: y\n")):
          request = {"brief": brief, "dispatch_id": "d1", "now": now, "state": {"last_tick": now, "prs": prs}, "config": config, "policy": policy}
          (root / f"{case}.json").write_text(json.dumps(request))
      ' "$probe_dir";
      for case in full missing; do
        env -u PYTHONPATH ONEX_LANE=omn21440-deploy-probe "$runtime_bin/onex" node node_lane_brief_pr_gate_compute --input "$probe_dir/$case.json" --state-root "$probe_dir/$case.state" --backend event_bus=inmemory --timeout 30 --output receipt --omnibase-path "$PWD" > "$probe_dir/$case.receipt.json";
      done;
      "$runtime_bin/python" -c '
      import json
      import sys
      from pathlib import Path
      root = Path(sys.argv[1])
      full = json.loads((root / "full.receipt.json").read_text())
      missing = json.loads((root / "missing.receipt.json").read_text())
      for receipt in (full, missing):
          assert receipt["status"] == "success" and receipt["exit_code"] == 0, receipt
      assert full["result"]["verdict"] == "refused" and full["result"]["wip"]["reason"] == "at_limit", full["result"]
      assert missing["result"]["verdict"] == "refused" and [i["line"] for i in missing["result"]["issues"]] == ["Opens PR in"], missing["result"]
      print("packaged brief gate: at-limit and missing-line briefs refused")
      ' "$probe_dir"
    cwd: .
