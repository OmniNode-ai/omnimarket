schema_version: 1.0.0
ticket_id: OMN-21440
title: 'T-W3: brief gate: opens-PR-in line and WIP refusal'
summary: 'New COMPUTE node node_lane_brief_pr_gate_compute (operation check_lane_brief_pr) and the lane_brief_pr_gate overlay (mode observe or enforce, with the citation that moved it). A PR-opening brief names its repository in a column-zero Opens PR in line (none declares no PR); a brief missing the line is reported under observe and refused under enforce; a brief that names a repository is judged by the shared WIP rule of node_wip_gate_reducer, with valid override evidence passing as admitted_override. The seven brief producers that name a repository now write the line. Not covered: producers that hold no repository (the daemon sync and install canary fix briefs, the lab job reducer''s stored briefs).'
is_seam_ticket: false
interface_change: true
interfaces_touched:
- public_api
requirements:
- id: req-omn21440-pr-gate
  statement: A PR-opening brief names its repository and is judged by the shared WIP rule; the mode is deployment configuration.
  acceptance:
  - id: AC1
    statement: 'AC1: Briefs generated by every omnimarket producer pass the gate -- falsifier: a pytest case that renders one brief per producer and runs the real gate'
  - id: AC2
    statement: 'AC2: A PR-opening brief with no `Opens PR in:` line is refused once the mode is `enforce`, and reported in `observe` -- falsifier: the two pytest cases'
  - id: AC3
    statement: 'AC3: A request that carries a `mode` field is refused by the model, and a caller cannot downgrade an enforcing deployment: the same brief is refused under an injected `enforce` configuration whatever the request says -- falsifier: the two pytest cases'
  - id: AC4
    statement: 'AC4: A brief for a repository at its limit is refused when `wip_gate` enforces; an exemption claimed by the brief alone, an unrelated PR and an expired lease are refused -- falsifier: three pytest cases'
  - id: AC5
    statement: 'AC5: The fill and this gate change together when `enforce_ruling` is set -- falsifier: a test that sets it and asserts both'
  - id: AC6
    statement: 'AC6: A brief carrying valid override evidence passes the gate as `admitted_override` and one with forged evidence is refused -- falsifier: two pytest cases'
  - id: AC7
    statement: 'AC7: The mode moves from `observe` to `enforce` only in a config-only PR that cites the gate''s run over the live producers'' briefs -- falsifier: a test that refuses `enforce` without the citation field'
  - id: AC8
    statement: 'AC8: Configuration: the gate''s mode (`observe` or `enforce`) and the citation that moved it are the `lane_brief_pr_gate` overlay, and the WIP rule is the shared one -- falsifier: the brief missing its line is reported under `observe` and refused under `enforce`, and `enforce` with no citation is refused'
  - id: AC9
    statement: 'AC9: Bindings: depends on no protocol (it takes facts and `now`) -- falsifier: the parity run (T-B2) gives byte-identical results for this task''s fixtures in process and through the local in-process entry of the parity harness (T-B2), and the conformance check (T-B1) fails if a `protocol_dependencies` entry appears in its contract'
evidence_requirements:
- kind: tests
  description: PR gate, producer and binding tests.
  command: uv run pytest tests/nodes/node_lane_brief_pr_gate_compute -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
