schema_version: "1.0.0"
ticket_id: "OMN-19385"
title: "Delegation terminals retain the raw provider content"
summary: "The inference effects capture the provider message content before trimming or reasoning removal and carry the bounded Core carrier through the local dispatch port into terminal contract evidence, so the output-only bar can see prose after a JSON answer. Full UTF-8 length and SHA-256 survive responses above the 64 KiB text bound."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-raw-provider-content-retained"
    statement: "The delegation terminal carries the raw provider content, its full UTF-8 length and its SHA-256. The criterion below is labeled AC1 so the binding item can claim it through binds_ac."
    acceptance:
      - id: "AC1"
        statement: "AC1: the raw response carrier regressions pass at the head -- falsifier: uv run pytest tests/unit/delegation/test_output_only_raw_response_carrier.py -q in omnimarket fails at the merge base"
  - id: "req-live-runner-reads-the-json-receipt"
    statement: "The live conformance runner asks the delegate wrapper for the JSON receipt, so a deployed-lane trial reaches its terminal evidence instead of failing as wrapper_non_json. The criterion below is labeled AC2 so the binding item can claim it through binds_ac."
    acceptance:
      - id: "AC2"
        statement: "AC2: the live conformance runner passes --json to the delegate wrapper -- falsifier: uv run pytest tests/unit/delegation/test_response_contract_conformance_runner_omn18700.py -k json_receipt -q in omnimarket fails at the merge base"
evidence_requirements:
