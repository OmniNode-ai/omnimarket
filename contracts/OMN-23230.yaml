schema_version: 1.0.0
ticket_id: OMN-23230
title: Every chain the J2 join starts ends with a success or a typed failure on every path out of a host run
summary: A host run of the J2 join could end with a chain it started still open, so the floor folded the chain past its deadline and read it as broken. The run now ends the chains it started with a typed failure on a failure, a cancellation and the run deadline, the publish step carries a deadline below its time limit so a kill cannot strand a start, and the floor cycle closes a J2 start whose run never wrote its end. No verdict, bound or check of the receipt fold changes.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23230-j2-seam-terminal
  statement: Every path out of a host's J2 run ends the chains it started with a success or a typed failure, and the publish step bounds the run inside its own time limit.
  acceptance:
  - id: AC1
    statement: 'AC1: a hung dispatch past the run deadline, a cancelled run and an exception after the canary start each leave no chain open for the floor to fold -- falsifier: uv run --frozen pytest tests/unit/nodes/node_host_reading_effect/test_join_j2.py -q --no-cov'
  - id: AC2
    statement: 'AC2: the publish step carries a deadline below its time limit and the floor cycle closes a stranded J2 start -- falsifier: uv run --frozen pytest tests/nodes/node_factory_floor_publish_effect/test_join_j2_step.py tests/nodes/node_floor_simple_effect/test_abandoned_starts_floor_simple.py -q --no-cov'
