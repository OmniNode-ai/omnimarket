title: "The tests that pin node_dod_verify's refusal of a self-accepted binding run in the required lint job and a pre-commit hook"
summary: "Operator ruling 2026-10-03T00:40:00Z: a criterion binding is never accepted by the lane that authored it. node_dod_verify carries the check (ac_falsifier_checks.self_accepted_bindings, with the demotion in the verify handler) and tests/test_occ_falsifier_checks.py and tests/test_dod_verify_acceptance_basis.py pin it, but no workflow step or hook named them. A lint step and a check-only hook now run both, with a wiring test that fails when either is dropped."
