    acceptance:
      - id: AC1
        statement: 'AC1: a ruling whose only mechanism is a ticket is listed as unmechanized ([OMN-20768](https://linear.app/omninode/issue/OMN-20768) AC4) -- falsifier: `uv run pytest plugins/omni/skills/queue-status/tests -q -k ticket_only_ruling_unmechanized`, with a fixture holding RULING 2026-10-09T00:28:38Z verbatim'
      - id: AC2
        statement: 'AC2: a content check wired in CI only, or in a hook only, is unmechanized -- falsifier: `uv run pytest plugins/omni/skills/queue-status/tests -q -k half_wired_check_unmechanized`'
      - id: AC3
        statement: 'AC3: `--json` names each unmechanized ruling with its pending ticket or `none` -- falsifier: `uv run pytest plugins/omni/skills/queue-status/tests -q -k unmechanized_json_schema`'
      - id: AC4
        statement: 'AC4: the recorder refuses a process ruling whose mechanism path does not resolve and that carries no mechanism ticket -- falsifier: `uv run pytest plugins/omni/skills/operator-ruling/tests -q -k unresolved_path_without_ticket_refused`'
  - id: req-lane1
    statement: No retired-model reference survives in repository content, including comments and historical fixtures; the check runs in a pre-commit hook and required CI lint. The experiment checker requires a nonempty caller-supplied retirement policy.
