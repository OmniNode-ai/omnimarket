        statement: 'No retired-model reference survives in repository content, including comments and historical fixtures; the check runs in a pre-commit hook and required CI lint. The experiment checker requires a nonempty caller-supplied retirement policy. -- falsifier: uv run pytest tests/ci/test_retired_model_references.py tests/nodes/node_delegation_experiment_record_compute -q -n 0 -p no:randomly --no-cov'
  - id: req-lane2
    statement: The host file job archives all enabled categories; launching-host outputs archive at seven days separately from receipts; unverified, unsynced, protected, changed and newly arrived data survives; dry runs report zero actual removals.
    acceptance:
