    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_dod_verify_self_accepted_wiring_omn20780.py tests/test_occ_falsifier_checks.py tests/test_dod_verify_acceptance_basis.py -q -p no:randomly --no-cov"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC2"]
  - id: "dod-omn20780-typed-decision-scope-wiring"
