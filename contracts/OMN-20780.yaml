    description: "Hosted deploy check: import the installed node entrypoint and exercise the packaged checks against a split runtime and wrong reviewer roster, with no Docker daemon, registry, credentials or lab network. Hosted deploy probe: gh api reads handler_idle_slot_fill.py at the checked-out commit and finds the HandlerRulingRecovery import; at the merge base the import is absent, so the grep finds nothing and the check exits nonzero."
    source: "manual"
    checks:
