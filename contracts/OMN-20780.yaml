---
schema_version: "1.0.0"
ticket_id: "OMN-20780"
title: "The tests that pin node_dod_verify's refusal of a self-accepted binding run in the required lint job and a pre-commit hook"
summary: "Operator ruling 2026-10-03T00:40:00Z: a criterion binding is never accepted by the lane that authored it. node_dod_verify carries the check (ac_falsifier_checks.self_accepted_bindings, with the demotion in the verify handler) and tests/test_occ_falsifier_checks.py and tests/test_dod_verify_acceptance_basis.py pin it, but no workflow step or hook named them. A lint step and a check-only hook now run both, with a wiring test that fails when either is dropped."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-omn20780-retired-model-references"
    statement: |-
      No retired-model reference survives in repository content, including comments and historical fixtures; the check runs in a pre-commit hook and in the required CI lint. The experiment checker requires a nonempty caller-supplied retirement policy.
    acceptance:
      - id: "AC11"
        statement: |-
          AC11: node_retired_model_reference_check_effect finds no retired-model reference in filenames, text, comments or escaped YAML/JSON keys and values, the pre-commit hook and the required lint step run it, and the experiment checker refuses an empty retirement policy -- falsifier: uv run pytest tests/ci/test_retired_model_references.py tests/nodes/node_delegation_experiment_record_compute -q -n 0 -p no:randomly --no-cov fails when the checker node, its hook or lint step, or the policy refusal is removed
  - id: "req-omn20780-history-archive"
    statement: |-
      The host file job archives all enabled categories; launching-host outputs archive at seven days separately from receipts; unverified, unsynced, protected, changed and newly arrived data survives; dry runs report zero actual removals.
    acceptance:
      - id: "AC12"
        statement: |-
          AC12: every enabled retention category archives before removal, launching-host outputs carry their own seven-day archive rule beside the fourteen-day receipts rule, only verified unchanged files are removed, and a dry run reports zero actual removals -- falsifier: uv run pytest tests/nodes/test_file_retention_archive_safety.py tests/nodes/test_omn17427_file_retention.py -q -n 0 -p no:randomly --no-cov fails when the archive-before-removal or verification rule is removed
  - id: "req-wire-self-accepted-bindings"
    statement: |-
      The tests that prove node_dod_verify refuses a binding accepted by its own author run in a pre-commit hook and in the required lint job.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: the pre-commit hook dod-verify-self-accepted-bindings and the required lint job both run tests/test_occ_falsifier_checks.py and tests/test_dod_verify_acceptance_basis.py -- falsifier: uv run pytest tests/ci/test_dod_verify_self_accepted_wiring_omn20780.py -q -p no:randomly --no-cov fails at the merge base because the hook and the lint step are absent
      - id: "AC2"
        statement: |-
          AC2: the guarded tests pass at the head with the required hook and lint wiring -- falsifier: uv run pytest tests/ci/test_dod_verify_self_accepted_wiring_omn20780.py tests/test_occ_falsifier_checks.py tests/test_dod_verify_acceptance_basis.py -q -p no:randomly --no-cov fails when the wiring or the self-accepted demotion is removed
  - id: "req-wire-typed-decision-repository-scope"
    statement: |-
      The tests that prove node_typed_decision_effect refuses only the repositories on its contract's refused list, and admits a private code repository, run in a pre-commit hook and in the required lint job (rulings 2026-10-13T18:34:53Z and 2026-10-13T20:50:03Z).
    acceptance:
      - id: "AC3"
        statement: |-
          AC3: the pre-commit hook typed-decision-repository-scope and the required lint job both run tests/unit/nodes/node_typed_decision_effect/test_handler_typed_decision.py -- falsifier: uv run pytest tests/ci/test_typed_decision_repository_scope_wiring_omn20780.py -q -p no:randomly --no-cov fails at the merge base because the hook and the lint step are absent
  - id: "req-main-target-guard-prepush"
    statement: |-
      A push to main warns locally through the main-target-guard pre-push hook, and the hosted main-target-guard step refuses a feature PR onto main and admits it onto dev (ruling 2026-10-10T16:52:56Z).
    acceptance:
      - id: "AC4"
        statement: |-
          AC4: the pre-push hook main-target-guard warns and exits 0 on a push to refs/heads/main, prints nothing for any other ref, and the guard's shipped step refuses a feature branch onto main and admits it onto dev -- falsifier: uv run pytest tests/ci/test_main_target_guard_prepush_omn20780.py -q -p no:randomly --no-cov fails at the merge base because the hook is absent
  - id: "req-wire-review-gateway-privacy"
    statement: |-
      The tests that prove node_claude_review_gateway_effect refuses a cloud review only for a repository on its refused list, and serves every other repository, run in a pre-commit hook and in the required lint job (ruling 2026-10-13T20:50:03Z).
    acceptance:
      - id: "AC5"
        statement: |-
          AC5: the pre-commit hook review-gateway-privacy and the required lint job both run the privacy tests of tests/unit/nodes/node_claude_review_gateway_effect/test_claude_review_gateway.py -- falsifier: uv run pytest tests/ci/test_review_gateway_privacy_wiring_omn20780.py -q -p no:randomly --no-cov fails at the merge base because the hook and the lint step are absent
  - id: "req-wire-delegation-answer-gate"
    statement: |-
      The tests that prove a delegated answer is accepted only after its gate, an independent judge of another model family for the text classes and its own named tests for the code classes, run in a pre-commit hook and in the required lint job (ruling 2026-10-14T18:17:30Z).
    acceptance:
      - id: "AC6"
        statement: |-
          AC6: the pre-commit hook delegation-answer-gate and the required lint job both run tests/unit/delegation/test_answer_gate_omn20489.py -- falsifier: uv run pytest tests/ci/test_delegation_answer_gate_wiring_omn20780.py -q -p no:randomly --no-cov fails at the merge base because the hook and the lint step are absent
  - id: "req-omn20780-blocked-ruling-relaunch"
    statement: "Abandoned blocked or partial work on a process ruling becomes one lab-fill item after two hours."
    acceptance:
      - id: "AC7"
        statement: "AC7: a blocked or partial TERMINAL on a process ruling mechanism-ticket, or with a CLAIM or brief citing a RULING, becomes one item after two hours without a later CLAIM; a later CLAIM or successful terminal suppresses it."
  - id: "req-omn20780-recovery-dispatch"
    statement: "The recovery item retains staged work and the named blocker and goes through existing lab-fill gates, Codex first."
    acceptance:
      - id: "AC8"
        statement: "AC8: the item carries branch, patch path, run directory and blocker; the actor dispatches Codex on admitted shared or dedicated capacity, once, without bypassing scope or runner gates."
  - id: "req-omn20780-repeat-block-exception"
    statement: "A second block of the same ruled work remains an orchestrator exception, never a silent stop."
    acceptance:
      - id: "AC9"
        statement: "AC9: a second block prints a finding and records one durable EXCEPTION row addressed to the parent orchestrator, including with zero free slots; no automatic third attempt is dispatched."
  - id: "req-omn20780-live-ruling-invariants"
    statement: "Every throughput tick reads the declared live ruling checks and reports mismatches with their live readings."
    acceptance:
      - id: "AC10"
        statement: "AC10: a process ruling may declare one live-check; the two standing container and reviewer checks are declared; every tick reads them, including without headroom, and a mismatch prints MISSING ruling-drift:<ruling timestamp> with the live reading."
evidence_requirements:
  - kind: "tests"
    description: "The hook and the lint job run the guarding tests, and the guarding tests pass."
    command: "uv run pytest tests/ci/test_dod_verify_self_accepted_wiring_omn20780.py tests/test_occ_falsifier_checks.py tests/test_dod_verify_acceptance_basis.py -q -p no:randomly --no-cov"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn20780-retired-model-references"
    description: "The retired-model reference check and the experiment checker's retirement-policy refusal pass at the head."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_retired_model_references.py tests/nodes/node_delegation_experiment_record_compute -q -n 0 -p no:randomly --no-cov"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC11"]
  - id: "dod-omn20780-history-archive"
    description: "The archive-before-removal, verification and dry-run controls of the host file job pass at the head."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/test_file_retention_archive_safety.py tests/nodes/test_omn17427_file_retention.py -q -n 0 -p no:randomly --no-cov"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC12"]
  - id: "dod-omn20780-ruling-drift-deploy"
    description: "Hosted deploy check: build this head's wheel, install it outside the project, scan its packaged model references, refuse a missing retirement policy, archive a disposable old output, read the gzip back and require the local file to survive without a sync acknowledgement. Hosted deploy probe: gh api reads handler_retired_model_reference_check.py at the checked-out commit and finds HandlerRetiredModelReferenceCheck; at the merge base the file is absent, so the read fails and the check exits nonzero. No live deployment is claimed."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: |-
          set -eu
          probe_dir=$(mktemp -d)
          trap 'rm -rf "$probe_dir"' EXIT
          uv build --wheel --out-dir "$probe_dir"
          uv run --no-project --with "$probe_dir"/*.whl python "$PWD/tests/ci/probe_ruling_drift_artifact.py"
        cwd: "${OMNI_HOME}/omnimarket"
      - check_type: "command"
        check_value: "bash -o pipefail -c 'gh api \"repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_retired_model_reference_check_effect/handlers/handler_retired_model_reference_check.py?ref=$(git rev-parse HEAD)\" --jq .content | base64 -d | grep -F \"class HandlerRetiredModelReferenceCheck\" > /dev/null'"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn20780-wiring"
    description: "The hook and the lint step name both guarding test files, and the wiring test passes."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_dod_verify_self_accepted_wiring_omn20780.py -q -p no:randomly --no-cov"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC1"]
  - id: "dod-omn20780-guard-tests-pass"
