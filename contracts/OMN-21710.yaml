    cwd: ${OMNI_HOME}/omnimarket
- id: dod-omn21536-deploy-published-handler-readback
  description: Read the published build dispatch handler at the evaluated commit and require its single typed request signature. This hosted-runner source readback needs no lab service and does not assert a live runtime rollout.
  source: manual
  checks:
  - check_type: command
    check_value: |-
      curl --fail --silent --show-error --location --max-time 30 "https://raw.githubusercontent.com/OmniNode-ai/omnimarket/$(git rev-parse HEAD)/src/omnimarket/nodes/node_build_dispatch_effect/handlers/handler_build_dispatch.py" | python3 -c '
      import ast
      import sys
      module = ast.parse(sys.stdin.read())
      handler = next(node for node in module.body if isinstance(node, ast.ClassDef) and node.name == "HandlerBuildDispatch")
      method = next(node for node in handler.body if isinstance(node, ast.AsyncFunctionDef) and node.name == "handle")
      assert [arg.arg for arg in method.args.posonlyargs + method.args.args] == ["self", "request"]
      assert not method.args.kwonlyargs and method.args.vararg is None and method.args.kwarg is None
      assert ast.unparse(method.args.args[1].annotation) == "ModelBuildDispatchInput"
      assert ast.unparse(method.returns) == "ModelBuildDispatchResult"
      print("Published build dispatch handler readback: single typed request PASS")
      '
    cwd: ${OMNI_HOME}/omnimarket
