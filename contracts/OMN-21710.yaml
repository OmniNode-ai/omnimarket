schema_version: 1.0.0
ticket_id: OMN-21710
title: multi-parameter handle signatures take one typed request (omnimarket#4641 contract split)
summary: Slice 5 of the omnimarket handler-shape burn-down (omnimarket#4641). The handler-shape validator of omnibase_core reports a handler class whose handle takes several positional parameters (noncanonical_handle), which the shared runtime cannot adapt. Fourteen handlers did. Each now takes one typed request model, passed as the one parameter of handle and built from the parameters it took, and its callers, the build-loop sub-handler protocols and live adapters, and its tests follow. A correlation id the handler only ignored or logged leaves the signature; one it forwards moves into the request model. The acceptance items of this PR moved here from the shared contracts/OMN-21536.yaml.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
