  acceptance:
  - id: AC1
    statement: 'AC1: the multi-parameter handle signatures touched by omnimarket#4641 take one typed request and the handler-shape count over them drops as the PR states -- falsifier: uv run pytest tests/unit -q over the touched modules plus the handler-shape checker re-run on the PR paths'
  - id: AC2
    statement: 'AC2: the PR''s acceptance items live in contracts/OMN-21710.yaml and the PR does not edit contracts/OMN-21536.yaml -- falsifier: git diff --stat origin/dev...HEAD on the PR head lists contracts/OMN-21710.yaml and not contracts/OMN-21536.yaml'
