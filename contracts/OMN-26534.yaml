schema_version: "1.0.0"
ticket_id: "OMN-26534"
title: "omnimarket: the customer-local delegation path picks the least busy healthy lab model endpoint from each server's waiting-request count"
summary: "The routing reducer shared a rung's traffic between same-model lab servers by a stable hash of the correlation id and read no load, so a request could queue behind a busy server while its peer sat idle. A load snapshot (each declared spread-group endpoint's vLLM waiting-request count or llama.cpp deferred-request count, read once at decision time) is now an input to the pick, like the quota snapshot. The member with the fewest waiting requests is chosen, ties in declaration order, an unreadable endpoint is skipped, and with no reading the existing hash pick stands. The customer-local dispatch path passes the snapshot in; the decision's rationale records it."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-omn26534-pick"
    statement: |-
      The local tier's endpoint choice takes the least busy healthy endpoint of the declared spread group.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: a test where the first endpoint reports waiting requests above zero and the second reports zero picks the second, and the tests for an unreachable endpoint skipped, ties in declaration order, every endpoint unreadable falling back to the existing pick, and a llama.cpp deferred-request count read as waiting all pass -- falsifier: the new test file passes at the merge base without the change
  - id: "req-omn26534-read"
    statement: |-
      The load is read at decision time from the declared endpoints, never from a literal host.
    acceptance:
      - id: "AC2"
        statement: |-
          AC2: the reader scrapes vllm:num_requests_waiting for every endpoint of every declared spread group and marks an unhealthy one unreadable, with no host name or address literal in code -- falsifier: a host address or name literal in the added source lines, or a test showing an unreachable endpoint chosen
  - id: "req-omn26534-limits"
    statement: |-
      No timeout is raised and nothing outside omnimarket changes.
    acceptance:
      - id: "AC3"
        statement: |-
          AC3: the diff changes no existing timeout constant and touches only omnimarket paths -- falsifier: the diff changes a 180 or any existing timeout value, or touches a path outside omnimarket
  - id: "req-omn26534-identify"
    statement: |-
      The heavy client of the model server is identified read-only.
    acceptance:
      - id: "AC4"
        statement: |-
          AC4: the lane report names what the heavy client of the model server is, with the tailscale status command and its output, and no connection to it was made -- falsifier: the report names it with no tailscale status read
  - id: "req-omn26534-landing"
    statement: |-
      The pull request is open against the landing branch with required checks green at the handed head.
    acceptance:
      - id: "AC5"
        statement: |-
          AC5: the PR is open against dev, required checks green on its head, handed to landing-controller by one MSG -- falsifier: onex scm pr-view shows a required context red or pending at the handed head
evidence_requirements:
  - kind: "tests"
    description: "The new test file passes at the pushed head and fails at the merge base, where its imports do not exist."
    command: "uv run pytest tests/unit/routing/test_load_aware_local_pick_omn26534.py -q -n 0 --no-cov"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn26534-ac1-pick-tests"
    description: "The pick tests pass at the pushed head; at the merge base the test module fails to import (no load snapshot, pick or reader exists)."
    source: "manual"
    binds_ac: ["AC1"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/routing/test_load_aware_local_pick_omn26534.py -q -n 0 --no-cov"
        cwd: "."
  - id: "dod-omn26534-ac2-reader"
    description: "The reader tests scrape real local HTTP servers for vLLM and llama.cpp counters and mark an erroring, counter-less and closed endpoint unreadable."
    source: "manual"
    binds_ac: ["AC2"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/routing/test_load_aware_local_pick_omn26534.py -q -n 0 --no-cov -k 'reader or scrape or targets or metrics_url'"
        cwd: "."
  - id: "dod-omn26534-ac3-no-timeout-change"
    description: "The read budget is a new constant bounded by the test; the diff changes no existing timeout."
    source: "manual"
    binds_ac: ["AC3"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/routing/test_load_aware_local_pick_omn26534.py -q -n 0 --no-cov -k read_timeout"
        cwd: "."
  - id: "dod-omn26534-ac4-identified"
    description: "The lane report carries the tailscale status read for the heavy client."
    source: "manual"
    binds_ac: ["AC4"]
    execution_scope: local_done_gate
    checks:
      - check_type: "command"
        check_value: "grep -l 'tailscale status' \"$OMNI_HOME\"/.claude_scratch/reports/c13route-1340-*.md"
        cwd: "."
  - id: "dod-omn26534-ac5-landing"
    description: "The PR's required checks read green at the handed head."
    source: "manual"
    binds_ac: ["AC5"]
    execution_scope: local_done_gate
    checks:
      - check_type: "command"
        check_value: "onex scm pr-checks OmniNode-ai/omnimarket"
        cwd: "."
  - id: "dod-omn26534-integration-proof"
    description: "Run the load-aware pick tests on a lab host at the pushed head; the local Done gate runs this unbound check."
    source: "manual"
    execution_scope: local_done_gate
    checks:
      - check_type: "command"
        check_value: "env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha \"$(git rev-parse HEAD)\" --lane dod-integration-proof-26534 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/routing/test_load_aware_local_pick_omn26534.py -q --no-cov"
        cwd: "."
