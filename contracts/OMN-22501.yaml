schema_version: 1.0.0
ticket_id: OMN-22501
title: Ticket contracts merge by entry and new umbrella appends are refused
summary: A three-way merge of ticket contracts by entry that refuses duplicates and divergence, and a prerequisite that refuses a new append to an umbrella contract so each pull request carries its own.
is_seam_ticket: false
interface_change: true
interfaces_touched: [events]
requirements:
  - id: req-omn22501-merge-by-entry
    statement: Two sides of a ticket contract merge by entry, never by line, and anything undecidable is refused.
    acceptance:
      - id: AC1
        statement: 'AC1: three contract texts merge entry by entry keeping every entry whole, and a duplicate id within a side, one entry changed differently on both sides, or text that does not parse back to the merged structure is refused -- falsifier: uv run --frozen pytest tests/nodes/node_ticket_contract_merge_compute -q --no-cov -n 0 -p no:randomly'
  - id: req-omn22501-umbrella-append-refused
    statement: A new append to an umbrella ticket contract is refused, so each pull request carries its own contract.
    acceptance:
      - id: AC2
        statement: 'AC2: a head adding an entry to an umbrella ticket contract is refused unless its body or commits carry the umbrella evidence line, and a head on its own contract or one that only took the base branch is admitted -- falsifier: uv run --frozen pytest tests/nodes/node_ticket_contract_prerequisite_effect/test_umbrella_append_omn19998.py -q --no-cov -n 0 -p no:randomly'
evidence_requirements:
  - kind: tests
    description: The merge chains and the umbrella append refusal run on the declared topics and real git merges.
    command: uv run --frozen pytest tests/nodes/node_ticket_contract_merge_compute tests/nodes/node_ticket_contract_prerequisite_effect/test_umbrella_append_omn19998.py -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn22501-merge-by-entry
    description: The real-shape merge keeps every entry whole where git's own union drops a line, a real git merge runs the declared driver, and an injected duplicate id is refused on the handler, the driver and the declared topics.
    source: manual
    binds_ac: [AC1]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/nodes/node_ticket_contract_merge_compute -q --no-cov -n 0 -p no:randomly
        cwd: .
  - id: dod-omn22501-umbrella-append-refused
    description: A real repository at a new append is refused with the fix named, and its own contract, a merge of the base and an evidence line are each admitted.
    source: manual
    binds_ac: [AC2]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/nodes/node_ticket_contract_prerequisite_effect/test_umbrella_append_omn19998.py -q --no-cov -n 0 -p no:randomly
        cwd: .
  - id: dod-omn22501-integration-proof
    description: Run the merge and guard chains on a lab host at the pushed head. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-22501 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_ticket_contract_merge_compute tests/nodes/node_ticket_contract_prerequisite_effect/test_umbrella_append_omn19998.py -q --no-cov -n 0 -p no:randomly
        cwd: .
