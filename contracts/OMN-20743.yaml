schema_version: "1.0.0"
ticket_id: "OMN-20743"
title: "PR-state schema v2 per-check facts and webhook red-check path"
summary: "PR-state event schema version 2 carries per-red-check facts (conclusion, workflow run id, workflow name, completed_at) plus base_red_checks and base_read; version 1 is unchanged; ci-run-failed carries the facts and the triage reads them from the event; node_pr_state_emit_effect emits ci-run-failed from check-run observations without duplicating a check the watcher already observed."
is_seam_ticket: false
interface_change: true
interfaces_touched:
  - "public_api"
requirements:
  - id: "req-pr-state-v2-check-facts"
    statement: |-
      PR-state schema v2 carries per-check facts and the red-check triage decides from the event.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: pr_state_event_from_wire types version 1 and version 2 events, version 1 digests are unchanged, and the projection and handoff ingress accept both.
      - id: "AC2"
        statement: |-
          AC2: ModelCiRunFailedEvent carries failing_runs, base_red_checks and base_read, and EventCiRedFactsReader decides the runner and dev-head classes from the event, calling GitHub only for an event that lacks the facts.
      - id: "AC3"
        statement: |-
          AC3: a red check-run observation emits ci-run-failed once, and a check the watcher already observed red at the same head is not emitted twice.
evidence_requirements:
