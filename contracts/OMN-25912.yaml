---
schema_version: "1.0.0"
ticket_id: OMN-25912
title: "The sync snapshot publisher keeps one Kafka client for its lifetime instead of one per delta"
summary: The shared dev runtime authenticated over SCRAM 1215 times in 9 minutes with no request or tick behind them; KafkaSnapshotDeltaPublisher opened a transport, sent one delta and closed it for every delta, and now owns one transport on one background loop.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn25912-snapshot-publisher-one-client
    statement: The sync snapshot delta publisher builds and starts one Kafka transport and reuses it for every delta, rebuilding it only after a failed start or send.
    acceptance:
      - id: AC6
        statement: "AC6 (added by this change in omnimarket; the ticket's AC1 to AC5 are bound in omnibase_infra): publishing several deltas, from one thread or from several worker threads, builds and starts the transport once -- falsifier: `uv run --frozen pytest tests/unit/projection/test_snapshot_publisher_one_client_omn25912.py -q --no-cov -n 0` passes at the unfixed base or fails at the fixed head"
evidence_requirements:
  - kind: tests
    description: Publisher one-client tests and the existing sync snapshot seam tests.
    command: uv run --frozen pytest tests/unit/projection/test_snapshot_publisher_one_client_omn25912.py tests/test_omn19733_sync_snapshot_publish_counts_as_flow_output.py -q --no-cov -n 0
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-omn25912-publisher-one-client
    description: "Five deltas build and start one transport; six worker threads share one; a failed send or start is retried with a new transport."
    source: manual
    binds_ac: [AC6]
    checks:
      - check_type: test_passes
        check_value: >-
          uv run --frozen pytest tests/unit/projection/test_snapshot_publisher_one_client_omn25912.py -q --no-cov -n 0
  - id: dod-omn25912-integration-proof
    description: "Run the publisher tests on a lab host at the pushed revision: five deltas build and start one transport, and the unfixed publisher builds five."
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: >-
          onex lab-work run --bus-lane dev --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)"
          --lane dod-integration-proof-25912 --kind test --
          env -u PYTHONPATH uv run --frozen pytest tests/unit/projection/test_snapshot_publisher_one_client_omn25912.py
          -q -n 0 --no-cov
        cwd: .
