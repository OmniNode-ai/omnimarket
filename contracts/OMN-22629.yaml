schema_version: 1.0.0
ticket_id: OMN-22629
title: The tenant registry catch-up wait is skipped for an event older than the window, so a tenant in no registry no longer costs the writer 20 seconds per event
summary: The write-time tenant resolver waited up to 20 s for every event whose tenant the registry mirror lacked while the mirror's newest observation was behind the event, which a quiet registry always is. An event older than the catch-up window is now refused at once with its cause named, the age limit is an overlay setting, and a fresh event still waits for the race the wait exists for.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn22629-stale-event-no-wait
  statement: The write-time tenant resolver does not wait for an event older than the catch-up window, still raises the typed refusal the runner dead-letters with the cause named, and still waits for a fresh event inside the window.
  acceptance:
  - id: AC1
    statement: 'AC1: an event older than the catch-up window whose tenant the mirror lacks raises TenantRegistryResolutionError naming the cause and waits zero times, and a fresh event inside the window still waits and resolves -- falsifier: uv run --frozen pytest tests/test_omn22478_mirror_catchup_stale_events.py tests/test_omn18198_mirror_catchup_race.py -q --no-cov'
  - id: AC2
    statement: 'AC2: the age limit is read from the overlay setting tenant_mirror_catchup_event_age_limit_seconds, and zero waits for no event -- falsifier: uv run --frozen pytest tests/test_omn22478_mirror_catchup_stale_events.py -q --no-cov -k "overlay or zero"'
evidence_requirements:
- kind: tests
  description: The stale event is not waited for and the race still is
  command: uv run --frozen pytest tests/test_omn22478_mirror_catchup_stale_events.py tests/test_omn18198_mirror_catchup_race.py -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn22629-stale-event
  description: Runs the golden race chain and the stale event error chain against a fake mirror reader, and the existing race tests with the clock set inside the window.
  source: manual
  binds_ac:
  - AC1
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/test_omn22478_mirror_catchup_stale_events.py tests/test_omn18198_mirror_catchup_race.py -q --no-cov
    cwd: .
- id: dod-omn22629-integration-proof
  description: Run this pull request's own check on a lab host at the pushed head. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-22629 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/test_omn22478_mirror_catchup_stale_events.py tests/test_omn18198_mirror_catchup_race.py -q --no-cov
    cwd: .
