title: "omnimarket contracts_and_di literal_url burn-down, slice rf1145-c3"
summary: "Thirteen modules of omnimarket spelled a web origin, a schema dialect URI or a transport sentinel as a literal in code: 16 literal_url findings. Each value is now a key of configs/service_endpoints.yaml (github.web_url, pypi.base_url, claude.web_url, json_schema.draft_2020_12_url and two transport_sentinels) and every module of the slice reads it through the existing service_endpoint_url resolver. The contracts_and_di check over src/omnimarket reports 43 literal_url findings before the slice and 27 after, with no baseline entry and no suppression added."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-omn21693-literal-url-slice"
    statement: |-
      The values the thirteen modules of the slice used to spell are declared once, in configs/service_endpoints.yaml, and the resolver fails closed on a missing or empty key. No module of the slice holds an origin or sentinel as a string constant in code, so the contracts_and_di check reports no literal_url finding on any of them.
    acceptance:
      - id: "AC1"
        statement: "AC1: the contracts_and_di count for literal_url over the slice paths drops to zero and the repo total drops by the slice size, with no baseline entry or suppression added -- falsifier: onex run of runtime_validator_run with the contracts_and_di reference over omnimarket src before and after, counts compared per rule"
      - id: "AC2"
        statement: "AC2: every moved value is taken through an injected parameter bound from the node contract or overlay and none remains hard-coded in the touched code -- falsifier: uv run pytest tests/unit -q over the touched modules plus the checker re-run on the slice paths"
      - id: "AC3"
        statement: "AC3: the slice lands as one PR titled with this ticket id and carries lab proof of the tests and the checker re-run -- falsifier: uv run pytest tests/unit -q on the lab through lab-run at the PR head, receipt path in the PR body"
