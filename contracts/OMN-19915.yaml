schema_version: 1.0.0
ticket_id: OMN-19915
title: Run the clean VM walk through the canonical runtime
summary: >-
  Scoped remediation of the walk's runtime entrypoint, discovered during the
  clean-machine retake. This implementation criterion covers runtime dispatch
  only. The epic's participant recording, child evidence audit and two
  scheduled producer successes remain unproven; this contract does not claim them.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: clean-walk-runtime
  statement: The existing clean VM effect starts through its declared runtime contract and reports its measured outcome.
  acceptance:
  - id: DoD1
    statement: The canonical runtime invokes the walk handler and retains its receipt and VM cleanup result.
- id: clean-walk-failed-status
  statement: A walk whose outcome is failed ends the run as failed.
  acceptance:
  - id: DoD2
    statement: The canonical runtime classifies a failed walk receipt as a failed run and the receipt serializes status failed.
- id: c30-c31-unit-bus
  statement: The C30 and C31 host units publish their run on the lane bus their node overlay declares, with the lane declaration table found by reference and no broker address or credential written into a unit.
  acceptance:
  - id: DoD3
    statement: The C30 and C31 units declare ONEX_WORKSPACE_CONFIG_ROOT (and not OMNIBASE_PATH, which measurably broke the C30 delegate clause on h202), and each tick publishes through the declared broker publisher.
evidence_requirements:
- kind: tests
  description: Real local runtime and bus adapter, with the existing stub Tart transport and a successful receipt control.
  command: uv run pytest tests/nodes/node_onboarding_clean_vm_walk/test_clean_vm_walk.py -q --no-cov
- kind: tests
  description: The recorded guide-pinned exit 3 replayed through the real local runtime.
  command: uv run pytest tests/nodes/node_onboarding_clean_vm_walk/test_clean_vm_walk.py -q --no-cov -k test_failed_walk_is_a_failed_run_through_canonical_runtime
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: runtime-entry
  description: The success case reproduces the pre-handler runtime refusal before the contract correction and reaches the measured receipt afterward.
  source: manual
  binds_ac:
  - DoD1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_onboarding_clean_vm_walk/test_clean_vm_walk.py -q --no-cov -k test_walk_runs_through_canonical_runtime
    cwd: .
- id: failed-walk-status
  description: The failed walk replayed through the real runtime ends as a failed run; before the change it ended completed.
  source: manual
  binds_ac:
  - DoD2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_onboarding_clean_vm_walk/test_clean_vm_walk.py -q --no-cov -k test_failed_walk_is_a_failed_run_through_canonical_runtime
    cwd: .
- id: c30-c31-unit-bus-env
  description: The focused tests of the two ticks' declared-broker delivery and of the two unit declarations and their rendered services; each fails on the branch base, where the units carry no bus environment and the ticks default to the emit-effect publisher.
  source: manual
  binds_ac:
  - DoD3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_c30_claude_code_plugin_probe_effect/test_probe_delivery_declared_broker.py tests/nodes/node_c31_local_dashboard_parity_probe_effect/test_probe_delivery_declared_broker.py tests/nodes/node_host_installer_registry_units/test_c30_c31_probe_bus_env.py -q --no-cov -p no:randomly
    cwd: .
- id: c30-c31-checks-green-at-source
  description: Runs the relation-inventory test (it failed 3 of its tests while the inventory lacked the C30 node as a reader of delegation_events) together with the C30 and C31 node tests, including the two probe tests restored under names the canonical-file-shape ratchet accepts.
  source: manual
  binds_ac:
  - DoD3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/scripts/test_application_relation_inventory.py tests/nodes/node_c30_claude_code_plugin_probe_effect tests/nodes/node_c31_local_dashboard_parity_probe_effect -q --no-cov -p no:randomly
    cwd: .
- id: deploy-probe
  description: Hosted-runner source-artifact readback requires the published walk contract at the evaluated commit to match this checkout, bind ModelWalkReceipt to one published topic and keep both terminal topics in runtime_dispatch. This checks the source artifact; it does not claim the fix is installed on a host.
  source: manual
  checks:
  - check_type: command
    check_value: |
      set -eu;
      readback_dir="$(mktemp -d)";
      trap 'rm -rf "$readback_dir"' EXIT;
      revision="$(git rev-parse HEAD)";
      path=src/omnimarket/nodes/node_onboarding_clean_vm_walk_effect/contract.yaml;
      curl --fail --silent --show-error --location --max-time 30 \
        "https://raw.githubusercontent.com/OmniNode-ai/omnimarket/$revision/$path" \
        --output "$readback_dir/contract.yaml";
      cmp "$path" "$readback_dir/contract.yaml";
      test "$(grep -c 'event_type: ModelWalkReceipt' "$readback_dir/contract.yaml")" = 1;
      grep -F 'failure: onex.evt.omnimarket.onboarding-clean-vm-walk-failed.v1' "$readback_dir/contract.yaml";
      printf 'walk contract source readback matched %s\n' "$revision"
    cwd: .
- id: dod-omn19915-integration-proof
  description: The pushed head, run on a lab host through the ONEX CLI, starts the clean VM walk through the real local runtime and bus adapter and reaches its measured receipt, and a failed walk ends as a failed run. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: |-
      uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane ob-walk-1150 -- uv run --frozen pytest tests/nodes/node_onboarding_clean_vm_walk/test_clean_vm_walk.py -q --no-cov -k test_walk_runs_through_canonical_runtime
    cwd: .
