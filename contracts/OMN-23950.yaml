schema_version: 1.0.0
ticket_id: OMN-23950
title: Lab host table read only from the overlays repository
summary: The shared lab host table reader fell back to the config owner's copy of the table when no overlay root held it, and served that copy when a shell listed it among its roots; the copy is stale and
  its Mac row declares no clones, so the Mac install refused. The reader now takes the table only from the overlay roots the shell names, the config owner's copy is never searched or served, and a shell
  with no root holding the table refuses naming where it must come from.
is_seam_ticket: true
interface_change: true
interfaces_touched:
- public_api
requirements:
- id: req-omn23950-overlays-repository-only
  statement: The lab host table is read from the overlays repository through the overlay roots and never from the config owner's copy.
  acceptance:
  - id: AC1
    statement: 'AC1: the lab host table is read from the overlays repository through the overlay roots, and a root that is the config owner''s copy never serves it, whatever the root order -- falsifier:
      pytest tests/unit/handlers/test_lab_hosts_overlay_roots_only.py -q fails on the base reader'
  - id: AC2
    statement: 'AC2: with only the config owner''s copy, or no root, the table refuses naming the overlay roots variable, and the installer''s default install refuses with the table unreadable -- falsifier:
      pytest tests/nodes/node_host_installer_registry_units/test_default_host_source_overlays_repository.py -q fails on the base reader'
- id: req-omn23950-integrated
  statement: Units reinstalled from the merged change read the declared overlays clone first where they run.
  acceptance:
  - id: AC3
    statement: 'AC3: integrated: after reinstall from the merged change, ai.omninode.factory-floor-publish on the Mac and a unit on h053 render and run with the declared overlays clone first among their
      roots, and one tick of each reads a value only that clone holds -- falsifier: read the live plist and unit environment and the next tick''s record'
- id: req-omn23950-installer-default
  statement: Every installed unit whose program reads the lab host table declares ONEX_SKILL_OVERLAY_ROOTS by default, so a unit installed without an override still reads the table.
  acceptance:
  - id: AC4
    statement: 'AC4: every registry unit whose module package calls the lab host table reader declares ONEX_SKILL_OVERLAY_ROOTS in its environment, as an overridable path and as a refused-worktree path, and its rendered plist lists the declared overlays clone first -- falsifier: pytest tests/nodes/node_host_installer_registry_units/test_host_table_readers_declare_overlay_roots.py -q fails on the contract without the silent-failure alarm declaration'
evidence_requirements:
- kind: tests
  description: The overlays-repository-only reader tests pass at the pushed head.
  command: uv run --frozen pytest tests/unit/handlers/test_lab_hosts_overlay_roots_only.py tests/unit/lab_work/test_lab_work_host_table.py -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23950-ac1
  description: The reader tests hold that the overlays repository serves the table whatever the root order and that the pinned file still wins; on the base reader three of the four fail (control).
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/handlers/test_lab_hosts_overlay_roots_only.py tests/unit/lab_work/test_lab_work_host_table.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn23950-ac2
  description: The error tests refuse the retired copy alone, no root and the developer copy; the installer's default install refuses with the table unreadable and, with the overlays repository listed,
    lists the declared clone first; on the base reader both installer tests fail (control).
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_host_installer_registry_units/test_default_host_source_overlays_repository.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn23950-ac3
  description: The tests that stand behind the integrated reading pass at the head and fail at the merge base. The reading itself (the live plist and unit environments after reinstall, and the next tick)
    is taken after the merge from the installed branch on h053 and by the Mac orchestrator.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_host_installer_registry_units/test_default_host_source_overlays_repository.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn23950-ac4
  description: The scan finds the silent-failure alarm among the units whose program reads the host table, each such unit declares the roots, and the rendered plists list the declared overlays clone first; the declaration test fails on the base contract (control).
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_host_installer_registry_units/test_host_table_readers_declare_overlay_roots.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn23950-integration-proof
  description: Run the overlays-repository-only reader and installer tests on a lab host at the pushed head. Hosted CI cannot reach the lab hosts, so only the local Done gate runs this unbound check; it binds no criterion for the hosted check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23950 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/handlers/test_lab_hosts_overlay_roots_only.py tests/nodes/node_host_installer_registry_units/test_default_host_source_overlays_repository.py -q --no-cov -n 0 -p no:randomly
    cwd: .
