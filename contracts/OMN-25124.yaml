schema_version: 1.0.0
ticket_id: OMN-25124
title: The topic provision plan node delivers its returned plan on the dev runtime
summary: 'omnimarket#6166 is installed on the dev runtime on h201 and its plan node runs there, but the contract of node_topic_provision_plan_compute declares no publish topic, no published_events map and no top-level terminal_event. The runtime then wires no result applier for it, runs the handler, and routes the returned plan to the dead letter queue; onex run-node refuses the node for the missing terminal_event. The contract now declares the completed event as terminal_event and publish topic, maps the returned plan to it in published_events, and carries the broker permission rows for the runtime login in broker_acl_grants. Seam: the node contract to the runtime''s result applier derivation.'
is_seam_ticket: true
interface_change: true
interfaces_touched:
- topics
requirements:
- id: req-omn25124-contract-wiring
  statement: The plan node contract declares what the runtime needs to deliver the returned plan to the completed topic, and `onex run-node` can address the node.
  acceptance:
  - id: AC1
    statement: 'AC1: the contract declares the completed event as terminal_event and as its one publish topic, maps ModelTopicProvisionPlan to it in published_events, and grants the runtime login write and describe on it -- falsifier: uv run --frozen pytest tests/unit/nodes/node_topic_provision_plan_compute/test_topic_provision_result_wiring.py -q --no-cov fails 4 of 4 against the contract at origin/dev'
  - id: AC2
    statement: 'AC2: the runtime discovery code of the dev runtime image reads the changed contract as one that wires a result applier, and reads the installed contract as one that does not -- falsifier: the one-off discovery read in the omninode-runtime container on h201 prints runtime_wires_result_applier=True for the changed contract and False for the installed one'
- id: req-omn25124-running
  statement: The change of omnimarket#6166 is read running on the dev runtime on h201 and the STATUS row is on the ledger.
  acceptance:
  - id: AC3
    statement: 'AC3: a STATUS row kv pr=omnimarket#6166 installed=<host>:<revision> observed=<what ran> read_at=<UTC> is on the work ledger -- falsifier: lane_brief.py grep pr=omnimarket#6166 returns no row with installed= and observed= newer than the CLAIM of lane run6166-0147'
evidence_requirements:
- kind: tests
  description: The plan, overlay, seam, dry-run and chain tests and the new wiring test pass at the pushed head.
  command: uv run --frozen pytest tests/unit/nodes/node_topic_provision_plan_compute tests/unit/nodes/node_topic_provision_dry_run_effect tests/chain/test_topic_provision_chain.py -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn25124-ac1-contract
  description: The wiring tests pass at the pushed head; at the contract of origin/dev the same four tests fail.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/nodes/node_topic_provision_plan_compute/test_topic_provision_result_wiring.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn25124-ac1-neighbours
  description: The plan, overlay, seam and chain tests of the node still pass with the changed contract.
  source: manual
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/nodes/node_topic_provision_plan_compute tests/chain/test_topic_provision_chain.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn25124-ac2-runtime-discovery
  description: The runtime discovery read on h201 is a lab read; its output is in the pull request Lab line. Hosted proxy is the wiring test, which reads the same two inputs the runtime reads (publish_topics and the published_events map) with the runtime's own loader.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/nodes/node_topic_provision_plan_compute/test_topic_provision_result_wiring.py::test_published_events_map_routes_the_returned_plan_to_the_completed_topic -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn25124-ac3-status-row
  description: The STATUS row naming pr=omnimarket#6166 with installed= and observed= is on the work ledger. The ledger is not reachable from the hosted runner, so only the local Done gate runs this check.
  source: manual
  execution_scope: local_done_gate
  binds_ac:
  - AC3
  checks:
  - check_type: command
    check_value: 'python3 "${OMNI_PLUGIN_ROOT:?}/skills/lane-brief/scripts/lane_brief.py" grep "pr=omnimarket#6166" | grep -F "installed=" | grep -F "observed=" | grep -F "lane=run6166-0147"'
    cwd: .
- id: dod-omn25124-integration-proof
  description: 'The change runs on the dev runtime: onex run-node sends the plan node one request over the dev lane bus and prints the returned plan from the completed topic. It passes only after this change is installed on the dev runtime and the broker permission rows of the contract are applied; the hosted runner cannot reach the lab bus, so only the local Done gate runs it. The input holds one contract and prints a plan whose topics_to_provision lists the probe topic.'
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: 'onex run-node node_topic_provision_plan_compute --input ''{"contracts":[{"contract_name":"integration-proof","topics":["integration-proof-topic"],"runtime_profiles":["main"]}],"profile":"main","live_topics":[],"rule":{"mode":"profile"}}'' --timeout 60 | grep -F "integration-proof-topic"'
    cwd: .
