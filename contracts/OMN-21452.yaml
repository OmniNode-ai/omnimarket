schema_version: 1.0.0
ticket_id: OMN-21452
title: Typed pinned model work contracts and executable acceptance corpus
summary: Pure Phase 1 compute verdicts, read-only file/lab-runner bindings, four acceptance
  kinds and a frozen 100-scenario plus 20-DoD corpus.
is_seam_ticket: false
interface_change: true
interfaces_touched:
- public_api
requirements:
- id: req-model-work-ac1
  statement: 'AC1: ModelWorkContract is a frozen pydantic model with contract_id,
    task_kind, inputs (path and sha256 each), acceptance (kind one of command, schema,
    dod_evidence, seeded_bug, plus spec) and budgets (max_output_tokens, max_wall_s,
    max_turns, max_usd), extra keys forbidden -- falsifier: uv run pytest tests/nodes/test_model_work_contract.py
    -q, red at the merge base where the module is absent, including a case that a
    contract with an unknown key is refused'
  acceptance:
  - id: AC1
    statement: 'AC1: ModelWorkContract is a frozen pydantic model with contract_id,
      task_kind, inputs (path and sha256 each), acceptance (kind one of command, schema,
      dod_evidence, seeded_bug, plus spec) and budgets (max_output_tokens, max_wall_s,
      max_turns, max_usd), extra keys forbidden -- falsifier: uv run pytest tests/nodes/test_model_work_contract.py
      -q, red at the merge base where the module is absent, including a case that
      a contract with an unknown key is refused'
- id: req-model-work-ac2
  statement: 'AC2: the loader refuses a contract whose input sha256 differs from the
    bytes of the file it names -- falsifier: uv run pytest tests/nodes/test_model_work_contract.py
    -q -k input_pin_mismatch'
  acceptance:
  - id: AC2
    statement: 'AC2: the loader refuses a contract whose input sha256 differs from
      the bytes of the file it names -- falsifier: uv run pytest tests/nodes/test_model_work_contract.py
      -q -k input_pin_mismatch'
- id: req-model-work-ac3
  statement: 'AC3: 100 scenario contracts (ids F01-01 to F10-10, from the five result
    tables the deleg-sc lanes write) and at least 20 DoD-derived contracts load, and
    every one carries an acceptance check that runs in code -- falsifier: uv run pytest
    tests/nodes/test_work_contract_corpus.py -q asserting 100 scenario ids and at
    least 20 dod ids'
  acceptance:
  - id: AC3
    statement: 'AC3: 100 scenario contracts (ids F01-01 to F10-10, from the five result
      tables the deleg-sc lanes write) and at least 20 DoD-derived contracts load,
      and every one carries an acceptance check that runs in code -- falsifier: uv
      run pytest tests/nodes/test_work_contract_corpus.py -q asserting 100 scenario
      ids and at least 20 dod ids'
- id: req-model-work-ac4
  statement: 'AC4: every acceptance kind has a negative control: the check run on
    a deliberately wrong answer returns fail, and run twice on the same answer returns
    the same verdict -- falsifier: uv run pytest tests/nodes/test_work_contract_checks.py
    -q -k negative_control_and_determinism'
  acceptance:
  - id: AC4
    statement: 'AC4: every acceptance kind has a negative control: the check run on
      a deliberately wrong answer returns fail, and run twice on the same answer returns
      the same verdict -- falsifier: uv run pytest tests/nodes/test_work_contract_checks.py
      -q -k negative_control_and_determinism'
- id: req-model-work-ac5
  statement: 'AC5: no scenario or DoD input names private knowledge-base text, customer
    data or a secret -- falsifier: uv run pytest tests/nodes/test_work_contract_corpus.py
    -q -k public_inputs_only'
  acceptance:
  - id: AC5
    statement: 'AC5: no scenario or DoD input names private knowledge-base text,
      customer data or a secret -- falsifier: uv run pytest tests/nodes/test_work_contract_corpus.py
      -q -k public_inputs_only'
- id: req-model-work-ac6
  statement: 'AC6: the acceptance spec is a discriminated union per kind with bounded
    numeric budgets, every contract has a positive control that passes and a negative
    control that fails, a DoD-derived contract fails at its recorded base commit and
    passes on the known repair, and an attempt that edits the evaluator files is failed
    -- falsifier: uv run pytest tests/nodes/test_work_contract_checks.py -q -k controls_and_evaluator_immutability'
  acceptance:
  - id: AC6
    statement: 'AC6: the acceptance spec is a discriminated union per kind with bounded
      numeric budgets, every contract has a positive control that passes and a negative
      control that fails, a DoD-derived contract fails at its recorded base commit
      and passes on the known repair, and an attempt that edits the evaluator files
      is failed -- falsifier: uv run pytest tests/nodes/test_work_contract_checks.py
      -q -k controls_and_evaluator_immutability'
