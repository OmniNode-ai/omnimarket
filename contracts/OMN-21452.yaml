- id: dod-omn21452-deploy-offline-package-probe
  description: 'Hosted-runner deploy probe: resolves the packaged pure node contract
    and disabled overlay and sends a typed contract/check through a real in-memory
    bus and a file binding. No services or credentials. A base without the node fails
    imports.'
  source: manual
  checks:
  - check_type: command
    check_value: uv run --frozen pytest tests/nodes/test_work_contract_bindings.py
      -q --no-cov
    cwd: ${OMNI_HOME}/omnimarket
