schema_version: 1.0.0
ticket_id: OMN-24866
title: The landing canary's scheduled run reads the process environment when the runtime gives it none
summary: The runtime builds the scheduled landing canary handler with no environ. open_canary and settle_canary turned that None into an empty map for the repository backend, the host name and the ledger appender, so every settle raised ValueError and the run event read failed with the source not bound. A None environ now reads the process environment.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24866-environ
  statement: The scheduled landing canary open and settle read os.environ when the caller passes no environ.
  acceptance:
  - id: AC1
    statement: 'AC1: settle_canary with environ=None reads the host name and the ledger route from the process environment -- falsifier: uv run pytest tests/nodes/node_landing_canary_scheduled_effect -k process_environment fails with ValueError naming the host variable'
evidence_requirements:
- kind: tests
  description: The scheduled landing canary focused tests.
  command: env -u PYTHONPATH uv run --frozen pytest tests/nodes/node_landing_canary_scheduled_effect -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24866-ac1-tests
  description: The scheduled landing canary tests pass, including the None-environ test and its failing control.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_landing_canary_scheduled_effect -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24866-integration-proof
  description: Hosted CI cannot reach a lab host, so only the local Done gate runs this unbound check. It runs the scheduled landing canary tests, the None-environ settle among them, once on a lab host at the sha.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24866 --kind test -- uv run --frozen pytest tests/nodes/node_landing_canary_scheduled_effect -q --no-cov -n 0 -p no:randomly
    cwd: .
