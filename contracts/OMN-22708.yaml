schema_version: 1.0.0
ticket_id: OMN-22708
title: The delegation completion-bound terminal states the attempt in flight and the superseded answers it rejected
summary: The completion-bound sweep no longer says the runtime process holding the leg went away; it names the in-flight inference attempt and the superseded answers the row rejected, read from the durable row.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn22708-terminal-names-recorded-cause
  statement: The terminal the completion bound builds for an abandoned delegation states what its durable row records, and a redelivered routing decision opens no new attempt while one is in flight.
  acceptance:
  - id: AC1
    statement: "AC1: a test built from the recorded c490e90f and 75c15093 rows fails when the completion-bound terminal says the process went away and passes when it names the in-flight attempt and the superseded answers rejected -- falsifier: uv run pytest tests/unit/delegation/test_omn22478_abandoned_cause_recorded_rows.py -q --no-cov on origin/dev 7b8f67d0b3 and on the fix"
  - id: AC2
    statement: "AC2: a test from the recorded 75c15093 row fails if a redelivered routing decision for a run with an attempt in flight opens a new attempt -- falsifier: the same pytest file with the in-flight guard removed"
evidence_requirements:
- kind: tests
  description: The recorded-row tests and the existing completion-bound tests at the pushed head.
  command: uv run --frozen pytest tests/unit/delegation/test_omn22478_abandoned_cause_recorded_rows.py tests/unit/delegation/test_omn18296_completion_bound.py -q --no-cov -p no:randomly
