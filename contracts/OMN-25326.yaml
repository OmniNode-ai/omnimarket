schema_version: 1.0.0
ticket_id: OMN-25326
title: Make the lane container budget node reachable by a command on the bus so the dev runtime can run it
summary: 'node_lane_container_budget_compute declared no topic, so the runtime never attached it and no demand could reach it. The contract now declares the request topic as its command and the verdict topic as its terminal event. The node stays a pure compute node and the floor still calls its handler in process. The reading on the h201 dev runtime is the pull request Lab comment.'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn25326-ac1
  statement: 'one demand reaches node_lane_container_budget_compute on the dev runtime on h201 and is handled, read as a log line at a named revision'
  acceptance:
  - id: AC1
    statement: 'AC1: one demand or tick reaches node_lane_container_budget_compute on the dev runtime on h201 and is handled, read by the lane itself as a log line, dispatch, health read or job record, at a named revision -- falsifier: ssh read of the dev runtime log on h201 shows no run line of the node after the install'
- id: req-omn25326-ac2
  statement: 'the change is installed through the declared installer with no hand edit, and the installed revision is read back'
  acceptance:
  - id: AC2
    statement: 'AC2: the change is installed, or the cause is fixed, through the declared installer with no hand edit of a host file, unit or plist, and the installed revision is read back; any code change is a draft PR with a Lab: line -- falsifier: the declared installer''s own status read on h201 names no omnimarket revision for it'
- id: req-omn25326-ac3
  statement: 'a STATUS row names the installed revision and what ran'
  acceptance:
  - id: AC3
    statement: 'AC3: a STATUS row `kv pr=omnimarket#6025 installed=<host>:<revision> observed=<what ran> read_at=<UTC>` is on the work ledger, so the next integration pass marks it SEEN RUNNING -- falsifier: python3 plugins/omni/skills/lane-brief/scripts/lane_brief.py grep ''pr=omnimarket#6025'' returns no row with installed= and observed='
evidence_requirements:
- kind: tests
  description: The node's tests pass at the pushed head.
  command: uv run --frozen pytest tests/nodes/node_lane_container_budget_compute tests/chains/lane_container_budget -q -p no:cacheprovider --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn25326-ac1
  description: 'The contract test asserts the command topic, the verdict topic and the terminal event. The reading on the h201 dev runtime needs that host; hosted CI cannot reach it and it is posted as the pull request Lab comment.'
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_lane_container_budget_compute/test_lane_container_budget.py -q -p no:cacheprovider --no-cov
    cwd: .
- id: dod-omn25326-ac2
  description: 'The node tests and the chain tests pass at the pushed head; the install and its read-back are the pull request Lab comment, since the dev lane branch install runs on h201.'
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_lane_container_budget_compute tests/chains/lane_container_budget -q -p no:cacheprovider --no-cov
    cwd: .
- id: dod-omn25326-ac3
  description: 'The STATUS row is on the work ledger; the contract test for the node is the hosted proxy.'
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_lane_container_budget_compute/test_lane_container_budget.py -q -p no:cacheprovider --no-cov
    cwd: .
- id: dod-omn25326-integration-proof
  description: the request is published on the command topic of the dev runtime and the run line is read; hosted CI cannot reach the lab, so only the local Done gate runs this unbound check. The reading on the h201 dev runtime is the pull request Lab comment.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-25326 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_lane_container_budget_compute tests/chains/lane_container_budget -q --no-cov
