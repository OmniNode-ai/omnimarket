schema_version: 1.0.0
ticket_id: OMN-22385
title: omnimarket takes every running omnibase_compat reference out of the repository
summary: omnibase_compat is retired. The PR OCC stamp schema has been in omnibase_core since 0.47.60, so omnimarket imports it from core, raises its core floor to 0.47.60, and drops the omnibase-compat dependency, override and mypy module, the node metadata and contract dependency entries, the repository lists that named it, and every CI step that cloned or installed it. omnibase-compat stays in uv.lock only transitively through omnibase-infra until an infra release without it ships.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn22385-no-import
  statement: No module under src/omnimarket imports omnibase_compat.
  acceptance:
  - id: AC1
    statement: 'AC1: no omnimarket module imports omnibase_compat in code that ships -- falsifier: uv run pytest tests/unit/test_no_omnibase_compat_running_references.py -k import'
- id: req-omn22385-no-declaration
  statement: pyproject.toml and the node metadata name omnibase-compat as no dependency, override or mypy module.
  acceptance:
  - id: AC2
    statement: 'AC2: pyproject.toml and node metadata name no omnibase-compat dependency, override or mypy module -- falsifier: uv run pytest tests/unit/test_no_omnibase_compat_running_references.py -k "pyproject or metadata"'
- id: req-omn22385-no-ci-reference
  statement: No omnimarket workflow or script clones or installs omnibase_compat.
  acceptance:
  - id: AC4
    statement: 'AC4: no omnimarket CI workflow or script clones, installs or lists omnibase_compat -- falsifier: git grep -n omnibase_compat -- .github scripts prints only comment or docstring lines'
evidence_requirements:
- kind: tests
  description: The import scan, the pyproject scan and the metadata scan run over the real tree; the clone-step tests read the real workflows.
  command: uv run pytest tests/unit/test_no_omnibase_compat_running_references.py tests/ci/test_sibling_pins_omn20001.py tests/ci/test_hostile_review_clone_timeout_omn17427.py tests/ci/test_sibling_clone_ref_omn19998.py -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn22385-ac1
  description: AC1 an AST scan of src/omnimarket finds no omnibase_compat import, and the OCC stamp authoring tests pass against omnibase_core. At the merge base the scan reports occ_stamp_authoring.py, so it fails.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/test_no_omnibase_compat_running_references.py tests/unit/nodes/node_pr_lifecycle_fix_effect/test_occ_stamp_authoring.py -q --no-cov --tb=line
    cwd: .
- id: dod-omn22385-ac2
  description: AC2 pyproject.toml declares no omnibase-compat requirement, override or mypy module and no node metadata lists it. At the merge base both scans fail.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/test_no_omnibase_compat_running_references.py -q --no-cov --tb=line -k "pyproject or metadata"
    cwd: .
- id: dod-omn22385-ac4
  description: AC4 no workflow clones or installs omnibase_compat and the clone-step tests still hold over the workflows that remain.
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/ci/test_sibling_pins_omn20001.py tests/ci/test_hostile_review_clone_timeout_omn17427.py tests/ci/test_sibling_clone_ref_omn19998.py -q --no-cov --tb=line
    cwd: .
- id: dod-omn22385-deploy-probe
  description: 'Deploy probe: pyproject.toml at the checked-out commit carries the core floor 0.47.60, which the merge base does not.'
  source: manual
  checks:
  - check_type: command
    check_value: |-
      bash -o pipefail -c 'gh api "repos/OmniNode-ai/omnimarket/contents/pyproject.toml?ref=$(git rev-parse HEAD)" --jq .content | base64 -d | grep -F "omnibase-core>=0.47.60,<0.48.0" > /dev/null'
    cwd: .
- id: dod-omn22385-integration-proof
  description: The pushed head, run on a lab host, passes the no-compat scans, the OCC stamp authoring tests against omnibase_core and the node import sweep. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: |-
      uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane compat-market-1820 -- uv run --frozen pytest tests/unit/test_no_omnibase_compat_running_references.py tests/unit/nodes/node_pr_lifecycle_fix_effect -q --no-cov
    cwd: .
