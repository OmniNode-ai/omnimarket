schema_version: 1.0.0
ticket_id: OMN-23948
title: The topic delete tool reads the dev broker administrator login on the broker host
summary: The dev lane's machine login cannot describe 246 of the planner's 249 unused topics, so the guarded topic delete reads them back as absent. node_broker_topic_delete_effect gains an optional superuser block in its overlay. When present, its evidence reads and deletes run as the dev broker superuser through a script on the broker host that obtains the credential from the same source container the broker permission tool uses, so the credential never reaches this process, a command line or a log. Any lane other than dev refuses at the overlay load and again in the adapter.
is_seam_ticket: true
interface_change: true
interfaces_touched:
- topics
requirements:
- id: req-omn23948-superuser-route
  statement: The delete reads evidence and issues deletes as the dev broker superuser only through the declared remote script, refuses every other lane and target, and deletes only the topics the evidence clears.
  acceptance:
  - id: AC1
    statement: 'AC1: the superuser route refuses a non-dev lane, a lane that differs from the overlay bus lane, an unset or option-like ssh target, an unsafe topic name and a broker host without the credential, each before or without a delete -- falsifier: env -u PYTHONPATH uv run pytest tests/nodes/node_broker_topic_delete_effect/test_rpk_superuser_admin.py -q -k "refus or lane or target or name or credential"'
  - id: AC2
    statement: 'AC2: the golden chain and error chain tests and the seam test with the broker permission tool pass, and fail with the delete command or the credential prologue removed -- falsifier: env -u PYTHONPATH uv run pytest tests/nodes/node_broker_topic_delete_effect/test_rpk_superuser_admin.py -q -k "chain or seam or control"'
  - id: AC3
    statement: 'AC3: integrated: the dry run and the delete ran on the dev broker through this node from the pushed branch and the shard partition count before and after was read from the running broker -- falsifier: read the shard partition count from the broker-load reading and compare it with the count the plan printed before the delete'
evidence_requirements:
- kind: tests
  description: The superuser adapter, handler chain, selection and seam tests at the pushed head. With the lane check removed from the adapter the non-dev refusal test fails.
  command: env -u PYTHONPATH uv run pytest tests/nodes/node_broker_topic_delete_effect -q
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23948-ac1-refusals
  description: The refusal tests of the superuser route pass at the pushed head.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_broker_topic_delete_effect/test_rpk_superuser_admin.py -q --no-cov -n 0 -p no:randomly -k "refus or lane or target or name or credential"
    cwd: .
- id: dod-omn23948-ac2-chain-and-seam
  description: The golden chain, error chain, seam and control tests of the superuser route pass at the pushed head.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_broker_topic_delete_effect/test_rpk_superuser_admin.py -q --no-cov -n 0 -p no:randomly -k "chain or seam or control"
    cwd: .
- id: dod-omn23948-ac3-node-tests
  description: The node's whole test directory passes at the pushed head; the dry run and the delete on the dev broker are read from the running broker and recorded in the pull request.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_broker_topic_delete_effect -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn23948-integration-proof
  description: The pushed head ran the node's tests on a lab host through the lab work runner and exited 0. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check. The dry run and the delete on the dev broker are recorded in the pull request.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: 'env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23948 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_broker_topic_delete_effect -q --no-cov'
    cwd: .
