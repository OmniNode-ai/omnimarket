schema_version: 1.0.0
ticket_id: OMN-22122
title: 'Lane priority classes: factory-unblock, factory-fix, feature and other, read from a Class line on the ticket and passed by every dispatcher'
summary: 'The omnimarket half: the lab placement node''s contract holds the four classes in order with a holdback each and reads a ticket''s Class line and the factory epics of a private overlay; lab-fill and the merge sweep pass the class their ticket names; the landing decision merges a cause fix first, then factory-fix PRs, then feature PRs. The runner, the create-ticket skill and the installed-revision readback are in the omni plugin and are not part of this change.'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn22122-lane-priority-classes
  statement: Fixing factory machinery takes priority for any lane and any fix, then features, and a task carries its priority.
  acceptance:
  - id: AC1
    statement: 'AC1: the contract file lists the classes factory-unblock, factory-fix, feature, other in that order with a holdback per class, occ-retirement is gone, and no class or order is written in code -- falsifier: uv run pytest on the contract loader test that loads the contract and asserts the order, the holdbacks and the absence of occ-retirement'
  - id: AC2
    statement: 'AC2: the runner reads the Class line from the ticket text it fetches at dispatch, an explicit --priority-class or ONEX_LANE_PRIORITY_CLASS overrides it, and a ticket with no Class line falls back to the repo rule and reports the fallback -- falsifier: uv run pytest tests for lane_priority_class covering Class line, flag override and missing line with its report'
  - id: AC3
    statement: 'AC3: the omni create-ticket skill writes the Class line and its checker refuses a canonical ticket without one -- falsifier: uv run pytest on the checker with a payload lacking the Class line exiting 3 and one carrying it exiting 0'
  - id: AC4
    statement: 'AC4: factory machinery is defined once in the contract overlay and a ticket whose parent is a listed factory epic resolves to factory-fix -- falsifier: uv run pytest on the overlay loader and the parent-epic default with one listed and one unlisted parent'
  - id: AC5
    statement: 'AC5: lab-fill, the merge sweep and the exception queue mechanize lanes pass the class read from the ticket to the runner -- falsifier: uv run pytest on each dispatcher asserting the --priority-class argument built from a ticket carrying a Class line'
  - id: AC6
    statement: 'AC6: the landing controller''s merge ranks keep cause-fix first and put factory-fix PRs ahead of feature PRs -- falsifier: uv run pytest on the decide_landing ranking with a cause-fix, a factory-fix and a feature PR asserting that order'
  - id: AC7
    statement: 'AC7: on a host with one free slot a factory-fix lane is admitted ahead of a feature lane, and a factory-unblock lane takes the last slot before a feature lane -- falsifier: uv run pytest integration check of landing_placement slot admission with one slot, run on a lab host'
  - id: AC8
    statement: 'AC8: the merged change runs from the installed runner and placement on the Mac and the lab hosts at the merged revision -- falsifier: onex plugin installed-revision readback on each host showing the merged revision and a runner dry run printing the class resolved from a ticket''s Class line'
evidence_requirements:
- kind: tests
  description: The touched suites.
  command: uv run pytest tests/nodes/node_lab_placement_compute tests/unit/nodes/node_pr_landing_decision_compute tests/nodes/node_merge_sweep_effect tests/unit/nodes/node_lab_fill_effect -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn22122-ac1
  description: The node contract lists the four classes in order with a holdback each, no occ-retirement, and no class name is a literal in the node code.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_lab_placement_compute/test_lane_priority_classes.py -k 'contract or literal' -q --no-cov --tb=line
    cwd: .
- id: dod-omn22122-ac2
  description: 'Node half: the node reads the Class line, a declared class overrides it, and a ticket text without one falls back and reports CLASS-LINE-MISSING. The runner half is in the omni plugin and is proven only at the local Done gate by the unbound item below.'
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_lab_placement_compute/test_lane_priority_classes.py -k 'class_line or falls_back or reports' -q --no-cov --tb=line
    cwd: .
- id: dod-omn22122-ac2-runner-wired
  description: The remote-lane runner asks this node for the lane's class. Runs only at the local Done gate on a host that has the registry; it fails until the runner is wired to the node.
  source: manual
  binds_ac:
  - AC2
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: grep -lF priority_class_args "$OMNI_HOME"/*/plugins/omni/skills/remote-lane/scripts/onex_remote_lane.py
    cwd: .
- id: dod-omn22122-ac3
  description: 'The create-ticket checker lives in the omni plugin, outside this repository: it fails at the local Done gate until the checker refuses a canonical ticket without a Class line.'
  source: manual
  binds_ac:
  - AC3
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: grep -rlF 'Class:' "$OMNI_HOME"/*/plugins/omni/skills/create-ticket/SKILL.md
    cwd: .
- id: dod-omn22122-ac4
  description: A ticket whose parent is a listed factory epic of the lane_priority overlay resolves to factory-fix; one with an unlisted parent does not.
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_lab_placement_compute/test_lane_priority_classes.py -k 'factory_epic or overlay' -q --no-cov --tb=line
    cwd: .
- id: dod-omn22122-ac5
  description: 'Node half: lab-fill and the merge sweep build --priority-class from a ticket carrying a Class line. The exception queue''s mechanize lane keeps its fixed class until the runner accepts the new class names, so it is proven by the unbound item below only once changed.'
  source: manual
  binds_ac:
  - AC5
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/nodes/node_lab_fill_effect/test_lab_fill_cloud_placement.py -k priority_class -q --no-cov --tb=line
    cwd: .
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_merge_sweep_effect/test_golden_chain_merge_sweep_effect.py -k priority_class -q --no-cov --tb=line
    cwd: .
- id: dod-omn22122-ac5-exception-queue
  description: The exception queue's mechanize command no longer names a class literally. Local Done gate only; fails until changed.
  source: manual
  binds_ac:
  - AC5
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: bash -c '! grep -nE "process-fix" src/omnimarket/nodes/node_exception_queue_effect/handler.py'
    cwd: .
- id: dod-omn22122-ac6
  description: decide_landing merges a cause-fix PR first, then a factory-fix PR, then a feature PR, with the oldest PR the feature one.
  source: manual
  binds_ac:
  - AC6
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/nodes/node_pr_landing_decision_compute/test_landing_decision_causes.py -k merge_order -q --no-cov --tb=line
    cwd: .
- id: dod-omn22122-ac7
  description: 'Node half: with one free slot a factory-fix lane is admitted ahead of a feature lane and a factory-unblock lane takes the last slot before a feature lane. The lab-host run is proven by the unbound item below.'
  source: manual
  binds_ac:
  - AC7
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_lab_placement_compute/test_lane_priority_classes.py -k 'slot or holdback' -q --no-cov --tb=line
    cwd: .
- id: dod-omn22122-integration-proof
  description: The pushed head ran the node's tests on a lab host through the bus and exited 0. Hosted CI cannot reach the lab broker, so only the local Done gate runs this unbound check.
  source: manual
  binds_ac:
  - AC7
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane fill-ticket-OMN-22122-20261104T0524Z -- uv run --frozen pytest tests/nodes/node_lab_placement_compute -q --no-cov
    cwd: .
- id: dod-omn22122-ac8
  description: Installed-revision readback on the Mac and the lab hosts is proven at the local Done gate after merge; fails until the plugin and runner halves exist.
  source: manual
  binds_ac:
  - AC8
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: grep -lF priority_class_args "$OMNI_HOME"/*/plugins/omni/skills/remote-lane/scripts/onex_remote_lane.py
    cwd: .
- id: dod-omn22122-deploy-probe
  description: 'Deploy probe: the contract GitHub serves at the checked-out commit declares factory_class for the lane priority classes.'
  source: manual
  checks:
  - check_type: command
    check_value: bash -o pipefail -c 'gh api "repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_lab_placement_compute/contract.yaml?ref=$(git rev-parse HEAD)" --jq .content | base64 -d | grep -F "factory_class:" > /dev/null'
    cwd: .
