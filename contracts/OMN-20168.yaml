---
schema_version: "1.0.0"
ticket_id: "OMN-20168"
title: "Every delegation attempt records its kind, lineage, host and size band"
summary: "omnimarket stamps each delegation attempt with attempt_id, attempt_kind, host, parent_attempt_id, size_band and split_id on the durable attempt row and the bus attempt record. Each rung also carries the configuration it was sent with and the request's measured size band, a rung redelivered under an existing attempt id is kept once, and the same backend and model retried with another configuration is a config_swap. Each acceptance criterion is bound to the pull request's own tests."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-attempt-lineage"
    statement: |-
      Every delegation attempt must record what kind it was, which attempt it followed, which host and backend ran it, its size band, its rubric verdict and the configuration it was sent with, and the consumer must decode those keys.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: a first attempt, a split child, a recombine check and an escalation each emit one attempt event with backend_id, host, model, size band, rubric version and verdict, attempt kind and parent attempt id -- falsifier: uv run pytest tests/unit/delegation -k attempt_event_fields -v in omnimarket
      - id: "AC2"
        statement: |-
          AC2: a redelivered attempt command emits no second event for the same attempt key -- falsifier: uv run pytest tests/unit/delegation -k attempt_event_idempotent -v in omnimarket
      - id: "AC3"
        statement: |-
          AC3: on the dev lane an escalated delegation has one attempt event per entry in its attempt history, with the backends distinct -- falsifier: a dev-lane query of attempt events for one escalated correlation id against its attempt_history length, with a positive control on a single-attempt run
      - id: "AC4"
        statement: |-
          AC4: every attempt event carries the configuration identity (parameter values and context strategy id), and a configuration-swap retry emits attempt kind config_swap with its parent attempt id -- falsifier: uv run pytest tests/unit/delegation -k "attempt_event_configuration or config_swap_attempt_kind" -v in omnimarket
evidence_requirements:
  - kind: "tests"
    description: "The attempt lineage, consumer-first and local dispatch seam tests."
    command: "uv run pytest tests/unit/delegation/test_attempt_events_omn20168.py tests/unit/delegation/test_attempt_event_producer_omn20168.py tests/unit/delegation/test_consumer_first_attempt_lineage_omn20168.py tests/unit/delegation/test_consumer_first_attempt_configuration_omn20168.py tests/test_omn20168_local_dispatch_attempt_lineage_seam.py -q"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-attempt-lineage-ac1"
    description: "Every durable attempt row carries attempt_id, attempt_kind, host, parent_attempt_id, size_band and split_id, linked to the previous attempt by default, with size_band a present null."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/delegation/test_attempt_events_omn20168.py -q -k \"writes_a_row_with_the_lineage_fields or lineage_defaults_link or size_band_is_a_present_null\""
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC1"]
  - id: "dod-attempt-lineage-ac2"
    description: "The lineage record validates itself: each kind needs an attempt id, no kind is its own parent, later kinds need a parent, first_try forbids one, and split kinds require a split."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/delegation/test_attempt_events_omn20168.py -q -k \"each_kind or first_try_forbids or whole_request_kinds or split_kinds or later_kinds\""
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC2"]
  - id: "dod-attempt-lineage-ac3"
    description: "Stamping is pure and idempotent, keeps explicit values and nulls, serializes ids and kind, and a pre-lineage record decodes with all six fields None."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/delegation/test_attempt_events_omn20168.py -q -k \"stamping or predating or attempt_ids_use\""
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC3"]
  - id: "dod-attempt-lineage-ac4"
    description: "Bus attempt records keep hosts and stamp the escalation history, and an unparseable correlation or invalid lineage falls back without losing the terminal."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/delegation/test_attempt_events_omn20168.py -q -k \"endpoint_host or bus_attempt or unparseable or invalid_lineage or lineage_fields_type\""
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC4"]
  - id: "dod-attempt-lineage-ac5"
    description: "The consumer declares and retains the six attempt lineage keys, still refuses any other unknown key, and so decodes against the released consumer."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/delegation/test_consumer_first_attempt_lineage_omn20168.py -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC5"]
  - id: "dod-attempt-lineage-ac6"
    description: "A real escalating local dispatch writes one lineage entry per attempt, and the row and the typed terminal name the same attempts."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/test_omn20168_local_dispatch_attempt_lineage_seam.py -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC6"]
  - id: "dod-attempt-configuration-consumer-first"
    description: "An attempt carrying configuration, or a null one, decodes with the key dropped, configuration is a forthcoming attempt key only, and any other unknown key is still refused."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/delegation/test_consumer_first_attempt_configuration_omn20168.py -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC4"]
    supersedes_ac_binding:
      - item: "dod-attempt-lineage-ac5"
        label: "AC5"
        reason_kind: "no_longer_applicable"
        reason: "The ticket carries four acceptance criteria; AC5 was a contract-only criterion for the consumer-first lineage decode and is not on the ticket."
        retired_by: "jake-b-omni"
        retired_at: "2026-10-20T21:29:48Z"
      - item: "dod-attempt-lineage-ac6"
        label: "AC6"
        reason_kind: "no_longer_applicable"
        reason: "The ticket carries four acceptance criteria; AC6 was a contract-only criterion for the local dispatch seam and is not on the ticket."
        retired_by: "jake-b-omni"
        retired_at: "2026-10-20T21:29:48Z"
  - id: "dod-attempt-configuration-deploy-smoke"
    description: "Hosted deploy probe: a disposable container mounts the checked-out source read-only and checks that the attempt record's consumer-first key set declares configuration beside backend_pinned. The probe is absent at the merge base and present at the head. A container that installed the package and ran the consumer tests exceeded the verifier's 30 second per-check budget on a hosted runner, so the behavioural proof that configuration and a null configuration decode with the key dropped, and that any other unknown key is still refused, stays in dod-attempt-configuration-consumer-first. This does not claim a dev-lane rollout."
    source: "manual"
    execution_scope: "hosted_and_local"
    checks:
      - check_type: "command"
        check_value: |-
          sh -c 'docker run --rm -v "${PWD}:/workspace:ro" -w /workspace postgres:16-alpine sh -c "set -eu; grep -Fq \"{\\\"backend_pinned\\\", \\\"configuration\\\"}\" src/omnimarket/models/delegation/wire/model_delegate_skill_response.py"'
        cwd: "."
  - id: "dod-attempt-producer-ac1"
    description: "A real escalating local dispatch writes a first try and an escalation, and a split ladder writes a split child and a recombine check, each with backend_id, host, model, the request's size band, the rubric version and verdict, the attempt kind and the parent attempt id. Fails at the merge base, where the size band is a present null and the stamper takes no request band."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/delegation/test_attempt_event_producer_omn20168.py -q --no-cov -p no:randomly -k attempt_event_fields"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC1"]
  - id: "dod-attempt-producer-ac2"
    description: "A rung redelivered under an attempt id already in the ladder is kept once on the stamped ladder, the stored row and the typed terminal, and the whole terminal delivered again is the same row. Fails at the merge base, which keeps the redelivered rung as a second attempt."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/delegation/test_attempt_event_producer_omn20168.py -q --no-cov -p no:randomly -k attempt_event_idempotent"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC2"]
  - id: "dod-attempt-producer-ac3"
    description: "In-process half of AC3: an escalated dispatch writes one attempt event per entry in its ladder with distinct backends, each carrying its configuration, and the positive control (a single-attempt run) writes exactly one. The dev-lane query half is recorded on the ticket. Fails at the merge base, where no rung carries a configuration."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/delegation/test_attempt_event_producer_omn20168.py -q --no-cov -p no:randomly -k one_event_per_attempt_with_distinct_backends"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC3"]
  - id: "dod-attempt-producer-ac4"
    description: "Every rung of a real dispatch carries its configuration (effective max tokens, temperature, top_p, reasoning effort, context strategy id) on the row and the typed record, and the same backend and model retried with another configuration is stamped config_swap with its parent attempt id. Fails at the merge base, where the attempt record drops configuration and the stamper never derives config_swap."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/delegation/test_attempt_event_producer_omn20168.py -q --no-cov -p no:randomly -k \"attempt_event_configuration or config_swap_attempt_kind\""
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC4"]
  - id: "dod-attempt-configuration-declared-deploy-probe"
    description: "Deploy probe. Read the attempt record from GitHub at the checked-out commit and require configuration declared as a field, with the consumer test that it decodes and is kept. This supersedes dod-attempt-configuration-deploy-smoke, which probed the consumer-first set that dropped configuration; that set no longer names it because the attempt record now declares it."
    source: "manual"
    evidence_artifact: "supersedes_dod_evidence:dod-attempt-configuration-deploy-smoke"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/delegation/test_consumer_first_attempt_configuration_omn20168.py -q --no-cov -p no:randomly"
        cwd: "${OMNI_HOME}/omnimarket"
      - check_type: "command"
        check_value: "bash -o pipefail -c 'gh api \"repos/OmniNode-ai/omnimarket/contents/src/omnimarket/models/delegation/wire/model_delegate_skill_response.py?ref=$(git rev-parse HEAD)\" --jq .content | base64 -d | grep -F \"configuration: ModelAttemptConfiguration | None\" > /dev/null'"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC4"]
