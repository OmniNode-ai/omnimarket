schema_version: 1.0.0
ticket_id: OMN-23138
title: Lane intake reaches ticket creation through a contract command and a typed result instead of a private handler
summary: Lane intake no longer imports the ticket node's handler. The installed ticket guard locator moved to omnimarket.handlers.ticket_guard_locator, which handler_create_ticket re-exports, and a new lane intake create handler opens a ticket by publishing the ticket write node's create command and reading the terminal that names it. A node refusal reaches the caller as a typed failure with the node's reason and the guard's finding codes. Golden and error chain event tests run the real write effect over an in-memory bus, and three named mutants each turn a chain red.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23138-no-handler-import
  statement: The dispatch side of lane intake creates a ticket by command and typed result and imports no tickets-plans handler.
  acceptance:
  - id: AC1
    statement: 'AC1: the dispatch module creates a ticket by publishing the create command and reading the typed result, with no import of the tickets-plans handler -- falsifier: uv run pytest src/omnimarket/nodes/node_network_graph_compute -q -k relation_count_dispatch_tickets_plans'
- id: req-omn23138-command-result
  statement: Lane intake still creates a ticket on the recorded cases and a typed refusal reaches the caller as a typed failure.
  acceptance:
  - id: AC2
    statement: 'AC2: lane intake still creates a ticket on the recorded cases and a typed refusal reaches the caller as a typed failure -- falsifier: uv run pytest src/omnimarket/nodes/node_create_ticket -q -k lane_intake_command_result'
- id: req-omn23138-chains
  statement: Golden and error chain tests exist for the command path and a named mutation turns each red.
  acceptance:
  - id: AC3
    statement: 'AC3: golden and error chain tests for the new command path exist and a named mutation turns each red -- falsifier: uv run pytest src/omnimarket/nodes/node_create_ticket -q -k chain'
evidence_requirements:
- kind: tests
  description: The relation count test walks the source tree and reads zero; the command result and chain tests run the real ticket write effect over an in-memory bus.
  command: uv run pytest src/omnimarket/nodes/node_network_graph_compute src/omnimarket/nodes/node_create_ticket -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23138-ac1
  description: AC1 the relation node, run over every first-party import in the tree with lane intake labelled dispatch and the ticket handler packages labelled tickets-plans, counts zero occurrences; the same walk counts one for a planted import.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest src/omnimarket/nodes/node_network_graph_compute -q --no-cov --tb=line -k relation_count_dispatch_tickets_plans
    cwd: .
- id: dod-omn23138-ac2
  description: AC2 the create handler publishes a create command on the contract's topic, returns the ticket from the completed terminal, replays a retry once, and returns each refusal the node terminates with as a typed failure.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest src/omnimarket/nodes/node_create_ticket -q --no-cov --tb=line -k lane_intake_command_result
    cwd: .
- id: dod-omn23138-ac3
  description: AC3 the golden and error chain events pass for the handler and each of the three named mutants turns the chain it breaks red.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest src/omnimarket/nodes/node_create_ticket -q --no-cov --tb=line -k chain
    cwd: .
- id: dod-omn23138-integration-proof
  description: The pushed head ran the ticket node, relation node and ticket write tests on a lab host and exited 0. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: |-
      uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane graph-OMN-23138-2200 -- uv run --frozen pytest src/omnimarket/nodes/node_network_graph_compute src/omnimarket/nodes/node_create_ticket tests/nodes/node_create_ticket tests/nodes/node_linear_ticket_write_effect tests/nodes/node_repo_health_repair_effect -q --no-cov
    cwd: .
