schema_version: 1.0.0
ticket_id: OMN-23370
title: The savings projection's hook-event consume concurrency has its own contract and ticket
summary: The projection_savings consumer group on the hook-event topic fell behind because the savings projection contract declared no consume concurrency, so the runtime dispatched its records one at a time. The contract now declares four records in flight, the bound the sibling projection_claude_hook_events contract already declares.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23370-savings-consume-concurrency
  statement: The savings projection contract declares four hook-event records in flight, the runtime loader reads it as non-serial, and the projection_savings hook-event consumer group reads under its lag bar on the served floor after rollout.
  acceptance:
  - id: AC1
    statement: 'AC1: the savings projection contract declares consume_concurrency with four records in flight under this ticket''s own contract file -- falsifier: uv run pytest tests/test_savings_hook_event_consume_concurrency.py -q, failing on the contract without the declaration'
  - id: AC2
    statement: 'AC2: the savings projection consumer group on hook events reads under its lag bar on the served floor an hour after rollout -- falsifier: the broker-lag reading still ALARMs for the projection_savings hook-event group'
evidence_requirements:
- kind: tests
  description: The savings hook-event consume concurrency tests pass
  command: uv run --frozen pytest tests/test_savings_hook_event_consume_concurrency.py -q --no-cov -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23370-contract-declares-concurrency
  description: Runs the focused tests. The savings contract declares max_in_flight_records 4, the runtime loader reads it as non-serial, concurrent ignored hook events open no bindings and a PostCompact event among them reaches the runner once. The declaration test fails on the contract without the consume_concurrency block.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/test_savings_hook_event_consume_concurrency.py -q --no-cov -p no:randomly
    cwd: .
- id: dod-omn23370-runtime-reads-concurrent-bound
  description: The runtime's own loader reads the savings contract as non-serial with four records in flight, the declaration the rolled-out runtime consumes. Goes red on the contract without the block (the loader reads one). The lag reading itself is the local integration check below.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/test_savings_hook_event_consume_concurrency.py -q --no-cov -p no:randomly -k test_the_runtime_loader_reads_the_savings_bound_as_concurrent
    cwd: .
- id: dod-omn23370-savings-skip-regression
  description: The savings writer's hook-event skip tests from the earlier fix still pass beside the new bound. A regression check, not proof of a criterion.
  source: manual
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/test_omn23043_savings_hook_event_skip.py -q --no-cov -p no:randomly
    cwd: .
- id: dod-omn23370-integration-proof
  description: The pushed head ran the savings hook-event consume concurrency tests on a lab host through the lab work runner and exited 0. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23370 --kind test -- uv run --frozen pytest tests/test_savings_hook_event_consume_concurrency.py -q --no-cov -p no:randomly
    cwd: .
