schema_version: 1.0.0
ticket_id: OMN-24951
title: 'Make omnimarket PR 6062 run where it belongs: one ci-checkout request is read answered by node_ci_checkout_effect'
summary: 'The dev runtime auto-wired node_ci_checkout_effect from its subscribe_topics and built HandlerCiCheckout with no host name or overlay, so every ci-checkout request failed there with NodeOverlayError and a failed terminal raced the serve host''s answer. The node''s contract now declares no subscribe_topics: only the per-host serve process (runtime_dispatch.command_topic) consumes the command topic.'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24951-ac1
  statement: a ci-checkout request is answered by the per-host serve of node_ci_checkout_effect on h051 and the dev runtime on h201 wires no consumer for it
  acceptance:
  - id: AC1
    statement: 'AC1: a STATUS row on the rolling ledger reads kv pr=omnimarket#6062 installed=h051:<revision> observed=<the ci-checkout request line answered by onex-ci-checkout-serve.service on h051> read_at=<UTC>, written by the lane after it read that answered request on h051 itself, where the install went through the declared installer (the serve''s own `ci-checkout unit install`) -- falsifier: `grep -F ''pr=omnimarket#6062'' $ONEX_LEDGER_PATH | grep -F ''installed=h051:''` finds no row, or the row''s observed cell names a request answered on h201'
- id: req-omn24951-ac2
  statement: the single cause that kept the node from answering cleanly on the dev runtime is removed in the contract
  acceptance:
  - id: AC2
    statement: 'AC2: one ci-checkout request is read answered by node_ci_checkout_effect on h051 with no failed terminal for the same correlation id, or the STATUS row names the single cause that keeps it from running and who must act -- falsifier: the h051 serve log and the reply terminal show no answered request and the STATUS row names no cause and no actor'
- id: req-omn24951-ac3
  statement: the change reaches hosts through the declared installers only
  acceptance:
  - id: AC3
    statement: 'AC3: no host file, unit or plist was edited by hand: every change went through the declared installer, read from the installer''s own receipt -- falsifier: the STATUS row cites no installer receipt, or the installed unit differs from the revision the receipt names'
evidence_requirements:
- kind: tests
  description: The node's tests pass at the pushed head.
  command: uv run --frozen pytest tests/nodes/node_ci_checkout_effect -q -p no:cacheprovider --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24951-ac1
  description: 'Hosted proxy for the runtime reading, which needs the h051 serve and the ledger and which hosted CI cannot reach: the contract file itself pins AC1 to the per-host serve on h051 and to a ledger grep that finds no row until the row exists, and the contract declares no subscribe_topics. The reading itself is checked by dod-omn24951-ac1-ledger.'
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_ci_checkout_effect/test_omn_24951_contract.py -k OMN_24951_contract -q -p no:cacheprovider --no-cov
    cwd: .
- id: dod-omn24951-ac1-ledger
  description: A STATUS row on the rolling ledger names the install on h051 and one answered request. The check fails until that row exists.
  source: manual
  execution_scope: local_done_gate
  binds_ac:
  - AC1
  checks:
  - check_type: command
    check_value: bash -o pipefail -c 'grep -F "pr=omnimarket#6062" "$ONEX_LEDGER_PATH" | grep -F "installed=h051:" | grep -F "observed=" | grep -F "read_at="'
    cwd: .
- id: dod-omn24951-ac2
  description: 'Hosted proxy: the golden chain answers through the per-host serve with exactly one terminal for the correlation id and none on the failure topic, and the shared runtime wires nothing from the contract. The answered request on h051 is checked by dod-omn24951-ac2-ledger.'
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_ci_checkout_effect/test_golden_chain_node_ci_checkout_effect.py -k ci_checkout_golden -q -p no:cacheprovider --no-cov
    cwd: .
- id: dod-omn24951-ac2-ledger
  description: The ledger row for the install carries the answered request line, or names the cause and the actor. The check fails when the row carries neither.
  source: manual
  execution_scope: local_done_gate
  binds_ac:
  - AC2
  checks:
  - check_type: command
    check_value: bash -o pipefail -c 'grep -F "pr=omnimarket#6062" "$ONEX_LEDGER_PATH" | grep -E "(observed=[^|]*status=served|cause=[^|]+ \| actor=[^|]+)"'
    cwd: .
- id: dod-omn24951-ac3
  description: 'Hosted proxy: the installer group (`ci-checkout unit install`) renders the unit from the overlay, writes nothing for an undeclared host and refuses a unit that runs from a worktree; it does not show that a host file was never hand-edited. That is checked by dod-omn24951-ac3-receipt.'
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_ci_checkout_effect/test_ci_checkout_unit.py -q -p no:cacheprovider --no-cov
    cwd: .
- id: dod-omn24951-ac3-receipt
  description: The ledger row cites the installer's own receipt line (`installed <service> on h051`) and the unit status read, so a unit edited by hand has no such receipt. The check fails when the row cites none.
  source: manual
  execution_scope: local_done_gate
  binds_ac:
  - AC3
  checks:
  - check_type: command
    check_value: bash -o pipefail -c 'grep -F "pr=omnimarket#6062" "$ONEX_LEDGER_PATH" | grep -F "installed=h051:" | grep -E "receipt=[^|]*installed [^|]*on h051"'
    cwd: .
- id: dod-omn24951-integration-proof
  description: The node tests run on a lab host at the pushed head; hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24951 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_ci_checkout_effect -q --no-cov
    cwd: .
