schema_version: 1.0.0
ticket_id: OMN-24951
title: 'Make omnimarket PR 6062 run where it belongs: one ci-checkout request is read answered by node_ci_checkout_effect'
summary: 'The dev runtime auto-wired node_ci_checkout_effect from its subscribe_topics and built HandlerCiCheckout with no host name or overlay, so every ci-checkout request failed there with NodeOverlayError and a failed terminal raced the serve host''s answer. The node''s contract now declares no subscribe_topics: only the per-host serve process (runtime_dispatch.command_topic) consumes the command topic.'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24951-ac1
  statement: a ci-checkout request is answered by the per-host serve of node_ci_checkout_effect on h051 and the dev runtime on h201 wires no consumer for it
  acceptance:
  - id: AC1
    statement: 'AC1: a STATUS row on the rolling ledger reads kv pr=omnimarket#6062 installed=h051:<revision> observed=<the ci-checkout request line answered by onex-ci-checkout-serve.service on h051> read_at=<UTC>, written by the lane after it read that answered request on h051 itself, where the install went through the declared installer (the serve''s own `ci-checkout unit install`) -- falsifier: `grep -F ''pr=omnimarket#6062'' $ONEX_LEDGER_PATH | grep -F ''installed=h051:''` finds no row, or the row''s observed cell names a request answered on h201'
- id: req-omn24951-ac2
  statement: the single cause that kept the node from answering cleanly on the dev runtime is removed in the contract
  acceptance:
  - id: AC2
    statement: 'AC2: one ci-checkout request is read answered by node_ci_checkout_effect on h051 with no failed terminal for the same correlation id, or the STATUS row names the single cause that keeps it from running and who must act -- falsifier: the h051 serve log and the reply terminal show no answered request and the STATUS row names no cause and no actor'
- id: req-omn24951-ac3
  statement: the change reaches hosts through the declared installers only
  acceptance:
  - id: AC3
    statement: 'AC3: no host file, unit or plist was edited by hand: every change went through the declared installer, read from the installer''s own receipt -- falsifier: the STATUS row cites no installer receipt, or the installed unit differs from the revision the receipt names'
evidence_requirements:
- kind: tests
  description: The node's tests pass at the pushed head.
  command: uv run --frozen pytest tests/nodes/node_ci_checkout_effect -q -p no:cacheprovider --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24951-ac1
  description: 'Hosted proxy for the runtime reading, which needs the h051 serve, the h201 dev runtime and the ledger, none of which hosted CI reaches: the contract tests pin every ledger check below against scratch ledgers (row 2214 among them), and the golden chain shows the shared runtime wires nothing from the node contract. The reading itself is checked by dod-omn24951-ac1-ledger and dod-omn24951-ac1-h201.'
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_ci_checkout_effect/test_omn_24951_contract.py tests/nodes/node_ci_checkout_effect/test_golden_chain_node_ci_checkout_effect.py -k "omn_24951_contract or shared_runtime" -q -p no:cacheprovider --no-cov
    cwd: .
- id: dod-omn24951-ac1-ledger
  description: 'A STATUS row of the form `pr=omnimarket#6062 | deployed=h201:<dev runtime revision> | deployed_at=<UTC> | installed=h051:<revision> | observed=<the answered request line, status=served> | correlation_id=<the new request> | h201_consumers=0 | h201_failed_terminals=0 | read_at=<UTC after deployed_at> | receipt=installed onex-ci-checkout-serve.service on h051 | receipt_rev=<revision the installer ran from> | unit_rev=<revision read from the installed unit>` names the install on h051 and one answered request, read after the h201 dev runtime was deployed at a revision whose node contract declares no subscribe_topics (read with git show at that revision). The check fails until that row exists; it fails for a row whose observed cell names h201, a read before the deploy, or a deploy at a revision that still subscribes, so ledger row 2214 (2026-11-17T14:03:00Z, written before this change) fails it.'
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: |-
      python3 - "$ONEX_LEDGER_PATH" ac1 <<'PY'
      import re, subprocess, sys
      from datetime import datetime
      ledger, mode = sys.argv[1], sys.argv[2]
      HEX = re.compile(r"[0-9a-f]{7,40}")
      def cells(row):
          out = {}
          for part in row.rstrip("\n").split(" | ")[2:]:
              key, sep, value = part.partition("=")
              if sep and re.fullmatch(r"[a-z0-9_]+", key):
                  out.setdefault(key, value.strip())
          return out
      def when(value):
          try:
              return datetime.strptime(value or "", "%Y-%m-%dT%H:%M:%SZ")
          except ValueError:
              return None
      def holds_contract(rev):
          path = f"{rev}:src/omnimarket/nodes/node_ci_checkout_effect/contract.yaml"
          shown = subprocess.run(["git", "show", path], capture_output=True, text=True, check=False)
          return shown.returncode == 0 and re.search(r"^  subscribe_topics: \[\]$", shown.stdout, re.M) is not None
      def after_deploy(c):
          host, _, rev = c.get("deployed", "").partition(":")
          deployed_at, read_at = when(c.get("deployed_at")), when(c.get("read_at"))
          return (host == "h201" and HEX.fullmatch(rev) is not None and holds_contract(rev)
                  and deployed_at is not None and read_at is not None and read_at > deployed_at)
      def served(c):
          observed = c.get("observed", "")
          return (c.get("installed", "").startswith("h051:") and "status=served" in observed
                  and "h201" not in observed and after_deploy(c))
      def h201_quiet(c):
          return (after_deploy(c) and re.fullmatch(r"[0-9a-f-]{36}", c.get("correlation_id", "")) is not None
                  and c.get("h201_consumers") == "0" and c.get("h201_failed_terminals") == "0")
      def receipt_matches(c):
          host, _, rev = c.get("installed", "").partition(":")
          revs = [rev, c.get("receipt_rev", ""), c.get("unit_rev", "")]
          return (host == "h051" and c.get("receipt") == "installed onex-ci-checkout-serve.service on h051"
                  and all(HEX.fullmatch(r) for r in revs) and all(a.startswith(b) or b.startswith(a) for a in revs for b in revs))
      CHECKS = {"ac1": served, "ac1-h201": h201_quiet, "ac3": receipt_matches,
                "ac2": lambda c: served(c) or bool(c.get("cause") and c.get("must_act"))}
      rows = [cells(r) for r in open(ledger, encoding="utf-8") if " | STATUS | " in r]
      sys.exit(0 if any(c.get("pr") == "omnimarket#6062" and CHECKS[mode](c) for c in rows) else 1)
      PY
    cwd: .
