schema_version: 1.0.0
ticket_id: OMN-24951
title: 'Make omnimarket PR 6062 run where it belongs: one ci-checkout request is read answered by node_ci_checkout_effect'
summary: 'The dev runtime auto-wired node_ci_checkout_effect from its subscribe_topics and built HandlerCiCheckout with no host name or overlay, so every ci-checkout request failed there with NodeOverlayError and a failed terminal raced the serve host''s answer. The node''s contract now declares no subscribe_topics: only the per-host serve process (runtime_dispatch.command_topic) consumes the command topic.'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24951-ac1
  statement: a ci-checkout request is answered by the per-host serve of node_ci_checkout_effect and the dev runtime wires no consumer for it
  acceptance:
  - id: AC1
    statement: 'AC1: a STATUS row on the rolling ledger reads kv pr=omnimarket#6062 installed=<host>:<revision> observed=<what ran> read_at=<UTC>, written by the lane after it read one ci-checkout request answered by the node on the dev runtime on h201 itself (a log line, a dispatch, a health read or a job record) -- falsifier: `grep -F ''pr=omnimarket#6062'' $ONEX_LEDGER_PATH | grep -F ''installed=''` finds no row'
- id: req-omn24951-ac2
  statement: the single cause that kept the node from running on the dev runtime is removed in the contract
  acceptance:
  - id: AC2
    statement: 'AC2: one ci-checkout request is read answered by node_ci_checkout_effect on the dev runtime, or the STATUS row names the single cause that keeps it from running and who must act -- falsifier: the dev runtime''s log and job record show no answered request and the STATUS row names no cause and no actor'
- id: req-omn24951-ac3
  statement: the change reaches hosts through the declared installers only
  acceptance:
  - id: AC3
    statement: 'AC3: no host file, unit or plist was edited by hand: every change went through the declared installer, read from the installer''s own receipt -- falsifier: the STATUS row cites no installer receipt, or the installed unit differs from the revision the receipt names'
evidence_requirements:
- kind: tests
  description: The node's tests pass at the pushed head.
  command: uv run --frozen pytest tests/nodes/node_ci_checkout_effect -q -p no:cacheprovider --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24951-ac1
  description: 'The runtime reading of one answered request needs the running dev runtime and the serve host; hosted CI cannot reach them. Hosted proxy: the contract declares no subscribe_topics and the serve host answers the command topic over the bus. The reading is posted as the pull request Lab comment.'
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_ci_checkout_effect/test_ci_checkout_seam.py tests/nodes/node_ci_checkout_effect/test_golden_chain_node_ci_checkout_effect.py -q -p no:cacheprovider --no-cov
    cwd: .
- id: dod-omn24951-ac2
  description: The contract wires nothing in the shared runtime (subscribe_topics empty, command topic kept in runtime_dispatch), and the golden and error chains answer through the per-host serve.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_ci_checkout_effect/test_ci_checkout_seam.py tests/nodes/node_ci_checkout_effect/test_golden_chain_node_ci_checkout_effect.py -q -p no:cacheprovider --no-cov
    cwd: .
- id: dod-omn24951-ac3
  description: The change is a contract edit and tests only; it touches no host file, unit or plist. The installer receipt is read after merge from the runtime deploy.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_ci_checkout_effect/test_ci_checkout_seam.py tests/nodes/node_ci_checkout_effect/test_golden_chain_node_ci_checkout_effect.py -q -p no:cacheprovider --no-cov
    cwd: .
- id: dod-omn24951-integration-proof
  description: The node tests run on a lab host at the pushed head; hosted CI cannot reach the lab, so only the local Done gate runs this unbound check. The reading of one answered request with the dev runtime wiring nothing is the pull request's Lab comment.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24951 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_ci_checkout_effect -q --no-cov
    cwd: .
