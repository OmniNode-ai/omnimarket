  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_ci_checkout_effect/test_ci_checkout_unit.py tests/nodes/node_ci_checkout_effect/test_golden_chain_node_ci_checkout_effect.py -k "unit or shared_runtime" -q -p no:cacheprovider --no-cov
    cwd: .
