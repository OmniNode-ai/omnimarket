---
schema_version: "1.0.0"
ticket_id: OMN-26279
title: "The three protected delegation-surface merges are measured under closure, and a fixed set replaces the whole suite only if that moves a merge under the bound"
summary: "A committed receipt states, for each protected-surface merge of the replay window and for the one protected merge named beside it, the test seconds selected under reverse import closure alone and under closure plus the fixed delegation test set, recomputed from the frozen durations, and compares both with the narrowed-run bound of 1800 seconds. No merge moves under the bound, so the full-suite rule of the adjacency file is unchanged, no narrowed protected selection is built, and the stage stays 0."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn26279-protected-surface-measurement
    statement: "The selected seconds of each protected-surface merge under closure plus the fixed set are stated in a committed receipt and recomputed by a test from the frozen durations."
    acceptance:
      - id: AC1
        statement: "AC1: a receipt states for the 60 merges the selected seconds of each protected-surface merge under closure plus the fixed set, recomputed from the durations file -- falsifier: `uv run pytest tests/nodes/node_test_selection_selector_compute -q --no-cov -k protected_surface_set` fails on a missing merge or a wrong recomputed value"
      - id: AC2
        statement: "AC2: if built, a narrowed protected merge selection contains every test file the OMN-20180 coverage proof names -- falsifier: delete one named file from the set in a fixture and the coverage test must fail"
evidence_requirements:
  - kind: tests
    description: "The receipt's figures recomputed from the frozen tree and durations, a missing merge, a wrong value, a contradicting end state, and the unchanged full-suite rule."
    command: "uv run pytest tests/nodes/node_test_selection_selector_compute -q --no-cov -k protected_surface_set"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-omn26279-ac1
    description: "The receipt config/test_selection_protected_surface_receipt.json states every protected merge of the 60 (and the one named beside the window) with the selected seconds under closure and under closure plus the fixed set, the bound and the durations digest; the test recomputes each figure from the frozen tree and fails on a missing merge or a wrong value."
    source: manual
    binds_ac: [AC1]
    checks:
      - check_type: test_passes
        check_value: >-
          uv run pytest tests/nodes/node_test_selection_selector_compute -q --no-cov -k protected_surface_set
  - id: dod-omn26279-ac2-not-built
    description: "AC2 is not built: the receipt's end state is no_merge_moves_under_bound (every protected merge stays over the 1800 second bound with the fixed set), so protected_surface_selected_paths is not added, the full_suite_path_globs rule is unchanged and selection_stage stays 0. The receipt is the evidence, and this test fails if the key appears or the end state changes."
    source: manual
    binds_ac: [AC2]
    checks:
      - check_type: test_passes
        check_value: >-
          uv run pytest tests/nodes/node_test_selection_selector_compute -q --no-cov -k "protected_surface_set_no_merge_moves_under_the_bound or protected_surface_set_full_suite_rule_stays_in_the_adjacency_file or protected_surface_set_stage_stays_zero"
  - id: dod-omn26279-integration-proof
    description: "Local Done gate only, so it binds no criterion here: on a lab host the node's test directory runs at the pushed head through onex lab-work, the placement the lanes use for a run beyond one file."
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: >-
          onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-26279 --kind test -- uv run --frozen pytest tests/nodes/node_test_selection_selector_compute -q --no-cov
        cwd: .
