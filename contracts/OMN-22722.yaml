schema_version: 1.0.0
ticket_id: OMN-22722
title: The secret reading node runs hourly through a schedule verb, installed on h053 as onex-secret-reading-hourly
summary: node_secret_reading_effect gains a schedule verb. The contract's schedule block declares the hourly cadence and a daily drill unit, the overlay's schedule_hosts names where each is installed, and schedule install writes the two systemd user timers (schedule uninstall is the rollback, a dry-run writes nothing, a venv that cannot import the node is refused). Each hourly pass probes every store consumer and writes one reading row to lane secret-reading, and the daily drill reads with a made-up identity so the error event stays inside a 24 hour window; the row carries a drill cell.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn22722-secret-reading-schedule
  statement: The piece 5 reading runs every hour on its own, writes a row per run even when a probe fails, and its error event is renewed daily by a drill, with no hand start.
  acceptance:
  - id: AC1
    statement: 'AC1: the schedule verb runs one pass that probes each store consumer and writes one reading row per run to lane secret-reading, and a failed probe writes a failed row instead of no row -- falsifier: uv run --frozen pytest tests/nodes/node_secret_reading_effect/test_secret_reading_schedule.py tests/nodes/node_secret_reading_effect/test_secret_reading.py -q --no-cov, which fails with the schedule handler reverted'
  - id: AC2
    statement: 'AC2: the node has a golden chain event test and an error chain event test, and the error one fails for real under each named injected break -- falsifier: uv run --frozen pytest tests/nodes/node_secret_reading_effect/test_secret_reading_chain_events.py -q --no-cov -k "break or golden_chain or error_chain"'
  - id: AC3
    statement: 'AC3: after this pull request merges, the unit onex-secret-reading-hourly on h053 runs the verb from the merged commit and writes a new secret-reading row every hour -- falsifier: readback of two consecutive newest rows of lane secret-reading an hour apart, with the unit list entry showing its last exit status'
evidence_requirements:
- kind: tests
  description: The schedule, the reading and its chains.
  command: uv run --frozen pytest tests/nodes/node_secret_reading_effect -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
