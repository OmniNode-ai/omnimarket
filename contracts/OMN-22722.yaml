schema_version: 1.0.0
ticket_id: OMN-22722
title: The secret reading node runs hourly through a schedule verb, installed on h053 as onex-secret-reading-hourly
summary: The schedule verb of node_secret_reading_effect is already on dev. The unit installed on h053 was killed at its 300 second start timeout on five of six passes in an evening (journal of onex-secret-reading-hourly, 2026-11-13T20:05Z to 2026-11-14T01:05Z), so most hours wrote no reading row. The contract's schedule block now gives a pass 540 seconds, the most that still ends before the reading writer's tick at :15, and a test pins that the rendered unit carries the contract's timeout.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn22722-secret-reading-hourly-rows
  statement: The piece 5 reading runs every hour on its own and a pass is not killed before it writes its row.
  acceptance:
  - id: AC1
    statement: 'AC1: the schedule verb runs one pass that probes each store consumer and writes one reading row per run to lane secret-reading, and a failed probe writes a failed row instead of no row -- falsifier: uv run pytest on the secret reading node''s schedule tests, which fail with the verb handler reverted'
  - id: AC2
    statement: 'AC2: the verb has a golden chain event test and an error chain event test, and the error one fails for real under a named injected break -- falsifier: uv run pytest on the node''s chain event tests with the break applied'
  - id: AC3
    statement: 'AC3: the unit onex-secret-reading-hourly on h053 runs the verb from the merged commit and writes a new secret-reading row every hour -- falsifier: readback of two consecutive newest rows of lane secret-reading on h053 an hour apart, with the unit''s list entry showing its last exit status'
evidence_requirements:
- kind: tests
  description: The schedule, the reading and its chains.
  command: uv run --frozen pytest tests/nodes/node_secret_reading_effect -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn22722-ac1
  description: The schedule tests and the reading tests pass, including the install, the uninstall rollback, the dry run, the drill pair and the start timeout.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_secret_reading_effect/test_secret_reading_schedule.py tests/nodes/node_secret_reading_effect/test_secret_reading.py -q --no-cov
    cwd: .
- id: dod-omn22722-ac2
  description: The golden chain, the error chains and the named breaks pass.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_secret_reading_effect/test_secret_reading_chain_events.py -q --no-cov
    cwd: .
- id: dod-omn22722-ac3-timeout
  description: The rendered hourly unit carries the contract's start timeout, which leaves a full pass room and ends before the writer's tick.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_secret_reading_effect/test_secret_reading_schedule.py -q --no-cov -k start_timeout
    cwd: .
- id: dod-omn22722-hourly-rows
  description: The hourly unit has written a secret-reading row on the ledger. Hosted CI cannot reach the lab bus, so only the local Done gate runs this check.
  source: manual
  binds_ac:
  - AC3
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: onex ledger query --query rows --lane secret-reading --kind STATUS --limit 2 | grep -q 'src=secret-reading'
    cwd: .
- id: dod-omn22722-integration-proof
  description: Run this pull request's own tests on a lab host at the pushed head. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-22722 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_secret_reading_effect -q --no-cov
    cwd: .
