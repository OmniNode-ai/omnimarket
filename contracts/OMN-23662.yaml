schema_version: "1.0.0"
ticket_id: OMN-23662
title: "The three landing timed jobs accept the standard job arguments and the install check runs them with those arguments"
summary: >-
  The registry module tick template renders every unit as `python -m <module> --omni-home <root> --state-dir <dir>`.
  The three landing mains (watcher facts, snapshot, tick orchestrator) accepted only --probe, so each exited 2 on every
  tick, while the installer start check ran them with --probe alone and passed. The mains now accept the two template
  arguments and write last-run.json (the unit heartbeat) into the state directory; the start check runs the unit with the
  arguments its rendered unit carries, then its declared probe, so a unit whose main rejects its own arguments is
  refused at install. The three landing units also get systemd siblings so a Linux lab host runs them in observe mode.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn23662-template-args
    statement: The landing mains accept the registry module tick template arguments and the installer start check proves it.
    acceptance:
      - id: AC1
        statement: 'AC1: each of the three landing mains exits 0 when run with the registry-module-tick template arguments (--omni-home, --state-dir) and writes last-run.json to the state directory -- falsifier: uv run pytest tests/nodes/node_host_installer_registry_units/test_landing_template_args.py -q'
      - id: AC2
        statement: 'AC2: the installer start check runs the unit with its real rendered arguments plus its declared probe, so a unit whose main rejects those arguments is refused and every existing unit still passes -- falsifier: uv run pytest tests/nodes/node_host_installer_registry_units/test_start_check_real_args.py -q'
      - id: AC3
        statement: 'AC3: the three landing systemd units render in observe mode, and integrated: the three landing units installed from the branch on a lab host exit 0 on three consecutive ticks in observe mode and refresh their heartbeat files -- falsifier: read each unit last-run.json age and the unit journal on the lab host after three ticks'
evidence_requirements:
  - kind: tests
    description: The installer node's focused tests, the landing mains tests and the start check tests.
    command: uv run --frozen pytest tests/nodes/node_host_installer_registry_units -q --no-cov
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-omn23662-tests
    description: The installer node tests pass with the change, including the failing control that refuses a unit whose main rejects the template arguments.
    source: manual
    execution_scope: hosted_and_local
    binds_ac: [AC1, AC2]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/nodes/node_host_installer_registry_units -q --no-cov
        cwd: .
  - id: dod-omn23662-systemd-units
    description: The three landing systemd units exist in the installer contract and render in observe mode with the template arguments; this test fails at the merge base, where the units do not exist.
    source: manual
    execution_scope: hosted_and_local
    binds_ac: [AC3]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/nodes/node_host_installer_registry_units/test_landing_systemd_units.py -q --no-cov
        cwd: .
  - id: dod-omn23662-integration-proof
    description: The three landing units installed on a lab host from this branch exit 0 on three consecutive ticks in observe mode; hosted CI cannot reach the lab host, so only the local Done gate runs this unbound check, and the read is in the pull request comment that names the head.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: 'onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23662-landing --kind test -- bash -c ''echo "{\"unit\": \"landing-tick-orchestrator-systemd\", \"mode\": \"status\", \"home\": \"$HOME\", \"registry_root\": \"$OMNI_HOME\"}" | uv run --frozen python -m omnimarket.nodes.node_host_installer_registry_units'''
        cwd: .
