schema_version: 1.0.0
ticket_id: OMN-26656
title: A response contract adds to a code task's required checks on every delegation path, and never replaces them
summary: A caller-supplied response contract no longer empties the check set of a code task class. The quality gate evaluates the class's executed-test check beside the schema, the local port and the bus workflow judge the attempt against that check, and the receipt of a code answer names the class check and the contract check with a verdict each. A class not accepted by executed tests is decided by its contract as before.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn26656-contract-adds-code-checks
  statement: A response contract adds to a code class's checks and never replaces them, on the local path and on the bus path.
  acceptance:
  - id: AC1
    statement: 'AC1: for a task class accepted by executed tests, a response contract is checked in addition to the class checks, on the local path and on the bus path -- falsifier: a code request with any schema and a failing named test is accepted on either path'
  - id: AC2
    statement: 'AC2: for a task class not accepted by executed tests, a response contract decides as it does today -- falsifier: a document request that passes its contract is refused where it was accepted before'
  - id: AC3
    statement: 'AC3: the receipt of a code answer names each class check and the contract check with its verdict -- falsifier: a receipt that shows only the contract check'
  - id: AC4
    statement: 'AC4: a count over the last 7 days of recorded runs says how many accepted code answers were governed by a response contract and how many were untested -- falsifier: no count, or one with no source named'
evidence_requirements:
- kind: tests
  description: The focused tests, each failing against the replaced check set first and passing on the fix.
  command: uv run pytest tests/unit/delegation/test_response_contract_adds_code_checks_omn26656.py -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn26656-code-class-checked-beside-contract
  description: A code request with a schema and a failing named test is refused by the gate and the bus workflow, and a passing named test is accepted; the bus acceptance site refuses a code pass that never evaluated its tests. The tests fail on a check set that a contract empties.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/delegation/test_response_contract_adds_code_checks_omn26656.py -q --no-cov -n 0 -p no:randomly -k "gate_refuses or gate_accepts or bus or local_path or checks_in_force"
    cwd: .
- id: dod-omn26656-non-code-class-unchanged
  description: A document request that passes its contract is accepted on the gate, the local port and the bus workflow, with a failing named run in the request, and records no rule evaluation. A document answer that misses its contract is still refused.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/delegation/test_response_contract_adds_code_checks_omn26656.py -q --no-cov -n 0 -p no:randomly -k "document or gate_refuses_a_code_answer"
    cwd: .
- id: dod-omn26656-receipt-names-both-checks
  description: A code answer's rule evaluations name passes_existing_tests and response_contract, each with its own verdict, and a request naming no tests records passes_existing_tests as untested.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/delegation/test_response_contract_adds_code_checks_omn26656.py -q --no-cov -n 0 -p no:randomly -k "receipt or untested"
    cwd: .
- id: dod-omn26656-seven-day-count
  description: 'The 7-day count command of accepted code answers governed by a response contract, read from the delegation run store (receipt.json and run.json under the state root runs directory), run against a fixture store: it counts only the accepted code answers newer than 7 days that carry response_contract_evidence.'
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/delegation/test_response_contract_adds_code_checks_omn26656.py -q --no-cov -n 0 -p no:randomly -k "seven_day"
    cwd: .
- id: dod-omn26656-seven-day-count-untested-and-source
  description: The 7-day count prints accepted_code_governed_untested beside accepted_code_governed_by_contract and a source= line naming the run store; a fixture store with one answer carrying no test verdict, one passed and one UNTESTED reads governed 3, untested 2.
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/delegation/test_response_contract_adds_code_checks_omn26656.py -q --no-cov -n 0 -p no:randomly -k "untested_from_tested"
    cwd: .
- id: dod-omn26656-seven-day-count-live
  description: 'The same count (module governed_code_count) over the live run store on the lab host. The store lives on the lab host, so only the local Done gate runs this unbound check.'
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: python3 -m omnimarket.nodes.node_delegation_orchestrator.governed_code_count "$OMNI_HOME/.onex_state/runs"
    cwd: .
- id: dod-omn26656-hosted-deploy-check
  description: 'Deploy check the hosted runner can run: the shared authority names the check set a contract leaves in force and the gate evaluates the executed-test check beside the schema. This binds no criterion by itself.'
  source: manual
  checks:
  - check_type: command
    check_value: grep -q 'def checks_in_force_under_response_contract' src/omnimarket/nodes/node_delegation_orchestrator/quality_bar_authority.py
    cwd: .
  - check_type: command
    check_value: grep -q 'def with_executed_class_checks' src/omnimarket/nodes/node_delegation_quality_gate_reducer/handlers/response_contract_class_checks.py
    cwd: .
- id: dod-omn26656-integration-proof
  description: On a lab host, at the pushed sha, the focused tests drive the quality gate, the local dispatch port and the bus workflow with a code request carrying a schema and a failing named test, and a document request carrying a schema; hosted CI holds no lab bus, so only the local Done gate runs this unbound check (the lab reading is in the PR's Lab line).
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-26656 --kind test -- uv run --frozen pytest tests/unit/delegation/test_response_contract_adds_code_checks_omn26656.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn26656-eval-loop-real-check-and-context
  description: The code-eval trial's draft unit can carry the repository context and the contract's own test command as the loop's check, with the test file seeded into the worktree and kept out of the unit's diff; the held answer and the contract path are never sent. This binds no criterion of this ticket.
  source: manual
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_code_eval_trial_orchestrator/test_code_eval_suite_admission.py tests/nodes/node_code_eval_trial_orchestrator/test_code_draft_hidden_check_never_sent.py tests/nodes/node_lab_work_unit_effect/test_code_draft_kind.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn26656-loop-wall-and-turn-cap-declared
  description: The code-eval trial's loop wall budget (loop_wall_budget_seconds, 3600 in the example overlay) is an overlay value (default 3600 when omitted) that reaches the loop request, so a code attempt is bounded by an executed check inside a declared wall rather than an implicit 300 s; an overlay with a turn cap over 100 refuses to load. The tests fail at the base, where the key does not exist.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_code_eval_trial_orchestrator/test_loop_wall_and_turn_cap_settings.py -q --no-cov -n 0 -p no:randomly
    cwd: .
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_code_eval_trial_orchestrator/test_code_eval_suite_admission.py -q --no-cov -n 0 -p no:randomly -k pytest_node_id
    cwd: .
- id: dod-omn26656-loop-wall-default-when-omitted
  description: An overlay that omits loop_wall_budget_seconds loads and takes the declared 3600, and an overlay that names it uses its own value, so a pinned overlay written before the key keeps loading. The omitted-key test fails at the base of this change, where the key is required.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_code_eval_trial_orchestrator/test_loop_wall_and_turn_cap_settings.py -q --no-cov -n 0 -p no:randomly -k "declared_default or uses_its_value"
    cwd: .
- id: dod-omn26656-own-key-never-leaves-provider
  description: 'An own-key session whose chosen provider answers 429, answers 503 or is unreachable ends failed on that provider: the provider call log holds only the chosen provider (every declared successor rung sits behind a second recording provider that receives no call), every attempt names the key''s own backend, and the chosen provider is called with the customer''s key (positive control). The tests fail when the selection guard that passes over unselected rungs is removed. This binds no criterion of this ticket.'
  source: manual
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/chains/local/test_chain_l12_own_key_never_leaves_provider_omn26656.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn26656-own-key-integration-proof
  description: Run the own-key no-swap tests on a lab host at the pushed head; hosted CI cannot place a lab run, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-26656-ownkey --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/chains/local/test_chain_l12_own_key_never_leaves_provider_omn26656.py -q --no-cov -n 0 -p no:randomly
