schema_version: 1.0.0
ticket_id: OMN-24609
title: Two Mac upkeep checks separate a declared reading and a kept lock file from a fault
summary: 'The lab SLI collector counted every launchd unit with a nonzero last exit as a scheduled job failure, including ai.omninode.throughput-tick and ai.omninode.queue-status-tick whose script exit
  1 is a verdict reading; its contract now declares those reading exits per label. The host reconcile node printed the clone refusal script''s stale ref lock line for the clone sync''s persistent flock
  file by age alone; its contract now declares the persistent flock file names and the node judges a declared file by its lock state (free: not printed, held: reported held, unreadable: not judged). Not
  in this change: the launchd drift observer (in a frozen repository; its session tick runner already ends 0 on a pushed verdict), the baselined clone refusal script, and the Mac install.'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24609-reading-vs-fault
  statement: A declared reading exit and a declared persistent flock file are told apart from a fault by the check that used to count or print them by exit code or file age alone.
  acceptance:
  - id: AC1
    statement: 'AC1: a scheduled job whose last result is in the contract''s declared reading results for its label is listed as a reading and not counted in scheduled_job_failures, while the same result
      on an undeclared label and any other result on a declared label are still counted -- falsifier: uv run pytest tests/test_lab_sli_collect_reading_exit.py -q -k "reading or undeclared"'
  - id: AC2
    statement: 'AC2: a lock file named in the contract''s persistent_flock_files that no process holds is not printed as a stale lock, and an undeclared old lock file is still printed -- falsifier: uv run
      pytest tests/test_host_reconcile_clone_lock_state.py -q -k "free_declared or undeclared"'
  - id: AC3
    statement: 'AC3: a declared lock file that a live process holds is reported as held and not stale, and one that cannot be read is reported as unreadable -- falsifier: uv run pytest tests/test_host_reconcile_clone_lock_state.py
      -q -k "held or unreadable"'
  - id: AC4
    statement: 'AC4: integrated: read in the running runtime on the launching Mac after the install: the next lab sli collect reading names neither ai.omninode.throughput-tick nor ai.omninode.queue-status-tick
      under "nonzero last exit" while launchctl list shows their status 1, and the next host reconcile run prints no "stale ref lock" line for onex-canonical-clone-sync.lock -- falsifier: in the running
      Mac runtime, launchctl list | grep -E "throughput-tick|queue-status-tick" shows status 1 and the sli reading detail still lists them as nonzero last exit, or grep "stale ref lock" on the reconcile
      output names onex-canonical-clone-sync.lock'
evidence_requirements:
- kind: tests
  description: The focused tests at the pushed head; each fails against the code or declaration before this change.
  command: uv run pytest tests/test_lab_sli_collect_reading_exit.py tests/test_host_reconcile_clone_lock_state.py -q --no-cov -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
