schema_version: 1.0.0
ticket_id: OMN-24028
title: The settings store keeps the newest copy of every setting, not only the last one written
summary: The overlay store projection published each snapshot record on a compacted topic with no message key, so compaction kept only the newest record of the whole topic and the host table read 3.1 days old. the projection handler gains get_keyed_publish_fn over the runner producer and publishes with the overlay id as key; the seam tests in tests/unit/nodes/node_overlay_store and the real-Postgres projection test hold the producer side and the reader side to one shape.
is_seam_ticket: true
interface_change: true
interfaces_touched:
- topics
requirements:
- id: req-omn24028-keyed-snapshot
  statement: The projection publishes each snapshot record keyed by its overlay id, so a compacted snapshot topic keeps the newest record of every overlay, and a reader folding the topic sees all of them.
  acceptance:
  - id: AC1
    statement: 'AC1: the overlay store projection publishes each snapshot record with the overlay id as its message key, so a compacted topic keeps one record per overlay -- falsifier: uv run pytest tests/unit/nodes/node_overlay_store/test_projection_snapshot_key.py -q -n 0 --no-cov -p no:cacheprovider fails when the handler publishes with no key'
  - id: AC2
    statement: 'AC2: an invalid load publishes nothing and a runtime with no publisher still stores the record -- falsifier: uv run pytest tests/unit/nodes/node_overlay_store/test_projection_snapshot_key.py -q -n 0 --no-cov -p no:cacheprovider -k "invalid or no_publisher"'
  - id: AC3
    statement: 'AC3: integrated: after the merge reaches the running runtime and one loader tick, the lab host overlay refresh reads lab_hosts with an age under one hour -- falsifier: the lab_hosts snapshot stamp loaded_at on h053 stays older than one hour after the tick; the reading of 3.1 days fails this criterion'
  - id: AC4
    statement: 'AC4: the settings store set command refuses an undeclared key with a typed error and writes nothing, records an audit row naming the actor with the previous and the new value, and the written value survives a refresh -- falsifier: uv run --frozen pytest tests/unit/nodes/node_overlay_setting_set -q -n 0 --no-cov -p no:cacheprovider fails when an undeclared key is written or the audit row is missing'
- id: req-omn24028-store-load-continues
  statement: The hourly store load goes on past a refused overlay and a stale loader assertion raises an alarm by overlay id, so one refusal never starves the ids after it and nothing stays stale unnamed.
  acceptance:
  - id: AC5
    statement: 'AC5: the hourly store load goes on past a refused overlay: a refusal planted on the second of three ids leaves the first and third published, the tick exits non-zero naming the second, and an unchanged clone asserts each overdue id again within the hour -- falsifier: uv run pytest tests/unit/nodes/node_overlay_store/test_overlay_store_load_continue.py -q -n 0 --no-cov -p no:cacheprovider fails when a refusal on one id leaves a later id unpublished'
  - id: AC6
    statement: 'AC6: each loader assertion (overlay id, digest, time) is kept in the loader state apart from what a set writes, and an id whose newest assertion is older than the bound, or that has none, raises one alarm naming the id and its owner on the topic the loader contract declares -- falsifier: uv run pytest tests/unit/nodes/node_overlay_store/test_overlay_assertion_stale.py -q -n 0 --no-cov -p no:cacheprovider fails when a stale id raises no alarm'
- id: req-omn24028-latest-core-imports
  statement: No file imports a module the newest omnibase-core removed, so the latest-core smoke job imports every node module.
  acceptance:
  - id: AC7
    statement: 'AC7: no file in src, tests or scripts imports a module the newest omnibase-core removed (cli_work_ledger_render), so the latest-core smoke job imports every node module -- falsifier: uv run --frozen pytest tests/ci/test_no_removed_core_ledger_render_import.py -q -n 0 --no-cov -p no:cacheprovider fails when a file imports the removed module'
- id: req-omn24028-snapshot-writer
  statement: The host table keys ingest node writes every overlay record of the compacted snapshot topic to the injected settings store, and an older replayed record never moves a value back.
  acceptance:
  - id: AC8
    statement: 'AC8: the host table keys ingest node applies each overlay snapshot record to the injected settings store through its handler, an older replayed record never moves a value back, and a record with no revision is skipped and counted -- falsifier: uv run --frozen pytest tests/settings_store/test_snapshot_writer.py -q -n 0 --no-cov -p no:cacheprovider fails when the handler module is absent or applies an older record over a newer one'
- id: req-omn24028-host-table-from-store
  statement: The board lab_hosts reader reads the host table through the injected settings store only, and a host table that cannot be read is unknown, never an empty list.
  acceptance:
  - id: AC9
    statement: 'AC9: the board lab_hosts reader reads the host table through the injected settings store and returns unknown (None), never an empty list, for an absent overlay, a stale heartbeat, an unreachable store and a document that is not a host table -- falsifier: uv run --frozen pytest tests/settings_store/test_host_table_from_store.py -q -n 0 --no-cov -p no:cacheprovider fails when the reader function is absent or returns an empty list for any of those cases'
- id: req-omn24028-settings-cli-table
  statement: The onex settings command reads and writes the table the projection writes, never the Valkey store, and its seed verb loads each declared overlay default into that table once.
  acceptance:
  - id: AC10
    statement: 'AC10: onex settings seed loads each declared overlay default through seed_defaults once, keeps a value the table already holds, writes nothing on a second run, and runs every store read and the seed on one event loop -- falsifier: uv run --frozen pytest tests/settings_store/test_settings_cli.py -q -n 0 --no-cov -p no:cacheprovider -k "seed or one_event_loop" fails when the seed verb is absent'
  - id: AC11
    statement: 'AC11: onex settings get, list and the seed agreement check read the table the projection writes, a set followed by a get returns the value from the table, and the first set of a Claude harness tier row creates its document -- falsifier: uv run --frozen pytest tests/settings_store/test_settings_cli.py tests/settings_store/test_bootstrap_seed_idempotent.py tests/unit/nodes/node_overlay_setting_set/test_setting_set_first_record.py -q -n 0 --no-cov -p no:cacheprovider -k "set_then_get or empty_valkey or table_holds_each_default or table_that_lacks or claude_tier_first_record" fails when a read goes to Valkey'
- id: req-omn24028-store-owned-set-age
  statement: A set on an overlay only the store writes is not refused for the age of its record; the age bound stays on the settings the loader asserts.
  acceptance:
  - id: AC12
    statement: 'AC12: a set on an overlay the loader does not list succeeds on a record idle for hours, a set on a loader-asserted overlay is still refused past the bound, and the contract names which settings keep the bound -- falsifier: uv run --frozen pytest tests/unit/nodes/node_overlay_setting_set/test_setting_set_store_owned_age.py -q -n 0 --no-cov -p no:cacheprovider fails when the age bound refuses a store-owned overlay'
evidence_requirements:
