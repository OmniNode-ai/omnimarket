schema_version: 1.0.0
ticket_id: OMN-24443
title: Floor publisher skips a step with a missing time limit as unread
summary: 'The factory floor publisher gives each publish step its time limit from limits.step_timeout_seconds in the overlay. A step that is not required and has no key is now skipped with status unread and the detail naming the missing key; the floor and details pages draw it as unread, and publish-status.json lists it. A required step with no key still refuses the cycle and names its key.'
is_seam_ticket: true
interface_change: true
interfaces_touched:
- public_api
requirements:
- id: req-omn24443-step-limit-unread
  statement: One missing step time limit costs only that step, named as unread, and never the whole publish cycle; a required step still refuses.
  acceptance:
  - id: AC1
    statement: 'AC1: a publish step that is not required and has no key in limits.step_timeout_seconds is skipped with status unread and the detail naming the missing key, and every other step runs as before -- falsifier: pytest tests/nodes/node_factory_floor_publish_effect/test_step_limit_unread.py -q'
  - id: AC2
    statement: 'AC2: a required publish step with no time limit key still refuses the cycle naming the key -- falsifier: pytest tests/nodes/node_factory_floor_publish_effect/test_step_limit_unread.py -k required_step -q'
  - id: AC3
    statement: 'AC3: the unread step is named in publish-status.json and drawn as unread, not failed, on the floor and details pages -- falsifier: pytest tests/nodes/node_factory_floor_publish_effect/test_step_limit_unread.py -k "pages or golden" -q'
  - id: AC4
    statement: 'AC4: integrated: after the merge and the next board publish on the publishing machine, publish-status.json served on the h051 web host lists no step as unread unless its key is missing from the settings, and the publisher exits 0 -- falsifier: fetch publish-status.json from the h051 web host and read steps[].status and published_at (a missing or stale published_at fails)'
evidence_requirements:
- kind: tests
  description: The step limit tests pass at the pushed head.
  command: uv run pytest tests/nodes/node_factory_floor_publish_effect/test_step_limit_unread.py -q -p no:randomly --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24443-ac1
  description: 'AC1: a non-required step with no time limit key is skipped as unread with the key named, and the other steps run; at the merge base the same test file fails 3 of 5.'
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_factory_floor_publish_effect/test_step_limit_unread.py -q -p no:randomly --no-cov
    cwd: .
- id: dod-omn24443-ac2
  description: 'AC2: a required step with no time limit key still refuses the cycle naming the key.'
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_factory_floor_publish_effect/test_step_limit_unread.py -k required_step -q -p no:randomly --no-cov
    cwd: .
- id: dod-omn24443-ac3
  description: 'AC3: the unread step is named in the publish status and drawn as unread, not failed, on the floor and details pages.'
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_factory_floor_publish_effect/test_step_limit_unread.py -k "pages or golden" -q -p no:randomly --no-cov
    cwd: .
- id: dod-omn24443-ac4
  description: 'hosted proxy for AC4: the publish step tests pass here; the read of publish-status.json served on the h051 web host after the next publish is posted as a pull request comment naming the head.'
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_factory_floor_publish_effect/test_step_limit_unread.py -q -p no:randomly --no-cov
    cwd: .
- id: dod-omn24443-integration-proof
  description: the step limit tests run on a lab host at the pushed head; hosted CI cannot reach the lab, so only the local Done gate runs this unbound check
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24443 --kind test -- env PYTHONDONTWRITEBYTECODE=1
      uv run --frozen pytest tests/nodes/node_factory_floor_publish_effect/test_step_limit_unread.py -q --no-cov -p no:randomly
