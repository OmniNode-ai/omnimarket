schema_version: 1.0.0
ticket_id: OMN-23861
title: One goal-scope admission rule in omnimarket that the merge sweep reads
summary: node_goal_scope_admission_compute ports the plugin's goal-scope rule (a change is in the goal when the ticket it declares, or an ancestor within max_depth hops, is a root of the rule or sits in a listed project; an unread ticket is never admitted) as a pure compute node over the candidates, the rule, the scope and the ticket ancestry facts. The rule and ticket-scope overlays load store first, then the plugin path, and a broken store document refuses with its key and path. The merge sweep reading takes the goal's admission facts and admits goal changes only through the node.
is_seam_ticket: true
interface_change: true
interfaces_touched:
  - public_api
requirements:
  - id: req-omn23861-compute
    statement: The goal-scope rule runs in a pure compute node and matches the plugin's rule on the plugin's recorded cases, with unread tickets never admitted.
    acceptance:
      - id: AC1
        statement: 'AC1: for the recorded cases of the plugin''s goal-scope ticket-rule, project-scope and parent-chain tests, the new compute returns the same admitted and unread sets as the plugin''s admit_by_scope -- falsifier: uv run pytest src/omnimarket/nodes/node_goal_scope_admission_compute/tests -q -k parity fails with the ancestor walk removed'
  - id: req-omn23861-overlays
    statement: The rule and ticket-scope overlays are read store first, then from the plugin path.
    acceptance:
      - id: AC2
        statement: 'AC2: the rule and ticket-scope settings are read from the overlay store root first, then the plugin path, and a broken store document refuses with its key and path and never falls through -- falsifier: uv run pytest src/omnimarket/nodes/node_goal_scope_admission_compute/tests -q -k "store_first or broken" fails when the loader reads the plugin path before the store or falls through'
  - id: req-omn23861-reading
    statement: The merge sweep reading admits goal changes only through the compute.
    acceptance:
      - id: AC3
        statement: 'AC3: the merge sweep reading admits goal changes only through the new compute -- falsifier: uv run pytest tests/nodes/node_merge_sweep_reading_compute -q -k goal_scope fails when the reading decides from a list of its own'
      - id: AC4
        statement: 'AC4: integrated: one merge sweep reading run in the running runtime admits the changes the landing controller admitted by root in the same hour, or names each difference with its reason -- falsifier: the run''s reading lacks a change that the controller''s same-hour admission record holds, with no reason given'
evidence_requirements:
  - kind: tests
    description: The parity, store-first, broken-document, golden chain and error chain tests of the compute node, and the goal-scope cases of the merge sweep reading.
    command: uv run pytest src/omnimarket/nodes/node_goal_scope_admission_compute/tests tests/nodes/node_merge_sweep_reading_compute -q -n 0 -p no:randomly --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn23861-ac1
    description: AC1 is the parity test over the recorded cases of the plugin's goal-scope tests.
    source: manual
    binds_ac:
      - AC1
    checks:
      - check_type: test_passes
        check_value: uv run pytest src/omnimarket/nodes/node_goal_scope_admission_compute/tests -q -n 0 -p no:randomly --no-cov -k parity
        cwd: .
  - id: dod-omn23861-ac2
    description: AC2 is the store-first and broken-document tests of the overlay loader.
    source: manual
    binds_ac:
      - AC2
    checks:
      - check_type: test_passes
        check_value: uv run pytest src/omnimarket/nodes/node_goal_scope_admission_compute/tests -q -n 0 -p no:randomly --no-cov -k "store_first or broken"
        cwd: .
  - id: dod-omn23861-ac3
    description: AC3 is the goal-scope cases of the merge sweep reading, with the list-fallback control.
    source: manual
    binds_ac:
      - AC3
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/nodes/node_merge_sweep_reading_compute -q -n 0 -p no:randomly --no-cov -k goal_scope
        cwd: .
  - id: dod-omn23861-ac4
    description: AC4 in-memory half is the reading's goal-scope cases; the read of a running sweep against the watcher state and the controller's same-hour admission record is left for the launching host and is named in the pull request.
    source: manual
    binds_ac:
      - AC4
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/nodes/node_merge_sweep_reading_compute -q -n 0 -p no:randomly --no-cov -k goal_scope
        cwd: .
  - id: dod-omn23861-integration-proof-admission-node-run
    description: On the dev runtime the admission node, given the recorded rebuild-pieces request (two goal roots, one change under neither), admits the changes under a root through their chain and leaves the other out. Hosted CI cannot reach the lab bus, so only the local Done gate runs this unbound item; the lane records the run and its terminal offset in the pull request once the node is installed there. The read of the merge sweep's own run against the watcher state is AC4.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: onex run-node node_goal_scope_admission_compute --input "$(cat src/omnimarket/nodes/node_goal_scope_admission_compute/tests/fixtures/rebuild_request.json)" | grep -F 'OMN-22669<OMN-21288'
        cwd: .
