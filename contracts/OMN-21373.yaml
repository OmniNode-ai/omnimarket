---
schema_version: "1.0.0"
ticket_id: "OMN-21373"
title: "Move all code out of the private data repository to omnimarket and omniclaude, leaving it data only"
summary: >-
  Epic carrier for the internal-repos code migration. This repository's part,
  port group G1 of section 18 of the migration plan, adds five pure compute
  nodes in omnimarket's canonical shape (contract, metadata, handler, models,
  entry point) with their direct tests: node_host_memory_admission_compute,
  node_landing_worker_engine_compute, node_landing_tick_bounds_compute,
  node_landing_upstream_gate_compute and node_merge_sweep_same_head_compute.
  The plugin callers are not repointed here; that is the plugin release of the
  slice that moves each caller. The epic's two acceptance criteria are read on
  the private data repository and on the lab hosts and stay pending for the epic.
  The cloud-session routing and placement logic (the cloud lane accounts file,
  the consent rule, the per-account cap, slot holds, credit and rate readings,
  the routing refusal and the cloud session text) moves into omnimarket as
  node_cloud_session_placement_effect. Private values (hosts and their consent
  columns, the placement directory, excluded repositories) arrive on the request
  from the caller's overlay. This contract covers this pull request's share of
  the epic only; the epic's criteria as a whole are not met by it.
is_seam_ticket: false
interface_change: true
interfaces_touched:
  - "public_api"
requirements:
  - id: "req-omn21373-g1-port"
    statement: >-
      The five G1 nodes exist in omnimarket with their tests, under module paths
      in the omnimarket namespace, with no private repository name, lab host
      name or address in their files.
    acceptance:
      - id: "AC1"
        statement: >-
          AC1: the private data repository holds no code file outside its data checks, and its CI refuses any added code file -- falsifier: uv run pytest tests/test_src_freeze_omn19998.py -q fails, or git ls-files on main lists a .py under src/
      - id: "AC2"
        statement: >-
          AC2: every launchd and systemd unit that ran the private data repository code runs the omnimarket or omniclaude copy -- falsifier: the plan's section 4 unit list read back on each host names an the private data repository path
evidence_requirements:
  - kind: "tests"
    description: "G1 port: the five nodes' direct tests pass in omnimarket."
    command: "uv run pytest tests/nodes/node_host_memory_admission_compute/test_golden_chain_host_memory_admission_compute.py tests/nodes/node_landing_worker_engine_compute/test_golden_chain_landing_worker_engine_compute.py tests/nodes/node_landing_tick_bounds_compute/test_golden_chain_landing_tick_bounds_compute.py tests/nodes/node_landing_upstream_gate_compute/test_golden_chain_landing_upstream_gate_compute.py tests/nodes/node_merge_sweep_same_head_compute/test_golden_chain_merge_sweep_same_head_compute.py -q"
  - kind: "tests"
    description: "The moved node's tests pass"
    command: "uv run pytest tests/nodes/node_cloud_session_placement_effect/test_cloud_accounts.py tests/nodes/node_cloud_session_placement_effect/test_cloud_session.py tests/nodes/node_cloud_session_placement_effect/test_handler_cloud_session_placement.py -q --no-cov"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn21373-ac1-g1-nodes-in-omnimarket"
    description: "AC1 contribution only: the five G1 nodes have a public home in omnimarket, so their copies can leave the internal repositories. The AC1 read on the private data repository itself stays pending for the epic."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_host_memory_admission_compute/test_golden_chain_host_memory_admission_compute.py tests/nodes/node_landing_worker_engine_compute/test_golden_chain_landing_worker_engine_compute.py tests/nodes/node_landing_tick_bounds_compute/test_golden_chain_landing_tick_bounds_compute.py tests/nodes/node_landing_upstream_gate_compute/test_golden_chain_landing_upstream_gate_compute.py tests/nodes/node_merge_sweep_same_head_compute/test_golden_chain_merge_sweep_same_head_compute.py -q"
      - check_type: "test_passes"
        check_value: "uv run pytest tests/test_g1_local_invocation.py tests/test_market_node_runtime_dogfood.py::test_market_node_runtime_dogfood_inventory_classifies_all_entry_points -q"
    binds_ac: ["AC1"]
  - id: "dod-omn21373-ac2-g1-entry-points"
    description: "AC2 contribution only: the five nodes are registered onex.nodes entry points, which the callers that units run can be repointed to. The per-host unit readback stays pending for the epic."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/test_g1_local_invocation.py -q"
      - check_type: "command"
        check_value: "uv run python -c \"from importlib.metadata import entry_points; names={e.name for e in entry_points(group='onex.nodes')}; need={'node_host_memory_admission_compute','node_landing_worker_engine_compute','node_landing_tick_bounds_compute','node_landing_upstream_gate_compute','node_merge_sweep_same_head_compute'}; missing=need-names; assert not missing, missing\""
    binds_ac: ["AC2"]
  - id: "dod-omn21373-deploy-g1-import"
    description: "Hosted deploy smoke, runnable on the hosted runner with no lab route, broker or database: dispatch the packaged node_host_memory_admission_compute through the in-process ONEX runtime and require a successful typed receipt whose refusals match the policy. The packaged-contract execution of all five nodes is bound to AC2 by tests/test_g1_local_invocation.py."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: |
          set -eu;
          export PYTHONDONTWRITEBYTECODE=1;
          probe_dir="$(mktemp -d)";
          trap 'rm -rf "$probe_dir"' EXIT;
          runtime_bin="$(uv run --locked python -c 'import sys; from pathlib import Path; print(Path(sys.executable).parent)')";
          printf '%s' '{"mem_avail_gb": 1.0, "mem_psi_avg60": null, "swap_in_kb_s": 30000.0, "swap_out_kb_s": 0.0, "min_free_gb": 4.0, "max_mem_psi": 10.0, "max_swap_kb_s": 102400.0, "max_swap_in_kb_s": 20480.0}' > "$probe_dir/input.json";
          env ONEX_LANE=omn21373-deploy-probe "$runtime_bin/onex" node node_host_memory_admission_compute --input "$probe_dir/input.json" --state-root "$probe_dir/state" --backend event_bus=inmemory --timeout 30 --output receipt --omnibase-path "$PWD" > "$probe_dir/receipt.json";
          uv run --locked python -c '
          import json
          import sys
          from pathlib import Path
          receipt = json.loads(Path(sys.argv[1]).read_text())
          assert receipt["status"] == "success" and receipt["exit_code"] == 0, receipt
          refusals = receipt["result"]["refusals"]
          assert refusals == ["mem_avail 1.0G < 4G", "swap-in 30000 KB/s > 20480 KB/s (paging)"], refusals
          print(json.dumps({"run_id": receipt["run_id"], "refusals": refusals}))
          ' "$probe_dir/receipt.json";
  - id: "dod-omn21373-ac1-node-in-omnimarket"
    description: "This pull request's share of AC1: the cloud placement logic lives in omnimarket as node_cloud_session_placement_effect and its moved tests pass (accounts file, consent, caps, pick protocol, routing refusal, session text). Fails at the merge base, which has no such node. It does not show that the private base repository holds no code."
    source: "manual"
    binds_ac: ["AC1"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_cloud_session_placement_effect/test_cloud_accounts.py tests/nodes/node_cloud_session_placement_effect/test_cloud_session.py tests/nodes/node_cloud_session_placement_effect/test_handler_cloud_session_placement.py -q --no-cov"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn21373-ac2-node-runs-through-onex-node"
    description: "This pull request's share of AC2: the node is registered as an onex.nodes entry point and its contract resolves the handler and models, so a caller runs the omnimarket copy through onex node. Fails at the merge base. It does not show any launchd or systemd unit moved."
    source: "manual"
    binds_ac: ["AC2"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_cloud_session_placement_effect/test_handler_cloud_session_placement.py -q --no-cov -k contract_dispatch"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn21373-deploy-probe"
    description: "Deploy probe. Read the node's contract from GitHub at the checked-out commit and require its operation, with the contract test. It fails at the merge base, which has no such contract."
    source: "manual"
    binds_ac: ["AC2"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_cloud_session_placement_effect/test_handler_cloud_session_placement.py -q --no-cov -k contract_dispatch"
        cwd: "${OMNI_HOME}/omnimarket"
      - check_type: "command"
        check_value: "bash -o pipefail -c 'gh api \"repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_cloud_session_placement_effect/contract.yaml?ref=$(git rev-parse HEAD)\" --jq .content | base64 -d | grep -F \"decide_cloud_session_placement\" > /dev/null'"
        cwd: "${OMNI_HOME}/omnimarket"

  - id: "dod-omn21373-cloud-harness-boundary"
    description: "Cloud placement renders interactive startup through the public delegation effect boundary. The harness scan over the placement node's handler files admits no direct harness invocation (it exits 1 on the pre-move cloud_session.py), and the scan's own refusal tests pass. The full-repository scan runs in the Golden Chain suite."
    source: "manual"
    binds_ac: ["AC1", "AC2"]
    checks:
      - check_type: "test_passes"
        check_value: "env PYTHONDONTWRITEBYTECODE=1 uv run pytest tests/nodes/node_harness_invocation_check_effect/test_golden_chain_harness_invocation_check_effect.py -q --no-cov -k 'not test_repository_admits_no_harness_invocation_outside_the_baseline'"
      - check_type: "command"
        check_value: "env PYTHONDONTWRITEBYTECODE=1 uv run python -m omnimarket.nodes.node_harness_invocation_check_effect --repo-root . src/omnimarket/nodes/node_cloud_session_placement_effect/handlers/__init__.py src/omnimarket/nodes/node_cloud_session_placement_effect/handlers/cloud_accounts.py src/omnimarket/nodes/node_cloud_session_placement_effect/handlers/cloud_routing.py src/omnimarket/nodes/node_cloud_session_placement_effect/handlers/cloud_session.py src/omnimarket/nodes/node_cloud_session_placement_effect/handlers/handler_cloud_session_placement.py"
  - id: "dod-omn21373-deploy-cloud-start-runtime"
    description: "Hosted deploy smoke: dispatch cloud startup rendering through the packaged in-process ONEX runtime, require the delegation-owned renderer and its exact script output, and validate shell syntax. No cloud account, network, broker or database is required. This checks rendering only; no live cloud session is started."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: |
          set -eu;
          export PYTHONDONTWRITEBYTECODE=1;
          probe_dir="$(mktemp -d)";
          trap 'rm -rf "$probe_dir"' EXIT;
          printf '%s' '{"action":"render_start_script","path_export":"export PATH=/usr/bin:$PATH","registry_root":"/registry","owner":"org_a","repo":"repo_a","landing_branch":"main","run_id":"probe","prompt_path":"/staged/prompt"}' > "$probe_dir/input.json";
          env ONEX_LANE=cloud-start-deploy-probe uv run --locked onex node node_cloud_session_placement_effect --input "$probe_dir/input.json" --state-root "$probe_dir/state" --backend event_bus=inmemory --timeout 30 --output receipt --omnibase-path "$PWD" > "$probe_dir/receipt.json";
          uv run --locked python -c '
          import json
          import subprocess
          import sys
          from pathlib import Path
          from omnimarket.nodes.node_llm_delegation_call_effect import cloud_start_script
          receipt = json.loads(Path(sys.argv[1]).read_text())
          assert receipt["status"] == "success" and receipt["exit_code"] == 0, receipt
          assert cloud_start_script.__module__ == "omnimarket.nodes.node_llm_delegation_call_effect.handlers.handler_cloud_session_start"
          expected = cloud_start_script("export PATH=/usr/bin:$PATH", "/registry", "org_a", "repo_a", "main", "probe", "/staged/prompt")
          result = receipt["result"]
          assert result["error"] is None and result["text"] == expected, result
          subprocess.run(["bash", "-n"], input=result["text"], text=True, check=True)
          print(json.dumps({"run_id": receipt["run_id"], "status": receipt["status"], "renderer": cloud_start_script.__module__}))
          ' "$probe_dir/receipt.json";
