    description: "Hosted reader smoke: run the SCM command suite against a temporary watcher-state fixture, without a broker, credentials or live watcher. The pr-view, pr-status and pr-list cases require the producer's node_id; a state predating that field returns null. This fails against the base reader, which omits node_id. The epic's per-host unit readback remains pending."
