        check_value: "env PYTHONDONTWRITEBYTECODE=1 uv run python -m omnimarket.nodes.node_harness_invocation_check_effect --repo-root . src/omnimarket/nodes/node_cloud_session_placement_effect/handlers/__init__.py src/omnimarket/nodes/node_cloud_session_placement_effect/handlers/cloud_accounts.py src/omnimarket/nodes/node_cloud_session_placement_effect/handlers/cloud_routing.py src/omnimarket/nodes/node_cloud_session_placement_effect/handlers/cloud_session.py src/omnimarket/nodes/node_cloud_session_placement_effect/handlers/handler_cloud_session_placement.py"
  - id: "dod-omn21373-deploy-cloud-start-runtime"
    description: "Hosted deploy smoke: dispatch cloud startup rendering through the packaged in-process ONEX runtime, require the delegation-owned renderer and its exact script output, and validate shell syntax. No cloud account, network, broker or database is required. This checks rendering only; no live cloud session is started."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: |
          set -eu;
          export PYTHONDONTWRITEBYTECODE=1;
          probe_dir="$(mktemp -d)";
          trap 'rm -rf "$probe_dir"' EXIT;
          printf '%s' '{"action":"render_start_script","path_export":"export PATH=/usr/bin:$PATH","registry_root":"/registry","owner":"org_a","repo":"repo_a","landing_branch":"main","run_id":"probe","prompt_path":"/staged/prompt"}' > "$probe_dir/input.json";
          env ONEX_LANE=cloud-start-deploy-probe uv run --locked onex node node_cloud_session_placement_effect --input "$probe_dir/input.json" --state-root "$probe_dir/state" --backend event_bus=inmemory --timeout 30 --output receipt --omnibase-path "$PWD" > "$probe_dir/receipt.json";
          uv run --locked python -c '
          import json
          import subprocess
          import sys
          from pathlib import Path
          from omnimarket.nodes.node_llm_delegation_call_effect import cloud_start_script
          receipt = json.loads(Path(sys.argv[1]).read_text())
          assert receipt["status"] == "success" and receipt["exit_code"] == 0, receipt
          assert cloud_start_script.__module__ == "omnimarket.nodes.node_llm_delegation_call_effect.handlers.handler_cloud_session_start"
          expected = cloud_start_script("export PATH=/usr/bin:$PATH", "/registry", "org_a", "repo_a", "main", "probe", "/staged/prompt")
          result = receipt["result"]
          assert result["error"] is None and result["text"] == expected, result
          subprocess.run(["bash", "-n"], input=result["text"], text=True, check=True)
          print(json.dumps({"run_id": receipt["run_id"], "status": receipt["status"], "renderer": cloud_start_script.__module__}))
          ' "$probe_dir/receipt.json";
