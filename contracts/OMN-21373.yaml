    binds_ac: ["AC2"]
  - id: "dod-omn21373-deploy-g2-umbrella"
    description: "Hosted deploy smoke, runnable on the hosted runner with no lab route, broker or database: dispatch the packaged node_umbrella_ticket_compute through the in-process ONEX runtime with an explicit umbrella ticket set and require a successful typed receipt carrying the one PR refusal. The packaged-contract execution of all five G2 nodes is bound to AC2 by tests/test_g2_local_invocation.py."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: |
          set -eu;
          export PYTHONDONTWRITEBYTECODE=1;
          probe_dir="$(mktemp -d)";
          trap 'rm -rf "$probe_dir"' EXIT;
          runtime_bin="$(uv run --locked python -c 'import sys; from pathlib import Path; print(Path(sys.executable).parent)')";
          printf '%s' '{"tickets": ["OMN-1"], "text": "no evidence line", "opens_pr": true, "umbrella_tickets": ["OMN-1"], "surface": "pr"}' > "$probe_dir/input.json";
          env ONEX_LANE=omn21373-g2-deploy-probe "$runtime_bin/onex" node node_umbrella_ticket_compute --input "$probe_dir/input.json" --state-root "$probe_dir/state" --backend event_bus=inmemory --timeout 30 --output receipt --omnibase-path "$PWD" > "$probe_dir/receipt.json";
          uv run --locked python -c '
          import json
          import sys
          from pathlib import Path
          receipt = json.loads(Path(sys.argv[1]).read_text())
          assert receipt["status"] == "success" and receipt["exit_code"] == 0, receipt
          refusals = receipt["result"]["refusals"]
          assert len(refusals) == 1 and refusals[0].startswith("the title\x27s only ticket OMN-1 is an umbrella ticket: "), refusals
          print(json.dumps({"run_id": receipt["run_id"], "refusals": len(refusals)}))
          ' "$probe_dir/receipt.json";
  - id: "dod-omn21373-ac1-rsd-migration-orchestrator"
    description: "AC1 contribution only: RSD can move one private-repository script into an omnimarket node. node_rsd_migration_orchestrator reads the code_generation task class from the task_class_authority registry entry before any model turn, refuses with no model turn when the entry is missing, runs one delegated code edit loop confined to the new node and its tests, registers the node's entry point and checks the canonical shape. The AC1 read on the private data repository itself stays pending for the epic."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_rsd_migration_orchestrator/test_handler_rsd_migration_orchestrator.py -q"
    binds_ac: ["AC1"]
  - id: "dod-omn21373-ac2-rsd-migration-entry-point"
    description: "AC2 contribution only: node_rsd_migration_orchestrator is a registered onex.nodes entry point in canonical shape, so migrated callers can be produced by it. The per-host unit readback stays pending for the epic."
