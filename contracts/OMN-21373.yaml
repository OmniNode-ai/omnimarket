      - check_type: "command"
        check_value: "uv run python -m omnimarket.nodes.node_rsd_migration_orchestrator check-shape --worktree . --node node_rsd_migration_orchestrator --require-entry-point"
    binds_ac: ["AC2"]
  - id: "dod-omn21373-ac1-rsd-migrated-tlc-summary"
    description: "AC1 contribution only: one RSD migration run moved a private-repository TLC result summary script into node_tlc_result_summary_effect in canonical shape, with tests pinning its output. The script's removal from the private data repository and the AC1 read there stay pending for the epic."
