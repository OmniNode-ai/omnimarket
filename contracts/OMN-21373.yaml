---
schema_version: "1.0.0"
ticket_id: "OMN-21373"
title: "Move all code out of the private data repository to omnimarket and omniclaude, leaving it data only"
summary: >-
  Epic carrier for the internal-repos code migration. This repository's part,
  port groups G1 and G2 of section 18 of the migration plan, adds nodes in
  omnimarket's canonical shape (contract, metadata, handler, models, entry
  point) with their direct tests. G1 adds five pure compute nodes:
  node_host_memory_admission_compute, node_landing_worker_engine_compute,
  node_landing_tick_bounds_compute, node_landing_upstream_gate_compute and
  node_merge_sweep_same_head_compute. G2 adds node_pool_read_share_effect,
  node_brief_compact_compute, node_standup_retrospective_compute,
  node_lane_host_discovery_compute and node_umbrella_ticket_compute; the
  knowledge-base repository name, the variable that holds its clone path and
  the umbrella ticket set are read from the environment or the node overlay,
  and a node refuses with the setting named when neither supplies it.
  The plugin callers are not repointed here; that is the plugin release of the
  slice that moves each caller. The epic's two acceptance criteria are read on
  the private data repository and on the lab hosts and stay pending for the epic.
  Port group G3 adds five landing and install effect nodes the same way:
  node_landing_placement_wait_effect, node_landing_not_started_effect,
  node_landing_lease_claim_close_effect, node_install_superset_guard_effect and
  node_landing_tick_speed_effect; the ticket ids two of them write into ledger
  rows are read from deployment overlays, with a refusal naming the field when
  no overlay supplies one.
  The cloud-session routing and placement logic (the cloud lane accounts file,
  the consent rule, the per-account cap, slot holds, credit and rate readings,
  the routing refusal and the cloud session text) moves into omnimarket as
  node_cloud_session_placement_effect. Private values (hosts and their consent
  columns, the placement directory, excluded repositories) arrive on the request
  from the caller's overlay. This contract covers this pull request's share of
  the epic only; the epic's criteria as a whole are not met by it.
is_seam_ticket: false
interface_change: true
interfaces_touched:
  - "public_api"
