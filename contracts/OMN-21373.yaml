  - id: "dod-omn21373-deploy-g3-not-started"
    description: "Hosted deploy smoke for G3, runnable on the hosted runner with no lab route, broker or database: dispatch the packaged node_landing_not_started_effect through the in-process ONEX runtime with one refused and one started dispatch, and require a successful typed receipt with exactly one not-started row and its lease file written. It fails at the merge base, where the node does not exist."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: |
          set -eu;
          export PYTHONDONTWRITEBYTECODE=1;
          probe_dir="$(mktemp -d)";
          trap 'rm -rf "$probe_dir"' EXIT;
          mkdir -p "$probe_dir/landing";
          runtime_bin="$(uv run --locked python -c 'import sys; from pathlib import Path; print(Path(sys.executable).parent)')";
          printf '{"state_dir": "%s/landing", "outcomes": [{"kind": "dispatch_worker", "outcome": "head-moved", "lease_id": 7, "subject": "example/repo#1", "detail": "head moved", "head_sha": "abc"}, {"kind": "dispatch_worker", "outcome": "spawned", "lease_id": 8, "subject": "example/repo#2"}], "refused": ["head-moved", "claim-refused"], "now": "2026-10-24T00:00:00Z", "tick": 1}' "$probe_dir" > "$probe_dir/input.json";
          env ONEX_LANE=omn21373-g3-deploy-probe "$runtime_bin/onex" node node_landing_not_started_effect --input "$probe_dir/input.json" --state-root "$probe_dir/state" --backend event_bus=inmemory --timeout 30 --output receipt --omnibase-path "$PWD" > "$probe_dir/receipt.json";
          uv run --locked python -c '
          import json
          import sys
          from pathlib import Path
          receipt = json.loads(Path(sys.argv[1]).read_text())
          assert receipt["status"] == "success" and receipt["exit_code"] == 0, receipt
          rows = receipt["result"]["rows"]
          assert [(r["lease_id"], r["outcome"]) for r in rows] == [(7, "head-moved")], rows
          assert (Path(sys.argv[2]) / "landing/workers/000007/not-started.json").is_file()
          assert not (Path(sys.argv[2]) / "landing/workers/000008").exists()
          print(json.dumps({"run_id": receipt["run_id"], "rows": len(rows)}))
          ' "$probe_dir/receipt.json" "$probe_dir";
