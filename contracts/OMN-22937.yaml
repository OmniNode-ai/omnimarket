schema_version: 1.0.0
ticket_id: OMN-22937
title: "The gate store protocol and its serializable store pass one contract suite on the in-memory twin and on the Postgres store: nine racing reservations stay within the limit"
summary: The gate store gains its serializable Postgres backend (PostgresGateStore, one SERIALIZABLE transaction per request, with the kill hook at the same three stages as the twin) and a migration for its tables. The frozen contract suite from the twin's change runs unchanged on the twin and on the Postgres store from tests/contract, with a safety-write-first leg that a store which counts first fails, and a hash test that fails a changed suite. build_store builds the Postgres backend on a DSN the caller supplies. The running wiring on the bus and the overlay values are not part of this change.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn22937-gate-store-backends
  statement: The same frozen contract suite passes on the in-memory twin and on the Postgres store, and a changed suite or a store that counts before its safety write fails.
  acceptance:
  - id: AC1
    statement: "AC1: the contract suite (nine racing reservations in one transaction, a handover, a kill at each step, a duplicate delivery, keys repeated by a replay) passes on the in-memory twin and on the Postgres store -- falsifier: uv run pytest tests/contract/test_gate_store_contract.py -q"
  - id: AC2
    statement: "AC2: a safety write commits before it counts, and a store that counts first fails the suite -- falsifier: uv run pytest tests/contract/test_gate_store_contract.py -q -k safety_write_first"
  - id: AC3
    statement: "AC3: the suite file's hash is frozen before the first implementation commit and a changed suite fails the check -- falsifier: uv run pytest tests/contract/test_gate_store_suite_hash.py -q"
evidence_requirements:
- kind: tests
  description: The acceptance tests of this ticket at the pushed head, with a native PostgreSQL 16 server on the path.
  command: uv run --frozen pytest tests/contract -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
- id: dod-omn22937-contract-suite
  description: The eight checks of the frozen suite pass on the in-memory twin and on the Postgres store. Before this change tests/contract does not exist on the dev source.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/contract/test_gate_store_contract.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn22937-safety-write-first
  description: The safety-write check passes on both backends and fails a Postgres store that drops the recorded stop before it counts.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/contract/test_gate_store_contract.py -q --no-cov -n 0 -p no:randomly -k safety_write_first
    cwd: .
- id: dod-omn22937-suite-hash
  description: The suite file matches its recorded sha256 and the same bytes with one line appended do not.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/contract/test_gate_store_suite_hash.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn22937-integration-proof
  description: The pushed head ran the contract tests on a lab host through the lab work runner and exited 0. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: 'uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-22937 -- uv run --frozen pytest tests/contract -q --no-cov -n 0 -p no:randomly'
    cwd: .
- id: dod-omn22937-deploy-source-read
  description: The pushed branch carries the Postgres gate store module. Read live from GitHub at the branch head, so it fails if the module is missing from the pushed source.
  source: manual
  checks:
  - check_type: command
    check_value: gh api "repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_gate_store_effect/handlers/store_postgres.py?ref=omn-22937-postgres-gate-store" --jq .name | grep -q '^store_postgres.py$'
    cwd: .
