schema_version: 1.0.0
ticket_id: OMN-25348
title: Overlay Main Load is green on the pull requests it is red on, fixed at its source
summary: The overlays repository's main branch carries a ledger_projection block in the node_factory_floor_effect document, and this tree's ModelFactoryFloorOverlay (extra forbid) had no such field, so Overlay Main Load refused that one document on every pull request (loaded=311 refused=1) and on dev itself. The model gains the optional block, with the same definition the factory floor projection change carries, so the document loads (loaded=312 refused=0). The check, its workflow job and its tests are unchanged.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn25348-overlay-main-load
  statement: Every document on overlays main loads through this tree's own node models.
  acceptance:
  - id: AC1
    statement: 'AC1: the shared cause of the red Overlay Main Load (OMN-23963) on PRs 6366, 6367 and 6368 is named with the failure text of each of the three quoted -- falsifier: the failure text of the check run on each of the three PRs read through onex scm shows a different cause than the one named'
  - id: AC2
    statement: 'AC2: one PR on the owning repo default branch fixes the cause at its source, with a test that fails on the code before the fix and passes after it -- falsifier: uv run pytest on the new test path exits 0 at the merge base'
  - id: AC3
    statement: 'AC3: Overlay Main Load (OMN-23963) reads green at the head of a PR that was red on it, with the check itself unchanged -- falsifier: onex scm check-run read of that head shows the check not success, or a diff of the check definition against the merge base is not empty'
evidence_requirements:
- kind: tests
  description: The floor overlay model test and the overlay main load check's own tests pass at the pushed head.
  command: uv run --frozen pytest tests/nodes/node_factory_floor_effect/test_overlay_ledger_projection_block.py tests/unit/nodes/node_overlay_main_load_check_effect tests/nodes/node_overlay_main_load_check_effect -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn25348-ac1
  description: The document the three failure texts name (ledger_projection under node_factory_floor_effect) loads through the floor model; the same block refused at the merge base is the test's failing control.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_factory_floor_effect/test_overlay_ledger_projection_block.py -q --no-cov -n 0 -p no:randomly -k main_block
    cwd: .
- id: dod-omn25348-ac2
  description: The new test fails at the merge base with extra_forbidden on ledger_projection and passes on the fix.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_factory_floor_effect/test_overlay_ledger_projection_block.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn25348-ac3
  description: The overlay main load check's own planted-break tests still pass with the check unchanged; the hosted Overlay Main Load job reads the overlays repository, which no test here can.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/nodes/node_overlay_main_load_check_effect tests/nodes/node_overlay_main_load_check_effect -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn25348-integration-proof
  description: Run the floor overlay model test and the overlay main load check's tests on a lab host at the pushed head. Hosted CI cannot reach the lab hosts, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-25348 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_factory_floor_effect/test_overlay_ledger_projection_block.py tests/unit/nodes/node_overlay_main_load_check_effect tests/nodes/node_overlay_main_load_check_effect -q --no-cov -n 0 -p no:randomly
    cwd: .
