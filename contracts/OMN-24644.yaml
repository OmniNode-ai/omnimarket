schema_version: 1.0.0
ticket_id: OMN-24644
title: 'Fix omnimarket#6306 sequence allocation and Fable findings (work-ledger projection)'
summary: A projection-assigned ledger_seq is provisional and gives way to the judge's number, so the judge's next accepted row still projects into work_ledger_rows and none lands in work_ledger_seq_conflicts. The allocation follows the history backfill's rule (a sequence a judge row holds is never moved; the rows with none take what is left) and the projection handlers' practice of keeping their own order apart from a producer-owned number.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24644-provisional-sequence
  statement: The work-ledger projection never takes a sequence the judge will state, drops no row, and counts what it sequenced only once the write committed.
  acceptance:
  - id: AC1
    statement: 'AC1: a live row without ledger_seq is sequenced so that the next judge-accepted row still projects into work_ledger_rows and none lands in work_ledger_seq_conflicts, with the allocation matching the exemplar projection handler -- falsifier: uv run pytest tests/unit/nodes/node_projection_work_ledger -k "tip_plus_one or next_judged" -q in omnimarket fails on head 4408c8ea2e6a and passes on the new head'
  - id: AC2
    statement: 'AC2: each of the 8 findings in the Fable comment is fixed in the branch or argued in a reply comment with evidence -- falsifier: a comment on the pull request lists each finding number with fixed or argued, checked by reading the comment against the Fable comment'
  - id: AC3
    statement: 'AC3: the focused projection suite stays green on the new head -- falsifier: uv run pytest tests/unit/nodes/node_projection_work_ledger -q in omnimarket'
evidence_requirements:
- kind: tests
  description: The node's focused unit tests.
  command: uv run pytest tests/unit/nodes/node_projection_work_ledger -q -n 0 --no-cov -p no:cacheprovider
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24644-next-judged
  description: 'AC1: the judge''s next row projects and none lands in the conflicts table; the same tests fail on head 4408c8ea2e6a.'
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/nodes/node_projection_work_ledger -k "tip_plus_one or next_judged" -q -n 0 --no-cov -p no:cacheprovider
    cwd: ${OMNI_HOME}/omnimarket
- id: dod-omn24644-findings-comment
  description: 'AC2: the pull request comment that lists each finding number with fixed or argued is read against the Fable comment; the hosted runner cannot read a comment, so only the local Done gate runs it. The check reads the conversation comments through the bus (the watcher answer carries none) and exits non-zero unless a comment names the current head and answers each of the second review''s findings 1-6 by number as fixed or argued.'
  source: manual
  binds_ac:
  - AC2
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: "onex scm pr-view OmniNode-ai/omnimarket#6306 --watcher-state /nonexistent/state.json | python3 -c \"import json,re,sys; line=[l for l in sys.stdin.read().splitlines() if l.startswith('{')][-1]; r=json.loads(line)['result']; head=r['head_sha'][:12]; cs=[c['body'] for c in r['comments'] if head in c['body']]; missing=[n for n in range(1,7) if not any(re.search(r'(?m)^\\s*'+str(n)+r'\\.\\s.*\\b(fixed|argued)\\b', b, re.I) for b in cs)]; sys.exit('no comment names head %s and answers findings %s by number as fixed or argued' % (head, missing) if missing else 0)\""
    cwd: .
- id: dod-omn24644-suite
  description: 'AC3: the whole node suite passes on the new head.'
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/nodes/node_projection_work_ledger -q -n 0 --no-cov -p no:cacheprovider
    cwd: ${OMNI_HOME}/omnimarket
- id: dod-omn24644-integration-proof
  description: 'Run the focused node tests on a lab host at the pushed head. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check. It binds no acceptance criterion.'
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24644 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/nodes/node_projection_work_ledger -q -n 0 --no-cov
    cwd: .
