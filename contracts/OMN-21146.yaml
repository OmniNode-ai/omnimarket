schema_version: "1.0.0"
ticket_id: "OMN-21146"
title: "dod_verify reads PR facts and check-runs through the GitHub gateway node"
summary: "node_github_repo_gateway_effect gains two read operations, commit_check_runs (a commit's latest check runs, optionally by name) and merged_pr (one PR's state, head and merge facts), each served by an onex scm verb. node_dod_verify reads a merged PR's facts and a commit's repo-evidence check runs through a gateway read client instead of the gh CLI: in process when the gateway's contract-declared token resolves, otherwise over the bus to the deployed gateway."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-gateway-answers-both-reads"
    statement: "The GitHub gateway node answers a check-runs-at-commit request and a merged-PR-by-number request with typed results."
    acceptance:
      - id: "AC1"
        statement: "AC1: node_github_repo_gateway_effect answers a check-runs-at-commit request and a merged-PR-by-number request over the bus -- falsifier: the gateway's handler tests for both operations fail, or a lab request for omnimarket#3726's merge commit check-runs returns no rows"
  - id: "req-dod-verify-no-gh"
    statement: "node_dod_verify reads PR facts and check runs the local source does not hold from the gateway node, never the gh CLI."
    acceptance:
      - id: "AC2"
        statement: "AC2: node_dod_verify issues no gh subprocess for PR facts or check-runs -- falsifier: a test that installs a gh stub which fails on any call sees it called during a verify of a ticket whose PRs are outside the watcher window"
      - id: "AC3"
        statement: "AC3: on a lab host with the gh shim, dod_verify for OMN-19401 (PRs merged 2026-10-08 and 2026-10-10) reaches a verdict other than REPO_CONTRACT_UNRESOLVED -- falsifier: the lab run's receipt reads REPO_CONTRACT_UNRESOLVED or error_github_api"
  - id: "req-repo-evidence-caller-merged-fix-repin"
    statement: "omnimarket's Repo Evidence Gate caller pins the omnibase_core receipt-gate reusable whose Binds-Merged-Fix control does not revert contract files as product paths, so a pull request that binds an already-merged fix whose contract the base has since amended gets a verdict instead of a control that cannot run."
    acceptance:
      - id: "AC4"
        statement: "AC4: .github/workflows/call-repo-evidence-gate.yml pins receipt-gate.yml at 4d16322dae9d62f96089b93421a768fb8dd8c8fe (omnibase_core#1986) and keeps its job id and inputs -- falsifier: uv run pytest tests/ci/test_repo_evidence_caller_merged_fix_repin_omn21146.py -q fails at the merge base, where the caller pins 4e4f5e0404d364e296c5d37db6aa3ab9e07f8ffa"
evidence_requirements:
  - kind: "tests"
    description: "AC1: the gateway's read tests for commit_check_runs and merged_pr, and the onex scm verbs that publish them."
    command: "uv run pytest tests/nodes/node_github_repo_gateway_effect tests/unit/handlers/scm/test_onex_scm_command.py tests/unit/handlers/scm/test_handler_gateway_read_client.py -q -p no:randomly --no-cov"
  - kind: "tests"
    description: "AC2 and AC3: a verify of a ticket whose PRs merged outside the watcher window, with a gh on PATH that fails on any call."
    command: "uv run pytest tests/unit/nodes/node_dod_verify/test_omn_21146_dod_verify_reads_through_gateway.py tests/unit/nodes/node_dod_verify/test_dod_verify_repo_first_lookup.py -q -p no:randomly --no-cov"
  - kind: "tests"
    description: "AC4: the caller's reusable pin and inputs."
    command: "uv run pytest tests/ci/test_repo_evidence_caller_merged_fix_repin_omn21146.py -q -p no:randomly --no-cov"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn21146-ac1-gateway-operations"
    description: "AC1: the gateway reads a commit's check runs (paged, filtered by name) and one PR's merge facts, and the commit-check-runs and pr-merged verbs publish them on the gateway's command topic and return the terminal result."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_github_repo_gateway_effect/test_github_repo_gateway_protocols.py tests/nodes/node_github_repo_gateway_effect/test_github_repo_gateway_scm_reads.py tests/unit/handlers/scm/test_onex_scm_command.py tests/unit/handlers/scm/test_handler_gateway_read_client.py -q -p no:randomly --no-cov"
    binds_ac: ["AC1"]
  - id: "dod-omn21146-ac2-no-gh"
    description: "AC2: with a gh stub on PATH that fails on any call, a verify of a ticket whose PRs merged outside the watcher window never calls it and reads the PRs and check runs from the gateway."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/nodes/node_dod_verify/test_omn_21146_dod_verify_reads_through_gateway.py tests/unit/nodes/node_dod_verify/test_dod_verify_repo_first_lookup.py -q -p no:randomly --no-cov"
    binds_ac: ["AC2"]
  - id: "dod-omn21146-ac3-verdict-not-unresolved"
    description: "AC3 hosted probe: the same verify of PRs outside the watcher window reaches a verdict that is not REPO_CONTRACT_UNRESOLVED and names no error_github_api. The live half of AC3 is a lab dod_verify run for OMN-19401 once the gateway with merged_pr and commit_check_runs is deployed."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/nodes/node_dod_verify/test_omn_21146_dod_verify_reads_through_gateway.py -q -p no:randomly --no-cov -k outside_the_watcher_window"
    binds_ac: ["AC3"]
  - id: "dod-omn21146-ac1-gateway-deploy-probe"
    description: "AC1 hosted deploy probe: GitHub serves the shared gateway models at the checked-out commit with both commit_check_runs and merged_pr operations. This checks the published source artifact; the live gateway rollout remains a separate AC3 readback."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: >-
          gh api "repos/OmniNode-ai/omnimarket/contents/src/omnimarket/models/model_github_gateway_io.py?ref=$(git rev-parse HEAD)" --jq .content | base64 -d | python -c 'import sys; s = sys.stdin.read(); assert "COMMIT_CHECK_RUNS = \"commit_check_runs\"" in s; assert "MERGED_PR = \"merged_pr\"" in s'
  - id: "dod-omn21146-ac2-shared-models-deploy-probe"
    description: "AC2 hosted deploy probe: the DoD evidence handler GitHub serves at the checked-out commit imports the shared gateway models."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: >-
          gh api "repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_dod_verify/handlers/handler_dod_evidence_github_effect.py?ref=$(git rev-parse HEAD)" --jq .content | base64 -d | grep -F 'from omnimarket.models.model_github_gateway_io import (' > /dev/null
  - id: "dod-omn21146-ac4-caller-repin"
    description: "AC4: the Repo Evidence Gate caller pins the omnibase_core receipt-gate at omnibase_core#1986 and no longer at the omnibase_core#1932 pin whose merged-fix control reverts contract files."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_repo_evidence_caller_merged_fix_repin_omn21146.py -q -p no:randomly --no-cov"
    binds_ac: ["AC4"]
