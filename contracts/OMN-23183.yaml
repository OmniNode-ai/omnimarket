dod_evidence:
- id: dod-omn23183-ac1-inputs
  description: Runs the inputs schema tests. The inputs file parses into the typed model, rejects an unknown key and an incoherent model set, builds a valid faults file naming model A only, and the contract's lane and cadence are the ones the green-days reader names.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_delegation_scenario_r5_effect/test_r5_inputs.py -q --no-cov
    cwd: .
- id: dod-omn23183-ac2-chains
  description: Runs the golden and error chain tests. The green chain lists A then B, names the pinned model on each receipt and walks A rate_limited then B accepted; an add that takes an unlisted id, a run that ignores a reorder, a listing in the wrong order, a faults file that is not applied, a fault status typed as unavailable, a pinned receipt that names another model, a wrong answer, an empty probe key in the real backend, unreadable inputs, a failing ledger append and a failing bus emit each turn the run red for their own reason. The unmodified run is red for the two pinned legs only until the ingress accepts model.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_delegation_scenario_r5_effect/test_golden_chain_scenario_r5_effect.py -q --no-cov
    cwd: .
- id: dod-omn23183-integration-proof
