schema_version: 1.0.0
ticket_id: OMN-20380
title: node_linear_triage flips Linear Done on a merged PR or a child roll-up with no bound dod_verify receipt, outside the OMN-20368 done-flip guard
summary: The triage node already refuses a Done write that carries no PASS dod_verify receipt bound through binds_ac (the OMN-20368 gate in _mark_done). This change pins that bar with tests that run the real gate for a merged PR with no binds_ac, a stale receipt, a skipped receipt and a NO_ACCEPTANCE_CHECKS receipt. It is test-only and covers AC1 and AC2; AC3 (the closeout briefs) stays on the ticket.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn20380-bound-receipt-bar
  statement: node_linear_triage leaves a ticket open unless a PASS dod_verify receipt taken against the current contract entry binds every acceptance criterion through binds_ac.
  acceptance:
  - id: AC1
    statement: 'AC1: node_linear_triage refuses a Done write for a leaf ticket whose OCC contract on origin/dev does not bind every labelled acceptance criterion through `binds_ac` to a PASS receipt taken against the current contract entry, even when every cited PR is merged -- falsifier: uv run pytest tests/ -k "linear_triage and bound_receipt" in omnimarket shows a merged-PR, no-binds_ac ticket left open with the reason no_bound_dod_receipt'
  - id: AC2
    statement: 'AC2: a stale receipt (contract entry hash changed) and a skipped or NO_ACCEPTANCE_CHECKS receipt do not discharge the bar in node_linear_triage -- falsifier: uv run pytest tests/ -k "linear_triage and stale" in omnimarket'
evidence_requirements:
- kind: tests
  description: The triage node leaves a merged-PR ticket open for each receipt that does not discharge the bar.
  command: uv run pytest tests/nodes/node_linear_triage/test_omn_20380_bound_receipt_bar.py -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn20380-ac1
  description: AC1 a merged PR on a ticket whose contract binds no criterion, or only some, is left open with the held-no-bound-receipt action and no Linear write; a current bound PASS receipt closes it.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_linear_triage/test_omn_20380_bound_receipt_bar.py -q --no-cov --tb=line -k BoundReceiptBar
    cwd: .
- id: dod-omn20380-ac2
  description: AC2 a receipt whose pin names another revision of the criterion, a check the verifier demoted to skipped for criteria drift, an all-skipped receipt and a NO_ACCEPTANCE_CHECKS receipt each leave the ticket open.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_linear_triage/test_omn_20380_bound_receipt_bar.py -q --no-cov --tb=line -k "Stale or Skipped"
    cwd: .
- id: dod-omn20380-deploy-probe
  description: 'Deploy probe: the test file GitHub serves at the checked-out commit holds the bound-receipt tests, which the merge base does not.'
  source: manual
  checks:
  - check_type: command
    check_value: |-
      bash -o pipefail -c 'gh api "repos/OmniNode-ai/omnimarket/contents/tests/nodes/node_linear_triage/test_omn_20380_bound_receipt_bar.py?ref=$(git rev-parse HEAD)" --jq .content | base64 -d | grep -F "TestLinearTriageBoundReceiptBar" > /dev/null'
    cwd: .
- id: dod-omn20380-integration-proof
  description: The pushed head ran the bound-receipt tests on a lab host through the bus and exited 0. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: |-
      uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane triage-donegate-0840 -- uv run --frozen pytest tests/nodes/node_linear_triage/test_omn_20380_bound_receipt_bar.py -q --no-cov
    cwd: .
