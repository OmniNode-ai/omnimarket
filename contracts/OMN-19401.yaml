schema_version: "1.0.0"
ticket_id: "OMN-19401"
title: "Causal prose passes the reasoning quality gate and causal markers cannot authorize a pass alone"
summary: "Binds the existing causal prose and causal marker regression tests to AC1, AC2 and AC3. The Binds-Merged-Fix commit trailer identifies the merged implementation for the gate's reverted-fix control. Tests: tests/unit/delegation/test_step_by_step_causal_prose_omn19401.py."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-causal-prose-passes-the-gate"
    statement: |-
      A step-by-step explanation written as causal prose must pass the reasoning quality gate through the base class DoD checks, and causal markers alone must never authorize a pass. The criteria below are the ticket's three live criteria, transcribed from the ticket body; AC1's falsifier names the test directory relative to this repository's root, where the contract's checks run.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: The `step_by_step_explanation` heuristic accepts causal-connective structure (e.g. "because","therefore","consequently","since","as a result","this means") in addition to the current literal markers, so a multi-clause causal explanation is not vetoed for lacking the word "step" -- falsifier: `uv run pytest tests/unit/nodes/node_delegation_quality_gate_reducer/test_step_by_step_explanation_causal_markers_omn19401.py -k step_by_step -q`
      - id: "AC2"
        statement: |-
          AC2: A regression test reproduces the hash-map prompt/response pair from correlation_id 174ea493-c4b8-4174-aac4-b158d439b424 and asserts it now passes the heuristic -- falsifier: `uv run pytest tests/unit/delegation/test_step_by_step_causal_prose_omn19401.py -k hash_map -q`
      - id: "AC3"
        statement: |-
          AC3: Re-running the exact reproduction prompt through `onex delegate --task-type reasoning --bus kafka --lane dev` post-fix scores quality_gate_passed=true on the first local attempt -- falsifier: manual re-run of the Probe line above still shows a step_by_step_explanation veto
evidence_requirements:
  - kind: "tests"
    description: "The causal prose regression tests pass at the head and fail with the merged causal-connective implementation reverted."
    command: "env -u PYTHONPATH uv run pytest tests/unit/delegation/test_step_by_step_causal_prose_omn19401.py -q"
  - kind: "tests"
    description: "The step_by_step_explanation causal marker tests pass at the head and fail with the merged causal-connective implementation reverted."
    command: "env -u PYTHONPATH uv run pytest tests/unit/nodes/node_delegation_quality_gate_reducer/test_step_by_step_explanation_causal_markers_omn19401.py -q"
  - kind: "tests"
    description: "AC1: the ticket's step_by_step selection over the quality gate reducer tests passes, run from this repository's root."
    command: "uv run pytest tests/unit/nodes/node_delegation_quality_gate_reducer/test_step_by_step_explanation_causal_markers_omn19401.py -k step_by_step -q"
  - kind: "tests"
    description: "AC2 and AC3: the hash-map prompt/response pair passes the heuristic and the reasoning quality gate."
    command: "uv run pytest tests/unit/delegation/test_step_by_step_causal_prose_omn19401.py -k hash_map -q"
  - kind: "tests"
    description: "The test task-type gate follows the target repo's marker and coverage conventions: correct drafts for a repo that does not mark tests unit are accepted, wrong drafts still refused."
    command: "env -u PYTHONPATH uv run pytest tests/unit/delegation/test_test_gate_follows_repo_conventions_omn19401.py -q"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-causal-prose-gate-ac1"
    description: "The causal prose tests prove the hash map answer passes the reasoning quality gate and that causal markers alone cannot authorize a pass."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/delegation/test_step_by_step_causal_prose_omn19401.py -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC1"]
  - id: "dod-step-by-step-causal-markers-ac1"
    description: "The causal marker tests prove each causal connective alone satisfies the step_by_step_explanation check and a sentence with none of the markers is rejected."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/nodes/node_delegation_quality_gate_reducer/test_step_by_step_explanation_causal_markers_omn19401.py -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC1"]
  - id: "dod-omn19401-ac1-step-by-step-selection"
    description: "AC1 at the ticket's falsifier, with its path relative to this repository's root: every step_by_step test in the quality gate reducer causal markers test file passes, including the causal connective cases."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/nodes/node_delegation_quality_gate_reducer/test_step_by_step_explanation_causal_markers_omn19401.py -k step_by_step -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC1"]
  - id: "dod-omn19401-ac2-ac3-hash-map-pair"
    description: "AC2 at the ticket's falsifier: the hash-map prompt/response pair from the reproduction passes the step_by_step_explanation heuristic and the reasoning quality gate with the base class DoD checks. AC3 hosted probe: the same recorded answer of the local model passes the gate the delegation grades it with; the live half of AC3 is a lab re-run of the reproduction prompt through onex delegate."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/delegation/test_step_by_step_causal_prose_omn19401.py -k hash_map -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC2", "AC3"]
  - id: "dod-test-gate-follows-repo-conventions"
    description: "The unit-marker, edge-case and error-path rules of the test task-type gate follow the convention the prompt states; a replay of drafts for a marked and an unmarked repo is accepted when correct and refused when wrong."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/delegation/test_test_gate_follows_repo_conventions_omn19401.py -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC1"]
  - id: "dod-omn19401-test-gate-deploy-probe"
    description: "Hosted deploy probe: read the quality gate handler from GitHub at the evaluated commit and require the prompt-convention marker rule (_unit_marker_required) that this change adds. On the merge base the function is absent and the probe fails."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: >-
          bash -c 'curl --silent --show-error --fail --location --max-time 30 "https://raw.githubusercontent.com/OmniNode-ai/omnimarket/$(git rev-parse HEAD)/src/omnimarket/nodes/node_delegation_quality_gate_reducer/handlers/handler_quality_gate.py" | grep -c "def _unit_marker_required"'
        cwd: "${OMNI_HOME}/omnimarket"
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/delegation/test_test_gate_follows_repo_conventions_omn19401.py -q -k unmarked"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC1"]
