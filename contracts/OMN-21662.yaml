---
schema_version: "1.0.0"
ticket_id: "OMN-21662"
title: "A lab host whose login is declared as a machine keeps sending hook events, so the quiet-host alarm stops reporting hosts that ran lanes"
summary: "The developer lane admission read every row of the dev lane's principal overlay as a declared collaborator, including the rows with role machine that declare a lab host's own login. On the barred dev lane that login was refused as a collaborator, and the hook drops every hook event on a refusal, so the host ran lanes and sent none and the quiet-host alarm raised for it. A machine row is now read for well-formedness and is never a collaborator."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-omn21662-machine-row"
    statement: |-
      A principal declared with role machine is the operator's own flow on every lane, including a lane collaborators never use. A person listed beside it is still refused there.
    acceptance:
      - id: "AC1"
        statement: "AC1: the reason the merged fixes did not hold is measured from recorded quiet-host rows and host hook logs and stated in the PR body -- falsifier: the PR body names the measured per-host cause, checked by reading the PR"
      - id: "AC2"
        statement: "AC2: a regression test built from the recorded rows (fixture path) fails on the current quiet-host detection or capture path and passes on the fix -- falsifier: uv run pytest tests -k quiet_host"
      - id: "AC3"
        statement: "AC3: after the fix, a host that ran a lane and emitted hook events raises no quiet-host row in a lab run -- falsifier: uv run pytest tests -k quiet_host_no_false_alarm"
evidence_requirements:
  - kind: "tests"
    description: "The machine-row cases fail on the unfixed admission and pass on the fix; the collaborator cases are unchanged."
    command: "uv run pytest tests/nodes/node_developer_lane_admission_compute/test_developer_lane_admission.py -q --no-cov"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn21662-pr-body-cause"
    description: "The PR body names the measured per-host cause."
    source: "manual"
    binds_ac: ["AC1"]
    checks:
      - check_type: "command"
        check_value: "gh pr view 4659 --repo OmniNode-ai/omnimarket --json body --jq .body | grep -Eq 'Cause in the hook: developer_event_suppressed'"
        cwd: "."
      - check_type: "command"
        check_value: "grep -q 'ROLE_MACHINE' src/omnimarket/nodes/node_developer_lane_admission_compute/handlers/handler_developer_lane_admission.py"
        cwd: "."
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_developer_lane_admission_compute/test_developer_lane_admission.py -k quiet_host -q --no-cov"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn21662-quiet-host"
    description: "The quiet-host regression cases pass on the fix."
    source: "manual"
    binds_ac: ["AC2"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_developer_lane_admission_compute/test_developer_lane_admission.py -k quiet_host -q --no-cov"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn21662-no-false-alarm"
    description: "A machine row is never held back as a collaborator."
    source: "manual"
    binds_ac: ["AC3"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_developer_lane_admission_compute/test_developer_lane_admission.py -k quiet_host_no_false_alarm -q --no-cov"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn21662-deploy-published-handler-readback"
    description: |-
      Hosted-runner source-artifact readback: fetch the changed handler at the evaluated
      published commit and run the admission over a machine row on a barred lane. A missing
      source or a collaborator verdict fails the command. No lab service, credentials or
      broker is required; this checks the published source artifact and does not assert a
      live runtime rollout.
    source: "manual"
    checks:
      - check_type: "command"
        check_value: |-
          curl --fail --silent --show-error --location --max-time 15 "https://raw.githubusercontent.com/OmniNode-ai/omnimarket/$(git rev-parse HEAD)/src/omnimarket/nodes/node_developer_lane_admission_compute/handlers/handler_developer_lane_admission.py" | uv run --frozen python -c '
          import sys
          ns = {}
          exec(compile(sys.stdin.read(), "published_admission", "exec"), ns)
          rows = [{"principal": "host-login", "role": "machine"}, {"principal": "person-login"}]
          declaration = {"schema_version": "developer_principal.v1", "principals": rows}
          lanes = {"home": {"credential_source": "onex_lane_store", "declaration": declaration}}
          store = {"lanes": {"home": {"sasl_username": "host-login"}}}
          decision = ns["admit"]({"declared_lane": "home", "barred_lanes": ["home"], "lane_store": store, "lanes": lanes})
          assert decision["refusal"] is None and decision["verdict"] == "operator", decision
          store["lanes"]["home"]["sasl_username"] = "person-login"
          person = ns["admit"]({"declared_lane": "home", "barred_lanes": ["home"], "lane_store": store, "lanes": lanes})
          assert person["refusal"] == "collaborator-on-barred-lane", person
          print("Published admission readback: 2 assertions PASS")
          '
        cwd: "."
