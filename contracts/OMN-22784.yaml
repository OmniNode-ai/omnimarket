title: The code graph node has a drill fault that drops the pyproject entry points, so the piece 1 reading can be shown failing on the live sample
summary: The code graph node gains the drill fault drop-entry-points. On the live sample the existing drop-contract-links fault cannot fail the reading (28 of 30 against a bar of 27), while dropping the pyproject entry points as roots reads 23 of 30.
