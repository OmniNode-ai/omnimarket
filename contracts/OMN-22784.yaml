requirements:
- id: req-omn22784-entry-points-fault
  statement: The code graph node runs a drill with the fault drop-entry-points and that run reads NOT_WORKING while the clean run on the same repositories reads WORKING.
  acceptance:
  - id: AC1
    statement: "AC1: the drop-entry-points run reads NOT_WORKING below the sample bar and the clean run reads WORKING on the node's fixtures -- falsifier: uv run --frozen pytest tests/nodes/node_code_graph_effect/test_code_graph.py -q --no-cov -n 0 -p no:randomly -k entry_points"
  - id: AC2
    statement: "AC2: on h053 over the seven live repositories the run with drop-entry-points reads below the bar of 27 of 30 and the clean run reads at or above it -- falsifier: uv run pytest on h053 at the pushed head running the node with and without the fault, the two sample counts compared to the bar of 27"
  - id: AC3
    statement: "AC3: the node's whole test directory passes -- falsifier: uv run --frozen pytest tests/nodes/node_code_graph_effect -q --no-cov -n 0 -p no:randomly"
evidence_requirements:
