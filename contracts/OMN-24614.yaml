schema_version: 1.0.0
ticket_id: OMN-24614
title: Every route to merge refuses a new change until its head has a clean review verdict
summary: Pull requests that the repository arms for auto-merge on open (omnibase_infra 5992 and 5991, omnimarket 6246 on 2026-11-15) merge with no review, because that path never passes through the landing
  controller that OMN-24477 taught to hold a new-work head until a clean review verdict is recorded for it. This adds the second half, a check on the pull request's own head. A pure compute node decides
  the check for each open pull request head (success only on a CLEAN verdict recorded for that exact head, or for a declared bypass class; failure naming review_missing, review_changes_needed or review_superseded
  otherwise), reusing the same head reading the landing decision uses. An effect node posts it as a fable-review-gate commit status through the GitHub write node and reads it back through the gateway's commit_statuses read; an orchestrator node sweeps the open pull requests,
  the ledger's verdict rows and the effect, and posts nothing when either source cannot be read. The branch protection audit names a repository whose landing branch does not require the check.
is_seam_ticket: true
interface_change: true
interfaces_touched: []
requirements:
- id: req-omn24614-review-verdict-check
  statement: A pull request head carries a posted check that is red unless a CLEAN verdict is recorded for that exact head or the pull request belongs to a declared bypass class, and the branch protection
    audit names every repository whose landing branch does not require the check.
  acceptance:
  - id: AC1
    statement: 'AC1: the review check decision refuses a pull request with no clean verdict for its exact head, refuses one whose only verdict is for an older head, passes one with a clean verdict for the
      head, and passes a declared bypass class with its name in the reason -- falsifier: pytest tests/unit/nodes/node_review_gate_context_compute -q'
  - id: AC2
    statement: 'AC2: the check state posted for a head matches what the verdict record in the ledger says, and a new push to the pull request makes it red again -- falsifier: pytest tests/unit/nodes/node_review_gate_context_effect
      -q'
  - id: AC3
    statement: 'AC3: the check name and result shape agree between the node that decides it, the GitHub write node that posts it and the required-context list of each repository changed, on the in-memory
      bus and on the real broker -- falsifier: pytest tests/unit/nodes/node_review_gate_context_compute/test_review_gate_context_seam.py -q'
  - id: AC4
    statement: 'AC4: integrated: on one real pull request in each repository changed, the review check reads red with no verdict, read from the running runtime''s posted check -- falsifier: the running
      runtime''s posted check run for the head reads success when the ledger holds no verdict row for that head'
evidence_requirements:
- kind: tests
  description: The decision, effect, orchestrator and audit tests, the ledger-to-check seam test and the landing decision's own review gate tests, which prove the shared head reading did not change.
  command: env -u PYTHONPATH uv run --frozen pytest tests/unit/nodes/node_review_gate_context_compute tests/unit/nodes/node_review_gate_context_effect tests/unit/nodes/node_review_gate_context_orchestrator
    tests/nodes/node_branch_protection_audit_effect tests/unit/nodes/node_pr_landing_decision_compute/test_landing_review_gate.py tests/unit/nodes/node_pr_landing_decision_compute/test_landing_review_gate_seam.py
    -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24614-ac1-decision
  description: The decision tests, golden and error cases, three injected breaks, and the proof that the landing decision and this check share one head reading.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/nodes/node_review_gate_context_compute -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24614-ac2-effect
  description: The effect tests, the post, the unchanged repeat, the new head, the golden and error chains and three injected breaks, all through ports that stand in for the write node and the gateway.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/nodes/node_review_gate_context_effect tests/unit/nodes/node_review_gate_context_orchestrator -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24614-ac3-seam
  description: The seam tests, the check name and shape from the decision to the request the write node validates, the verdict rows the landing ledger facts read to the check, and the audit's requirement
    for the same name.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/nodes/node_review_gate_context_compute/test_review_gate_context_seam.py tests/nodes/node_branch_protection_audit_effect/test_branch_protection_audit_review_verdict.py
      -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24614-ac4-hosted-sweep-path
  description: The hosted-runnable reading of AC4, the sweep command over the nodes' own overlays reads a head with no verdict as failure and posts it, a stale watcher state posts nothing, and a clean verdict row reads
    success; it imports nodes origin/dev does not hold, so it fails at the merge base.
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/nodes/node_review_gate_context_orchestrator/test_review_gate_context_main.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24614-ac4-integration-proof
  description: Hosted CI cannot reach the lab bus or GitHub, so only the local Done gate runs this unbound check. The reading is the posted fable-review-gate commit status for the head of a real pull request, read back through
    the gateway after a sweep over the lab bus, and its receipt comment on the ticket.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex scm commit-statuses OmniNode-ai/omnimarket --head-sha "$(git rev-parse HEAD)"
    cwd: .
