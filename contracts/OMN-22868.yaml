schema_version: 1.0.0
ticket_id: OMN-22868
title: A stoppage ends on the evidence of a resolved STATUS row instead of aging out of a 3-hour window
summary: The friction rollup reads each STATUS row that says resolved=<class> and carries the newest such time as resolved_at on the class. The floor carries it through the factory floor record to the stoppage cause, and a stoppage whose resolved_at is not earlier than its last_seen reads not occurring and draws quiet when no lane and no operator need is on it. A FRICTION row after the resolved row makes it occurring again. No bound, window or alarm is changed or muted.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn22868-stoppage-ends-on-evidence
  statement: A stoppage whose alarm wrote a resolved STATUS row after its newest FRICTION row reads not occurring on the floor, and reads occurring again when a FRICTION row follows.
  acceptance:
  - id: AC1
    statement: 'AC1: a stoppage with a resolved STATUS row after its last FRICTION row draws quiet and not occurring, one without that row or with a later FRICTION row draws red -- falsifier: `uv run pytest tests/nodes/node_floor_simple_compute/test_stoppage_resolved_status_omn22868.py -q`'
evidence_requirements:
- kind: tests
  description: The stoppage-resolved tests, including the controls without the resolved row and with a later FRICTION row, pass.
  command: uv run --frozen pytest tests/nodes/node_floor_simple_compute/test_stoppage_resolved_status_omn22868.py -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
