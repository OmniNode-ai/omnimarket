schema_version: 1.0.0
ticket_id: OMN-22868
title: The silent-failure alarm writes one resolved row per episode; a stoppage ends on the evidence of a resolved STATUS row
summary: The throughput-results alarm wrote two resolved rows for episode al-20261108T2341Z-throughput-results (2026-11-09T00:09:02Z and 00:16:36Z). The ledger reader now reads a resolved STATUS row as closing the raise it follows, so a later shortfall inside the dedupe window is a new episode with its own raise row instead of re-adopting the closed one, and a resolved row is not written for an episode the ledger already resolved. No bound, window or alarm is changed or muted. The friction rollup reads each STATUS row that says resolved=<class> and carries the newest such time as resolved_at on the class. The floor carries it through the factory floor record to the stoppage cause, and a stoppage whose resolved_at is not earlier than its last_seen reads not occurring and draws quiet when no lane and no operator need is on it. A FRICTION row after the resolved row makes it occurring again. No bound, window or alarm is changed or muted.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn22868-one-resolved-per-episode
  statement: One alarm episode writes one resolved row, and a shortfall after a resolved row is a new episode.
  acceptance:
  - id: AC1
    statement: 'AC1: the throughput-results alarm writes one resolved row per episode and a new shortfall after it raises its own row -- falsifier: `uv run pytest tests/nodes/node_silent_failure_alarm_effect/test_throughput_results_one_resolved_per_episode_omn22868.py -q`'
- id: req-omn22868-stoppage-ends-on-evidence
  statement: A stoppage whose alarm wrote a resolved STATUS row after its newest FRICTION row reads not occurring on the floor, and reads occurring again when a FRICTION row follows.
  acceptance:
  - id: AC2
    statement: 'AC2: a stoppage with a resolved STATUS row after its last FRICTION row draws quiet and not occurring, one without that row or with a later FRICTION row draws red -- falsifier: `uv run pytest tests/nodes/node_floor_simple_compute/test_stoppage_resolved_status_omn22868.py -q`'
