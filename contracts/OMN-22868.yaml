  command: uv run --frozen pytest tests/nodes/node_silent_failure_alarm_effect/test_throughput_results_one_resolved_per_episode_omn22868.py -q --no-cov
- kind: tests
  description: The stoppage-resolved tests, including the controls without the resolved row and with a later FRICTION row, pass.
  command: uv run --frozen pytest tests/nodes/node_floor_simple_compute/test_stoppage_resolved_status_omn22868.py -q --no-cov
