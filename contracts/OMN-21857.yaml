    statement: |-
      The omnimarket repo-evidence caller names the omnibase_core dev-merge tag of the reusable, passes the omnimarket dev-merge tag as verifier-tag and carries no verifier-version key.
    acceptance:
      - id: "AC1"
        statement: "AC1: .github/workflows/call-repo-evidence-gate.yml in omnimarket calls OmniNode-ai/omnibase_core/.github/workflows/receipt-gate.yml@dev-20261101005012-ac2f26e3e5bf with verifier-tag dev-20261101000200-949993edf3b7 and no verifier-version key -- falsifier: uv run pytest tests/ci -q -k repo_evidence_caller"
  - id: "req-omn21857-tests-assert-tag"
    statement: |-
      Every caller test that asserted verifier-version asserts verifier-tag, and no test names verifier-version as a required caller input.
    acceptance:
      - id: "AC2"
        statement: "AC2: every test in omnimarket that asserted verifier-version now asserts verifier-tag and passes, and no test in tests/ names verifier-version as a required caller input -- falsifier: uv run pytest tests/ci -q and grep -rn verifier-version tests/ returning no caller assertion"
  - id: "req-omn21857-lab-proof"
    statement: |-
      The tag installs on a lab host from its own uv.lock and the caller tests run as a lab-run unit.
    acceptance:
      - id: "AC3"
        statement: "AC3: lab proof: the real install of tag dev-20261101000200-949993edf3b7 on the lab (clone at the tag commit, uv sync --frozen --no-dev --no-editable from its uv.lock) exits 0, and the repo caller tests run as an /omni:lab-run unit exit 0 -- falsifier: the /omni:lab-run receipt for the caller test command and the tag install command, each exit code 0"
