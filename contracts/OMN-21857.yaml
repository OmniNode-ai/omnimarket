title: "omnimarket repo-evidence caller installs its verifier from the omnimarket dev-merge tag"
summary: "The repo-evidence caller in omnimarket installed its verifier from a pinned omnimarket release through verifier-version. Operator ruling 2026-10-31T21:49:54Z: the definition-of-done check installs its verifier from the omnimarket dev-merge tag. omnibase_core#2203 made receipt-gate.yml accept verifier-tag, resolve it to a commit, and refuse a moved tag, a tag not on omnimarket dev, or one not descending from floor commit e565ba5ba00c. The caller now calls receipt-gate.yml at the omnibase_core dev-merge tag dev-20261101005012-ac2f26e3e5bf, passes verifier-tag dev-20261101000200-949993edf3b7 and drops verifier-version; the caller tests assert the new shape."
