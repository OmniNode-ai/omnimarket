schema_version: 1.0.0
ticket_id: OMN-23413
title: Unified ONEX CLI onboarding, delegation, dashboard and Claude integration
summary: Executable evidence for approved package-installed endpoint-only onboarding. Protocol fixtures
  and actual operator/model proof remain distinct. Required local proof fails when absent. This contract
  asserts no completion status.
is_seam_ticket: true
interface_change: true
interfaces_touched:
- public_api
requirements:
