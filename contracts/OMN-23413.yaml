evidence_requirements:
- kind: tests
  description: Run fixture controls plus required installed-wheel and actual model/Claude evidence; preserve
    artifacts before closure.
  command: env ONEX_E2E_REQUIRE_COMPLETE=1 uv run pytest tests/e2e/test_setup_close_evidence.py -q --no-cov
    -n 0 -p no:randomly
