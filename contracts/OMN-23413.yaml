- id: dod-omn23413-ac28-historical-unknown-read
  description: 'The local SQLite read of stored delegation rows, the only part of AC28 this check runs.
    On the decisions and run-detail exposures a stored zero that no price stood behind is served as
    unknown spend with no saving, and the stored row is unchanged. A zero is served as stored when the
    row records a charge or a cost source other than no_cost_model, a free_local tier type (or, recording
    neither source nor tier type, a tier the routing registry declares free_local), a model id ending
    in :free, or a model that the pricing manifest, the provider catalogue for the backend the row names,
    or models.dev read live for that backend''s provider prices at zero. A models.dev copy older than its
    configured age is not used, and the price list shipped with the install never makes a zero free.
    A hanging models.dev read costs a served read at most its configured deadline, once per retry
    interval, and leaves the run unknown; a fresh copy that cannot be parsed is read again.
    A rejected attempt the provider answered that is itself such a zero makes the whole run unknown.
    The writer, omnidash Unknown and Not measured, the onex delegate cost-unknown summary and the browser
    check of AC28 are not run here and are separate evidence.'
  source: manual
  execution_scope: hosted_and_local
  binds_ac:
  - AC28
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/projection/test_omn23413_historical_unknown_cost.py -q --no-cov
      -n 0 -p no:randomly
    cwd: .
