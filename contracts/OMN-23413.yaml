- id: dod-omn23413-ac33-prompt-routing
  description: The evidence item check runs two unit-test files against the hook node handler. For an
    eligible prompt the hook node calls delegation and returns a block decision that carries the
    accepted answer. An action request such as "you can fix it" stays with Claude with no delegation
    call. A declined prompt and a timed-out delegation pass the prompt to Claude, and with no pending
    history the check asserts empty hook output; for a decline the quality gate vetoed, the check
    asserts only the declined outcome and its run id. A plain process failure is covered by the local
    Done gate item below. The prompt switch pauses only prompts. The hook output of the next
    same-session prompt that passes through to Claude carries what delegation answered while blocked, a
    later such prompt's hook output carries nothing, and the history in that output is bounded; the
    check reads the hook output and does not observe what a Claude client does with it. Amendment 14a
    requires onex delegation on to register only the prompt hook so that subagents stay on Claude. This
    check does not verify which hooks an installation registers. This check calls the handler directly,
    which still answers a subagent request, and does not observe a Claude session. The skip prefix, the
    fixture installed-hook journey and the captured-receipt readback are covered by the unbound local
    Done gate item below.
  source: manual
  execution_scope: hosted_and_local
  binds_ac:
  - AC33
  checks:
  - check_type: test_passes
    check_value: uv run pytest src/omnimarket/nodes/node_hook_delegate_effect/tests/test_prompt_delegate.py
      src/omnimarket/nodes/node_hook_delegate_effect/tests/test_hook_switches.py -q --no-cov -n 0 -p no:randomly
    cwd: .

- id: dod-omn23413-ac33-installed-prompt-controls
  description: The isolated installed-hook journey in tests/e2e/test_combined_hook_journey.py runs the
    hook with a fixture onex that prints a canned receipt and a stub claude that only prints its
    version, so it runs no real inference, and its own artifact says so. It executes accepted prompt
    blocking, fixed decline, quality veto, process failure, timeout, OFF and skip controls, and history
    delivery once. It checks that installing leaves every setting other than hooks equal to the original
    and keeps the user's existing prompt hook entry. After a second install and at the end, the parsed
    settings stay equal to the first install's parsed settings. The test calls the hook script directly
    with an Agent event, which the script answers with exit 2, the answer on stderr and one delegation
    call, and then with a Task event carrying the same session and task text, which exits 2 and adds no
    new delegation call. The test comment attributes this to the same accepted receipt, which the test
    does not check further. Amendment 14a requires onex delegation on to register only the prompt hook
    so that subagents stay on Claude. This journey does not verify which hooks an installation
    registers, and it does not observe a real session. omniclaude#3270 merged on 2026-11-19, and this
    journey still calls the script directly with Agent and Task events. It needs the companion
    omniclaude source or unpacked wheel resource root, through ONEX_COMBINED_HOOK_SOURCE or the sibling
    omniclaude checkout; the installed plugin must also contain hooks/delegation-runtime.json; missing
    assets fail. The lifecycle test in tests/e2e/test_prompt_hook_lifecycle.py needs a real claude CLI
    on PATH. The same command also checks the TUI. It re-reads three captured files named by
    ONEX_PROMPT_PROOF_RECEIPT, ONEX_PROMPT_PROOF_DATABASE and ONEX_PROMPT_PROOF_CLAUDE, and compares the
    receipt's model with the model name in ONEX_PROMPT_PROOF_MODEL, and all four are mandatory. It runs
    no new inference. It checks each file's recorded values and their agreement. The receipt joins
    exactly one delegation_events row with matching trace, model, passed gate and token counts, with at
    least one attempt marked measured. The native capture records no native provider request, zero API
    duration, empty model usage, zero cost, a passed instrument control, exactly one fallback request, a
    recorded flag that the fallback received history, and a recorded flag that OFF was verified; its
    result contains the receipt's run id, model and answer. Self-consistent synthetic files pass, so it
    does not prove a real installed run. Its scope is the local Done gate, so hosted verification skips
    it, and AC33 is bound by dod-omn23413-ac33-prompt-routing above.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: test_passes
    check_value: env ONEX_E2E_REQUIRE_COMPLETE=1 uv run pytest tests/e2e/test_combined_hook_journey.py
      tests/e2e/test_prompt_hook_lifecycle.py tests/e2e/test_prompt_delegation_real_evidence.py
      tests/unit/nodes/node_onex_setup_effect/test_onex_tui.py -q --no-cov -n 0 -p no:randomly
    cwd: .

