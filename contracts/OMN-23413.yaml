    Reconcile all 273 audited legacy surfaces to an implemented outcome, a compatibility alias, or an
    explicit operator-approved retirement/external responsibility. Source cloning, automatic model-runtime
    management, and blanket hardware floors are retired by this revision. No other missing capability
    is hidden as complete. Omission controls must still fail. Include optional completion/audio consent
    and advanced stack behavior in the mapping.'
