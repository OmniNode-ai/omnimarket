---
schema_version: "1.0.0"
ticket_id: "OMN-23669"
title: "The factory floor main step reads its work log rows from the read service, page by page"
summary: "The factory floor effect reads its window rows from the work ledger read node, page by page, through the bus read command the publisher's unit carries. Each read (kinds, term, window) is declared in the effect's contract with the page, time and worker bounds; a read that does not answer, a cursor still open after the page limit or a spent time budget refuse the step with the read named as unread. The ledger file read, the plugin reader call and the step's file ledger-record value are removed."
is_seam_ticket: true
interface_change: true
interfaces_touched:
  - "public_api"
requirements:
  - id: "req-omn23669-pages"
    statement: |-
      The floor effect reads the ledger window only through the read node's rows query, paged, and never reads a short read as an empty ledger.
    acceptance:
      - id: "AC1"
        statement: "AC1: the factory floor step reads its ledger rows only through the declared read node, page by page, and no longer reads the ledger file or the plugin reader -- falsifier: pytest tests/nodes/node_factory_floor_effect/test_ledger_pages_step.py -q"
      - id: "AC2"
        statement: "AC2: a read that does not answer, a cursor still open after the page limit, or a spent time budget makes the step refuse with the read named as unread, never an empty ledger -- falsifier: pytest tests/nodes/node_factory_floor_effect/test_ledger_pages_step.py -q -k unread"
      - id: "AC3"
        statement: "AC3: the floor model built from a recorded fixture of projection pages equals the floor model the old step built from the file for the same rows -- falsifier: pytest tests/nodes/node_factory_floor_effect/test_ledger_pages_step.py -q -k same_floor"
      - id: "AC4"
        statement: "AC4: integrated: on the publishing Mac the served publish status shows the factory floor step ok under its 30 second limit, with its pages read named -- falsifier: read publish-status.json on the Mac after the install and find the floor step failed or at or over 30 seconds"
evidence_requirements:
  - kind: "tests"
    description: "The floor effect's page-read tests, the publisher's step-environment test and the existing floor effect tests."
    command: "uv run pytest tests/nodes/node_factory_floor_effect/test_ledger_pages_step.py tests/nodes/node_factory_floor_publish_effect/test_step_environment.py -q --no-cov"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn23669-pages"
    description: "The page reader's golden and error chains: the same floor rows from recorded pages as from the file, reads that run together, and an unread read refusing the step. The failing control restores the file read: the contract then names a ledger record and no pages."
    source: "manual"
    binds_ac: ["AC1", "AC2", "AC3"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_factory_floor_effect/test_ledger_pages_step.py tests/nodes/node_factory_floor_effect/test_ledger_source_named.py -q --no-cov"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn23669-integration-hosted"
    description: "Hosted proxy for AC4: the publisher's floor step names no ledger record and keeps its 30 s limit under the cycle bound. The Mac run is read from the served publish status after the orchestrator installs the head."
    source: "manual"
    binds_ac: ["AC4"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_factory_floor_publish_effect/test_step_environment.py tests/nodes/node_factory_floor_publish_effect/test_cycle_bound.py -q --no-cov"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn23669-integration-proof"
    description: "Run the floor effect's page-read tests on a lab host at the pushed head. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check; the hosted proxy above binds AC4. The Mac run is read from the served publish status after the orchestrator installs the head."
    source: "manual"
    execution_scope: "local_done_gate"
    checks:
      - check_type: "command"
        check_value: "env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha \"$(git rev-parse HEAD)\" --lane dod-integration-proof-23669 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_factory_floor_effect/test_ledger_pages_step.py -q --no-cov"
        cwd: "."
