---
schema_version: 1.0.0
ticket_id: OMN-21536
title: 'omnimarket: handler-shape debt burn-down, slice 5: multi-parameter handle signatures take one typed request'
summary: The handler-shape validator of omnibase_core reports a handler class whose handle takes several positional
  parameters (noncanonical_handle), which the shared runtime cannot adapt. Fourteen handlers did. Each now takes one
  typed request model, passed as the one parameter of handle and built from the parameters it took, and its callers, the
  build-loop sub-handler protocols and live adapters, and its tests follow. A correlation id the handler only ignored or
  logged leaves the signature; one it forwards moves into the request model.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-multiparam-handle-takes-one-request
  statement: No handler class of the fourteen takes more than one parameter in handle, every caller builds the typed request, and the nodes behave as before.
  acceptance:
  - id: AC1
    statement: 'AC1: the handler-shape validator of omnibase_core run over src reports no noncanonical_handle finding in the fourteen handler modules -- falsifier: `uv run pytest tests/test_handler_shape_multiparam_omn21536.py` fails for one of the fourteen modules'
  - id: AC2
    statement: 'AC2: the tests of every touched node pass -- falsifier: the pytest command of the evidence below exits non-zero'
evidence_requirements:
- kind: tests
  description: The tests of the nodes whose handle signature changed, run on a lab host at the pushed head.
  command: uv run pytest tests/test_golden_chain_build_dispatch_effect.py tests/test_golden_chain_closeout_effect.py tests/test_golden_chain_verify_effect.py tests/test_golden_chain_build_loop_orchestrator.py tests/test_golden_chain_build_loop_events.py tests/unit/nodes/node_build_loop_orchestrator tests/integration/node_verify_effect tests/test_golden_chain_design_to_plan.py tests/test_handler_handoff_effect.py tests/test_handoff_failure_modes.py tests/test_handoff_validation_gate.py tests/unit/nodes/node_monitor_alert_responder tests/nodes/node_omnigate_receipt_generator tests/nodes/node_omnigate_receipt_verifier tests/unit/nodes/node_persona_lifecycle_orchestrator tests/nodes/node_polish_task_classifier tests/unit/projection/test_delegation_data_source_experiment_omn19448.py tests/test_golden_chain_state_persist_effect.py tests/nodes/node_thread_reply_effect tests/test_golden_chain_thread_reply_effect.py tests/test_golden_chain_ticket_query.py tests/unit/nodes/node_pr_lifecycle_orchestrator tests/test_golden_chain_pr_lifecycle_orchestrator.py tests/test_market_node_runtime_dogfood.py tests/test_handler_routing_boot_resolvable.py src/omnimarket/nodes/node_projection_delegation/tests src/omnimarket/nodes/node_build_loop_orchestrator/tests tests/test_retry_loop.py tests/test_glm_reviewer.py tests/test_no_cross_node_reach_in.py tests/test_handler_shape_multiparam_omn21536.py -q --no-cov --tb=line
