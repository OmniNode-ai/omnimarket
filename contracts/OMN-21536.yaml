- id: dod-omn21536-s4-deploy-handler-smoke
  description: 'Hosted package deploy smoke: the installed pr-review FSM reducer handler takes the typed advance command, names no event envelope, and folds one advance into a state projection. A handler that again names the envelope, or whose handle does not take the command, fails. No credentials, broker or lab service is required; this checks the evaluated checkout package, not a production rollout.'
  source: manual
  checks:
  - check_type: command
    check_value: 'set -eu;

      export PYTHONDONTWRITEBYTECODE=1;

      uv run python -c ''

      import asyncio

      import inspect

      from uuid import uuid4

      from omnimarket.nodes.node_pr_review_fsm_reducer.handlers import handler_pr_review_fsm as mod

      from omnimarket.nodes.node_pr_review_fsm_reducer.models.model_pr_review_advance_command import ModelPrReviewAdvanceCommand

      src = inspect.getsource(mod)

      assert "ModelEventEnvelope" not in src, "handler names the event envelope"

      hints = inspect.signature(mod.HandlerPrReviewFsm.handle).parameters

      assert list(hints) == ["self", "request"], list(hints)

      assert hints["request"].annotation in (ModelPrReviewAdvanceCommand, "ModelPrReviewAdvanceCommand"), hints["request"].annotation

      cmd = ModelPrReviewAdvanceCommand(state=mod.ModelPrReviewBotState(correlation_id=uuid4(), pr_number=1, repo="o/r"), phase_success=True)

      out = asyncio.run(mod.HandlerPrReviewFsm().handle(cmd))

      assert len(out.projections) == 1, out

      print("pr-review FSM reducer handler: typed command in, one projection out, no envelope named")

      ''

      '
    cwd: .
  - check_type: command
    check_value: 'gh api repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_pr_review_fsm_reducer/handlers/handler_pr_review_fsm.py?ref=30662b29a01e632438efea302a9bef711a0e4d98 --jq ''.content'' | base64 -d | grep -c ''request: ModelPrReviewAdvanceCommand'''
    cwd: .
- id: dod-omn21536-ac3-no-multiparam-handle
  description: AC3 runs the handler-shape validator of omnibase_core over the fourteen handler modules at the committed head and asserts it reports no noncanonical_handle finding for any.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/test_handler_shape_multiparam_omn21536.py -q --no-cov --tb=line
    cwd: ${OMNI_HOME}/omnimarket
- id: dod-omn21536-deploy-published-handler-readback
  description: Read the published build dispatch handler at the evaluated commit and require its single typed request signature. This hosted-runner source readback needs no lab service and does not assert a live runtime rollout.
  source: manual
  checks:
  - check_type: command
    check_value: 'curl --fail --silent --show-error --location --max-time 30 "https://raw.githubusercontent.com/OmniNode-ai/omnimarket/$(git rev-parse HEAD)/src/omnimarket/nodes/node_build_dispatch_effect/handlers/handler_build_dispatch.py" | python3 -c ''

      import ast

      import sys

      module = ast.parse(sys.stdin.read())

      handler = next(node for node in module.body if isinstance(node, ast.ClassDef) and node.name == "HandlerBuildDispatch")

      method = next(node for node in handler.body if isinstance(node, ast.AsyncFunctionDef) and node.name == "handle")

      assert [arg.arg for arg in method.args.posonlyargs + method.args.args] == ["self", "request"]

      assert not method.args.kwonlyargs and method.args.vararg is None and method.args.kwarg is None

      assert ast.unparse(method.args.args[1].annotation) == "ModelBuildDispatchInput"

      assert ast.unparse(method.returns) == "ModelBuildDispatchResult"

      print("Published build dispatch handler readback: single typed request PASS")

      '''
    cwd: ${OMNI_HOME}/omnimarket
