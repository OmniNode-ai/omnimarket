schema_version: 1.0.0
ticket_id: OMN-21536
title: 'omnimarket: handler-shape debt burn-down, slices 4 and 5: the pr-review FSM reducer stops naming the event envelope, and multi-parameter handle signatures take one typed request'
summary: 'The handler-shape validator of omnibase_core reports a handler module that references the event envelope type (envelope_in_core): 25 modules. This change clears one, the pr-review FSM reducer, whose handler now takes the typed advance command the runtime adapter validates and emits only a projection. The other 24 modules either build or read an envelope in the handler (a bus publisher, a request and reply phase, an orchestrator emitting event envelopes, a handler that routes on the envelope''s event type) and cannot lose it without a change in the shared runtime or in each node''s contract; the lane stopped there on the operator''s instruction that the shared runtime is the only place an envelope is unwrapped and that no per-handler helper stands in for it.


  Slice 5 (AC3 and AC4): The handler-shape validator of omnibase_core reports a handler class whose handle takes several positional parameters (noncanonical_handle), which the shared runtime cannot adapt. Fourteen handlers did. Each now takes one typed request model, passed as the one parameter of handle and built from the parameters it took, and its callers, the build-loop sub-handler protocols and live adapters, and its tests follow. A correlation id the handler only ignored or logged leaves the signature; one it forwards moves into the request model.'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn21536-s4-pr-review-fsm-reducer-names-no-envelope
  statement: The pr-review FSM reducer's handler takes its typed advance command, references no event envelope type, and folds the same state as before.
  acceptance:
  - id: AC1
    statement: 'AC1: the handler-shape validator of omnibase_core reports no envelope_in_core issue on the pr-review FSM reducer handler -- falsifier: uv run pytest tests/validation/test_handler_modules_name_no_event_envelope_omn21536.py exits non-zero'
  - id: AC2
    statement: 'AC2: the tests of the pr-review FSM reducer pass -- falsifier: the pytest command of the evidence below exits non-zero'
- id: req-multiparam-handle-takes-one-request
  statement: No handler class of the fourteen takes more than one parameter in handle, every caller builds the typed request, and the nodes behave as before.
  acceptance:
  - id: AC3
    statement: 'AC3: the handler-shape validator of omnibase_core run over src reports no noncanonical_handle finding in the fourteen handler modules -- falsifier: `uv run pytest tests/test_handler_shape_multiparam_omn21536.py` fails for one of the fourteen modules'
  - id: AC4
    statement: 'AC4: the tests of every touched node pass -- falsifier: the pytest command of the evidence below exits non-zero'
