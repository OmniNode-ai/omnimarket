schema_version: 1.0.0
ticket_id: OMN-21536
title: 'omnimarket: handler-shape debt burn-down (slice 3: public handler methods stop mutating handler state; slice 4: the
  pr-review FSM reducer stops naming the event envelope)'
summary: |-
  Slice 3: The handler-shape validator of omnibase_core reports a public method of a handler class, other than handle, that assigns to the handler (mutating_public_method). Twenty-six of those sat in twenty files. Each now keeps its state in a collaborator the handler is given (a quota-reading store, a source-control connection, an overlay source, a decision count, a dispatch session, a DLQ routing mark, an emit lifecycle), in a local of the call, or nowhere when nothing read it. The tests of every touched node follow the move.

  Slice 4: The handler-shape validator of omnibase_core reports a handler module that references the event envelope type (envelope_in_core): 25 modules. This change clears one, the pr-review FSM reducer, whose handler now takes the typed advance command the runtime adapter validates and emits only a projection. The other 24 modules either build or read an envelope in the handler (a bus publisher, a request and reply phase, an orchestrator emitting event envelopes, a handler that routes on the envelope's event type) and cannot lose it without a change in the shared runtime or in each node's contract; the lane stopped there on the operator's instruction that the shared runtime is the only place an envelope is unwrapped and that no per-handler helper stands in for it.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-public-handler-methods-hold-no-state
  statement: No public method of a handler class, other than handle, assigns to the handler or calls a mutating method on
    one of its attributes, in the twenty files the validator named, and the nodes behave as before.
  acceptance:
  - id: AC3
    statement: 'AC3: the handler-shape validator of omnibase_core run over src reports no mutating_public_method finding --
      falsifier: the command of the evidence below prints a number above 0'
  - id: AC4
    statement: 'AC4: the tests of every touched node pass -- falsifier: the pytest command of the evidence below exits non-zero'
- id: req-omn21536-s4-pr-review-fsm-reducer-names-no-envelope
  statement: The pr-review FSM reducer's handler takes its typed advance command, references no event envelope type, and folds
    the same state as before.
  acceptance:
  - id: AC1
    statement: 'AC1: the handler-shape validator of omnibase_core reports no envelope_in_core issue on the pr-review FSM reducer
      handler -- falsifier: uv run pytest tests/validation/test_handler_modules_name_no_event_envelope_omn21536.py exits non-zero'
  - id: AC2
    statement: 'AC2: the tests of the pr-review FSM reducer pass -- falsifier: the pytest command of the evidence below exits
      non-zero'
