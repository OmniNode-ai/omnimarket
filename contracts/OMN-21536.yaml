schema_version: 1.0.0
ticket_id: OMN-21536
title: 'omnimarket: handler-shape debt burn-down, slice 1: projection runners take a typed request'
summary: The handler-shape validator of omnibase_core reports a handler class whose handle takes a parameter that is not
  a typed request (noncanonical_handle). Forty-three of those were projection runners, subclasses of
  BaseProjectionRunner, each with handle(input_data) that popped the delivery keys the runtime injects (the topic,
  partition, offset and fallback id) by hand. BaseProjectionRunner.handle now splits that dict once into a
  ModelProjectionRequest and passes it to project_request, which each runner implements over the typed request. The
  base handle keeps the dict parameter because the projection arm of the shared runtime calls handle(dict), and a handle
  annotated with a concrete model is wired onto the typed dispatch arm instead, where the runner would stop receiving
  its database adapter, partition and offset.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-runners-take-a-typed-request
  statement: No projection runner defines handle(input_data) any more; each implements project_request over a ModelProjectionRequest, and the runtime seam in BaseProjectionRunner.handle hands it the same topic, partition, offset, fallback id and payload the hand-written pops produced.
  acceptance:
  - id: AC3
    statement: 'AC3: no subclass of BaseProjectionRunner under src/omnimarket/nodes defines a handle with an input_data parameter -- falsifier: the AST scan of the evidence below prints a file path and exits non-zero'
  - id: AC4
    statement: 'AC4: the handler-shape validator of the installed omnibase_core reports no noncanonical_handle finding on a BaseProjectionRunner subclass -- falsifier: the validator scan of the evidence below prints a (path, line) pair and exits non-zero'
  - id: AC5
    statement: 'AC5: the shim reads both source coordinates once and no runner overrides it, and the tests of every touched projection node pass -- falsifier: the pytest command of the evidence below exits non-zero'
- id: "req-omn21536-s4-pr-review-fsm-reducer-names-no-envelope"
  statement: |-
    The pr-review FSM reducer's handler takes its typed advance command, references no event envelope type, and folds the same state as before.
  acceptance:
    - id: "AC1"
      statement: "AC1: the handler-shape validator of omnibase_core reports no envelope_in_core issue on the pr-review FSM reducer handler -- falsifier: uv run pytest tests/validation/test_handler_modules_name_no_event_envelope_omn21536.py exits non-zero"
    - id: "AC2"
      statement: "AC2: the tests of the pr-review FSM reducer pass -- falsifier: the pytest command of the evidence below exits non-zero"
