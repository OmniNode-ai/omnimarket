schema_version: 1.0.0
ticket_id: OMN-21536
title: 'omnimarket: handler-shape debt burn-down, slice 2: command line entries leave the handler modules'
summary: The handler-shape validator of omnibase_core reports a handler module that holds module functions and no
  handler class (module_function_handler). Nineteen of those were command line entries, a main and its helpers in a
  handler_*_cli module. Each moves beside its node's contract.yaml as a runtime_*.py module, the location the
  canonical-file-shape rule cli_entry_outside_node names for a command line entry, and its project.scripts entry,
  contract, tests and burn-down line follow. The overlay check, which read files and the environment inside a compute
  node, gets an effect node for the reading and keeps its compute node pure.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-cli-entries-leave-handlers
  statement: No handler_*_cli module of the nineteen holds a command line main any more, and every console script and python -m entry that named one resolves to its new module and behaves as before.
  acceptance:
  - id: AC1
    statement: 'AC1: none of the nineteen handler_*_cli modules (and handler_lab_proof) still exists under a handlers directory, and each runtime_*.py module that replaced one defines main -- falsifier: `git ls-files src | grep -E ''handler_(.*_cli|lab_proof)\.py$''` prints one of the moved paths, or a runtime_*.py module of the list lacks `def main(`'
  - id: AC2
    statement: 'AC2: the burn-down baseline no longer lists the nineteen moved handler_*_cli modules and the canonical-file-shape hook passes on the whole tree -- falsifier: `uv run pre-commit run canonical-file-shape --all-files` exits non-zero, or `grep -c ''handler_.*_cli.py'' .onex_ratchets/canonical_file_shape_burndown_baseline.txt` prints a number above 0 for a moved module'
  - id: AC3
    statement: 'AC3: the tests of every touched node pass with the commands pointed at the new modules -- falsifier: the pytest command of the evidence below exits non-zero'
evidence_requirements:
- kind: tests
  description: The tests of the nodes whose command line entry moved, run on a lab host at the pushed head.
  command: uv run pytest tests/nodes/node_automation_liveness_overlay_check_effect/test_overlay_check_run.py tests/nodes/node_automation_liveness_overlay_check_compute tests/nodes/node_architecture_discovery_orchestrator tests/nodes/node_claude_code_hook_adapter_effect tests/nodes/node_friction_synthesis_effect tests/nodes/node_host_thermal_observe_effect tests/nodes/node_hourly_tick_effect tests/nodes/node_lab_disk_growth_effect tests/nodes/node_lab_fill_receipt_table_compute tests/nodes/node_landing_tlc_receipt_effect tests/nodes/node_linear_ticket_write_effect tests/nodes/node_operator_access_mode_effect tests/nodes/node_rsd_migration_orchestrator tests/nodes/node_runtime_deploy_effect tests/test_session_capability_digest.py tests/test_golden_chain_patch_apply_dispatch_effect.py -q --no-cov --tb=line
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn21536-ac1-no-handler-main
  description: AC1 checks that the nineteen old module paths are gone and that each runtime_*.py module that replaced one defines main.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: command
    check_value: |
      set -eu;
      test -z "$(git ls-files src | grep -E 'handlers/handler_(automation_liveness_overlay_check_cli|runtime_coverage_cli|architecture_discovery_cli|claude_code_hook_cli|compaction_latency_cli|friction_synthesis_cli|host_thermal_cli|hourly_tick_cli|lab_disk_growth_cli|lab_fill_receipt_table_cli|lab_secret_store_override_cli|landing_tlc_receipt_cli|operator_hook_cli|capture_cli|patch_apply_dispatch_cli|rsd_migration_cli|runtime_deploy_cli|session_capability_digest_cli|lab_proof)\.py$')";
      test "$(git ls-files src | grep -E '/runtime_[a-z_]*(_cli|lab_proof)\.py$' | xargs grep -lE '^def main\(' | wc -l)" -ge 19
    cwd: ${OMNI_HOME}/omnimarket
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_linear_ticket_write_effect/test_lab_proof.py tests/nodes/node_operator_access_mode_effect/test_operator_access_mode.py -q --no-cov --tb=line
    cwd: ${OMNI_HOME}/omnimarket
- id: dod-omn21536-ac2-file-shape
  description: AC2 runs the canonical-file-shape hook over the whole tree of the committed head and checks that none of the moved modules is still listed in the burn-down file.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: command
    check_value: |
      set -eu;
      uv run pre-commit run canonical-file-shape --all-files
    cwd: ${OMNI_HOME}/omnimarket
  - check_type: command
    check_value: |
      set -eu;
      test -z "$(grep -E 'handler_(automation_liveness_overlay_check|runtime_coverage|architecture_discovery|claude_code_hook|compaction_latency|friction_synthesis|host_thermal|hourly_tick|lab_disk_growth|lab_fill_receipt_table|lab_secret_store_override|landing_tlc_receipt|operator_hook|capture|patch_apply_dispatch|rsd_migration|runtime_deploy|session_capability_digest)_cli\.py|handler_lab_proof\.py' .onex_ratchets/canonical_file_shape_burndown_baseline.txt)"
    cwd: ${OMNI_HOME}/omnimarket
  - check_type: test_passes
    check_value: uv run pytest tests/ci/test_canonical_file_shape_burndown_omn21524.py -k committed_burndown -q --no-cov --tb=line
    cwd: ${OMNI_HOME}/omnimarket
