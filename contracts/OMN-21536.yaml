- id: dod-omn21536-deploy-postgres-writer-readback
  description: >-
    Hosted deployment smoke against the verifier's disposable PostgreSQL 16 service.
    Refuse a missing database connection, then send a real lab-job event through
    BaseProjectionRunner.handle with the runtime delivery keys and compare the stored
    state and transition rows with the bare event's rows. Missing rows, leaked delivery
    keys, changed row counts or a skipped test fail the check. This reads the evaluated
    revision's writer against a real database; it does not assert a production rollout.
  source: manual
  binds_ac:
  - AC5
  checks:
  - check_type: command
    check_value: |
      set -eu;
      PGPASSWORD="${INTEGRATION_POSTGRES_PASSWORD:?}" psql -X --no-password \
        --host="${INTEGRATION_POSTGRES_HOST:-127.0.0.1}" \
        --port="${INTEGRATION_POSTGRES_PORT:-5432}" \
        --username="${INTEGRATION_POSTGRES_USER:-postgres}" \
        --dbname="${INTEGRATION_POSTGRES_DB:-omnibase_infra}" \
        --set=ON_ERROR_STOP=1 --tuples-only --no-align \
        --command="SELECT current_database(), 1 / (current_setting('server_version_num')::int >= 160000)::int AS postgres_16_or_later;";
      uv run python -c "from omnimarket.nodes.node_projection_lab_job.handlers import LabJobProjectionWriter as W; from omnimarket.projection.runner import BaseProjectionRunner as B; assert 'handle' not in vars(W); assert W.handle is B.handle; print('Runtime projection writer uses the shared handle')";
      env PYTHONDONTWRITEBYTECODE=1 uv run pytest \
        tests/test_lab_job_projection_real_postgres.py::test_the_shim_strips_the_delivery_keys_before_the_event_model \
        -q --no-cov --tb=line --refuse-skips
    cwd: ${OMNI_HOME}/omnimarket
  - check_type: test_passes
    check_value: env PYTHONDONTWRITEBYTECODE=1 uv run pytest tests/test_lab_job_projection_real_postgres.py::test_the_shim_strips_the_delivery_keys_before_the_event_model --refuse-skips -q --no-cov --tb=line
    cwd: ${OMNI_HOME}/omnimarket
