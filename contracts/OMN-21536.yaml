schema_version: 1.0.0
ticket_id: OMN-21536
title: 'omnimarket: handler-shape debt burn-down, slice 1: projection runners take a typed request'
summary: The handler-shape validator of omnibase_core reports a handler class whose handle takes a parameter that is not
  a typed request (noncanonical_handle). Forty-three of those were projection runners, subclasses of
  BaseProjectionRunner, each with handle(input_data) that popped the delivery keys the runtime injects (the topic,
  partition, offset and fallback id) by hand. BaseProjectionRunner.handle now splits that dict once into a
  ModelProjectionRequest and passes it to project_request, which each runner implements over the typed request. The
  base handle keeps the dict parameter because the projection arm of the shared runtime calls handle(dict), and a handle
  annotated with a concrete model is wired onto the typed dispatch arm instead, where the runner would stop receiving
  its database adapter, partition and offset.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-runners-take-a-typed-request
  statement: No projection runner defines handle(input_data) any more; each implements project_request over a ModelProjectionRequest, and the runtime seam in BaseProjectionRunner.handle hands it the same topic, partition, offset, fallback id and payload the hand-written pops produced.
  acceptance:
  - id: AC1
    statement: 'AC1: no subclass of BaseProjectionRunner under src/omnimarket/nodes defines a handle with an input_data parameter -- falsifier: the AST scan of the evidence below prints a file path and exits non-zero'
  - id: AC2
    statement: 'AC2: the handler-shape validator of the installed omnibase_core reports no noncanonical_handle finding on a BaseProjectionRunner subclass -- falsifier: the validator scan of the evidence below prints a (path, line) pair and exits non-zero'
  - id: AC3
    statement: 'AC3: the shim reads both source coordinates once and no runner overrides it, and the tests of every touched projection node pass -- falsifier: the pytest command of the evidence below exits non-zero'
evidence_requirements:
- kind: tests
  description: The shim tests, the OMN-18905 coordinate guard and the projection suites, run on a lab host at the pushed head.
  command: uv run pytest tests/test_projection_request.py tests/test_omn18905_writers_carry_source_coordinates.py tests/test_projection_runner_nodes_declare_their_outputs.py tests/test_projection_runner.py tests/projection -q --no-cov --tb=line
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn21536-ac1-no-runner-handle
  description: AC1 scans every handler module for a BaseProjectionRunner subclass that still defines handle(input_data).
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: command
    check_value: |
      set -eu;
      uv run python -c "import ast,pathlib,sys; bad=[str(p) for p in pathlib.Path('src/omnimarket/nodes').rglob('handler_*.py') for c in ast.parse(p.read_text()).body if isinstance(c,ast.ClassDef) and any('BaseProjectionRunner' in ast.unparse(b) for b in c.bases) and any(isinstance(m,ast.FunctionDef) and m.name=='handle' and any(a.arg=='input_data' for a in m.args.args) for m in c.body)]; print(bad); sys.exit(1 if bad else 0)"
    cwd: ${OMNI_HOME}/omnimarket
- id: dod-omn21536-ac2-validator-clean-on-runners
  description: AC2 runs the handler-shape rules of the installed omnibase_core over every handler module and fails on a noncanonical_handle finding whose class is a BaseProjectionRunner subclass.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: command
    check_value: |
      set -eu;
      uv run python -c "import ast,pathlib,sys,yaml; import omnibase_core.validation as v; from omnibase_core.models.contracts.subcontracts.model_validator_rule import ModelValidatorRule as R; from omnibase_core.validation.validator_handler_shape import module_facts; from omnibase_core.validation.checker_handler_shape import check_handler_shape as chk; rules=[R(**x) for x in yaml.safe_load((pathlib.Path(v.__file__).parent/'contracts'/'handler_shape.validation.yaml').read_text())['validation']['rules']]; bad=[(str(p),i.line_number) for p in pathlib.Path('src/omnimarket/nodes').rglob('handler_*.py') for i in chk(module_facts(p.as_posix(),p.read_text()),rules) if i.code=='noncanonical_handle' and i.message.split('.handle')[0] in {c.name for c in ast.parse(p.read_text()).body if isinstance(c,ast.ClassDef) and any('BaseProjectionRunner' in ast.unparse(b) for b in c.bases)}]; print(bad); sys.exit(1 if bad else 0)"
    cwd: ${OMNI_HOME}/omnimarket
- id: dod-omn21536-ac3-shim-and-node-tests
  description: AC3 runs the shim tests, the OMN-18905 coordinate guard and the projection suites.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/test_projection_request.py tests/test_omn18905_writers_carry_source_coordinates.py tests/test_projection_runner_nodes_declare_their_outputs.py tests/test_projection_runner.py tests/projection -q --no-cov --tb=line
    cwd: ${OMNI_HOME}/omnimarket
