schema_version: 1.0.0
ticket_id: OMN-21536
title: 'omnimarket: handler-shape debt burn-down, slice 2: command line entries leave the handler modules'
summary: The handler-shape validator of omnibase_core reports a handler module that holds module functions and no handler class (module_function_handler). Nineteen of those were command line entries, a main and its helpers in a handler_*_cli module. Each moves beside its node's contract.yaml as a runtime_*.py module, the location the canonical-file-shape rule cli_entry_outside_node names for a command line entry, and its project.scripts entry, contract, tests and burn-down line follow. The overlay check, which read files and the environment inside a compute node, gets an effect node for the reading and keeps its compute node pure.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-cli-entries-leave-handlers
  statement: No handler_*_cli module of the nineteen holds a command line main any more, and every console script and python -m entry that named one resolves to its new module and behaves as before.
  acceptance:
  - id: AC1
    statement: 'AC1: none of the nineteen handler_*_cli modules (and handler_lab_proof) still exists under a handlers directory, and each runtime_*.py module that replaced one defines main -- falsifier: `git ls-files src | grep -E ''handler_(.*_cli|lab_proof)\.py$''` prints one of the moved paths, or a runtime_*.py module of the list lacks `def main(`'
  - id: AC2
    statement: 'AC2: the burn-down baseline no longer lists the nineteen moved handler_*_cli modules and the canonical-file-shape hook passes on the whole tree -- falsifier: `uv run pre-commit run canonical-file-shape --all-files` exits non-zero, or `grep -c ''handler_.*_cli.py'' .onex_ratchets/canonical_file_shape_burndown_baseline.txt` prints a number above 0 for a moved module'
  - id: AC3
    statement: 'AC3: the tests of every touched node pass with the commands pointed at the new modules -- falsifier: the pytest command of the evidence below exits non-zero'
- id: req-omn21536-s4-pr-review-fsm-reducer-names-no-envelope
  statement: The pr-review FSM reducer's handler takes its typed advance command, references no event envelope type, and folds the same state as before.
  acceptance:
  - id: AC1
    statement: 'AC1: the handler-shape validator of omnibase_core reports no envelope_in_core issue on the pr-review FSM reducer handler -- falsifier: uv run pytest tests/validation/test_handler_modules_name_no_event_envelope_omn21536.py exits non-zero'
  - id: AC2
    statement: 'AC2: the tests of the pr-review FSM reducer pass -- falsifier: the pytest command of the evidence below exits non-zero'
evidence_requirements:
- kind: tests
  description: The tests of the nodes whose command line entry moved, run on a lab host at the pushed head.
  command: uv run pytest tests/nodes/node_automation_liveness_overlay_check_compute tests/nodes/node_automation_liveness_overlay_check_effect tests/nodes/node_architecture_discovery_orchestrator tests/nodes/node_claude_code_hook_adapter_effect tests/nodes/node_friction_synthesis_effect tests/nodes/node_host_thermal_observe_effect tests/nodes/node_hourly_tick_effect tests/nodes/node_lab_disk_growth_effect tests/nodes/node_lab_fill_receipt_table_compute tests/nodes/node_landing_tlc_receipt_effect tests/nodes/node_linear_ticket_write_effect tests/nodes/node_operator_access_mode_effect tests/nodes/node_rsd_migration_orchestrator tests/nodes/node_runtime_deploy_effect tests/test_session_capability_digest.py tests/test_golden_chain_patch_apply_dispatch_effect.py -q --no-cov --tb=line
- kind: tests
  description: The pr-review FSM reducer's tests and the envelope ratchet test, run on a lab host at the pushed head.
  command: uv run pytest tests/validation/test_handler_modules_name_no_event_envelope_omn21536.py tests/test_golden_chain_pr_review.py tests/integration/node_pr_review_fsm_reducer src/omnimarket/nodes/node_pr_review_fsm_reducer/tests -q --no-cov --tb=line -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
