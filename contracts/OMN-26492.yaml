schema_version: 1.0.0
ticket_id: OMN-26492
title: Every environment name or secret key an overlay names for a node is checked as set on each host that runs the node, and a host that lacks one is taken out of placement with one alarm
summary: 'A host installer probe node, node_host_installer_overlay_env_probe, reads every environment name and secret key that the overlays of the nodes assigned to a host declare (through the shared overlay reader, the declaring keys named in its contract) and records one row per host, node and name as set or unset, never a value. A host with an unset name for a node it runs is returned ineligible for that node in the lab placement verdicts, and one alarm names host, node and name.'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn26492-overlay-env-probe
  statement: A host that lacks an environment name an overlay declares for a node it runs is found and taken out of placement for that node before work is placed there.
  acceptance:
  - id: AC1
    statement: 'AC1: the host installer reads every env name and secret key declared by the overlays of the nodes assigned to a host and records one row per name as set or unset for that host, without printing a value -- falsifier: uv run pytest tests/nodes/node_host_installer_overlay_env_probe -q fails on a fixture host that lacks ONEX_DEV_READINESS_HOST'
  - id: AC2
    statement: 'AC2: a host with an unset name for a node it runs is marked unavailable for that node in lane placement and raises one alarm naming host, node and name -- falsifier: uv run pytest on the placement fixture fails when the unset host is still chosen'
  - id: AC3
    statement: 'AC3: h053 reads the signing key and ONEX_DEV_READINESS_HOST as set, or is out of placement for those two nodes, in the first probe after the merge -- falsifier: the probe row for h053 reads unset for either name while h053 is still in placement'
evidence_requirements:
- kind: tests
  description: The overlay env probe tests pass at the pushed head.
  command: uv run pytest tests/nodes/node_host_installer_overlay_env_probe -q -n 0 --no-cov -p no:cacheprovider
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn26492-ac1
  description: 'AC1: one row per host, node and name with state set or unset and no value; the fixture host that lacks ONEX_DEV_READINESS_HOST reads unset for it (failing control: with the placement step removed the same suite fails).'
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_host_installer_overlay_env_probe -q -n 0 --no-cov -p no:cacheprovider
    cwd: .
- id: dod-omn26492-ac2
  description: 'AC2: the host lacking the name is not chosen for the node that declares it, is still chosen for a node that does not, and one alarm names host, node and name.'
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_host_installer_overlay_env_probe -q -n 0 --no-cov -p no:cacheprovider -k "not_chosen or still_chosen or one_alarm"
    cwd: .
- id: dod-omn26492-ac3
  description: 'hosted proxy for AC3: the probe tests pass, including the read of the real R8 node contract that declares ONEX_DEV_READINESS_HOST; the probe row for h053 is taken on the lab host after the merge and is not met by this change alone.'
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_host_installer_overlay_env_probe -q -n 0 --no-cov -p no:cacheprovider -k "real_r8"
    cwd: .
- id: dod-omn26492-integration-proof
  description: the probe tests run on a lab host at the pushed head; hosted CI cannot reach the lab, so only the local Done gate runs this unbound check
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-26492 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_host_installer_overlay_env_probe -q --no-cov
