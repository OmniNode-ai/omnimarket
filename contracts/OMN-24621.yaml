schema_version: 1.0.0
ticket_id: OMN-24621
title: The BYOK writer prices glm-5.3-flash on byok-glm-general from the declared catalogue
summary: The dev probe tenant's key is a z.ai general-API credential that resolves glm-5.3-flash. The byok-glm-general catalogue row declared no price for that model, so calls were booked unpriced (cost_measurement_source no_cost_model) and the stored delegation row's cost_usd was NULL, which the R8 check reads as zero. The row now declares glm-5.3-flash at 0.15 input and 0.50 output USD per 1M tokens (docs.z.ai pricing read 2026-11-15) and the writer prices the call from it. The R8 check is unchanged (cost_usd > 0) and the r8 node is untouched.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24621-priced
  statement: A call to glm-5.3-flash on a customer's general-API key is priced from the declared catalogue and stored with a cost above zero, and a model no table prices stays unpriced.
  acceptance:
  - id: AC1
    statement: 'AC1: a glm-5.3-flash call on the byok-glm-general backend books a cost above zero from the declared table, and an undeclared model on it still books zero with cost basis unknown -- falsifier: uv run pytest tests/unit/delegation/test_omn24562_glm_53_flash_declared_price.py -q fails with the model_prices row removed from the catalogue'
  - id: AC2
    statement: 'AC2: the stored delegation row for a glm-5.3-flash call on byok-glm-general carries cost_usd above zero and an undeclared model stores NULL -- falsifier: uv run pytest tests/unit/delegation/test_omn24562_glm_53_flash_priced_cost_row.py -q fails at the merge base (base catalogue) and passes at the PR head'
  - id: AC3
    statement: 'AC3: integrated: on the dev runtime after the catalogue is installed there, the R8 organic row''s stored cost_usd is above zero -- falsifier: the R8 unit scenario row on the dev runtime still shows -organic_run_has_values after the installed run'
evidence_requirements:
- kind: tests
  description: The declared-price test, the priced-row composition test, the R8 node tests and the changed routing catalogue test.
  command: env -u PYTHONPATH uv run --frozen pytest tests/unit/delegation/test_omn24562_glm_53_flash_declared_price.py tests/unit/delegation/test_omn24562_glm_53_flash_priced_cost_row.py tests/unit/delegation/test_omn20154_glm_45_flash_byok_general_api.py tests/nodes/node_delegation_scenario_r8_effect -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24621-ac1-declared-price
  description: The declared-price writer tests, a priced model with cost above zero and an unpriced model that stays unpriced, plus the model_prices repeat validator.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/delegation/test_omn24562_glm_53_flash_declared_price.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24621-ac2-priced-cost-row
  description: Price, attempt, delegate-skill terminal and ModelDelegationEventProjectionRow composed for byok-glm-general. glm-5.3-flash stores cost_usd 0.00088285 at head and NULL with the base catalogue; an undeclared model stores NULL. Must fail at the merge base (checked on the lab with the base catalogue file) and pass at head.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/delegation/test_omn24562_glm_53_flash_priced_cost_row.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24621-ac3-integration-proof
  description: Hosted CI cannot reach a lab host, so only the local Done gate runs this unbound check. It runs scenario R8 once (manual, recorded to a file) at the sha on a lab host and fails while that record still shows -organic_run_has_values. It reads the R8 scenario result, not the unit tests, and it is not the dev runtime reading; that reading is taken after the catalogue is installed on the dev runtime.
  source: manual
  binds_ac:
  - AC3
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24621 --kind test -- sh -c 'uv run --frozen python -m omnimarket.nodes.node_delegation_scenario_r8_effect run --manual --record /tmp/r8_omn24621_record.json && ! grep -q -e "-organic_run_has_values" /tmp/r8_omn24621_record.json'
    cwd: .
