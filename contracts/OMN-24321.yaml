schema_version: 1.0.0
ticket_id: OMN-24321
title: A node binds a named node package into the interpreter without its start-up file
summary: node_package_bind_effect binds one omnimarket node's package into sys.modules with a namespace-package spec and without running the package __init__, so a caller that holds only pydantic (the landing controller's decision environment) imports the node's handlers and models. The source root and node name arrive in the request; a malformed node name or a missing node directory is refused with a typed reason and binds nothing. It replaces the bind that lived inside the landing decision bridge.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24321-package-bind
  statement: A named node package binds into the interpreter without running its package __init__, and a request that cannot bind is refused with a typed reason.
  acceptance:
  - id: AC1
    statement: 'AC1: the handler binds a node package whose __init__ raises, serving its handlers and its contract.yaml, and refuses a missing or malformed node name without binding anything -- falsifier: uv run --frozen pytest tests/nodes/node_package_bind_effect/test_handler_package_bind.py -q --no-cov (the control case shows the plain import raising)'
  - id: AC2
    statement: 'AC2: the golden chain ends in the run-completed event and the error chains end in one run-failed event with the reason, on the in-memory bus -- falsifier: uv run --frozen pytest tests/nodes/node_package_bind_effect -k chain -q --no-cov'
  - id: AC3
    statement: "AC3: integrated: the landing controller's decision bridge binds the decision package through this node and reports stale_fleet with only pydantic and pyyaml available -- falsifier: the bridge's own environment test (test_landing_decision_env.py in the controller's repository) on the pinned commit"
evidence_requirements:
- kind: tests
  description: The package bind node tests, handler, golden and error chains.
  command: uv run --frozen pytest tests/nodes/node_package_bind_effect -q --no-cov
