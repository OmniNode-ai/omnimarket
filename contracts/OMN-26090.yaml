---
schema_version: "1.0.0"
ticket_id: OMN-26090
title: "A dev-only command signs the two proof tenant tokens with the lab test key and writes them to the dev secret store"
summary: A dev-only effect node signs the two proof tenant tokens with the lab test key read from the dev secret store and writes each through the seed node, never printing a token or key value.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn26090-dev-proof-token-mint
    statement: A dev-only node mints the two proof tenant tokens into the dev secret store and refuses every other environment.
    acceptance:
      - id: AC1
        statement: "AC1: the command refuses to run when the resolved environment is anything but dev, before it reads the key or writes a secret -- falsifier: `uv run pytest -q -k dev_proof_token_mint_refuses_non_dev` with the environment set to stability, prod or unset fails the refusal case if the guard is removed"
      - id: AC2
        statement: "AC2: the command reads the lab test key from the secret store by name and the claims it signs are `tenant_id`, `tenant_slug` and audience `gateway-attach` for exactly the two tenants `cli-run-h051` and `cli-run-h201`, and a third tenant name is refused -- falsifier: `uv run pytest -q -k dev_proof_token_mint_claims` decoding each signed token with the test key's public half and asserting the claims, red if a claim or the tenant allowlist is changed"
      - id: AC3
        statement: "AC3: each token is written to the dev secret store only through `node_secret_seed_effect`, and neither stdout, stderr, logs nor the returned result carries a token or key value -- falsifier: `uv run pytest -q -k dev_proof_token_mint_never_prints` capturing all output with a canary token value and asserting it is absent, red if the command prints it"
      - id: AC4
        statement: "AC4: the tests were written red first against the pre-change tree and green after, and the PR body records both runs -- falsifier: `uv run pytest -q -k dev_proof_token_mint` run at the parent commit fails on the missing command and passes at the head"
      - id: AC5
        statement: "AC5: after the PR merges, the two tokens exist in the dev secret store by name and one MSG to door4-1950 or its successor names the two secret names without a value -- falsifier: a grep of the rolling work ledger file for `cli-run-h051` on a row of type MSG returns the row, and a read of the two names through the dev secret store's read path reports present"
evidence_requirements:
  - kind: tests
    description: Focused tests of the dev proof tenant token node.
    command: uv run pytest tests/nodes/node_dev_proof_tenant_token_effect -q --no-cov -k dev_proof_token_mint
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-omn26090-ac1
    description: "The guard refuses stability, prod, unset and a non-dev overlay with zero key reads and zero writes."
    source: manual
    binds_ac: [AC1]
    checks:
      - check_type: test_passes
        check_value: >-
          uv run pytest tests/nodes/node_dev_proof_tenant_token_effect -q --no-cov -k dev_proof_token_mint_refuses_non_dev
  - id: dod-omn26090-ac2
    description: "Each token decodes with the test key's public half to the declared claims, and a third tenant is refused."
    source: manual
    binds_ac: [AC2]
    checks:
      - check_type: test_passes
        check_value: >-
          uv run pytest tests/nodes/node_dev_proof_tenant_token_effect -q --no-cov -k dev_proof_token_mint_claims
  - id: dod-omn26090-ac3
    description: "A canary token and key never reach stdout, stderr, logs or the result, and the write goes through the seed node's handler over a held-name guard."
    source: manual
    binds_ac: [AC3]
    checks:
      - check_type: test_passes
        check_value: >-
          uv run pytest tests/nodes/node_dev_proof_tenant_token_effect -q --no-cov -k 'dev_proof_token_mint_never_prints or dev_proof_token_mint_seed_node'
  - id: dod-omn26090-ac4
    description: "The whole selector passes at the head; the red run at the parent commit is recorded in the pull request body."
    source: manual
    binds_ac: [AC4]
    checks:
      - check_type: test_passes
        check_value: >-
          uv run pytest tests/nodes/node_dev_proof_tenant_token_effect -q --no-cov -k dev_proof_token_mint
  - id: dod-omn26090-ac5
    description: "Minting on dev follows the merge; the focused contract test proves the node is registered and its overlay shape loads. The ledger MSG and the present read are separate operational evidence."
    source: manual
    binds_ac: [AC5]
    checks:
      - check_type: test_passes
        check_value: >-
          uv run pytest tests/nodes/node_dev_proof_tenant_token_effect -q --no-cov -k dev_proof_token_mint_contract
  - id: dod-omn26090-deploy-contract
    description: "Hosted deploy check exercises the node's refusal and mint paths without a live store."
    source: manual
    checks:
      - check_type: test_passes
        check_value: >-
          uv run pytest tests/nodes/node_dev_proof_tenant_token_effect -q --no-cov -k 'dev_proof_token_mint_refuses_non_dev or dev_proof_token_mint_claims'
  - id: dod-omn26090-integration-proof
    description: the node's focused tests run on a lab host at the pushed head; hosted CI cannot reach the lab, so only the local Done gate runs this unbound check
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-26090 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_dev_proof_tenant_token_effect -q --no-cov -k dev_proof_token_mint
