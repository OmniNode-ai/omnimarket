schema_version: 1.0.0
ticket_id: OMN-21507
title: 'T-V0a: every factory PR is proven on a pre-PR lab slot before it merges'
summary: The landing decision gains the lab-proof receipt row for a PR's exact head, the PR's cited tickets, the factory ticket manifest and the repository profiles as facts; a PR citing a factory task ticket
  is mergeable only with a PASS row for its head under its repository's profile with the profile's negative control recorded failing. No profile's enforce is set.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-lab-proof-merge-gate
  statement: A factory PR merges only on a lab-proof receipt that proves its exact head, and the decision stays pure.
  acceptance:
  - id: AC1
    statement: 'AC1: A factory PR is not mergeable when its receipt row is absent, FAIL, INCONCLUSIVE or for an older head, and the decision names the reason -- falsifier: four pytest cases'
  - id: AC2
    statement: 'AC2: A receipt whose negative control did not fail does not admit the merge -- falsifier: the pytest case with a control recorded as passing'
  - id: AC3
    statement: 'AC3: A PR that cites no factory task ticket is decided as today -- falsifier: the existing landing decision tests pass unchanged'
  - id: AC4
    statement: 'AC4: Lab step: one wave-0 PR proven in each of omnimarket and omnibase_infra, and one omnibase_core PR through `foundation_override`, with the receipt row ids pasted -- falsifier: each pasted
      row id resolves in `node_projection_lab_proof_receipts` to PASS for its head'
  - id: AC5
    statement: 'AC5: Configuration: the factory tickets are the T-Q0 manifest and the profiles are `config/lab_proof_profiles.yaml`, both supplied as facts; the node holds no ticket or profile id -- falsifier:
      the same facts decide differently under two fixture manifests'
  - id: AC6
    statement: 'AC6: Bindings: pure, because the facts come in -- falsifier: byte-identical results in process and through the local in-process entry of the parity harness (T-B2)'
evidence_requirements:
- kind: tests
  description: T-V0a tests.
  command: uv run pytest tests/unit/nodes/node_pr_landing_decision_compute/test_landing_decision_causes.py tests/unit/nodes/node_pr_landing_decision_compute/test_landing_decision_contract.py tests/unit/nodes/node_pr_landing_decision_compute/test_landing_decision_determinism.py tests/unit/nodes/node_pr_landing_decision_compute/test_landing_decision_guards.py tests/unit/nodes/node_pr_landing_decision_compute/test_landing_decision_merge_queue.py tests/unit/nodes/node_pr_landing_decision_compute/test_landing_decision_named_gates.py tests/unit/nodes/node_pr_landing_decision_compute/test_landing_decision_scenarios.py tests/unit/nodes/node_pr_landing_decision_compute/test_landing_decision_stale_cancelled.py -q --no-cov --tb=line
- kind: manual
  description: 'deploy: read the lab-proof models at this head from the public repository and run the lab-proof landing tests on a hosted runner.'
  command: uv run pytest tests/unit/nodes/node_pr_landing_decision_compute/test_landing_decision_lab_proof.py -q --no-cov --tb=line
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
