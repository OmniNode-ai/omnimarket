schema_version: 1.0.0
ticket_id: OMN-23539
title: The landing tick orchestrator publishes its compared events through the declared bus publisher
summary: >-
  The tick orchestrator's overlay gains publish_backend (inmemory by default, or redpanda). For redpanda, build_publisher in tick_sources returns BusTickPublisher (handlers/tick_bus_publisher.py), which opens the overlay's declared bus lane (or the lab broker the overlay names in its place) and publishes the compared and compare-failed events keyed by the tick; for inmemory it returns the in-memory publisher. run_once builds the publisher from the overlay unless one is injected. An overlay with publish_backend redpanda and no bus_lane or bootstrap_servers is refused. The dev broker grants for the two topics are omnibase_infra#5880 and are applied by the operator, not here. Stacked on omnimarket#5732, which holds the tick orchestrator.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn23539-tick-bus-publisher
    statement: The tick orchestrator's compared and compare-failed events go to the publisher the overlay selects, in-memory by default and the declared bus publisher for redpanda.
    acceptance:
      - id: AC2
        statement: "AC2: the tick orchestrator publishes its compared and compare-failed events through the declared bus publisher chosen by an overlay value, with in-memory as the default for tests, and a golden chain and an error chain test -- falsifier: the publisher selection test with the overlay value unset and set"
      - id: AC3
        statement: "AC3: integrated: after the operator applies the grants on the dev broker, the tick orchestrator running in observe mode on the floor host publishes a compared event that a reader on the dev bus lane reads back -- falsifier: the dev bus read of the compared topic after one tick"
evidence_requirements:
  - kind: tests
    description: The publisher selection, golden chain and error chain tests of the tick orchestrator.
    command: uv run --frozen pytest tests/nodes/node_pr_landing_tick_orchestrator/test_tick_bus_publisher.py tests/nodes/node_pr_landing_tick_orchestrator/test_runtime_tick.py -q -p no:cacheprovider
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
