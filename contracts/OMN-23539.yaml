    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/nodes/node_pr_landing_tick_orchestrator/test_tick_bus_publisher.py tests/nodes/node_pr_landing_tick_orchestrator/test_runtime_tick.py -q --no-cov -p no:randomly -p no:cacheprovider
        cwd: .
  - id: dod-omn23539-integration-hosted
    description: >-
      Integrated, hosted proxy for AC3: run_once under an overlay with publish_backend redpanda builds the bus publisher through the injected factory and publishes the compared events the handler produces, each on a topic of the contract's publish_topics. Without the run_once wiring the test fails (measured at the stacked base: 1 failed, 4 passed). The live dev bus read is the unbound local item below, because the hosted must-fail control can never run a local_done_gate item.
    source: manual
    binds_ac:
      - AC3
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/nodes/node_pr_landing_tick_orchestrator/test_tick_bus_publisher.py -q --no-cov -p no:randomly -p no:cacheprovider -k "run_once_publishes or redpanda_builds"
