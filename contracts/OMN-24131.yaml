schema_version: 1.0.0
ticket_id: OMN-24131
title: The lab machines also listen for work requests on the running system's message bus
summary: 'The GPU power caps node in the dev runtime sends its lab work unit on a bus the lab machines do not serve: the machines serve another bus, and the runtime container holds only its own broker login
  and no lane declaration file. This change lets the node''s overlay state the broker address directly (kafka_bootstrap, exactly one of it and bus_lane), so the runtime sends through its own address with
  its own login, and lets the serve unit installer declare an extra serve unit on another bus lane per host (lane_serves, default empty, own work directory), so each lab machine also serves lab work on
  the runtime''s lane. No credential is added to the runtime.'
is_seam_ticket: true
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24131-runtime-reaches-lab-work
  statement: The dev runtime's GPU power caps node reaches a lab machine's lab-work serve over the dev bus lane with no new credential.
  acceptance:
  - id: AC1
    statement: 'AC1: with the overlay naming a direct broker address and no lane, the GPU power caps node sends its lab work unit through that address, and an overlay naming both or neither is refused --
      falsifier: uv run pytest tests/unit/nodes/node_gpu_power_caps_effect -q -k direct_bootstrap fails at the merge base'
  - id: AC2
    statement: 'AC2: with a dev-lane serve unit declared in the serve units overlay, the installer renders a second environment file whose lab-work bus lane is that lane and changes nothing when the overlay
      declares none -- falsifier: uv run pytest tests/nodes/node_host_installer_serve_units -q -k dev_lane fails at the merge base'
  - id: AC3
    statement: 'AC3: seam tests hold the node''s direct address and the dev-lane serve unit to the lab work topics, and hold the dev broker rows of the lab host logins to the topics the lab work caller
      and serve use, and fail when a topic or a lane name is renamed in the fixture -- falsifier: uv run pytest tests/unit/nodes/node_gpu_power_caps_effect tests/nodes/node_host_installer_serve_units -q
      -k seam fails when a lab work topic is renamed in the fixture'
  - id: AC4
    statement: 'AC4: integrated: in the running dev runtime, one request for h201 and one for h202 returns one row per card, and nvidia-smi on both machines reads 450 W for the large card and 300 W for
      each of the other two cards -- falsifier: the node''s result row differs from the nvidia-smi reading, or the run refuses'
evidence_requirements:
- kind: tests
  description: The node and installer tests pass at the pushed head.
  command: uv run pytest tests/unit/nodes/node_gpu_power_caps_effect -q -n 0 --no-cov -p no:cacheprovider && uv run pytest tests/nodes/node_host_installer_serve_units -q -n 0 --no-cov -p no:cacheprovider
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
