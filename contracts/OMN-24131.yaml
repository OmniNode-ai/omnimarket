  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_host_installer_serve_units/test_host_serve_units_dev_lane.py -q -n 0 --no-cov -p no:cacheprovider
    cwd: .
- id: dod-omn24131-ac3
  description: 'AC3: the seam tests of the node and of the installer pass; the overlays repository''s seam tests hold the dev broker rows and the lane names (named in the overlays pull request).'
