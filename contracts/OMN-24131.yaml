  description: 'AC1: the runtime profile validates with a bootstrap and no lane, both or neither is refused, and the default sender opens the bus with lane None and the stated address; fails on the merge
    base (field unknown).'
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/nodes/node_gpu_power_caps_effect/test_gpu_power_caps_direct_bootstrap.py -q -n 0 --no-cov -p no:cacheprovider
    cwd: .
- id: dod-omn24131-ac2
