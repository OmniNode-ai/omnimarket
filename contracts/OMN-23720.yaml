schema_version: "1.0.0"
ticket_id: OMN-23720
title: "Install the code map and deadline check drill jobs from the main code"
summary: >-
  The code graph and seam deadline drills, which write the error event of pieces 1 and 3 twice a day, exist only on
  an unmerged branch, so no installer on the main code renders them. Each node's schedule contract gains a drill
  block, rendered, enabled and removed by the same schedule install and uninstall as its main unit; the code graph
  drill is the contract's drill_schedule block selected with --unit drill and counts its deliberate exit 1 as success.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn23720-drill-units
    statement: Both nodes install their drill unit from the contract, beside the main unit.
    acceptance:
      - id: AC1
        statement: 'AC1: the code graph and seam deadline schedule contracts each declare a drill unit that schedule install renders and enables beside the main unit, and schedule uninstall removes -- falsifier: pytest tests/nodes/node_code_graph_effect/test_code_graph_schedule.py tests/nodes/node_seam_deadline_probe_effect/test_seam_deadline_schedule.py fails when the drill block is removed from either contract'
      - id: AC2
        statement: 'AC2: the rendered code graph drill service counts its deliberate exit 1 as success and the nightly and hourly services render unchanged -- falsifier: the rendered nightly text gains a SuccessExitStatus line, or the drill text loses it, and test_the_nightly_schedule_has_no_success_exit_status or test_the_drill_unit_renders_its_timer_and_service fails'
      - id: AC3
        statement: 'AC3: integrated: on h053 the code graph drill and seam deadline drill units, installed from the merged main code, show the declared overlays directory in systemctl --user cat and one run of each writes a ledger row with drill=yes -- falsifier: systemctl --user list-timers on h053 lacks onex-code-graph-drill.timer or onex-seam-deadline-drill.timer after install'
evidence_requirements:
  - kind: tests
    description: The two nodes' schedule tests.
    command: uv run --frozen pytest tests/nodes/node_code_graph_effect/test_code_graph_schedule.py tests/nodes/node_seam_deadline_probe_effect/test_seam_deadline_schedule.py -q --no-cov
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-omn23720-tests
    description: The drill schedule tests pass, including the cases that fail on the dev head without the drill blocks.
    source: manual
    execution_scope: hosted_and_local
    binds_ac: [AC1, AC2]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/nodes/node_code_graph_effect/test_code_graph_schedule.py tests/nodes/node_seam_deadline_probe_effect/test_seam_deadline_schedule.py -q --no-cov
        cwd: .
  - id: dod-omn23720-install-enables-drill-timers
    description: The install tests of both nodes enable the drill timers, the hosted-runnable part of AC3; the lab host readback is the unbound integration-proof item below.
    source: manual
    execution_scope: hosted_and_local
    binds_ac: [AC3]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/nodes/node_code_graph_effect/test_code_graph_schedule.py::test_the_drill_install_enables_its_timer_and_uninstall_removes_it tests/nodes/node_seam_deadline_probe_effect/test_seam_deadline_schedule.py -q --no-cov
        cwd: .
  - id: dod-omn23720-integration-proof
    description: The drill units installed from the branch on a lab host run once and write a drill=yes row; hosted CI cannot reach the lab host, so only the local Done gate runs this unbound check, and the read is in the pull request comment that names the head.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: 'onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23720 --kind test -- uv run --frozen pytest tests/nodes/node_code_graph_effect/test_code_graph_schedule.py -q --no-cov'
        cwd: .
