schema_version: 1.0.0
ticket_id: OMN-26648
title: A worktree reconcile run that removes needs a claim read that succeeded
summary: node_worktree_reconcile_effect keeps every tree and reports a probe failure when a run that removes has no declared ledger_path, an unreadable ledger, a ledger with no dated row or one whose newest row is older than the policy's claims_max_age_hours. Read on h202 on 2026-11-24 at 15:26:39Z, the tick removed two trees of lane taskset-1540 while its CLAIM (15:01:03Z) was open, because the host overlay declares no ledger_path and the adapter held an empty claim set.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn26648-reconcile-removal-requires-a-claim-read
  statement: A reconcile run that removes reads claims successfully first, and a failed or empty-by-error read keeps every tree.
  acceptance:
  - id: AC4
    statement: 'AC4: a run with execute true and no ledger_path, an unreadable ledger, a ledger with no dated row or a ledger whose newest row is past claims_max_age_hours removes no tree and counts a probe failure, while a fresh ledger that names no claim still removes -- falsifier: uv run pytest tests/test_worktree_reconcile_claim_read.py -q fails on the adapter before the change'
evidence_requirements:
- kind: tests
  description: The reconcile node's focused tests.
  command: uv run pytest tests/test_worktree_reconcile_claim_read.py tests/test_worktree_reconcile_effect.py -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn26648-reconcile-claim-read
  description: A merged, clean tree is kept when the claim read is absent, unreadable or stale and removed when the ledger is fresh and names no claim; the tests fail on the adapter before the change.
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/test_worktree_reconcile_claim_read.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn26648-integration-proof
  description: Run the claim read tests on a lab host at the pushed head, through the lab work runner, so the change runs on a host with the real git and process surfaces. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-26648 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/test_worktree_reconcile_claim_read.py -q --no-cov
    cwd: .
