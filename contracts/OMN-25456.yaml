schema_version: 1.0.0
ticket_id: OMN-25456
title: node_lab_ssh_probe_compute declares a bus route so a demand can reach it
summary: onex run-node refused node_lab_ssh_probe_compute because its contract declared no event_bus.subscribe_topics, so no demand could reach the merged node on the dev runtime. The contract now declares one command topic, one terminal event topic, the runtime profile and the runtime principal's broker grants.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn25456-bus-route
  statement: The lab ssh probe node declares a command topic that a demand can be sent to and a terminal event it answers on, with the broker grants the runtime principal needs for both.
  acceptance:
  - id: AC1
    statement: 'AC1: the packaged contract declares the command topic as its subscribe topic and runtime command topic, and the terminal event as its publish topic -- falsifier: pytest tests/nodes/node_lab_ssh_probe_compute -q fails when either topic is removed from the contract'
  - id: AC2
    statement: 'AC2: the contract grants the runtime principal read and describe on the command topic and write and describe on the terminal event -- falsifier: pytest tests/nodes/node_lab_ssh_probe_compute/test_bus_route_lab_ssh_probe.py -q fails when a grant is removed'
evidence_requirements:
- kind: tests
  description: The lab ssh probe node tests pass.
  command: uv run --frozen pytest tests/nodes/node_lab_ssh_probe_compute -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn25456-ac1
  description: The golden chain test reads the packaged contract and asserts the command topic, the terminal event and that the terminal event is externally consumed; at the merge base the subscribe list is empty and the test fails.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_lab_ssh_probe_compute/test_golden_chain_lab_ssh_probe.py -k contract_declares -q --no-cov
    cwd: .
- id: dod-omn25456-ac2
  description: The bus route test asserts the four broker grants the runtime principal needs; at the merge base the contract has no grants and the test fails.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_lab_ssh_probe_compute/test_bus_route_lab_ssh_probe.py -q --no-cov
    cwd: .
- id: dod-omn25456-integration-proof
  description: Run this pull request's own check on a lab host at the pushed head; hosted CI cannot reach the lab, so only the local Done gate runs this unbound check. The run of one demand through the dev runtime is the pull request's Lab line.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-25456 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_lab_ssh_probe_compute -q --no-cov
    cwd: .
