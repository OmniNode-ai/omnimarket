schema_version: 1.0.0
ticket_id: OMN-21035
title: Observe dry-run build-loop start reaches COMPLETED
summary: The build loop orchestrator handle() takes its start model as request so RuntimeLocal binds it, and the overseer verifier-completed route has its own fact model and handler that starts no cycle.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-observe-dry-run-start-completes
    statement: An observe dry_run start command run through RuntimeLocal ends completed, and the verifier-completed route consumes its fact without starting a cycle.
    acceptance:
      - id: AC1
        statement: 'AC1: an observe dry_run start reaches COMPLETED with one orchestrator result and no side-effect sub-handler calls -- falsifier: tests/unit/nodes/node_build_loop_orchestrator/test_observe_dry_run_start.py fails on the previous handler signature and contract (uv run pytest on that file)'
evidence_requirements:
  - kind: tests
    description: Three tests for the observe dry-run start, the verifier-completed route and the no-side-effects path.
    command: uv run pytest tests/unit/nodes/node_build_loop_orchestrator/test_observe_dry_run_start.py -q
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn21035-ac1-observe-dry-run-start
    description: The observe dry_run start reaches completed through RuntimeLocal and the verifier-completed route returns None.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/nodes/node_build_loop_orchestrator/test_observe_dry_run_start.py -q
    binds_ac:
      - AC1
  - id: dod-omn21035-deploy-probe
    description: Deploy probe. The build loop orchestrator handler at the checked-out commit passes the start model to _to_loop_command under the name request, which RuntimeLocal binds; the probe reads the handler from GitHub at that commit and exits nonzero on a tree without the rename, so it fails at the merge base.
    source: manual
    checks:
      - check_type: command
        check_value: "gh api \"repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_build_loop_orchestrator/handlers/handler_build_loop_orchestrator.py?ref=$(git rev-parse HEAD)\" --jq .content | base64 -d | grep -c '^        loop_command = self._to_loop_command(request)$'"
