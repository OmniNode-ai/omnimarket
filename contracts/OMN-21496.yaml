schema_version: 1.0.0
ticket_id: OMN-21496
title: 'T2.6: check-only pre-commit hooks in omnimarket'
summary: No pre-commit hook of omnimarket writes a file or a commit message. The end-of-file-fixer and
  strip-ai-coauthor-trailer hooks are removed and the repository consumes the check-only hook ids check-hook-writes,
  commit-hygiene and commit-hygiene-message from omnibase_core at a dev-merge tag. ruff-format runs with --check and
  ruff with --no-fix. The repository holds no local definition of these rules and no test that pins the config text;
  one canary test runs the consumed hooks on a throwaway tree.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-t26-hooks-check-only
  statement: No pre-commit hook of this repository writes a file or a commit message; each refuses and leaves the bytes alone.
  acceptance:
  - id: AC1
    statement: 'AC1: No hook of omnimarket rewrites a file or a commit message: each Appendix 1 REWRITES FILES row of this repository is a check that refuses -- falsifier: pytest cases over the converted hook config and a git grep of the config for hooks whose entry writes'
  - id: AC2
    statement: 'AC2: A canary commit with an unformatted file and an AI co-author trailer is refused and the working tree is byte-identical after the hook run -- falsifier: pytest case that hashes the tree before and after the hook run, plus pre-commit run --files on the canary commit'
evidence_requirements:
- kind: tests
  description: Canary test of the consumed commit hooks.
  command: uv run pytest tests/ci/test_check_only_hooks_omn21496.py -q --no-cov --tb=line
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn21496-ac1-hook-writes
  description: AC1 runs omnibase_core's check-hook-writes over the committed pre-commit config through pre-commit; it refuses a hook whose entry or args rewrite files, so a pass means no hook of this repository writes.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: command
    check_value: uv run pre-commit run check-hook-writes --files .pre-commit-config.yaml
    cwd: ${OMNI_HOME}/omnimarket
- id: dod-omn21496-ac1-no-local-definition
  description: AC1 reads the committed config for the removed local hook ids and for the consumed core ids; the repository holds no local definition of the end-of-file, co-author trailer or tmp/ rules.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: command
    check_value: |
      set -eu;
      grep -q 'id: check-hook-writes' .pre-commit-config.yaml;
      grep -q 'id: commit-hygiene$' .pre-commit-config.yaml;
      grep -q 'id: commit-hygiene-message' .pre-commit-config.yaml;
      ! grep -qE 'id: (end-of-file-fixer|end-of-file-check|strip-ai-coauthor-trailer|refuse-ai-coauthor-trailer)' .pre-commit-config.yaml
    cwd: ${OMNI_HOME}/omnimarket
- id: dod-omn21496-ac2-canary
  description: AC2 stages a file without a final newline and a tmp/ file and writes a commit message with an AI co-author trailer in a throwaway git tree, runs the consumed hooks through pre-commit with the pin from the committed config, and checks each is refused and that the sha256 of every file of the tree is the same before and after each run; a clean file passes as the positive control.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/ci/test_check_only_hooks_omn21496.py -q --no-cov --tb=line
    cwd: ${OMNI_HOME}/omnimarket
- id: dod-omn21496-ac2-pre-commit-run
  description: AC2 runs the consumed commit-hygiene hook on the changed files as a positive control. The canary item separately stages invalid files and an AI co-author trailer and verifies refusal without writes. This focused command fits the hosted verifier check budget.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: command
    check_value: uv run pre-commit run commit-hygiene --files .pre-commit-config.yaml .github/workflows/ci.yml contracts/OMN-21496.yaml tests/ci/test_check_only_hooks_omn21496.py
    cwd: ${OMNI_HOME}/omnimarket
- id: dod-omn21496-deploy-config
  description: 'Hosted deploy readback: fetch the hook config and build-loop source from the public repository at the exact checked-out commit. Refuse a config without the consumed core hooks, or a build loop that still pre-runs the removed ruff hooks. The direct ruff formatter and fixer must remain.'
  source: manual
  checks:
  - check_type: command
    check_value: |
      set -eu;
      readback_dir=$(mktemp -d);
      trap 'rm -rf "$readback_dir"' EXIT;
      head_sha=$(git rev-parse HEAD);
      curl --fail --silent --show-error --location --max-time 60 "https://raw.githubusercontent.com/OmniNode-ai/omnimarket/$head_sha/.pre-commit-config.yaml" -o "$readback_dir/hooks.yaml";
      curl --fail --silent --show-error --location --max-time 60 "https://raw.githubusercontent.com/OmniNode-ai/omnimarket/$head_sha/src/omnimarket/nodes/node_build_loop_orchestrator/assemble_live.py" -o "$readback_dir/assemble_live.py";
      grep -q 'rev: dev-20261029044430-3f33be0d5364' "$readback_dir/hooks.yaml";
      grep -q 'id: commit-hygiene-message' "$readback_dir/hooks.yaml";
      ! grep -qE 'id: (end-of-file-fixer|strip-ai-coauthor-trailer)' "$readback_dir/hooks.yaml" || exit 1;
      grep -q 'class LiveBuildDispatchHandler:' "$readback_dir/assemble_live.py";
      grep -Fq 'ruff_bin, "format"' "$readback_dir/assemble_live.py";
      grep -Fq 'ruff_bin, "check", "--fix"' "$readback_dir/assemble_live.py";
      ! grep -q 'pre_commit_bin' "$readback_dir/assemble_live.py";
    cwd: ${OMNI_HOME}/omnimarket
  binds_ac:
  - AC1
