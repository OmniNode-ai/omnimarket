schema_version: 1.0.0
ticket_id: OMN-22209
title: The code_generation quality gate passes an answer with stated_test_passes undetermined, so cheapest_first never climbs on a hard task that fails thousands of reference cases
summary: The class rubric contract declares, per class, the criteria that must be determined for a PASS verdict, and names stated_test_passes for code_generation. The rubric compute returns UNDETERMINED, naming the required criterion, when one stays undetermined and none failed, so a code_generation answer with no supplied test result is no longer a rubric PASS. On a class whose false-pass line is MET the existing measured-rubric step turns that verdict into a refusal that recommends fallback, so the chain climbs. Other classes are unchanged.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn22209-undetermined-tests-not-pass
    statement: A code_generation answer whose stated_test_passes criterion is undetermined is not a rubric PASS.
    acceptance:
      - id: AC1
        statement: 'AC1: a code_generation answer whose stated_test_passes criterion is undetermined is not a PASS: the gate returns a typed non-pass outcome that lets the chain climb -- falsifier: uv run pytest tests/unit/delegation/test_code_generation_gate_undetermined_tests.py -q -k undetermined_not_pass, a stub answer with stated_test_passes undetermined, which fails today with rubric PASS'
      - id: AC2
        statement: 'AC2: a regression test built from the recorded run e7ceb3b5 (rubric PASS 0.733, 5188 of 34485 reference cases failed, scrubbed) fails on the current gate and passes on the fix -- falsifier: uv run pytest tests/unit/delegation/test_code_generation_gate_undetermined_tests.py -q -k receipt_e7ceb3b5'
evidence_requirements:
  - kind: tests
    description: The focused falsifier file runs at the pushed head.
    command: uv run pytest tests/unit/delegation/test_code_generation_gate_undetermined_tests.py -q --no-cov
