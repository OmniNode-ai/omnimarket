schema_version: 1.0.0
ticket_id: OMN-22197
title: A thing that stops moving alerts the operator, one compute node judges each watched thing against the time budget of its phase
summary: node_work_progress_compute gains a second operation, judge_work_episodes. It judges watched things of four kinds (lane, pr, round, tick) against the budget of the phase each is in, with the open episodes the caller carries. A new crossing yields one alert record in the input model of node_lab_alarm_deliver_effect; the same crossing judged again yields none; a thing that moved, changed phase or left a complete reading closes its episode. Scheduled round heartbeats enter as the schedule run events every scheduled job node publishes. The CORRECTION row that links the mechanism to the ruling is written by the orchestrator after the merge and is not claimed here.
