schema_version: 1.0.0
ticket_id: OMN-21958
title: The lab fill, the remote-lane placement decision and the worker-engine choice refuse a dispatch into a stopped class through stop_gate
summary: The fill, the placement decision and the worker-engine choice take the open stops, the andon_stop overlay policy and now as supplied facts and ask stop_gate in process; every class stays in observe, so installing the gate refuses nothing until a class is moved to enforce.
is_seam_ticket: false
interface_change: true
interfaces_touched:
- public_api
requirements:
- id: req-omn21958
  statement: A dispatch into a stopped class is refused by the three dispatching nodes through the one stop_gate rule, with the class mode from the andon_stop overlay and the exemptions bound by the dispatcher.
  acceptance:
  - id: AC1
    statement: 'AC1: the fill, the placement decision and the worker-engine choice each call stop_gate in process; with a stop open in an enforce class the fill selects no lane for the engine, the placement decision refuses and names the stop and its swarm lane, and the worker-engine choice never returns a stopped engine -- falsifier: uv run pytest -k stop_gate -q in omnimarket over the three nodes'
  - id: AC2
    statement: 'AC2: the swarm lane, a lane that fixes an open PR named from the watcher state, a read-only lane and an armed merge are admitted, and a forged, unrelated or expired exemption is refused -- falsifier: uv run pytest -k stop_gate_exemption -q'
  - id: AC3
    statement: 'AC3: the class mode comes from the andon_stop overlay and the stopped engines from the supplied facts, with no literal in any handler, and an absent overlay key refuses naming the key; the same stop refuses under enforce and admits under observe -- falsifier: uv run pytest -k stop_gate_config -q at both modes'
  - id: AC4
    statement: 'AC4: the three nodes give identical decisions on the in-memory overlay and on the Redpanda overlay -- falsifier: uv run pytest -k stop_gate_parity -q with the bus overlay selected'
  - id: AC5
    statement: 'AC5: a stopped key refuses a real onex_remote_lane.py run dry-run with the stop named and places nothing, and the same run with no stop places -- falsifier: the printed refusal line and exit code of the dry-run with a fixture stop, and the passing run without it'
  - id: AC6
    statement: 'AC6: the lane reports whether the ANDON HOLD rows of 2026-11-02T02:31:20Z and 02:31:37Z open a stop in the reducer or nothing reads them -- falsifier: the lane''s TERMINAL names the code path read and the exception queue open_stops output'
evidence_requirements:
- kind: tests
  description: The cited tests pass at the PR head.
  command: uv run pytest -k stop_gate -q tests/nodes
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
