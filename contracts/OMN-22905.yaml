schema_version: 1.0.0
ticket_id: OMN-22905
title: "A drain verb and an idle-only runner stop exist as nodes with a failing control, so a host leaves placement by a command and not by a data pull request"
summary: "Rebuild piece 2 (hosts and capacity) lacked two automations the host windows need (plan 7.4): a drain verb and an idle-only runner stop. The new node node_host_drain_effect sets one host draining on a store the overlay picks (in memory, a durable file, or a compacted Redpanda topic), the lab placement judge refuses a draining host, running lanes are counted and left to finish, and a runner is stopped only when its process table shows no worker. Both verbs emit a golden and an error chain event under one correlation id on the piece 2 floor row."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn22905-drain-and-idle-stop
  statement: "A drain command takes a host out of placement without stopping its running lanes, and the runner stop refuses a runner that holds a job, each with a golden and an error chain event under one correlation id."
  acceptance:
  - id: AC1
    statement: 'AC1: a drain command for one host sets its placement to draining on the bus, new lanes are refused for it, running lanes finish, and a test shows a start on a draining host refused -- falsifier: uv run pytest tests/unit/nodes/node_host_drain_effect -q'
  - id: AC2
    statement: 'AC2: the idle-only runner stop stops a runner only when it holds no job, and a test with a busy runner reads the stop refused -- falsifier: uv run pytest tests/unit/nodes/node_host_drain_effect -q -k idle_only'
  - id: AC3
    statement: 'AC3: both emit a golden and an error chain event under one correlation id -- falsifier: uv run pytest tests/unit/nodes/node_host_drain_effect -q -k chain'
evidence_requirements:
- kind: tests
  description: "Drain, idle-only runner stop and chain event tests, with the injected breaks that make the readings fail"
  command: uv run --frozen pytest tests/unit/nodes/node_host_drain_effect -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn22905-tests
  description: "Drain, start refused on a draining host, idle-only stop refused for a busy runner, and golden and error chain events under one correlation id pass."
  source: manual
  binds_ac:
  - AC1
  - AC2
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/nodes/node_host_drain_effect tests/nodes/node_lab_placement_compute -q --no-cov
    cwd: .
- id: dod-omn22905-integration-proof
  description: Run this pull request's own tests on a lab host at the pushed head. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-22905 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/nodes/node_host_drain_effect -q --no-cov
    cwd: .
