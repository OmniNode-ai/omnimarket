schema_version: 1.0.0
ticket_id: OMN-24112
title: The board publisher's install carries the Valkey password by secret store reference
summary: The board's source read cache reaches a Valkey that has a password, and a launchd unit cannot be given that password safely (a dry run prints the rendered unit, and launchd does not inherit the installing shell's environment).
  The installer's factory-floor-publish unit takes one new optional input, source_cache_valkey_password_ref, a secret store path of the form secret://onex/<folder>/<KEY> that names where the password is kept, and persists it as ONEX_SOURCE_CACHE_VALKEY_PASSWORD_REF; no password is a request input.
  The cache overlay's valkey block gains an optional password_ref_env naming that variable; the cache overlay also gains an optional secret_store block (the shared store addressing), and the cache's reader factory reads the password through the secret store reader the delegation scenarios already use, built from that block (the machine's default route names a LAN address the plain-http rule refuses), and a reference that does not resolve leaves the cache off for the run with a typed reason (the variable name only) so every step reads its sources as before.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24112-password-reference
  statement: The board publisher's install carries the Valkey password only as a secret store reference, and the cache reads the password through it, failing safe to the uncached read.
  acceptance:
  - id: AC1
    statement: 'AC1: an install request that names the Valkey password by its secret store reference renders a unit that holds the reference and no password, and a request with a reference that is not a store path is refused -- falsifier: uv run pytest tests/nodes/node_host_installer_registry_units/test_floor_publish_source_cache_password_ref.py -q -n 0 --no-cov fails without the change'
  - id: AC2
    statement: 'AC2: the cache reads the password through the secret store reference and a store that cannot answer leaves the cache off for the run without failing a step -- falsifier: uv run pytest tests/nodes/node_source_read_cache_effect/test_valkey_password_ref.py -q -n 0 --no-cov fails without the change'
  - id: AC3
    statement: 'AC3: integrated: on the publishing Mac after install, the second cycle''s source-cache receipt for mvp_launch_reads and beta_board names the Valkey backend with hits above zero and no disabled reason, and the installed unit and the receipt hold no password -- falsifier: a receipt whose disabled_reason is set or whose backend is unavailable, or a password found in the unit or receipt, fails this criterion'
