schema_version: 1.0.0
ticket_id: OMN-23085
title: 'Join J4 passes: the J4 join test runs on a schedule and the floor reads its row as the piece 4 and piece 5 chains'
summary: J4 (piece 4 overlays to piece 5 secrets) read broken on the served floor. The floor named 8 piece 4 failure chains of the overlay drift reading that no piece 5 node answered, and held no golden event for J4 because the J4 join test (OMN-22912) had no caller. This change gives the J4 join test its own hourly systemd user unit (join_j4 in the node contract, installed only where the overlay root holds the join overlay), and the floor overlay's piece_events read the row that run writes as the piece 4 consumer chain and the piece 5 scan chain under one correlation id. A leaking consumer is the failing control; it never reads golden and reads broken past the chain deadline.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23085-join-j4
  statement: The J4 join test runs on a schedule on a lab host against the real dev store and the floor reads its row as a J4 golden event; a consumer that leaks reads the join red.
  acceptance:
  - id: AC1
    statement: 'AC1: join J4 reads PASS on the served floor from a real run, with a failing control that breaks the join -- falsifier: the floor''s piece 4 joins entry'
