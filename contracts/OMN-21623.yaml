---
schema_version: "1.0.0"
ticket_id: "OMN-21623"
title: "Burn-down of the contracts_and_di literal_timeout findings of omnimarket, slice A: sixteen nodes declare their timeouts in their contract"
summary: "Sixteen node packages (node_ab_compare_orchestrator through node_captured_secret_store_effect, alphabetically, without node_build_loop_orchestrator and node_capture_item_identity_effect, whose hook module may import only the standard library) held 29 timeout, interval, delay, backoff and TTL literals in code. Each value is now declared in its node's contract.yaml under timeouts (the three ADR nodes read the config entry their contract already declared) and is read through the shared omnimarket.handlers.node_timeouts_reader adapter or injected through the constructor. The contracts_and_di check over src/omnimarket and scripts reports 1575 findings before the slice; no literal_timeout finding remains in the sixteen node directories."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-omn21623-node-timeouts-a"
    statement: |-
      The sixteen nodes hold no timeout, interval, delay, backoff or TTL literal in code. Every duration is declared in the node contract with the value it held before, a name the contract does not declare stops the node, and an injected duration wins over the declared one.
    acceptance:
      - id: "AC6"
        statement: "AC6: the contracts_and_di check reports no literal_timeout finding in the sixteen node directories of the slice -- falsifier: the command of dod-omn21623-timeouts-check-clean below exits nonzero when a timeout literal returns to any of them"
      - id: "AC7"
        statement: "AC7: every node of the slice declares its durations in its contract.yaml with the value its code held before -- falsifier: uv run pytest tests/test_node_timeouts_contract.py -k declares_every_duration fails when a declared value or name differs from the table"
      - id: "AC8"
        statement: "AC8: a contract with no timeouts section, or a name it does not declare, refuses instead of supplying a value -- falsifier: uv run pytest tests/test_node_timeouts_contract.py -k 'undeclared or without' fails when a fallback value returns"
      - id: "AC9"
        statement: "AC9: constructor defaults and module constants come from the contract and an injected duration wins -- falsifier: uv run pytest tests/test_node_timeouts_contract.py -k 'constructor or module_constants or injected' fails when a literal default returns"
  - id: "req-omn21623-github-web-origin"
    statement: |-
      The GitHub web origin is declared once, in configs/service_endpoints.yaml, and the resolver fails closed when the key is missing or empty. The ten modules of the slice build their GitHub URLs from the resolver and hold no literal of the origin in code, so the contracts_and_di check reports no literal_url finding on any of them.
    acceptance:
      - id: "AC1"
        statement: "AC1: configs/service_endpoints.yaml declares github.web_url and service_endpoint_url resolves it -- falsifier: uv run pytest tests/test_service_endpoints_contract.py -k github_web_url -q --no-cov"
      - id: "AC2"
        statement: "AC2: none of the ten modules of the slice holds the GitHub web origin as a string constant in code -- falsifier: uv run pytest tests/test_service_endpoints_contract.py -k TestGithubWebOriginIsResolved -q --no-cov"
      - id: "AC3"
        statement: "AC3: the contracts_and_di check reports no literal_url finding on the files of the slice -- falsifier: the command of dod-omn21623-check-clean below"
  - id: "req-omn21623-runtime-path-authority"
    statement: |-
      A node that falls back to a filesystem location reads it from the runtime-path authority by reference; an unknown reference fails at the call, and the previous values are unchanged.
    acceptance:
      - id: "AC4"
        statement: "AC4: configs/runtime_paths.yaml holds each fallback location and handlers/runtime_paths.py resolves it by dotted reference, failing closed on a missing file, key or wrong shape -- falsifier: uv run pytest tests/unit/handlers/test_runtime_paths.py -q --no-cov"
      - id: "AC5"
        statement: "AC5: the contracts_and_di check reports no literal_path finding on the modules of the slice -- falsifier: the command of dod-omn21623-paths-clean below"
evidence_requirements:
  - kind: "tests"
    description: "The contract timeout tests and the existing tests of the touched nodes pass."
    command: "uv run pytest tests/test_node_timeouts_contract.py -q --no-cov"
  - kind: "tests"
    description: "The endpoint authority tests pass."
    command: "uv run pytest tests/test_service_endpoints_contract.py -q --no-cov"
  - kind: "tests"
    description: "The authority tests and the tests of the touched nodes pass."
    command: "uv run pytest tests/unit/handlers/test_runtime_paths.py -q --no-cov"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn21623-timeouts-contract-tests"
    description: "Declared values, refusals, contract-sourced defaults and injection all behave as stated."
    source: "manual"
    binds_ac: ["AC7", "AC8", "AC9"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/test_node_timeouts_contract.py -q --no-cov"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn21623-timeouts-check-clean"
    description: "The pinned contracts_and_di validator scans all sixteen node directories; its structured findings contain no literal_timeout rule. Import, scan and path errors fail the probe."
    source: "manual"
    binds_ac: ["AC6"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/test_node_timeouts_contract.py -k slice_has_no_literal_timeout_findings -q --no-cov"
        cwd: "${OMNI_HOME}/omnimarket"
      - check_type: "command"
        check_value: |-
          uv run --frozen python -c '
          from pathlib import Path
          from omnibase_core.validation.validator_contracts_and_di import ValidatorContractsAndDi
          names = "node_ab_compare_orchestrator node_adr_decision_extraction_llm_effect node_adr_extraction_grader_llm_effect node_adr_segmentation_llm_effect node_antipattern_index_effect node_antipattern_match_effect node_architecture_graph_populate_effect node_auto_merge_effect node_automation_liveness_deadman_effect node_automation_liveness_watchdog_compute node_automation_liveness_watchdog_effect node_automation_run_observer_effect node_baseline_capture node_beacon_trace_capture_effect node_canonical_clone_refresh_effect node_captured_secret_store_effect".split()
          paths = [Path("src/omnimarket/nodes") / name for name in names]
          assert all(path.is_dir() for path in paths), "a target node is missing"
          result = ValidatorContractsAndDi().validate(paths)
          assert result.metadata.files_processed >= len(paths), "the validator did not scan the targets"
          findings = [issue for issue in result.issues if issue.rule_name == "literal_timeout"]
          print(f"files_processed={result.metadata.files_processed}; literal_timeout={len(findings)}")
          assert not findings, findings
          '
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn21623-deploy-timeouts-source-readback"
    description: |-
      Hosted-runner container readback: execute the timeout loader against this tree in an
      isolated Python container with a read-only source mount. Assert the contract-declared
      auto-merge poll interval and secret-store timeout and the refusal of an undeclared name.
      Missing code, missing declarations and changed values fail the running container.
      This exercises the composition adapter; it does not assert a fleet rollout.
    source: "manual"
    checks:
      - check_type: "command"
        check_value: |-
          docker run --rm -e PYTHONDONTWRITEBYTECODE=1 -v "$PWD/src:/product:ro" -w /tmp python:3.12-bookworm sh -ec '
          python -m pip install --disable-pip-version-check --quiet pydantic==2.13.5 PyYAML==6.0.3
          PYTHONPATH=/product python - <<"PY"
          from unittest import TestCase
          from omnimarket.handlers.node_timeouts_reader import load_node_timeouts
          poll = load_node_timeouts("node_auto_merge_effect").get("poll_interval_s")
          store = load_node_timeouts("node_captured_secret_store_effect").get("store_call_timeout_seconds")
          assert poll == 60, poll
          assert store == 5.0, store
          TestCase().assertRaises(KeyError, load_node_timeouts("node_auto_merge_effect").get, "undeclared")
          print(dict(poll_interval_s=poll, store_call_timeout_seconds=store, undeclared="refused"))
          PY
          '
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn21623-endpoint-authority"
    description: "The endpoint authority exposes the web origin and every slice module resolves it instead of spelling it."
    source: "manual"
    binds_ac: ["AC1", "AC2"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/test_service_endpoints_contract.py -q --no-cov"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn21623-check-clean"
    description: "The contracts_and_di check over the ten slice modules reports no literal_url finding."
    source: "manual"
    binds_ac: ["AC3"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/test_service_endpoints_contract.py -k TestGithubWebOriginIsResolved -q --no-cov"
        cwd: "."
      - check_type: "command"
        check_value: |-
          uv run --frozen python - <<'PY'
          from pathlib import Path
          from omnibase_core.validation.validator_contracts_and_di import ValidatorContractsAndDi

          paths = [
              Path("src/omnimarket/nodes/node_contractor_integration_note_effect/services/note_composer.py"),
              Path("src/omnimarket/nodes/node_git_query_mirror_effect/git_mirror.py"),
              Path("src/omnimarket/nodes/node_lab_work_unit_effect/protocols/local_shell_work_runner.py"),
              Path("src/omnimarket/nodes/node_linear_triage/services/local_github_pr_reads.py"),
              Path("src/omnimarket/nodes/node_local_dashboard_serve_effect/bundle.py"),
              Path("src/omnimarket/nodes/node_pr_head_stage_compute/handlers/handler_pr_head_stage.py"),
              Path("src/omnimarket/nodes/node_push_validation_effect/protocols/ephemeral_container_focused_run_subprocess.py"),
              Path("src/omnimarket/nodes/node_push_validation_effect/protocols/gate_runner_suite_evaluation_subprocess.py"),
              Path("src/omnimarket/nodes/node_push_validation_effect/protocols/git_push_validation_subprocess.py"),
              Path("src/omnimarket/nodes/node_remote_lane_effect/handlers/handler_remote_lane_ref.py"),
          ]
          assert all(path.is_file() for path in paths), "a slice module is missing"
          validator = ValidatorContractsAndDi()
          assert any(rule.rule_id == "literal_url" and rule.enabled for rule in validator.contract.rules), "literal_url rule is not enabled"
          result = validator.validate(paths)
          assert result.metadata is not None and result.metadata.files_processed == len(paths), "not every slice module was checked"
          offenders = [str(issue) for issue in result.issues if issue.rule_name in {"literal_url", "unparseable_file"}]
          assert not offenders, "\n".join(offenders)
          print(f"contracts_and_di: {result.metadata.files_processed} slice modules checked; no literal_url findings")
          PY
        cwd: "."
  - id: "dod-omn21623-deploy-published-endpoint-readback"
    description: |-
      Hosted-runner source-artifact readback: fetch the endpoint authority file at the
      evaluated published commit and require it to declare github.web_url. A missing
      key fails the command. No lab service, credentials or broker is required. This
      checks the published source artifact and does not assert a live runtime rollout.
    source: "manual"
    checks:
      - check_type: "command"
        check_value: |-
          curl --fail --silent --show-error --location --max-time 15 "https://raw.githubusercontent.com/OmniNode-ai/omnimarket/$(git rev-parse HEAD)/src/omnimarket/configs/service_endpoints.yaml" | uv run --frozen python -c '
          import sys, yaml
          doc = yaml.safe_load(sys.stdin.read())
          assert "web_url" in doc["github"], "github.web_url missing"
          print("Published endpoint authority readback: github.web_url PASS")
          '
        cwd: "."
  - id: "dod-omn21623-runtime-paths-authority"
    description: "The authority serves every previous value and fails closed."
    source: "manual"
    binds_ac: ["AC4"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/handlers/test_runtime_paths.py -q --no-cov"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn21623-paths-clean"
    description: "The pinned contracts_and_di validator scans all seventeen modules; its structured findings contain no literal_path rule. Missing modules, incomplete scans and validator errors fail the probe."
    source: "manual"
    binds_ac: ["AC5"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/handlers/test_runtime_paths.py::test_slice_has_no_literal_path_findings -q --no-cov"
        cwd: "."
      - check_type: "command"
        check_value: |-
          uv run --frozen python -c '
          from pathlib import Path
          from omnibase_core.validation.validator_contracts_and_di import ValidatorContractsAndDi
          paths = [Path(name) for name in "scripts/shadow_mode_parity_proof.py src/omnimarket/events/emit_client.py src/omnimarket/nodes/node_automation_liveness_overlay_check_compute/handlers/handler_automation_liveness_installer_scan.py src/omnimarket/nodes/node_brief_prerequisites_compute/handlers/handler_brief_prerequisites.py src/omnimarket/nodes/node_dispatch_worker/handlers/handler_dispatch_worker.py src/omnimarket/nodes/node_emit_daemon/__main__.py src/omnimarket/nodes/node_emit_daemon/handlers/handler_emit_daemon.py src/omnimarket/nodes/node_emit_daemon/models/model_emit_daemon_config.py src/omnimarket/nodes/node_environment_health_scanner/handlers/handler_environment_health_scanner.py src/omnimarket/nodes/node_environment_health_scanner/handlers/prober_emit_daemon.py src/omnimarket/nodes/node_install_canary_effect/handlers/handler_install_canary.py src/omnimarket/nodes/node_lab_disk_growth_effect/handlers/handler_lab_uv_cache_colocate.py src/omnimarket/nodes/node_landing_tlc_receipt_effect/handlers/handler_landing_tlc_receipt_cli.py src/omnimarket/nodes/node_merge_sweep_compute/__main__.py src/omnimarket/nodes/node_merge_sweep_compute/consumer.py src/omnimarket/nodes/node_pr_lifecycle_orchestrator/handlers/handler_pr_lifecycle_orchestrator.py src/omnimarket/nodes/node_runner_orchestrator/models/model_runner_result.py".split()]
          assert all(path.is_file() for path in paths), "a target module is missing"
          result = ValidatorContractsAndDi().validate(paths)
          assert result.metadata.files_processed == len(paths), "the validator did not scan every target"
          findings = [issue for issue in result.issues if issue.rule_name == "literal_path"]
          print(f"files_processed={result.metadata.files_processed}; literal_path={len(findings)}")
          assert not findings, findings
          '
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn21623-deploy-published-paths-readback"
    description: |-
      Hosted-runner source-artifact readback: fetch the runtime-path authority at the
      evaluated published commit and require it to declare the emit daemon socket path.
      A missing key fails the command. No lab service, credentials or broker is
      required. This checks the published source artifact and does not assert a live
      runtime rollout.
    source: "manual"
    checks:
      - check_type: "command"
        check_value: |-
          curl --fail --silent --show-error --location --max-time 15 "https://raw.githubusercontent.com/OmniNode-ai/omnimarket/$(git rev-parse HEAD)/src/omnimarket/configs/runtime_paths.yaml" | uv run --frozen python -c '
          import sys, yaml
          doc = yaml.safe_load(sys.stdin.read())
          assert doc["emit_daemon"]["socket_path"], "emit_daemon.socket_path missing"
          print("Published runtime-path authority readback: emit_daemon.socket_path PASS")
          '
        cwd: "."
