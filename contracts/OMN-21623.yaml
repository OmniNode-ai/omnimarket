---
schema_version: "1.0.0"
ticket_id: "OMN-21623"
title: "Burn-down of the contracts_and_di literal_timeout findings of omnimarket, slice B: eleven nodes declare their timeouts in their contract"
summary: "Eleven node packages (node_report_anchor_probe_effect through node_topic_activity_sampler_effect, the free tail of the alphabetical second half) held 30 timeout, interval and tick-budget literals in code. Each value is now declared in its node's contract.yaml under timeouts and is read through the existing omnimarket.handlers.handler_packaged_contract_loader adapter or injected through the constructor; the secret-store HTTP handler takes its call timeout from the overlay its factory already passes, so its default left the code. The contracts_and_di check over src/omnimarket and scripts reports 1577 findings before the slice; no literal_timeout finding remains in the eleven node directories."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-omn21623-handler-binding-b"
    statement: |-
      The twenty-two nodes hold no handler or node class construction outside their container binding site. Each factory returns the class the call site built before, with the arguments the call site passed.
    acceptance:
      - id: "AC10"
        statement: "AC10: the contracts_and_di check reports no handler_hand_construction finding in the twenty-two node directories of the slice -- falsifier: uv run pytest tests/test_cdi_handler_binding_sites_b.py -k constructs_no_handler_by_hand fails when a hand construction returns to any of them"
      - id: "AC11"
        statement: "AC11: the check still fires on the same construction outside a binding site and stays silent at one -- falsifier: uv run pytest tests/test_cdi_handler_binding_sites_b.py -k fires_outside fails when the rule row stops separating the two paths"
      - id: "AC12"
        statement: "AC12: each factory returns the handler class its call site built before, and the injected event bus of the version skew detector wins over the in-memory one -- falsifier: uv run pytest tests/test_cdi_handler_binding_sites_b.py -k 'factory' fails when a factory returns another class or ignores an injected bus"
  - id: "req-omn21623-node-timeouts-a"
    statement: |-
      The sixteen nodes hold no timeout, interval, delay, backoff or TTL literal in code. Every duration is declared in the node contract with the value it held before, a name the contract does not declare stops the node, and an injected duration wins over the declared one.
    acceptance:
      - id: "AC6"
        statement: "AC6: the contracts_and_di check reports no literal_timeout finding in the sixteen node directories of the slice -- falsifier: the command of dod-omn21623-timeouts-check-clean below exits nonzero when a timeout literal returns to any of them"
      - id: "AC7"
        statement: "AC7: every node of the slice declares its durations in its contract.yaml with the value its code held before -- falsifier: uv run pytest tests/test_node_timeouts_contract.py -k declares_every_duration fails when a declared value or name differs from the table"
      - id: "AC8"
        statement: "AC8: a contract with no timeouts section, or a name it does not declare, refuses instead of supplying a value -- falsifier: uv run pytest tests/test_node_timeouts_contract.py -k 'undeclared or without' fails when a fallback value returns"
      - id: "AC9"
        statement: "AC9: constructor defaults and module constants come from the contract and an injected duration wins -- falsifier: uv run pytest tests/test_node_timeouts_contract.py -k 'constructor or module_constants or injected' fails when a literal default returns"
  - id: "req-omn21623-github-web-origin"
    statement: |-
      The GitHub web origin is declared once, in configs/service_endpoints.yaml, and the resolver fails closed when the key is missing or empty. The ten modules of the slice build their GitHub URLs from the resolver and hold no literal of the origin in code, so the contracts_and_di check reports no literal_url finding on any of them.
    acceptance:
      - id: "AC1"
        statement: "AC1: configs/service_endpoints.yaml declares github.web_url and service_endpoint_url resolves it -- falsifier: uv run pytest tests/test_service_endpoints_contract.py -k github_web_url -q --no-cov"
      - id: "AC2"
        statement: "AC2: none of the ten modules of the slice holds the GitHub web origin as a string constant in code -- falsifier: uv run pytest tests/test_service_endpoints_contract.py -k TestGithubWebOriginIsResolved -q --no-cov"
      - id: "AC3"
        statement: "AC3: the contracts_and_di check reports no literal_url finding on the files of the slice -- falsifier: the command of dod-omn21623-check-clean below"
  - id: "req-omn21623-runtime-path-authority"
    statement: |-
      A node that falls back to a filesystem location reads it from the runtime-path authority by reference; an unknown reference fails at the call, and the previous values are unchanged.
    acceptance:
      - id: "AC4"
        statement: "AC4: configs/runtime_paths.yaml holds each fallback location and handlers/runtime_paths.py resolves it by dotted reference, failing closed on a missing file, key or wrong shape -- falsifier: uv run pytest tests/unit/handlers/test_runtime_paths.py -q --no-cov"
      - id: "AC5"
        statement: "AC5: the contracts_and_di check reports no literal_path finding on the modules of the slice -- falsifier: the command of dod-omn21623-paths-clean below"
  - id: "req-omn21623-node-timeouts-b"
    statement: |-
      The eleven nodes hold no timeout, interval or tick-budget literal in code. Every duration is declared in the node contract with the value it held before, a name the contract does not declare stops the node, and an injected duration wins over the declared one.
    acceptance:
      - id: "AC1"
        statement: "AC1: the contracts_and_di check reports no literal_timeout finding in the eleven node directories of the slice -- falsifier: the command of dod-omn21623-timeouts-b-check-clean below exits nonzero when a timeout literal returns to any of them"
      - id: "AC2"
        statement: "AC2: every node of the slice declares its durations in its contract.yaml with the value its code held before -- falsifier: uv run pytest tests/test_node_timeouts_slice_b_contract.py -k declares_every_duration fails when a declared value or name differs from the table"
      - id: "AC3"
        statement: "AC3: a name the contract does not declare refuses instead of supplying a value -- falsifier: uv run pytest tests/test_node_timeouts_slice_b_contract.py -k undeclared fails when a fallback value returns"
      - id: "AC4"
        statement: "AC4: constructor defaults and module constants come from the contract and an injected duration wins -- falsifier: uv run pytest tests/test_node_timeouts_slice_b_contract.py -k 'constructor or module_constants or injected or cron_budgets' fails when a literal default returns"
  - id: "req-omn21623-network-binding-authority"
    statement: |-
      Code that binds, probes or compares against a host, address or port reads it from the network-binding authority by reference, and code that needs an in-memory transport takes the one a binding site builds; an unknown reference fails at the call, and the previous values are unchanged.
    acceptance:
      - id: "AC4"
        statement: "AC4: configs/network_bindings.yaml holds each host, address and port and handlers/network_bindings.py resolves it by dotted reference, failing closed on a missing file, key or wrong shape, and the binding sites build the in-memory implementations -- falsifier: uv run pytest tests/unit/handlers/test_network_bindings.py -q --no-cov"
      - id: "AC5"
        statement: "AC5: the contracts_and_di check reports no inmemory_outside_injection, literal_host, literal_ip or literal_port finding on the modules of the slice -- falsifier: the command of dod-omn21623-network-clean below"
evidence_requirements:
