---
schema_version: "1.0.0"
ticket_id: "OMN-21623"
title: "Burn-down of the contracts_and_di findings of omnimarket, third slice: the GitHub web origin is read from the service endpoint authority"
summary: "Ten modules across eight node packages spelled the GitHub web origin as a literal in code. The origin is now a key of configs/service_endpoints.yaml (github.web_url), and every module of the slice builds its repository, clone and release URLs from it through the existing service_endpoint_url resolver. The contracts_and_di check over src/omnimarket and scripts reports 1575 findings before the slice and fewer after, and no file of the slice carries a literal_url finding."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-omn21623-github-web-origin"
    statement: |-
      The GitHub web origin is declared once, in configs/service_endpoints.yaml, and the resolver fails closed when the key is missing or empty. The ten modules of the slice build their GitHub URLs from the resolver and hold no literal of the origin in code, so the contracts_and_di check reports no literal_url finding on any of them.
    acceptance:
      - id: "AC1"
        statement: "AC1: configs/service_endpoints.yaml declares github.web_url and service_endpoint_url resolves it -- falsifier: uv run pytest tests/test_service_endpoints_contract.py -k github_web_url -q --no-cov"
      - id: "AC2"
        statement: "AC2: none of the ten modules of the slice holds the GitHub web origin as a string constant in code -- falsifier: uv run pytest tests/test_service_endpoints_contract.py -k TestGithubWebOriginIsResolved -q --no-cov"
      - id: "AC3"
        statement: "AC3: the contracts_and_di check reports no literal_url finding on the files of the slice -- falsifier: the command of dod-omn21623-check-clean below"
  - id: "req-omn21623-network-binding-authority"
    statement: |-
      Code that binds, probes or compares against a host, address or port reads it from the network-binding authority by reference, and code that needs an in-memory transport takes the one a binding site builds; an unknown reference fails at the call, and the previous values are unchanged.
    acceptance:
      - id: "AC4"
        statement: "AC4: configs/network_bindings.yaml holds each host, address and port and handlers/network_bindings.py resolves it by dotted reference, failing closed on a missing file, key or wrong shape, and the binding sites build the in-memory implementations -- falsifier: uv run pytest tests/unit/handlers/test_network_bindings.py -q --no-cov"
      - id: "AC5"
        statement: "AC5: the contracts_and_di check reports no inmemory_outside_injection, literal_host, literal_ip or literal_port finding on the modules of the slice -- falsifier: the command of dod-omn21623-network-clean below"
evidence_requirements:
  - kind: "tests"
    description: "The endpoint authority tests pass."
    command: "uv run pytest tests/test_service_endpoints_contract.py -q --no-cov"
  - kind: "tests"
    description: "The authority tests and the tests of the touched nodes pass."
    command: "uv run pytest tests/unit/handlers/test_network_bindings.py -q --no-cov"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn21623-endpoint-authority"
    description: "The endpoint authority exposes the web origin and every slice module resolves it instead of spelling it."
    source: "manual"
    binds_ac: ["AC1", "AC2"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/test_service_endpoints_contract.py -q --no-cov"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn21623-check-clean"
    description: "The contracts_and_di check over the ten slice modules reports no literal_url finding."
    source: "manual"
    binds_ac: ["AC3"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/test_service_endpoints_contract.py -k TestGithubWebOriginIsResolved -q --no-cov"
        cwd: "."
      - check_type: "command"
        check_value: |-
          uv run --frozen python - <<'PY'
          from pathlib import Path
          from omnibase_core.validation.validator_contracts_and_di import ValidatorContractsAndDi

          paths = [
              Path("src/omnimarket/nodes/node_contractor_integration_note_effect/services/note_composer.py"),
              Path("src/omnimarket/nodes/node_git_query_mirror_effect/git_mirror.py"),
              Path("src/omnimarket/nodes/node_lab_work_unit_effect/protocols/local_shell_work_runner.py"),
              Path("src/omnimarket/nodes/node_linear_triage/services/local_github_pr_reads.py"),
              Path("src/omnimarket/nodes/node_local_dashboard_serve_effect/bundle.py"),
              Path("src/omnimarket/nodes/node_pr_head_stage_compute/handlers/handler_pr_head_stage.py"),
              Path("src/omnimarket/nodes/node_push_validation_effect/protocols/ephemeral_container_focused_run_subprocess.py"),
              Path("src/omnimarket/nodes/node_push_validation_effect/protocols/gate_runner_suite_evaluation_subprocess.py"),
              Path("src/omnimarket/nodes/node_push_validation_effect/protocols/git_push_validation_subprocess.py"),
              Path("src/omnimarket/nodes/node_remote_lane_effect/handlers/handler_remote_lane_ref.py"),
          ]
          assert all(path.is_file() for path in paths), "a slice module is missing"
          validator = ValidatorContractsAndDi()
          assert any(rule.rule_id == "literal_url" and rule.enabled for rule in validator.contract.rules), "literal_url rule is not enabled"
          result = validator.validate(paths)
          assert result.metadata is not None and result.metadata.files_processed == len(paths), "not every slice module was checked"
          offenders = [str(issue) for issue in result.issues if issue.rule_name in {"literal_url", "unparseable_file"}]
          assert not offenders, "\n".join(offenders)
          print(f"contracts_and_di: {result.metadata.files_processed} slice modules checked; no literal_url findings")
          PY
        cwd: "."
  - id: "dod-omn21623-deploy-published-endpoint-readback"
    description: |-
      Hosted-runner source-artifact readback: fetch the endpoint authority file at the
      evaluated published commit and require it to declare github.web_url. A missing
      key fails the command. No lab service, credentials or broker is required. This
      checks the published source artifact and does not assert a live runtime rollout.
    source: "manual"
    checks:
      - check_type: "command"
        check_value: |-
          curl --fail --silent --show-error --location --max-time 15 "https://raw.githubusercontent.com/OmniNode-ai/omnimarket/$(git rev-parse HEAD)/src/omnimarket/configs/service_endpoints.yaml" | uv run --frozen python -c '
          import sys, yaml
          doc = yaml.safe_load(sys.stdin.read())
          assert "web_url" in doc["github"], "github.web_url missing"
          print("Published endpoint authority readback: github.web_url PASS")
          '
        cwd: "."
  - id: "dod-omn21623-network-authority"
    description: "The authority serves every previous value, fails closed, and the binding sites build the in-memory implementations."
    source: "manual"
    binds_ac: ["AC4"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/handlers/test_network_bindings.py -q --no-cov"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn21623-network-clean"
    description: "The contracts_and_di check over the modules of the slice reports none of the four rules."
    source: "manual"
    binds_ac: ["AC5"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/handlers/test_network_bindings.py -k test_network_slice_has_no_targeted_findings -q --no-cov"
        cwd: "."
      - check_type: "command"
        check_value: |-
          uv run --frozen python - <<'PY'
          from pathlib import Path
          from omnibase_core.validation.validator_contracts_and_di import ValidatorContractsAndDi

          paths = [
              Path("src/omnimarket/delegated_test_loop/lane_bus.py"),
              Path("src/omnimarket/handlers/container/container_inmemory.py"),
              Path("src/omnimarket/models/delegation/wire/model_probe_ladder.py"),
              Path("src/omnimarket/nodes/node_binding_parity_orchestrator/handlers/handler_run_local.py"),
              Path("src/omnimarket/nodes/node_binding_parity_orchestrator/stubs/stub_bus.py"),
              Path("src/omnimarket/nodes/node_claude_review_gateway_effect/models/model_claude_review_gateway.py"),
              Path("src/omnimarket/nodes/node_golden_chain_sweep/census_collector.py"),
              Path("src/omnimarket/nodes/node_llm_delegation_call_effect/handlers/handler_inference_intent.py"),
              Path("src/omnimarket/nodes/node_pr_handoff_orchestrator/state_codec.py"),
              Path("src/omnimarket/nodes/node_process_watchdog/handlers/checktargets_production.py"),
              Path("src/omnimarket/nodes/node_work_ledger_emit_effect/handlers/handler_work_ledger_emit_guard.py"),
              Path("src/omnimarket/projection/api_server.py"),
              Path("src/omnimarket/rsd/v4_static_policy.py"),
          ]
          rules = {"inmemory_outside_injection", "literal_host", "literal_ip", "literal_port"}
          assert all(path.is_file() for path in paths), "a network slice module is missing"
          validator = ValidatorContractsAndDi()
          enabled = {rule.rule_id for rule in validator.contract.rules if rule.enabled}
          assert rules <= enabled, f"network rules are not enabled: {sorted(rules - enabled)}"
          result = validator.validate(paths)
          assert result.metadata is not None and result.metadata.files_processed == len(paths), "not every network slice module was checked"
          offenders = [str(issue) for issue in result.issues if issue.rule_name in rules | {"unparseable_file"}]
          assert not offenders, "\n".join(offenders)
          print(f"contracts_and_di: {result.metadata.files_processed} network slice modules checked; no targeted findings")
          PY
        cwd: "."
  - id: "dod-omn21623-deploy-published-network-readback"
    description: |-
      Hosted-runner source-artifact readback: fetch the network-binding authority at the
      evaluated published commit and require it to declare the emit daemon port. A missing
      key fails the command. No lab service, credentials or broker is required. This checks
      the published source artifact and does not assert a live runtime rollout.
    source: "manual"
    checks:
      - check_type: "command"
        check_value: |-
          curl --fail --silent --show-error --location --max-time 15 "https://raw.githubusercontent.com/OmniNode-ai/omnimarket/$(git rev-parse HEAD)/src/omnimarket/configs/network_bindings.yaml" | uv run --frozen python -c '
          import sys, yaml
          doc = yaml.safe_load(sys.stdin.read())
          assert doc["emit_daemon"]["port"], "emit_daemon.port missing"
          print("Published network-binding authority readback: emit_daemon.port PASS")
          '
        cwd: "."
