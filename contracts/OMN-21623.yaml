---
schema_version: "1.0.0"
ticket_id: "OMN-21623"
title: "The demo rehearsal and drift-detector probes take the dashboard URL and timeout from the contract and an overlay instead of code"
summary: "Both demo nodes fell back to a literal loopback URL when the dashboard setting was absent and fixed the probe timeout in the handler. The timeout is now the probe_policy section of each node contract and the dashboard address is a deployment overlay (or the existing DEMO_DASHBOARD_URL setting) injected into the handler. With neither, the probe refuses and names the setting. First burn-down slice of the contracts_and_di check over this repository: eight findings in these two nodes, four URL and four timeout, are cleared."
is_seam_ticket: false
interface_change: true
interfaces_touched:
  - "public_api"
requirements:
  - id: "req-omn21623-demo-probe-injection"
    statement: |-
      The demo probes read the dashboard address and the request timeout from injected values (contract policy and deployment overlay) and hold neither as a literal; an absent address refuses by name and never probes a guessed one.
    acceptance:
      - id: "AC1"
        statement: "AC1: an injected overlay and policy decide the URL and the timeout of every dashboard probe in both nodes -- falsifier: uv run pytest tests/nodes/node_demo_rehearsal/test_probe_config.py tests/nodes/node_demo_drift_detector/test_probe_config.py -q -k injected fails when a probe builds its client with a literal timeout or URL"
      - id: "AC2"
        statement: "AC2: the timeout default is the probe_policy section of the node contract and DEMO_DASHBOARD_URL still supplies the address when nothing is injected -- falsifier: the same files with -k 'contract or environment' fail when the handler stops reading the contract section or the setting"
      - id: "AC3"
        statement: "AC3: with no overlay, no setting and no overlay root, a probe raises an error naming DEMO_DASHBOARD_URL before any client is created -- falsifier: the same files with -k missing fail when a localhost default returns"
      - id: "AC4"
        statement: "AC4: the contracts_and_di check from the pinned omnibase_core reports no finding in the two node directories -- falsifier: the runtime_validator_run command of the last dod_evidence entry exits nonzero when a literal URL or timeout returns"
evidence_requirements:
  - kind: "tests"
    description: "The probe injection tests of both nodes and the existing handler tests pass."
    command: "uv run pytest tests/nodes/node_demo_rehearsal tests/nodes/node_demo_drift_detector tests/integration/node_demo_drift_detector -q --no-cov"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn21623-probe-injection"
    description: "Injected overlay and policy, the contract-declared timeout, the setting and the refusal all behave as stated, for both nodes."
    source: "manual"
    binds_ac: ["AC1", "AC2", "AC3"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_demo_rehearsal tests/nodes/node_demo_drift_detector tests/integration/node_demo_drift_detector -q --no-cov"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn21623-contracts-and-di-clean"
    description: "The contracts_and_di check of the pinned omnibase_core finds nothing in the two node directories."
    source: "manual"
    binds_ac: ["AC4"]
    checks:
      - check_type: "command"
        check_value: "uv run python -m omnibase_core.nodes.node_validation_report_write_effect.runtime_validator_run omnibase_core.validation.validator_contracts_and_di:ValidatorContractsAndDi src/omnimarket/nodes/node_demo_rehearsal src/omnimarket/nodes/node_demo_drift_detector --report-json /tmp/omn21623-contracts-and-di.json"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn21623-deploy-probe-policy-landed"
    description: "Deploy check: the probe_policy section is present in both demo node contracts as published on the pull request branch, read through the GitHub contents API."
    source: "manual"
    binds_ac: ["AC2"]
    checks:
      - check_type: "command"
        check_value: "for n in node_demo_rehearsal node_demo_drift_detector; do gh api \"repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/$n/contract.yaml?ref=jonah/omn-21623-omnimarket-di-slice\" --jq .content | base64 -d | grep -q '^probe_policy:' || exit 1; done"
