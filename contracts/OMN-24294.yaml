schema_version: 1.0.0
ticket_id: OMN-24294
title: The board source memory never fails a refresh step on an unexpected store answer
summary: The Valkey adapter of the board's source read cache caught only a timeout around a lookup or a save, so any other error from the store client (a stream parser ValueError seen against a stand-in store on a lab host) stopped the whole board step. The adapter now treats a timeout, a typed cache error, an OS error, a ValueError and a RuntimeError from the client alike, marks the store unavailable for the run and raises the typed unavailable error with a message that names neither the address nor the error, so the reader reads the source and counts the read as unavailable.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24294-never-fail-a-step
  statement: An unexpected failure from the store client never stops a board step; the step reads its source and its record counts the store as unavailable.
  acceptance:
  - id: AC1
    statement: 'AC1: a store answer that raises an unexpected error on a lookup or a save makes the adapter raise the typed unavailable error once and never try the store again in that run -- falsifier: uv run pytest tests/nodes/node_source_read_cache_effect/test_backend_valkey_unexpected_error.py -q fails without the change'
  - id: AC2
    statement: 'AC2: a board step whose store raises an unexpected error mid-run still reads its source and its record counts the read as unavailable -- falsifier: uv run pytest tests/nodes/node_source_read_cache_effect/test_backend_valkey_unexpected_error.py -q fails without the change'
  - id: AC3
    statement: 'AC3: integrated: on a lab host with a stand-in store that breaks mid-run, the factory floor step exits 0 and its record shows unavailable above zero -- falsifier: a step that exits non-zero, or a record with no unavailable count, fails this criterion'
evidence_requirements:
- kind: tests
  description: The unexpected-error test and the existing adapter test pass at the pushed head.
  command: uv run pytest tests/nodes/node_source_read_cache_effect/test_backend_valkey_unexpected_error.py tests/nodes/node_source_read_cache_effect/test_backend_valkey_adapter.py -q -n 0 --no-cov -p no:cacheprovider
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24294-ac1
  description: 'AC1: a ValueError on a get, a ValueError on a set and a typed cache error after connecting each give the typed unavailable error once and the store is not called again, and the message names neither the address nor the error.'
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_source_read_cache_effect/test_backend_valkey_unexpected_error.py -q -n 0 --no-cov -p no:cacheprovider
    cwd: .
- id: dod-omn24294-ac2
  description: 'AC2: through the cached reader a store that raises mid-run gives the source value, one source read and one unavailable in the tally.'
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_source_read_cache_effect/test_backend_valkey_unexpected_error.py -q -n 0 --no-cov -p no:cacheprovider
    cwd: .
- id: dod-omn24294-ac3
  description: 'hosted proxy for AC3: the tests above pass; the factory floor step run against a breaking stand-in store on a lab host is read and named in the pull request.'
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_source_read_cache_effect/test_backend_valkey_unexpected_error.py tests/nodes/node_source_read_cache_effect/test_backend_valkey_adapter.py -q -n 0 --no-cov -p no:cacheprovider
    cwd: .
- id: dod-omn24294-integration-proof
  description: the unexpected-error test and the adapter test run on a lab host at the pushed head; hosted CI cannot reach the lab, so only the local Done gate runs this unbound check
  source: manual
