schema_version: 1.0.0
ticket_id: OMN-22799
title: The worktree reconcile tick exits 0 when its only red is probe timeouts, a nested-repository directory or a missing evidence source, and its unit stops running git at the idle IO class
summary: On the lab host every worktree reconcile tick exited 1. The 22:15Z tick scanned 517 trees, removed none and logged 43 failures, 30 of them git timeouts behind lane work. The unit ran under a hand-made drop-in at the idle IO class, where one git read took 5 to 10 s instead of 0.1 s. A probe or clone refresh timeout is now deferred (the tree is kept, counted and listed in the run-completed event, and read again next tick), a nested repository and a repository the host has no merged pull request evidence source for are needs_human, and every other probe error, and a broken reader, stays a failure. The schedule installer declares the unit's priority in the contract and writes the drop-in itself.
is_seam_ticket: false
interface_change: true
interfaces_touched:
- events
requirements:
- id: req-omn22799-exit-classes
  statement: A tick fails only on a real failure; load, a nested repository and a missing evidence source never remove a tree and never read as a failure.
  acceptance:
  - id: AC1
    statement: 'AC1: a regression test built from the recorded probe errors of the 22:15Z tick (tests/fixtures/worktree_reconcile/tick_2215_probe_errors.json) reports 30 deferred, 3 needs_human and only the ten unattributed clone refresh errors as failures, and fails on the dev code -- falsifier: uv run --frozen pytest tests/test_worktree_reconcile_exit_classes.py -q --no-cov'
  - id: AC2
    statement: 'AC2: a deferred or needs_human tree is never removed with execute true, a removable tree is removed without the injected timeout, and any other probe error still counts as a failure -- falsifier: uv run --frozen pytest tests/test_worktree_reconcile_exit_classes.py -q --no-cov'
  - id: AC3
    statement: 'AC3: the run-completed event carries deferred and deferred_paths, the golden and error chain event tests pass and the error event reaches the projection -- falsifier: uv run --frozen pytest tests/test_golden_chain_worktree_reconcile.py -q --no-cov'
  - id: AC4
    statement: 'AC4: the schedule installer renders the declared resource limits and replaces a hand-made idle drop-in -- falsifier: uv run --frozen pytest tests/test_worktree_reconcile_schedule.py -q --no-cov'
evidence_requirements:
- kind: tests
  description: The exit classes, the chain events and the schedule installer
  command: uv run --frozen pytest tests/test_worktree_reconcile_exit_classes.py tests/test_golden_chain_worktree_reconcile.py tests/test_worktree_reconcile_schedule.py tests/test_worktree_reconcile_effect.py tests/test_worktree_reconcile_compute.py tests/test_worktree_reconcile_units.py -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn22799-exit-classes
  description: Load, a nested repository and a missing evidence source are not failures and never remove a tree.
  source: manual
  binds_ac:
  - AC1
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/test_worktree_reconcile_exit_classes.py -q --no-cov
    cwd: .
- id: dod-omn22799-chain-events
  description: The golden and error run-completed events carry the deferred count and reach the projection.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/test_golden_chain_worktree_reconcile.py -q --no-cov
    cwd: .
- id: dod-omn22799-priority
  description: The installer writes the declared priority into the unit's drop-in.
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/test_worktree_reconcile_schedule.py -q --no-cov
    cwd: .
- id: dod-omn22799-integration-proof
  description: Run this pull request's own tests on a lab host at the pushed head, then install the branch's worktree reconcile through its schedule install with a rollback copy and read two ticks of the timer with exit 0 (the lane's report holds the reads). Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-22799 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/test_worktree_reconcile_exit_classes.py tests/test_golden_chain_worktree_reconcile.py tests/test_worktree_reconcile_schedule.py tests/test_worktree_reconcile_effect.py -q --no-cov
    cwd: .
