title: "A delegation the handler budget cancels after routing records the rung it was routed to as a timeout attempt"
summary: "budget_cancelled_result recorded the in-flight rung only when the run was cancelled at stage inference or quality_gate, so a routed run cancelled earlier (stage dispatch or effect_boot) carried an empty attempt ladder. The routed rung is now recorded as a timeout attempt at any stage. Only AC2 is proven by this change; AC1 (naming the step that held the budget before routing) and AC3 (the 24 h dev-lane count after deploy) are not claimed."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-omn21365-routed-rung"
    statement: |-
      A run cancelled by the handler budget after routing records the rung it was routed to in its attempt ladder as a timeout attempt, and reports its execution time as latency.
    acceptance:
      - id: "AC2"
        statement: "AC2: a run cancelled by the handler budget after routing records the rung it was routed to (backend_id, tier) in attempt_history as a timeout attempt, and records latency_ms as its execution time rather than 0 -- falsifier: uv run pytest on a new omnimarket handler test that cancels a routed run before inference under a fake clock and asserts a one-element ladder typed timeout and a nonzero latency_ms"
evidence_requirements:
  - kind: "tests"
    description: "The new budget-cancel test and the existing budget-cancel tests pass."
    command: "uv run pytest tests/unit/nodes/node_delegate_skill_orchestrator/test_budget_cancel_before_inference_omn21365.py -q --no-cov"
