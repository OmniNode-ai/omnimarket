---
schema_version: "1.0.0"
ticket_id: "OMN-19215"
title: "A local quality rejection no longer hops to a sibling serving the same model id"
summary: "The local delegation dispatch port keeps every quality-rejected model id for the dispatch and excludes them from both quality and transport sibling selection. An initial transport failure still permits a same-model fallback."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-no-same-model-sibling-hop"
    statement: "After a model is quality-rejected, no later sibling serving that model id is called, on the local dispatch path. The criterion below is labeled AC1 so the binding item can claim it through binds_ac."
    acceptance:
      - id: "AC1"
        statement: "AC1: with model A quality-rejected and a different sibling B then failing, a later sibling serving A is not called -- falsifier: uv run pytest tests/unit/nodes/node_delegate_skill_orchestrator/test_local_dispatch_same_model_sibling_omn19215.py -q in omnimarket fails at the merge base with cloud-mirror called after cloud-primary rejected that model"
  - id: "req-bus-quality-retry-keeps-exclusions"
    statement: |-
      On the bus delegation workflow, a free-tier quality retry after a transport failover keeps the transport-failed backend exclusions, so a draft rejected after failover never switches to another host serving the same model.
    acceptance:
      - id: "AC2"
        statement: |-
          AC2: the quality retry routing intent carries the transport-failed backend refs as excluded_backend_refs -- falsifier: uv run pytest tests/unit/nodes/node_delegate_skill_orchestrator/test_local_dispatch_same_model_sibling_omn19215.py -k test_bus_quality_rejection_never_switches_same_model_hosts -q fails at the merge base on the redraft-mirror case
evidence_requirements:
  - kind: "tests"
    description: "AC1 regression. The same-model sibling cases pass at the head."
    command: "env -u PYTHONPATH uv run pytest tests/unit/nodes/node_delegate_skill_orchestrator/test_local_dispatch_same_model_sibling_omn19215.py -q"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn19215-ac1-same-model-sibling"
    description: "AC1 regression. The same-model sibling cases pass at the head."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/nodes/node_delegate_skill_orchestrator/test_local_dispatch_same_model_sibling_omn19215.py -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC1"]
  - id: "dod-omn19215-ac2-bus-quality-retry-exclusions"
    description: "AC2 regression. The bus quality retry after transport failover stays off same-model hosts."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/nodes/node_delegate_skill_orchestrator/test_local_dispatch_same_model_sibling_omn19215.py -k test_bus_quality_rejection_never_switches_same_model_hosts -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC2"]
