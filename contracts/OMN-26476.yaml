---
schema_version: "1.0.0"
ticket_id: "OMN-26476"
title: "The dev identity node binds a dev user to an existing tenant (claim and audience read back from its token)"
summary: "Given an existing tenant id, node_dev_identity_provision_effect reads that tenant over the bus, sets the user's tenant attributes and reads the audience and both tenant claims back from the user's token, creating no probe tenant; every name comes from the contract. This change makes no live provision."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn26476-bind-existing-tenant
  statement: "A run that carries a tenant id binds the named user to that existing tenant and answers bound only when the token carries the declared audience and both tenant claims."
  acceptance:
  - id: AC1
    statement: 'AC1: a run with a tenant id binds the named user to that existing tenant and the token read-back carries the audience and the tenant id and slug claims; Falsifier: tests/nodes/node_dev_identity_provision_effect/test_bind_existing_tenant.py::test_a_user_is_bound_to_the_existing_tenant_and_the_token_carries_the_claims'
- id: req-omn26476-no-probe-tenant
  statement: "In bind mode the node never asks the runtime to provision a tenant."
  acceptance:
  - id: AC2
    statement: 'AC2: in bind mode the tenant provisioner is never called; Falsifier: tests/nodes/node_dev_identity_provision_effect/test_bind_existing_tenant.py::test_binding_never_asks_the_runtime_to_provision_a_tenant'
- id: req-omn26476-no-check-weakened
  statement: "An unknown tenant, a lane that is not dev, a token without the audience and a realm that drops the attributes are each refused with a typed outcome."
  acceptance:
  - id: AC3
    statement: 'AC3: an unknown tenant, a non-dev lane, a token with no audience and a realm that drops the attributes are each refused; Falsifier: tests/nodes/node_dev_identity_provision_effect/test_bind_existing_tenant.py::test_a_tenant_the_runtime_does_not_know_is_refused_and_no_user_is_made tests/nodes/node_dev_identity_provision_effect/test_bind_existing_tenant.py::test_a_lane_that_is_not_dev_is_refused_even_with_a_tenant_id tests/nodes/node_dev_identity_provision_effect/test_bind_existing_tenant.py::test_a_client_with_no_audience_mapper_fails_the_readback_and_the_new_user_is_deleted tests/nodes/node_dev_identity_provision_effect/test_bind_existing_tenant.py::test_a_realm_that_drops_the_attributes_fails_the_readback_naming_both_claims'
- id: req-omn26476-names-from-contract
  statement: "Every attribute, claim, audience and topic name comes from the contract and agrees with the sign-in client overlay, the edge resolver and the tenant node."
  acceptance:
  - id: AC4
    statement: 'AC4: the contract names agree with the sign-in client mappers, the edge resolver and the tenant node; Falsifier: tests/nodes/node_dev_identity_provision_effect/test_bind_existing_tenant.py::test_the_binding_names_are_the_sign_in_clients_mapper_names tests/nodes/node_dev_identity_provision_effect/test_bind_existing_tenant.py::test_the_token_the_node_accepts_is_the_token_the_edge_resolver_accepts tests/nodes/node_dev_identity_provision_effect/test_bind_existing_tenant.py::test_the_declared_read_topics_are_the_tenant_provision_nodes_own'
- id: req-omn26476-regression-control
  statement: "The node's existing tests still pass."
  acceptance:
  - id: AC5
    statement: 'AC5: the node test directory passes whole; Falsifier: tests/nodes/node_dev_identity_provision_effect'
- id: req-omn26476-dev-lane-entry
  statement: "The gateway key node declares a dev lane entry (own tenant slug, key row names, generated key ids) and refuses every lane pair that is not one declared lane."
  acceptance:
  - id: AC6
    statement: 'AC6: a dev command with a dev overlay provisions the dev tenant and key under the dev names, and a mismatched lane pair is refused with no side effect; Falsifier: tests/nodes/node_stability_gateway_key_provision_effect/test_dev_lane_expiry.py::test_dev_command_with_dev_overlay_provisions_the_dev_tenant_and_key tests/nodes/node_stability_gateway_key_provision_effect/test_dev_lane_expiry.py::test_a_lane_pair_that_is_not_one_declared_lane_is_refused_with_no_side_effect'
- id: req-omn26476-expiry-written
  statement: "An entry that declares expires_in_seconds writes tenant_api_keys.expires_at; an entry without it writes none."
  acceptance:
  - id: AC7
    statement: 'AC7: the dev default key and the two-minute expiry check carry their declared expiry and the stability run carries none; Falsifier: tests/nodes/node_stability_gateway_key_provision_effect/test_dev_lane_expiry.py::test_dev_default_key_carries_the_declared_expiry tests/nodes/node_stability_gateway_key_provision_effect/test_dev_lane_expiry.py::test_dev_expiry_check_is_two_minutes_under_its_own_key_id_and_name tests/nodes/node_stability_gateway_key_provision_effect/test_dev_lane_expiry.py::test_stability_default_run_writes_no_expiry'
- id: req-omn26476-expiry-read
  statement: "The gateway key lookup refuses a key whose expires_at has passed."
  acceptance:
  - id: AC8
    statement: 'AC8: a key resolves before its expiry and not after it; Falsifier: tests/nodes/node_stability_gateway_key_provision_effect/test_dev_lane_expiry.py::test_store_writes_expires_at_and_the_gateway_refuses_the_key_after_it'
- id: req-omn26476-live-identity-schema
  statement: "The tenant provision store writes the identity tables as the dev database holds them: tenant_plans by plan_code, and tenant_event_outbox by topic and envelope with no tenant id column."
  acceptance:
  - id: AC9
    statement: 'AC9: the provision transaction creates one tenant, one plan row and one TENANT_CREATED outbox row on a scratch database built with the live columns; Falsifier: tests/nodes/node_tenant_provision_effect/test_provision_postgres.py::test_b_double_run_of_one_slug_gives_one_tenant_one_plan_one_outbox_row'
evidence_requirements:
- kind: tests
  description: The node's whole test directory, the new bind tests included.
  command: uv run pytest tests/nodes/node_dev_identity_provision_effect -q -n 0 --no-cov -p no:cacheprovider
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
