schema_version: 1.0.0
ticket_id: OMN-24831
title: 'Shared red delegation-health-check / Delegation Health Check: omnimarket dev''s newest delegation-regression-nightly run reads failed, so the check is red on every runtime pull request'
summary: 'The nightly''s Layer-2 runner scored eight cases against rows that never received a terminal outcome as several behavioural misses ("got ''unknown''", "tokens: expected positive"). It now names the one fact, that the row has no terminal outcome, without loosening any case. AC1 (the cause named from three pull requests'' failure text) and AC4 (the Lab line in the pull request body) are read from the ledger and the pull request body, not from hosted CI. This change is a diagnostic: it does not make the lane terminalise delegations, so AC2 (the fix at the source, in the repository that owns the cause) is not met by it and is unbound from this contract: this change must land under a ticket that does not close OMN-24831.'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24831-nightly-names-its-cause
  statement: The delegation regression nightly states why a case failed on a row with no terminal outcome, and still fails that case.
  acceptance:
  - id: AC3
    statement: 'AC3: the fix widens or bypasses no check, so the diff removes no assertion and adds no skip, xfail, loosened threshold or changed required-check list -- falsifier: `git diff <base> <head> -- tests/ .github/` shows a removed assert, a new skip or xfail marker or a changed required-check list'
evidence_requirements:
- kind: tests
  description: The new runner test and the runner tests it sits beside.
  command: env -u PYTHONPATH uv run --frozen pytest tests/delegation_golden/test_runner_unterminalised_row_omn24831.py tests/delegation_golden/test_runner_terminal_ok_omn13543.py -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24831-diag-names-unterminalised-row
  description: A row with terminal_ok NULL scores one failure naming the missing terminal outcome instead of a wrong-terminal line and a token line. This is a diagnostic and is bound to no acceptance criterion; AC2 (the fix at the source, in the repository that owns the cause) is not met by it and is unbound here. The test fails at the pinned base, where evaluate_row still reports "got 'unknown'".
  source: manual
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/delegation_golden/test_runner_unterminalised_row_omn24831.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24831-ac3-case-still-fails
  description: Hosted proxy for AC3. The same test file asserts that the eight nightly hard-failure cases still fail on a row with terminal_ok NULL, that a completed row is still judged on its behaviour, and that a wrong terminal keeps its old text. No assertion, skip, xfail or threshold changes.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/delegation_golden/test_runner_unterminalised_row_omn24831.py -q --no-cov -n 0 -p no:randomly -k "the_case_still_fails or StillJudged or still_a_behavioural_miss"
    cwd: .
- id: dod-omn24831-diag-fails-on-base
  description: 'The new test file is run against a copy of the head tree whose tests/delegation_golden/runner.py is the file at the pinned base 6efbe3ee5027. The check passes only when that run exits with exactly nine failures: the eight test_one_failure_names_the_null_terminal_ok ids (I1, I10, I3, I5, I6, I7, I8, I9) and test_it_does_not_report_telemetry_misses_it_cannot_judge. A bare failing run does not pass it. It needs the pinned base object in the clone, so only the local Done gate runs it.'
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: |-
      bash -c 'b=6efbe3ee5027f6efb67d0b81a1421f0dda32b4e5; t=tests/delegation_golden/test_runner_unterminalised_row_omn24831.py; d="$(mktemp -d)" && git archive HEAD | tar -x -C "$d" && git show "$b:tests/delegation_golden/runner.py" > "$d/tests/delegation_golden/runner.py" && cd "$d" && out="$(env -u PYTHONPATH uv run --frozen pytest $t -q --no-cov -n 0 -p no:randomly -p no:cacheprovider 2>&1)"; printf "%s\n" "$out" | tail -3; [ "$(printf "%s\n" "$out" | grep -cE "^FAILED .*test_one_failure_names_the_null_terminal_ok\[I(1|10|3|5|6|7|8|9)\]")" = 8 ] && printf "%s\n" "$out" | grep -q "^FAILED .*test_it_does_not_report_telemetry_misses_it_cannot_judge" && printf "%s\n" "$out" | grep -qE "(^| )9 failed"'
    cwd: .
- id: dod-omn24831-ac3-git-diff
  description: 'Git-diff falsifier: against the merge base with the landing branch, the diff of tests/ and .github/ removes no assert line, adds no skip or xfail marker (a decorator, a call or a marks= argument) and leaves .github/ untouched. Needs the landing-branch ref, so only the local Done gate runs it.'
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: |-
      bash -c 'mb="$(git merge-base HEAD origin/HEAD)" && git diff --quiet "$mb" -- .github/ && [ "$(git diff "$mb" -- tests/ .github/ | grep -cE "^-[^-].*[[:space:]]assert[[:space:]]")" = 0 ] && [ "$(git diff "$mb" -- tests/ .github/ | grep -cE "^\+.*pytest\.(mark\.)?(skip|skipif|xfail)")" = 0 ]'
    cwd: .
- id: dod-omn24831-ac1-three-pull-requests-read
  description: 'AC1 reading: the rolling ledger holds STATUS rows of OMN-24831 for at least three DISTINCT job ids among the delegation health check jobs of pull requests 6298, 6094, 6114 and 6204, each row quoting the workflow verdict line (the cause text of the failing step), and one STATUS row for the nightly job 133161076598 quoting "terminal: expected completed, got unknown". Rows are counted by distinct job id, not by row. Only the local Done gate has the ledger.'
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: |-
      bash -c 'rows="$(grep -E "STATUS .*ticket=OMN-24831 " "$ONEX_LEDGER_PATH")"; n="$(printf "%s\n" "$rows" | grep "workflow verdict FAILED for OmniNode-ai/omnimarket delegation-regression-nightly.yml" | grep -oE "job=(133252618204|133191327850|133284863616|133282644929)" | sort -u | wc -l)"; echo "distinct jobs with a quoted cause line: $n"; [ "$n" -ge 3 ] && printf "%s\n" "$rows" | grep "job=133161076598" | grep -q "terminal: expected .completed., got .unknown."'
    cwd: .
- id: dod-omn24831-ac4-lab-line
  description: 'AC4 reading: the pull request BODY (the body field of the watcher state, not the whole record) carries a line that starts with `Lab:`. The comment that names the live head is read by the omn-24851 check. Only the local Done gate reads the watcher.'
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: |-
      bash -c 'python3 "$OMNI_PLUGIN_ROOT/skills/merge-drain/scripts/pr_state_local.py" --pr OmniNode-ai/omnimarket#6326 --json | sed -n "/^{/,\$p" | jq -r ".facts.body" | grep -q "^Lab:"'
    cwd: .
