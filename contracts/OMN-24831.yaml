schema_version: 1.0.0
ticket_id: OMN-24831
title: 'Shared red delegation-health-check / Delegation Health Check: omnimarket dev''s newest delegation-regression-nightly run reads failed, so the check is red on every runtime pull request'
summary: 'The nightly''s Layer-2 runner scored eight cases against rows that never received a terminal outcome as several behavioural misses ("got ''unknown''", "tokens: expected positive"). It now names the one fact, that the row has no terminal outcome, without loosening any case. AC1 (the cause named from three pull requests'' failure text) and AC4 (the Lab line in the pull request body) are read from the ledger and the pull request body, not from hosted CI. This change is a diagnostic: it does not make the lane terminalise delegations, so AC2 (the fix at the source, in the repository that owns the cause) is not met by it.'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24831-nightly-names-its-cause
  statement: The delegation regression nightly states why a case failed on a row with no terminal outcome, and still fails that case.
  acceptance:
  - id: AC2
    statement: 'AC2: one pull request on the default branch of the repository that owns the cause fixes it at the source, with a test that fails on the unfixed code and passes on the fix -- falsifier: `uv run pytest <the new test path> -q` run at the unfixed base commit passes, or `onex scm pr-view` shows no such pull request'
  - id: AC1
    statement: 'AC1: the cause of the red check is read from the failure text of three pull requests and recorded as one STATUS row per pull request with its job id and the quoted line -- falsifier: fewer than three STATUS rows of this ticket carry a job id and a quoted `workflow verdict FAILED` line'
  - id: AC3
    statement: 'AC3: the fix widens or bypasses no check, so the diff removes no assertion and adds no skip, xfail, loosened threshold or changed required-check list -- falsifier: `git diff <base> <head> -- tests/ .github/` shows a removed assert, a new skip or xfail marker or a changed required-check list'
  - id: AC4
    statement: 'AC4: the pull request carries a line starting `Lab:` naming the head, host, command and exit code, and the lane TERMINAL names that head -- falsifier: `onex scm pr-view` shows a body with no `Lab: head=` line'
evidence_requirements:
- kind: tests
  description: The new runner test and the runner tests it sits beside.
  command: env -u PYTHONPATH uv run --frozen pytest tests/delegation_golden/test_runner_unterminalised_row_omn24831.py tests/delegation_golden/test_runner_terminal_ok_omn13543.py -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24831-ac2-names-the-unterminalised-row
  description: A row with terminal_ok NULL scores one failure naming the missing terminal outcome instead of a wrong-terminal line and a token line. The test fails at the merge base, where evaluate_row still reports "got 'unknown'".
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/delegation_golden/test_runner_unterminalised_row_omn24831.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24831-ac3-case-still-fails
  description: Hosted proxy for AC3. The same test file asserts that the eight nightly hard-failure cases still fail on a row with terminal_ok NULL, that a completed row is still judged on its behaviour, and that a wrong terminal keeps its old text. No assertion, skip, xfail or threshold changes.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/delegation_golden/test_runner_unterminalised_row_omn24831.py -q --no-cov -n 0 -p no:randomly -k "the_case_still_fails or StillJudged or still_a_behavioural_miss"
    cwd: .
- id: dod-omn24831-ac2-fails-on-base
  description: 'Fails-on-base check for AC2: the new test file is run against a copy of the head tree whose tests/delegation_golden/runner.py is the merge-base file, and the check passes only when that run FAILS. It needs the origin/dev ref, so only the local Done gate runs it.'
  source: manual
  execution_scope: local_done_gate
  binds_ac:
  - AC2
  checks:
  - check_type: command
    check_value: |-
      bash -c 'd="$(mktemp -d)" && git archive HEAD | tar -x -C "$d" && git show origin/dev:tests/delegation_golden/runner.py > "$d/tests/delegation_golden/runner.py" && cd "$d" && ! env -u PYTHONPATH uv run --frozen pytest tests/delegation_golden/test_runner_unterminalised_row_omn24831.py -q --no-cov -n 0 -p no:randomly -p no:cacheprovider'
    cwd: .
- id: dod-omn24831-ac3-git-diff
  description: 'Git-diff falsifier for AC3: against the base, the diff of tests/ and .github/ removes no assert line, adds no skip or xfail marker, and leaves .github/ untouched. Needs the origin/dev ref, so only the local Done gate runs it.'
  source: manual
  execution_scope: local_done_gate
  binds_ac:
  - AC3
  checks:
  - check_type: command
    check_value: |-
      bash -c 'git diff --quiet origin/dev -- .github/ && [ "$(git diff origin/dev -- tests/ .github/ | grep -cE "^-[^-].*[[:space:]]assert[[:space:]]")" = 0 ] && [ "$(git diff origin/dev -- tests/ .github/ | grep -cE "^\+[[:space:]]*(@pytest\.mark\.(skip|skipif|xfail)|.*pytest\.(skip|xfail)\()")" = 0 ]'
    cwd: .
- id: dod-omn24831-ac1-three-pull-requests-read
  description: 'AC1 reading: the rolling ledger holds at least three STATUS rows of OMN-24831 that carry a job id of a pull request''s delegation health check job and the quoted workflow verdict line (pull requests 6298, 6094, 6114 and 6204 were read). Only the local Done gate has the ledger.'
  source: manual
  execution_scope: local_done_gate
  binds_ac:
  - AC1
  checks:
  - check_type: command
    check_value: |-
      bash -c '[ "$(grep -cE "STATUS .*ticket=OMN-24831 .*job=(133252618204|133191327850|133284863616|133282644929) .*workflow verdict FAILED" "$ONEX_LEDGER_PATH")" -ge 3 ]'
    cwd: .
- id: dod-omn24831-ac4-lab-line
  description: 'AC4 reading: the pull request body carries a line starting `Lab: head=`. The TERMINAL naming the head is read from the ledger, not from this check. Only the local Done gate reads the watcher.'
  source: manual
  execution_scope: local_done_gate
  binds_ac:
  - AC4
  checks:
  - check_type: command
    check_value: |-
      bash -c 'onex scm pr-view OmniNode-ai/omnimarket#6326 --json | grep -q "Lab: head="'
    cwd: .
