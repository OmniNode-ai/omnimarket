schema_version: 1.0.0
ticket_id: OMN-24831
title: 'Shared red delegation-health-check / Delegation Health Check: omnimarket dev''s newest delegation-regression-nightly run reads failed, so the check is red on every runtime pull request'
summary: 'The nightly''s Layer-2 runner scored eight cases against rows that never received a terminal outcome as several behavioural misses ("got ''unknown''", "tokens: expected positive"). It now names the one fact, that the row has no terminal outcome, without loosening any case. This change is a diagnostic: it does not make the lane terminalise delegations, so AC2 (the fix at the source, in the repository that owns the cause) is UNMET by it. A repository contract may bind only criteria that a hosted check proves, so AC2 is not an acceptance entry here; its local Done gate item below is unbound and fails until the fix lands, so that the Done gate of this ticket cannot pass on this change alone. The pull request that carries this contract does not close this ticket.'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24831-nightly-names-its-cause
  statement: The delegation regression nightly states why a case failed on a row with no terminal outcome, and still fails that case.
  acceptance:
  - id: AC3
    statement: 'AC3: the fix widens or bypasses no check, so the diff removes no assertion and adds no skip, xfail, loosened threshold or changed required-check list -- falsifier: `git diff <base> <head> -- tests/ .github/` shows a removed assert, a new skip or xfail marker or a changed required-check list'
evidence_requirements:
- kind: tests
  description: The new runner test and the runner tests it sits beside.
  command: env -u PYTHONPATH uv run --frozen pytest tests/delegation_golden/test_runner_unterminalised_row_omn24831.py tests/delegation_golden/test_runner_terminal_ok_omn13543.py -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24831-diag-names-unterminalised-row
  description: A row with terminal_ok NULL scores one failure naming the missing terminal outcome instead of a wrong-terminal line and a token line. This is a diagnostic and is bound to no acceptance criterion; AC2 (the fix at the source, in the repository that owns the cause) is not met by it and is unbound here. The test fails at the pinned base, where evaluate_row still reports "got 'unknown'".
  source: manual
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/delegation_golden/test_runner_unterminalised_row_omn24831.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24831-ac3-case-still-fails
  description: Hosted proxy for AC3. The same test file asserts that the eight nightly hard-failure cases still fail on a row with terminal_ok NULL, that a completed row is still judged on its behaviour, and that a wrong terminal keeps its old text. No assertion, skip, xfail or threshold changes.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/delegation_golden/test_runner_unterminalised_row_omn24831.py::TestAnUnterminalisedRowIsNamedAsSuch::test_the_case_still_fails[I1] tests/delegation_golden/test_runner_unterminalised_row_omn24831.py::TestAnUnterminalisedRowIsNamedAsSuch::test_the_case_still_fails[I10] tests/delegation_golden/test_runner_unterminalised_row_omn24831.py::TestAnUnterminalisedRowIsNamedAsSuch::test_the_case_still_fails[I3] tests/delegation_golden/test_runner_unterminalised_row_omn24831.py::TestAnUnterminalisedRowIsNamedAsSuch::test_the_case_still_fails[I5] tests/delegation_golden/test_runner_unterminalised_row_omn24831.py::TestAnUnterminalisedRowIsNamedAsSuch::test_the_case_still_fails[I6] tests/delegation_golden/test_runner_unterminalised_row_omn24831.py::TestAnUnterminalisedRowIsNamedAsSuch::test_the_case_still_fails[I7] tests/delegation_golden/test_runner_unterminalised_row_omn24831.py::TestAnUnterminalisedRowIsNamedAsSuch::test_the_case_still_fails[I8] tests/delegation_golden/test_runner_unterminalised_row_omn24831.py::TestAnUnterminalisedRowIsNamedAsSuch::test_the_case_still_fails[I9] tests/delegation_golden/test_runner_unterminalised_row_omn24831.py::TestATerminalisedRowIsStillJudged::test_a_completed_row_with_telemetry_passes tests/delegation_golden/test_runner_unterminalised_row_omn24831.py::TestATerminalisedRowIsStillJudged::test_a_completed_row_with_zero_tokens_yields_the_tokens_line tests/delegation_golden/test_runner_unterminalised_row_omn24831.py::TestATerminalisedRowIsStillJudged::test_a_wrong_terminal_is_still_a_behavioural_miss -q --no-cov -n 0 -p no:randomly -p no:cacheprovider
    cwd: .
- id: dod-omn24831-diag-fails-on-base
  description: "The complete new test file runs against an archive of the watcher-pinned PR head with runner.py replaced by the immutable base 6efbe3ee5027. The control requires ten failures: the eight null-terminal ids, the telemetry id and the new absent-key id. Any other failure count or missing named failure fails the check. Only the local Done gate has the source objects."
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: "bash -c 'set -eo pipefail; h=\"$(python3 \"$OMNI_PLUGIN_ROOT/skills/merge-drain/scripts/pr_state_local.py\" --pr OmniNode-ai/omnimarket#6326 --json | sed -n \"/^{/,\\$p\" | jq -er .facts.head_sha)\"; [[ \"$h\" =~ ^[0-9a-f]{40}$ ]]; b=6efbe3ee5027f6efb67d0b81a1421f0dda32b4e5; t=tests/delegation_golden/test_runner_unterminalised_row_omn24831.py; d=\"$(mktemp -d)\"; trap '\"'\"'rm -rf \"$d\"'\"'\"' EXIT; git archive \"$h\" | tar -x -C \"$d\"; git show \"$b:tests/delegation_golden/runner.py\" > \"$d/tests/delegation_golden/runner.py\"; cd \"$d\"; rc=0; out=\"$(env -u PYTHONPATH uv run --frozen pytest \"$t\" -q --no-cov -n 0 -p no:randomly -p no:cacheprovider 2>&1)\" || rc=$?; printf \"%s\\n\" \"$out\" | tail -3; test \"$rc\" = 1; test \"$(printf \"%s\\n\" \"$out\" | grep -cE \"^FAILED .*test_one_failure_names_the_null_terminal_ok\\[I(1|10|3|5|6|7|8|9)\\]\")\" = 8; printf \"%s\\n\" \"$out\" | grep -q \"^FAILED .*test_it_does_not_report_telemetry_misses_it_cannot_judge\"; printf \"%s\\n\" \"$out\" | grep -q \"^FAILED .*TestAbsentTerminalOk::test_an_absent_key_is_reported_as_absent\"; printf \"%s\\n\" \"$out\" | grep -qE \"(^| )10 failed\"'"
    cwd: .
- id: dod-omn24831-ac3-git-diff
  description: "The diff reads the watcher-pinned PR head and immutable original base 6efbe3ee5027, so a post-merge checkout cannot turn the comparison into an empty diff. origin/HEAD is read only to verify the landing ref exists. The diff removes no assertion, adds no skip vector or xfail and leaves workflows untouched. Only the local Done gate has the refs."
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: "bash -c 'set -eo pipefail; h=\"$(python3 \"$OMNI_PLUGIN_ROOT/skills/merge-drain/scripts/pr_state_local.py\" --pr OmniNode-ai/omnimarket#6326 --json | sed -n \"/^{/,\\$p\" | jq -er .facts.head_sha)\"; [[ \"$h\" =~ ^[0-9a-f]{40}$ ]]; b=6efbe3ee5027f6efb67d0b81a1421f0dda32b4e5; base_ref=\"$(git symbolic-ref refs/remotes/origin/HEAD)\"; test -n \"$base_ref\"; mb=\"$(git merge-base \"$h\" \"$b\")\" && git diff --quiet \"$mb\" \"$h\" -- .github/ && [ \"$(git diff \"$mb\" \"$h\" -- tests/ .github/ | grep -cE \"^-[^-].*[[:space:]]assert[[:space:]]\")\" = 0 ] && [ \"$(git diff \"$mb\" \"$h\" -- tests/ .github/ | grep -cE \"^\\+.*(importorskip|mark\\.(skip|skipif|xfail)|pytest\\.(skip|skipif|xfail))\")\" = 0 ]'"
    cwd: .
- id: dod-omn24831-ac4-lab-line
  description: "AC4 reading: the pull request BODY (the body field of the watcher state, not the whole record) carries a line that starts with `Lab:`. The comment that names the live head is read by the omn-24851 check. Only the local Done gate reads the watcher."
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: "bash -c 'python3 \"$OMNI_PLUGIN_ROOT/skills/merge-drain/scripts/pr_state_local.py\" --pr OmniNode-ai/omnimarket#6326 --json | sed -n \"/^{/,\\$p\" | jq -r \".facts.body\" | grep -q \"^Lab:\"'"
    cwd: .
- id: dod-omn24831-ac2-fix-at-the-source
  description: 'AC2 is UNMET by this change. The check passes only when the watcher state lists a MERGED pull request of the repository that owns the cause (omnibase_infra) naming this ticket, so it fails until that fix lands. It needs the watcher state, so only the local Done gate runs it.'
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: |-
      bash -c 'python3 "$OMNI_PLUGIN_ROOT/skills/merge-drain/scripts/pr_state_local.py" --find OMN-24831 | grep -E "^omnibase_infra#[0-9]+ state=MERGED"'
    cwd: .

- id: dod-omn24831-local-lab-evidence
  description: The existing live PR-comment read is retained under the local Done gate only; lanes cannot run it. A posted Lab comment for the live watcher head must name the exact suite command, exit 0 and a nonempty required-context list from settings. Every required name must have completed success in pr-checks result.runs, and red, pending and cancelled must be present empty lists. Missing source comments or unreadable CI fails closed.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: uv run python -c "from tests.delegation_golden.test_runner_unterminalised_row_omn24831 import _check_live_lab_evidence; _check_live_lab_evidence()"
    cwd: .
