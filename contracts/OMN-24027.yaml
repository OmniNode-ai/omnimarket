schema_version: 1.0.0
ticket_id: OMN-24027
title: A branch deploy to the dev runtime runs as a workflow with a recorded hot patch and a rollback
summary: Three new nodes deploy one open pull request head to the dev runtime through the deploy agent's own signed trigger, record the hot patch in the host install state reducer, read the deploy job's terminal event and the runtime's build record and health, and roll back to the named build when the verification fails. node_branch_deploy_orchestrator composes node_branch_deploy_command_effect (runs the trigger) and node_branch_deploy_probe_effect (reuses the dev deploy reading's runtime probe source).
is_seam_ticket: true
interface_change: true
interfaces_touched:
- topics
requirements:
- id: req-omn24027-branch-deploy
  statement: A pull request head reaches the dev runtime through one node workflow with a recorded actor, head, host and rollback target, and a failed verification rolls back to the named build.
  acceptance:
  - id: AC1
    statement: "AC1: the orchestrator's golden and error chains hold against the real reducer, command effect and probe effect: a good build ends deployed, a wrong build or an unhealthy or unreadable runtime sends the named rollback and ends rolled back, a refused command or a failed or rejected job sends none -- falsifier: uv run pytest tests/nodes/node_branch_deploy_orchestrator/test_orchestrator.py -q fails when the orchestrator stops sending the rollback or sends it after a good build"
  - id: AC2
    statement: "AC2: the command effect builds the deploy agent trigger's own flags and the real trigger's dry run accepts both the deploy and the rollback command -- falsifier: uv run pytest tests/nodes/node_branch_deploy_command_effect -q fails when a flag name changes"
  - id: AC3
    statement: "AC3: the seams (the reducer topics, the effect topics and the deploy agent's job terminal events) are held by tests that fail when either side changes shape -- falsifier: uv run pytest tests/nodes/node_branch_deploy_orchestrator/test_seam.py -q fails when the status key of the deploy agent's completed event is removed or renamed"
  - id: AC4
    statement: "AC4: integrated: after the merge, one run of the workflow for a harmless open change on the development runtime ends deployed and the runtime's build record names that change's head -- falsifier: the reducer record ends failed or rolled back, or the build record's revision does not name the head"
evidence_requirements:
- kind: tests
  description: The three node test suites pass at the pushed head.
  command: uv run pytest tests/nodes/node_branch_deploy_orchestrator tests/nodes/node_branch_deploy_command_effect tests/nodes/node_branch_deploy_probe_effect -q -p no:randomly --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24027-ac1
  description: 'AC1: the orchestrator chain tests pass at the head; sending no rollback after a wrong build turns the rollback tests red.'
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_branch_deploy_orchestrator/test_orchestrator.py -q -p no:randomly --no-cov
    cwd: .
- id: dod-omn24027-ac2
  description: 'AC2: the command effect tests pass at the head; the real trigger dry run accepted the deploy and the rollback command on a lab host.'
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_branch_deploy_command_effect -q -p no:randomly --no-cov
    cwd: .
- id: dod-omn24027-ac3
  description: 'AC3: the seam tests pass at the head on the golden deploy agent events generated from the agent models.'
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_branch_deploy_orchestrator/test_seam.py -q -p no:randomly --no-cov
    cwd: .
- id: dod-omn24027-ac4
  description: 'hosted proxy for AC4: the three suites pass here; the reading on the development runtime after the workflow runs is posted as a pull request comment naming the head.'
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_branch_deploy_orchestrator tests/nodes/node_branch_deploy_command_effect tests/nodes/node_branch_deploy_probe_effect -q -p no:randomly --no-cov
    cwd: .
- id: dod-omn24027-integration-proof
  description: the three suites run on a lab host at the pushed head; hosted CI cannot reach the lab, so only the local Done gate runs this unbound check
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24027 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_branch_deploy_orchestrator tests/nodes/node_branch_deploy_command_effect tests/nodes/node_branch_deploy_probe_effect -q --no-cov -p no:randomly
