schema_version: 1.0.0
ticket_id: OMN-22940
title: "The start-path refusal drill plants a bypassing start on each census path and the census reads every path live with a binding or dead"
summary: A new compute node, node_start_path_census_compute, reads the start-path census against the starts seen and the drills planted. Every path that starts an agent, session or provisioning call is listed live with the binding that calls start admission, or dead, and a start on an unlisted or dead path fails the census. The drill plants a bypassing start through the start-admission effect and the path refuses it only when its enforcement is enforce; in observe it must be logged and started, and an enforced path with no passing drill fails. A request tagged drill on the test instance is drill evidence only and never clears, hides or downgrades an operational failure. The path list is the start_path_census overlay and the enforcement of each path is the start_admission policy; no start path calls the node yet.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn22940-start-path-census
  statement: The start-path census lists every start path live with a binding or dead, and the refusal drill plants a bypassing start on each.
  acceptance:
  - id: AC1
    statement: "AC1: the census lists every path that starts an agent, session or provisioning call as live with a binding or dead, and an unlisted start fails the census -- falsifier: uv run pytest src/omnimarket/nodes/node_start_path_census_compute -q -k census"
  - id: AC2
    statement: "AC2: the drill plants a bypassing start on a path and that path refuses it only when its enforcement is enforce -- falsifier: uv run pytest src/omnimarket/nodes/node_start_path_census_compute -q -k drill"
  - id: AC3
    statement: "AC3: a drill request tagged drill never suppresses an operational failure -- falsifier: uv run pytest src/omnimarket/nodes/node_start_path_census_compute -q -k drill_tag"
evidence_requirements:
- kind: tests
  description: The acceptance tests of this ticket at the pushed head.
  command: uv run --frozen pytest src/omnimarket/nodes/node_start_path_census_compute -q --no-cov -n 0 -p no:randomly
