    cwd: .
- id: dod-omn22940-drill
  description: The real start-admission effect over the in-memory gate store refuses a planted bypassing start in enforce and logs and starts it in observe; a path that refuses in observe, lets the bypass through in enforce, runs in another mode than declared, or is enforced with no drill fails.
  source: manual
  binds_ac:
