schema_version: 1.0.0
ticket_id: OMN-17992
title: Move deployment routing facts into private overlays
summary: 'Lane scope: remove deployment values from the two shipped routing tables,
  bind immutable private snapshots, and refuse absent or corrupt overlays. The epic-wide
  hygiene gate and unrelated inventory cleanup remain outside this lane.'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: routing-overlay
  statement: Deployment configuration is private data; public repositories ship portable
    contracts only.
  acceptance:
  - id: AC1
    statement: The public routing contract contains no host or instance values; the
      private snapshot preserves the previous configuration.
  - id: AC2
    statement: Readers resolve the overlay through the measured existing configuration
      roots and fail with a named error if it is absent or corrupt.
  - id: AC3
    statement: The migration preserves routing agreement for a command source ref
      and retains integrity checks; production deployment routing is unchanged.
evidence_requirements:
- kind: tests
  description: Portable configuration, missing-overlay and snapshot parity controls.
  command: uv run pytest tests/unit/scripts/test_private_ci_bus_overlay_omn17992.py
    -q -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
