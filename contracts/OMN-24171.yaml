schema_version: 1.0.0
ticket_id: OMN-24171
title: 'Evals: one projection that keeps every scored try, its trace and each model''s pass rate'
summary: A new projection node keeps every scored try (eval_item_scores), every part of every trace (eval_item_traces), what a run's close registered (eval_run_closes) and a pass rate per run recounted from first tries (eval_run_rates), from the coding-trial try rows, the reviewer-model verdicts on live work, the run-close notices and the traces, and publishes a compact snapshot of the tracking runs on every change and on each runtime tick.
is_seam_ticket: false
interface_change: true
interfaces_touched:
- events
requirements:
- id: req-omn24171-eval-results-projection
  statement: One projection keeps every scored try, its trace and each model's pass rate; replaying every input gives identical tables, a late or repeated event cannot change a stored row, a run shows no rate until all its attempts are in, and the snapshot stays under its size bound at the retention limits.
  acceptance:
  - id: AC1
    statement: 'AC1: the golden chain on the in-memory bus over all four source topics gives exactly the expected item, trace and run-rate rows and replaying every event gives the same tables -- falsifier: `uv run pytest tests/test_golden_chain_projection_eval_results.py -q` fails if the item or trace or run-rate table is empty after consumption or differs after replay'
  - id: AC2
    statement: 'AC2: two events for one item at an equal time that differ in any stored field leave the same row in either arrival order, and every field of the event model is stored -- falsifier: a fold test delivering the pair both ways, once differing only in the step verdict source, and a test iterating every field of the event model against the stored row so a dropped column fails'
  - id: AC3
    statement: 'AC3: rates are recounts of first tries: a task with three tries counts once, an infrastructure-unscorable try is outside the count, a model-class one counts as not passed, and a close shows no rate until all its attempts are in -- falsifier: fold tests with one fixture of each, and two delivery orders (close before the items; close, then an unscorable first try, then its successful retry), each reading closing with no snapshot rate until the last event'
  - id: AC4
    statement: 'AC4: the snapshot carries only tracking runs, fits under 900,000 bytes at the retention limits, and is republished on a tick with a new publish time and unchanged run times -- falsifier: the worst-case fixture at the caps is under the bound, an oversized fixture and a 201-character model id each get a typed refusal, and a writer test with an injected tick asserts the new publish time'
  - id: AC5
    statement: 'AC5: integrated: on the dev lane the installed projection''s tables fill from the existing coding-trial topic -- falsifier: a SQL count by run id on the dev database equals the count on the existing results table for every run id, read after the dev tag installs'
evidence_requirements:
- kind: tests
  description: The eval-results projection tests pass at the pushed head.
  command: uv run --frozen pytest tests/nodes/node_projection_eval_results tests/test_golden_chain_projection_eval_results.py -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24171-ac1
  description: 'AC1: the golden chain over the four source topics on the in-memory bus fills the item, trace and run-rate tables and replay, in the same and the reverse order, gives the same tables'
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/test_golden_chain_projection_eval_results.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24171-ac2
  description: 'AC2: an equal-time pair leaves the same row in either order (once differing only in the step verdict source) and every field of the event model has its stored column'
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_projection_eval_results/test_item_storage.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24171-ac3
  description: 'AC3: first-try recounts (three tries count once, infrastructure-unscorable outside n, model-class counted as not passed) and a close that shows no snapshot rate until its last event, in both delivery orders'
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_projection_eval_results/test_rates.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24171-ac4
  description: 'AC4: the worst-case snapshot at the caps is under 900,000 bytes, an oversized fixture and a 201-character model id each get a typed refusal, only tracking runs reach it, and a tick republishes with a new publish time and unchanged run times'
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_projection_eval_results/test_snapshot.py tests/nodes/node_projection_eval_results/test_writer.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24171-ac5
  description: 'AC5: on the dev lane the installed projection''s tables fill from the existing coding-trial topic: the row count by run id in eval_item_scores equals the count by run id in context_roi_scores for every run id, and a run id is present. The check divides by zero (and so fails) when no run id holds a row or any run id differs; it is run at the local Done gate after the dev tag installs, never on the hosted runner.'
  source: manual
  execution_scope: local_done_gate
  binds_ac:
  - AC5
  checks:
  - check_type: command
    check_value: ssh omni-201 "docker exec omnibase-infra-postgres psql -U postgres -d omnidash_analytics -At -c \"select 1/(case when exists (select 1 from public.eval_item_scores where task_set_id = 'code_eval_suite') and not exists (select 1 from (select run_id, count(*) as n from public.context_roi_scores group by run_id) a full join (select run_id, count(*) as n from public.eval_item_scores where task_set_id = 'code_eval_suite' group by run_id) b using (run_id) where a.n is distinct from b.n) then 1 else 0 end)\""
- id: dod-omn24171-integration-proof
  description: the eval-results projection tests run on a lab host at the pushed head; hosted CI cannot reach the lab, so only the local Done gate runs this unbound check
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24171 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_projection_eval_results tests/test_golden_chain_projection_eval_results.py -q --no-cov -n 0 -p no:randomly
