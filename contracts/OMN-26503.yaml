schema_version: 1.0.0
ticket_id: OMN-26503
title: 'omnimarket dev fails mypy at priced_spend.py:183 after 6594: the free-price check still passes the removed supplemental argument'
summary: '_catalogue_declares_free in src/omnimarket/models/priced_spend.py calls byok_model_price_per_1m with its current signature (no supplemental argument, no models_dev_price), so the declared catalogue price and then the model registry price are read and models.dev never is, and the strict mypy check passes.'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn26503-catalogue-declares-free-call
  statement: _catalogue_declares_free prices a model with the current byok_model_price_per_1m signature and keeps the catalogue-only reading.
  acceptance:
  - id: AC1
    statement: 'AC1: a unit test of _catalogue_declares_free over a catalogue row whose model the catalogue declares at price zero and one it declares at a nonzero price fails on dev today with a TypeError and passes after the fix, and the catalogue-only reading (never models.dev) is kept -- falsifier: uv run pytest tests/unit -k catalogue_declares_free -q in omnimarket'
  - id: AC2
    statement: 'AC2: the mypy-type-check hook passes on src/omnimarket/models/priced_spend.py with the call using the current signature -- falsifier: uv run mypy src/omnimarket/models/priced_spend.py --strict exits 0 in omnimarket'
  - id: AC3
    statement: 'AC3: the fix is a PR against omnimarket dev handed to the landing controller, and the orchestrator is sent one message naming it when its checks are green -- falsifier: uv run pytest tests/unit -k priced_spend -q passes and the ledger holds one MSG to orchestrator-31d9-swarm naming the PR'
evidence_requirements:
- kind: tests
  description: The catalogue_declares_free tests pass at the pushed head.
  command: uv run pytest tests/unit/projection/test_omn26503_catalogue_declares_free.py -q -n 0 --no-cov -p no:cacheprovider
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn26503-ac1
  description: 'AC1: the free, nonzero-priced and unpriced models are read from the catalogue and the registry, no models.dev lookup is passed or made (failing control: on the base the same file fails with TypeError on the supplemental keyword).'
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/projection/test_omn26503_catalogue_declares_free.py -q -n 0 --no-cov -p no:cacheprovider
    cwd: .
- id: dod-omn26503-ac2
  description: 'AC2: strict mypy exits 0 on the file whose call used the removed argument.'
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/projection/test_omn26503_catalogue_declares_free.py -q -n 0 --no-cov -p no:cacheprovider
    cwd: .
  - check_type: command
    check_value: uv run mypy src/omnimarket/models/priced_spend.py --strict
    cwd: .
- id: dod-omn26503-ac3
  description: 'hosted proxy for AC3: the priced_spend tests pass; the landing handoff and the one MSG to orchestrator-31d9-swarm are ledger rows written after the checks are green and are not met by this change alone.'
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/projection/test_omn24615_priced_spend.py tests/unit/projection/test_omn26503_catalogue_declares_free.py -q -n 0 --no-cov -p no:cacheprovider
    cwd: .
- id: dod-omn26503-integration-proof
  description: the catalogue_declares_free tests and strict mypy run on a lab host at the pushed head; hosted CI cannot reach the lab, so only the local Done gate runs this unbound check
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-26503 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/projection/test_omn26503_catalogue_declares_free.py -q --no-cov
