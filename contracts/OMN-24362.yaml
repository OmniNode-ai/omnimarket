schema_version: 1.0.0
ticket_id: OMN-24362
title: A node contract change also runs the node inventory test
summary: 'The change-aware test selector narrowed a node contract.yaml change to the node''s own tests and skipped tests/test_market_node_runtime_dogfood.py, the test that walks every node directory, contract
  and onex.nodes entry point (52 paths chosen for omnimarket#6071 and omnimarket#6054, none of them this test). The adjacency configuration gains a reviewed path_triggered_selected_paths rule: a changed
  src/omnimarket/nodes/*/contract.yaml adds that test to a narrowed selection. A handler change does not, a pyproject.toml entry point change already takes the full suite, and a new test file holds the
  failing control. Not in this change: whether the CI variable ENABLE_SMART_TESTS is set (the narrowed selection only runs when it is).'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24362-contract-selects-inventory
  statement: A changed node contract.yaml adds the node inventory test to a narrowed selection, through a reviewed entry in the selector configuration.
  acceptance:
  - id: AC1
    statement: 'AC1: a changed node contract.yaml adds the node inventory test to a narrowed test selection and a changed node handler does not -- falsifier: pytest tests/unit/scripts/test_detect_test_paths.py -q
      -k inventory_test fails at the base, where the contract change selects no inventory test'
  - id: AC2
    statement: 'AC2: a malformed path-triggered entry (a path outside tests/) is refused when the selection configuration loads -- falsifier: pytest tests/unit/scripts/test_detect_test_paths.py -q -k path_triggered
      shows the entry accepted'
  - id: AC3
    statement: 'AC3: integrated: python -m scripts.ci.detect_test_paths run on a lab host over a changed-files list holding one node contract.yaml prints a selection whose selected_paths hold tests/test_market_node_runtime_dogfood.py,
      the step the CI detect-changes job runs -- falsifier: the printed selected_paths lack that test'
evidence_requirements:
- kind: tests
  description: The selector tests pass at the pushed head.
  command: uv run --frozen pytest tests/unit/scripts/test_detect_test_paths.py -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24362-ac1-ac2
  description: 'AC1 and AC2: the selector adds the inventory test for a node contract change, not for a handler change, and refuses a path-triggered entry outside tests/. The failing control: against the
    origin/dev adjacency file the contract-change test fails because the selection holds no inventory test.'
  source: manual
  binds_ac:
  - AC1
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/scripts/test_detect_test_paths.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24362-ac3
  description: 'hosted proxy for AC3: the selector tests pass at the pull request head; the lab run of python -m scripts.ci.detect_test_paths over a node contract change (104 selected paths, the inventory test
    among them, split count 5) and over a handler change (103 paths, none the inventory test) on h053 is named in the pull request.'
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/scripts/test_detect_test_paths.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24362-integration-proof
  description: the selector tests run on a lab host at the pushed head; hosted CI cannot reach the lab, so only the local Done gate runs this unbound check
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24362 --kind test -- env PYTHONDONTWRITEBYTECODE=1
      uv run --frozen pytest tests/unit/scripts/test_detect_test_paths.py -q --no-cov
    cwd: .
