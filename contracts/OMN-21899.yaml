    description: "The focused node tests pass."
    command: "uv run pytest tests/unit/nodes/node_issuer_overlay_delivery_effect/test_overlay_delivery.py -q --no-cov"
  - kind: "tests"
    description: "The run and derive suites pass at the pushed head."
    command: "uv run pytest tests/unit/nodes/test_node_host_bringup_run.py tests/unit/nodes/test_node_host_declaration_derive.py -q --no-cov"
