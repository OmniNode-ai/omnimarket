schema_version: "1.0.0"
ticket_id: "OMN-21899"
title: "Host bring-up automation units: overlay delivery, issuer build, ledger-copy check, standing reconcile, cap in config"
summary: "Unit 1 of the principal-issuer bring-up: the overlay delivery effect node. Units 2 to 5 and the gated recreate, mint and host-row flip are not in this pull request."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-omn21899-bringup-units"
    statement: |-
      Each hand step of principal-issuer bring-up is one node command; a host, path or version comes from the request, never from a contract.
    acceptance:
      - id: "AC1"
        statement: "AC1: one command delivers the overlay to the issuer host and the env file carries PRINCIPAL_ISSUER_OVERLAY_FILE, read back from the host -- falsifier: uv run pytest tests/unit/nodes/node_issuer_overlay_delivery_effect/test_overlay_delivery.py -q"
  - id: "req-omn21899-bringup-run"
    statement: |-
      One run drives one host toward one top target, one action per pass, under a fenced lease; exit 0 up, 75 waiting on a person, 1 a target failed, 2 usage, 3 the lease is held or the fence was replaced; one terminal per run id, emitted before the lease is released; every run owed a terminal is closed abandoned at takeover; every host action runs inside the fenced lock and renews the lease to start plus lease_grace_s; a wait passes only on its check reading ok.
  - id: "req-omn21899-declared-once"
    statement: |-
      A host is declared once in the owner copy of the lab host table; every other copy is derived from it, a hand-added host, column or value in any copy is named by surface, host and field, and the in-service flip changes the declaration only.
evidence_requirements:
