schema_version: 1.0.0
ticket_id: OMN-23056
title: The floor queue-age reading starts a handed-off pull request's wait at its landing handoff
summary: node_floor_simple_effect read_watcher starts a queued pull request's wait at the later of its last finished check and the landing handoff recorded for the same head, so checks that finished while the pull request was a draft no longer age a pull request that was just handed to landing. A pull request with no handoff, or a handoff for another head, still counts from its last check. The alarm bound is unchanged.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23056-queue-age-from-handoff
  statement: A pull request handed to the landing controller for its current head counts its queue wait from the handoff time; one with no handoff, or a handoff for an older head, still counts from its last finished check.
  acceptance:
  - id: AC1
    statement: 'AC1: a pull request handed to the landing controller for its current head counts its wait from the handoff time, and a pull request with no handoff or a handoff for an older head still alarms from its last check -- falsifier: uv run pytest tests/nodes/node_floor_simple_effect/test_queue_age_handoff_floor_simple.py -q'
  - id: AC2
    statement: 'AC2: a failing control: the same test file fails at least 2 of its 5 tests against origin/dev sources.py before the change -- falsifier: uv run pytest tests/nodes/node_floor_simple_effect/test_queue_age_handoff_floor_simple.py -q with origin/dev sources.py'
evidence_requirements:
- kind: tests
  description: The five handoff queue-age tests pass with the change
  command: uv run --frozen pytest tests/nodes/node_floor_simple_effect/test_queue_age_handoff_floor_simple.py -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23056-handoff-tests
  description: Runs the five handoff queue-age tests; a handoff for the current head after 63-minute-old draft-era checks reads a 2 minute wait, and no handoff reads 63.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_floor_simple_effect/test_queue_age_handoff_floor_simple.py -q --no-cov
    cwd: .
- id: dod-omn23056-failing-control
  description: Failing control. The merge base sources.py, without the handoff start, fails the golden handoff test and the old-handoff test, so the test file fails at least 2 of its 5 tests before the change. The check exits 0 only when pytest exits nonzero against the merge-base copy.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: command
    check_value: 'bash -c ''f=src/omnimarket/nodes/node_floor_simple_effect/handlers/sources.py; cp "$f" /tmp/omn23056_fixed.py; git show origin/dev:"$f" > "$f"; if uv run --frozen pytest tests/nodes/node_floor_simple_effect/test_queue_age_handoff_floor_simple.py -q --no-cov; then r=1; else r=0; fi; cp /tmp/omn23056_fixed.py "$f"; exit $r'''
    cwd: .
  execution_scope: local_done_gate
- id: dod-omn23056-deploy-probe
  description: Deploy probe. The sources.py GitHub serves at the checked-out commit reads the landing handoff head for the queue wait; the probe exits nonzero on a tree without it, so it fails at the merge base.
  source: manual
  checks:
  - check_type: command
    check_value: gh api "repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_floor_simple_effect/handlers/sources.py?ref=$(git rev-parse HEAD)" --jq .content | base64 -d | grep -F 'handoff.get("head") == facts.get("head_sha")' > /dev/null
    cwd: .
