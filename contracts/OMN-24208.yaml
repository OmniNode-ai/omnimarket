schema_version: 1.0.0
ticket_id: OMN-24208
title: Container unit installer applies a declared memory limit
summary: 'Child of OMN-24153. node_host_installer_container_units keeps a declared docker container running through a systemd user unit but could not apply a changed memory limit to a container that already exists. A unit may now declare memory_gib and memory_swap_gib (both or neither; swap, which is memory plus swap, not below memory). On install the handler reads the running container''s HostConfig.Memory and MemorySwap and, when they differ, runs docker update --memory --memory-swap on it: applied live, no restart, no recreate; a failed update refuses the install with nothing written; status reports the limit as OK or DIFFERS. The package cache declaration on the main lab host (4 GiB, 8 GiB memory plus swap, equal to docker/docker-compose.pypi-cache.yml mem_limit 4g with docker''s default swap of twice the limit) goes in the overlays repository once this merges, because that overlay is validated against the merged model. Not in this change: the installer run on the main lab host and the readings after it (AC3).'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24208-memory
  statement: A declared unit's memory limit is applied to the running container in place and read back.
  acceptance:
  - id: AC1
    statement: 'AC1: a unit in the container unit installer can declare a memory limit and the installer sets it on the running container with no restart, and refuses a limit declared without its swap value -- falsifier: pytest tests/nodes/node_host_installer_container_units -k memory -q fails when the installer''s update call is removed'
  - id: AC2
    statement: 'AC2: the lab overlay declares the package cache unit on the main lab host with a 4 GiB limit -- falsifier: the overlay''s own test fails when the unit or the limit is removed'
- id: req-omn24208-integrated
  statement: The running cache container carries the declared limit and stops hitting it.
  acceptance:
  - id: AC3
    statement: 'AC3: integrated: after the installer runs on the main lab host the cache container''s memory limit reads 4294967296, the container was not recreated, and its limit-hit counter stops rising for one hour -- falsifier: docker inspect still reads 2147483648 or the max line of the container''s memory events keeps increasing'
evidence_requirements:
- kind: tests
  description: The installer tests pass at the pushed head and the memory tests fail when the update call is removed.
  command: uv run --frozen pytest tests/nodes/node_host_installer_container_units -q -p no:cacheprovider --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24208-ac1
  description: 'The model refuses a half-declared or inverted limit, memory_problem compares the running limit to the declaration, the install calls docker update with the declared bytes and no other flag, a matching container gets no update call, and a failed update writes no unit file; with the update call removed the golden chain test fails.'
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_host_installer_container_units -k memory -q -p no:cacheprovider --no-cov
    cwd: .
- id: dod-omn24208-ac2
  description: 'The overlay for the package cache unit is a change in the overlays repository that cannot merge before this one (its CI validates it against the merged model); its own test is the proof of this criterion there. Hosted proxy here: the installer tests pass at the head.'
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_host_installer_container_units -q -p no:cacheprovider --no-cov
    cwd: .
- id: dod-omn24208-ac3
  description: 'The tests behind the installer pass at the head; the run of the installer on the main lab host and the hour-long reading of the limit-hit counter need that host and are read there; hosted CI cannot reach it.'
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_host_installer_container_units -q -p no:cacheprovider --no-cov
    cwd: .
- id: dod-omn24208-integration-proof
  description: the installer tests run on a lab host at the pushed head; hosted CI cannot reach the lab, so only the local Done gate runs this unbound check. The run of the installer on the main lab host itself is the pull request's follow-up Lab comment.
  source: manual
