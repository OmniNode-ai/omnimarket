schema_version: "1.0.0"
ticket_id: "OMN-21051"
title: "Readiness gate publishes a BLOCKED decision on readiness-gate-blocked"
summary: >-
  node_readiness_gate_orchestrator returned one ModelDeploymentReadinessResult
  for every decision and its contract had no published_events map, so a BLOCKED
  result was published on readiness-gate-completed and readiness-gate-blocked
  never carried an event. The handler now returns ModelReadinessGateBlocked for a
  BLOCKED decision and the contract maps it to readiness-gate-blocked.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-blocked-terminal"
    statement: "A BLOCKED readiness decision is published on the blocked terminal topic; every other decision stays on the completed topic."
    acceptance:
      - id: "AC1"
        statement: >-
          AC1: A gap report or pre-scored readiness whose state is BLOCKED is published on onex.evt.omnimarket.readiness-gate-blocked.v1 and its payload still validates as ModelDeploymentReadinessResult -- falsifier: uv run pytest tests/unit/nodes/test_readiness_gate_orchestrator_terminal_routing.py -k blocked fails on the head without this change
      - id: "AC2"
        statement: >-
          AC2: A clean (READY) or STALE (DEGRADED) gap report is still published on onex.evt.omnimarket.readiness-gate-completed.v1 -- falsifier: uv run pytest tests/unit/nodes/test_readiness_gate_orchestrator_terminal_routing.py -k completed
evidence_requirements:
  - kind: "tests"
    description: "Terminal routing through the dispatch adapter and the production result applier on the real contract file."
    command: "uv run pytest tests/unit/nodes/test_readiness_gate_orchestrator_terminal_routing.py -q -n 0"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn21051-ac1-blocked-topic"
    description: "BLOCKED gap reports and pre-scored BLOCKED readiness are published on the blocked topic with a payload that validates as ModelDeploymentReadinessResult. Both topic tests fail at the merge base."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/nodes/test_readiness_gate_orchestrator_terminal_routing.py -q -n 0 -k blocked"
    binds_ac: ["AC1"]
  - id: "dod-omn21051-ac2-completed-topic"
    description: "Clean and STALE (DEGRADED) gap reports are still published on the completed topic, and the contract maps the plain result class to that topic in published_events. The mapping test fails at the merge base."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/nodes/test_readiness_gate_orchestrator_terminal_routing.py -q -n 0 -k completed"
    binds_ac: ["AC2"]
  - id: "dod-omn21051-deploy-probe"
    description: "Deploy probe: the node contract read from GitHub at the checked-out commit maps ReadinessGateBlocked to the blocked topic in published_events. A head without this change has no such entry and fails the probe."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: "gh api \"repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_readiness_gate_orchestrator/contract.yaml?ref=$(git rev-parse HEAD)\" --jq .content | base64 -d | grep -c '^  - event_type: ReadinessGateBlocked$'"
