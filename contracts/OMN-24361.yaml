schema_version: 1.0.0
ticket_id: OMN-24361
title: Delegation tab shows models, success over time, experiments and scenarios
summary: The Delegation tab page is rebuilt as four views; the models, success and experiments views are drawn from delegation-history.json (schema id omnimarket.floor_delegation_history.v1) and the scenarios view keeps the nine tracker scenarios with a pass history strip each. An unreadable, stale or wrong-schema history is said so on the page and no number is drawn from it.
is_seam_ticket: true
interface_change: true
interfaces_touched:
- public_api
requirements:
- id: req-omn24361-delegation-tab-four-views
  statement: The Delegation tab draws models, success over time and experiments from the history document and the nine scenarios with their pass history, and never invents a field the history schema does not carry.
  acceptance:
  - id: AC1
    statement: "AC1: the delegation tab shows four views (models, success over time, experiments, scenarios) each drawn non-empty from the history document fixture -- falsifier: pytest tests/nodes/node_factory_floor_publish_effect/test_delegation_history_page.py -k golden -q"
  - id: AC2
    statement: "AC2: a field the page reads that the history schema does not carry fails a test, and an unreadable or stale history is said so on the page, never drawn as numbers -- falsifier: pytest tests/nodes/node_factory_floor_publish_effect/test_delegation_history_page.py -k 'schema or error or failing_control' -q"
  - id: AC3
    statement: "AC3: the scenarios view keeps the nine tracker scenarios, each with a pass history strip, and the existing delegation page tests still pass -- falsifier: pytest tests/nodes/node_factory_floor_publish_effect/test_delegation_page.py -q"
  - id: AC4
    statement: "AC4: integrated: the page served on the h051 board port 8088 draws all four views from the published delegation-history.json, read in the running runtime -- falsifier: open the served delegation page on h051 and find any of the models, success or experiments views empty or showing that no history can be read"
evidence_requirements:
- kind: tests
  description: The history page tests and the existing delegation page tests pass at the pushed head.
  command: uv run pytest tests/nodes/node_factory_floor_publish_effect/test_delegation_history_page.py tests/nodes/node_factory_floor_publish_effect/test_delegation_page.py -q -p no:randomly --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24361-ac1
  description: 'AC1: the golden test passes at the head; the page at the merge base has no history views, so the same test fails there.'
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_factory_floor_publish_effect/test_delegation_history_page.py -k golden -q -p no:randomly --no-cov
    cwd: .
- id: dod-omn24361-ac2
  description: 'AC2: the schema-field test, the error tests and the failing controls pass at the head.'
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_factory_floor_publish_effect/test_delegation_history_page.py -k "schema or error or failing_control" -q -p no:randomly --no-cov
    cwd: .
- id: dod-omn24361-ac3
  description: 'AC3: the existing delegation page tests and the strip assertion pass at the head.'
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_factory_floor_publish_effect/test_delegation_page.py tests/nodes/node_factory_floor_publish_effect/test_delegation_history_page.py -q -p no:randomly --no-cov
    cwd: .
- id: dod-omn24361-ac4
  description: 'hosted proxy for AC4: the page tests pass here; the reading of the served page on the h051 board port 8088 after the install is posted as a pull request comment naming the head.'
  source: manual
  binds_ac:
  - AC4
  checks:
