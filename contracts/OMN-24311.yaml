schema_version: "1.0.0"
ticket_id: "OMN-24311"
title: "The hourly runner group reading signs in through the lab key store"
summary: "node_runner_group_exposure_effect's token_mint overlay block gains a required, nullable store block: a secret store block (the shared secret store overlay model) and the store folder holding the App id and the App private key. With a store block the minter reads both names through that store with the machine's identity file and never from the process environment; with null it keeps the process environment as before. The h053 unit had no store connection, so every mint failed; its settings file now declares the read-only PR reader App's two secret names and the tailnet store block the delegation scenario unit already uses."
is_seam_ticket: true
interface_change: true
interfaces_touched:
  - "public_api"
requirements:
  - id: "req-omn24311-store-token-mint"
    statement: |-
      The runner group exposure minter resolves the App id and key through the secret store block its settings file declares.
    acceptance:
      - id: "AC1"
        statement: "AC1: the runner group exposure source resolves the App id and private key through the secret store block its settings file declares, and never from the process environment when that block is declared -- falsifier: pytest tests/nodes/node_runner_group_exposure_effect/test_store_token_mint.py -q fails at the base, where the settings model refuses the block"
      - id: "AC2"
        statement: "AC2: an unreachable store, a missing key or an unreadable identity reads UNKNOWN with its own reason and makes no GitHub call -- falsifier: the error chain test in the same file fails if any GitHub call is made or the reason cell is missing"
      - id: "AC3"
        statement: "AC3: the settings file declares the read-only App's secret names in the overlays repository, with no value in the file -- falsifier: pytest tests/test_runner_group_exposure_overlay.py -q in the overlays repository fails if a value, a stored token name or the identity file is absent"
      - id: "AC4"
        statement: "AC4: integrated, read in the running runtime on h053: onex-runner-group-exposure-hourly.service installed from the branch revision runs once and its reading line carries no token-mint-failed reason; it reads WORKING, NOT WORKING, or names the missing App permission -- falsifier: the unit log line still reads reason=token-mint-failed or org-read-denied alone"
evidence_requirements:
  - kind: "tests"
    description: "The exposure effect's golden chain, error chain, token mint, store token mint, permission refusal, reading writer and overlay tests."
    command: "uv run pytest tests/nodes/node_runner_group_exposure_effect -q --no-cov"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn24311-store-token-mint"
    description: "The store token mint tests pass at the head; with the three source files of origin/dev put back they fail (the failing control)."
    source: "manual"
    binds_ac: ["AC1", "AC2", "AC4"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_runner_group_exposure_effect -q --no-cov"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn24311-overlay-declaration"
    description: "The overlays repository declares the settings file of the h053 unit: the read-only App's two secret names, the store block, no value."
    source: "manual"
    binds_ac: ["AC3"]
    checks:
      - check_type: "command"
        check_value: "uv run pytest tests/test_runner_group_exposure_overlay.py -q"
        cwd: "${OMNI_HOME}/overlays"
  - id: "dod-omn24311-integration-proof"
    description: "Run the exposure effect's tests on a lab host at the pushed head. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check. It binds no acceptance criterion: the runtime reading (AC4) is read on h053 after the unit is reinstalled from the branch."
    source: "manual"
    execution_scope: "local_done_gate"
    checks:
      - check_type: "command"
        check_value: "env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha \"$(git rev-parse HEAD)\" --lane dod-integration-proof-24311 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_runner_group_exposure_effect -q --no-cov"
        cwd: "."
