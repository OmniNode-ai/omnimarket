dod_evidence:
- id: dod-omn22625-read-only-principal
  description: The PR-added tests replay the gate, the probe and the key install through the contract-bound handlers with injected executors and a fake transport. Four named breaks (a planted rm entry,
    a dropped refused pattern, an executor that accepts every mutation, a probe that ignores its narrowing) each turn their test red. These tests fail at the merge base, where the node does not exist. No
    real credential is read here; the refusal read from a real credential is the operator-run probe after the key install.
  source: manual
  binds_ac:
  - AC140
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_read_only_principal_effect/test_read_only_principal.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn22625-integration-proof-live
  description: 'Integration proof on a lab host through the central test location: the read-only principal gate, probe and key install tests run as a lab work unit at the pushed sha on the declared bus
    lane, so the send, run and receipt path carries them.'
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-22625 -- uv run --frozen pytest tests/nodes/node_read_only_principal_effect/test_read_only_principal.py
      -q --no-cov -n 0 -p no:randomly
    cwd: .
