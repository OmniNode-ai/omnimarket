requirements:
- id: req-omn22625-read-only-principal
  statement: A mutating step under the read-only principal is refused by the credential, and a probe reads the refusal from a real mutating attempt on each channel.
  acceptance:
  - id: AC140
    statement: 'AC140: the ssh forced-command gate runs only an allowlisted request as argv with no shell and refuses a mutating or malformed request with its rule name; the probe fails when a mutation
      is accepted, when it fails without a refusal word, when a read fails, or when a channel has no scripted attempts, and a probe narrowed to some channels reads PASS-PARTIAL; the key install is idempotent
      and a dry run writes nothing -- falsifier: uv run --frozen pytest tests/nodes/node_read_only_principal_effect/test_read_only_principal.py -q --no-cov -n 0 -p no:randomly'
evidence_requirements:
