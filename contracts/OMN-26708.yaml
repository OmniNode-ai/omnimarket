schema_version: "1.0.0"
ticket_id: "OMN-26708"
title: "The lane work projection: one row per workflow with its current state and terminal fields, written by a two-class projection node"
summary: "node_projection_lane_work folds the lane work receipts of omnibase_core's lane work types into one row per workflow in omninode_internal.lane_work_workflow, upserted by workflow id under a seq guard, with a terminal-rows exposure for the orchestrator's view and a current-state exposure by workflow."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-omn26708-writer"
    statement: |-
      The writer writes one row per workflow.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: the writer writes rows -- falsifier: the integration test asserts N rows after N workflows and no "Projection handler wrote zero rows" log line
  - id: "req-omn26708-replay"
    statement: |-
      Replaying the transition topic twice gives the same table.
    acceptance:
      - id: "AC2"
        statement: |-
          AC2: replaying the transition topic twice gives the same table -- falsifier: a test folds twice and compares
  - id: "req-omn26708-derived"
    statement: |-
      Duration and help counts come from receipt timestamps and receipt kinds.
    acceptance:
      - id: "AC3"
        statement: |-
          AC3: duration and help counts come from receipt timestamps with no defaults -- falsifier: a fold test asserts the columns are derived and non-null
  - id: "req-omn26708-terminal"
    statement: |-
      The terminal-rows query returns only ended workflows.
    acceptance:
      - id: "AC4"
        statement: |-
          AC4: the terminal-rows query returns only ended workflows -- falsifier: a test with one live and two ended workflows asserts two rows
evidence_requirements:
  - kind: "tests"
    description: "The node's tests pass at the pushed head and fail before the node exists."
    command: "uv run pytest tests/unit/nodes/node_projection_lane_work -m unit -q -n 0 --no-cov"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn26708-ac1-writer"
    description: "N workflows give N rows through the projection wiring path, a replayed receipt writes zero rows, and no zero-rows log line is emitted; every test fails with an import error before the node exists."
    source: "manual"
    binds_ac: ["AC1"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/nodes/node_projection_lane_work/test_lane_work_writer.py -q -n 0 --no-cov"
        cwd: "."
  - id: "dod-omn26708-ac2-replay"
    description: "A fold of the receipts twice equals a fold once."
    source: "manual"
    binds_ac: ["AC2"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/nodes/node_projection_lane_work/test_lane_work_fold.py -q -n 0 --no-cov -k replaying_the_transition_topic_twice"
        cwd: "."
  - id: "dod-omn26708-ac3-derived"
    description: "Duration, help count and transition count are derived from receipt timestamps and kinds and are non-null."
    source: "manual"
    binds_ac: ["AC3"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/nodes/node_projection_lane_work/test_lane_work_fold.py -q -n 0 --no-cov -k derived_from_receipt_timestamps"
        cwd: "."
  - id: "dod-omn26708-ac4-terminal"
    description: "One live and two ended workflows give two terminal rows, and only ended rows reach the terminal exposure."
    source: "manual"
    binds_ac: ["AC4"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/nodes/node_projection_lane_work -q -n 0 --no-cov -k terminal"
        cwd: "."
  - id: "dod-omn26708-migration-parity"
    description: "The node's migrations create the one relation lane_work_workflow and no view, matching the migrations omnibase_infra vendors, and both exposures read that relation."
    source: "manual"
    binds_ac: ["AC4"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/nodes/node_projection_lane_work/test_lane_work_migration_shape.py -q -n 0 --no-cov"
        cwd: "."
  - id: "dod-omn26708-writer-acl"
    description: "The runtime principal holds WRITE and DESCRIBE on both snapshot exposures and the dead-letter topic the writer publishes to, beside READ on the transition topic."
    source: "manual"
    binds_ac: ["AC1"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/nodes/node_projection_lane_work/test_lane_work_acl.py -q -n 0 --no-cov"
        cwd: "."
  - id: "dod-omn26708-deploy-probe"
    description: "Deploy probe: the node contract GitHub serves at the checked-out commit names LaneWorkProjectionWriter, which the merge base lacks."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: 'bash -o pipefail -c ''gh api "repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_projection_lane_work/contract.yaml?ref=$(git rev-parse HEAD)" --jq .content | base64 -d | grep -F "name: LaneWorkProjectionWriter" > /dev/null'''
        cwd: "."
  - id: "dod-omn26708-integration-proof"
    description: "The pushed head ran the node's tests, the real-Postgres write included, on a lab host through the bus and exited 0. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check."
    source: "manual"
    execution_scope: "local_done_gate"
    checks:
      - check_type: "command"
        check_value: 'uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane lwo8-85200 --bus-lane dev -- uv run --frozen pytest tests/unit/nodes/node_projection_lane_work -q --no-cov'
        cwd: "."
