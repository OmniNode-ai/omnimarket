---
schema_version: "1.0.0"
ticket_id: "OMN-21288"
title: "Host closeout archives a finished remote lane run and expires old reports before the working tree goes"
summary: >
  node_remote_lane_effect gains a retention step for the runner's host closeout
  (lane h101-runs-retention-0530, from the h101 measurement that ~/lab-run/runs held
  70 folders and 29 GB with none ever deleted). It copies a final run's receipt,
  result and receipt-referenced report files to lab-run/reports/<lane>/<run>/ with a
  manifest, removes the run folders only when the receipt is final, the lane's CLAIM is
  closed in the ledger and no git metadata remains, and expires managed archives older
  than N days (default 7). Unknown ownership, a symlink, a copy failure or git
  metadata keep both folders. The PR does not implement the ticket's own AC1 or AC2
  (the dev-stack compose check); those stay open on the ticket.
  T17 adds node_projection_query_api_effect, the runtime query node that answers
  every route the projection API service answers, served through the contract's
  http_mount; the service is not retired by that change.
is_seam_ticket: false
interface_change: true
interfaces_touched:
  - "public_api"
requirements:
  - id: "req-omn21288-archive-before-delete"
    statement: "A finished run's artifacts are copied and verified before any folder is removed."
    acceptance:
      - id: "DoD1"
        statement: "DoD1: the retention step archives the receipt, result and receipt-referenced report files with a manifest before it deletes a run folder, and keeps both folders when the copy fails or ownership is unknown"
  - id: "req-omn21288-keep-n-days"
    statement: "Old archives expire after N days, and only archives this step wrote."
    acceptance:
      - id: "DoD2"
        statement: "DoD2: archives older than the retention period are removed only when their own manifest and final receipt say so and their lane is not live"
  - id: "req-omn21288-lane-stack-orphan-node"
    statement: >-
      The node exists in omnimarket with its tests, is registered as an
      onex.nodes entry point, and judges a container inventory by the rules in
      its handler.
    acceptance:
      - id: "AC1"
        statement: >-
          AC1: a running container labelled with a finished lane is named for stopping with a restore command, and a container of a live lane is kept even when that lane also reads finished -- falsifier: uv run pytest tests/nodes/node_lane_stack_orphan_compute/test_lane_stack_orphans.py -q fails
      - id: "AC2"
        statement: >-
          AC2: a lane label never claims a protected container, and an unlabelled container is reported unowned and never named for stopping -- falsifier: the same pytest run fails
  - id: "req-omn21288-work-contract-pins-current"
    statement: "The work contract corpus loads against the current tree, so whole-tree collection succeeds."
    acceptance:
      - id: "AC3"
        statement: >-
          AC3: every work contract input pin, including the uv.lock environment pin, matches the file on disk -- falsifier: uv run pytest tests/nodes/test_work_contract_pins_current.py -q --no-cov fails
  - id: "req-omn21288-ledger-serve-missing-writer-topic"
    statement: >-
      One writer whose command topic the broker does not hold never stops the work-ledger
      serve for the other writers (ledger host h200, 2026-10-31: the serve restarted in a
      loop because onex.cmd.omnimarket.work-ledger-append-from-dev-jake-macbook-pro-2.v1
      was absent from the dev broker).
    acceptance:
      - id: "DoD3"
        statement: "DoD3: a writer topic whose subscribe fails is logged and skipped, the other writers keep appending, readiness is not degraded by it, and the next resubscribe takes it again; the shared command topic stays fatal -- falsifier: uv run pytest tests/unit/work_ledger_bus/test_missing_writer_topic.py -q --no-cov fails"
  - id: "req-omn21288-t17-projection-query-node"
    statement: >-
      A runtime query node answers every route the projection API service answers,
      with the same status and body, tenant-scoped, through the ASGI mount its
      contract declares; the service's query logic exists once, in the node's handler.
    acceptance:
      - id: "DoD4"
        statement: "DoD4: node_projection_query_api_effect's contract declares an http_mount and the routes of the projection API service, and its app answers a recorded request set with the same status and body as the service for every route -- falsifier: uv run pytest tests/projection/test_t17_projection_query_node_parity.py -q --no-cov fails"
      - id: "DoD5"
        statement: "DoD5: a read of a tenant-scoped exposure through the node returns nothing of another tenant's rows under a NOSUPERUSER NOBYPASSRLS role on real Postgres -- falsifier: uv run pytest tests/projection/test_t17_projection_query_node_cross_tenant_real_postgres.py -q --no-cov --refuse-skips fails"
  - id: "req-omn21288-reaper-live-families"
    statement: "The consumer group guard's reaper patterns match the per-run group names the dev and CI buses accumulate, and protect only the stable names."
    acceptance:
      - id: "AC21288101"
        statement: "AC21288101: against the live zero-consumer names, the contract's patterns after the change classify the runtime_local_terminal_t<N>_run_<hex12> and host_drift_fleet.<host>.<hex12> names as reapable and the stable names as protected or unmatched -- falsifier: the fixture test fails on origin/dev's contract and passes on the branch"
      - id: "AC21288104"
        statement: "AC21288104: the focused live-family test passes on the branch (pre-commit runs as its own hook and CI check) -- falsifier: the focused test fails"
evidence_requirements:
  - kind: "tests"
    description: "Retention tests pass"
    command: "uv run pytest tests/nodes/node_remote_lane_effect/test_run_retention.py -q --no-cov"
  - kind: "tests"
    description: "The node's tests pass."
    command: "uv run pytest tests/nodes/node_lane_stack_orphan_compute/test_lane_stack_orphans.py -q --no-cov"
  - kind: "tests"
    description: "A missing writer topic does not stop the work-ledger serve."
    command: "uv run pytest tests/unit/work_ledger_bus/test_missing_writer_topic.py -q --no-cov"
  - kind: "tests"
    description: "T17: the projection query node answers the recorded request set as the service does."
    command: "uv run pytest tests/projection/test_t17_projection_query_node_parity.py -q --no-cov"
  - kind: "tests"
    description: "T17: a cross-tenant read through the node returns nothing on real Postgres under a NOBYPASSRLS role."
    command: "uv run pytest tests/projection/test_t17_projection_query_node_cross_tenant_real_postgres.py -q --no-cov --refuse-skips"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn21288-r1-archive-first"
    description: "A final run is archived with receipt, result and referenced report before removal; uncertain ownership, a changed ledger, a symlink, git metadata and a copy failure keep the folders. The tests fail at the merge base, which has no run_retention module."
    source: "manual"
    binds_ac: ["DoD1"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_remote_lane_effect/test_run_retention.py -q --no-cov -k 'archives_report_result_receipt_before_deleting or uncertainty_preserves_both_trees or git_tree_is_kept or symlink_cannot_escape or archive_only_never_removes_work or copy_failure_keeps_work'"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn21288-r2-expiry"
    description: "Only managed, closed-lane archives older than the period are pruned, using the archive's own final receipt after the ledger has rolled over."
    source: "manual"
    binds_ac: ["DoD2"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_remote_lane_effect/test_run_retention.py -q --no-cov -k 'prunes_only_expired_managed_reports or expiration_uses_final_archive_receipt'"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn21288-deploy-probe"
    description: "Deploy probe. Read the retention module from GitHub at the checked-out commit and require the archive-before-delete function in it, with the DoD1 test. It fails at the merge base, which has no module."
    source: "manual"
    binds_ac: ["DoD1"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_remote_lane_effect/test_run_retention.py -q --no-cov -k archives_report_result_receipt_before_deleting"
        cwd: "${OMNI_HOME}/omnimarket"
      - check_type: "command"
        check_value: "bash -o pipefail -c 'gh api \"repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_remote_lane_effect/run_retention.py?ref=$(git rev-parse HEAD)\" --jq .content | base64 -d | grep -F \"def retain_run\" > /dev/null'"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn21288-ac1-finished-lane-stop"
    description: "This pull request's share only: the stop and keep verdicts for finished and live lanes. It fails at the merge base, which has no such node. It does not show that any lane labels its containers or that anything stops one."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_lane_stack_orphan_compute/test_lane_stack_orphans.py -q --no-cov -k 'finished_lane or live_lane or exited or order'"
    binds_ac: ["AC1"]
  - id: "dod-omn21288-ac2-protected-and-unowned"
    description: "This pull request's share only: protected containers and unlabelled containers are never named for stopping. It fails at the merge base, which has no such node."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_lane_stack_orphan_compute/test_lane_stack_orphans.py -q --no-cov -k 'protected or unowned or unknown_lane'"
      - check_type: "command"
        check_value: "uv run python -c \"from importlib.metadata import entry_points; names={e.name for e in entry_points(group='onex.nodes')}; assert 'node_lane_stack_orphan_compute' in names\""
    binds_ac: ["AC2"]
  - id: "dod-omn21288-orphan-deploy-probe"
    description: "Hosted deploy smoke, runnable on the hosted runner with no lab route, broker or database: dispatch the packaged node_lane_stack_orphan_compute through the in-process ONEX runtime with one container of a finished lane and one protected container, and require a successful typed receipt that names only the first for stopping. It fails at the merge base, where the node does not exist."
    source: "manual"
    binds_ac: ["AC1", "AC2"]
    checks:
      - check_type: "test_passes"
        check_value: "env PYTHONDONTWRITEBYTECODE=1 uv run pytest tests/nodes/node_lane_stack_orphan_compute/test_lane_stack_orphans.py -q --no-cov"
      - check_type: "command"
        check_value: |
          set -eu;
          export PYTHONDONTWRITEBYTECODE=1;
          probe_dir="$(mktemp -d)";
          trap 'rm -rf "$probe_dir"' EXIT;
          runtime_bin="$(uv run --locked python -c 'import sys; from pathlib import Path; print(Path(sys.executable).parent)')";
          printf '%s' '{"containers": [{"name": "probe-pg", "state": "running", "lane": "probe-done"}, {"name": "omninode-runtime", "state": "running", "lane": "probe-done"}], "live_lanes": [], "finished_lanes": ["probe-done"]}' > "$probe_dir/input.json";
          env ONEX_LANE=omn21288-deploy-probe "$runtime_bin/onex" node node_lane_stack_orphan_compute --input "$probe_dir/input.json" --state-root "$probe_dir/state" --backend event_bus=inmemory --timeout 30 --output receipt --omnibase-path "$PWD" > "$probe_dir/receipt.json";
          uv run --locked python -c '
          import json
          import sys
          from pathlib import Path
          receipt = json.loads(Path(sys.argv[1]).read_text())
          assert receipt["status"] == "success" and receipt["exit_code"] == 0, receipt
          result = receipt["result"]
          assert result["stop_names"] == ["probe-pg"], result
          print(json.dumps({"run_id": receipt["run_id"], "stop_names": result["stop_names"]}))
          ' "$probe_dir/receipt.json";
  - id: "dod-omn21288-writers-ac1-prerequisite"
    description: >-
      AC1 prerequisite in omnimarket only: registration, savings, live-events,
      tenant-credentials and tenant-registry contracts route each unchanged
      subscription exactly once to an in-process writer, with no standalone
      runner routed alongside it. The fixture/real-compose refusal check remains
      the responsibility of the omnibase_infra fold; this does not claim AC1
      complete across repositories.
    source: "manual"
    binds_ac: ["AC1"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/test_omn21288_projection_writers_in_runtime.py -q --no-cov --refuse-skips -k contract_routes_only_the_runtime_writer"
  - id: "dod-omn21288-writers-ac2-prerequisite"
    description: >-
      AC2 prerequisite in omnimarket only: the runtime's actual projection
      callback applies the same SQL parameters and snapshot deltas as each
      existing writer, on two deliveries, and closes its loop-bound pools and
      producer. Wrong database principals and failed writes are refused without
      leaked pools. The infra branch must pin this change before removing the
      six writer services; this does not claim the real compose is already slim.
    source: "manual"
    binds_ac: ["AC2"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/test_omn21288_projection_writers_in_runtime.py -q --no-cov --refuse-skips"
  - id: "dod-omn21288-writers-deploy-probe"
    description: >-
      Hosted structural deployment smoke for the packaged runtime entrypoint,
      requiring no lab route, broker, database or redeployment. Read the product
      source at the checked-out PR head and require the executable runtime
      writer entrypoint; then exercise actual runtime dispatch with fake driver
      I/O. This fails against the merge base, which has no runtime_writer module.
      Live-stack AC1/AC2 verification belongs to the subsequent infra fold.
    source: "manual"
    binds_ac: ["AC1", "AC2"]
    checks:
      - check_type: "command"
        check_value: |
          bash -o pipefail -c 'gh api "repos/OmniNode-ai/omnimarket/contents/src/omnimarket/handlers/handler_projection_runtime_writer.py?ref=$(git rev-parse HEAD)" --jq .content | base64 -d | python -c "import ast, sys; tree = ast.parse(sys.stdin.read()); cls = next(n for n in tree.body if isinstance(n, ast.ClassDef) and n.name == \"RuntimeProjectionWriter\"); assert any(isinstance(n, ast.FunctionDef) and n.name == \"handle\" for n in cls.body)"'
      - check_type: "test_passes"
        check_value: "uv run pytest tests/test_omn21288_projection_writers_in_runtime.py -q --no-cov --refuse-skips"
  - id: "dod-omn21288-r3-pins-current"
    description: "The corpus of work contracts loads with every pin matching the tree. The test fails at the merge base, where the uv.lock pin is stale."
    source: "manual"
    binds_ac: ["AC3"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/test_work_contract_pins_current.py -q --no-cov"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn21288-r4-missing-writer-topic"
    description: "A writer topic the broker cannot serve is logged and skipped while the other writers append, and the next resubscribe retakes it. Three of the four tests fail at the merge base, where one failed writer subscribe leaves start() and the serve exits."
    source: "manual"
    binds_ac: ["DoD3"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/work_ledger_bus/test_missing_writer_topic.py -q --no-cov"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn21288-missing-writer-topic-deploy-probe"
    description: >-
      Hosted structural deployment smoke, requiring no lab route, broker or ledger host:
      read the work-ledger bus host at the checked-out PR head and require that it takes
      writer topics through take_writer_topics, then run the in-memory bus tests in which
      one writer topic refuses its subscribe. It fails against the merge base, which has
      no writer_topics module. The ledger host's serve picks the change up only when its
      checkout is advanced after the merge.
    source: "manual"
    binds_ac: ["DoD3"]
    checks:
      - check_type: "command"
        check_value: |
          bash -o pipefail -c 'gh api "repos/OmniNode-ai/omnimarket/contents/src/omnimarket/work_ledger_bus/bus.py?ref=$(git rev-parse HEAD)" --jq .content | base64 -d | grep -F "await take_writer_topics(" > /dev/null'
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/work_ledger_bus/test_missing_writer_topic.py -q --no-cov"
  - id: "dod-omn21288-t17-route-parity"
    description: "T17: every route of the projection API service, with its query parameters and status codes, is declared in the node contract and answered with the same status and body as the service, and as the service answered before its query logic moved. The tests fail at the merge base, which has no node_projection_query_api_effect."
    source: "manual"
    binds_ac: ["DoD4"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/projection/test_t17_projection_query_node_parity.py -q --no-cov"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn21288-t17-cross-tenant"
    description: "T17: on a throwaway PostgreSQL 16 container, a NOSUPERUSER NOBYPASSRLS reader serves each tenant only its own rows through the node, a request naming no tenant is refused, and a planted read of the other tenant's rows returns nothing."
    source: "manual"
    binds_ac: ["DoD5"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/projection/test_t17_projection_query_node_cross_tenant_real_postgres.py -q --no-cov --refuse-skips"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn21288-t17-deploy-probe"
    description: >-
      Hosted structural deployment smoke, requiring no lab route, broker or database:
      read the node contract at the checked-out PR head and require its http_mount
      factory, then run the route parity tests. It fails against the merge base, which
      has no node_projection_query_api_effect contract. The runtime serves the mount
      only after the deploy agent recreates it.
    source: "manual"
    binds_ac: ["DoD4"]
    checks:
      - check_type: "command"
        check_value: |
          bash -o pipefail -c 'gh api "repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_projection_query_api_effect/contract.yaml?ref=$(git rev-parse HEAD)" --jq .content | base64 -d | grep -F "asgi_app:create_app" > /dev/null'
      - check_type: "test_passes"
        check_value: "uv run pytest tests/projection/test_t17_projection_query_node_parity.py -q --no-cov"
  - id: "dod-omn21288-t17-integration-proof"
    description: "T17: the pushed head ran the node golden chain and the route parity tests on a lab host with their real dependencies and exited 0. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check."
    source: "manual"
    execution_scope: "local_done_gate"
    binds_ac: ["DoD4"]
    checks:
      - check_type: "command"
        check_value: "uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha \"$(git rev-parse HEAD)\" --lane dod-integration-proof-t17 -- uv run pytest tests/test_golden_chain_node_projection_query_api_effect.py tests/projection/test_t17_projection_query_node_parity.py -q --no-cov"
        cwd: "."
  - id: "dod-omn21288-reaper-live-families"
    description: "Every live per-run family is reapable and the stable names are not, through the guard's own is_reapable over the shipped contract. The test fails at the merge base, whose contract has no pattern for runtime_local_terminal_t<N>_run_<hex12>, the per-run host drift name, receipt-mode, lab_work_client, the canary or the gateway session."
    source: "manual"
    binds_ac: ["AC21288101"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/nodes/node_consumer_group_guard_effect/test_consumer_group_reaper.py -q --no-cov -p no:cacheprovider -k 'every_live_per_run_family'"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn21288-reaper-live-families-precommit"
    description: "The live-family test passes. That test fails at the merge base. Pre-commit is not run here: it exceeds the hosted per-check budget and runs as its own CI check."
    source: "manual"
    binds_ac: ["AC21288104"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/nodes/node_consumer_group_guard_effect/test_consumer_group_reaper.py -q --no-cov -p no:cacheprovider -k every_live_per_run_family"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn21288-reaper-live-families-deploy-probe"
    description: "The guard node's shipped contract at the head carries the runtime_local_terminal_t<N>_run_ pattern, read from GitHub at the exact head sha. The runtime reads this contract from the installed package, so the node picks it up when the deploy agent redeploys omnimarket."
    source: "manual"
    binds_ac: ["AC21288101"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/nodes/node_consumer_group_guard_effect/test_consumer_group_reaper.py -q --no-cov -p no:cacheprovider -k every_live_per_run_family"
        cwd: "${OMNI_HOME}/omnimarket"
      - check_type: "command"
        check_value: |
          bash -o pipefail -c 'gh api "repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_consumer_group_guard_effect/contract.yaml?ref=$(git rev-parse HEAD)" --jq .content | base64 -d | grep -F "runtime_local_terminal_t[0-9]+_run_" > /dev/null'
  - id: "dod-omn21288-reaper-integration-proof"
    description: >-
      Run the packaged guard on the lab runtime against the declared dev broker,
      then classify a fresh authenticated group listing with the packaged reaper
      rules. Require live Empty terminal and host-drift per-run families to be
      reapable and persistent runtime instance groups to remain excluded. This
      read-only proof fails with the old patterns and never invokes deletion.
      Hosted runners cannot reach the broker; the local Done gate owns this check.
    source: "manual"
    execution_scope: "local_done_gate"
    checks:
      - check_type: "command"
        check_value: |
          env PYTHONDONTWRITEBYTECODE=1 COMPOSE_PROJECT_NAME=landing-l22728-lab ONEX_LANE=omn21288-reaper-integration-proof uv run --frozen onex node node_consumer_group_guard_effect --input <(printf '%s' '{"bus_lane":"dev"}') --state-root "$(mktemp -d)" --backend event_bus=inmemory --timeout 60 --output receipt --omnibase-path "$PWD" | uv run --frozen python -c '
          import json
          import re
          import sys
          from omnimarket.nodes.node_consumer_group_guard_effect.handlers.handler_group_reaper import contract_reap_rules, is_reapable, read_groups
          from omnimarket.nodes.node_runtime_coverage_effect.handlers.handler_runtime_coverage import resolve_broker
          receipt = json.load(sys.stdin)
          assert receipt["status"] == "success" and receipt["exit_code"] == 0, receipt
          census = receipt["result"]
          assert census["status"] == "OK" and not census["error"], census
          broker, _, config = resolve_broker("dev")
          states = read_groups(config)
          rules = contract_reap_rules()
          empty = [name for name, state in states.items() if state == "EMPTY"]
          terminal = [name for name in empty if ".runtime_local_terminal_t" in name]
          drift = [name for name in empty if re.search(r"\.host_drift_fleet\.h[0-9]+\.[0-9a-f]{12}(?:\.|$)", name)]
          persistent = [name for name in states if ".__i." in name]
          assert terminal and drift and persistent, (len(terminal), len(drift), len(persistent))
          assert all(is_reapable(name, rules) for name in terminal + drift), (terminal, drift)
          assert all(not is_reapable(name, rules) for name in persistent), persistent
          print(json.dumps({"run_id": receipt["run_id"], "broker": broker, "groups_total": len(states), "groups_empty": len(empty), "terminal_reapable": len(terminal), "drift_reapable": len(drift), "persistent_excluded": len(persistent), "groups_reaped": census["groups_reaped"]}))
          '
        cwd: "."
