schema_version: "1.0.0"
ticket_id: OMN-22800
title: "The dev broker's single-shard overload is a measured reading: partitions per shard and consumer start time against bars"
summary: >-
  New node node_broker_load_reading_effect (rebuild piece 3). It reads the dev broker's public metrics over ssh
  (cluster topics and partitions, shards, user-topic partitions that never carried a record; counts only) and the time
  a probe consumer takes to start on an existing topic, judges both against overlay bars, names the shards the bar
  would need and the partitions to remove, and appends one reading row. NOT_WORKING when either is over its bar,
  UNKNOWN with a typed reason when the broker or the probe cannot be read. It changes nothing on the broker.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn22800-broker-load
    statement: The broker's overload is a reading with bars from an overlay, a golden and an error chain event test, and a failing control.
    acceptance:
      - id: AC1
        statement: 'AC1: partitions per shard over the overlay bar, or a consumer start over its bar or past its deadline, reads NOT_WORKING with the reason named, inside both bars reads WORKING, and an unreadable broker or probe reads UNKNOWN with a typed reason -- falsifier: uv run pytest tests/nodes/node_broker_load_reading_effect -q --no-cov, which fails with the verdict logic reverted'
      - id: AC2
        statement: 'AC2: the node has a golden chain event test and error chain event tests, and the golden assertion fails for real under the named overloaded-shard break -- falsifier: uv run pytest tests/nodes/node_broker_load_reading_effect/test_broker_load_chain_events.py -q --no-cov'
      - id: AC3
        statement: 'AC3: the metrics parse reads the counts out of output recorded from the dev broker -- falsifier: uv run pytest tests/nodes/node_broker_load_reading_effect/test_broker_load_reading.py -q --no-cov against the recorded fixture'
      - id: AC4
        statement: 'AC4: the probe verb run on a lab host from this branch against the dev broker reads NOT_WORKING today with partitions_per_shard above the bar and a real consumer start time -- falsifier: the node probe output on h053 from this branch'
evidence_requirements:
  - kind: tests
    description: The verdict tests, the metrics parse on recorded dev broker output, the ssh read tests and the chain event tests.
    command: uv run --frozen pytest tests/nodes/node_broker_load_reading_effect -q --no-cov
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-omn22800-broker-load-tests
    description: The node tests pass with the change; with the verdict logic reverted they fail.
    source: manual
    execution_scope: hosted_and_local
    binds_ac: [AC1, AC2, AC3, AC4]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/nodes/node_broker_load_reading_effect -q --no-cov
        cwd: .
  - id: dod-omn22800-broker-load-integration-proof
    description: The pushed head ran the node tests on a lab host through the lab work runner and exited 0. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check; the h053 probe readback for AC4 is in the pull request's Lab line.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: 'env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-22800 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_broker_load_reading_effect -q --no-cov'
        cwd: .
