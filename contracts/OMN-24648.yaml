schema_version: 1.0.0
ticket_id: OMN-24648
title: 'PR duplicate guard: one shared replaced line must not refuse distinct pull requests that dev clears'
summary: The PR duplicate guard no longer scores the removed lines as a share of their own, so one base line that two diffs both replace is not read as a shared change. The guard scores one share over all the changed lines of both diffs, added and removed together, less the removed lines a deployment declares shared catalog lines for that path. The additive interface change is that the scored digest of a file touch folds the declared catalog lines in, and the duplicate-guard overlay document gains an optional shared_catalog_lines key (a path glob and a line pattern per repository).
is_seam_ticket: false
interface_change: true
interfaces_touched:
- public_api
requirements:
- id: req-omn24648-shared-replaced-line
  statement: The guard does not refuse two distinct pull requests under different tickets because they replace one line in common; under one ticket the shared-ticket bar is unchanged and a lone shared replaced line still adopts.
  acceptance:
  - id: AC1
    statement: 'AC1: a regression test built from the reviewed probe (one shared replaced line, otherwise distinct added and removed content) fails on head 6d87d35548be and passes on the fix -- falsifier: uv run pytest tests -k "duplicate_guard and shared_replaced_line" -q'
  - id: AC2
    statement: 'AC2: two pull requests that delete the same many lines and add different lines are still refused as duplicates -- falsifier: uv run pytest tests -k "duplicate_guard and shared_removals" -q'
  - id: AC3
    statement: 'AC3: the eval-grants case, with one shared catalog line and distinct added content, still clears -- falsifier: uv run pytest tests -k "duplicate_guard and eval_grants" -q'
  - id: AC4
    statement: 'AC4: every other finding in the named review comment is fixed or argued with evidence in a reply on the pull request -- falsifier: uv run pytest tests -k "duplicate_guard" -q'
evidence_requirements:
- kind: tests
  description: The guard tests and the replaces suite pass at the pushed head.
  command: uv run --frozen pytest tests/nodes/node_pr_duplicate_guard_compute tests/unit/handlers/scm/test_scm_duplicate_guard_replaces.py -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24648-ac1
  description: The reviewed probe, one shared replaced line with different added lines under different tickets, clears; the test fails on head 6d87d35548be.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_pr_duplicate_guard_compute/test_pr_duplicate_guard_shared_replaced_line.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24648-ac2
  description: Two diffs that delete the same many lines and add different lines are refused with lines evidence.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_pr_duplicate_guard_compute -k "duplicate_guard and shared_removals" -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24648-ac3
  description: The recorded eval-grants diff against the state-panel diff, sharing one catalog fingerprint line, still clears.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_pr_duplicate_guard_compute -k "duplicate_guard and eval_grants" -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24648-ac4
  description: 'The findings of the named review each have a test that fails on head 96fb58622179 or pins the stated rule: a pin manifest the overlay does not declare keeps its removed lines (catalog_path_scope), a pattern that does not compile refuses at load (catalog_pattern_invalid), one shared replaced non-catalog line among many distinct lines stays clear under one ticket (shared_line_among_distinct), and the share rule is stated one way in every guard file (share_rule_stated_once).'
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_pr_duplicate_guard_compute -k "catalog_path_scope or catalog_pattern or shared_line_among_distinct or share_rule_stated_once" -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24648-integration-proof
  description: Run the guard tests on a lab host at the pushed head. Hosted CI cannot reach the lab hosts, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24648 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_pr_duplicate_guard_compute tests/unit/handlers/scm/test_scm_duplicate_guard_replaces.py -q --no-cov -n 0 -p no:randomly
    cwd: .
