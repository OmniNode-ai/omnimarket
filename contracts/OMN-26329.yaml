schema_version: 1.0.0
ticket_id: OMN-26329
title: "Ledger-file census group 1: its 13 src files read the work ledger through the bus or are deleted, and their census rows are lowered"
summary: "The files of group 1 of the omnimarket ledger-file census move their ledger readers and writers to the bus (the paged read of the work ledger reader node and the bus append command) or stay listed with a written reason; each cleared file's census row is dropped with the census node's --lower."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn26329-group-1
    statement: Each group 1 file the change clears holds no executable reader or writer of the ledger file or its path variable, its census row is lowered, and the node tests of the group stay green.
    acceptance:
      - id: AC1
        statement: "AC1: after the change, none of the group's runtime files holds an executable reader or writer of the ledger file or its path variable, and each is moved to the bus or deleted -- falsifier: the census run with --per-file exits non-zero or prints a hit for a group 1 src file the change claims to clear"
      - id: AC2
        statement: "AC2: the census ratchet rows for the cleared files are lowered with the census node's --lower, and no row is raised or added -- falsifier: git diff origin/dev -- src/omnimarket/nodes/node_work_ledger_file_census_effect/ratchet.yaml shows a raised or added line, or the census run exits non-zero"
      - id: AC3
        statement: "AC3: each moved reader or writer has a test that fails on the old code and passes on the change, and every node test of the group stays green -- falsifier: the focused node tests of the group exit non-zero"
evidence_requirements:
  - kind: tests
    description: The node tests of the cleared files pass at the pushed head.
    command: uv run pytest tests/nodes/node_friction_rollup_tick_effect tests/nodes/node_floor_simple_effect tests/nodes/node_host_installer_registry_units tests/nodes/node_handoff_check_effect tests/test_host_reconcile_bus_append.py -q --no-cov -p no:cacheprovider
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-omn26329-ac1
    description: "AC1: each cleared group 1 file holds no executable reader or writer of the ledger file or its path variable; the cases read the live tree and fail on the merge base, where the files still hold a counted hit."
    source: manual
    binds_ac: [AC1]
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/nodes/node_work_ledger_file_census_effect/test_group1_omn26329.py -q --no-cov -p no:cacheprovider -k "holds_no_executable"
        cwd: .
  - id: dod-omn26329-ac2
    description: "AC2: each cleared group 1 file has no ratchet row and the registry units contract row is lowered, never raised, with the census run over the branch passing --per-file; the cases fail on the merge base, where the rows still stand."
    source: manual
    binds_ac: [AC2]
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/nodes/node_work_ledger_file_census_effect/test_group1_omn26329.py -q --no-cov -p no:cacheprovider -k "ratchet_row or lowered_never_raised"
        cwd: .
  - id: dod-omn26329-ac3
    description: "AC3: the moved readers and writers have tests that read the bus read command and the bus append command as separate processes; the node tests of the group pass."
    source: manual
    binds_ac: [AC3]
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/nodes/node_friction_rollup_tick_effect tests/nodes/node_floor_simple_effect tests/nodes/node_handoff_check_effect tests/test_host_reconcile_bus_append.py tests/nodes/node_host_installer_registry_units/test_temporal_worker_names_no_ledger_file.py -q --no-cov -p no:cacheprovider
        cwd: .
  - id: dod-omn26329-ac3-hourly-tick-reconcile
    description: "AC3: the hourly tick probe reads its window through the work ledger reader node under the hourly-tick reader name (an unread window refuses the tick and writes nothing) and its request takes no ledger file; the host reconcile command takes no ledger path and its clone-refusal call passes no --ledger. At the merge base the tick reads a ledger file and the reconcile call passes --ledger, so these fail."
    source: manual
    binds_ac: [AC3]
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/nodes/node_hourly_tick_effect tests/nodes/node_linear_snapshot_effect/test_parity_with_unit.py tests/test_host_reconcile_effect.py tests/test_host_reconcile_bus_append.py -q --no-cov -p no:cacheprovider
        cwd: .
  - id: dod-omn26329-ac3-registry-units-dead-default
    description: "AC3: the registry units installer no longer fills a configuration placeholder {ledger_path} with the registry's own ledger file (a default no unit declaration used); a configuration that names it is refused like any placeholder nothing fills, and the handler's census row is lowered from 3 to 2. At the merge base the placeholder is filled with the ledger file's path and the row stands at 3, so these fail."
    source: manual
    binds_ac: [AC3]
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/nodes/node_host_installer_registry_units/test_alarm_config_omn22778.py tests/unit/nodes/node_work_ledger_file_census_effect/test_group1_omn26329.py -q --no-cov -p no:cacheprovider
        cwd: .
  - id: dod-omn26329-integration-proof
    description: "Run the focused node tests of the cleared files on a lab host at the pushed revision. This local completion proof carries no hosted AC bindings."
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: >-
          env PYTHONDONTWRITEBYTECODE=1 onex lab-work run
          --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)"
          --lane dod-integration-proof-26329 --kind test --
          env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest
          tests/nodes/node_friction_rollup_tick_effect
          tests/nodes/node_host_installer_registry_units/test_friction_rollup_unit.py
          tests/nodes/node_host_installer_registry_units/test_temporal_worker_names_no_ledger_file.py
          tests/nodes/node_handoff_check_effect tests/test_host_reconcile_bus_append.py
          tests/nodes/node_hourly_tick_effect tests/test_host_reconcile_effect.py
          -q -n 0 --no-cov --refuse-skips
        cwd: .
