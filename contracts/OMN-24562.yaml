  description: 'AC8: a changed tests/unit test file selects the file only; a helper selects its importers in another unit folder and the test that spells its path; an unattributable helper, a non-python file and a package marker keep their directory (failing control: most of the new tests fail at the merge base, where the directory is selected; the rule is the adjacency switch unit_file_selection_enabled, on in the shipped adjacency and off in the frozen replay snapshot, so the stage 0 receipts are unchanged). Replay over the 60 pinned merges: 18 change tests/unit, narrowed 10 to 12, full suite 50 to 48, selected seconds 574954.625506 to 552493.098902.'
