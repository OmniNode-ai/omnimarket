- id: dod-omn24562-unit-file-scoped-root-detect-paths
  description: 'AC8: the detect_test_paths fixtures that pin the old behaviour run with the unit file-scoped switch off in a copy of the shipped adjacency, and a new test shows the same tests/unit change narrowing with the switch on (failing control: with the switch on, the four old-behaviour tests see a narrowed selection and fail).'
