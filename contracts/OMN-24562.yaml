schema_version: 1.0.0
ticket_id: OMN-24562
title: The lab disk watermark alarms below 15 percent free inodes and names an owner
summary: 'node_lab_disk_watermark_effect reads the inode use of every volume a pool host declares, beside the byte share it already reads. A volume below the free-inode share its contract declares (15 percent) writes the lab stack reaper''s alarm rows (one FRICTION row and one STATUS row with alarms=1, each naming the owner) through the bus append command, once per declared interval, and the service exits 2 so the journal and the unit state show it. The watermark unit carries the append command in its environment.'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24562-inode-alarm
  statement: A lab host whose root filesystem runs short of inodes alarms on the watermark tick, naming the owner, before placement refuses a lane there.
  acceptance:
  - id: AC1
    statement: 'AC1: a reading at 14 percent free inodes produces the alarm rows with owner= in both, and a reading at 16 percent produces none -- falsifier: uv run pytest tests/nodes/node_lab_disk_watermark_effect/test_inode_alarm_omn24562.py -q fails when the threshold or the owner cell is removed'
- id: req-omn24562-thermal-guard
  statement: A lab host that runs hot is held out of placement through its declared hold file and released only once it has cooled, with the thresholds, names and texts all read from the overlay.
  acceptance:
  - id: AC2
    statement: 'AC2: node_host_thermal_guard_effect writes the hold file and a HOLD row above the hold threshold, removes it and writes a RELEASE row below the lower release threshold once the minimum hold has passed, and changes nothing between the two -- falsifier: uv run pytest tests/nodes/node_host_thermal_guard_effect -q fails when the release threshold is raised to the hold threshold or the minimum hold is dropped'
- id: req-omn24562-thermal-guard-overlay-model
  statement: The thermal guard node's overlay document has a typed model in omnimarket that the overlays repository can pin ahead of the node.
  acceptance:
  - id: AC3
    statement: 'AC3: ModelHostThermalGuardOverlay validates the overlay document of the thermal guard node and refuses a malformed one -- falsifier: tests/unit/models/test_host_thermal_guard_overlay_document_omn24562.py fails collection or any of its tests fails'
- id: req-omn24562-observability-overlay-model
  statement: The host observability installer's overlay document has a typed model in omnimarket that its overlay document can be pinned to ahead of the node.
  acceptance:
  - id: AC5
    statement: 'AC5: ModelObservabilityOverlay validates the overlay document of the host observability installer and refuses a malformed one -- falsifier: tests/unit/models/test_observability_overlay_document_omn24562.py fails collection or any of its tests fails'
- id: req-omn24562-tenant-key-overlay-model
  statement: The tenant gateway key node's overlay document has a typed model in omnimarket that its overlay document can be pinned to ahead of the node.
  acceptance:
  - id: AC4
    statement: 'AC4: ModelTenantApiKeyOverlay validates the overlay document of the tenant gateway key node and refuses a malformed one -- falsifier: tests/unit/models/test_tenant_api_key_overlay_document_omn24562.py fails collection or any of its tests fails'
- id: req-omn24562-unit-file-scoped-root
  statement: A changed file under tests/unit/ selects that file and what imports or names it, not the whole tests/unit/ directory, and a change the rule cannot attribute keeps the directory.
  acceptance:
  - id: AC8
    statement: 'AC8: a changed tests/unit file selects itself, its importers in any folder and the tests that spell its path, and an unattributable helper keeps tests/unit/ -- falsifier: tests/nodes/node_test_selection_selector_compute/test_unit_file_scoped_root.py fails when the unit branch of the resolver is removed'
- id: req-omn24562-tenant-outbox-flush
  statement: The TENANT_CREATED rows node_tenant_provision_effect leaves unpublished in tenant_event_outbox are published to the tenant events topic by one node, each marked published only after the broker acknowledges.
  acceptance:
  - id: AC12
    statement: 'AC12: node_tenant_outbox_flush_effect publishes each unpublished outbox row once, leaves a row whose publish failed unmarked for the next pass, and never reads a row already marked published -- falsifier: uv run pytest tests/nodes/node_tenant_outbox_flush_effect -q fails when the mark is moved before the publish or a failed row is marked'
- id: req-omn24562-lint-split-parallel
  statement: The required lint context is an aggregate of parallel group jobs, every old lint step still runs in exactly one group, and the Direct Model Call Gate positive control judges each planted case on a scratch repository holding only that file.
  acceptance:
  - id: AC6
    statement: 'AC6: ci.yml carries lint-group-1 to lint-group-6 and a lint aggregate that needs all of them, each of the 128 steps listed in tests/ci/lint_steps_before_omn24562.txt runs in one group, and the Direct Model Call Gate positive control runs with --repo-root on a scratch repository -- falsifier: uv run pytest tests/ci/test_lint_split_omn24562.py tests/ci/test_direct_model_call_ci_gate.py fails when a step is dropped from every group or the control scans the whole tree'
- id: req-omn24562-tui-refusal-note-stable
  statement: The setup screen's refusal to save with nothing chosen is not replaced by a later model find, so the full suite does not fail on a loaded runner.
  acceptance:
  - id: AC9
    statement: 'AC9: after Save is refused with no model chosen, the pending or running auto-find does not replace the refusal note -- falsifier: tests/unit/nodes/node_onex_setup_effect/test_onex_tui.py::test_config_refusal_note_survives_the_late_auto_find fails when the find is not cancelled on refusal'
- id: req-omn24562-customer-key-removal
  statement: A customer provider key registers unbound, routes, and is revoked before its secret is deleted, so a refused revoke publish never leaves an unrevoked row with no secret.
  acceptance:
  - id: AC8
    statement: 'AC8: register-tenant-key without --host stores the key unbound and revoke-tenant-key publishes the revoke before it deletes the stored secret -- falsifier: uv run pytest tests/test_credential_publisher.py tests/unit/cli/test_omn24562_revoke_tenant_key_command.py tests/unit/cli/test_omn21012_register_tenant_key_host.py fails when a refused publish still deletes the secret or the key carries the registering host'
- id: req-omn24562-suite-admission-both-ways
  statement: A code eval suite task is kept only if its known-good answer passes and an empty answer fails, both through the grader's own score handler.
  acceptance:
  - id: AC7
    statement: 'AC7: the suite admission helper admits a task whose known-good answer passes and whose empty answer fails, and refuses one whose empty answer passes, whose known good fails, or whose check needs the network -- falsifier: tests/nodes/node_code_eval_trial_orchestrator/test_suite_admission_both_ways.py fails collection or any of its tests fails'
- id: req-omn24562-windowed-read-every-exposure
  statement: Every exposure that declares a freshness_column answers the 1d, 7d and 30d windowed read through the real store path, including one whose freshness column is not a served column, without growing the baselined table reader.
  acceptance:
  - id: AC8
    statement: 'AC8: the 1d, 7d and 30d windowed read answers 200 for every node contract declaring a freshness_column on real Postgres, and table_reader.py stays at or under its 914 code lines -- falsifier: uv run pytest tests/test_omn24562_windowed_read_every_exposure_real_postgres.py tests/test_omn24562_table_reader_unserved_freshness.py fails when the window order alias is dropped or the reader grows'
- id: req-omn24562-fixture-readers-on
  statement: A pull request whose only test-infrastructure trigger is a changed data fixture under tests/fixtures/ runs the tests that read the fixture and not the full suite.
  acceptance:
  - id: AC9
    statement: 'AC9: with the shipped adjacency file, each of the four recorded fixture-only merges narrows and no test file naming a changed file is left out of its selection, and a selection with its readers removed reports misses -- falsifier: uv run pytest tests/nodes/node_test_selection_selector_compute/test_data_readers.py -k shipped fails when data_file_readers_enabled is false'
- id: req-omn24562-responder-reader
  statement: The delegation check responder reader answers a llama.cpp listing without max_model_len, advances past a dead responder and prefers the least busy one.
  acceptance:
  - id: AC10
    statement: 'AC10: the live reader chooses a responder whose listing carries meta.n_ctx only, skips a dead one and orders by load -- falsifier: uv run pytest tests/nodes/node_delegation_check_probe_effect/test_http_responder_reader_live_shapes.py -q fails'
- id: req-omn24562-etcd-lab-members-overlay-model
  statement: The lab etcd voter set has a typed overlay model in omnimarket that the overlay home can pin ahead of its document, with the rules the provisioning script expects and a read that renders the text of members.tsv.
  acceptance:
  - id: AC11
    statement: 'AC11: ModelEtcdLabMembersOverlay accepts the current five voters, renders their members.tsv rows, and refuses a sixth voter, a repeated name, a second learner and a second laptop voter -- falsifier: tests/unit/models/test_etcd_lab_members_overlay_document_omn24562.py fails collection or any of its tests fails'
- id: req-omn24562-alarm-router-runtime-interpreter
  statement: The failure alarm router runs a command that names an absent host venv interpreter under the running environment's interpreter, never refusing the fire on a host path.
  acceptance:
  - id: AC13
    statement: 'AC13: a router command whose first token is an absent .venv/bin/python path runs under the runtime interpreter, and a present one is left as named -- falsifier: uv run pytest tests/nodes/node_failure_alarm_router_effect/test_interpreter_setting.py -q fails when the absent-venv resolution is removed'
- id: req-omn24562-census-unit-workspace-root
  statement: The daily ledger file census unit exports the workspace config root, so its publish of the daily record resolves the broker instead of being refused with exit 3.
  acceptance:
  - id: AC14
    statement: 'AC14: the census registry unit declares ONEX_WORKSPACE_CONFIG_ROOT as {workspace_config_root} and the rendered service carries it -- falsifier: uv run pytest tests/unit/contracts/test_node_trigger_declarations.py -k workspace_config_root fails when the environment line is removed from the unit'
evidence_requirements:
- kind: tests
  description: The inode alarm tests pass at the pushed head.
  command: uv run pytest tests/nodes/node_lab_disk_watermark_effect -q -n 0 --no-cov -p no:cacheprovider
