requirements:
- id: req-omn26640-output-budget
  statement: A delegated request's output budget follows the served window and its own measured input, from settings in the store, instead of a fixed cap.
  acceptance:
  - id: AC1
    statement: 'AC1: integrated: on the running dev lane, each delegated request''s output budget is the window minus its measured input minus a declared margin, every number read from the settings store, and the 5090 Inkling server runs from its declared unit with headroom recorded before and after -- falsifier: a literal 32768 or margin remains in code, or the receipt of one delegated request read back from the deployed lane shows a budget different from that difference, or the unit test passes at origin/main (uv run pytest on the budget test)'
