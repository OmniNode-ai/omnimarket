        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC4"]
  - id: "dod-omn19970-retire-ac4-ci-summary"
    description: "Retires the AC4 binding: the ticket no longer carries AC4 (its criteria are AC1 to AC3), so the CI Summary docs-only-marker evidence settles nothing on this ticket and stops counting as criteria drift."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: "true"
        cwd: "${OMNI_HOME}/omnimarket"
    supersedes_ac_binding:
      - item: "dod-omn19970-ci-summary-docs-only-marker-pending"
        label: "AC4"
        reason_kind: "no_longer_applicable"
        reason: "The ticket dropped AC4; its criteria are AC1 to AC3, and this evidence settles nothing on it now."
        retired_by: "omn19970-lab"
        retired_at: "2026-10-15T12:10:00Z"
