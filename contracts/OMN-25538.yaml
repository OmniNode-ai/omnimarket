schema_version: 1.0.0
ticket_id: OMN-25538
title: A lane reads failure text inside a declared GitHub read budget, and a cache-only read costs no unit
summary: The lane GitHub budget node refused reads at the overlay's allowance of eight gateway cache misses per lane. The node's overlay example now declares 24, and a read through the cache-only verb is recorded as a cache read that spends no unit. The deployment's overlay value is changed in the overlays repository by its own pull request.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn25538-budget
  statement: A lane reads failure text inside a budget declared in the overlay that owns it, and a cache-only read spends no unit.
  acceptance:
  - id: AC1
    statement: 'AC1: the budget is declared in the overlay or contract that owns it, with a measured API headroom figure in the PR body and a test that a read under the new budget is served and a read over it is refused, red at the base commit and green at the head -- falsifier: uv run pytest -q on tests/nodes/node_lane_github_budget_effect/test_read_budget_omn25538.py'
  - id: AC2
    statement: 'AC2: a cache_only read through onex scm returns a cached result without spending a budget unit -- falsifier: the budget counter before and after one cache_only read is equal, and the same read without cache_only decrements it'
evidence_requirements:
- kind: tests
  description: The budget and cache-only read tests.
  command: env -u PYTHONPATH uv run --frozen pytest tests/nodes/node_lane_github_budget_effect/test_read_budget_omn25538.py -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn25538-ac1-budget
  description: Reads under the declared allowance are served, the next one is refused, and a budget above the allowance is invalid.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_lane_github_budget_effect/test_read_budget_omn25538.py -q --no-cov -n 0 -p no:randomly -k "declared_budget or allowance or overlay"
    cwd: .
- id: dod-omn25538-ac2-cache-only
  description: A cache-only read leaves the counter equal and is recorded as a cache read; the same read through job-log spends one unit.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_lane_github_budget_effect/test_read_budget_omn25538.py -q --no-cov -n 0 -p no:randomly -k cache_only
    cwd: .
- id: dod-omn25538-integration-proof
  description: Hosted CI cannot reach a lab lane, so only the local Done gate runs this unbound check. On a lab host at the sha it runs the node's budget tests, which exercise the wrapper handler the lane's onex shim calls.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-25538 --kind test -- sh -c 'uv run --frozen pytest tests/nodes/node_lane_github_budget_effect -q --no-cov -n 0 -p no:randomly'
    cwd: .
