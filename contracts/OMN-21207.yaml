schema_version: "1.0.0"
ticket_id: "OMN-21207"
title: "Delegation picks a model from measured cost and latency, not a declared tier order"
summary: "A measured-selection contract declares, per candidate, where its cost per 1M tokens (the pricing manifest) and its p50 latency (recorded delegation runs) are read, never the values. select_by_measure ranks candidates under the one declared objective, cheapest_acceptable, and raises MeasureMissingError instead of falling back to the declared order. The published routing decision carries the measured_selection record with every value and its captured_at, and a knowledge-base-internal decision note quotes the operator rulings the objective rests on."
is_seam_ticket: false
interface_change: true
interfaces_touched: ["events"]
requirements:
  - id: "req-ac1-measure-sources"
    statement: "The routing contract declares measured cost and latency sources for each candidate model."
    acceptance:
      - id: "AC1"
        statement: "AC1: The routing contract declares, per candidate model, a measured cost per 1M tokens and a measured p50 latency, read from the pricing manifest and from recorded delegation runs rather than hardcoded -- falsifier: pytest in the routing package fails when a candidate carries no measured cost field or no measured latency field."
  - id: "req-ac2-ranks-and-raises"
    statement: "Selection ranks candidates on the declared objective and raises when a measure is missing."
    acceptance:
      - id: "AC2"
        statement: "AC2: Selection ranks candidates on those two measures under one declared objective, and raises when a measure is missing instead of silently falling back to the declared order -- falsifier: a pytest case with one candidate's latency absent asserts the selector raises, and fails today because the selector has no measure input at all."
  - id: "req-ac3-decision-records-measures"
    statement: "Each delegation decision records the measure values it read and their capture times."
    acceptance:
      - id: "AC3"
        statement: "AC3: Each delegation decision records which measure values it read and when they were captured, so the choice can be re-derived afterwards -- falsifier: pytest asserts the emitted delegation event carries the measure values and their captured_at, and fails today because ModelTaskDelegatedEvent carries model_name only (OMN-7764)."
  - id: "req-ac4-objective-basis"
    statement: "The knowledge base records the selector objective and the operator approval."
    acceptance:
      - id: "AC4"
        statement: "AC4: A requirements note in the knowledge base states the objective the selector optimises (cheapest acceptable, fastest acceptable, or a stated weighting) and quotes the operator approving it -- falsifier: no such note exists in knowledge-base, or the note names no objective and carries no operator quote."
evidence_requirements:
  - kind: "tests"
    description: "Run the whole routing measured selection test file."
    command: "uv run pytest tests/unit/routing/test_measured_model_selection_omn21207.py -q --no-cov"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
