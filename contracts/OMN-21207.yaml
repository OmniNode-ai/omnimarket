    binds_ac: ["AC2"]
  - id: "dod-omn21207-ac3-decision-records-measures"
    description: "Proves AC3 by running the ac3 tests; it fails at the merge base because node_measured_model_selection_compute does not exist there."
    source: "manual"
    checks:
