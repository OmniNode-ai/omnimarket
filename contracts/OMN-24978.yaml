  command: env -u PYTHONPATH uv run --frozen pytest tests/unit/delegation/test_omn24874_tenant_overlay_terminal_cost.py tests/test_omn24874_contract_checks.py tests/test_omn24918_contract_checks.py tests/nodes/node_delegation_scenario_alarm_effect -q --no-cov -n 0 -p no:randomly
