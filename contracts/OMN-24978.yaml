schema_version: 1.0.0
ticket_id: OMN-24978
title: 'Review findings 1 to 9 on omnimarket PR 6335 at head 32e9b16c909d are fixed or argued: zero-cost pricing runs through the real converter, the headroom assertion can fail, and the contract checks pin head, host and lab command'
summary: Fixes for the review of omnimarket#6335 at head 32e9b16c909d. The projection prices a zero-cost overlay terminal from the endpoint and model the terminal carries (the canonical terminal has no backend_id), the overlay branch stores no headroom, the tests pin the probe endpoint, model and cost as literals, the OMN-24874 contract's AC5 check names the 12-character head and its live readings pin host and age, AC7 of the OMN-24918 contract is the lab-work command of the real-Postgres file, and the alarm node tests tie max ages to the units' start_interval, a backdated row to the ledger, and discovery to the handler's arguments.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
