    statement: 'AC4: the AC7 item of contracts/[OMN-24918](https://linear.app/omninode/issue/OMN-24918).yaml is bound to the lab-work command that runs the real-Postgres file, or is unbound, so it cannot pass when the Postgres run fails or skips, with a test -- falsifier: `uv run --frozen pytest tests -k "omn24918 and contract" -q` passes with the binding set back to the text-match test'
