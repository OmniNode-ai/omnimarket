dod_evidence:
- id: dod-omn24978-ac1
  description: A zero-cost overlay terminal built by _emit_terminal from the overlay decision reaches the projection through _canonical_result_to_task_delegated_payload, carries its endpoint_url (no backend_id), and is priced from the declared price; a house endpoint and an undeclared model stay unpriced.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/delegation/test_omn24874_tenant_overlay_terminal_cost.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24978-ac2
  description: The projection event and the _emit_terminal result carry headroom above 0 and the overlay branch stores 0.0; the workflow draws none for a metered tier type (pricing.py, the workflow handler and the terminal model name no headroom).
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/delegation -k headroom -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24978-ac3
  description: The AC5 check of contracts/OMN-24874.yaml greps the 12-character head (behavioural test over a temp repo), and the AC3 check reads the R8 unit's installed revision on the pinned host with a dev-merge tag and an age; the live readings pin host and age.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/test_omn24874_contract_checks.py -k "omn24874 and contract" -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24978-ac4
  description: AC7 of contracts/OMN-24918.yaml is the verbatim lab-work command of the real-Postgres item of contracts/OMN-24874.yaml, which fails on a skip or a failed run, and no longer the text-match pytest.
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/test_omn24918_contract_checks.py -k "omn24918 and contract" -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24978-ac5
  description: The probe endpoint, the R8 model_used and the expected cost are literals in the test; a test ties the cost literal to the catalogue price.
  source: manual
  binds_ac:
  - AC5
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/delegation/test_omn24874_tenant_overlay_terminal_cost.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24978-ac6
  description: The alarm node tests tie each max age to the start_interval of its unit plus a quarter, take a backdated alarm row through the real append handler (file and bus mode), show discovery never builds the handler without arguments, and the contract-check test reads organic_run_has_values as cost above 0 on a row the real R8 handler and journal sink wrote.
  source: manual
  binds_ac:
  - AC6
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_delegation_scenario_alarm_effect -q --no-cov -n 0 -p no:randomly
    cwd: .
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/test_omn24874_contract_checks.py -k real_writer_row -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24978-ac7
  description: 'The lane''s STATUS row on the ledger names the full head of the pushed change, the lab-work command and exit=0 (the Lab: head= comment and the check-runs at that head are read from the pull request with onex scm pr-checks). Local Done gate only: it reads the ledger and a sha.'
  source: manual
  binds_ac:
  - AC7
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: sh -c 'python3 "${OMNI_PLUGIN_ROOT:?}/skills/lane-brief/scripts/lane_brief.py" grep "lane=fix6335-2005" | grep -F "$(git rev-parse HEAD)" | grep -F "exit=0" | grep -q STATUS'
    cwd: .
- id: dod-omn24978-integration-proof
  description: The focused tests of this change (the overlay terminal cost tests, the contract check tests, the alarm node tests) run on a lab host at the pushed head through the lab work runner; hosted CI cannot reach the lab, so only the local Done gate runs this unbound check. The real-Postgres file runs through the lab-work command of dod-omn24874-real-postgres in contracts/OMN-24874.yaml.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24978 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/delegation/test_omn24874_tenant_overlay_terminal_cost.py tests/test_omn24874_contract_checks.py tests/test_omn24918_contract_checks.py tests/nodes/node_delegation_scenario_alarm_effect -q --no-cov -n 0 -p no:randomly
    cwd: .
