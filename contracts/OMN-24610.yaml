- id: dod-omn24610-integration-proof
  description: 'AC5 is not claimable locally: an on-demand run through onex run-node is read in the running dev runtime after the runtime carries this change and the overlays repository holds the event_bus block; the tests above are the hosted proxy (in-memory bus, the contract first topic read through the run-node resolver) and are not the integrated read.'
  source: manual
  binds_ac:
  - AC5
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24610 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/nodes/node_host_hygiene_orchestrator/test_on_demand_seam.py -q --no-cov -p no:randomly
    cwd: .
