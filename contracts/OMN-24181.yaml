  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_host_installer_registry_units/test_old_installer_module_tick_units.py tests/nodes/node_host_installer_registry_units/test_golden_chain_host_installer_registry_units.py -q -n 0 --no-cov -p no:cacheprovider
    cwd: .
