  description: 'AC1: both units are declared with their interval, module and entry file, render a plist with the branch checkout, refuse a checkout without the entry file and make no launchctl call on a dry run.'
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_host_installer_registry_units/test_old_installer_module_tick_units.py -q -n 0 --no-cov -p no:cacheprovider
    cwd: .
- id: dod-omn24181-ac3
  description: 'hosted proxy for AC3: the declared-unit tests above pass; the dry-run reads on the lab host and the list-units read are named in the pull request Lab line.'
  source: manual
