schema_version: "1.0.0"
ticket_id: OMN-22943
title: "Piece 7's reading and its generated golden and error chain tests: the hourly drill on a test admission instance reads NOT WORKING when the instance accepts the drill's lane"
summary: >-
  node_process_spine_reading_compute computes piece 7's reading (WORKING, NOT WORKING or UNKNOWN, with probed_at, published_at and max_age) from the hourly drill and the replay. node_stop_drill_effect is the hourly drill: it builds a test admission instance from the gate store's in-memory twin behind the J6 join, commits a stop on the drill piece, sends a lane above it and a control lane elsewhere, then plants the fault the plan injects on purpose (an instance that accepts the drill's lane), which must read NOT WORKING. It writes one STATUS row for the run (drill=no) and one for the planted fault (drill=yes) through the bus append command the overlay names, emits the run chain and the planted drill chain to the floor's journal, and installs its own hourly systemd user timer with schedule install. Not built here: the replay over the 800-dispatch history (the reading takes it as an optional input and the overlay says whether it is required), a Postgres-backed test instance over a copy of production state, and the golden and error chain tests as generated tests (they are hand-written in this change).
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn22943-piece-7-reading
    statement: >-
      Piece 7 has an hourly drill that sends a lane above a stop on a test admission instance, a reading computed from it, and golden and error chain tests that a named mutation turns red.
    acceptance:
      - id: AC1
        statement: "AC1: the reading computes WORKING, NOT WORKING or UNKNOWN from the drill and the replay, with probed_at, published_at and max_age -- falsifier: uv run pytest src/omnimarket/nodes/node_process_spine_reading_compute -q -k reading"
      - id: AC2
        statement: "AC2: an injected acceptance of the drill's lane flips the reading to NOT WORKING within one probe -- falsifier: uv run pytest src/omnimarket/nodes/node_process_spine_reading_compute -q -k fault_injection"
      - id: AC3
        statement: "AC3: generated golden and error chain tests exist and a named mutation turns each red -- falsifier: uv run pytest src/omnimarket/nodes/node_process_spine_reading_compute -q -k chain"
evidence_requirements:
  - kind: tests
    description: >-
      The reading tests, the fault injection, the golden and error chain tests with their two named mutations, and the drill's timer and entry-point tests.
    command: uv run --frozen pytest src/omnimarket/nodes/node_process_spine_reading_compute tests/nodes/node_process_spine_reading_compute tests/nodes/node_stop_drill_effect -q -n 0 --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn22943-ac1-reading
    description: >-
      The reading is WORKING only when the stop committed, the lane above it was refused for the stop, the control lane was admitted, the drill is inside its max age and a required replay has no mismatch; it is UNKNOWN with no drill, an errored send or a missing required replay, NOT WORKING when stale, future-dated, when the stop did not commit, the control lane was refused or the replay mismatched. Each carries probed_at, published_at and max_age.
    source: manual
    binds_ac:
      - AC1
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest src/omnimarket/nodes/node_process_spine_reading_compute -q -n 0 --no-cov -k reading
        cwd: ${OMNI_HOME}/omnimarket
  - id: dod-omn22943-ac2-fault-injection
    description: >-
      The same drill against an instance that accepts the drill's lane reads NOT WORKING with the reason instance-accepted-drill-lane in the same probe where the sound instance read WORKING.
    source: manual
    binds_ac:
      - AC2
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest src/omnimarket/nodes/node_process_spine_reading_compute -q -n 0 --no-cov -k fault_injection
        cwd: ${OMNI_HOME}/omnimarket
  - id: dod-omn22943-ac3-chain
    description: >-
      The golden chain (run chain start and success, planted drill chain start and typed failure, a WORKING row with drill=no and a NOT_WORKING row with drill=yes) and the error chains (an accepting instance, a drill that cannot plant its fault, a ledger that refuses the rows, a replayed run id) pass; the mutation gate_ignores_stop turns the golden chain red and the mutation fault_not_planted turns the error chain red.
    source: manual
    binds_ac:
      - AC3
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest src/omnimarket/nodes/node_process_spine_reading_compute -q -n 0 --no-cov -k chain
        cwd: ${OMNI_HOME}/omnimarket
  - id: dod-deploy-omn22943-node-import
    description: >-
      The drill's timer units, entry point and overlay load, which hosted CI can run.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/nodes/node_stop_drill_effect -q -n 0 --no-cov
        cwd: ${OMNI_HOME}/omnimarket
    binds_ac: []
  - id: dod-omn22943-integration-proof
    description: >-
      The pushed head ran the reading, fault injection and chain tests and the drill's timer and entry-point tests on a lab host through the bus and exited 0. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: |-
          onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane gatecore-0850 -- uv run --frozen pytest tests/nodes/node_process_spine_reading_compute tests/nodes/node_stop_drill_effect -q -n 0 --no-cov
        cwd: .
  - id: dod-deploy-omn22943-live-source
    description: >-
      Deploy assessment: the PR adds two nodes and no migration or Kafka subscription; the drill runs from its own systemd user timer on a lab host installed with schedule install, not from the runtime image. The check reads the drill handler from GitHub at the PR branch and fails when the planted fault code is missing.
    source: manual
    checks:
      - check_type: command
        check_value: "body=\"$(gh api -H 'Accept: application/vnd.github.raw' 'repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_stop_drill_effect/handlers/handler_stop_drill.py?ref=omn-22943-stop-drill')\" && case \"$body\" in *planted_instance_accepts_lane_red*) exit 0;; *) exit 1;; esac"
        cwd: "."
