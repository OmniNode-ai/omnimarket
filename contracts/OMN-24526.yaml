schema_version: 1.0.0
ticket_id: OMN-24526
title: Lab computers can reach the idle platform work steps
summary: A role that only calls nodes derives, from each node's contract, the write on its command topic and the read on its terminal topic for every login of the role (node_broker_acl_overlay_render_compute). With the shared default bus overlay (run_node_default, overlays repository) and the fallback in the node broker resolver (omnibase_infra), a lab host reaches a demand-deferred node of the dev runtime with onex run-node.
is_seam_ticket: true
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24526-callers-by-role
  statement: A lab login that sends a run-node request holds rows on exactly the node's command and terminal topics, derived from contracts by role.
  acceptance:
  - id: AC1
    statement: 'AC1: a role that only calls nodes derives, from each node''s contract, a write on its command topic and a read on its terminal topic for every login of the role, and refuses a called node with no terminal topic -- falsifier: uv run pytest tests/nodes/node_broker_acl_overlay_render_compute/test_derive_callers.py -q'
  - id: AC3
    statement: 'AC3: the topics onex run-node sends to and reads match the caller rows for every packaged node -- falsifier: uv run pytest tests/nodes/node_broker_acl_overlay_render_compute/test_seam_run_node_topics.py -q'
  - id: AC4
    statement: 'AC4: integrated: twenty named deferred nodes each answer an onex run-node demand sent from a lab host to the dev runtime -- falsifier: onex run-node <node> --input ''{}'' from a lab host prints an answer from the node and never a refusal or a timeout, read in the running dev runtime'
evidence_requirements:
- kind: tests
  description: The caller-role and seam tests pass at the pushed head.
  command: uv run --frozen pytest tests/nodes/node_broker_acl_overlay_render_compute -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24526-ac1
  description: 'Golden: each login writes the command topic and reads the terminal topic and holds no group row. Error chain: no terminal_event or no command topic refuses and derives nothing. Failing control: a role that runs the node keeps the runner shape.'
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_broker_acl_overlay_render_compute/test_derive_callers.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24526-ac3
  description: 'Seam: the sender topics of every packaged node (at least 100 compared) equal the command and terminal uses the derivation reads; a drifted sender topic is seen.'
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_broker_acl_overlay_render_compute/test_seam_run_node_topics.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24526-ac4
  description: The tests behind the integrated reading pass; the 20 named nodes' answers on the dev runtime are recorded in the Lab comment of this pull request and the lane report.
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_broker_acl_overlay_render_compute -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24526-integration-proof
  description: Run the caller-role tests on a lab host at the pushed head. Hosted CI cannot reach the lab hosts, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24526 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_broker_acl_overlay_render_compute -q --no-cov -n 0 -p no:randomly
