---
schema_version: "1.0.0"
ticket_id: "OMN-21992"
title: "Compaction probe answerer and judge, with the judge's calibration"
summary: >-
  Adds node_compaction_probe_run_effect. The fixed answering model and a different judge model are
  called through an injected caller, every call is recorded append-only under the key of the
  measurement plan (manifest digest, served model id, prompt hash, context hash, decoding settings,
  repeat index), and REPLAY mode reads recordings alone and scores a missing one UNAVAILABLE. The
  judge calibration report carries Wilson lower bounds on the oracle, empty and inverted controls,
  and a scoring run is refused without a passing report for the same manifest and model pair.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-compaction-probe-run-node"
    statement: |-
      Answerer and judge calls are recorded under their key, replay makes no call, and the judge is calibrated before it scores.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: the judge's Wilson lower bound on the oracle is at least 0.90 and on inverted at least 0.90, and no scoring task starts without the calibration report -- falsifier: `uv run pytest tests/nodes/node_compaction_probe_run_effect -k judge_calibration -q --no-cov` passes with a calibration report below either bound
      - id: "AC2"
        statement: |-
          AC2: rerunning from recordings makes no model call -- falsifier: `uv run pytest tests/nodes/node_compaction_probe_run_effect -k replay_no_network -q --no-cov` finds a network call in the replay run
      - id: "AC3"
        statement: |-
          AC3: the answerer and the judge are different served models -- falsifier: `uv run pytest tests/nodes/node_compaction_probe_run_effect -k answerer_judge_differ -q --no-cov` passes with equal ids in the report
      - id: "AC4"
        statement: |-
          AC4: three repeats at identical settings are three recordings keyed by manifest digest and repeat index, and a retry appends an attempt without replacing the earlier one -- falsifier: `uv run pytest tests/nodes/node_compaction_probe_run_effect -k "repeat_keys or retry_appends" -q --no-cov` finds two repeats collapsed into one record or an attempt overwritten
evidence_requirements:
  - kind: "tests"
    description: "AC1 to AC4: the node suite."
    command: "uv run pytest tests/nodes/node_compaction_probe_run_effect/test_probe_run.py -q -p no:randomly --no-cov"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn21992-ac1"
    description: "AC1: a calibration report below either bound fails, and a scoring run without a passing report is refused with no model call."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_compaction_probe_run_effect/test_probe_run.py -k judge_calibration -q -p no:randomly --no-cov"
        cwd: "."
    binds_ac: ["AC1"]
  - id: "dod-omn21992-ac2"
    description: "AC2: a replay over recordings is equal to the record run and makes no model call or network call."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_compaction_probe_run_effect/test_probe_run.py -k replay_no_network -q -p no:randomly --no-cov"
        cwd: "."
    binds_ac: ["AC2"]
  - id: "dod-omn21992-ac3"
    description: "AC3: equal answerer and judge ids are refused at the request, and the report names two different ids."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_compaction_probe_run_effect/test_probe_run.py -k answerer_judge_differ -q -p no:randomly --no-cov"
        cwd: "."
    binds_ac: ["AC3"]
  - id: "dod-omn21992-ac4"
    description: "AC4: three repeats are three keys that differ by repeat index, and a retry appends attempts without rewriting the first."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_compaction_probe_run_effect/test_probe_run.py -k 'repeat_keys or retry_appends' -q -p no:randomly --no-cov"
        cwd: "."
    binds_ac: ["AC4"]
  - id: "dod-omn21992-deploy-contract"
    description: "Deploy probe: read the node's contract.yaml at the checked-out commit and require the effectful descriptor."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: >-
          gh api "repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_compaction_probe_run_effect/contract.yaml?ref=$(git rev-parse HEAD)" --jq .content | base64 -d | grep -cE '^  node_archetype: effect$' | grep -qx 1
  - id: "dod-omn21992-integration-proof"
    description: "The pushed head ran the node suite on a lab host and exited 0. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check."
    source: "manual"
    execution_scope: "local_done_gate"
    checks:
      - check_type: "command"
        check_value: "uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha \"$(git rev-parse HEAD)\" --lane dod-integration-proof-21992 -- uv run --frozen pytest tests/nodes/node_compaction_probe_run_effect/test_probe_run.py tests/nodes/node_compaction_probe_run_effect/test_contract_probe_run.py -q -p no:randomly --no-cov"
        cwd: "."
