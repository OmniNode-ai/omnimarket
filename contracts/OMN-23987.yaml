schema_version: 1.0.0
ticket_id: OMN-23987
title: Host unit install orchestrator over the real bus
summary: An install orchestrator composes snapshot, install through the registry installer, readback against the render, one run read and automatic rollback, each step a typed event the install state reducer
  folds, and the command line publishes the request on the real dev bus.
is_seam_ticket: true
interface_change: true
interfaces_touched:
- public_api
requirements:
- id: req-omn23987-install-orchestrator
  statement: A host unit install is one workflow on the bus whose every step is a typed event folded by the install state reducer, with an automatic rollback.
  acceptance:
  - id: AC1
    statement: 'AC1: the install orchestrator walks render, snapshot, install, readback and one run read, each step a typed event the reducer folds, and ends with one terminal event -- falsifier: pytest
      tests/nodes/node_host_install_orchestrator/test_orchestrator.py -k golden -q'
  - id: AC2
    statement: 'AC2: a failed install, a readback that differs from the render, or a failed run read restores the snapshot and ends rolled_back, never installed -- falsifier: pytest tests/nodes/node_host_install_orchestrator/test_orchestrator.py
      -k "rollback or restores" -q'
  - id: AC3
    statement: 'AC3: the whole chain ends the same way in process, on the in-memory bus and on the real broker -- falsifier: pytest tests/nodes/node_host_install_orchestrator/test_seam.py -q'
  - id: AC4
    statement: 'AC4: the command line publishes the install request on the real dev bus and waits for the terminal event, with no in-memory bus on that path -- falsifier: pytest tests/nodes/node_host_install_orchestrator/test_cli.py
      -q'
  - id: AC5
    statement: 'AC5: integrated: one real install on h051 through the workflow on the dev bus shows its states and digests in the reducer projection read in the running runtime -- falsifier: the projection
      read for that unit shows no verified or run_ok state'
evidence_requirements:
- kind: tests
  description: The orchestrator, file effect, readback and CLI tests pass at the pushed head.
  command: uv run pytest tests/nodes/node_host_install_orchestrator/ tests/nodes/node_host_install_file_effect tests/nodes/node_host_install_readback_compute -q -p no:randomly --no-cov
emergency_bypass:
