    check_value: uv run --frozen pytest tests/nodes/node_context_pack_orchestrator tests/pack -q --no-cov -n 0 -p no:randomly -k "tier_specs or window or lane_brief_context_tiers"
    cwd: .
- id: dod-omn24768-ac2
