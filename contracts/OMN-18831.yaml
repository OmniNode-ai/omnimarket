is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-omn18831-prose-falsifier-pair"
    statement: "AC1: the falsifier pair above is a test. The exact prompt opening quoted here classifies as `document`, and the rephrased variant classifies identically — a two-word difference must not change the class. -- falsifier: the pre-fix prompt classifies as `code_generation`; post-fix it does not."
    acceptance:
      - id: "AC1"
        statement: "AC1: the falsifier pair above is a test. The exact prompt opening quoted here classifies as `document`, and the rephrased variant classifies identically — a two-word difference must not change the class. -- falsifier: the pre-fix prompt classifies as `code_generation`; post-fix it does not."
  - id: "req-omn18831-prose-counter-signals"
    statement: "AC2: no task-class predicate decides a class on a bare substring that appears in ordinary prose, or the predicate is guarded by a counter-signal the prompt already carried (an explicit output format, a no-code instruction). State which was chosen and why. -- falsifier: a prose prompt carrying both the trigger phrase and an explicit markdown-output instruction classifies as prose."
    acceptance:
      - id: "AC2"
        statement: "AC2: no task-class predicate decides a class on a bare substring that appears in ordinary prose, or the predicate is guarded by a counter-signal the prompt already carried (an explicit output format, a no-code instruction). State which was chosen and why. -- falsifier: a prose prompt carrying both the trigger phrase and an explicit markdown-output instruction classifies as prose."
  - id: "req-omn18831-repeated-floor-stops"
    statement: "AC3: an escalation does not climb against a deterministic floor it has already failed identically on every rung. Either the ladder stops and reports the misclassification, or the floor is re-derived per rung. -- falsifier: the run above escalates at most once, and its terminal message names the classification rather than the compile error."
    acceptance:
      - id: "AC3"
        statement: "AC3: an escalation does not climb against a deterministic floor it has already failed identically on every rung. Either the ladder stops and reports the misclassification, or the floor is re-derived per rung. -- falsifier: the run above escalates at most once, and its terminal message names the classification rather than the compile error."
  - id: "req-omn18831-serving-route-tier"
    statement: "AC4: an attempt's recorded `tier` agrees with the backend that served it. -- falsifier: a run that escalates to the cloud records no attempt whose tier and model disagree."
    acceptance:
      - id: "AC4"
        statement: "AC4: an attempt's recorded `tier` agrees with the backend that served it. -- falsifier: a run that escalates to the cloud records no attempt whose tier and model disagree."
