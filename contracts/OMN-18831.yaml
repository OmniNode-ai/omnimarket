---
schema_version: "1.0.0"
ticket_id: "OMN-18831"
title: "Identical deterministic floor failures across the attempted ladder stop further retries and escalation"
summary: "Failed blocking declared deterministic rule names persist in attempt history. After one retry or tier escalation, identical failures across the attempted ladder terminate the workflow with a typed attempt naming the task class and review task classification."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-repeated-floor-stops"
    statement: "A repeated identical deterministic floor failure stops retries and escalation instead of climbing the whole ladder."
    acceptance:
      - id: "AC1"
        statement: "AC1: identical failed blocking rule names across the attempted ladder terminate the workflow -- falsifier: uv run pytest tests/unit/delegation/test_repeated_deterministic_floor_omn18831.py -q"
  - id: "req-escalation-skips-attempted-backend"
    statement: "A quality escalation never climbs to a rung that declares the backend whose answer the gate just rejected."
    acceptance:
      - id: "AC2"
        statement: "AC2: after the gate rejects an answer on one rung, the next-tier probe and the routing intent exclude that rung's backend, so a later tier label naming the same backend is not climbed to -- falsifier: uv run pytest tests/unit/delegation/test_escalation_skips_attempted_backend_omn18831.py -q fails at the merge base, where the probe and the intent carry only transport-failed backends"
evidence_requirements:
  - kind: "tests"
    description: "Run the repeated deterministic floor tests and the attempted-backend escalation tests."
    command: "uv run pytest tests/unit/delegation/test_repeated_deterministic_floor_omn18831.py tests/unit/delegation/test_escalation_skips_attempted_backend_omn18831.py -q"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn18831-ac1-repeated-floor"
    description: "AC1 hosted probe. Identical deterministic floor failures stop the ladder."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/delegation/test_repeated_deterministic_floor_omn18831.py -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC1"]
  - id: "dod-omn18831-ac2-attempted-backend"
    description: "AC2 hosted probe. A quality escalation excludes the rejected backend from the next-tier probe and the routing intent, and the exclusion survives a state roundtrip."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/delegation/test_escalation_skips_attempted_backend_omn18831.py -q"
        cwd: "${OMNI_HOME}/omnimarket"
      - check_type: "command"
        check_value: >-
          bash -o pipefail -c 'curl --fail --silent --show-error --location --max-time 30 "https://raw.githubusercontent.com/OmniNode-ai/omnimarket/$(git rev-parse HEAD)/src/omnimarket/nodes/node_delegation_orchestrator/handlers/handler_delegation_workflow.py" | grep -F "quality_rejected_backend_refs"'
    binds_ac: ["AC2"]
