schema_version: 1.0.0
ticket_id: OMN-23325
title: The projection runner's publish callable survives the per-delivery producer stop, so terminal events are not lost to ProducerClosed
summary: BaseProjectionRunner.get_publish_fn returns a callable that resolves the live Kafka producer on each call instead of caching a closure over a producer the runtime host stops after every delivery.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23325-publish-survives-stop
  statement: The projection runner's publish callable resolves the live producer on each call, so a terminal-event publish after a delivery finishes does not use a stopped producer.
  acceptance:
  - id: AC1
    statement: 'AC1: a projection''s terminal-event publish after a delivery finishes succeeds, and no publish uses a stopped producer -- falsifier: uv run pytest tests -q -k producer_closed_terminal in omnimarket, failing on the old KeptPools'
  - id: AC2
    statement: 'AC2: after a dev deploy, the runtime log shows no ProducerClosed from node_projection_delegation over an hour -- falsifier: the runtime log read on h201 for that hour'
evidence_requirements:
- kind: tests
  description: The producer_closed_terminal tests pass on the fix and fail on the pre-fix runner
  command: uv run --frozen pytest tests/test_omn23325_producer_closed_terminal_publish.py -q --no-cov -p no:randomly -k producer_closed_terminal
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23325-producer-closed-terminal
  description: Runs the focused producer_closed_terminal tests with a fake producer that raises ProducerClosed once stopped. A publish after a stop and a callable held across a stop both reach a live producer, an injected publish function is untouched, three runtime deliveries each emit their terminal event, and a send the broker refuses is logged without failing the row. The same tests fail on the pre-fix runner (cached closure over the stopped producer).
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/test_omn23325_producer_closed_terminal_publish.py -q --no-cov -p no:randomly -k producer_closed_terminal
    cwd: .
- id: dod-omn23325-publisher-injection-regression
  description: The existing projection publisher injection tests still pass with the changed get_publish_fn. A regression check, not proof of a criterion, so it binds none.
  source: manual
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/test_omn12810_projection_publisher_injection.py -q --no-cov -p no:randomly
    cwd: .
- id: dod-omn23325-runner-deploy
  description: Reads the runner source on the branch; the exit status depends on get_publish_fn resolving the producer through _ensure_producer inside the returned callable and no longer caching the closure in self._publish_fn, so it goes red on the pre-fix runner. Runs on a hosted runner.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: command
    check_value: 'grep -q "live = await self._ensure_producer()" src/omnimarket/projection/runner.py && ! grep -q "self._publish_fn = _publish" src/omnimarket/projection/runner.py'
    cwd: .
- id: dod-omn23325-integration-proof
  description: Runs the producer_closed_terminal tests at the pushed head on a lab host through the lab work runner, then reads the dev runtime log on h201, which holds no ProducerClosed line from node_projection_delegation for one hour after the branch is deployed. Hosted CI cannot reach h201, so only the local Done gate runs this check.
  source: manual
  binds_ac:
  - AC2
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: 'env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23325 --kind test -- uv run --frozen pytest tests -q --no-cov -p no:randomly -k producer_closed_terminal'
    cwd: .
  - check_type: command
    check_value: 'test "$(ssh h201 "docker logs --since 1h omninode-runtime 2>&1 | grep node_projection_delegation | grep -c ProducerClosed")" = 0'
    cwd: .
