schema_version: 1.0.0
ticket_id: OMN-25103
title: The dashboard's Running figure reads the newest integration pass from a served projection
summary: >-
  node_integration_reading_publish_effect publishes each hourly integration pass on
  onex.evt.omnimarket.floor-integration-pass.v1 as well as on its snapshot topic, because the runtime
  cannot dispatch a snapshot topic to a writer. node_projection_floor_integration consumes that event,
  holds the newest pass in floor_integration_rows (one row per merged change, each carrying the pass's
  counts and as_of; keys an older pass named and the newest does not are deleted; an older pass writes
  nothing) and exposes onex.snapshot.projection.floor-integration-rows.v1 for the local dashboard. The
  Running figure is the number of served rows whose state is running, which equals seen_running. The
  omnidash figure (AC2, AC3) and the omnibase_infra grant (AC5) are their own pull requests.
is_seam_ticket: true
interface_change: true
interfaces_touched:
  - topics
  - public_api
requirements:
  - id: req-omn25103-writer
    statement: A projection writer consumes the integration pass event and serves the newest pass's rows and counts.
    acceptance:
      - id: AC1
        statement: >-
          AC1: a projection writer consumes onex.evt.omnimarket.floor-integration-pass.v1 and serves its rows
          and counts as onex.snapshot.projection.floor-integration-rows.v1; a read returns the newest pass's
          rows and counts -- falsifier: uv run --frozen pytest tests/nodes/node_projection_floor_integration
          -q -n 0 -p no:randomly --no-cov; on the base commit the node does not exist
  - id: req-omn25103-publisher
    statement: The integration publisher puts each pass on the event topic as well as on its snapshot topic.
    acceptance:
      - id: AC4
        statement: >-
          AC4: one pass publishes both the snapshot and the event, with the same payload -- falsifier: uv run
          --frozen pytest tests/nodes/node_integration_reading_publish_effect/test_integration_pass_event_omn25103.py
          -q -n 0 -p no:randomly --no-cov; two of its three tests fail on the base commit
  - id: req-omn25103-lab-item-allowed-program
    statement: The integration-proof item starts with programs a lab host runs, so the lab does not refuse it.
    acceptance:
      - id: AC6
        statement: >-
          AC6: the integration-proof item's command, and the command it sends to the lab after --, each start with
          a program a lab host runs, so the lab does not refuse it -- falsifier: uv run pytest -q
          tests/contracts/test_omn25103_lab_item_allowed_program.py fails on omnimarket dev, where the item starts
          with env
evidence_requirements:
  - kind: tests
    description: The floor integration writer and the integration publisher.
    command: >-
      uv run --frozen pytest tests/nodes/node_projection_floor_integration
      tests/nodes/node_integration_reading_publish_effect -q -n 0 -p no:randomly --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn25103-ac1
    description: >-
      AC1 is the writer's exposure, newest-pass, dropped-key, older-pass, replay and golden-chain cases; the
      node directory is absent at the merge base, so the check fails there.
    source: manual
    binds_ac:
      - AC1
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/nodes/node_projection_floor_integration -q -n 0 -p no:randomly --no-cov
        cwd: "${OMNI_HOME}/omnimarket"
  - id: dod-omn25103-ac4
    description: AC4 is the publisher's event-topic cases; two of the three fail at the merge base.
    source: manual
    binds_ac:
      - AC4
    checks:
      - check_type: test_passes
        check_value: >-
          uv run --frozen pytest
          tests/nodes/node_integration_reading_publish_effect/test_integration_pass_event_omn25103.py
          -q -n 0 -p no:randomly --no-cov
        cwd: "${OMNI_HOME}/omnimarket"
  - id: dod-omn25103-lab-item-allowed-program
    description: >-
      The integration-proof item's command, and the command it sends to the lab after --, each start with a
      program a lab host runs (DEFAULT_ALLOWED_EXECUTABLES), so a lab host does not refuse the work unit.
    source: manual
    binds_ac:
      - AC6
    checks:
      - check_type: test_passes
        check_value: uv run pytest -q tests/contracts/test_omn25103_lab_item_allowed_program.py
        cwd: "${OMNI_HOME}/omnimarket"
  - id: dod-omn25103-integration-proof
    description: >-
      The pushed head runs the floor integration writer and the integration publisher suites, golden chain
      included, on a lab host. The writer's node directory does not exist at the merge base, so the run is red
      there. Hosted CI cannot dispatch lab work, so only the local Done gate runs this unbound check.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: >-
          uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)"
          --lane dod-integration-proof-25103 --kind test -- uv run --frozen pytest
          tests/nodes/node_projection_floor_integration tests/nodes/node_integration_reading_publish_effect -q --no-cov
          -m 'not kafka'
        cwd: .
  - id: dod-omn25103-user-only-provision
    description: >-
      node_dev_identity_provision_effect has a user-only mode (one dev-realm user with a named realm role, no tenant)
      and node_secret_store_effect declares dev_dashboard_reader_password for its password, so a plain read-only dev
      user can be created for the dev OmniDash reading. The new test file fails at the merge base (the command has no
      user_only field and the store has no such key).
    source: manual
    binds_ac:
      - AC7
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/nodes/node_dev_identity_provision_effect/test_user_only_mode.py -q -n 0 -p no:randomly --no-cov
        cwd: "${OMNI_HOME}/omnimarket"
      - check_type: command
        check_value: >-
          bash -c 'gh api "repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_dev_identity_provision_effect/contract.yaml?ref=$(git rev-parse HEAD)" --jq .content | base64 -d | grep -q "^user_only:"'
        cwd: "${OMNI_HOME}/omnimarket"
  - id: dod-omn25103-retire-deleted-ac7
    description: >-
      AC7 was deleted from OMN-25103; the ticket now carries AC1 to AC6 only. This item retires the claim the
      user-only provision item made on the deleted criterion. Its test reads this contract and fails on dev,
      where AC7 is still claimed and its requirement is still declared. It binds AC6, the criterion that
      keeps this contract's items runnable.
    source: manual
    binds_ac:
      - AC6
    checks:
      - check_type: test_passes
        check_value: uv run pytest -q tests/contracts/test_omn25103_deleted_ac7_retired.py
        cwd: "${OMNI_HOME}/omnimarket"
    supersedes_ac_binding:
      - item: dod-omn25103-user-only-provision
        label: AC7
        reason_kind: no_longer_applicable
        reason: AC7 was deleted from the ticket, so the item that bound it no longer proves a criterion the ticket carries.
        retired_by: q-close25103-0630
        retired_at: "2026-11-28T06:55:00Z"
