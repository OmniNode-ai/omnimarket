    description: "A host row declaring the three fallback route columns validates, and an option-looking value in any of them is still refused. At the merge base the accept case fails with extra_forbidden on all three keys."
    command: "uv run pytest tests/unit/lab_work/test_lab_host_table_fallback_targets.py -q"
