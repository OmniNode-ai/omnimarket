schema_version: "1.0.0"
ticket_id: "OMN-21984"
title: "The lab host row model accepts the fallback route columns, so an off-LAN host can declare a second route"
summary: "ModelLabHostRow carries ssh_user, proxy_jump and ssh_identity for the row's target but nothing for its fallback_targets, and the model forbids extra keys, so a host table that declares a fallback route is refused whole and the off-LAN host (h106) cannot be reached. The row now carries fallback_ssh_user, fallback_proxy_jump and fallback_ssh_identity with the same SshUser, SshJump and SshIdentity validators, so an option-looking value is still refused."
