schema_version: 1.0.0
ticket_id: OMN-24455
title: 'Effect-node bypass: count and refuse new bypasses, and move onex setup onto the local runtime'
summary: 'Two new nodes count, per repository and per kind of outside world, the lines that reach GitHub, git remotes, Slack, Linear, lab hosts over ssh, docker and kafka administration outside the effect node that owns that world, and refuse a count above a shrink-only ceiling. The check is a pre-push hook, a strict CI Summary job and a row in the recorded-heads fixture. The first caller that skipped the runtime moves onto it: onex setup now publishes its command on the local runtime and node_onex_setup_effect handles it; the provider key is parked in the process and never rides on the command. The moved caller held no counted outside-world line, so the omnimarket ceiling is unchanged. Not in this change - the other callers the scan counts, and the other repositories wiring the same check.'
is_seam_ticket: true
interface_change: true
interfaces_touched:
- public_api
requirements:
- id: req-bypass-ratchet-count
  statement: The scan counts the outside-world calls outside the sanctioned effect node of each world and the ratchet refuses a count above the baseline, a repository with no baseline row and a baseline above the merge base's.
  acceptance:
  - id: AC1
    statement: 'AC1: the scan counts the lines that reach GitHub, git remotes, Slack, Linear, lab hosts over ssh, docker and kafka administration outside an effect node, and the ratchet refuses a count above its ceiling -- falsifier: pytest tests/unit/nodes/node_effect_bypass_scan_effect tests/unit/nodes/node_effect_bypass_ratchet_compute -q passes when a ceiling value is lowered by one for any kind'
- id: req-bypass-ratchet-wired
  statement: The check is a pre-push hook and a strict CI Summary job, and the baseline carries today's counts.
  acceptance:
  - id: AC2
    statement: 'AC2: the check is a pre-push hook and a strict job of the omnimarket CI Summary, and the ceiling file carries today''s counts for omnimarket, omnibase_infra and omniclaude -- falsifier: pytest tests/ci/test_omn24432_effect_bypass_ratchet_wiring.py -q passes with the job removed from the strict table'
- id: req-bypass-ratchet-chain
  statement: The ratchet compute answers a typed request on the in-memory bus and fails a request the model refuses.
  acceptance:
  - id: AC3
    statement: 'AC3: the same input gives the same verdict through the in-memory bus, a request the model refuses fails with no verdict, and the golden and error chain tests run on that bus -- falsifier: pytest tests/test_golden_chain_effect_bypass_ratchet_compute.py -q passes when the handler returns ok for a count above its ceiling'
- id: req-bypass-setup-runtime
  statement: onex setup publishes its command on the local runtime and the node handles it; the provider key never travels on the command; the ceiling is unchanged.
  acceptance:
  - id: AC4
    statement: 'AC4: onex setup publishes its command to the local runtime and node_onex_setup_effect handles it, the provider key never travels on that command, and the omnimarket ceiling is unchanged because the moved caller held no counted outside-world line -- falsifier: pytest tests/unit/nodes/node_onex_setup_effect/test_onex_setup_runtime_route.py -q passes when the CLI calls the handler in its own process again'
- id: req-bypass-ratchet-integrated
  statement: A lab host running the pushed branch runs onex setup through the local runtime, reads the ceiling counts and refuses a planted direct call.
  acceptance:
  - id: AC5
    statement: 'AC5: integrated: on a lab host from the pushed branch, onex setup runs through the local runtime and the check against the omnimarket tree exits 0, and exits 1 after one planted direct call is added to a tracked file -- falsifier: onex setup runs the handler in its own process, or the check exits 0 with the planted call present'
evidence_requirements:
- kind: tests
  description: The focused scan, ratchet, chain, wiring and onex setup tests at the pushed head; each carries a named failing control.
  command: env -u PYTHONPATH uv run --frozen pytest tests/unit/nodes/node_effect_bypass_scan_effect tests/unit/nodes/node_effect_bypass_ratchet_compute tests/test_golden_chain_effect_bypass_ratchet_compute.py tests/ci/test_omn24432_effect_bypass_ratchet_wiring.py tests/unit/nodes/node_onex_setup_effect -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-bypass-ratchet-ac1
  description: The scan counts one site per kind in a synthetic tree, counts nothing in tests, docs, comments, docstrings and the sanctioned node, and the check exits 1 when a baseline value is one lower (controls dropping the exclusions, dropping the sanction and lowering the baseline).
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/nodes/node_effect_bypass_scan_effect tests/unit/nodes/node_effect_bypass_ratchet_compute -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-bypass-ratchet-ac2
  description: The hook, the CI job, the strict summary row and the baseline are pinned together, and the real omnimarket tree is at or under its baseline.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/ci/test_omn24432_effect_bypass_ratchet_wiring.py tests/unit/scripts/ci/test_ci_summary_rules_replay_omn23079.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-bypass-ratchet-ac3
  description: The golden and error chain tests run the ratchet compute through the in-memory runtime.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/test_golden_chain_effect_bypass_ratchet_compute.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-bypass-setup-runtime-ac4
  description: 'onex setup hands its command to the local runtime: the spy sees the node id and a payload with no key, the CLI has no handler import, a refused request ends exit 1 through the runtime, and a runtime failure leaves no parked key (controls: the old in-process call fails the CLI test and the key-in-payload test).'
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/nodes/node_onex_setup_effect -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-bypass-ratchet-ac5-hosted
  description: The real omnimarket tree is at or under its baseline (the check exits 0) and a planted direct call raises the count past it (the check exits 1), and onex setup runs through the local runtime in the focused tests, on the hosted runner; the lab-host reading is the separate local Done gate item.
  source: manual
  binds_ac:
  - AC5
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/ci/test_omn24432_effect_bypass_ratchet_wiring.py tests/unit/nodes/node_effect_bypass_scan_effect tests/unit/nodes/node_onex_setup_effect/test_onex_setup_runtime_route.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-bypass-ratchet-integration-proof
  description: The pushed head ran the scan, ratchet and chain tests on a lab host through the lab work runner and exited 0. The running reading on a lab host (check exits 0 on the tree, exits 1 with one planted call) is in the pull request's Lab line.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-bypass --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/nodes/node_effect_bypass_scan_effect tests/unit/nodes/node_effect_bypass_ratchet_compute tests/test_golden_chain_effect_bypass_ratchet_compute.py tests/unit/nodes/node_onex_setup_effect -q --no-cov -n 0 -p no:randomly
    cwd: .
