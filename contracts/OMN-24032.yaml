  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24032 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_overlay_roots_resolve_effect tests/unit/handlers/bus_binding/test_node_event_bus_overlay_roots.py -q --no-cov -p no:randomly
