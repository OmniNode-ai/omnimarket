    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_factory_floor_compute/test_handler_factory_floor.py tests/nodes/node_factory_floor_effect/test_runtime_factory_floor.py -q --no-cov --tb=line -k determinism_or_cli"
