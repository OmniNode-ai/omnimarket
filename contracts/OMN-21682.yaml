        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn21682-deploy-probe"
    description: "Deploy probe. The effect node's handler file that GitHub serves at the checked-out commit declares HandlerFactoryFloorEffect, the entry this change adds; the probe reads it from GitHub at that commit and exits nonzero on a tree without it, so it fails at the merge base."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: "gh api \"repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_factory_floor_effect/handlers/handler_factory_floor_effect.py?ref=$(git rev-parse HEAD)\" --jq .content | base64 -d | grep -c '^class HandlerFactoryFloorEffect:'"
  - id: "dod-omn21682-ac7"
