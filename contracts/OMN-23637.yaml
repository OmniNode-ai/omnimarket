schema_version: 1.0.0
ticket_id: OMN-23637
title: The code contract score reads a pytest setup error as an infrastructure fault, not a failed check
summary: A bound check that needs a service (a fixture that cannot reach Postgres) ends pytest on exit 1 with "1 error" and no failed test. The scorer read the exit code only and scored that fail_check, although the node's own rule is that an infrastructure fault at check setup is unscorable. The handler now reads pytest's closing summary line (typed, ModelPytestSummary) and scores exit 1 with an error and no failed test as unscorable with source env. A failed test, a collection error (exit 2) and a non-pytest failing command stay fail_check. The protected-path defect of a change editing a work-record file under contracts/ is not changed here; the options are in the lane report.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23637-setup-error-unscorable
  statement: A check that ends in a pytest setup error with no failed test is unscorable, and every other failure stays a failure.
  acceptance:
  - id: AC1
    statement: 'AC1: a real pytest run whose fixture raises at setup is scored unscorable with source env, not fail_check -- falsifier: uv run pytest tests/nodes/node_code_contract_score_effect/test_check_setup_error_unscorable.py -q -k real_pytest_setup_error, red when the handler reads the exit code only'
  - id: AC2
    statement: 'AC2: a failed test beside an error, a collection error and a non-pytest failing command stay fail_check -- falsifier: uv run pytest tests/nodes/node_code_contract_score_effect/test_check_setup_error_unscorable.py -q -k error_chain, red if any of them reads unscorable'
  - id: AC3
    statement: 'AC3: a setup-error verdict ends on the scored topic as one event that round-trips -- falsifier: uv run pytest tests/nodes/node_code_contract_score_effect/test_check_setup_error_unscorable.py -q -k golden_chain, red when the verdict is fail_check'
evidence_requirements:
- kind: tests
  description: The setup-error tests and the node's existing tests pass.
  command: uv run --frozen pytest tests/nodes/node_code_contract_score_effect -q -n 0 --no-cov -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
