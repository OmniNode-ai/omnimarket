---
schema_version: "1.0.0"
ticket_id: "OMN-23391"
title: "The factory floor takes its overlay store input from a bus projection with its own freshness, and every input it reads is inventoried with the node and topic that replace each file"
summary: "The floor publish read the overlay store's fleet from a file that one reader on the operator's Mac kept; when that reader stalled the file froze and every host row read wrong. Each host's reader now publishes its view of the fleet on a snapshot topic stamped with the time it stood by it, a new publish step (node_floor_projection_read_effect) reads the topic and writes the projections with their own times, and the simple floor judges the overlay store against that time and the projection's own bound: a projection older than its bound reads unknown. The same pull request carries the inventory of every input the publish reads, held to the publish contract by a test."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
evidence_requirements:
  - kind: "tests"
    description: "The projection reader, the producer's publication, the floor's overlay store row and the inventory test pass, with the named breaks."
    command: "uv run --frozen pytest tests/nodes/node_floor_projection_read_effect tests/unit/nodes/node_overlay_store tests/unit/nodes/node_floor_simple_effect/test_overlay_store_source.py tests/nodes/node_factory_floor_publish_effect/test_floor_input_inventory.py -q --no-cov"
  - kind: "tests"
    description: "The owner map publisher, its projection read back with the controller's state file deleted, and the board's work list built from it pass."
    command: "uv run --frozen pytest tests/nodes/node_floor_owner_map_publish_effect tests/nodes/node_floor_simple_effect/test_worklist_floor_simple.py -q --no-cov"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn23391-inventory"
    description: "AC1: the inventory names every input the publish reads, with the node and topic that replace each file, and the test fails when a publish step or a path in a floor node's contract has no row."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run --frozen pytest tests/nodes/node_factory_floor_publish_effect/test_floor_input_inventory.py -q --no-cov"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC1"]
  - id: "dod-omn23391-overlay-store-projection"
    description: "AC2, overlay store input: the reader keeps the producer's own time, the newest publication wins, a projection older than its bound reads unknown on the floor though the bundle that carried it is new, and the floor's row needs no local fleet file."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run --frozen pytest tests/nodes/node_floor_projection_read_effect tests/unit/nodes/node_overlay_store tests/unit/nodes/node_floor_simple_effect/test_overlay_store_source.py tests/nodes/node_factory_floor_publish_effect/test_factory_floor_publish.py -q --no-cov"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC2"]
  - id: "dod-omn23391-integration-proof-lab"
    description: "The change run on a lab host from its pushed head: the projection reader, the producer's publication over a bus, the floor's overlay store row and the inventory test pass on the lab host the placement picks. Hosted CI cannot place on the lab, so only the local Done gate runs this unbound check; the host, head and exit code are in the pull request comment that names the head."
    source: "manual"
