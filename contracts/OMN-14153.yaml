schema_version: "1.0.0"
ticket_id: "OMN-14153"
title: "Log persistence writes through the contract-resolved runtime database"
summary: "node_log_persistence_effect decodes captured bus terminals through the existing delegation projection model before validating their verdicts. node_swarm_dispatch_orchestrator requires runtime event_bus injection and emits canonical envelopes so its commands and terminals reach consumers. Focused tests cover both runtime seams."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-log-persistence-runtime-database"
    statement: "Bus dispatch of node_log_persistence_effect writes log_entries through the database the runtime resolves from the contract's db_io, for canonical structured logs and delegation terminal events. The criterion below is labeled AC1 so the binding item can claim it through binds_ac."
    acceptance:
      - id: "AC1"
        statement: "AC1: the log persistence handler tests pass at the head, including the runtime database dispatch arm and replay-safe delegation execution logs -- falsifier: uv run pytest tests/unit/nodes/test_node_log_persistence_effect/test_handler_log_persistence_effect.py -q in omnimarket"
  - id: "req-swarm-runtime-publication"
    statement: "The runtime handler resolver supplies the swarm dispatch handler with the event bus needed to publish its next command."
    acceptance:
      - id: "AC2"
        statement: "AC2: resolving the swarm dispatch handler through ServiceHandlerResolver and dispatching a start request publishes its health-check command with the original run and correlation identities -- falsifier: uv run pytest src/omnimarket/nodes/node_swarm_dispatch_orchestrator/tests/test_handler_swarm_dispatch.py -q in omnimarket"
evidence_requirements:
  - kind: "tests"
    description: "AC1 hosted probe. The log persistence handler tests pass at the head."
    command: "env -u PYTHONPATH uv run pytest tests/unit/nodes/test_node_log_persistence_effect/test_handler_log_persistence_effect.py -q"
  - kind: "tests"
    description: "AC2 hosted probe. Runtime-resolved swarm dispatch publishes its next command."
    command: "env -u PYTHONPATH uv run pytest src/omnimarket/nodes/node_swarm_dispatch_orchestrator/tests/test_handler_swarm_dispatch.py -q"
  - kind: "tests"
    description: "AC2 wire probe. Canonical swarm terminal envelopes reach the replay-safe projection."
    command: "env -u PYTHONPATH uv run pytest tests/test_golden_chain_projection_swarm.py -q"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn14153-ac1-log-persistence-tests"
    description: "AC1 hosted probe. The log persistence handler tests pass at the head."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/nodes/test_node_log_persistence_effect/test_handler_log_persistence_effect.py -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC1"]
  - id: "dod-omn14153-ac2-swarm-runtime-publication"
    description: "AC2 hosted probe. The swarm handler tests include runtime dependency resolution."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest src/omnimarket/nodes/node_swarm_dispatch_orchestrator/tests/test_handler_swarm_dispatch.py -q"
        cwd: "${OMNI_HOME}/omnimarket"
      - check_type: "test_passes"
        check_value: "uv run pytest tests/test_golden_chain_projection_swarm.py -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC2"]
  - id: "dod-omn14153-deploy-swarm-envelope"
    description: "Read the published swarm handler at the checked-out revision and require its typed canonical event envelope. This hosted-runner probe fails on an unreadable revision or the untyped producer. It verifies published source; persistent runtime rollout and subscriber readback remain required before ticket closure."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: |
          bash -o pipefail -c 'curl --fail --silent --show-error --location --max-time 30 "https://raw.githubusercontent.com/OmniNode-ai/omnimarket/$(git rev-parse HEAD)/src/omnimarket/nodes/node_swarm_dispatch_orchestrator/handlers/handler_swarm_dispatch.py" | grep -F "envelope = ModelEventEnvelope[dict[str, Any]]("'
        cwd: "${OMNI_HOME}/omnimarket"
