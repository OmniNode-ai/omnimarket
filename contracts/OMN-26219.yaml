---
schema_version: "1.0.0"
ticket_id: OMN-26219
title: "node_llm_delegation_call_effect declares claude-glm and codex as kind: harness handlers, so 20 real delegations on dev take the harness handler with a cost record each"
summary: "Part A of the harness handler set: the delegation call effect gains a harness backend handler that walks the overlay-declared harness rungs of a task class for the house tenant on the internal surface, judges each answer with the delegation gates, climbs on a rejection and records one cost per attempt. The declaration itself is in the overlays repository (delegation_routing overlay). The live criteria AC4, AC5 and AC6 are read from dev after the merged revision runs and are not bound to a hosted check here."
is_seam_ticket: false
interface_change: true
interfaces_touched:
  - topics
requirements:
  - id: req-omn26219-harness-backends-declared
    statement: "claude-glm and codex are declared kind: harness backends of node_llm_delegation_call_effect through the overlay and the node contract config, with no model name, rung order, class list or host as a literal in code."
    acceptance:
      - id: AC1
        statement: "AC1: claude-glm (glm-5.3-flash first rung, glm-5.3 second rung for code classes) and codex (code classes only, pin-only until measured) are declared as kind: harness backends of node_llm_delegation_call_effect through the overlay and the node contract config, with no model name, rung order, class list or host as a literal in code -- falsifier: grep -rnE \"glm-5|codex-account\" over the node's src directory finds a model name outside tests, or uv run pytest -k harness_backend_declared in omnimarket fails"
  - id: req-omn26219-harness-backend-admission
    statement: "The handler admits a harness rung only for the house tenant on the internal surface and a pin-only rung only to a request that pins that backend."
    acceptance:
      - id: AC2
        statement: "AC2: the reducer resolves these rungs for the house tenant on the internal surface only, and refuses a pin-only request outside its pin, a non-house tenant and a customer surface -- falsifier: uv run pytest -k harness_backend_admission in omnimarket, with one test per refusal, is red on the pre-change code and green on the change"
  - id: req-omn26219-harness-gate-escalation-cost
    statement: "A harness call is judged by the delegation gates, climbs on a rejection and leaves one cost record per attempt."
    acceptance:
      - id: AC3
        statement: "AC3: a harness call is judged by the skill's quality gate, climbs from glm-5.3-flash to glm-5.3 when the gate rejects a code-class answer, and writes one cost record per attempt, so a delegation_events row for it has attempts of 1 or more and a cost record -- falsifier: uv run pytest -k harness_handler_gate_escalation_cost in omnimarket fails, or a recorded harness attempt (fixture from a real dev row) yields no cost row"
evidence_requirements:
  - kind: tests
    description: "Focused tests of the harness backend handler, its admission, its gate, escalation and cost records, and its process and bus seams."
    command: "uv run pytest tests/unit/delegation -q --no-cov -k omn26219"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-omn26219-ac1
    description: "The overlay fixture declares the claude-glm and codex backends and chains as stated, and the node source holds no GLM model name or Codex account name."
    source: manual
    binds_ac: [AC1]
    checks:
      - check_type: test_passes
        check_value: >-
          uv run pytest tests/unit/delegation -q --no-cov -k harness_backend_declared
  - id: dod-omn26219-ac2
    description: "One test per refusal: non-house tenant, customer surface, pin-only outside its pin, a pin outside the backend's classes."
    source: manual
    binds_ac: [AC2]
    checks:
      - check_type: test_passes
        check_value: >-
          uv run pytest tests/unit/delegation -q --no-cov -k harness_backend_admission
  - id: dod-omn26219-ac3
    description: "The gate rejection climbs flash to glm, every attempt leaves a cost record, and a scrubbed dev row of a failed attempt yields one."
    source: manual
    binds_ac: [AC3]
    checks:
      - check_type: test_passes
        check_value: >-
          uv run pytest tests/unit/delegation -q --no-cov -k harness_handler_gate_escalation_cost
  - id: dod-omn26219-deploy-contract
    description: "Hosted deploy check: the harness handler is routed by the node contract and its process seam reads a Claude Code result record."
    source: manual
    checks:
      - check_type: test_passes
        check_value: >-
          uv run pytest tests/unit/delegation -q --no-cov -k 'harness_delegation_is_routed_by_the_contract or harness_process_runner_reads_the_result_record'
  - id: dod-omn26219-integration-proof
    description: "Local Done gate only, so it binds no criterion here: on a lab host the focused harness handler tests run at the pushed head through onex lab-work, the placement the lanes use for a run beyond one file. The live criteria AC4 to AC6 are read from dev after the merged revision runs."
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: >-
          onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-26219 --kind test -- uv run --frozen pytest tests/unit/delegation -q --no-cov -k omn26219
        cwd: .
  - id: dod-omn26219-claude-harness-subscription-tests
    description: "The Claude harness handler runs claude -p on the subscription in a clean temporary directory at the effort of its model family, refuses an API key or auth token in the environment by variable name without launching, and returns the model the harness reported it ran. The tests fail on the base commit, where the backend has no effort, the receipt has no model and an API key passes through."
    source: manual
    binds_ac: [AC3]
    checks:
      - check_type: test_passes
        check_value: >-
          uv run pytest tests/unit/delegation/test_claude_harness_subscription_omn26043.py -q --no-cov -n 0 -p no:randomly
  - id: dod-omn26219-claude-effort-off-wire-model
    description: "The Claude tier effort is held in the harness handler and the backend wire model gains no key, so the pinned consumer's extra=forbid decode still accepts it. The wire-model test fails on the commit that added an effort field to the backend model."
    source: manual
    binds_ac: [AC3]
    checks:
      - check_type: test_passes
        check_value: >-
          uv run pytest tests/unit/delegation/test_claude_harness_subscription_omn26043.py -q --no-cov -n 0 -p no:randomly -k 'wire_model_carries_no_effort_field or each_tier_runs_at_its_effort'
