---
schema_version: "1.0.0"
ticket_id: OMN-26203
title: "Commitments become current-sprint Linear tickets and the fill places lanes from unowned sprint tickets"
summary: >
  A lane-minted ticket is created in the current sprint (project, milestone and due date resolved by date
  from Linear in one create) unless the request declares it not planned this sprint; clear_project and
  repair_project leave a ticket in the current sprint alone; and node_ticket_query answers the fill with the
  open tickets of the current sprint that no live CLAIM holds.
is_seam_ticket: false
interface_change: true
interfaces_touched:
  - public_api
requirements:
  - id: req-omn26203-sprint-default-create
    statement: "node_create_ticket creates a lane-minted ticket with the current sprint's project, milestone and due date resolved by date from Linear, and node_ticket_query lists the sprint's open tickets with no live CLAIM."
    acceptance:
      - id: AC1
        statement: "AC1: a resolved, wired mechanism enforces RULING 2026-11-20T13:52:49Z lane=orchestrator-31d9-swarm, linked to it by a CORRECTION row carrying mechanism=<repo path> -- falsifier: `python3 plugins/omni/skills/queue-status/scripts/ruling_mechanisms.py` no longer lists 2026-11-20T13:52:49Z as unmechanized"
evidence_requirements:
  - kind: tests
    description: "Resolver (inside, boundary, no sprint), create in sprint and not planned, clear_project and repair_project leaving the sprint alone, and the unowned read over a ledger fixture."
    command: uv run pytest tests/nodes/node_create_ticket/test_sprint_resolver.py tests/nodes/node_create_ticket/test_sprint_default_create.py tests/nodes/node_ticket_query/test_unowned_sprint_tickets.py -q --no-cov
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-omn26203-sprint-default
    description: "The resolver, the create default, the clear and repair guards and the unowned sprint read pass their focused tests."
    source: manual
    binds_ac: [AC1]
    checks:
      - check_type: test_passes
        check_value: >-
          uv run pytest tests/nodes/node_create_ticket/test_sprint_resolver.py tests/nodes/node_create_ticket/test_sprint_default_create.py tests/nodes/node_ticket_query/test_unowned_sprint_tickets.py -q --no-cov
  - id: dod-omn26203-integration-proof
    description: "Run the focused sprint resolver, create and unowned read tests on a lab host at the pushed head; the local Done gate runs this unbound check."
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-26203 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_create_ticket/test_sprint_resolver.py tests/nodes/node_create_ticket/test_sprint_default_create.py tests/nodes/node_ticket_query/test_unowned_sprint_tickets.py -q --no-cov
        cwd: .
