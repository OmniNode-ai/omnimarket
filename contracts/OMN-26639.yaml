schema_version: 1.0.0
ticket_id: OMN-26639
title: Local-model code tasks carry an exemplar pack and a skeleton to fill, with both models measured with and without
summary: The nine code tasks behind the earlier Inkling and Qwen code readings could not be trusted, because seven base trees already held the merged fix and three graders could not pass in either arm. This change rebuilds them in the committed code eval suite (the document the suite census node loads by name). Each kept task is a row whose base commit is the first parent of its real fix commit and whose bound check was run twice on that base (failing) and twice on the fix (passing); a task with no merged fix commit is dropped, and a kept task whose repository name the public-repo hygiene gate refuses is counted, each as a pre-control exclusion. The table of Inkling and Qwen readings with and without a pack, three runs each, is a later model run on this set and is not part of this change.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn26639-taskset-rebuilt
  statement: The suite document declares the kept tasks on their real fix commits and parents, and states why each dropped task is dropped.
  acceptance:
  - id: AC1
    statement: 'AC1: the lane report lists every earlier number from the nine-task set as invalid with its location -- falsifier: grep -l "6 of 22" across the report directories finds a file the report does not name'
  - id: AC2
    statement: 'AC2: each kept task shows two recorded grader runs on the base (failing) and two on the real fix (passing), and the suite rows carry the fix commit and its parent -- falsifier: a kept task with fewer than four recorded runs, a base run that passes, or a suite row whose base is not the fix commit''s first parent'
  - id: AC3
    statement: 'AC3: each dropped task has a stated reason -- falsifier: a task of the nine neither kept nor dropped'
evidence_requirements:
- kind: tests
  description: The committed suite document is a valid census request, its census matches an independent recount, and it holds the six kept rows and the exclusions.
  command: env -u PYTHONPATH uv run --frozen pytest tests/nodes/node_code_eval_suite_census_compute/test_taskset_1540.py tests/nodes/node_code_eval_suite_census_compute/test_committed_suite.py tests/nodes/node_code_eval_suite_census_compute/test_packaged_suite.py -q --no-cov -n 0 -p no:randomly
- kind: manual
  description: 'Deploy validation command for the caller-contract deploy gate: the committed suite document read at the checkout commit. It starts nothing and touches no running lane.'
  command: 'deploy: git grep -n taskset_1540_no_merged_fix_commit -- src/omnimarket/configs/code_eval_suite.v1.json'
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn26639-ac1-invalid-numbers-named
  description: The lane report section 1 names the h051 codetool report, the exemplar2-1400 report and the ledger rows that cite the numbers, each marked invalid. It reads from the lab host that holds the report, so only the local Done gate runs it.
  source: manual
  execution_scope: local_done_gate
  binds_ac:
  - AC1
  checks:
  - check_type: command
    check_value: bash -o pipefail -c 'f=$(ls "${OMNI_HOME:?}"/.claude_scratch/reports/taskset-1540-*.md | head -n 1); grep -q "codetool-0910-2026-11-24T1012Z.md" "$f" && grep -q "exemplar2-1400-2026-11-24T1448Z.md" "$f" && grep -c "INVALID" "$f" | grep -qv "^0$"'
    cwd: .
- id: dod-omn26639-ac2-kept-rows-and-runs
  description: The suite document holds the six kept rows, each on its real fix commit with the fix commit's first parent as base, and the lane report holds twenty-eight recorded grader runs (seven kept tasks, two arms, two runs; the seventh kept task is counted as an exclusion in the document). The hosted check reads the document; the report is read by the local Done gate.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: env -u PYTHONPATH uv run --frozen pytest tests/nodes/node_code_eval_suite_census_compute/test_taskset_1540.py -q --no-cov -n 0 -p no:randomly -k sit_on_their_fix_commit
    cwd: .
- id: dod-omn26639-ac2-runs-recorded
  description: The lane report records every grader run, two per arm per kept task, and no base run exited 0. Reads the report on the lab host, so only the local Done gate runs it.
  source: manual
  execution_scope: local_done_gate
  binds_ac:
  - AC2
  checks:
  - check_type: command
    check_value: bash -o pipefail -c 'f=$(ls "${OMNI_HOME:?}"/.claude_scratch/reports/taskset-1540-*.md | head -n 1); test "$(grep -c -E "^\| r[0-9]-code-[01] \| (base|fix) \| [12] \| [0-9]+ \|" "$f")" = 28 && ! grep -E "^\| r[0-9]-code-[01] \| base \| [12] \| 0 \|" "$f"'
    cwd: .
- id: dod-omn26639-ac3-dropped-have-reason
  description: The two dropped tasks are one counted pre-control exclusion in the suite document, and the report states the reason for each.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: env -u PYTHONPATH uv run --frozen pytest tests/nodes/node_code_eval_suite_census_compute/test_taskset_1540.py -q --no-cov -n 0 -p no:randomly -k dropped_tasks_are_one_counted_exclusion
    cwd: .
- id: dod-omn26639-integration-proof
  description: Hosted CI cannot reach a lab host, so only the local Done gate runs this unbound check. It runs the suite document's focused tests at the sha on a lab host, where the census handler reads the committed suite the way the evaluation node loads it.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-26639 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_code_eval_suite_census_compute/test_taskset_1540.py tests/nodes/node_code_eval_suite_census_compute/test_committed_suite.py -q --no-cov -n 0 -p no:randomly
    cwd: .
