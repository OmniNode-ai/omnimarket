---
schema_version: "1.0.0"
ticket_id: "OMN-19599"
title: "The delegate-skill request declares output files and the orchestrator returns a manifest on the terminal"
summary: "The delegate-skill request declares declared_outputs and its terminal declares output_manifest and output_files; the orchestrator derives the response contract from the declaration and stamps the accepted files and their sha256 manifest on a completed terminal. The projection row per file, the CLI, customer, dashboard, test-loop and patch halves of the epic are separate children and are not claimed here."
is_seam_ticket: false
interface_change: true
interfaces_touched:
  - "ModelDelegateSkillRequest.declared_outputs"
  - "ModelDelegateSkillResponse.output_manifest"
  - "ModelDelegateSkillResponse.output_files"
requirements:
  - id: "req-declared-outputs-return-a-manifest-on-the-terminal"
    statement: "A delegation that declares output files gets them back as files with a manifest on its completed terminal. The criteria below are the two this change delivers, labelled AC1 and AC2 so each binding item can claim one through binds_ac."
    acceptance:
      - id: "AC1"
        statement: "AC1: a delegate-skill request that declares output files yields, on its completed terminal, a manifest entry per accepted file whose sha256 equals the sha256 of the returned bytes, a named refusal for a declared file the reply omits, and no manifest on a failed terminal or on a request that declared nothing -- falsifier: uv run pytest tests/unit/nodes/node_delegate_skill_orchestrator/test_declared_outputs_omn19599.py -q in omnimarket"
      - id: "AC2"
        statement: "AC2: the request and terminal models declare declared_outputs, output_manifest and output_files as optional fields that are absent from the wire when unset, and the wire compatibility gate accepts them against the last released consumer -- falsifier: uv run pytest tests/unit/delegation/test_omn19600_output_files_consumer_first.py -q in omnimarket"
evidence_requirements:
  - kind: "tests"
    description: "AC1 hosted probe. The orchestrator stamps the manifest and files on a completed terminal."
    command: "env -u PYTHONPATH uv run pytest tests/unit/nodes/node_delegate_skill_orchestrator/test_declared_outputs_omn19599.py -q"
  - kind: "tests"
    description: "AC2 hosted probe. The new wire keys are declared, optional and omitted when unset."
    command: "env -u PYTHONPATH uv run pytest tests/unit/delegation/test_omn19600_output_files_consumer_first.py -q"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn19599-ac1-terminal-carries-manifest"
    description: "AC1 hosted probe. The real delegate-skill handler runs a request that declares two output files against a dispatch port that answers with the files object; the completed terminal carries a manifest entry per file whose sha256 equals the returned bytes, a missing file is a named refusal, and a failed terminal carries no manifest."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/nodes/node_delegate_skill_orchestrator/test_declared_outputs_omn19599.py -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC1"]
  - id: "dod-omn19599-ac2-wire-keys-declared"
    description: "AC2 hosted probe. The request and terminal models declare the three keys, decode them, and omit them from the wire when unset."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/delegation/test_omn19600_output_files_consumer_first.py -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC2"]
