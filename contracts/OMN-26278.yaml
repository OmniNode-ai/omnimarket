schema_version: 1.0.0
ticket_id: OMN-26278
title: The narrowed-run bound and shard mapping in policy come from the replay and measured setup time, not from a stale 7,160 second comment
summary: 'The selector policy carried target_shard_seconds 360 under a comment that put the full suite at about 7160 recorded seconds; the durations file records 11,419. policy.yaml now holds
  target_shard_seconds 571 (the recorded total over the 20 planned shards), narrowed_bound_seconds 1800 (provisional until the operator answers the narrowed-run size question), untimed_file_seconds
  (the durations file p90) and record_tolerance_ratio, and a policy test reads the durations file and fails when target_shard_seconds * full_split_count differs from the recorded total by more than the
  tolerance. The shard mapping ceil(selected_seconds / target_shard_seconds), the cap and the bound live in the selector handler, a test file with no duration entry costs untimed_file_seconds, and a new
  operation calculate_policy_bound derives the shard count, the share of replayed merges over each candidate bound, the test-seconds each saves, the full-run crossover and the per-merge runner-cost columns
  from policy.yaml, the durations file and the replay inputs, and lists every file without an entry and every entry without a file by path. Not in this change: the replay counts under the root conftest cut
  (17 of 53 over 1,800 s, 12 of 53 over 5,400 s) and the measured per-shard setup seconds, which wait for the replay baseline receipt and the file-level closure; the operator answer on the bound.'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn26278-policy-bound
  statement: The narrowed-run bound, the shard mapping and the untimed-file cost are settings of policy.yaml checked against the durations file, and one calculation derives their consequences from the replay inputs.
  acceptance:
  - id: AC1
    statement: 'AC1: the policy test reads the durations file and fails when `target_shard_seconds * full_split_count` differs from the recorded suite total by more than the declared tolerance -- falsifier: `uv run pytest tests/nodes/node_test_selection_selector_compute -q --no-cov -k policy_bound`'
  - id: AC2
    statement: 'AC2: the share of merges over each candidate bound equals the replay (under D1 cut 17 of 53 over 1,800 s and 12 of 53 over 5,400 s, rechecked against the receipt) -- falsifier: replay at each candidate bound; a different count fails'
  - id: AC3
    statement: 'AC3: the shard count and full-run crossover derive from policy.yaml and the replay inputs by one runnable calculation, and a file with no duration is costed at `untimed_file_seconds` -- falsifier: delete a duration entry in a fixture copy and the selected seconds must rise by exactly `untimed_file_seconds`'
  - id: AC4
    statement: 'AC4: a narrowed run estimated runner-minutes are below the full run for every merge it narrows -- falsifier: the replay per-merge cost columns; any narrowed merge costing more fails the test'
evidence_requirements:
- kind: tests
  description: The policy-bound tests, the selector tests and the golden and error chain tests pass at the pushed head.
  command: uv run --frozen pytest tests/nodes/node_test_selection_selector_compute tests/test_golden_chain_test_selection_policy_bound.py tests/test_golden_chain_test_selection_selector_compute.py tests/unit/scripts/test_detect_test_paths.py -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn26278-ac1
  description: 'AC1, as measured: the recorded suite total is 11,419.18 seconds over 6,034 entries, so the old 360 * 20 = 7,200 was 37% short and the new test failed on it (red run recorded in the report). target_shard_seconds is now 571 (11,420 over 20 shards); the test holds the product within record_tolerance_ratio 0.05 of the file total, and a doubled-total control and an empty-record control both fail the check.'
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_test_selection_selector_compute/test_policy_bound.py -q --no-cov -n 0 -p no:randomly -k "policy_bound_target_times or policy_bound_tolerance or policy_bound_untimed_file_seconds or policy_bound_the_provisional"
    cwd: .
- id: dod-omn26278-ac2
  description: 'AC2, partly met and said so: the calculation counts merges over each candidate bound (policy 1,800 s, comparison 1,800 and 5,400 s, and the crossover once setup is measured) and the fixture tests pin those counts against merges built from real durations. The counts 17 of 53 and 12 of 53 are not rechecked: the merged replay baseline receipt (config/test_selection_replay_receipt.json) counts 60 merges, 10 narrowed and 50 full-suite under its frozen stage 0 policy and carries neither figure, and the file-level closure that produces the 53 is not built; the counts wait for that closure and are not asserted here.'
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_test_selection_selector_compute/test_policy_bound.py -q --no-cov -n 0 -p no:randomly -k "calculation_derives_counts"
    cwd: .
- id: dod-omn26278-ac3
  description: 'AC3: shard count is ceil(selected_seconds / target_shard_seconds) capped at max_narrowed_shards and bounded by narrowed_bound_seconds; a deleted duration entry costs untimed_file_seconds (selected seconds become the rest plus exactly untimed_file_seconds), and a listed file with no entry adds exactly untimed_file_seconds. One calculation, HandlerPolicyBound, derives the shard count and the full-run crossover from policy.yaml and the replay inputs, checked against a brute-force search in the test.'
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_test_selection_selector_compute/test_policy_bound.py -q --no-cov -n 0 -p no:randomly -k "shard_count or deleted_entry or listed_file or explicit_file or crossover"
    cwd: .
- id: dod-omn26278-ac4
  description: 'AC4, partly met and said so: the per-merge cost columns exist (narrowed and full runner seconds from a measured per-shard setup and collection gate) and a narrowed merge whose cost is not below the full run is named, with a control that names one. The measured setup seconds are not available: the replay baseline receipt records them as unavailable, so the columns stay empty and the check reports cost_columns_measured false until a measurement is supplied. The replay-wide assertion waits for that measurement and is not asserted here.'
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_test_selection_selector_compute/test_policy_bound.py -q --no-cov -n 0 -p no:randomly -k "narrowed_merge or full_suite_merge or unknown_until_setup"
    cwd: .
- id: dod-omn26278-node-chain
  description: the new operation is routed in contract.yaml and its golden and error chain events pass over the in-memory bus
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/test_golden_chain_test_selection_policy_bound.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn26278-integration-proof
  description: the selector tests run on a lab host at the pushed head; hosted CI cannot reach the lab, so only the local Done gate runs this unbound check
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-26278 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_test_selection_selector_compute -q --no-cov -k policy_bound
    cwd: .
