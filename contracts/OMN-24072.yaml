schema_version: "1.0.0"
ticket_id: OMN-24072
title: "Lane trace read: show each call of one lane with its full output and typed outcome"
summary: "A pure compute node prints, for one lane, the query that reads its completed calls with their stored output, and from the rows that query returns each call with its full output, label (ok, failed, refused, timeout), exit code and lane, ending in an outcomes line."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn24072-lane-trace
    statement: One named lane's calls print with full stored output, label, exit code and lane, and a count line of ok, failed, refused and timeout.
    acceptance:
      - id: AC1
        statement: 'AC1: the lane trace read joins one lane''s completed calls to their stored full output and prints each call with its label, its exit code and its lane, ending with a count line of ok, failed, refused and timeout -- falsifier: pytest tests/unit/nodes/node_hook_lane_trace_compute/test_hook_events_lane_trace.py -q '
      - id: AC2
        statement: 'AC2: a call that printed a refusal and ended with exit code 0 is counted refused and not ok, and the read refuses a lane name or time bound that is not a plain token or UTC stamp -- falsifier: pytest tests/unit/nodes/node_hook_lane_trace_compute/test_hook_events_lane_trace.py -q -k "refusal_with_exit_zero or refuses"'
      - id: AC3
        statement: 'AC3: integrated: on the running lab, the lane trace of one named lane prints its calls with full output and labels read from the dev projection, and its outcomes line counts at least one call -- falsifier: the read of that lane prints an outcomes line of zero calls while the lane''s events hold completed calls'
evidence_requirements:
  - kind: "tests"
    description: "Lane trace tests: golden trace, refusal with exit code 0, failing control (empty rules read it ok), no-output calls, refused inputs, command line chain"
    command: "uv run pytest tests/unit/nodes/node_hook_lane_trace_compute -q --no-cov"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-omn24072-ac1
    description: "AC1: the golden trace test passes at the head (34 passed in the file on host h051) and fails at the merge base, where the node does not exist."
    source: manual
    binds_ac: [AC1]
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/unit/nodes/node_hook_lane_trace_compute/test_hook_events_lane_trace.py -q -p no:randomly --no-cov"
        cwd: "."
  - id: dod-omn24072-ac2
    description: "AC2: the refusal-with-exit-zero, failing-control and refuses tests pass at the head and fail at the merge base."
    source: manual
    binds_ac: [AC2]
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/unit/nodes/node_hook_lane_trace_compute/test_hook_events_lane_trace.py -k 'refusal_with_exit_zero or refuses' -q -p no:randomly --no-cov"
        cwd: "."
  - id: dod-omn24072-ac3
    description: "hosted proxy for AC3: the command line chain tests pass here; the live read of lane prove-dev-6803 on h051 (query through the node, run over ssh on the dev projection, rows through the node) printed 40 calls with full output and ended outcomes calls=40 ok=20 failed=0 refused=3 timeout=0 no-output=17, the three refused calls with exit=0; posted as a pull request comment naming the head."
    source: manual
    binds_ac: [AC3]
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/unit/nodes/node_hook_lane_trace_compute/test_hook_events_lane_trace.py -k 'command_line' -q -p no:randomly --no-cov"
        cwd: "."
  - id: dod-omn24072-deploy-boot-resolvable
    description: "Deploy probe the hosted runner can run: at the checked-out commit the lane trace handler builds with no required constructor argument, so the runtime boots it; the default is absent at the merge base, where the constructor requires outcome and the runtime quarantines the handler, so the probe fails there."
    source: manual
    checks:
      - check_type: command
        check_value: "grep -F 'outcome: HandlerHookToolOutcome | None = None' src/omnimarket/nodes/node_hook_lane_trace_compute/handlers/handler_hook_lane_trace.py"
        cwd: "."
  - id: dod-omn24072-integration-proof
    description: "The pushed head ran the lane trace tests on a lab host and exited 0. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check."
    source: manual
    execution_scope: "local_done_gate"
    checks:
      - check_type: command
        check_value: uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24072 -- uv run --frozen pytest tests/unit/nodes/node_hook_lane_trace_compute -q -p no:randomly --no-cov
        cwd: "."
