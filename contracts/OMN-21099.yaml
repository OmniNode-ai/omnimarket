---
schema_version: "1.0.0"
ticket_id: "OMN-21099"
title: "Client-call wire fields and identity for the delegate-skill command"
summary: >-
  OMN-21099 is task TB.4 of the context and delegation adapter plan, whose client path depends on
  TB.3 in omnimarket. The TB.3 client_call wire model, the step-1 request decoder and the
  admission-decided event model are on the base already (OMN-21098). This change adds the identity
  derivations of the plan's section 7.2 on top of them: request_fingerprint, the client-call
  correlation id derived from the key and the fingerprint under a fixed namespace, and the client
  mode ordering observe, selective, required with the lesser of two modes. The client-call claim
  table, the admission topic publish, the orchestrator handler changes, the step-2 field
  declaration and the omnibase_infra and omniclaude halves of TB.4 are not in this change.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-client-call-wire-identity"
    statement: |-
      A client call's request fingerprint and correlation id are derived deterministically, and its effective mode is the lesser of two ordered modes.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: the client modes are ordered observe < selective < required and the derived correlation id uses the documented namespace -- falsifier: uv run pytest tests/unit/models/delegation/wire/test_client_call_wire_omn21099.py -k "modes_are_ordered or namespace"
      - id: "AC2"
        statement: |-
          AC2: the fingerprint excludes only correlation, timestamps and trace ids, and the correlation id is uuid5 of key and fingerprint so a changed request under the same key gets a different id -- falsifier: uv run pytest tests/unit/models/delegation/wire/test_client_call_wire_omn21099.py -k "fingerprint or correlation"
      - id: "AC3"
        statement: |-
          AC3: an admission-decided event built from the derived values carries no prompt text, and the effective mode is the lesser of the client maximum and the cohort mode -- falsifier: uv run pytest tests/unit/models/delegation/wire/test_client_call_wire_omn21099.py -k "admission_decided or effective_mode"
  - id: "req-session-barrier-producer"
    statement: |-
      The hook adapter journals one session barrier per capture stream before it publishes the compaction command, and the command carries that barrier's id, so the compaction orchestrator's barrier wait has a barrier to test.
    acceptance:
      - id: "DoD1"
        statement: |-
          DoD1: the adapter journals a content.captured barrier record per enabled capture stream, with the stream's producer high-water, before publishing, and the command's barrier_id equals the journalled one -- falsifier: uv run pytest tests/nodes/node_claude_code_hook_adapter_effect/test_session_barrier_producer_omn21099.py -k "journals or barrier_id or disabled"
      - id: "DoD2"
        statement: |-
          DoD2: through the real compaction orchestrator and barrier wait, a command built without the producer falls back source_incomplete and a command built with it installs -- falsifier: uv run pytest tests/nodes/node_claude_code_hook_adapter_effect/test_session_barrier_producer_omn21099.py -k "requires_the_produced_barrier"
  - id: "req-pack-build-fold-once"
    statement: |-
      A compaction pack build folds each work-ledger row at most once per process: the ledger and work-state sources share one fold memo, keyed by row id and checked against the row text, that keeps only the rows of the latest read.
    acceptance:
      - id: "AC8"
        statement: |-
          AC8: unchanged rows are folded once across passes, a changed row is folded again, rows absent from the latest pass are dropped, a fold refusal is memoized, and the operator_rulings, open_work and orchestration_state tiers answer exactly as with separate memos while the shared memo folds each row once -- falsifier: uv run pytest tests/unit/nodes/node_context_source_ledger_effect/test_ledger_fold_memo_omn21099.py
  - id: "req-session-source-projections"
    statement: |-
      Live mode of the session context source reads the bus-resident projections the plan names (omninode_internal.session_content and omninode_internal.work_ledger_rows), not a transcript file or a markdown ledger file, so the compaction pack builder on the dev runtime has operator words to carry.
    acceptance:
      - id: "AC9"
        statement: |-
          AC9: with ONEX_SESSION_TRANSCRIPT_ROOT and ONEX_LEDGER_PATH unset, the compaction pack built through the context pack orchestrator carries an operator prompt read from session_content rows, a ruling read from work_ledger_rows records the words it quotes, an unbound tenant is denied and a failed projection read is unavailable -- falsifier: uv run pytest tests/nodes/node_context_pack_orchestrator/test_session_source_projection_pack.py tests/nodes/node_session_context_sources_effect/test_session_context_sources.py -k "projection or live or contract_binding or postgres_reader"
  - id: "req-compaction-barrier-read-adapters"
    statement: |-
      The compaction orchestrator's production binding reads the session barrier through explicit read adapters from the package's projection read boundary, so a compaction on the dev runtime reaches the pack build instead of falling back build_error.
    acceptance:
      - id: "DoD3"
        statement: |-
          DoD3: bind_compaction_ports with no injected probe source reads a projected barrier through connect_read_only and the boundary's SQL composer and the barrier wait ends met -- falsifier: uv run pytest tests/nodes/node_context_compaction_orchestrator/test_compaction_runtime_binding.py
  - id: "req-client-receipt-verdict-bridge"
    statement: |-
      The receipt bridge verifies correlated core envelopes, admission and terminal identity and the quality gate before applying the existing section 7.2 client verdict table. This is the AC1 receipt interpretation contribution; transport, journal registration and live cohort qualification remain outside this increment.
    acceptance:
      - id: "DoD4"
        statement: |-
          DoD4: the direct handler, typed runtime dispatcher and in-memory runtime binding return the same hook shape for accepted, rejected, unknown, unavailable and conflicting receipt exchanges; an answer requires matching outer correlation, admission identity, terminal identity, effective mode, task type and quality gate.
      - id: "DoD5"
        statement: |-
          DoD5: allowlisted tasks come from the installed overlay and the admission classification, UUID objects survive the bridge, missing or malformed configuration refuses, and receipt topics are loaded from the contract or an injected policy.
evidence_requirements:
  - kind: "tests"
    description: "AC1 to AC3: the client-call identity derivation tests and the step-1 wire tests."
    command: "uv run pytest tests/unit/models/delegation/wire/test_client_call_wire_omn21099.py tests/unit/models/delegation/wire/test_client_call_wire_step1.py -q -n 0 -p no:randomly --no-cov"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn21099-ac1-mode-order"
    description: "AC1: client modes are ordered and the correlation namespace is the documented value."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/models/delegation/wire/test_client_call_wire_omn21099.py -k \"modes_are_ordered or namespace\" -q -n 0 -p no:randomly --no-cov"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC1"]
  - id: "dod-omn21099-ac2-identity"
    description: "AC2: fingerprint and correlation id derivations."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/models/delegation/wire/test_client_call_wire_omn21099.py -k \"fingerprint or correlation\" -q -n 0 -p no:randomly --no-cov"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC2"]
  - id: "dod-omn21099-ac3-admission-event"
    description: "AC3: the admission event model holds no prompt text and the effective mode is the lesser of two modes."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/models/delegation/wire/test_client_call_wire_omn21099.py -k \"admission_decided or effective_mode\" -q -n 0 -p no:randomly --no-cov"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC3"]
  - id: "dod-omn21099-deploy-identity-derivation"
    description: "Deploy probe: read the client-call wire module at the checked-out commit from GitHub and require the correlation id derivation. The base has no such function and fails this probe. The command uses GitHub and the hosted runner checkout without a lab path."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: >-
          gh api "repos/OmniNode-ai/omnimarket/contents/src/omnimarket/models/delegation/wire/model_delegate_skill_client_call.py?ref=$(git rev-parse HEAD)" --jq .content | base64 -d | grep -qE '^def client_call_correlation_id\('
  - id: "dod-omn21099-barrier-producer"
    description: "DoD1: the adapter journals the session barrier before publishing and carries its id."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_claude_code_hook_adapter_effect/test_session_barrier_producer_omn21099.py -k \"journals or barrier_id or disabled\" -q -n 0 -p no:randomly --no-cov"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["DoD1"]
  - id: "dod-omn21099-barrier-orchestrator"
    description: "DoD2: source_incomplete without the barrier, install with it, through the real orchestrator."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_claude_code_hook_adapter_effect/test_session_barrier_producer_omn21099.py -k \"requires_the_produced_barrier\" -q -n 0 -p no:randomly --no-cov"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["DoD2"]
  - id: "dod-omn21099-deploy-barrier-binding"
    description: "Deploy probe: read the adapter contract at the checked-out commit from GitHub and require the compaction binding to draw barrier_id from the session barrier source. The base draws it from the hook input and fails this probe. The command uses GitHub and the hosted runner checkout without a lab path."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: >-
          gh api "repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_claude_code_hook_adapter_effect/contract.yaml?ref=$(git rev-parse HEAD)" --jq .content | base64 -d | grep -qF '{name: barrier_id, source: "@session_barrier"}'
  - id: "dod-omn21099-ledger-fold-once"
    description: "AC8: the shared work-ledger fold memo and three-tier parity."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/nodes/node_context_source_ledger_effect/test_ledger_fold_memo_omn21099.py -q -n 0 -p no:randomly --no-cov"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC8"]
  - id: "dod-omn21099-deploy-ledger-fold-memo"
    description: "Deploy probe: read the shared work-ledger fold module at the checked-out commit from GitHub and require the fold memo class. The base has no such class and fails this probe. The command uses GitHub and the hosted runner checkout without a lab path."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: >-
          gh api "repos/OmniNode-ai/omnimarket/contents/src/omnimarket/handlers/work_ledger_fold.py?ref=$(git rev-parse HEAD)" --jq .content | base64 -d | grep -E '^class WorkLedgerFoldMemo\b' > /dev/null
  - id: "dod-omn21099-session-source-projections"
    description: "AC9: the session source's live mode reads session_content and work_ledger_rows, and the compaction pack is built from them with no transcript or ledger file."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_context_pack_orchestrator/test_session_source_projection_pack.py tests/nodes/node_session_context_sources_effect/test_session_context_sources.py -k \"projection or live or contract_binding or postgres_reader\" -q -n 0 -p no:randomly --no-cov"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC9"]
  - id: "dod-omn21099-deploy-session-source-projections"
    description: "Deploy probe: read the session context source contract at the checked-out commit from GitHub and require its live source to name the session_content projection. The base names a transcript root instead and fails this probe. The command uses GitHub and the hosted runner checkout without a lab path."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: >-
          gh api "repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_session_context_sources_effect/contract.yaml?ref=$(git rev-parse HEAD)" --jq .content | base64 -d | grep -qF 'content_relation: omninode_internal.session_content'
  - id: "dod-omn21099-barrier-read-adapters"
    description: "DoD3: the default compaction binding wires the barrier probe's read adapters; the base raises 'session barrier requires runtime-injected read adapters'."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_context_compaction_orchestrator/test_compaction_runtime_binding.py -q -n 0 -p no:randomly --no-cov"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["DoD3"]
  - id: "dod-omn21099-deploy-barrier-read-adapters"
    description: "Deploy probe: read the compaction runtime binding at the checked-out commit from GitHub and require the default probe source to pass connect_read_only. The base passes no adapters and fails this probe. The command uses GitHub and the hosted runner checkout without a lab path."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: >-
          gh api "repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_context_compaction_orchestrator/handlers/compaction_runtime_binding.py?ref=$(git rev-parse HEAD)" --jq .content | base64 -d | grep -qF 'connect=connect_read_only,'
  - id: "dod-omn21099-client-receipt-verdict"
    description: "DoD4 and DoD5: the same receipt decision fixtures run through the handler, typed runtime dispatcher and in-memory runtime. Covers unrelated and forged replies, malformed booleans, mismatched identities, duplicates, conflicts and missing configuration; this does not claim the entire TB.4 child is complete."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_delegation_receipt_verdict_compute/test_golden_chain_receipt_verdict.py tests/nodes/node_delegation_client_verdict_compute/test_delegation_client_verdict_table.py tests/nodes/node_delegation_client_verdict_compute/test_golden_chain_delegation_client_verdict_compute.py -q -n 0 --no-cov --refuse-skips"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["DoD4", "DoD5"]
  - id: "dod-omn21099-deploy-receipt-verdict"
    description: "Hosted-runner deploy probe executes the packaged receipt node through RuntimeLocal and the in-memory bus. It needs only the checkout, a temporary overlay and frozen dependencies; the base fails because the node does not exist. No host, service or credential is used."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: "uv run --frozen pytest tests/nodes/node_delegation_receipt_verdict_compute -q -n 0 --no-cov --refuse-skips -k 'receipt_decisions and inmemory'"
        cwd: "${OMNI_HOME}/omnimarket"
