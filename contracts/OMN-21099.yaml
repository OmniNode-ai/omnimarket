---
schema_version: "1.0.0"
ticket_id: "OMN-21099"
title: "Client-call wire fields and identity for the delegate-skill command"
summary: >-
  OMN-21099 is task TB.4 of the context and delegation adapter plan, whose client path depends on
  TB.3 being released in omnimarket. The request wire field, the identity derivation and the
  admission event model of TB.3 are not on the landing branch, so this change carries them first.
  It adds the optional client_call field on ModelDelegateSkillRequest (declared in the
  orchestrator contract inputs), the client mode enum ordered observe, selective, required, the
  client_call_key, request_fingerprint and correlation id derivations of the plan's section 7.2,
  and the model of the admission-decided event, which holds ids, hashes, the verdict and the
  effective mode and no prompt text. The client-call claim table, the admission topic
  registration, the orchestrator handler changes and the omnibase_infra and omniclaude halves of
  TB.4 are not in this change.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-client-call-wire-identity"
    statement: |-
      A delegate-skill command can carry a client-call identity whose key, fingerprint and correlation id are derived deterministically, and a request without it is unchanged.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: a request without client_call serializes and validates as before, and the orchestrator contract inputs declare client_call -- falsifier: uv run pytest tests/unit/models/delegation/wire/test_client_call_wire_omn21099.py -k request_without_client_call and tests/unit/nodes/node_delegate_skill_orchestrator/test_contract.py -k inputs_mapping
      - id: "AC2"
        statement: |-
          AC2: client_call_key is sha256 of claude-code:session_id:tool_use_id, the fingerprint excludes only correlation, timestamps and trace ids, and the correlation id is uuid5 of key and fingerprint so a changed request under the same key gets a different id -- falsifier: uv run pytest tests/unit/models/delegation/wire/test_client_call_wire_omn21099.py -k "key or fingerprint or correlation"
      - id: "AC3"
        statement: |-
          AC3: the admission-decided event model carries no prompt text and refuses undeclared keys, and the effective mode is the lesser of the client maximum and the cohort mode -- falsifier: uv run pytest tests/unit/models/delegation/wire/test_client_call_wire_omn21099.py -k "admission_decided or effective_mode or modes_are_ordered"
evidence_requirements:
  - kind: "tests"
    description: "AC1 to AC3: the client-call wire and identity tests and the orchestrator contract inputs test."
    command: "uv run pytest tests/unit/models/delegation/wire/test_client_call_wire_omn21099.py tests/unit/nodes/node_delegate_skill_orchestrator/test_contract.py -q -n 0 -p no:randomly --no-cov"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn21099-ac1-unchanged-request"
    description: "AC1: a request without client_call is unchanged and the contract inputs match the request fields."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/models/delegation/wire/test_client_call_wire_omn21099.py -k request_without_client_call -q -n 0 -p no:randomly --no-cov"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC1"]
  - id: "dod-omn21099-ac2-identity"
    description: "AC2: key, fingerprint and correlation id derivations."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/models/delegation/wire/test_client_call_wire_omn21099.py -k \"key or fingerprint or correlation\" -q -n 0 -p no:randomly --no-cov"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC2"]
  - id: "dod-omn21099-ac3-admission-event"
    description: "AC3: the admission event model holds no prompt text and the effective mode is the lesser of two modes."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/models/delegation/wire/test_client_call_wire_omn21099.py -k \"admission_decided or effective_mode or modes_are_ordered\" -q -n 0 -p no:randomly --no-cov"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC3"]
  - id: "dod-omn21099-deploy-contract-input"
    description: "Deploy probe: read the orchestrator contract.yaml at the checked-out commit from GitHub and require the client_call input. The base has no such input and fails this probe. The command uses GitHub and the hosted runner checkout without a lab path."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: >-
          gh api "repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_delegate_skill_orchestrator/contract.yaml?ref=$(git rev-parse HEAD)" --jq .content | base64 -d | grep -qE '^  client_call:$'
