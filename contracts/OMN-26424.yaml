schema_version: 1.0.0
ticket_id: OMN-26424
title: Every setting a lane, host, CI job or image build reads is declared in overlays, and a check fails on any undeclared read
summary: Adds node_undeclared_read_check_compute (a pure check over a unified diff and the overlay documents), a CI job and a pre-commit hook that run it, so a change that adds a read of a setting that
  no overlay declares is refused. The declarations themselves are in the overlays pull request of the same ticket.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn26424-declared-settings
  statement: Every setting a lane, host, CI job or image build reads is declared in an overlay, and a change that adds an undeclared read is refused.
  acceptance:
  - id: AC1
    statement: 'AC1: The work-ledger reader list and the reader Python path on the Mac read from a declared overlay value, not a hand-set one -- falsifier: uv run pytest tests/test_declared_reader_settings.py
      -q in the repository that owns the overlay'
  - id: AC2
    statement: 'AC2: h105 carries a reader overlay and the PR duplicate guard reads through it on h105 -- falsifier: uv run pytest tests/test_pr_duplicate_guard_reader.py -q, plus a read of the declared
      reader value on h105'
  - id: AC3
    statement: 'AC3: h202''s lane slot cap is declared in the overlays host table and is computed from measured capacity, not 0 -- falsifier: uv run pytest tests/test_host_table_slot_cap.py -q against the
      host table and the measured series'
  - id: AC4
    statement: 'AC4: The omnimarket ENABLE_SMART_TESTS flag is read by CI from the declared overlay value at the name and scope CI reads -- falsifier: uv run pytest tests/test_smart_tests_flag_declared.py
      -q in omnimarket'
  - id: AC5
    statement: 'AC5: The image-time manifest reads PREBUILT_ACTIVE_RUNTIME_PACKAGES from a declared overlay value and is built non-empty -- falsifier: uv run pytest tests/test_image_manifest_packages.py
      -q, plus a listing of the built manifest packages'
  - id: AC6
    statement: 'AC6: The stability broker SASL setting is declared in overlays and the stability broker reads it rolled -- falsifier: uv run pytest tests/test_stability_broker_sasl_declared.py -q, plus
      a live read of the broker setting'
  - id: AC7
    statement: 'AC7: A required CI check refuses any new read of a setting that no overlay declares -- falsifier: uv run pytest tests/test_undeclared_read_check.py -q with a fixture that adds an undeclared
      read and expects the refusal'
evidence_requirements:
- kind: tests
  description: The undeclared read check tests pass at the pushed head.
  command: uv run --frozen pytest tests/test_undeclared_read_check.py -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn26424-ac1
  description: 'AC1, declaration half met in the overlays pull request: the declared_settings overlay names ONEX_LEDGER_READER_PYTHON (the host row''s ledger_bus_python) and ONEX_LEDGER_READER_OVERLAY (the
    reader node''s overlay under the host''s overlays clone), and the reader overlay''s moved_readers holds every reader the register names. Not met: nothing reads the declared values yet; the shell readers
    still take the variable from the environment (inbox.sh defaults to the bus writer''s interpreter, OMN-26309).'
  source: manual
  execution_scope: local_done_gate
  binds_ac:
  - AC1
  checks:
  - check_type: command
    check_value: cd "$OMNI_HOME/overlays" && env PYTHONDONTWRITEBYTECODE=1 python3 -m pytest tests/test_declared_reader_settings.py -q -p no:cacheprovider
    cwd: .
- id: dod-omn26424-ac2
  description: 'AC2, partly met and said so: every placeable host''s row declares the overlays clone and the interpreter. Read on h105 2026-11-22: the clone is at ~/Code/overlays (the declared path), at
    198af18 and outside the registry roots canonical_clone_sync scans, so a refresh prints NO_CLONE and the clone stays stale (it lacks the pr-duplicate-guard-claims reader name). Not met: no refresh covers
    that path on h105 yet.'
  source: manual
  execution_scope: local_done_gate
  binds_ac:
  - AC2
  checks:
  - check_type: command
    check_value: cd "$OMNI_HOME/overlays" && env PYTHONDONTWRITEBYTECODE=1 python3 -m pytest tests/test_pr_duplicate_guard_reader.py -q -p no:cacheprovider
    cwd: .
- id: dod-omn26424-ac3
  description: 'AC3 NOT met and not attempted here: h202''s cap is a measured hold (OMN-26363) and the measurement is labdispatch3-0040''s; this lane sent it one ledger MSG and chose no number.'
  source: manual
  execution_scope: local_done_gate
  binds_ac:
  - AC3
  checks:
  - check_type: command
    check_value: cd "$OMNI_HOME/overlays" && env PYTHONDONTWRITEBYTECODE=1 python3 -m pytest tests/test_host_table_slot_cap.py -q -p no:cacheprovider
    cwd: .
- id: dod-omn26424-ac4
  description: 'AC4, declaration half met: ENABLE_SMART_TESTS is declared at the repository scope of OmniNode-ai/omnimarket with value true. Not met: ci.yml and the variable write belong to OMN-26420, which
    was sent the declared value by one ledger MSG; the watcher state shows no repository variable set.'
  source: manual
  execution_scope: local_done_gate
  binds_ac:
  - AC4
  checks:
  - check_type: command
    check_value: cd "$OMNI_HOME/overlays" && env PYTHONDONTWRITEBYTECODE=1 python3 -m pytest tests/test_smart_tests_flag_declared.py -q -p no:cacheprovider
    cwd: .
- id: dod-omn26424-ac5
  description: 'AC5, declaration half met: PREBUILT_ACTIVE_RUNTIME_PACKAGES is declared as omnibase_infra,omnimarket (the runtime policy''s own ONEX_ACTIVE_RUNTIME_PACKAGES). Not met: no build passes the
    argument yet (docker/Dockerfile.runtime defaults it to empty and the deploy agent''s build arguments omit it), so the built manifest is still empty; no listing of built packages exists.'
  source: manual
  execution_scope: local_done_gate
  binds_ac:
  - AC5
  checks:
  - check_type: command
    check_value: cd "$OMNI_HOME/overlays" && env PYTHONDONTWRITEBYTECODE=1 python3 -m pytest tests/test_image_manifest_packages.py -q -p no:cacheprovider
    cwd: .
- id: dod-omn26424-ac6
  description: 'AC6, declaration half met: enable_sasl=true and the release floor v0.38.79 are declared for the stability lane. Not met: the broker is not rolled; the roll moves only through the stability
    release pin (owned by the cloud owner) and the stability follow refuses with dev_receipt_not_passed.'
  source: manual
  execution_scope: local_done_gate
  binds_ac:
  - AC6
  checks:
  - check_type: command
    check_value: cd "$OMNI_HOME/overlays" && env PYTHONDONTWRITEBYTECODE=1 python3 -m pytest tests/test_stability_broker_sasl_declared.py -q -p no:cacheprovider
    cwd: .
- id: dod-omn26424-ac7
  description: 'AC7: the check node refuses an added read that no overlay declares (planted reads in Python, shell, a workflow variable and a build argument, each expecting the refusal; positive controls
    show the reads are found), the CI job undeclared-read-check and the pre-commit hook undeclared-read-check run it. Whether the job is a required context is a branch protection setting this lane does
    not edit; CI Summary, which is required, sweeps the job by default-deny.'
  source: manual
  binds_ac:
  - AC7
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/test_undeclared_read_check.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn26424-deploy-probe
  description: 'Deploy probe for AC7: the node contract read from GitHub at the checked-out commit names node_undeclared_read_check_compute. A head that does not carry the node there fails the probe.'
  source: manual
  binds_ac:
  - AC7
  checks:
  - check_type: command
    check_value: "gh api \"repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_undeclared_read_check_compute/contract.yaml?ref=$(git rev-parse HEAD)\" --jq .content | base64 -d | grep -cF 'node_name: node_undeclared_read_check_compute'"
    cwd: .
- id: dod-omn26424-integration-proof
  description: 'the check runs on a lab host at the pushed head through the node''s own command line: a planted undeclared read is refused (exit 1) and the overlays declared_settings register is read from
    the lab host''s overlays clone; hosted CI cannot reach the lab, so only the local Done gate runs this unbound check'
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-26424 --kind test -- env PYTHONDONTWRITEBYTECODE=1
      uv run --frozen pytest tests/test_undeclared_read_check.py -q --no-cov -n 0
    cwd: .
