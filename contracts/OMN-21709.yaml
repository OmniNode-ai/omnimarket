---
schema_version: 1.0.0
ticket_id: OMN-21709
title: BaseProjectionRunner hands each runner a typed ModelProjectionRequest (omnimarket#4642 contract split)
summary: Slice 1 of the omnimarket handler-shape burn-down (omnimarket#4642). The handler-shape validator of omnibase_core reports a handler class whose handle takes a parameter that is not a typed request (noncanonical_handle). Forty-three of those were projection runners, subclasses of BaseProjectionRunner, each with handle(input_data) that popped the delivery keys the runtime injects (the topic, partition, offset and fallback id) by hand. BaseProjectionRunner.handle now splits that dict once into a ModelProjectionRequest and passes it to project_request, which each runner implements over the typed request. The base handle keeps the dict parameter because the projection arm of the shared runtime calls handle(dict), and a handle annotated with a concrete model is wired onto the typed dispatch arm instead, where the runner would stop receiving its database adapter, partition and offset. The acceptance items of this PR moved here from the shared contracts/OMN-21536.yaml.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn21709-own-contract
  statement: BaseProjectionRunner of omnimarket#4642 hands each runner a typed ModelProjectionRequest, and the PR's acceptance items live in this contract file, not in the shared contracts/OMN-21536.yaml.
  acceptance:
  - id: AC1
    statement: 'AC1: BaseProjectionRunner of omnimarket#4642 hands each runner a typed ModelProjectionRequest and the handler-shape count over the touched runners drops as the PR states -- falsifier: uv run pytest tests/unit -q over the touched modules plus the handler-shape checker re-run on the PR paths'
  - id: AC2
    statement: 'AC2: the PR''s acceptance items live in contracts/OMN-21709.yaml and the PR does not edit contracts/OMN-21536.yaml -- falsifier: git diff --stat origin/dev...HEAD on the PR head lists contracts/OMN-21709.yaml and not contracts/OMN-21536.yaml'
evidence_requirements:
- kind: tests
  description: The shim tests, the OMN-18905 coordinate guard and the projection suites, run on a lab host at the pushed head.
  command: uv run pytest tests/test_projection_request.py tests/test_omn18905_writers_carry_source_coordinates.py tests/test_projection_runner_nodes_declare_their_outputs.py tests/test_projection_runner.py tests/projection -q --no-cov --tb=line
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
