title: "omnimarket contracts_and_di literal_topic burn-down, slice rf1245-c2: topics come from the node contract or overlay through DI"
summary: "The ticketing epic-org orchestrator handler named its four publish topics as string literals. It now binds them from event_bus.publish_topics of its own contract.yaml into a typed ModelTicketingEpicOrgTopics through load_ticketing_epic_org_topics, which refuses a missing or ambiguous match, and the handler takes an injected topics overlay through its constructor, falling back to the contract binding. The contracts_and_di check over src/omnimarket reports 182 literal_topic findings before the slice and 178 after, zero on the handler, with no baseline entry or suppression added; the four now-fixed compliance-sweep baseline keys of the handler are removed."
