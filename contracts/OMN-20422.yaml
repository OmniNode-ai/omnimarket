---
schema_version: "1.0.0"
ticket_id: "OMN-20422"
title: "The Hostile Reviewer's second voter is a different model from the first"
summary: "The hostile-review job's second voter is a different model from the first, so the two votes are independent. The endpoint allowlist moves to the job-level env block. The quorum rule is unchanged. Superseded for the roster itself by OMN-20910 and OMN-20923: the workflow names no voter, endpoint or model."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-second-voter-distinct"
    statement: |-
      The hostile-review job in .github/workflows/hostile-reviewer.yml must carry a job-level env that holds the endpoint allowlist, and must still request two distinct voters.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1 (superseded by OMN-20910, RULING 2026-10-10T18:17:37Z): the second voter is no longer a job-level URL; the workflow reads every voter from the review voters overlay and names no voter endpoint, and the CIDR allowlist stays job-level -- falsifier: env -u PYTHONPATH uv run pytest tests/ci/test_hostile_reviewer_voters_overlay_omn20910.py -q
  - id: "req-reviewer-pin-and-key"
    statement: |-
      The hostile-review job in .github/workflows/hostile-reviewer.yml must clone omniintelligence at a full 40-hex sha that carries the failed-vote parse fix and the review voters overlay reader (OMN-20910), and read every voter, at every roster site, from the review voters overlay.
    acceptance:
      - id: "AC2"
        statement: |-
          AC2 (superseded by OMN-20910): no registry key or endpoint variable is named at the preflight, retry-budget or review sites; all three read the review voters overlay -- falsifier: env -u PYTHONPATH uv run pytest tests/ci/test_hostile_reviewer_voters_overlay_omn20910.py -q
  - id: "req-shadow-review-runner"
    statement: |-
      node_shadow_review_effect runs one tick of the pre-registered shadow reviewer experiment on a lab host: it reviews only in-scope PRs (a private planning repository never; a cloud model on public PRs only), drops a diff with a secret pattern before any call, and writes results to the experiment store without posting or blocking.
    acceptance:
      - id: "AC3"
        statement: |-
          AC3: the shadow-review tick keeps the pre-registered scope and never posts -- falsifier: env -u PYTHONPATH uv run pytest tests/nodes/node_shadow_review_effect -q
  - id: "req-reviewer-pin-self-negating-drop"
    statement: |-
      The hostile-review job in .github/workflows/hostile-reviewer.yml must clone omniintelligence at 30f37eca07b692d7889692edfe99686c87612315, the dev tip that drops a reviewer finding whose own text says there is no defect before the quorum and records it as dropped with a reason.
    acceptance:
      - id: "AC4"
        statement: |-
          AC4 (superseded by OMN-20910): the omniintelligence clone is pinned to a full sha that carries the self-negating drop and the voters overlay reader -- falsifier: env -u PYTHONPATH uv run pytest tests/ci/test_hostile_reviewer_voters_overlay_omn20910.py -q -k pinned
  - id: "req-experiment-record-check"
    statement: |-
      node_delegation_experiment_record_compute checks the results records of the delegation experiment program: a record per listed experiment with hypothesis, metric, baseline, arms, per-arm values and a verdict; every counted run id has a receipt; no changed path is the dev-lane overlay or the bifrost contract path; a supported verdict names a follow-on or a declining ruling. The ticket's four live criteria are bound here as AC5 to AC8, in the ticket's order, because AC1 to AC4 above are held by the earlier reviewer requirements.
    acceptance:
      - id: "AC5"
        statement: |-
          AC5 (ticket AC1): each experiment in the program has a results record with hypothesis, metric, baseline, arms, run count, per-arm values and a verdict; a listed experiment with no record, or a record missing per-arm values, is refused -- falsifier: env -u PYTHONPATH uv run pytest tests/nodes/node_delegation_experiment_record_compute -q -k "ac1 or listed or measured"
      - id: "AC6"
        statement: |-
          AC6 (ticket AC2): every run an experiment counts is traceable to a receipt run id; a run id with no receipt is refused and named -- falsifier: env -u PYTHONPATH uv run pytest tests/nodes/node_delegation_experiment_record_compute -q -k ac2
      - id: "AC7"
        statement: |-
          AC7 (ticket AC3): a record whose changed paths include the dev-lane overlay or the bifrost contract path is refused -- falsifier: env -u PYTHONPATH uv run pytest tests/nodes/node_delegation_experiment_record_compute -q -k ac3
      - id: "AC8"
        statement: |-
          AC8 (ticket AC4): a record with a supported verdict and neither a follow-on ticket or PR nor a declining ruling is refused -- falsifier: env -u PYTHONPATH uv run pytest tests/nodes/node_delegation_experiment_record_compute -q -k ac4
evidence_requirements:
  - kind: "tests"
    description: "The workflow voter tests pass at the head."
    command: "env -u PYTHONPATH uv run pytest tests/ci/test_hostile_reviewer_voters_overlay_omn20910.py -q"
  - kind: "tests"
    description: "The workflow pin and roster-key tests pass at the head."
    command: "env -u PYTHONPATH uv run pytest tests/ci/test_hostile_reviewer_voters_overlay_omn20910.py -q"
  - kind: "tests"
    description: "The shadow-review node tests pass at the head."
    command: "env -u PYTHONPATH uv run pytest tests/nodes/node_shadow_review_effect -q"
  - kind: "tests"
    description: "The workflow clones omniintelligence at a full 40-hex sha and reads every voter from the overlay at the head."
    command: "env -u PYTHONPATH uv run pytest tests/ci/test_hostile_reviewer_voters_overlay_omn20910.py -q"
  - kind: "tests"
    description: "The experiment record check, its registration and the first measured record pass at the head."
    command: "env -u PYTHONPATH uv run pytest tests/nodes/node_delegation_experiment_record_compute -q"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-second-voter-distinct-ac1"
    description: "The hostile-review job env holds the endpoint allowlist, and two distinct voters are requested."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_hostile_reviewer_voters_overlay_omn20910.py -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC1"]
  - id: "dod-reviewer-pin-and-key-ac2"
    description: "The workflow clones omniintelligence at the parse-fix sha and names the renamed second voter at every roster site."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_hostile_reviewer_voters_overlay_omn20910.py -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC2"]
  - id: "dod-shadow-review-runner-ac3"
    description: "node_shadow_review_effect selects the pre-registered sample, drops secret-pattern diffs before any call, runs A2 on public PRs only, and writes one record per PR without posting."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_shadow_review_effect/test_shadow_review_selection.py tests/nodes/node_shadow_review_effect/test_shadow_review_handler.py tests/nodes/node_shadow_review_effect/test_golden_chain_shadow_review.py -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC3"]
  - id: "dod-reviewer-pin-self-negating-drop-ac4"
    description: "The workflow clones omniintelligence at 30f37eca, the dev tip that drops a self-negating reviewer finding before the quorum."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_hostile_reviewer_voters_overlay_omn20910.py -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC4"]
  - id: "dod-omn20422-ac1-second-voter-url-from-variable"
    description: "Superseded by OMN-20910: no reviewer workflow names a voter endpoint, port or model flag; the ratchet finds every line of a known-bad fixture and the retired endpoint variables are named nowhere."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_hostile_reviewer_voters_overlay_omn20910.py -q -k 'ratchet or names_a_voter or llm_endpoint_variable'"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC1"]
  - id: "dod-omn20422-ac2-roster-url-from-variable"
    description: "Superseded by OMN-20910: the preflight, the retry budget and the review step read the review voters overlay, and the overlay path is the CI overlay outside the workspace."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_hostile_reviewer_voters_overlay_omn20910.py -q -k 'reads_the_overlay or from_the_overlay or outside_the_workspace'"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC2"]
  - id: "dod-omn20422-ac5-experiment-record-complete"
    description: "A record missing hypothesis, metric, baseline, verdict or a per-arm value is refused, a listed experiment with no record is refused, and the first measured record passes."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_delegation_experiment_record_compute -q -k 'ac1 or listed or measured'"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC5"]
  - id: "dod-omn20422-ac6-run-ids-have-receipts"
    description: "A counted run id with no receipt is refused and named; the first measured record was also checked against the receipts on the lab host."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_delegation_experiment_record_compute -q -k ac2"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC6"]
  - id: "dod-omn20422-ac7-no-routing-change"
    description: "A changed path naming the bifrost contract or its overrides is refused."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_delegation_experiment_record_compute -q -k ac3"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC7"]
  - id: "dod-omn20422-ac8-supported-has-follow-on"
    description: "A supported verdict with neither follow-on nor ruling is refused."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_delegation_experiment_record_compute -q -k ac4"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC8"]
