---
schema_version: "1.0.0"
ticket_id: "OMN-20422"
title: "The Hostile Reviewer's second voter is a different model from the first"
summary: "The hostile-review job's second voter is a different model from the first, so the two votes are independent. The endpoint allowlist moves to the job-level env block. The quorum rule is unchanged. Superseded for the roster itself by OMN-20910 and OMN-20923: the workflow names no voter, endpoint or model."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-second-voter-distinct"
    statement: |-
      The hostile-review job in .github/workflows/hostile-reviewer.yml must carry a job-level env that holds the endpoint allowlist, and must still request two distinct voters.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1 (superseded by OMN-20910, RULING 2026-10-10T18:17:37Z): the second voter is no longer a job-level URL; the workflow reads every voter from the review voters overlay and names no voter endpoint, and the CIDR allowlist stays job-level -- falsifier: env -u PYTHONPATH uv run pytest tests/ci/test_hostile_reviewer_voters_overlay_omn20910.py -q
  - id: "req-reviewer-pin-and-key"
    statement: |-
      The hostile-review job in .github/workflows/hostile-reviewer.yml must clone omniintelligence at 33a29cdfba6f14be6f94c3c77a05e29f345c692b (the dev tip carrying the failed-vote parse fix and the registry key rename), name the second voter at every roster site, and resolve its URL from a repository variable.
    acceptance:
      - id: "AC2"
        statement: |-
          AC2 (superseded by OMN-20910): no registry key or endpoint variable is named at the preflight, retry-budget or review sites; all three read the review voters overlay -- falsifier: env -u PYTHONPATH uv run pytest tests/ci/test_hostile_reviewer_voters_overlay_omn20910.py -q
  - id: "req-shadow-review-runner"
    statement: |-
      node_shadow_review_effect runs one tick of the pre-registered shadow reviewer experiment on a lab host: it reviews only in-scope PRs (a private planning repository never; GLM on public PRs only), drops a diff with a secret pattern before any call, and writes results to the experiment store without posting or blocking.
    acceptance:
      - id: "AC3"
        statement: |-
          AC3: the shadow-review tick keeps the pre-registered scope and never posts -- falsifier: env -u PYTHONPATH uv run pytest tests/nodes/node_shadow_review_effect -q
  - id: "req-reviewer-pin-self-negating-drop"
    statement: |-
      The hostile-review job in .github/workflows/hostile-reviewer.yml must clone omniintelligence at 30f37eca07b692d7889692edfe99686c87612315, the dev tip that drops a reviewer finding whose own text says there is no defect before the quorum and records it as dropped with a reason.
    acceptance:
      - id: "AC4"
        statement: |-
          AC4 (superseded by OMN-20910): the omniintelligence clone is pinned to a full sha that carries the self-negating drop and the voters overlay reader -- falsifier: env -u PYTHONPATH uv run pytest tests/ci/test_hostile_reviewer_voters_overlay_omn20910.py -q -k pinned
evidence_requirements:
  - kind: "tests"
    description: "The workflow voter tests pass at the head."
    command: "env -u PYTHONPATH uv run pytest tests/ci/test_hostile_reviewer_voters_overlay_omn20910.py -q"
  - kind: "tests"
    description: "The workflow pin and roster-key tests pass at the head."
    command: "env -u PYTHONPATH uv run pytest tests/ci/test_hostile_reviewer_voters_overlay_omn20910.py -q"
  - kind: "tests"
    description: "The shadow-review node tests pass at the head."
    command: "env -u PYTHONPATH uv run pytest tests/nodes/node_shadow_review_effect -q"
  - kind: "tests"
    description: "The workflow clones omniintelligence at 30f37eca at the head."
    command: "env -u PYTHONPATH uv run pytest tests/ci/test_hostile_reviewer_voters_overlay_omn20910.py -q"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-second-voter-distinct-ac1"
    description: "The hostile-review job env holds the endpoint allowlist, and two distinct voters are requested."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_hostile_reviewer_voters_overlay_omn20910.py -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC1"]
  - id: "dod-reviewer-pin-and-key-ac2"
    description: "The workflow clones omniintelligence at the parse-fix sha and names the renamed second voter at every roster site."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_hostile_reviewer_voters_overlay_omn20910.py -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC2"]
  - id: "dod-shadow-review-runner-ac3"
    description: "node_shadow_review_effect selects the pre-registered sample, drops secret-pattern diffs before any call, runs A2 on public PRs only, and writes one record per PR without posting."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_shadow_review_effect/test_shadow_review_selection.py tests/nodes/node_shadow_review_effect/test_shadow_review_handler.py tests/nodes/node_shadow_review_effect/test_golden_chain_shadow_review.py -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC3"]
  - id: "dod-reviewer-pin-self-negating-drop-ac4"
    description: "The workflow clones omniintelligence at 30f37eca, the dev tip that drops a self-negating reviewer finding before the quorum."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_hostile_reviewer_voters_overlay_omn20910.py -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC4"]
  - id: "dod-omn20422-ac1-second-voter-url-from-variable"
    description: "The hostile-review job env sets the second voter's URL from a repository variable, which this pull request introduces; the test fails on the merge base, where the value is a literal address."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_hostile_reviewer_voter_omn20422.py -q -k test_second_voter_url_is_the_repository_variable"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC1"]
  - id: "dod-omn20422-ac2-roster-url-from-variable"
    description: "The renamed second voter resolves its URL from a repository variable at the workflow level, which this pull request introduces; the test fails on the merge base."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_hostile_reviewer_pin_omn20422.py -q -k test_second_voter_url_is_the_registry_env_var_from_a_variable"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC2"]
