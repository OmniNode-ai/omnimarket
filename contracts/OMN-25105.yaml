    check_value: git diff --exit-code f3a1133502a568471206a174373fd7a2a3770d45 HEAD -- src/omnimarket/nodes/
    cwd: .
- id: dod-nocaller-ac5
  description: AC5 repository evidence; the report records the external table and terminal observations separately.
  source: manual
  binds_ac:
  - AC5
  checks:
  - check_type: test_passes
    check_value: uv run --frozen python -m pytest tests/nodes/node_integration_projection_compute/test_no_caller.py
      -q -n 0 -p no:randomly --no-cov -k reviewed_inventory
    cwd: .
- id: dod-nocaller-integration-proof-live-writer
  description: 'Pending: the launching host must read back NO-CALLER lines written by the integration pass and the
    installed canonical prompt; this host has no Mac ledger. This unbound local check remains a Done requirement.'
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: python3 -c 'import os; from pathlib import Path; p=Path(os.environ.get("OMNI_SESSION_START_STATE_DIR",str(Path.home()/".local/state/omni/session-start")))/"integration-ledger.md";
      rows=p.read_text().splitlines(); assert all(any("NO-CALLER" in r and "omnimarket "+str(n) in r for r in rows)
      for n in (5404,5502,5641,5657,5879)), "live integration writer has not recorded all five NO-CALLER recommendations"'
    cwd: .
  - check_type: command
    check_value: 'curl --fail --show-error --max-time 20 "${FLOOR_SIMPLE_URL:?set FLOOR_SIMPLE_URL to the served
      lab floor-simple.json}" | python3 -c ''import json,sys; section=json.load(sys.stdin)["integration"]; expected={"omnimarket#5404":"WIRE",
      "omnimarket#5502":"MOVE", "omnimarket#5641":"MOVE", "omnimarket#5657":"WIRE", "omnimarket#5879":"WIRE"}; assert
      section["status"] == "read", section; assert any(row["key"] in expected and row["state"] == "no_caller" and
      row["step"].startswith(expected[row["key"]]+":") and row["target"].strip() for row in section["rows"]), "the
      live floor has not read back a NO-CALLER recommendation from the integration projection"'' '
    cwd: .
