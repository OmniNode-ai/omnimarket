schema_version: 1.0.0
ticket_id: OMN-25105
title: Classify structural integration gaps and carry NO-CALLER recommendations
summary: The reviewed inventory covers the named source PRs and excludes nodes with existing callers. The shared
  integration reading model carries no_caller, recommendation and recommendation_target through the existing projection
  and publisher while keeping the work outstanding. The Mac integration prompt patch and live ledger writer readback
  remain pending; this is partial work, not Done evidence.
requirements:
- id: req-nocaller-1
  statement: 'AC1: one table in the reports folder lists every merged node in the state (empty runtime_profiles,
    no subscribe topic, no caller, in-process only or inmemory profile only) with node, merged PR, its ticket''s
    stated purpose, what would call it and one recommendation of WIRE, RETIRE or MOVE -- falsifier: a node of the
    PRs named in the description (5404, 5628, 5685, 5699, 5715, 5716, 5879, 5289, 5502, 5503, 5546, 5641, 5657)
    that is absent from the table, or a table row with no recommendation, found by a grep of the table'
  acceptance:
  - id: AC1
    statement: 'AC1: one table in the reports folder lists every merged node in the state (empty runtime_profiles,
      no subscribe topic, no caller, in-process only or inmemory profile only) with node, merged PR, its ticket''s
      stated purpose, what would call it and one recommendation of WIRE, RETIRE or MOVE -- falsifier: a node of
      the PRs named in the description (5404, 5628, 5685, 5699, 5715, 5716, 5879, 5289, 5502, 5503, 5546, 5641,
      5657) that is absent from the table, or a table row with no recommendation, found by a grep of the table'
- id: req-nocaller-2
  statement: 'AC2: every WIRE row names the caller and the runtime profile or schedule it needs, every RETIRE row
    names what supersedes it, and every MOVE row names the host timer or Temporal schedule -- falsifier: a grep
    of the table finds a WIRE, RETIRE or MOVE row whose caller, superseded-by or target cell is empty'
  acceptance:
  - id: AC2
    statement: 'AC2: every WIRE row names the caller and the runtime profile or schedule it needs, every RETIRE
      row names what supersedes it, and every MOVE row names the host timer or Temporal schedule -- falsifier: a
      grep of the table finds a WIRE, RETIRE or MOVE row whose caller, superseded-by or target cell is empty'
- id: req-nocaller-3
  statement: 'AC3: the integration ledger format carries a NO-CALLER state written through its declared writer,
    the integration pass script reads it, and the table''s nodes read NO-CALLER with their recommendation -- falsifier:
    the integration pass script''s own reader run on the ledger file exits non-zero or lists no NO-CALLER line,
    and a pytest of that reader on a sample with a NO-CALLER line fails before the change'
  acceptance:
  - id: AC3
    statement: 'AC3: the integration ledger format carries a NO-CALLER state written through its declared writer,
      the integration pass script reads it, and the table''s nodes read NO-CALLER with their recommendation -- falsifier:
      the integration pass script''s own reader run on the ledger file exits non-zero or lists no NO-CALLER line,
      and a pytest of that reader on a sample with a NO-CALLER line fails before the change'
- id: req-nocaller-4
  statement: 'AC4: no node was deleted, retired or edited by this work and the RETIRE rows are listed for the operator''s
    yes -- falsifier: the pull request diff against its base shows a deleted or changed node directory under the
    nodes folder'
  acceptance:
  - id: AC4
    statement: 'AC4: no node was deleted, retired or edited by this work and the RETIRE rows are listed for the
      operator''s yes -- falsifier: the pull request diff against its base shows a deleted or changed node directory
      under the nodes folder'
- id: req-nocaller-5
  statement: 'AC5: the TERMINAL row summarises the count per recommendation and the counts equal the table''s row
    counts -- falsifier: a count of WIRE, RETIRE and MOVE rows in the table differs from the TERMINAL''s counts'
  acceptance:
  - id: AC5
    statement: 'AC5: the TERMINAL row summarises the count per recommendation and the counts equal the table''s
      row counts -- falsifier: a count of WIRE, RETIRE and MOVE rows in the table differs from the TERMINAL''s counts'
evidence_requirements:
- kind: tests
  description: Focused shared-model, existing projection/publisher and reviewed inventory coverage.
  command: uv run --frozen python -m pytest tests/nodes/node_integration_projection_compute/test_no_caller.py -q
    -n 0 -p no:randomly --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-nocaller-ac1
  description: AC1 repository evidence; the report records the external table and terminal observations separately.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen python -m pytest tests/nodes/node_integration_projection_compute/test_no_caller.py
      -q -n 0 -p no:randomly --no-cov -k reviewed_inventory
    cwd: .
- id: dod-nocaller-ac2
  description: AC2 repository evidence; the report records the external table and terminal observations separately.
  source: manual
  binds_ac:
