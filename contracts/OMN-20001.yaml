      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_omniclaude_release_notice_omn20001.py -q -p no:randomly --no-cov -k notice_wired"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC7"]
  - id: "dod-omn20001-pin-bump-cli-deploy-probe"
    description: "Run the installed pin-bump CLI in an isolated lab container, without a source mount. Read its JSON verdict and rewritten file: both omniclaude pins advance, the other repository stays pinned, and equal, backwards, release-candidate and split-pin requests exit 1 without rewriting. An image without the node fails at module invocation. This unbound local Done probe does not claim a live repository_dispatch or App grant; hosted CI has no lab container."
    source: "manual"
    execution_scope: "local_done_gate"
    checks:
      - check_type: "command"
        check_value: |-
          docker exec "${OMN20001_PROBE_CONTAINER:?set an isolated pin-bump lab container}" python -c '
          import json, subprocess, sys, tempfile
          from pathlib import Path
          module = "omnimarket.nodes.node_omniclaude_pin_bump_compute"
          original = "git clone --branch v0.27.0 https://github.com/OmniNode-ai/omniclaude.git\nrepository: OmniNode-ai/omniclaude\n  ref: v0.27.0\nrepository: OmniNode-ai/omnibase_core\n  ref: v0.27.0\n"
          with tempfile.TemporaryDirectory() as directory:
              path = Path(directory) / "ci.yml"
              path.write_text(original)
              def invoke(version, code):
                  result = subprocess.run([sys.executable, "-m", module, "--ci-yml", str(path), "--version", version], capture_output=True, text=True)
                  assert result.returncode == code, (version, result.returncode, result.stdout, result.stderr)
                  verdict = json.loads(result.stdout)
                  print(json.dumps(verdict, sort_keys=True))
                  return verdict
              accepted = invoke("0.28.0", 0)
              assert accepted["accepted"] is True
              assert accepted["current_tag"] == "v0.27.0" and accepted["new_tag"] == "v0.28.0"
              updated = original.replace("--branch v0.27.0", "--branch v0.28.0").replace("omniclaude\n  ref: v0.27.0", "omniclaude\n  ref: v0.28.0")
              assert path.read_text() == updated
              for version, reason in [("0.28.0", "not_forward"), ("0.27.0", "not_forward"), ("0.29.0rc1", "not_a_release_version")]:
                  refused = invoke(version, 1)
                  assert refused["accepted"] is False and refused["refusal"] == reason
                  assert path.read_text() == updated
              split = updated.replace("--branch v0.28.0", "--branch v0.27.0")
              path.write_text(split)
              refused = invoke("0.29.0", 1)
              assert refused["accepted"] is False and refused["refusal"] == "pins_disagree"
              assert path.read_text() == split
          print("OMN-20001 installed CLI readback: accepted bump and four unchanged refusals")
          '
        cwd: "${OMNI_HOME}/omnimarket"
