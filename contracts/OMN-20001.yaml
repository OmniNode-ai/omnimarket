  - id: "dod-omn20001-drift-reads-pinned-rev"
    description: "The drift check reads omniclaude at the pinned rev; dev moving with the pin unmoved stays green, moving the pin changes the verdict."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_omniclaude_pin_drift_omn20001.py -q -p no:randomly --no-cov -k drift_reads_pinned_rev"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC1"]
  - id: "dod-omn20001-pin-move-requires-integration"
    description: "ci.yml reads omniclaude at one pin, the Event Registry Drift job runs the omniclaude-coupled tests at it, and the reading gates sit in CI Summary's strict set."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_omniclaude_pin_drift_omn20001.py -q -p no:randomly --no-cov -k pin_move_requires_integration"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC2"]
  - id: "dod-omn20001-drift-strict-both-directions"
    description: "A source-ahead and a registry-ahead mutation each turn the production drift check red, there is no consumer-ahead tolerance, and the guard runs in the lint job and a pre-commit hook."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_omniclaude_pin_drift_omn20001.py -q -p no:randomly --no-cov -k drift_strict_both_directions"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC3"]
  - id: "dod-omn20001-omn13146-tests-guarded"
    description: "The two OMN-13146 tests are present, enabled, assert their original polarity, and run in the Event Registry Drift job."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_omniclaude_pin_drift_omn20001.py -q -p no:randomly --no-cov -k omn13146_tests_guarded"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC4"]
