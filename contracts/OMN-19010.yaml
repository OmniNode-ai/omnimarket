---
schema_version: "1.0.0"
ticket_id: "OMN-19010"
title: "The fan-out's READY control uses a declared shape directive, and a test-shaped item names its task class"
summary: "The delegate fan-out now lives in node_delegate_fanout_effect. Its READY control prompt matches a declared response_shape_directives pattern, a test_shaped item without a task_type is refused at admission, and the pin reads the directive table from the contract file in this repository."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-ready-control-shape-directive"
    statement: "The criteria below are transcribed from the ticket body; each id is the label a dod_evidence item claims through binds_ac."
    acceptance:
      - id: "AC1"
        statement: "AC1: The workflow declares a READY control prompt whose text matches at least one pattern in `response_shape_directives`, read from the contract file at test time and applied as a case-insensitive regular expression — falsifier: `uv run pytest tests/test_delegate_fanout_workflow.py -k control_prompt`, red when the workflow's control prompt is reworded or when the matching phrase leaves the contract table."
      - id: "AC2"
        statement: "AC2: The pin discriminates rather than matching anything — falsifier: `uv run pytest tests/test_delegate_fanout_workflow.py -k discriminates`, asserting the prompt that failed on 2026-09-21 matches no pattern in the table, red if the matcher is loosened to accept it."
      - id: "AC3"
        statement: "AC3: An item marked test-shaped that declares no task type is refused at admission and never dispatched — falsifier: `uv run pytest tests/test_delegate_fanout_workflow.py -k test_shaped`, red when the refusal is removed or when a task type stops satisfying it."
      - id: "AC4"
        statement: "AC4: The cross-repo pin executes in the required whole-tree job rather than skipping — falsifier: `uv run pytest tests/test_delegate_fanout_workflow.py -k contract_is_reachable`, red when the contract file cannot be resolved from any declared search path, so an absent sibling checkout fails rather than silently skipping."
      - id: "AC5"
        statement: "AC5: A live run on the dev lane using the declared control prompt verbatim returns a completed terminal for the control — falsifier: `bash omnibase_infra/scripts/onex delegate` driven with the declared control prompt, its correlation id resolvable to a run directory whose receipt records a completed terminal rather than a single-word-fragment refusal."
evidence_requirements:
  - kind: "tests"
    description: "AC1 hosted probe: the READY control prompt the node declares matches a pattern in response_shape_directives read from the contract file, and a reworded prompt matches none."
    command: "uv run pytest tests/nodes/node_delegate_fanout_effect/test_ready_control_shape_directive.py -q -p no:randomly -k control_prompt"
  - kind: "tests"
    description: "AC2 hosted probe: the 2026-09-21 capital-of-France prompt matches no pattern in the table while the READY control does."
    command: "uv run pytest tests/nodes/node_delegate_fanout_effect/test_ready_control_shape_directive.py -q -p no:randomly -k discriminates"
  - kind: "tests"
    description: "AC3 hosted probe: a test_shaped item with no, empty or blank task_type is refused at admission and one naming a task type is admitted."
    command: "uv run pytest tests/nodes/node_delegate_fanout_effect/test_ready_control_shape_directive.py -q -p no:randomly -k test_shaped"
  - kind: "tests"
    description: "AC4 hosted probe: the shape-directive contract file resolves inside this repository and its exact_literal list is non-empty; absence fails, never skips."
    command: "uv run pytest tests/nodes/node_delegate_fanout_effect/test_ready_control_shape_directive.py -q -p no:randomly -k contract_is_reachable"
  - kind: "tests"
    description: "AC5 lab readback of a completed READY control terminal on the dev lane."
    command: "see dod-omn19010-ac5-dev-lane-ready-control-completed"
