    description: "AC5 lab readback, not bindable by the hosted check (it carries only this repository). `onex delegate` on the dev lane (deployed-lane, task type summarization) was driven with the declared control prompt verbatim on 2026-10-15; run 5f147b2a-8d99-4e2d-a3f5-64b13a590a2f, correlation 2c877731-253e-46a8-9f2c-616a884a9958. Its receipt records a completed terminal, quality_gate_passed true and response READY. The check exits 1 on any mismatch, including a missing run directory."
