title: "The fan-out's READY control uses a declared shape directive, and a test-shaped item names its task class"
summary: "The delegate fan-out now lives in node_delegate_fanout_effect. Its READY control prompt matches a declared response_shape_directives pattern, a test_shaped item without a task_type is refused at admission, and the pin reads the directive table from the contract file in this repository."
