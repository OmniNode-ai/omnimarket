---
schema_version: "1.0.0"
ticket_id: "OMN-23634"
title: "Let a replacement pull request say which closed change it replaces"
summary: "onex scm pr-create takes a repeatable --replaces OWNER/REPO#N; the duplicate guard reads each named pull request's state itself and sets aside only the overlaps whose introducing commits all belong to one that is closed and not merged. Any other overlap still refuses; an open, merged, other-repository or unreadable entry is refused with a typed reason; with no --replaces the answer is today's."
is_seam_ticket: false
interface_change: true
interfaces_touched:
  - "public_api"
requirements:
  - id: "req-omn23634-replaces"
    statement: |-
      The pull request create request carries a typed optional replaces list; the duplicate guard attributes each overlapping line to the commits that introduced it in the other change and does not count an overlap all of whose commits belong to a replaced, closed and unmerged pull request of the same repository, as the node reads it.
    acceptance:
      - id: "AC1"
        statement: "AC1: pr-create accepts a typed optional replaces list and the guard sets aside an overlap whose introducing commits all belong to a replaced pull request the node reads as closed and not merged, and refuses any other overlap -- falsifier: pytest tests/nodes/node_pr_duplicate_guard_compute/test_pr_duplicate_guard_replaces.py -q"
      - id: "AC2"
        statement: "AC2: a replaces entry that is open, merged, of another repository or unreadable is refused with a typed reason, and with no replaces the answer equals today's -- falsifier: pytest tests/nodes/node_pr_duplicate_guard_compute/test_pr_duplicate_guard_replaces.py -k refused -q"
      - id: "AC3"
        statement: "AC3: integrated: on the running dev runtime a dry run of pr-create for branch omn-19998-glm-lane-route of the private plugin repository with --replaces naming the closed draft reports the guard decision and the set-aside overlaps -- falsifier: the same dry run of pr-create on the private plugin repository with --replaces naming the closed draft still prints PR-DUPLICATE-REFUSED"
evidence_requirements:
  - kind: "tests"
    description: "The replaces guard tests, the real-git measured-case fixture, the request seam test and the existing duplicate guard tests."
    command: "uv run pytest tests/nodes/node_pr_duplicate_guard_compute tests/unit/handlers/scm/test_scm_duplicate_guard_replaces.py tests/unit/handlers/scm/test_scm_write_seam_shapes.py -q --no-cov"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn23634-unit"
    description: "The guard replaces tests (set aside, other-commit refusal, unattributed refusal, typed refusals, no-replaces unchanged, golden and error chain) pass; the failing control is the base guard, which has no replaced field and fails to import the new models."
    source: "manual"
    binds_ac: ["AC1", "AC2"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_pr_duplicate_guard_compute/test_pr_duplicate_guard_replaces.py -q --no-cov"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn23634-integration-hosted"
    description: "Hosted proxy for AC3: the real-git fixture of the measured case (an open bundle that merged in the single commit of a closed draft) is refused without --replaces and allowed with it, and the request seam test pins the request shape the handoff and landing sides read. At the merge base both files fail, so the control fails there. The lab run is the unbound local item below."
    source: "manual"
    binds_ac: ["AC3"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/handlers/scm/test_scm_duplicate_guard_replaces.py tests/unit/handlers/scm/test_scm_write_seam_shapes.py -q --no-cov"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn23634-aged-out-replaced-read"
    description: "A replaces entry the PR watcher state no longer holds (a change closed days ago) is read from the gateway merged_pr operation, so the live dry run no longer answers unreadable for the aged-out closed draft. The tests drive the real CLI over a real git origin with the draft removed from the watcher state and the gateway answering from the real dispatcher on a recorded REST exchange: closed and unmerged sets the overlaps aside, open and merged are refused with their typed reasons, an unreadable gateway is refused as unreadable, and an entry the watcher holds never opens the bus. At the merge base the set-aside, still_open and merged cases fail, so the control fails there."
    source: "manual"
    binds_ac: ["AC3"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/handlers/scm/test_scm_duplicate_guard_replaces_gateway.py tests/unit/handlers/scm/test_scm_duplicate_guard_replaces.py tests/unit/handlers/scm/test_scm_duplicate_guard_gateway_source.py -q --no-cov"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn23634-integration-proof"
    description: "Run the measured-case fixture and the seam test on a lab host at the pushed head. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check; the hosted proxy above binds AC3. The real dry run of pr-create against the live pull requests is read after the deploy agent rolls the merged code."
    source: "manual"
    execution_scope: "local_done_gate"
    checks:
      - check_type: "command"
        check_value: "env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha \"$(git rev-parse HEAD)\" --lane dod-integration-proof-23634 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/handlers/scm/test_scm_duplicate_guard_replaces.py tests/unit/handlers/scm/test_scm_write_seam_shapes.py -q --no-cov"
        cwd: "."
