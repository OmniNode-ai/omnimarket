schema_version: 1.0.0
ticket_id: OMN-23170
title: A model whose key is missing is dropped from the rung count before the run's time is shared out
summary: The local delegation dispatch counted every rung of the class's ladder when it shared the run's time out, including a rung whose declared credential resolves to nothing. The ladder never selects such a rung, so the floor reserved for it was spent on nothing. The reachable rung count now leaves out a tier that serves the class only if its credential resolved.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23170-credential-absent-not-reserved
  statement: A rung whose credential is absent holds no part of the run's time in reserve.
  acceptance:
  - id: AC1
    statement: 'AC1: a three-rung ladder whose second rung has no credential gives the third rung the deadline a two-rung ladder would -- falsifier: `uv run pytest tests/unit/delegation/test_rung_deadlines.py -q -k credential_absent_not_reserved`'
evidence_requirements:
- kind: tests
  description: The rung deadline tests pass, including the credential-absent case and its keyless-rung control.
  command: uv run --frozen pytest tests/unit/delegation/test_rung_deadlines.py -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23170-ac1-tests
  description: Runs the rung deadline tests. The credential-absent case compares the first rung's attempt timeout on a two-rung ladder, on a three-rung ladder whose middle rung has no key, and on a three-rung ladder whose middle rung needs no key (the control, which must be shorter).
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/delegation/test_rung_deadlines.py -q --no-cov -k credential_absent_not_reserved
    cwd: .
- id: dod-omn23170-integration-proof
  description: Run this pull request's own check on a lab host at the pushed head. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23170 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/delegation/test_rung_deadlines.py -q --no-cov
    cwd: .
