schema_version: 1.0.0
ticket_id: OMN-24305
title: Run the shared work log checker on a schedule in the running system
summary: 'Adds the work-ledger reducer as a scheduled job node on the runtime schedule path: it gates on its overlay interval, reads a bounded window of ledger rows, runs the reducer''s guard replay and rebuild, and emits one typed run event.'
is_seam_ticket: true
interface_change: true
interfaces_touched:
- topics
requirements:
- id: req-omn24305-work-ledger-reducer-scheduled
  statement: The work-ledger reducer runs on the runtime tick from overlay values and records each run as a typed event, failed by name when the overlay, the read or the reducer refuses.
  acceptance:
  - id: AC1
    statement: 'AC1: on each runtime tick that is due, a scheduled job node reads a bounded window of work-ledger rows from the bus read command, runs the reducer''s guard replay and rebuild on it and emits one typed run event, failed by name when the overlay, the read or the reducer refuses -- falsifier: uv run --frozen pytest tests/nodes/node_work_ledger_reducer_scheduled_effect -q --no-cov'
  - id: AC2
    statement: 'AC2: the runtime login''s broker grants of the new job equal the rows the principals role derives, and a changed topic on one side fails -- falsifier: uv run --frozen pytest tests/nodes/node_schedule_run_reducer/test_runtime_role_acl_seam.py -q --no-cov'
  - id: AC3
    statement: 'AC3: integrated: on the dev runtime on h201 one run event from the reducer job over real ledger rows is read on onex.evt.omnimarket.schedule-run.v1 with zero replay or rebuild errors -- falsifier: read the topic on the dev broker after the deploy; no run event within 30 minutes fails it'
evidence_requirements:
- kind: tests
  description: The golden and error chain tests of the work-ledger reducer scheduled node and the ACL seam test
  command: uv run --frozen pytest tests/nodes/node_work_ledger_reducer_scheduled_effect tests/nodes/node_schedule_run_reducer/test_runtime_role_acl_seam.py -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24305-ac1
  description: AC1 proven by the named tests; AC3's runtime reading is taken on the dev runtime after the deploy and named in the pull request.
  source: manual
  binds_ac:
  - AC1
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_work_ledger_reducer_scheduled_effect -q --no-cov
    cwd: .
- id: dod-omn24305-ac2
  description: AC2 proven by the seam test, which fails when a contract grant and the derived role rows disagree.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_schedule_run_reducer/test_runtime_role_acl_seam.py -q --no-cov
    cwd: .
- id: dod-omn24305-deploy-work-ledger-reducer-scheduled
  description: 'Deploy probe the hosted runner can run: the work-ledger reducer scheduled node contract exists at the checked-out commit; the file does not exist at the merge base, so the probe fails there. AC3 is read on the dev runtime after the dev deploy through the deploy agent.'
  source: manual
  checks:
  - check_type: command
    check_value: 'test -f src/omnimarket/nodes/node_work_ledger_reducer_scheduled_effect/contract.yaml'
    cwd: .
- id: dod-omn24305-integration-proof
  description: AC3 is read on the dev runtime after the dev deploy through the deploy agent; the pushed head is run on a lab host first and the deployed reading is named in the pull request.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane integ-5483-6800 -- uv run --frozen pytest tests/nodes/node_work_ledger_reducer_scheduled_effect -q --no-cov
    cwd: .
