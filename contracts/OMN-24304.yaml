schema_version: 1.0.0
ticket_id: OMN-24304
title: Add the tenant claim to the dev sign-in client so the signed-in records read works
summary: 'Extends node_dev_keycloak_client_effect: after it ensures its service-account client and grants roles, it also ensures the overlay-declared tenant_id and tenant_slug protocol mappers on the one sign-in client the contract''s dev_only block lists (mapper_clients), with the same bootstrap admin token. A sign-in client the contract does not list is refused before any secret read or HTTP call; every mapper failure is a typed result; a second run updates the mappers without duplicates. A seam test builds a token from the declared mappers and resolves it through the by-correlation read''s edge identity.'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24304-tenant-mapper
  statement: The dev Keycloak client node adds the tenant claim mappers to the declared dev sign-in client, refuses any other client, and types every failure.
  acceptance:
  - id: AC1
    statement: 'AC1: a run creates the declared tenant_id and tenant_slug mappers on the declared sign-in client and a second run updates them without duplicates -- falsifier: uv run --frozen pytest tests/nodes/node_dev_keycloak_client_effect/test_tenant_mappers.py -q --no-cov -n 0 -p no:randomly fails when the mapper step is removed'
  - id: AC2
    statement: 'AC2: a sign-in client outside the contract''s mapper_clients list is refused before any secret read or HTTP call, and every mapper failure is a typed result -- falsifier: uv run --frozen pytest tests/nodes/node_dev_keycloak_client_effect/test_tenant_mappers.py -q --no-cov -n 0 -p no:randomly -k "refused or failed or not_found" fails when the guard is removed'
  - id: AC3
    statement: 'AC3: a token built from the declared mappers resolves to the tenant through the by-correlation edge identity and resolves to nothing without them -- falsifier: uv run --frozen pytest tests/nodes/node_dev_keycloak_client_effect/test_seam_tenant_claim_to_edge_identity.py -q --no-cov -n 0 -p no:randomly fails when a mapper claim name is renamed'
  - id: AC4
    statement: 'AC4: integrated: on the dev runtime from the branch the node answers ensured with mappers_ensured 2, a token the probe user signs in with carries tenant_id, and the signed-in by-correlation GET answers 200 -- falsifier: the same GET answers 401 before the node runs'
evidence_requirements:
- kind: tests
  description: The node focused tests at the pushed head. The failing controls are the mapper step replaced by a no-op, a renamed mapper claim and a sign-in client outside mapper_clients.
  command: uv run --frozen pytest tests/nodes/node_dev_keycloak_client_effect -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24304-ac1-golden
  description: The mapper golden chain passes at the pushed head, including the no-op control.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_dev_keycloak_client_effect/test_tenant_mappers.py -q --no-cov -n 0 -p no:randomly -k 'golden or idempotent or control'
    cwd: .
- id: dod-omn24304-ac2-guard-error
  description: The refusal and error chain tests pass at the pushed head.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_dev_keycloak_client_effect/test_tenant_mappers.py -q --no-cov -n 0 -p no:randomly -k 'refused or failed or not_found'
    cwd: .
- id: dod-omn24304-ac3-seam
  description: 'The seam test passes at the pushed head: mapper claims resolve to the tenant through the edge identity, and nothing resolves without them.'
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_dev_keycloak_client_effect/test_seam_tenant_claim_to_edge_identity.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24304-ac4-runtime
  description: The node, run on the development host from the pushed branch where the dev overlay is installed, answers ensured with two mappers on the sign-in client. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  binds_ac:
  - AC4
  checks:
  - check_type: command
    check_value: env -u PYTHONPATH uv run --frozen python -m omnimarket.nodes.node_dev_keycloak_client_effect run --lane dev | grep -q "mappers_ensured=2"
    cwd: .
- id: dod-omn24304-integration-proof
  description: The pushed head ran the node tests on a lab host through the lab work runner and exited 0. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24304 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_dev_keycloak_client_effect -q --no-cov
    cwd: .
