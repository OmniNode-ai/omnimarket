ticket_id: "OMN-21090"
title: "Claude Code context service and delegation adapter (compaction mod)"
summary: "TA.18 measured-admission increment (OMN-21119): require a final assembled-input count before a pack hash permits dispatch and refuse input above the routed ceiling. This does not complete the child or epic. This repository change adds the per-session current-context fold of the plan's section 6 boundary algorithm, step 5 (TA.13): a pure handler in node_context_compaction_receipts_fold_compute that joins install-confirm results of one session in any order and with duplicates, keeps the maximal boundary chains and every boundary observation, and reads back the current boundary, what it installed, and each installed activation retired at the next boundary. It is not routed and has no table yet. The epic criteria are read through the Linear API on child tickets and are not bound by this contract. TC.4 additionally offers explicit ledger sequence watermarks: it refuses gaps, duplicates and legacy NULL sequences as stale and reports the contiguous prefix reached; timestamp-pinned replay remains supported. The ownership manifest also declares omninode_internal.compaction_current_context and its cursor sequence ahead of migration delivery; no writer node or SQL is added by the ownership stage."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
