  - id: "dod-omn21090-deploy-pack-probe"
    description: "Hosted-runner probe: build an agent_spawn pack through the packaged node_context_pack_orchestrator over an in-memory bus, against a temporary registry root holding a copy of this checkout's CLAUDE.md and invariant registry, a one-commit git repository for the exemplar and a one-row ledger. Require status ok, lane_rules, invariants, canonical_shapes and exemplar resolved and included, nothing excluded by budget and at most 4000 tokens. At the merge base the invariants tier is unavailable and the probe fails. No lane services or credentials are required."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: |
          set -eu
          export PYTHONDONTWRITEBYTECODE=1
          probe="$(mktemp -d)"
          trap 'rm -rf "$probe"' EXIT
          mkdir -p "$probe/omnimarket/src/omnimarket/nodes/node_architectural_invariant_loop"
          cp CLAUDE.md "$probe/omnimarket/CLAUDE.md"
          cp -R src/omnimarket/nodes/node_architectural_invariant_loop/invariants "$probe/omnimarket/src/omnimarket/nodes/node_architectural_invariant_loop/invariants"
          printf '# Guide\n\n## Operating Rules\n\n### 9. Per-ticket work uses worktrees\n\nWork in a worktree.\n\n### 10. Local gates are mechanically enforced\n\nNever bypass a gate.\n\n### 17. Never override core.hooksPath\n\nLeave hooksPath alone.\n' > "$probe/CLAUDE.md"
          printf '2026-10-20T00:00:00Z | RULING | lane=probe | omnimarket nodes keep topics in contract.yaml\n' > "$probe/ledger.md"
          git -C "$probe/omnimarket" init -q
          git -C "$probe/omnimarket" -c user.name=probe -c user.email=probe@example.invalid commit -q --allow-empty -m "feat(OMN-21090): probe exemplar (#1)"
          git -C "$probe/omnimarket" update-ref refs/remotes/origin/dev HEAD
          printf '{"request":{"profile_name":"agent_spawn","caller_scope":{"repository":"omnimarket","lane_kind":"design-build"}},"access":{"tenant_id":"lab"}}' > "$probe/request.json";
          export PATH="$(uv run --locked python -c 'import sysconfig; print(sysconfig.get_path("scripts"))'):$PATH";
          OMNI_HOME="$probe" ONEX_LEDGER_PATH="$probe/ledger.md" onex node node_context_pack_orchestrator --input "$probe/request.json" --backend event_bus=inmemory --output receipt > "$probe/receipt.json";
          uv run --locked python - "$probe/receipt.json" <<'PY'
          import json
          import sys
          result = json.load(open(sys.argv[1]))["result"]
          tiers = {t["factor"]: t for t in result["tier_statuses"]}
          assert result["status"] == "ok", result["status"]
          assert result["excluded_by_budget"] == [], result["excluded_by_budget"]
          for factor in ("lane_rules", "invariants", "canonical_shapes", "exemplar"):
              assert tiers[factor]["status"] == "resolved" and tiers[factor]["included"], tiers[factor]
          assert sum(result["factor_token_estimates"].values()) <= 4000
          print(result["task_kind"], result["factor_token_estimates"])
          PY
        cwd: "${OMNI_HOME}/omnimarket"
