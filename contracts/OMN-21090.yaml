  - id: "dod-omn21090-deploy-required-parity-evidence"
    description: "Hosted-runner probe reads the published parity module at the checked-out head and executes its missing-text negative control. The old module returns no missing-text mismatch and fails. No runtime host or application credential is required."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: |-
          set -euo pipefail
          probe=$(mktemp -d)
          trap 'rm -rf "$probe"' EXIT
          gh api "repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_projection_work_ledger/parity.py?ref=$(git rev-parse HEAD)" --jq .content | base64 -d > "$probe/parity.py"
          uv run --frozen python - "$probe/parity.py" <<'PYPROBE'
          import hashlib
          import runpy
          import sys
          from datetime import UTC, datetime
          compare = runpy.run_path(sys.argv[1])["compare"]
          raw = "2026-10-01T12:00:00Z | STATUS | lane=probe | evidence"
          rid = hashlib.sha256(raw.encode()).hexdigest()
          result = compare(file_rows=[raw], projection_rows={rid: raw[:20]}, projection_state={}, since=datetime(2026, 10, 1, tzinfo=UTC), until=datetime(2026, 10, 2, tzinfo=UTC))
          assert not result.exact
          assert [(m.kind.value, m.key) for m in result.mismatches] == [("row_text_missing_in_projection", rid)]
          PYPROBE
        cwd: "${OMNI_HOME}/omnimarket"

  - id: "dod-omn21090-compaction-absolute-deadline"
    description: >-
      Compaction implementation evidence: the same contract-bound handler on the
      in-memory bus and broker-semantics binding spends publication time from the
      remaining reply budget, refuses a late package without prepared or activated
      emissions, closes both subscriptions on expiry, and rejects a revision probe
      for another session or barrier. The ticket's live dev-bus package proof and
      epic child-state criteria remain outstanding; these tests do not assert them.
    source: "manual"
    binds_ac: ["AC2"]
    checks:
      - check_type: "test_passes"
        check_value: "env UV_FROZEN=true uv run pytest tests/nodes/node_context_compaction_orchestrator/test_compaction_pack_build_deadline.py -q -n 0 --no-cov"
  - id: "dod-omn21090-deploy-compaction-deadline"
    description: >-
      Hosted-runner offline deployment probe of the packaged compaction handler
      using both local bus bindings. A slow publish must reduce the terminal wait,
      a late terminal must never activate, and expired subscriptions must close.
      The probe fails on a merge base without the deadline tests or deadline fix.
      It needs no services or credentials and is not live dev-runtime proof.
    source: "manual"
    checks:
      - check_type: "command"
        check_value: "uv run --frozen pytest tests/nodes/node_context_compaction_orchestrator/test_compaction_pack_build_deadline.py -q -n 0 --no-cov"
