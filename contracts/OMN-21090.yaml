  - id: "dod-omn21090-deploy-current-context-probe"
    description: "Hosted-runner probe: run the packaged node_context_install_confirm_compute through `onex node` over an in-memory bus over a P6-shaped custom compaction and then the same capture grown by a native compaction, fold both results in both orders through the packaged current-context handler, and require the native boundary current with the custom activation retired there. At the merge base the handler module does not exist and the probe fails. No lane services or credentials are required."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: |
          set -eu
          export PYTHONDONTWRITEBYTECODE=1
          probe="$(mktemp -d)"
          trap 'rm -rf "$probe"' EXIT
          uv run --locked python - "$probe" <<'PY'
          import sys
          import uuid
          from omnimarket.models.context_install_confirm import ModelCapturedTranscriptRecord as R, ModelInstallConfirmRequest as Q, ModelPublishedActivation as A
          from omnimarket.models.context_pack_render import ModelContextPackRenderMessage as M
          from omnimarket.nodes.node_context_install_confirm_compute.handlers.handler_context_install_confirm import observed_messages_hash as h
          a = uuid.uuid4()
          msgs = [("user", "legend"), ("assistant", "ok"), ("user", "trailer\nactivation_id: %s" % a)]
          t = "2026-10-17T12:00:10Z"
          rs = [R(uuid="p0", record_type="user", role="user", text="hi", prompt_source="sdk", timestamp="2026-10-17T12:00:00Z"),
                R(uuid="b1", record_type="system", subtype="compact_boundary", logical_parent_uuid="p0", timestamp=t)]
          p = "b1"
          for i, (role, text) in enumerate(msgs):
              rs.append(R(uuid="r%d" % i, parent_uuid=p, record_type=role, role=role, text=text, timestamp=t)); p = "r%d" % i
          rs.append(R(uuid="c1", parent_uuid=p, record_type="user", role="user", text="<local-command-caveat>", is_meta=True, timestamp="2026-10-17T12:00:11Z"))
          grown = rs + [R(uuid="u2", parent_uuid="c1", record_type="user", role="user", text="next", prompt_source="sdk", timestamp="2026-10-17T12:00:20Z"),
                        R(uuid="b2", record_type="system", subtype="compact_boundary", logical_parent_uuid="u2", preserved_uuids=("k0",), timestamp="2026-10-17T12:00:30Z"),
                        R(uuid="s2", parent_uuid="b2", record_type="user", role="user", text="native summary", is_compact_summary=True, timestamp="2026-10-17T12:00:30Z"),
                        R(uuid="k0", parent_uuid="s2", record_type="user", role="user", text="kept", timestamp="2026-10-17T12:00:30Z")]
          act = A(activation_id=a, installed_messages_hash=h(M(role=r, text=x) for r, x in msgs), published_at="2026-10-17T12:00:05Z")
          for name, c in (("early", rs), ("late", grown)):
              open("%s/%s.json" % (sys.argv[1], name), "w").write(Q(session_id="s", records=tuple(c), activations=(act,)).model_dump_json())
          open("%s/activation" % sys.argv[1], "w").write(str(a))
          PY
          export PATH="$(uv run --locked python -c 'import sysconfig; print(sysconfig.get_path("scripts"))'):$PATH";
          onex node node_context_install_confirm_compute --input "$probe/early.json" --backend event_bus=inmemory --output receipt > "$probe/early.out.json";
          onex node node_context_install_confirm_compute --input "$probe/late.json" --backend event_bus=inmemory --output receipt > "$probe/late.out.json";
          uv run --locked python - "$probe" <<'PY'
          import json
          import sys
          import uuid
          from omnimarket.models.context_install_confirm import ModelInstallConfirmResult as S
          from omnimarket.nodes.node_context_compaction_receipts_fold_compute.handlers.handler_context_current_context_fold import HandlerContextCurrentContextFold as F
          from omnimarket.models.context_compaction_fold import ModelCurrentContextProjectionRequest as P
          d = sys.argv[1]
          a = uuid.UUID(open("%s/activation" % d).read())
          early, late = (S.model_validate(json.load(open("%s/%s.out.json" % (d, n)))["result"]) for n in ("early", "late"))
          views = [F().handle(P(events=e)).current for e in ((early, late), (late, early), (late, early, late))]
          assert views[0] == views[1] == views[2], views
          v = views[0]
          assert v.state.value == "current" and v.boundary_uuid == "b2" and v.kind.value == "native", v
          [r] = v.retirements
          assert (r.activation_id, r.installed_at_boundary_uuid, r.retired_at_boundary_uuid) == (a, "b1", "b2"), v
          print(v.state.value, v.boundary_uuid, len(v.retirements))
          PY
        cwd: "${OMNI_HOME}/omnimarket"
