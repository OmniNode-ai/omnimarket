schema_version: 1.0.0
ticket_id: OMN-22623
title: The install-confirm trigger accepts the projected acknowledgement key, so session-content applied events stop going to the dead-letter topic
summary: The runtime adds projected=true to every projection terminal payload; the install-confirm trigger's input model forbids extra keys, so each session-content applied event is refused at dispatch and written to the dead-letter topic at about 150 records a minute. The model declares projected as the one runtime acknowledgement and still refuses every other key.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn22623-projected-acknowledgement
  statement: ModelSessionContentAppliedEvent validates the payload the runtime publishes (event_id, rows_upserted, projected) and still refuses an unknown key, projected set to false and a payload missing its own facts.
  acceptance:
  - id: AC1
    statement: 'AC1: the recorded runtime payload (event_id, rows_upserted, projected) validates and drives the trigger handler to request_ready, and the same test fails on the model before the change with projected extra_forbidden -- falsifier: uv run --frozen pytest tests/nodes/node_context_install_confirm_trigger_effect/test_recorded_applied_event_omn22478.py -q --no-cov'
  - id: AC2
    statement: 'AC2: an unknown key, projected=false and a missing event_id or rows_upserted are each still refused -- falsifier: uv run --frozen pytest tests/nodes/node_context_install_confirm_trigger_effect/test_recorded_applied_event_omn22478.py -q --no-cov -k error'
- id: req-omn22623-dlq-drain
  statement: After the dev roll of the image carrying the change, applied events reach the trigger and none is dead-lettered.
  acceptance:
  - id: AC3
    statement: 'AC3: after the dev roll of the omnimarket image carrying the change, no new record whose original_topic is projection-session-content-applied reaches onex.dlq.omnibase-infra.events.v1 in 10 minutes -- falsifier: a bounded read of the topic end for 10 minutes after the roll that counts records for that original_topic and prints a number above zero on the unfixed image'
evidence_requirements:
- kind: tests
  description: The recorded runtime payload validates and the model stays strict
  command: uv run --frozen pytest tests/nodes/node_context_install_confirm_trigger_effect -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn22623-recorded-payload
  description: Replays the payload recorded from the dead-letter topic through the model and the trigger handler, and checks the refusals that keep the model strict.
  source: manual
  binds_ac:
  - AC1
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_context_install_confirm_trigger_effect -q --no-cov
    cwd: .
