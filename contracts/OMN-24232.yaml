schema_version: 1.0.0
ticket_id: OMN-24232
title: Cap the uv cache size on lab host disks
summary: 'node_host_retention_effect gains a size cap for the uv cache class: when the overlay declares a cap block (cap_gib, archive_bucket, keep_days) and the cache still holds more than cap_gib after uv cache prune, whole direct children of the cache archive bucket are evicted oldest first until the cache is at or under the cap. An entry is kept when any file in it has more than one hard link (a virtual environment links it), when anything in it changed inside keep_days, when a live process names it, or when it is not a plain directory. The bucket name is bounded by the contract (uv_archive_bucket_names), the cap and keep window are overlay values. On h101 the uv cache measured about 258 GiB on 2026-11-13 and uv cache prune freed 8.4 GiB of it.'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24232-uv-cache-cap
  statement: The host retention pass brings a uv cache under its declared cap by evicting unlinked archive entries oldest first, from overlay values only, and never an entry a virtual environment links, a recent entry or an entry a live process names.
  acceptance:
  - id: AC1
    statement: 'AC1: a uv cache entry with a declared cap removes unlinked archive entries oldest first until the cache is at or under the cap, and keeps an entry a hardlink of any file ties to a venv, an entry changed inside keep_days and an entry a live process names -- falsifier: pytest tests/nodes/node_host_retention_effect/test_host_retention_uv_cap.py -q'
  - id: AC2
    statement: 'AC2: a cap below min_gib, a cap without keep_days at or above the contract floor, or an archive bucket the contract does not name is refused and removes nothing -- falsifier: pytest tests/nodes/node_host_retention_effect/test_host_retention_uv_cap.py -q -k "refused"'
  - id: AC3
    statement: 'AC3: the real archive adapter reads the cache layout uv writes (a hardlinked file reads as linked) and the overlay example loads -- falsifier: pytest tests/nodes/node_host_retention_effect/test_host_retention_uv_cap.py -q -k seam'
  - id: AC4
    statement: 'AC4: integrated: on lab host h101 the retention pass run from the branch brings the uv cache to its declared cap with no errors, a following uv install of a removed package succeeds, and free disk on h101 reads higher afterwards -- falsifier: the pass result on h101 lists errors, or du of the uv cache stays above the cap, or the install after eviction fails'
evidence_requirements:
- kind: tests
  description: The host retention tests pass at the pushed head.
  command: uv run pytest tests/nodes/node_host_retention_effect -q -p no:randomly --no-cov
