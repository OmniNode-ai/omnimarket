schema_version: 1.0.0
ticket_id: OMN-24033
title: The settings store's broker service keeps its network connection across restarts
summary: The container unit installer node_host_installer_container_units kept the overlay store broker running with docker start -a but declared no network or port, so a broker that came back from a restart with no network attachment went unnoticed. A unit now declares its network, published ports and optional create settings in the node overlay, the rendered unit connects the network before every start, and an install is refused with nothing written when the container is on another network, misses a declared port or runs with no network attachment. The overlay with the values is a separate pull request in the overlays repository, held as a draft until this code is on dev.
is_seam_ticket: true
interface_change: true
interfaces_touched:
- public_api
requirements:
- id: req-omn24033-container-network
  statement: A container unit declares its network and published ports in the node overlay, and an install whose container has no network attachment is refused.
  acceptance:
  - id: AC1
    statement: 'AC1: an install of a container unit is refused, with no unit written, when its container is on another network, does not publish a declared port, prints no document or is running with no network attachment -- falsifier: uv run pytest tests/nodes/node_host_installer_container_units -q -n 0 --no-cov -p no:cacheprovider fails the control test_a_container_unit_whose_container_has_no_network_is_refused_at_install when the network check is removed'
  - id: AC2
    statement: 'AC2: the unit declares its network and port from the node overlay, connects the network before every start, and creates an absent container from declared settings; a failing create writes nothing -- falsifier: uv run pytest tests/nodes/node_host_installer_container_units -q -n 0 --no-cov -p no:cacheprovider -k "create or exec_start_pre or network"'
  - id: AC3
    statement: 'AC3: integrated: the broker and settings database units on h053, reinstalled through the installer from the merged revision, each read the broker port answering after two restarts -- falsifier: ss -ltn on h053 shows no listener on the broker port after either restart, or the unit file holds no network connect line'
evidence_requirements:
- kind: tests
  description: The container unit tests pass at the pushed head.
  command: uv run pytest tests/nodes/node_host_installer_container_units -q -n 0 --no-cov -p no:cacheprovider
