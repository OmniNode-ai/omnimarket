schema_version: 1.0.0
ticket_id: OMN-23452
title: Writing a work-log entry finds the message bus from the declared settings on every machine
summary: node_work_ledger_emit_effect dials the broker its contract overlay declares (event_bus, lane dev, the hook-edge lane) through resolve_dialable_broker, as the other bus nodes do, and refuses with a typed result naming the overlay when none is declared. KAFKA_BOOTSTRAP_SERVERS and the local env file are no longer read for the broker.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23452-declared-broker
  statement: The work-ledger emit resolves its broker from the declared lane and never from the environment, and its row envelope matches what the projector reads.
  acceptance:
  - id: AC1
    statement: 'AC1: node_work_ledger_emit_effect resolves its broker from the declared hook-edge lane contract (the same resolution the other bus effect nodes use), with a typed refusal naming the missing declaration when there is none, and a test that fails at the merge base with the environment variable unset -- falsifier: that test at the merge base'
  - id: AC2
    statement: 'AC2: the seam between the emit node and the ledger projector has a test on the in-memory bus and the real broker that fails when the row envelope changes shape -- falsifier: rename one envelope field and run it'
  - id: AC3
    statement: 'AC3: integrated: on h051 and h053, with no KAFKA_BOOTSTRAP_SERVERS in the environment, the emit node writes one row and it is read back from work_ledger_rows -- falsifier: the row id queried in the projection from each host'
evidence_requirements:
- kind: tests
  description: The declared-broker tests and the emit-to-projector seam test of node_work_ledger_emit_effect
  command: uv run --frozen pytest tests/unit/nodes/node_work_ledger_emit_effect/test_declared_broker_omn23452.py tests/unit/nodes/node_work_ledger_emit_effect/test_emit_projector_seam_omn23452.py -q --no-cov -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23452-declared-broker
  description: Runs the declared-broker tests. The test module imports handler_work_ledger_declared_broker_emit and patches declared_kafka_bus, both absent at the merge base, so the file fails there; with the variable unset the base answers KeyError for KAFKA_BOOTSTRAP_SERVERS.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/nodes/node_work_ledger_emit_effect/test_declared_broker_omn23452.py -q --no-cov -p no:randomly
    cwd: .
- id: dod-omn23452-seam
  description: Runs the emit-to-projector seam test over the eleven row types on the in-memory bus; the control renames raw_row in the published message and the projector refuses it.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/nodes/node_work_ledger_emit_effect/test_emit_projector_seam_omn23452.py -q --no-cov -p no:randomly
    cwd: .
- id: dod-omn23452-existing-emit-tests
  description: Runs the emit node's existing unit tests, which the declared-broker wiring must leave green.
  source: manual
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/nodes/node_work_ledger_emit_effect -q --no-cov -p no:randomly
    cwd: .
- id: dod-omn23452-integration-proof-lab
  description: Runs the declared-broker and seam tests at the pushed head on a lab host through the lab work runner. Hosted CI cannot reach the lab runner, so only the local Done gate runs this unbound item. The real-broker reading of AC3 (one row emitted on h051 and on h053 with no broker variable, read back from work_ledger_rows) is in the pull request body.
  source: manual
  binds_ac:
  - AC3
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: 'env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23452 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/nodes/node_work_ledger_emit_effect/test_declared_broker_omn23452.py tests/unit/nodes/node_work_ledger_emit_effect/test_emit_projector_seam_omn23452.py -q --no-cov -p no:randomly'
    cwd: .
