  statement: "onex setup says, before the model questions, that an exhausted model ladder returns the task to Claude Code with no savings."
  acceptance:
  - id: AC1
    statement: 'AC1: `onex setup` prints the notice before the model questions, in both interactive and unattended runs -- falsifier: an `onex setup` test asserting the notice line precedes the first model prompt'
