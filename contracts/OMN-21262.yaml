schema_version: 1.0.0
ticket_id: OMN-21262
title: "onex setup tells the developer what happens when none of their models answers"
summary: "onex setup prints one notice before the first model question in an interactive run and before any step in an unattended run: if none of the chosen models can finish a task, the task goes back to Claude Code, shows no savings, and any attempts are still billed by their provider. The text is one constant in the setup command."
