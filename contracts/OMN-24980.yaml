        topic: onex.cmd.omnimarket.delegate-skill.v1
        consumer_group: local.omnimarket.node_delegate_skill_orchestrator.consume.1.3.0.__i.runtime-main.__t.onex.cmd.omnimarket.delegate-skill.v1
        terminal_class: queued_not_started
        records_ahead: 6
        backlog_records: 7
        recorded_at: '2026-11-16T23:35:46Z'
        limit: Same symptom as run 27f4e945-e16e-4cac-a4d7-b1388dfac169 (no terminal before the wait ended), one cause class
