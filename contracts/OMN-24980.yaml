    warning, and the remaining pinned smoke command is rendered.
  source: manual
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_delegation_health_compute/test_local_share_zero_omn24980.py -q --no-cov
    cwd: .
- id: dod-omn24980-receipt-proof-test
  description: The deployed proof accepts one attempt from the changed rung with more than 8192 input tokens and refuses
    an in-process run, a failed top-level status or exit code, a failed terminal, a skipped local candidate, another local
    rung, a prompt metered at 8192 tokens or below and the recorded 373-token run answered by local-omnipc2-chat. Its command
    is checked to name the dev lane, the bus and the deployed locus, and a command naming another lane is refused.
  source: manual
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_delegation_routing_reducer/test_contract_proof_omn24980.py -q --no-cov
    cwd: .
