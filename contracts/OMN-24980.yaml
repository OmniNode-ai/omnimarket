- id: dod-omn24980-local-ceiling-test
  description: The public reducer walks the full packaged ladder, retains the output reserve for every local use_for class
    with and without an overlay, and tests escalation, research and reasoning through the large-window rungs. This is a routing
    correction, not missing-terminal-cause evidence.
  source: manual
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_delegation_routing_reducer/test_local_rung_context_ceiling_omn24980.py -q
      --no-cov
    cwd: .
