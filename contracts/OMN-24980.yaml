schema_version: 1.0.0
ticket_id: OMN-24980
title: onex delegate with a one-line summarise task ends with a terminal from a local model, and the endpoints that serve no model are restored or corrected
summary: A summarise prompt above 8192 tokens was dropped from the local tier because the packaged ladder declared max_context_tokens 8192 on local-heavy-reasoning (and 65536 on local-coder) while the endpoint behind both serves 131072, so a hosted model answered it. The packaged ceilings are the served window, and what a prompt may be before a local rung is offered stays the code budget overlay's input_ceilings. This pull request carries the routing criterion (AC1); the overlay host test of AC3 is in the overlays repository and the other criteria are read on the lab (see the unbound items).
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24980-local-route
  statement: A summarise delegation on the dev runtime is answered by a local model, including a prompt above 8192 tokens.
  acceptance:
  - id: AC1
    statement: 'AC1: the cause of the missing terminal is named from the bus (consumer of the delegate command topic, its registration in the dev runtime, consumer group lag, handler errors) and fixed at its source with a test built from the recorded failure that fails on the base commit and passes on the fix -- falsifier: uv run pytest on the named test file in the owning repository fails against the base commit'
evidence_requirements:
- kind: tests
  description: The focused routing test of the local rung ceilings.
  command: env -u PYTHONPATH uv run --frozen pytest tests/nodes/node_delegation_routing_reducer/test_local_rung_context_ceiling_omn24980.py -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24980-ac1-local-ceiling-test
  description: The recorded 44290-character summarise prompt is offered to the local rung and both local rungs declare the served window; the test fails on the base commit.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_delegation_routing_reducer/test_local_rung_context_ceiling_omn24980.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24980-integration-proof
  description: Hosted CI cannot reach a lab host, so only the local Done gate runs this unbound check. It runs the branch ladder on a lab host through onex lab-work, delegates a summarise prompt of about 15000 tokens in-process against the live first lab model host, and fails unless the receipt of the run names the rung local-heavy-reasoning (read on 2026-11-16, the branch ladder answers it there and the base ladder answers it on local-omnipc2-chat).
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: >-
      onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24980 --kind test -- sh -c 'S=/tmp/onex-state-24980; rm -rf "$S"; DELEGATION_ROUTING_TIERS_PATH="$PWD/src/omnimarket/configs/routing_tiers.yaml" "$OMNI_HOME/omnibase_infra/scripts/onex" delegate "Summarize in one line: $(yes "lane host overlay endpoint model context window delegation route terminal receipt queue." | head -n 900)" --task-type summarization --bus inmemory --locus in-process --state-root "$S" >/dev/null && grep -rq "backend_id.: .local-heavy-reasoning" "$S/runs"'
    cwd: .
