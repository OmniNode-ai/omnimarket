        on 2026-11-17
      scope: the dev runtime mounts a routing ladder (sha256 22269ddea166, DELEGATION_ROUTING_TIERS_PATH=/app/config/delegation/routing_tiers.yaml)
        with local-heavy-reasoning at 8192; done when the mounted ladder is the packaged one and the integration proof passes
