    terminal (run, topic, consumer group, terminal class). It does not establish or fix the cause: AC1 stays OPEN. Unbound: a passing bound check would count as AC1 met at the Done gate.'
  source: manual
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_delegation_routing_reducer/test_contract_proof_omn24980.py -q --no-cov -k
