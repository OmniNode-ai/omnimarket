- id: dod-omn24980-integration-proof
  description: 'OPEN until the dev mounted ladder is durably updated. Proves routing only: it binds no acceptance criterion
    and says nothing about the missing-terminal cause of AC1. Uses the dev bus and runtime; the check reads the stdout envelope
    of onex delegate --json (not the runs receipt file): top-level success, dispatched handler locus, completed workflow and
    completed terminal, and exactly one accepted attempt from a local-tier rung. A non-local candidate cannot satisfy it.
    No packaged-file override or in-process fallback is used.'
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: 'env "$OMNI_HOME/omnibase_infra/scripts/onex" delegate "$(python3 -c ''print("Summarize in one line: " +
      "x" * 44290)'')" --task-type summarization --ticket OMN-24980 --caller-lane route-proof-24980 --bus kafka --lane dev
      --locus deployed-lane --state-root "$OMNI_HOME/.onex_state" --json > "$OMNI_HOME/.onex_state/route-proof-24980.json"
      && python3 -c ''import json,sys; r=json.load(open(sys.argv[1])); assert r["status"] == "success" and r["exit_code"]
      == 0; s=r["result"]; assert s["handler_locus"] == "dispatched" and s["workflow_result"] == "completed" and s["exit_code"]
      == 0; t=s["terminal_payload"]["payload"]; assert t["status"] == "completed"; a=[x for x in t["attempts"] if x["acceptance_decision"]
      == "accept" and x["quality_gate_passed"]]; assert len(a) == 1 and a[0]["tier"] == "local"; print("PASS: dispatched terminal
      accepted a local rung", a[0]["backend_id"])'' "$OMNI_HOME/.onex_state/route-proof-24980.json"'
    cwd: .
