schema_version: 1.0.0
ticket_id: OMN-24980
title: onex delegate with a one-line summarise task ends with a terminal from a local model, and the endpoints that serve
  no model are restored or corrected
summary: 'This draft corrects the packaged input budget and tests the public routing reducer; it does not establish the missing-terminal
  cause and does not fix it. Both local rungs reserve 65536 output tokens from the served 131072-token window (GET /v1/models
  on the endpoint both rungs read, max_model_len 131072, read 2026-11-17), independently of optional overlay ceilings. The
  unfinished local-share alarm is split out; its reader and scheduled check remain open. AC1: OPEN. No owner re-scope is claimed.
  The cause of run 27f4e945-e16e-4cac-a4d7-b1388dfac169 cannot be recovered (its log window 19:45Z to 19:56Z retains zero
  rows), so this contract carries a captured reproduction of the same symptom instead: run 13dcf955-9911-48e0-9185-753ecdd1fe92
  on the dev lane ended with no delegation terminal (terminal_class queued_not_started, 6 records ahead of the command, backlog
  7) on topic onex.cmd.omnimarket.delegate-skill.v1, consumer group local.omnimarket.node_delegate_skill_orchestrator.consume.1.3.0.__i.runtime-main.__t.onex.cmd.omnimarket.delegate-skill.v1.
  That run shows one cause class (queue wait ahead of a single-slot local endpoint); it is not shown to be the cause of 27f4e945
  and no source fix is made here. AC2: OPEN. The endpoint on port 8001 has no declared serving unit and answers no model-list
  call (read 2026-11-17). AC3: OPEN. Overlay endpoint host validation is outside this repository. Dev runtime read on 2026-11-16:
  DELEGATION_ROUTING_TIERS_PATH=/app/config/delegation/routing_tiers.yaml; the pinned file and the installed packaged ladder
  both have sha256 22269ddea166de0f3c10a435967a81b71764e0711d32bbc7a00d3b46f63f14e9, with local-coder=65536 and local-heavy-reasoning=8192,
  so this change is inert on dev until its mounted ladder is updated through its owner and the deployed proof can validate
  it. The in-process base answer local-omnipc2-chat is a local spread peer and does not reproduce the earlier hosted answer.
  Follow-ups with no owner ticket yet (the ticket text is carried in the lane report of the change that records this): updating
  the dev runtime''s mounted ladder to the packaged input budget, and the scheduled local-share alarm (its reader and page)
  that this change split out.'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24980-local-route
  statement: A summarise delegation on the dev runtime is answered by a local model, including a prompt above 8192 tokens.
  acceptance:
  - id: AC1
    statement: 'AC1: the cause of the missing terminal is named from the bus (consumer of the delegate command topic, its
      registration in the dev runtime, consumer group lag, handler errors) and fixed at its source with a test built from
      the recorded failure that fails on the base commit and passes on the fix -- falsifier: uv run pytest on the named test
      file in the owning repository fails against the base commit'
  - id: AC2
    statement: 'AC2: the endpoint on port 8001 is served by a named unit and answers a model-list call, or its entry is corrected
      -- falsifier: a model-list call to the endpoint from a lab host does not return 200'
  - id: AC3
    statement: 'AC3: no endpoint entry of the declared overlay names a host that serves no model -- falsifier: an overlay
      test fails when an endpoint host serves no model'
