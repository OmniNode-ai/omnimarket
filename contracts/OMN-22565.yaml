schema_version: "1.0.0"
ticket_id: OMN-22565
title: "Pure-import models for six small node overlays held in the overlay home"
summary: >-
  Six small node overlays (the lab SLI pack switch, the two sweep runtime hosts, the integration sweep probe targets,
  the lab disk hygiene census path and the duplicate guard generated paths) load through closed models that import
  pydantic alone, so the overlay home can validate them without installing omnibase_core. No value lives in the repository.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn22565-node-overlay-models
    statement: Each of the six overlays loads whole through one closed pydantic-only model.
    acceptance:
      - id: AC1
        statement: 'AC1: each overlay validates through its model, a stray key refuses and a blank field refuses -- falsifier: uv run --frozen pytest tests/unit/models/test_node_overlay_documents_omn22478.py -q --no-cov'
      - id: AC2
        statement: 'AC2: the models module imports with pydantic alone and imports no omnibase package -- falsifier: uv run --frozen pytest tests/unit/models/test_node_overlay_documents_omn22478.py::test_the_models_import_with_pydantic_alone -q --no-cov'
evidence_requirements:
  - kind: tests
    description: Each overlay loads the way the overlay home loads it, and a wrong document refuses.
    command: uv run --frozen pytest tests/unit/models/test_node_overlay_documents_omn22478.py -q --no-cov
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-omn22565-node-overlay-models
    description: Each of the six overlays loads through its model, a wrong document refuses, and the module imports with pydantic alone.
    source: manual
    execution_scope: hosted_and_local
    binds_ac: [AC1, AC2]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/models/test_node_overlay_documents_omn22478.py -q --no-cov
        cwd: .
  - id: dod-omn22565-integration-proof
    description: >-
      The pushed head ran the models suite on a lab host through the lab work runner and exited 0. Hosted CI cannot
      reach the lab, so only the local Done gate runs this check.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: 'uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-22565 -- uv run --frozen pytest tests/unit/models/test_node_overlay_documents_omn22478.py -q --no-cov'
        cwd: .
