schema_version: 1.0.0
ticket_id: OMN-23239
title: The reading writer reads each distinct ledger query once per cycle
summary: The reading writer's replay check asked the same ledger query once for every computed piece, each ask a process and a bus round trip that can meet a stalled read node. A cycle now reads each distinct query once, keeps only answers that were read, and starts empty for every window run.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23239-one-read-per-query
  statement: A reading writer cycle makes one read for each distinct ledger query, never keeps a failed read, and never carries answers into the next run.
  acceptance:
  - id: AC1
    statement: 'AC1: a cycle makes one read of the reading rows however many pieces are computed -- falsifier: `uv run pytest tests/nodes/node_reading_writer_effect/test_reading_writer.py::test_a_cycle_reads_the_reading_rows_once_not_once_per_piece`'
  - id: AC2
    statement: 'AC2: a failed read is not kept, so the next piece reads again and a failure is never reused as an answer -- falsifier: `uv run pytest tests/nodes/node_reading_writer_effect/test_reading_writer.py::test_a_failed_read_is_not_kept_so_the_next_piece_reads_again`'
  - id: AC3
    statement: 'AC3: a second run of the writer reads again and sees the rows the first wrote -- falsifier: `uv run pytest tests/nodes/node_reading_writer_effect/test_reading_writer.py::test_a_second_run_reads_again_and_sees_the_rows_the_first_wrote`'
evidence_requirements:
- kind: tests
  description: The reading writer tests pass.
  command: uv run --frozen pytest tests/nodes/node_reading_writer_effect/test_reading_writer.py -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23239-ac1-one-read
  description: With the fix a three-piece cycle reads the reading rows once; at the merge base it reads them twice and the test fails.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_reading_writer_effect/test_reading_writer.py -q --no-cov -k a_cycle_reads_the_reading_rows_once
    cwd: .
- id: dod-omn23239-ac2-failure-not-kept
  description: An injected TimeoutError on the first read of the reading rows fails that piece's replay check only; the next piece reads again and writes.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_reading_writer_effect/test_reading_writer.py -q --no-cov -k a_failed_read_is_not_kept
    cwd: .
- id: dod-omn23239-ac3-second-run
  description: A second run of the same writer reads the reading rows again and reports the first run's rows as already written.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_reading_writer_effect/test_reading_writer.py -q --no-cov -k a_second_run_reads_again
    cwd: .
- id: dod-omn23239-integration-proof
  description: Run the cycle-read test at the pushed head on a lab host. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23239 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_reading_writer_effect/test_reading_writer.py -q --no-cov -k a_cycle_reads_the_reading_rows_once
    cwd: .
