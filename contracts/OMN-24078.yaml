schema_version: 1.0.0
ticket_id: OMN-24078
title: The graphics card power limit node reaches the lab machines over the message bus
summary: The GPU power caps node (node_gpu_power_caps_effect) gains a lab_work backend. For a request naming a lab host it sends one typed lab work unit over the bus to that host's lab-work serve, whose command is the node's own command line run there with --local (the real nvidia-smi backend on that machine); the host prints one result line and the node returns it as its typed result. No ssh key enters the runtime container. A host the overlay does not name is refused before any send; an unanswered unit is a typed transport refusal with no card change claimed.
is_seam_ticket: true
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24078-gpu-power-caps-node
  statement: The GPU power caps of a lab host are applied and read back by a node whose overlay declares the hosts and the transport, with typed refusals and a failing control for each reading.
  acceptance:
  - id: AC1
    statement: "AC1: with the lab-work backend chosen by overlay, the GPU power caps node sends one typed lab work unit to the named host over the bus, reads the host's result line back into its own typed result, and refuses a host the overlay does not name before any send -- falsifier: uv run pytest tests/unit/nodes/node_gpu_power_caps_effect -q -k lab_work fails at the merge base"
  - id: AC2
    statement: "AC2: seam tests hold the node's lab work unit to the lab work unit request model and topics, the node's overlay to its host-side command line, and the node's broker grants to the lab work topics, and fail when either side changes shape -- falsifier: uv run pytest tests/unit/nodes/node_gpu_power_caps_effect -q -k seam fails when a lab work topic or a request field is renamed in the fixture"
  - id: AC3
    statement: "AC3: a golden chain and an error chain of the node over the in-memory bus with a simulated host pass, and a host that does not answer ends with a typed refusal and no card change -- falsifier: uv run pytest tests/unit/nodes/node_gpu_power_caps_effect -q -k chain fails without the lab work backend"
  - id: AC4
    statement: "AC4: integrated: in the running dev runtime, one request for h201 and one for h202 returns one row per card and nvidia-smi on both machines reads 450 W for the large card and 300 W for each of the other two cards -- falsifier: the node's result row differs from the nvidia-smi reading, or the run refuses"
evidence_requirements:
- kind: tests
  description: The node's focused tests pass at the pushed head.
  command: uv run --frozen pytest tests/unit/nodes/node_gpu_power_caps_effect -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24078-ac1
  description: 'AC1: the lab_work tests pass on the branch; the unit sent to the named host, the result line read back, an unknown host refused before a send, an unanswered unit refused as transport_unavailable, and a timed-out unit or an unreadable result reported as failed.'
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/nodes/node_gpu_power_caps_effect -q --no-cov -n 0 -p no:randomly -k lab_work
    cwd: .
- id: dod-omn24078-ac2
  description: 'AC2: the seam tests hold the unit to the lab work request model, the grants to the lab work topics, and the host command of the overlay to the command line of the node run with a fake nvidia-smi, and fail when a key or topic is renamed.'
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/nodes/node_gpu_power_caps_effect -q --no-cov -n 0 -p no:randomly -k seam
    cwd: .
- id: dod-omn24078-ac3
  description: 'AC3: the golden chain, the error chains and the injected wrong-host break run on the in-memory bus with a real lab-work host and a real git origin.'
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/nodes/node_gpu_power_caps_effect -q --no-cov -n 0 -p no:randomly -k chain
    cwd: .
- id: dod-omn24078-ac4
  description: 'hosted proxy for AC4: the node suite passes here; the running-runtime reading of both hosts is posted as a pull request comment naming the head.'
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/nodes/node_gpu_power_caps_effect -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24078-integration-proof
  description: the focused tests run on a lab host at the pushed head; hosted CI cannot reach the lab, so only the local Done gate runs this unbound check
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24078 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/nodes/node_gpu_power_caps_effect -q --no-cov -n 0 -p no:randomly
