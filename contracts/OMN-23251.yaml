schema_version: 1.0.0
ticket_id: OMN-23251
title: The daily parity receipt writer runs from omnimarket and appends a fresh receipt while the day's newest receipt shows missing or unexplained above 0
summary: node_work_ledger_parity_receipt_effect is the daily work-ledger parity receipt writer moved from the ledger-publish unit (its parity_receipt function). It skips a day only when the day's newest receipt shows missing=0 and unexplained=0.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23251-skip-rule
  statement: The writer appends a fresh receipt for a day whose newest receipt shows missing or unexplained above 0, and still skips a day whose newest receipt is clean.
  acceptance:
  - id: AC2
    statement: "AC2: the writer appends a fresh receipt for a day whose newest receipt shows missing or unexplained above 0, and still skips a day whose newest receipt is clean -- falsifier: uv run pytest tests/nodes/node_work_ledger_parity_receipt_effect -q -k planted"
evidence_requirements:
- kind: tests
  description: The parity receipt writer node tests at the pushed head.
  command: uv run --frozen pytest tests/nodes/node_work_ledger_parity_receipt_effect -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
- id: dod-omn23251-skip-rule
  description: A planted missing=1 receipt gets a new receipt, a planted unexplained receipt gets one, and a planted clean receipt gets none. With the old skip rule put back, twelve of these tests fail.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_work_ledger_parity_receipt_effect -q --no-cov -n 0 -p no:randomly -k planted
    cwd: .
- id: dod-omn23251-integration-proof
  description: The pushed head ran the parity receipt writer node tests on a lab host through the lab work runner and exited 0. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23251 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_work_ledger_parity_receipt_effect -q --no-cov
    cwd: .
