schema_version: 1.0.0
ticket_id: OMN-22699
title: The floor publish cycle records the seconds each step and phase took, and the slow step is brought under a 4 minute cycle
summary: The factory floor publisher took 6 to 13 minutes per cycle against 2 to 3.5 minutes in the morning, and its status named no step's duration. Each input step, the after-publish step and each phase of a run (input steps, delegation read, copy, history prune, after-publish) now carry the seconds they took; the served publish-status.json names each step's seconds, and the heartbeat file names the cycle total, every phase, every step and the slowest step. The run's log line carries the same.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn22699-cycle-timing
  statement: A publish run measures and publishes the seconds of every step and phase, so a slow cycle names its slow step.
  acceptance:
  - id: AC1
    statement: 'AC1: with an injected clock every input step, the after-publish step and each phase carry the seconds they took, the served status names each step''s seconds, and the heartbeat names the cycle total, each phase and the slowest step -- falsifier: uv run --frozen pytest tests/nodes/node_factory_floor_publish_effect/test_cycle_timing.py -q --no-cov'
