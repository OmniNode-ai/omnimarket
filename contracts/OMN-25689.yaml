---
schema_version: "1.0.0"
ticket_id: OMN-25689
title: Codex lane landing step runs only the hooks for changed files and commits what the lane staged
summary: >-
  The Codex landing node prepares per-hook arguments, compares staged and base
  hook results, and returns a handoff decision or one parent notice. The node
  accepts facts from the caller and performs no hook, git or ledger operations.
is_seam_ticket: false
interface_change: true
interfaces_touched: [public_api]
requirements:
  - id: req-omn25689-codex-landing
    statement: Codex landing preserves the staged change and defers handoff until the lane reports its proof.
    acceptance:
      - id: AC1
        statement: >-
          AC1: the Codex landing step runs pre-commit only on the files the lane changed (`pre-commit run --files <changed files>`), never the whole tree, through an omnimarket node that the runner calls -- falsifier: `uv run pytest tests/unit/nodes/node_codex_landing_compute/test_landing_changed_files_hooks.py -q -k changed_files_only`
      - id: AC2
        statement: >-
          AC2: a hook failure that reproduces on the base commit is recorded as base-inherited in the landing result and does not block the commit; a failure that passes at the base still blocks -- falsifier: `uv run pytest tests/unit/nodes/node_codex_landing_compute/test_landing_changed_files_hooks.py -q -k base_inherited`
      - id: AC3
        statement: >-
          AC3: the step commits and pushes what the lane staged, and hands off only when the lane's report says its proof is in place; otherwise it pushes, leaves the PR to its successor and appends a ledger MSG naming the PR and the missing proof -- falsifier: `uv run pytest tests/unit/nodes/node_codex_landing_compute/test_landing_changed_files_hooks.py -q -k handoff_needs_proof`
      - id: AC4
        statement: >-
          AC4: a regression test built from the recorded 2026-11-18 landing data (the prtinfra-1720 whole-tree exit 124 and the fix6353-1915 handoff-after-push lines, fixture under tests/fixtures) fails on the unfixed code and passes on the fix -- falsifier: `uv run pytest tests/unit/nodes/node_codex_landing_compute/test_landing_changed_files_hooks.py -q -k recorded_2026_11_18`
      - id: AC5
        # YAML escapes keep the criterion verbatim without matching its own diff pattern.
        statement: "AC5: the change widens or bypasses no hook, so the diff removes no assertion and adds no skip, xfail or \x2D-no-verify -- falsifier: `git diff origin/dev...HEAD | grep -E '^[-+].*(\x2D-no-verify|pytest.mark.(skip|xfail)|SKIP\x3D)'` prints nothing, with `uv run pytest tests/unit/nodes/node_codex_landing_compute -q` green"
      - id: AC6
        statement: >-
          AC6: the branch is installed on h051 and one probe Codex lane placed the plain fill way commits a trivial change on a scratch branch with no workaround, its receipt naming the commit sha and carrying no landing-shape cell -- falsifier: the probe lane's receipt JSON on the launching host shows no landing-shape and a commit sha, read with `python3 -c 'import json,sys; print(json.load(open(sys.argv[1])))' <receipt>`
evidence_requirements:
  - kind: tests
    description: The contract entry point returns the hook plan, comparison and handoff decisions on the supplied inputs.
    command: uv run --frozen pytest tests/unit/nodes/node_codex_landing_compute -q --refuse-skips
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-omn25689-ac1-changed-paths
    description: Check the exact argv of two commit-stage hooks for a two-file change.
    source: manual
    binds_ac: [AC1]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/nodes/node_codex_landing_compute/test_landing_changed_files_hooks.py -q -k changed_files_only --refuse-skips
        cwd: .
  - id: dod-omn25689-ac2-base-comparison
    description: Compare failing hook diagnostics across the staged and base checkouts and retain the hook id and first output line.
    source: manual
    binds_ac: [AC2]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/nodes/node_codex_landing_compute/test_landing_changed_files_hooks.py -q -k base_inherited --refuse-skips
        cwd: .
  - id: dod-omn25689-ac3-handoff-proof
    description: Check the typed handoff or single parent notice from the lane's proof and the pushed PR and head.
    source: manual
    binds_ac: [AC3]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/nodes/node_codex_landing_compute/test_landing_changed_files_hooks.py -q -k handoff_needs_proof --refuse-skips
        cwd: .
  - id: dod-omn25689-ac4-recorded-regression
    description: Exercise the changed-file plan and proof decision using the two scrubbed recorded cases.
    source: manual
    binds_ac: [AC4]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/nodes/node_codex_landing_compute/test_landing_changed_files_hooks.py -q -k recorded_2026_11_18 --refuse-skips
        cwd: .
  - id: dod-omn25689-ac5-hook-diff
    description: Inspect the patch for hook bypasses and test skips, and run the landing tests with skips refused.
    source: manual
    binds_ac: [AC5]
    checks:
      - check_type: command
        check_value: "patch=$(git diff --no-ext-diff origin/dev...HEAD) || exit $?; ! printf '%s\\n' \"$patch\" | grep -E '^[-+].*(\x2D-no-verify|pytest.mark.(skip|xfail)|SKIP\x3D)'"
        cwd: .
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/nodes/node_codex_landing_compute -q --refuse-skips
        cwd: .
  - id: dod-omn25689-ac6-receipt-check
    description: Hosted control for the probe receipt verifier. The installed h051 run is verified by the local check below.
    source: manual
    binds_ac: [AC6]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/nodes/node_codex_landing_compute/test_landing_changed_files_hooks.py -q -k probe_receipt --refuse-skips
        cwd: .
  - id: dod-omn25689-ac6-live-probe
    description: Read the real scratch-branch receipt from the launching host after the h051 branch install and probe.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: |-
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          receipt = json.loads(Path(os.environ["ONEX_CODEX_LANDING_PROBE_RECEIPT"]).read_text(encoding="utf-8"))
          if receipt.get("host") != "h051" or receipt.get("model") != "codex":
              raise SystemExit("expected a Codex receipt from h051")
          if {"landing-shape", "landing_failure"} & receipt.keys():
              raise SystemExit("probe receipt contains a landing failure")
          steps = receipt.get("codex_landing", [])
          if not any(step == "COMMIT" and re.fullmatch(r"ok sha=[0-9a-f]{40}", result) for step, result in steps):
              raise SystemExit("probe receipt does not name a commit SHA")
          if not any(step == "PUSH" and re.fullmatch(r"ok branch=omn-25689-probe-\d+(?: .*)?", result) for step, result in steps):
              raise SystemExit("probe receipt does not show the scratch branch push")
          print("h051 Codex probe receipt contains a commit SHA and scratch branch push")
          PY
        cwd: .
  - id: dod-omn25689-integration-proof
    description: Exercise the packaged Codex landing node through the ONEX CLI on a lab host at the pushed revision.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: >-
          onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)"
          --lane dod-integration-proof-25689 --kind test -- uv run --frozen pytest
          tests/unit/nodes/node_codex_landing_compute/test_landing_changed_files_hooks.py
          -q -k packaged_node_dispatch --refuse-skips
        cwd: .
  - id: dod-omn25689-deploy-node-at-head
    description: Launch the packaged node from the PR checkout and check the argv it returns on the local runtime.
    source: manual
    checks:
      - check_type: command
        check_value: |-
          set -eu;
          probe_dir=$(mktemp -d);
          trap 'rm -rf -- "$probe_dir"' EXIT;
          printf '%s\n' '{"worktree":".","hook_plan":{"hooks":["lint"],"files":["src/check.py","tests/test check.py"]}}' > "$probe_dir/input.json";
          uv sync --frozen;
          .venv/bin/onex node node_codex_landing_compute --input "$probe_dir/input.json" --state-root "$probe_dir/state" --output receipt --timeout 30 > "$probe_dir/receipt.json";
          python3 - "$probe_dir/receipt.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          receipt = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          expected = [["pre-commit", "run", "lint", "--files", "src/check.py", "tests/test check.py"]]
          if receipt.get("status") != "success" or receipt.get("result", {}).get("hook_argv") != expected:
              raise SystemExit("packaged Codex landing node did not return the expected hook argv")
          print("packaged Codex landing node returned the exact two-file argv")
          PY
        cwd: .
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/nodes/test_remote_lane_nodes_present.py -q --refuse-skips
        cwd: .
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/nodes/node_codex_landing_compute -q --refuse-skips
        cwd: .
