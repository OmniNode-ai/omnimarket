    check_value: uv run --frozen pytest tests/nodes/node_delegation_scenario_alarm_effect/test_golden_chain_delegation_scenario_alarm.py -k "bucketed_stale or one_bucket or second_tick_over_a_failed_run
      or boundary" -q --no-cov -n 0 -p no:randomly
