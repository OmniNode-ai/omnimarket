    cwd: .
  - check_type: command
    check_value: sh -c 'onex scm pr-view OmniNode-ai/omnimarket#6353 --comments | grep -qE "finding 8([^0-9]|$)"'
    cwd: .
  - check_type: command
    check_value: sh -c 'onex scm pr-view OmniNode-ai/omnimarket#6353 --comments | grep -qE "finding 9([^0-9]|$)"'
    cwd: .
  - check_type: command
    check_value: sh -c 'onex scm pr-view OmniNode-ai/omnimarket#6353 --comments | grep -qE "finding 10([^0-9]|$)"'
    cwd: .
  - check_type: command
    check_value: sh -c 'onex scm pr-view OmniNode-ai/omnimarket#6353 --comments | grep -qE "finding 11([^0-9]|$)"'
    cwd: .
  - check_type: command
    check_value: 'sh -c ''H=$(python3 "${OMNI_PLUGIN_ROOT:?}/skills/merge-drain/scripts/pr_state_local.py" --pr OmniNode-ai/omnimarket#6353 --json | python3 -c "import json,sys; print(json.load(sys.stdin)[sys.argv[1]][sys.argv[2]])"
