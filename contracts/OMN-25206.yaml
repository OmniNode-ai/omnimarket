schema_version: 1.0.0
ticket_id: OMN-25206
title: 'Review findings 1 to 11 on the alarm pull request are fixed or argued: a failed record that stops raises a bucketed stale alarm, the stale tests tell the buckets apart, and the contract checks read
  the sha, command and exit they claim'
summary: A failed or refused last-run record older than its declared age now raises the bucketed stale reading, the request id of a bucketed reading carries its conclusion, the golden chain stubs the receipt
  the bus CLI prints on acceptance and runs the rendered argv, and the contract checks of the alarm contract read the full current head, the lab command, exit 0 and the required check-runs. Findings 7 to
  11 are fixed or argued in the pull request comment that names the new head.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn25206-ac1
  statement: A stale failed or refused record recurs by bucket; buckets and conclusions give different ids, one bucket gives one row and id.
  acceptance:
  - id: AC1
    statement: 'AC1: a failed or refused record older than max_age_seconds raises the bucketed stale reading, ticks in adjacent six-hour buckets give different row ids and ticks in one bucket give an identical
      row and id, and the bucketed key carries the conclusion, each with a test red before the fix -- falsifier: `uv run --frozen pytest tests/nodes/node_delegation_scenario_alarm_effect/test_golden_chain_delegation_scenario_alarm.py -k "bucketed_stale or one_bucket" -q` passes with the stale
      reading restricted to success records or with stale keyed on ran_at alone'
- id: req-omn25206-ac2
  statement: The tick runs the rendered argv against a stub that prints the receipt the bus CLI prints on acceptance.
  acceptance:
  - id: AC2
    statement: 'AC2: the CLI test in the golden chain test passes the full rendered argv of tick_arguments, stubs the reply that omnimarket.work_ledger_bus.cli append prints on acceptance, and asserts exit
      0, with a test -- falsifier: `uv run --frozen pytest tests/nodes/node_delegation_scenario_alarm_effect/test_golden_chain_delegation_scenario_alarm.py -k "rendered or tick_exit" -q` passes with the stub reply changed to a string the CLI never prints'
- id: req-omn25206-ac3
  statement: The alarm contract's AC3 to AC6 checks read the sha, command, exit 0, check-runs and test files they claim, proved on shims over a temp directory.
  acceptance:
  - id: AC3
    statement: 'AC3: the contract checks of contracts/OMN-25071.yaml and contracts/OMN-25206.yaml, read by tests/nodes/node_delegation_scenario_alarm_effect/test_contract_checks_omn25071.py, read the full current head, command and exit 0 of the Lab comment, add an `onex scm pr-checks`
      check, and read each finding number inside the one comment that opens with the Lab marker for the current head, with a test over shims -- falsifier: `uv run --frozen pytest tests/nodes/node_delegation_scenario_alarm_effect/test_contract_checks_omn25071.py -q` passes with
      the Lab check reading `Lab: head=` alone'
- id: req-omn25206-ac4
  statement: Findings 7 to 11 are fixed in the push or argued in the Lab comment that names the new head.
  acceptance:
  - id: AC4
    statement: 'AC4: each non-blocking finding 7 to 11 is fixed in the push or argued with evidence in a PR comment, and a PR comment starting `Lab: head=<full new head sha>` names the sha, the lab command
      and exit 0 -- falsifier: `onex scm pr-view --source bus OmniNode-ai/omnimarket#6353` shows no comment that opens with the Lab marker for the head and names findings 7 to 11, or a Lab comment without the full
      sha, the command or exit 0'
evidence_requirements:
- kind: tests
  description: The alarm node golden-chain tests and the contract check tests.
  command: uv run --frozen pytest tests/nodes/node_delegation_scenario_alarm_effect -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn25206-ac1
  description: A failed, refused or successful record older than max_age_seconds raises the bucketed stale reading; adjacent buckets and different conclusions give different row ids, one bucket an identical
    row and id.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_delegation_scenario_alarm_effect/test_golden_chain_delegation_scenario_alarm.py -k "bucketed_stale or one_bucket or second_tick_over_a_failed_run
      or boundary" -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn25206-ac2
  description: The tick runs the full rendered argv against a stub printing the receipt the CLI prints on acceptance, exits 0, and exits 1 for a reply the CLI never prints; the rendered append command reaches
    the real bus parser.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_delegation_scenario_alarm_effect/test_golden_chain_delegation_scenario_alarm.py -k "rendered or tick_exit" -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn25206-ac3
  description: 'The alarm contracts'' Lab, pr-checks and per-number checks are run over shims that print the shapes the real tools print: a Lab comment for an old head, a short sha, no command or no exit 0
    fails, a corrected second comment is read, a quoted review passes no number, the pr-checks check reads the head and the check-runs, and the test files and the AC3 selection are read.'
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_delegation_scenario_alarm_effect/test_contract_checks_omn25071.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn25206-ac4
  description: 'Local Done gate: the one comment of this pull request that opens with the Lab marker for the head the PR watcher records names each of findings 7 to 11 (the first check), and names the
    lab command and exit 0 (the second). The comments are read with the bus read of onex scm pr-view, so only the local Done gate runs them.'
  source: manual
  binds_ac:
  - AC4
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: >-
      sh -c 'H=$(python3 "${OMNI_PLUGIN_ROOT:?}/skills/merge-drain/scripts/pr_state_local.py" --pr OmniNode-ai/omnimarket#6353 --json | python3 -c "import json,sys; print(json.load(sys.stdin)[sys.argv[1]][sys.argv[2]])" facts head_sha)
      && test "${#H}" -eq 40 && test "$H" = "$(git rev-parse HEAD)" && onex scm pr-view --source bus OmniNode-ai/omnimarket#6353 | python3 tests/nodes/node_delegation_scenario_alarm_effect/pr_comment_check.py --head "$H" --finding 7 --finding 8 --finding 9 --finding 10 --finding 11 --round 0525'
    cwd: .
  - check_type: command
    check_value: >-
      sh -c 'H=$(python3 "${OMNI_PLUGIN_ROOT:?}/skills/merge-drain/scripts/pr_state_local.py" --pr OmniNode-ai/omnimarket#6353 --json | python3 -c "import json,sys; print(json.load(sys.stdin)[sys.argv[1]][sys.argv[2]])" facts head_sha)
      && test "${#H}" -eq 40 && test "$H" = "$(git rev-parse HEAD)" && onex scm pr-view --source bus OmniNode-ai/omnimarket#6353 | python3 tests/nodes/node_delegation_scenario_alarm_effect/pr_comment_check.py --head "$H" --lab'
    cwd: .
- id: dod-omn25206-integration-proof
  description: The alarm node tests and the installer registry unit tests run on a lab host at the pushed head through the lab work runner; hosted CI cannot reach the lab, so only the local Done gate runs
    this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --bus-lane dev --omnibase-path "${OMNI_HOME:?}" --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-25206
      --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_delegation_scenario_alarm_effect tests/nodes/node_host_installer_registry_units -q --no-cov -n 0 -p no:randomly
    cwd: .
