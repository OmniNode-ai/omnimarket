schema_version: 1.0.0
ticket_id: OMN-25206
title: 'Review findings 1 to 11 on the alarm pull request are fixed or argued: a failed record that stops raises a bucketed stale alarm, the stale tests tell the buckets apart, and the contract checks read
  the sha, command and exit they claim'
summary: A failed or refused last-run record older than its declared age now raises the bucketed stale reading, the request id of a bucketed reading carries its conclusion, the golden chain stubs the receipt
  the bus CLI prints on acceptance and runs the rendered argv, and the contract checks of the alarm contract read the full current head, the lab command, exit 0 and the required check-runs. Findings 7 to
  11 are fixed or argued in the pull request comment that names the new head.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn25206-ac1
  statement: A stale failed or refused record recurs by bucket; buckets and conclusions give different ids, one bucket gives one row and id.
  acceptance:
  - id: AC1
    statement: 'AC1: a failed or refused record older than max_age_seconds raises the bucketed stale reading, ticks in adjacent six-hour buckets give different row ids and ticks in one bucket give an identical
      row and id, and the bucketed key carries the conclusion, each with a test red before the fix -- falsifier: `uv run --frozen pytest tests -k "omn24874 and alarm" -q` passes with the stale reading restricted
      to success records or with stale keyed on ran_at alone'
- id: req-omn25206-ac2
  statement: The tick runs the rendered argv against a stub that prints the receipt the bus CLI prints on acceptance.
  acceptance:
  - id: AC2
    statement: 'AC2: the CLI test in the golden chain test passes the full rendered argv of tick_arguments, stubs the reply that omnimarket.work_ledger_bus.cli append prints on acceptance, and asserts exit
      0, with a test -- falsifier: `uv run --frozen pytest tests -k "omn24874 and golden_chain" -q` passes with the stub reply changed to a string the CLI never prints'
- id: req-omn25206-ac3
  statement: The alarm contract's AC3 to AC6 checks read the sha, command, exit 0, check-runs and test files they claim, proved on shims over a temp directory.
  acceptance:
  - id: AC3
    statement: 'AC3: the contract checks of contracts/OMN-24874.yaml read the full current #6335 head, command and exit 0 for AC6, add an `onex scm pr-checks` check, grep each of findings 5, 6, 7 and 8
      for AC5, and for AC3 and AC4 check that the test files exist on dev tip 13a7e30415fa and that `-k ac3` selects a test, with a test built on a temp repo -- falsifier: `uv run --frozen pytest tests/test_omn24874_contract_checks.py
      -q` passes with the AC6 check reading `Lab: head=` alone'
- id: req-omn25206-ac4
  statement: Findings 7 to 11 are fixed in the push or argued in the Lab comment that names the new head.
  acceptance:
  - id: AC4
    statement: 'AC4: each non-blocking finding 7 to 11 is fixed in the push or argued with evidence in a PR comment, and a PR comment starting `Lab: head=<full new head sha>` names the sha, the lab command
      and exit 0 -- falsifier: `onex scm pr-view OmniNode-ai/omnimarket#6353 --comments` shows no comment naming findings 7 to 11, or a Lab comment without the full sha, the command or exit 0'
evidence_requirements:
- kind: tests
  description: The alarm node golden-chain tests and the contract check tests.
  command: uv run --frozen pytest tests/nodes/node_delegation_scenario_alarm_effect -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
