schema_version: 1.0.0
ticket_id: OMN-23087
title: "Join J8 passes: the live run of rebuild piece 8 (CI and runners) into piece 9 (landing and merge queue) on real heads, with its failing controls and a host unit"
summary: The J8 join handler and its golden and error tests merged with OMN-22919 but nothing ran it, so the floor read J8 not_run. This change runs it live. A collector reads the PR watcher's state, turns each open pull request of the overlay's lab-bound repositories into landing facts with a lab_check fact built from the watcher's runs of the overlay's lab-bound check, and a run writes piece 8's chain (the node that reads the lab-bound check posted on the head) and then piece 9's answer under one correlation id to the floor's emission journal. A head the decision merges is the join's golden; a head the lab check holds is its error; both read passed in the floor's own receipt fold. Two named injected breaks (blind-decision, silent-landing) are the failing controls and read broken. A registry unit (landing-join-j8) runs a tick every 900 s on the floor host. The attempt identity is the head sha the watcher read the check on until J7 posts a dispatch identity; the overlay values and the unit's overlay root live in the overlays repository.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23087-j8-live
  statement: Join J8 is run on real heads from the PR watcher's state and read by the floor's receipt fold as passed; a named injected break reads it broken.
  acceptance:
  - id: AC1
    statement: "AC1: join J8 reads passed from a real run of golden and error heads, and each named injected break reads broken -- falsifier: uv run pytest tests/unit/nodes/node_pr_landing_decision_compute/test_join_j8_live.py -q"
evidence_requirements:
- kind: tests
  description: The acceptance tests of this ticket at the pushed head.
  command: uv run --frozen pytest tests/unit/nodes/node_pr_landing_decision_compute/test_join_j8_live.py tests/nodes/node_host_installer_registry_units -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
- id: dod-omn23087-j8-live
  description: The live-run tests pass, golden and error through the runtime verb and the unit tick, and the two control tests read the join broken where the same fold reads it error_only without the break.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/nodes/node_pr_landing_decision_compute/test_join_j8_live.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn23087-j8-control-journal
  description: A named injected break writes to the overlay's control journal and is refused when the overlay names none, so it never leaves piece 8 failed and piece 9 silent in the floor's journal; relocate-controls moves control chains an earlier run left there and refuses a real chain. The tests fold the floor's journal broken without the split and passed with it.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/nodes/node_pr_landing_decision_compute/test_join_j8_live.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn23087-j8-floor
  description: The served floor reads J8 as passed. Hosted CI cannot reach the floor host (the URL is in FLOOR_SIMPLE_URL), so only the local Done gate runs this unbound check. It reads passed only after the landing-join-j8 unit is installed on the floor host with its overlay.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: "curl -s -m 20 \"${FLOOR_SIMPLE_URL:?set FLOOR_SIMPLE_URL to the served floor-simple.json}\" | python3 -c \"import json,sys; d=json.load(sys.stdin); sys.exit(0 if [j for p in d['pieces'] if p['piece']==8 for j in p['joins'] if j['id']=='J8'][0]['state']=='passed' else 1)\""
    cwd: .
- id: dod-omn23087-integration-proof
  description: The pushed head ran the J8 live tests and the registry unit tests on a lab host through the lab work runner and exited 0. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: 'uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23087 -- uv run --frozen pytest tests/unit/nodes/node_pr_landing_decision_compute/test_join_j8_live.py tests/nodes/node_host_installer_registry_units -q --no-cov -n 0 -p no:randomly'
    cwd: .
