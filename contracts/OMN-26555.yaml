---
schema_version: "1.0.0"
ticket_id: OMN-26555
title: "The nightly sender's bus open reads the overlay's mounted workspace config root, so the dev runtime can resolve the bus lane"
summary: "The dev runtime mounts config/lab/ci_bus_lanes.yaml at /etc/onex/workspace-config/config/lab and exports no ONEX_WORKSPACE_CONFIG_ROOT, so the nightly sender's collect_nightly was refused with the lane declaration missing and the nights of 2026-11-22 and 2026-11-23 were recorded missed. ModelNightlySenderScheduleOverlay gains one optional key, workspace_config_root; BusNightlyCommandSender names it for the lane resolver only while the bus opens and puts the variable back; a root the environment already names wins. The same pattern node_red_main_alarm_effect declares."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn26555-sender-config-root
    statement: "The nightly sender opens its bus lane with the overlay's workspace_config_root named for the lane resolver, scoped to the open, and an environment root wins."
    acceptance:
      - id: AC1
        statement: "AC1: with workspace_config_root declared and no environment root, the bus open sees the declared root and the variable is absent afterwards -- falsifier: uv run pytest tests/nodes/node_test_selector_nightly_sender_scheduled_effect -q --no-cov -k config_root; the test fails at the merge base (the sender takes no workspace_config_root)"
      - id: AC2
        statement: "AC2: a root the environment already names wins and is kept, and a failed open leaves no variable behind -- falsifier: uv run pytest tests/nodes/node_test_selector_nightly_sender_scheduled_effect -q --no-cov -k config_root"
      - id: AC3
        statement: "AC3: the overlay key is optional, absolute and in the example overlay, and the handler hands it to the bus sender -- falsifier: uv run pytest tests/nodes/node_test_selector_nightly_sender_scheduled_effect -q --no-cov"
evidence_requirements:
  - kind: tests
    description: "The nightly sender node tests pass at the pushed head."
    command: "uv run --frozen pytest tests/nodes/node_test_selector_nightly_sender_scheduled_effect -q --no-cov -n 0 -p no:randomly"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-omn26555-ac1
    description: "AC1: the bus open sees the overlay's config root while it opens and the variable is absent afterwards."
    source: manual
    binds_ac: [AC1]
    checks:
      - check_type: test_passes
        check_value: >-
          uv run --frozen pytest tests/nodes/node_test_selector_nightly_sender_scheduled_effect -q --no-cov -n 0 -p no:randomly -k config_root_the_overlay_root_is_named
        cwd: .
  - id: dod-omn26555-ac2
    description: "AC2: an environment root wins and is kept; a failed open leaves no variable behind."
    source: manual
    binds_ac: [AC2]
    checks:
      - check_type: test_passes
        check_value: >-
          uv run --frozen pytest tests/nodes/node_test_selector_nightly_sender_scheduled_effect -q --no-cov -n 0 -p no:randomly -k config_root
        cwd: .
  - id: dod-omn26555-ac3
    description: "AC3: the overlay key is optional, absolute and in the example overlay, and the handler hands it to the sender; the node's whole test directory passes."
    source: manual
    binds_ac: [AC3]
    checks:
      - check_type: test_passes
        check_value: >-
          uv run --frozen pytest tests/nodes/node_test_selector_nightly_sender_scheduled_effect -q --no-cov -n 0 -p no:randomly
        cwd: .
  - id: dod-omn26555-integration-proof
    description: "Local Done gate only, so it binds no criterion here: the nightly sender node's tests run on a lab host at the pushed head, and the dev runtime's settled_slots.json is read for a sent slot after the merged revision is on dev."
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: >-
          onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-26555 --kind test -- uv run --frozen pytest tests/nodes/node_test_selector_nightly_sender_scheduled_effect -q --no-cov
