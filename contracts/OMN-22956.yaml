schema_version: 1.0.0
ticket_id: OMN-22956
title: "Piece 10's reading and its generated golden and error chain tests: deleting a root data file from a test host's copy flips the reading"
summary: A pure compute node reads the install canary's newest probe of each required host at a read time and reads WORKING, NOT WORKING or UNKNOWN. A drill that deletes a root data file from a test host's copy flips the reading to NOT WORKING. It carries its own golden and error chain tests, each with named mutations that turn it red.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn22956-install-reading
  statement: Piece 10 reads NOT WORKING when a required host's newest install-canary probe is missing, stale, future-dated, has an empty file list, names a missing file (a drill that deleted a root data file from a test host's copy), or is a drill that does not see its own fault.
  acceptance:
  - id: AC1
    statement: 'AC1: the reading computes from the install canary and flips to NOT WORKING when the drill deletes a root data file on a test host -- falsifier: uv run pytest src/omnimarket/nodes/node_install_reading_compute -q -k fault_injection'
  - id: AC2
    statement: 'AC2: generated golden and error chain tests exist and a named mutation turns each red -- falsifier: uv run pytest src/omnimarket/nodes/node_install_reading_compute -q -k chain'
evidence_requirements:
- kind: tests
  description: The fault injection tests and the golden and error chain tests with their named mutations
  command: uv run --frozen pytest tests/nodes/node_install_reading_compute -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn22956-fault-injection
  description: The install canary's own daily and drill probes feed the reading; a drill that deletes a root data file from a test host's copy reads NOT WORKING and names the file, a blind drill reads NOT WORKING, and the next daily probe reads WORKING again.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest src/omnimarket/nodes/node_install_reading_compute -q --no-cov -k fault_injection
    cwd: .
- id: dod-omn22956-chains
  description: The golden chain and the error chain each hold their named mutations; every named mutation raises AssertionError in the chain it names.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest src/omnimarket/nodes/node_install_reading_compute -q --no-cov -k chain
    cwd: .
- id: dod-omn22956-integration-proof
  description: Run this pull request's own tests on a lab host at the pushed head. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-22956 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_install_reading_compute -q --no-cov
    cwd: .
