schema_version: 1.0.0
ticket_id: OMN-22576
title: A pure lane join node joins a lane's name to the agent that ran it and counts hook events per reporting host
summary: node_hook_lane_join_compute is a pure compute handler that joins a lane name to its agent and counts hook events per reporting host, for the floor line that names the hosts reporting.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn22576-lane-join-node
  statement: The lane join is a node with a contract, typed models, a golden chain test and an error chain test; a lane that cannot be joined with certainty stays unjoined with the reason, and every reporting host is counted.
  acceptance:
  - id: AC1
    statement: 'AC1: the node golden and error chain tests pass -- falsifier: uv run --frozen pytest tests/nodes/node_hook_lane_join_compute -q --no-cov'
  - id: AC2
    statement: 'AC2: a lane no agent fits, two agents fitting one lane and two lanes fitting one agent each stay unjoined with a reason, and the host counts name every reporting host, shown by the error chain tests -- falsifier: uv run --frozen pytest tests/nodes/node_hook_lane_join_compute -q --no-cov -k error_chain'
evidence_requirements:
- kind: tests
  description: The lane join node tests pass
  command: uv run --frozen pytest tests/nodes/node_hook_lane_join_compute -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
