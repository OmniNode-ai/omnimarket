---
schema_version: "1.0.0"
ticket_id: "OMN-20668"
title: "Lab-fill planning decisions as a contract-declared compute node"
summary: "Port the lab-fill workflow's pure decisions (host lane capacity, which read served the candidates, which candidates become lanes) to a compute node whose contract declares its bus topics, with a golden chain, an error chain and parity cases recorded from the workflow's own code. The effect leg, the lab cycle, the caller repoint and the old entry point's deletion remain separate."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-plan-node"
    statement: "The planning decisions are a contract.yaml, a compute node and handlers with the canonical handle(request) -> result signature, with command and terminal topics declared in the contract."
    acceptance:
      - id: "AC1"
        statement: "AC1: the contract resolves, declares its subscribe and publish topics and a terminal event, and a golden chain executes capacity, candidate choice and dispatch planning in order through the contract's own handler and model bindings"
  - id: "req-parity"
    statement: "The node decides what the workflow decided on the same inputs."
    acceptance:
      - id: "AC2"
        statement: "AC2: every recorded case (capacity, candidate choice, dispatch planning) answers exactly what the workflow's pure block answered when run under node, and a deliberately broken rule fails the cases"
  - id: "req-error-chain"
    statement: "A request the planner cannot decide is refused and a bad reading is named; the node holds no project, operator, repository or host identity."
    acceptance:
      - id: "AC3"
        statement: "AC3: invalid run configuration and policy values are refused, malformed readings and candidates are named in the result, and project and operator identities exist only as request fields"
  - id: "req-pure-outcomes"
    statement: "The remaining pure workflow decisions are contract-bound ownership, lane rendering, placement, fallback planning and status operations with supplied reader facts and times."
    acceptance:
      - id: "AC4"
        statement: "AC4: the golden chain executes all five new operations through contract bindings, bad readings are named or refused by validation, at least 20 old-source parity cases per operation pass, and a temporary broken rule in each operation fails its cases; the node remains pure with unchanged topics."
  - id: "req-effect-node"
    statement: "The lab-fill I/O is a contract-declared effect node with definition-B handlers behind ports: pool probe, owner facts, lane launch, receipts, fallback host and the STATUS row; it decides nothing the plan node decides."
    acceptance:
      - id: "AC5"
        statement: "AC5: the effect contract declares its command topic and terminal events, its six operations resolve to handle(request) -> result handlers, a cycle with the plan node passes JSON between them, and every port failure is named in a typed result rather than raised or read as an empty answer."
evidence_requirements:
  - kind: "tests"
    description: "AC1: golden chain passes."
    command: "uv run pytest tests/nodes/node_lab_fill_plan_compute/test_golden_chain_lab_fill_plan_compute.py -q -p no:randomly"
  - kind: "tests"
    description: "AC2: parity cases pass."
    command: "uv run pytest tests/nodes/node_lab_fill_plan_compute/test_lab_fill_plan_parity.py -q -p no:randomly"
  - kind: "tests"
    description: "AC3: error chain passes."
    command: "uv run pytest tests/nodes/node_lab_fill_plan_compute/test_error_chain_lab_fill_plan_compute.py -q -p no:randomly"
  - kind: "tests"
    description: "AC4: the five outcome operations pass golden, error and parity cases."
    command: "uv run pytest tests/nodes/node_lab_fill_plan_compute/test_lab_fill_outcome_parity.py -q -p no:randomly"
  - kind: "tests"
    description: "AC5: effect golden chain, cycle chain, error chain and adapters pass."
    command: "uv run pytest tests/nodes/node_lab_fill_effect/test_golden_chain_lab_fill_effect.py -q -p no:randomly"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
