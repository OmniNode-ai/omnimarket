schema_version: 1.0.0
ticket_id: OMN-23854
title: The GitHub transport error and shared pull-request models move out of node_merge_sweep_compute so it can be retired
summary: GitHubTransportError moves to omnimarket.models.github_landing and the eight merge-sweep classification names (EnumPRTrack, EnumFailureCategory, ModelPRInfo, ModelClassifiedPR, ModelFailureHistoryEntry, ModelFailureHistorySummary, ModelMergeSweepRequest, ModelMergeSweepResult) move to one-per-file modules under omnimarket.models.merge_sweep. Every importer points at the new place; nothing is re-exported or aliased at the old path. The overnight dispatch stops constructing NodeMergeSweep for an empty inventory and builds the default result directly. No behaviour change.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn23854-no-outside-importer
    statement: No module outside node_merge_sweep_compute and node_merge_sweep_triage_orchestrator imports omnimarket.nodes.node_merge_sweep_compute.
    acceptance:
      - id: AC1
        statement: 'AC1: no module outside node_merge_sweep_compute and node_merge_sweep_triage_orchestrator imports omnimarket.nodes.node_merge_sweep_compute -- falsifier: a new import-graph test fails on dev, where the gateway, filler, health monitor, snapshot effect, overnight and reporting modules import it'
  - id: req-omn23854-behaviour-kept
    statement: The moved names keep their behaviour in the four consuming nodes.
    acceptance:
      - id: AC2
        statement: 'AC2: the moved names keep their behaviour: the gateway, job-log filler, health monitor and snapshot effect test directories pass unchanged -- falsifier: uv run pytest on those four nodes'' test directories fails after the move'
  - id: req-omn23854-filler-runs
    statement: The job-log filler unit on the launching Mac runs one pass from the released omnimarket carrying the move.
    acceptance:
      - id: AC3
        statement: 'AC3: integrated: the job-log filler unit on the launching Mac runs one pass from the released omnimarket carrying the move and writes its records as before -- falsifier: the filler''s next run after release exits non-zero or writes no record for a red head it filled before'
evidence_requirements:
  - kind: tests
    description: The import-graph test and the moved-name checks (AC1).
    command: uv run pytest tests/unit/test_merge_sweep_compute_importers.py -q -n 0 -p no:randomly --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn23854-ac1
    description: AC1 reads the import-graph test, which walks src with ast and fails on any importer outside the two allowed node directories; its planted-importer control shows the walk can fail.
    source: manual
    binds_ac:
      - AC1
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/test_merge_sweep_compute_importers.py -q -n 0 -p no:randomly --no-cov
        cwd: .
  - id: dod-omn23854-ac2
    description: AC2 reads the focused tests of the gateway and health monitor and snapshot golden chains, which import the moved names from their new modules.
    source: manual
    binds_ac:
      - AC2
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/test_golden_chain_pr_health_monitor.py tests/test_golden_chain_pr_snapshot_effect.py -q -n 0 -p no:randomly --no-cov
        cwd: .
  - id: dod-omn23854-ac3
    description: AC3 is read after the next omnimarket release, from one pass of the job-log filler unit's log on the launching Mac; until then the filler's own tests, which run its adapter against the transport error from its new home, are the bound check.
    source: manual
    binds_ac:
      - AC3
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/nodes/node_job_log_filler_effect/test_job_log_filler.py -q -n 0 -p no:randomly --no-cov
        cwd: .
  - id: dod-omn23854-deploy-readback
    description: Deploy probe. The shared GitHub transport error is present in its new module in the tree this change ships, read through gh api at the checked-out commit so hosted CI can run it before merge. It fails at a base that has no such module.
    source: manual
    checks:
      - check_type: command
        check_value: gh api "repos/OmniNode-ai/omnimarket/contents/src/omnimarket/models/github_landing/model_transport_error.py?ref=$(git rev-parse HEAD)" --jq .content | base64 -d | grep '^class GitHubTransportError' > /dev/null
        cwd: .
  - id: dod-omn23854-integration-proof
    description: The pushed head ran the import-graph test and the gateway, job-log filler, health monitor, snapshot effect and overnight test directories on a lab host through the lab work runner and exited 0. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: 'uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23854 -- uv run --frozen pytest tests/unit/test_merge_sweep_compute_importers.py tests/nodes/node_github_repo_gateway_effect tests/test_golden_chain_pr_health_monitor.py tests/test_golden_chain_pr_snapshot_effect.py -q --no-cov -n 0 -p no:randomly'
        cwd: .
