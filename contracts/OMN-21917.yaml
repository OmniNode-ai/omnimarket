schema_version: 1.0.0
ticket_id: OMN-21917
title: The landing red rules take the Hostile Review Thread Gate as the pull request's own red, not as reviewer-pool health
summary: The hostile-review family pattern of the landing red rules matched the "Hostile Review Thread Gate" by its name. A pull request whose only red was that gate was classed reviewer_pool, which earns a reviewer rerun and never a worker, and a worker's brief on any other red dropped the gate's name. The pattern now excludes the thread gate, so the gate's red is a product red that stays in the worker's red names. The gate and its blocking rule are not touched.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn21917-thread-gate-own-red
    statement: A red Hostile Review Thread Gate is classed as the pull request's own red and named in the worker's reds, while the Hostile Review Gate and the Hostile Reviewer stay set aside as reviewer health.
    acceptance:
      - id: AC1
        statement: 'AC1: the one cause is named with a command and its output, and the count of the 19 pull requests it explains is stated -- falsifier: a red pull request in the sample whose failing predicate is not the named cause is listed as unexplained'
      - id: AC2
        statement: 'AC2: a fix pull request or a landing-controller MSG exists for that cause and a test fails on the old behaviour and passes on the new, run on a lab host -- falsifier: uv run pytest of that test on origin/dev code fails and on the branch passes'
      - id: AC3
        statement: 'AC3: the gate still fails a pull request with a real unresolved thread -- falsifier: a pytest with a real unresolved thread asserting the gate result is failure'
evidence_requirements:
  - kind: tests
    description: The landing red rules suite runs at the pushed head on a lab host.
    command: uv run pytest tests/unit/nodes/node_pr_lifecycle_triage_compute/test_landing_red_rules.py -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn21917-ac1
    description: AC1 classifies the red sets of the pull requests whose thread gate was red and asserts each is the pull request's own red with the gate named in the worker's reds.
    source: manual
    binds_ac:
      - AC1
    checks:
      - check_type: test_passes
        check_value: env PYTHONDONTWRITEBYTECODE=1 uv run pytest tests/unit/nodes/node_pr_lifecycle_triage_compute/test_landing_red_rules.py -k test_thread_gate_red_is_the_pull_requests_own_red -q --no-cov --tb=line
        cwd: .
  - id: dod-omn21917-ac2
    description: AC2 reads the family beside the thread gate, the gate's name in the worker's reds, and the reviewer-pool rule that leaves a thread-gate head alone.
    source: manual
    binds_ac:
      - AC2
    checks:
      - check_type: test_passes
        check_value: env PYTHONDONTWRITEBYTECODE=1 uv run pytest tests/unit/nodes/node_pr_lifecycle_triage_compute/test_landing_red_rules.py -k "test_hostile_review_family_is_still_set_aside_beside_the_thread_gate or test_thread_gate_red_is_the_pull_requests_own_red" -q --no-cov --tb=line
        cwd: .
  - id: dod-omn21917-ac3
    description: AC3 asserts a head whose only reds are the aggregate and the thread gate is never presented as a reviewer rerun, so the red stays and a worker answers the thread.
    source: manual
    binds_ac:
      - AC3
    checks:
      - check_type: test_passes
        check_value: env PYTHONDONTWRITEBYTECODE=1 uv run pytest tests/unit/nodes/node_pr_lifecycle_triage_compute/test_landing_red_rules.py -k test_thread_gate_red_is_never_presented_as_a_reviewer_rerun -q --no-cov --tb=line
        cwd: .
  - id: dod-omn21917-integration-proof
    description: Integration proof on a lab host. The pushed head runs the landing red rules suite, which drives the real landing red classifier with a red set of the aggregate and the Hostile Review Thread Gate, and exits 0. The old pattern fails this run. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane thread-gate-integration-proof-21917 -- uv run --frozen pytest tests/unit/nodes/node_pr_lifecycle_triage_compute/test_landing_red_rules.py -q --no-cov
        cwd: .
  - id: dod-omn21917-deploy-probe
    description: Hosted-runner source-artifact readback requires the published classifier at the evaluated commit to match this checkout and to carry the thread-gate exclusion in REVIEWER_POOL_RE. It checks the source artifact only; nothing here runs on a runtime.
    source: manual
    checks:
      - check_type: command
        check_value: |
          set -eu;
          readback_dir="$(mktemp -d)";
          trap 'rm -rf "$readback_dir"' EXIT;
          revision="$(git rev-parse HEAD)";
          path=src/omnimarket/nodes/node_pr_lifecycle_triage_compute/handlers/handler_classify_cascade_checks.py;
          curl --fail --silent --show-error --location --max-time 10 \
            "https://raw.githubusercontent.com/OmniNode-ai/omnimarket/$revision/$path" \
            --output "$readback_dir/source.py";
          cmp "$path" "$readback_dir/source.py";
          grep -F 'hostile review(?!\s+thread gate)' "$readback_dir/source.py";
          printf 'classifier thread-gate exclusion source readback matched %s\n' "$revision"
        cwd: .
