schema_version: 1.0.0
ticket_id: OMN-24556
title: 'Ruling register: bound the reads, keep one bad row from hiding the rest, and wire the register into the hourly tick'
summary: The merged register fix (omnimarket#6246) left four faults and the register unwired; this change refuses a bad or disallowed row alone, bounds every read and the whole register read, requires the command list, carries journal write failures to the tick, and the step that hands the register to the hourly tick's decision input is a separate draft pull request in the plugin's own repository.
is_seam_ticket: true
interface_change: true
interfaces_touched:
- public_api
requirements:
- id: req-omn24556-ruling-register-wire
  statement: A register row that is bad, slow or outside the command list can never hide the other rows, and the hourly tick carries the register on every run.
  acceptance:
  - id: AC1
    statement: "AC1: a register row that is invalid, or whose command is outside the policy's required command list, reads UNREAD and prints its own MISSING ruling-not-running line while the remaining rows still read -- falsifier: pytest tests/unit/nodes/node_ruling_register_compute/test_refused_rows_and_allowed_commands.py -q fails on the code before this change"
  - id: AC2
    statement: 'AC2: every register read and the whole register read are bounded, and rows the bound did not reach read UNREAD -- falsifier: pytest tests/unit/nodes/node_ruling_register_effect/test_read_budget.py -q fails on the code before this change'
  - id: AC3
    statement: 'AC3: a register journal write failure reaches the tick decision as one UNKNOWN ruling-register-journal line -- falsifier: pytest tests/unit/nodes/node_throughput_tick_decision_compute/test_ruling_register_lines.py -k sink_errors -q fails on the code before this change'
  - id: AC4
    statement: "AC4: the hourly tick's decision input carries the register's judgement or the reason it could not be read on every run -- falsifier: pytest plugins/omni/skills/session-start/tests/test_throughput_tick_ruling_register.py -q fails on the code before this change"
  - id: AC5
    statement: 'AC5: integrated: the running Mac hourly tick prints a MISSING ruling-not-running line for a control row made false on purpose and prints nothing for a true row -- falsifier: the tick output read on the running Mac names no line for the control row'
evidence_requirements:
- kind: tests
  description: The register, facts and tick decision tests pass at the pushed head.
  command: uv run --frozen pytest tests/unit/nodes/node_ruling_register_compute tests/unit/nodes/node_ruling_register_effect tests/unit/nodes/node_throughput_tick_decision_compute tests/nodes/node_throughput_tick_facts_effect -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24556-ac1
  description: Refused-row and required-allowlist tests; each fails on the code before the change.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/nodes/node_ruling_register_compute -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24556-ac2
  description: Per-read and total read budget tests, including the seam test against the facts effect's timeout.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/nodes/node_ruling_register_effect -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24556-ac3
  description: Facts to tick seam test for ruling_register_sink_errors with its positive control.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/nodes/node_throughput_tick_decision_compute/test_ruling_register_lines.py tests/nodes/node_throughput_tick_facts_effect -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24556-ac4
  description: The tick-side step lives in a separate draft pull request in the plugin's own repository; the omnimarket side of that seam is the facts effect golden chain test.
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_throughput_tick_facts_effect -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24556-ac5
  description: The tests behind the integrated reading pass; the live reading on the Mac tick is recorded in the Lab line and a comment once the installed tick runs.
  source: manual
  binds_ac:
  - AC5
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/nodes/node_throughput_tick_decision_compute -k ruling -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24556-integration-proof
  description: Run the node tests on a lab host at the pushed head. Hosted CI cannot reach the lab hosts, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24556 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/nodes/node_ruling_register_compute tests/unit/nodes/node_ruling_register_effect -q --no-cov -n 0 -p no:randomly
    cwd: .
