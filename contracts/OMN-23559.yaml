schema_version: 1.0.0
ticket_id: OMN-23559
title: The GitHub write program refuses a reused label for a different request
summary: The write node recorded each finished write under repository, operation and idempotency key only, and answered a later request with the same key from that record without comparing content, so a request with a different body got the first request's result (and its planned body) back as a replay. The record now carries a digest per request field and a key reused for different content is refused with idempotency_key_conflict, naming the differing fields and never their values.
is_seam_ticket: true
interface_change: true
interfaces_touched:
- topics
requirements:
- id: req-omn23559-key-conflict
  statement: A write whose idempotency key is already recorded for different content is refused idempotency_key_conflict and sends nothing; the same content still replays once.
  acceptance:
  - id: AC1
    statement: 'AC1: a retried write that reuses an idempotency key with a different body, title, base, head or pull request number is refused with the reason idempotency_key_conflict and sends nothing, and a true retry still replays once -- falsifier: env -u PYTHONPATH uv run pytest tests/unit/nodes/node_github_repo_write_effect/test_handler_idempotency_conflict.py -q'
  - id: AC2
    statement: 'AC2: the write request and result shapes that handoff and landing read are pinned by a seam test that fails when either side changes shape, on the in-memory bus -- falsifier: env -u PYTHONPATH uv run pytest tests/unit/handlers/scm/test_scm_write_seam_shapes.py -q'
  - id: AC3
    statement: 'AC3: integrated: one pr-edit sent through the running dev runtime from a lab host with a key already used for a different body is refused with idempotency_key_conflict, and one with a fresh key plans or writes exactly the body it was given -- falsifier: onex scm pr-edit <scratch pull request> --body <text> --idempotency-key <reused key> --dry-run --bus kafka --bus-lane dev shows the refusal, and the same command without the reused key shows the given body'
evidence_requirements:
- kind: tests
  description: The conflict tests and the seam shape tests at the pushed head. With the handler restored to origin/dev, four of the five conflict tests fail.
  command: env -u PYTHONPATH uv run pytest tests/unit/nodes/node_github_repo_write_effect/test_handler_idempotency_conflict.py tests/unit/handlers/scm/test_scm_write_seam_shapes.py -q
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23559-ac1-conflict
  description: The conflict tests pass at the pushed head; four of five fail on the origin/dev handler and the true-retry control passes on both.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/nodes/node_github_repo_write_effect/test_handler_idempotency_conflict.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn23559-ac2-seam
  description: The seam shape tests pass at the pushed head on the in-memory bus.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/handlers/scm/test_scm_write_seam_shapes.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn23559-ac3-runtime
  description: The pr-edit dry-run through the running dev runtime planned the body it was given. The refusal half needs the fix installed and a recorded real write, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  binds_ac:
  - AC3
  checks:
  - check_type: command
    check_value: 'onex scm pr-edit OmniNode-ai/omnimarket#5489 --head-sha 8b25aebeb85d67d23b53aac21d1944e2f575ef3a --body SEAM-RUNTIME-PROBE --dry-run --lane dod-omn23559 --bus kafka --bus-lane dev | grep -q SEAM-RUNTIME-PROBE'
    cwd: .
