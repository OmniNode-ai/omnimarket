dod_evidence:
  - id: "dod-omn19320-ac1-unclassified-check-fails"
    description: "AC1: a register entry with no check_class fails the register's check and the CLI names the unclassified check id."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest 'tests/test_omn19320_check_register.py::TestEveryCheckCarriesItsClassAC1::test_a_check_with_no_class_fails_naming_it' -q -p no:cacheprovider"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC1"]
  - id: "dod-omn19320-ac2-range-floor-pair"
    description: "AC2: a corpus below its stated floor (0.75 against 0.8) is MISSED with a non-zero CLI exit, and one above it (0.955) is MET with exit 0."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest 'tests/test_omn19320_range_evaluator.py::TestThePairAC2::test_a_corpus_below_the_floor_is_missed_and_blocks' 'tests/test_omn19320_range_evaluator.py::TestThePairAC2::test_a_corpus_above_the_floor_is_met' -q -p no:cacheprovider"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC2"]
  - id: "dod-omn19320-ac3-undersized-corpus-refused"
    description: "AC3: an n=40 corpus below the power-analysed required size is REFUSED, the reasons and CLI stdout name 'required n=<N>', and the CLI exits non-zero."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest 'tests/test_omn19320_range_evaluator.py::TestUndersizedCorporaAreRefusedAC3::test_fewer_samples_than_the_power_analysis_requires_is_refused' -q -p no:cacheprovider"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC3"]
  - id: "dod-omn19320-ac4-seed-pinned-run-refused"
    description: "AC4: a run carrying sampling_seed is REFUSED as a range result with a reason naming the run and the seed, and the CLI exits non-zero."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest 'tests/test_omn19320_range_evaluator.py::TestPinnedRunsAreRefusedAC4::test_a_seed_pinned_run_is_refused' -q -p no:cacheprovider"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC4"]
  - id: "dod-omn19320-deploy-probe"
    description: "Deploy probe: the installed range package refuses an unclassified check by name and returns the power-analysed sample size of 88 for floor 0.8, margin 0.1, confidence 0.95 and power 0.8. Runs on the hosted runner without external services."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: |-
          uv run python -c 'from omnimarket.ranges import required_sample_size, validate_check_register; errors = validate_check_register({"schema_version": "check_register.v1", "checks": [{"check_id": "unclassified.check"}]}); assert any("unclassified.check" in error for error in errors), errors; n = required_sample_size(floor=0.8, margin=0.1, confidence=0.95, power=0.8); assert n == 88, n; print("unclassified.check refused; required n=88")'
        cwd: "${OMNI_HOME}/omnimarket"
