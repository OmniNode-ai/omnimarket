schema_version: 1.0.0
ticket_id: OMN-20413
title: The Dependency Security Scan check no longer fails every pull request on a repository setting
summary: The Dependency Security Scan job ran the Dependency Review action, which fails with "Dependency review is not supported on this repository" while the Dependency graph setting is off. The step is removed; the Safety check in the same job still scans the exported requirements and enforces.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn20413-no-dep-review
  statement: The Dependency Security Scan job has no Dependency Review step and keeps its enforcing Safety check.
  acceptance:
  - id: AC1
    statement: 'AC1: security-scan.yml has no dependency-review-action step and the Safety check remains -- falsifier: uv run pytest on the security scan workflow tests fails if the Safety step is lost'
evidence_requirements:
- kind: tests
  description: The security scan workflow tests and the action-ref golden test
  command: uv run --frozen pytest tests/test_security_scan_workflow_omn17427.py tests/ci/test_omn20558_ratchet_burndown_characterization.py -q --no-cov -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn20413-workflow-tests
  description: Runs the security scan workflow tests and the action-ref golden; the golden fails if the workflow and its row list disagree.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/test_security_scan_workflow_omn17427.py tests/ci/test_omn20558_ratchet_burndown_characterization.py -q --no-cov -p no:randomly
    cwd: .
- id: dod-omn20413-no-dep-review-step
  description: Greps the workflow for a dependency-review-action use; it must find none.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: command
    check_value: '! grep -n "uses: actions/dependency-review-action" .github/workflows/security-scan.yml'
    cwd: .
