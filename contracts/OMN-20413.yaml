schema_version: 1.0.0
ticket_id: OMN-20413
title: The Dependency Security Scan check skips dependency review when the repository's Dependency graph is off
summary: The Run Dependency Review step failed every pull request with "Dependency review is not supported on this repository". The workflow now probes the dependency-graph SBOM endpoint and skips the review, with a warning, only on a 404.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn20413-ac1
  statement: 'The dependency review step runs only when the Dependency graph probe did not return 404 -- falsifier: grep the workflow for the probe and the gated condition'
  acceptance:
  - id: AC1
    statement: 'AC1: the dependency review step runs only when the Dependency graph probe did not return 404 -- falsifier: grep the workflow for the probe and the gated condition'
evidence_requirements:
- kind: tests
  description: The workflow carries the probe and the gated review step.
  command: grep -n "steps.depgraph.outputs.enabled == 'true'" .github/workflows/security-scan.yml
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn20413-ac1
  description: AC1 is proven by the review step being gated on the probe output and the probe treating only 404 as disabled.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: command
    check_value: grep -q "steps.depgraph.outputs.enabled == 'true'" .github/workflows/security-scan.yml && grep -q '"\$status" = "404"' .github/workflows/security-scan.yml
    cwd: .
