schema_version: 1.0.0
ticket_id: OMN-20413
title: 'fix(OMN-20413): drop the expired daemon-health row from the dep-health allowlist'
summary: The src/dep_health_allowlist.yaml row for onex.evt.diagnostic.daemon-health.v1 expired on 2026-11-15, so test_this_repo_allowlist_has_no_expired_entries fails on dev and on every pull request. The row is removed; an expired row was already not honored by the sweep.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn20413-green
  statement: The dep-health allowlist carries no row past its expires_at.
  acceptance:
  - id: AC1
    statement: 'AC1: no allowlist row is expired -- falsifier: uv run pytest tests/nodes/test_dep_health_contract_topology.py -q fails on test_this_repo_allowlist_has_no_expired_entries'
evidence_requirements:
- kind: tests
  description: The dep-health topology tests.
  command: env -u PYTHONPATH uv run --frozen pytest tests/nodes/test_dep_health_contract_topology.py -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn20413-ac1-allowlist-test
  description: The dep-health topology tests pass with the expired row removed.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/test_dep_health_contract_topology.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn20413-integration-proof
  description: Hosted CI cannot reach a lab host, so only the local Done gate runs this unbound check. It runs the dep-health topology tests once on a lab host at the sha and fails while any allowlist row is expired.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-20413 --kind test -- sh -c 'uv run --frozen pytest tests/nodes/test_dep_health_contract_topology.py -q --no-cov -n 0 -p no:randomly'
    cwd: .
