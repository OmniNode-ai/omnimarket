schema_version: 1.0.0
title: The narrowed-selection tests read a pinned durations record, so a PR that adds test files cannot walk a light change past the shard bound
ticket_id: OMN-20413
summary: >-
  tests/unit/scripts/test_detect_test_paths.py asserted that a light change stays narrowed against the live config/test_file_durations.json.
  That file must grow with every PR that adds a test file, and the light change selects tests/nodes/ at about 1756 recorded seconds against a bound of 1800, so a PR adding about 90 seconds failed lint, Tests (Split 5/20), Tests (Split 19/20) and CI Summary.
  The tests now read a pinned durations record. The policy, the selector and the live durations file are unchanged.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn20413-pinned-durations
  statement: The selection tests do not depend on the live recorded durations.
  acceptance:
  - id: AC1
    statement: 'AC1: the narrowed-selection tests in test_detect_test_paths.py pass whatever seconds config/test_file_durations.json records -- falsifier: uv run pytest tests/unit/scripts/test_detect_test_paths.py, which fails if a test reads the live file'
evidence_requirements:
- kind: tests
  description: The selection tests run over the pinned durations record.
  command: uv run --frozen pytest tests/unit/scripts/test_detect_test_paths.py -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn20413-ac1-pinned-durations
  description: The selection tests pass over the pinned durations record, and no test in the file reads config/test_file_durations.json.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/scripts/test_detect_test_paths.py -q --no-cov
    cwd: .
  - check_type: command
    check_value: bash -c '! grep -n "config/test_file_durations.json" tests/unit/scripts/test_detect_test_paths.py'
    cwd: .
