schema_version: "1.0.0"
ticket_id: "OMN-20413"
title: "The Dependency Security Scan no longer crashes on multidict and its findings are cleared from the lock"
summary: "Dependency Security Scan was red on dev: safety crashed with Unhandled exception 'multidict' on the locked multidict 6.8.0, which carries an advisory. The lock now holds multidict 7.2.1, certifi 2026.10.23, dnspython 2.9.2, filelock 4.2.9 and pyasn1 0.6.5, the fixed versions for the advisories pip-audit reported. opentelemetry-api 1.44.0 (CVE-2026-114603) stays, because omnibase-infra caps the opentelemetry instrumentation packages below 0.66 and the fix needs 1.45.1."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-omn20413-lock-fixed-pins"
    statement: |-
      uv.lock holds the fixed versions of the five packages the dependency scan flagged and that the lock can take today.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: uv.lock locks multidict, certifi, dnspython, filelock and pyasn1 at or above the first fixed version
evidence_requirements:
  - kind: "tests"
    description: "The locked version of each of the five packages is at or above its fixed floor; on dev the multidict, certifi, dnspython, filelock and pyasn1 cases fail."
    command: "uv run pytest tests/test_omn20413_lock_vulnerable_pins.py -q"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn20413-ac1-lock-fixed-pins"
    description: "AC1. uv.lock locks multidict, certifi, dnspython, filelock and pyasn1 at or above their fixed versions; the test fails on the dev lock."
    source: "manual"
    binds_ac: ["AC1"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/test_omn20413_lock_vulnerable_pins.py -q --no-cov"
        cwd: "${OMNI_HOME}/omnimarket"
