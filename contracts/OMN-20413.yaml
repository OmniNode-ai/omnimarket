schema_version: 1.0.0
ticket_id: OMN-20413
title: 'Dependency Security Scan: move filelock past the advisory range'
summary: The Dependency Security Scan check exports uv.lock and runs safety, which reports three filelock 3.32.6 advisories (affected spec up to 4.2.0) and exits 64 on dev. uv.lock now resolves filelock 4.2.1, the first release outside the affected range. No check, workflow or allowlist is changed.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn20413-filelock
  statement: uv.lock pins filelock outside the range the safety advisories name.
  acceptance:
  - id: AC1
    statement: 'AC1: uv.lock resolves filelock 4.2.1 -- falsifier: the grep for version = "3.32.6" under the filelock entry matches'
evidence_requirements:
- kind: tests
  description: The lock file carries the fixed filelock version.
  command: python3 -c "import re,sys; t=open('uv.lock').read(); sys.exit(0 if re.search(r'name = \"filelock\"\nversion = \"4\.2\.1\"', t) else 1)"
