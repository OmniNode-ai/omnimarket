schema_version: 1.0.0
title: The narrowed-test-selection weight bound keeps headroom over the recorded durations, so a light change stays narrowed
ticket_id: OMN-20413
summary: >-
  On clean dev e57a70ff3f the tests/nodes/ selection plus the always-selected paths is estimated at 1801.7 recorded
  seconds, over the 1800 bound (360 target seconds times 5 shards), so test_detect_test_paths and the light narrowed
  selection take the full suite (NARROWED_SELECTION_TOO_HEAVY). The recorded durations only grow. The selector policy
  target_shard_seconds moves from 360 to 400 (bound 2000); the heavy tests/nodes plus tests/unit selection (about 5,100
  seconds) still takes the 20-shard matrix.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
