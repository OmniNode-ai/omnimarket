schema_version: 1.0.0
ticket_id: OMN-20413
title: The Dependency Security Scan check no longer runs the Dependency Review action
summary: The Dependency Review action fails every pull request with "Dependency review is not supported on this repository" while the Dependency graph setting is off. This pull request removes that step from the security-scan workflow; the Safety scan stays as the enforcing dependency check.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn20413-no-dep-review
  statement: The security-scan workflow does not run the Dependency Review action.
  acceptance:
  - id: AC1
    statement: "AC1: security-scan.yml has no dependency-review-action step and the Safety check remains -- falsifier: the grep for dependency-review-action over the workflow matches if the step returns"
evidence_requirements:
- kind: tests
  description: The workflow action-ref characterization test agrees with the workflow.
  command: uv run --frozen pytest tests/ci/test_omn20558_ratchet_burndown_characterization.py -q --no-cov -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
