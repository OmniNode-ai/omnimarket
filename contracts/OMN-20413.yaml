schema_version: 1.0.0
ticket_id: OMN-20413
title: The composed-runtime-boot check retries the uv interpreter download that timed out on pull requests that did nothing wrong
summary: The step "Build the infra runtime image at the pinned ref" runs make up-local, whose uv run downloads cpython 3.12.10 from github.com. A timed-out or reset download failed the check on four unrelated pull requests. The step now retries up to three times, only when the output holds the uv download failure line; any other failure still fails at once. No check is widened.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn20413-retry-download
  statement: A failed uv interpreter download inside the infra image build step is retried, and any other failure of that step is not.
  acceptance:
  - id: AC1
    statement: 'AC1: the build step retries only on the uv download failure line and fails at once otherwise -- falsifier: grep the workflow for the retry guard on the download failure line'
evidence_requirements:
- kind: manual
  description: The workflow step carries the guarded retry.
  command: grep -c 'Failed to download' .github/workflows/runtime-boot-composed.yml
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn20413-ac1-retry-guard
  description: The build step greps the make output for the uv download failure before retrying, and exits 1 for any other failure.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: command
    check_value: 'grep -q ''grep -q "error: Failed to download" "$log"'' .github/workflows/runtime-boot-composed.yml'
    cwd: .
