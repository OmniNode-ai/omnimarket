schema_version: 1.0.0
ticket_id: OMN-20413
title: the deploy-gate check reads the cited ticket from the pull request title as well as its body
summary: omnimarket's deploy-gate ran the pinned omniclaude deploy-gate action, which reads the cited ticket only from the pull request body, while repo-evidence / dod-verify reads it from the title. A runtime pull request whose title names its ticket and whose head carries that ticket's contracts/OMN-<n>.yaml with a deploy probe was refused with "cites no OMN-XXXX ticket". The workflow now runs the same validator, at the same omniclaude pin and in the same default report mode, with the title and the body.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-deploy-gate-reads-title
    statement: deploy-gate hands the pinned validator the pull request title, taken from the event through env, ahead of the body, with the PR head's contracts directory and no change in the validator's pin or mode.
    acceptance:
      - id: AC1
        statement: 'AC1: the deploy-gate run step, executed with a recording gh and python, hands the validator a --pr-body whose first line is the title and whose tail is the body, and the validator checkout is pinned at omniclaude 61761f04a8c8edfb810bd261bb82ed60b8bcad2d -- falsifier: uv run pytest tests/unit/workflows/test_deploy_gate_reads_pr_title_omn20413.py tests/unit/workflows/test_deploy_gate_reads_repo_contracts_omn20074.py -q -p no:randomly fails at the merge base'
  - id: req-cause-verdict-base-head
    statement: A cause_not_shared verdict holds for its cause key while the repo's base head equals the one the verdict was given on, whatever the member set or the member heads do; the key is leased again when the base head moves.
    acceptance:
      - id: AC3
        statement: 'AC3: a cause is attempted at most its budget, then parked with one operator MSG per park episode, and a fixer HOLD row stops every dispatch and revokes the live leases in its scope -- falsifier: TLC on tla/landing_controller with P11, P12, P14 and their mutant configs, and uv run pytest tests/unit/nodes/node_pr_landing_decision_compute/test_landing_decision_causes.py tests/unit/nodes/node_pr_landing_decision_compute/test_landing_decision_contract.py tests/unit/nodes/node_pr_landing_decision_compute/test_landing_decision_determinism.py tests/unit/nodes/node_pr_landing_decision_compute/test_landing_decision_guards.py tests/unit/nodes/node_pr_landing_decision_compute/test_landing_decision_merge_queue.py tests/unit/nodes/node_pr_landing_decision_compute/test_landing_decision_named_gates.py tests/unit/nodes/node_pr_landing_decision_compute/test_landing_decision_scenarios.py tests/unit/nodes/node_pr_landing_decision_compute/test_landing_decision_stale_cancelled.py -k "budget or fixer_hold"'
  - id: req-reader-coverage-opt-outs
    statement: The local-alerts exposure declares no standing consumers opt-out and the delegation daily exposure declares a reasoned consumers none, as omnibase_infra's exposure-reader-coverage reads them.
    acceptance:
      - id: AC4
        statement: 'AC4: node_projection_local_alerts/contract.yaml has no consumers key and node_projection_delegation/contract.yaml declares consumers none with a reason on its daily exposure -- falsifier: uv run pytest tests/test_omn23159_local_alerts_exposure_reader_declared.py -q -p no:randomly --no-cov fails at the merge base'
  - id: req-receipt-gate-pgdg-retry-pin
    statement: The omnimarket repo-evidence caller pins the omnibase_core receipt-gate reusable at dev-20261113222915-b853619df394 or a later dev-merge tag, which retries every curl error on the PGDG key fetch, and the test-side pin constant equals the caller's pin.
    acceptance:
      - id: AC5
        statement: 'AC5: .github/workflows/call-repo-evidence-gate.yml calls receipt-gate.yml at dev-20261113222915-b853619df394 and tests/ci/receipt_gate_pin.py RECEIPT_GATE_PIN_TAG equals it -- falsifier: the pin test fails if the two differ, and the grep check fails at the merge base, whose pin is dev-20261101103701-2fc5e461fca7'
  - id: req-omn20413-allowlist-green
    statement: The dep-health allowlist carries no row past its expires_at.
    acceptance:
      - id: AC6
        statement: 'AC6: no allowlist row is expired -- falsifier: uv run pytest tests/nodes/test_dep_health_contract_topology.py -q fails on test_this_repo_allowlist_has_no_expired_entries'
  - id: req-omn20413-filelock
    statement: uv.lock pins filelock outside the range the safety advisories name.
    acceptance:
      - id: AC7
        statement: 'AC7: uv.lock resolves filelock 4.2.1 -- falsifier: uv run pytest tests/ci/test_filelock_lock_pin_omn20413.py fails while the filelock entry reads version 3.32.6'
  - id: req-omn20413-census-at-ratchet
    statement: The census of ledger-file readers and writers counts no more files than its ratchet row on this tree, and the ratchet row is unchanged.
    acceptance:
      - id: AC8
        statement: 'AC8: the census counts 186 files against the ratchet row of 186 -- falsifier: uv run pytest tests/unit/validators/test_ledger_file_census.py -q --no-cov -k at_or_under_its_ratchet_row fails at the base head with ratchet-grew omnimarket=188>186'
evidence_requirements:
  - kind: tests
    description: The deploy-gate run step hands the validator the title and the body, and the validator stays at its pin and mode.
    command: uv run pytest tests/unit/workflows/test_deploy_gate_reads_pr_title_omn20413.py tests/unit/workflows/test_deploy_gate_reads_repo_contracts_omn20074.py -q -p no:randomly
  - kind: tests
    description: A cause_not_shared verdict holds across a member set change on the same base head, the key is leased again when the base head moves, and the budget and fixer HOLD tests stay green.
    command: uv run pytest tests/unit/nodes/node_pr_landing_decision_compute/test_landing_decision_causes.py tests/unit/nodes/node_pr_landing_decision_compute/test_landing_decision_contract.py tests/unit/nodes/node_pr_landing_decision_compute/test_landing_decision_determinism.py tests/unit/nodes/node_pr_landing_decision_compute/test_landing_decision_guards.py tests/unit/nodes/node_pr_landing_decision_compute/test_landing_decision_merge_queue.py tests/unit/nodes/node_pr_landing_decision_compute/test_landing_decision_named_gates.py tests/unit/nodes/node_pr_landing_decision_compute/test_landing_decision_scenarios.py tests/unit/nodes/node_pr_landing_decision_compute/test_landing_decision_stale_cancelled.py -q -p no:randomly
  - kind: tests
    description: The lock file carries the fixed filelock version.
    command: uv run pytest tests/ci/test_filelock_lock_pin_omn20413.py -q -p no:randomly --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn20413-ac1-deploy-gate-reads-title
    description: The deploy-gate run step hands the pinned validator the title and the body, and the validator checkout stays at the omniclaude pin.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/workflows/test_deploy_gate_reads_pr_title_omn20413.py tests/unit/workflows/test_deploy_gate_reads_repo_contracts_omn20074.py -q -p no:randomly
    binds_ac:
      - AC1
  - id: dod-omn20413-ac3-verdict-base-head
    description: The landing decision node holds a cause_not_shared verdict on the base head it was given on and leases the cause again once the base head moves; the node's whole test directory, including the budget and fixer_hold tests, passes.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/nodes/node_pr_landing_decision_compute/test_landing_decision_causes.py tests/unit/nodes/node_pr_landing_decision_compute/test_landing_decision_contract.py tests/unit/nodes/node_pr_landing_decision_compute/test_landing_decision_determinism.py tests/unit/nodes/node_pr_landing_decision_compute/test_landing_decision_guards.py tests/unit/nodes/node_pr_landing_decision_compute/test_landing_decision_merge_queue.py tests/unit/nodes/node_pr_landing_decision_compute/test_landing_decision_named_gates.py tests/unit/nodes/node_pr_landing_decision_compute/test_landing_decision_scenarios.py tests/unit/nodes/node_pr_landing_decision_compute/test_landing_decision_stale_cancelled.py -q -p no:randomly
    binds_ac:
      - AC3
  - id: dod-omn20413-integration-proof
    description: The pushed head ran the landing decision node's whole test directory on a lab host through the lab work runner and exited 0. The live controller runs a pinned commit, so the deployed proof follows the pin bump; hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-20413 -- uv run --frozen pytest tests/unit/nodes/node_pr_landing_decision_compute/test_landing_decision_causes.py tests/unit/nodes/node_pr_landing_decision_compute/test_landing_decision_contract.py tests/unit/nodes/node_pr_landing_decision_compute/test_landing_decision_determinism.py tests/unit/nodes/node_pr_landing_decision_compute/test_landing_decision_guards.py tests/unit/nodes/node_pr_landing_decision_compute/test_landing_decision_merge_queue.py tests/unit/nodes/node_pr_landing_decision_compute/test_landing_decision_named_gates.py tests/unit/nodes/node_pr_landing_decision_compute/test_landing_decision_scenarios.py tests/unit/nodes/node_pr_landing_decision_compute/test_landing_decision_stale_cancelled.py -q -p no:randomly
        cwd: .
  - id: dod-omn20413-reader-coverage-opt-outs
    description: The local-alerts exposure drops its stale consumers opt-out and the delegation daily exposure declares a reasoned consumers none, the two findings omnibase_infra's exposure-reader-coverage reads at the e7258b346065 pin. The test fails at the merge base.
    source: manual
    checks:
      - check_type: test_passes
        check_value: env PYTHONDONTWRITEBYTECODE=1 uv run pytest tests/test_omn23159_local_alerts_exposure_reader_declared.py -q -p no:randomly --no-cov
    binds_ac:
      - AC4
  - id: dod-omn20413-deploy-reader-coverage-readback
    description: Hosted-runner deploy artifact check, read at the evaluated checkout revision from the published source. The local-alerts contract must carry no consumers opt-out and the delegation contract must declare consumers none with a reason; either assertion fails at the merge base, where the local-alerts opt-out is present and the delegation opt-out is absent. This reads the source artifact, not a running deployment.
    source: manual
    execution_scope: hosted_and_local
    checks:
      - check_type: command
        check_value: |-
          sha="$(git rev-parse HEAD)"; base="https://raw.githubusercontent.com/OmniNode-ai/omnimarket/$sha/src/omnimarket/nodes"; la="$(curl --fail --silent --show-error --location --max-time 30 "$base/node_projection_local_alerts/contract.yaml")" && dl="$(curl --fail --silent --show-error --location --max-time 30 "$base/node_projection_delegation/contract.yaml")" && ! printf '%s\n' "$la" | grep -q '^  consumers:' && printf '%s\n' "$dl" | grep -q '^      consumers: none$' && printf '%s\n' "$dl" | grep -q '^      consumers_reason:' && echo "OMN-20413 reader-coverage readback PASS"
  - id: dod-omn20413-ac5-receipt-gate-pgdg-retry-pin
    description: The caller pins the receipt-gate at the tag that retries the PGDG key fetch, and the test-side constant matches.
    source: manual
    checks:
      - check_type: test_passes
        check_value: env PYTHONDONTWRITEBYTECODE=1 uv run pytest tests/ci/test_receipt_gate_pin_digest_swap_omn21875.py tests/ci/test_receipt_gate_caller_pin_omn20134.py -q -p no:randomly --no-cov
      - check_type: command
        check_value: grep -q 'receipt-gate.yml@dev-20261113222915-b853619df394' .github/workflows/call-repo-evidence-gate.yml
    binds_ac:
      - AC5
  - id: dod-omn20413-ac6-allowlist-test
    description: The dep-health topology tests pass with the expired row removed.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/nodes/test_dep_health_contract_topology.py -q --no-cov -n 0 -p no:randomly -k 'daemon_health or no_expired'
        cwd: .
    binds_ac:
      - AC6
  - id: dod-omn20413-allowlist-integration-proof
    description: Hosted CI cannot reach a lab host, so only the local Done gate runs this unbound check. It runs the dep-health topology tests once on a lab host at the sha and fails while any allowlist row is expired.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-20413 --kind test -- sh -c 'uv run --frozen pytest tests/nodes/test_dep_health_contract_topology.py -q --no-cov -n 0 -p no:randomly'
        cwd: .
  - id: dod-omn20413-ac7-lock
    description: uv.lock resolves filelock 4.2.1 and no longer 3.32.6.
    source: manual
    checks:
      - check_type: test_passes
        check_value: env PYTHONDONTWRITEBYTECODE=1 uv run pytest tests/ci/test_filelock_lock_pin_omn20413.py -q -p no:randomly --no-cov
        cwd: .
    binds_ac:
      - AC7
  - id: dod-omn20413-ac8-census-at-ratchet
    description: Two test fixtures named a scratch copy with the ledger file's own name and are renamed ledger_copy.md, so the census counts 186 files against the unchanged ratchet row of 186.
    source: manual
    checks:
      - check_type: test_passes
        check_value: env PYTHONDONTWRITEBYTECODE=1 uv run pytest tests/unit/validators/test_ledger_file_census.py tests/unit/nodes/node_projection_work_ledger/test_parity_extra_unsequenced.py tests/nodes/node_compaction_continuation_replay_effect/test_continuation_replay.py -q --no-cov -p no:randomly
        cwd: .
    binds_ac:
      - AC8
