  - id: "req-omn21721-one-pr"
    statement: |-
      The slice lands as one PR titled with this ticket id and its required checks are green on the exact head.
    acceptance:
      - id: "AC3"
        statement: "AC3: the slice lands as one PR titled with this ticket id and its required checks are green on the exact head -- falsifier: uv run onex scm pr-checks at the PR head sha reads every required context success"
