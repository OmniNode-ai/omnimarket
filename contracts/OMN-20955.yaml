---
schema_version: "1.0.0"
ticket_id: "OMN-20955"
title: "OCC retirement: the branch-protection auditor ports out of change control into node_branch_protection_audit_effect, the audited fleet read from a deployment overlay"
summary: "Adds node_branch_protection_audit_effect, the omnimarket home of change control's scripts/audit_branch_protection.sh. contract.yaml + node + handlers: HandlerBranchProtectionAudit is a definition-B handle(ModelBranchProtectionAuditRequest) -> ModelBranchProtectionAuditResult, pure over a snapshot of the fetched GitHub documents keyed by API path; HandlerBranchProtectionFetch is the only GitHub access (read-only REST and GraphQL through omnimarket.github_api, token from the contract-declared api_key_ref); HandlerBranchProtectionPolicyLoad reads the fleet and each repository's role from a branch_protection_audit_overlay.v1 overlay. The shipped default fleet is empty and names no repository; a required overlay that is absent, an invalid overlay or an empty fleet exits 2. Every check of the script is kept with its report text, JSONL records and exit status 0/1. Change control's copy is untouched; workflows still call it until they are repointed."
is_seam_ticket: false
interface_change: true
interfaces_touched:
  - "topics"
  - "public_api"
requirements:
  - id: "req-omn20955-node"
    statement: "A canonical effect node in omnimarket carries the branch-protection audit, runnable from the command line over a live fleet or a saved snapshot."
    acceptance:
      - id: "AC1"
        statement: "AC1: omnimarket carries node_branch_protection_audit_effect (contract.yaml + node + handlers, definition-B handle(request) -> result) whose contract route resolves to the audit handler and its request model -- falsifier: uv run pytest tests/nodes/node_branch_protection_audit_effect/test_registration.py -q fails at the merge base, where the node does not exist"
  - id: "req-omn20955-parity"
    statement: "Every check of the change-control script is kept: required contexts per branch role, App binding, Lane Identity Gate, merge-queue bypass, release-synced main ruleset shape, reviews, enforce_admins, delete_branch_on_merge and the Merge Queue ruleset, with the script's report lines, JSONL records and exit status."
    acceptance:
      - id: "AC2"
        statement: "AC2: the change-control tests for the script, ported, pass against the node, and a fixture missing a required context yields a FAIL finding and exit status 1 -- falsifier: uv run pytest tests/nodes/node_branch_protection_audit_effect/test_branch_protection_audit_app_binding.py tests/nodes/node_branch_protection_audit_effect/test_branch_protection_audit_entrypoint.py tests/nodes/node_branch_protection_audit_effect/test_branch_protection_audit_findings.py tests/nodes/node_branch_protection_audit_effect/test_branch_protection_audit_lane_identity.py tests/nodes/node_branch_protection_audit_effect/test_branch_protection_audit_merge_queue_bypass.py tests/nodes/node_branch_protection_audit_effect/test_branch_protection_audit_release_synced.py tests/nodes/node_branch_protection_audit_effect/test_branch_protection_fetch.py tests/nodes/node_branch_protection_audit_effect/test_branch_protection_policy_load.py tests/nodes/node_branch_protection_audit_effect/test_registration.py -q -p no:randomly"
  - id: "req-omn20955-overlay"
    statement: "The audited fleet and every repository role come from a deployment overlay; the package names no deployment's repositories and refuses to audit an empty or unconfigured fleet."
    acceptance:
      - id: "AC3"
        statement: "AC3: the overlay replaces the empty default per key, and a required overlay that is absent, an invalid overlay or an empty fleet exits 2 rather than reading green -- falsifier: uv run pytest tests/nodes/node_branch_protection_audit_effect/test_branch_protection_policy_load.py tests/nodes/node_branch_protection_audit_effect/test_branch_protection_audit_entrypoint.py -q"
evidence_requirements:
  - kind: "tests"
    description: "AC1 to AC3: the node's focused suite, the change-control tests ported plus the positive control, the overlay loader, the fetch boundary on a fake reader, the entry point and the route registration."
    command: "uv run pytest tests/nodes/node_branch_protection_audit_effect/test_branch_protection_audit_app_binding.py tests/nodes/node_branch_protection_audit_effect/test_branch_protection_audit_entrypoint.py tests/nodes/node_branch_protection_audit_effect/test_branch_protection_audit_findings.py tests/nodes/node_branch_protection_audit_effect/test_branch_protection_audit_lane_identity.py tests/nodes/node_branch_protection_audit_effect/test_branch_protection_audit_merge_queue_bypass.py tests/nodes/node_branch_protection_audit_effect/test_branch_protection_audit_release_synced.py tests/nodes/node_branch_protection_audit_effect/test_branch_protection_fetch.py tests/nodes/node_branch_protection_audit_effect/test_branch_protection_policy_load.py tests/nodes/node_branch_protection_audit_effect/test_registration.py -q -p no:randomly"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
