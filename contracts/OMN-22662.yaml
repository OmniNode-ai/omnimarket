schema_version: 1.0.0
ticket_id: OMN-22662
title: The host reading node probes ledger durability, an appended row must read back from the durable projection within a deadline
summary: Piece 6 of the base-first rebuild plan read only the daily file-against-projection parity receipt, a day late. node_host_reading_effect gains a ledger-durability probe that appends one probe row through the configured bus append route, reads it back by its req cell through the configured read route (the lab read node over the database projection) until a deadline, and writes a host reading row with the append outcome, durable yes or no, the durable lag in seconds and a drill cell. The probe row has its own append route so a drill can break it alone.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn22662-read-back
  statement: A probe row read back from the durable store inside the deadline reads WORKING with its durable lag.
  acceptance:
  - id: AC1
    statement: 'AC1: a probe row that reads back from the durable store inside the deadline gives verdict WORKING with its durable lag in seconds -- falsifier: uv run pytest tests/nodes/node_host_reading_effect/test_ledger_durability_probe.py -q'
- id: req-omn22662-named-break
  statement: An append that returns accepted with no durable row reads NOT WORKING, never WORKING.
  acceptance:
  - id: AC2
    statement: 'AC2: an append route that answers accepted and publishes nothing gives verdict NOT_WORKING reason no-durable-row-by-deadline, shown on the lab against the real read node -- falsifier: python -m omnimarket.nodes.node_host_reading_effect probe --only ledger-durability with the break append command, read on h200'
- id: req-omn22662-read-down
  statement: A read route that fails gives UNKNOWN, never WORKING and never an empty answer.
  acceptance:
  - id: AC3
    statement: 'AC3: a read route that fails gives UNKNOWN source-unreadable and never WORKING -- falsifier: uv run pytest tests/nodes/node_host_reading_effect/test_ledger_durability_probe.py -q'
- id: req-omn22662-chain
  statement: Golden and error chain event tests on the in-memory bus cover the durability probe.
  acceptance:
  - id: AC4
    statement: 'AC4: golden and error chain event tests on the in-memory bus cover the durability probe -- falsifier: uv run pytest tests/nodes/node_host_reading_effect/test_host_reading_chain_events.py -q'
- id: req-omn22662-running
  statement: The h200 hourly host reading unit writes a ledger-durability row read from the running system.
  acceptance:
  - id: AC5
    statement: 'AC5: the h200 hourly host reading unit writes a ledger-durability row read from the running system -- falsifier: onex ledger query --query rows --lane host-reading --term probe=ledger-durability returns a row newer than the install'
evidence_requirements:
- kind: tests
  description: The host reading node suites with the durability probe
  command: uv run --frozen pytest tests/nodes/node_host_reading_effect -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn22662-probe-suite
  description: The durability probe on the in-memory and command backends, each verdict shown by a named break, and the chain event tests.
  source: manual
  binds_ac:
  - AC1
  - AC3
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_host_reading_effect -q --no-cov
    cwd: .
- id: dod-omn22662-running-system
  description: Read on the running system. The drill row (drill=yes, the accept-and-drop append route) reads NOT_WORKING no-durable-row-by-deadline against the real read node, and the h200 hourly unit's operational row reads back. Hosted CI cannot reach the lab read node, so only the local Done gate runs these reads.
  source: manual
  execution_scope: local_done_gate
  binds_ac:
  - AC2
  - AC5
  checks:
  - check_type: command
    check_value: onex ledger query --query rows --lane host-reading --term probe=ledger-durability --term reason=no-durable-row-by-deadline --limit 5 | grep -q 'drill=yes'
    cwd: .
  - check_type: command
    check_value: onex ledger query --query rows --lane host-reading --term probe=ledger-durability --limit 50 | grep -q 'drill=no'
    cwd: .
