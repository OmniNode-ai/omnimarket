schema_version: 1.0.0
ticket_id: OMN-22874
title: "The delegation-writer consumer group stops falling behind: the aggregate republish leaves the commit path"
summary: "The delegation writer republished four whole-table aggregate views inside every message, before that message's offset was committed. At 96,661 rows the views cost about 2.2 s per message (1.9 s the model-routing view), so a burst of delegation events stood as consumer-group lag for seconds and raised the lab lag alarm 25 times in 24 hours. In the consume loop the republish is now marked dirty per tenant and flushed once per contract-declared window, off the commit path. The runtime-dispatch path keeps the inline republish. No alarm, bound or check is changed."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn22874-aggregate-off-commit-path
  statement: "The delegation writer's offset commit never waits on an aggregate view read."
  acceptance:
  - id: AC1
    statement: 'AC1: the measured cause of the delegation-writer lag spikes is named from the broker and writer readings, and a fix at that cause keeps the group under its lag bound for 24 hours, with a failing control reproducing a spike -- falsifier: uv run pytest of the writer''s consumption tests plus the broker lag reading over 24 hours'
evidence_requirements:
- kind: tests
  description: "A burst commits without waiting on one aggregate read; each aggregate is republished once per window"
  command: uv run --frozen pytest tests/test_omn22874_delegation_writer_aggregate_coalescing.py -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn22874-tests
  description: "The writer's consumption tests: the inline control reproduces the hold, the coalesced burst commits without waiting on the views, and each aggregate is republished once per window."
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/test_omn22874_delegation_writer_aggregate_coalescing.py -q --no-cov
    cwd: .
- id: dod-omn22874-integration-proof
  description: Run the writer's consumption tests at the pushed head on a lab host. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-22874 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/test_omn22874_delegation_writer_aggregate_coalescing.py -q --no-cov
    cwd: .
