schema_version: 1.0.0
ticket_id: OMN-25115
title: 'The merged-change reading counts a topic node as subscribed from the retained subscription lines and the manifest'
summary: The merged-change reading read a topic-kind change as NOT_RUNNING (no_trigger_subscription) on the healthy dev runtime because its subscribed fact came only from consumer-join log lines that the container log rotates away. The reading now also credits a node's declared subscribe topic when the runtime's retained subscription-state lines name it.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn25115-running-read
  statement: The reading reads omnimarket#6120 as running where it runs, from facts the runtime still holds.
  acceptance:
  - id: AC1
    statement: 'AC1: the omnimarket tree of the h201 dev runtime image holds the merge, and one run of its change is read on the dev runtime on h201 by the lane itself as a log line, dispatch, health read or job record, at a named revision -- falsifier: ssh read of the dev runtime image tree on h201 shows no file of the merge, or the dev runtime log shows no run of its change after the install'
  - id: AC2
    statement: 'AC2: the change is installed, or the cause is fixed, through the declared installer with no hand edit of a host file, unit or plist, and the installed revision is read back; any code change is a draft PR with a Lab: line -- falsifier: the declared installer''s own status read on h201 names no omnimarket revision for it'
  - id: AC3
    statement: 'AC3: a STATUS row `kv pr=omnimarket#6120 installed=<host>:<revision> observed=<what ran> read_at=<UTC>` is on the work ledger, so the next integration pass marks it SEEN RUNNING -- falsifier: python3 plugins/omni/skills/lane-brief/scripts/lane_brief.py grep ''pr=omnimarket#6120'' returns no row with installed= and observed='
evidence_requirements:
- kind: tests
  description: The merged-change reading log source tests.
  command: env -u PYTHONPATH uv run --frozen pytest tests/nodes/node_merged_change_reading_effect/test_runtime_log_source.py -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn25115-ac1-subscription-from-retained-lines
  description: Hosted proxy for AC1. A log with no consumer-join lines, a manifest declaring the census trigger topic and one retained subscription-state line naming it read as subscribed; a declared topic no line names, a tenant-prefixed topic and an undeclared topic read as not subscribed. The live reading on the dev runtime is the unbound item below.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_merged_change_reading_effect/test_runtime_log_source.py -q --no-cov -n 0 -p no:randomly -k subscription
    cwd: .
- id: dod-omn25115-ac2-cause-fixed
  description: Hosted proxy for AC2. The cause (a subscribed fact that only boot-time join lines could supply) is fixed in the reader; an existing join is neither duplicated nor replaced, and no manifest or an unreadable manifest credits nothing.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_merged_change_reading_effect/test_runtime_log_source.py -q --no-cov -n 0 -p no:randomly -k "join or manifest"
    cwd: .
- id: dod-omn25115-ac3-reads-running
  description: Hosted proxy for AC3. A reading built from the rotated-log facts, the manifest and a published result event gives SEEN_RUNNING with the trigger topic subscribed.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_merged_change_reading_effect/test_runtime_log_source.py -q --no-cov -n 0 -p no:randomly -k rotated_log_subscription_state_to_running_reading
    cwd: .
- id: dod-omn25115-integration-proof
  description: Hosted CI cannot reach a lab host, so only the local Done gate runs this unbound check. It runs the merged-change reader at the sha on a lab host, against the dev runtime named by ONEX_RUNTIME_SSH_HOST and the overlay store named by ONEX_SKILL_OVERLAY_ROOTS, and fails unless omnimarket#6120 reads SEEN_RUNNING.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-25115 --kind test -- sh -c 'uv run --frozen python -m omnimarket.nodes.node_merged_change_reading_effect --change omnimarket#6120 > /tmp/mcr_omn25115_record.json && grep -q SEEN_RUNNING /tmp/mcr_omn25115_record.json'
    cwd: .
