schema_version: 1.0.0
ticket_id: OMN-24263
title: Each machine declares one role and is checked against its role's baseline
summary: The lab host table row gains an optional host role (lab-worker, gpu-model, runtime-host, operator-mac), and a new pure compute node derives a machine's expected set (systemd units and clones, as the host profile the host drift check takes) from the baseline every host carries plus its role's own. The baselines are the node's overlay; a host with no role, a role with no baseline and a role clone that disagrees with the base are refused with a typed reason. The role values of the host rows and the baselines themselves are a separate settings-repository change that waits for this one.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24263-host-role-baseline
  statement: Two machines of one role are checked against the same expected set, and a machine with no declared role is refused rather than guessed.
  acceptance:
  - id: AC1
    statement: 'AC1: the host table row accepts a declared host role from the four roles and refuses an unknown one, and the table loads unchanged when no host declares one -- falsifier: pytest tests/nodes/node_host_role_baseline_compute -n 0 --no-cov -q -k row fails when the column is removed from the row model'
  - id: AC2
    statement: 'AC2: two hosts of one role derive the same expected units and clones, and a host of another role differs only by that role''s entries -- falsifier: the same test file fails when a per-host entry is allowed into the derived list'
  - id: AC3
    statement: 'AC3: a host with no declared role, or a role with no baseline, is refused with a typed reason -- falsifier: the error chain test in the same directory fails when the refusal is removed'
  - id: AC4
    statement: 'AC4: integrated: on lab host h053 the derived list for its declared role is read from the node and passed to the host drift check, which reports its findings -- falsifier: the check result on h053 names no findings source for the derived list'
evidence_requirements:
- kind: tests
  description: The tests of the host role baseline node and of the row model pass.
  command: uv run pytest tests/nodes/node_host_role_baseline_compute -n 0 --no-cov -q
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24263-ac1
  description: A row accepts each of the four roles, refuses an unknown one, and a table with no declared role loads.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_host_role_baseline_compute/test_host_row_role.py -n 0 --no-cov -q
- id: dod-omn24263-ac2
  description: Two hosts of one role derive the same units and clones; another role differs only by the two roles' entries; a baseline entry added to one role reaches that role only.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_host_role_baseline_compute/test_host_role_baseline.py -n 0 --no-cov -q -k 'same_expected_set or another_role or one_role or no_host_field'
- id: dod-omn24263-ac3
  description: A host with no role, a role with no baseline and a conflicting clone are refused with a typed reason; an overlay with an unknown role, a host field or a missing key is refused.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_host_role_baseline_compute/test_host_role_baseline.py tests/nodes/node_host_role_baseline_compute/test_runtime_and_contract.py -n 0 --no-cov -q -k 'refused or missing_a_key or no_declared_role'
- id: dod-omn24263-ac4
  description: 'hosted proxy for AC4: the derived profile is what the host drift check takes and the check reports a declared unit the host lacks and an undeclared unit it carries; the lab reading on h053 is named in the pull request.'
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_host_role_baseline_compute/test_host_role_baseline.py -n 0 --no-cov -q -k 'host_drift_check_takes'
- id: dod-omn24263-integration-proof
  description: Run the host role baseline node's tests on a lab host at the pushed head. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24263 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_host_role_baseline_compute -q --no-cov
