schema_version: 1.0.0
ticket_id: OMN-26642
title: Delegation checks reach the system through our gateway, not the cloud
summary: The seven delegation checks that a cloud workflow graded (C11, C12, C15, C16, C28, C29, C30) are graded by node_delegation_check_probe_effect through requests to the dev gateway whose address is the settings store's delegation_check_gateway row, as the test tenant the dev tenant node declares. C13, C14 and C17 stay graded on a customer machine through the responder chain. The cloud variants of all ten checks are listed under the probe node contract's next_milestone and no cloud workflow is touched.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn26642-gateway-checks
  statement: Each delegation check is graded by the omnimarket check node, and the ones that depended on the cloud reach the system through the dev gateway.
  acceptance:
  - id: AC1
    statement: 'AC1: each of the ten checks is graded by the omnimarket check node through the dev gateway, with no cloud workflow, cloud host or cloud board in its path -- falsifier: a unit test that fails when any check''s resolved endpoint, runner or board is not the gateway address read from the settings store (pytest tests for node_delegation_check_probe_effect)'
  - id: AC2
    statement: 'AC2: the gateway address comes from the settings store and the test tenant from the dev tenant node, nothing hard-coded -- falsifier: a test that fails on a literal host or port in the check node''s handlers (uv run pytest on the check node tests)'
  - id: AC3
    statement: 'AC3: the cloud variants are listed as checks for the next milestone in the check node''s contract or the milestone data, and no cloud workflow is deleted -- falsifier: a contract test that fails when a cloud check is missing from the next-milestone list (uv run pytest on the check node contract test)'
  - id: AC4
    statement: 'AC4: integrated: each rewritten check is read graded end to end through the live dev gateway on the lab, run id in the PR body -- falsifier: onex run-node node_delegation_check_probe_effect against the running dev runtime, then a readback of the check''s receipt and the dev gateway log; a receipt that names no gateway address or reads red fails it'
evidence_requirements:
- kind: tests
  description: The check node's focused tests, each failing before the change and passing on it.
  command: uv run pytest tests/nodes/node_delegation_check_probe_effect tests/nodes/node_build_delegation_checks -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn26642-gateway-route
  description: Each of the seven cloud-dependent checks resolves to the settings store's gateway address, this node as runner and the omnimarket beta board, every request of a check goes to the one gateway client, and the run record names the gateway address and the tenant. The three customer-local checks keep their responder chain row. The tests fail on a check that resolves to another endpoint or a record that names none.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_delegation_check_probe_effect/test_gateway_checks.py -q --no-cov -n 0 -p no:randomly -k 'resolves_to_the_settings_store_gateway or one_gateway_client or names_the_gateway_address or ten_checks'
    cwd: .
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_build_delegation_checks/test_per_check_events_and_probe_routes.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn26642-grading
  description: Each gateway-graded check passes on a healthy gateway and fails, reads not measured or reads precondition absent when the gateway breaks the clause it grades, never green.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_delegation_check_probe_effect/test_gateway_checks.py -q --no-cov -n 0 -p no:randomly -k 'healthy_gateway or fails or not_measured or precondition_absent'
    cwd: .
- id: dod-omn26642-no-literal-host
  description: No handler of the check node and no tick names a host, an address or a port, and the gateway row refuses a loopback or host-local address and carries no default address. The scan fails on a planted literal.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_delegation_check_probe_effect/test_gateway_checks.py -q --no-cov -n 0 -p no:randomly -k 'names_a_host_address_or_port or host_literal_scan or host_local_gateway or explicit_port'
    cwd: .
  - check_type: command
    check_value: grep -q 'delegation_check_gateway' src/omnimarket/nodes/node_overlay_setting_set_effect/contract.yaml
    cwd: .
- id: dod-omn26642-next-milestone
  description: The probe node's contract lists the cloud variant of each of the ten checks under next_milestone, every entry kept and owned by the cloud owner; the test fails when one check is missing.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_delegation_check_probe_effect/test_next_milestone_cloud_checks.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn26642-hosted-reading
  description: "The hosted reading of AC4 (the lab bus and the live dev gateway are not on a hosted runner): every gateway-graded check's run record names the gateway address and the tenant, reads PRECONDITION-ABSENT when the tenant token is absent and never green, and the tick builds its gateway client from the settings store's row. The live reading is in the PR's Lab line and comment."
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_delegation_check_probe_effect/test_gateway_checks.py -q --no-cov -n 0 -p no:randomly -k 'names_the_gateway_address or with_no_tenant_token or no_gateway_row or tenant_token_is_read or credential_kind or jwt_sent'
    cwd: .
- id: dod-omn26642-golden-answers
  description: A good answer of the real in-process workflow gateway (its real caller-identity resolvers, the probe's real HTTP client) passes each of the ten gateway-graded checks under both tenant credential kinds, and an answer with one clause removed fails naming that clause. The unknown-source refusal is read as the 400 naming the source field the real gateway answers, the correlation id of every submit is a UUID, the status is read against the receipt on every field both declared models carry, a registered onxk_ key in x-api-key is accepted, a JWT-shaped value in x-api-key is refused 401 auth.credential.invalid, and a bearer JWT is accepted where the resolver takes one.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_delegation_check_probe_effect/test_golden_answers_gateway_graders.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn26642-hosted-deploy-check
  description: 'Deploy check the hosted runner can run: the contract declares the gateway row and the next-milestone list, the node is registered as an onex.nodes entry point, and the node''s trigger declaration holds. This binds no criterion by itself.'
  source: manual
  checks:
  - check_type: command
    check_value: grep -q 'gateway_row:' src/omnimarket/nodes/node_delegation_check_probe_effect/contract.yaml
    cwd: .
  - check_type: command
    check_value: grep -q 'node_delegation_check_probe_effect = ' pyproject.toml
    cwd: .
- id: dod-omn26642-integration-proof-dev-lane
  description: On a lab host, with the node installed from its pushed branch, onex run-node node_delegation_check_probe_effect grades each of the seven checks through the live dev gateway and the check's receipt names the gateway address and reads green. Hosted CI holds no lab bus, so only the local Done gate runs this unbound check (the lab reading of AC4 is in the PR body).
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: onex lab-work run --bus-lane dev --omnibase-path "${OMNI_HOME:?}" --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-26642 --kind test -- uv run --frozen pytest tests/nodes/node_delegation_check_probe_effect -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn26642-integration-proof-names-bus-lane
  description: The local Done gate item dod-omn26642-integration-proof-dev-lane runs onex lab-work run with --bus-lane dev and --omnibase-path, so the delegation names its broker lane instead of resolving to the shared kafka bus with no broker. This hosted check reads the contract and fails when that item's command drops either flag.
  source: manual
  checks:
  - check_type: command
    check_value: python3 -c "import re,sys,yaml; d=yaml.safe_load(open('contracts/OMN-26642.yaml')); it=[i for i in d['dod_evidence'] if i['id']=='dod-omn26642-integration-proof-dev-lane']; c=it[0]['checks'][0]['check_value']; sys.exit(0 if re.search(r'onex lab-work run --bus-lane dev --omnibase-path ',c) else 1)"
    cwd: .
- id: dod-omn26642-tick-store-reader
  description: The probe tick takes the node overlay, the responder row and the gateway row from the injected settings store reader, so a host whose unit does not name the settings snapshot root grades from the store; a store that serves no gateway row still reads PRECONDITION-ABSENT. The tests fail on a tick that reads the rows only from a per-host path.
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_delegation_check_probe_effect/test_tick_store_reader.py -q --no-cov -n 0 -p no:randomly
    cwd: .
