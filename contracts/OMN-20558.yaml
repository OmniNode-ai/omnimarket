    description: "Run the characterization, plain-check and permanent-profile tests the burn-down adds or changes."
    command: "uv run pytest tests/ci/test_check_action_pins.py tests/ci/test_omn20558_ratchet_burndown_characterization.py tests/unit/runtime/test_omn17556_tenant_projection_profile_is_permanent.py -q"
  - kind: "tests"
    description: "AC3 tests assert the baseline contains only onex.tenant.events, required topics are unique and declared by node contracts, and topic coverage reports present, missing and failed broker checks."
    command: "uv run pytest tests/test_platform_readiness_kafka_topic_coverage.py -q"
emergency_bypass:
