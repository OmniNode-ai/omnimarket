requirements:
  - id: "req-ratchet-burndown"
    statement: "Every omnimarket baseline the burn-down empties is deleted, and its check blocks a planted violation with no baseline argument."
    acceptance:
      - id: "AC1"
        statement: "AC1: Characterization tests pin current behaviour of every module the burn-down touches and pass unchanged before and after the refactor -- falsifier: uv run pytest on the characterization test files at the pre-refactor commit and at the PR head"
      - id: "AC2"
        statement: "AC2: Every baseline file the PR empties is deleted and its check fails on a planted violation with no baseline argument -- falsifier: uv run pytest tests covering each emptied ratchet with a planted violation"
  - id: "req-topic-naming-baseline-and-kafka-topic-coverage"
    statement: "The topic-naming baseline contains only the foreign topic, and platform readiness checks required Kafka topics."
    acceptance:
      - id: "AC3"
        statement: "AC3: The topic-naming baseline contains only onex.tenant.events; required Kafka topics are unique onex.evt. topics ending in .v1 and declared by node contracts; topic coverage is healthy when all required topics are present, names a missing topic, and reports unknown health when rpk fails -- falsifier: uv run pytest tests/test_platform_readiness_kafka_topic_coverage.py -q"
evidence_requirements:
