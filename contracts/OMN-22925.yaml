schema_version: 1.0.0
ticket_id: OMN-22925
title: The daily line of plan section 11 is computed by a node at 05:30 Eastern and reaches the floor and the morning brief
summary: A pure compute node renders the daily line from the floor record's piece 1 reading, the state of join J1 and the count of claims with no TERMINAL; a source that was not read renders UNKNOWN for its part. A scheduled run (a systemd user timer at 05:30 America/New_York) reads the sources, publishes the line beside the floor record and writes one ledger STATUS row.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn22925-daily-line
  statement: The daily line is computed by a node from the floor record, join J1 and the ledger, and a run at 05:30 Eastern publishes it to the floor record's directory and writes one STATUS row.
  acceptance:
  - id: AC1
    statement: 'AC1: the node renders the daily line from the floor record''s piece 1 reading, the J1 join state and the open-claim count, and a test pins the sentence shape -- falsifier: uv run pytest tests/unit/nodes/node_daily_line_compute -q'
  - id: AC2
    statement: 'AC2: a missing source renders UNKNOWN for that part and never an empty cell -- falsifier: uv run pytest tests/unit/nodes/node_daily_line_compute -q -k missing_source'
  - id: AC3
    statement: 'AC3: a lab schedule runs it at 05:30 Eastern, publishes it to the floor record and writes one ledger STATUS row -- falsifier: uv run pytest tests/unit/nodes/node_daily_line_compute/test_schedule.py -q'
evidence_requirements:
- kind: tests
  description: The daily line node's unit tests, including the pinned sentence shape, the missing-source cases and the schedule and scheduled-run tests.
  command: uv run pytest tests/unit/nodes/node_daily_line_compute -q
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn22925-ac1
  description: The sentence-shape tests pass on the branch.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/nodes/node_daily_line_compute -q
- id: dod-omn22925-ac2
  description: The missing-source tests pass on the branch (an unread piece 1, J1 or claim count renders UNKNOWN for its part, and a blank value is treated as unread).
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/nodes/node_daily_line_compute -q -k missing_source
- id: dod-omn22925-ac3
  description: The schedule tests pass on the branch (the timer renders OnCalendar 05:30:00 America/New_York, one scheduled run publishes the line and appends exactly one STATUS row).
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/nodes/node_daily_line_compute/test_schedule.py -q
- id: dod-omn22925-integration-proof
  description: Run the daily line nodes' tests on a lab host at the pushed head. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
