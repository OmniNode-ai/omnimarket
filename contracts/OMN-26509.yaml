schema_version: 1.0.0
ticket_id: OMN-26509
title: The lab alarm node declares the topic the runtime consumes and writes one run line per broker-lag run
summary: 'node_lab_alarm declared event_bus.subscribe_topics as an empty list beside an external command topic, so the runtime auto-wiring skipped it and its log held wiring lines only, while the broker-lag run that the runtime tick drives (node_lab_alarm_scheduled_effect) logged nothing per run. The contract now subscribes to its command topic and routes it to a handler with no required constructor parameter, so auto-wiring reports WIRED; the runtime tick stays consumed by the scheduled node alone, so a tick runs the alarm once; and each scheduled run and each command run writes one runtime log line with its outcome and finished_at.'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn26509-lab-alarm-run-line
  statement: The lab alarm node is declared and wired, and one run of it leaves a run line in the runtime log.
  acceptance:
  - id: AC3
    statement: 'AC3: one node_lab_alarm run line (not wiring, not a consumer group join) is read in the dev runtime log after a broker-lag unit run, or the reason none can be written is named with the contract file -- falsifier: docker logs omninode-runtime | grep node_lab_alarm finds only wiring lines'
evidence_requirements:
- kind: tests
  description: The declared-topic, run-line and command-handler tests pass at the pushed head.
  command: uv run pytest tests/unit/contracts/test_lab_alarm_declared_omn26509.py tests/nodes/node_lab_alarm_scheduled_effect/test_lab_alarm_run_line_omn26509.py tests/nodes/node_lab_alarm/test_lab_alarm_command_handler_omn26509.py -q --no-cov -p no:cacheprovider
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
