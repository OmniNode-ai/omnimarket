- id: dod-omn26509-ac3-run-line
  description: 'AC3, run line: a due scheduled tick writes one log line carrying the outcome and finished_at, a tick inside the interval writes none, and a command on the alarm topic writes one the same way. The line in the dev runtime log is read by the orchestrator after the dev rebuild that follows the merge.'
