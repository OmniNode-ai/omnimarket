schema_version: 1.0.0
ticket_id: OMN-24932
title: 'omnimarket PR 5924 runs where it belongs: the dev runtime on h201 handles one run of it and the run is read with a STATUS row'
summary: The host table keys ingest node dispatches on the dev runtime for every overlay load, but its contract named the success event as a terminal event while publish_topics stayed empty, so the runtime logged no result applier and dropped the result event, and the merged-change reading had no result to see. The contract now declares the result topic as published, as the terminal event, as consumed outside the node, and grants the effects principal WRITE and DESCRIBE on it.
is_seam_ticket: false
interface_change: true
interfaces_touched:
- events
requirements:
- id: req-omn24932-result-published
  statement: The ingest node's result event is a declared output that reaches the bus, so the runtime logs a handled dispatch with a result and the merged-change reading can see it.
  acceptance:
  - id: AC1
    statement: 'AC1: one run of the code omnimarket#5924 merged is read on the dev runtime on h201 (a log line, a dispatch, a health read or a job record), installed from the declared installer at a named revision, with the read time recorded -- falsifier: ssh h201 docker logs on the dev runtime container since its recreate piped to grep for the node name prints at least one handled line'
  - id: AC2
    statement: 'AC2: a STATUS row kv pr=omnimarket#5924 installed=host:revision observed=what-ran read_at=UTC-time is on the ledger, and the next integration pass marks the pull request SEEN RUNNING -- falsifier: grep -F omnimarket#5924 on the rolling work ledger finds the STATUS row and the integration pass line reads SEEN RUNNING'
  - id: AC3
    statement: 'AC3: when a code change is needed, a draft pull request carries a Lab: line and a test that fails on the unfixed shape and passes on the fix -- falsifier: uv run pytest on the new test file in the owning repository, red on the base and green on the branch'
evidence_requirements:
- kind: tests
  description: The new tests load the contract through the runtime loader and wire it on an in-memory bus; they fail on the empty publish_topics shape at the base commit and pass at the head.
  command: uv run --frozen pytest tests/nodes/node_host_table_keys_ingest_effect/test_result_topic_declared.py -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24932-ac3
  description: 'AC3: the new tests load the node contract through the runtime loader and watch one dispatch end as a result event on the declared topic; they pass at the head and fail on the base commit. The base and head runs of this command are attached to the pull request in a Lab: comment.'
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_host_table_keys_ingest_effect/test_result_topic_declared.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24932-ac1-h201-read
  description: 'AC1 is bound to its own falsifier and runs on the local Done gate only: no test here can show the dev runtime on h201 handling the node. It reads false until the pull request merges, overlays#590 merges and the dev runtime is rebuilt. The read then is the falsifier below: the runtime container log on h201 must carry the published-output line for the result topic; it prints nothing before the fix.'
  source: manual
  binds_ac:
  - AC1
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: bash -c 'ssh h201 "docker logs --since 6h omninode-runtime 2>&1" | grep -F "Published output event to onex.evt.omnimarket.host-table-keys-ingested.v1"'
    cwd: .
- id: dod-omn24932-ac2-status-row
  description: 'AC2 is bound to its own falsifier and runs on the local Done gate only: the STATUS row is written to the rolling work ledger by the lane that reads AC1 after the merges above. The falsifier below finds a STATUS row naming omnimarket#5924 that carries the installed and observed cells; it prints nothing before that row exists.'
  source: manual
  binds_ac:
  - AC2
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: bash -c 'grep -F "omnimarket#5924" "${ONEX_LEDGER_PATH:?}" | grep -F "| STATUS |" | grep -F "installed=" | grep -F "observed="'
    cwd: .
- id: dod-omn24932-integration-proof
  description: 'Integration proof: the pushed head''s ingest node tests ran on a lab host through the lab work runner and exited 0. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check; the h201 reads are the two checks above, which wait on the merges and the dev rebuild.'
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24932 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_host_table_keys_ingest_effect -q --no-cov
    cwd: .
