    check_value: 'uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-22869 -- uv run --frozen pytest tests/unit/lab_work/test_lab_host_table_volumes_root.py tests/unit/nodes/node_host_reading_effect/test_probe_host_canary.py -q --no-cov'
