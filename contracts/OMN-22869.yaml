schema_version: 1.0.0
ticket_id: OMN-22869
title: The lab host row model accepts volumes_root, so the piece 2 host canary source reads the host table and the piece can read WORKING
summary: ModelLabHostRow gains the optional cell volumes_root (an absolute directory, never the root). The lab host table carries it on the h101 row, and the row model forbade it, so every table read answered could_not_check and the piece 2 canary source failed.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn22869-volumes-root
  statement: A host row with volumes_root loads, a row without it loads, a relative or root value is refused, and the packaged host table loads whole.
  acceptance:
  - id: AC1
    statement: "AC1: the piece 2 canary source reads and the piece reads WORKING on the board, or a measured cause names why the piece is really not working, with a failing control -- falsifier: uv run pytest of the piece 2 reading tests plus the board read after one publish"
evidence_requirements:
- kind: tests
  description: The row model tests and the piece 2 host canary probe tests at the pushed head.
  command: uv run --frozen pytest tests/unit/lab_work/test_lab_host_table_volumes_root.py tests/unit/nodes/node_host_reading_effect/test_probe_host_canary.py -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
- id: dod-omn22869-volumes-root
  description: The row model tests and the host canary probe tests pass; with the row model reverted to origin/dev the two row-declares-volumes_root tests fail.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/lab_work/test_lab_host_table_volumes_root.py tests/unit/nodes/node_host_reading_effect/test_probe_host_canary.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn22869-integration-proof
  description: The pushed head ran the row model tests and the host canary probe tests on a lab host through the lab work runner and exited 0. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
