---
schema_version: "1.0.0"
ticket_id: OMN-24030
title: "Stop the group reaper deleting the host drift check's reader groups"
summary: "The consumer-group guard protects the host drift check's persisted per-host reader group so each check run reads only new events."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn24030-guard-spares-reader-groups
    statement: The guard never classifies local.<package>.host_drift_fleet.h<N>.<hex12>.__t.<topic> as reapable, and a reap run still deletes per-call groups and stops at its first delete error.
    acceptance:
      - id: AC1
        statement: 'AC1: the consumer-group guard contract protects the host drift check persisted per-host reader group so is_reapable is false for it -- falsifier: uv run pytest tests/unit/nodes/node_consumer_group_guard_effect/test_consumer_group_reaper.py -k drift_checks_persisted -q --no-cov fails on origin/dev'
      - id: AC2
        statement: 'AC2: a golden reap run holding the live reader groups and per-call groups deletes only the per-call groups, and an error run still stops at the first error and spares the reader groups -- falsifier: uv run pytest tests/unit/nodes/node_consumer_group_guard_effect/test_consumer_group_reaper.py tests/test_golden_chain_broker_acl_reconcile_effect.py -q --no-cov'
      - id: AC3
        statement: 'AC3: integrated: on the running guard host a reap pass leaves the host drift reader groups in place and events_read in the host-drift last-run.json on h053 falls from the thousands to under 500 -- falsifier: read consumer.events_read in the host-drift last-run.json on h053 two ticks after the guard host runs the merged contract'
evidence_requirements:
  - kind: "tests"
    description: "Reaper tests: the live host drift reader groups are never reapable, golden and error chains"
    command: "uv run pytest tests/unit/nodes/node_consumer_group_guard_effect/test_consumer_group_reaper.py tests/test_golden_chain_broker_acl_reconcile_effect.py -q --no-cov"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-001"
    description: "The host drift reader groups are never reapable and the golden and error reap chains hold (the new drift tests fail on the merge base contract, pass after)"
    source: "manual"
    binds_ac: [AC1, AC2]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/nodes/node_consumer_group_guard_effect/test_consumer_group_reaper.py tests/test_golden_chain_broker_acl_reconcile_effect.py -q --no-cov --tb=line"
        cwd: "."
  - id: "dod-omn24030-deploy-probe"
    description: "Deploy probe: the guard contract GitHub serves at the checked-out commit carries the host drift reader group protection, which the merge base does not."
    source: "manual"
    binds_ac: [AC3]
    checks:
      - check_type: "command"
        check_value: >-
          bash -o pipefail -c 'gh api "repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_consumer_group_guard_effect/contract.yaml?ref=$(git rev-parse HEAD)" --jq .content | base64 -d | grep -F "host_drift_fleet" | grep -F "[0-9a-f]{12}(\.__t" > /dev/null'
        cwd: "."
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/nodes/node_consumer_group_guard_effect/test_consumer_group_reaper.py -k drift_checks_persisted -q --no-cov --tb=line"
        cwd: "."
  - id: "dod-omn24030-integration-proof"
    description: "The pushed head ran the guard reaper and ACL reconcile tests on a lab host and exited 0. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check."
    source: "manual"
    execution_scope: "local_done_gate"
    checks:
      - check_type: "command"
        check_value: uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24030 -- uv run --frozen pytest tests/unit/nodes/node_consumer_group_guard_effect tests/test_golden_chain_broker_acl_reconcile_effect.py -q --no-cov
        cwd: "."
  - id: "dod-omn24030-live-read"
    description: "On the lab host h053 the host drift check reads only new events: events_read in its last-run.json is under 500 two ticks after the guard host runs the merged contract."
    source: "manual"
    execution_scope: "local_done_gate"
    checks:
      - check_type: "command"
        check_value: >-
          python3 -c "import json,os;d=json.load(open(os.path.expanduser('~/.omninode/host-drift/last-run.json')));assert d['consumer']['events_read']<500,d['consumer']"
        cwd: "."
