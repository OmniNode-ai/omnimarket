schema_version: "1.0.0"
ticket_id: "OMN-26614"
title: "onex setup names shell profile conflicts in plain words instead of raw JSON"
summary: "When onex setup finds shell profile conflicts, the human (non---json) output names each conflict in plain words; the machine-readable JSON output keeps the structured conflict list unchanged."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn26614-plain-shell-conflicts
  statement: "Shell-safety conflicts are rendered as one plain line per conflict in human output, with remedy wording, while JSON output keeps structured conflicts."
  acceptance:
  - id: AC1
    statement: 'AC1: each conflict is shown as one plain line naming the file, the line number (when the conflict is in a profile) and what it does, with no JSON; Falsifier: tests/e2e/test_setup_workflow_cli.py::test_shell_conflicts_print_one_plain_line_per_conflict'
  - id: AC2
    statement: 'AC2: each plain line says whether --set-aside fixes it or it must be fixed by hand; Falsifier: tests/e2e/test_setup_workflow_cli.py::test_shell_conflicts_print_one_plain_line_per_conflict'
  - id: AC3
    statement: 'AC3: the machine-readable JSON output still carries the structured conflict list; Falsifier: tests/e2e/test_setup_workflow_cli.py::test_json_output_keeps_structured_conflict_list'
evidence_requirements:
- kind: tests
  description: Human output renders one plain line per conflict with remedy wording.
  command: uv run pytest tests/e2e/test_setup_workflow_cli.py::test_shell_conflicts_print_one_plain_line_per_conflict tests/unit/nodes/node_onex_setup_effect/test_setup_cli_shell_conflict_lines.py -q -n 0 --no-cov -p no:cacheprovider
- kind: tests
  description: JSON output keeps the structured conflict list.
  command: uv run pytest tests/e2e/test_setup_workflow_cli.py::test_json_output_keeps_structured_conflict_list -q -n 0 --no-cov -p no:cacheprovider
