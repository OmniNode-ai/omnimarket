schema_version: 1.0.0
ticket_id: OMN-23527
title: Merge checks that fetch their checker report GitHub rate limits as such and retry
summary: The Skip Count Ratchet downloaded its JUnit reports with three attempts inside two minutes, which one 6.5 minute GitHub rate-limit burst outlasted. The download now makes six attempts spanning 450 seconds, names a download still refused by a rate limit or 5xx in the job summary, and stays blocking.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn23527-rate-limit
    statement: A GitHub rate limit or server error on the checker's input fetch is retried and named, never read as a finding about the code, and never makes the check pass.
    acceptance:
      - id: AC3
        statement: 'AC3: the Skip Count Ratchet artifact download retries over a span longer than 390 seconds, names a still-rate-limited download in the job summary, and stays blocking -- falsifier: uv run pytest tests/ci/test_skip_count_ratchet_download_retry_omn23527.py -q fails 6 of its 8 tests on the workflow as origin/dev holds it'
evidence_requirements:
  - kind: tests
    description: The focused workflow tests, each driving the step's own script with a faked rate-limit answer, a faked server error, a non-rate-limit failure and a faked real violation, with the pre-image failing control.
    command: uv run pytest tests/ci/test_skip_count_ratchet_download_retry_omn23527.py -q
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn23527-tests
    description: The focused tests pass on the branch and fail on the workflow as origin/dev holds it.
    source: manual
    binds_ac:
      - AC3
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/ci/test_skip_count_ratchet_download_retry_omn23527.py -q
  - id: dod-omn23527-integration-proof
    description: Run the focused tests on a lab host at the pushed head. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23527 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/ci/test_skip_count_ratchet_download_retry_omn23527.py -q --no-cov
