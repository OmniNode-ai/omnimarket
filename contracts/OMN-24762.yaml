- kind: tests
  description: The repo-wide contract check, the arch graph ticket contract test and the arch graph bolt tests.
  command: env -u PYTHONPATH uv run --frozen pytest tests/ci/test_repo_evidence_caller_workflow.py tests/handlers/test_arch_graph_bolt_ticket_contract.py tests/handlers/test_arch_graph_bolt_host_overlay.py tests/models/test_arch_graph_bolt_overlay_model.py -q --no-cov -n 0 -p no:randomly
