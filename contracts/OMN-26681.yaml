schema_version: 1.0.0
title: A burst of gateway submits answers within the client timeout and one tenant's burst does not delay another tenant's job
ticket_id: OMN-26681
summary: >-
  PostgresWorkflowStore.admit took a pooled connection and only then waited on the tenant's advisory lock, so N
  same-tenant submits held N connections of the shared pool while they waited, and every other tenant's auth lookup,
  rate-limit read and status update queued behind them. This change takes a per-tenant in-process gate before the
  connection, so a burst waits holding nothing and at most one connection per tenant is parked on the lock. This pull
  request owns AC3 (the cause with file and line and a test that fails on the base revision). AC1 and AC2 are dev
  readbacks the orchestrator takes after the runtime is rolled; this change does not claim them.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn26681-admit-gate
  statement: A burst of same-tenant submits does not hold pooled connections while waiting for the tenant lock.
  acceptance:
