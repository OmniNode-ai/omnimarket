schema_version: 1.0.0
ticket_id: OMN-23991
title: Make the repo-state and declared clone refresh command topics exist on the development broker
summary: The two command topics read by the repo-state serve and the declared clone refresh serve are declared only as consumed or externally produced, so boot provisioning never creates them. The host installer registry node now lists both in its event_bus publish topics, where boot provisioning reads them, and the census test fails when a consumed command topic is neither boot provisioned nor listed with the reason it has no live consumer.
is_seam_ticket: true
interface_change: true
interfaces_touched:
- topics
requirements:
- id: req-omn23991-serve-command-topics
  statement: Every command topic a host serve process reads is in the set boot provisioning creates for the loaded contracts, or is listed in the census test with the reason it has no live consumer.
  acceptance:
  - id: AC1
    statement: "AC1: the two command topics the repo-state serve and the declared clone refresh serve read are declared where boot provisioning creates topics -- falsifier: uv run pytest tests/nodes/node_pr_landing_tick_orchestrator/test_rerun_request_topics_provisioned.py -q fails on the base contract of node_host_installer_registry_units and passes with the change"
  - id: AC2
    statement: "AC2: every consumed command topic is boot provisioned or listed in the census test with the reason it has no live consumer -- falsifier: the same test fails when a new consumed-only command topic is added without an entry, and when an entry no longer applies"
  - id: AC3
    statement: "AC3: integrated: after the development runtime rebuilds from the merge, onex.cmd.omnimarket.repo-state-query-requested.v1 exists on the development broker and the repo-state-serve unit reinstalled on h053 answers one query -- falsifier: the topic probe on the dev lane shows UNKNOWN_TOPIC_OR_PART before and the topic present after, and the unit's log shows a served query"
evidence_requirements:
- kind: tests
  description: The census and provisioning tests pass at the pushed head.
  command: uv run pytest tests/nodes/node_pr_landing_tick_orchestrator/test_rerun_request_topics_provisioned.py -q -p no:randomly --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23991-ac1
  description: 'AC1: the repo-state and declared clone refresh provisioning test passes at the head and fails with the merge base contract of node_host_installer_registry_units.'
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_pr_landing_tick_orchestrator/test_rerun_request_topics_provisioned.py -q -p no:randomly --no-cov -k declared_clone_refresh
    cwd: .
- id: dod-omn23991-ac2
  description: 'AC2: the census test passes at the head and fails at the merge base.'
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_pr_landing_tick_orchestrator/test_rerun_request_topics_provisioned.py -q -p no:randomly --no-cov -k consumed_only
    cwd: .
- id: dod-omn23991-ac3
  description: 'hosted proxy for AC3: the provisioning tests that stand in for the broker pass here; the dev-lane topic probe readings before and after and the served query are posted as a pull request comment naming the head.'
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_pr_landing_tick_orchestrator/test_rerun_request_topics_provisioned.py -q -p no:randomly --no-cov
    cwd: .
- id: dod-omn23991-integration-proof
  description: the census and provisioning tests run on a lab host at the pushed head; hosted CI cannot reach the lab, so only the local Done gate runs this unbound check
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23991 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_pr_landing_tick_orchestrator/test_rerun_request_topics_provisioned.py -q --no-cov -p no:randomly
