        statement: "AC2: a regression test built from the recorded receipt of run cf7e176d-9213-42c2-ac8d-610571ace8bd (attempt error \"Server disconnected without sending a response.\", scrubbed) fails on f9bc19a9105a and passes on the fix -- falsifier: uv run pytest tests/unit/delegation/test_rung_killed_mid_call_failure_class.py -q -k receipt_cf7e176d"
