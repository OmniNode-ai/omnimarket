  - id: "req-omn21313-transport-error-typed"
    statement: |-
      A provider call whose server closes or resets the connection without a response is recorded model_unavailable with the error text kept.
    acceptance:
      - id: "AC1"
        statement: "AC1: a provider call whose server closes the connection without a response (httpx.RemoteProtocolError, and a connection reset after the request was sent) is recorded with failure_class=model_unavailable and the error text kept, not unknown -- falsifier: uv run pytest tests/unit/delegation/test_rung_killed_mid_call_failure_class.py -q"
  - id: "req-omn21313-receipt-regression"
    statement: |-
      The recorded receipt error of run cf7e176d-9213-42c2-ac8d-610571ace8bd is typed model_unavailable.
    acceptance:
