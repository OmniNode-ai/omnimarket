title: "A delegation rung killed mid-call is typed failure_class=unknown, not model_unavailable"
summary: "HandlerLlmDelegationCall typed only httpx.TimeoutException and httpx.HTTPStatusError ahead of its bare except Exception, so a server that closed or reset the connection after the chat POST (httpx.RemoteProtocolError, httpx.ReadError) was recorded unknown. An httpx.TransportError branch now records it model_unavailable with the error text kept."
