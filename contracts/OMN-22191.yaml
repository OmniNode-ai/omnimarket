    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: |-
          uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane fill-ticket-OMN-22191-20261103T1924Z -- uv run --frozen pytest tests/nodes/node_entrypoint_lib_compute/test_golden_chain_entrypoint_lib_compute.py tests/nodes/node_ledger_reconcile_command_compute/test_golden_chain_ledger_reconcile_command_compute.py tests/nodes/node_tool_use_rubric_compute/test_golden_chain_tool_use_rubric_compute.py -q --no-cov -m "not kafka"
        cwd: .
