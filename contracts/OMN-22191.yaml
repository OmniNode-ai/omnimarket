schema_version: '1.0.0'
ticket_id: OMN-22191
title: G0 script rebuild, slices 1 to 3 - lane-end nodes and compute nodes
summary: Slices 1 to 3 of the ten G0 script rebuild. Slice 1 is the lane-end nodes node_lane_tree_inventory_effect, node_lane_closeout_effect and node_lane_closeout_orchestrator. Slice 2 is four pure compute nodes porting lane_rules_block.py, onex_pillar_owner.py, ledger_rows.py and ledger_tail.py. Slice 3 is three pure compute nodes porting the decisions of entrypoint_lib.sh, tool_use_rubric.py and onex_ledger_reconcile.py. The release and the plugin wiring are later slices.
is_seam_ticket: false
interface_change: true
interfaces_touched:
  - events
  - topics
  - public_api
requirements:
  - id: req-g0-slice-2-nodes
    statement: Four of the ten G0 scripts are nodes whose handler tests pass in omnimarket CI. The other six are not covered by this slice.
    acceptance:
      - id: AC1
        statement: 'AC1: Each of the ten G0 scripts (entrypoint_lib.sh, lane_rules_block.py, ledger_rows.py, ledger_tail.py, onex_lane_closeout.py, onex_ledger.py, onex_ledger_reconcile.py, onex_pillar_owner.py, skill_exec.py, tool_use_rubric.py) is rebuilt as an omnimarket node whose handler tests and canonical shape check pass in omnimarket CI, and the release holding them is published -- falsifier: uv run pytest on a rebuilt node''s test directory fails, the shape check ([OMN-21331](https://linear.app/omninode/issue/OMN-21331)) exits non-zero on a new file, or the published release lacks one of the nodes'
  - id: req-g0-slice-3-nodes
    statement: Three of the ten G0 scripts are nodes whose handler tests pass in omnimarket CI. The other seven are not covered by this slice.
    acceptance:
      - id: AC1
        statement: 'AC1: Each of the ten G0 scripts (entrypoint_lib.sh, lane_rules_block.py, ledger_rows.py, ledger_tail.py, onex_lane_closeout.py, onex_ledger.py, onex_ledger_reconcile.py, onex_pillar_owner.py, skill_exec.py, tool_use_rubric.py) is rebuilt as an omnimarket node whose handler tests and canonical shape check pass in omnimarket CI, and the release holding them is published -- falsifier: uv run pytest on a rebuilt node''s test directory fails, the shape check ([OMN-21331](https://linear.app/omninode/issue/OMN-21331)) exits non-zero on a new file, or the published release lacks one of the nodes'
  - id: req-lane-end-nodes
    statement: Lane end is a node, with its tree inventory line, its operations guard verdict and its closeout cell returned as typed results.
    acceptance:
      - id: AC2
        statement: 'AC2: Lane end is a node: node_lane_closeout_orchestrator, node_lane_tree_inventory_effect and node_lane_closeout_effect (guard, wip_push, closeout) run over a fixture lane directory with two trees and return the inventory line, the guard verdict and the closeout result that the ported onex_lane_closeout tests expect, under the in-memory profile and the Redpanda profile -- falsifier: uv run pytest on the three node directories fails under either profile'
evidence_requirements:
  - kind: tests
    description: Handler tests of the four slice 2 nodes, with literal expected values ported from the source scripts' behaviour.
    command: uv run pytest tests/nodes/node_lane_rules_block_compute/test_golden_chain_lane_rules_block_compute.py tests/nodes/node_onex_pillar_owner_compute/test_golden_chain_onex_pillar_owner_compute.py tests/nodes/node_ledger_rows_build_compute/test_golden_chain_ledger_rows_build_compute.py tests/nodes/node_ledger_tail_compute/test_golden_chain_ledger_tail_compute.py -q --no-cov -m "not kafka"
  - kind: tests
    description: Handler tests of the three slice 3 nodes, with literal expected values checked against the source scripts' behaviour.
    command: uv run pytest tests/nodes/node_entrypoint_lib_compute/test_golden_chain_entrypoint_lib_compute.py tests/nodes/node_ledger_reconcile_command_compute/test_golden_chain_ledger_reconcile_command_compute.py tests/nodes/node_tool_use_rubric_compute/test_golden_chain_tool_use_rubric_compute.py -q --no-cov -m "not kafka"
  - kind: tests
    description: Inventory lines, the ported guard cases, the closeout cell and the lane-end run over two trees.
    command: uv run pytest tests/nodes/node_lane_tree_inventory_effect tests/nodes/node_lane_closeout_effect tests/nodes/node_lane_closeout_orchestrator -q --no-cov -m "not kafka"
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-g0-slice-2-handler-tests
    description: The four slice 2 node test directories pass. This covers lane_rules_block, onex_pillar_owner, ledger_rows and ledger_tail only; the other six G0 scripts and the published release are not part of this evidence.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/nodes/node_lane_rules_block_compute/test_golden_chain_lane_rules_block_compute.py tests/nodes/node_onex_pillar_owner_compute/test_golden_chain_onex_pillar_owner_compute.py tests/nodes/node_ledger_rows_build_compute/test_golden_chain_ledger_rows_build_compute.py tests/nodes/node_ledger_tail_compute/test_golden_chain_ledger_tail_compute.py -q --no-cov -m "not kafka"
        cwd: ${OMNI_HOME}/omnimarket
    binds_ac: [AC1]
  - id: dod-omn22191-slice-2-integration-proof
    description: The four slice 2 node test directories pass on a lab host at the pushed sha. Hosted CI does not run this unbound check; only the local Done gate does.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: |-
          uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane fill-ticket-OMN-22191-20261103T1154Z -- uv run --frozen pytest tests/nodes/node_lane_rules_block_compute/test_golden_chain_lane_rules_block_compute.py tests/nodes/node_onex_pillar_owner_compute/test_golden_chain_onex_pillar_owner_compute.py tests/nodes/node_ledger_rows_build_compute/test_golden_chain_ledger_rows_build_compute.py tests/nodes/node_ledger_tail_compute/test_golden_chain_ledger_tail_compute.py -q --no-cov -m "not kafka"
        cwd: .
  - id: dod-g0-slice-2-deploy-source-readback
    description: Read each compute handler from the public repository at the checked-out commit and require its entry point. The hosted runner needs only curl and GitHub HTTPS access. A missing handler or failed HTTP read fails the check; handler behaviour is covered by the AC1 tests.
    source: manual
    execution_scope: hosted_and_local
    checks:
      - check_type: command
        check_value: |-
          bash -o pipefail -c 'curl --fail --silent --show-error --location --max-time 30 "https://raw.githubusercontent.com/OmniNode-ai/omnimarket/$(git rev-parse HEAD)/src/omnimarket/nodes/node_lane_rules_block_compute/handlers/handler_lane_rules_block.py" | grep -F "class HandlerLaneRulesBlock:" > /dev/null'
      - check_type: command
        check_value: |-
          bash -o pipefail -c 'curl --fail --silent --show-error --location --max-time 30 "https://raw.githubusercontent.com/OmniNode-ai/omnimarket/$(git rev-parse HEAD)/src/omnimarket/nodes/node_onex_pillar_owner_compute/handlers/handler_onex_pillar_owner.py" | grep -F "class HandlerOnexPillarOwner:" > /dev/null'
      - check_type: command
        check_value: |-
          bash -o pipefail -c 'curl --fail --silent --show-error --location --max-time 30 "https://raw.githubusercontent.com/OmniNode-ai/omnimarket/$(git rev-parse HEAD)/src/omnimarket/nodes/node_ledger_rows_build_compute/handlers/handler_ledger_rows_build.py" | grep -F "class HandlerLedgerRowsBuild:" > /dev/null'
      - check_type: command
        check_value: |-
          bash -o pipefail -c 'curl --fail --silent --show-error --location --max-time 30 "https://raw.githubusercontent.com/OmniNode-ai/omnimarket/$(git rev-parse HEAD)/src/omnimarket/nodes/node_ledger_tail_compute/handlers/handler_ledger_tail.py" | grep -F "class HandlerLedgerTail:" > /dev/null'
  - id: dod-g0-slice-3-handler-tests
    description: The three slice 3 node test directories pass. This covers entrypoint_lib, tool_use_rubric and onex_ledger_reconcile only; the other seven G0 scripts and the published release are not part of this evidence.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/nodes/node_entrypoint_lib_compute/test_golden_chain_entrypoint_lib_compute.py tests/nodes/node_ledger_reconcile_command_compute/test_golden_chain_ledger_reconcile_command_compute.py tests/nodes/node_tool_use_rubric_compute/test_golden_chain_tool_use_rubric_compute.py -q --no-cov -m "not kafka"
        cwd: ${OMNI_HOME}/omnimarket
    binds_ac: [AC1]
  - id: dod-omn22191-slice-3-integration-proof
    description: The three slice 3 node test directories pass on a lab host at the pushed sha. Hosted CI does not run this unbound check; only the local Done gate does.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: |-
          uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane fill-ticket-OMN-22191-20261103T1924Z -- uv run --frozen pytest tests/nodes/node_entrypoint_lib_compute/test_golden_chain_entrypoint_lib_compute.py tests/nodes/node_ledger_reconcile_command_compute/test_golden_chain_ledger_reconcile_command_compute.py tests/nodes/node_tool_use_rubric_compute/test_golden_chain_tool_use_rubric_compute.py -q --no-cov -m "not kafka"
        cwd: .
  - id: dod-g0-slice-3-deploy-source-readback
    description: Read each compute handler from the public repository at the checked-out commit and require its entry point. The hosted runner needs only curl and GitHub HTTPS access. A missing handler or failed HTTP read fails the check; handler behaviour is covered by the AC1 tests.
    source: manual
    execution_scope: hosted_and_local
    checks:
      - check_type: command
        check_value: |-
          bash -o pipefail -c 'curl --fail --silent --show-error --location --max-time 30 "https://raw.githubusercontent.com/OmniNode-ai/omnimarket/$(git rev-parse HEAD)/src/omnimarket/nodes/node_entrypoint_lib_compute/handlers/handler_entrypoint_lib.py" | grep -F "class HandlerEntrypointLib:" > /dev/null'
      - check_type: command
        check_value: |-
          bash -o pipefail -c 'curl --fail --silent --show-error --location --max-time 30 "https://raw.githubusercontent.com/OmniNode-ai/omnimarket/$(git rev-parse HEAD)/src/omnimarket/nodes/node_ledger_reconcile_command_compute/handlers/handler_ledger_reconcile_command.py" | grep -F "class HandlerLedgerReconcileCommand:" > /dev/null'
      - check_type: command
        check_value: |-
          bash -o pipefail -c 'curl --fail --silent --show-error --location --max-time 30 "https://raw.githubusercontent.com/OmniNode-ai/omnimarket/$(git rev-parse HEAD)/src/omnimarket/nodes/node_tool_use_rubric_compute/handlers/handler_tool_use_rubric.py" | grep -F "class HandlerToolUseRubric:" > /dev/null'
  - id: dod-lane-end-inmemory
    description: The three node directories pass under the in-memory profile, including the guard verdicts ok, wip and keep and the two-tree lane-end run.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/nodes/node_lane_tree_inventory_effect tests/nodes/node_lane_closeout_effect tests/nodes/node_lane_closeout_orchestrator -q --no-cov -m "not kafka"
        cwd: ${OMNI_HOME}/omnimarket
    binds_ac: [AC2]
  - id: dod-omn22191-integration-proof
    description: The same three node directories pass under the Redpanda profile on a lab host. Hosted CI cannot reach the broker, so only the local Done gate runs this unbound check.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: |-
          uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane omn-22191-0445 -- uv run --frozen pytest tests/nodes/node_lane_tree_inventory_effect tests/nodes/node_lane_closeout_effect tests/nodes/node_lane_closeout_orchestrator -q --no-cov -m kafka
        cwd: .
  - id: dod-omn22191-deploy-source-readback
    description: Hosted-runner source-artifact readback compares the published lane closeout handler at the evaluated revision with this checkout and requires its guard, WIP push and linked-worktree removal paths. This checks the published source artifact, not a running service revision.
    source: manual
    checks:
      - check_type: command
        check_value: |
          set -eu;
          readback_dir="$(mktemp -d)";
          trap 'rm -rf "$readback_dir"' EXIT;
          revision="$(git rev-parse HEAD)";
          path=src/omnimarket/nodes/node_lane_closeout_effect/handlers/handler_lane_closeout.py;
          curl --fail --silent --show-error --location --retry 2 --max-time 20 \
            "https://raw.githubusercontent.com/OmniNode-ai/omnimarket/$revision/$path" \
            --output "$readback_dir/handler_lane_closeout.py";
          cmp "$path" "$readback_dir/handler_lane_closeout.py";
          grep -F 'verdict, detail = _guard(request, tree)' "$readback_dir/handler_lane_closeout.py";
          grep -F 'tree, "push", "-q", request.url or "origin", f"HEAD:refs/heads/{wip_branch}"' "$readback_dir/handler_lane_closeout.py";
          grep -F '"worktree", "remove", "--force", str(tree)' "$readback_dir/handler_lane_closeout.py";
          printf 'lane closeout source readback matched %s\n' "$revision"
        cwd: .
