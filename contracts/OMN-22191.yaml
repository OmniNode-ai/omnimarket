schema_version: '1.0.0'
ticket_id: OMN-22191
title: Lane end as nodes - tree inventory, closeout guard and closeout orchestrator (slice 1, AC2)
summary: Slice 1 of the ten G0 script rebuild. The lane-end nodes node_lane_tree_inventory_effect, node_lane_closeout_effect and node_lane_closeout_orchestrator, run over a fixture lane directory with two trees under the in-memory and the Redpanda profile. The other nine G0 scripts, the plugin scaffold and the release are later slices.
is_seam_ticket: false
interface_change: true
interfaces_touched:
  - events
  - topics
  - public_api
requirements:
  - id: req-lane-end-nodes
    statement: Lane end is a node, with its tree inventory line, its operations guard verdict and its closeout cell returned as typed results.
    acceptance:
      - id: AC2
        statement: 'AC2: Lane end is a node: node_lane_closeout_orchestrator, node_lane_tree_inventory_effect and node_lane_closeout_effect (guard, wip_push, closeout) run over a fixture lane directory with two trees and return the inventory line, the guard verdict and the closeout result that the ported onex_lane_closeout tests expect, under the in-memory profile and the Redpanda profile -- falsifier: uv run pytest on the three node directories fails under either profile'
evidence_requirements:
  - kind: tests
    description: Inventory lines, the ported guard cases, the closeout cell and the lane-end run over two trees.
    command: uv run pytest tests/nodes/node_lane_tree_inventory_effect tests/nodes/node_lane_closeout_effect tests/nodes/node_lane_closeout_orchestrator -q --no-cov -m "not kafka"
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-lane-end-inmemory
    description: The three node directories pass under the in-memory profile, including the guard verdicts ok, wip and keep and the two-tree lane-end run.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/nodes/node_lane_tree_inventory_effect tests/nodes/node_lane_closeout_effect tests/nodes/node_lane_closeout_orchestrator -q --no-cov -m "not kafka"
        cwd: ${OMNI_HOME}/omnimarket
    binds_ac: [AC2]
  - id: dod-omn22191-integration-proof
    description: The same three node directories pass under the Redpanda profile on a lab host. Hosted CI cannot reach the broker, so only the local Done gate runs this unbound check.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: |-
          uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane omn-22191-0445 -- uv run --frozen pytest tests/nodes/node_lane_tree_inventory_effect tests/nodes/node_lane_closeout_effect tests/nodes/node_lane_closeout_orchestrator -q --no-cov -m kafka
        cwd: .
  - id: dod-omn22191-deploy-source-readback
    description: Hosted-runner source-artifact readback compares the published lane closeout handler at the evaluated revision with this checkout and requires its guard, WIP push and linked-worktree removal paths. This checks the published source artifact, not a running service revision.
    source: manual
    checks:
      - check_type: command
        check_value: |
          set -eu;
          readback_dir="$(mktemp -d)";
          trap 'rm -rf "$readback_dir"' EXIT;
          revision="$(git rev-parse HEAD)";
          path=src/omnimarket/nodes/node_lane_closeout_effect/handlers/handler_lane_closeout.py;
          curl --fail --silent --show-error --location --retry 2 --max-time 20 \
            "https://raw.githubusercontent.com/OmniNode-ai/omnimarket/$revision/$path" \
            --output "$readback_dir/handler_lane_closeout.py";
          cmp "$path" "$readback_dir/handler_lane_closeout.py";
          grep -F 'verdict, detail = _guard(request, tree)' "$readback_dir/handler_lane_closeout.py";
          grep -F 'tree, "push", "-q", request.url or "origin", f"HEAD:refs/heads/{wip_branch}"' "$readback_dir/handler_lane_closeout.py";
          grep -F '"worktree", "remove", "--force", str(tree)' "$readback_dir/handler_lane_closeout.py";
          printf 'lane closeout source readback matched %s\n' "$revision"
        cwd: .
