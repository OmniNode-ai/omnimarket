schema_version: '1.0.0'
ticket_id: OMN-22191
title: G0 script rebuild, slices 2 and 3 - seven compute nodes
summary: Slice 2 of the ten G0 script rebuild. Four pure compute nodes with a behaviour-preserving port of lane_rules_block.py, onex_pillar_owner.py, ledger_rows.py and ledger_tail.py. Slice 3 of the ten G0 script rebuild. Three pure compute nodes with a behaviour-preserving port of the decisions of entrypoint_lib.sh, tool_use_rubric.py and onex_ledger_reconcile.py. onex_ledger.py and skill_exec.py are already covered by node_onex_ledger_admission_compute and node_skill_exec_decision_compute on dev. The lane-end nodes are slice 1, a separate pull request. The release and the plugin wiring are later slices.
is_seam_ticket: false
interface_change: true
interfaces_touched:
  - events
  - topics
  - public_api
requirements:
  - id: req-g0-slice-2-nodes
    statement: Four of the ten G0 scripts are nodes whose handler tests pass in omnimarket CI. The other six are not covered by this slice.
    acceptance:
      - id: AC1
        statement: 'AC1: Each of the ten G0 scripts (entrypoint_lib.sh, lane_rules_block.py, ledger_rows.py, ledger_tail.py, onex_lane_closeout.py, onex_ledger.py, onex_ledger_reconcile.py, onex_pillar_owner.py, skill_exec.py, tool_use_rubric.py) is rebuilt as an omnimarket node whose handler tests and canonical shape check pass in omnimarket CI, and the release holding them is published -- falsifier: uv run pytest on a rebuilt node''s test directory fails, the shape check ([OMN-21331](https://linear.app/omninode/issue/OMN-21331)) exits non-zero on a new file, or the published release lacks one of the nodes'
  - id: req-g0-slice-3-nodes
    statement: Three of the ten G0 scripts are nodes whose handler tests pass in omnimarket CI. The other seven are not covered by this slice.
    acceptance:
      - id: AC1
        statement: 'AC1: Each of the ten G0 scripts (entrypoint_lib.sh, lane_rules_block.py, ledger_rows.py, ledger_tail.py, onex_lane_closeout.py, onex_ledger.py, onex_ledger_reconcile.py, onex_pillar_owner.py, skill_exec.py, tool_use_rubric.py) is rebuilt as an omnimarket node whose handler tests and canonical shape check pass in omnimarket CI, and the release holding them is published -- falsifier: uv run pytest on a rebuilt node''s test directory fails, the shape check ([OMN-21331](https://linear.app/omninode/issue/OMN-21331)) exits non-zero on a new file, or the published release lacks one of the nodes'
evidence_requirements:
  - kind: tests
    description: Handler tests of the four slice 2 nodes, with literal expected values ported from the source scripts' behaviour.
    command: uv run pytest tests/nodes/node_lane_rules_block_compute/test_golden_chain_lane_rules_block_compute.py tests/nodes/node_onex_pillar_owner_compute/test_golden_chain_onex_pillar_owner_compute.py tests/nodes/node_ledger_rows_build_compute/test_golden_chain_ledger_rows_build_compute.py tests/nodes/node_ledger_tail_compute/test_golden_chain_ledger_tail_compute.py -q --no-cov -m "not kafka"
  - kind: tests
    description: Handler tests of the three slice 3 nodes, with literal expected values checked against the source scripts' behaviour.
    command: uv run pytest tests/nodes/node_entrypoint_lib_compute/test_golden_chain_entrypoint_lib_compute.py tests/nodes/node_ledger_reconcile_command_compute/test_golden_chain_ledger_reconcile_command_compute.py tests/nodes/node_tool_use_rubric_compute/test_golden_chain_tool_use_rubric_compute.py -q --no-cov -m "not kafka"
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-g0-slice-2-handler-tests
    description: The four slice 2 node test directories pass. This covers lane_rules_block, onex_pillar_owner, ledger_rows and ledger_tail only; the other six G0 scripts and the published release are not part of this evidence.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/nodes/node_lane_rules_block_compute/test_golden_chain_lane_rules_block_compute.py tests/nodes/node_onex_pillar_owner_compute/test_golden_chain_onex_pillar_owner_compute.py tests/nodes/node_ledger_rows_build_compute/test_golden_chain_ledger_rows_build_compute.py tests/nodes/node_ledger_tail_compute/test_golden_chain_ledger_tail_compute.py -q --no-cov -m "not kafka"
        cwd: ${OMNI_HOME}/omnimarket
    binds_ac: [AC1]
  - id: dod-omn22191-slice-2-integration-proof
    description: The four slice 2 node test directories pass on a lab host at the pushed sha. Hosted CI does not run this unbound check; only the local Done gate does.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: |-
          uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane fill-ticket-OMN-22191-20261103T1154Z -- uv run --frozen pytest tests/nodes/node_lane_rules_block_compute/test_golden_chain_lane_rules_block_compute.py tests/nodes/node_onex_pillar_owner_compute/test_golden_chain_onex_pillar_owner_compute.py tests/nodes/node_ledger_rows_build_compute/test_golden_chain_ledger_rows_build_compute.py tests/nodes/node_ledger_tail_compute/test_golden_chain_ledger_tail_compute.py -q --no-cov -m "not kafka"
        cwd: .
  - id: dod-g0-slice-2-deploy-source-readback
    description: Read each compute handler from the public repository at the checked-out commit and require its entry point. The hosted runner needs only curl and GitHub HTTPS access. A missing handler or failed HTTP read fails the check; handler behaviour is covered by the AC1 tests.
    source: manual
    execution_scope: hosted_and_local
    checks:
      - check_type: command
        check_value: |-
          bash -o pipefail -c 'curl --fail --silent --show-error --location --max-time 30 "https://raw.githubusercontent.com/OmniNode-ai/omnimarket/$(git rev-parse HEAD)/src/omnimarket/nodes/node_lane_rules_block_compute/handlers/handler_lane_rules_block.py" | grep -F "class HandlerLaneRulesBlock:" > /dev/null'
      - check_type: command
        check_value: |-
          bash -o pipefail -c 'curl --fail --silent --show-error --location --max-time 30 "https://raw.githubusercontent.com/OmniNode-ai/omnimarket/$(git rev-parse HEAD)/src/omnimarket/nodes/node_onex_pillar_owner_compute/handlers/handler_onex_pillar_owner.py" | grep -F "class HandlerOnexPillarOwner:" > /dev/null'
      - check_type: command
        check_value: |-
          bash -o pipefail -c 'curl --fail --silent --show-error --location --max-time 30 "https://raw.githubusercontent.com/OmniNode-ai/omnimarket/$(git rev-parse HEAD)/src/omnimarket/nodes/node_ledger_rows_build_compute/handlers/handler_ledger_rows_build.py" | grep -F "class HandlerLedgerRowsBuild:" > /dev/null'
      - check_type: command
        check_value: |-
          bash -o pipefail -c 'curl --fail --silent --show-error --location --max-time 30 "https://raw.githubusercontent.com/OmniNode-ai/omnimarket/$(git rev-parse HEAD)/src/omnimarket/nodes/node_ledger_tail_compute/handlers/handler_ledger_tail.py" | grep -F "class HandlerLedgerTail:" > /dev/null'
  - id: dod-g0-slice-3-handler-tests
    description: The three slice 3 node test directories pass. This covers entrypoint_lib, tool_use_rubric and onex_ledger_reconcile only; the other seven G0 scripts and the published release are not part of this evidence.
