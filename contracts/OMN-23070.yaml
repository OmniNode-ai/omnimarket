schema_version: 1.0.0
ticket_id: OMN-23070
title: The delegation replay test stamps its request at test start, so a slow test split never expires it
summary: test_delegation_workflow_replay_omn19560 stamped its request when the module loaded. A split that collects the module and runs it about 19 minutes later (Tests Split 2/2 took 73 minutes) passed the 900 second completion bound, the workflow expired the request without routing, and the test hit StopIteration. The stamp is now taken at test start. No check, bound or baseline is changed.
