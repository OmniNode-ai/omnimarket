- id: req-omn23070-tessl-findings
  statement: Each Tessl finding on omnimarket#5296 and omnimarket#5350 still true at dev's head has a test that fails on dev and passes with the fix; each finding already fixed is named in the pull request body with the dev line that settles it.
  acceptance:
  - id: AC1
    statement: 'AC1: the placement tests of the snapshot job and restore drill, the command line prune warning test and the join refusal contract window test fail on dev and pass on the fix -- falsifier: uv run --frozen pytest tests/unit/nodes/node_work_ledger_copy_effect/test_snapshot_placement.py tests/unit/nodes/node_join_refusal_effect/test_join_refusal_tessl_findings.py -q --no-cov'
  - id: AC2
    statement: 'AC2: the whole test directories of both nodes pass with the fix -- falsifier: uv run --frozen pytest tests/unit/nodes/node_work_ledger_copy_effect tests/unit/nodes/node_join_refusal_effect -q --no-cov'
