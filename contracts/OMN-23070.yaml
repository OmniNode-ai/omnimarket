schema_version: 1.0.0
ticket_id: OMN-23070
title: Real Tessl findings on merged omnimarket#5296 and #5350 are fixed or settled against dev's head
summary: Tessl reviewed the work-ledger snapshot job (5296) and the join refusal node (5350); both merged before every finding was settled. Read against dev, the still-true findings are the off-source storage check that compared two overlay labels instead of the machine the job runs on, the prune warning the command line dropped, and the contract's unqualified once-only promise over a bounded journal window. The snapshot job now refuses unless it runs on the declared store host, the drill unless it runs on the declared drill host, host names compare without case, trailing dot or domain suffix, the command line prints the prune warning, and the join refusal contract states the journal window as the scope of its once-only answer. No bound, verdict or check is widened.
