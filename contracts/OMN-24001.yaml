schema_version: 1.0.0
ticket_id: OMN-24001
title: The installer reads a typed settings document so the local model service setting passes the settings checks
summary: The host system-unit installer takes an optional units_file in its request and validates the whole units document through a typed model, ModelNetUnitsOverlay, so the overlays repository can load and pin the document as its standard overlay.yaml.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24001-typed-units-document
  statement: node_host_installer_net_units reads the units document named by the request's units_file (default units.yaml, a path-like name refused), validates it through ModelNetUnitsOverlay and refuses an invalid document with the typed reason overlay-invalid naming each failing field path before anything is written.
  acceptance:
  - id: AC1
    statement: "AC1: a request that names a units file reads that file from the overlay root, and a request that names none reads units.yaml as before -- falsifier: uv run pytest tests/nodes/node_host_installer_net_units/test_host_net_units_overlay_file.py -q -p no:randomly --no-cov fails at the merge base"
  - id: AC2
    statement: "AC2: the typed overlay model refuses a document with a wrong schema, a unit with no kind or a serving unit with no files, and accepts the vllm-gpu0 document of the settings repository -- falsifier: uv run pytest tests/nodes/node_host_installer_net_units/test_host_net_units_overlay_file.py -q -p no:randomly --no-cov -k model fails at the merge base"
  - id: AC3
    statement: "AC3: the settings repository loads overlays/node_host_installer_net_units/overlay.yaml through the typed model at the pinned revision -- falsifier: the overlays ci step Each overlay loads through its node's own model goes red when the pin line for node_host_installer_net_units is removed"
  - id: AC4
    statement: "AC4: integrated: on h201 the installer from the merged code reads the overlay.yaml of the settings repository and a dry run of vllm-gpu0 reports Restart=always and gpu 0.83 with the rendered digest equal to the pinned one -- falsifier: the dry run on h201 reports a different restart rule, share or digest, or refuses the document"
evidence_requirements:
- kind: tests
  description: The overlay-file tests and the existing net unit installer tests pass at the pushed head.
  command: uv run pytest tests/nodes/node_host_installer_net_units -q -p no:randomly --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
