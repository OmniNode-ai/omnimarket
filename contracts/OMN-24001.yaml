  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_host_installer_net_units/test_host_net_units_overlay_file.py -q -p no:randomly --no-cov
    cwd: .
- id: dod-omn24001-ac2
  description: 'AC2: the typed model tests pass at the head and fail at the merge base.'
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_host_installer_net_units/test_host_net_units_overlay_file.py -q -p no:randomly --no-cov -k model
    cwd: .
- id: dod-omn24001-ac3
  description: 'AC3: the pin and the document live in the overlays repository (pull request OmniNode-ai/overlays#358); here the node test loads a fixture document through the same model and the existing media units document shape passes.'
  source: manual
