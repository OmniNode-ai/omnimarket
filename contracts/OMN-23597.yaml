schema_version: 1.0.0
ticket_id: OMN-23597
title: Prepush login overlay gets a checked model
summary: The prepush_logins overlay (schema version and the row table) is loaded through ModelPrepushLoginsOverlay, which refuses a row the guard node's own parser refuses (tilde path, parent segment, wrong field count, duplicate key, no rows). The overlays repository pins prepush_logins to this model so its check step reads the overlay as validated.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23597-login-overlay-model
  statement: The prepush_logins overlay loads through a typed model that applies the guard node's own row rule, and the overlays repository pins it.
  acceptance:
  - id: AC1
    statement: 'AC1: a model of the prepush login overlay is loaded by the overlay reader and refuses a row the guard node''s own parser refuses -- falsifier: pytest tests/nodes/node_pytest_full_suite_host_guard/test_prepush_logins_overlay_model.py -q fails at the merge base'
evidence_requirements:
- kind: tests
  description: Golden, seam and error chain tests of the overlay model with an injected break
  command: uv run --frozen pytest tests/nodes/node_pytest_full_suite_host_guard -q --no-cov -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23597-model-tests
  description: Runs the overlay model's golden, seam and error chain tests. The injected break replaces the node's row parser inside the model and a tilde row then loads, which shows the error cases depend on the node's rule. The test file is absent at the merge base, so the command fails there.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_pytest_full_suite_host_guard/test_prepush_logins_overlay_model.py -q --no-cov -p no:randomly
    cwd: .
- id: dod-omn23597-integration-proof-lab
  description: Runs the node's tests at the pushed head on a lab host through the lab work runner. Hosted CI cannot reach the lab runner, so only the local Done gate runs this unbound item.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: 'env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23597 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_pytest_full_suite_host_guard -q --no-cov -p no:randomly'
    cwd: .
