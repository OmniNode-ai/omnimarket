schema_version: 1.0.0
ticket_id: OMN-26729
title: The hosted done gate counts a skipped lab-only item as verified only when a matching lab receipt exists
summary: A local_done_gate run publishes its per-item verdicts bound to the contract revision on the verdict topic; the hosted verifier counts a skipped local_done_gate item verified only when a receipt for that exact item and contract revision reads verified.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn26729-ldg-receipt
  statement: The hosted done-gate verifier and the local done-gate meet through a published receipt, without widening the gate.
  acceptance:
  - id: AC1
    statement: 'AC1: a local_done_gate run publishes its verified receipt on the bus with the ticket, contract revision, item ids and verdicts -- falsifier: a unit test of the local run finds no receipt event, or one missing a field'
  - id: AC2
    statement: 'AC2: the hosted verifier counts a skipped local_done_gate item as verified only when a receipt for that exact item and contract revision reads verified -- falsifier: a unit test with a matching receipt still refuses, or one with no receipt or another revision''s receipt passes'
  - id: AC3
    statement: 'AC3: one proven ticket closes over the bus on dev with its lab receipt -- falsifier: the ticket transition for that ticket on dev returns no terminal or a refusal'
evidence_requirements:
- kind: tests
  description: The focused receipt tests, each failing against the unchanged collector and passing on the change.
  command: uv run pytest tests/nodes/node_dod_verify/test_local_done_gate_receipt.py -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn26729-receipt-published
  description: A local_done_gate run publishes a receipt carrying the ticket, contract sha and per-item verdicts, and a hosted run publishes none.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_dod_verify/test_local_done_gate_receipt.py -q --no-cov -n 0 -p no:randomly -k test_local_done_gate_run_publishes_receipt_and_hosted_run_does_not
    cwd: .
- id: dod-omn26729-receipt-gate
  description: A skipped local_done_gate item with no receipt still refuses, a receipt for that item and contract revision clears it, and a receipt for another revision, another item or reading failed refuses.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_dod_verify/test_local_done_gate_receipt.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn26729-other-host-failure
  description: The store OMN-26115 held on 2026-11-27 (four VERIFIED runs on one host, then a FAILED run from a host with no lab appended last) clears the skipped lab-only item, a later FAILED reading from the same host still refuses, and failed-only readings never clear it.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_dod_verify/test_omn26729_receipt_other_host_failure.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn26729-verifier-state-root
  description: The Done-write guard starts the verifier with ONEX_STATE_DIR on a fresh temp dir while ONEX_STATE_ROOT keeps the runtime root; the store OMN-26115 held on 2026-11-27, under the runtime root only, clears the skipped lab-only item, a state root with no receipts still refuses, and another contract revision's lookup still refuses.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_dod_verify/test_omn26729_receipts_under_verifier_state_root.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn26729-integration-proof
  description: On a lab host, with the branch checked out at its pushed sha, the receipt tests run with a known good (a matching receipt clears the item) and a known bad (a receipt for another revision leaves it refused). Hosted CI holds no lab host, so only the local Done gate runs this check; its receipt is the lab receipt AC3 names.
  source: manual
  execution_scope: local_done_gate
  binds_ac:
  - AC3
  checks:
  - check_type: command
    check_value: onex lab-work run --bus-lane dev --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-26729-ldg-receipt --kind test -- uv run --frozen pytest tests/nodes/node_dod_verify/test_local_done_gate_receipt.py -q --no-cov -n 0 -p no:randomly
    cwd: .
