schema_version: 1.0.0
ticket_id: OMN-23693
title: A timer entrypoint run inside a test no longer leaves a process-ending clock armed
summary: "The overlay store read, overlay store load and declared clone refresh tick entrypoints arm a process-ending faulthandler timer and now cancel it on every return path, as the c32 probe and job log filler ticks already do. Run in-process by a test, the uncancelled timer ended the whole pytest run seconds later, silently, on whichever test was running (Tests splits 3, 16, 18 and 19 on open pull requests). No deadline value, flag, marker, timeout or required check changes."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23693-tick-disarms-deadline
  statement: After any tick entrypoint's main returns in-process, no process-ending faulthandler timer is left armed; every deadline value and every return code is unchanged.
  acceptance:
  - id: AC1
    statement: 'AC1: after each of the five timer entrypoints returns in-process, no process-ending faulthandler timer is left armed -- falsifier: uv run pytest tests/unit/workflows/test_tick_entrypoints_disarm_deadline.py fails at the base, 3 of 6 tests red'
  - id: AC2
    statement: 'AC2: the deadline values and the production behaviour of each entrypoint are unchanged -- falsifier: the existing tick tests (tests/unit/nodes/node_overlay_store, tests/nodes/node_canonical_clone_refresh_effect) still pass'
  - id: AC3
    statement: 'AC3: a pytest run where the last tick is followed by more than its deadline of other tests ends with a pytest summary -- falsifier: the lab replay of the tick test followed by a 130 second test exits 1 with no summary at the base and 0 with the change'
  - id: AC4
    statement: 'AC4: integrated: the Tests splits on this pull request print a pytest summary and the Split 16 job of an open change that died before passes on a dev merge -- falsifier: the Tests job logs'
evidence_requirements:
- kind: tests
  description: The tick deadline tests and the neighbouring tick tests.
  command: uv run --frozen pytest tests/unit/workflows/test_tick_entrypoints_disarm_deadline.py tests/unit/nodes/node_overlay_store tests/nodes/node_canonical_clone_refresh_effect -q --no-cov -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23693-ac1-disarm-tests
  description: The five-entrypoint disarm tests pass; at the base the three entrypoints that never cancelled (overlay store read, overlay store load, declared clone refresh) fail.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/workflows/test_tick_entrypoints_disarm_deadline.py -q --no-cov -p no:randomly
    cwd: .
- id: dod-omn23693-ac2-neighbours
  description: The existing overlay store and declared clone tick tests still pass (run together with the disarm test file, so the bound check fails at the base).
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/workflows/test_tick_entrypoints_disarm_deadline.py tests/unit/nodes/node_overlay_store tests/nodes/node_canonical_clone_refresh_effect -q --no-cov -p no:randomly
    cwd: .
- id: dod-omn23693-ac3-replay
  description: 'The hosted part of AC3: the recorded arm and cancel events of each tick entrypoint end with a cancel; the lab replay (the overlay store tick test followed by a 130 second test, exit 1 with no summary at the base, 0 with the change) is read from the pull request body.'
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/workflows/test_tick_entrypoints_disarm_deadline.py -k disarms -q --no-cov -p no:randomly
    cwd: .
- id: dod-omn23693-ac4-integrated
  description: 'The hosted part of AC4: the whole disarm test file, which fails at the base, passes; the read of the pull request''s own Tests job logs (every split prints a pytest summary) and of Split 16 on an open change after a dev merge waits for the merge.'
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/workflows/test_tick_entrypoints_disarm_deadline.py -q --no-cov -p no:randomly
    cwd: .
- id: dod-omn23693-integration-proof
  description: 'The pushed head ran the tick deadline tests and the overlay store and declared clone tick tests on a lab host through the lab work runner and exited 0. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.'
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23693 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/workflows/test_tick_entrypoints_disarm_deadline.py tests/unit/nodes/node_overlay_store tests/nodes/node_canonical_clone_refresh_effect -q --no-cov -n 0 -p no:randomly
    cwd: .
