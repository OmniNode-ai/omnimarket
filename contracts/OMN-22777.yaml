schema_version: "1.0.0"
ticket_id: OMN-22777
title: "The quiet-host alarm raises a row for a host that goes quiet again after an alarm covered it, instead of reading it as already raised"
summary: >-
  The alarm kept one open episode whose host set only grew, so a host that recovered and went quiet again, or one that
  read unattributed before its alias existed, was judged already raised for as long as the episode lasted (nine days on
  2026-11-06). The open alarm now records the hosts that are quiet now (a host that reads healthy drops out), and the
  hosts it counts as covered are those it records that the newest quiet-host row on the ledger also names, so the
  ledger row is the record of what was raised.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn22777-quiet-again-raises
    statement: A host that was in an open quiet-host alarm and goes quiet again after reading healthy raises a row naming it, and a host the newest row names stays deduped.
    acceptance:
      - id: AC1
        statement: 'AC1: a host that read healthy and goes quiet again raises a new row naming it -- falsifier: uv run pytest tests/nodes/node_silent_failure_alarm_effect -q --no-cov -k quiet_host_dedupe, whose recovered-host test fails on the handler before the fix'
      - id: AC2
        statement: 'AC2: an open alarm whose recorded hosts include one the newest quiet-host row does not name raises a row for it, and a host the newest row names stays deduped -- falsifier: uv run pytest tests/nodes/node_silent_failure_alarm_effect -q --no-cov -k quiet_host_dedupe'
      - id: AC3
        statement: 'AC3: the installed unit on the real state names h201 in a quiet-host row on its first tick and then reads deduped for the same hosts -- falsifier: read the newest quiet-host row on the rolling ledger and the unit last-run.json after two ticks'
evidence_requirements:
  - kind: tests
    description: The dedupe tests, run on a lab host at the pushed head, and the same tests with the handler at its base.
    command: uv run --frozen pytest tests/nodes/node_silent_failure_alarm_effect tests/nodes/node_silent_failure_alarm_compute -q --no-cov
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
- id: dod-omn22777-tests
  description: "A recovered host that goes quiet again raises a row, a host the newest row names stays deduped, and the recorded 2026-11-06 state names h201."
  source: manual
  binds_ac:
  - AC1
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_silent_failure_alarm_effect tests/nodes/node_silent_failure_alarm_compute -q --no-cov
    cwd: .
