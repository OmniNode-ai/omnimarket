  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/ci/test_repo_evidence_caller_workflow.py -q --no-cov -p no:randomly -k env_prefix
    cwd: .
- id: dod-omn25731-ac2
  description: AC2 the whole binding test file passes, covering the repo-wide test over every contract and the refusals of an unread env option, a python -m pytest runner and a missing test file.
