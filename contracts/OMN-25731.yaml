schema_version: 1.0.0
ticket_id: OMN-25731
title: 'The repo contract binding check reads an env -u NAME prefix, so Tests (Split 9/20) is green on dev'
summary: >-
  Tests (Split 9/20) failed test_every_repo_contract_binds_every_criterion on
  dev because contracts/OMN-21511.yaml binds two criteria with
  env -u PYTHONPATH PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest and the
  binding check skipped only VAR=value after env, so it read both as not a uv
  run pytest command. The check now reads env -u NAME and env --unset NAME the
  way the verifier does; every other env option still binds nothing.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn25731-env-unset-prefix
  statement: The repo contract binding check reads an env -u NAME prefix as the same pytest run, and still refuses an unread env option, a non-pytest runner and a missing test file.
  acceptance:
  - id: AC1
    statement: 'AC1: a test_passes check spelled env -u PYTHONPATH PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest <repo test file> binds its criterion -- falsifier: uv run pytest tests/ci/test_repo_evidence_caller_workflow.py -q --no-cov -k env_prefix fails four cases at the base commit 8bb5b8be73'
  - id: AC2
    statement: 'AC2: the binding check stays as strict for every other spelling and every repo contract binds every criterion -- falsifier: uv run pytest tests/ci/test_repo_evidence_caller_workflow.py -q --no-cov fails on the branch'
evidence_requirements:
- kind: tests
  description: The binding check tests, including the repo-wide contract binding test, pass at the pushed head.
  command: uv run pytest tests/ci/test_repo_evidence_caller_workflow.py -q --no-cov -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
