schema_version: "1.0.0"
ticket_id: OMN-23433
title: "A settings change can no longer be accepted before the code that understands it"
summary: >-
  node_overlay_merge_order_compute takes the overlays a settings change touches and the merged tree's per-overlay answers
  (node_overlay_drift_effect's ModelOverlayCheck) and decides ORDER_OK or AHEAD_OF_CODE, naming refused fields and never
  values. Its check entry (runtime_overlay_merge_order_check) is what the overlays repository's CI step runs on a pull
  request: an overlay the change does not touch is never counted against it, a check that cannot be judged is refused with a
  typed failure and never passed, and its settings come from its overlay with no default. A test holds the seam between the
  CI step and the check entry.
is_seam_ticket: true
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn23433-merge-order
    statement: An overlay change that the merged omnimarket tree rejects or cannot model reads AHEAD_OF_CODE through the check entry the overlays CI step runs, and nothing that cannot be judged is passed.
    acceptance:
      - id: AC1
        statement: 'AC1: node_overlay_merge_order_compute and its check entry (runtime_overlay_merge_order_check.py) merge with this ticket''s contract; the planted-key test fails when the check judges nothing -- falsifier: uv run pytest on the node''s tests with the check stubbed'
      - id: AC2
        statement: 'AC2: overlays#182''s CI step "No overlay merges ahead of the code that models it" is pinned to the merged revision, ready and merged -- falsifier: the overlays CI workflow file at main'
      - id: AC3
        statement: 'AC3: the seam between the overlays CI step and the omnimarket check entry has a test that fails when either side changes shape -- falsifier: rename one field of the check''s output and run the seam test'
      - id: AC4
        statement: 'AC4: integrated: the step runs on a real overlays pull request and refuses a planted overlay key with no model on omnimarket dev; the next daily overlay-drift row and piece 4 on the served floor read WORKING -- falsifier: the check run on that pull request and the piece 4 row of the served floor'
evidence_requirements:
  - kind: tests
    description: The node's focused tests, golden and error chain event tests, the drift seam test, the CI step seam test and the named breaks.
    command: uv run --frozen pytest tests/unit/nodes/node_overlay_merge_order_compute -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-omn23433-node-tests
    description: The node's tests pass with the change, including the golden chain, the error chain, the overlay refusal and the check entry's planted-key test (check_entry reads rung_order AHEAD_OF_CODE with its field named, a clean control ORDER_OK). The node and its check entry are absent at the merge base, so the command fails there.
    source: manual
    execution_scope: hosted_and_local
    binds_ac: [AC1]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/nodes/node_overlay_merge_order_compute -q --no-cov -n 0 -p no:randomly
        cwd: .
  - id: dod-omn23433-ci-step-seam
    description: The seam test runs the check entry as a subprocess the way the overlays CI step runs it (module path, the three variables, ids on standard input, exit codes, the DECISION and AHEAD output lines) and reads a planted rung_order key AHEAD_OF_CODE and a clean control ORDER_OK; the overlays repository holds the mirror of the same constants. Renaming one output field turns the planted-key and clean-control tests red.
    source: manual
    execution_scope: hosted_and_local
    binds_ac: [AC2, AC3, AC4]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/nodes/node_overlay_merge_order_compute/test_seam_ci_step_to_check_entry.py tests/unit/nodes/node_overlay_merge_order_compute/test_seam_overlay_drift_to_merge_order.py -q --no-cov -n 0 -p no:randomly
        cwd: .
  - id: dod-omn23433-overlays-ci-step-at-main
    description: The overlays repository's CI workflow at main holds the step; hosted CI cannot read the lab clone of the overlays repository, so only the local Done gate runs this unbound check; AC2's hosted-runnable test is dod-omn23433-ci-step-seam, which holds the CI step's module path, variable names and output lines.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: 'git -C "$OMNI_HOME/overlays" show origin/main:.github/workflows/ci.yml | grep -F "No overlay merges ahead of the code that models it"'
        cwd: .
  - id: dod-omn23433-integration-proof-lab
    description: Runs the node's tests, with the CI-step seam test, at the pushed head on a lab host through the lab work runner. Hosted CI cannot reach the lab runner, so only the local Done gate runs this unbound item.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: 'env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23433 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/nodes/node_overlay_merge_order_compute -q --no-cov -n 0 -p no:randomly'
        cwd: .
