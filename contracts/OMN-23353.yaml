schema_version: 1.0.0
ticket_id: OMN-23353
title: The overlay store loader is a declared hourly systemd unit that loads the overlays clone at main
summary: The host installer gains the unit overlay-store-load-systemd (hourly) and the loader gains a tick module that loads the overlays its overlay names from this host's clone of the overlays repository, and only while that clone is at the head of the branch the overlay names. This replaces a hand-started transient timer on h053 that loaded a stale branch, so overlays main changes reach the store.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23353-declared-loader-unit
  statement: The overlay store loader on a Linux pool host is a unit the host installer declares and installs, runs hourly, and loads nothing unless the clone is at the head of origin/main.
  acceptance:
  - id: AC1
    statement: 'AC1: the declared unit renders an hourly systemd timer running the loader tick over the clone, and the tick loads the named overlays only from a clone at origin/main -- falsifier: uv run pytest tests/nodes/node_host_installer_registry_units/test_overlay_store_load_unit.py tests/unit/nodes/node_overlay_store/test_overlay_store_load_tick.py -q in omnimarket, the stale clone and uncommitted clone tests failing with the check removed'
evidence_requirements:
- kind: tests
  description: The unit rendering tests and the tick's golden and error tests.
  command: uv run --frozen pytest tests/nodes/node_host_installer_registry_units/test_overlay_store_load_unit.py tests/unit/nodes/node_overlay_store/test_overlay_store_load_tick.py -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23353-unit-and-tick
  description: Runs the unit rendering tests (hourly timer, tick module, overlay root under the registry root, a checkout without the tick refused) and the tick tests (a clone at origin/main loads the named overlays; a clone on a side branch, a clone with uncommitted tracked changes and an overlay naming no clone each load nothing and exit non-zero). Absent at the merge base, so the command fails there.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_host_installer_registry_units/test_overlay_store_load_unit.py tests/unit/nodes/node_overlay_store/test_overlay_store_load_tick.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn23353-integration-proof
  description: The pushed head ran the loader unit tests and the tick tests on a lab host through the lab work runner and exited 0. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  binds_ac:
  - AC1
  checks:
  - check_type: command
    check_value: 'uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23353 -- uv run --frozen pytest tests/nodes/node_host_installer_registry_units/test_overlay_store_load_unit.py tests/unit/nodes/node_overlay_store/test_overlay_store_load_tick.py -q --no-cov -n 0 -p no:randomly'
    cwd: .
