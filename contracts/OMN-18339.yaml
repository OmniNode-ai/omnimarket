requirements:
- id: req-r3b-measures-parameter-filling
  statement: R3b responses are scored by parsing and schema validation, not by substring presence.
  acceptance:
  - id: AC1
    statement: 'AC1: R3b responses are parsed into a workflow name plus a parameter object and the object is validated against the catalogue request schema for that workflow, with every required parameter present and type-correct; falsifier: uv run pytest benchmarks/delegation_ladder/tests/test_workflow_request_scorer.py -k ac1 -q -p no:randomly'
  - id: AC2
    statement: 'AC2: for apply_patch_and_test the check includes that a patch is present and that it applies; falsifier: uv run pytest benchmarks/delegation_ladder/tests/test_workflow_request_scorer.py -k ac2 -q -p no:randomly, where a plausible diff that does not apply to the named file scores FAIL and a diff that applies scores PASS.'
  - id: AC3
    statement: 'AC3: the review counterexample is committed as a RED fixture, one space-joined token list per R3b task, and each scores FAIL under the new scorer while the retired substring scorer passes the same text; falsifier: uv run pytest benchmarks/delegation_ladder/tests/test_workflow_request_scorer.py -k ac3 -q -p no:randomly'
  - id: AC5
    statement: 'AC5: no numeric literal beyond the zeros and ones of control flow enters the new scorer path; falsifier: uv run pytest benchmarks/delegation_ladder/tests/test_workflow_request_scorer.py -k ac5 -q -p no:randomly, whose positive control fails if it finds no scorer functions.'
