schema_version: 1.0.0
ticket_id: OMN-18339
title: R3b scores catalogue responses against the request schemas
summary: The R3b rung scorer parses a response into a workflow name and a parameter object, validates the
  object against the workflow's request schema, compares the situation's held values, and for the
  patch-carrying workflow checks that the patch is present and applies. Does not claim the re-run of the
  rung on both surfaces (AC4 of the ticket), which needs the lab models and a document change in another
  repository; that evidence is not part of this change.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
context:
  parent_epic_complete: false
  epic_criteria_evidence: The ticket's AC4 (re-run of the rung on both surfaces with the new scorer, the
    superseded 4/4 marked as selection only) is not supplied by this change and is not declared as
    acceptance here, so no binding is fabricated for it.
  epic_criteria_unproven:
  - id: AC4
    statement: "AC4. The rung is re-run on both surfaces with the new scorer, once each, zero retries, before any R3b number is cited in a document or a decision."
requirements:
- id: req-r3b-measures-parameter-filling
  statement: R3b responses are scored by parsing and schema validation, not by substring presence.
  acceptance:
  - id: AC1
    statement: 'AC1: R3b responses are parsed into a workflow name plus a parameter object and the object is validated against the catalogue request schema for that workflow, with every required parameter present and type-correct; falsifier: uv run pytest benchmarks/delegation_ladder/tests/test_workflow_request_scorer.py -k ac1 -q -p no:randomly'
  - id: AC2
    statement: 'AC2: for apply_patch_and_test the check includes that a patch is present and that it applies; falsifier: uv run pytest benchmarks/delegation_ladder/tests/test_workflow_request_scorer.py -k ac2 -q -p no:randomly, where a plausible diff that does not apply to the named file scores FAIL and a diff that applies scores PASS.'
  - id: AC3
    statement: 'AC3: the review counterexample is committed as a RED fixture, one space-joined token list per R3b task, and each scores FAIL under the new scorer while the retired substring scorer passes the same text; falsifier: uv run pytest benchmarks/delegation_ladder/tests/test_workflow_request_scorer.py -k ac3 -q -p no:randomly'
  - id: AC5
    statement: 'AC5: no numeric literal beyond the zeros and ones of control flow enters the new scorer path; falsifier: uv run pytest benchmarks/delegation_ladder/tests/test_workflow_request_scorer.py -k ac5 -q -p no:randomly, whose positive control fails if it finds no scorer functions.'
evidence_requirements:
- kind: tests
  description: The R3b scorer tests and the routing-complexity contract tests that read the scorer table.
  command: uv run pytest benchmarks/delegation_ladder/tests/test_workflow_request_scorer.py -q -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn18339-ac1
  description: Missing required parameters, wrong types, extra parameters, a wrong workflow and unparseable answers score FAIL; complete type-correct requests score PASS.
  source: manual
  binds_ac: [AC1]
  checks:
  - check_type: test_passes
    check_value: uv run pytest benchmarks/delegation_ladder/tests/test_workflow_request_scorer.py -k "ac1 or complete_type_correct or catalogue_parameter_for_parameter" -q -n 0 -p no:randomly --no-cov
    cwd: ${OMNI_HOME}/omnimarket
- id: dod-omn18339-ac2
  description: A diff that applies to the named file passes; a plausible diff whose context is not in the file, an absent or empty patch, prose and a diff that touches another file fail.
  source: manual
  binds_ac: [AC2]
  checks:
  - check_type: test_passes
    check_value: uv run pytest benchmarks/delegation_ladder/tests/test_workflow_request_scorer.py -k ac2 -q -n 0 -p no:randomly --no-cov
    cwd: ${OMNI_HOME}/omnimarket
- id: dod-omn18339-ac3
  description: The four space-joined token lists from the review are committed verbatim and each scores FAIL; the retired scorer passes the same text.
  source: manual
  binds_ac: [AC3]
  checks:
  - check_type: test_passes
    check_value: uv run pytest benchmarks/delegation_ladder/tests/test_workflow_request_scorer.py -k ac3 -q -n 0 -p no:randomly --no-cov
    cwd: ${OMNI_HOME}/omnimarket
- id: dod-omn18339-ac5
  description: The new scorer functions are found by name and carry no numeric literal beyond zero and one.
  source: manual
  binds_ac: [AC5]
  checks:
  - check_type: test_passes
    check_value: uv run pytest benchmarks/delegation_ladder/tests/test_workflow_request_scorer.py -k ac5 -q -n 0 -p no:randomly --no-cov
    cwd: ${OMNI_HOME}/omnimarket
- id: dod-omn18339-integration-proof
  description: The pushed head, run on a lab host through the ONEX CLI, scores the four committed R3b counterexamples as FAIL through the ladder's own dispatch and still derives every R3b rung through the routing-complexity rubric the scorer table was added to. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: |-
      uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-18339 --kind test -- uv run --frozen pytest benchmarks/delegation_ladder/tests/test_workflow_request_scorer.py -q --no-cov -p no:randomly
    cwd: .
