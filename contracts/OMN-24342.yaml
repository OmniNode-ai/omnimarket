schema_version: 1.0.0
ticket_id: OMN-24342
title: The capture silence watch delivers its alarms over the lab bus
summary: 'The capture silence watch''s unit on h201 ticked with two silence alarms due and delivered neither: the node read its broker from KAFKA_BROKERS, the unit sets none, and the node fell back to printing each event on stderr. The node now dials the broker its own overlay declares (event_bus, lane dev, resolved by resolve_dialable_broker) and a non-dry tick with no declaration ends exit 3 with every alarm recorded unpublished. The overlay in the overlays repository declares the dev lane, and the unit declaration sets ONEX_WORKSPACE_CONFIG_ROOT, the root the lane table is read from. No KAFKA_* variable names a broker.'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24342-broker-binding
  statement: The capture silence watch publishes its alarms, heartbeat and evaluation through the broker its overlay declares, so a due alarm reaches the bus and the tick exits 0 or 2 with every delivery published.
  acceptance:
  - id: AC1
    statement: 'AC1: the capture silence watch node publishes through the broker its own overlay declares (event_bus lane) and never reads KAFKA_BROKERS; with no declaration a non-dry tick ends exit 3 and records the alarms unpublished -- falsifier: pytest tests/test_capture_silence_watch_broker_binding.py -q fails on the dev head and passes on the branch'
  - id: AC2
    statement: 'AC2: the overlay of the node declares event_bus kind kafka on the dev lane beside its secret store, and the unit declaration sets the workspace config root the lane table is read from -- falsifier: pytest tests/test_capture_silence_watch_store_overlay.py -q in the overlays repository and the unit declaration seam test fail when either side drops the line'
  - id: AC3
    statement: 'AC3: integrated: on h201 the unit''s tick after reinstall writes exit_code 0 (or 2 with every delivery published) in last-run.json and one test alarm is read in the alerts channel through the node''s own dry path -- falsifier: cat the unit''s last-run.json on h201 and read the alerts channel through the node''s own read; exit 3 or no alarm fails it'
evidence_requirements:
- kind: tests
  description: The binding test, the node tests and the golden chain pass at the pushed head.
  command: uv run pytest tests/test_capture_silence_watch_broker_binding.py tests/test_omn19975_capture_silence_watch.py tests/test_golden_chain_capture_silence_watch_effect.py -q -n 0 --no-cov -p no:cacheprovider
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24342-ac1
  description: 'AC1: a non-dry publish dials the declared broker with its security settings and ignores KAFKA_BROKERS; no declaration is exit 3 with every alarm unpublished; a dry run never resolves a broker.'
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/test_capture_silence_watch_broker_binding.py -k 'dials or no_declared or dry_run' -q -n 0 --no-cov -p no:cacheprovider
    cwd: .
- id: dod-omn24342-ac2
  description: 'AC2: the unit declares ONEX_WORKSPACE_CONFIG_ROOT and no KAFKA_* variable, and the node''s overlay directory name resolves its event_bus; the overlays repository test pins the dev lane in the overlay.'
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/test_capture_silence_watch_broker_binding.py -k 'unit_declares or overlay_lookup' -q -n 0 --no-cov -p no:cacheprovider
    cwd: .
- id: dod-omn24342-ac3
  description: 'hosted proxy for AC3: the tests above pass; the h201 install from the branch, the unit''s next tick and the test alarm are read on h201 and named in the pull request.'
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/test_capture_silence_watch_broker_binding.py tests/test_omn19975_capture_silence_watch.py -q -n 0 --no-cov -p no:cacheprovider
    cwd: .
- id: dod-omn24342-integration-proof
  description: the binding test, the node tests and the golden chain run on a lab host at the pushed head; hosted CI cannot reach the lab, so only the local Done gate runs this unbound check
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24342 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/test_capture_silence_watch_broker_binding.py tests/test_omn19975_capture_silence_watch.py tests/test_golden_chain_capture_silence_watch_effect.py -q --no-cov
    cwd: .
