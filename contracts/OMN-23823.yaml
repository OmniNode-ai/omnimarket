schema_version: 1.0.0
ticket_id: OMN-23823
title: Make the delegate wait test count only its own waits
summary: The delegate wait test replaced the process-wide wait function and recorded every call, so a wait opened by another task running in the same process (one failing split on the pool snapshot change read 'assert 2 <= 1') was counted as the handler's. The watcher now records only the waits opened by the task that installed it and runs every other caller's wait unchanged.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23823-spy
  statement: The wait watcher counts only the handler's own waits.
  acceptance:
  - id: AC1
    statement: 'AC1: the wait watcher in tests/unit/delegation/test_caller_wait_deducts_queue_wait.py records only the waits opened by the task that installed it and still runs every other caller''s wait -- falsifier: the new test test_the_wait_spy_records_only_the_handlers_own_wait fails with 6 == 1 when run against the previous watcher'
  - id: AC2
    statement: 'AC2: no product code, bound or other test changes -- falsifier: the pull request diff names any file other than that test file and its own contract'
  - id: AC3
    statement: 'AC3: integrated: the part of the delegation test suite that holds the file passes on the pool snapshot change''s merge ref in the running CI -- falsifier: that part reads "assert 2 <= 1" from this file again'
