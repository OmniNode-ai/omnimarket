schema_version: 1.0.0
ticket_id: OMN-24722
title: The GLM quota gate of omnimarket#6311 holds zai codes 1316 to 1321 on the Beijing stamp, the legacy quota-rule shape test passes, and the contract carries its criteria
summary: Fixes the second review of the GLM quota gate pull request. The quota code rule dumps reset_utc_offset_minutes only when it is non-zero, so rules that state UTC keep the base shape the legacy fixture pins. Zai rules 1316 to 1321 declare the 480 minute offset like 1310 and 1308. The gate reads every (429) refusal in a text and holds on the first that names a hold rule. contracts/OMN-24651.yaml carries AC1 and AC3 with where each is met.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24722-gate-second-review
  statement: The GLM quota gate holds every zai plan-limit code on the Beijing-time stamp, scans every refusal in a text, and the quota rule dump keeps the legacy consumer shape.
  acceptance:
  - id: AC1
    statement: 'AC1: the test that the daily quota rules keep the legacy consumer shape passes at the new head, with the consumer the fixture stands for named in the change and the fixture regenerated only with evidence that no such consumer remains, and the full suite exit code read on the lab -- falsifier: uv run pytest tests/unit/delegation/test_openrouter_daily_cap.py -q in the omnimarket worktree exits non-zero'
  - id: AC2
    statement: 'AC2: every zai rule that reads its reset from the message timestamp declares the 480 minute offset, the gate docstring names the codes that hold, and a test red then green holds a recorded 1316 refusal until the Beijing-time stamp -- falsifier: uv run pytest on the named zai offset test and the named gate test in omnimarket exits non-zero at the head'
  - id: AC3
    statement: 'AC3: contracts/OMN-24651.yaml carries the acceptance criteria for first failing cause per rung and host and for the draft pull request with a Lab comment and a terminal delegation line, each naming where it is met -- falsifier: uv run pytest of the contract test in omnimarket exits non-zero'
  - id: AC4
    statement: 'AC4: the gate scans every refusal match in a text and holds on the first that names a hold rule, so a 1302 refusal followed by a 1310 refusal holds, with a test -- falsifier: uv run pytest on the named gate test file in omnimarket exits non-zero on that case'
  - id: AC5
    statement: 'AC5: the required suites for the repository pass on the lab at the new head, with any whole-suite timeout run in named parts, and the new head is commented on the pull request -- falsifier: uv run pytest of the named suites on the lab exits non-zero, and onex scm pr-view of omnimarket#6311 shows no comment naming the new head'
