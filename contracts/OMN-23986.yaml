  description: 'AC1: the restart refusal tests pass at the head and fail with the handler at its merge-base state, where render values is not supported.'
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_host_installer_net_units/test_host_net_units_serving.py -q -p no:randomly --no-cov
    cwd: .
- id: dod-omn23986-ac2
  description: 'AC2: the GPU budget tests pass at the head and fail at the merge base.'
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_host_installer_net_units/test_host_net_units_serving.py -q -p no:randomly --no-cov -k gpu
    cwd: .
- id: dod-omn23986-ac3
  description: 'AC3: the overlay-side test lives in the overlays repository (pull request OmniNode-ai/overlays#358); here the node test that renders a fixture overlay with the same shape passes.'
  source: manual
