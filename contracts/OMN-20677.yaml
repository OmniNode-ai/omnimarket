        check_value: "uv run pytest tests/nodes/node_ledger_reconcile_compute/test_error_chain_ledger_reconcile_compute.py tests/nodes/node_ledger_reconcile_effect/test_error_chain_ledger_reconcile_effect.py -q -p no:randomly"
        cwd: "${OMNI_HOME}/omnimarket"
