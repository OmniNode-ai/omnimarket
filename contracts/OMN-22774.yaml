schema_version: 1.0.0
ticket_id: OMN-22774
title: A pure node resolves a typed media capability (tts, stt, embed, decide, video) to its serving backend, so a node asks for a capability and never carries a host or port
summary: node_media_capability_resolve_compute judges the media backends a caller injects from the lab's media overlay and returns the one serving backend for a typed capability, or a typed refusal that names the backends (capability and endpoint shape disagree, two serving backends, unknown capability, none serving).
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn22774-media-capability-node
  statement: A typed media capability resolves to its one serving backend through a node with a contract, typed models, a golden chain test per capability and an error chain test per refusal, and the tests fail when the endpoint shape check is removed.
  acceptance:
  - id: AC1
    statement: 'AC1: a golden chain test per capability (tts, stt, embed, decide, video) resolves the declared backend and its URL from injected backends by capability alone -- falsifier: uv run --frozen pytest tests/nodes/node_media_capability_resolve_compute -q --no-cov -k golden'
  - id: AC2
    statement: 'AC2: an error chain test per refusal (capability and endpoint shape disagree, two serving backends for one capability, unknown capability, none serving) returns a typed refusal naming the backends -- falsifier: uv run --frozen pytest tests/nodes/node_media_capability_resolve_compute -q --no-cov -k error'
  - id: AC3
    statement: 'AC3: with the endpoint shape check removed the disagreement test reads red -- falsifier: uv run --frozen pytest tests/nodes/node_media_capability_resolve_compute -q --no-cov -k failing_control'
evidence_requirements:
- kind: tests
  description: The media capability node tests pass
  command: uv run --frozen pytest tests/nodes/node_media_capability_resolve_compute -q --no-cov
