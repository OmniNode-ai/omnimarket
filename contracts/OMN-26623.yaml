schema_version: 1.0.0
ticket_id: OMN-26623
title: The weekly delegation-quality view is owned in the ownership manifest
summary: Ownership declaration of projection_delegation_quality_weekly in scripts/application-relation-ownership.yaml, landed ahead of omnimarket#6943 because omnibase_infra#6315 needs it on dev first. This change proves AC5 only; AC1 to AC4 are proven by omnimarket#6943 and omnidash.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn26623-quality-weekly-ownership
    statement: The ownership manifest declares the owner of projection_delegation_quality_weekly once, so omnibase_infra can vendor the view.
    acceptance:
      - id: AC5
        statement: 'AC5: scripts/application-relation-ownership.yaml in omnimarket declares the owner of projection_delegation_quality_weekly, so omnibase_infra can vendor the view; falsifier: uv run pytest -q tests/contracts/test_omn26623_quality_weekly_ownership_declared.py fails on omnimarket dev, where the entry is absent'
  - id: req-omn26623-delegation-daily-opt-out
    statement: The delegation daily exposure carries no consumers opt-out once omnidash declares a reader for the topic.
    acceptance:
      - id: AC6
        statement: 'AC6: the delegation daily projection_api exposure has no consumers: none opt-out, because omnidash local-page:overview.page.yaml now reads onex.snapshot.projection.delegation.daily.v1; falsifier: test_delegation_daily_exposure_declares_no_opt_out_over_its_live_reader fails on omnimarket dev, where the opt-out still stands'
evidence_requirements:
  - kind: tests
    description: AC5 ownership declaration test.
    command: uv run pytest -q --no-cov tests/contracts/test_omn26623_quality_weekly_ownership_declared.py
  - kind: tests
    description: AC6 delegation daily opt-out removal test.
    command: uv run pytest -q --no-cov tests/test_omn23159_local_alerts_exposure_reader_declared.py::test_delegation_daily_exposure_declares_no_opt_out_over_its_live_reader
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn26623-quality-weekly-ownership
    description: The ownership manifest declares projection_delegation_quality_weekly exactly once as a tenant view owned by the migration runner; fails on dev, where the entry is absent.
    source: manual
    binds_ac: [AC5]
    checks:
      - check_type: test_passes
        check_value: uv run pytest -q tests/contracts/test_omn26623_quality_weekly_ownership_declared.py
        cwd: .
  - id: dod-omn26623-delegation-daily-opt-out
    description: The delegation daily exposure has no consumers opt-out; fails on dev where the stale opt-out still stands over the live omnidash reader.
    source: manual
    binds_ac: [AC6]
    checks:
      - check_type: test_passes
        check_value: uv run pytest -q tests/test_omn23159_local_alerts_exposure_reader_declared.py::test_delegation_daily_exposure_declares_no_opt_out_over_its_live_reader
        cwd: .
  - id: dod-omn26623-integration-proof
    description: On a lab host, runs the opt-out test and the delegation projection tests at the pushed head; hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-26623 --kind test -- uv run --frozen pytest tests/test_omn23159_local_alerts_exposure_reader_declared.py tests/nodes/node_projection_delegation -q --no-cov
        cwd: "${OMNI_HOME}/omnimarket"
