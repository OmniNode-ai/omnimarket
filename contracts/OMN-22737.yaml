schema_version: 1.0.0
ticket_id: OMN-22737
title: The floor's deploy agent row does not read a job the deploy agent ended as superseded as a failed deploy
summary: The deploy agent ends a job as superseded when a newer build replaced it before it ran, which is neither a failure nor a success. The floor's deploy agent row counted each superseded job as a failed finished job, so a success followed by four supersessions in one second read four failures in a row and went red. The row now neither records nor counts a superseded job and reads a stored record that holds some without them.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn22737-superseded-not-failed
  statement: The floor's deploy agent row never counts a job ended superseded as a failed deploy, whether the job is new or already in the stored record.
  acceptance:
  - id: AC1
    statement: 'AC1: the deploy agent row neither records nor counts a job ended superseded, and a stored record that already holds such jobs is read without them -- falsifier: uv run --frozen pytest tests/unit/nodes/node_floor_simple_effect/test_deploy_agent_source.py -q --no-cov'
  - id: AC2
    statement: 'AC2: a replay of the recorded job sequence (success, four superseded, success) reads zero failed in a row with the change and one to four without it, so the test fails on the unchanged source -- falsifier: uv run --frozen pytest tests/unit/nodes/node_floor_simple_effect/test_deploy_agent_source.py -q --no-cov'
evidence_requirements:
- kind: tests
  description: The recorded job sequence replayed through the row's source, red without the change
  command: uv run --frozen pytest tests/unit/nodes/node_floor_simple_effect/test_deploy_agent_source.py -q --no-cov
