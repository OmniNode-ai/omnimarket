schema_version: 1.0.0
ticket_id: OMN-23694
title: Per-ticket and per-lane work ledger state the board and lane placement read instead of paging rows
summary: 'The work ledger projection keeps one small table, work_ledger_latest, with the newest CLAIM, TERMINAL, STATUS, MSG and HOLD row per lane and per ticket (its time and the cells a reader decides on), maintained from each ledger row event with a write guarded on (at, row_id), and backfilled from the rows already held. The work ledger query node gains a latest-state query that answers one keyset page of it inside the answer bound, with a watermark and a next cursor; a reader with no such table answers an error and never an empty page. The board floor step and the work-state projection read it instead of paging raw rows.'
is_seam_ticket: true
interface_change: true
interfaces_touched:
- topics
- events
- public_api
requirements:
- id: req-omn23694-latest-state
  statement: The board and lane placement read the newest ledger state per ticket and per lane from a projection maintained from the ledger row events, inside the answer bound and the step limit.
  acceptance:
  - id: AC1
    statement: 'AC1: the projection keeps, per lane and per ticket, the newest CLAIM, TERMINAL, STATUS, MSG and HOLD row with its time and cells, whatever order the rows arrive in -- falsifier: pytest tests/unit/nodes/node_projection_work_ledger/test_work_ledger_latest_fold.py -q'
  - id: AC2
    statement: 'AC2: the read node''s latest-state query answers a keyset page inside the answer bound with a next cursor, and answers an error, never an empty page, when the table cannot be read -- falsifier: pytest tests/unit/nodes/node_work_ledger_query_effect/test_latest_state_query.py -q'
  - id: AC3
    statement: 'AC3: the seam to the board floor step and to the work-state projection is pinned: a change to the request or answer fields either consumer reads turns a test red -- falsifier: pytest tests/unit/nodes/node_work_ledger_query_effect/test_latest_state_seams.py -q'
  - id: AC4
    statement: 'AC4: integrated: on the dev lane runtime the latest-state read for 14 days and for 72 hours each answers under 917,516 bytes and under 30 seconds and equals the raw-row reads for a sample of 20 tickets -- falsifier: run the latest-state query on the dev lane and find an answer over either limit or a ticket whose entry differs from its raw rows'
evidence_requirements:
- kind: tests
  description: The fold, query and seam tests at the pushed head.
  command: uv run --frozen pytest tests/unit/nodes/node_projection_work_ledger/test_work_ledger_latest_fold.py tests/unit/nodes/node_work_ledger_query_effect/test_latest_state_query.py tests/unit/nodes/node_work_ledger_query_effect/test_latest_state_seams.py -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23694-ac1-fold
  description: The pure fold keeps the newest row per subject and row type in any arrival order; an older row delivered late does not replace a newer one (failing control).
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/nodes/node_projection_work_ledger/test_work_ledger_latest_fold.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn23694-ac2-query
  description: Golden and error chain of the latest-state query through the handler, the paging and cursor, the answer bound refusal and the unread-table error.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/nodes/node_work_ledger_query_effect/test_latest_state_query.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn23694-ac3-seams
  description: The request shape the board floor step and the work-state projection send, the answer fields they read, the contract and migration row types and the writer's column list are pinned, with a planted rename turning each red.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/nodes/node_work_ledger_query_effect/test_latest_state_seams.py -q --no-cov -n 0 -p no:randomly
    cwd: .
