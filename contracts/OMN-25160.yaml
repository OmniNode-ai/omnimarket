schema_version: 1.0.0
ticket_id: OMN-25160
title: Run the stall responder from the runtime's own schedule
summary: 'Adds node_stall_responder_scheduled_effect as a scheduled job node on the runtime schedule path: it gates on its overlay interval, reads the THROUGHPUT STALL rows and the live lanes from the ledger window the overlay names, asks node_stall_responder_compute which cause keys need a lane and emits one typed run event with the counts.'
is_seam_ticket: true
interface_change: true
interfaces_touched:
- topics
requirements:
- id: req-omn25160-stall-responder-scheduled
  statement: The stall responder runs on the runtime tick from overlay values and records each run as a typed event, failed by name when its overlay or ledger route cannot be read.
  acceptance:
  - id: AC1
    statement: 'AC1: On a runtime tick inside the interval the node returns no event, and on the tick that is due it runs one stall responder pass and returns one run event -- falsifier: pytest tests/nodes/node_stall_responder_scheduled_effect -q fails with the gate removed'
  - id: AC2
    statement: 'AC2: A missing or refused schedule settings file, an unreadable overlay or an unreadable ledger gives a failed run event or a refused-once log that names the cause, never a silent skip -- falsifier: the error chain tests pass a refused overlay and an unreadable ledger and expect outcome failed'
  - id: AC3
    statement: 'AC3: The interval, window, redispatch bound and ledger route come only from the settings file in the overlays repo, and the contract and handler hold no value -- falsifier: the overlay model has no field default and the test builds it from a settings file'
  - id: AC4
    statement: 'AC4: integrated: the dev runtime on h201 runs the node on its own tick and a schedule-run event for job stall_responder with outcome completed is read there -- falsifier: no schedule-run event for job stall_responder within two intervals of the runtime tick after the dev deploy of this change and the overlay'
evidence_requirements:
- kind: tests
  description: The golden and error chain tests of the stall responder scheduled node and the ACL seam test
  command: uv run --frozen pytest tests/nodes/node_stall_responder_scheduled_effect tests/nodes/node_schedule_run_reducer/test_runtime_role_acl_seam.py -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn25160-ac1
  description: AC1 and AC2 proven by the node tests, with the window, covered-lane, open-claim look-back, invalid-overlay and tick-exception failing controls. AC4 is not bound here, because a pytest run cannot fail for a runtime reading; AC4 is bound to dod-omn25160-integration-proof.
  source: manual
  binds_ac:
  - AC1
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_stall_responder_scheduled_effect -q --no-cov
    cwd: .
- id: dod-omn25160-ac3
  description: AC3 proven by tests that consume the overlay file through the real gate and the default tick (each overlay field required, a redispatch past the bound, a readable ledger and an unset command variable), and by the seam test, which fails when a contract grant and the derived role rows disagree; the overlay values are held by the overlays repository.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_stall_responder_scheduled_effect -q --no-cov -k "required or bound or default_tick or env"
    cwd: .
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_schedule_run_reducer/test_runtime_role_acl_seam.py -q --no-cov
    cwd: .
- id: dod-omn25160-deploy-stall-responder-scheduled
  description: 'Presence probe the hosted runner can run: the scheduled node contract at the checked-out commit on GitHub names its handler class; the file does not exist at the merge base, so the probe fails there. It proves the file is on GitHub, not that the node is deployed or runs; the deployment is AC4, read on the dev runtime after the dev deploy through the deploy agent (dod-omn25160-integration-proof).'
  source: manual
  checks:
  - check_type: command
    check_value: 'bash -o pipefail -c ''gh api "repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_stall_responder_scheduled_effect/contract.yaml?ref=$(git rev-parse HEAD)" --jq .content | base64 -d | grep -F "HandlerStallResponderScheduled" > /dev/null'''
    cwd: .
- id: dod-omn25160-integration-proof
  description: 'AC4 is read on the dev runtime on h201, not in a test: the check runs on h201 through the onex_lab_run ssh route (onex lab-work run is refused by the broker ACL) and reads the omninode-runtime container log for the one line this node logs per run, schedule-run job_id=stall_responder outcome=completed, from this node''s logger. The runtime''s own schedule-run lines (Published output event to onex.evt.omnimarket.schedule-run.v1 (correlation_id=...)) name neither the job nor the outcome, so they cannot bind AC4. The check fails until its prerequisites hold: omnibase_infra#6039 landed and deployed (without it the container ledger read refuses and the first run ends failed), this node merged and deployed to the dev runtime, and the overlay document for node_stall_responder_scheduled_effect pushed to the overlays repository and installed on h201. They did not hold at the h201 read of 2026-11-17T22:10Z (no stall_responder line in the runtime log), so the owner of OMN-25160 moves AC4 to a follow-up ticket or reads it after the dev deploy. It runs under the local Done gate only, never on the hosted runner.'
  source: manual
  execution_scope: local_done_gate
  binds_ac:
  - AC4
  checks:
  - check_type: command
    check_value: 'python3 "${OMNI_PLUGIN_ROOT:?}/scripts/onex_lab_run.py" --via ssh --lane "${ONEX_LAB_RUN_LANE:?}" --repo omnimarket --sha "$(git rev-parse HEAD)" --host h201 -- bash -o pipefail -c ''docker logs --since 30m omninode-runtime 2>&1 | grep -cE "\[INFO\] omnimarket\.nodes\.node_stall_responder_scheduled_effect\.handlers\.handler_stall_responder_scheduled: schedule-run job_id=stall_responder outcome=completed( |$)"'''
    cwd: .
