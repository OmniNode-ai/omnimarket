---
schema_version: "1.0.0"
ticket_id: "OMN-21015"
title: "The local dashboard shows the demo's in-scope figures on Overview, Runs and Usage, and meets four dashboard requirements not yet built"
summary: >-
  Two omnimarket halves of OMN-21015, each with its own evidence below. AC3: the modelled per-run saving and its labels, derived in the write transaction (merged from #4001). AC2: the delegation model-routing view lists, under each tier in by_tier, the models routed under it with their run count, share on the tier's own denominator, summed cost and unmeasured count (migration 0060 on Postgres; store step omn21015_model_routing_tier_models on the local store). The page halves are omnidash's; the table half of AC4 lands separately.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-transcribed-acceptance-criteria"
    statement: |-
      The acceptance criteria these changes serve, as declared on the OMN-21015 ticket body, read on 2026-10-15 (AC3) and 2026-10-14 (AC2). The ticket body is the source and this block is the copy.
    acceptance:
      - id: "AC3"
        statement: |-
          AC3: The Runs list shows savings per run against the named baseline (requirement RU-1), and a typed not-measured state for an unmeasured run -- falsifier: a measured fixture row with no savings cell, or an unmeasured row that shows 0
      - id: "AC2"
        statement: |-
          AC2: Overview's Tier mix lists each model under its tier with its share of runs and its cost -- falsifier: a fixture with two models in one tier renders one row, or model shares that do not sum to the tier's share
evidence_requirements:
  - kind: tests
    description: >-
      Backend half only: real Postgres proves persisted nullable savings, exact numeric binding, transaction ordering, cross-connection visibility and refusal to publish a failed commit. SQLite proves the served figure and typed unmeasured states. The race tests prove ordering; the UPSERT row lock prevents the Postgres input guard from firing. These checks do not render the Runs cell.
    command: uv run pytest tests/test_omn21015_run_savings_real_postgres.py tests/test_omn21015_delegation_decimal_binding_real_postgres.py tests/projection/test_omn21015_transactional_run_write.py tests/projection/test_omn21015_review_real_boundaries.py tests/projection/test_omn21015_run_savings_served.py -q -p no:randomly
  - kind: "tests"
    description: "Served through the real local dashboard app over a SQLite store: two models in one tier are two entries; model shares on the tier's denominator sum to the tier's share; a group with no cost serves null with its unmeasured count; a measured zero is zero; another tenant never enters; the existing tier keys are unchanged. Before the store step 5 of the 6 fail."
    command: "uv run pytest tests/projection/test_omn21015_tier_models_served.py -q -p no:randomly"
  - kind: "tests"
    description: "Migration 0060 applied with every node_projection_delegation migration on real Postgres: the same entries, shares and costs; with cost_usd made nullable in the test's own schema, as OMN-20717's 0061 does, a group with no cost serves null with its unmeasured count and a mixed group sums only its measured cost; another tenant never enters; existing keys and security_invoker unchanged. Without 0060, 5 of the 7 fail."
    command: "uv run pytest tests/test_omn21015_tier_models_real_postgres.py -q -p no:randomly"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-omn21015-ac3-real-postgres-writer
    description: >-
      Backend half of AC3 only; page acceptance belongs to omnidash. Real Postgres, the deployed writer: the saving and its three labels persist nullable beside the stored inputs, and the republished row carries them.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/test_omn21015_run_savings_real_postgres.py::test_deployed_writer_persists_and_republishes_canonical_run_savings -q -p no:randomly
        cwd: ${OMNI_HOME}/omnimarket
    binds_ac: [AC3]
  - id: dod-omn21015-ac3-real-postgres-migration
    description: >-
      Backend half of AC3 only; page acceptance belongs to omnidash. Real Postgres: migration 0059 runs twice and never prices a row stored before it.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/test_omn21015_run_savings_real_postgres.py::test_migration_is_repeatable_and_never_prices_an_old_row -q -p no:randomly
        cwd: ${OMNI_HOME}/omnimarket
    binds_ac: [AC3]
  - id: dod-omn21015-ac3-real-postgres-two-writers
    description: >-
      Backend half of AC3 only; page acceptance belongs to omnidash. Real Postgres: two writers of one run keep the saving paired with the inputs it was computed from.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/test_omn21015_run_savings_real_postgres.py::test_two_writers_keep_the_saving_paired_with_concurrent_inputs -q -p no:randomly
        cwd: ${OMNI_HOME}/omnimarket
    binds_ac: [AC3]
  - id: dod-omn21015-ac3-decimal-binding
    description: >-
      Backend half of AC3 only; page acceptance belongs to omnidash. Real Postgres: money binds as exact numeric, never through a float.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/test_omn21015_delegation_decimal_binding_real_postgres.py -q -p no:randomly
        cwd: ${OMNI_HOME}/omnimarket
    binds_ac: [AC3]
  - id: dod-omn21015-ac3-transactional-write
    description: >-
      Backend half of AC3 only; page acceptance belongs to omnidash. The async, sync and local write paths derive the figure from the row the upsert returns, in one transaction, under the six race schedules.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/projection/test_omn21015_transactional_run_write.py -q -p no:randomly
        cwd: ${OMNI_HOME}/omnimarket
    binds_ac: [AC3]
  - id: dod-omn21015-ac3-commit-boundaries
    description: >-
      Backend half of AC3 only; page acceptance belongs to omnidash. Writes stay invisible to a second connection until commit, and a refused commit publishes nothing.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/projection/test_omn21015_review_real_boundaries.py -q -p no:randomly
        cwd: ${OMNI_HOME}/omnimarket
    binds_ac: [AC3]
  - id: dod-omn21015-ac3-served-per-run
    description: >-
      Backend half of AC3 only; page acceptance belongs to omnidash. Served through the local store: each stored, served and republished run has its own figure and basis.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/projection/test_omn21015_run_savings_served.py::test_each_stored_served_and_republished_run_has_its_own_figure_and_basis -q -p no:randomly
        cwd: ${OMNI_HOME}/omnimarket
    binds_ac: [AC3]
  - id: dod-omn21015-ac3-served-typed-states
    description: >-
      Backend half of AC3 only; page acceptance belongs to omnidash. Served: an unresolved baseline, an unrecorded time and an unknown spend each serve a typed state with a null figure, never 0.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/projection/test_omn21015_run_savings_served.py::test_unresolved_baseline_serves_null_instead_of_the_legacy_saving tests/projection/test_omn21015_run_savings_served.py::test_an_unrecorded_time_has_a_typed_unknown_state tests/projection/test_omn21015_run_savings_served.py::test_a_stored_unknown_spend_is_not_priced_as_a_free_call -q -p no:randomly
        cwd: ${OMNI_HOME}/omnimarket
    binds_ac: [AC3]
  - id: dod-omn21015-ac3-served-scope
    description: >-
      Backend half of AC3 only; page acceptance belongs to omnidash. Served: a sparse redelivery keeps the figure paired with its inputs, another tenant's saving never enters, and a run and the headline share one named baseline.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/projection/test_omn21015_run_savings_served.py::test_a_sparse_redelivery_keeps_the_figure_paired_with_the_preserved_inputs tests/projection/test_omn21015_run_savings_served.py::test_tenant_scoping_does_not_serve_another_tenants_saving tests/projection/test_omn21015_run_savings_served.py::test_run_and_headline_share_the_named_baseline_selection -q -p no:randomly
        cwd: ${OMNI_HOME}/omnimarket
    binds_ac: [AC3]
  - id: dod-omn21015-ac3-market-deploy-probe
    description: >-
      Deploy probe. GitHub serves the checked-out commit with the run-savings handler's typed baseline_unresolved state. The source read or symbol match fails on a tree without this change, including origin/dev. This proves source identity only, not a running deployment or AC3 acceptance.
    source: manual
    checks:
      - check_type: command
        check_value: 'gh api "repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_projection_delegation/handlers/handler_run_savings.py?ref=$(git rev-parse HEAD)" --jq .content | base64 -d | grep -c "baseline_unresolved"'
  - id: "dod-omn21015-tier-models-local-store"
    description: "On the local store, served through the dashboard app: for 3 qwen-a and 1 unpriced qwen-b runs on the local tier, 2 priced gemini runs on cheap_cloud and 1 not-tier-routed run, each tier lists its models with count, share on the tier's denominator (summing to the tier's share), summed cost (null with an unmeasured count when no run has one, 0 when measured as 0); another tenant's runs never enter; the existing tier keys are unchanged."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/projection/test_omn21015_tier_models_served.py -q -p no:randomly"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC2"]
  - id: "dod-omn21015-tier-models-real-postgres"
    description: "Migration 0060 applied with every node_projection_delegation migration to a scratch schema on real Postgres: the same model entries, shares and summed costs per tier; the view keeps security_invoker; another tenant never enters; and with cost_usd made nullable in the test's own schema, as OMN-20717's 0061 does, a run with no cost is counted as unmeasured, never summed as 0."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/test_omn21015_tier_models_real_postgres.py -q -p no:randomly"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC2"]
  - id: "dod-omn21015-tier-models-deploy-probe"
    description: "Deploy probe. GitHub serves the local store at the checked-out commit with the store step that re-creates the model-routing view with each tier's models (omn21015_model_routing_tier_models); the probe reads it from GitHub at that commit and exits nonzero on a tree without it, so it fails at the merge base."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: "gh api \"repos/OmniNode-ai/omnimarket/contents/src/omnimarket/projection/sqlite_database.py?ref=$(git rev-parse HEAD)\" --jq .content | base64 -d | grep -c 'omn21015_model_routing_tier_models'"
