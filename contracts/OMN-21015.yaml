---
schema_version: "1.0.0"
ticket_id: "OMN-21015"
title: "The local dashboard shows the demo's in-scope figures on Overview, Runs and Usage, and meets four dashboard requirements not yet built"
summary: "The omnimarket table half of AC4. Each usage-by-model-day row carries its tier and its share of its tenant's calls that day, as Jonah ruled on 2026-10-14: the usage call event carries a tier and the tier joins the row key (store step omn21015_usage_by_model_day_tier_share on the local store). On Postgres, migration 0003 expands only, as Jonah ruled on 2026-10-15: it adds the tier and a four-column unique index and keeps the three-column key, and the writer follows the key in force, one not_tier_routed row per model and day until the contract migration (OMN-21161) makes the index the key, then one row per tier. Every call of a run carries the run's tier, the one its delegation row records, so one run never splits across tiers. The token series and the Usage page's table are omnidash's half. AC2 and AC3 land in their own changes."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-transcribed-acceptance-criteria"
    statement: |-
      The acceptance criterion this change serves, as declared on the OMN-21015 ticket body, read on 2026-10-14. The ticket body is the source and this block is the copy.
    acceptance:
      - id: "AC4"
        statement: |-
          AC4: Usage shows tokens in and tokens out per day as a stacked series split by model (requirement US-1), and its by-model table shows each model's share of calls and its tier beside the calls column it already has -- falsifier: the window sums differ from `onex metering --json`, or the shares do not sum to 100
evidence_requirements:
  - kind: "tests"
    description: "On the local store and through the real dashboard app: one model under two tiers on one day is two rows; each row's share is its calls over its tenant's calls that day and a day's shares sum to 1; a new call moves every share of the day; another day or tenant never enters; a call naming no tier is not_tier_routed; a replay changes nothing; a store from before keeps its rows and cursors; the deployed writer locks the tenant's day, recounts with the tier and republishes every row of the day. On dev's code all 9 fail."
    command: "uv run pytest tests/projection/test_omn21015_usage_tier_share.py -q -p no:randomly"
  - kind: "tests"
    description: "The real local dispatch port: an escalated run's two calls both stand under the run's tier, the one its delegation row records, and the day's shares cover both. On dev's code it fails."
    command: "uv run pytest tests/unit/nodes/node_delegate_skill_orchestrator/test_omn21015_local_dispatch_usage_tier.py -q -p no:randomly"
  - kind: "tests"
    description: "Migration 0003 on real Postgres over rows stored before it, run twice: rows and cursors kept under not_tier_routed, the three-column key kept beside a four-column unique index, DELETE granted to the writer role; the writer deployed today still writes after it. Under the three-column key two tiers of one model on one day fold into one row and never raise; after the key change the writer splits the day by tier, removes the folded row, and serves per-day shares summing to 1 with every moved row re-stamped, and another tenant or day changes none of them. Before this change, all four migration and writer cases fail."
    command: "uv run pytest tests/test_omn21015_usage_tier_share_real_postgres.py -q -p no:randomly"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn21015-usage-tier-share-local-store"
    description: "On the local store and through the dashboard app, usage-by-model-day serves each row's tier and its share of its tenant's calls that day: one model under two tiers is two rows, a day's shares sum to 1 and all move with each new call, another day or tenant never enters, a call naming no tier is not_tier_routed, a replay changes nothing, an older store keeps its rows and cursors; the deployed writer locks the tenant's day and republishes every row of it."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/projection/test_omn21015_usage_tier_share.py -q -p no:randomly"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC4"]
  - id: "dod-omn21015-usage-tier-share-dispatch"
    description: "The local delegate path books every call of a run, an escalated run's first attempt included, under the run's tier, the one its delegation row records."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/nodes/node_delegate_skill_orchestrator/test_omn21015_local_dispatch_usage_tier.py -q -p no:randomly"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC4"]
  - id: "dod-omn21015-usage-tier-share-real-postgres"
    description: "Migration 0003 on real Postgres keeps rows stored before it under not_tier_routed with their cursors, is re-runnable, keeps the three-column key and adds the four-column unique index; the writer deployed today still writes; the new writer never raises under the old key and splits by tier under the new one, with per-day shares summing to 1 and every moved row's cursor re-stamped."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/test_omn21015_usage_tier_share_real_postgres.py -q -p no:randomly"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC4"]
  - id: "dod-omn21015-usage-tier-share-deploy-probe"
    description: "Deploy probe. GitHub serves the usage writer at the checked-out commit with the check of which key is in force (_TIER_KEY_IN_FORCE); the probe reads it from GitHub at that commit and exits nonzero on a tree without it, so it fails at the merge base. This proves source identity only, not a running deployment."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: "gh api \"repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_projection_usage_by_model_day/handlers/handler_usage_by_model_day_writer.py?ref=$(git rev-parse HEAD)\" --jq .content | base64 -d | grep -c '_TIER_KEY_IN_FORCE'"
