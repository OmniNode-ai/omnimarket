schema_version: 1.0.0
ticket_id: OMN-23578
title: Seam test between the lane start orchestrator and the placement compute node
summary: The lane start orchestrator builds a placement request from the start request and the host pool snapshot and calls the placement compute node, reading outcome, host and verdicts back. No test pinned either side of that hand-over. This change adds a seam test that pins the fields the orchestrator supplies, the request fields it leaves unsupplied (the measured gap that launching_venv_hash is not passed on), the pool reading fields against the placement reading and the result fields it reads, and sends the recorded request over the in-memory bus and the lab broker to the real placement handler, with a planted rename of the engine key as the failing control.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23578-placement-seam
  statement: The placement request hand-over between the start orchestrator and the placement compute node is pinned on both sides and decided the same on the in-memory bus and the lab broker.
  acceptance:
  - id: AC1
    statement: 'AC1: a seam test in the start orchestrator tests pins the fields the orchestrator supplies to the placement request, the placement request fields it leaves unsupplied, the pool reading fields against the placement reading, and the result fields it reads -- falsifier: renaming or adding a field on either side turns the pin red, and a planted rename of the engine field is rejected by the placement model'
  - id: AC2
    statement: 'AC2: the recorded request crosses the in-memory bus and the lab broker and the real placement handler decides the same on both -- falsifier: the two bus projections differ or the planted-rename control passes'
  - id: AC3
    statement: 'AC3: integrated: the seam test runs on a lab host at the pushed head, including the broker leg, and a real shadow start on the lab places the lane on the host the placement node names -- falsifier: the broker leg skips or fails on the lab host, or the start receipt host differs from the placement result host'
evidence_requirements:
- kind: tests
  description: The placement seam test at the pushed head, pin, control and bus legs.
  command: uv run --frozen pytest src/omnimarket/nodes/node_remote_lane_start_orchestrator/tests/test_remote_lane_start_placement_seam.py -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23578-ac1-seam-pins
  description: The pins, the planted-rename control and the in-memory bus projection pass at the pushed head. This pull request changes only test-side files and this contract, so the merge base has no earlier behaviour to control and the hosted check treats the binding as coverage-only evidence that must be verified at the head.
  source: manual
  binds_ac:
  - AC1
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest src/omnimarket/nodes/node_remote_lane_start_orchestrator/tests/test_remote_lane_start_placement_seam.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn23578-ac3-integration-proof
  description: The pushed head ran the placement seam test, the broker leg included, on a lab host through the lab work runner and exited 0. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  binds_ac:
  - AC3
  checks:
  - check_type: command
    check_value: 'env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23578 --kind test -- env PYTHONDONTWRITEBYTECODE=1 LANE_START_SEAM_LANE="${LANE_START_SEAM_LANE:?name the declared bus lane}" OMNIBASE_PATH="${OMNIBASE_PATH:?name the workspace root}" uv run --frozen pytest src/omnimarket/nodes/node_remote_lane_start_orchestrator/tests/test_remote_lane_start_placement_seam.py -q --no-cov'
    cwd: .
