---
schema_version: "1.0.0"
ticket_id: "OMN-21948"
title: "State-backed point queries for the work ledger read node: holds, open-claims, inbox and open-rulings answered from work_ledger_state with a page size and a watermark"
summary: "node_work_ledger_query_effect answers holds, open-claims, inbox and the new open-rulings from omninode_internal.work_ledger_state by its generated is_open column instead of folding rows: one keyset page of the open set, each entity joined to the row that opened it and rendered with the markdown read rules, so the answer's lines are the onex-ledger verb's lines. Every point-query answer carries status, the page_size it was cut to and a watermark (the newest projected_at of the state table at the read). A database fault answers status=error with no section filled. Neither the append path, the projection fold nor any reader changes."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-omn21948-ac1-latency"
    statement: "Holds and inbox answer within 1 s at p95 and open-claims within 3 s over 100 calls against a loaded work_ledger_state."
    acceptance:
      - id: "AC1"
        statement: "AC1: from the launching host's CLI, holds and inbox answer in at most 1 s at p95 over 100 calls and open-claims in at most 3 s -- falsifier: a timed loop of 100 calls in the lab step on an isolated compose project, never the dev lane"
  - id: "req-omn21948-ac2-fault"
    statement: "A database fault answers status=error and never an empty page."
    acceptance:
      - id: "AC2"
        statement: "AC2: a database fault answers status=error and never an empty page -- falsifier: uv run pytest tests/unit/nodes/node_work_ledger_query_effect -k \"point_query or fault\" -q"
  - id: "req-omn21948-ac3-page-watermark"
    statement: "Every point-query answer carries a page size and a watermark."
    acceptance:
      - id: "AC3"
        statement: "AC3: every point-query answer carries a page size and a watermark -- falsifier: uv run pytest tests/unit/nodes/node_work_ledger_query_effect -k \"page or watermark\" -q"
evidence_requirements:
  - kind: "tests"
    description: "AC1: a timed loop of 100 calls each of holds, inbox and open-claims against a loaded work_ledger_state in a disposable PostgreSQL schema."
    command: "uv run pytest tests/test_work_ledger_point_query_postgres.py -k timed_loop -q --no-cov"
  - kind: "tests"
    description: "AC2: a database fault answers status=error and never an empty page."
    command: "uv run pytest tests/unit/nodes/node_work_ledger_query_effect -k \"point_query or fault\" -q --no-cov"
  - kind: "tests"
    description: "AC3: every point-query answer carries a page size and a watermark."
    command: "uv run pytest tests/unit/nodes/node_work_ledger_query_effect -k \"page or watermark\" -q --no-cov"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn21948-ac1-latency"
    description: "AC1 times 100 calls each of holds, inbox and open-claims, a fresh reader and connection per call, against 2,000 open claims over 42,000 log rows, 3,000 open messages and 60 holds, and asserts p95 at most 1 s, 1 s and 3 s. The lab step repeats the loop on an isolated database loaded from a copy of the rolling ledger and reports it in the pull request."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/test_work_ledger_point_query_postgres.py -k timed_loop -q --no-cov --tb=line"
        cwd: "."
    binds_ac: ["AC1"]
  - id: "dod-omn21948-ac2-fault"
    description: "AC2 makes the state read fail (a raised read error, an unexpected exception, a bad cursor, a bad claims_since, an opening row that is not a ledger row) and asserts status=error, an error message, no section and no lines."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/nodes/node_work_ledger_query_effect -k \"point_query or fault\" -q --no-cov --tb=line"
        cwd: "."
    binds_ac: ["AC2"]
  - id: "dod-omn21948-ac3-page-watermark"
    description: "AC3 asserts page_size and watermark on every point-query kind, on an empty answer, from a requested size, and a cursor that resumes after the last entity of a page."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/nodes/node_work_ledger_query_effect -k \"page or watermark\" -q --no-cov --tb=line"
        cwd: "."
    binds_ac: ["AC3"]
