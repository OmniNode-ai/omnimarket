schema_version: 1.0.0
ticket_id: OMN-24990
title: 'Make omnimarket PR 5502 run where it belongs: its overlay join check node is installed and read running in the dev runtime on h201'
summary: Adds node_overlay_drift_compute_scheduled_effect, which runs the join check of node_overlay_drift_compute on the runtime tick from a schedule overlay and returns a typed run event, so the dev runtime has a trigger that reaches the join check.
is_seam_ticket: false
interface_change: true
interfaces_touched:
- topics
requirements:
- id: req-omn24990-join-check-on-runtime-tick
  statement: The overlay join check has a runtime trigger, and a missing or unbound source is a failed run event that names it.
  acceptance:
  - id: AC1
    statement: 'AC1: the node of PR 5502 is installed in the dev runtime on h201 through the declared installer, one run is read through the runtime (a log line, a dispatch, a health read or a job record), and a STATUS row kv pr=omnimarket#5502 installed=<host>:<revision> observed=<what ran> read_at=<UTC> is on the ledger -- falsifier: onex-ledger read of the STATUS row for pr=omnimarket#5502 plus the runtime log line it cites on h201, either absent means not done'
  - id: AC2
    statement: 'AC2: when the node cannot run there, the cause is fixed in a draft PR whose body carries a Lab: line, or the blocker is measured and the ticket names who must act -- falsifier: the draft PR body read for its Lab: line, or the ticket comment naming the measurement and the actor, both absent means not done'
evidence_requirements:
- kind: tests
  description: The golden chain, interval gate, error chain and contract topic tests of the scheduled node
  command: uv run --frozen pytest tests/nodes/node_overlay_drift_compute_scheduled_effect -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24990-ac1-trigger-tests
  description: AC1 needs the node to have a runtime trigger; the scheduled node's tests prove a due tick runs one join check and returns a completed run event, and a tick inside the interval returns nothing. The install and the read on h201 are written as a STATUS row of the lane once the overlays hold the two overlay files.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_overlay_drift_compute_scheduled_effect -q --no-cov
    cwd: .
- id: dod-omn24990-ac2-draft-pr
  description: AC2 is met by this pull request, whose body carries the Lab line; the error chain tests prove a missing schedule overlay refuses once and an unreadable or unbound source is a failed run event that names it.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_overlay_drift_compute_scheduled_effect -q --no-cov -k error
    cwd: .
- id: dod-omn24990-deploy-scheduled-node
  description: 'Deploy probe the hosted runner can run: the scheduled node contract at the checked-out commit names its handler class; the file does not exist at the merge base, so the probe fails there.'
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: command
    check_value: 'bash -o pipefail -c ''git show "HEAD:src/omnimarket/nodes/node_overlay_drift_compute_scheduled_effect/contract.yaml" | grep -F "HandlerOverlayDriftComputeScheduled" > /dev/null'''
    cwd: .
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_overlay_drift_compute_scheduled_effect/test_contract_topics.py -q --no-cov
    cwd: .
  - check_type: command
    check_value: 'bash -o pipefail -c ''gh api "repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_overlay_drift_compute_scheduled_effect/contract.yaml?ref=omn-24990-overlay-join-scheduled" --jq .content | base64 -d | grep -F "HandlerOverlayDriftComputeScheduled" > /dev/null'''
    cwd: .
- id: dod-omn24990-integration-proof
  description: The scheduled node runs on a lab host at the pushed sha through the lab work runner; the read of one run on the dev runtime is the lane's STATUS row for pr=omnimarket#5502 once the overlays hold the two overlay files.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane run5502-2041 -- uv run --frozen pytest tests/nodes/node_overlay_drift_compute_scheduled_effect -q --no-cov
    cwd: .
