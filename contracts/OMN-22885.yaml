schema_version: 1.0.0
ticket_id: OMN-22885
title: THROUGHPUT STALL and lab-idle alarms are answered by a responder and costed for the operator
summary: A pure compute node reads the throughput tick's THROUGHPUT STALL MSG rows into cause keys and answers one dispatch per distinct key, and sums the lab-idle FRICTION cost since a start into the status-line segment. This pull request adds the node and its replay tests over the recorded rows of 2026-11-07. It starts no lane and writes no file; the tick that calls it and the status line that prints the segment are separate changes.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn22885-responder
  statement: A THROUGHPUT STALL alarm that names a cause class is answered with one cause dispatch per distinct cause key, and the lab-idle cost since the last start is summed for the operator.
  acceptance:
  - id: AC1
    statement: 'AC1: a stall alarm with a named cause class starts the cause path with no foreground session -- falsifier: uv run pytest of a replay of the 59 MSG rows of 2026-11-07T00:08Z to 10:30Z showing one dispatch per distinct cause key'
  - id: AC2
    statement: 'AC2: the operator-facing status line carries the sum of lab-idle FRICTION cost since the last start (measured 30 rows, 7,100 lane-minutes) -- falsifier: uv run pytest of the status line against the same rows'
evidence_requirements:
- kind: tests
  description: The replay tests of the stall responder node pass, and its contract test.
  command: uv run pytest tests/nodes/node_stall_responder_compute -q
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn22885-ac1
  description: The replay of the 59 stall rows answers one dispatch per distinct cause key (19 keys, two tick-owned findings skipped), and a key already dispatched, covered by a live lane or outside the window answers nothing.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_stall_responder_compute/test_stall_responder.py -q -k 'replay or distinct or covers or window or cut or counts'
- id: dod-omn22885-ac2
  description: The 30 lab-idle FRICTION rows sum to 7,100 lane-minutes and the node renders the status-line segment from them; this pull request does not change the status line itself.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_stall_responder_compute/test_stall_responder.py -q -k 'lab_idle or last_start or unreadable_costs or malformed_start'
- id: dod-omn22885-integration-proof
  description: Run the stall responder node's tests on a lab host at the pushed head. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-22885 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_stall_responder_compute -q --no-cov
