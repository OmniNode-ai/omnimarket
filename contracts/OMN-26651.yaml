schema_version: 1.0.0
ticket_id: OMN-26651
title: omnimarket runs the hard-coded model guard it hosts, with a shrink-only baseline, and a test refuses any registry repository that does not run it
summary: omnimarket hosts the hard-coded model guard's reusable workflow but ran no caller of it, held no pre-commit hook and no baseline. The ci.yml job hardcoded-model-config now calls the hosted
  reusable on every pull request over the whole tree, with --base so a grown baseline is refused; the job is a strict row of the CI Summary table; the pre-commit hook runs the same guard at the same
  omnibase_core commit; config/hardcoded_model_config_baseline.yaml holds the findings of the families that decide a model, an address or a provider (M, E, E-LAN, T, N). The operational-literal
  families (O, G, F, P, S, H, B) are not judged at that pinned commit and are not enrolled.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn26651-guard-runs-in-ci
  statement: Every omnimarket pull request runs the guard over the whole tree against the committed baseline, inside CI Summary.
  acceptance:
  - id: AC1
    statement: 'AC1: every omnimarket pull request runs the hard-coded model guard over the whole tree against config/hardcoded_model_config_baseline.yaml, inside CI Summary -- falsifier: a pull request
      adding a model name as a routing choice in src merges green'
- id: req-omn26651-planted-forms
  statement: Each form of model choice found in the 27 is refused by the guard, or is not yet refused and a tripwire test names it.
  acceptance:
  - id: AC2
    statement: 'AC2: planted cases for every form found in the 27 (bare model id, local-qwen alias, environment name, price key, engine label) are each refused or listed as a named allowed label --
      falsifier: a planted model choice passes the guard'
- id: req-omn26651-shrink-only
  statement: The baseline only shrinks.
  acceptance:
  - id: AC3
    statement: 'AC3: the baseline may only shrink, and a grown or re-frozen entry is refused -- falsifier: a pull request adding a baseline entry is green'
- id: req-omn26651-registry-test
  statement: A test refuses a registry repository with source that declares neither the hook nor the reusable call.
  acceptance:
  - id: AC4
    statement: 'AC4: one test fails when a registry repository with source declares neither the guard hook nor the reusable call -- falsifier: removing the call from omnimarket leaves that test green'
evidence_requirements:
- kind: tests
  description: The wiring, planted-case, baseline and registry tests pass at the pushed head, and the CI Summary replay still reads the recorded verdicts.
  command: uv run --frozen pytest tests/ci/test_omn26651_hardcoded_model_config_wiring.py tests/unit/scripts/ci/test_ci_summary_rules_replay_omn23079.py -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn26651-ac1
  description: The ci.yml job calls the hosted reusable unconditionally with no needs or if, the job is a strict row of the CI Summary table, the pre-commit hook and the job name one omnibase_core
    commit, and the reusable passes --base on a pull request; the CI Summary gate tests and the recorded-heads replay pass at the head.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/ci/test_omn26651_hardcoded_model_config_wiring.py tests/unit/scripts/ci/test_ci_summary_gate.py tests/unit/scripts/ci/test_ci_summary_rules_replay_omn23079.py
      -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn26651-ac2
  description: A planted bare model id, price key, environment name, model value, tier alias, engine label and inference endpoint are each refused by the guard and the same file without them is clean;
    the bare local-qwen alias is named by a tripwire test as not yet refused at the pinned commit (omnibase_core#2364 carries the rule).
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/ci/test_omn26651_hardcoded_model_config_wiring.py -q --no-cov -n 0 -p no:randomly -k "planted or alias"
    cwd: .
- id: dod-omn26651-ac3
  description: A baseline with one more entry than its base, and a re-frozen entry, are each refused by the guard's own growth rule; the committed baseline holds only the enrolled families.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/ci/test_omn26651_hardcoded_model_config_wiring.py -q --no-cov -n 0 -p no:randomly -k "baseline"
    cwd: .
- id: dod-omn26651-ac4
  description: The registry rule refuses a planted tree with source and neither declaration, and refuses this repository's own tree once the job and the hook are removed from it.
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/ci/test_omn26651_hardcoded_model_config_wiring.py -q --no-cov -n 0 -p no:randomly -k "repository"
    cwd: .
