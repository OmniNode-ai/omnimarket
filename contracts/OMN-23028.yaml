schema_version: 1.0.0
ticket_id: OMN-23028
title: The open pull request cap is removed; work in progress is limited only by the work sent to lanes
summary: The work-in-progress admission counts started tickets that a live CLAIM holds (work sent to lanes) and no longer counts open pull requests, in any repository. The per-repository and fleet limits, their numbers and every other rule (fix-forward, ticket creation, unreadable and stale reads) are unchanged.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23028-no-pr-cap
  statement: Admission admits new work with 94 open pull requests and still refuses new work over the lane-dispatch bound, with failing controls that read red on the base source.
  acceptance:
  - id: AC1
    statement: 'AC1: with 94 open pull requests the admission, the remote-lane brief gate and the lab fill gate admit new work, and the new tests fail on origin/dev source -- falsifier: uv run --frozen pytest tests/nodes/node_wip_admission_compute -q --no-cov'
  - id: AC2
    statement: 'AC2: with 94 open pull requests and claimed tickets over the repository bound the admission, the brief gate and the fill gate still refuse -- falsifier: uv run --frozen pytest tests/nodes/node_wip_admission_compute tests/nodes/node_lane_brief_pr_gate_compute -q --no-cov'
evidence_requirements:
- kind: tests
  description: The admission and gate tests pass
  command: uv run --frozen pytest tests/nodes/node_wip_admission_compute tests/nodes/node_lane_brief_pr_gate_compute -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23028-admission-tests
  description: Runs the 94 open pull request control, the over-the-bound refusal beside 94 open pull requests, and the rest of the admission and gate suites.
  source: manual
  binds_ac:
  - AC1
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_wip_admission_compute tests/nodes/node_lane_brief_pr_gate_compute -q --no-cov
    cwd: .
- id: dod-omn23028-integration-proof
  description: Run this pull request's own check on a lab host at the pushed head. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23028 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_wip_admission_compute tests/nodes/node_lane_brief_pr_gate_compute -q --no-cov
    cwd: .
