schema_version: 1.0.0
ticket_id: OMN-24070
title: Create the topics that sixteen merged nodes declare so requests can reach them
summary: Sixteen merged node contracts declare their command and terminal topics only in a topics map, in runtime_dispatch or in terminal_event, and boot provisioning reads only event_bus, so the topics never exist on the development broker. Twelve serve-style nodes now list the topics as publish topics and externally consumed topics, never as subscriptions; four runtime-dispatchable compute nodes subscribe to their command topic. A census test fails when a declared topic is not boot provisioned.
is_seam_ticket: true
interface_change: true
interfaces_touched:
- topics
requirements:
- id: req-omn24070-declared-topics-provisioned
  statement: Every topic a listed node contract declares is in the set boot provisioning creates for the loaded contract, and a command topic is a subscription only for a node whose handler the runtime can build without arguments.
  acceptance:
  - id: AC1
    statement: "AC1: every topic that the 16 listed node contracts declare is created by the runtime's boot provisioning -- falsifier: pytest tests/nodes/test_declared_topics_provisioned.py -q fails on the contracts at origin/dev"
  - id: AC2
    statement: "AC2: the 12 serve-style nodes list their topics as publish topics and externally consumed, never as subscriptions, and the 4 compute nodes subscribe to their command topic -- falsifier: the same test file, tests 2 and 3, fail when a command topic is moved between the lists"
  - id: AC3
    statement: "AC3: integrated: on the dev runtime after the rebuild, each of the 16 nodes' command topics exists on the broker and one command sent to each of the 4 compute nodes returns its terminal event -- falsifier: a broker topic listing on the dev lane missing a topic, or a command with no terminal event within the node's timeout"
evidence_requirements:
- kind: tests
  description: The census test passes at the pushed head.
  command: uv run pytest tests/nodes/test_declared_topics_provisioned.py -q -p no:randomly --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24070-ac1
  description: 'AC1: the census test passes at the head and fails with the merge base contracts of the listed nodes.'
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/test_declared_topics_provisioned.py -q -p no:randomly --no-cov -k every_declared_topic
    cwd: .
- id: dod-omn24070-ac2
  description: 'AC2: the group tests pass at the head and fail when a command topic is moved between the lists.'
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/test_declared_topics_provisioned.py -q -p no:randomly --no-cov -k group_
    cwd: .
- id: dod-omn24070-ac3
  description: 'hosted proxy for AC3: the provisioning tests that stand in for the broker pass here; the dev-lane topic readings and the four compute answers are posted as a pull request comment naming the head.'
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/test_declared_topics_provisioned.py -q -p no:randomly --no-cov
    cwd: .
- id: dod-omn24070-integration-proof
  description: the census test runs on a lab host at the pushed head; hosted CI cannot reach the lab, so only the local Done gate runs this unbound check
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24070 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/test_declared_topics_provisioned.py -q --no-cov -p no:randomly
