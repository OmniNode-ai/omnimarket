schema_version: 1.0.0
ticket_id: OMN-25318
title: 'Review findings 1 to 6 on omnimarket PR 6345 at head 2e66dfd2678e are fixed or argued: the AC4 check records status output and rejects UNREAD rows, the docker row fails loud, the read age is judged inside the tick and the Lab comment is at the new head'
summary: The fourth review of the ruling register tick and unit found the AC4 check passes with one row read, a docker row that reads TRUE when docker fails, fast rows judged stale after a long tick, a serialization that rests on a substring, tests that read the example overlay, and a host name comment that no check reads. This round fixes each with a test that fails at the reviewed head or argues it with evidence in a PR comment.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn25318-review-findings-fixed-or-argued
  statement: Every blocking finding of the fourth review is fixed with a test that fails at the reviewed head, or argued with evidence in a PR comment.
  acceptance:
  - id: AC1
    statement: 'AC1: the AC4 check of contracts/OMN-24944.yaml records the install status output and last-run.json at the new head, and requires every ledger-reader row and the h201 rows not UNREAD -- falsifier: the local Done gate check dod-omn24944-ac4-integration-proof of contracts/OMN-24944.yaml, run on the gate host with RULING_REGISTER_HOST and RULING_REGISTER_INSTALLER set, exits non-zero when one row is read and the rest are UNREAD'
  - id: AC2
    statement: 'AC2: the row one-runtime-no-foreign-containers exits 4 when docker fails and the unit test asserts it reads UNREAD, and docker and curl resolve on the unit PATH for the unit user on h201 -- falsifier: `uv run pytest tests -k ruling_register_unit -q -p no:cacheprovider` fails when the row reads TRUE with docker failing'
  - id: AC3
    statement: 'AC3: register_bound asserts the worst-case read time (720 s for the 16 rows at the 90 s route timeout) is under the unit''s run limit of 900 s, not under max_reading_age_seconds (600 s), and read_register takes its now and adds the tick''s own span to the age bound only when now is unset, so fast rows are not judged stale -- falsifier: `uv run pytest tests -k ruling_register -q -p no:cacheprovider` fails when the worst case reaches the run limit or when the span widens the bound with now given'
  - id: AC4
    statement: 'AC4: every deployed row that reaches the query service carries node_work_ledger_reader_effect in its argv (count 8), and a serial run with the 8 rows answered is recorded -- falsifier: the local Done gate command `ONEX_RULING_REGISTER_DEPLOYED_ROOTS=/data/omninode/overlays/overlays uv run --frozen pytest tests/unit/nodes/node_ruling_register_effect/test_ruling_register_effect.py -k "query_service or one_at_a_time or at_once or two_processes or ledger_lock" -q -p no:cacheprovider` fails when a deployed row lacks the substring or the count is not 8'
  - id: AC5
    statement: 'AC5: the effect and unit tests read the 16 rows, the 8 ledger rows and the 90 s from the deployed overlay, and a lab run prints deployed=True with the three values -- falsifier: the local Done gate command `ONEX_RULING_REGISTER_DEPLOYED_ROOTS=/data/omninode/overlays/overlays uv run --frozen pytest tests/unit/nodes/node_ruling_register_effect/test_ruling_register_effect.py -k "register_values or lab_run_with_no_deployed" -q -p no:cacheprovider` fails when the deployed overlay is absent or the tests fall back to overlay.example.yaml'
  - id: AC6
    statement: 'AC6: the test reads LAB_WORK_HOST_NAME from the dev container as empty and H201_ROWS match the deployed overlay -- falsifier: the local Done gate command `ONEX_RULING_REGISTER_DEPLOYED_ROOTS=/data/omninode/overlays/overlays uv run --frozen pytest tests/nodes/node_host_installer_registry_units/test_ruling_register_unit.py -k "dev_container or h201_rows_of_the_test_match" -q -p no:cacheprovider` fails when an H201_ROWS entry differs from the deployed overlay'
  - id: AC7
    statement: 'AC7: contracts/OMN-25207.yaml states the 900 s limit, the grep in contracts/OMN-25207.yaml and contracts/OMN-25283.yaml also rejects a non-zero exit, and the effect timing tests gate on events -- falsifier: `uv run pytest tests -k ruling_register_effect -q -p no:cacheprovider` fails when a grace sleep replaces an event'
  - id: AC8
    statement: 'AC8: a PR comment starting Lab: head=<full new head sha> names each command with exit 0 (a whole-suite run in named parts if it times out), each blocking finding is fixed or argued in a comment, and the PR title names the tick, the unit and the local read -- falsifier: `onex scm pr-view OmniNode-ai/omnimarket#6345` shows a head that differs from the head named in the Lab: comment, or no Lab: comment, or a command without exit 0'
evidence_requirements:
- kind: tests
  description: The register tick, effect and unit tests pass at the pushed head.
  command: uv run --frozen pytest tests/unit/nodes/node_ruling_register_effect tests/nodes/node_host_installer_registry_units/test_ruling_register_unit.py -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn25318-ac1
  description: 'The AC4 check is executed against the installer''s real status output and a real tick''s record: it fails when one row is read and the rest are UNREAD, and when any one of the 12 ledger-reader and h201 rows reads UNREAD; it does not read a Lab line.'
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_host_installer_registry_units/test_ruling_register_unit.py -k "ac4_check" -q --no-cov -n 0 -p no:randomly -p no:cacheprovider
    cwd: .
- id: dod-omn25318-ac2
  description: The row one-runtime-no-foreign-containers exits 4 under a failing docker and reads UNREAD, the earlier text reads TRUE (control), and the AC4 check fails when docker or curl fails on the unit PATH.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_host_installer_registry_units/test_ruling_register_unit.py -k "docker or ac4_check_fails_when_the_dev_container" -q --no-cov -n 0 -p no:randomly -p no:cacheprovider
    cwd: .
- id: dod-omn25318-ac3
  description: A tick longer than the age bound judges its fast rows TRUE (read_register takes its now and adds the tick's own span to the bound), a reading older than the bound before the tick still reads UNREAD, and the worst case of the register stays under the unit's run limit. The deployed register's 720 s worst case is above its 600 s age bound; the span-aware bound is what keeps its fast rows read, so the worst case is compared with the run limit and not with the age bound.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/nodes/node_ruling_register_effect/test_ruling_register_effect.py -k "stale or older_than_the_bound or now_it_is_given or inside_the_unit_run_limit or each_input" -q --no-cov -n 0 -p no:randomly -p no:cacheprovider
    cwd: .
- id: dod-omn25318-ac4
  description: Every row that names the query service carries the marker (count 8 on the deployed overlay; the names that reach the service are read from the repository) and the cap, chain and cross-process lock tests gate on events. The serial run of the 8 ledger rows is recorded in the Lab comment of the head. The command names the deployed overlay, so only the local Done gate runs it.
  source: manual
  binds_ac:
  - AC4
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: sh -c 'ONEX_RULING_REGISTER_DEPLOYED_ROOTS="/data/omninode/overlays/overlays" uv run --frozen pytest tests/unit/nodes/node_ruling_register_effect/test_ruling_register_effect.py -k "query_service or one_at_a_time or at_once or two_processes or ledger_lock" -q --no-cov -n 0 -p no:randomly -p no:cacheprovider'
    cwd: .
- id: dod-omn25318-ac5
  description: The tests read the register from the deployed overlay roots a lab run names and print deployed=True with the three values; with no deployed overlay a lab run fails. Run on a lab host that holds the deployed overlays, so only the local Done gate runs the unbound check.
  source: manual
  binds_ac:
  - AC5
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: sh -c 'ONEX_RULING_REGISTER_DEPLOYED_ROOTS="/data/omninode/overlays/overlays" uv run --frozen pytest tests/unit/nodes/node_ruling_register_effect/test_ruling_register_effect.py -k "register_values or lab_run_with_no_deployed" -q --no-cov -n 0 -p no:randomly -p no:cacheprovider'
    cwd: .
  - check_type: command
    check_value: sh -c 'set -eu; out=$(ONEX_RULING_REGISTER_DEPLOYED_ROOTS="/data/omninode/overlays/overlays" uv run --frozen pytest tests/unit/nodes/node_ruling_register_effect/test_ruling_register_effect.py -k register_values_are_read -s -q --no-cov -n 0 -p no:randomly -p no:cacheprovider); printf "%s\n" "$out"; printf "%s\n" "$out" | grep -F "REGISTER-VALUES deployed=True rows=16 ledger_rows=8 timeout=90"'
    cwd: .
- id: dod-omn25318-ac6
  description: The AC4 check fails when the dev runtime container carries LAB_WORK_HOST_NAME, and the H201_ROWS entries and the journal variable are compared with the deployed overlay (the command names ONEX_RULING_REGISTER_DEPLOYED_ROOTS, so the tests never read overlay.example.yaml) on a lab host that holds it, which is why only the local Done gate runs it.
  source: manual
  binds_ac:
  - AC6
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: sh -c 'ONEX_RULING_REGISTER_DEPLOYED_ROOTS="/data/omninode/overlays/overlays" uv run --frozen pytest tests/nodes/node_host_installer_registry_units/test_ruling_register_unit.py -k "dev_container or h201_rows_of_the_test_match or unit_names_the_journal" -q --no-cov -n 0 -p no:randomly -p no:cacheprovider'
    cwd: .
- id: dod-omn25318-ac7
  description: contracts/OMN-25207.yaml no longer states the 600 s limit, the Lab checks of the two earlier contracts fail on a failed command, and the effect timing tests use a barrier and events.
  source: manual
  binds_ac:
  - AC7
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/nodes/node_ruling_register_effect/test_ruling_register_effect.py tests/nodes/node_host_installer_registry_units/test_ruling_register_unit.py -k "lab_comment or one_at_a_time or more_slow_rows" -q --no-cov -n 0 -p no:randomly -p no:cacheprovider
    cwd: .
  - check_type: command
    check_value: sh -c '! grep -nF "the 600 s limit" contracts/OMN-25207.yaml'
    cwd: .
- id: dod-omn25318-ac8
  description: The PR view carries a Lab comment line naming the head with exit=0 and no non-zero exit, and its title names the tick, the unit and the local read. A PR comment and the watcher state are not readable on the hosted runner, so only the local Done gate runs these checks.
  source: manual
  binds_ac:
  - AC8
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: |-
      sh -c '
      set -eu
      head=$(git rev-parse HEAD)
      view=$(mktemp)
      trap "rm -f $view" EXIT
      onex scm pr-view OmniNode-ai/omnimarket#6345 --source bus > "$view"
      python3 - "$head" "$view" <<"PY"
      import json, re, sys
      head, path = sys.argv[1], sys.argv[2]
      answer = json.load(open(path, encoding="utf-8"))
      if answer.get("source") != "bus":
          sys.exit("pr-view answered from " + str(answer.get("source")) + ", which carries no comments: the Lab comment is unread")
      comments = (answer.get("result") or {}).get("comments") or []
      labs = [c for c in comments if str(c.get("body", "")).startswith("Lab: head=")]
      if not labs:
          sys.exit("the PR carries no comment starting Lab: head=")
      newest = max(labs, key=lambda c: (str(c.get("created_at", "")), int(c.get("id") or 0)))
      body = str(newest["body"])
      first = body.splitlines()[0]
      print(first)
      if not first.startswith("Lab: head=" + head):
          sys.exit("the newest Lab comment names another head than " + head)
      if "exit=0" not in body:
          sys.exit("the newest Lab comment names no command with exit=0")
      if re.search(r"exit[= ][1-9]", body):
          sys.exit("the newest Lab comment reports a failed command")
      PY
      '
    cwd: .
  - check_type: command
    check_value: |-
      sh -c 'onex scm pr-view OmniNode-ai/omnimarket#6345 | grep -o "\"title\":\"[^\"]*\"" | grep -E "tick, .*unit, .*local reads"'
    cwd: .
- id: dod-omn25318-integration-proof
  description: 'One serial run of the register tick against the deployed overlays on a lab host that holds them (the deployed overlay roots are the host''s own ONEX_SKILL_OVERLAY_ROOTS): the 8 rows that run the ledger reader read one after another through the work-ledger query service, the tick ends inside the unit''s 900 s run limit and no row ends unanswered by a timeout. It runs the tick on the live query service, so only the local Done gate runs it. Rows that exit 4 under their own judge (source not yet present) are reported in the output, not hidden. It also reads the register''s record and the dev runtime container on h201 (read only).'
  source: manual
  binds_ac:
  - AC4
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: |-
      sh -c '
      set -eu
      host=${RULING_REGISTER_HOST:-h201}
      on_host() { if [ "$host" = local ]; then "$@"; else ssh "$host" "$@"; fi; }
      on_host true || { echo "$host does not answer from $(hostname): set RULING_REGISTER_HOST to the alias of h201 on this gate host (local on h201 itself)"; exit 1; }
      d=$(mktemp -d)
      rc=0; on_host pgrep -f "[r]untime_ruling_register_tick" > /dev/null || rc=$?
      case "$rc" in 1) ;; 0) echo "h201 is mid-tick: its unit reads the query service now"; exit 1 ;; *) echo "pgrep on h201 did not answer (exit $rc): whether h201 is mid-tick is unread"; exit 1 ;; esac
      start=$(date +%s)
      state=${ONEX_STATE_DIR:?set ONEX_STATE_DIR to the state directory of this host: the unit derives its ledger-reader lock from it, and this run shares that lock only under the same directory}
      env -u PYTHONPATH -u ONEX_RULING_REGISTER_LEDGER_LOCK ONEX_STATE_DIR="$state" uv run --frozen python -m omnimarket.nodes.node_ruling_register_effect.runtime_ruling_register_tick --state-dir "$d" --omni-home "$OMNI_HOME" > "$d/out.txt"
      seconds=$(( $(date +%s) - start ))
      cat "$d/out.txt"
      echo "serial tick seconds=$seconds"
      rec=$(cat "$d/last-run.json")
      printf "%s\n" "$rec"
      test "$seconds" -lt 900
      grep -q "^RULING-REGISTER rows=16 " "$d/out.txt"
      for id in new-work-lands-with-a-fable-verdict dev-holds-ready merged-means-running lanes-placed-bottom-up fable-reviews-run-on-the-mac holds-have-an-owner-and-an-unexpired-expiry plan-slice-round-four-needs-a-scope-cut lab-fill-skips-under-a-fifth; do
        printf "%s" "$rec" | grep -qE "\"$id\": \"(TRUE|FALSE)\"" || { echo "row $id is not answered: it is missing or reads UNREAD"; exit 1; }
      done
      rc=0; on_host pgrep -f "[r]untime_ruling_register_tick" > /dev/null || rc=$?
      case "$rc" in 1) ;; 0) echo "h201 went mid-tick during the proof: the runs may overlap"; exit 1 ;; *) echo "pgrep on h201 did not answer (exit $rc): whether the runs overlapped is unread"; exit 1 ;; esac
      '
    cwd: .
  - check_type: command
    check_value: |-
      sh -c '
      set -eu
      host=${RULING_REGISTER_HOST:-h201}
      on_host() { if [ "$host" = local ]; then "$@"; else ssh "$host" "$@"; fi; }
      on_host true || { echo "$host does not answer from $(hostname): set RULING_REGISTER_HOST to the alias of h201 on this gate host (local on h201 itself)"; exit 1; }
      rec=$(on_host cat .local/state/omni/ruling-register/last-run.json)
      printf "%s\n" "$rec"
      printf "%s" "$rec" | grep -q "\"rows\": 16"
      container_env=$(on_host docker exec omninode-runtime env)
      if printf "%s\n" "$container_env" | grep -q "^LAB_WORK_HOST_NAME="; then echo "the dev runtime container carries LAB_WORK_HOST_NAME"; exit 1; fi
      '
    cwd: .
