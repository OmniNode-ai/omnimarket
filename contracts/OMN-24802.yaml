  description: 'hosted proxy for AC1: the two in-pull-request causes are fixed, the projection node tests pass with the snapshot topic asserted and the topics read from the contract; the pull request reading ci=GREEN is made from the watcher state after the omnibase_infra grant is released and pinned, not by this change'
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_projection_eval_results tests/test_golden_chain_projection_eval_results.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24802-ac2
