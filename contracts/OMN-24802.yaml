schema_version: 1.0.0
ticket_id: OMN-24802
title: unblock omnimarket PR 6204 (red CI Summary, imperative-contract-guard / Imperative Contract Guard, state-coverage-gate and the checks that report the same failures)
summary: The eval-results projection pull request failed two checks for causes inside it, the imperative contract guard (four hardcoded topic literals in a model file) and the state-coverage gate (the snapshot topic asserted by no test). Both are fixed here. Its other reds read the missing omnibase_infra grant for tenant_projection_writer on public.eval_item_scores, a cause outside this repository that this change does not patch around.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24802-unblock-6204
  statement: The causes of the red checks on omnimarket PR 6204 are named from their failure text, those inside the pull request are fixed on its own branch, and the one outside it is recorded with its evidence.
  acceptance:
  - id: AC1
    statement: 'AC1: omnimarket PR 6204 reads ci=GREEN with no red check at a new head -- falsifier: `python3 $OMNI_PLUGIN_ROOT/skills/merge-drain/scripts/pr_state_local.py --pr OmniNode-ai/omnimarket#6204` prints a head other than 37c58362e4fd and no red= list'
  - id: AC2
    statement: 'AC2: the cause of each red check is named from its failure text at the head, or a STATUS row names a shared cause with its evidence -- falsifier: a search of the ledger for ''omnimarket#6204'' shows no STATUS row with cause= and shared=yes and no PR comment starting `Lab: head=`'
evidence_requirements:
- kind: tests
  description: The eval-results projection tests, with the snapshot topic assertion, pass at the pushed head.
  command: uv run --frozen pytest tests/nodes/node_projection_eval_results tests/test_golden_chain_projection_eval_results.py -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
