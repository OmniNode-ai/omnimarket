    check_value: uv run --frozen pytest tests/unit/workflows/test_deploy_gate_body_from_event.py tests/unit/workflows/test_deploy_gate_reads_pr_title_omn20413.py -q -p no:cacheprovider --no-cov
    cwd: .
- id: dod-omn24310-ac3
