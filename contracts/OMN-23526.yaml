schema_version: "1.0.0"
ticket_id: OMN-23526
title: omnimarket's test durations record covers the 57 test files dev left out, so the freshness test passes on dev and on every change that merges it
summary: >-
  The freshness test tests/unit/test_ci_shard_plan_record_freshness_omn17427.py reads 57 of 4928 test files absent from config/test_file_durations.json on dev a11e4676e82b, limit 50, and fails Tests (Split 17/20) on dev and on every change that merges dev (seen on omnimarket#5689). This change records measured seconds for those 57 files with a provenance supplement. No limit, check or test bound is changed.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn23526-durations-record-covers-dev
    statement: >-
      The committed durations record names every test file on dev, so the freshness test and the shard plan tests pass with the limit of 50 unchanged.
    acceptance:
      - id: AC1
        statement: "AC1: config/test_file_durations.json records all 57 test files that the development branch leaves out today, each with a measured time -- falsifier: pytest tests/unit/test_ci_duration_record_supplement_omn23527.py -q fails at the merge base and passes at the head"
      - id: AC2
        statement: "AC2: the freshness test passes on the development branch with the limit of 50 unchanged -- falsifier: pytest tests/unit/test_ci_shard_plan_record_freshness_omn17427.py -q reports fewer than 50 unrecorded files"
evidence_requirements:
  - kind: tests
    description: >-
      The supplement test, the freshness test and the shard plan tests.
    command: uv run --frozen pytest tests/unit/test_ci_duration_record_supplement_omn23527.py tests/unit/test_ci_shard_plan_record_freshness_omn17427.py tests/unit/test_ci_shard_plan_omn19684.py -q -n 0 --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn23526-ac1-durations-record
    description: >-
      The supplement test finds all 57 measured files in the record on this branch. At the merge base (dev a11e4676e82b) the 57 files are absent and the test fails.
    source: manual
    binds_ac:
      - AC1
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/test_ci_duration_record_supplement_omn23527.py -q -n 0 --no-cov
        cwd: ${OMNI_HOME}/omnimarket
  - id: dod-omn23526-ac2-freshness
    description: >-
      The freshness test passes with the limit of 50 unchanged; on dev it reads 57 unrecorded and fails.
    source: manual
    binds_ac:
      - AC2
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/test_ci_shard_plan_record_freshness_omn17427.py -q -n 0 --no-cov
        cwd: ${OMNI_HOME}/omnimarket
  - id: dod-deploy-omn23526-durations-record
    description: >-
      The shard plan tests that read the changed record still pass, which hosted CI can run.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/test_ci_shard_plan_omn19684.py -q -n 0 --no-cov
        cwd: ${OMNI_HOME}/omnimarket
    binds_ac: []
