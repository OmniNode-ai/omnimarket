schema_version: "1.0.0"
ticket_id: OMN-19438
title: savings_estimates rows carry the registry tenant UUID, never the house slug
summary: A second forward migration re-attributes the savings_estimates rows the unfixed writer stored under the house slug after the first backfill was recorded as applied, so the lab count of slug rows can reach zero.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn19438-rebackfill
  statement: The savings writer stamps the registry UUID, the named defaults resolve to UUIDs, and a forward migration after 091 moves any remaining slug row to the house UUID.
  acceptance:
  - id: AC1
    statement: 'AC1: the savings writer stamps the registry tenant UUID and refuses a write with a typed error when none resolves -- falsifier: uv run pytest tests/test_omn19438_savings_registry_tenant_uuid.py -q fails when the writer stamps the slug or accepts an unresolved tenant'
  - id: AC2
    statement: 'AC2: none of the three named projection defaults resolves to the slug -- falsifier: the default-tenant tests in tests/test_omn19438_savings_registry_tenant_uuid.py fail when a default parses as the slug'
  - id: AC3
    statement: 'AC3 (source half): a forward migration after 091 moves every savings_estimates row with tenant omninode to the house UUID and is idempotent -- falsifier: tests/test_omn19438_savings_rebackfill_migration.py fails when the migration is absent or leaves a slug row on a real Postgres. The live psql count on the lab database is read after deploy and is not claimed here.'
evidence_requirements:
- kind: tests
  description: The writer and default tests, the re-backfill source tests and the sibling savings write-path gate.
  command: uv run pytest tests/test_omn19438_savings_registry_tenant_uuid.py tests/test_omn19438_savings_rebackfill_migration.py -q -m "not kafka"
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
