title: "Fix the blocking review findings on omnimarket PR 6317 and its companion pull request for the exemplar and graph requirement"
summary: "omnimarket half of the fix for the review of the exemplar and graph close rule: the contract binds no criterion on the local done gate item, the start orchestrator sends the brief, the close node reads a code lane from the brief's EXEMPLAR and GRAPH steps, accepts exemplar=none:<reason> and carries both cells in ledger_cells."
