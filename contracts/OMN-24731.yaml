requirements:
  - id: req-omn24731-review-findings
    statement: "The blocking review findings on the exemplar and graph change are fixed, each with a test that fails at the reviewed head and passes at the new head."
    acceptance:
      - id: "AC1"
        statement: "AC1: contracts/OMN-24686.yaml in omnimarket carries no binds_ac on the local_done_gate item and tests/ci/test_repo_evidence_caller_workflow.py passes -- falsifier: uv run pytest tests/ci/test_repo_evidence_caller_workflow.py -q"
      - id: "AC2"
        statement: "AC2: the remote-lane start orchestrator and the runner close_request both send the lane brief to the close node, and a code lane whose final message names no exemplar and graph cell closes partial -- falsifier: uv run pytest -q -k exemplar_graph_cell in omnimarket"
      - id: "AC3"
        statement: "AC3: the runner's final-message instruction tells a lane to put exemplar and graph cells on its LANE_RESULT or TERMINAL line, and exemplar=none:<reason> is accepted and kept as a finding -- falsifier: uv run pytest -q -k exemplar_graph_cell in both repositories"
      - id: "AC4"
        statement: "AC4: the close node and the brief check read one definition of a code lane, with the open-ended exemption, and a brief with a non-empty EXEMPLAR or GRAPH section is accepted as well as the line form -- falsifier: uv run pytest -q -k exemplar_graph in both repositories"
      - id: "AC5"
        statement: "AC5: the exemplar and graph cells ride in ledger_cells on the close result, not only in findings -- falsifier: uv run pytest -q -k exemplar_graph_cell in omnimarket"
      - id: "AC7"
        statement: "AC7: each new test fails on the base revision and passes on the new head of its PR (red then green), and a brief or TERMINAL for a lane that writes no code is not refused -- falsifier: uv run pytest -q -k exemplar_graph run at the PR base and at the PR head"
