schema_version: 1.0.0
title: Each omnimarket pull request keeps a typed selection record, the repository variable decides the executed matrix, and a stage gate sits in policy before any narrowing rule exists
ticket_id: OMN-26269
summary: >-
  The selector's decision for a pull request was thrown away after each run, and the flag that should switch smart
  selection off did not switch the matrix off (the workflow passed the literal on). The selector node now builds a typed
  record (operation build_selection_record) holding the executed selection and the selection of every stage; the
  Detect Changes job uploads it as test-selection-<pr>-<run_id>-<attempt> without overwriting, reads the flag from the
  repository variable, and builds the pytest shard matrix from the executed selection only. The stage gate
  (selection_stage, default 0), full_split_count and record_retention_days are policy keys. scripts/ci/test_selection_models.py
  is deleted and its types live in the node; scripts/ci/detect_test_paths.py shrinks. At stage 0 with the flag on, what a
  pull request runs is unchanged.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn26269-selection-record
  statement: Each pull request run keeps a typed selection record, the flag from the repository variable decides the executed matrix, and the stage gate is installed at stage 0.
  acceptance:
  - id: AC1
    statement: 'AC1: a record of a real pull request run downloads and validates against the model -- falsifier: `onex scm run-download --run-id <id> --artifact-id <id>` of the run artifact, then a `uv run python -c` that imports `ModelTestSelectionRecord` and calls `model_validate_json` on it exits nonzero on a record with a missing key'
  - id: AC2
    statement: 'AC2: flag on and flag off over the same narrowable input differ exactly as stated, flag off gives the full matrix with `split_count == full_split_count` from policy.yaml and the stage entries unchanged -- falsifier: `uv run pytest tests/ci -k flag_states_same_input` and `-k flag_off_full_matrix`'
  - id: AC3
    statement: 'AC3: the artifact name carries pull request, run id and attempt, so attempts 1 and 2 give two distinct names and a repeated key is refused, never overwritten -- falsifier: `uv run pytest tests/ci/test_ci_selection_record_upload.py -q --no-cov` fails if the upload step lacks `overwrite: false` or the name builder collides'
  - id: AC4
    statement: 'AC4: the pytest matrix is built from `executed_selection` at every stage, and a stage-1 record whose stage-2 and stage-3 entries hold later-stage rules still runs only the stage-1 selection -- falsifier: the workflow test with a fixture record whose entries differ fails if the matrix uses any other entry'
  - id: AC5
    statement: 'AC5: the record carries the checkout sha, policy version, selection stage and the selector and policy versions of each stage entry -- falsifier: `uv run pytest tests/nodes/node_test_selection_selector_compute/test_selection_record.py -q --no-cov` fails on a record missing any of them'
evidence_requirements:
- kind: tests
  description: The workflow test, the record tests, the golden and error chain events, and the detect_test_paths tests.
  command: uv run --frozen pytest tests/ci/test_ci_selection_record_upload.py tests/nodes/node_test_selection_selector_compute tests/test_golden_chain_test_selection_selector_compute.py tests/unit/scripts/test_detect_test_paths.py -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn26269-ac1-record-validates
  description: A record the builder writes validates against ModelTestSelectionRecord, and a record with a missing key is refused (the record tests and the golden chain). The record of the first real pull request run is read through onex scm run-download after the pull request opens.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_test_selection_selector_compute/test_selection_record.py tests/test_golden_chain_test_selection_selector_compute.py -q --no-cov -k "round_trips or without_a_top_level_key or build_selection_record"
    cwd: .
- id: dod-omn26269-ac2-flag-states
  description: Flag on gives the stage entry, flag off gives the full matrix of full_split_count shards from policy.yaml, and the stage entries are the same in both.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/ci -q --no-cov -k "flag_states_same_input or flag_off_full_matrix"
    cwd: .
- id: dod-omn26269-ac3-artifact-name
  description: Attempts 1 and 2 give two names, a repeated key gives the same name, and the upload step sets overwrite false.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/ci/test_ci_selection_record_upload.py -q --no-cov
    cwd: .
- id: dod-omn26269-ac4-matrix-from-executed
  description: The step that exposes the matrix, run over a record whose stage entries differ, reads the executed selection only.
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/ci/test_ci_selection_record_upload.py -q --no-cov -k "matrix_is_built_from_executed_selection_only or reads_only_the_executed_selection"
    cwd: .
- id: dod-omn26269-ac5-record-fields
  description: The record carries the checkout sha, policy version, selection stage and the selector and policy versions of each stage entry; a record missing any key is refused.
  source: manual
  binds_ac:
  - AC5
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_test_selection_selector_compute/test_selection_record.py -q --no-cov
    cwd: .
- id: dod-omn26269-stage-zero-unchanged
  description: At stage 0 with the flag on the executed selection equals the existing selector's decision over the same inputs.
  source: manual
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/ci/test_ci_selection_record_upload.py tests/unit/scripts/test_detect_test_paths.py -q --no-cov -k "existing_selector_decides or detect"
    cwd: .
- id: dod-omn26269-integration-proof
  description: Run this pull request's own tests on a lab host at the pushed head. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-26269 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/ci/test_ci_selection_record_upload.py tests/nodes/node_test_selection_selector_compute tests/test_golden_chain_test_selection_selector_compute.py tests/unit/scripts/test_detect_test_paths.py -q --no-cov
    cwd: .
