schema_version: "1.0.0"
ticket_id: "OMN-24330"
title: "Ledger append command uses the container's own broker login"
summary: "bound_lane_principal in delegated_test_loop/lane_bus.py returns the broker login the container exports (KAFKA_SASL_USERNAME with KAFKA_SASL_PASSWORD also set) when open_lab_run_bus binds no lane transport, scoped to the opened connection. The append command of the work ledger bus then finds its writer identity in the container, where before it refused with no broker login. The writer's declaration and append topic rows live in the overlays repository and are applied to the dev broker additions only."
is_seam_ticket: true
interface_change: true
interfaces_touched:
  - "topics"
requirements:
  - id: "req-omn24330-environment-login-names-the-writer"
    statement: |-
      The append command resolves its writer identity from the container's own broker login and appends through the writer's declared topic.
    acceptance:
      - id: "AC1"
        statement: "AC1: inside an opened kafka bus whose environment holds the broker login, bound_lane_principal returns that login, and after the bus closes it refuses -- falsifier: pytest tests/unit/work_ledger_bus/test_lane_principal.py -q -k environment_login"
      - id: "AC2"
        statement: "AC2: half a credential, a refused broker start and a bound plaintext transport still leave no login named -- falsifier: pytest tests/unit/work_ledger_bus/test_lane_principal.py -q -k \"without_a_password or failed_broker_start or ignores_the_ambient\""
      - id: "AC3"
        statement: "AC3: the dev lane writer is declared as a ledger writer in the overlays repository with its append topic rows, and the broker rows are applied additions only -- falsifier: the broker rows tool dry run after the apply lists an addition for the writer's append topic"
      - id: "AC4"
        statement: "AC4: integrated: one lane result sweep run on the dev runtime ends with outcome completed and the row it appended is read back from the work record -- falsifier: the run ends failed naming no broker login, or the appended row is absent on read back"
evidence_requirements:
  - kind: "tests"
    description: "The lane principal tests pass at the pushed head."
    command: "uv run --frozen pytest tests/unit/work_ledger_bus/test_lane_principal.py -q --no-cov -n 0 -p no:randomly"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn24330-environment-login"
    description: "The environment login tests pass at the head; with the previous lane_bus.py put back, test_environment_login_names_the_writer_inside_the_opened_bus and test_environment_login_picks_the_declared_writer_topic fail with no broker login (the failing control)."
    source: "manual"
    binds_ac: ["AC1"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run --frozen pytest tests/unit/work_ledger_bus/test_lane_principal.py -q --no-cov -n 0 -p no:randomly -k environment_login"
        cwd: "."
  - id: "dod-omn24330-refusals-kept"
    description: "Half a credential, a refused broker start and a bound plaintext transport still name no login."
    source: "manual"
    binds_ac: ["AC2"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run --frozen pytest tests/unit/work_ledger_bus/test_lane_principal.py -q --no-cov -n 0 -p no:randomly -k refusals_stand_beside"
        cwd: "."
  - id: "dod-omn24330-writer-declared"
    description: "hosted proxy for AC3: the lane principal tests pass here; the writer declaration and the broker rows are a separate change in the overlays repository and are applied by the apply tool after it merges (dry run first), read on the broker by the lane."
    source: "manual"
    binds_ac: ["AC3"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run --frozen pytest tests/unit/work_ledger_bus/test_lane_principal.py -q --no-cov -n 0 -p no:randomly"
        cwd: "."
  - id: "dod-omn24330-integrated"
    description: "hosted proxy for AC4: the lane principal tests pass here; the lane result sweep run and its row read back are taken on the dev runtime after the infrastructure binding lands and the runtime rolls, and are named in a pull request comment."
    source: "manual"
    binds_ac: ["AC4"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run --frozen pytest tests/unit/work_ledger_bus/test_lane_principal.py -q --no-cov -n 0 -p no:randomly"
        cwd: "."
  - id: "dod-omn24330-integration-proof"
    description: "Run the lane principal tests on a lab host at the pushed head. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check. It binds no acceptance criterion: the runtime reading (AC4) is taken on the dev runtime after the infrastructure binding lands and the runtime rolls."
    source: "manual"
    execution_scope: "local_done_gate"
    checks:
      - check_type: "command"
        check_value: "env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha \"$(git rev-parse HEAD)\" --lane dod-integration-proof-24330 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/work_ledger_bus/test_lane_principal.py -q --no-cov -n 0 -p no:randomly"
        cwd: "."
