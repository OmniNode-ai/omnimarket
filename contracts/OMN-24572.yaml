schema_version: 1.0.0
ticket_id: OMN-24572
title: The ledger reader takes a page size for each kind of read
summary: The work-ledger reader node's overlay gains an optional page_size_by_query map, so one kind of read (the open claims, whose pages carry each claim's activity) asks the query node for fewer entries per page than the general page_size, which suits lines-only rows pages. A page that fit under the query node's answer bound is answered; one that did not was refused (measured on the dev bus on 2026-11-15, 1,919,937 bytes against the bound of 917,516 for a page of 1000 open claims). The reader node and the query node meet at the page size the reader sends. Never reads the ledger file.
is_seam_ticket: true
interface_change: true
interfaces_touched:
- public_api
requirements:
- id: req-omn24572-page-size-by-query
  statement: The ledger reader can read the open claims through the bus under the query node's answer bound.
  acceptance:
  - id: AC1
    statement: 'AC1: the reader sends the page size its settings name for the query being read (an open-claims read can differ from a rows read) and falls back to the general page size when none is named -- falsifier: uv run pytest tests/unit/nodes/node_work_ledger_reader_effect/test_reader_page_size_by_query_ledger_cut5.py -q'
  - id: AC2
    statement: 'AC2: a settings file that names a page size of zero or below, or a query the reader does not have, is refused when it loads -- falsifier: uv run pytest tests/unit/nodes/node_work_ledger_reader_effect/test_reader_page_size_by_query_ledger_cut5.py -q -k refused'
  - id: AC3
    statement: 'AC3: integrated: through the reader on the dev bus on h053, with the open-claims page size set in the reader settings, the open-claims read answers status ok with at least one claim line and file_read no -- falsifier: run the reader node for open-claims on the dev bus and read status unreadable, as before the change'
evidence_requirements:
- kind: tests
  description: The reader node tests pass at the pushed head.
  command: uv run --frozen pytest tests/unit/nodes/node_work_ledger_reader_effect -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24572-ac1
  description: 'The open-claims read sends the page size named for it and every other read sends the general one; the default is no map. Failing control: at the merge base the overlay refuses the key and the new tests fail.'
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/nodes/node_work_ledger_reader_effect/test_reader_page_size_by_query_ledger_cut5.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24572-ac2
  description: 'Error chain: a zero, an over-large or an unknown-query entry is a validation error when the overlay loads.'
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/nodes/node_work_ledger_reader_effect/test_reader_page_size_by_query_ledger_cut5.py -q --no-cov -n 0 -p no:randomly -k refused
    cwd: .
- id: dod-omn24572-ac3
  description: The tests behind the integrated reading pass; the dev-bus open-claims reading through the reader is recorded in the Lab line and a comment at the pushed head.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/nodes/node_work_ledger_reader_effect -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24572-integration-proof
  description: Run the reader tests on a lab host at the pushed head. Hosted CI cannot reach the lab hosts, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24572 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/nodes/node_work_ledger_reader_effect -q --no-cov -n 0 -p no:randomly
    cwd: .
