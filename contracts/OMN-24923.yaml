schema_version: 1.0.0
ticket_id: OMN-24923
title: Review findings 1 to 9 on omnimarket PR 6327 at head f7d10ded4f32 are fixed or argued
summary: Third fix round on the pull request that starts the eight-writer test's pool workers through spawn (implementation ticket OMN-24844, second round OMN-24904). Changes tests/test_capture_item_identity_effect.py, contracts/OMN-24844.yaml and contracts/OMN-24904.yaml. The test file gains a scan that refuses any skip, xfail or importorskip call or mark anywhere in it, a check of the collected eight-writer item for a marker a conftest added, a mark reader that accepts a module mark that is a list, and a pool shutdown bounded to 20 s. The two contracts cite the open owner decision on Linear AC1 and AC3 of OMN-24844 by the pull request comment that proposes the amended text, scope their git show checks to the local Done gate, and carry checks that can fail on their falsifier. The whole-suite CI split is not given --refuse-skips (it holds 275 baselined skipped test ids), and the argument is in the pull request comment. Not in this change - any workflow file, the handler under test, the Linear text of any ticket.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24923-review-round
  statement: Every blocking finding of the review at head f7d10ded4f32 of omnimarket#6327 is fixed with a red-then-green test or argued with evidence in a pull request comment, and the non-blocking findings are fixed or argued.
  acceptance:
  - id: AC1
    statement: "AC1: contracts/OMN-24844.yaml line 4 cites the ticket owner's amend or waiver record for Linear AC1 and AC3 of OMN-24844, or a PR comment proposes the exact amended text and the lane's TERMINAL names the owner action as open, so the contract no longer restates the gap without closing it -- falsifier: sed -n 1,12p contracts/OMN-24844.yaml at the new head shows no citation of an owner record and the PR has no comment proposing the amended AC1 and AC3 text"
  - id: AC2
    statement: "AC2: a PR comment starting Lab: head=<full new head sha> names the sha, the contract's :27 command and exit 0 with both fork red runs and the xfail-marker red run, the :27 command matches the CI split's command, import mode and xdist use in the workflow file, and every required check-run of omnimarket#6327 reads success at the new head -- falsifier: onex scm pr-checks OmniNode-ai/omnimarket#6327 lists a required context that is not success at the new head, or the Lab comment lacks the full sha, the command, exit 0, a red run, or a :27 line that matches the workflow split"
  - id: AC3
    statement: "AC3: tests/refuse_skips.py defines --refuse-skips, pytest-timeout is a dev dependency, and both the :27 command in contracts/OMN-24844.yaml and the CI split pass --refuse-skips, with a test that fails when a pytest.skip() call or a conftest-added skip is present -- falsifier: uv run pytest tests/test_capture_item_identity_effect.py -q -p no:cacheprovider --refuse-skips passes with a pytest.skip() call added to the file"
  - id: AC4
    statement: "AC4: the AC1 check of contracts/OMN-24904.yaml names tests that are red against the b13188dd6eff code or is reworded to the argued branch citing the comment, and its AC2 check is a local_done_gate check on the command, exit 0 and the required check-runs -- falsifier: grep -n 'b13188dd6eff' contracts/OMN-24904.yaml shows a check that is a green run at the new head, or the AC2 check greps only the comment prefix"
  - id: AC5
    statement: "AC5: non-blocking findings 5 to 9 are fixed or argued in a PR comment: both git show <sha> checks are scoped to local_done_gate, tests/__init__.py exists, the assert check diffs the removed assert lines and also greps importorskip and mark.skip, terminate() and join() are bounded or the gap is said at contracts/OMN-24844.yaml:4, and the mark reader normalises pytestmark to a list -- falsifier: uv run pytest tests/test_capture_item_identity_effect.py -q -p no:cacheprovider passes with the module pytestmark changed to a list"
evidence_requirements:
- kind: tests
  description: The capture item identity test file at the pushed head, run on a lab host with the flags the CI test split uses (coverage on, 300 s thread timeout, no xdist), with --refuse-skips and strict xfail.
  command: uv run pytest tests/test_capture_item_identity_effect.py -v --tb=short -m "not kafka" --cov=src --cov-report= --timeout=300 --timeout-method=thread -p no:cacheprovider --refuse-skips -o xfail_strict=true
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24923-ac1-owner-record
  description: 'AC1: line 4 of the contract of OMN-24844 names the pull request comment that proposes the amended text and says the owner decision is open, and the pull request carries a comment whose first line begins Owner-decision request and names OMN-24844; this check fails if either is missing. Read at the local Done gate, because the comment is written after the push.'
  source: manual
  execution_scope: local_done_gate
  binds_ac:
  - AC1
  checks:
  - check_type: command
    check_value: |-
      bash -o pipefail -c 'sed -n 4p contracts/OMN-24844.yaml | grep -F "first line begins Owner-decision request" > /dev/null && gh api --paginate repos/OmniNode-ai/omnimarket/issues/6327/comments --jq ".[].body" | grep -E "^Owner-decision request: OMN-24844" > /dev/null'
    cwd: .
- id: dod-omn24923-ac2-lab-comment
  description: 'AC2: the pull request carries the Lab comment of the pull request head with the --refuse-skips command and exit 0, and every required context reads success at that head; the check is the one of dod-omn24904-ac2-lab-comment, repeated here so this contract binds it. Read at the local Done gate, because the comment and the check-runs exist only after the push.'
  source: manual
  execution_scope: local_done_gate
  binds_ac:
  - AC2
  checks:
  - check_type: command
    check_value: |-
      bash -o pipefail -c 'h=$(gh api repos/OmniNode-ai/omnimarket/pulls/6327 --jq .head.sha) && body=$(gh api --paginate repos/OmniNode-ai/omnimarket/issues/6327/comments --jq ".[] | select(.body | startswith(\"Lab: head=$h\")) | .body") && test -n "$body" && printf "%s" "$body" | grep -F -e "--refuse-skips" > /dev/null && printf "%s" "$body" | grep -E "exit 0" > /dev/null && runs=$(gh api --paginate repos/OmniNode-ai/omnimarket/commits/$h/check-runs --jq ".check_runs[] | \"\(.name)|\(.conclusion)\"") && { gh api repos/OmniNode-ai/omnimarket/branches/dev/protection/required_status_checks --jq ".contexts[]"; echo "repo-evidence / dod-verify"; } | while IFS= read -r c; do printf "%s\n" "$runs" | grep -x -F -e "$c|success" > /dev/null || { echo "not success: $c"; exit 1; }; done'
    cwd: .
- id: dod-omn24923-ac2-split-flags
  description: 'AC2: the flags of the :27 command that the CI split also uses (coverage on, 300 s thread timeout, not kafka) are present in the workflow file, and neither the workflow nor pyproject sets xdist or an import mode for the split; this check fails if the split drops one of them or gains -n.'
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: command
    check_value: |-
      bash -o pipefail -c 'grep -F -e "--cov=src --cov-report=" .github/workflows/ci.yml > /dev/null && grep -F -e "--timeout=300 --timeout-method=thread" .github/workflows/ci.yml > /dev/null && grep -F -e "-m \"not kafka\"" .github/workflows/ci.yml > /dev/null && ! grep -E "^addopts|import.mode|--import-mode" pyproject.toml'
    cwd: .
- id: dod-omn24923-ac3-refuse-skips
  description: 'AC3: tests/refuse_skips.py defines --refuse-skips, pytest-timeout is declared in the dev group of pyproject.toml, and the :27 command of the contract of OMN-24844 passes --refuse-skips; this check fails if one is missing. The whole-suite split does not pass it, which the pull request comment argues.'
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: command
    check_value: |-
      bash -o pipefail -c 'grep -F "\"--refuse-skips\"" tests/refuse_skips.py > /dev/null && grep -F "\"pytest-timeout>=" pyproject.toml > /dev/null && grep -E "^  command: .*--refuse-skips" contracts/OMN-24844.yaml > /dev/null'
    cwd: .
- id: dod-omn24923-ac3-skip-tests
  description: 'AC3: the file runs green under --refuse-skips with the tests that fail on a pytest.skip call and on a conftest-added skip marker; the red runs are in the pull request Lab comment.'
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/test_capture_item_identity_effect.py -q -k "calls_no_skip_xfail_or_importorskip or skip_reader or marker_added_by_conftest or item_marker_reader or eight_concurrent" --refuse-skips -o xfail_strict=true --cov=src --cov-report= --timeout=300 --timeout-method=thread -p no:cacheprovider
    cwd: .
- id: dod-omn24923-ac4-contract-checks
  description: 'AC4: the contract of OMN-24904 holds the red-at-old check and the argued-comment check for AC1, and a local_done_gate AC2 check that reads the command, exit 0 and the required check-runs; this check fails if either id is gone or the AC2 check no longer reads check-runs.'
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: command
    check_value: |-
      bash -o pipefail -c 'grep -F "id: dod-omn24904-ac1-red-at-old" contracts/OMN-24904.yaml > /dev/null && grep -F "id: dod-omn24904-ac1-argued-comment" contracts/OMN-24904.yaml > /dev/null && grep -F "check-runs" contracts/OMN-24904.yaml > /dev/null'
    cwd: .
- id: dod-omn24923-ac4-red-at-old
  description: 'AC4: the tests added in this round do not exist at head f7d10ded4f32 and exist at the new head, so none can pass at the old head; this check fails if one is already at f7d10ded4f32 or missing at the head. Read at the local Done gate, because git show needs the old commit, which a shallow hosted checkout does not hold.'
  source: manual
  execution_scope: local_done_gate
  binds_ac:
  - AC4
  checks:
  - check_type: command
    check_value: |-
      bash -o pipefail -c 'f=tests/test_capture_item_identity_effect.py; for t in test_the_test_file_calls_no_skip_xfail_or_importorskip test_the_collected_eight_writer_item_carries_no_marker_added_by_conftest test_the_mark_reader_accepts_a_module_mark_that_is_a_list test_a_pool_that_does_not_shut_down_fails_inside_its_bound; do grep -F "def $t(" "$f" > /dev/null || exit 1; if git show f7d10ded4f3230a27480b4bb1352bea4d51d8a8e:"$f" | grep -F "def $t(" > /dev/null; then exit 1; fi; done'
    cwd: .
- id: dod-omn24923-ac5-nonblocking
  description: 'AC5: tests/__init__.py exists, the mark reader takes a module mark that is a list, and the pool shutdown is bounded; the tests for the last two are in the run below. This check fails if tests/__init__.py is gone.'
  source: manual
  binds_ac:
  - AC5
  checks:
  - check_type: command
    check_value: test -f tests/__init__.py
    cwd: .
  - check_type: test_passes
    check_value: uv run pytest tests/test_capture_item_identity_effect.py -q -k "mark_reader_accepts or does_not_shut_down" --no-cov --refuse-skips -o xfail_strict=true -p no:cacheprovider
    cwd: .
