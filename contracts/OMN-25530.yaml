schema_version: 1.0.0
ticket_id: OMN-25530
title: Broker ACL tools read the dev superuser credential from its declared secret source by name
summary: The broker superuser prologue shared by the ACL reconcile, topic delete and principal mint nodes read DEV_KAFKA_SASL_USERNAME and DEV_KAFKA_SASL_PASSWORD from the env of an exited one-shot container that host cleanup removes. It now reads them by name from the declared operator env file on the broker host and fails closed with a typed error naming the key when one is absent.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn25530-declared-source
  statement: The credential lookup reads the DEV_KAFKA_SASL names from the declared secret source with no container present, and a missing name fails closed naming the key without printing a value.
  acceptance:
  - id: AC2
    statement: 'AC2: a test builds the credential lookup with no container present and the DEV_KAFKA_SASL names set in the declared secret source, and fails on the base commit and passes at the head -- falsifier: uv run pytest tests/ -q -k lab_broker_acls red at the base commit and green at the head'
  - id: AC3
    statement: 'AC3: a refusal test shows a missing DEV_KAFKA_SASL_USERNAME or DEV_KAFKA_SASL_PASSWORD fails fast naming the key and never prints a value -- falsifier: uv run pytest tests/ -q -k lab_broker_acls fails when the lookup falls back silently or the output contains the password'
evidence_requirements:
- kind: tests
  description: The credential source tests for the broker superuser prologue.
  command: env -u PYTHONPATH uv run --frozen pytest tests/nodes/node_broker_acl_reconcile_effect/test_lab_broker_acls_credential_source.py -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn25530-ac2-credential-from-declared-source
  description: The prologue reads both names from the declared env file with no container present.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_broker_acl_reconcile_effect/test_lab_broker_acls_credential_source.py -q --no-cov -n 0 -p no:randomly -k lab_broker_acls
    cwd: .
- id: dod-omn25530-ac3-missing-name-fails-closed
  description: A missing or empty name, or an absent source file, stops the script with the typed exit and names the key, never a value.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_broker_acl_reconcile_effect/test_lab_broker_acls_credential_source.py -q --no-cov -n 0 -p no:randomly -k lab_broker_acls
    cwd: .
- id: dod-omn25530-ac1-remover-named
  description: The remover of exited one-shot containers on the lab host is named in the PR body from a read of its timer unit. Hosted CI cannot reach the lab host, so only the local Done gate reads it.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: sh -c 'ssh -o BatchMode=yes "$ONEX_LAB_BROKER_SSH_TARGET" "systemctl --user cat onex-disk-gc.service" | grep -F disk-gc.sh'
    cwd: .
- id: dod-omn25530-integration-proof
  description: Run the credential source tests on a lab host at the pushed head. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-25530 --kind test -- env -u PYTHONPATH uv run --frozen pytest tests/nodes/node_broker_acl_reconcile_effect/test_lab_broker_acls_credential_source.py -q --no-cov -n 0 -p no:randomly -k lab_broker_acls
    cwd: .
