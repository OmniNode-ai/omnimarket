schema_version: 1.0.0
ticket_id: OMN-23514
title: 'Landing cutover jobs: change-tracker facts, a second facts-recording step and the comparing step run on a schedule'
summary: The installer registry declares three launchd units for the cutover repositories (landing-watcher-facts, landing-snapshot-cutover, landing-tick-orchestrator); the landing snapshot step reads a pinned overlay file for its second instance; the tick orchestrator gets a runtime entry that compares each snapshot record in observe mode only and refuses an overlay that enables act mode; observe mode uses the no-action record for an out-of-scope cutover repository, as act mode does, and performs nothing. Nothing here writes to GitHub or acts on a repository.
is_seam_ticket: true
interface_change: true
interfaces_touched:
- topics
- public_api
requirements:
- id: req-omn23514-cutover-units
  statement: The cutover repositories' landing facts, snapshot records and tick comparisons run on declared units, and the tick orchestrator compares each record in observe mode.
  acceptance:
  - id: AC1
    statement: 'AC1: node_pr_landing_tick_orchestrator has a runtime entry (python -m) that reads the overlay, reads the snapshot records through the reader factory, compares each in observe mode only, and prints one line per run, with a golden chain and an error chain test -- falsifier: the runtime test with the overlay''s backend switched to act or the source unreadable'
  - id: AC2
    statement: 'AC2: node_host_installer_registry_units declares landing-watcher-facts, landing-snapshot-cutover and landing-tick-orchestrator units, with a render test that fails at the merge base -- falsifier: the render test at the merge base'
  - id: AC3
    statement: 'AC3: the overlays repository carries the watcher-facts overlay (repositories: omnimemory only), the cutover snapshot overlay reading the watcher-facts output, and the tick orchestrator overlay with act mode off, each with a load test -- falsifier: the overlay tests with one field removed'
  - id: AC4
    statement: 'AC4: omnibase_infra''s lab grants file carries the rows the two nodes'' topics need, as one change -- falsifier: the grants test with a row removed'
  - id: AC5
    statement: 'AC5: integrated: the three units run on the floor host from the merged revisions and the tick orchestrator''s compared line for each cutover record is read there -- falsifier: the units'' run records over one hour'
evidence_requirements:
- kind: tests
  description: The runtime entry, the units' render test, the overlay pin and the out-of-scope record tests
  command: uv run --frozen pytest tests/nodes/node_pr_landing_tick_orchestrator/test_runtime_tick.py tests/nodes/node_pr_landing_tick_orchestrator/test_act_out_of_scope_record.py tests/nodes/node_host_installer_registry_units/test_landing_cutover_units.py tests/nodes/node_pr_landing_snapshot_effect/test_overlay_file_pin.py -q --no-cov -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23514-runtime
  description: The tick orchestrator's runtime entry compares a cutover record in observe mode (golden chain), ends unread on a record that does not validate (error chain), and refuses act mode before any read.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_pr_landing_tick_orchestrator/test_runtime_tick.py tests/nodes/node_pr_landing_tick_orchestrator/test_act_out_of_scope_record.py -q --no-cov -p no:randomly
    cwd: .
- id: dod-omn23514-units
  description: The three units are declared every 60 s and render from a branch checkout; the cutover snapshot unit pins its own overlay file and the snapshot step reads it.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_host_installer_registry_units/test_landing_cutover_units.py tests/nodes/node_pr_landing_snapshot_effect/test_overlay_file_pin.py -q --no-cov -p no:randomly
    cwd: .
- id: dod-omn23514-overlays
  description: 'The overlays change (overlays repository) is its own pull request; this repository runs the node side: the runtime refuses an overlay that enables act mode.'
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_pr_landing_tick_orchestrator/test_runtime_tick.py -q --no-cov -p no:randomly -k act_mode
    cwd: .
- id: dod-omn23514-grants
  description: 'The grant rows are an omnibase_infra change; this repository holds the topics they name: the tick orchestrator contract''s compared and failed topics.'
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_pr_landing_tick_orchestrator/test_act_out_of_scope_record.py -q --no-cov -p no:randomly
    cwd: .
- id: dod-omn23514-integration-hosted
  description: 'Integrated, hosted proxy for AC5: each cutover unit renders from a branch checkout and runs its node, and the tick orchestrator runtime entry compares a cutover record in observe mode and prints its compared line. Neither exists at the merge base, so the control fails there. The live read on the floor host is the unbound local item below, because the hosted must-fail control can never run a local_done_gate item.'
  source: manual
  binds_ac:
  - AC5
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_host_installer_registry_units/test_landing_cutover_units.py tests/nodes/node_pr_landing_tick_orchestrator/test_runtime_tick.py -q --no-cov -p no:randomly -k "install_renders or golden_chain"
    cwd: .
- id: dod-omn23514-integration-proof-lab
  description: 'Integrated: on the floor host the tick orchestrator runs once from the branch under the deployed overlay and prints its compared line. Hosted CI cannot reach the floor host, so only the local Done gate runs this unbound item; the hosted proxy above binds AC5.'
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: 'env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23514 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen python -m omnimarket.nodes.node_pr_landing_tick_orchestrator'
    cwd: .
