schema_version: 1.0.0
ticket_id: OMN-24431
title: Dev runtime rolls once per window and joins its command nodes in time
summary: The real-broker leg of the dev roll window gate's tests. The gate node and the deploy effect hold arm merged under OMN-24442 (omnimarket#6201) with every test on the in-memory bus; this adds KafkaTransport, a
  transport for the runtime's own dispatch over aiokafka, and a parity test module that runs the golden chain, error chain, join and seam controls on the in-memory bus always and on a Redpanda broker when
  DEV_ROLL_GATE_PARITY_BOOTSTRAP names one. The integrated reading of the running dev runtime (AC5) is not part of this change.
is_seam_ticket: true
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24431-parity
  statement: The gate's golden chain, error chain, join and seam tests run on the in-memory bus and on the real broker, each with a failing control.
  acceptance:
  - id: AC4
    statement: 'AC4: golden chain, error chain, join and seam tests run on the in-memory bus and on the real broker and each fails against a named injected break -- falsifier: renaming a field the gate reads from the deploy command, the facts or the completion event leaves a seam test green'
evidence_requirements:
- kind: tests
  description: The parity tests on the in-memory bus at the pushed head; the Redpanda leg runs where DEV_ROLL_GATE_PARITY_BOOTSTRAP names a lab broker.
  command: uv run --frozen pytest tests/unit/nodes/node_dev_roll_window_gate_effect -q --no-cov -n 0 -p no:randomly -m "not kafka"
emergency_bypass:
  enabled: false
  justification: ''
