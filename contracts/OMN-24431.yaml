schema_version: 1.0.0
ticket_id: OMN-24431
title: Dev runtime rolls once per window and joins its command nodes in time
summary: node_dev_roll_gate_effect holds each dev deploy command in a durable store and, on a roll_now decision of node_dev_roll_request_compute that answers its own request, releases the commands that
  decision rolled together and oldest first as one event; node_redeploy_deploy_effect forwards a dev command to the gate only when the gate overlay says live and publishes the release without holding it
  again. Every value is an overlay value. The integrated reading (AC5) needs the node timer and the early-start change and is not part of this change.
is_seam_ticket: true
interface_change: true
interfaces_touched:
- topics
- public_api
requirements:
- id: req-omn24431-gate
  statement: Dev deploy commands are held and rolled once per window.
  acceptance:
  - id: AC1
    statement: 'AC1: a new node holds each dev deploy command in a durable store and releases every held command together, oldest first, when the batching decision says roll now, with the window, minimum
      start interval and every other value read from an overlay -- falsifier: a held command released before the window ends, a command lost across a restart of the node, or a window value written in the
      node''s code'
  - id: AC2
    statement: 'AC2: never more than one release per minimum start interval and never a release while the previous roll has not finished -- falsifier: a two-hour simulation with a merge every four minutes
      that shows more releases than the interval allows, or a release while the previous roll has no completion'
  - id: AC3
    statement: 'AC3: the deploy effect forwards a dev command to the gate only when the gate overlay says live, publishes exactly as before when the overlay is off or absent, and the gate''s release is
      published without being held again -- falsifier: a live-mode dev command published straight to the deploy agent, or a released command held a second time'
  - id: AC4
    statement: 'AC4: golden chain, error chain, join and seam tests run on the in-memory bus and on the real broker and each fails against a named injected break -- falsifier: renaming a field the gate
      reads from the deploy command, the facts or the completion event leaves a seam test green'
- id: req-omn24431-integrated
  statement: The running dev runtime rolls once per window and its command nodes join in time.
  acceptance:
  - id: AC5
    statement: 'AC5: integrated: after merge and one roll of the running dev runtime, the six command node groups each have a member within 150 seconds, a fresh run-node send to each node is answered, and
      the number of dev rolls over the next two hours read from the deploy agent''s job records is at most the window allows -- falsifier: a roll count above the window''s bound, a group with no member
      150 seconds after the container start, or a send with no answer'
evidence_requirements:
- kind: tests
  description: The gate and deploy effect tests at the pushed head.
  command: uv run --frozen pytest tests/unit/nodes/node_dev_roll_gate_effect -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24431-ac1
  description: Handler table (hold, release of only the rolled commands oldest first, restart durability of the file store), the overlay tests and the source scan that finds no number in the node's code.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/nodes/node_dev_roll_gate_effect/test_handler_dev_roll_gate.py tests/unit/nodes/node_dev_roll_gate_effect/test_overlay_dev_roll_gate.py -q --no-cov -n 0
      -p no:randomly
    cwd: .
- id: dod-omn24431-ac2
  description: The two-hour join simulation with a merge every four minutes over the real contracts of the gate and the batching node on the in-memory bus; its failing control (no batching) exceeds the
    interval.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/nodes/node_dev_roll_gate_effect/test_join_dev_roll_gate.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24431-ac3
  description: The deploy effect with the gate overlay live, off and absent, a release published in order and not held again, and a non-dev lane never forwarded.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/nodes/node_dev_roll_gate_effect/test_deploy_effect_gate.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24431-ac4
  description: Golden chain, error chain, join and seam tests on the in-memory bus; the seam tests pin the fields the gate reads from the deploy command, the facts, the decision and the completion event,
    each with a renamed-field control. The Redpanda parity leg runs where DEV_ROLL_GATE_PARITY_BOOTSTRAP names a lab broker.
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/nodes/node_dev_roll_gate_effect/test_golden_chain_dev_roll_gate.py tests/unit/nodes/node_dev_roll_gate_effect/test_error_chain_dev_roll_gate.py tests/unit/nodes/node_dev_roll_gate_effect/test_join_dev_roll_gate.py
      tests/unit/nodes/node_dev_roll_gate_effect/test_seam_dev_roll_gate.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24431-ac5
  description: The tests behind the integrated reading pass at the head; the reading itself (six node groups joined within 150 seconds, a fresh send to each answered, the two-hour roll count from the deploy
    agent's job records) is taken on the running dev runtime after merge and one roll, and is not claimed by this change.
  source: manual
  binds_ac:
  - AC5
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/nodes/node_dev_roll_gate_effect/test_join_dev_roll_gate.py tests/unit/nodes/node_dev_roll_gate_effect/test_deploy_effect_gate.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24431-integration-proof
  description: The gate and deploy effect tests run on a lab host at the pushed head through the lab work node. The integrated reading on the running dev runtime (AC5) is taken after merge and one roll,
    and is not claimed here.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24431 --kind test -- env PYTHONDONTWRITEBYTECODE=1
      uv run --frozen pytest tests/unit/nodes/node_dev_roll_gate_effect -q --no-cov -n 0 -p no:randomly
    cwd: .
