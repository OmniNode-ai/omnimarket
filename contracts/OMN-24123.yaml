schema_version: 1.0.0
ticket_id: OMN-24123
title: Let three monitoring jobs be called through the running system
summary: The overlay documents of node_work_progress_compute, node_work_progress_alert_effect and node_dev_running_revision_compute are read by their node models and by the bus overlay reader behind onex run-node. Each node model refused a document that held the bus reader's event_bus key. Each model now accepts event_bus as an optional key, so the settings repository copy can carry it and one onex run-node call reaches the node in the dev runtime.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24123-event-bus-key
  statement: One overlay document of each of the three nodes loads through the node model, the node's own loader and the bus overlay reader.
  acceptance:
  - id: AC1
    statement: "AC1: the settings models of node_work_progress_compute, node_work_progress_alert_effect and node_dev_running_revision_compute accept an optional event_bus key and still refuse any other unknown key -- falsifier: the test file tests/unit/nodes/node_work_progress_compute/test_overlay_event_bus_omn19998.py fails at the merge base"
  - id: AC2
    statement: "AC2: integrated: after merge and the next dev roll, onex run-node node_work_progress_compute returns a work-progress-computed event from the dev runtime -- falsifier: the call refuses naming the settings file it looked for, or times out with no event"
evidence_requirements:
- kind: tests
  description: The event_bus tests pass at the pushed head and the model-accepts-the-key tests fail at the base commit.
  command: uv run pytest tests/unit/nodes/node_work_progress_compute/test_overlay_event_bus_omn19998.py -q --no-cov -p no:cacheprovider
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24123-ac1
  description: 'AC1: the three models accept event_bus; at the base commit the failing-control tests are red.'
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/nodes/node_work_progress_compute/test_overlay_event_bus_omn19998.py -q --no-cov -p no:cacheprovider
    cwd: .
- id: dod-omn24123-ac2
  description: 'hosted proxy for AC2: the event_bus tests pass here; the overlays repository change is a draft pull request that stays draft until this one is on dev and the dev build holds it, and the run-node reading is posted as a pull request comment.'
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/nodes/node_work_progress_compute/test_overlay_event_bus_omn19998.py -q --no-cov -p no:cacheprovider
    cwd: .
- id: dod-omn24123-integration-proof
  description: 'Run the event_bus tests on a lab host at the pushed head. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.'
