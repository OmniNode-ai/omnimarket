schema_version: "1.0.0"
ticket_id: OMN-23313
title: The floor shows a red row when an operator-owned startable delegation ticket has no running lane
summary: >-
  Also makes the floor read the go from RULING rows by the pieces they name, so the ruling that opened rebuild pieces 7 and 11 reads. Adds the delegation:idle cause row to node_floor_simple_compute. It is red while any operator-owned delegation ticket whose start criterion reads true has no live lane, amber when each has one, and absent when none can start. Which tickets count (the delegation epics and the operator's assignee value) is overlay data; the assignee and parent reach the floor through the work-state projection.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn23313-delegation-idle
    statement: >-
      The floor names every operator-owned startable delegation ticket that has no live lane, in a row the red rule judges like every other row.
    acceptance:
      - id: AC1
        statement: "AC1: the floor emits a red cause row delegation:idle naming each operator-owned delegation ticket whose start criterion is true and that has no live lane, and the row turns amber when each has one -- falsifier: uv run pytest tests -q -k delegation_idle in omnimarket, failing with the row removed"
      - id: AC2
        statement: "AC2: the row's owners resolve from the floor overlay's owners map like every other row, and it lists in the served floor after install -- falsifier: curl of the served floor shows causes[] with id delegation:idle when such a ticket has no lane"
evidence_requirements:
  - kind: tests
    description: >-
      The focused tests of the row: the compute reading, the source reader and the whole-cycle board read.
    command: uv run --frozen pytest tests/nodes/node_floor_simple_compute/test_delegation_idle_omn23313.py tests/nodes/node_work_state_projection_compute/test_delegation_idle_sources_omn23313.py tests/nodes/node_floor_simple_effect/test_delegation_idle_board_omn23313.py -q -n 0 --no-cov
  - kind: tests
    description: >-
      The go read by subject: the ruling of 2026-11-09 opens pieces 7 and 11, a rule without the open pattern opens neither.
    command: uv run --frozen pytest tests/nodes/node_floor_simple_effect/test_go_by_subject_floor_simple.py -q -n 0 --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn23313-ac1-row
    description: >-
      The row is red naming each ticket with no live lane and amber when each has one; with the row's builder call removed the four row tests fail.
    source: manual
    binds_ac:
      - AC1
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/nodes/node_floor_simple_compute/test_delegation_idle_omn23313.py -q -n 0 --no-cov -k delegation_idle
        cwd: ${OMNI_HOME}/omnimarket
  - id: dod-omn23313-ac2-board
    description: >-
      The whole cycle writes a floor whose causes list carries delegation:idle with its owners resolved from the overlay owners map.
    source: manual
    binds_ac:
      - AC2
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/nodes/node_floor_simple_effect/test_delegation_idle_board_omn23313.py tests/nodes/node_work_state_projection_compute/test_delegation_idle_sources_omn23313.py -q -n 0 --no-cov
        cwd: ${OMNI_HOME}/omnimarket
  - id: dod-omn23313-go-by-subject
    description: >-
      The floor reads the go from RULING rows by the pieces they name: the recorded ruling of 2026-11-09 (answered Ok agreed) opens pieces 7 and 11 beside the in-order go of 6, and with the open pattern removed from the overlay the five rows that read it fail.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/nodes/node_floor_simple_effect/test_go_by_subject_floor_simple.py -q -n 0 --no-cov
        cwd: ${OMNI_HOME}/omnimarket
  - id: dod-deploy-omn23313-row
    description: >-
      Deploy assessment: the change adds a cause row to the floor compute node, an assignee and a parent field to the work-state projection and an optional overlay block. It adds no Kafka topic, migration or prod mutation; it reaches the floor publisher by install from the branch. The check reads the handler from GitHub at the pull request branch and fails when the row builder is missing.
    source: manual
    checks:
      - check_type: command
        check_value: "body=\"$(gh api -H 'Accept: application/vnd.github.raw' 'repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_floor_simple_compute/handlers/handler_floor_simple.py?ref=omn-23313-floor-delegation-idle-dev')\" && case \"$body\" in *_delegation_idle*) exit 0;; *) exit 1;; esac"
        cwd: "."
  - id: dod-omn23313-integration-proof
    description: >-
      The pushed head ran the three focused test files of the row on a lab host through the bus and exited 0. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: |-
          uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane delegrow-1135 -- uv run --frozen pytest tests/nodes/node_floor_simple_compute/test_delegation_idle_omn23313.py tests/nodes/node_work_state_projection_compute/test_delegation_idle_sources_omn23313.py tests/nodes/node_floor_simple_effect/test_delegation_idle_board_omn23313.py -q -n 0 --no-cov
        cwd: .
