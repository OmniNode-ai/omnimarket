schema_version: 1.0.0
ticket_id: OMN-24837
title: Answer the blocking review findings on the stale unimported-handler baseline pull request with a red-then-green test each
summary: The unimported-handler gate is now tested through its own main() on a tmp repo, loads its stdlib-only scan helper by file path (no omnimarket import, no pydantic), reports stale entries and dead handlers from one scan, and the baseline count test is exact. The PR comments carry the lab command with its pass count and the recounted exclusion count.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24837-review-findings
  statement: The gate's refusal of a stale baseline entry is covered by a test that runs main(), the script's helpers are stdlib-only and every caller still runs it, and the evidence and the count are stated in PR comments at the new head.
  acceptance:
  - id: AC1
    statement: 'AC1: a test runs main() or the CLI on a tmp repo with a planted stale baseline entry and asserts exit 1 with the entry named in the output, and exit 0 when the baseline is clean, and it fails when the stale branch is deleted from main() -- falsifier: `uv run pytest tests/ci/test_check_unimported_handlers.py -q --no-cov -n 0` with the stale branch of main() deleted fails'
  - id: AC2
    statement: 'AC2: the remainder of scripts/ci/check_unimported_handlers.py uses none of the names the change dropped, and every caller (pre-commit hook, workflow step, transport hook) runs where omnimarket imports with no heavy side effect, or the helpers move to a stdlib-only module under scripts/ -- falsifier: `uv run ruff check --select F821,F401 scripts/ci/check_unimported_handlers.py` exits 0 and `uv run pytest tests/ci/test_check_unimported_handlers.py -q --no-cov -n 0` passes'
  - id: AC3
    statement: 'AC3: a PR comment starting `Lab: head=<full head sha>` names the new head and the contract''s own lab command with its pass count, every required context at that head reads success except the shared Delegation Health Check, and that check is shown red on dev too -- falsifier: `onex scm pr-view OmniNode-ai/omnimarket#5609` lists the comment and `onex scm pr-checks OmniNode-ai/omnimarket#5609` lists every required context at that head'
  - id: AC4
    statement: 'AC4: a PR comment states the exclusion count recounted at the new head (61 remaining at ab9c74215245) and, if the burn-down total across validators is what the requirement means, that total as well -- falsifier: `onex scm pr-view OmniNode-ai/omnimarket#5609` lists the comment and `uv run pytest tests/ci/test_check_unimported_handlers.py -q --no-cov -n 0 -k baseline_count` passes against the exact count'
  - id: AC5
    statement: 'AC5: findings 5 to 10 of the review are each fixed or argued with evidence in a PR comment, and the lane comment names the new head -- falsifier: `onex scm pr-view OmniNode-ai/omnimarket#5609` lists the comment naming findings 5 to 10'
evidence_requirements:
- kind: tests
  description: The whole file of unimported-handler gate tests passes, including the tests that run main() as a command on a tmp repo.
  command: uv run --frozen pytest tests/ci/test_check_unimported_handlers.py -q -n 0 --no-cov -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24837-main-tested
  description: Runs the focused tests selected by test_main. The gate copied into a tmp repo exits 1 naming a planted stale entry, exits 0 on a clean baseline, and reports a stale entry and a dead handler from one run. Deleting the stale branch from main() makes the first and third fail.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/ci/test_check_unimported_handlers.py -q -n 0 --no-cov -p no:randomly -k test_main
    cwd: .
- id: dod-omn24837-script-stdlib-only
  description: Runs the ruff undefined-name and unused-import check on the script, then the test that loads the script in an isolated interpreter and asserts neither omnimarket nor pydantic is imported by it.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: command
    check_value: uv run --frozen ruff check --select F821,F401 scripts/ci/check_unimported_handlers.py
    cwd: .
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/ci/test_check_unimported_handlers.py -q -n 0 --no-cov -p no:randomly -k loads_without_importing
    cwd: .
- id: dod-omn24837-lab-comment
  description: The PR carries a comment starting Lab with the pushed head sha. Only the local Done gate reads the PR, because hosted CI has no watcher state.
  source: manual
  execution_scope: local_done_gate
  binds_ac:
  - AC3
  checks:
  - check_type: command
    check_value: 'onex scm pr-view OmniNode-ai/omnimarket#5609'
    cwd: .
- id: dod-omn24837-count-exact
  description: Runs the focused test selected by baseline_count. The baseline, read through the loader, holds exactly the recorded count; the PR comment states the same count.
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/ci/test_check_unimported_handlers.py -q -n 0 --no-cov -p no:randomly -k baseline_count
    cwd: .
- id: dod-omn24837-non-blocking-findings
  description: The PR carries a comment naming findings 5 to 10 with the new head. Only the local Done gate reads the PR, because hosted CI has no watcher state.
  source: manual
  execution_scope: local_done_gate
  binds_ac:
  - AC5
  checks:
  - check_type: command
    check_value: 'onex scm pr-view OmniNode-ai/omnimarket#5609'
    cwd: .
- id: dod-omn24837-integration-proof
  description: On a lab host the unimported-handler gate runs at the pushed head through the lab work runner and the focused tests of its main() pass there. Hosted CI cannot reach a lab host, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: 'env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24837 --kind test -- uv run --frozen pytest tests/ci/test_check_unimported_handlers.py -q --no-cov -p no:randomly -k test_main'
    cwd: .
