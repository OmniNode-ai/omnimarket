schema_version: 1.0.0
ticket_id: OMN-24837
title: Answer the blocking review findings on the stale unimported-handler baseline pull request with a red-then-green test each
summary: The unimported-handler gate is now tested through its own main() on a tmp repo, loads its stdlib-only scan helper by file path (no omnimarket import, no pydantic), reports stale entries and dead handlers from one scan, and the baseline count test is exact. The PR comments carry the lab command with its pass count and the recounted exclusion count.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24837-review-findings
  statement: The gate's refusal of a stale baseline entry is covered by a test that runs main(), the script's helpers are stdlib-only and every caller still runs it, and the evidence and the count are stated in PR comments at the new head.
  acceptance:
  - id: AC1
    statement: 'AC1: a test runs main() or the CLI on a tmp repo with a planted stale baseline entry and asserts exit 1 with the entry named in the output, and exit 0 when the baseline is clean, and it fails when the stale branch is deleted from main() -- falsifier: `uv run pytest tests/ci/test_check_unimported_handlers.py -q --no-cov -n 0` with the stale branch of main() deleted fails'
  - id: AC2
    statement: 'AC2: the remainder of scripts/ci/check_unimported_handlers.py uses none of the names the change dropped, and every caller (pre-commit hook, workflow step, transport hook) runs where omnimarket imports with no heavy side effect, or the helpers move to a stdlib-only module under scripts/ -- falsifier: `uv run ruff check --select F821,F401 scripts/ci/check_unimported_handlers.py` exits 0 and `uv run pytest tests/ci/test_check_unimported_handlers.py -q --no-cov -n 0` passes'
  - id: AC3
    statement: "AC3: the contract's own lab command (the whole file of unimported-handler gate tests) passes on the hosted runner, and the local Lab-comment and required-contexts commands exit non-zero on the recorded PR answers when the fact is absent -- falsifier: `uv run pytest tests/ci/test_check_unimported_handlers.py tests/ci/test_omn25309_local_check_assertions.py -q --no-cov -n 0` fails, or passes with a payload in which a required context never reported or the Lab line is only quoted mid-comment. The PR-state part of the ticket's criterion is read by the local item dod-omn24837-lab-comment and dod-omn24837-required-checks-local and is bound to no hosted test."
  - id: AC4
    statement: "AC4: the baseline holds exactly the recorded exclusion count (61 remaining), read through the loader -- falsifier: `uv run pytest tests/ci/test_check_unimported_handlers.py -q --no-cov -n 0 -k baseline_count` passes against another count. The PR-state part of the ticket's criterion is read by the local item dod-omn24837-count-comment-local and is bound to no hosted test."
  - id: AC5
    statement: "AC5: the tests that carry the non-blocking findings pass on the hosted runner and the local Findings 5-10 command exits non-zero when the only match is a quote in the middle of another comment -- falsifier: `uv run pytest tests/ci/test_omn25309_local_check_assertions.py -q -n 0 --no-cov -k 'follow_up or mid_comment'` passes with such a payload. The PR-state part of the ticket's criterion is read by the local item dod-omn24837-non-blocking-findings and is bound to no hosted test."
evidence_requirements:
- kind: tests
  description: The whole file of unimported-handler gate tests passes, including the tests that run main() as a command on a tmp repo.
  command: uv run --frozen pytest tests/ci/test_check_unimported_handlers.py -q -n 0 --no-cov -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24837-main-tested
  description: Runs the focused tests selected by test_main. The gate copied into a tmp repo exits 1 naming a planted stale entry, exits 0 on a clean baseline, and reports a stale entry and a dead handler from one run. Deleting the stale branch from main() makes the first and third fail.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/ci/test_check_unimported_handlers.py -q -n 0 --no-cov -p no:randomly -k test_main
    cwd: .
- id: dod-omn24837-script-stdlib-only
  description: Runs the ruff undefined-name and unused-import check on the script, then the tests that load the script in an isolated interpreter (neither omnimarket nor pydantic is imported, and the helper is registered under a private module name) and the two that run the script in a checkout without its helper and require exit 2 with a message and no traceback. The helper stays under src/omnimarket/handlers because the canonical-file-shape ratchet refuses a new code file under scripts/ci; every caller (the pre-commit hooks arch-unimported-handler-check and validate-no-transport-imports, and the CI lint steps) runs the script from a full checkout, where the helper is present.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: command
    check_value: uv run --frozen ruff check --select F821,F401 scripts/ci/check_unimported_handlers.py
    cwd: .
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/ci/test_check_unimported_handlers.py -q -n 0 --no-cov -p no:randomly -k 'loads_without_importing or private_name or helper_is_missing'
    cwd: .
- id: dod-omn24837-lab-comment
  description: "PR-state criterion AC3 (not bound). The PR holds a comment whose body STARTS with Lab: head=<pushed head sha>. The command parses the pr-view answer (--source bus, which carries the comments) and exits non-zero when no comment starts with that line, when the PR head is another sha, or when the line is only quoted in the middle of a comment. Only the local Done gate runs it, because hosted CI has no PR state; the hosted proxy proves only that this command can fail."
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: "onex scm pr-view OmniNode-ai/omnimarket#5609 --source bus | python3 tests/ci/pr_state_checks.py lab-comment \"$(git rev-parse HEAD)\""
    cwd: .
- id: dod-omn24837-count-exact
  description: Runs the focused test selected by baseline_count. The baseline, read through the loader, holds exactly the recorded count; the PR comment states the same count.
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/ci/test_check_unimported_handlers.py -q -n 0 --no-cov -p no:randomly -k baseline_count
    cwd: .
- id: dod-omn24837-non-blocking-findings
  description: "PR-state criterion AC5 (not bound). The comment that starts with Lab: head=<pushed head sha> also holds a Findings 5-10 line. The command exits non-zero when that line is in another comment, in a quote in the middle of a comment, or in a comment for another head. Only the local Done gate runs it."
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: "onex scm pr-view OmniNode-ai/omnimarket#5609 --source bus | python3 tests/ci/pr_state_checks.py lab-comment \"$(git rev-parse HEAD)\" --contains \"Findings 5-10\""
    cwd: .
- id: dod-omn24837-count-comment-local
  description: "PR-state criterion AC4 (not bound). The comment that starts with Lab: head=<pushed head sha> also holds the line `Exclusion count: 61`, the count the hosted test dod-omn24837-count-exact pins. The command exits non-zero when the line is in another comment or only quoted mid-comment. Only the local Done gate runs it."
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: "onex scm pr-view OmniNode-ai/omnimarket#5609 --source bus | python3 tests/ci/pr_state_checks.py lab-comment \"$(git rev-parse HEAD)\" --contains \"Exclusion count: 61\""
    cwd: .
- id: dod-omn24837-ac3-hosted-proxy
  description: "hosted proxy for AC3. It proves two things only: the contract's own lab command (the whole file of unimported-handler gate tests) passes on the hosted runner, and the local Lab-comment and required-checks commands of this contract exit non-zero on the recorded PR answers when the PR has no Lab: head= comment starting at the head (a quote mid-comment does not count), a required context that is red, never reported or was skipped, a pending context or another head. It does not read the PR, its comments or its check-runs; those readings are the unbound local_done_gate items dod-omn24837-lab-comment and dod-omn24837-required-checks-local, because the hosted runner holds no PR state."
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/ci/test_check_unimported_handlers.py -q -n 0 --no-cov -p no:randomly
    cwd: .
  - check_type: test_passes
    check_value: "uv run --frozen pytest tests/ci/test_omn25309_local_check_assertions.py -q -n 0 --no-cov -p no:randomly -k 'lab_comment or pr_checks'"
    cwd: .
- id: dod-omn24837-ac5-hosted-proxy
  description: "hosted proxy for AC5. It proves two things only: the tests that carry the non-blocking review findings (the gate script loads without omnimarket or pydantic and under a private module name, a missing helper exits 2, the committed baseline holds no stale entry, every selector node handler has wiring evidence, the transport hook prints repo-relative paths) pass on the hosted runner, and the local Findings 5-10 command exits non-zero when no such comment exists. It does not read the PR comment; that reading is the unbound local_done_gate item dod-omn24837-non-blocking-findings."
  source: manual
  binds_ac:
  - AC5
  checks:
  - check_type: test_passes
    check_value: "uv run --frozen pytest tests/ci/test_check_unimported_handlers.py -q -n 0 --no-cov -p no:randomly -k 'loads_without_importing or private_name or helper_is_missing or print_paths_relative or committed_baseline_has_no_stale or selector_node_handlers'"
    cwd: .
  - check_type: test_passes
    check_value: "uv run --frozen pytest tests/ci/test_omn25309_local_check_assertions.py -q -n 0 --no-cov -p no:randomly -k 'follow_up or mid_comment'"
    cwd: .
- id: dod-omn24837-integration-proof
  description: On a lab host the unimported-handler gate runs at the pushed head through the lab work runner and the focused tests of its main() pass there. Hosted CI cannot reach a lab host, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: 'env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24837 --kind test -- uv run --frozen pytest tests/ci/test_check_unimported_handlers.py -q --no-cov -p no:randomly -k test_main'
    cwd: .
- id: dod-omn24837-required-checks-local
  description: "PR-state criterion AC3 (not bound). Every required context at the pushed head reads success in the check-runs, except the shared Delegation Health Check, which is red on dev too. The names are the branch-protection and ruleset contexts of the landing branch in tests/ci/fixtures/omn25309/required_contexts.txt; a context that never reported, was skipped or was cancelled has no success row and fails the command, as does another red, a pending context or another head. Only the local Done gate runs it."
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: "onex scm pr-checks OmniNode-ai/omnimarket#5609 | python3 tests/ci/pr_state_checks.py required-checks \"$(git rev-parse HEAD)\" tests/ci/fixtures/omn25309/required_contexts.txt"
    cwd: .
