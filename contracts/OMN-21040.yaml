    statement: 'AC3: a command whose endpoints are all unhealthy yields exactly one swarm-dispatch-failed.v1 and no
      fan-out command, and a test pins it -- falsifier: uv run pytest src/omnimarket/nodes/node_swarm_dispatch_orchestrator/tests
      -q -k unhealthy'
