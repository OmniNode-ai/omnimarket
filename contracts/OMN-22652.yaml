    cwd: .
- id: dod-omn22652-integration-proof
  description: Runs the golden write and the refused bare statement on a disposable database carrying the dev grant shape, at the lab with a disposable PostgreSQL.
  source: manual
  execution_scope: local_done_gate
  checks:
