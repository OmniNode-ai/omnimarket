schema_version: 1.0.0
ticket_id: OMN-22652
title: The live events writer inserts into the contract-declared omninode_internal.live_events, so the runtime login that holds the grant there can write
summary: The folded live events writer issued INSERT INTO live_events with the bare table name, which a runtime login resolves to public.live_events where it holds no privilege, so every write since 2026-11-03T14:41Z was refused and its event dead-lettered after six refusals. The relation now carries the schema the node contract declares.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn22652-qualified-relation
  statement: The live events writer names the schema its contract declares in its INSERT, so a login that holds INSERT only on omninode_internal.live_events writes its row there and leaves public.live_events untouched.
  acceptance:
  - id: AC1
    statement: 'AC1: the writer INSERT names the contract-declared schema, so a login holding INSERT only on omninode_internal.live_events writes a row there and public.live_events stays untouched, on a real Postgres with both relations and the dev grant shape -- falsifier: uv run --frozen pytest src/omnimarket/nodes/node_projection_live_events/tests -q --no-cov'
  - id: AC2
    statement: 'AC2: the unqualified statement against the same database and logins is refused with permission denied for table live_events, so the test fails on the old code -- falsifier: uv run --frozen pytest src/omnimarket/nodes/node_projection_live_events/tests -q --no-cov -k "unqualified or control"'
evidence_requirements:
- kind: tests
  description: The writer lands its row in the declared schema and the bare statement is refused
  command: uv run --frozen pytest src/omnimarket/nodes/node_projection_live_events/tests -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
