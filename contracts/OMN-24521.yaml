schema_version: 1.0.0
ticket_id: OMN-24521
title: 'Ruling register: fix six review findings and wire the register into the hourly tick'
summary: The standing rulings register read (omnimarket#6232) had six review findings; this fixes them and carries the register's judgement from the facts effect to the hourly tick so a row that is not TRUE prints a MISSING ruling-not-running line.
is_seam_ticket: true
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24521-ruling-register-fixes
  statement: An unreadable or hostile read can never stop the register, forge a tick line or leave the hourly tick silent.
  acceptance:
  - id: AC1
    statement: 'AC1: a read whose output is not valid text or whose command holds a NUL byte reads UNREAD and the remaining rows still read -- falsifier: pytest tests/unit/nodes/node_ruling_register_effect -k "unicode_or_null or not_utf8" -q fails on the code before this change'
  - id: AC2
    statement: 'AC2: the facts effect carries the register''s judgement or the reason it could not be read, and the tick decision prints one MISSING ruling-not-running line per row that is not TRUE, or MISSING ruling-not-running:register when it could not be read -- falsifier: pytest tests/unit/nodes/node_throughput_tick_decision_compute/test_ruling_register_lines.py -q fails when the facts omit the register'
  - id: AC3
    statement: 'AC3: a verdict never carries a read''s raw output, every verdict cell is one printable line bounded by the policy, and a read cannot forge a tick line -- falsifier: pytest tests/unit/nodes/node_ruling_register_compute -q fails when the judge copies stdout into the detail'
  - id: AC4
    statement: 'AC4: a journal write failure does not abort the remaining reads and is reported in sink_errors; an exit_zero row must name a nonzero code that reads FALSE; the policy can restrict the commands rows may run -- falsifier: pytest tests/unit/nodes/node_ruling_register_effect tests/unit/nodes/node_ruling_register_compute -q fails on the code before this change'
  - id: AC5
    statement: 'AC5: integrated: the running Mac hourly tick prints a ruling-not-running line or a clean register reading for each register row, and prints MISSING ruling-not-running:register on a host with no register settings -- falsifier: the tick output read on the running Mac tick names no register line'
evidence_requirements:
- kind: tests
  description: The register, facts and tick tests pass at the pushed head.
  command: uv run --frozen pytest tests/unit/nodes/node_ruling_register_compute tests/unit/nodes/node_ruling_register_effect tests/unit/nodes/node_throughput_tick_decision_compute src/omnimarket/nodes/node_throughput_tick_facts_effect/tests -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn24521-ac1
  description: A read with non-UTF-8 output or a NUL in its argv reads UNREAD and the next row still reads; the test fails on the code before the change.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/nodes/node_ruling_register_effect -k 'unicode_or_null or not_utf8' -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24521-ac2
  description: Facts to tick seam test with its failing control that the tick is silent when the facts omit the register, and the unread-register line.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/nodes/node_throughput_tick_decision_compute/test_ruling_register_lines.py src/omnimarket/nodes/node_throughput_tick_facts_effect/tests -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24521-ac3
  description: The forged-line test, the folded and bounded detail test and the refused multi-line verdict test.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/nodes/node_ruling_register_compute -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24521-ac4
  description: The journal failure, the exit_zero code and the allowed commands tests.
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/nodes/node_ruling_register_effect tests/unit/nodes/node_ruling_register_compute -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24521-ac5
  description: The tests behind the integrated reading pass; the live reading on the Mac tick is recorded in the Lab line and a comment once the installed tick runs.
  source: manual
  binds_ac:
  - AC5
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/nodes/node_throughput_tick_decision_compute -k ruling -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24521-integration-proof
  description: Run the node tests on a lab host at the pushed head. Hosted CI cannot reach the lab hosts, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-24521 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/nodes/node_ruling_register_compute tests/unit/nodes/node_ruling_register_effect -q --no-cov -n 0 -p no:randomly
    cwd: .
