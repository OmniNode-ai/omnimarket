schema_version: "1.0.0"
ticket_id: "OMN-26689"
title: "A /docker tab in the onex TUI starts, shows and stops the full self-hosted stack for users who want more features"
summary: "The onex TUI lists /docker and shows a Docker tab, both read from tui_design.yaml. Start runs the setup command the design names, and a missing or stopped Docker is shown as one plain sentence. This slice binds AC1 and AC2; AC3 to AC6 stay open."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-omn26689-docker-tab"
    statement: |-
      The onex TUI has a /docker tab read from its design file.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: /docker appears in the / list and the tab bar from tui_design.yaml with no other code listing it -- falsifier: pilot test reads the palette and tabs at 80x24 and 140x40
      - id: "AC2"
        statement: |-
          AC2: with Docker not installed or not running, the tab names the cause and the fix in one plain sentence and no raw error text -- falsifier: pilot test with a fake runner returning docker-not-found and daemon-down
evidence_requirements:
  - kind: "tests"
    description: "Pilot tests: the palette and tab bar list /docker at 80x24 and 140x40; a failed Start with docker-not-found or daemon-down output shows one plain sentence and no raw text."
    command: "uv run pytest tests/unit/nodes/node_onex_setup_effect/test_onex_tui_docker.py -q -n 0 --no-cov"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn26689-docker-tab-listed-from-design"
    description: "The palette and the tab bar list /docker at 80x24 and 140x40 from tui_design.yaml; the test fails on the base tree, where the design has no docker entry."
    source: "manual"
    binds_ac: ["AC1"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/nodes/node_onex_setup_effect/test_onex_tui_docker.py -q -n 0 --no-cov -k palette_and_the_tab_bar"
        cwd: "."
  - id: "dod-omn26689-docker-cause-in-one-sentence"
    description: "A failed Start whose output says docker was not found or the daemon is down shows one plain sentence naming the cause and the fix, with none of the raw text."
    source: "manual"
    binds_ac: ["AC2"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/nodes/node_onex_setup_effect/test_onex_tui_docker.py -q -n 0 --no-cov -k names_the_cause"
        cwd: "."
  - id: "dod-omn26689-integration-proof-bound"
    description: "Run the Docker tab's pilot tests on a lab host at the pushed head, addressed to the declared dev bus lane; hosted CI cannot reach the lab, so only the local Done gate runs this unbound check."
    source: "manual"
    execution_scope: local_done_gate
    checks:
      - check_type: "command"
        check_value: "env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --bus-lane dev --omnibase-path \"${OMNI_HOME:?}\" --repo OmniNode-ai/omnimarket --sha \"$(git rev-parse HEAD)\" --lane dod-integration-proof-26689 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/nodes/node_onex_setup_effect/test_onex_tui_docker.py -q --no-cov"
        cwd: "."
