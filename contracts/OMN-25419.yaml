schema_version: 1.0.0
ticket_id: OMN-25419
title: node_merged_change_reading_effect owns an hourly host schedule so a run of it exists to be read
summary: The merged-change reading node declared no trigger topic, no result topic and no host unit, so the integration pass could never read a run of it. The node now owns an hourly systemd user timer on the lab hosts its overlay names, installed and removed by its own schedule verbs, and the unit reads every change the runner overlay declares.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn25419-hourly-schedule
  statement: The reading node installs, removes and runs an hourly host unit from its own contract and node overlay, and the unit reads every declared runner.
  acceptance:
  - id: AC1
    statement: 'AC1: schedule install renders an hourly timer from the contract cadence and a unit that runs read --all-runners, refuses a host the overlay does not name, and uninstall removes both unit files -- falsifier: pytest tests/nodes/node_merged_change_reading_effect/test_schedule.py -q fails when the cadence, the verb, the host refusal or the rollback is removed'
  - id: AC2
    statement: 'AC2: read --all-runners reads every change the runner overlay declares once, with explicit --change values first, and a call with neither flag refuses -- falsifier: pytest tests/nodes/node_merged_change_reading_effect/test_read_all_runners.py -q fails when the flag or the refusal is removed'
evidence_requirements:
- kind: tests
  description: The merged-change reading node tests pass.
  command: uv run --frozen pytest tests/nodes/node_merged_change_reading_effect -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn25419-ac1
  description: The schedule test renders the unit and timer from the packaged contract and the example overlay and checks install, refusal, dry run and uninstall; at the merge base the schedule module does not exist and the test fails to import.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_merged_change_reading_effect/test_schedule.py -q --no-cov
    cwd: .
- id: dod-omn25419-ac2
  description: The all-runners test drives the entry with an in-memory source; at the merge base --all-runners is not a flag and the test fails.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_merged_change_reading_effect/test_read_all_runners.py -q --no-cov
    cwd: .
- id: dod-omn25419-integration-proof
  description: Run this pull request's own check on a lab host at the pushed head; hosted CI cannot reach the lab, so only the local Done gate runs this unbound check. The reading of the change on the lab is the pull request's Lab line.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-25419 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_merged_change_reading_effect -q --no-cov
    cwd: .
