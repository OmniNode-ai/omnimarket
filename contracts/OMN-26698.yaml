schema_version: "1.0.0"
ticket_id: "OMN-26698"
title: "Lane work orchestrator: first slice (the red-check loop as ordinary nodes)"
summary: >-
  Acceptance for OMN-26698 (epic, goal item 7). This change fixes the three gates spike 3 held on: the lane work
  reducer's red route table (a file shape ratchet red goes to fixing, an overlay required red goes to help, with a
  paired blocked edge) and a classify rule that names a dod-verify step failure, each replayed from the recorded
  CI job log of the real red change. The epic stays open; this change finishes none of its criteria.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-omn26698-spike3-gates"
    statement: >-
      The three real red changes of spike 3 route as the plan names, replayed from their recorded CI logs.
    acceptance:
      - id: "AC3"
        statement: >-
          spike 1 on four real red changes passes all six checks of the plan, including one workflow that went the whole loop to handed_off -- falsifier: the spike result section of the plan names six passes, each with its receipt, and one handed_off terminal on the terminal topic
evidence_requirements: []
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn26698-spike3-replay-routes"
    description: >-
      The recorded CI logs of omnimarket#6573 (file shape ratchet), #7030 (overlay missing on the overlay store main) and #7030
      (dod-verify) are classified and folded from red: fixing, help_requested and a named dod_verify_step_failed
      kind that goes to diagnosing. A known bad (the stack head's contract and overlay) fails four of the replay
      tests; the known good passes.
    source: "manual"
    binds_ac: ["AC3"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/nodes/node_lane_work_reducer/test_spike3_replay.py -m unit -q -p no:randomly"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn26698-spike3-classify-logs"
    description: >-
      The classifier names the #7030 dod-verify log dod_verify_step_failed and the #7030 overlay log
      overlay_required, from the recorded job logs.
    source: "manual"
    binds_ac: ["AC3"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/nodes/node_lane_work_event_classify_compute/test_lane_work_spike3_logs.py -m unit -q -p no:randomly"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn26698-integration-proof"
    description: >-
      Run the reducer and classifier tests, including the spike 3 replay of the recorded #6573 and #7030 job logs,
      on a lab host at the pushed head. This local completion proof carries no hosted AC bindings.
    source: "manual"
    execution_scope: "local_done_gate"
    checks:
      - check_type: "command"
        check_value: >-
          onex lab-work run
          --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)"
          --lane dod-integration-proof-26698 --kind test --
          uv run --frozen pytest tests/unit/nodes/node_lane_work_reducer
          tests/unit/nodes/node_lane_work_event_classify_compute
          -m unit -q -n 0 --no-cov --refuse-skips
        cwd: "."
