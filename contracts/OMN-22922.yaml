requirements:
- id: req-landing-chains
  statement: The landing piece carries golden and error chain event tests and one whole-flow run, each able to fail for real.
  acceptance:
  - id: AC1
    statement: 'AC1: a golden chain event test generated from the landing contract passes on the in-memory bus and on the real broker -- falsifier: uv run pytest tests/chain/test_landing_golden.py -q'
  - id: AC2
    statement: 'AC2: an error chain event test passes on both, and a named mutation in the decision node turns each test red -- falsifier: uv run pytest tests/chain/test_landing_error.py -q'
  - id: AC3
    statement: 'AC3: one whole-flow run takes a test head from open to merged on the running landing piece and records its receipt -- falsifier: uv run pytest tests/chain/test_landing_whole_flow.py -q'
