schema_version: 1.0.0
ticket_id: OMN-24651
title: Hold GLM out of the lane delegation ladders while the Coding Plan's limit is exhausted
summary: Adds handler_glm_quota_gate, which reads z.ai's plan-limit refusal (codes 1310 and 1308, from the zai quota rules) out of a failed GLM call and answers whether GLM is held out. node_llm_delegation_call_effect binds it and owns its command line, which keeps the hold in one marker file under the state root. The zai rules declare the reset stamp's Beijing-time offset, which the shared reset handler applies. The lane delegation step runs the command line in the dispatch venv before and after each GLM call.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24651-glm-quota-gate
  statement: A GLM call refused for an exhausted plan limit holds GLM out until the stated reset, read as Beijing time, and a rate limit holds nothing.
  acceptance:
  - id: AC2
    statement: "AC2: the mechanism the five whys reach is fixed in its owning repository and a test built from the recorded failure text fails on the broken code and passes on the fix -- falsifier: uv run pytest tests/handlers/test_handler_provider_quota_reset_beijing_time.py fails on the base parser, which reads the recorded Beijing-time stamp as UTC"
evidence_requirements:
- kind: tests
  description: The quota gate, Beijing-time reset and node binding tests at the pushed head.
  command: uv run --frozen pytest tests/handlers/test_handler_glm_quota_gate.py tests/handlers/test_handler_provider_quota_reset_beijing_time.py tests/handlers/test_glm_quota_gate_node_binding.py -q --no-cov -p no:cacheprovider
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
