  description: "AC2: the recorded 1310 text with its Beijing-time stamp reads as 2026-11-14T17:38:18Z on the shared reset handler, through the zai rule on the bifrost path, and on the gate; read as UTC (the base parser) it is eight hours later and the test fails"
  source: manual
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/handlers/test_handler_provider_quota_reset_beijing_time.py tests/handlers/test_handler_glm_quota_gate.py -q --no-cov -p no:cacheprovider
  binds_ac:
  - AC2
- id: dod-omn24651-integration-proof
