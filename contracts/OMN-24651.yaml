schema_version: 1.0.0
ticket_id: OMN-24651
title: Hold GLM out of the lane delegation ladders while the Coding Plan's limit is exhausted
summary: Adds handler_glm_quota_gate, which reads z.ai's weekly or monthly limit refusal (code 1310) from a failed GLM call, keeps the hold in one marker file under the state root, and answers whether GLM is held out; the reset stamp is read as Beijing time. The lane delegation step runs it in the dispatch venv before and after each GLM call.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24651-glm-quota-gate
  statement: A GLM call refused for an exhausted plan limit holds GLM out until the stated reset, read as Beijing time, and a rate limit holds nothing.
  acceptance:
  - id: AC2
    statement: "AC2: the mechanism the five whys reach is fixed in its owning repository and a test built from the recorded failure text fails on the broken code and passes on the fix -- falsifier: uv run pytest tests/handlers/test_handler_glm_quota_gate.py fails against the base commit"
