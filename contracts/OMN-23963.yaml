schema_version: "1.0.0"
ticket_id: OMN-23963
title: "The board publisher takes its step limits and cycle bound from its overlay"
summary: >-
  The board publisher declared each step's time limit and the cycle bound in its contract (set to 45 s for the factory_floor
  step and 255 s for the cycle by OMN-23959). Operator decision 2026-11-12: the board limit is a contract overlay value. The
  contract now declares only which steps exist and their order; every step limit and the cycle bound is the node overlay's
  `limits` document, the handler resolves them with the overlay, and a missing value refuses with a typed error naming the
  overlay key. There is no default in code. The overlays repository carries the values (45 s, 255 s, the other steps unchanged).
is_seam_ticket: true
interface_change: true
interfaces_touched:
  - public_api
requirements:
  - id: req-omn23963-limits-overlay
    statement: Every step limit and the cycle bound come from the node overlay; a missing value refuses naming its overlay key; the longest declared path fits the overlay's bound.
    acceptance:
      - id: AC1
        statement: 'AC1: the board publisher reads every step limit and the cycle bound from its overlay and refuses with a typed error naming the missing overlay key, with the longest declared path held under the overlay''s bound -- falsifier: uv run --frozen pytest tests/unit/nodes/node_factory_floor_publish_effect/test_board_limits_overlay.py -q --no-cov fails on the base commit and passes on the branch'
      - id: AC2
        statement: 'AC2: the overlays repository carries the publisher''s overlay with factory_floor 45 s, the cycle bound 255 s and the other steps'' current values, loading through the node''s own model at the pinned revision -- falsifier: the overlays repository ci overlay-load step fails when a step name or a limit is missing from the file'
      - id: AC3
        statement: 'AC3: integrated: the publish cycle on the Mac installed from the merged revisions reads its limits from the overlay and publishes a fresh record -- falsifier: the served publish-status.json read on the Mac shows a cycle_bound_seconds other than 255, or a record older than one publish cycle'
evidence_requirements:
  - kind: tests
    description: The limits tests, the cycle bound tests and the publisher tests that read the limits.
    command: uv run --frozen pytest tests/unit/nodes/node_factory_floor_publish_effect/test_board_limits_overlay.py tests/nodes/node_factory_floor_publish_effect/test_cycle_bound.py -q --no-cov
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-omn23963-limits-overlay
    description: The overlay limits tests pass with the change; on the base commit the contract still declares the limits and the new test file does not exist.
    source: manual
    execution_scope: hosted_and_local
    binds_ac: [AC1]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/nodes/node_factory_floor_publish_effect/test_board_limits_overlay.py -q --no-cov
        cwd: .
  - id: dod-omn23963-overlay-values
    description: The overlays repository change carries the values and its ci loads them through the pinned model; the reading is on that pull request's checks.
    source: manual
    binds_ac: [AC2]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/nodes/node_factory_floor_publish_effect/test_board_limits_overlay.py -q --no-cov
        cwd: .
  - id: dod-omn23963-integration-proof
    description: The limits tests run on a lab host at the pushed head through the lab work node. The reading on the Mac itself (the served publish-status.json after the orchestrator's reinstall of both changes) is the orchestrator's and is named in the pull request; hosted CI cannot reach it, so only the local Done gate runs this unbound check.
    source: manual
    execution_scope: local_done_gate
    binds_ac: [AC3]
    checks:
      - check_type: command
        check_value: 'env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23963 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/nodes/node_factory_floor_publish_effect/test_board_limits_overlay.py -q --no-cov'
        cwd: .
