schema_version: 1.0.0
ticket_id: OMN-23972
title: 'Classify task kind in the code eval suite: labelled integration-ledger set and per-engine scores'
summary: 'A new node, node_classify_eval_compute, adds the classify task kind next to the code eval census: operation build_set turns a copy of the integration ledger into a labelled set of lines drawn per class from an overlay''s sizes and seed, operation score_answers scores engine replies per engine, input variant and class. The real set is built on a lab host from the ledger copy and is not committed.'
is_seam_ticket: true
interface_change: true
interfaces_touched:
- public_api
- topics
requirements:
- id: req-omn23972-ac1
  statement: the build step turns a ledger copy into a labelled set of at least 100 lines with every class present, the same set on a repeat, and no answer-bearing cell carried into a task
  acceptance:
  - id: AC1
    statement: 'AC1: the build step turns a ledger copy into a labelled set of at least 100 lines with every class present, the same set on a repeat, and no answer-bearing cell carried into a task -- falsifier: uv run pytest tests/nodes/node_classify_eval_compute/test_golden_chain_classify_eval.py tests/nodes/node_classify_eval_compute/test_committed_suite.py -q -n 0 -p no:randomly --no-cov'
- id: req-omn23972-ac2
  statement: every typed failure of the node is reached, and each injected break (first class word taken, ambiguous line kept, answer cell carried) turns a named test red
  acceptance:
  - id: AC2
    statement: 'AC2: every typed failure of the node is reached, and each injected break (first class word taken, ambiguous line kept, answer cell carried) turns a named test red -- falsifier: uv run pytest tests/nodes/node_classify_eval_compute/test_error_chain_classify_eval.py tests/nodes/node_classify_eval_compute/test_failing_controls.py -q -n 0 -p no:randomly --no-cov'
- id: req-omn23972-ac3
  statement: the ledger line format and the reply shapes the delegation step returns are read by fixtures taken from real runs, and the packaged overlay example validates
  acceptance:
  - id: AC3
    statement: 'AC3: the ledger line format and the reply shapes the delegation step returns are read by fixtures taken from real runs, and the packaged overlay example validates -- falsifier: uv run pytest tests/nodes/node_classify_eval_compute/test_seam_ledger_and_reply_shapes.py tests/nodes/node_classify_eval_compute/test_overlay_keys.py -q -n 0 -p no:randomly --no-cov'
- id: req-omn23972-ac4
  statement: 'integrated: the classify step was run on the committed set on both lab model machines and on GLM and the per-class table was produced by the scoring step, read in the running delegation lane'
  acceptance:
  - id: AC4
    statement: 'AC4: integrated: the classify step was run on the committed set on both lab model machines and on GLM and the per-class table was produced by the scoring step, read in the running delegation lane -- falsifier: the table and run ids in the pull request comment that starts Lab:, checkable against the delegation record''s run directories'
