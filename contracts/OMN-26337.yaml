schema_version: "1.0.0"
ticket_id: OMN-26337
title: "The code graph answers a handlers question: per contract, per operation, the handler, its models, topics, declared failure causes and examples"
summary: >-
  The first rung of the graph-generated handler exercise (plan task T44). node_code_graph_effect gains a handlers question
  that returns one row per operation of each contract's handler_routing, read through the contract graph import and
  resolved against the version's own definition index. A reference the index cannot place is marked UNRESOLVED with its
  reason and an operation with no observable route is NO_ROUTE; no row is dropped. The ticket's own acceptance criteria
  (the dispatch, the pass rule, the nightly shards, the untyped-exception run) stay open on the ticket; this change covers
  only the graph question.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn26337-handlers-question
    statement: The code graph answers one row per handler_routing operation of each contract, with the handler, models, topics, declared failure causes and examples, and marks what it cannot place.
    acceptance:
      - id: AC1
        statement: 'AC1: over a fixture repository with one contract, two operations and one missing handler class, the answer holds two rows, one UNRESOLVED -- falsifier: uv run --frozen pytest tests/nodes/node_code_graph_effect/test_code_graph_handlers.py -q --no-cov'
      - id: AC2
        statement: 'AC2: the row identities equal the (contract, operation) pairs counted from the fixture YAML, and a version with the unresolved row removed fails that equality -- falsifier: uv run --frozen pytest tests/nodes/node_code_graph_effect/test_code_graph_handlers.py -q --no-cov -k "equal_the_operations or dropped_unresolved"'
      - id: AC3
        statement: 'AC3: the row, UNRESOLVED and NO_ROUTE counts over the real repositories are printed by the lookup CLI and recorded on the ticket -- falsifier: the HANDLERS line of the lookup run, recorded in the pull request Lab line'
evidence_requirements:
  - kind: tests
    description: The handlers question tests and the existing code graph tests.
    command: uv run --frozen pytest tests/nodes/node_code_graph_effect -q --no-cov
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-omn26337-handlers-tests
    description: The handlers question tests pass with the change; the question does not exist at the merge base.
    source: manual
    execution_scope: hosted_and_local
    binds_ac: [AC1, AC2]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/nodes/node_code_graph_effect/test_code_graph_handlers.py -q --no-cov
        cwd: .
  - id: dod-omn26337-code-graph-regression
    description: The existing code graph tests still pass with the handler rows in the version.
    source: manual
    execution_scope: hosted_and_local
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/nodes/node_code_graph_effect -q --no-cov
        cwd: .
  - id: dod-omn26337-handlers-line-counts
    description: The lookup CLI's HANDLERS line is built from the rows, the UNRESOLVED count and the NO_ROUTE count; the function that builds it does not exist at the merge base. The counts over the real repositories are read in the pull request Lab line, since hosted CI holds no registry clones.
    source: manual
    execution_scope: hosted_and_local
    binds_ac: [AC3]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/nodes/node_code_graph_effect/test_code_graph_handlers.py -q --no-cov -k handlers_line_counts
        cwd: .
  - id: dod-omn26337-integration-proof-real-counts
    description: The lookup CLI prints the HANDLERS count line over a real repository clone; read in the pull request Lab line, since hosted CI holds no registry clones. Not bound to a criterion, because the hosted merge-base control cannot run a local_done_gate item; AC3 is bound to the hosted test above.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: 'env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-26337 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_code_graph_effect/test_code_graph_handlers.py -q --no-cov'
        cwd: .
  - id: dod-omn26337-generated-event-per-handler
    description: The graph-generated exercise (the ticket's AC1) emits one event or one named gap per handler row of the code graph read over this repository; the node and its test do not exist at the merge base.
    source: manual
    execution_scope: hosted_and_local
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/ci/test_handler_exercise_generated_event_per_handler.py -q --no-cov
        cwd: .
