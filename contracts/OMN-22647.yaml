schema_version: "1.0.0"
ticket_id: "OMN-22647"
title: "The lab work unit fetch and the git capability probe follow the host's git credential helper and accept a node-issued installation token"
summary: "The lab work unit's private fetch no longer forces the gh credential helper, and the git-workflow-push probe asks for one named repository and reads a node-issued installation token as ok."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-omn22647-host-helper"
    statement: "The lab work fetch and the git capability probe work with the host's node-issued git token helper."
    acceptance:
      - id: "AC1"
        statement: "AC1: the lab work unit's private fetch carries no forced credential helper -- falsifier: uv run pytest tests/unit/lab_work/test_lab_work_fetch_follows_host_helper.py -q"
      - id: "AC2"
        statement: "AC2: the git-workflow-push probe asks the helper for one named repository and reads a ghs_ installation token answered 200 as ok, while a token with no scopes header that is not an installation token stays unknown -- falsifier: uv run pytest tests/nodes/node_host_capability_compute/test_host_capability_parity.py -q -k installation_token"
evidence_requirements:
  - kind: "tests"
    description: "The caller follows the host's git credential helper."
    command: "uv run pytest tests/unit/lab_work/test_lab_work_fetch_follows_host_helper.py -q"
