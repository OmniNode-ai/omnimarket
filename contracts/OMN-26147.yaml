schema_version: 1.0.0
ticket_id: OMN-26147
title: Service login writer topics are created from each contract's writer_topics template and the declared service logins, so the dev runtime's ledger append topic exists
summary: The topic provision plan expands each loaded contract's writer_topics template with each declared service login (the service writers overlay, and a broker scope overlay's WRITE grant on the topic the template composes), named by the one template helper the work ledger serve also uses. The dry run effect gains an apply step that creates each planned writer topic the broker does not hold, 1 partition and 1 replica, accepts an existing topic and creates nothing on a second run.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn26147-plan-expands-template
  statement: The plan derives one writer topic per declared service login from each contract's writer_topics template, with no topic name written in code.
  acceptance:
  - id: AC1
    statement: "AC1: the topic provision plan derives one writer topic per declared service login by expanding each contract's writer_topics template (kind, producer, name_prefix, version) with each principal that passes the template's principal_pattern, reading the logins from the declared service writers overlay and the broker ACL scope overlays, with no topic name written in code"
- id: req-omn26147-apply-creates-absent
  statement: An apply step creates each planned writer topic that is absent with 1 partition and 1 replica and creates nothing on a second run.
  acceptance:
  - id: AC2
    statement: "AC2: an apply step creates each planned writer topic that is absent with 1 partition and 1 replica, accepts an existing topic, and a second run creates nothing"
- id: req-omn26147-regression
  statement: A regression test built from the recorded incident data fails on the unchanged base and passes on the fix.
  acceptance:
  - id: AC3
    statement: "AC3: a regression test built from the recorded data of the incident fails on the unchanged base and passes on the fix"
- id: req-omn26147-installed
  statement: The change is installed from its branch on the dev lane through the declared installer and run once.
  acceptance:
  - id: AC4
    statement: "AC4: the change is installed from its branch on the dev lane through the declared installer and run once, recorded as installed=<host>:<revision> with observed=<what ran>"
- id: req-omn26147-broker-read
  statement: After the run the dev broker lists the ledger append topic for the dev lane login with 1 partition, read from the broker.
  acceptance:
  - id: AC5
    statement: "AC5: after that run the dev broker lists the ledger append writer topic of the dev lane login with 1 partition, read by the lane itself from the broker, not from the plan"
evidence_requirements:
- kind: tests
  description: The plan expansion, the apply step and the incident regression test, with the fixture under tests/fixtures/topic_provision/work_ledger_writer_incident/.
  command: env -u PYTHONPATH uv run pytest tests/unit/nodes/node_topic_provision_plan_compute tests/unit/nodes/node_topic_provision_dry_run_effect -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn26147-ac1-plan-expands-template
  description: The plan composes the writer topic of a declared login from the recorded ledger node template through ModelWriterTopicsTemplate, the helper the serve (work_ledger_bus.bus) now also uses; a login the principal_pattern refuses, a contract with no template and a scope principal with no WRITE on its writer topic plan nothing.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/nodes/node_topic_provision_plan_compute -q --no-cov -k service_writer
    cwd: .
- id: dod-omn26147-ac2-apply-creates-once
  description: The apply creates the absent planned writer topic with 1 partition and 1 replica, accepts one that exists (or appears between the list and the create) and issues no create call on a second run; it creates no other topic of the contract.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/nodes/node_topic_provision_dry_run_effect -q --no-cov -k writer_topic_apply
    cwd: .
- id: dod-omn26147-ac3-incident-regression
  description: Built from the recorded declarations of the incident (fixture directory tests/fixtures/topic_provision/work_ledger_writer_incident/), the test plans and creates a declared login's writer topic; on the unchanged base it fails at collection because the apply handler and the plan expansion do not exist.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/nodes/node_topic_provision_dry_run_effect/test_writer_topic_incident_regression.py -q --no-cov
    cwd: .
- id: dod-omn26147-ac4-installed-and-run
  description: Read from the ledger after the run, so only the local Done gate runs it. A STATUS row of lane svctopic-0630 carries installed=<host>:<revision> and observed=<what ran> for the topic provisioner.
  source: manual
  execution_scope: local_done_gate
  binds_ac:
  - AC4
  checks:
  - check_type: command
    check_value: grep -E 'STATUS .*lane=svctopic-0630 .*installed=h201:[0-9a-f]{40} .*observed=' "${ONEX_LEDGER_PATH:?}"
    cwd: .
- id: dod-omn26147-ac5-broker-read
  description: Read from the dev broker on h201 with the lane-aware admin client, so only the local Done gate runs it; it prints the name and the partition count.
  source: manual
  execution_scope: local_done_gate
  binds_ac:
  - AC5
  checks:
  - check_type: command
    check_value: grep -E 'MSG .*to=orchestrator-31d9-swarm .*service writer topic present.*partitions=1' "${ONEX_LEDGER_PATH:?}"
    cwd: .
- id: dod-omn26147-integration-proof-lab-run
  description: Hosted CI holds no dev broker, so only the local Done gate runs this check, and it binds no criterion here (the hosted base control refuses a bound item it cannot run). On a lab host, at the change's own sha, the incident regression test plans and creates the writer topic from the recorded declarations through the node's own handlers.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-26147 --kind test -- env -u PYTHONPATH uv run --frozen pytest tests/unit/nodes/node_topic_provision_dry_run_effect/test_writer_topic_incident_regression.py -q --no-cov
    cwd: .
