schema_version: 1.0.0
ticket_id: OMN-25484
title: The integration check reads every merged change through the declared runner reader with no model, and publishes SEEN RUNNING or NOT RUNNING with the reading and its time
summary: node_merged_change_runner_read_workflow runs the merged-change runner reader as a Temporal workflow on the lab host's Temporal server. A Temporal schedule starts one full read every 900 s; the workflow lists every line the merged_change_runners overlay declares, runs node_merged_change_reading_effect once per line as its own activity with retries, and publishes the readings as one integration reading batch through node_integration_reading_publish_effect. Its worker is a registry_module_tick unit of node_host_installer_registry_units (merged-change-runner-read-systemd). No model runs in the read.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn25484-runner-read
  statement: The merged-change runner reader runs on a declared schedule with no model and publishes every declared line as an integration reading with its reading and its time.
  acceptance:
  - id: AC1
    statement: 'AC1: the reader node runs on its declared schedule on h201 with no model and reads every declared line, and a lab host schedule or installer unit reads the host units -- falsifier: read the schedule run event and the unit status and last exit on h201 and on one lab host, and fail if either shows no run in the last interval'
  - id: AC2
    statement: 'AC2: each line is published as SEEN RUNNING or NOT RUNNING with its reading and its time, in the form the integration projection on dev holds -- falsifier: query the integration projection on dev for the newest row of each declared line and fail on a row with no reading or no time'
  - id: AC3
    statement: 'AC3: the NOT RUNNING count with and without a runner row is reported from the integration projection or ledger list -- falsifier: recount from the projection and fail if the reported counts differ'
  - id: AC4
    statement: 'AC4: runner rows for every line whose step names the kind of reading are generated in one overlays PR with a test that fails when a generated row is removed -- falsifier: uv run pytest on the new overlays test at the pushed head and again with one generated row deleted'
  - id: AC5
    statement: 'AC5: the report states how many lines are read mechanically and the seconds per full read -- falsifier: rerun one full read on h201 and fail if the measured seconds differ from the report by more than the stated margin'
evidence_requirements:
- kind: tests
  description: The runner read workflow's tests pass at the pushed head.
  command: uv run --frozen pytest tests/nodes/node_merged_change_runner_read_workflow/test_runner_read_workflow.py -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn25484-ac1
  description: The workflow lists the declared lines, runs one activity per line with the retry limit, and carries a line that failed every attempt as unread. The live schedule run on the lab host is recorded in the pull request's Lab line.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_merged_change_runner_read_workflow/test_runner_read_workflow.py -q --no-cov -n 0 -p no:randomly -k workflow_retries
    cwd: .
- id: dod-omn25484-ac2
  description: Each line maps to a running, not running, defect or unproven integration reading with its reading line and its read time, in the batch node_integration_reading_publish_effect takes.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_merged_change_runner_read_workflow/test_runner_read_workflow.py -q --no-cov -n 0 -p no:randomly -k "running_paths or not_running_rules or unread_and_library"
    cwd: .
- id: dod-omn25484-ac3
  description: The batch counts by reader verdict; the counts from the published projection are in the lane report.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_merged_change_runner_read_workflow/test_runner_read_workflow.py -q --no-cov -n 0 -p no:randomly -k merge_facts_counts
    cwd: .
- id: dod-omn25484-ac4
  description: Pending. The runner rows belong to the overlays repository and its own test; this pull request maps the reader's no_declared_runner step to the needs_reader gap class.
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_merged_change_runner_read_workflow/test_runner_read_workflow.py -q --no-cov -n 0 -p no:randomly -k contract_maps
    cwd: .
- id: dod-omn25484-ac5
  description: Every full read appends its read seconds and line counts to its run record; the measured numbers are in the lane report.
  source: manual
  binds_ac:
