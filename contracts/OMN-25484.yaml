schema_version: 1.0.0
ticket_id: OMN-25484
title: The integration check reads every merged change through the declared runner reader with no model, and publishes SEEN RUNNING or NOT RUNNING with the reading and its time
summary: The merged-change runner uses a Temporal schedule to observe dev runtime readiness and build provenance. The schedule queues one read per observed ready boot over the window from the preceding build to the read start. The reader checks the declared merges without a model and publishes their integration readings. The lab alarm delivery effect sends an idle notice and a recovery notice when a read misses the declared bound.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn25484-runner-read
  statement: The merged-change runner reader runs on a declared schedule with no model and publishes every declared line as an integration reading with its reading and its time.
  acceptance:
  - id: AC1
    statement: 'AC1: the reader node runs on its declared schedule on h201 with no model and reads every declared line, and a lab host schedule or installer unit reads the host units -- falsifier: read the schedule run event and the unit status and last exit on h201 and on one lab host, and fail if either shows no run in the last interval'
  - id: AC2
    statement: 'AC2: each line is published as SEEN RUNNING or NOT RUNNING with its reading and its time, in the form the integration projection on dev holds -- falsifier: query the integration projection on dev for the newest row of each declared line and fail on a row with no reading or no time'
  - id: AC3
    statement: 'AC3: the NOT RUNNING count with and without a runner row is reported from the integration projection or ledger list -- falsifier: recount from the projection and fail if the reported counts differ'
  - id: AC4
    statement: 'AC4: runner rows for every line whose step names the kind of reading are generated in one overlays PR with a test that fails when a generated row is removed -- falsifier: uv run pytest on the new overlays test at the pushed head and again with one generated row deleted'
  - id: AC5
    statement: 'AC5: the report states how many lines are read mechanically and the seconds per full read -- falsifier: rerun one full read on h201 and fail if the measured seconds differ from the report by more than the stated margin'
evidence_requirements:
- kind: tests
  description: The runner read workflow's tests pass at the pushed head.
  command: uv run --frozen pytest tests/nodes/node_merged_change_runner_read_workflow/test_runner_read_workflow.py -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn25484-ac1
  description: Tests the full-read workflow's per-line retry limit and unread result. The h201 installed schedule and unit status require live proof.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_merged_change_runner_read_workflow/test_runner_read_workflow.py -q --no-cov -n 0 -p no:randomly -k workflow_retries
    cwd: .
- id: dod-omn25484-ac2
  description: Each line maps to a running, not running, defect or unproven integration reading with its reading line and its read time, in the batch node_integration_reading_publish_effect takes.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_merged_change_runner_read_workflow/test_runner_read_workflow.py -q --no-cov -n 0 -p no:randomly -k "running_paths or not_running_rules or unread_and_library"
    cwd: .
- id: dod-omn25484-ac3
  description: Tests the per-verdict batch counts. AC3 requires a live projection recount with and without runner rows.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_merged_change_runner_read_workflow/test_runner_read_workflow.py -q --no-cov -n 0 -p no:randomly -k merge_facts_counts
    cwd: .
- id: dod-omn25484-ac4
  description: Pending. The runner rows belong to the overlays repository and its own test; this pull request maps the reader's no_declared_runner step to the needs_reader gap class.
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_merged_change_runner_read_workflow/test_runner_read_workflow.py -q --no-cov -n 0 -p no:randomly -k contract_maps
    cwd: .
- id: dod-omn25484-ac5
  description: The read receipt records seconds and line counts. AC5 requires a fresh full-read measurement on h201.
  source: manual
  binds_ac:
  - AC5
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_merged_change_runner_read_workflow/test_runner_read_workflow.py -q --no-cov -n 0 -p no:randomly -k build_plan
    cwd: .
- id: dod-omn25484-ready-edge
  description: Each observed ready boot starts one read and passes the preceding build time. Repeated readiness for one boot and a boot that never reports ready start no extra read.
  source: manual
  binds_ac: [AC1]
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_merged_change_runner_read_workflow/test_ready_edge.py -q --no-cov -n 0 -p no:randomly -k 'one_read_per_ready_boot or no_ready_edge'
    cwd: .
- id: dod-omn25484-ready-window
  description: Schedule a read of the open lower and closed upper merge interval. The Temporal publish activity receives failed line reads as unread with a cause and a read timestamp. Incremental publication retains older rows.
  source: manual
  binds_ac: [AC2]
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_merged_change_runner_read_workflow/test_ready_edge.py -q --no-cov -n 0 -p no:randomly -k 'merge_window or windowed_workflow or incremental_projection'
    cwd: .
- id: dod-omn25484-idle-recovery
  description: A ready boot whose read misses the declared bound opens one idle episode. The lab alarm channel posts one recovery after the read completes.
  source: manual
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_merged_change_runner_read_workflow/test_ready_edge.py::test_idle_alarm_fires_once_and_recovers tests/nodes/node_lab_alarm_deliver_effect/test_lab_alarm_delivery.py::test_recovery_posts_once_through_the_alarm_channel -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn25484-hosted-deploy-probe
  description: At the checked-out revision, the hosted runner reads the published node contract and checks that it declares the bounded ready-edge scheduler. The predecessor had an unconditional full-read schedule.
  source: manual
  execution_scope: hosted_and_local
  checks:
  - check_type: command
    check_value: >-
      gh api "repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_merged_change_runner_read_workflow/contract.yaml?ref=$(git rev-parse HEAD)" --jq .content
      | base64 -d | grep -Ex '    idle_bound_seconds: [1-9][0-9]*'
    cwd: .
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_merged_change_runner_read_workflow/test_ready_edge.py::test_schedule_declares_ready_watcher_without_a_full_read -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn25484-integration-proof
  description: Run the runner read workflow's tests on a lab host at the pushed head. Hosted CI cannot reach the lab hosts or their Temporal server, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-25484 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_merged_change_runner_read_workflow/test_runner_read_workflow.py -q --no-cov -n 0 -p no:randomly
    cwd: .
