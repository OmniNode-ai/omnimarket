- id: dod-omn25484-integration-proof
  description: Run the runner read workflow's tests on a lab host at the pushed head. Hosted CI cannot reach the lab hosts or their Temporal server, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-25484 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_merged_change_runner_read_workflow/test_runner_read_workflow.py -q --no-cov -n 0 -p no:randomly
    cwd: .
