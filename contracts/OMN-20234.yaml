---
schema_version: "1.0.0"
ticket_id: "OMN-20234"
title: "No omnimarket node contract names a removed handler routing field, so the routing entry model's extra-ignore tolerance has no omnimarket reader left"
summary: "The two schedule nodes node_audit_trail_compact_schedule_compute and node_lab_job_check_schedule_compute carried routing_key and handler_key on their handler_routing entry, fields the canonical routing entry model only tolerates by ignoring them. Both entries now carry the canonical handler, event_model and event_type alone, and a repo-wide test scans every node contract's handler_routing for the removed fields (routing_key, handler_key, priority, output_events, callable, lazy_import) with a positive control."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-no-removed-route-fields"
    statement: "No node contract in omnimarket names a removed handler routing field on a handler_routing entry."
    acceptance:
      - id: "AC1"
        statement: "AC1: a scan of every src/omnimarket/nodes/node_*/contract.yaml handler_routing entry finds none of routing_key, handler_key, priority, output_events, callable or lazy_import -- falsifier: any contract entry naming one of them"
  - id: "req-dispatch-preserved"
    statement: "The two migrated schedule nodes still route the runtime tick to their handler."
    acceptance:
      - id: "AC2"
        statement: "AC2: the golden-chain and runtime-tick schedule tests of node_audit_trail_compact_schedule_compute and node_lab_job_check_schedule_compute pass on the migrated contracts -- falsifier: a failing schedule test after the routing fields are removed"
evidence_requirements:
  - kind: "tests"
    description: "AC1 and AC2: the repo-wide legacy-field scan with its positive control, and the schedule node tests."
    command: "uv run pytest tests/unit/nodes/test_canonical_handler_routing_migration.py tests/test_golden_chain_lab_job_check_schedule_compute.py tests/test_golden_chain_audit_trail_compact_schedule.py tests/test_audit_trail_compact_schedule_runtime_boot.py tests/unit/nodes/test_runtime_tick_schedule_fires.py tests/unit/nodes/node_lab_job_check/test_lab_job_check_schedule.py -q -p no:randomly --no-cov -n 0"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn20234-ac1-no-removed-route-fields"
    description: "AC1: the repo-wide scan finds no removed routing field in any node contract, and its positive control reports a fixture that carries them."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/nodes/test_canonical_handler_routing_migration.py -q -p no:randomly --no-cov -n 0 -k 'no_node_contract_carries_legacy_route_fields or legacy_route_scan_detects_removed_fields'"
    binds_ac: ["AC1"]
  - id: "dod-omn20234-ac2-schedule-dispatch-preserved"
    description: "AC2: the schedule nodes' golden-chain, boot and tick tests pass on the migrated contracts."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/test_golden_chain_lab_job_check_schedule_compute.py tests/test_golden_chain_audit_trail_compact_schedule.py tests/test_audit_trail_compact_schedule_runtime_boot.py tests/unit/nodes/test_runtime_tick_schedule_fires.py tests/unit/nodes/node_lab_job_check/test_lab_job_check_schedule.py -q -p no:randomly --no-cov -n 0"
    binds_ac: ["AC2"]
  - id: "dod-omn20234-deploy-probe"
    description: "Deploy probe. The two schedule node contracts at the checked-out commit carry no routing_key or handler_key line; the probe exits nonzero on a tree where either contract still names one, so it fails at the merge base."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: "bash -c '! grep -E \"^[[:space:]]+(routing_key|handler_key):\" src/omnimarket/nodes/node_audit_trail_compact_schedule_compute/contract.yaml src/omnimarket/nodes/node_lab_job_check_schedule_compute/contract.yaml'"
        cwd: "."
