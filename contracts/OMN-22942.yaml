schema_version: 1.0.0
ticket_id: OMN-22942
title: Piece 7 freezes the andon threshold per census class with a hash and its recalibration date, and a planted friction burst stops only its originating piece within one tick
summary: node_andon_threshold_compute computes each census class's threshold as its measured peak over 24 hour windows, freezes the set with a hash of its values and a recalibration date, refuses a changed value without a new hash when the freeze is read, and decides in one pass over one tick's observations which pieces a burst stops (only the originating piece).
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn22942-threshold-freeze
  statement: The per-class thresholds are frozen with a hash and a recalibration date, and a changed value without a new hash is refused.
  acceptance:
  - id: AC1
    statement: 'AC1: the per-class thresholds are computed from the measured peaks, written to the overlay with their hash and a recalibration date, and a changed value without a new hash fails -- falsifier: uv run pytest src/omnimarket/nodes/node_andon_threshold_compute -q -k freeze_hash'
- id: req-omn22942-burst-scope
  statement: A planted friction burst stops its originating piece in one evaluation and leaves the other listed pieces admitted.
  acceptance:
  - id: AC2
    statement: 'AC2: a planted friction burst stops its originating piece within one tick and leaves other pieces admitted -- falsifier: uv run pytest src/omnimarket/nodes/node_andon_threshold_compute -q -k burst_scope'
evidence_requirements:
- kind: tests
  description: The node tests pass
  command: uv run --frozen pytest src/omnimarket/nodes/node_andon_threshold_compute -q --no-cov
