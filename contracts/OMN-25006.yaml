schema_version: 1.0.0
ticket_id: OMN-25006
title: node_runtime_boot_set_compute declares the command it is called by, so a demand can reach it on the dev runtime
summary: The node's contract declared an empty event_bus, so the declared demand path (onex run-node) refused it with "does not declare event_bus.subscribe_topics" and no runtime subscribed its judge-requested command. The contract now subscribes that command, routes it to the handler, publishes the judged event as its terminal event, and grants the runtime principal the matching broker access.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn25006-boot-set-demand-path
  statement: A demand sent on the judge-requested command topic reaches node_runtime_boot_set_compute, and its verdict leaves on the judged event.
  acceptance:
  - id: AC1
    statement: 'AC1: the node contract subscribes the judge-requested command and routes it to the handler -- falsifier: uv run pytest tests/nodes/node_runtime_boot_set_compute/test_runtime_boot_set_contract_wiring.py fails on the base contract, whose event_bus is empty'
  - id: AC2
    statement: 'AC2: the judged event is the contract''s terminal and published topic and the runtime principal holds the matching broker grants -- falsifier: the same pytest module with the grants test'
evidence_requirements:
- kind: tests
  description: The boot set node tests, with the contract wiring tests and the existing topic declaration test.
  command: uv run --frozen pytest tests/nodes/node_runtime_boot_set_compute -q --no-cov -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-deploy-omn25006-contract-wiring
  description: Runs the contract wiring tests. They read the node contract and require the judge-requested command in subscribe_topics, as the routed handler topic and as the command topic, the judged event as terminal event and publish topic, and the runtime principal's READ and WRITE grants. The control, the contract at the merge base with an empty event_bus, fails the subscription assertion.
  source: manual
  binds_ac:
  - AC1
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_runtime_boot_set_compute/test_runtime_boot_set_contract_wiring.py -q --no-cov -p no:randomly
    cwd: .
- id: dod-omn25006-publish-parity
  description: Runs the contract publish parity check, which fails when a contract declares a publish topic the node never publishes.
  source: manual
  checks:
  - check_type: command
    check_value: uv run --frozen python scripts/ci/check_contract_publish_parity.py
    cwd: .
- id: dod-omn25006-integration-proof
  description: Hosted CI cannot reach the dev runtime, so only the local Done gate runs this unbound check. It sends one boot set judge request through the declared demand path, onex run-node, and fails while the node's contract does not declare event_bus.subscribe_topics in the installed build.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: onex run-node node_runtime_boot_set_compute --timeout 30 --input '{"correlation_id":"omn25006-done-gate","deployment":"dev","declaration":{"deployment":"dev","contracts":["node_runtime_boot_set_compute"]},"catalog":[{"contract":"node_runtime_boot_set_compute"}],"observation":{"attached_contracts":["node_runtime_boot_set_compute"],"subscribed_topics":[]}}'
    cwd: .
