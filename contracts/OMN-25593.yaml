schema_version: "1.0.0"
ticket_id: OMN-25593
title: Declare the work-state snapshot for boot provisioning
summary: The work-state projection publisher declares its snapshot in the contract field read by the boot provisioner.
is_seam_ticket: false
interface_change: true
interfaces_touched: [public_api]
requirements:
  - id: req-work-state-snapshot-provisioning
    statement: The boot provisioner can discover the snapshot topic from the publisher contract.
    acceptance:
      - id: AC1
        statement: The snapshot selected by runtime.publish.topic appears in event_bus.publish_topics in the publisher's contract.
      - id: AC2
        statement: The publisher tests and topic provisioning chain pass in a checkout of the change.
evidence_requirements:
  - kind: tests
    description: Check the publisher contract and the topic provisioning chain.
    command: uv run --frozen pytest tests/nodes/node_work_state_projection_effect tests/chain/test_topic_provision_chain.py -q -n 0 --no-cov
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-work-state-snapshot-deploy
    description: The hosted deploy smoke reads the publisher contract and checks the topic against the list used at boot. With the base contract, the test fails on the empty publish list.
    source: manual
    binds_ac: [AC1]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/nodes/node_work_state_projection_effect/test_publish_work_state_projection.py::test_runtime_publish_topic_is_declared -q -n 0 --no-cov
        cwd: .
      - check_type: command
        check_value: >-
          docker run --rm --mount "type=bind,source=$PWD,target=/checkout,readonly"
          --workdir /checkout python:3.12-slim sh -ec
          'python -m pip install --disable-pip-version-check --quiet PyYAML==6.0.3 &&
          python -c "from pathlib import Path; import yaml;
          contract = yaml.safe_load(Path(\"src/omnimarket/nodes/node_work_state_projection_effect/contract.yaml\").read_text(encoding=\"utf-8\"));
          assert contract[\"runtime\"][\"publish\"][\"topic\"] in contract[\"event_bus\"][\"publish_topics\"]"'
        cwd: .
  - id: dod-work-state-topic-provision-chain
    description: The publisher tests and in-memory topic provisioning chain run without a live broker.
    source: manual
    binds_ac: [AC2]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/nodes/node_work_state_projection_effect tests/chain/test_topic_provision_chain.py -q -n 0 --no-cov
        cwd: .
  - id: dod-work-state-integration-proof
    description: Run the publisher tests and provisioning chain on a lab host at the pushed head.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: >-
          onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)"
          --lane dod-integration-proof-25593 --kind test --
          env -u PYTHONPATH uv run --frozen pytest tests/nodes/node_work_state_projection_effect
          tests/chain/test_topic_provision_chain.py -q -n 0 -p no:randomly --no-cov
        cwd: .
