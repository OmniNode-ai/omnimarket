---
schema_version: "1.0.0"
ticket_id: "OMN-20994"
title: "onex secret register-tenant-key --store central writes the key through node_secret_store_effect into the shared tenant folder, so every lab host resolves it"
summary: "Operator rulings 2026-10-11T15:00:01Z and 2026-10-11T16:00:52Z: keys go in through the script path and live in one central place. register-tenant-key gains --store local|central (local stays the default). With central the value is handed in process to the secret store node's handler, create-only, under the minted reference in the tenant reference namespace the node's contract declares (the folder the lane resolver reads tenant references from), then credential-registered is published; this machine's local store is not read, written or created. A refusal from the node stores nothing, publishes nothing and prints the typed outcome without the value."
is_seam_ticket: false
interface_change: true
interfaces_touched:
  - "public_api"
requirements:
  - id: "req-omn20994-central-write"
    statement: |-
      --store central writes the key through the secret store node under the minted reference and leaves the local store untouched.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: `--store central` writes the value in process through the node_secret_store_effect handler (create-only) under the minted reference in the tenant folder, then publishes credential-registered; the local SQLite store is untouched -- falsifier: uv run pytest tests/unit/cli/test_omn20994_register_tenant_key_central.py -k register_tenant_key_central with a fake ProtocolSecretStore
  - id: "req-omn20994-central-refusal"
    statement: |-
      A refusal from the node stores nothing, publishes nothing and prints the typed outcome without the value.
    acceptance:
      - id: "AC2"
        statement: |-
          AC2: a refusal from the node (identity unresolved, store unreachable, key exists) stores nothing, publishes nothing and prints the typed outcome without the value -- falsifier: uv run pytest tests/unit/cli/test_omn20994_register_tenant_key_central.py -k register_tenant_key_central_refusal
  - id: "req-omn20994-tenant-namespace"
    statement: |-
      The node contract declares the tenant folder as a reference namespace.
    acceptance:
      - id: "AC3"
        statement: |-
          AC3: the node contract declares the tenant folder as a reference namespace, so a caller holds a reference and never a folder string -- falsifier: uv run pytest tests/unit/nodes/node_secret_store_effect/test_tenant_namespace.py -k tenant_namespace
evidence_requirements:
  - kind: "tests"
    description: "The central-store and tenant-namespace tests pass at the head and fail on the base, where register-tenant-key has no --store option and the node contract has no tenant namespace."
    command: "uv run pytest tests/unit/cli/test_omn20994_register_tenant_key_central.py tests/unit/nodes/node_secret_store_effect/test_tenant_namespace.py -q"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn20994-ac1-central-write"
    description: "--store central creates the value at <tenant folder>/<minted ref> through the node handler, publishes one credential-registered event without the value, and never creates the local SQLite file; the default still writes locally."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/cli/test_omn20994_register_tenant_key_central.py -k register_tenant_key_central -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC1"]
  - id: "dod-omn20994-ac2-central-refusal"
    description: "Key exists, refused, unreachable and not_configured each exit non-zero naming the typed outcome, leave the store as it was, publish nothing and never print the value."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/cli/test_omn20994_register_tenant_key_central.py -k register_tenant_key_central_refusal -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC2"]
  - id: "dod-omn20994-ac3-tenant-namespace"
    description: "The contract maps the tenant namespace to /tenant-inference-credentials with key template {name}, the handler creates a secret://onex/tenant/<ref> reference there, and the CLI source holds no folder string."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/nodes/node_secret_store_effect/test_tenant_namespace.py -k tenant_namespace -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC3"]
  - id: "dod-omn20994-deploy-probe-cli"
    description: "Deploy probe: the CLI GitHub serves at the checked-out commit defines _central_secret_handler, the node handler behind --store central; the symbol is absent at the merge base, so the content read answers false there."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/cli/test_omn20994_register_tenant_key_central.py -k register_tenant_key_central -q"
        cwd: "${OMNI_HOME}/omnimarket"
      - check_type: "command"
        check_value: "gh api \"repos/OmniNode-ai/omnimarket/contents/src/omnimarket/cli/cli_secret.py?ref=$(git rev-parse HEAD)\" --jq '.content | gsub(\"\\n\";\"\") | @base64d | contains(\"def _central_secret_handler(\")' | grep -qx true"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC1", "AC2"]
