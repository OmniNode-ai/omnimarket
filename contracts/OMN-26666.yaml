schema_version: 1.0.0
ticket_id: OMN-26666
title: A lane hands its commit to a push node instead of pushing
summary: A lane hands repository, branch, expected remote head and commits to node_lane_push_effect over the bus and reads back pushed, refused with the reason, or moved. The node runs every push check once, none skipped, and refuses any target that is not a test repository. This slice builds AC1 and AC2; the App-credential push and the timing record are later slices.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn26666-lane-push-node
  statement: A lane hands its commits to one node, which applies every push check and answers pushed, refused or moved.
  acceptance:
  - id: AC1
    statement: 'AC1: a lane hands repository, branch, expected remote head and commits (a bundle or a ref it stored) to one node over the bus and gets back pushed, refused with the reason, or moved; it never holds a push credential -- falsifier: a lane pushes with a credential of its own'
  - id: AC2
    statement: 'AC2: the node applies every check the push has today (the ruling guard read from the bus for that lane''s claim, the pre-push hooks, the contract check) and none is skipped -- falsifier: a commit one of them refuses today is pushed'
evidence_requirements:
- kind: tests
  description: The push node's focused tests, each failing before the change and passing on it.
  command: uv run pytest tests/nodes/node_lane_push_effect -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn26666-hand-over
  description: The request holds no credential field and refuses a handed-in credential or force; the answer is exactly pushed, refused or moved; a moved remote head, a protected branch and a rejected push never read pushed; a target that is not a test repository is refused before any check or credential.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_lane_push_effect/test_lane_push_ac1_ac2_omn26666.py tests/nodes/node_lane_push_effect/test_lane_push_test_repos_only_omn26666.py -q --no-cov -n 0 -p no:randomly -k 'ac1 or test_repos_only'
    cwd: .
- id: dod-omn26666-no-check-skipped
  description: Every check the contract declares runs on a green push, each refusing check stops the push and names itself, a handler built without a declared check refuses to start, and the contract names every pre-push hook of the repository.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_lane_push_effect/test_lane_push_ac1_ac2_omn26666.py tests/nodes/node_lane_push_effect/test_lane_push_checks_ac2_omn26666.py -q --no-cov -n 0 -p no:randomly -k ac2
    cwd: .
- id: dod-omn26666-hosted-deploy-check
  description: 'Deploy check the hosted runner can run: the contract declares the check list and the test-repository list, and the node is registered as an onex.nodes entry point. This binds no criterion by itself.'
  source: manual
  checks:
  - check_type: command
    check_value: grep -q 'lane_push:' src/omnimarket/nodes/node_lane_push_effect/contract.yaml
    cwd: .
  - check_type: command
    check_value: grep -q 'node_lane_push_effect = ' pyproject.toml
    cwd: .
- id: dod-omn26666-integration-proof
  description: On a lab host, with the node's branch pushed, the node's focused tests run at the pushed sha through onex lab-work and exit 0. Hosted CI holds no lab bus, so only the local Done gate runs this unbound check; the node is never pointed at a repository that is not a test repository.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-26666 --kind test -- uv run --frozen pytest tests/nodes/node_lane_push_effect -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn26666-branch-claim-witness-bus-range
  description: 'The branch-claim check''s parity witness reads its rows through an injected bus rows reader over a window, a reader that does not answer fails the check closed with no file read in its place, and the witness module holds no ledger file read. This binds no criterion by itself (a reader move, not a push-node slice).'
  source: manual
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/test_omn20708_branch_claim_check_handler.py tests/test_omn20708_branch_claim_resolution.py -q --no-cov -n 0 -p no:randomly
    cwd: .
  - check_type: command
    check_value: "! grep -n 'read_text\\|iterdir\\|os.environ\\|ledger_path_env' src/omnimarket/nodes/node_branch_claim_check_effect/handlers/ledger_witness_reader.py"
    cwd: .
- id: dod-omn26666-census-runtime-reader-cleared
  description: 'The ledger file census holds the omnimarket ratchet at 102 files with the branch-claim check contract and its handler test no longer counted.'
  source: manual
  checks:
  - check_type: command
    check_value: "! grep -n 'node_branch_claim_check_effect/contract.yaml\\|tests/test_omn20708_branch_claim_check_handler.py' src/omnimarket/nodes/node_work_ledger_file_census_effect/ratchet.yaml"
    cwd: .
