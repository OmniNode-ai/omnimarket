---
schema_version: "1.0.0"
ticket_id: "OMN-19976"
title: "The local runtime serves contract-declared projection exposures from the local store through an onex dashboard shim"
summary: "onex dashboard starts a loopback process that serves this install's contract-declared projection exposures from the local store, every read going through the projection read node. This contract binds AC1, the local-mode test file this change adds. The ticket's AC2 (Runs ids equal the store's set after 20 lab delegations) is a lab readback, not a repo test, and is not claimed here."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-local-serving-mode"
    statement: |-
      The local dashboard process serves only contract-declared exposures from the local store, through the read node, scoped to this install's tenant.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: tests/projection/test_api_server_local_mode.py asserts: every served exposure comes from a contract with projection_api.expose: true; an undeclared topic answers 404; a declared empty table answers 200 with an empty list and as_of: null; no SQL text lives outside the adapter; another tenant's rows answer 422 -- falsifier: that test file run with uv run pytest fails any case
evidence_requirements:
  - kind: "tests"
    description: "The local-mode test file passes against a real two-tenant SQLite store."
    command: "uv run pytest tests/projection/test_api_server_local_mode.py -q"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn19976-ac1-local-mode"
    description: "The local-mode tests: declared-only catalogue, 404 for an undeclared topic, 200 with rows [] and as_of null for an empty table, no SQL outside the adapter, 422 for another tenant."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/projection/test_api_server_local_mode.py -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC1"]
  - id: "dod-omn19976-dod1-concurrent-first-writes"
    description: "DoD1: concurrent first writes on a fresh SQLite store all land; each missing column is added once under the write lock (12 fresh stores, 8 barrier-started writers each, 0 errors and 8 rows per store)."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/projection/test_sqlite_ensure_columns_concurrent_writes_omn19976.py -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["DoD1"]
  - id: "dod-omn19976-local-store-declared-columns"
    description: "The local-mode tests run against a store the real delegation writer created, and the local store carries every column a delegation exposure declares, in a fresh store and in one created before this change. They fail where the store creates delegation_events with fewer columns than the Runs exposure declares."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/projection/test_api_server_local_mode.py tests/unit/projection/test_sqlite_delegation_events_declared_columns_omn19976.py -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC1"]
  - id: "dod-omn19976-correlation-trace-tenant-scoped"
    description: "The local dashboard serves delegation correlation-trace.v1 from the store, tenant-scoped and with cost_usd: the exposure is bus_backed with key_columns [correlation_id] and tenant_column tenant_id, and both delegation writers republish the stored row to every per-row exposure, each topic carrying only its own declared columns. These fail at the merge base, where the exposure is not bus-backed and the writers refuse a second bus-backed per-row exposure."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/projection/test_sqlite_delegation_events_declared_columns_omn19976.py tests/test_omn18140_delegation_writer_attestation.py tests/integration/test_omn17773_delegation_aggregate_snapshot_seam.py -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC1"]
