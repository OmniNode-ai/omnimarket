schema_version: 1.0.0
ticket_id: OMN-26739
title: An in-process onex delegate run on a 200 MB local store finishes its store migration in seconds instead of spinning a core until timeout
summary: recompute_run_savings resolved the counterfactual baseline, which parses the pricing manifest (about 150 ms), once per stored run, so a store of tens of thousands of runs spun for hours in _apply_store_steps. The baseline is now resolved once per pass, and each store step runs under a declared bound (120 s, overridable by ONEX_STORE_STEP_BOUND_SECONDS) that fails typed with StoreStepBoundExceededError, naming the step and rolling its write back.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn26739-store-steps
  statement: A large local store opens in seconds with each store step applied once, and a store step that cannot finish fails typed within its bound.
  acceptance:
  - id: AC1
    statement: 'AC1: a test with a recorded store of the same shape and size completes the store steps in under 10 s and applies each step once -- falsifier: uv run pytest tests -k apply_store_steps_large_store'
  - id: AC2
    statement: 'AC2: a store step that cannot finish names itself and fails typed within its declared bound, never spinning silently -- falsifier: uv run pytest tests -k apply_store_steps_bounded'
evidence_requirements:
- kind: tests
  description: The large-store and bounded-step tests, written first.
  command: uv run pytest tests/unit/projection/test_omn26739_store_steps_large_store.py -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn26739-large-store
  description: A store of 30000 runs with every step unrecorded opens in under 10 s, the baseline is resolved once, each step is recorded once and a second open reapplies nothing.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/projection/test_omn26739_store_steps_large_store.py -q --no-cov -n 0 -p no:randomly -k apply_store_steps_large_store
    cwd: .
- id: dod-omn26739-bounded-step
  description: A step run past its bound raises StoreStepBoundExceededError naming the step, rolls the write back and records nothing; the next open applies it.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/projection/test_omn26739_store_steps_large_store.py -q --no-cov -n 0 -p no:randomly -k apply_store_steps_bounded
    cwd: .
- id: dod-omn26739-integration-proof
  description: On a lab host, at the pushed sha, the large-store and bounded-step tests run (a 30000-run store opens in under 10 s); hosted CI holds no lab bus, so only the local Done gate runs this unbound check (the lab reading is in the PR's Lab line).
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-26739 --kind test -- uv run --frozen pytest tests/unit/projection/test_omn26739_store_steps_large_store.py -q --no-cov
    cwd: .
