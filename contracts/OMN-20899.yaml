---
schema_version: "1.0.0"
ticket_id: "OMN-20899"
title: "The hand-authored OCC defer reads suffixed evidence ids"
summary: "The autobind contention guard reads a hand-authored companion's suffixed evidence ids (dod-<slug>-pr-<n>-<what>), so a companion whose evidence names other PRs no longer defers every PR on its ticket. Covered by the OMN-15247 contention seam tests."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-suffixed-evidence-ids-scope-the-defer"
    statement: |-
      The hand-authored companion defer must read suffixed evidence ids, skip ids naming another PR number, and keep the defer when a dod id names no PR or names this PR under a slug that might be this repo.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: companion_may_cover_pr reads dod-<slug>-pr-<n>-<suffix> ids, the three 2026-10-10 hand-authored companions no longer cover omniclaude#2655, #2656 or #2657, and an id naming no PR keeps the defer -- falsifier: env -u PYTHONPATH uv run pytest tests/unit/test_occ_contention_omn_15247.py -q -k SuffixedEvidenceIds
evidence_requirements:
  - kind: "tests"
    description: "The contention seam and autobind guard tests pass."
    command: "env -u PYTHONPATH uv run pytest tests/unit/test_occ_contention_omn_15247.py tests/unit/nodes/node_pr_lifecycle_fix_effect/test_occ_autobind_contention_omn_15247.py -q"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-suffixed-evidence-ids-scope-the-defer-ac1"
    description: "The contention tests prove a suffixed evidence id for another PR does not defer this one."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/test_occ_contention_omn_15247.py -q -k SuffixedEvidenceIds"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC1"]
