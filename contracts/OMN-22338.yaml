schema_version: 1.0.0
ticket_id: OMN-22338
title: 'T18c group 4: serve the two example-envelope routes from runtime nodes'
summary: >
  POST /envelopes/example and GET /v1/envelopes/example are each served by the
  runtime through a contract-declared HTTP mount, one node contract per route.
  Every value of the example comes from the contract config or a lane overlay
  document; no handler reads the environment. The recorded-fixture replay test
  is present and runs once the T18b corpus lands. Nothing switches a caller or
  stops the API container here.
is_seam_ticket: false
interface_change: true
interfaces_touched: [public_api, protocols]
requirements:
  - id: example-envelope-runtime-nodes
    statement: Serve each example-envelope route from its own runtime node through the contract-declared HTTP mount.
    acceptance:
      - id: AC1
        statement: 'AC1: POST /envelopes/example and GET /v1/envelopes/example are each answered by the runtime through a contract-declared http_mount, one node contract per route, and the moved onex-api tests for both routes pass under the in-memory and the Redpanda profile -- falsifier: uv run pytest over the new node test directories in both profiles, run on a lab host through lab-run'
      - id: AC2
        statement: 'AC2: the mounted app reads no environment variable and holds no literal application name, version or example value outside the contract and its overlay -- falsifier: a pytest case that builds the app from a test overlay with distinct values and fails unless both responses carry the overlay values'
      - id: AC3
        statement: 'AC3: the T18b fixture subset for these two method-and-path identities replays against the mounted app with no unmasked difference -- falsifier: a pytest replay test that reads the T18b corpus (OMN-22158) for the two identities and fails on any unmasked difference'
evidence_requirements:
  - kind: tests
    description: Route-pinning behaviour tests, the runtime mount in the in-memory profile, and the AC2 refusal tests.
    command: uv run --frozen pytest tests/nodes/node_envelope_example_post_effect/test_http_ingress.py tests/nodes/node_envelope_example_post_effect/test_both_mounts_together.py tests/nodes/node_envelope_example_post_effect/test_http_runtime_profiles.py tests/nodes/node_envelope_example_get_effect/test_http_ingress.py tests/nodes/node_envelope_example_get_effect/test_http_runtime_profiles.py tests/nodes/node_envelope_example_post_effect/test_overlay_fail_closed.py tests/nodes/node_envelope_example_get_effect/test_overlay_fail_closed.py -q --no-cov --refuse-skips
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: envelope-example-in-memory
    description: >
      The moved route-pinning tests (contract binding, anonymous access, the
      example envelope shape, other methods and paths refused) pass against the
      mounted app, and the real runtime HTTP server serves both routes through
      the contract mounts with the in-memory identity source bound.
    source: manual
    binds_ac: [AC1]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/nodes/node_envelope_example_post_effect/test_http_ingress.py tests/nodes/node_envelope_example_post_effect/test_both_mounts_together.py tests/nodes/node_envelope_example_post_effect/test_http_runtime_profiles.py tests/nodes/node_envelope_example_get_effect/test_http_ingress.py tests/nodes/node_envelope_example_get_effect/test_http_runtime_profiles.py -q --no-cov --refuse-skips
        cwd: .
  - id: envelope-example-redpanda
    description: >
      The same runtime mount test with the production no-argument factory and
      the system identity source beside an isolated auth-required Redpanda
      broker. The routes do no bus I/O; the broker is present, not used.
    source: manual
    binds_ac: [AC1]
    checks:
      - check_type: test_passes
        check_value: env ONEX_ENVELOPE_EXAMPLE_TEST_PROFILE=redpanda uv run --frozen pytest tests/nodes/node_envelope_example_post_effect/test_http_runtime_profiles.py tests/nodes/node_envelope_example_post_effect/test_both_mounts_together.py tests/nodes/node_envelope_example_get_effect/test_http_runtime_profiles.py -q --no-cov --refuse-skips
        cwd: .
  - id: envelope-example-overlay-fail-closed
    description: >
      Both responses carry distinct overlay values, a changed environment
      changes nothing, a broken overlay, missing contract settings and a
      mismatched handler binding refuse to build, and a scan of every node and
      shared module finds no environment read and no literal name, version or
      example value.
    source: manual
    binds_ac: [AC2]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/nodes/node_envelope_example_post_effect/test_overlay_fail_closed.py tests/nodes/node_envelope_example_get_effect/test_overlay_fail_closed.py -q --no-cov --refuse-skips
        cwd: .
  - id: envelope-example-replay-machinery
    description: >
      Hosted binding for AC3 while the T18b corpus (OMN-22158) is absent. The
      replay machinery runs on synthetic pairs written from a live response of
      the mounted app: a matching pair with named masking replays clean, an
      unmasked difference is caught, and a masking rule is honoured. This is
      the machinery AC3 will run on the recorded corpus; it is not the corpus
      replay, and AC3 stays OPEN until the local-gate item
      envelope-example-replay-pending reads the corpus and passes.
    source: manual
    binds_ac: [AC3]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/nodes/node_envelope_example_post_effect/test_t18b_replay_machinery.py -q --no-cov --refuse-skips
        cwd: .
  - id: envelope-example-replay-pending
    description: >
      AC3 is OPEN and evidence arrives with the T18b corpus (OMN-22158). This
      item binds no criterion: the hosted receipt gate runs a local_done_gate
      item neither at the head nor at the merge base (OMN-22403). The replay
      tests select the pairs of the two identities from the corpus named
      by ONEX_T18B_CORPUS_DIR and fail on any unmasked difference. Under
      --refuse-skips this check fails while the corpus is unset or holds none of
      the identities, so it cannot pass before the corpus lands. The machinery
      is also exercised on synthetic pairs, which is not AC3 evidence.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: test_passes
        check_value: env ONEX_T18B_CORPUS_DIR="$HOME/lab-run/saved/t18b-corpus" uv run --frozen pytest tests/nodes/node_envelope_example_post_effect/test_t18b_replay.py tests/nodes/node_envelope_example_get_effect/test_t18b_replay.py -q --no-cov --refuse-skips
        cwd: .
  - id: envelope-example-integration-proof
    description: >
      The pushed head ran both profile legs of the runtime mount tests on a lab
      host through lab-work. Hosted CI cannot reach the lab, so only the local
      Done gate runs this check. It binds no criterion; AC1 is bound by the
      two hosted test items above.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: >-
          uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-22338 -- env ONEX_ENVELOPE_EXAMPLE_TEST_PROFILE=redpanda uv run --frozen pytest tests/nodes/node_envelope_example_post_effect/test_http_runtime_profiles.py tests/nodes/node_envelope_example_post_effect/test_both_mounts_together.py tests/nodes/node_envelope_example_get_effect/test_http_runtime_profiles.py -q --no-cov --refuse-skips
        cwd: .
  - id: envelope-example-published-source-probe
    description: >
      Hosted deploy check of the published source at this checkout's exact
      commit: each served contract declares its route's http_mount prefix and
      the served factory module defines create_app. It checks the published
      artifact, not a running deployment.
    source: manual
    checks:
      - check_type: command
        check_value: |-
          set -euo pipefail;
          probe_dir=$(mktemp -d);
          trap 'rm -rf "$probe_dir"' EXIT;
          root="https://raw.githubusercontent.com/OmniNode-ai/omnimarket/$(git rev-parse HEAD)/src/omnimarket/nodes";
          for node in node_envelope_example_post_effect node_envelope_example_get_effect; do
            curl --fail --silent --show-error --location --max-time 30 "$root/$node/contract.yaml" --output "$probe_dir/$node.yaml";
            curl --fail --silent --show-error --location --max-time 30 "$root/$node/handlers/http_app.py" --output "$probe_dir/$node.py";
            grep -q '^http_mount:' "$probe_dir/$node.yaml";
            grep -q '^def create_app' "$probe_dir/$node.py";
          done;
          grep -q 'path_prefix: "/envelopes/example"' "$probe_dir/node_envelope_example_post_effect.yaml";
          grep -q 'path_prefix: "/v1/envelopes/example"' "$probe_dir/node_envelope_example_get_effect.yaml"
        cwd: .
