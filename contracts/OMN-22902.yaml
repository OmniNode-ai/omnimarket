  description: The planted module is red and the same head without it is green, with the failing control.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/nodes/node_code_graph_effect/test_pr_check.py -q --no-cov
- id: dod-omn22902-ac2
  description: The shadow logs what it would refuse over the declared repositories and holds no merge.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/nodes/node_code_graph_effect/test_pr_check_shadow.py tests/unit/nodes/node_code_graph_effect/test_pr_check_shadow_chain_events.py -q --no-cov
- id: dod-omn22902-ac3
  description: An allowlist entry holds until its date and reads as a finding from it.
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/nodes/node_code_graph_effect/test_allowlist_expiry.py -q --no-cov
- id: dod-omn22902-floor-shadow
