---
schema_version: "1.0.0"
ticket_id: "OMN-26129"
title: "OpenRouter dropped cohere/north-mini-code:free, cheap_frontier's only rung, so Routing Tier Bindability fails on every omnimarket PR; a smoked free model takes the rung"
summary: "OpenRouter stopped listing cohere/north-mini-code:free, cheap_frontier's only rung, so the provider-catalogue step of Routing Tier Bindability failed on every omnimarket pull request. The rung moves to nvidia/nemotron-3.5-super-vl:free with north-mini-code's placement unchanged, after the tier's 10-task smoke accepted it 10 of 10. The tier stays free: paid OpenRouter models reach it only through the code eval (RULING 2026-11-11T12:33:37Z, OMN-23751)."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-omn26129-listed-free-rung"
    statement: |-
      cheap_frontier's rung is a free OpenRouter model the provider lists, smoked at or above the bar, and nothing packaged names the withdrawn model.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: the cheap_frontier rung serves a free OpenRouter model that the provider catalogue lists and whose recorded smoke accepted 7 or more of 10, and no packaged backend declares a model OpenRouter no longer lists -- falsifier: uv run python -m omnimarket.nodes.node_provider_model_catalogue_effect exits non-zero, or uv run pytest tests/unit/routing/test_cheap_frontier_smoke_evidence_omn20376.py -q fails
      - id: "AC2"
        statement: |-
          AC2: no packaged routing, placement or judge configuration names cohere/north-mini-code:free or openrouter-north-mini-code as a live backend, and the tests that pinned it name the new rung -- falsifier: uv run pytest tests/unit/routing tests/unit/delegation tests/validators/test_provider_model_catalogue.py -q fails
      - id: "AC5"
        statement: |-
          AC5: the smoke is recorded: each candidate's 2026-11-20 row in the cheap_frontier smoke receipts with its model, accepted count and p50, the ten task prompts stored beside them -- falsifier: the receipts have no 2026-11-20 rows, or the placed model's row accepted fewer than 7
      - id: "AC7"
        statement: |-
          AC7 (replaces AC5; closeout sweep 2026-11-22T0945Z, comment dbab7908): each measured candidate's 2026-11-20 row in the cheap_frontier smoke receipts records its model, accepted count and p50, each unmeasured candidate records its model and why it was not measured, and the ten task prompts are stored beside them -- falsifier: the 2026-11-20 receipt has a measured row without its model, accepted count or p50, an unmeasured candidate without its model or the reason it was not measured, or fewer than ten stored task prompts
  - id: "req-omn26129-tier-stays-free"
    statement: |-
      cheap_frontier stays free; paid models reach it only through the code eval.
    acceptance:
      - id: "AC3"
        statement: |-
          AC3: DeepSeek V4 Flash 0731 and Qwen 3.8 are not placed on the cheap_frontier ladder by this change; they join through the code eval as pinned-only arms (OMN-23751) -- falsifier: bifrost_delegation.yaml or routing_tiers.yaml places a deepseek or qwen3.8 OpenRouter backend on cheap_frontier
      - id: "AC4"
        statement: |-
          AC4: cheap_frontier stays declared free (cost_type free_local, 0.0) and its rung is priced 0/0 in the provider catalogue, and the routing-completeness and free-before-paid ladder tests pass -- falsifier: the rung's catalogue price is above zero, or uv run pytest tests/unit/routing tests/unit/delegation tests/validators -q fails
evidence_requirements:
  - kind: "tests"
    description: "The catalogue, smoke-evidence, withdrawal and free-tier tests."
    command: "uv run pytest tests/validators/test_provider_model_catalogue.py tests/nodes/node_provider_model_catalogue_effect tests/unit/routing/test_cheap_frontier_smoke_evidence_omn20376.py tests/unit/routing/test_cheap_frontier_stays_free_omn26129.py tests/unit/routing/test_north_mini_spread_omn17427.py tests/unit/routing/test_cheap_frontier_closeout_omn26129.py -q -n 0 --no-cov"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn26129-ac1-listed-and-smoked"
    description: "The provider-catalogue tests read the 2026-11-20 capture, which lists the new rung and not north-mini-code; the smoke-evidence tests read every dated smoke and hold the ladder's rung at or above the bar of 7, Nemotron 3.5 Super at 10 of 10. Fails at the merge base, whose contract still declares north-mini-code."
    source: "manual"
    binds_ac: ["AC1"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/validators/test_provider_model_catalogue.py tests/nodes/node_provider_model_catalogue_effect tests/unit/routing/test_cheap_frontier_smoke_evidence_omn20376.py -q -n 0 --no-cov"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn26129-ac2-withdrawn-and-renamed"
    description: "Routing, placement and judge: no parsed value in any packaged YAML or JSON file under src/omnimarket names cohere/north-mini-code:free or openrouter-north-mini-code (the routing contract, routing_tiers.yaml and the three judge configs are asserted to be among the files scanned, and a file that does not parse fails the check); and the independent-judge selector the delegate dispatch port calls, run over the packaged backends for every model family it knows, picks a judge and never the withdrawn rung. North-mini-code never declared the judge capability, so that half held before omnimarket#6491 too; a planted withdrawn judge proves the check sees one. The pinning tests: the eight test files omnimarket#6491 re-pointed name openrouter-nemotron-3-5-super, seven of them name neither withdrawn id (the eighth, tests/validators/test_provider_model_catalogue.py, keeps them as named constants to assert the withdrawal), the ladder's only cheap_frontier rung is that backend, and all eight run and pass here. Other tests that still name the old id assert it against their own fixture contracts and never read the packaged rung. Controls plant a withdrawn backend, a withdrawn judge and a test still pinning the old rung, and each is caught. Fails at the merge base through the scan and the pinning tests, where north-mini-code is still declared."
    source: "manual"
    binds_ac: ["AC2"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/routing/test_cheap_frontier_closeout_omn26129.py::test_no_packaged_routing_placement_or_judge_config_names_the_withdrawn_rung tests/unit/routing/test_cheap_frontier_closeout_omn26129.py::test_the_scan_catches_a_planted_withdrawn_rung_and_refuses_an_unreadable_file tests/unit/routing/test_cheap_frontier_closeout_omn26129.py::test_the_judge_never_selects_the_withdrawn_rung tests/unit/routing/test_cheap_frontier_closeout_omn26129.py::test_the_judge_check_catches_a_planted_withdrawn_judge tests/unit/routing/test_cheap_frontier_closeout_omn26129.py::test_the_tests_that_pinned_the_old_rung_name_the_new_one tests/unit/routing/test_cheap_frontier_closeout_omn26129.py::test_the_pinning_check_catches_a_test_still_pinning_the_old_rung tests/validators/test_provider_model_catalogue.py tests/unit/delegation/test_active_cloud_tiers_omn16891.py tests/unit/delegation/test_delegation_tier_escalation.py tests/unit/delegation/test_openrouter_review_reasoning_omn19432.py tests/unit/delegation/test_review_judge_flag_omn20910.py tests/unit/routing/test_nemotron_ultra_withdrawn_omn20376.py tests/unit/routing/test_north_mini_spread_omn17427.py tests/unit/routing/test_placement_render_parity_omn17427.py -q -n 0 --no-cov"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn26129-ac3-no-paid-model-on-the-tier"
    description: "No deepseek or qwen3.8 model is placed on cheap_frontier, and every rung on it is free and listed at 0/0 in the 2026-11-20 capture; its control injects a paid rung and an unlisted rung and both are caught. Fails at the merge base, whose rung the capture does not list. Both placement routes are read: a backend bifrost_delegation.yaml declares on the tier, and a backend routing_tiers.yaml lists in the tier's models list, resolved through bifrost's backends (test_cheap_frontier_no_eval_only_placement_omn26129); planted copies place a DeepSeek and a mixed-case Qwen 3.8 backend through that list and each is caught, and an entry that names no backend_id, a backend bifrost does not declare, or a file without the tier fails closed."
    source: "manual"
    binds_ac: ["AC3"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/routing/test_cheap_frontier_stays_free_omn26129.py tests/unit/routing/test_cheap_frontier_no_eval_only_placement_omn26129.py -q -n 0 --no-cov"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn26129-ac4-complete-free-before-paid"
    description: "cheap_frontier is declared free_local at 0.0 and its rung is priced 0/0 in the 2026-11-20 capture (test_cheap_frontier_stays_free_omn26129), and in the same run the routing-completeness tests the ticket names (OMN-15630 test_routing_completeness_omn15630, OMN-17427 test_tier_order_backend_coverage_omn17427, OMN-15503 test_cloud_routing_contract_integrity_omn15503) and the free-before-paid ladder tests (OMN-14224/OMN-14225 ordering in test_active_cloud_tiers_omn16891 and test_delegation_tier_escalation, the free tier ahead of every metered one in test_prose_free_tier_ladder_omn13640, the never-silent-paid rung price in test_openrouter_slug_seam_omn15638, and the paid-escalation gate of OMN-14225 in test_paid_escalation_gate_omn14225) pass, with --refuse-skips so a skipped test fails the check."
    source: "manual"
    binds_ac: ["AC4"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/routing/test_cheap_frontier_stays_free_omn26129.py tests/unit/delegation/test_routing_completeness_omn15630.py tests/unit/delegation/test_tier_order_backend_coverage_omn17427.py tests/unit/delegation/test_cloud_routing_contract_integrity_omn15503.py tests/unit/delegation/test_active_cloud_tiers_omn16891.py tests/unit/delegation/test_delegation_tier_escalation.py tests/unit/delegation/test_prose_free_tier_ladder_omn13640.py tests/unit/delegation/test_openrouter_slug_seam_omn15638.py tests/unit/delegation/test_paid_escalation_gate_omn14225.py -q -n 0 --no-cov --refuse-skips"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn26129-ac5-smoke-recorded"
    description: "The 2026-11-20 smoke receipt and its candidate set, pinned: the one measured candidate, the placed Nemotron 3.5 Super, has its model, an accepted count within its task count (10 of 10, against the bar of 7) and a positive p50_seconds, and ran as many tasks as prompts are stored; the two other candidates (gemma-4-31b-it:free and ling-3.2-flash:free) were never measured because OpenRouter answered 429 when the key was registered for them, so they have no accepted count or p50, and each records that 429 and is not on the ladder; the ten task prompts are stored in the same receipt, each with its name, task type and full text, in the 7 summarization, 1 review, 1 code_generation, 1 test mix. Controls remove a p50, an accepted count, the unmeasured rows, a 429 reason, a prompt or a prompt's text, swap the measured candidate, change the mix or place an unmeasured model, and each is caught."
    source: "manual"
    binds_ac: ["AC5"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/routing/test_cheap_frontier_closeout_omn26129.py::test_every_candidate_row_is_recorded_with_model_accepted_and_p50 tests/unit/routing/test_cheap_frontier_closeout_omn26129.py::test_no_unmeasured_candidate_is_on_the_ladder tests/unit/routing/test_cheap_frontier_closeout_omn26129.py::test_the_ladder_check_catches_an_unmeasured_model_placed tests/unit/routing/test_cheap_frontier_closeout_omn26129.py::test_the_ten_prompts_are_stored_beside_the_rows tests/unit/routing/test_cheap_frontier_closeout_omn26129.py::test_the_receipt_checks_catch_each_planted_gap tests/unit/routing/test_cheap_frontier_smoke_evidence_omn20376.py -q -n 0 --no-cov"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn26129-ac7-measured-and-unmeasured-recorded"
