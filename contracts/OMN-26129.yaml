        check_value: "uv run pytest tests/unit/routing/test_cheap_frontier_closeout_omn26129.py::test_every_candidate_row_is_recorded_with_model_accepted_and_p50 tests/unit/routing/test_cheap_frontier_closeout_omn26129.py::test_no_unmeasured_candidate_is_on_the_ladder tests/unit/routing/test_cheap_frontier_closeout_omn26129.py::test_the_ladder_check_catches_an_unmeasured_model_placed tests/unit/routing/test_cheap_frontier_closeout_omn26129.py::test_the_ten_prompts_are_stored_beside_the_rows tests/unit/routing/test_cheap_frontier_closeout_omn26129.py::test_the_receipt_checks_catch_each_planted_gap tests/unit/routing/test_cheap_frontier_smoke_evidence_omn20376.py -q -n 0 --no-cov"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn26129-ac7-measured-and-unmeasured-recorded"
    description: "AC7, which replaces AC5 as written: the 2026-11-20 receipt records the one measured candidate (the placed Nemotron 3.5 Super) with its model, an accepted count within its task count and a positive p50_seconds; records each unmeasured candidate (gemma-4-31b-it:free and ling-3.2-flash:free) with its model and why it was not measured (OpenRouter's 429 at key registration), off the ladder; and stores the ten task prompts beside them, each with its name, task type and full text. The same receipt checks AC5's binding ran; their controls remove a p50, an accepted count, the unmeasured rows, a 429 reason, a prompt or a prompt's text, and each is caught."
    source: "manual"
