schema_version: 1.0.0
ticket_id: OMN-23125
title: The floor counts a remote lane's streamed output as progress, so a live lane is never shown as stalled and its red row reads owned
summary: The floor's build_lanes measured a lane's silence from ledger rows only, and remote lanes write none between CLAIM and TERMINAL, so live lanes were dropped as stalled and their red rows read nobody on them. The receipt now carries output_at (the mtime of the .out file beside it, read by the source loader) and silence counts from the newer of that and the last ledger row, only for the claim's own unfinished run. The 45-minute stall bound is unchanged and no check is widened.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23125-lane-output-progress
  statement: A remote lane whose streamed output grew inside the stall bound is not marked stalled, and its red row reads work under way.
  acceptance:
  - id: AC1
    statement: 'AC1: a remote lane whose streamed output grew inside the stall bound is not marked stalled, and a lane with neither output nor ledger rows inside the bound still is -- falsifier: uv run pytest omnimarket tests for node_factory_floor_effect build_lanes with the three recorded lane ages'
  - id: AC2
    statement: 'AC2: on the served floor after install, a red row with a running owner lane reads work_under_way true -- falsifier: curl floor-simple.json and read causes\[\].work_under_way for a row whose owner lane is running'
evidence_requirements:
- kind: tests
  description: The build_lanes output-progress tests (three recorded lane ages and the controls) and the receipt loader test pass.
  command: uv run --frozen pytest tests/nodes/node_factory_floor_compute/test_floor_lanes.py tests/nodes/node_factory_floor_effect/test_floor_lane_sources.py -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23125-ac1-tests
  description: Runs the build_lanes tests built from the three recorded lane ages (streamed output inside the bound keeps the lane, no output keeps it stalled, output at the bound does not save it, a finished or previous-run receipt is not progress) and the receipt loader test for output_at.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_factory_floor_compute/test_floor_lanes.py tests/nodes/node_factory_floor_effect/test_floor_lane_sources.py -q --no-cov
    cwd: .
- id: dod-omn23125-ac2-served-floor
  description: 'Evidence for AC2: the served floor record, read after the publisher installed from the branch ran a cycle, has at least one cause with a lane and every cause with a lane reads work_under_way true.'
  source: manual
  execution_scope: local_done_gate
  binds_ac:
  - AC2
  checks:
  - check_type: command
    check_value: >-
      uv run python -c 'import json,os; d=json.load(open(os.path.expandvars("$OMNI_HOME/.claude_scratch/factory-floor/floor-simple.json"))); c=[x for x in d["causes"] if x["lanes"]]; assert c and all(x["work_under_way"] for x in c), [(x["id"], x["work_under_way"]) for x in d["causes"]][:20]'
    cwd: .
- id: dod-omn23125-integration-proof
  description: Run this pull request's own check on a lab host at the pushed head. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23125 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_factory_floor_compute/test_floor_lanes.py tests/nodes/node_factory_floor_effect/test_floor_lane_sources.py -q --no-cov
    cwd: .
