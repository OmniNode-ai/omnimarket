schema_version: "1.0.0"
ticket_id: "OMN-22097"
title: "Dev runtime spans reach Phoenix: the exporter posts to the wrong path and the runtime has one span site"
summary: >-
  The factory floor record carries the Phoenix trace count and the newest span age. node_factory_floor_effect reads
  them from the Phoenix GraphQL API at the URL the ONEX_FACTORY_FLOOR_PHOENIX_URL variable names and passes them to
  node_factory_floor_compute, which puts them in floor.phoenix_traces for the machinery panel to draw. A read that
  fails is recorded as unread with the exception class, never as a count of zero. The panel row itself is not drawn
  by this change.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-omn22097-floor-phoenix-reading"
    statement: |-
      The floor record carries the Phoenix trace count and the newest span age, read from the Phoenix API through a configured URL.
    acceptance:
      - id: "AC5"
        statement: |-
          AC5: the Phoenix trace count and the newest span age appear as a row on the machinery panel of the factory floor, read from the Phoenix API -- falsifier: the served floor page has no row carrying both values, or the age does not grow while no span arrives
