  description: 'AC1: the contract''s priority.red_checks block and the handler without a literal check id or class (test_contract_declares_the_red_check_input, test_handler_holds_no_check_id_and_no_declared_class_in_code)'
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_lab_placement_compute/test_red_check_priority.py tests/nodes/node_lab_fill_effect/test_red_check_order_lab_fill.py -q -n 0 --no-cov -p no:cacheprovider
    cwd: .
- id: dod-omn26624-ac2
  description: 'AC2: the red and the green resolution of the same ticket text (test_red_check_in_ticket_text_takes_the_declared_class, test_same_lane_with_the_check_green_resolves_as_today)'
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_lab_placement_compute/test_red_check_priority.py tests/nodes/node_lab_fill_effect/test_red_check_order_lab_fill.py -q -n 0 --no-cov -p no:cacheprovider
    cwd: .
- id: dod-omn26624-ac3
  description: 'AC3: the lab fill places the row naming a red check before an MVP row in the one free slot and reports a red check no row names (test_red_check_order_lab_fill.py); the remote-lane queue and runner half is the plugin change of the same ticket'
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_lab_placement_compute/test_red_check_priority.py tests/nodes/node_lab_fill_effect/test_red_check_order_lab_fill.py -q -n 0 --no-cov -p no:cacheprovider
    cwd: .
- id: dod-omn26624-ac4
  description: 'AC4: the six recorded 2026-11-23 lanes (fixture tests/nodes/node_lab_placement_compute/fixtures/red_check_1123/claims.json) resolve to other without the input and to the declared class with it (test_red_check_recorded_lanes_were_other_and_now_take_the_declared_class)'
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_lab_placement_compute/test_red_check_priority.py tests/nodes/node_lab_fill_effect/test_red_check_order_lab_fill.py -q -n 0 --no-cov -p no:cacheprovider
    cwd: .
- id: dod-omn26624-ac5
  description: 'AC5: an unreadable or unread result is reported and the lane falls back (test_unreadable_result_is_reported_and_the_lane_falls_back_as_today, test_reader_with_every_source_unreadable_is_unreadable_not_green)'
  source: manual
  binds_ac:
