    check_value: uv run pytest tests/nodes/node_lab_placement_compute/test_red_check_priority.py tests/nodes/node_lab_fill_effect/test_red_check_order_lab_fill.py -q -n 0 --no-cov -p no:cacheprovider
    cwd: .
- id: dod-omn26624-integration-proof
  description: the red-check placement and fill tests run on a lab host at the pushed head; hosted CI cannot reach the lab, so only the local Done gate runs this unbound check
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-26624 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_lab_placement_compute/test_red_check_priority.py tests/nodes/node_lab_fill_effect/test_red_check_order_lab_fill.py -q --no-cov
