schema_version: 1.0.0
ticket_id: OMN-23943
title: The landing test and the promise check stop reporting success when they read nothing real
summary: The landing canary node reads UNKNOWN, with a named reason, from a backend that is not operational; the commitment check runner reports how many commitments it read and how many were live, and exits 4 when none are live.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn23943-real-readings
  statement: A scheduled unit on a lab host never reports success from a backend or a source that proves nothing.
  acceptance:
  - id: AC1
    statement: "AC1: a landing canary run on the in-memory backend never reads WORKING and names the reason -- falsifier: uv run pytest tests/unit/nodes/node_landing_canary_effect/test_canary_backend_refusal.py -q -p no:randomly --no-cov fails at the merge base"
  - id: AC2
    statement: "AC2: the commitment check runner prints read and live counts and exits 4 when no commitment is live -- falsifier: uv run pytest tests/nodes/node_commitment_check_runner_effect/test_commitment_cli.py -q -p no:randomly --no-cov fails at the merge base"
  - id: AC3
    statement: "AC3: integrated: on host h053 the installed commitment check unit run reads at least one live commitment and names it, and the daily landing canary unit run reads UNKNOWN from the in-memory backend -- falsifier: the unit's output log lacks a commitment id line with checked greater than zero, or the landing canary log still shows verdict=WORKING with backend=inmemory"
evidence_requirements:
- kind: tests
  description: The landing canary and commitment check runner tests pass at the pushed head.
  command: uv run pytest tests/unit/nodes/node_landing_canary_effect tests/nodes/node_commitment_check_runner_effect -q -p no:randomly --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn23943-ac1
  description: 'AC1: the backend refusal tests pass at the head; four canary tests fail with the handler at its merge-base state.'
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/nodes/node_landing_canary_effect/test_canary_backend_refusal.py -q -p no:randomly --no-cov
    cwd: .
- id: dod-omn23943-ac2
  description: 'AC2: the CLI, handler and chain event tests of the commitment check runner pass at the head; the empty-source CLI test fails at the merge base where the run exits 0.'
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_commitment_check_runner_effect -q -p no:randomly --no-cov
    cwd: .
- id: dod-omn23943-ac3
  description: 'hosted proxy for AC3: the unit-level tests that stand in for the installed units pass here; the reading of the two h053 units after the merge is posted as a pull request comment naming the head.'
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/unit/nodes/node_landing_canary_effect/test_canary_backend_refusal.py tests/nodes/node_commitment_check_runner_effect/test_commitment_cli.py -q -p no:randomly --no-cov
    cwd: .
- id: dod-omn23943-integration-proof
  description: the canary and commitment check runner tests run on a lab host at the pushed head, including the empty-source test that fails at the merge base; hosted CI cannot reach the lab, so only the local Done gate runs this unbound check
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23943 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/nodes/node_landing_canary_effect/test_canary_backend_refusal.py tests/nodes/node_commitment_check_runner_effect/test_commitment_cli.py -q --no-cov -p no:randomly
