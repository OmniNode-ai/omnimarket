---
schema_version: 1.0.0
ticket_id: OMN-25564
title: "onex run-node resolves its workspace roots from the runtime profile and names an unresolved forward target"
summary: "The runtime bus forwarder found the hosted lane's declaration from OMNIBASE_PATH and
  ONEX_WORKSPACE_CONFIG_ROOT read from the process environment only, so on a host where neither was exported by
  hand the forward ended DelegateLaneSelectionError and nothing said why. The forwarder now resolves each root from
  its environment, else from the unit environment files the host installer renders under the host config directory
  (the declaration of the per-host workspace config root overlay), and its refusal names each unresolved root and
  every place it looked. The non-zero exit of onex run-node for an undelivered run is omnibase_core's change in
  its own pull request."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn25564-forwarder-roots
    statement: "The forwarder resolves both workspace roots from the host declaration and names an unresolved one."
    acceptance:
      - id: AC1
        statement: "AC1: with OMNIBASE_PATH and ONEX_WORKSPACE_CONFIG_ROOT both unset, onex run-node resolves each
          from the declared runtime profile or host config and forwards the event, and no path literal is added to
          the code -- falsifier: a pytest unit test that unsets both variables, red at the base commit and green at
          the head, plus a grep of the diff for an absolute home or volume path"
      - id: AC2
        statement: "AC2: when the forward target cannot be resolved the command exits non-zero and prints the missing
          name and where it looked, instead of reporting not_delivered with exit 0 -- falsifier: a pytest unit test
          that removes the declaration and asserts the exit code and the message, red at the base commit and green
          at the head"
      - id: AC3
        statement: "AC3: integrated: on lab host h051 with both variables unset one onex run-node forwards one event
          to the dev lane and h053 reads it back by message id -- falsifier: onex run-node on h051 then a consumer
          read-back of the dev bus from h053 for that message id returns the event, and the same run on the base
          commit reads not_delivered"
evidence_requirements:
  - kind: tests
    description: The forwarder unit tests pass, including the workspace-root cases.
    command: "uv run pytest tests/unit/nodes/node_runtime_bus_forward_effect -q --no-cov -o addopts='' -n 0"
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn25564-ac1
    description: "With both roots unset the lane resolver receives both from the host declaration."
    source: manual
    execution_scope: hosted_and_local
    binds_ac:
      - AC1
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/unit/nodes/node_runtime_bus_forward_effect/test_forward_workspace_roots.py -q --no-cov -o addopts='' -n 0"
        cwd: ${OMNI_HOME}/omnimarket
  - id: dod-omn25564-ac2
    description: "With no declaration the forwarder refusal names each root and where it looked."
    source: manual
    execution_scope: hosted_and_local
    binds_ac:
      - AC2
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/unit/nodes/node_runtime_bus_forward_effect/test_forward_workspace_roots.py::test_ac2_no_declaration_refuses_naming_each_root_and_where_it_looked -q --no-cov -o addopts='' -n 0"
        cwd: ${OMNI_HOME}/omnimarket
  - id: dod-omn25564-integration-proof
    description: "AC3 lab proxy: the change's focused tests run on a lab host at the pushed head; the run of onex
      run-node on h051 with both variables unset and the read on h053 by message id are recorded in the lane
      STATUS row and are not claimed by this local check."
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: "env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha \"$(git rev-parse HEAD)\" --lane dod-integration-proof-25564 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/nodes/node_runtime_bus_forward_effect/test_forward_workspace_roots.py -q --no-cov -p no:randomly"
        cwd: ${OMNI_HOME}/omnimarket
  - id: dod-omn25564-ac3
    description: "AC3 hosted proxy: the forwarder tests, including the workspace-root cases that fail at the base, pass at the head; the lab run on h051 and read-back on h053 are recorded in the PR body."
    source: manual
    execution_scope: hosted_and_local
    binds_ac:
      - AC3
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/unit/nodes/node_runtime_bus_forward_effect/test_forward_workspace_roots.py -q --no-cov -o addopts='' -n 0"
        cwd: ${OMNI_HOME}/omnimarket
  - id: dod-omn25564-merge-local-keep
    description: "After merging dev, a forward with no declared hosted bus keeps the events locally and does not demand workspace roots."
    source: manual
    execution_scope: hosted_and_local
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/unit/nodes/node_runtime_bus_forward_effect/test_forward_workspace_roots.py::test_no_overlay_keeps_events_locally_and_does_not_demand_workspace_roots -q --no-cov -o addopts='' -n 0"
        cwd: ${OMNI_HOME}/omnimarket
