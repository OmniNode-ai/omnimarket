schema_version: 1.0.0
ticket_id: OMN-22672
title: The factory floor site serves a favicon set, an SVG, a 32 px PNG and an apple-touch icon, linked from every page
summary: Every page of the factory floor site carried an empty icon and no icon file was published, so a tab showed the browser's blank page glyph. The publish now writes three icons drawn from one gear mark in the site's own blue to the root of the serving directory, ahead of the pages, and every page head links them with a path that resolves from where the page is served. The simple floor page tints its SVG icon by the record's level.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn22672-favicon-set
  statement: The site's icons are named by the contract, published with the pages and linked from every page head; the simple floor's SVG icon takes the colour of the record's level and reads grey when the record is old or its level is unknown.
  acceptance:
  - id: AC1
    statement: 'AC1: the publish writes favicon.svg, favicon-32.png and apple-touch-icon.png to the serving directory beside the pages, named by the contract and drawn from a mark in the site''s own colours with no third-party artwork -- falsifier: uv run --frozen pytest src/omnimarket/nodes/node_factory_floor_publish_effect/tests/test_favicon.py tests/nodes/node_factory_floor_publish_effect/test_factory_floor_publish.py -q --no-cov'
  - id: AC2
    statement: 'AC2: every page head of the site (simple, detail, floor, reports index and the three report pages) links the SVG, the 32 px PNG and the apple-touch icon with a path that resolves from where the page is served -- falsifier: uv run --frozen pytest src/omnimarket/nodes/node_factory_floor_publish_effect/tests/test_favicon.py -q --no-cov'
  - id: AC3
    statement: 'AC3: the simple page sets its icon from the record''s level (green, amber, red) and a page-draw test with level red fails when the tint code is removed -- falsifier: uv run --frozen pytest src/omnimarket/nodes/node_factory_floor_publish_effect/tests/test_favicon.py -q --no-cov'
  - id: AC4
    statement: 'AC4: after a branch install of the publisher, a read of each of the three icon paths on the served site returns HTTP 200 with the right content type -- falsifier: the installed unit''s last-run.json lists the three icons as published after one tick, and a curl of each path on the served site returns 200 with image/svg+xml or image/png'
evidence_requirements:
- kind: tests
  description: The icon files, the contract names, every page head link and the simple page's tint by level
  command: uv run --frozen pytest src/omnimarket/nodes/node_factory_floor_publish_effect/tests/test_favicon.py tests/nodes/node_factory_floor_publish_effect -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn22672-icons-and-links
  description: The three icon files exist at the sizes their names say, use only the site's colours, every page head links them by a path that resolves from where the page is served, the publish writes them to the serving directory, and the simple page tints its SVG icon by level (green, amber, red) and draws grey for an old record or an unknown level.
  source: manual
  binds_ac:
  - AC1
  - AC2
  - AC3
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest src/omnimarket/nodes/node_factory_floor_publish_effect/tests/test_favicon.py tests/nodes/node_factory_floor_publish_effect -q --no-cov
    cwd: .
- id: dod-omn22672-integration-proof
  description: Run this pull request's own check on a lab host at the pushed head. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-22672 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest src/omnimarket/nodes/node_factory_floor_publish_effect/tests/test_favicon.py tests/nodes/node_factory_floor_publish_effect -q --no-cov
    cwd: .
- id: dod-omn22672-ac4-served-icons
  description: AC4, as far as the publisher's own record allows. The installed unit's last run lists the three icons as published.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: uv run python -c 'import json,os; d=json.load(open(os.path.expandvars("$HOME/.local/state/omni/factory-floor-publish/last-run.json"))); assert {"favicon.svg","favicon-32.png","apple-touch-icon.png"} <= set(d["published"]), "icons not published"'
    cwd: .
