---
schema_version: "1.0.0"
ticket_id: OMN-26148
title: "prove 6 merged L0 changes running on h051 (floor-fill store dsn key, stability refresh serve)"
summary: The floor fill live settings accept the store_dsn_env_file overlay key and read the DSN variable from that file, so the floor fill tick no longer refuses on that key.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn26148-floor-fill-dsn-file-key
    statement: The floor fill live profile accepts the store_dsn_env_file overlay key.
    acceptance:
      - id: AC1
        statement: "AC1: for each of the six changes the lane names the cause of the failing unit as code, overlay key or outside-owner credential, with the file and the h051 read time -- falsifier: a line of the six has no named cause or file in the lane's STATUS row"
      - id: AC2
        statement: "AC2: every cause fixable by code or overlay is a PR handed to the landing controller, and the unit is read exit 0 on h051 after it lands -- falsifier: ssh h051 systemctl --user show onex-floor-fill-tick -p ExecMainStatus reads non-zero after the PR merged"
evidence_requirements:
  - kind: tests
    description: Focused tests for the live settings and the env file read.
    command: uv run pytest src/omnimarket/nodes/node_floor_fill_orchestrator/tests/test_floor_fill_live_binding.py -q --no-cov
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-omn26148-ac1
    description: "The live profile accepts store_dsn_env_file and reads the DSN variable from it; a file without the variable still names the variable."
    source: manual
    binds_ac: [AC1]
    checks:
      - check_type: test_passes
        check_value: >-
          uv run pytest src/omnimarket/nodes/node_floor_fill_orchestrator/tests/test_floor_fill_live_binding.py -q --no-cov -k 'store_dsn_env_file or env_file'
  - id: dod-omn26148-ac2
    description: "The existing live binding tests still pass with the new optional key."
    source: manual
    binds_ac: [AC2]
    checks:
      - check_type: test_passes
        check_value: >-
          uv run pytest src/omnimarket/nodes/node_floor_fill_orchestrator/tests/test_floor_fill_live_binding.py -q --no-cov
  - id: dod-omn26148-integration-proof
    description: "Run the focused floor fill live binding tests on a lab host at the pushed head; the local Done gate runs this unbound check."
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-26148 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest src/omnimarket/nodes/node_floor_fill_orchestrator/tests/test_floor_fill_live_binding.py -q --no-cov
        cwd: .
  - id: dod-omn26148-brake-stop-policy-ac1
    description: "The live binder's brake is also engaged when fewer hosts admit a lane than brake_min_admitting_hosts, and its stop signal asks the stop gate with the stop_modes policy of the live settings; a stale snapshot is an unread brake, an enforced class with no citation is refused naming the key, and an open stop with no mode refuses."
    source: manual
    binds_ac: [AC1]
    checks:
      - check_type: test_passes
        check_value: >-
          uv run pytest tests/nodes/node_floor_fill_orchestrator/test_floor_fill_live_sources.py -q --no-cov
        cwd: .
  - id: dod-omn26148-brake-stop-policy-ac2
    description: "The existing live seam binding tests, which bind the pool, brake and stop signal through the one live binder, still pass with the brake and the stop policy added, and the unit settings dump lists the new brake and stop keys and the brake and stop policy tests pass."
    source: manual
    binds_ac: [AC2]
    checks:
      - check_type: test_passes
        check_value: >-
          uv run pytest src/omnimarket/nodes/node_floor_fill_orchestrator/tests/test_floor_fill_live_seam_binding.py src/omnimarket/nodes/node_floor_fill_orchestrator/tests/test_floor_fill_schedule_live.py tests/nodes/node_floor_fill_orchestrator/test_floor_fill_live_sources.py -q --no-cov
        cwd: .
  - id: dod-omn26148-brake-stop-policy-integration-proof
    description: "The brake and stop policy tests run on a lab host at the pushed head; hosted CI cannot reach the lab, so only the local Done gate runs this unbound check."
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-26148 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_floor_fill_orchestrator/test_floor_fill_live_sources.py -q --no-cov
        cwd: .
