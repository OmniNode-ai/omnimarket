    check_value: uv run --frozen pytest tests/unit/nodes/node_ledger_rows_loader_effect/test_file_rows_match_the_node_rows.py -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn24057-ac2
  description: A roll marker line is not a row line, a continuation after a blank line stays with its row, and the node rows and the file rows agree (seam test).
  source: manual
