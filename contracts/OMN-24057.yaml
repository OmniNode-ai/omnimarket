schema_version: 1.0.0
ticket_id: OMN-24057
title: The file fallback of the work record rows loader reads each row once and no marker lines
summary: The rows loader's file fallback read a ledger file that holds a row twice as two rows and handed the archive roll marker lines to its caller as row lines. The node's answer holds each row once and no marker line. The fallback now keeps one copy of each whole row (first line plus continuation lines), skips roll marker lines, and keeps a continuation line that follows a blank line with its row, so a fallback answer carries the rows the node answer carries.
is_seam_ticket: true
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24057-file-fallback-rows
  statement: The file fallback answers the same rows the node answers; a repeated row is read once and a roll marker line is never a row line.
  acceptance:
  - id: AC1
    statement: 'AC1: the file fallback of the rows loader reads a row that the file holds twice once, whole, with its continuation lines. -- falsifier: uv run pytest tests/unit/nodes/node_ledger_rows_loader_effect/test_file_rows_match_the_node_rows.py -k "written_twice or repeated_multi_line or different_continuations"'
  - id: AC2
    statement: 'AC2: an archive roll marker line is never a row line, and a continuation line after a blank line stays with its row; the node rows and the file rows agree on a file that holds both artifacts. -- falsifier: uv run pytest tests/unit/nodes/node_ledger_rows_loader_effect/test_file_rows_match_the_node_rows.py -k "roll_marker or after_a_blank or seam_the_node_rows"'
  - id: AC3
    statement: 'AC3: error chain: an outage with no ledger file is unreadable with no rows, never an empty answer, and the counted fallback reads each row once. -- falsifier: uv run pytest tests/unit/nodes/node_ledger_rows_loader_effect/test_file_rows_match_the_node_rows.py -k "error_chain or counted_fallback"'
  - id: AC4
    statement: 'AC4: integrated: on a lab host running this revision the fallback reader over the live ledger file for a 168 hour window holds no repeated row lines and no roll marker lines. -- falsifier: read the live ledger file for 168 hours through FileRowsReader on the lab host and count repeated lines and lines starting with the roll marker prefix; both must be 0'
evidence_requirements:
- kind: tests
  description: The rows loader tests pass at the pushed head.
  command: uv run --frozen pytest tests/unit/nodes/node_ledger_rows_loader_effect -q --no-cov -n 0 -p no:randomly
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
