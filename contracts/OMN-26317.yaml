schema_version: 1.0.0
ticket_id: OMN-26317
title: onex setup treats a missing local model server as an optional step on the customer path and still fails a configured server that is broken
summary: 'The models step of onex setup is skipped with one line when no model server is named, so a customer on the cloud route (own key, no local model server) finishes setup with exit 0 when every required step passed. A server that is named but does not answer still fails setup, and the typed failure names the server and the cause. No other step becomes optional.'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn26317-models-optional
    statement: The models step is skipped with one line when no model server is configured, a configured server that does not answer keeps the hard failure with its server and cause in the typed result, and no other setup step, test, baseline or ratchet changes.
    acceptance:
      - id: AC1
        statement: "AC1: a clean-machine unattended setup with no model server configured exits 0 when every required step passed, and prints exactly one skip line naming the bring-your-own-key or cloud route and the command that adds a local model later -- falsifier: uv run pytest tests/unit/nodes/node_onex_setup_effect -k models_optional -q exits non-zero at the pull request head, or the same test passes on omnimarket dev before the change"
      - id: AC2
        statement: "AC2: a configured but unreachable model server still fails setup with a non-zero exit and a typed failure that names the server and the cause -- falsifier: uv run pytest tests/unit/nodes/node_onex_setup_effect -k models_configured_unreachable -q exits non-zero at the pull request head, or exits zero against a handler that skips every models failure"
      - id: AC3
        statement: "AC3: no other check is weakened: no test removed, skipped or xfailed, no baseline or ratchet widened, every other setup step still fails setup when it fails -- falsifier: git diff origin/dev --stat shows a removed test file, or uv run pytest tests/unit/nodes/node_onex_setup_effect tests/nodes/node_onex_setup_effect -q exits non-zero at the pull request head"
      - id: AC4
        statement: "AC4: one pull request against dev with the tests red first and green after, ready, and handed to landing-controller by one MSG -- falsifier: grep -c 'to=landing-controller' over the lane's own ledger rows reads 0, or the pull request base is not dev"
evidence_requirements:
  - kind: tests
    description: The setup node suites, including the models_optional and models_configured_unreachable selections, pass at the pushed head.
    command: uv run pytest tests/unit/nodes/node_onex_setup_effect tests/nodes/node_onex_setup_effect -q --no-cov -p no:cacheprovider
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-omn26317-ac1
    description: "AC1: with no provider, model or URL named, the unattended setup (inline flags and the node's local-runtime command) exits 0, the JSON journal reads the models step as skipped, and exactly one output line names the no-local-model-server skip, the bring-your-own-key route and the onex models add local command; the selection fails at the merge base."
    source: manual
    binds_ac: [AC1]
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/nodes/node_onex_setup_effect -k models_optional -q --no-cov -p no:cacheprovider
        cwd: .
  - id: dod-omn26317-ac2
    description: "AC2: a named server whose model step fails keeps exit 1 and the failure status, and the models observation evidence holds the provider, the server and the cause, with a supplied credential redacted; the selection fails at the merge base."
    source: manual
    binds_ac: [AC2]
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/nodes/node_onex_setup_effect -k models_configured_unreachable -q --no-cov -p no:cacheprovider
        cwd: .
  - id: dod-omn26317-ac3
    description: "AC3: the setup node suites other than the terminal-interface files pass at the pushed head, and that run includes the new models tests, so it fails at the merge base. The terminal-interface files run as the unbound items dod-omn26317-ac3-tui-*, because the whole of both suites together runs longer than the hosted per-check budget and was recorded as unverifiable. The diff removes no test file and changes no baseline, ratchet or required-check configuration."
    source: manual
    binds_ac: [AC3]
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/nodes/node_onex_setup_effect tests/nodes/node_onex_setup_effect --ignore-glob='*test_onex_tui*' -q --no-cov -p no:cacheprovider
        cwd: .
  - id: dod-omn26317-ac3-tui-main
    description: "AC3 remainder, unbound: the main terminal-interface test file of the setup node passes at the pushed head."
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/nodes/node_onex_setup_effect/test_onex_tui.py -q --no-cov -p no:cacheprovider
        cwd: .
  - id: dod-omn26317-ac3-tui-local-servers
    description: "AC3 remainder, unbound: the local-servers terminal-interface test file of the setup node passes at the pushed head."
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/nodes/node_onex_setup_effect/test_onex_tui_local_servers.py -q --no-cov -p no:cacheprovider
        cwd: .
  - id: dod-omn26317-ac3-tui-rest-1
    description: "AC3 remainder, unbound: every other terminal-interface test file of the setup node, first half of an even split, passes at the pushed head."
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/nodes/node_onex_setup_effect --ignore-glob='*test_onex_tui.py' --ignore-glob='*test_onex_tui_local_servers.py' -k onex_tui --splits 2 --group 1 -q --no-cov -p no:cacheprovider
        cwd: .
  - id: dod-omn26317-ac3-tui-rest-2
    description: "AC3 remainder, unbound: every other terminal-interface test file of the setup node, second half of an even split, passes at the pushed head."
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/nodes/node_onex_setup_effect --ignore-glob='*test_onex_tui.py' --ignore-glob='*test_onex_tui_local_servers.py' -k onex_tui --splits 2 --group 2 -q --no-cov -p no:cacheprovider
        cwd: .
  - id: dod-omn26317-ac4
    description: "AC4: the pull request base, its red-then-green test record and the hand-off message to the landing controller are read from the pull request body and the rolling ledger after the hand-off; the hosted proxy is the focused selection that carries the new tests."
    source: manual
    binds_ac: [AC4]
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/nodes/node_onex_setup_effect -k "models_optional or models_configured_unreachable" -q --no-cov -p no:cacheprovider
        cwd: .
  - id: dod-omn26317-integration-proof
    description: 'Run the setup node suites on a lab host at the pushed head. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check. It binds no acceptance criterion.'
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-26317 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/nodes/node_onex_setup_effect tests/nodes/node_onex_setup_effect -q --no-cov
        cwd: .
