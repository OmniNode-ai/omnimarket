    check_value: uv run --frozen pytest tests/unit/nodes/node_topic_reaper_compute/test_handler_topic_reaper.py -k "executors_not_the_handlers" -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn21594-integration-proof
  description: The reaper's tests run at the pushed head on a lab host through the lab work node; they need a lab host and about a minute, so only the local Done gate runs it, and it binds no criterion.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-21594 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/unit/nodes/node_topic_reaper_compute -q --no-cov -n 0 -p no:randomly
    cwd: .
