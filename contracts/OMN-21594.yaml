    check_value: uv run --frozen pytest tests/unit/nodes/node_topic_reaper_compute/test_handler_topic_reaper.py -k "baseline_and_protected" -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn21594-ac5
  description: An unfinished-work reference blocks the deletion until it clears.
  source: manual
  binds_ac:
  - AC5
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/unit/nodes/node_topic_reaper_compute/test_handler_topic_reaper.py -k "unfinished_work" -q --no-cov -n 0 -p no:randomly
    cwd: .
- id: dod-omn21594-ac6
  description: The age_out and delete_by_id transitions run through core's executor and age_out fires with the injected value only.
  source: manual
