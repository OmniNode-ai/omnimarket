requirements:
- id: req-topic-reaper
  statement: The criteria AC1 to AC6 of the ticket, transcribed from the ticket body; the ticket body is the source and this block is the copy.
  acceptance:
  - id: AC1
    statement: 'AC1: with the overlay interval set to three days and an injected clock, withdrawing a contract flags its topic and deletes nothing at day zero or day two; a re-announcement on day two clears the flag; with no re-announcement and two quiet observations the topic is deleted by topic id on day three -- falsifier: a deletion before day three, a flag that survives a re-announcement, or no deletion at day three.'
  - id: AC2
    statement: 'AC2: A topic with a live group member or moving end offsets is never deleted and returns to flagged -- falsifier: a deletion.'
  - id: AC3
    statement: 'AC3: With no `flag_to_delete_days` in the overlay nothing is ever deleted and `REAPER_POLICY_MISSING` is reported -- falsifier: a deletion, or no report.'
  - id: AC4
    statement: 'AC4: A baseline or control topic is never flagged -- falsifier: a flag.'
  - id: AC5
    statement: 'AC5: A topic referenced by stored state or a pending emission of an older package generation is not deleted at day three or later while the reference stands, and is deleted after it clears and the quiet observations hold -- falsifier: a deletion while referenced.'
  - id: AC6
    statement: 'AC6: The reaper machine runs through core''s real FSM transition executor with the injected `interval_elapsed` value, and the `age_out` transition fires at day three and not at day two -- falsifier: a transition that never fires, or fires early.'
