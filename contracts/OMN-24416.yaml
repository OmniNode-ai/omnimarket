schema_version: "1.0.0"
ticket_id: "OMN-24416"
title: "Runner group read through the write node names no permission for a rejected login"
summary: "The write-node read path of node_runner_group_exposure_effect names the declared App permission only for an organization read refused with 403 or 404, as the direct path already does. A 401 reads org-read-denied and names no permission."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-omn24416-rejected-login"
    statement: |-
      A runner group read refused through the write node with HTTP 401 reads org-read-denied and names no permission, while 403 and 404 still name the declared permission.
    acceptance:
      - id: "AC1"
        statement: "AC1: a runner group read refused through the write node with HTTP 401 reads org-read-denied and names no permission, while 403 and 404 still name the declared permission -- falsifier: test_error_chain_a_rejected_login_at_the_write_node_names_no_permission in tests/nodes/node_runner_group_exposure_effect/test_bus_group_read.py fails at the base, where a 401 names the declared permission"
      - id: "AC2"
        statement: "AC2: the rest of the exposure effect's tests still pass -- falsifier: uv run pytest tests/nodes/node_runner_group_exposure_effect -q --no-cov"
      - id: "AC3"
        statement: "AC3: integrated, read in the running runtime on h053: the installed tree of onex-runner-group-exposure-hourly.service contains this change and one hourly run prints a reading line whose reason cells name no permission for a 401 -- falsifier: the install record shows a revision without this change"
evidence_requirements:
  - kind: "tests"
    description: "The exposure effect's golden chain, error chain and bus group read tests, including the write-node denial chain."
    command: "uv run pytest tests/nodes/node_runner_group_exposure_effect -q --no-cov"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn24416-rejected-login-names-no-permission"
    description: "A 401 refusal at the write node names no permission while 403 and 404 still name the declared permission; the tests fail at the base where a 401 names the declared permission."
    source: "manual"
    binds_ac: ["AC1", "AC2", "AC3"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_runner_group_exposure_effect -q --no-cov"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn24416-integration-proof"
    description: "Run the exposure effect's tests on a lab host at the pushed head. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check. It binds no acceptance criterion: the runtime reading (AC3) is read on h053 after the unit tree is reinstalled."
    source: "manual"
    execution_scope: "local_done_gate"
    checks:
      - check_type: "command"
        check_value: "env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha \"$(git rev-parse HEAD)\" --lane dod-integration-proof-24416 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest tests/nodes/node_runner_group_exposure_effect -q --no-cov"
        cwd: "."
