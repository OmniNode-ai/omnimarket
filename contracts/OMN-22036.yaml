schema_version: 1.0.0
ticket_id: OMN-22036
title: Compaction arm producer with forked, isolated runs
summary: Adds a contract-driven arm producer using shared case and ground-truth schemas, isolated frozen
  inputs, native headless compaction and pinned pack builds, explicit recorded-stock refusal semantics,
  and append-only context and usage records.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-compaction-arm-producer
  statement: Produce isolated compaction arms from one pinned case and retain refusal and contamination
    evidence.
  acceptance:
  - id: AC1
    statement: 'AC1: the arms differ only at the compaction -- falsifier: unequal prefix or ledger hashes
      across arms of a case'
  - id: AC2
    statement: 'AC2: a `stock_rerun` that shows any custom-boundary evidence is `INVALID` -- falsifier:
      such a fork scored'
  - id: AC3
    statement: 'AC3: if the headless compaction premise fails, the stage records `REFUSED` for `stock_rerun`
      and uses `stock_recorded` -- falsifier: a report that hides the refusal'
evidence_requirements:
- kind: tests
  description: Focused arm producer suite, including the in-memory profile.
  command: uv run pytest tests/nodes/node_compaction_arm_run_effect -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-compaction-arm-ac1
  description: 'AC1: the arms differ only at the compaction -- falsifier: unequal prefix or ledger hashes
    across arms of a case'
  source: manual
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_compaction_arm_run_effect/test_arm_run.py -k "equal_initial
      or changed_prefix or ledger_hash or adapter_cannot_change" -q --no-cov
    cwd: .
  binds_ac:
  - AC1
- id: dod-compaction-arm-ac2
  description: 'AC2: a `stock_rerun` that shows any custom-boundary evidence is `INVALID` -- falsifier:
    such a fork scored'
  source: manual
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_compaction_arm_run_effect/test_arm_run.py -k "custom_boundary_stock"
      -q --no-cov
    cwd: .
  binds_ac:
  - AC2
- id: dod-compaction-arm-ac3
  description: 'AC3: if the headless compaction premise fails, the stage records `REFUSED` for `stock_rerun`
    and uses `stock_recorded` -- falsifier: a report that hides the refusal'
  source: manual
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_compaction_arm_run_effect/test_arm_run.py -k "refused_premise
      or refusal_observed" -q --no-cov
    cwd: .
  binds_ac:
  - AC3
- id: dod-compaction-arm-deploy-contract
  description: At the checked-out revision the runtime handler, declared bus ports, entry point and CI
    gate resolve.
  source: manual
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_compaction_arm_run_effect/test_arm_run.py -k contract_registers
      -q --no-cov
    cwd: .
- id: dod-compaction-arm-node-redpanda-profile
  description: The same node and fixture run on the Redpanda profile. The declared broker/security overlay
    is required; an absent overlay fails rather than downgrading to in-memory.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: test_passes
    check_value: env ONEX_COMPACTION_ARM_TEST_PROFILE=redpanda uv run pytest tests/nodes/node_compaction_arm_run_effect/test_arm_run.py
      -k same_fixture_on_both_profiles -q --no-cov
    cwd: .
- id: dod-compaction-arm-integration-proof
  description: The pushed head ran the arm producer suite on a lab host and exited 0. Hosted CI cannot
    reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-22036 -- uv run --frozen pytest tests/nodes/node_compaction_arm_run_effect -q --no-cov
    cwd: .
