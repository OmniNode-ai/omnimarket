---
schema_version: "1.0.0"
ticket_id: "OMN-21965"
title: "Per-session counters: red CI introduced, reverts, corrections, retracted claims (plan task CM.5)"
summary: >-
  node_session_defect_count_compute is a pure compute node. From typed slices of the local pull request watcher snapshot (check-run history per head), reverts and ledger CORRECTION rows it counts defects per session and per equal, non-overlapping window around each boundary, per merged pull request. Known ci-watch non-defect classes are removed first, one pull request's failure signalled several ways is one defect, and a session with no merged pull request reports no denominator.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-omn21965-defect-counters"
    statement: "The node counts red CI introduced, reverts within 7 days, CORRECTION rows and retracted claims per merged pull request, per session and per window."
    acceptance:
      - id: "AC1"
        statement: "AC1: each known non-defect class in the `ci-watch` list is excluded by a named test -- falsifier: uv run pytest tests/nodes/node_session_defect_count_compute -q --no-cov -k nondefect_classes"
      - id: "AC2"
        statement: "AC2: the count is per merged pull request and a session with none reports \"no denominator\", not zero -- falsifier: uv run pytest tests/nodes/node_session_defect_count_compute -q --no-cov -k 'rate_is_per_merged or no_denominator'"
      - id: "AC3"
        statement: "AC3: the data source for check-run history per head is named in the PR with a readback -- falsifier: uv run pytest tests/nodes/node_session_defect_count_compute -q --no-cov -k check_run_history_source"
      - id: "AC4"
        statement: "AC4: two overlapping boundary windows, and one pull request's failure signalled as a red check, a revert and a CORRECTION, each yield one defect owned by one window -- falsifier: uv run pytest tests/nodes/node_session_defect_count_compute -q --no-cov -k 'window_ownership or cross_signal_dedup'"
evidence_requirements:
  - kind: "tests"
    description: "Defect counter tests for OMN-21965."
    command: "uv run pytest tests/nodes/node_session_defect_count_compute -q --no-cov"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn21965-ac1"
    description: "Each of the nine ci-watch non-defect classes is excluded by its own named test, and a real red still counts."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_session_defect_count_compute -q --no-cov -k nondefect_classes"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC1"]
  - id: "dod-omn21965-ac2"
    description: "The rate divides by merged pull requests; a session or window with none reports no denominator and no rate."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_session_defect_count_compute -q --no-cov -k 'rate_is_per_merged or no_denominator'"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC2"]
  - id: "dod-omn21965-ac3"
    description: "The check-run source (watcher snapshot prs[...].ci) is a named constant in the model; the readback is in the PR body Lab line."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_session_defect_count_compute -q --no-cov -k check_run_history_source"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC3"]
  - id: "dod-omn21965-ac4"
    description: "Overlapping windows own each event once and a three-signal failure collapses to one defect in one window."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_session_defect_count_compute -q --no-cov -k 'window_ownership or cross_signal_dedup'"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC4"]
  - id: "dod-omn21965-integration-proof"
    description: "The pushed head ran the defect counter tests on a lab host with its real dependencies and exited 0. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check."
    source: "manual"
    execution_scope: "local_done_gate"
    checks:
      - check_type: "command"
        check_value: "uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha \"$(git rev-parse HEAD)\" --lane defect-count-integration-proof-1102 -- uv run --frozen pytest tests/nodes/node_session_defect_count_compute -q --no-cov"
        cwd: "."
