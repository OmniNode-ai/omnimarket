schema_version: "1.0.0"
ticket_id: OMN-23146
title: "Stage 1 of unused-code removal: the leftovers of one archived repository leave the build with their tests and then go as one batch, and a public mention of the repository keeps them"
summary: >-
  The stage 1 batch of the unused-code removal runs on the two existing nodes. node_code_quarantine_effect takes each leftover
  entity of one archived repository out of the build with its tests for 7 days, reads the build and the lab runtime start
  without it, restores it with the clock reset on a red gate, and removes the batch only with one tag and one catalog row per
  entity. node_public_consumer_check_compute now also takes the archived repository's names: a public mention of one of them
  that has no recorded resolution keeps every entity of the batch, and the result records each mention and why. The standing
  run's per-entity verdicts and the first live batch are not in this change; they are named in the pull request.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn23146-stage-1-archived-leftovers
    statement: One archived repository's leftovers are quarantined, read clean, and removed as one batch with a tag and a catalog row, and a public mention of the repository keeps them with the reason recorded.
    acceptance:
      - id: AC1
        statement: 'AC1: each batch of stage 1 entities is quarantined for 7 days, builds clean and the lab runtime starts without it, then is removed with its tests under a tag and a catalog row -- falsifier: uv run pytest src/omnimarket/nodes/node_code_quarantine_effect -q -k stage_1_batch'
      - id: AC2
        statement: 'AC2: a public mention of an archived repository keeps its entities and the batch records why -- falsifier: uv run pytest src/omnimarket/nodes/node_public_consumer_check_compute -q -k archived_repository_mention'
evidence_requirements:
  - kind: tests
    description: The stage 1 batch reads on the quarantine node and the archived-repository mention reads on the public-consumer check, with the existing suites of both nodes.
    command: uv run --frozen pytest src/omnimarket/nodes/node_code_quarantine_effect src/omnimarket/nodes/node_public_consumer_check_compute -q --no-cov
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
