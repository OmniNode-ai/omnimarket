        check_value: |-
          bash -o pipefail -c 'curl --fail --silent --show-error "https://raw.githubusercontent.com/OmniNode-ai/omnimarket/$(git rev-parse HEAD)/src/omnimarket/nodes/node_public_consumer_check_compute/handlers/handler_public_consumer_check.py" | cmp - src/omnimarket/nodes/node_public_consumer_check_compute/handlers/handler_public_consumer_check.py'
        cwd: .
  - id: dod-omn23146-integration-proof
    description: The pushed head ran both node suites on a lab host through the lab work runner and exited 0. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
    source: manual
