    description: The AC1 falsifier of the ticket passes.
    source: manual
    execution_scope: hosted_and_local
    binds_ac: [AC1]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest src/omnimarket/nodes/node_code_quarantine_effect -q --no-cov -k stage_1_batch
        cwd: .
  - id: dod-omn23146-ac2
    description: The AC2 falsifier of the ticket passes.
    source: manual
    execution_scope: hosted_and_local
    binds_ac: [AC2]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest src/omnimarket/nodes/node_public_consumer_check_compute -q --no-cov -k archived_repository_mention
        cwd: .
  - id: dod-omn23146-deploy-source-readback
    description: 'Hosted-runner deploy source readback: the published public-consumer handler at the evaluated commit must equal the checkout byte for byte. This checks published source; the lab run of the nodes from the branch is in the pull request body.'
    source: manual
