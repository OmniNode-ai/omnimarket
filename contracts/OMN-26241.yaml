schema_version: 1.0.0
ticket_id: OMN-26241
title: The factory dashboard publish serves the previous slot's cached probe read, marked pending, while a probe's current-slot run is unfinished, so beta_board and mvp_launch_reads stop reading their source every cycle
summary: 'The beta board probes and the MVP launch block read their sources through one shared slot read in node_source_read_cache_effect. While a slot''s run is unfinished the newest cached read is served marked pending since the slot, with its own read time, and the source is re-checked at most once per the contract''s pending_recheck_interval_minutes (15). The missing-workflow lookup is counted apart from misses, and the publish status carries each step''s cache tally with a red row for a step that stores nothing and reads its source for 3 cycles in a row.'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn26241-pending-slot-read
  statement: A step whose probe's current-slot run is unfinished serves the previous read marked pending instead of reading its source on every cycle, and the publish status shows the cache tally and its red row.
  acceptance:
  - id: AC1
    statement: 'AC1: while the current slot''s run is not finished, a probe read returns the newest cached read of the previous slot marked pending with its read time, and the source is re-checked at most once per interval declared in a contract field (default 15 minutes, no hard-coded number) -- falsifier: uv run pytest tests/nodes/node_source_read_cache_effect -q -k pending fails on a fixture of two cycles inside the interval that counts two source reads'
  - id: AC2
    statement: 'AC2: beta_board and mvp_launch_reads both read through one shared helper in node_source_read_cache_effect -- falsifier: uv run pytest tests/nodes/node_source_read_cache_effect -q -k shared_helper fails when either step calls its own slot logic'
  - id: AC3
    statement: 'AC3: the missing-workflow lookup is counted separately so misses mean source misses -- falsifier: uv run pytest tests/nodes/node_source_read_cache_effect -q -k missing_lookup_counted_separately fails on a fixture with one absent workflow that raises misses'
  - id: AC4
    statement: 'AC4: the publish status the dashboard already writes carries each step''s cache tally (hits, misses, stores, source_seconds) and a red row appears when a step stores nothing and reads its source for 3 cycles in a row -- falsifier: uv run pytest tests/nodes/node_factory_floor_publish_effect -q -k cache_tally fails on a fixture of three such cycles with no red row'
  - id: AC5
    statement: 'AC5: a regression test built from the recorded tally lines of 2026-11-20 (fixture path named in the PR) fails on the code before the fix and passes after it -- falsifier: uv run pytest tests/nodes/node_source_read_cache_effect -q -k recorded_tally'
  - id: AC6
    statement: 'AC6: one probe read is timed and the PR body says whether the cost is the onex CLI process start, with a follow-up ticket filed if it is -- falsifier: grep -F ''probe read seconds'' in the PR body finds no timing, or the PR body names the CLI start with no ticket id'
  - id: AC7
    statement: 'AC7: after the branch is installed on the Mac, the next publish cycle shows beta_board and mvp_launch_reads source_seconds under 10 and cycle_seconds under 60 -- falsifier: the next ai.omninode.factory-floor-publish out log tally shows source_seconds of 10 or more for either step, or cycle_seconds of 60 or more'
evidence_requirements:
- kind: tests
  description: The pending, shared helper, missing-lookup, recorded-tally and cache-tally tests pass at the pushed head.
  command: uv run pytest tests/nodes/node_source_read_cache_effect tests/nodes/node_factory_floor_publish_effect/test_cache_tally_status.py -q -p no:randomly --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn26241-ac1
  description: 'AC1: an unfinished slot is served pending with its read time and the source is read once inside the interval; at the merge base the helper does not exist'
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_source_read_cache_effect -q -p no:randomly --no-cov -k pending
    cwd: .
- id: dod-omn26241-ac2
  description: 'AC2: both steps call the shared helper and keep no slot logic of their own'
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_source_read_cache_effect -q -p no:randomly --no-cov -k shared_helper
    cwd: .
- id: dod-omn26241-ac3
  description: 'AC3: the missing-workflow lookup raises absent_lookups and not misses'
  source: manual
  binds_ac:
  - AC3
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_source_read_cache_effect -q -p no:randomly --no-cov -k missing_lookup_counted_separately
    cwd: .
- id: dod-omn26241-ac4
  description: 'AC4: three cycles of no store and source reads give a red row in the served status and the run result'
  source: manual
  binds_ac:
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_factory_floor_publish_effect -q -p no:randomly --no-cov -k cache_tally
    cwd: .
- id: dod-omn26241-ac5
  description: 'AC5: the recorded 2026-11-20 tally (fixture tests/nodes/node_source_read_cache_effect/fixtures/factory_floor_publish_tally_2026-11-20.txt) is reproduced by the old read and costs under 10 seconds of source on the second cycle through the helper'
  source: manual
  binds_ac:
  - AC5
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/nodes/node_source_read_cache_effect -q -p no:randomly --no-cov -k recorded_tally
    cwd: .
- id: dod-omn26241-ac6
  description: 'AC6: the PR body carries the probe read seconds line; the hosted runner has no PR body, so only the local Done gate runs this unbound check'
  source: manual
  binds_ac:
  - AC6
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: onex scm pr-view OmniNode-ai/omnimarket --head omn-26241-slot-pending-read | grep -F 'probe read seconds'
    cwd: .
- id: dod-omn26241-ac7
  description: 'AC7: read on the operator Mac after the branch is installed; the hosted runner cannot reach it, so only the local Done gate runs this unbound check'
  source: manual
  binds_ac:
  - AC7
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: |-
      tail -n 200 "$(launchctl print gui/$(id -u)/ai.omninode.factory-floor-publish | awk -F' = ' '/stdout path/{print $2}')" | grep -E 'source-cache: step=(beta_board|mvp_launch_reads)'
    cwd: .
