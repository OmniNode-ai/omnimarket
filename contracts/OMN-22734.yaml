schema_version: 1.0.0
ticket_id: OMN-22734
title: The main page of the factory floor gets a tab bar with a Process view and a Machines view
summary: The main page of the factory floor (the simple floor, served as index.html) had no tabs and no machine view; machines were reachable only through the Details link to the detail page. It now has a tab bar with Process (the existing view) and Machines (one card per host of floor.host_status in the served factory-floor.json, each value read, stale or unread with its reason), with #process and #machines deep links.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn22734-main-page-machines-tab
  statement: The main page draws a Machines tab with one card per host of the served floor record beside its Process view, opens either tab from its address, and never draws an unreadable, missing or old record as healthy.
  acceptance:
  - id: AC1
    statement: 'AC1: the main page draws one card per host of a recorded served floor record, nine hosts, each with its state and reasons -- falsifier: uv run --frozen pytest src/omnimarket/nodes/node_factory_floor_publish_effect/tests/test_simple_page_machines.py -q --no-cov'
  - id: AC2
    statement: 'AC2: the #process and #machines addresses open their own tab and pane, a change of address switches without a reload and an unknown address opens Process -- falsifier: uv run --frozen pytest src/omnimarket/nodes/node_factory_floor_publish_effect/tests/test_simple_page_machines.py -q --no-cov'
  - id: AC3
    statement: 'AC3: a record that cannot be read, a record with no host_status and an old record each draw their reason and never a healthy card, and the card equals the one the detail page draws -- falsifier: uv run --frozen pytest src/omnimarket/nodes/node_factory_floor_publish_effect/tests/test_simple_page_machines.py -q --no-cov'
  - id: AC4
    statement: 'AC4: the same page with the Machines tab taken out draws no card, so the tests fail without the change -- falsifier: uv run --frozen pytest src/omnimarket/nodes/node_factory_floor_publish_effect/tests/test_simple_page_machines.py -q --no-cov'
evidence_requirements:
- kind: tests
  description: The main page's script run under node against a recorded served floor record and floor-simple record, the error cases and the failing control
  command: uv run --frozen pytest src/omnimarket/nodes/node_factory_floor_publish_effect/tests -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn22734-main-page-tabs
  description: The main page's tab bar, deep links and Machines tab are drawn from the recorded served records, with the error cases and the failing control.
  source: manual
  binds_ac:
  - AC1
  - AC2
  - AC3
  - AC4
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest src/omnimarket/nodes/node_factory_floor_publish_effect/tests/test_simple_page_machines.py -q --no-cov
    cwd: .
- id: dod-omn22734-integration-proof
  description: Run this pull request's own check on a lab host at the pushed head. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-22734 --kind test -- env PYTHONDONTWRITEBYTECODE=1 uv run --frozen pytest src/omnimarket/nodes/node_factory_floor_publish_effect/tests -q --no-cov
    cwd: .
- id: dod-omn22734-ac5-served-page
  description: 'Evidence for no criterion, read at the local Done gate. The served index.html carries the Machines tab.'
  source: manual
  execution_scope: local_done_gate
  checks:
  - check_type: command
    check_value: uv run python -c 'import os,urllib.request; t=urllib.request.urlopen(os.environ["FLOOR_SITE_URL"].rstrip("/") + "/", timeout=30).read().decode(); assert "tab-machines" in t'
    cwd: .
