schema_version: "1.0.0"
ticket_id: "OMN-22674"
title: "The served floor reads the go from the ledger RULING rows and piece 1 from its own code-graph rows"
summary: >-
  The served floor said go 0, "Waiting on your go" and piece 1 not started after the operator had said go to pieces 1 to 6
  and the code graph had written golden and error rows. The go was a number set by hand in the floor overlay and the piece
  events were read only from the emission journal. The floor cycle now reads the RULING rows and the piece event rows
  through the ledger row port, the overlay names the rules, and a ledger that cannot be read draws the go and those events
  as unread with a cause of their own.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-omn22674-go-and-start-from-the-ledger"
    statement: |-
      The floor's go and the start of a piece that writes ledger rows come from the ledger, not from a value set by hand.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: a test built from the two real RULING rows (2026-11-06T12:10:28Z and 2026-11-06T13:16:32Z) gives go through 6, and the old reader on the same input gives 0 and not_started
      - id: "AC2"
        statement: |-
          AC2: a test built from the code-graph golden and error rows gives piece 1 started with a golden and an error event
      - id: "AC3"
        statement: |-
          AC3: a ledger that cannot be read draws the go and the piece events as unread, never as zero or not started
      - id: "AC4"
        statement: |-
          AC4: the served floor read after a branch install shows go_given_through 6, no waiting-on-your-go text for pieces 1 to 6 and piece 1 started
evidence_requirements:
  - kind: "tests"
    description: "The go from the recorded rulings, the piece 1 events from the recorded code-graph rows, and the unreadable ledger."
    command: "uv run --frozen pytest tests/nodes/node_floor_simple_effect/test_go_state_floor_simple.py -q --no-cov"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn22674-ac1-go-state"
    description: "AC1. The two recorded rulings give go 6; the first alone gives 1; the second alone gives 0 because pieces are taken in order; an unrelated ruling moves nothing; a later answer that is not a yes takes the go back; with no rows read the floor says go 0, not started and waiting on the go."
    source: "manual"
    binds_ac: ["AC1"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run --frozen pytest tests/nodes/node_floor_simple_effect/test_go_state_floor_simple.py -q --no-cov -k go_state"
        cwd: "."
  - id: "dod-omn22674-ac2-piece-events"
    description: "AC2. The recorded code-graph rows give two golden chains and one drilled error chain for piece 1; the drill row that still read WORKING is not a golden run; the receipt fold counts piece 1 as started; with the error row missing it is not started."
    source: "manual"
    binds_ac: ["AC2"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run --frozen pytest tests/nodes/node_floor_simple_effect/test_go_state_floor_simple.py -q --no-cov -k piece_events"
        cwd: "."
  - id: "dod-omn22674-ac3-ledger-unreadable"
    description: "AC3. A ledger read that fails, or a route the environment does not name, gives go None, a ledger source cause, no piece drawn not started and no waiting-on-your-go text."
    source: "manual"
    binds_ac: ["AC3"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run --frozen pytest tests/nodes/node_floor_simple_effect/test_go_state_floor_simple.py -q --no-cov -k ledger_unreadable"
        cwd: "."
  - id: "dod-omn22674-floor-suites"
    description: "Evidence for no AC: the floor compute and effect suites still pass with the go read from the ledger."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run --frozen pytest tests/nodes/node_floor_simple_effect tests/nodes/node_floor_simple_compute -q --no-cov"
        cwd: "."
  - id: "dod-omn22674-integration-proof"
    description: "The pushed head runs the floor tests on a lab host through onex lab-work and exits 0. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check."
    source: "manual"
    execution_scope: "local_done_gate"
    checks:
      - check_type: "command"
        check_value: "uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha \"$(git rev-parse HEAD)\" --lane dod-integration-proof-22674 -- uv run --frozen pytest tests/nodes/node_floor_simple_effect tests/nodes/node_floor_simple_compute -q --no-cov"
        cwd: "."
  - id: "dod-omn22674-ac4-floor-tests"
    description: "AC4, the part a test can read: a floor cycle over the recorded rulings and code-graph rows writes go_given_through 6, no waiting-on-your-go text and piece 1 started. The served read after the install is the next item."
    source: "manual"
    binds_ac: ["AC4"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run --frozen pytest tests/nodes/node_floor_simple_effect/test_go_state_floor_simple.py -q --no-cov -k \"has_the_go_and_no_wait or reads_started_on_the_floor\""
        cwd: "."
  - id: "dod-omn22674-served-floor"
    description: "Evidence for no AC: the served floor record, read after the unit installed from the branch runs a cycle, carries go_given_through 6 and piece 1 started."
    source: "manual"
    execution_scope: "local_done_gate"
    checks:
      - check_type: "command"
        check_value: >-
          uv run python -c 'import json,os; d=json.load(open(os.path.expandvars("$OMNI_HOME/.claude_scratch/factory-floor/floor-simple.json"))); assert d["rebuild"]["go_given_through"]==6 and d["pieces"][0]["status"]=="started" and "Waiting on your go" not in d["rebuild"]["next_text"], d["rebuild"]'
        cwd: "."
