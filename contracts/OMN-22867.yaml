schema_version: "1.0.0"
ticket_id: OMN-22867
title: Tests (Split 5/20) and Tests (Split 19/20) red on dev, the durations record leaves 57 test files unrecorded and the OMN-22795 contract carries an empty binds_ac on a probe item
summary: >-
  Two tests in the 20-way split fail on omnimarket dev itself, so every pull request cut from dev reads Tests (Split 5/20) and Tests (Split 19/20) red. Split 19 holds tests/ci/test_repo_evidence_caller_workflow.py::test_every_repo_contract_binds_every_criterion, which refuses contracts/OMN-22795.yaml item dod-omn22795-integration-proof because the item names an empty binds_ac beside a command check that binds no test file; the item is a local-done-gate probe, so it drops the key as the other integration-proof items do. Split 5 holds tests/unit/test_ci_shard_plan_record_freshness_omn17427.py, which reads 57 of 4430 test files unrecorded in config/test_file_durations.json against a limit of 50; the record gains measured seconds for 56 of them with a provenance supplement, and test_compare_page.py stays unrecorded because its render tests need Node.js, absent on the measuring host. No bound, check or test is changed.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn22867-splits-5-19-shared-red
    statement: >-
      On omnimarket dev the two tests that red Tests (Split 5/20) and Tests (Split 19/20) pass, with the limit of 50 and the binding rule unchanged.
    acceptance:
      - id: AC3
        statement: "AC3: tests/ci/test_repo_evidence_caller_workflow.py passes with the empty binds_ac removed from the OMN-22795 probe item and fails on dev without the change -- falsifier: uv run pytest tests/ci/test_repo_evidence_caller_workflow.py tests/unit/test_omn22867_shared_red_causes.py in omnimarket"
      - id: AC4
        statement: "AC4: tests/unit/test_ci_shard_plan_record_freshness_omn17427.py passes with fewer than 50 test files unrecorded and fails on dev without the change -- falsifier: uv run pytest tests/unit/test_ci_shard_plan_record_freshness_omn17427.py in omnimarket"
  - id: req-omn22867-split12-lab-alarm-boot-resolvable
    statement: >-
      On omnimarket dev tests/test_handler_routing_boot_resolvable.py passes: node_lab_alarm declares its two CLI-run handlers under cli_handlers, not handler_routing, so Tests (Split 12/20) no longer reads red on every pull request cut from dev.
    acceptance:
      - id: AC5
        statement: "AC5: tests/test_handler_routing_boot_resolvable.py and tests/nodes/node_lab_alarm/test_lab_alarm_cli_binding.py pass with node_lab_alarm bound under cli_handlers and fail on dev without the change -- falsifier: uv run pytest tests/test_handler_routing_boot_resolvable.py tests/nodes/node_lab_alarm in omnimarket"
evidence_requirements:
  - kind: tests
    description: >-
      The repo-evidence caller workflow test and the durations record tests.
    command: uv run --frozen pytest tests/ci/test_repo_evidence_caller_workflow.py tests/unit/test_ci_shard_plan_record_freshness_omn17427.py tests/unit/test_ci_duration_record_supplement.py tests/unit/test_ci_shard_plan_omn19684.py -q -n 0 --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn22867-ac3-contract-binds
    description: >-
      The repo contract binding test passes on this branch. On dev (a10bd9b23) it fails with OMN-22795.yaml:dod-omn22795-integration-proof binds_ac requires uv run pytest evidence naming an existing repo test file.
    source: manual
    binds_ac:
      - AC3
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/ci/test_repo_evidence_caller_workflow.py tests/unit/test_omn22867_shared_red_causes.py -q -n 0 --no-cov
        cwd: ${OMNI_HOME}/omnimarket
  - id: dod-omn22867-ac4-durations-freshness
    description: >-
      The freshness test passes on this branch with 1 test file unrecorded. On dev (a10bd9b23) it fails with 57 of 4430 test files not in test_file_durations.json.
    source: manual
    binds_ac:
      - AC4
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/test_ci_shard_plan_record_freshness_omn17427.py -q -n 0 --no-cov
        cwd: ${OMNI_HOME}/omnimarket
  - id: dod-deploy-omn22867-splits-5-19
    description: >-
      The durations record tests that read the changed record still pass, which hosted CI can run.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/test_ci_duration_record_supplement.py tests/unit/test_ci_shard_plan_omn19684.py -q -n 0 --no-cov
        cwd: ${OMNI_HOME}/omnimarket
    binds_ac: []
  - id: dod-omn22867-splits-5-19-integration-proof
    description: >-
      The pushed head ran the two repaired tests on a lab host and exited 0. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: |-
          uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane splits-5-19-fl0527 -- uv run --frozen pytest tests/ci/test_repo_evidence_caller_workflow.py tests/unit/test_ci_shard_plan_record_freshness_omn17427.py -q -n 0 --no-cov
        cwd: .
  - id: dod-omn22867-ac5-lab-alarm-cli-bound
    description: >-
      The boot-resolvable guard and the lab alarm binding test pass on this branch. On dev (9297e49ad) both fail: the guard names node_lab_alarm ops broker_lag (HandlerBrokerLag) and effects_held (HandlerEffectsHeld) as unresolvable at boot.
    source: manual
    binds_ac:
      - AC5
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/test_handler_routing_boot_resolvable.py tests/nodes/node_lab_alarm/test_lab_alarm_cli_binding.py -q -n 0 --no-cov
        cwd: ${OMNI_HOME}/omnimarket
  - id: dod-deploy-omn22867-lab-alarm
    description: >-
      The lab alarm node's own tests still pass with its contract changed, which hosted CI can run.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/nodes/node_lab_alarm -q -n 0 --no-cov
        cwd: ${OMNI_HOME}/omnimarket
    binds_ac: []
  - id: dod-omn22867-lab-alarm-integration-proof
    description: >-
      The pushed head ran the guard and the lab alarm tests on a lab host and exited 0. Hosted CI cannot reach the lab, so only the local Done gate runs this unbound check.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: |-
          uv run onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane split12-1355 -- uv run --frozen pytest tests/test_handler_routing_boot_resolvable.py tests/nodes/node_lab_alarm -q -n 0 --no-cov
        cwd: .
