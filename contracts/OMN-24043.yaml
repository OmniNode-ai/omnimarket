  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_hook_events_by_correlation_read_effect/test_edge_identity_overlay.py -q --no-cov -p no:randomly -k edge_identity
    cwd: .
- id: dod-omn24043-ac2
  description: 'AC2: each failing token answers 401 and each broken overlay or unreadable key set answers 503, with no repository call; the real key-set provider answers against a local key-set server.'
  source: manual
