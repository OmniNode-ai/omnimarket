schema_version: 1.0.0
ticket_id: OMN-24023
title: The call time allowance for a kind of task is read from the team settings by a reader in the team code
summary: The lane harness gave every task class not in its own small table a fixed 180 s call budget, so about 190 GLM code_generation runs in one day were cut at 174 s while the overlay of node_delegation_code_budget_compute already held 600 s for the class. This pull request adds the reader the harness asks, read_call_budget_s in omnimarket.handlers.delegation_call_budget_reader, which loads that overlay and returns the class value through the node's resolve operation, None for an unnamed class or an install with no overlay, and refuses an invalid overlay with the overlay reader's typed error.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn24023-call-budget-reader
  statement: A reader in omnimarket returns the overlay's call budget of a task class through the node's resolve operation, and refuses an invalid overlay without a default.
  acceptance:
  - id: AC1
    statement: 'AC1: the reader returns the class_budgets_s value of the node_delegation_code_budget_compute overlay for a named task class, through that node''s resolve operation, and None for a class the overlay does not name or when no overlay is found -- falsifier: uv run pytest tests/unit/handlers/test_delegation_call_budget_reader.py -q -n 0 --no-cov fails without the reader'
  - id: AC2
    statement: 'AC2: an overlay that is present but invalid refuses with the overlay reader''s typed error and never returns a default -- falsifier: uv run pytest tests/unit/handlers/test_delegation_call_budget_reader.py -q -n 0 --no-cov -k invalid_overlay'
  - id: AC3
    statement: 'AC3: integrated: the plugin''s harness on a lab host asks the reader and a real GLM code_generation run is given the overlay''s budget -- falsifier: the run''s receipt.json on that host reads call_budget_source overlay with call_budget_s above 180; a value of 180 fails this criterion'
evidence_requirements:
- kind: tests
  description: The reader tests pass at the pushed head.
  command: uv run pytest tests/unit/handlers/test_delegation_call_budget_reader.py -q -n 0 --no-cov -p no:cacheprovider
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
