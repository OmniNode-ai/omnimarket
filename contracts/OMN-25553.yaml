  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/test_handler_routing_boot_resolvable.py tests/nodes/node_review_lock_effect/test_review_lock.py -q --no-cov -p no:cacheprovider --refuse-skips
    cwd: .
- id: dod-omn25553-ac2
  description: A HandlerReviewLock built with no ledger ports answers UNDECIDED and the same request with a ledger wired is ACQUIRED, so the fix loosens no lock check.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run --frozen pytest tests/nodes/node_review_lock_effect/test_review_lock.py -k undecided_never_acquired -q --no-cov -p no:cacheprovider --refuse-skips
    cwd: .
- id: dod-omn25553-integration-proof
  description: the review lock node tests and the boot guard tests run on a lab host at the pushed head; hosted CI cannot reach the lab, so only the local Done gate runs this unbound check
  source: manual
  execution_scope: local_done_gate
  checks:
