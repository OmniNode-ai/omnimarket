schema_version: 1.0.0
ticket_id: OMN-25553
title: unblock omnimarket PR 6383 (CI Summary, Tests (Split 1/20) and Tests (Split 4/20) red at its head)
summary: 'HandlerReviewLock took its ledger reader and writer as required constructor parameters, so the boot guard test (every handler_routing target must be boot-resolvable) found it would quarantine at runtime boot once the node routed it. The reader and writer now default to None and a handler with no ledger wired answers UNDECIDED, never ACQUIRED; the CLI still passes both. One test pins the unwired answer with a wired control. No check is widened, skipped or bypassed.'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-omn25553-unblock-6383
  statement: omnimarket PR 6383 has no red required check that is its own cause
  acceptance:
  - id: AC1
    statement: 'AC1: the required checks CI Summary, Tests (Split 1/20) and Tests (Split 4/20) read success at the current head of omnimarket PR 6383, or a STATUS row names the shared cause with its evidence -- falsifier: `onex scm pr-view OmniNode-ai/omnimarket#6383` lists those three contexts as success at the head it prints'
  - id: AC2
    statement: 'AC2: the cause is fixed on the pull request with a Lab: comment carrying head=<sha> and no check widened, skipped or bypassed -- falsifier: `onex scm pr-view OmniNode-ai/omnimarket#6383` shows a comment starting `Lab: head=` whose sha equals the head'
evidence_requirements:
- kind: tests
  description: The boot guard and the review lock node tests pass at the pushed head.
  command: uv run --frozen pytest tests/test_handler_routing_boot_resolvable.py tests/nodes/node_review_lock_effect -q --no-cov -p no:cacheprovider --refuse-skips
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn25553-ac1
