    check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-unblk6383 --kind test -- env PYTHONDONTWRITEBYTECODE=1
      uv run --frozen pytest tests/test_handler_routing_boot_resolvable.py tests/nodes/node_review_lock_effect -q --no-cov -p no:cacheprovider
