schema_version: "1.0"
ticket: OMN-15423
service: omnimarket_projection_migration_runner
owner_declaration: service:omnimarket_projection_migration_runner
migration_root: scripts
migration_stream: run-projection-migrations.py
current_physical_database: omnidash_analytics
target_database_ref: application

# This repository-owned ledger is created by the migration runner, not by a
# node, so it uses the typed table shape without inventing a node owner.
db_io:
  db_tables:
    - name: omnimarket_schema_migrations
      database_ref: application
      schema: omninode_internal
      migration: run-projection-migrations.py
      access: read_write
      role: projection_migration_ledger
    - name: delegation_events
      database_ref: application
      schema: tenant
      migration: src/omnimarket/nodes/node_projection_delegation/migrations/0029_delegation_terminal_failure_cause.sql
      access: read_write
      role: tenant_projection_table
    # OMN-15359: the physical CREATE TABLE for this node's already-declared
    # db_io.db_tables[0] (schema: omninode_internal, in this node's own
    # contract.yaml) lives in the omnibase_infra repo, not here -- the
    # omninode_internal schema and its physical table copies are an
    # omnibase_infra-owned migration stream (docker/migrations/forward/098,
    # 099). This entry registers this repository as the CATALOG owner of the
    # physical relation regardless of which repo's migration corpus creates
    # it, matching the node's existing read/write contract authority. Zero
    # behavior change: node_projection_live_events has targeted
    # schema: omninode_internal in db_io.db_tables since before this entry
    # existed; this only satisfies the OMN-15361 SQL ownership gate so
    # omnibase_infra#<PR1> can schema-qualify the physical CREATE TABLE.
    - name: live_events
      database_ref: application
      schema: omninode_internal
      migration: docker/migrations/forward/099_create_omninode_internal_live_events.sql
      access: write
      role: live_events
    # OMN-15846: node_log_persistence_effect's own contract.yaml already
    # declares this db_io.db_tables entry (schema: omninode_internal); this
    # top-level entry registers it in the ownership catalog
    # scripts/ci/check_application_database_sql.py reads via
    # --ownership-manifest, satisfying the OMN-15361 SQL ownership gate for
    # the node-owned migration's schema-qualified
    # omninode_internal.log_entries CREATE TABLE (the node-owned replacement
    # for the flat 083_create_log_entries.sql migration, which has no
    # execution path in the k8s Job that applies flat migrations -- cross-DB
    # \connect).
    - name: log_entries
      database_ref: application
      schema: omninode_internal
      migration: src/omnimarket/nodes/node_log_persistence_effect/migrations/0000_create_log_entries.sql
      access: write
      role: log_entries

relation_evidence:
  - name: omnimarket_schema_migrations
    kind: table
    domain: OMNINODE_INTERNAL
    owner_declaration: service:omnimarket_projection_migration_runner
    producer: scripts/run-projection-migrations.py
    readers: [scripts/run-projection-migrations.py]
    writers: [scripts/run-projection-migrations.py]
    authoritative_sources: [scripts/run-projection-migrations.py]
    dependent_objects: [omnimarket_schema_migrations_id_seq]
    keys:
      - PRIMARY KEY (id)
      - UNIQUE (node_name, version)
    foreign_keys: []
    indexes: []
    partitioning: none
    grants: []
    dsn_consumers: [OMNIDASH_ANALYTICS_DB_URL]
    classification_evidence: >-
      checksum ledger for the repository-owned projection migration stream;
      operational state with no customer-owned rows
  - name: delegation_events
    kind: table
    database_ref: application
    schema: tenant
    domain: TENANT
    owner_declaration: service:omnimarket_projection_migration_runner
    producer: src/omnimarket/nodes/node_projection_delegation/handlers/handler_projection_delegation.py
    readers:
      - src/omnimarket/nodes/node_projection_delegation/handlers/handler_projection_delegation.py
    writers:
      - src/omnimarket/nodes/node_projection_delegation/handlers/handler_projection_delegation.py
    authoritative_sources:
      - src/omnimarket/nodes/node_projection_delegation/migrations/0029_delegation_terminal_failure_cause.sql
    tenant_identity_column: tenant_id
    canonical_policy_name: tenant_isolation
    deduplication_key_columns: [correlation_id]
    authorization_dependency_columns: [tenant_id]
    write_eligibility_dependency_columns: [tenant_id]
    classification_evidence: >-
      node_projection_delegation tenant projection table; OMN-15503 appends
      typed terminal outcome columns without changing tenant authority.
