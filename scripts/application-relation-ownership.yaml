schema_version: "1.0"
ticket: OMN-15423
service: omnimarket_projection_migration_runner
owner_declaration: service:omnimarket_projection_migration_runner
migration_root: scripts
migration_stream: run-projection-migrations.py
current_physical_database: omnidash_analytics
target_database_ref: application

# This repository-owned ledger is created by the migration runner, not by a
# node, so it uses the typed table shape without inventing a node owner.
db_io:
  db_tables:
    - name: omnimarket_schema_migrations
      database_ref: application
      schema: omninode_internal
      migration: run-projection-migrations.py
      access: read_write
      role: projection_migration_ledger
    - name: delegation_events
      database_ref: application
      schema: tenant
      migration: src/omnimarket/nodes/node_projection_delegation/migrations/0031_delegation_events_tenant_id_to_uuid.sql
      access: read_write
      role: tenant_projection_table
    - name: savings_estimates
      database_ref: application
      schema: tenant
      migration: src/omnimarket/nodes/node_projection_savings/migrations/074_create_savings_estimates.sql
      access: read_write
      role: savings_estimates_projection_table
    # OMN-16180: register this repository as the CATALOG owner of the physical
    # relation `work_events` -- the L1 work-ledger surface of the OMN-16176
    # ladder, created by node_projection_work_events' own node-owned migration.
    #
    # WHY THIS ENTRY LANDS BEFORE THE MIGRATION IT DESCRIBES
    #   The OMN-15361 SQL ownership gate
    #   (omnibase_infra/scripts/ci/check_application_database_sql.py) requires
    #   exactly one ownership declaration for every application relation a
    #   CHANGED deployable SQL file targets, and it resolves declarations from
    #   service manifests ONLY -- never from a node's own contract.yaml. It runs
    #   on the omnibase_infra PR that vendors the migration, and reads THIS file
    #   from omnimarket@dev.
    #
    #   Meanwhile omnimarket's own node-migration-vendor-parity-gate fails any
    #   omnimarket PR touching src/omnimarket/nodes/*/migrations/*.sql unless
    #   omnibase_infra@dev ALREADY carries a byte-identical vendored copy.
    #
    #   The two gates therefore force a strict three-PR order, and this file is
    #   step 1 of it:
    #     1. this declaration (no SQL, so the parity gate short-circuits)
    #     2. omnibase_infra vendors the migration (ownership now resolvable)
    #     3. omnimarket lands the node package and the migration itself
    #   Splitting it any other way deadlocks. This is not a gate bypass: no
    #   exemption is added anywhere, and both gates stay fail-closed throughout.
    #
    # Unlike session_replay_snapshots (OMN-16993), this relation is created
    # DIRECTLY in omninode_internal -- it is net-new, so it needs no entry in
    # INTERNAL_TABLES_PHYSICALLY_IN_PUBLIC_UNTIL_OMN15359 and no
    # _LEGACY_DEFAULT_SCHEMA_SQL_EXACT_PATHS exemption, now or at the governed
    # OMN-15359 cutover.
    - name: work_events
      database_ref: application
      schema: omninode_internal
      migration: src/omnimarket/nodes/node_projection_work_events/migrations/0001_create_work_events.sql
      access: read_write
      role: work_events_projection_table
    # OMN-17019: register this repository as the CATALOG owner of the physical
    # relation `open_obligations` -- the materialized "what is currently owed"
    # projection of the OMN-16176 ladder, created by
    # node_projection_open_obligations' own node-owned migration.
    #
    # Same reason this entry lands with (not after) the migration it describes:
    # the OMN-15361 SQL ownership gate
    # (omnibase_infra/scripts/ci/check_application_database_sql.py) requires
    # exactly one ownership declaration for every application relation a CHANGED
    # deployable SQL file targets, resolves declarations from service manifests
    # ONLY -- never from a node's own contract.yaml -- and reads THIS file from
    # omnimarket@dev when the omnibase_infra PR that vendors the migration runs.
    # Declaring ownership here first means that vendoring PR has nothing to
    # discover; it is a pure copy.
    #
    # Like work_events and unlike session_replay_snapshots (OMN-16993), this
    # relation is created DIRECTLY in omninode_internal -- it is net-new, so it
    # needs no entry in INTERNAL_TABLES_PHYSICALLY_IN_PUBLIC_UNTIL_OMN15359 and
    # no _LEGACY_DEFAULT_SCHEMA_SQL_EXACT_PATHS exemption, now or at the
    # governed OMN-15359 cutover.
    - name: open_obligations
      database_ref: application
      schema: omninode_internal
      migration: src/omnimarket/nodes/node_projection_open_obligations/migrations/0001_create_open_obligations.sql
      access: read_write
      role: open_obligations_projection_table
    # OMN-16993: register this repository as the CATALOG owner of the physical
    # relation `session_replay_snapshots`, mirroring the `live_events` entry
    # below and for the same reason -- the OMN-15361 SQL ownership gate
    # (`omnibase_infra/scripts/ci/check_application_database_sql.py`) requires
    # exactly one ownership declaration for every application relation a
    # CHANGED deployable SQL file targets, and it resolves declarations from
    # service manifests only, never from a node's own contract.yaml.
    #
    # `node_projection_session_replay/contract.yaml` has declared this table
    # `schema: omninode_internal, access: write` since OMN-13087; this entry
    # restates that same schema (a `schema: public` restatement of the physical
    # location is rejected by scripts/generate_application_relation_inventory.py
    # as a conflicting-schema declaration). Physically the table still lives
    # bare in `public` -- it is listed in
    # `INTERNAL_TABLES_PHYSICALLY_IN_PUBLIC_UNTIL_OMN15359` -- until the
    # governed OMN-15359 cutover moves it. Zero behavior change here; this only
    # satisfies the ownership gate so omnibase_infra can vendor OMN-16993's
    # `0002_grant_omninode_runtime_session_replay_snapshots.sql`.
    - name: session_replay_snapshots
      database_ref: application
      schema: omninode_internal
      migration: src/omnimarket/nodes/node_projection_session_replay/migrations/0001_create_session_replay_snapshots.sql
      access: read_write
      role: session_replay_projection_table
    # OMN-17374: register this repository as the CATALOG owner of the physical
    # relation `tenant_registry_mirror`, for exactly the reason the
    # session_replay_snapshots entry above exists -- the OMN-15361 SQL
    # ownership gate requires one ownership declaration for every application
    # relation a CHANGED deployable SQL file targets, and it resolves those
    # from service manifests only, never from a node's own contract.yaml. The
    # changed file is
    # `node_projection_tenant_registry/migrations/0001_grant_omninode_runtime_tenant_registry_mirror.sql`.
    #
    # `schema: omninode_internal` restates what BOTH contracts that touch this
    # relation already declare -- node_projection_tenant_registry (write) and
    # node_projection_delegation (read, OMN-16804). A `schema: public`
    # restatement of the physical location is rejected by
    # scripts/generate_application_relation_inventory.py as a
    # conflicting-schema declaration, the same trap the session_replay entry
    # documents. Physically the table still lives bare in `public` -- it is
    # enumerated in `INTERNAL_TABLES_PHYSICALLY_IN_PUBLIC_UNTIL_OMN15359`,
    # where 0000's own header explains why physically-public is load-bearing
    # rather than incidental for this relation -- so the grant migration names
    # `public.tenant_registry_mirror` and the bridge resolves the two.
    #
    # `access: read_write` is what the pair of contracts jointly amounts to and
    # is not a widening: the registry projection writes, the delegation writer
    # reads, and this manifest declares the relation once for the repo rather
    # than once per consumer.
    - name: tenant_registry_mirror
      database_ref: application
      schema: omninode_internal
      migration: src/omnimarket/nodes/node_projection_tenant_registry/migrations/0000_create_tenant_registry_mirror.sql
      access: read_write
      role: tenant_registry_mirror_projection_table
    # OMN-15359: the physical CREATE TABLE for this node's already-declared
    # db_io.db_tables[0] (schema: omninode_internal, in this node's own
    # contract.yaml) lives in the omnibase_infra repo, not here -- the
    # omninode_internal schema and its physical table copies are an
    # omnibase_infra-owned migration stream (docker/migrations/forward/098,
    # 099). This entry registers this repository as the CATALOG owner of the
    # physical relation regardless of which repo's migration corpus creates
    # it, matching the node's existing read/write contract authority. Zero
    # behavior change: node_projection_live_events has targeted
    # schema: omninode_internal in db_io.db_tables since before this entry
    # existed; this only satisfies the OMN-15361 SQL ownership gate so
    # omnibase_infra#<PR1> can schema-qualify the physical CREATE TABLE.
    - name: live_events
      database_ref: application
      schema: omninode_internal
      migration: docker/migrations/forward/099_create_omninode_internal_live_events.sql
      access: write
      role: live_events
    # OMN-15846: node_log_persistence_effect's own contract.yaml already
    # declares this db_io.db_tables entry (schema: omninode_internal); this
    # top-level entry registers it in the ownership catalog
    # scripts/ci/check_application_database_sql.py reads via
    # --ownership-manifest, satisfying the OMN-15361 SQL ownership gate for
    # the node-owned migration's schema-qualified
    # omninode_internal.log_entries CREATE TABLE (the node-owned replacement
    # for the flat 083_create_log_entries.sql migration, which has no
    # execution path in the k8s Job that applies flat migrations -- cross-DB
    # \connect).
    - name: log_entries
      database_ref: application
      schema: omninode_internal
      migration: src/omnimarket/nodes/node_log_persistence_effect/migrations/0000_create_log_entries.sql
      access: write
      role: log_entries
    # OMN-16146: node_projection_registration's own contract.yaml already
    # declares this db_io.db_tables entry (schema: omninode_internal); this
    # top-level entry registers it in the ownership catalog
    # scripts/ci/check_application_database_sql.py reads via
    # --ownership-manifest, satisfying the OMN-15361 SQL ownership gate for
    # the node-owned migration's schema-qualified
    # omninode_internal.projection_watermarks CREATE TABLE, matching
    # log_entries' own precedent above.
    - name: projection_watermarks
      database_ref: application
      schema: omninode_internal
      migration: src/omnimarket/nodes/node_projection_registration/migrations/0005_create_projection_watermarks.sql
      access: write
      role: projection_watermarks
    # OMN-16293: node_savings_estimation_compute lives entirely in
    # omnibase_infra (contract.yaml + migration both there) -- unlike the
    # log_entries/projection_watermarks precedents above, there is no
    # omnimarket-side node contract.yaml db_io.db_tables declaration to
    # register; HandlerSavingsCorrelation ingests these signals via direct
    # wiring in service_kernel.py, not auto-wired event_bus.subscribe_topics
    # (see the node's own contract.yaml OMN-16293 comment). These two
    # entries register this repository as the CATALOG owner of both
    # physical relations created by
    # docker/migrations/forward/nodes/node_savings_estimation_compute/0001_create_savings_signal_tables.sql,
    # satisfying the OMN-15361 SQL ownership gate for omnibase_infra#2818's
    # schema-qualified CREATE TABLE, matching the live_events/log_entries/
    # projection_watermarks precedent pattern above.
    - name: savings_injection_signals
      database_ref: application
      schema: omninode_internal
      migration: docker/migrations/forward/nodes/node_savings_estimation_compute/0001_create_savings_signal_tables.sql
      access: write
      role: savings_injection_signals
    - name: savings_validator_catch_signals
      database_ref: application
      schema: omninode_internal
      migration: docker/migrations/forward/nodes/node_savings_estimation_compute/0001_create_savings_signal_tables.sql
      access: write
      role: savings_validator_catch_signals
    # OMN-15631: node_delegation_routing_reducer's own contract.yaml declares
    # this tenant-domain table; the physical migration is vendored into
    # omnibase_infra#2820 so that the application migration stream can create
    # it. This entry registers omnimarket as the catalog owner for
    # scripts/ci/check_application_database_sql.py's cross-repo ownership gate.
    - name: delegation_routing_tenant_overlay
      database_ref: application
      schema: tenant
      migration: src/omnimarket/nodes/node_delegation_routing_reducer/migrations/0001_create_delegation_routing_tenant_overlay.sql
      access: read_write
      role: tenant_routing_overlay
    # OMN-16777: the per-(consumer_group, topic) throughput read model and the
    # per-topic production tally that separates STARVED from IDLE. Platform
    # operational facts about consumer groups and topics — no customer-owned
    # rows, hence OMNINODE_INTERNAL rather than TENANT.
    - name: consumer_flow_windows
      database_ref: application
      schema: omninode_internal
      migration: src/omnimarket/nodes/node_projection_consumer_flow/migrations/0000_create_consumer_flow_windows.sql
      access: read_write
      role: consumer_flow_projection_table
    - name: topic_produce_windows
      database_ref: application
      schema: omninode_internal
      migration: src/omnimarket/nodes/node_projection_consumer_flow/migrations/0000_create_consumer_flow_windows.sql
      access: read_write
      role: topic_produce_projection_table

relation_evidence:
  - name: consumer_flow_windows
    kind: table
    database_ref: application
    schema: omninode_internal
    domain: OMNINODE_INTERNAL
    owner_declaration: service:omnimarket_projection_migration_runner
    producer: src/omnimarket/nodes/node_projection_consumer_flow/migrations/0000_create_consumer_flow_windows.sql
    readers: [src/omnimarket/nodes/node_projection_consumer_flow/handlers/handler_consumer_flow_runner.py]
    writers: [src/omnimarket/nodes/node_projection_consumer_flow/handlers/handler_consumer_flow_runner.py]
    authoritative_sources: [src/omnimarket/nodes/node_projection_consumer_flow/migrations/0000_create_consumer_flow_windows.sql]
    dependent_objects: []
    keys:
      - PRIMARY KEY (consumer_group, topic, window_start)
    foreign_keys: []
    indexes:
      - idx_consumer_flow_windows_state_time
      - idx_consumer_flow_windows_group_time
    partitioning: none
    grants: []
    dsn_consumers: [OMNIDASH_ANALYTICS_DB_URL]
    classification_evidence: >-
      per-(consumer_group, topic) throughput windows for the platform's own
      consumers, with the derived FLOWING/STALLED/STARVED/IDLE/UNKNOWN verdict.
      Rows name Kafka consumer groups and topics — platform operational facts,
      no customer-owned data, so the counter columns are deliberately nullable
      to keep an unobserved window distinguishable from an idle one (OMN-16777).
  - name: topic_produce_windows
    kind: table
    database_ref: application
    schema: omninode_internal
    domain: OMNINODE_INTERNAL
    owner_declaration: service:omnimarket_projection_migration_runner
    producer: src/omnimarket/nodes/node_projection_consumer_flow/migrations/0000_create_consumer_flow_windows.sql
    readers: [src/omnimarket/nodes/node_projection_consumer_flow/handlers/handler_consumer_flow_runner.py]
    writers: [src/omnimarket/nodes/node_projection_consumer_flow/handlers/handler_consumer_flow_runner.py]
    authoritative_sources: [src/omnimarket/nodes/node_projection_consumer_flow/migrations/0000_create_consumer_flow_windows.sql]
    dependent_objects: []
    keys:
      - PRIMARY KEY (topic, window_start)
    foreign_keys: []
    indexes:
      - idx_topic_produce_windows_topic_time
    partitioning: none
    grants: []
    dsn_consumers: [OMNIDASH_ANALYTICS_DB_URL]
    classification_evidence: >-
      count of envelopes this platform published to each topic per window, taken
      from the runtime's own publish seam rather than a broker query. It is the
      upstream-production evidence that lets a zero-in consumer be called
      STARVED instead of IDLE, and its absence for a topic is itself meaningful
      (OMN-16777).
  - name: omnimarket_schema_migrations
    kind: table
    domain: OMNINODE_INTERNAL
    owner_declaration: service:omnimarket_projection_migration_runner
    producer: scripts/run-projection-migrations.py
    readers: [scripts/run-projection-migrations.py]
    writers: [scripts/run-projection-migrations.py]
    authoritative_sources: [scripts/run-projection-migrations.py]
    dependent_objects: [omnimarket_schema_migrations_id_seq]
    keys:
      - PRIMARY KEY (id)
      - UNIQUE (node_name, version)
    foreign_keys: []
    indexes: []
    partitioning: none
    grants: []
    dsn_consumers: [OMNIDASH_ANALYTICS_DB_URL]
    classification_evidence: >-
      checksum ledger for the repository-owned projection migration stream;
      operational state with no customer-owned rows
  - name: delegation_events
    kind: table
    database_ref: application
    schema: tenant
    domain: TENANT
    owner_declaration: service:omnimarket_projection_migration_runner
    producer: src/omnimarket/nodes/node_projection_delegation/handlers/handler_projection_delegation.py
    readers:
      - src/omnimarket/nodes/node_projection_delegation/handlers/handler_projection_delegation.py
    writers:
      - src/omnimarket/nodes/node_projection_delegation/handlers/handler_projection_delegation.py
    authoritative_sources:
      - src/omnimarket/nodes/node_projection_delegation/migrations/0031_delegation_events_tenant_id_to_uuid.sql
    tenant_identity_column: tenant_id
    canonical_policy_name: tenant_isolation
    deduplication_key_columns: [correlation_id]
    authorization_dependency_columns: [tenant_id]
    write_eligibility_dependency_columns: [tenant_id]
    classification_evidence: >-
      node_projection_delegation tenant projection table; OMN-15683 converts
      tenant_id from the legacy TEXT slug to the canonical UUID identity so
      RLS-covered reads keyed on the gateway's UUID tenant claim (Keycloak,
      OMN-16143) resolve against the same identity the row was written
      under. OMN-15503's typed terminal outcome columns (0029) are unchanged
      by this conversion.
  - name: savings_estimates
    kind: table
    database_ref: application
    schema: tenant
    domain: TENANT
    owner_declaration: service:omnimarket_projection_migration_runner
    producer: src/omnimarket/nodes/node_projection_savings/handlers/handler_savings.py
    readers:
      - src/omnimarket/nodes/node_projection_savings/handlers/handler_savings.py
    writers:
      - src/omnimarket/nodes/node_projection_savings/handlers/handler_savings.py
    authoritative_sources:
      - src/omnimarket/nodes/node_projection_savings/migrations/074_create_savings_estimates.sql
      - src/omnimarket/nodes/node_projection_savings/migrations/082_savings_estimates_task_type_and_tokens.sql
    tenant_identity_column: tenant_id
    canonical_policy_name: tenant_isolation
    deduplication_key_columns: [session_id, event_timestamp, model_local, model_cloud_baseline]
    authorization_dependency_columns: [tenant_id]
    write_eligibility_dependency_columns: [tenant_id]
    classification_evidence: >-
      node_projection_savings tenant projection table for local-vs-counterfactual
      savings estimates; OMN-15533 persists the task class and served token
      counts used by the delegation-savings read views.
  - name: projection_delegation_savings
    kind: view
    database_ref: application
    schema: tenant
    domain: TENANT
    owner_declaration: service:omnimarket_projection_migration_runner
    producer: src/omnimarket/nodes/node_projection_savings/migrations/083_reconcile_delegation_savings_projection_views.sql
    readers:
      - src/omnimarket/nodes/node_projection_savings/handlers/handler_savings.py
    writers: []
    authoritative_sources:
      - src/omnimarket/nodes/node_projection_savings/migrations/083_reconcile_delegation_savings_projection_views.sql
    classification_evidence: >-
      tenant read view over savings_estimates and delegation_events that exposes
      the delegation-savings summary without fabricating task_type, token counts,
      or measured-savings provenance.
  - name: projection_delegation_savings_series
    kind: view
    database_ref: application
    schema: tenant
    domain: TENANT
    owner_declaration: service:omnimarket_projection_migration_runner
    producer: src/omnimarket/nodes/node_projection_savings/migrations/083_reconcile_delegation_savings_projection_views.sql
    readers:
      - src/omnimarket/nodes/node_projection_savings/handlers/handler_savings.py
    writers: []
    authoritative_sources:
      - src/omnimarket/nodes/node_projection_savings/migrations/083_reconcile_delegation_savings_projection_views.sql
    classification_evidence: >-
      tenant read view over savings_estimates and delegation_events that exposes
      daily delegation-savings series rows and preserves tier-mix semantics while
      deriving provenance from persisted served-token evidence.
