---
# scripts/ci/test_selection_adjacency.yaml
# Static adjacency map from src/omnimarket/<module> to dependent modules.
# When a key module changes, every module in `reverse_deps` ALSO has its tests run.
# Treated as CI contract data — manually curated, reviewed in PRs that change it.
#
# NOTE: Most omnimarket tests live at tests/*.py (flat). The detector maps
# src/omnimarket/<module> → tests/<module>/ for subdirs and tests/ (root) for
# flat test files. Shared-module escalation forces tests/ (full suite).

schema_version: 1

# `shared_modules` triggers full-suite escalation if any of these change.
# Curate based on operational risk + import fan-out across nodes and adapters.
shared_modules:
  - models
  - protocols
  - enums
  - routing
  - runtime
  - events

# Per-repo full-suite escalation threshold.
thresholds:
  modules_changed_for_full_suite: 6

# OMN-15639: repo-wide gate directories, unioned into EVERY narrowed
# selection. These assert invariants over files the adjacency map above
# cannot attribute to one module — tests/gates/ walks all
# src/**/contract.yaml, so a change to one node's contract narrows to
# tests/nodes/ and would skip the gate entirely, leaving the invariant
# reintroducible on the everyday dev path.
# OMN-17232: tests/test_no_cross_node_reach_in.py walks every node package. A
# change to one node narrowed to that node's tests, the dev push skips the
# suite (OMN-19998), and a cross-node import merged green and failed every PR
# synced with dev afterwards.
# OMN-23649: tests/ci/test_repo_evidence_caller_workflow.py reads every
# contracts/OMN-*.yaml, so a change that adds one contract narrowed to its own
# node's tests and merged a contract the repo-wide binding check refuses; the
# dev suite then failed on every open change that took dev in.
always_selected_paths:
  - tests/gates/
  - tests/test_no_cross_node_reach_in.py
  - tests/ci/test_repo_evidence_caller_workflow.py

# The node inventory test (tests/test_market_node_runtime_dogfood.py) walks every
# node directory, contract.yaml and onex.nodes entry point. A node contract change
# narrowed to the node's own tests and skipped it: the test selector chose 52
# paths for omnimarket#6071 and omnimarket#6054 and none was this test. An entry
# point change edits pyproject.toml, whose selection is set by test_infrastructure_paths
# below and by the selection stage, so contract.yaml files are the glob here.
# A change to the selector policy selects the test that checks the stage receipts, because the
# policy file is data the import graph cannot read. A change under config/ is no narrowable path,
# so it takes the full escalation, which runs that test too.
path_triggered_selected_paths:
  - changed_globs:
      - src/omnimarket/nodes/*/contract.yaml
    selected_paths:
      - tests/test_market_node_runtime_dogfood.py
  - changed_globs:
      - src/omnimarket/nodes/node_test_selection_selector_compute/policy.yaml
    selected_paths:
      - tests/ci/test_selection_stage_evidence.py

# OMN-23719: modules made of node packages. A change reaching one of these
# (directly, or through reverse_deps) selects the tests of the nodes it can
# affect by the import graph, not the whole tests/<module>/ tree. tests/nodes/
# alone summed to 1800.75 recorded seconds on dev against the selector's 1800 s
# bound, so every node change ran the full suite. See
# ModelAdjacencyMap.node_scoped_modules for what is selected and when it falls
# back to the whole directory.
node_scoped_modules:
  - nodes

# A diff whose files all lie outside src/ and tests/ and match data_only_globs (a ticket contract, a
# markdown file) reaches no test directory. With data_only_selection_enabled it selects the always
# set plus the tests that read the files: a test whose text spells the file or enumerates its
# directory (through an imported helper too), and the
# readers data_reader_overrides names (data glob -> test files) for a reader the text cannot show. Any
# other unmatched file keeps the full escalation. The rule changes what a pull request runs, so it stays
# off until its stage is entered: selection_stage in the selector's policy.yaml rises one stage at a time,
# each on a receipt under config/test_selection_stage_receipts/ that
# tests/ci/test_selection_stage_evidence.py recomputes from the published nightly records.
data_only_selection_enabled: false
data_only_globs:
  - contracts/OMN-*.yaml
  - "*.md"
data_reader_overrides: {}

# A changed non-Python file under one of data_reader_roots (a fixture or data file in tests/, a contract, a file
# beside a node) selects the tests that read it instead of the full suite: the tests whose text spells its
# path, its file name or a directory between a data_reader_fixture_roots entry and the file, the tests that
# enumerate its directory with glob, rglob or iterdir, the tests that import a helper among those, the tests
# that import a src/ file naming it, and data_reader_overrides. Adding, changing, renaming and deleting are the
# same, and a rename or delete looks up the old path. A file with no reader selects the always set only: a path
# built at run time with no literal part is the nightly's to catch. This is the stage 2 entry, so it stays off
# until a stage advance turns it on. Off, a fixture keeps the full-suite escalation it had
# (data_reader_gated_infrastructure_paths); on, a Python file under those paths and every path in
# test_infrastructure_paths still takes the full suite, a changed uv.lock beside a fixture included.
data_file_readers_enabled: false
data_reader_roots:
  - tests/
  - contracts/
  - src/omnimarket/nodes/
data_reader_fixture_roots:
  - tests/fixtures/
data_reader_gated_infrastructure_paths:
  - tests/fixtures/
# A pyproject.toml change narrows by section instead of taking the full suite as test infrastructure.
# The selector compares the file's base and head text key by key (a git source-diff adapter); only a
# changed key matching pyproject_narrowable_keys narrows, to the tests that read the file plus the closure
# of the entry points that moved. Any other key, one this list has never seen, an unparseable side, or a
# uv.lock change beyond the package's own version line keeps the full suite (reason test_infrastructure).
# project.version narrows beside a lock change only when the lock's sole change is the package's own
# version line. pyproject_reader_globs are the source files indexed for a read of pyproject.toml (a file
# that opens it or reads entry-point metadata); the tests that import one, transitively, are readers.
# The rule is the stage 2 entry of the selection record; like the data-only rule it stays off until the
# change that turns it on, and it needs the base ref (detect_test_paths --base-ref).
pyproject_section_selection_enabled: false
pyproject_paths:
  - pyproject.toml
pyproject_lock_paths:
  - uv.lock
pyproject_narrowable_keys:
  - project.entry-points.onex.nodes.*
  - project.version
  - tool.onex.dashboard_bundle.*
pyproject_reader_globs:
  - src/omnimarket/**/*.py
# Decision (OMN-26487): at or above the policy's file_level_closure_stage the file-level closure runs
# and the rule above adds its tests to the closure's selection (seeds, option b). It reuses
# pyproject_narrowable_keys, pyproject_lock_paths (the lock's own version line) and
# pyproject_reader_globs unchanged, so one allowlist rules both sides of the stage; a section-rule
# escalation (a key off the allowlist, an unparseable or unread diff, a lock change beyond the version
# line) takes the full suite whatever else the closure selected. Reason: the closure reads no project
# file, and the rule that narrows a change at a lower stage must narrow it at a higher one, not widen
# it to the full suite. full_suite (option c) is the value an absent entry takes.
closure_stage_pyproject_rule: seeds

# Test infrastructure — any change forces the full suite.
test_infrastructure_paths:
  # OMN-19998: CI changes invalidate narrowing even in a mixed code diff.
  - .github/
  - .pre-commit-config.yaml
  - scripts/
  - .pre-commit-hooks/
  - uv.lock
  - tests/conftest.py
  - pytest.ini
  - pyproject.toml

# OMN-20180: repo-relative fnmatch globs for surfaces whose coverage spans
# tests/unit/delegation/, tests/delegation_golden/ and flat tests/*.py.
# Any matching change forces the full suite before module narrowing. Include
# delegation projections and PR fixes, routing policy/house overlay nodes,
# and LLM effects with an ADR or PR prefix as well as node_llm_*.
# Test-directory changes already select their containing scope.
full_suite_path_globs:
  - src/omnimarket/delegation/**
  - src/omnimarket/delegated_test_loop/**
  - src/omnimarket/inference/**
  - src/omnimarket/cost/**
  - src/omnimarket/configs/**
  - src/omnimarket/nodes/node_*delegat*/**
  - src/omnimarket/nodes/node_*routing*/**
  - src/omnimarket/nodes/node_model_router/**
  - src/omnimarket/nodes/node_llm_*/**
  - src/omnimarket/nodes/node_*_llm_effect/**
  - src/omnimarket/nodes/node_ab_*/**
  - src/omnimarket/nodes/node_judge_*/**
  - src/omnimarket/nodes/node_*savings*/**
  - src/omnimarket/nodes/node_*llm_cost*/**

# Reverse dependency edges.
# Key = changed src module; value = modules that import it.
# Leaf modules with no dependents list empty reverse_deps.
adjacency:
  # High-fan-out shared modules (trigger full suite via shared_modules above)
  models:
    reverse_deps: [nodes, adapters, projection, inference, routing, runtime, classifiers, registry]
  protocols:
    reverse_deps: [nodes, adapters, inference, routing, runtime]
  enums:
    reverse_deps: [models, nodes, adapters, routing, runtime, events]
  routing:
    reverse_deps: [nodes, runtime, inference]
  runtime:
    reverse_deps: [nodes, inference]

  # Mid-fan-out modules
  adapters:
    reverse_deps: [nodes, inference]
  nodes:
    reverse_deps: []
  inference:
    reverse_deps: [nodes]
  projection:
    reverse_deps: [nodes, runtime]
  events:
    reverse_deps: [nodes]
  registry:
    reverse_deps: [nodes, runtime]

  # Leaf / low-fan-out modules
  classifiers:
    reverse_deps: []
  cli:
    reverse_deps: []
  config:
    reverse_deps: [nodes, runtime, inference]
  intelligence:
    reverse_deps: [nodes]
  logging:
    reverse_deps: []
  validators:
    reverse_deps: []
