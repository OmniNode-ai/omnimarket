# OMN-18790 — per-suite skip-count baseline for omnimarket (epic OMN-18775).
#
# Vendored by hand from omnibase_infra/config/skip_count_baseline.yaml at squash
# 77ea8d01 (OMN-18776). Every repo hand-maintains its own copy of the shared CI
# tooling; this file carries THIS repo's own measurement.
#
# Each entry records what a suite is ALLOWED to leave unexecuted, and how that
# number was measured. An entry with no provenance is refused by the gate: a
# baseline with no recorded measurement is a claim, not a measurement.
#
# Lowering a number here is the ONLY way to lower the bar. There is no flag and
# no environment variable on scripts/ci/skip_count_ratchet.py that does it, and
# tests/ci/test_skip_count_ratchet_omn18790.py reads the parser's own option
# strings to keep it that way.
#
# mode: count    — the collected set is identical every run; compare the number.
# mode: nodeids  — an impacted-test selector varies the collected set, so compare
#                  identities instead. A selector only ever narrows, so a narrowed
#                  run's skip set is a subset of a full-width baseline.
#
# Honest limit: this counts skips, it does not judge them. A structurally sound
# skip and one caused by an env var CI never sets look identical here. What the
# ratchet removes is the SILENT GROWTH of the set, not the set.
version: 1
suites:
  omnimarket/test:
    repo: omnimarket
    job: Tests (Split n/m)
    mode: nodeids
    max_skips: 259
    baseline_collected: 22836
    provenance:
      measured_at: '2026-09-18'
      measured_by: OMN-18790
      measurement_command: gh run download 35395544621 --repo OmniNode-ai/omnimarket --pattern 'test-results-*' --dir <dir> && uv run python scripts/ci/skip_count_ratchet.py --print-observed --suite omnimarket/test --junit <dir>/*/junit-*.xml
      source_runs:
        - '35395544621'
      corroborating_runs:
        - '35393542842'
        - '35392845454'
      notes: '35395544621 is a full-width run: detect-changes reported is_full_suite=true, split_count=20, selected_paths=["tests/"] (full_suite_reason=test_infrastructure), 20 JUnit reports, 22836 collected, 259 unique skipped test ids. The two corroborating runs are also full-width at split_count=20 and each reported exactly 259 unique skipped ids, with SETS byte-identical to this one -- 0 ids of symmetric difference in any of the three pairs. Split 1/20 alone reported 42 unique skips, reproducing epic OMN-18775''s 42/42/42 reading for this repo exactly. Mode is nodeids, NOT count, and the reason is a live measurement rather than a preference: this job sits behind scripts/ci/detect_test_paths.py with ENABLE_SMART_TESTS=true, and all three runs above were full-width only because each happened to touch test infrastructure. OMN-18790''s own first CI run, 35414570676, was narrowed by that selector to 765 collected and 2 unique skipped ids in a single split -- so the collected set here does vary, by a factor of 30. Under count mode that run passed but printed a RATCHET CANDIDATE advising max_skips be lowered to 2, and adopting that advice would have turned every subsequent full-width run red. Under nodeids the same run reads as a narrowed selection and a newly-added environmentally-skipped test still turns it red. Subset evidence for the claim that a narrowed run cannot false-fail: both corroborating full-width runs and the real narrowed run 35414570676 have 0 ids outside this baseline. Positive control for that zero: injecting one synthetic id into the same comparison reports 1.'
