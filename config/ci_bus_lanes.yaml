#
# config/ci_bus_lanes.yaml
#
# Checked-in lane -> bus-broker overlay for the thin CI publishers (OMN-14801,
# easy slice of the overlay-driven bus fix).
#
# WHY THIS EXISTS (OMN-14800 incident): the occ-autobind publisher's broker was
# sourced ONLY from the opaque repo secret `KAFKA_BOOTSTRAP_SERVERS`. When that
# secret was silently repointed dev -> stability out of band, the publisher kept
# running green while emitting to the WRONG lane -- there was no checked-in,
# reviewable truth to compare the injected value against, so the drift was
# invisible. This file is that independent truth: a versioned, diff-able,
# CODEOWNERS-reviewable map from CI lane id to the bus broker that lane is
# supposed to use. `scripts/publish_occ_autobind_command.py --lane <id>` resolves
# this file and FAILS LOUD on the trusted runner when the injected secret
# diverges from the declared broker for the lane -- turning a silent repoint into
# a red gate rather than a green no-op.
#
# CONFIG, NOT SECRET: broker addresses are lane endpoints (host:port), not
# credentials. Committing LAN addresses is sanctioned via the
# `# onex-allow-internal-ip` annotation (same pattern as
# omnibase_infra/docker/lane-overlays/dev.bifrost.yaml). SASL credentials are
# NEVER stored here -- they remain in secrets.KAFKA_SASL_{USERNAME,PASSWORD}.
#
# SEMANTICS of each lane's `security_protocol` / `sasl_mechanism` values
# (OMN-18012 -- the transport is DECLARED here, never inferred by the publisher):
#   security_protocol -> one of PLAINTEXT | SSL | SASL_PLAINTEXT | SASL_SSL,
#                        exactly as librdkafka spells it. REQUIRED on any lane
#                        whose broker is a concrete host:port or `from-secret`;
#                        the publisher fail-fasts when it is absent rather than
#                        guessing. Not needed on an `inmemory` lane (nothing is
#                        published cross-process).
#   sasl_mechanism    -> REQUIRED when security_protocol is SASL_*, e.g.
#                        SCRAM-SHA-256. MUST be absent otherwise; declaring a
#                        mechanism beside a non-SASL protocol is a contradiction
#                        and fail-fasts.
#
# WHY THE PUBLISHER MUST NOT INFER IT (OMN-18012, 2026-09-07 outage): the old
# `_kafka_producer_config` selected SASL_SSL/PLAIN whenever SASL credentials were
# present in the environment, and plaintext otherwise. When OMN-18012 Phase B
# enabled SASL/SCRAM-SHA-256 on the .201 dev-lane Redpanda EXTERNAL listener --
# which is SASL over PLAINTEXT, no TLS -- and the KAFKA_SASL_{USERNAME,PASSWORD}
# secrets were injected, that inference picked TLS against a listener that speaks
# none. Every OCC companion mint died with `SSL handshake failed: Disconnected:
# SSL connection closed by peer: connecting to a PLAINTEXT broker listener?`
# (93 occurrences in omnibase_infra run 34150470410) and a hard delivery timeout.
# Credential PRESENCE is not a statement about transport. The lane is.
#
# SEMANTICS of each lane's `broker` value:
#   inmemory      -> the in-process/in-memory bus (contract-as-data default).
#                    No cross-process broker; the CI publish is a no-op skip.
#   from-secret   -> trust the injected `KAFKA_BOOTSTRAP_SERVERS` verbatim; no
#                    independent truth yet, so NO divergence check is performed.
#                    This is the safe posture WHILE a broker/secret rotation is
#                    in flight -- byte-identical to the pre-OMN-14801 behavior.
#   <host:port>   -> the declared broker for the lane. The publisher PREFERS this
#                    committed value AND fail-loud-checks the injected secret
#                    against it on the trusted runner (the silent-drift guard).
#
# no lane / unknown lane / no overlay file -> in-memory `default` (no-op skip),
# EXCEPT on the trusted self-hosted runner for an authoring PR, where an
# unresolvable / undeclared lane is a wiring gap and FAILS LOUD (never a silent
# green no-op). See scripts/publish_occ_autobind_command.py.
#
# ROTATION SEQUENCING (OMN-14800 follow-up -- RESOLVED, OMN-14813): `dev` was
# `from-secret` while a `KAFKA_BOOTSTRAP_SERVERS` rotation was in flight. The
# rotation has settled and the canonical dev-lane broker
# (`omninode-pc.tail75df5e.ts.net:19092` -- the .201 runner_host Tailscale  # onex-allow-internal-ip OMN-16156 reason="pre-existing architectural comment describing the real committed dev-lane broker; not a new leak"
# MagicDNS name + the dev-lane Redpanda EXTERNAL listener, verified reachable)
# is now declared directly below. STALE-COMMENT CORRECTION (OMN-18012): earlier
# revisions of this file and of the omniclaude reusables asserted the dev-lane
# listener was plaintext with "SASL unused" (OMN-14813/OMN-14941). That stopped
# being true at ~16:40Z on 2026-09-07, when OMN-18012 Phase B enabled
# SASL/SCRAM-SHA-256 on it. The listener is SASL over PLAINTEXT -- authenticated,
# NOT encrypted -- and that fact now lives in the `dev` lane's declared
# `security_protocol` / `sasl_mechanism` below rather than in prose. Credentials
# themselves are still NEVER stored here.
# The occ-autobind fan-out no longer depends on
# the per-repo `KAFKA_BOOTSTRAP_SERVERS` GHA secret: with that secret dropped
# from call-occ-autobind.yml the publisher resolves the broker straight from
# this committed overlay (config-not-secret -- one reviewable source of truth),
# and an unreachable broker still fails loud (OMN-14639). This completes
# OMN-14801 design point 3 -- "drop KAFKA_BOOTSTRAP_SERVERS from GHA secrets
# entirely; CI publishers select --lane and resolve the broker from the overlay,
# never a raw address." The occ-autobind fan-out (this overlay + call-occ-
# autobind.yml, and the omniclaude reusable / omnibase_infra caller once this
# promotes to omnimarket main) no longer needs a `KAFKA_BOOTSTRAP_SERVERS`
# secret.
#
# OMN-17378 (2026-08-31): `pr-merged-publisher.yml` now resolves through this
# overlay too, with its `KAFKA_BOOTSTRAP_SERVERS` secret injection and its
# `source ~/.omnibase/.env` line both removed. That closes half of the OMN-14801
# point-5 residual, and it was not academic: that publisher's opaque secret is
# what let a hosted-runner misroute masquerade as a configured broker, so it ran
# GREEN and published NOTHING from 2026-08-27 to 2026-08-31 (topic stuck at
# HIGH-WATERMARK 97, last message PR #2159, while the repo merged through
# #2249). `runtime-rebuild-trigger.yml` is the one remaining raw-secret
# publisher and the last of the point-5 follow-up (see also OMN-15009 — it has
# never published once).

# SEMANTICS of a lane's optional `projection_readback` block (OMN-18060 -- the
# DSN is DECLARED BY NAME here, never by value):
#   dsn_env -> the NAME of the environment variable the projection readback
#              reads its Postgres DSN out of. A NAME, never a DSN. Nothing in
#              this file is a credential and nothing in it ever becomes one:
#              the value is injected into the job's environment from the lab
#              store / the repo secret of that same name, and reaches the node
#              through the environment only -- never argv, never a workflow
#              output, never a log line. The chain canary REFUSES a value that
#              parses as a DSN wherever a NAME is expected, so a value pasted
#              here is a red gate rather than a committed credential.
#
#   Declared on the `dev` lane ONLY, and the reader enforces that: the chain
#   canary's link-2 readback is a dev-lane instrument (CLAUDE.md "LANE SCOPE"
#   in .github/workflows/chain-canary.yml), and a projection DSN declared
#   against `stability`, `judge` or `prod` would point a probe at a lane it is
#   not authorized to read. A `projection_readback` block on any lane other
#   than `dev` is REFUSED by
#   omnibase_infra/src/omnibase_infra/nodes/node_chain_canary_effect/lane_transport.py
#   rather than honoured.
#
#   ABSENT means ABSENT. A lane with no `projection_readback` block makes the
#   readback report SKIPPED_NOT_CONFIGURED -- link 2 of OMN-16025 unproven,
#   and therefore RED. It never falls back to the bus terminal: OMN-14843
#   measured 26 of 38 correlations stranded mid-FSM while the topic layer was
#   healthy at the same moment, so a green terminal is not evidence about the
#   projection layer.

default: inmemory

lanes:
  # The occ-autobind authoring lane (the only lane call-occ-autobind.yml uses
  # today). Declares the concrete dev-lane Redpanda external listener directly
  # (OMN-14813): the publisher resolves the broker from THIS committed value with
  # NO `KAFKA_BOOTSTRAP_SERVERS` secret injected. If a secret is ever supplied
  # anyway it is fail-loud-checked against this value (the OMN-14800 silent
  # dev->stability repoint guard); absent, this value is used directly.
  dev:
    broker: "omninode-pc.tail75df5e.ts.net:19092"  # onex-allow-internal-ip OMN-14813 reason="dev-lane Redpanda external listener; config-not-secret, completes OMN-14801"
    # OMN-18012 Phase B enabled SASL/SCRAM-SHA-256 on this listener at ~16:40Z
    # on 2026-09-07. It is SASL over PLAINTEXT -- authenticated, not encrypted
    # (there is no TLS on :19092). Declared here so the publisher READS the
    # transport instead of inferring TLS from the presence of credentials.
    # The credentials stay in secrets.KAFKA_SASL_{USERNAME,PASSWORD}; only the
    # protocol names are config.
    security_protocol: SASL_PLAINTEXT
    sasl_mechanism: SCRAM-SHA-256
    # OMN-18060: link 2 of the OMN-16025 chain (the correlation-scoped
    # PROJECTION readback in node_chain_canary_effect). Run 34281968883 failed
    # closed on `projection_readback_not_configured` because no DSN was
    # declared anywhere -- which was correct behaviour and an unclosable gate.
    # This declares the NAME the DSN arrives under, on the dev lane only. The
    # value is a least-privilege READER on the .201 dev-lane Postgres
    # (`chain_canary_reader`, SELECT on delegation_workflow_state and nothing
    # else, NOSUPERUSER NOBYPASSRLS), provisioned through omnibase_infra's
    # migration corpus; the canary probes pg_roles on connect and REFUSES a
    # DSN whose role is superuser or BYPASSRLS.
    projection_readback:
      dsn_env: CHAIN_CANARY_PROJECTION_DSN

  # Non-authoring lanes: declared for completeness / future publishers. Left as
  # `inmemory` so an accidental `--lane stability|prod` from a CI publisher is a
  # no-op skip rather than a cross-process publish to a live runtime lane. Seed a
  # concrete broker only when a publisher legitimately targets these lanes --
  # and when you do, declare `security_protocol` (+ `sasl_mechanism` if SASL)
  # alongside it, or the publisher will fail-fast rather than guess (OMN-18012).
  stability:
    broker: inmemory
  prod:
    broker: inmemory
