#
# config/ci_bus_lanes.yaml
#
# Checked-in lane -> bus-broker overlay for the thin CI publishers (OMN-14801,
# easy slice of the overlay-driven bus fix).
#
# WHY THIS EXISTS (OMN-14800 incident): the occ-autobind publisher's broker was
# sourced ONLY from the opaque repo secret `KAFKA_BOOTSTRAP_SERVERS`. When that
# secret was silently repointed dev -> stability out of band, the publisher kept
# running green while emitting to the WRONG lane -- there was no checked-in,
# reviewable truth to compare the injected value against, so the drift was
# invisible. This file is that independent truth: a versioned, diff-able,
# CODEOWNERS-reviewable map from CI lane id to the bus broker that lane is
# supposed to use. `scripts/publish_occ_autobind_command.py --lane <id>` resolves
# this file and FAILS LOUD on the trusted runner when the injected secret
# diverges from the declared broker for the lane -- turning a silent repoint into
# a red gate rather than a green no-op.
#
# CONFIG, NOT SECRET: broker addresses are lane endpoints (host:port), not
# credentials. Committing LAN addresses is sanctioned via the
# `# onex-allow-internal-ip` annotation (same pattern as
# omnibase_infra/docker/lane-overlays/dev.bifrost.yaml). SASL credentials are
# NEVER stored here -- they remain in secrets.KAFKA_SASL_{USERNAME,PASSWORD}.
#
# SEMANTICS of each lane's `broker` value:
#   inmemory      -> the in-process/in-memory bus (contract-as-data default).
#                    No cross-process broker; the CI publish is a no-op skip.
#   from-secret   -> trust the injected `KAFKA_BOOTSTRAP_SERVERS` verbatim; no
#                    independent truth yet, so NO divergence check is performed.
#                    This is the safe posture WHILE a broker/secret rotation is
#                    in flight -- byte-identical to the pre-OMN-14801 behavior.
#   <host:port>   -> the declared broker for the lane. The publisher PREFERS this
#                    committed value AND fail-loud-checks the injected secret
#                    against it on the trusted runner (the silent-drift guard).
#
# no lane / unknown lane / no overlay file -> in-memory `default` (no-op skip),
# EXCEPT on the trusted self-hosted runner for an authoring PR, where an
# unresolvable / undeclared lane is a wiring gap and FAILS LOUD (never a silent
# green no-op). See scripts/publish_occ_autobind_command.py.
#
# ROTATION SEQUENCING (OMN-14800 follow-up -- RESOLVED, OMN-14813): `dev` was
# `from-secret` while a `KAFKA_BOOTSTRAP_SERVERS` rotation was in flight. The
# rotation has settled and the canonical dev-lane broker
# (`omninode-pc.tail75df5e.ts.net:19092` -- the .201 runner_host Tailscale  # onex-allow-internal-ip OMN-16156 reason="pre-existing architectural comment describing the real committed dev-lane broker; not a new leak"
# MagicDNS name + the dev-lane Redpanda EXTERNAL listener, verified reachable)
# is now declared directly below. The occ-autobind fan-out no longer depends on
# the per-repo `KAFKA_BOOTSTRAP_SERVERS` GHA secret: with that secret dropped
# from call-occ-autobind.yml the publisher resolves the broker straight from
# this committed overlay (config-not-secret -- one reviewable source of truth),
# and an unreachable broker still fails loud (OMN-14639). This completes
# OMN-14801 design point 3 -- "drop KAFKA_BOOTSTRAP_SERVERS from GHA secrets
# entirely; CI publishers select --lane and resolve the broker from the overlay,
# never a raw address." The occ-autobind fan-out (this overlay + call-occ-
# autobind.yml, and the omniclaude reusable / omnibase_infra caller once this
# promotes to omnimarket main) no longer needs a `KAFKA_BOOTSTRAP_SERVERS`
# secret.
#
# OMN-17378 (2026-08-31): `pr-merged-publisher.yml` now resolves through this
# overlay too, with its `KAFKA_BOOTSTRAP_SERVERS` secret injection and its
# `source ~/.omnibase/.env` line both removed. That closes half of the OMN-14801
# point-5 residual, and it was not academic: that publisher's opaque secret is
# what let a hosted-runner misroute masquerade as a configured broker, so it ran
# GREEN and published NOTHING from 2026-08-27 to 2026-08-31 (topic stuck at
# HIGH-WATERMARK 97, last message PR #2159, while the repo merged through
# #2249). `runtime-rebuild-trigger.yml` is the one remaining raw-secret
# publisher and the last of the point-5 follow-up (see also OMN-15009 — it has
# never published once).

default: inmemory

lanes:
  # The occ-autobind authoring lane (the only lane call-occ-autobind.yml uses
  # today). Declares the concrete dev-lane Redpanda external listener directly
  # (OMN-14813): the publisher resolves the broker from THIS committed value with
  # NO `KAFKA_BOOTSTRAP_SERVERS` secret injected. If a secret is ever supplied
  # anyway it is fail-loud-checked against this value (the OMN-14800 silent
  # dev->stability repoint guard); absent, this value is used directly.
  dev:
    broker: "omninode-pc.tail75df5e.ts.net:19092"  # onex-allow-internal-ip OMN-14813 reason="dev-lane Redpanda external listener; config-not-secret, completes OMN-14801"

  # Non-authoring lanes: declared for completeness / future publishers. Left as
  # `inmemory` so an accidental `--lane stability|prod` from a CI publisher is a
  # no-op skip rather than a cross-process publish to a live runtime lane. Seed a
  # concrete broker only when a publisher legitimately targets these lanes.
  stability:
    broker: inmemory
  prod:
    broker: inmemory
