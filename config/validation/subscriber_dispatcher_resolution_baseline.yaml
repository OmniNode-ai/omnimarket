# OMN-16939 / OMN-18013 — subscriber-dispatcher-resolution burn-down baseline.
#
# STATUS 2026-09-06: 43 of the original 50 rows are GONE. Every row this repo owns has
# been burned down in OMN-18013 — 38 by giving the topic its own `topic_match` entry
# carrying an explicit `message_category:`, and 12 subscribe declarations by DELETING a
# subscription that no handler in the node had a branch for (a declared subscription with
# no dispatcher is consumed, DLQ'd and COMMITTED on every message while the consumer group
# reads Stable / MEMBERS 1 / LAG 0 — strictly worse than not declaring it).
#
# OF THE SEVEN ROWS BELOW, FIVE ARE NOT THIS LANE'S TO FIX. They belong to the redeploy-FSM lane
# (ledger CLAIM docs/tracking/ROLLING_WORK_LEDGER.md:3904, lane=dev-lane-fsm-residuals,
# tickets OMN-16939 / OMN-17888), which owns node_redeploy_orchestrator and
# node_redeploy_deploy_effect. That lane reached TERMINAL at
# docs/tracking/ROLLING_WORK_LEDGER.md:4015 having landed omnimarket#2363 and
# omnibase_infra#3262, and these five rows were NOT among what it closed -- they still
# do not resolve (re-verified by running the gate, not assumed). Two lanes editing the
# same FSM contract is how a merge silently drops a handler branch, so this lane fenced
# them rather than racing the owner.
#
# They are also not a category fix. HandlerRedeployOrchestrator has NO branch for any of
# the four orchestrator topics, so routing them sends them down the redeploy-start path —
# and a runtime-booted event doing that is an unbounded redeploy loop. They need handler
# branches BEFORE they get a category. That is why their reason is `no_route`, not
# `category_mismatch`: no entry claims them at all.
#
# THIS FILE IS DELETED, AND `--baseline` REMOVED FROM EVERY INVOCATION, THE MOMENT THOSE
# FIVE ROWS LAND AND node_e2e_orchestrator GROWS A HANDLER CLASS.
# `tests/validators/test_topic_graph_closure_gates.py`, test
# `test_subscriber_dispatcher_baseline_is_only_the_fenced_rows`, holds this file to
# exactly these SEVEN (contract, topic) pairs across exactly these THREE contracts, so
# no new row can be added and the file cannot be re-frozen as a general exemption list.
#
# THIS IS A RATCHET, NOT AN EXEMPTION. It is SHRINK-ONLY:
#   * a (contract, topic) NOT listed here that fails to resolve   -> FAIL, always;
#   * a (contract, topic) listed here that now resolves           -> FAIL until removed.
known_unresolved_subscriptions:
  # node_e2e_orchestrator is NOT runtime-wired: it has no handler class and no
  # handler_routing block, and runs as its own standalone aiokafka consumer process
  # (`python -m omnimarket.nodes.node_e2e_orchestrator.consumer`, group E2E_ORCH_GROUP,
  # module-level async functions rather than a handler). Its event_bus.subscribe_topics
  # declaration therefore makes the RUNTIME open a second, dispatcher-less subscription
  # for the same two topics. Removing the declaration was tried and rejected: the
  # node-orphan-graph gate (scripts/validate_node_drift.py::_orphan_node_classification)
  # then classifies the node PRODUCER_ONLY and hard-fails, because a live node contract
  # must declare both sides. The real fix is to extract a handler class from consumer.py
  # and wire it -- a node refactor, not a category or alias fix, and out of scope for
  # OMN-18013's five gate items. Recorded as a residual on OMN-18013.
  - contract: node_e2e_orchestrator
    topic: onex.evt.omnimarket.build-loop-orchestrator-completed.v1
    category: event
    reason: no_route
  - contract: node_e2e_orchestrator
    topic: onex.evt.omnimarket.pr-lifecycle-orchestrator-completed.v1
    category: event
    reason: no_route
  - contract: node_redeploy_deploy_effect
    topic: onex.evt.deploy.rebuild-completed.v1
    category: event
    reason: category_mismatch
  - contract: node_redeploy_orchestrator
    topic: onex.evt.omnibase-infra.runtime-booted.v1
    category: event
    reason: no_route
  - contract: node_redeploy_orchestrator
    topic: onex.evt.omnibase-infra.runtime-manifest-published.v1
    category: event
    reason: no_route
  - contract: node_redeploy_orchestrator
    topic: onex.evt.omnimarket.readiness-gate-blocked.v1
    category: event
    reason: no_route
  - contract: node_redeploy_orchestrator
    topic: onex.evt.omnimarket.readiness-gate-completed.v1
    category: event
    reason: no_route
