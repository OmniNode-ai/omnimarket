# OMN-16939 / OMN-18013 — subscriber-dispatcher-resolution burn-down baseline.
#
# STATUS 2026-09-06: 43 of the original 50 rows are GONE. Every row this repo owns has
# been burned down in OMN-18013 — 38 by giving the topic its own `topic_match` entry
# carrying an explicit `message_category:`, and 12 subscribe declarations by DELETING a
# subscription that no handler in the node had a branch for (a declared subscription with
# no dispatcher is consumed, DLQ'd and COMMITTED on every message while the consumer group
# reads Stable / MEMBERS 1 / LAG 0 — strictly worse than not declaring it).
#
# STATUS 2026-09-16 (OMN-17296 AC2): the FOUR node_redeploy_orchestrator rows are GONE,
# leaving three. They are removed because the subscriptions they describe no longer
# exist: omnimarket#2375 (OMN-18026) deleted runtime-booted, runtime-manifest-published,
# readiness-gate-blocked and readiness-gate-completed from that contract's
# event_bus.subscribe_topics entirely. A burn-down row naming a subscription the contract
# does not declare is a false statement about the contract graph — the same class of
# falsehood the gate itself exists to remove — and it is strictly worse than a stale
# row that merely resolves, because there is nothing left to resolve.
#
# That deletion IS the disposition OMN-17296 AC2 records for this subscriber: DROP, not
# convert. It is now asserted in code, not only here:
# `tests/test_redeploy_orchestrator_dispatch_resolution.py` parses
# HandlerRedeployOrchestrator's `event_name ==` branches out of the handler source and
# fails any event subscription with no branch. That guard is the one this gate cannot
# supply — re-adding one of those topics with a correct `message_category: event` entry
# resolves cleanly HERE while every message lands on the handler's default
# redeploy-start branch, which for an attestation event is an unbounded redeploy loop.
#
# The THREE REMAINING ROWS ARE NOT THIS LANE'S TO FIX, and neither is read by the gate:
# `--baseline` is passed by no invocation in either repo (OMN-18013 removed it), so this
# file is inert config plus the `no-baseline-refreeze` pin. They are kept rather than
# deleted because each still records an open residual for its owner:
#   * node_redeploy_deploy_effect / rebuild-completed — the `category_mismatch` this row
#     names IS fixed (the entry now declares `message_category: event`) and the gate
#     reports it resolved, but the topic still dead-letters live on the .201 dev lane for
#     a DIFFERENT reason this gate cannot see: HandlerDeployPublishMonitor validates the
#     event as ModelDeployPublishCommand and raises. Observed 2026-09-16T10:48:44Z,
#     correlation b23b1a3b, `ValidationError: 12 validation errors`. Owner: the
#     redeploy-FSM lane (OMN-16939 / OMN-17888).
#   * the two node_e2e_orchestrator rows — see the comment on them below. The gate now
#     SKIPS contracts with no handler_routing entries by design, so their green is a
#     skip, not a fix.
#
# `tests/validators/test_topic_graph_closure_gates.py`, test
# `test_subscriber_dispatcher_baseline_is_only_the_fenced_rows`, holds this file to
# exactly these THREE (contract, topic) pairs across exactly these TWO contracts, so
# no new row can be added and the file cannot be re-frozen as a general exemption list.
#
# THIS IS A RATCHET, NOT AN EXEMPTION. It is SHRINK-ONLY:
#   * a (contract, topic) NOT listed here that fails to resolve   -> FAIL, always;
#   * a (contract, topic) listed here that now resolves           -> FAIL until removed.
known_unresolved_subscriptions:
  # node_e2e_orchestrator is NOT runtime-wired: it has no handler class and no
  # handler_routing block, and runs as its own standalone aiokafka consumer process
  # (`python -m omnimarket.nodes.node_e2e_orchestrator.consumer`, group E2E_ORCH_GROUP,
  # module-level async functions rather than a handler). Its event_bus.subscribe_topics
  # declaration therefore makes the RUNTIME open a second, dispatcher-less subscription
  # for the same two topics. Removing the declaration was tried and rejected: the
  # node-orphan-graph gate (scripts/validate_node_drift.py::_orphan_node_classification)
  # then classifies the node PRODUCER_ONLY and hard-fails, because a live node contract
  # must declare both sides. The real fix is to extract a handler class from consumer.py
  # and wire it -- a node refactor, not a category or alias fix, and out of scope for
  # OMN-18013's five gate items. Recorded as a residual on OMN-18013.
  - contract: node_e2e_orchestrator
    topic: onex.evt.omnimarket.build-loop-orchestrator-completed.v1
    category: event
    reason: no_route
  - contract: node_e2e_orchestrator
    topic: onex.evt.omnimarket.pr-lifecycle-orchestrator-completed.v1
    category: event
    reason: no_route
  - contract: node_redeploy_deploy_effect
    topic: onex.evt.deploy.rebuild-completed.v1
    category: event
    reason: category_mismatch
