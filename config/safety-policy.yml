#
# Policy for the Dependency Security Scan (safety check, enforcing step of
# .github/workflows/security-scan.yml). Dated exceptions, one per advisory.
# safety ignores the advisory only until the `expires` date; after that date
# the scan fails on it again.
version: '3.0'
security:
  ignore-vulnerabilities:
    SFTY-20261018-93041:
      reason: >-
        opentelemetry-exporter-otlp-proto-http 1.44.0, affected >=1.5.0,<1.45.0.
        Temporary one-week exception while the dependency range change that
        admits the patched release is made (OMN-25587).
      expires: '2026-11-25'
    SFTY-20261022-15927:
      reason: >-
        opentelemetry-api 1.44.0, affected <=1.45.0 (CVE-2026-114603, ReDoS).
        Temporary one-week exception while the dependency range change that
        admits a patched release is made (OMN-25587).
      expires: '2026-11-29'
