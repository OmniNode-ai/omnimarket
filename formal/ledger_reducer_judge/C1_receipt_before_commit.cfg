  Principals = {p1, p2}
  RowsPer = 1
  ConflictOn = FALSE
  MaxCrashes = 2
  MaxRelayCrashes = 1
  MaxReplays = 1
  DedupCheck = TRUE
  PerLedgerLock = TRUE
  SeqInTx = TRUE
  ReceiptBeforeCommit = TRUE
  GuardFromProjection = FALSE
  CommitOffsetFirst = FALSE
  RelayInOrder = TRUE
CHECK_DEADLOCK FALSE

SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT ReceiptTruth
