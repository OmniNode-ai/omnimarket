\* OMN-21949 adopted: expected no violation. Two principals, two accepted rows, two worker crashes in any gap, one relay crash between publish and mark, one writer replay per row
CONSTANTS
  Principals = {p1, p2}
  RowsPer = 1
  ConflictOn = FALSE
  MaxCrashes = 2
  MaxRelayCrashes = 1
  MaxReplays = 1
  DedupCheck = TRUE
  PerLedgerLock = TRUE
  SeqInTx = TRUE
  ReceiptBeforeCommit = FALSE
  GuardFromProjection = FALSE
  CommitOffsetFirst = FALSE
  RelayInOrder = TRUE
CHECK_DEADLOCK FALSE

SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT NoDuplicateRow
INVARIANT SeqGapless
INVARIANT SeqMatchesEventOrder
INVARIANT PrincipalInterleavingSerial
INVARIANT ReceiptTruth
INVARIANT GuardSeesAllPriorRows
INVARIANT GuardEffective
PROPERTY EveryRequestAnswered
PROPERTY EveryCommittedRowPublished
