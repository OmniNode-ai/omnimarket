\* OMN-21949 adopted with conflicting rows: expected no violation. The second row of the two is refused, in any order, with crashes, a relay crash and a replay
CONSTANTS
  Principals = {p1, p2}
  RowsPer = 1
  ConflictOn = TRUE
  MaxCrashes = 2
  MaxRelayCrashes = 1
  MaxReplays = 1
  DedupCheck = TRUE
  PerLedgerLock = TRUE
  SeqInTx = TRUE
  ReceiptBeforeCommit = FALSE
  GuardFromProjection = FALSE
  CommitOffsetFirst = FALSE
  RelayInOrder = TRUE
CHECK_DEADLOCK FALSE

SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT NoDuplicateRow
INVARIANT SeqGapless
INVARIANT SeqMatchesEventOrder
INVARIANT PrincipalInterleavingSerial
INVARIANT ReceiptTruth
INVARIANT GuardSeesAllPriorRows
INVARIANT GuardEffective
PROPERTY EveryRequestAnswered
PROPERTY EveryCommittedRowPublished
