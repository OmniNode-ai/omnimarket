#
# quality_gate_calibration_corpus.yaml — OMN-12964 / OMN-13218
#
# Known-good / known-bad outputs used to prove the delegation quality gate
# produces a NON-DEGENERATE score distribution. Before OMN-12964 the gate
# returned a degenerate {0.0, 1.0} verdict and (for the `document` task class)
# applied code-docstring DoD to prose, so every output — excellent or refusal —
# scored 0.000 on both tiers (live CID a604cd40). A scoring artifact then
# masqueraded as an ON/OFF effect, invalidating Experiments 1–3.
#
# OMN-13218: the blunt `min_length_chars_N` floor on the short-output task
# classes (document / documentation / summarization) hard-failed
# behaviorally-correct SHORT outputs (a correct one-sentence summary, a correct
# short prose document) purely on character count, forcing wasteful escalation.
# The floor is replaced by the `semantic_adequacy` heuristic: a complete answer
# (a terminated sentence or a complete structured artifact) passes at any length;
# an empty / whitespace-only / mid-token-truncated / bare-fragment stub fails.
# The bad cases below now fail on their REAL defects (refusal, accuracy
# disclaimer, truncation, missing docstring sections) — not on length — so the
# per-class margin (min_good - max_bad >= 0.3) is preserved honestly.
#
# This corpus is consumed by test_quality_gate_calibration.py, which is wired as
# a CI gate (see scripts/ci/run_quality_gate_calibration.py). The gate FAILS if
# the score distribution collapses, if known-good does not out-score known-bad,
# or if the score range falls below the discrimination threshold.
#
# Each case declares the task_class (DoD resolved from task_class_contracts.v1.yaml)
# a label in {good, mediocre, bad}, and the raw output content.

task_classes:
  document:
    deterministic:
      - response_non_empty
    heuristic:
      - no_refusal
      - accurate
      - semantic_adequacy
  documentation:
    deterministic:
      - docstring_present
    heuristic:
      - no_refusal
      - follows_google_style
      - covers_args_returns_raises
      - semantic_adequacy
  summarization:
    deterministic:
      - response_non_empty
    heuristic:
      - no_refusal
      - concise
      - accurate
      - semantic_adequacy
  # OMN-13354: research is a PROSE research task (cites theorems / papers /
  # sections). Its DoD must NOT require code-line citations — `cites_specific_lines`
  # is a CODE-line-citation regex no research answer can satisfy, which made the
  # research gate a catch-22 (every research output failed at every tier, live
  # 2026-06-19 reprove score 0.733). The research DoD now declares the
  # research-appropriate `cites_sources` (references / theorem N / [12] /
  # (Author, 2020) / URL / DOI) and `methodical_analysis` (reasoning structure).
  research:
    deterministic:
      - response_non_empty
    heuristic:
      - no_refusal
      - cites_sources
      - methodical_analysis

cases:
  # ---- document (prose) ----
  - id: doc_prose_excellent
    task_class: document
    label: good
    content: >-
      This module computes order totals across the cart. It validates each line
      item, applies the active discount schedule, and returns a typed summary
      object that the projection layer can persist without further coercion.
  # OMN-13218: a CORRECT SHORT prose document. ~68 chars — well below the old
  # 200-char floor that wrongly rejected it. Complete, accurate, no refusal:
  # it must PASS at tier 1, proving short-correct output no longer escalates.
  - id: doc_prose_short_correct
    task_class: document
    label: good
    content: This module computes order totals and returns a typed summary.
  - id: doc_prose_adequate
    task_class: document
    label: mediocre
    content: >-
      The module adds up the cart and returns a number. It handles discounts in
      some cases.
  - id: doc_prose_uncertain
    task_class: document
    label: bad
    # OMN-13218: a refusal + accuracy disclaimer that is also a truncated
    # fragment (ends mid-clause on a comma). Fails all three heuristics:
    # no_refusal ("i cannot") + accurate ("cannot verify") + semantic_adequacy
    # (mid-token truncation). Score = 0.600.
    content: >-
      This may be inaccurate, but I cannot verify the discount behavior,
  - id: doc_prose_refusal
    task_class: document
    label: bad
    # OMN-13218: refusal + accuracy disclaimer + truncated mid-clause. Fails all
    # three heuristics: no_refusal + accurate + semantic_adequacy. Score = 0.600.
    content: "I cannot help with this. Not sure what is needed and cannot verify,"
  - id: doc_prose_empty
    task_class: document
    label: bad
    content: "   "

  # ---- documentation (docstring) ----
  - id: docstring_full
    task_class: documentation
    label: good
    content: |-
      """Compute order totals.

      Args:
          cart: The cart whose line items are summed.
      Returns:
          A typed summary of the computed total.
      Raises:
          ValidationFailure: When a line item is malformed.
      """
  - id: docstring_partial
    task_class: documentation
    label: mediocre
    content: |-
      """Compute order totals.

      Args:
          cart: The cart whose line items are summed.
      Returns:
          A typed summary of the computed total.
      """
  - id: docstring_truncated
    task_class: documentation
    label: bad
    # OMN-13218: a truncated docstring stub (no closing fence, ends mid-clause).
    # Fails follows_google_style (no args:/returns:) + covers_args_returns_raises
    # + semantic_adequacy (mid-token truncation). docstring_present passes on the
    # opening `"""`. 3/4 heuristic fail → score 0.700.
    content: '"""Compute order totals for the cart by summing each line item and,'
  - id: docstring_refusal
    task_class: documentation
    label: bad
    content: I'm sorry, I cannot produce documentation for that.

  # ---- summarization ----
  - id: summary_concise_accurate
    task_class: summarization
    label: good
    content: >-
      The change adds a graded quality score so the gate discriminates output
      quality instead of collapsing every result to zero.
  # OMN-13218: a CORRECT SHORT summary — one complete sentence, ~72 chars, below
  # the old 100-char floor that wrongly rejected it. Concise, accurate, no
  # refusal: it must PASS at tier 1 (no escalation), which is the headline
  # acceptance criterion for this ticket.
  - id: summary_short_correct
    task_class: summarization
    label: good
    content: The gate now scores short correct summaries as adequate at tier one.
  - id: summary_uncertain
    task_class: summarization
    label: bad
    # OMN-13218: refusal + accuracy disclaimers + truncated mid-clause. Fails
    # three heuristics: no_refusal + accurate + semantic_adequacy (ends on a
    # comma). concise passes. Score = 0.700.
    content: "I cannot say what this does. Not sure and cannot verify the,"
  - id: summary_empty
    task_class: summarization
    label: bad
    content: ""

  # ---- research (OMN-13354) ----
  # A substantive research answer: cites a named theorem + author-year + a
  # bracketed reference + a section, and reasons through the claim (because /
  # therefore / evidence). No code line numbers — and it PASSES, proving the
  # research gate no longer demands the code-line markers it used to.
  - id: research_substantive
    task_class: research
    label: good
    content: >-
      The spectral theorem (Theorem 4.1, Reed & Simon, 1980) shows that every
      self-adjoint compact operator on a separable Hilbert space has an
      orthonormal eigenbasis. According to the proof in Section 3 the eigenvalues
      accumulate only at zero; therefore the operator is a norm limit of
      finite-rank operators, and the evidence in [12] supports this decomposition.
  # A second good research answer with different citation forms (theorem N +
  # equation N + author-year + references keyword) — not over-fit to one marker.
  - id: research_alt_citation_forms
    task_class: research
    label: good
    content: >-
      See Theorem 2 and equation 5 in the cited references. According to (Smith,
      2021) the number of labeled connected graphs grows asymptotically because
      the graph is labeled; therefore the evidence supports the stated bound.
  # OMN-13354: an unsupported answer that also refuses — fails no_refusal +
  # cites_sources + methodical_analysis (3/3 heuristic). response_non_empty passes.
  # Score = 0.600.
  - id: research_unsupported_refusal
    task_class: research
    label: bad
    content: "I cannot answer that. It is just true."
  - id: research_empty
    task_class: research
    label: bad
    content: "   "
