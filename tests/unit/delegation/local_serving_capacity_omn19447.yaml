# OMN-19447: what the local tier's model server actually serves, recorded from
# the server itself, so the declared capacity in bifrost_delegation.yaml has a
# fact to be compared against instead of a sentence.
#
# Read back live on 2026-09-24 from the .201 process table (the vLLM OpenAI
# server on port 8000 that answers for local-coder and local-heavy-reasoning).
# The same argument is committed in the lab host's service unit in
# omnibase_infra (deploy/systemd/vllm-gpu0-qwen38-27b.service). If the server
# is restarted with a different --max-num-seqs, this record and the declared
# capacity move together, in one change, or the test beside this file fails.
schema_version: local_serving_capacity.v1
tier: local
server:
  host_role: lab-gpu-201
  port: 8000
  engine: vllm
  served_model_name: Qwen3.8-27B
  max_num_seqs: 4
  max_model_len: 131072
  read_back_at: "2026-09-24T17:59:30Z"
  read_back_by: "process table readback of the running api_server arguments"
