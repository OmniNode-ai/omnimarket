        INC r      -> r = r + 1
        DEC r      -> r = r - 1
        JMP addr        -> jump to instruction number addr
        JNZ r, addr     -> if r != 0, jump to addr; otherwise continue to the next instruction
        JZ  r, addr     -> if r == 0, jump to addr; otherwise continue to the next instruction
        HALT       -> stop execution
      Trace the program step by step by hand (do not write or run any code).
      Program (16 instructions):

      00: SET A, 1
      01: SET B, 10
      02: SET E, 7
      03: MOV C, B
      04: MUL C, 4
      05: ADD A, C
      06: MOD A, 131
      07: SUB C, E
      08: MOD C, 103
      09: DEC B
      10: JNZ B, 03
      11: MUL A, 3
      12: MOD A, 500
      13: ADD A, E
      14: MOD A, 500
      15: HALT

      After the program HALTs, what is the final value of register A?
      Reply with only that integer and nothing else.

  - task_id: frontier_efficient_inversions
    benchmark_tier: frontier
    task_class: efficient_code_generation
    grader: code_exec
    entrypoint: count_inversions
    prompt: >-
      Write a Python function `count_inversions(arr)` that returns the number of
      inversions in the list `arr` — the number of index pairs (i, j) with i < j
      and arr[i] > arr[j]. Your solution MUST run in O(n log n) time or better: it
      will be graded against lists of up to 200,000 integers and must complete in
      well under a few seconds. A brute-force O(n^2) double loop is too slow and
      will fail grading — you need a divide-and-conquer or sort-based counting
      approach, not the naive nested loop. Reply with only a single Python code
      block.
    code_asserts: |
      import time
      assert count_inversions([2, 4, 1, 3, 5]) == 3
      assert count_inversions([1, 2, 3, 4, 5]) == 0
      assert count_inversions([5, 4, 3, 2, 1]) == 10
      assert count_inversions([]) == 0
      _n = 200000
      _arr = list(range(_n, 0, -1))
      _expected = _n * (_n - 1) // 2
      _start = time.perf_counter()
      _got = count_inversions(_arr)
      _elapsed = time.perf_counter() - _start
      assert _got == _expected, f"large-N correctness failed: got={_got} expected={_expected}"
      assert _elapsed < 5.0, (
          f"large-N (n={_n}) took {_elapsed:.2f}s; must complete in under 5.0s "
          "(an O(n^2) brute force will not clear this budget)"
      )

