# Explicit isolated test lane; never connects to a shared runtime.
lane: prompt-cost-estimate-test
lanes:
  prompt-cost-estimate-test:
    broker: "127.0.0.1:29926"
    security_protocol: PLAINTEXT
bus:
  bootstrap_servers: "127.0.0.1:29926"
  environment: integration-test
  security_protocol: PLAINTEXT
  timeout_seconds: 10
  max_retry_attempts: 1
  retry_backoff_base: 0.1
  enable_idempotence: false
  auto_offset_reset: earliest
  enable_auto_commit: false
  dead_letter_topic: null
  consumer_sleep_interval: 0.05
