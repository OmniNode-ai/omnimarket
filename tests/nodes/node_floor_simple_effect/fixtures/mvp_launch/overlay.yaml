# The shape of the MVP launch block's deployed overlay, with the estate's repository names replaced (the deployed file is the overlays
# repository's node_product_floor_verdict_compute_mvp_launch). (OMN-23205, MVP launch plan task M1): which 17 readings the floor's mvp_launch block holds, the
# producer each reads, that producer's cron (copied from its workflow's on.schedule), the grace the newest-run rule allows an absent
# run, the conclusion that counts as green, the packages whose versions the run must record equal to the launch candidate, and the
# Mac leg a customer-machine reading also needs. Grace: one cadence period for producers that run every 6 hours or more often, two
# hours for daily ones, one day for the weekly walk. C32 and R2..R6, R8 and both walks have no scheduled producer yet; their
# entries declare the schedule the plan asks for and read NOT WORKING until a scheduled run exists.
title: MVP launch
