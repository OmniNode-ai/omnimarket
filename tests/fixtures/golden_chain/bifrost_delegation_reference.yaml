# OMN-16442: was backend_id `local-reasoner` at `http://test-reasoner:8001`.
# That backend is RETIRED — .201:8001 was the RTX 4090 slot physically removed
# for RMA (OMN-16407; re-probed 2026-08-28, curl exit 7) — and `test`'s local
# membership in routing_tiers.yaml moved to `local-coder`. This reference
# contract is paired with the REAL routing_tiers.yaml (only the bifrost side is
# a fixture), so its backend_id must be one the live local tier still declares:
# otherwise routing resolves nothing and every test in the paired golden chain
# fails ONEX_CORE_041 "No tier has a configured endpoint for task_type='test'".
# The synthetic host/port were renamed with it so this file stops advertising a
# dead port. Provenance in delegation_test_artifact_chain.json was re-derived
# from the live path against this file (endpoint, endpoint_ref, model_id,
# request_hash, prompt_hash, routing_contract_hash all recomputed).
config_version: '2.0.0'
schema_version: bifrost_delegation.v1
backends:
  - backend_id: local-coder
    endpoint_url: "http://test-local-coder:8000"
    model_name: "test-local-coder"
    tier: local
    timeout_ms: 30000
    capabilities: [code_completion, context_window_large]
default_backends:
  - local-coder
routing_rules:
  - rule_id: "55555555-5555-4555-8555-555555555555"
    priority: 10
    task_class: test
    task_class_contract_version: "1.0.0"
    backend_policy_version: "2.0.0"
    match_operation_types: [chat_completion]
    match_capabilities: [code_completion]
    backend_ids: [local-coder]
    fallback_policy:
      action: return_error
      max_retries: 0
      on_exhaust: return_error
    shadow_policy_id: "66666666-6666-4666-8666-666666666666"
circuit_breaker:
  failure_threshold: 5
  window_seconds: 30
failover:
  max_attempts: 1
  backoff_base_ms: 0
shadow_mode:
  enabled: false
  policy_version: "test"
  log_sample_rate: 1.0
  comparison_logging_enabled: true
  max_shadow_latency_ms: 5.0
