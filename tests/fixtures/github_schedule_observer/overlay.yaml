# Neutral overlay for the GitHub schedule observer tests (OMN-20803): one scheduled
# workflow, one event-triggered workflow, one external dead-man.
schema_version: automation-liveness-overlay/v1
processes:
- process_id: github/example-repo/chain-canary
  owner_repo: example-owner/example-repo
  host: github
  trigger:
    kind: gh-schedule
    native_id: .github/workflows/chain-canary.yml
  expected_interval_seconds: 3600
  alarm_deadline_seconds: 21600
  max_runtime_seconds: 1800
  emitter: observer
  run_record: per-run
  evidence:
    source: workflow_runs
    locator: example-owner/example-repo .github/workflows/chain-canary.yml
    completion_record: run conclusion
  real_work: published
  demand: none
  positive_control:
    kind: class_drill
    ref: disable a scheduled workflow on a scratch repository
  state: active
- process_id: github/example-repo/deploy-on-merge
  owner_repo: example-owner/example-repo
  host: github
  trigger:
    kind: gh-event
    native_id: .github/workflows/deploy-on-merge.yml
  alarm_deadline_seconds: 2400
  max_runtime_seconds: 1800
  emitter: observer
  run_record: per-run
  evidence:
    source: workflow_runs
    locator: example-owner/example-repo .github/workflows/deploy-on-merge.yml
    completion_record: run conclusion
  real_work: deployed
  demand: none
  correlation:
    trigger_event: pull request merged to the default branch
    answer_event: example deploy completed
    match_key: merge commit sha
    answer_deadline_seconds: 1800
  positive_control:
    kind: class_drill
    ref: publish a trigger with no answer
  state: active
- process_id: github/deadman-repo/deadman
  owner_repo: example-owner/deadman-repo
  host: github
  trigger:
    kind: gh-schedule
    native_id: .github/workflows/deadman.yml
  expected_interval_seconds: 3600
  alarm_deadline_seconds: 21600
  max_runtime_seconds: 1800
  emitter: observer
  run_record: per-run
  evidence:
    source: workflow_runs
    locator: example-owner/deadman-repo .github/workflows/deadman.yml
    completion_record: run conclusion
  real_work: checked
  demand: none
  positive_control:
    kind: class_drill
    ref: stop the dead-man workflow on a scratch repository
  state: active
