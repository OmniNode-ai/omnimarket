id: s14_batch_all_members_held
scenario: S14
claim: >-
  C carries X and Y at their stamped heads and is green while both are held: C is
  not merged, rebuilt or closed, and waits. When both holds are released in the
  same tick, C merges with no rebuild.
tla_trace: [MemberEligibilityChange, CompCi, MemberEligibilityChange, MemberEligibilityChange, MemberEligibilityChange, CompanionMerge]
world:
  prs:
    - {pr: acme/app#1}
    - {pr: acme/lib#2}
  companions:
    - {pr: acme/occ#1, members: [acme/app#1@h1, acme/lib#2@h1]}
ticks:
  - tla: [MemberEligibilityChange, CompCi, MemberEligibilityChange]
    events:
      - hold: {pr: acme/app#1}
      - companion_ci: {companion: acme/occ#1, result: green}
      - hold: {pr: acme/lib#2}
    expect:
      actions: []
      verdicts: {acme/occ#1: wait}
  - tla: []
    expect:
      actions: []
      verdicts: {acme/occ#1: wait}
  - tla: [MemberEligibilityChange, MemberEligibilityChange, CompanionMerge]
    events:
      - release: {pr: acme/app#1}
      - release: {pr: acme/lib#2}
    expect:
      actions: ["merge acme/occ#1 h1"]
      rebuilds: []
end:
  pr_state: {acme/occ#1: merged}
