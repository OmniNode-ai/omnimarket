      ci: green
      merge_state: behind
ticks:
  - expect:
      actions: ['update_branch acme/internal#540']
      lease_count: 0
  - expect:
      actions: []
      lease_count: 0
  - expect:
      actions: ['update_branch acme/internal#540']
      lease_count: 0
  - events:
      - ci: {pr: 'acme/internal#540', result: green}
    expect:
      actions: ['merge acme/internal#540 h2']
      lease_count: 0
end:
  dispatches: {}
