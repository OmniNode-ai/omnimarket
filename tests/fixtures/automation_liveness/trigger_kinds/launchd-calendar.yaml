# Frozen seam fixture (OMN-20793): one overlay entry of trigger kind launchd-calendar.
# Neutral names only; real processes live in a private overlay.
schema_version: automation-liveness-overlay/v1
processes:
- process_id: host-a/example-calendar-job
  owner_repo: example-owner/example-repo
  host: host-a
  trigger:
    kind: launchd-calendar
    native_id: com.example.calendar-job
  expected_interval_seconds: 86400
  alarm_deadline_seconds: 180000
  max_runtime_seconds: 1800
  emitter: observer
  run_record: per-run
  evidence:
    source: receipts_file
    locator: example-state/calendar-job/receipts.jsonl
    completion_record: finished_at and exit_code
  real_work: published
  demand: eligible > 0
  idle_runs_before_alarm: 2
  positive_control:
    kind: class_drill
    ref: stop a launchd calendar job
  state: active
