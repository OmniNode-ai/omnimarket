#
# The prompts the delegation capability matrix of 2026-09-25 recorded as
# misrouted by task-class selection (OMN-19523). Each prompt is committed
# VERBATIM beside this file, copied byte for byte from the matrix lanes' run
# directories; nothing is reconstructed.
#
# needed_class is the class the work needed, and `evidence` says where that
# comes from: the class the lane chose explicitly on a rerun of the same work,
# or the class whose grading accepted the same answer shape in the matrix.
# `was` is what dev resolved it to, from the run's own stderr line.
#
# A row whose needed_class is null is a residual: no request-scope rule can
# route it, and `residual` says why. Those rows are kept so the corpus stays
# the whole recorded set and a later fix has the prompts to replay.
prompts:
