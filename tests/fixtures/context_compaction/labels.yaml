schema: omnimarket/context_compaction_labels/1
plan_task: TE.1
ticket: OMN-21138
manifest: tests/fixtures/context_compaction/manifest.yaml (plan task T0.2); each case binds by transcript_chain_sha256
replay_root_env: ONEX_CONTEXT_REPLAY_ROOT (required, no default)
authored_before_model_output: true
offsets:
  unit: Python str indices (code points) into the record's `content`, half-open [start, end)
  record: the chain record whose event_id and chunk_index are given
  normalisation: runs of whitespace collapse to one space, then strip
  span_sha256: sha256 of the UTF-8 bytes of the normalised span
scoring:
  written_before_any_model_run: true
  recall: a proposition is recalled when an admitted event sits in the same record (or one listed in same_content_event_ids),
    its admitted span covers [start, end) whole, and its kind equals the label's kind; overlap alone scores
    nothing
  hard_gate: every proposition with a t02_statement_id is recalled in every repeated run
  negative_controls: a control is never scored as the item it controls and never admitted as a candidate
    of that item's kind; a corrected ruling is credited only when its correction is recalled with it
  negative_segments: an event admitted inside a negative segment counts against precision
  already_done: the fixed answer proposes no already_done item
  kinds:
  - ruling
  - correction
  - constraint
  - decision
  polarities:
  - affirm
  - negate
not_in_this_set: Role C labels (tests/fixtures/context_eval/<profile>/) wait on the per-profile manifests
  of plan task TC.9
