---
# ONEX Pre-commit Configuration — omnimarket
#
# Hooks:
#   - ruff format + lint (auto-fix)
#   - Stub implementation detection (from omnibase_core)
#   - TODO format enforcement (from onex_change_control)
#   - Hardcoded topic string prevention (from onex_change_control)
#
# Usage:
#   pre-commit install
#   pre-commit run --all-files

repos:
  # Stub implementation detection + receipt-honesty gate — sourced from
  # omnibase_core (OMN-5599 stub; OMN-12791 honesty). Rev bumped to a commit
  # that exports check-receipt-honesty (OMN-12825 gate-coverage prep).
  - repo: https://github.com/OmniNode-ai/omnibase_core
    rev: 3a15187eb704995a397de9b3a8aae69797c365a8 # pragma: allowlist secret
    hooks:
      - id: check-stub-implementations
      # OMN-12791: scan ModelDodReceipt YAML for gamed probes, deferred
      # evidence, self-attestation, fake human verifiers. Triggers only on
      # files under drift/dod_receipts/ (hook's own `files` filter), so it is
      # a no-op for omnimarket PRs that carry no receipt YAMLs.
      - id: check-receipt-honesty

  # Shared ONEX governance hooks (onex_change_control)
  - repo: https://github.com/OmniNode-ai/onex_change_control
    rev: 8d7e85bc00e7f1b1306d1cb40949be1ab6e7e91a  # pragma: allowlist secret
    hooks:
      - id: no-hardcoded-topics
        stages: [pre-commit]
        exclude: "^(src/omnimarket/nodes/node_emit_daemon/registries/claude_code\\.yaml|scripts/lint_no_hardcoded_topics\\.py|scripts/ci/check_no_hardcoded_topics\\.py|src/omnimarket/logging/structured_logger\\.py|src/omnimarket/nodes/node_.*/handlers/handler_.*\\.py|src/omnimarket/nodes/node_.*/handlers/overseer_tick\\.py|src/omnimarket/nodes/node_.*/models/model_.*\\.py|src/omnimarket/nodes/node_.*/__main__\\.py|src/omnimarket/nodes/node_.*/contracts/.*\\.yaml|src/dep_health_allowlist\\.yaml|docs/adr-canary/.*|src/omnimarket/cli/.*)$"
      - id: no-untracked-todos
        stages: [pre-commit]

  # Essential file formatting
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1000]

  # Topic naming lint — producer-segment allowlist (OMN-8507)
  # Requires omnibase_infra at $OMNIBASE_INFRA_PATH or ../omnibase_infra.
  - repo: local
    hooks:
      # OMN-10580: Leaked-literals gate — blocks hardcoded LAN IPs, personal
      # paths, private model IDs from being committed. Add an inline annotation
      # to exempt a legitimate occurrence (see docs/leaked-literals-governance.md).
      - id: leaked-literals-gate
        name: Leaked literals gate (OMN-10580)
        language: system
        entry: bash scripts/validation/check_leaked_literals.sh blocking diff
        pass_filenames: false
        stages: [pre-commit]

      - id: topic-naming-lint
        name: Topic Naming Lint
        language: system
        entry: bash scripts/validation/run_topic_lint.sh
        pass_filenames: false
        stages: [pre-commit]

      - id: event-registry-drift
        name: Event registry drift validator
        language: system
        entry: uv run python -m omnimarket.validators.event_registry_drift
        pass_filenames: false
        files: ^(src/omnimarket/nodes/node_emit_daemon/(event_registry\.py|registries/topics\.yaml|models/.*\.py)|src/omnimarket/validators/event_registry_drift\.py|scripts/validation/event_registry_drift_baseline\.txt)$
        stages: [pre-commit]

      # OMN-8611: entry-point format check (fast, triggers on pyproject.toml changes)
      # Validates that all [project.entry-points."onex.nodes"] entries are valid
      # dotted module paths. Does not verify filesystem — CI runtime_sweep does that.
      - id: entry-point-format
        name: Entry point format check
        language: system
        entry: python scripts/ci/check_entry_point_format.py
        files: ^pyproject\.toml$
        pass_filenames: true
        stages: [pre-commit]

      # OMN-12693: contract-level producer/consumer shape gate.
      # SYNC with node-drift-gate.yml full strict check.
      - id: node-orphan-graph
        name: Node orphan graph gate
        language: system
        entry: uv run python scripts/validate_node_drift.py --check-all --check-orphan-nodes --strict
        files: ^(src/omnimarket/nodes/node_.*/contract\.yaml|pyproject\.toml)$
        pass_filenames: false
        stages: [pre-commit]

      # OMN-12957: runtime_profiles contract validator (omnibase_core).
      # Enforces runtime_profiles_missing (OMN-9886) + runtime_profile_unregistered
      # (declared profile not in canonical REGISTERED_RUNTIME_PROFILES) +
      # runtime_profile_no_consumer_lane (subscribing REDUCER/EFFECT names no
      # consumer-attached profile). Pre-existing violators are frozen in
      # validation/runtime_profiles_allowlist.yaml (drain tracked by OMN-12982).
      # Blocks NEW orphans. Requires the omnibase_core pin to include OMN-12957's
      # validator (new rules).
      #
      # OMN-12955: invoke via scripts/ci/run_runtime_profiles_validator.py so the
      # repo-local allowlist (validation/runtime_profiles_allowlist.yaml) is loaded
      # the SAME way as the required CI gate (validator-runtime-profiles.yml). The
      # bare module entry resolves its allowlist from the omnibase_core *package*
      # dir, not this repo, so it spuriously flagged every frozen contract locally
      # while CI passed.
      - id: onex-validate-runtime-profiles
        name: Validate runtime_profiles on node contracts (OMN-12957)
        language: system
        entry: uv run python scripts/ci/run_runtime_profiles_validator.py
        files: ^src/omnimarket/nodes/node_.*/contract\.yaml$
        pass_filenames: false
        stages: [pre-commit]

      # OMN-10909: stricter topic-literal gate (delegation thin-shim plan, Task 8).
      # Allowlist: topics.py, test_*/conftest* files, inline `# onex-topic-allow`
      # annotations. SYNC with ci.yml step "Topic-literal guardrail (annotation allowlist)".
      - id: no-hardcoded-topics-annotated
        name: Topic-literal guardrail (annotation allowlist)
        language: system
        entry: uv run python scripts/ci/check_no_hardcoded_topics.py
        files: ^src/omnimarket/.*\.py$
        pass_filenames: false
        stages: [pre-commit]

      # OMN-12856: Fail if any omnimarket source reads GH_PAT/GH_TOKEN/GITHUB_TOKEN
      # via os.environ/os.getenv. The canonical path after OMN-12856 is
      # contract_secret_ref + resolve_api_key. SYNC with ci.yml step
      # "GitHub-token env-read gate (enforce)".
      - id: github-token-env-gate
        name: GitHub-token env-read gate
        language: system
        entry: uv run python scripts/ci/check_github_token_env_reads.py
        files: ^(src/omnimarket/.*\.py|scripts/ci/check_github_token_env_reads\.py)
        pass_filenames: false
        stages: [pre-commit]

      # OMN-12821 (plan A1.5): routing-authority demo gate. Proves the demo path
      # resolves provider/model/endpoint_ref/endpoint/route_source from authority
      # and that no demo-path source reads env for endpoint/provider/model,
      # hardcodes a provider literal, or reads a fallback endpoint string.
      # Extended in OMN-12877 (M7.2) to add residue audit over confirmed env-var
      # residue files (bridge_config_loader, cli_ab_compare_suite, model_policy).
      # Extended in OMN-12883 (M7.2) to add provider-class endpoint URL shape
      # audit over bifrost_delegation.yaml.
      # SYNC with ci.yml step "Routing-authority demo gate (enforce)".
      - id: routing-authority-demo-gate
        name: Routing-authority demo gate
        language: system
        entry: uv run python scripts/ci/check_routing_authority.py
        files: >-
          ^(src/omnimarket/nodes/node_generation_consumer/|
          src/omnimarket/nodes/node_llm_delegation_call_effect/|
          src/omnimarket/adapters/llm/bifrost/|
          src/omnimarket/configs/bifrost_delegation\.yaml|
          src/omnimarket/inference/bridge_config_loader\.py|
          src/omnimarket/cli/cli_ab_compare_suite\.py|
          src/omnimarket/model_policy\.yaml|
          scripts/ci/check_routing_authority\.py)
        pass_filenames: false
        stages: [pre-commit]

      # OMN-12942: node migration sets must create base tables before the views
      # that read them. A view-before-base-table migration hard-fails the
      # forward-migration runner on a clean node-set apply (this forced
      # node_projection_llm_routing's view to be pruned during the 2026-06-11
      # stability hot-patch). SYNC with ci.yml step "Migration base-before-view gate".
      - id: migration-base-before-view
        name: Migration base-table-before-view gate
        language: system
        entry: uv run python scripts/ci/check_migration_base_before_view.py
        files: ^(src/omnimarket/nodes/.*/migrations/.*\.sql|scripts/ci/check_migration_base_before_view\.py)$
        pass_filenames: false
        stages: [pre-commit]

      # OMN-12971: backend secret-ref / credential-ref discipline gate. Fails if a
      # literal credential value (PEM key, service-account JSON, bearer/api-key)
      # lands in routing-authority config, or if an authenticated cloud backend
      # lacks a logical secret/credential ref. Keeps the Vertex ADC path (and all
      # cloud backends) value-free in committed config.
      # SYNC with ci.yml step "Backend secret-discipline gate (enforce)".
      - id: backend-secret-discipline-gate
        name: Backend secret-discipline gate
        language: system
        entry: uv run python scripts/ci/check_backend_secret_discipline.py
        files: ^(src/omnimarket/configs/bifrost_delegation\.yaml|src/omnimarket/configs/routing_tiers\.yaml|src/omnimarket/data/model_registry/model_registry_v1\.yaml|scripts/ci/check_backend_secret_discipline\.py)
        pass_filenames: false
        stages: [pre-commit]

      # OMN-12972 (plan P2.7): Gemini registry/version hygiene gate. Enforces
      # that every provider:google registry entry + its bifrost backend align
      # with the live Vertex-served model name PER ENVIRONMENT (Vertex names are
      # publisher-qualified; AI Studio names are bare) and that no entry carries a
      # retired/404 model id (the gemini-2.0-flash-on-Vertex failure).
      # SYNC with ci.yml step "Gemini registry/version hygiene gate (enforce)".
      - id: gemini-registry-version-hygiene
        name: Gemini registry/version hygiene gate
        language: system
        entry: uv run python scripts/ci/check_model_registry_served_names.py
        files: ^(src/omnimarket/data/model_registry/model_registry_v1\.yaml|src/omnimarket/configs/bifrost_delegation\.yaml|scripts/ci/check_model_registry_served_names\.py)
        pass_filenames: false
        stages: [pre-commit]

      # OMN-12691: live-path node changes must ship with golden-chain coverage.
      # SYNC with ci.yml step "Golden-chain coverage gate".
      - id: golden-chain-coverage-gate
        name: Golden-chain coverage gate
        language: system
        entry: uv run python scripts/ci/check_golden_chain_coverage.py --staged
        files: ^(src/omnimarket/nodes/node_.*/|tests/.*/?test_golden_chain.*\.py$)
        pass_filenames: false
        stages: [pre-commit]

      # OMN-12959: FSM terminal-state invariant — watchdog topic literals may
      # only live in the canonical omnimarket.events.topics registry (the source
      # of truth; omnimarket.events.watchdog imports them and exposes the typed
      # EnumWatchdogEventType authority). Forces the typed authority instead of
      # hardcoded strings. SYNC with ci.yml step "Watchdog-topic authority gate".
      - id: watchdog-topic-authority-gate
        name: Watchdog-topic authority gate
        language: system
        entry: uv run python scripts/ci/check_watchdog_topic_authority.py
        files: ^(src/omnimarket/.*\.py|scripts/ci/check_watchdog_topic_authority\.py)
        pass_filenames: false
        stages: [pre-commit]

  # Ruff — standalone pre-commit hooks (no uv source resolution needed)
  # Using astral-sh/ruff-pre-commit avoids `uv run ruff` which fails in worktrees
  # because uv.sources relative paths (../omnibase_core) resolve against the worktree
  # parent directory instead of $OMNI_HOME. (OMN-8103)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.9
    hooks:
      - id: ruff-format
        args: [src/, tests/]
        pass_filenames: false

      - id: ruff
        alias: ruff-fix
        name: ruff check (auto-fix)
        args: [--fix, --exit-non-zero-on-fix, src/, tests/]
        pass_filenames: false

  - repo: local
    hooks:
      - id: normalization-symmetry
        name: normalization-symmetry
        entry: uv run python -m omnibase_core.validation.checker_normalization_symmetry
        language: system
        pass_filenames: false

      # OMN-11040: Dependency health gate — blocks new CRITICAL/MAJOR dependency
      # health findings from being committed. Baseline-first: set
      # --severity-threshold to INFO to observe all findings without blocking.
      - id: dep-health-gate
        name: Dependency health gate
        language: system
        entry: bash scripts/validation/run_dep_health_gate.sh
        pass_filenames: false
        stages: [pre-commit]

      # OMN-10738: Blocks silent localhost/hardcoded-endpoint fallbacks in env reads
      - id: validate-no-env-fallbacks
        name: Validate no silent env fallbacks
        language: system
        entry: uv run python scripts/validation/validate_no_env_fallbacks.py
        pass_filenames: false
        files: ^src/.*\.py$
        stages: [pre-commit]

      # Skip-token rejection gate (OMN-11412 / OMN-10414)
      # Blocks [skip-*] bypass tokens in staged markdown/yaml/txt files.
      # Escape hatch: add '# skip-token-allowed: <receipt-id>' with a traceable approval receipt.
      - id: reject-deploy-gate-skip-token
        name: Reject skip-gate bypass tokens (OMN-10414)
        entry: .pre-commit-hooks/reject-deploy-gate-skip-token.sh
        language: script
        pass_filenames: true
        always_run: true
        stages: [pre-commit]
        exclude: ^tests/.*fixtures/
      - id: reject-deploy-gate-skip-token-commit-msg
        name: Reject skip-gate bypass tokens in commit messages (OMN-10414)
        entry: .pre-commit-hooks/reject-deploy-gate-skip-token.sh
        language: script
        pass_filenames: true
        stages: [commit-msg]

      # mypy type checking (OMN-11412: added missing mypy pre-commit hook)
      - id: mypy-type-check
        name: mypy (type checking - strict)
        entry: bash -c 'uv run mypy "$@" --show-error-codes --no-error-summary' --
        language: system
        types: [python]
        files: ^src/omnimarket/.*\.py$
        pass_filenames: true
        stages: [pre-push]

# Configuration
default_install_hook_types: [pre-commit]
default_stages: [pre-commit]
fail_fast: false
