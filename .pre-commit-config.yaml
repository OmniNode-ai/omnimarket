---
# ONEX Pre-commit Configuration — omnimarket
#
# Hooks:
#   - ruff format + lint (auto-fix)
#   - Stub implementation detection (from omnibase_core)
#   - TODO format enforcement (from onex_change_control)
#   - Hardcoded topic string prevention (from onex_change_control)
#
# Usage:
#   pre-commit install
#   pre-commit run --all-files

repos:
  # Stub implementation detection + receipt-honesty gate + transport-mock lint
  # sourced from omnibase_core. Rev bumped to OMN-13026 (transport-mock-lint).
  - repo: https://github.com/OmniNode-ai/omnibase_core
    rev: cfaa6ec863c3026b5e65196151ed76cdad13dae3 # pragma: allowlist secret
    hooks:
      - id: check-stub-implementations
      # OMN-12791: scan ModelDodReceipt YAML for gamed probes, deferred
      # evidence, self-attestation, fake human verifiers. Triggers only on
      # files under drift/dod_receipts/ (hook's own `files` filter), so it is
      # a no-op for omnimarket PRs that carry no receipt YAMLs.
      - id: check-receipt-honesty
      # OMN-13026: bare AsyncMock/MagicMock without spec=/spec_set= on
      # EventBus/transport/kafka surfaces. Ratchet: existing violations frozen
      # in validation/transport_mock_baseline.yaml (101 violations, 26 files).
      # New violations blocked. Drain tracked by OMN-13026 per-site tickets.
      - id: transport-mock-lint
        args: [--baseline, validation/transport_mock_baseline.yaml]

  # FSM YAML-vs-handler drift guard (OMN-13735). Consumes the canonical validator
  # exported by omnibase_core (check-fsm-handler-drift). Reconciles each reducer
  # contract.yaml's fsm_handler_binding-declared state_machine slice against the
  # handler's VALID_TRANSITIONS / GUARD_CONDITIONS Python symbols via AST literal
  # eval; any (from_state, trigger)->to_state or guard divergence blocks. Pinned to
  # the omnibase_core#1360 PR head; re-pin to the merged-dev SHA once it lands.
  - repo: https://github.com/OmniNode-ai/omnibase_core
    rev: 2d6e64e76a8bd90757eeacb8b4663c8e187beb59 # pragma: allowlist secret
    hooks:
      - id: check-fsm-handler-drift

  # Canonical Inference Gate (OMN-13249, fleet rollout of OMN-13219).
  # Rejects NEW non-canonical model-inference surfaces: shelled model CLIs
  # (codex/claude/gemini/opencode) and *_MODEL/*_PROVIDER env reads. Structural
  # carve-out: a model-CLI shell-out is permitted iff the enclosing node
  # contract.yaml declares descriptor.agent_invocation: true (a contract fact,
  # never a free-text comment). Ratchet: existing violations grandfathered in the
  # shared baseline at omnibase_core/src/omnibase_core/validation/baselines/canonical_inference_baseline.json;
  # baseline is burn-down only. Suppression: # canonical-inference-ok: <reason>
  - repo: https://github.com/OmniNode-ai/omnibase_core
    rev: 940d2f2ab44d2f455a607926674b90ecbc9b74ba # pragma: allowlist secret
    hooks:
      - id: check-canonical-inference
        args: [--repo, omnimarket, --repo-root, .]
        exclude: ^(tests/|archived/|archive/).*\.py$
  # URL Authority Gate (OMN-13298, child of OMN-12803).
  # Ratchet: NEW fingerprints fail; existing violations grandfathered in the
  # shared baseline at omnibase_core/src/omnibase_core/validation/baselines/url_authority_baseline.json.
  # Baseline is burn-down only. Suppress with: # url-authority-ok: <reason>
  - repo: https://github.com/OmniNode-ai/omnibase_core
    rev: c93c98c92bd1a5b335d7aa504a8cf63dc029b3e7 # pragma: allowlist secret
    hooks:
      - id: check-url-authority
        args: [--repo, omnimarket, --repo-root, .]
        exclude: ^(tests/|archived/|archive/).*\.py$
  # OMN-13284: canonical Plugin* lifecycle guard. omnimarket owns ONEX node packages
  # and could reintroduce a Plugin* daemon/worker/consumer lifecycle owner; consume
  # the canonical omnibase_core remote hook. Rev pins the core commit carrying the
  # no-plugin-daemon-classes export; bumps to the squash-merge SHA when the core
  # OMN-13284 PR lands.
  - repo: https://github.com/OmniNode-ai/omnibase_core
    rev: a509d3fb2777693242fdcd979e5d67bed2bbefeb # pragma: allowlist secret
    hooks:
      - id: no-plugin-daemon-classes
        files: ^src/omnimarket/.*\.py$

  # OMN-14350: non-canonical lifecycle-class ratchet (fan-out from the omnibase_core
  # canary #1430). Consumes the canonical omnibase_core remote hook and ratchets this
  # repo's frozen residual set (.onex_ratchets/noncanonical_class_allowlist.yaml) DOWN
  # toward zero. rev MUST be a specific core SHA carrying the validator + its
  # .pre-commit-hooks.yaml export (core dev HEAD after #1430 squash-merges) — never a
  # moving ref like @dev (required gate; deterministic-truth doctrine). The token below
  # is a HOLD placeholder; this PR stays unopened until the real post-merge SHA is set.
  - repo: https://github.com/OmniNode-ai/omnibase_core
    rev: 63635097705d832e0ee9c4811093efb31349105c # pragma: allowlist secret
    hooks:
      - id: no-noncanonical-lifecycle-classes
        args: [--allowlist, .onex_ratchets/noncanonical_class_allowlist.yaml, src/omnimarket]
        files: ^src/omnimarket/.*\.py$

  # Transport-import + node-purity gates — first purity gate in omnimarket
  # (OMN-13283 / GAP-8a, under OMN-9048). Scoped to COMPUTE and REDUCER node code,
  # which the architecture mandates be pure (no I/O); EFFECT/ORCHESTRATOR nodes are
  # the designated I/O boundary and are intentionally out of scope. The compute/
  # reducer tree is clean today (0 violations), so these gates go blocking
  # immediately with no baseline. Pin advances to the core merge SHA once
  # omnibase_core#1272 lands.
  - repo: https://github.com/OmniNode-ai/omnibase_core
    rev: 664c42c354cb19c3a127a1564312c54bf2377127 # pragma: allowlist secret
    hooks:
      # Co-located node tests legitimately perform file I/O (fixtures, temp dirs)
      # and are excluded. The 14 handler/consumer files below carry pre-existing
      # I/O in compute/reducer code (audit/sweep nodes reading repo files, merge-sweep
      # consumer, reducer state projections); they are grandfathered here so the gate
      # goes blocking now for all other compute/reducer code, with the burn-down
      # tracked as an OMN-9048 follow-up. New violations elsewhere fail.
      - id: validate-no-transport-imports
        files: ^src/omnimarket/nodes/node_[^/]*_(compute|reducer)/
        exclude: >-
          (?x)(
            /tests/|/test_[^/]*\.py$
            |^src/omnimarket/nodes/node_merge_sweep_compute/(__main__|consumer)\.py$
            |^src/omnimarket/nodes/node_navigation_history_reducer/handlers/handler_navigation_history_reducer\.py$
          )
      - id: node-purity
        files: ^src/omnimarket/nodes/node_[^/]*_(compute|reducer)/
        exclude: >-
          (?x)(
            /tests/|/test_[^/]*\.py$
            |^src/omnimarket/nodes/node_bus_audit_compute/handlers/handler_bus_audit_compute\.py$
            |^src/omnimarket/nodes/node_contract_drift_compute/handlers/handler_contract_drift_compute\.py$
            |^src/omnimarket/nodes/node_delegation_routing_reducer/handlers/handler_delegation_routing\.py$
            |^src/omnimarket/nodes/node_env_parity_compute/handlers/handler_env_parity_compute\.py$
            |^src/omnimarket/nodes/node_feature_dashboard_compute/handlers/handler_feature_dashboard_compute\.py$
            |^src/omnimarket/nodes/node_gap_compute/handlers/handler_gap_compute\.py$
            |^src/omnimarket/nodes/node_insights_to_plan_compute/handlers/handler_insights_to_plan_compute\.py$
            |^src/omnimarket/nodes/node_ledger_hash_compute/handlers/handler_ledger_hash\.py$
            |^src/omnimarket/nodes/node_merge_sweep_compute/(__main__|consumer)\.py$
            |^src/omnimarket/nodes/node_navigation_history_reducer/handlers/handler_navigation_history_reducer\.py$
            |^src/omnimarket/nodes/node_skill_functional_audit_compute/handlers/handler_skill_functional_audit_compute\.py$
            |^src/omnimarket/nodes/node_swarm_registry_compute/handlers/handler_swarm_registry\.py$
            |^src/omnimarket/nodes/node_ticket_research_enrichment_compute/handlers/handler_ticket_research_enrichment\.py$
          )

  # OMN-13291 (W0): validator-requirements fleet gate. Reports ALL missing
  # required gates for omnimarket against omnibase_core's
  # architecture-handshakes/validator-requirements.yaml, ratcheted by this
  # repo's own architecture-handshakes/validator-requirements-baseline.yaml.
  # Re-pin rev to the merged-dev SHA once omnibase_core#<core-pr> lands.
  - repo: https://github.com/OmniNode-ai/omnibase_core
    rev: d163312724489f10f58ffdf8115ba1fa9d5783e8 # pragma: allowlist secret
    hooks:
      - id: validate-validator-requirements
        args:
          - --repo
          - omnimarket
          - --repo-root
          - .
          - --spec
          - architecture-handshakes/validator-requirements.yaml
          - --baseline
          - architecture-handshakes/validator-requirements-baseline.yaml

  # OMN-13663 (T4, epic OMN-13659): projection exposure⇄column drift gate.
  # Reconciles every projection node contract.yaml's projection_api.exposures
  # against the materialized columns of the table/view each exposure reads from
  # (DDL extracted from the node's own migrations: CREATE TABLE / ALTER TABLE ADD
  # COLUMN / CREATE [OR REPLACE] VIEW). EXISTENCE drift (an exposure references a
  # column its table/view does not materialize → the projection query fails at
  # runtime) is ALWAYS blocking and is not allowlistable. OMISSION drift (a
  # materialized identity/tier/cost column surfaced by no exposure — the
  # cost_tier_name silent-boundary-drop class, OMN-13649) is ENFORCED via
  # --fail-on-omission against the annotated ratchet baseline in
  # .projection-exposure-allowlist.yaml; a new unannotated omission of such a
  # column blocks. The hook (pass_filenames: false) re-reconciles the whole src
  # tree whenever a projection contract.yaml or a migration .sql changes.
  # Re-pin rev to the merged-dev SHA once omnibase_core#1350 lands.
  - repo: https://github.com/OmniNode-ai/omnibase_core
    rev: 0c69dff015b6f83365d4b0247d8b3230516276ae # pragma: allowlist secret
    hooks:
      - id: check-projection-exposure-drift
        args:
          - src
          - --fail-on-omission
          - --allowlist
          - .projection-exposure-allowlist.yaml

  # OMN-14435 (fan-out from OMN-14401): reject config/registry YAML files
  # declaring duplicate ids over a non-unique key. Checked registries are
  # declared config-as-data in .duplicate-id-registries.yaml (currently just
  # routing_tiers.yaml, per-tier grouped, keyed on id, disambiguated by
  # use_for). files: below scopes triggering to the manifest itself and the
  # checked registry, so a future PR that only touches routing_tiers.yaml
  # still fires this. Pinned to the merged omnibase_core dev commit from
  # omnibase_core#1434.
  - repo: https://github.com/OmniNode-ai/omnibase_core
    rev: c6ebe3c49448ef821013c616d5dbe1e764104d85 # pragma: allowlist secret
    hooks:
      - id: check-duplicate-registry-ids
        files: ^(\.duplicate-id-registries\.yaml|src/omnimarket/configs/routing_tiers\.yaml)$

  # Shared ONEX governance hooks (onex_change_control)
  - repo: https://github.com/OmniNode-ai/onex_change_control
    rev: 8d7e85bc00e7f1b1306d1cb40949be1ab6e7e91a  # pragma: allowlist secret
    hooks:
      - id: no-hardcoded-topics
        stages: [pre-commit]
        # OMN-14541 (org-jam fix): compliance_sweep_baseline.yaml is forensic
        # data recording PAST hardcoded-topic violations (the ratchet
        # baseline) — the topic literals in its message text are evidence
        # ABOUT imperative code, not imperative code publishing/subscribing
        # to a topic itself. Same class as the other allowlist/registry data
        # files already excluded below.
        exclude: "^(src/omnimarket/nodes/node_emit_daemon/registries/claude_code\\.yaml|scripts/lint_no_hardcoded_topics\\.py|scripts/ci/check_no_hardcoded_topics\\.py|scripts/publish_pr_merged_event\\.py|src/omnimarket/logging/structured_logger\\.py|src/omnimarket/nodes/node_.*/handlers/handler_.*\\.py|src/omnimarket/nodes/node_.*/handlers/overseer_tick\\.py|src/omnimarket/nodes/node_.*/models/model_.*\\.py|src/omnimarket/nodes/node_.*/__main__\\.py|src/omnimarket/nodes/node_.*/contracts/.*\\.yaml|src/omnimarket/nodes/node_compliance_sweep/data/compliance_sweep_baseline\\.yaml|src/dep_health_allowlist\\.yaml|docs/adr-canary/.*|src/omnimarket/cli/.*)$"
      - id: no-untracked-todos
        stages: [pre-commit]

  # Essential file formatting
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1000]

  # Topic naming lint — producer-segment allowlist (OMN-8507)
  # Requires omnibase_infra at $OMNIBASE_INFRA_PATH or ../omnibase_infra.
  - repo: local
    hooks:
      # OMN-13501/OMN-13502 (WS-F): no-faked-boundary gate — BLOCKING.
      # A Fake/Stub/Mock class subclassing one of the platform's own inference/
      # routing/dispatch boundary protocols, a patch("httpx.Client") egress seam,
      # or a MagicMock assigned to a boundary inside a real-dispatch test is a FAKE
      # of our architecture (feedback_real_dispatch_path_tests). Detector is the
      # pure COMPUTE HandlerNoFakedBoundaryCompute over the in-memory bus, shipped
      # in omnibase_core 0.46.4 (PR #1377 FP-fix + #1379 gate). Canonical recorded-
      # replay seam (patch("httpx.Client", return_value=<RecordedReplayInference
      # Transport>)) is exempt. The OMN-13501 burn-down landed REAL fixes and the
      # detector's own acceptance corpus is file-level-exempt
      # (onex-allow-file-faked-boundary); omnimarket src+tests is CLEAN (0
      # findings), so this hook is BLOCKING (no --report-only), mirroring the core
      # gate. Suppress an approved fixture line with: # onex-allow-faked-boundary
      - id: check-no-faked-boundary
        name: No faked inference/routing/dispatch boundary — COMPUTE/bus, BLOCKING (OMN-13502)
        entry: uv run python -m omnibase_core.validation.no_faked_boundary.runtime_no_faked_boundary
        language: system
        types: [python]
        exclude: >-
          (?x)^(
            archived/|
            archive/
          )
        pass_filenames: true
        stages: [pre-commit]

      # OMN-10580: Leaked-literals gate — blocks hardcoded LAN IPs, personal
      # paths, private model IDs from being committed. Add an inline annotation
      # to exempt a legitimate occurrence (see docs/leaked-literals-governance.md).
      - id: leaked-literals-gate
        name: Leaked literals gate (OMN-10580)
        language: system
        entry: bash scripts/validation/check_leaked_literals.sh blocking diff
        pass_filenames: false
        stages: [pre-commit]

      # Shell hygiene gate (OMN-14761 / F-22). Fail-closed shellcheck over changed
      # shell scripts; same script the shellcheck-gate CI job runs, so local and CI
      # enforcement cannot drift. The tracked tree is held to --severity=error.
      - id: shell-hygiene
        name: Shell hygiene (shellcheck, OMN-14761)
        entry: bash scripts/ci/check_shell_hygiene.sh
        language: system
        types: [shell]
        pass_filenames: true
        stages: [pre-commit]

      - id: check-dep-provenance
        name: Forbid first-party git-source overrides (OMN-13873)
        entry: uv run --frozen python scripts/check_dep_provenance.py
        language: system
        files: ^pyproject\.toml$
        pass_filenames: false
        stages: [pre-commit]

      # OMN-14741: OCC emitter golden gate for the LIVE companion producer.
      # Runs the golden tests that drive the REAL OccCompanionEmitter output
      # (placeholder-clean check_values, yamlfmt-idempotent YAML, append-only
      # receipts, pre-existing-contract row append, closed/draft/do-not-merge
      # suppression) whenever the live emitter/seam or their tests change, so a
      # broken companion shape is caught locally before push (mirrors the
      # occ-emitter-golden CI gate). BLOCKING.
      - id: occ-emitter-golden
        name: OCC emitter golden gate (OMN-14741/14783) — LIVE producer + compute parity
        entry: >-
          uv run pytest
          tests/unit/nodes/node_pr_lifecycle_fix_effect/test_occ_companion_emitter_friction_omn_14741.py
          tests/unit/nodes/node_pr_lifecycle_fix_effect/test_occ_companion_emitter.py
          tests/unit/nodes/node_pr_lifecycle_fix_effect/test_occ_evidence_stamp.py
          tests/unit/nodes/node_occ_companion_compute/test_occ_emitter_golden_fixtures_omn_14710.py
          tests/unit/nodes/node_occ_companion_compute/test_occ_emitter_compute_f06_f16_parity_omn_14783.py
          tests/unit/nodes/node_pr_lifecycle_fix_effect/test_occ_autobind_contention_omn_15247.py
          tests/unit/test_occ_contention_omn_15247.py
          tests/unit/scripts/test_check_generated_checks_red_derivable.py
          -q
        language: system
        pass_filenames: false
        files: >-
          (?x)^(
            src/omnimarket/nodes/node_pr_lifecycle_fix_effect/handlers/occ_(companion_emitter|evidence_stamp)\.py
            |src/omnimarket/nodes/node_occ_companion_compute/handlers/handler_occ_companion_compute\.py
            |src/omnimarket/nodes/node_occ_state_effect/handlers/handler_occ_state_effect\.py
            |src/omnimarket/events/occ_companion\.py
            |tests/unit/nodes/node_pr_lifecycle_fix_effect/test_occ_(companion_emitter|evidence_stamp|companion_emitter_friction_omn_14741)\.py
            |tests/unit/nodes/node_occ_companion_compute/test_occ_emitter_(golden_fixtures_omn_14710|compute_f06_f16_parity_omn_14783)\.py
            |src/omnimarket/occ_(contention|content_probe)\.py
            |scripts/ci/check_generated_checks_red_derivable\.py
            |tests/unit/nodes/node_pr_lifecycle_fix_effect/test_occ_autobind_contention_omn_15247\.py
            |tests/unit/test_occ_contention_omn_15247\.py
            |tests/unit/scripts/test_check_generated_checks_red_derivable\.py
            |tests/fixtures/occ_red_derivable/.*
          )$
        stages: [pre-commit]

      # OMN-15317: EXECUTE the RED-derivability checker locally, not just its
      # unit test. Static mode only — the live replay needs network + GH_TOKEN
      # and runs in the blocking CI gate; a pre-commit hook that reaches GitHub
      # would make every local commit fail offline. --min-content-bound is what
      # goes RED if the producer default is reverted to the non-falsifiable
      # pr_existence binding. BLOCKING.
      - id: occ-red-derivable-static
        name: OCC generated-check RED-derivability (OMN-15317) — static grammar
        entry: >-
          uv run python scripts/ci/check_generated_checks_red_derivable.py
          --min-checks 2 --min-content-bound 1
          tests/fixtures/occ_red_derivable/companion/contracts/OMN-15317.yaml
        language: system
        pass_filenames: false
        files: >-
          (?x)^(
            scripts/ci/check_generated_checks_red_derivable\.py
            |tests/fixtures/occ_red_derivable/.*
            |src/omnimarket/occ_content_probe\.py
            |src/omnimarket/nodes/node_pr_lifecycle_fix_effect/handlers/occ_evidence_stamp\.py
          )$
        stages: [pre-commit]

      - id: topic-naming-lint
        name: Topic Naming Lint
        language: system
        entry: bash scripts/validation/run_topic_lint.sh
        pass_filenames: false
        stages: [pre-commit]

      - id: event-registry-drift
        name: Event registry drift validator
        language: system
        entry: uv run python -m omnimarket.validators.event_registry_drift
        pass_filenames: false
        files: ^(src/omnimarket/nodes/node_emit_daemon/(event_registry\.py|registries/topics\.yaml|models/.*\.py)|src/omnimarket/validators/event_registry_drift\.py|scripts/validation/event_registry_drift_baseline\.txt)$
        stages: [pre-commit]

      # OMN-14617: fleet-wide fan-out of the omnibase_infra OMN-14135 dispatch-ENTRYPOINT
      # gate. A contract-declared handler exposing NEITHER handle() nor handle_async() is
      # bound by the shared auto-wiring to _missing_handle and raises ModelOnexError on
      # EVERY dispatch, while the contract validates, the node boots, and CI stays green
      # (node_pattern_b_broker's AdapterPatternBBroker* shipped this way; OMN-14616/#1769).
      # Registration/routing != executability. Triggers on contract.yaml too: a contract
      # can declare a handler that has no entrypoint without any handler .py changing.
      # Fails closed under a non-vacuity floor so a collapsed scan cannot pass silently
      # (OMN-14541). Ratchet frozen in validation/handler_dispatch_entrypoint_baseline.yaml
      # (shrink-only). SYNC with the ci.yml step 'Handler dispatch-entrypoint gate
      # (OMN-14617 fan-out)'.
      - id: handler-dispatch-entrypoint
        name: Every contract-declared handler has a dispatch entrypoint (OMN-14617)
        language: system
        entry: env PYTHONPATH=src uv run python -m omnimarket.validators.handler_dispatch_entrypoint src/omnimarket
        pass_filenames: false
        files: ^(src/omnimarket/.*\.(py|yaml)|validation/handler_dispatch_entrypoint_baseline\.yaml)$
        stages: [pre-commit]

      # OMN-8611: entry-point format check (fast, triggers on pyproject.toml changes)
      # Validates that all [project.entry-points."onex.nodes"] entries are valid
      # dotted module paths. Does not verify filesystem — CI runtime_sweep does that.
      - id: entry-point-format
        name: Entry point format check
        language: system
        entry: python scripts/ci/check_entry_point_format.py
        files: ^pyproject\.toml$
        pass_filenames: true
        stages: [pre-commit]

      # OMN-14762 (F-18): coverage-json ignore-errors parity. Keeps the
      # authoritative gate's pytest-cov json (config-driven) aligned with the
      # shadow aggregator's `coverage json -i`, so a missing C-extension source
      # cannot red one and leave the other green. SYNC with ci.yml step
      # 'Coverage-json ignore-errors parity gate'. Fast, stdlib-only.
      - id: coverage-ignore-parity
        name: Coverage-json ignore-errors parity gate (OMN-14762)
        language: system
        entry: uv run python scripts/ci/check_coverage_ignore_parity.py
        files: ^(pyproject\.toml|scripts/ci/aggregate_coverage_artifacts\.py|scripts/ci/check_coverage_ignore_parity\.py)$
        pass_filenames: false
        stages: [pre-commit]

      # OMN-14762 (F-19-A): GitHub Actions pin ratchet. Every third-party `uses:`
      # must be pinned to a 40-char SHA; current unpinned set frozen in
      # scripts/ci/action_pin_baseline.txt (burn-down only), NEW unpinned fails
      # closed. SYNC with ci.yml step 'GitHub Actions pin ratchet'. Fast, stdlib-only.
      - id: check-action-pins
        name: GitHub Actions pin ratchet (OMN-14762)
        language: system
        entry: python scripts/ci/check_action_pins.py
        files: ^(\.github/workflows/.*\.(yml|yaml)|scripts/ci/action_pin_baseline\.txt|scripts/ci/check_action_pins\.py)$
        pass_filenames: false
        stages: [pre-commit]

      # OMN-12693: contract-level producer/consumer shape gate.
      # SYNC with node-drift-gate.yml full strict check.
      - id: node-orphan-graph
        name: Node orphan graph gate
        language: system
        entry: uv run python scripts/validate_node_drift.py --check-all --check-orphan-nodes --strict
        files: ^(src/omnimarket/nodes/node_.*/contract\.yaml|pyproject\.toml)$
        pass_filenames: false
        stages: [pre-commit]

      # OMN-13781: contract-state-coverage gate. Diffs each touched node's
      # declared state set (contract.yaml) against states asserted by its
      # tests. --check-changed HEAD scopes to locally staged/unstaged diffs
      # so this stays fast; SYNC with state-coverage-gate.yml (which scopes
      # to the PR/merge_group base ref instead).
      - id: state-coverage-gate
        name: Contract-state-coverage gate
        language: system
        entry: uv run python scripts/validate_state_coverage.py --check-changed HEAD --strict
        files: ^(src/omnimarket/nodes/node_.*/contract\.yaml|src/omnimarket/nodes/node_.*/.*\.py|tests/.*\.py)$
        pass_filenames: false
        stages: [pre-commit]

      # OMN-14542 (class fix, parent OMN-14531): node_contract_sweep's
      # ContractSweepRequest.repos previously defaulted to an empty list, which the
      # handler silently reinterpreted as "scan whatever omni_home dirs happen to
      # have a src/" -- a prior receipt reported 9 contracts checked clean while 941
      # actually existed. This hook runs the full-corpus gate on every contract.yaml
      # edit and refuses to pass unless the node's own scanned_count matches an
      # independently-computed contract count and is > 0. The field/topic/node_type
      # violation backlog was paid down under OMN-14544, so --strict is on: SYNC
      # with ci.yml job "Contract Sweep Gate".
      - id: contract-sweep-gate
        name: Contract sweep scope-invariant gate (OMN-14542)
        language: system
        entry: uv run python scripts/ci/run_contract_sweep_gate.py --strict
        files: ^(src/omnimarket/nodes/node_.*/contract\.yaml|src/omnimarket/nodes/node_contract_sweep/.*\.py|scripts/ci/run_contract_sweep_gate\.py)$
        pass_filenames: false
        stages: [pre-commit]

      # OMN-13965: skill-mapping input-coverage gate. Every skill_mapping.yaml
      # arg carrying a `default` is force-injected into the node-input payload
      # on every `onex skill` invocation; if it is not accepted by the model the
      # backing handler validates, the skill fails 100% of CLI calls
      # (extra_forbidden). This diffs the installed skill_mapping.yaml against
      # each node's resolved input model. Runs on node handler/model changes and
      # on edits to the validator itself; SYNC with skill-mapping-input-coverage-gate.yml.
      - id: skill-mapping-input-coverage-gate
        name: Skill-mapping input-coverage gate (OMN-13965)
        language: system
        entry: uv run python scripts/validate_skill_mapping_input_coverage.py
        files: ^(src/omnimarket/nodes/node_.*/(handlers|models)/.*\.py|src/omnimarket/nodes/node_.*/contract\.yaml|scripts/validate_skill_mapping_input_coverage\.py)$
        pass_filenames: false
        stages: [pre-commit]

      # OMN-12957: runtime_profiles contract validator (omnibase_core).
      # Enforces runtime_profiles_missing (OMN-9886) + runtime_profile_unregistered
      # (declared profile not in canonical REGISTERED_RUNTIME_PROFILES) +
      # runtime_profile_no_consumer_lane (subscribing REDUCER/EFFECT names no
      # consumer-attached profile). Pre-existing violators are frozen in
      # validation/runtime_profiles_allowlist.yaml (drain tracked by OMN-12982).
      # Blocks NEW orphans. Requires the omnibase_core pin to include OMN-12957's
      # validator (new rules).
      #
      # OMN-12955: invoke via scripts/ci/run_runtime_profiles_validator.py so the
      # repo-local allowlist (validation/runtime_profiles_allowlist.yaml) is loaded
      # the SAME way as the required CI gate (validator-runtime-profiles.yml). The
      # bare module entry resolves its allowlist from the omnibase_core *package*
      # dir, not this repo, so it spuriously flagged every frozen contract locally
      # while CI passed.
      - id: onex-validate-runtime-profiles
        name: Validate runtime_profiles on node contracts (OMN-12957)
        language: system
        entry: uv run python scripts/ci/run_runtime_profiles_validator.py
        files: ^src/omnimarket/nodes/node_.*/contract\.yaml$
        pass_filenames: false
        stages: [pre-commit]

      # OMN-10909: stricter topic-literal gate (delegation thin-shim plan, Task 8).
      # Allowlist: topics.py, test_*/conftest* files, inline `# onex-topic-allow`
      # annotations. SYNC with ci.yml step "Topic-literal guardrail (annotation allowlist)".
      - id: no-hardcoded-topics-annotated
        name: Topic-literal guardrail (annotation allowlist)
        language: system
        entry: uv run python scripts/ci/check_no_hardcoded_topics.py
        files: ^src/omnimarket/.*\.py$
        pass_filenames: false
        stages: [pre-commit]

      # OMN-13548 (D-03): a projection handler that catches ValidationError must
      # route the malformed event to its contract-declared DLQ topic, not drop it
      # silently. SYNC with ci.yml step "Projection-DLQ path gate".
      - id: projection-dlq-path
        name: Projection-DLQ path gate (OMN-13548)
        language: system
        entry: uv run python scripts/ci/check_projection_dlq_path.py
        files: ^(src/omnimarket/nodes/node_projection_.*/handlers/handler_.*\.py|scripts/ci/check_projection_dlq_path\.py)$
        pass_filenames: false
        stages: [pre-commit]

      # OMN-14768 / F-11: renaming an OPEN PR's head branch closes the PR. Scan
      # the whole merge-controller tree whenever any of its files (or the gate
      # itself) changes. SYNC with the ci.yml `lint` job step
      # "Branch-safety F-11 — branch-rename prohibition" (the required CI Summary
      # rollup; there is no standalone branch-safety workflow).
      - id: check-branch-rename-prohibited
        name: Branch-rename prohibition (OMN-14768 / F-11)
        language: system
        entry: uv run python scripts/ci/check_branch_identity.py --mode rename-scan
        files: ^(src/omnimarket/nodes/node_(pr_lifecycle_.*|dispatch_worker|merge_effect)/.*\.py|scripts/ci/check_branch_identity\.py)$
        pass_filenames: false
        stages: [pre-commit]

      # OMN-14768 / F-11 + F-12: the branch-safety gate is only trustworthy if its
      # own scanner/identity logic is tested (positive controls). Run the unit
      # tests when the gate or its tests change. SYNC with the ci.yml `lint` job
      # step "Branch-safety gate self-tests" (the required CI Summary rollup).
      - id: check-branch-identity-tests
        name: Branch-safety gate self-tests (OMN-14768)
        language: system
        entry: uv run pytest tests/ci/test_check_branch_identity.py -q
        files: ^(scripts/ci/check_branch_identity\.py|tests/ci/test_check_branch_identity\.py)$
        pass_filenames: false
        stages: [pre-commit]

      # OMN-12856: Fail if any omnimarket source reads GH_PAT/GH_TOKEN/GITHUB_TOKEN
      # via os.environ/os.getenv. The canonical path after OMN-12856 is
      # contract_secret_ref + resolve_api_key. SYNC with ci.yml step
      # "GitHub-token env-read gate (enforce)".
      - id: github-token-env-gate
        name: GitHub-token env-read gate
        language: system
        entry: uv run python scripts/ci/check_github_token_env_reads.py
        files: ^(src/omnimarket/.*\.py|scripts/ci/check_github_token_env_reads\.py)
        pass_filenames: false
        stages: [pre-commit]

      # OMN-13295 (W6a): delegation env-read scanner. Detects direct os.environ/
      # os.getenv reads in delegation-owned modules and enforces the provenance
      # ratchet (OMN-12967): BIFROST_CONTRACT_PATH and sibling path-config keys
      # MUST resolve through delegation_config_provenance — raw reads always block.
      # Broad env-read violations run in report mode (Wave 0); provenance-bypass
      # violations always exit 1. SYNC with ci.yml step "Delegation env-read gate".
      - id: delegation-env-read-gate
        name: Delegation env-read gate (OMN-13295)
        language: system
        entry: uv run python scripts/ci/check_delegation_env_reads.py
        files: ^src/omnimarket/.*\.py$
        pass_filenames: false
        stages: [pre-commit]

      # OMN-13285 (W6/GAP-3): routing-authority demo gate. PORTED to the canonical
      # core COMPUTE validator omnibase_core.validation.validator_routing_authority
      # (replaces the deleted omnimarket-local scripts/ci/check_routing_authority.py
      # and folds in the previously-unwired core validator_delegation_profile).
      # Proves the demo path resolves provider/served_model_id/endpoint_ref/
      # routing_source from contract + bifrost authority; no demo-path source reads
      # env for endpoint/provider/model, hardcodes a provider literal, or reads a
      # fallback endpoint string; residue files stay within their env-authority
      # baselines (OMN-12877); every bifrost backend respects the provider-class
      # endpoint URL shape contract (OMN-12883); delegation profiles use symbolic
      # refs. SYNC with ci.yml step "Routing-authority demo gate (enforce)".
      - id: routing-authority-demo-gate
        name: Routing-authority demo gate (OMN-13285)
        language: system
        entry: uv run python -m omnibase_core.validation.validator_routing_authority --repo omnimarket --repo-root .
        files: >-
          ^(src/omnimarket/nodes/node_generation_consumer/|
          src/omnimarket/nodes/node_llm_delegation_call_effect/|
          src/omnimarket/adapters/llm/bifrost/|
          src/omnimarket/configs/bifrost_delegation\.yaml|
          src/omnimarket/inference/bridge_config_loader\.py|
          src/omnimarket/cli/cli_ab_compare_suite\.py|
          src/omnimarket/model_policy\.yaml)
        pass_filenames: false
        stages: [pre-commit]

      # OMN-12942: node migration sets must create base tables before the views
      # that read them. A view-before-base-table migration hard-fails the
      # forward-migration runner on a clean node-set apply (this forced
      # node_projection_llm_routing's view to be pruned during the 2026-06-11
      # stability hot-patch). SYNC with ci.yml step "Migration base-before-view gate".
      - id: migration-base-before-view
        name: Migration base-table-before-view gate
        language: system
        entry: uv run python scripts/ci/check_migration_base_before_view.py
        files: ^(src/omnimarket/nodes/.*/migrations/.*\.sql|scripts/ci/check_migration_base_before_view\.py)$
        pass_filenames: false
        stages: [pre-commit]

      # OMN-13290: backend secret-ref / credential-ref discipline gate. Fails if a
      # literal credential value (PEM key, service-account JSON, bearer/api-key)
      # lands in routing-authority config, or if an authenticated cloud backend
      # lacks a logical secret/credential ref. Keeps the Vertex ADC path (and all
      # cloud backends) value-free in committed config. Now sourced from
      # omnibase_core (ported from the deleted local OMN-12971 script — single
      # canonical implementation, validator_standardization W8).
      # SYNC with ci.yml step "Backend secret-discipline gate (enforce)".
      - id: backend-secret-discipline-gate
        name: Backend secret-discipline gate
        language: system
        entry: uv run python -m omnibase_core.validators.backend_secret_discipline
          src/omnimarket/configs/bifrost_delegation.yaml
          src/omnimarket/configs/routing_tiers.yaml
          src/omnimarket/data/model_registry/model_registry_v1.yaml
        files: ^(src/omnimarket/configs/bifrost_delegation\.yaml|src/omnimarket/configs/routing_tiers\.yaml|src/omnimarket/data/model_registry/model_registry_v1\.yaml)
        pass_filenames: false
        stages: [pre-commit]

      # OMN-13530: require an 'operation' field on every operation_match (or
      # absent-strategy) handler_routing entry. A missing operation makes the
      # contract fail closed at RuntimeLocal startup ('handlers[i].operation is
      # missing' / result=failed) — the 0.46.0 regression that took down the
      # headless automation fleet (merge_sweep, ci_watch, auto_merge, build_loop,
      # coderabbit_triage, create_ticket). Canonical core validator; runs as a
      # local hook against the installed omnibase_core. SYNC with ci.yml step
      # "operation_match operation-field gate (enforce)".
      - id: operation-match-requires-operation
        name: operation_match handler operation-field gate (OMN-13530)
        language: system
        entry: uv run python -m omnibase_core.validators.operation_match_requires_operation
        files: (^|/)contract\.yaml$
        pass_filenames: true
        stages: [pre-commit]

      # OMN-12972 (plan P2.7): Gemini registry/version hygiene gate. Enforces
      # that every provider:google registry entry + its bifrost backend align
      # with the live Vertex-served model name PER ENVIRONMENT (Vertex names are
      # publisher-qualified; AI Studio names are bare) and that no entry carries a
      # retired/404 model id (the gemini-2.0-flash-on-Vertex failure).
      # SYNC with ci.yml step "Gemini registry/version hygiene gate (enforce)".
      - id: gemini-registry-version-hygiene
        name: Gemini registry/version hygiene gate
        language: system
        entry: uv run python scripts/ci/check_model_registry_served_names.py
        files: ^(src/omnimarket/data/model_registry/model_registry_v1\.yaml|src/omnimarket/configs/bifrost_delegation\.yaml|scripts/ci/check_model_registry_served_names\.py)
        pass_filenames: false
        stages: [pre-commit]

      # OMN-12691: live-path node changes must ship with golden-chain coverage.
      # SYNC with ci.yml step "Golden-chain coverage gate".
      - id: golden-chain-coverage-gate
        name: Golden-chain coverage gate
        language: system
        entry: uv run python scripts/ci/check_golden_chain_coverage.py --staged
        files: ^(src/omnimarket/nodes/node_.*/|tests/.*/?test_golden_chain.*\.py$)
        pass_filenames: false
        stages: [pre-commit]

      # OMN-12959: FSM terminal-state invariant — watchdog topic literals may
      # only live in the canonical omnimarket.events.topics registry (the source
      # of truth; omnimarket.events.watchdog imports them and exposes the typed
      # EnumWatchdogEventType authority). Forces the typed authority instead of
      # hardcoded strings. SYNC with ci.yml step "Watchdog-topic authority gate".
      - id: watchdog-topic-authority-gate
        name: Watchdog-topic authority gate
        language: system
        entry: uv run python scripts/ci/check_watchdog_topic_authority.py
        files: ^(src/omnimarket/.*\.py|scripts/ci/check_watchdog_topic_authority\.py)
        pass_filenames: false
        stages: [pre-commit]

  # Ruff — standalone pre-commit hooks (no uv source resolution needed)
  # Using astral-sh/ruff-pre-commit avoids `uv run ruff` which fails in worktrees
  # because uv.sources relative paths (../omnibase_core) resolve against the worktree
  # parent directory instead of $OMNI_HOME. (OMN-8103)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.9
    hooks:
      - id: ruff-format
        args: [src/, tests/]
        pass_filenames: false

      - id: ruff
        alias: ruff-fix
        name: ruff check (auto-fix)
        args: [--fix, --exit-non-zero-on-fix, src/, tests/]
        pass_filenames: false

  - repo: local
    hooks:
      # OMN-13346: DurableEvidenceGate must not pass CONTRACT_CITES_MERGE_COMMIT
      # vacuously when schema-valid contracts carry zero receipt-bound commits.
      # SYNC with ci.yml pytest suite.
      - id: durable-evidence-gate-regression
        name: DurableEvidenceGate regression tests (OMN-13346)
        language: system
        entry: uv run pytest tests/unit/nodes/node_dod_verify/test_durable_evidence_gate.py -q -m unit
        files: ^(src/omnimarket/nodes/node_dod_verify/(services/durable_evidence_gate|models/model_durable_evidence_gate)\.py|tests/unit/nodes/node_dod_verify/test_durable_evidence_gate\.py)$
        pass_filenames: false
        stages: [pre-commit]

      # OMN-14151: single-arm-path CI guard. Blocks any change that re-adds a
      # pyproject.toml entry point for the three deregistered legacy arm
      # surfaces, drops a legacy handler's fail-closed env-flag hard-gate, or
      # bypasses the arm-gate call inside the merge fanout. SYNC with ci.yml
      # pytest suite.
      - id: single-arm-path-policy-gate
        name: Merge-queue governor single-arm-path gate (OMN-14151)
        language: system
        entry: uv run pytest tests/test_single_arm_path_policy.py -q -m unit
        # OMN-15064: switched to (?x) verbose mode (matches the working idiom
        # used elsewhere in this file, e.g. the OCC-emitter-golden-gate hook
        # above) — the prior folded->-block-scalar form silently inserted a
        # leading space before every continuation branch (YAML `>-` folding
        # joins wrapped lines with a single space), so every branch except
        # the first (`pyproject\.toml`) NEVER matched any real file path.
        # This hook has been effectively file-trigger-dead for every path
        # except pyproject.toml since it was introduced; (?x) mode ignores
        # insignificant whitespace/newlines in the pattern so indentation is
        # safe again.
        files: >-
          (?x)^(
            pyproject\.toml
            |src/omnimarket/config/env_flags\.py
            |src/omnimarket/events/pr_arm_gate\.py
            |src/omnimarket/nodes/node_pr_arm_gate_compute/.*
            |src/omnimarket/nodes/node_auto_merge_effect/handlers/handler_auto_merge_effect\.py
            |src/omnimarket/nodes/node_merge_sweep_auto_merge_arm_effect/handlers/handler_auto_merge_arm\.py
            |src/omnimarket/nodes/node_merge_sweep_triage_orchestrator/handlers/handler_triage\.py
            |src/omnimarket/nodes/node_pr_lifecycle_orchestrator/handlers/handler_pr_lifecycle_orchestrator\.py
            |src/omnimarket/nodes/node_pr_lifecycle_fix_effect/handlers/handler_admin_merge\.py
            |src/omnimarket/nodes/node_pr_lifecycle_fix_effect/models/model_admin_merge_request\.py
            |tests/test_single_arm_path_policy\.py
          )$
        pass_filenames: false
        stages: [pre-commit]

      # OMN-14527: contract topic graph — the static producer/consumer oracle.
      # Nodes are contracts, edges are topics. Catches the defect class that five
      # merged, CI-green, `Done` tickets shipped anyway: a consumer subscribed to a
      # topic NO contract publishes (node_ledger_write_effect was starved for its
      # entire life), a producer whose output nothing reads, a node that subscribes
      # with no dispatcher, and a fully-wired cluster with no inbound edge.
      #
      # Static — no broker, no deploy. Ratcheted: pre-existing debt is frozen in
      # src/omnimarket/validators/data/contract_topic_graph_baseline.yaml and that
      # baseline may only ever SHRINK. A NEW defect hard-fails.
      #
      # Sound ONLY where the whole active runtime surface (omnibase_infra +
      # omnimarket) is co-installed — a partial graph reports every cross-package
      # producer as a phantom orphan, so build_graph() fails closed instead of
      # answering wrongly. SYNC with the `contract-topic-graph` job in
      # .github/workflows/ci.yml (moved there under OMN-14582; the standalone
      # contract-topic-graph.yml is retired).
      # NOTE: single-line regex on purpose. A YAML folded scalar (>-) joins its
      # lines with SPACES, which silently breaks the alternation and makes this
      # hook match nothing — it reports "no files to check" and Skips, so the gate
      # looks green while never having run.
      # OMN-14568: full census coverage also requires omniclaude/omniintelligence,
      # which resolve via CONTRACT_GRAPH_CHECKOUT_ROOT (a filesystem checkout, not
      # a pip dependency -- see contract_topic_graph.py). Every developer on this
      # workspace already has both as siblings under $OMNI_HOME (the canonical
      # repo registry convention, CLAUDE.md), so that's the local default. This
      # intentionally still fails closed (not a silent fallback) if OMNI_HOME
      # itself is unset -- the same env var every other worktree command in this
      # repo already requires.
      - id: contract-topic-graph
        name: Contract topic graph (orphaned consumers/producers, dead chains)
        language: system
        # bash -c, not a bare argv entry: ${OMNI_HOME:?...} parameter expansion
        # only happens under an actual shell (pre-commit runs `system` entries
        # via shlex-split argv otherwise) -- see the mypy hook below for the
        # same pattern.
        entry: bash -c 'env -u PYTHONPATH CONTRACT_GRAPH_CHECKOUT_ROOT="${OMNI_HOME:?set OMNI_HOME to the omni_home path}" uv run python -m omnimarket.validators.contract_topic_graph'
        files: ^(src/omnimarket/nodes/.*/contract\.yaml|src/omnimarket/validators/(contract_topic_graph\.py|data/contract_topic_graph_baseline\.yaml))$
        pass_filenames: false
        stages: [pre-commit]

      # OMN-13624 (WS-C SEA Phase 7.1): generated-node golden-chain gate.
      # Executes the two canonical self-extension loop proofs when generation
      # node source or the golden-chain test files themselves change.
      # SYNC with ci.yml job "generated-node-golden-chain" (Operating Rule #5).
      #   - test_golden_chain_generation_self_extension.py  (§D2 loop proof)
      #   - test_golden_chain_generated_node_publish_effect.py  (§publish chain)
      - id: generated-node-golden-chain-gate
        name: Generated-node golden-chain gate (OMN-13624)
        language: system
        entry: uv run pytest tests/test_golden_chain_generation_self_extension.py tests/test_golden_chain_generated_node_publish_effect.py -q -m "not kafka"
        files: >-
          ^(src/omnimarket/nodes/node_generation_consumer/|
          src/omnimarket/nodes/node_generated_node_publish_effect/|
          tests/test_golden_chain_generation_self_extension\.py|
          tests/test_golden_chain_generated_node_publish_effect\.py)
        pass_filenames: false
        stages: [pre-commit]

      - id: normalization-symmetry
        name: normalization-symmetry
        entry: uv run python -m omnibase_core.validation.checker_normalization_symmetry
        language: system
        pass_filenames: false

      # OMN-14172: integration silent-skip false-green gate. An
      # @pytest.mark.integration real-service test that self-skips because a
      # PROVISIONED service (Postgres) is absent is a false-green — the required
      # Tests job goes green while the real-DB assertion never ran (the exact gap
      # that let the OMN-14058 missing-tenant_id-column defect reach dev).
      # The --selftest runs the gate's own logic against synthetic pass/fail
      # JUnit reports (case (a) provisioned -> PASS, case (b) reintroduced
      # missing-service silent skip -> RED) so the gate cannot silently regress,
      # and validates the shipped integration_skip_guard.yaml parses. No DB
      # needed locally — the CI job 'integration-guard' is the full runtime gate.
      # SYNC with ci.yml job 'integration-guard' (Operating Rule #5).
      - id: integration-skip-guard
        name: Integration silent-skip guard selftest (OMN-14172)
        language: system
        entry: uv run python scripts/ci/check_integration_skips.py --selftest
        files: >-
          ^(scripts/ci/check_integration_skips\.py|
          scripts/ci/integration_skip_guard\.yaml|
          tests/ci/test_check_integration_skips\.py|
          \.github/workflows/ci\.yml|
          tests/test_delegation_savings_tenant_id_column_omn14058\.py|
          tests/test_projection_delegation_tier_distribution_omn13662\.py)$
        pass_filenames: false
        stages: [pre-commit]

      # OMN-11040: Dependency health gate — blocks new CRITICAL/MAJOR dependency
      # health findings from being committed. Baseline-first: set
      # --severity-threshold to INFO to observe all findings without blocking.
      - id: dep-health-gate
        name: Dependency health gate
        language: system
        entry: bash scripts/validation/run_dep_health_gate.sh
        pass_filenames: false
        stages: [pre-commit]

      # OMN-10738: Blocks silent localhost/hardcoded-endpoint fallbacks in env reads
      - id: validate-no-env-fallbacks
        name: Validate no silent env fallbacks
        language: system
        entry: uv run python scripts/validation/validate_no_env_fallbacks.py
        pass_filenames: false
        files: ^src/.*\.py$
        stages: [pre-commit]

      # OMN-14176: workflow module-resolution guard. Every in-repo omnimarket
      # module referenced by a .github/workflows/*.yml step (from X import /
      # import X / python -m X) must resolve under src/omnimarket/. Catches the
      # class of dead workflow that imports a deleted node — node_pr_review_bot
      # (deleted in OMN-13212) no-op'd and reported a false CLEAN while its
      # workflows stayed green. Same-repo scope only: sibling-repo refs
      # (omniintelligence.*, omnibase_*) are cloned at CI runtime and out of
      # scope. Pure stdlib, no uv sync (mirrors entry-point-format). SYNC with
      # ci.yml job "workflow-module-refs".
      - id: workflow-module-refs
        name: Workflow module-resolution guard (OMN-14176)
        language: system
        entry: python scripts/ci/check_workflow_module_refs.py
        files: ^(\.github/workflows/.*\.ya?ml|scripts/ci/check_workflow_module_refs\.py)$
        pass_filenames: false
        stages: [pre-commit]

      # One-producer-per-contract guard (OMN-14285 / WI-1, S1d). Fails if a
      # second OCC companion-authoring surface (an inline receipt/contract YAML
      # template outside the occ_evidence_stamp seam, a duplicate
      # OccCompanionEmitter, or a resurrected scaffold_occ_receipt.py) reappears.
      # SYNC with ci.yml job "one-occ-producer".
      - id: one-occ-producer
        name: One OCC producer per contract (OMN-14285)
        language: system
        entry: python scripts/ci/check_one_occ_producer.py
        files: ^(src/omnimarket/.*\.py|scripts/ci/check_one_occ_producer\.py)$
        pass_filenames: false
        stages: [pre-commit]

      # Skip-token rejection gate (OMN-11412 / OMN-10414)
      # Blocks [skip-*] bypass tokens in staged markdown/yaml/txt files.
      # Escape hatch: add '# skip-token-allowed: <receipt-id>' with a traceable approval receipt.
      - id: reject-deploy-gate-skip-token
        name: Reject skip-gate bypass tokens (OMN-10414)
        entry: .pre-commit-hooks/reject-deploy-gate-skip-token.sh
        language: script
        pass_filenames: true
        always_run: true
        stages: [pre-commit]
        exclude: ^tests/.*fixtures/
      - id: reject-deploy-gate-skip-token-commit-msg
        name: Reject skip-gate bypass tokens in commit messages (OMN-10414)
        entry: .pre-commit-hooks/reject-deploy-gate-skip-token.sh
        language: script
        pass_filenames: true
        stages: [commit-msg]

      # mypy type checking (OMN-11412: added missing mypy pre-commit hook)
      - id: mypy-type-check
        name: mypy (type checking - strict)
        entry: bash -c 'uv run mypy src/omnimarket --show-error-codes --no-error-summary'
        language: system
        types: [python]
        files: ^src/omnimarket/.*\.py$
        pass_filenames: false
        stages: [pre-push]

      # --------------------------------------------------------------------------
      # OMN-14666 (WS7 fan-out #2, ticket-plan
      # docs/plans/2026-07-15-ci-precommit-gate-parity-plan.md §4; canary
      # omniclaude#1904 / OMN-14655): DRIFT-1 fix — these two STATIC arch/registry
      # AST-scan validators have run in CI (ci.yml) since their landing tickets
      # but had NO pre-commit mirror, so violations only ever surfaced after push.
      # Each entry invokes the EXACT CI entrypoint (same script, same args, same
      # `uv run python` invocation ci.yml uses) — no rule logic is re-implemented
      # here (DRY, plan §2/§5 non-goal).
      #
      # STATIC classification receipt (plan §3a / D3):
      #   arch-node-metadata-dependency-scope — check_node_metadata_dependencies.py
      #     is a pure AST + node metadata.yaml scan (ast/yaml/packaging.requirements,
      #     no execution, no broker/DB). Dependency set: project venv only (yaml +
      #     packaging), NO sibling checkout, NO env vars, NO network. CI: ci.yml:200
      #     `uv run python scripts/ci/check_node_metadata_dependencies.py`.
      #   arch-unimported-handler-check — check_unimported_handlers.py is pure stdlib
      #     (ast/re/pathlib), a static import-reference scan; no execution. Dependency
      #     set: project venv only, NO sibling checkout, NO env vars, NO network.
      #     CI: ci.yml:259 `uv run python scripts/ci/check_unimported_handlers.py`.
      # --------------------------------------------------------------------------
      - id: arch-node-metadata-dependency-scope
        name: "Arch: ONCP node metadata dependency scope (SYNC ci.yml lint step)"
        entry: uv run python scripts/ci/check_node_metadata_dependencies.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: arch-unimported-handler-check
        name: "Arch: unimported-handler check (SYNC ci.yml lint step, OMN-10821)"
        entry: uv run python scripts/ci/check_unimported_handlers.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      # OMN-14666 (D5, §3d.7): fail-loud meta-gate over this very file.
      # Hard-rejects the exit-0-on-missing-path / WARN-SKIP-degrade class (a
      # skipped gate must be byte-indistinguishable from a failing one) plus any
      # hook `stages:` value default_install_hook_types does not install. Wired as
      # BOTH a pre-commit hook (here) and a required CI gate
      # (.github/workflows/precommit-fail-loud-gate.yml) in this same PR so the
      # class cannot regenerate on the next wrapper script (plan §3d.7,
      # feedback_a_rule_is_not_a_mechanism).
      - id: precommit-fail-loud-meta-gate
        name: Pre-commit fail-loud meta-gate (OMN-14666)
        entry: uv run python scripts/validation/validate_precommit_fail_loud.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
        files: ^(\.pre-commit-config\.yaml|scripts/.*\.(sh|py)|\.pre-commit-hooks/.*\.sh)$

      # OMN-14666 (D5, §3d.8): pin-parity ratchet. Fails closed the moment the
      # pre-commit `rev:` pin for a shared omnibase_core validator diverges from
      # the SHA .github/workflows/ci.yml pins for the same validator
      # (no-noncanonical-lifecycle-classes: pre-commit rev == ci.yml
      # `omnibase-core @ git+...@<sha>` pin). DRIFT-3 recurrence guard.
      - id: precommit-pin-parity
        name: Pre-commit/CI pin-parity check (OMN-14666)
        entry: uv run python scripts/validation/validate_precommit_pin_parity.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
        files: ^(\.pre-commit-config\.yaml|\.github/workflows/ci\.yml)$

      # OMN-14765 (epic OMN-14643): merge-check reason-code fixture-corpus gate.
      # Rule-5 local half of the ci.yml `merge-reason-code-gate` job — replays
      # every captured jobs-API fixture through
      # omnimarket.merge_control.reason_code_classifier and fails closed on any
      # mismatch / shrunk corpus / missing reason code, so a classifier edit can
      # never silently re-collapse cancelled/stale/infra into product_failed
      # before push. Scoped to the classifier + fixtures + runner so it is a
      # no-op for unrelated diffs. SYNC with ci.yml job `merge-reason-code-gate`.
      - id: merge-reason-code-gate
        name: Merge-check reason-code fixture-corpus gate (OMN-14765)
        entry: uv run python scripts/ci/check_merge_reason_codes.py
        language: system
        pass_filenames: false
        files: >-
          ^(src/omnimarket/merge_control/reason_code_classifier\.py|scripts/ci/check_merge_reason_codes\.py|tests/merge_control/fixtures/reason_codes/.*\.json)$
        stages: [pre-commit]

  # Governed impacted-test selector at PRE-PUSH (OMN-13973 / WS7 fan-out, omnimarket).
  # Runs the fast local IMPACTED SUBSET of the unit suite once per `git push`,
  # via the SAME selector CI uses (scripts/ci/detect_test_paths.py +
  # scripts/ci/test_selection_adjacency.yaml, ENABLE_SMART_TESTS) -- never a
  # hand-typed -k. Fail-closed: escalates to the full unit suite when it cannot
  # prove narrowing is safe (shared module / pyproject deps / test-infra / >=6
  # modules / main). SEAM: omnimarket's selector CLI takes NO --base-ref (unlike
  # the omnibase_core canary #1451) -- the wrapper matches omnimarket's CI seam.
  # NET-NEGATIVE-SURFACE: retires the "run the whole unit suite by hand before
  # every push" manual default (root CLAUDE.md Rule #4). This is a fast local
  # impacted subset, ADVISORY of the full CI suite -- NOT byte-parity with an
  # enforced CI context (on CI the selector is behind ENABLE_SMART_TESTS
  # off-by-default; the enforced merge gate is the full suite). FAIL-LOUD:
  # hard-errors (exit 1) if base/selector/adjacency cannot resolve; never a
  # green skip.
  - repo: local
    hooks:
      - id: prepush-smart-tests
        name: Governed impacted-test selector (pre-push, OMN-13973)
        entry: bash scripts/hooks/prepush_smart_tests.sh
        language: system
        pass_filenames: false
        always_run: true
        verbose: true
        stages: [pre-push]
      # OMN-15241: Required-Check Skip-Vector Guard (canary OMN-14854) -- LOCAL
      # parity for a guard this repo already runs CI-only via
      # .github/workflows/required-check-skip-guard-caller.yml. Without this hook a
      # skip-vector violation commits with every local hook GREEN and is caught only
      # after push -- detection without local enforcement (root CLAUDE.md Rule #5).
      #
      # Fails closed when a workflow file or the required-checks manifest introduces
      # any of the five skip vectors on a REQUIRED context: a path-scoped trigger, an
      # ungated job-level `if:`, an ungated reusable-caller `if:`, a missing
      # pull_request/merge_group trigger, or a `needs:` with no `if:` that provably
      # runs regardless of the needs result (OMN-15057 vector 5).
      #
      # The wrapper executes the SAME validator the CI reusable workflow executes
      # (canonical copy in omniclaude, resolved via $OMNI_HOME), so local and CI
      # verdicts cannot diverge on validator logic.
      - id: reject-required-check-skip-vector
        name: Reject skip vectors on required-check workflows (OMN-15241)
        entry: .pre-commit-hooks/reject-required-check-skip-vector.sh
        language: script
        pass_filenames: false
        files: '^\.github/(workflows/.*\.ya?ml|required-checks\.yaml)$'
        stages: [pre-commit]

# Configuration
# OMN-14666 (plan §3d.5): every stage a hook uses MUST be installed by
# `pre-commit install`. Previously [pre-commit] only, so the required-CI-mirror
# mypy-type-check (stages:[pre-push]) and reject-deploy-gate-skip-token-commit-msg
# (stages:[commit-msg]) hooks silently NEVER installed — a false-green. The
# precommit-fail-loud-meta-gate above now fails closed if this drifts again.
default_install_hook_types: [pre-commit, pre-push, commit-msg]
default_stages: [pre-commit]
fail_fast: false
