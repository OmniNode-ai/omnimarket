# Ceiling for the effect-node bypass ratchet (OMN-24432, RULING 2026-11-14T11:59:02Z).
# A bypass is an effect on the outside world (GitHub, git remotes, Slack, Linear, lab hosts over ssh,
# docker and kafka administration) that does not go through its effect node over the bus.
#
# RULE: this is a count ceiling, not an exception list: counts only fall. A category that rises fails the check. A change that moves a caller onto its
# effect node lowers the count here in the same change. The check also refuses a count above the merge
# base's copy of this file, so the baseline cannot be raised to pass.
#
# Read it:  python -m omnimarket.nodes.node_effect_bypass_scan_effect check --repository <repo> --root . \
#             --baseline .onex_ratchets/effect_bypass_ceiling.yaml
# omnimarket host_ssh reads 127: the two sites in node_unit_probe_effect (handlers/handler_unit_probe.py) merged to dev after the
# first read of 125 (omnimarket#6207); they are counted here, not excused, and a caller moved onto the host-access node lowers this row.
# Counts are taken by node_effect_bypass_scan_effect (policy: its contract.yaml config.scan). The rows of the
# other repositories are today's counts, carried here for the burn-down report; each repository enforces its own
# row when it wires the same check.
