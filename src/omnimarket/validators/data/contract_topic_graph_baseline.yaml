external_producers:
  # OMN-14648 / WS6 merge-state telemetry. Merge-flow state-transition events are
  # published by external merge-flow instrumentation (a GHA workflow / publisher
  # script in the pr-merged-publisher class, not a node contract), the same way
  # onex.evt.github.pr-merged.v1 is published by the pr-merged-publisher GHA
  # workflow. node_merge_state_projection is the REPORT-ONLY measurement
  # consumer; the publisher is wired in the WS6 enforcement follow-up.
  onex.evt.omnimarket.merge-state-transition.v1: "merge-flow instrumentation publisher (GHA workflow / publisher script) — OMN-14648 WS6"
  # OMN-14986: node_pr_state_projection_compute's contract routes its
  # "pr_state.upsert" intent to node_pr_state_write_effect via the generic
  # IntentEffectDispatchBridge (OMN-14516) -- an in-process call, never a
  # literal Kafka publish. The command topic below is declared on the
  # write-effect's contract only for introspection / independent invocation;
  # the graph cannot see the intent-routing edge.
  onex.cmd.omnibase-infra.pr-state-upsert.v1: "produced in-process by IntentEffectDispatchBridge from node_pr_state_projection_compute's intent_consumption.intent_routing_table (OMN-14516), not a literal Kafka publish — OMN-14986"
  # OMN-14986: same pattern -- node_validation_ledger_projection_compute
  # routes its "validation_ledger.append" intent to
  # node_validation_ledger_write_effect via the same in-process bridge.
  onex.cmd.omnibase-infra.validation-ledger-append.v1: "produced in-process by IntentEffectDispatchBridge from node_validation_ledger_projection_compute's intent_consumption.intent_routing_table (OMN-14516), not a literal Kafka publish — OMN-14986"
  # OMN-14986: real, live omniclaude hook-emitted events (raw Kafka publish
  # calls in omniclaude's Python hook code, not ONEX node contracts -- see
  # src/omniclaude/hooks/handler_event_emitter.py and
  # src/omniclaude/lib/manifest_injection_event_publisher.py). omniclaude's
  # hooks are pre-contract legacy publish sites with no contract.yaml
  # declaring publish_topics, so the checkout-tier census (CHECKOUT_PACKAGES)
  # cannot see them -- confirmed live via grep: build_topic(TopicBase.*) call
  # sites in omniclaude's own source tree, not test-only references.
  onex.evt.omniclaude.session-outcome.v1: "published by omniclaude src/omniclaude/hooks/handler_event_emitter.py (raw hook code, no contract.yaml) — OMN-14986"
  onex.evt.omniclaude.validator-catch.v1: "published by omniclaude src/omniclaude/hooks/handlers/context_scope_auditor.py (raw hook code, no contract.yaml) — OMN-14986"
  # OMN-14986: node_savings_estimation_compute's subscribe_topics previously
  # declared onex.evt.omniclaude.hook-context-injected.v1, which omniclaude
  # has never published (its real topic, per
  # src/omniclaude/hooks/topics.py::TopicBase.CONTEXT_INJECTED, is
  # context-injected.v1 -- no "hook-" prefix). Renamed on the infra side to
  # match the real wire topic (omnibase_infra PR citing this ticket); the
  # renamed topic is still a raw hook-emitted publish with no contract.yaml,
  # so it needs the same census exemption as the two topics above.
  onex.evt.omniclaude.context-injected.v1: "published by omniclaude src/omniclaude/lib/manifest_injection_event_publisher.py (raw hook code, no contract.yaml); renamed from the non-existent hook-context-injected.v1 — OMN-14986"
  # OMN-15423 rebase: omnibase_infra node_ledger_projection_compute is an
  # audit consumer for runtime/DLQ/OCC/steel topics whose producers are outside
  # the checked contract corpus or are runtime infrastructure sinks rather than
