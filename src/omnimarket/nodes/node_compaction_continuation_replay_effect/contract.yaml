name: node_compaction_continuation_replay_effect
contract_version:
  major: 1
  minor: 0
  patch: 0
node_type: effect
runtime_profiles:
- effects
node_version:
  major: 1
  minor: 0
  patch: 0
description: Run a fixed answering model for N assistant turns, or replay recorded turns, through isolated
  tool stubs. Ledger writes reach a fresh scratch copy, frozen reads return pinned content, and other
  calls receive typed refusals. Grade three repeats per arm by the CM.14 data file and remove unstable
  or unavailable cells with their partner. Use the existing CM.3 classifier and shared CM.1/CM.2 models.
  Collect staged and unstaged changes using git diff HEAD.
handler:
  module: omnimarket.nodes.node_compaction_continuation_replay_effect.handlers.handler_experiment
  class: HandlerReplayExperiment
  input_model: omnimarket.nodes.node_compaction_continuation_replay_effect.models.model_experiment.ModelExperimentRequest
  output_model: omnimarket.nodes.node_compaction_continuation_replay_effect.models.model_experiment.ModelExperimentResult
handler_routing:
  routing_strategy: operation_match
  handlers:
  - operation: run_continuation_experiment
    handler:
      name: HandlerReplayExperiment
      module: omnimarket.nodes.node_compaction_continuation_replay_effect.handlers.handler_experiment
    input_model: omnimarket.nodes.node_compaction_continuation_replay_effect.models.model_experiment.ModelExperimentRequest
    output_model: omnimarket.nodes.node_compaction_continuation_replay_effect.models.model_experiment.ModelExperimentResult
  default_handler: omnimarket.nodes.node_compaction_continuation_replay_effect.handlers.handler_experiment:HandlerReplayExperiment
descriptor:
  node_archetype: effect
  purity: effectful
  idempotent: false
  timeout_ms: 600000
  runtime_profiles:
  - effects
event_bus:
  subscribe_topics:
  - onex.cmd.omnimarket.compaction-continuation-replay-start.v1
  publish_topics:
  - onex.evt.omnimarket.compaction-continuation-replay-completed.v1
runtime_dispatch:
  invocation:
    mode: on_demand
    sender: operator via onex node node_compaction_continuation_replay_effect
    reason: Outside the loaded census surface; no automatic sender verified. Explicit operator diagnostic invocation
      only.
    evidence: seam-census/2026-11-05T0716Z/outside loaded census
  command_topic: onex.cmd.omnimarket.compaction-continuation-replay-start.v1
terminal_event: onex.evt.omnimarket.compaction-continuation-replay-completed.v1
externally_consumed_topics:
- onex.evt.omnimarket.compaction-continuation-replay-completed.v1
input_model:
  name: ModelExperimentRequest
  module: omnimarket.nodes.node_compaction_continuation_replay_effect.models.model_experiment
output_model:
  name: ModelExperimentResult
  module: omnimarket.nodes.node_compaction_continuation_replay_effect.models.model_experiment
dependencies:
- name: ProtocolContinuationModel
  dependency_type: protocol
  required: true
  description: Fixed answering model port injected through ContainerContinuationReplay; no proposed tool
    is executed by the model port.
- name: ProtocolActionScorer
  dependency_type: protocol
  required: true
  description: Existing CM.3 action classifier, injected through the container.
- name: scratch_root
  dependency_type: configuration
  required: true
  description: Dedicated replay scratch root from the runtime overlay.
- name: input_roots
  dependency_type: configuration
  required: true
  description: Roots from the runtime overlay under which ledger_source, tolerance_file and scratch_worktree
    must resolve. A path outside them is refused before any read, and none configured refuses every path.
continuation:
  repeats: 3
  default_turns: 25
  sensitivity_turns:
  - 10
  - 50
  temperature: 0.0
  stability_data_file: data/cm14_continuation.yaml
  container_factory: omnimarket.nodes.node_compaction_continuation_replay_effect.container.container_replay:create_replay_container
sandbox:
  refused_programs:
  - gh
  - onex
  network_programs:
  - curl
  - wget
  - ssh
  - scp
  - nc
  - ncat
  - telnet
  - ftp
  - rsync
  - http
  - https
  network_git_verbs:
  - push
  - fetch
  - pull
  - clone
  - ls-remote
  - remote
  ledger_programs:
  - onex-ledger
  network_tools:
  - network
  - web_fetch
  - web_search
  - http
  class_depth:
    gh: 3
    onex: 3
    git: 2
components:
  replay:
    handler:
      module: omnimarket.nodes.node_compaction_continuation_replay_effect.handlers.handler_continuation_replay
      name: HandlerContinuationReplay
  stability:
    handler:
      module: omnimarket.nodes.node_compaction_continuation_replay_effect.handlers.handler_repeat_stability
      name: HandlerRepeatStability
