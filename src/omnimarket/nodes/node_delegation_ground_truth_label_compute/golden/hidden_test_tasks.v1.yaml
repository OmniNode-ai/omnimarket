    reference: |
      def normalize_path(p: str) -> str:
          if not p.startswith("/"):
              raise ValueError("path must be absolute")
          segments = []
          for segment in p.split("/"):
              if segment in ("", "."):
                  continue
              if segment == "..":
                  if segments:
                      segments.pop()
              else:
                  segments.append(segment)
          return "/" + "/".join(segments)
