      import re

      def _parse_version(version):
          number = r"(?:0|[1-9][0-9]*)"
          identifiers = r"[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*"
          pattern = rf"({number})\.({number})\.({number})(?:-({identifiers}))?(?:\+({identifiers}))?"
          match = re.fullmatch(pattern, version)
          if match is None:
              raise ValueError("invalid semantic version")
          prerelease = None if match[4] is None else match[4].split(".")
          if prerelease is not None:
              for part in prerelease:
                  if part.isdigit() and len(part) > 1 and part[0] == "0":
                      raise ValueError("leading zero in prerelease")
          return tuple(int(match[i]) for i in (1, 2, 3)), prerelease

      def compare_semver(a: str, b: str) -> int:
          core_a, pre_a = _parse_version(a)
          core_b, pre_b = _parse_version(b)
          if core_a != core_b:
              return (core_a > core_b) - (core_a < core_b)
          if pre_a is None or pre_b is None:
              return (pre_a is None) - (pre_b is None)
          for left, right in zip(pre_a, pre_b):
              if left == right:
                  continue
              if left.isdigit() and right.isdigit():
                  return (int(left) > int(right)) - (int(left) < int(right))
              if left.isdigit() != right.isdigit():
                  return -1 if left.isdigit() else 1
              return (left > right) - (left < right)
          return (len(pre_a) > len(pre_b)) - (len(pre_a) < len(pre_b))
