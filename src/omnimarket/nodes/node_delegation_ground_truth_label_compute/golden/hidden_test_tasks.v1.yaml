      def chunk_by_weight(items: list[tuple[str, int]], limit: int) -> list[list[str]]:
          if limit <= 0 or any(weight < 0 for _, weight in items):
              raise ValueError("positive limit and nonnegative weights required")
          result = []
          current = []
          total = 0
          for name, weight in items:
              if weight > limit:
                  if current:
                      result.append(current)
                  result.append([name])
                  current = []
                  total = 0
                  continue
              if current and total + weight > limit:
                  result.append(current)
                  current = []
                  total = 0
              current.append(name)
              total += weight
          if current:
              result.append(current)
          return result
