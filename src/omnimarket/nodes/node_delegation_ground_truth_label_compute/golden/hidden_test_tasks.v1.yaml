    reference: |
      def luhn_check_digit(partial: str) -> str:
          if any(c not in "0123456789 " for c in partial):
              raise ValueError("only ASCII digits and spaces allowed")
          digits = partial.replace(" ", "")
          if not digits:
              raise ValueError("at least one digit required")
          total = 0
          for i, char in enumerate(reversed(digits)):
              value = int(char)
              if i % 2 == 0:
                  value *= 2
                  if value > 9:
                      value -= 9
              total += value
          return str((-total) % 10)
