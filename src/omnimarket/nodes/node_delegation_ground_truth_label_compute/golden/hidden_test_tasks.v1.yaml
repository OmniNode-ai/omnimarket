    reference: |
      import re

      def parse_duration(s: str) -> int:
          match = re.fullmatch(r"(?:([0-9]+)h)?(?:([0-9]+)m)?(?:([0-9]+)s)?", s)
          if not s or match is None:
              raise ValueError("invalid duration")
          return sum(int(value or "0") * scale
                     for value, scale in zip(match.groups(), (3600, 60, 1)))
