  - id: parse_csv_line
    function: parse_csv_line
    prompt: |
      Implement parse_csv_line(line: str) -> list[str] using the standard library only.
      Parse a single comma-separated record. An unquoted field contains literal
      characters other than commas and double quotes. A field may instead be
      wrapped in double quotes; commas inside those quotes are literal, and a
      doubled double quote inside a quoted field represents one literal quote.
      Remove the wrapping quotes, but preserve all other whitespace without
      trimming. Empty fields, including quoted empty fields and a trailing empty
      field after a comma, are valid. An empty line represents one empty field.
      Raise ValueError for an unterminated quoted field, any double quote in an
      unquoted field such as 'a"b', or any characters between a closing quote and
      the next comma or end of input. Opening quotes must begin the field.
      Worked examples: '"a,b",c' produces ["a,b", "c"]; '"a""b",c' produces
      ['a"b', 'c']; 'a,' produces ["a", ""]; an empty line produces [""];
      ' a , b ' produces [" a ", " b "] without trimming.
