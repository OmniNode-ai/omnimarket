      import re

      def roman_to_int(s: str) -> int:
          pattern = r"M{0,3}(?:CM|CD|D?C{0,3})(?:XC|XL|L?X{0,3})(?:IX|IV|V?I{0,3})"
          if not s or re.fullmatch(pattern, s) is None:
              raise ValueError("noncanonical Roman numeral")
          values = {"I": 1, "V": 5, "X": 10, "L": 50, "C": 100, "D": 500, "M": 1000}
          return sum(-values[c] if i + 1 < len(s) and values[c] < values[s[i + 1]]
                     else values[c] for i, c in enumerate(s))
    control: |
      # Mistake: accepts any subtractive spelling without checking canonical form.
      def roman_to_int(s: str) -> int:
          values = {"I": 1, "V": 5, "X": 10, "L": 50, "C": 100, "D": 500, "M": 1000}
          if not s or any(c not in values for c in s):
              raise ValueError("invalid Roman numeral")
          result = sum(-values[c] if i + 1 < len(s) and values[c] < values[s[i + 1]]
                       else values[c] for i, c in enumerate(s))
          if not 1 <= result <= 3999:
              raise ValueError("out of range")
          return result

