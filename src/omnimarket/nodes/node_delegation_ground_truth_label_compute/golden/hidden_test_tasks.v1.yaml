                  parts.append(small[hundreds] + " hundred")
              if 0 < remainder < 20:
                  parts.append(small[remainder])
              elif remainder >= 20:
                  ten, one = divmod(remainder, 10)
                  parts.append(tens[ten] + ("-" + small[one] if one else ""))
