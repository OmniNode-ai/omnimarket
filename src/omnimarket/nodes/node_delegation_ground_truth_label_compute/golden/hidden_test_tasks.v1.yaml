      zeros; build identifiers may have them. Raise ValueError for any malformed
      version in either argument, including "1.0", "01.0.0", "1.0.0-", and
      "1.0.0-01". Whitespace is forbidden.
      Compare major, then minor, then patch numerically. A release outranks its
      prereleases. Compare prerelease identifiers from left to right: numeric
      ones compare numerically and rank below nonnumeric ones; nonnumeric ones
      compare lexicographically by ASCII. When an equal prefix is exhausted, the
      shorter prerelease ranks lower. Ignore build metadata for precedence.
      The canonical increasing sequence is 1.0.0-alpha, 1.0.0-alpha.1,
      1.0.0-alpha.beta, 1.0.0-beta, 1.0.0-beta.2, 1.0.0-beta.11, 1.0.0-rc.1,
      1.0.0. Identical versions have equal precedence.
      Worked examples: comparing "1.0.0-beta.2" with "1.0.0-beta.11" returns
      -1 because 2 is numerically smaller than 11; comparing "1.0.0+build.5"
      with "1.0.0" returns 0 because build metadata is ignored; comparing
      "2.0.0" with "1.99.99" returns 1 because major takes priority.
