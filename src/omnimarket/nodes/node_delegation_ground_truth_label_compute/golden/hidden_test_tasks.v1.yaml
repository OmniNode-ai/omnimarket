          if not s or re.fullmatch(r"(?:[0-9]+[hms])+", s) is None:
              raise ValueError("invalid duration")
          scales = {"h": 3600, "m": 60, "s": 1}
          return sum(int(value) * scales[unit]
                     for value, unit in re.findall(r"([0-9]+)([hms])", s))

  - id: merge_intervals
