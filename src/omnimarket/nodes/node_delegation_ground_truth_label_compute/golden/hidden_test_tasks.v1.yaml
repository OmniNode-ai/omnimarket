  - id: parse_duration
    function: parse_duration
    prompt: |
      Implement parse_duration(s: str) -> int using the standard library only.
      Return the total seconds represented by a nonempty sequence of digit-and-unit
      components. Each component has one or more ASCII digits followed by h, m,
      or s. Hours count as 3600 seconds, minutes as 60, and seconds as 1. Units
      may be omitted, but each may occur at most once and must appear in h, m, s
      order. Zero-valued components are allowed. The entire string must match;
      whitespace, signs, Unicode digits, and other characters are forbidden.
      Raise ValueError for empty input, wrong unit order, unknown units, missing
      digits, repeated units, or whitespace. In particular, reject "", "1m1h",
      "1x", "h", "1h1h", and " 1h".
      Worked examples: "1h30m15s" represents 3600 + 1800 + 15 = 5415 seconds;
      "45s" represents 45 seconds; "2h" represents 7200 seconds; "1h0m5s"
      represents 3600 + 0 + 5 = 3605 seconds.
      Reply with one Python code block containing the function and any helpers it needs. No tests, no explanation.
    hidden_test: |
