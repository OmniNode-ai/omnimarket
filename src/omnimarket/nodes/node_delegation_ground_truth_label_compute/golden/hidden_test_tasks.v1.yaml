      def int_to_words(n: int) -> str:
          if isinstance(n, bool) or not 0 <= n <= 999_999_999:
              raise ValueError("integer out of range or bool")
          small = ("zero one two three four five six seven eight nine ten eleven "
                   "twelve thirteen fourteen fifteen sixteen seventeen eighteen nineteen").split()
          tens = "zero ten twenty thirty forty fifty sixty seventy eighty ninety".split()

          def under_thousand(value):
              parts = []
              hundreds, remainder = divmod(value, 100)
              if hundreds:
                  parts.append(small[hundreds] + " hundred")
              if 0 < remainder < 20:
                  parts.append(small[remainder])
              elif remainder >= 20:
                  ten, one = divmod(remainder, 10)
                  parts.append(tens[ten] + ("-" + small[one] if one else ""))
              return " ".join(parts)

          if n == 0:
              return "zero"
          parts = []
          for divisor, suffix in ((1_000_000, "million"), (1000, "thousand"), (1, "")):
              group, n = divmod(n, divisor)
              if group:
                  parts.append(under_thousand(group) + (" " + suffix if suffix else ""))
          return " ".join(parts)
