name: node_hook_delegate_effect
contract_version:
  major: 1
  minor: 0
  patch: 0
node_type: effect
node_version:
  major: 1
  minor: 0
  patch: 0
description: >
  Answer one delegated Claude Code prompt or subagent task. omniclaude's PreToolUse hook classifies an
  Agent/Task call and hands a delegatable one here, in process. The effect runs onex delegate with the
  task class the classifier's intent maps to, within the request's time limit, and returns the answer, the
  model and the run id. Every other outcome (no onex on PATH, a run that failed, timed out or gave no
  answer, the ONEX gateway already routing the session) is returned so the hook passes the task through to
  Claude Code: a subagent is never blocked without an answer. When the request carries a decline token and
  the model's reply declares it, the outcome is declined, even if onex delegate's quality gates vetoed
  that short reply. Accepted answers are reused for identical tasks within a session turn; every new
  prompt invalidates the previous turn's answers. The prompt_delegate operation (OMN-23413 AC33) takes
  every prompt omniclaude's UserPromptSubmit hook submits: slash commands, prompts starting with @claude
  and sensitive prompts go to Claude; any other prompt is delegated with the recent conversation, its own
  rules, criteria, token cap, 90 s limit and decline token. It returns the hook's whole output: a block
  carrying an accepted answer, so Claude Code makes no model call, or, when the prompt passes to Claude,
  the delegated exchanges Claude has not yet seen, once.
handler:
  module: omnimarket.nodes.node_hook_delegate_effect.handlers.handler_hook_delegate
  class: HandlerHookDelegate
  input_model: omnimarket.nodes.node_hook_delegate_effect.models.model_hook_delegate.ModelHookDelegateRequest
  output_model: omnimarket.nodes.node_hook_delegate_effect.models.model_hook_delegate.ModelHookDelegateResult
handler_routing:
  routing_strategy: operation_match
  default_handler: omnimarket.nodes.node_hook_delegate_effect.handlers.handler_hook_delegate:HandlerHookDelegate
  handlers:
  - operation: hook_delegate
    handler:
      name: HandlerHookDelegate
      module: omnimarket.nodes.node_hook_delegate_effect.handlers.handler_hook_delegate
  - operation: prompt_delegate
    input_model: omnimarket.nodes.node_hook_delegate_effect.models.model_prompt_delegate.ModelPromptDelegateRequest
    output_model: omnimarket.nodes.node_hook_delegate_effect.models.model_prompt_delegate.ModelPromptDelegateResult
    handler:
      name: HandlerPromptDelegate
      module: omnimarket.nodes.node_hook_delegate_effect.handlers.handler_prompt_delegate
event_bus:
  subscribe_topics: []
  publish_topics: []
runtime_dispatch:
  external_trigger: Direct Python invocation by omniclaude's UserPromptSubmit and PreToolUse delegation hook runner.
dependency_ownership:
- cli
protocol_dependencies:
- name: cli
  protocol: omnimarket.nodes.node_hook_delegate_effect.protocols.protocol_delegate_cli:ProtocolDelegateCli
  bind_as: cli
  required: true
  implementations:
  - handler:
      name: AdapterDelegateCli
      module: omnimarket.nodes.node_hook_delegate_effect.adapters.adapter_delegate_cli
descriptor:
  node_archetype: effect
  purity: effectful
  idempotent: false
  side_effects:
  - process-run
  - file-write
  timeout_ms: 240000
  runtime_profiles: []
metadata:
  ticket: OMN-23413
  transport_type: local
lifecycle: experimental
