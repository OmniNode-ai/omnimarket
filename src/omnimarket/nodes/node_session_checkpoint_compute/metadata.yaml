    node_session_checkpoint_compute: omnimarket.nodes.node_session_checkpoint_compute
capabilities:
  standalone: true
  full_runtime: false
  requires_network: false
  requires_repo: false
  requires_secrets: false
  requires_docker: false
  side_effect_class: filesystem_write
