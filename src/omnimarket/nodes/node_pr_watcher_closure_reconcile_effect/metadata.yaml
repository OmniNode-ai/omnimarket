name: node_pr_watcher_closure_reconcile_effect
version: 1.0.0
description: Move pull requests GitHub reports merged or closed out of the PR watcher's
  open set within a bounded number of ticks, oldest read first, through one GraphQL
  nodes(ids:) call per batch, writing the flip under the watcher's state lock.
pack: distributed_validation
node_role: effect
display_name: PR Watcher Closure Reconcile Effect
omnibase_core_compat: '>=0.39.0,<1.0.0'
entry_points:
  onex.nodes:
    node_pr_watcher_closure_reconcile_effect: omnimarket.nodes.node_pr_watcher_closure_reconcile_effect
capabilities:
  standalone: false
  full_runtime: false
  requires_network: true
  requires_repo: false
  requires_secrets: true
  requires_docker: false
  side_effect_class: read_write
dependencies:
- pydantic>=2.0
- pyyaml>=6.0
authors:
- OmniNode Platform Team
license: MIT
tags:
- effect
- pr-watcher
