name: node_lab_history_archive_effect
version: "1.0.0"
description: >
  Archive lab history older than seven days to a declared Drive destination under a
  CPU, IO and bandwidth budget: stage compressed parts on the staging drive, upload
  with a CLI uploader, verify size and md5 against Drive, then delete the local copy.
  Refuses a host that carries the landing controller role.
omnibase_core_compat: ">=0.47.31,<0.48.0"
entry_points:
  onex.nodes:
    node_lab_history_archive_effect: "omnimarket.nodes.node_lab_history_archive_effect"
capabilities:
  standalone: true
  full_runtime: true
  requires_network: true
  requires_repo: false
  requires_secrets: true
  requires_docker: false
  side_effect_class: destructive
dependencies:
  - "omnibase-infra>=0.38.66"
  - "pydantic>=2.0"
  - "pyyaml>=6.0.3"
  - "click"
authors: ["OmniNode Platform Team"]
license: "MIT"
tags: ["effect", "archive", "retention", "lab", "drive"]
pack: "operator_tooling"
display_name: "Lab History Archive Effect"
node_role: "effect"
