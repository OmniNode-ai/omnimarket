# SPDX-License-Identifier: MIT
#
# ONEX Node Contract
# Node: NodeAndonStopReducer
#
# The lifecycle of one andon stop: a detector opens it, one swarm lane holds its lease,
# the readback clears it, an operator can declare it false. The transitions are the
# state_machine below (the fragment of section 5.8 of the factory design plan), run by
# core's execute_transition through omnimarket.handlers.rules_stop_gate, the one rule
# the queue, the fill, the placement decision and the worker-engine choice also call in
# process. Every number is config.andon_stop below; the class mode per class is the
# andon_stop overlay (overlay.py).
#
#   handle(ModelStopFoldRequest) -> ModelStopFoldResult
#
# One further pure operation: stop_gate, the shared admission rule.
# Facts only: the stop record, the event and now. No protocol dependency and no clock
# read; the exception queue (node_exception_queue_effect) persists what is decided.
name: "node_andon_stop_reducer"
contract_name: "node_andon_stop_reducer"
node_name: "node_andon_stop_reducer"
lifecycle: experimental
node_type: "REDUCER_GENERIC"
contract_version:
  major: 0
  minor: 1
  patch: 0
node_version:
  major: 0
  minor: 1
  patch: 0
description: >
  Pure reducer folding one event into one andon stop. A stop never clears without
  consecutive complete fixed readings; a reading that cannot be read holds it; an
  expired lease is replaced up to the configured count and then one decision row is
  written; a stale stop never clears itself; only an operator declares a stop false.
input_model:
  name: "ModelStopFoldRequest"
  module: "omnimarket.models.stop_gate"
  description: "One stop record and one event from one writer."
output_model:
  name: "ModelStopFoldResult"
  module: "omnimarket.models.stop_gate"
  description: "The stop after the event, the transition taken and the actions the queue persists."
handler:
  module: "omnimarket.nodes.node_andon_stop_reducer.handlers.handler_andon_stop"
  class: "HandlerAndonStop"
  input_model: "omnimarket.models.stop_gate.ModelStopFoldRequest"
  output_model: "omnimarket.models.stop_gate.ModelStopFoldResult"
handler_routing:
  routing_strategy: "operation_match"
  default_handler: "omnimarket.nodes.node_andon_stop_reducer.handlers.handler_andon_stop:HandlerAndonStop"
  handlers:
    - operation: "fold_stop_event"
      handler:
        name: "HandlerAndonStop"
        module: "omnimarket.nodes.node_andon_stop_reducer.handlers.handler_andon_stop"
    - operation: "stop_gate"
      input_model: "omnimarket.models.stop_gate.ModelStopGateRequest"
      handler:
        name: "HandlerStopGate"
        module: "omnimarket.nodes.node_andon_stop_reducer.handlers.handler_stop_gate"
event_bus:
  subscribe_topics: []
  publish_topics: []
runtime_dispatch:
  external_trigger: Direct Python invocation by the exception queue and the dispatchers with supplied stop records and policy.
descriptor:
  node_archetype: reducer
  purity: pure
  runtime_profiles: []
  idempotent: true
  timeout_ms: 2000
replay:
  deterministic: true
config:
  andon_stop:
    stale_after_hours: 4
    storm_distinct_keys: 5
    lease_minutes: 90
    max_lease_replacements: 3
    consecutive_fixed_readings: 2
    canary_dispatches_per_readback_interval: 1
    recovery_minimum_crossings: 1
    stop_classes:
      - {id: engine-policy-breach, label: A, detector: SM-02, scope_key_kind: engine}
      - {id: repository-without-lander, label: B, detector: "floor, stuck-green, repo-status, SM-07", scope_key_kind: repository}
      - {id: host-bound-ruling-drifted, label: C, detector: "drift check, host drift", scope_key_kind: host}
      - {id: ruling-drifted, label: D, detector: drift check, scope_key_kind: ruling}
      - {id: seam-mismatch, label: E, detector: any MISSING seam, scope_key_kind: seam}
    writer_roles:
      open: detector
      lease_granted: swarm_lane
      lease_expired: detector
      stale_limit_reached: detector
      countermeasure_merged: swarm_lane
      hand_fix_recorded: operator
      replacements_extended: operator
      readback: readback
      declared_false: operator
metadata:
  transport_type: local
  description: "Folds writer events into an andon stop and decides whether new work into its scope is admitted."
  author: "OmniNode Team"
  license: "MIT"
  created: "2026-11-01"
  tags:
    - reducer
    - andon
    - stop
    - pure
state_machine:
  version: {major: 1, minor: 0, patch: 0}
  state_machine_name: andon_stop_fsm
  state_machine_version: {major: 1, minor: 0, patch: 0}
  description: 'Lifecycle of one stop: opened by a detector, worked by one swarm lane under a lease, cleared only by consecutive complete fixed readbacks.'
  initial_state: open
  terminal_states: [cleared, declared_false]
  error_states: []
  persistence_enabled: false
  states:
  - version: {major: 1, minor: 0, patch: 0}
    state_name: open
    state_type: operational
    description: A detector found a defect of a declared class; no swarm lane holds the lease yet.
  - version: {major: 1, minor: 0, patch: 0}
    state_name: swarming
    state_type: operational
    description: One swarm lane holds the lease and works the cause.
  - version: {major: 1, minor: 0, patch: 0}
    state_name: fixed
    state_type: operational
    description: A countermeasure merged; the readback must read fixed on consecutive complete readings.
  - version: {major: 1, minor: 0, patch: 0}
    state_name: stale
    state_type: operational
    description: No live swarm lane past the stale limit, or the lease replacements are used up; one decision row is open.
  - version: {major: 1, minor: 0, patch: 0}
    state_name: cleared
    state_type: terminal
    description: The readback read fixed on the required consecutive readings; dispatch resumes.
    is_terminal: true
    is_recoverable: false
  - version: {major: 1, minor: 0, patch: 0}
    state_name: declared_false
    state_type: terminal
    description: The operator declared the stop a false positive; one decision row records it.
    is_terminal: true
    is_recoverable: false
  transitions:
  - version: {major: 1, minor: 0, patch: 0}
    transition_name: open_to_swarming_on_lease_granted
    from_state: open
    to_state: swarming
    trigger: lease_granted
    conditions:
    - {condition_name: replacement_budget_left, condition_type: expression, expression: lease_replacements_remaining != 0}
    actions:
    - action_name: emit_lease_record
      action_type: intent_emission
  - version: {major: 1, minor: 0, patch: 0}
    transition_name: stale_to_swarming_on_lease_granted
    from_state: stale
    to_state: swarming
    trigger: lease_granted
    conditions:
    - {condition_name: replacement_budget_left, condition_type: expression, expression: lease_replacements_remaining != 0}
    actions:
    - action_name: emit_lease_record
      action_type: intent_emission
  - version: {major: 1, minor: 0, patch: 0}
    transition_name: swarming_to_swarming_on_lease_expired_replaced
    from_state: swarming
    to_state: swarming
    trigger: lease_expired
    priority: 1
    conditions:
    - {condition_name: replacement_left, condition_type: expression, expression: lease_replacements_remaining != 0}
    actions:
    - action_name: emit_lease_record
      action_type: intent_emission
  - version: {major: 1, minor: 0, patch: 0}
    transition_name: swarming_to_stale_on_lease_expired_exhausted
    from_state: swarming
    to_state: stale
    trigger: lease_expired
    conditions:
    - {condition_name: replacements_used_up, condition_type: expression, expression: lease_replacements_remaining == 0}
    actions:
    - action_name: emit_decision_row
      action_type: intent_emission
  - version: {major: 1, minor: 0, patch: 0}
    transition_name: open_to_stale_on_stale_limit_reached
    from_state: open
    to_state: stale
    trigger: stale_limit_reached
    actions:
    - action_name: emit_decision_row
      action_type: intent_emission
  - version: {major: 1, minor: 0, patch: 0}
    transition_name: open_to_fixed_on_countermeasure_merged
    from_state: open
    to_state: fixed
    trigger: countermeasure_merged
  - version: {major: 1, minor: 0, patch: 0}
    transition_name: swarming_to_fixed_on_countermeasure_merged
    from_state: swarming
    to_state: fixed
    trigger: countermeasure_merged
  - version: {major: 1, minor: 0, patch: 0}
    transition_name: stale_to_fixed_on_countermeasure_merged
    from_state: stale
    to_state: fixed
    trigger: countermeasure_merged
  - version: {major: 1, minor: 0, patch: 0}
    transition_name: open_to_fixed_on_hand_fix_recorded
    from_state: open
    to_state: fixed
    trigger: hand_fix_recorded
    conditions:
    - {condition_name: hand_fix_allowed, condition_type: expression, expression: hand_fix_allowed == True}
  - version: {major: 1, minor: 0, patch: 0}
    transition_name: swarming_to_fixed_on_hand_fix_recorded
    from_state: swarming
    to_state: fixed
    trigger: hand_fix_recorded
    conditions:
    - {condition_name: hand_fix_allowed, condition_type: expression, expression: hand_fix_allowed == True}
  - version: {major: 1, minor: 0, patch: 0}
    transition_name: stale_to_fixed_on_hand_fix_recorded
    from_state: stale
    to_state: fixed
    trigger: hand_fix_recorded
    conditions:
    - {condition_name: hand_fix_allowed, condition_type: expression, expression: hand_fix_allowed == True}
  - version: {major: 1, minor: 0, patch: 0}
    transition_name: stale_to_stale_on_replacements_extended
    from_state: stale
    to_state: stale
    trigger: replacements_extended
    actions:
    - action_name: emit_decision_row
      action_type: intent_emission
  - version: {major: 1, minor: 0, patch: 0}
    transition_name: fixed_to_cleared_on_readback_fixed_enough
    from_state: fixed
    to_state: cleared
    trigger: readback_fixed
    priority: 1
    conditions:
    - {condition_name: readback_complete, condition_type: expression, expression: readback_complete == True}
    - {condition_name: no_fixed_readings_missing, condition_type: expression, expression: fixed_readings_missing == 0}
    actions:
    - action_name: emit_clear_record
      action_type: intent_emission
  - version: {major: 1, minor: 0, patch: 0}
    transition_name: fixed_to_fixed_on_readback_fixed_more_needed
    from_state: fixed
    to_state: fixed
    trigger: readback_fixed
    conditions:
    - {condition_name: fixed_readings_missing, condition_type: expression, expression: fixed_readings_missing != 0}
  - version: {major: 1, minor: 0, patch: 0}
    transition_name: fixed_to_fixed_on_readback_unknown
    from_state: fixed
    to_state: fixed
    trigger: readback_unknown
  - version: {major: 1, minor: 0, patch: 0}
    transition_name: fixed_to_open_on_readback_mismatch
    from_state: fixed
    to_state: open
    trigger: readback_mismatch
  - version: {major: 1, minor: 0, patch: 0}
    transition_name: fixed_to_stale_on_stale_limit_reached
    from_state: fixed
    to_state: stale
    trigger: stale_limit_reached
    actions:
    - action_name: emit_decision_row
      action_type: intent_emission
  - version: {major: 1, minor: 0, patch: 0}
    transition_name: open_to_declared_false_on_declared_false
    from_state: open
    to_state: declared_false
    trigger: declared_false
    actions:
    - action_name: emit_decision_row
      action_type: intent_emission
  - version: {major: 1, minor: 0, patch: 0}
    transition_name: swarming_to_declared_false_on_declared_false
    from_state: swarming
    to_state: declared_false
    trigger: declared_false
    actions:
    - action_name: emit_decision_row
      action_type: intent_emission
  - version: {major: 1, minor: 0, patch: 0}
    transition_name: fixed_to_declared_false_on_declared_false
    from_state: fixed
    to_state: declared_false
    trigger: declared_false
    actions:
    - action_name: emit_decision_row
      action_type: intent_emission
  - version: {major: 1, minor: 0, patch: 0}
    transition_name: stale_to_declared_false_on_declared_false
    from_state: stale
    to_state: declared_false
    trigger: declared_false
    actions:
    - action_name: emit_decision_row
      action_type: intent_emission
