name: node_factory_floor_compute
lifecycle: experimental
node_type: COMPUTE_GENERIC
runtime_profiles: []
contract_version:
  major: 1
  minor: 0
  patch: 0
node_version: 1.0.0
description: >-
  Join plans, their task manifests, the PR watcher state, the ledger's CLAIM, TERMINAL, HOLD, RELEASE and
  gate STATUS rows, the Linear snapshot plans-today writes, the lab placement reading and the landing
  controller's merges into one assembly-line record per selected plan (line id, name, status pill, percent
  built, stations with items and feeders, andon flag with reason) and one floor section (bays, shipped and
  waiting pull requests, stoppages from the friction report). A plan with no manifest falls back to the
  plans-today task table. Pure and deterministic: the caller supplies every fact, including the time.
input_model:
  name: ModelFactoryFloorRequest
  module: omnimarket.models.model_factory_floor_input
  description: Typed facts read by the caller, with the vocabularies and limits from this contract's config block.
output_model:
  name: ModelFactoryFloorResult
  module: omnimarket.nodes.node_factory_floor_compute.models.model_factory_floor_output
  description: One line per selected plan and the floor section.
handler:
  module: omnimarket.nodes.node_factory_floor_compute.handlers.handler_factory_floor
  class: HandlerFactoryFloor
  input_model: omnimarket.models.model_factory_floor_input.ModelFactoryFloorRequest
  output_model: omnimarket.nodes.node_factory_floor_compute.models.model_factory_floor_output.ModelFactoryFloorResult
handler_routing:
  routing_strategy: operation_match
  default_handler: omnimarket.nodes.node_factory_floor_compute.handlers.handler_factory_floor:HandlerFactoryFloor
  handlers:
  - operation: handle
    handler:
      name: HandlerFactoryFloor
      module: omnimarket.nodes.node_factory_floor_compute.handlers.handler_factory_floor
event_bus:
  subscribe_topics: []
  publish_topics: []
runtime_dispatch:
  external_trigger: node_factory_floor_effect (runtime_factory_floor.py) reads the sources, calls HandlerFactoryFloor.handle with this contract's config block and writes the JSON.
descriptor:
  node_archetype: compute
  purity: pure
  runtime_profiles: []
  idempotent: true
  timeout_ms: 30000
replay:
  requires_validator_version: true
  timestamp_authority: ingest_sequence
  deterministic: true

# Vocabularies and limits the handler reads from its request (ModelFactoryFloorConfig). The handler holds none.
config:
  schema_id: omni.factory-floor/1
  andon_markers: [andon]
  gate_kind: gate
  gate_state: gate
  gate_fail_verdicts: [fail]
  gate_pass_verdicts: [pass]
  done_outcomes: [done, merged]
  handoff_outcomes: [handed-off]
  blocked_outcomes: [blocked, failed, partial]
  live_claim_minutes: 45
  station_name_template: "Wave {wave}"
  fallback_station_id: tasks
  fallback_station_name: Task table (no manifest)
  shipped_window_hours: 24
  shipped_limit: 20
  waiting_limit: 40
  stoppage_limit: 10
  note_chars: 200
  # A HOLD stops a line only when no sentence of its text that carries one of these markers also names the line: the
  # first hold_exemption_slug_tokens words of the plan's file name (after its date), joined by hyphens.
  hold_exemption_markers: [exempt]
  hold_exemption_slug_tokens: 3
  # Live lanes (OMN-21733): a lane is live while its newest CLAIM has no TERMINAL after it and it wrote a row inside
  # lane_live_window_minutes; it is stalled after stall_minutes without a row of any kind.
  lane_live_window_minutes: 180
  stall_minutes: 45
  status_chars: 140
  title_chars: 110
  lane_limit: 200
  pool_stale_minutes: 30
  repair_reason_chars: 120
  # A machine the host table takes out of selection is in repair when its reason says so, else it is out of selection.
  repair_reason_markers: [repair]
  # The first rule with a marker in the lane's actor, name or CLAIM text names its kind.
  lane_kinds:
    - kind: landing worker
      actor_contains: [landing-controller]
    - kind: burn-down
      text_contains: [burn-down, burn down]
    - kind: plan
      text_contains: [write a plan, implementation plan, plan for]
    - kind: diagnose
      text_contains: [find the real cause, diagnose, investigate, root cause, read-only evidence]
    - kind: fix
      text_contains: [fix, repair, reds on]
  lane_kind_default: build
  codex_model_markers: [codex]
  # Cloud sessions are receipts whose host starts with this prefix; the cloud bay lights its stop lamp when the newest
  # finished cloud session ended in one of these statuses.
  cloud_host_prefix: "cloud:"
  cloud_no_push_statuses: [cloud-no-pr]
  cloud_no_push_lamp_text: Cloud sessions are ending without a pull request
  cloud_ready_logins: [ok]
  cloud_sessions_limit: 8
  # A declared line the build cannot draw is drawn stopped with one of these causes, never left out.
  undrawn_not_found_cause: plan file not found
  undrawn_no_tasks_cause: no task table
  # A line is stopped while the newest CLAIM or TERMINAL on one of its tickets is a TERMINAL ending in one of these
  # outcomes, or while a MSG to one of these recipients (a to= cell that starts with it) has no row of an answering
  # kind (re= the MSG's id) and no CLAIM by another lane on its tickets after it.
  stop_outcomes: [blocked]
  ask_recipients: [orchestrator]
  ask_answer_kinds: [ACK, RELEASE]

# Called in process by node_factory_floor_effect (and by tests) through HandlerFactoryFloor.handle, not by a bus command.
metadata:
  transport_type: local
  description: >-
    Join the factory floor's facts into one assembly-line record per selected plan and a floor section. Pure.
  author: OmniNode Team
  created: '2026-10-31'
  tags:
  - compute
  - factory-floor-compute
  - OMN-21682
  related_tickets:
  - OMN-21682
