---
# SPDX-FileCopyrightText: 2026 OmniNode.ai Inc.
# SPDX-License-Identifier: MIT
# ONEX Node Contract - Lane Result Sweep Scheduled Effect (OMN-24262)
#
# Runs the lane result sweep on the runtime tick, so the sweep has a trigger inside the runtime (its host timer is not used).
# Shape of node_commitment_check_scheduled_effect: it subscribes to the runtime scheduler's tick, gates on its own
# overlay (run_interval_seconds, grace_seconds, window_seconds) and returns its terminal event for the runtime to publish.
name: node_lane_result_sweep_scheduled_effect
contract_name: node_lane_result_sweep_scheduled_effect
node_name: node_lane_result_sweep_scheduled_effect
contract_version: {major: 0, minor: 1, patch: 0}
node_version: {major: 0, minor: 1, patch: 0}
node_type: effect
lifecycle: experimental
runtime_profiles: [effects]

description: >
  Runs the lane result sweep on the runtime's tick, and returns a typed run event. It fails by name when the ledger route cannot be read.

handler:
  module: omnimarket.nodes.node_lane_result_sweep_scheduled_effect.handlers.handler_lane_result_sweep_scheduled
  class: HandlerLaneResultSweepScheduled
  input_model: omnibase_infra.runtime.models.model_runtime_tick.ModelRuntimeTick

handler_routing:
  routing_strategy: operation_match
  handlers:
    - operation: lane_result_sweep.scheduled_run
      handler:
        name: HandlerLaneResultSweepScheduled
        module: omnimarket.nodes.node_lane_result_sweep_scheduled_effect.handlers.handler_lane_result_sweep_scheduled
      handler_module: omnimarket.nodes.node_lane_result_sweep_scheduled_effect.handlers.handler_lane_result_sweep_scheduled
      event_model: omnibase_infra.runtime.models.model_runtime_tick.ModelRuntimeTick
      event_type: platform.runtime-tick
      description: >
        Gate on the overlay run_interval_seconds, then run the lane result sweep over the overlay window_seconds and return the run event.

input_model:
  name: ModelRuntimeTick
  module: omnibase_infra.runtime.models.model_runtime_tick
  description: The runtime scheduler's tick.
output_model:
  name: ModelScheduleRunEvent
  module: omnimarket.models.schedule_trigger.model_schedule_trigger
  description: "One scheduled job run, with when it was scheduled, when it fired and how it went."

descriptor:
  node_archetype: effect
  purity: effectful
  idempotent: false
  timeout_ms: 30000
  side_effects:
    - runs the lane result sweep on the runtime tick

input_subscriptions:
  - topic: "onex.intent.platform.runtime-tick.v1"
    operation: "lane_result_sweep.scheduled_run"

terminal_event: onex.evt.omnimarket.schedule-run.v1

event_bus:
  subscribe_topics:
    - "onex.intent.platform.runtime-tick.v1"
  publish_topics:
    - "onex.evt.omnimarket.schedule-run.v1"

published_events:
  - event_type: ModelScheduleRunEvent
    topic: onex.evt.omnimarket.schedule-run.v1
    description: "One scheduled lane result sweep run."

externally_consumed_topics:
  - onex.evt.omnimarket.schedule-run.v1

# Where the schedule reads its settings. The overlays are found under ONEX_SKILL_OVERLAY_ROOTS or the file the env var names.
runtime:
  schedule_overlay: {overlay_id: node_lane_result_sweep_scheduled_effect, model: omnimarket.nodes.node_lane_result_sweep_scheduled_effect.models.model_lane_result_sweep_schedule_overlay.ModelLaneResultSweepScheduleOverlay}

broker_acl_grants:
  - principal: "${ONEX_ACL_RUNTIME_PRINCIPAL}"
    grants:
      - {resource_type: TOPIC, pattern: LITERAL, name: onex.evt.omnimarket.schedule-run.v1, operation: WRITE}
      - {resource_type: TOPIC, pattern: LITERAL, name: onex.evt.omnimarket.schedule-run.v1, operation: DESCRIBE}
      - {resource_type: TOPIC, pattern: LITERAL, name: onex.intent.platform.runtime-tick.v1, operation: READ}
      - {resource_type: TOPIC, pattern: LITERAL, name: onex.intent.platform.runtime-tick.v1, operation: DESCRIBE}

metadata:
  ticket: OMN-24262
  transport_type: kafka
