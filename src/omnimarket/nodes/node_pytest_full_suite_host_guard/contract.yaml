# ONEX Node Contract - Pytest Full Suite Host Guard (OMN-23367)
# Direct invocation only: no event bus or terminal event. The pre-push guard script reads the files
# and the environment; this node holds the decision.
name: "node_pytest_full_suite_host_guard"
lifecycle: experimental
node_type: "COMPUTE_GENERIC"
runtime_profiles: []
contract_version:
  major: 1
  minor: 0
  patch: 0
node_version: "1.0.0"
description: >-
  Answer whether a direct full-suite pytest run may happen on this host for this login. The request
  carries the host table as read (committed rows then private rows), the per-login overlay file when
  one exists, the invoking login and host, and the PREPUSH_* row overrides. The per-login rows
  (label, login, uv path, run folder) replace the uv path and run folder of the host row that login
  owns and nothing else. A row path that does not start with a slash is relative to the home the host's
  account database gives the login (the request's login_home) and resolves under it; a relative row for
  a login with no home, and any path with a tilde or a parent segment, raise ValueError. The host is allowed when it matches an authorizing row, or when its identity
  is unknown; otherwise the decision carries the refusal text. A malformed per-login overlay or row
  raises ValueError, which the guard script turns into a refusal.
input_model:
  name: "ModelPytestFullSuiteHostGuardRequest"
  module: "omnimarket.nodes.node_pytest_full_suite_host_guard.models.model_pytest_full_suite_host_guard"
  description: "The host tables as read, the host and login asking, and the row overrides."
output_model:
  name: "ModelPytestFullSuiteHostGuardDecision"
  module: "omnimarket.nodes.node_pytest_full_suite_host_guard.models.model_pytest_full_suite_host_guard"
  description: "Whether the run is allowed, the row it resolves to with the login's uv and run folder, and the refusal text."
handler:
  module: "omnimarket.nodes.node_pytest_full_suite_host_guard.handlers.handler_pytest_full_suite_host_guard"
  class: "HandlerPytestFullSuiteHostGuard"
  input_model: "omnimarket.nodes.node_pytest_full_suite_host_guard.models.model_pytest_full_suite_host_guard.ModelPytestFullSuiteHostGuardRequest"
  output_model: "omnimarket.nodes.node_pytest_full_suite_host_guard.models.model_pytest_full_suite_host_guard.ModelPytestFullSuiteHostGuardDecision"
handler_routing:
  routing_strategy: "operation_match"
  default_handler: "omnimarket.nodes.node_pytest_full_suite_host_guard.handlers.handler_pytest_full_suite_host_guard:HandlerPytestFullSuiteHostGuard"
  handlers:
    - operation: "handle"
      handler:
        name: "HandlerPytestFullSuiteHostGuard"
        module: "omnimarket.nodes.node_pytest_full_suite_host_guard.handlers.handler_pytest_full_suite_host_guard"
event_bus:
  subscribe_topics: []
  publish_topics: []
runtime_dispatch:
  external_trigger: "Direct Python invocation of the handler from the pre-push guard script with the host tables as read."
descriptor:
  node_archetype: compute
  purity: pure
  runtime_profiles: []
  idempotent: true
  timeout_ms: 5000
replay:
  requires_validator_version: true
  timestamp_authority: ingest_sequence
  deterministic: true
metadata:
  transport_type: local
  description: "Pytest Full Suite Host Guard — pure host decision with no external transport."
  author: "OmniNode Team"
  created: "2026-11-09"
  tags: ['compute', 'pytest-full-suite-host-guard', 'OMN-23367']
  related_tickets: ['OMN-23367', 'OMN-23355', 'OMN-23551']
