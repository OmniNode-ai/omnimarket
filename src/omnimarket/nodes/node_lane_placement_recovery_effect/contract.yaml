name: node_lane_placement_recovery_effect
lifecycle: experimental
node_type: EFFECT_GENERIC
runtime_profiles: []
contract_version:
  major: 1
  minor: 0
  patch: 0
node_version: 1.0.0
description: 'A remote lane that has not been placed never reads ''placing'' forever: the runner ends its own receipt
  when it is stopped before placement, its detached parent reports placement, and the throughput tick ends every
  receipt a dead runner left placing and puts the lane back in the lane queue while the queue''s term lasts.
  Codex zero-turn HTTP 429 observations write an engine-specific host marker with the provider reset
  or a one-hour fallback, disable same-host retry, and count refused runs per host in tick facts.
  The placement recovery operations (placement_wait, until_placed, end_unplaced, without_queued_no_host,
  requeue_lost_placements, placement_refusals, execute_observed, codex_placement_facts, codex_tick_facts) are called in process through node.py.'
