# The packaged overlay: every public registry repository, each against its own row and per-file table in the
# packaged ratchet file. The daily census unit counts all of them; a CI or hook run names its own repository with
# --repos or --register. A private repository is not named here: the deployment overlay (its own repositories and
# ratchet file) lives at <root>/node_work_ledger_file_census_effect/overlay.yaml under a root named in
# ONEX_SKILL_OVERLAY_ROOTS, or at the file ONEX_LEDGER_CENSUS_OVERLAY names.
registry_root_env: ONEX_LEDGER_CENSUS_ROOT
repositories:
  - {name: omnibase_compat, own_line: false}
  - {name: omnibase_core, own_line: false}
  - {name: omnibase_infra, own_line: false}
  - {name: omnibase_spi, own_line: false}
  - {name: omniclaude, own_line: false}
  - {name: omnidash, own_line: false}
  - {name: omniintelligence, own_line: false}
  - {name: omnimarket, own_line: false}
  - {name: omnimemory, own_line: false}
  - {name: knowledge_base, own_line: false}
names: [ROLLING_WORK_LEDGER]
path_variables: [ONEX_LEDGER_PATH]
# A ruling's line citation: the name, an optional extension, then :<line>.
citation_suffix: '(?:\.md)?:\d+'
document_suffixes: [.md, .rst, .txt, .adoc]
code_suffixes: [.py, .sh, .bash, .zsh, .yaml, .yml, .json, .toml, .plist, .service, .timer, .cfg, .ini, .js, .ts, .mjs, .cjs, .tmpl, .j2, .env]
code_names: [Makefile, Dockerfile, Justfile]
skip_dirs: [.git, node_modules, .venv, venv, __pycache__, .mypy_cache, .ruff_cache, .pytest_cache, .tox]
max_file_bytes: 1000000
hash_comment_suffixes: [.sh, .bash, .zsh, .yaml, .yml, .toml, .cfg, .ini, .env, .tmpl, .j2]
slash_comment_suffixes: [.js, .ts, .mjs, .cjs]
writer_markers:
  - '(?:^|\s|\d)>>?\s*["''$\{(]*\S*(ROLLING_WORK_LEDGER|ONEX_LEDGER_PATH)'
  - 'write_text|write_bytes|\.write\('
  - 'open\([^)]*["''][wax]\+?b?["'']'
  - '--append|\btee\b|\bappend\b'
# Runtime code is the source tree and the runtime contracts in it; a test, fixture, doc, data file or plan
# contract is counted but not as runtime code, whatever tree it sits in.
runtime_include: ['^(src|plugins|scripts|deploy|k8s|operator-tools|tools)/']
runtime_exclude: ['(^|/)(tests?|fixtures|docs?|data|benchmarks|reports?|reference|examples?)/', '^contracts/', '\.json$', 'overlay\.example\.yaml$']
journal_env: ONEX_LEDGER_CENSUS_JOURNAL
ratchet_file: src/omnimarket/nodes/node_work_ledger_file_census_effect/ratchet.yaml
