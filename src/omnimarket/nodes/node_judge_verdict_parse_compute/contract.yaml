# ONEX Node Contract - Judge Verdict Parse Compute (OMN-13212 / B2)
#
# Pure COMPUTE: parses a judge model's raw PASS/FAIL JSON response into a typed
# verdict. Extracted from the deleted node_pr_review_bot.handler_judge_verifier
# (_parse_judge_response); the raw-httpx judge call is deleted — the orchestrator
# calls the judge via the canonical inference bridge.
---
name: node_judge_verdict_parse_compute
contract_version: {major: 1, minor: 0, patch: 0}
node_type: compute
node_version: {major: 1, minor: 0, patch: 0}

description: >
  Pure COMPUTE: parses a judge model's raw PASS/FAIL JSON response (optionally
  markdown-fenced) into a typed ModelJudgeParseResult. Fail-closed — malformed
  JSON or an unknown verdict yields passed=False with a clear reasoning message.
  No I/O; deterministic.

input_model:
  name: ModelJudgeParseRequest
  module: omnimarket.review.pr_review_node_io
  description: "Raw judge LLM response text."

output_model:
  name: ModelJudgeParseResult
  module: omnimarket.review.pr_review_node_io
  description: "Parsed PASS/FAIL verdict + reasoning."

handler:
  module: omnimarket.nodes.node_judge_verdict_parse_compute.handlers.handler_judge_verdict_parse_compute
  class: HandlerJudgeVerdictParseCompute
  input_model: omnimarket.review.pr_review_node_io.ModelJudgeParseRequest

handler_routing:
  routing_strategy: operation_match
  handlers:
    - handler:
        name: HandlerJudgeVerdictParseCompute
        module: omnimarket.nodes.node_judge_verdict_parse_compute.handlers.handler_judge_verdict_parse_compute

descriptor:
  node_archetype: compute
  purity: pure
  idempotent: true
  timeout_ms: 5000
  runtime_profiles:
    - effects

runtime_dispatch:
  command_topic: onex.cmd.omnimarket.judge-verdict-parse.v1
  terminal_events:
    success: onex.evt.omnimarket.judge-verdict-parsed.v1
    failure: onex.evt.omnimarket.judge-verdict-parse-failed.v1

event_bus:
  subscribe_topics:
    - onex.cmd.omnimarket.judge-verdict-parse.v1
  publish_topics:
    - onex.evt.omnimarket.judge-verdict-parsed.v1
    - onex.evt.omnimarket.judge-verdict-parse-failed.v1

terminal_event: onex.evt.omnimarket.judge-verdict-parsed.v1

dependencies:
  packages:
    - "omnibase_core>=0.39.0"

metadata:
  transport_type: kafka
  description: "Judge verdict parse compute node"
  author: "OmniNode Team"
  tags:
    - "compute"
    - "review"
    - "judge"
    - "parse"
  related_tickets:
    - "OMN-13212"
    - "OMN-13205"
