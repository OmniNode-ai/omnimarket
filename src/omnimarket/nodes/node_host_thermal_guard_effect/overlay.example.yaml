# Synthetic values. The deployment's overlay lives at <root>/node_host_thermal_guard_effect/overlay.yaml under a root named in
# ONEX_SKILL_OVERLAY_ROOTS. No key has a default.
#
# hold_above_c / release_below_c / min_hold_s: the hysteresis. A reading above hold_above_c holds the host; it is released only by a
#   reading below release_below_c (a lower number) once it has been held min_hold_s. A reading between the two changes nothing.
# stop_above_c: null turns the lane cut off. hold_text, release_text, stop_text fields: host, hottest_c, cpu_c, gpu_c, hold_above_c, stop_above_c, cut,
#   release_below_c, min_hold_s, since (release and stop: the hold's since).
host_env: ONEX_HOST_NAME
hosts:
  - name: lab-a
    state_dir: .local/state/example/guard
    lane: example-thermal-guard-lab-a
hold_above_c: 85.0
release_below_c: 82.0
min_hold_s: 300
stop_above_c: 90.0
stop_report_every_s: 600
hold_row_until_s: 21600
hold_file: hold.json
episode_file: episode.json
hwmon_root: /sys/class/hwmon
lane_scope_pattern: "onexlane-*"
lane_tag_env: ONEX_LANE_GUARD_DEADLINE
actor: systemd:example-thermal-guard
ticket: OMN-00000
ledger_append:
  command_env: ONEX_LEDGER_BUS_APPEND_COMMAND
  host_env: ONEX_LEDGER_HOST_NAME
  timeout_seconds: 60
hold_text: "{host} thermal hold: hottest {hottest_c:.1f} C (cpu {cpu_c}, gpu {gpu_c}) is above {hold_above_c:.1f} C; no lab run is placed there until a reading is below {release_below_c:.1f} C for at least {min_hold_s} s"
release_text: "{host} thermal release: hottest {hottest_c:.1f} C is below {release_below_c:.1f} C after the hold of {since}; lab runs can be placed there again"
stop_text: "{host} thermal stop: hottest {hottest_c:.1f} C is above {stop_above_c:.1f} C; lane scopes and tagged processes cut: {cut}"
