name: node_team_identity_compute
version: 1.0.0
description: Load the versioned team identity declaration from ONEX_SKILL_OVERLAY_ROOTS (exactly one operator entry and any number of member entries), refuse a malformed or conflicting declaration, and resolve a caller's authenticated identity to its entry; anything short of an authenticated operator match resolves to team restrictions with a diagnostic. The resolved source path and hash travel with the result.
