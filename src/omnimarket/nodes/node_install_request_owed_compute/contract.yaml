# ONEX Node Contract - Install requests owed COMPUTE (OMN-19998, root 5: the install request)
#
# Reads every install request and every result a reader holds and returns the installs still owed: the count the throughput
# goal check reads ("installs owed to the orchestrator") and one line per request. Pure: no clock (the caller supplies now),
# no I/O. Exemplar: node_pr_landing_decision_compute.
name: node_install_request_owed_compute
contract_name: node_install_request_owed_compute
node_name: node_install_request_owed_compute
contract_version: {major: 1, minor: 0, patch: 0}
node_version: {major: 1, minor: 0, patch: 0}
node_type: compute
lifecycle: experimental
runtime_profiles: [main]

description: >
  A request with no verified result is owed. While it is inside its expiry its line reads `<unit> NOT RUNNING: owned by
  install request <id> ...`, so the request owns the NOT RUNNING line; past its expiry its line reads
  `INSTALL-REQUEST-EXPIRED <id> ...`, the one line the throughput tick shows. A request repeated under one id counts once.
  A verified result clears the request whatever order the records arrive in; a failed result keeps it owed and is named in
  its line.

handler:
  module: omnimarket.nodes.node_install_request_owed_compute.handlers.handler_install_request_owed
  class: HandlerInstallRequestOwed
  input_model: omnimarket.models.install_request.ModelInstallOwedInput
  output_model: omnimarket.models.install_request.ModelInstallOwedReading

input_model:
  name: ModelInstallOwedInput
  module: omnimarket.models.install_request
  description: Every request, every result and the clock.
output_model:
  name: ModelInstallOwedReading
  module: omnimarket.models.install_request
  description: The owed and expired counts and one line per owed request.

descriptor:
  node_archetype: compute
  purity: pure
  idempotent: true
  timeout_ms: 1000

# The runtime addresses the node on its command topic; the two terminals are runtime_dispatch.terminal_events. The installer
# effect also calls the handler in process.
handler_routing:
  routing_strategy: "operation_match"
  default_handler: "omnimarket.nodes.node_install_request_owed_compute.handlers.handler_install_request_owed:HandlerInstallRequestOwed"
  handlers:
    - operation: "read_install_requests_owed"
      handler:
        name: "HandlerInstallRequestOwed"
        module: "omnimarket.nodes.node_install_request_owed_compute.handlers.handler_install_request_owed"
runtime_dispatch:
  command_topic: "onex.cmd.omnimarket.install-request-owed-requested.v1"
  terminal_events:
    success: "onex.evt.omnimarket.install-request-owed-completed.v1"
    failure: "onex.evt.omnimarket.install-request-owed-failed.v1"
event_bus:
  version:
    major: 1
    minor: 0
    patch: 0
  subscribe_topics:
    - "onex.cmd.omnimarket.install-request-owed-requested.v1"
  publish_topics:
    - "onex.evt.omnimarket.install-request-owed-completed.v1"
    - "onex.evt.omnimarket.install-request-owed-failed.v1"

broker_acl_grants:
  - principal: "${ONEX_ACL_RUNTIME_PRINCIPAL}"
    grants:
      - {resource_type: TOPIC, pattern: LITERAL, name: onex.cmd.omnimarket.install-request-owed-requested.v1, operation: READ}
      - {resource_type: TOPIC, pattern: LITERAL, name: onex.cmd.omnimarket.install-request-owed-requested.v1, operation: DESCRIBE}
      - {resource_type: TOPIC, pattern: LITERAL, name: onex.evt.omnimarket.install-request-owed-completed.v1, operation: WRITE}
      - {resource_type: TOPIC, pattern: LITERAL, name: onex.evt.omnimarket.install-request-owed-completed.v1, operation: DESCRIBE}
      - {resource_type: TOPIC, pattern: LITERAL, name: onex.evt.omnimarket.install-request-owed-failed.v1, operation: WRITE}
      - {resource_type: TOPIC, pattern: LITERAL, name: onex.evt.omnimarket.install-request-owed-failed.v1, operation: DESCRIBE}

metadata:
  ticket: OMN-19998
  transport_type: inmemory
