# ONEX Node Contract - node_view_app_interface_effect (INSUFFICIENT scaffold)
#
# Declared by the view_seam_read graph as the emitter of VS-16 sender; it publishes the count and
# window-close topics once its step builds it. Until then its handler returns INSUFFICIENT.
name: node_view_app_interface_effect
contract_name: node_view_app_interface_effect
node_name: node_view_app_interface_effect
contract_version: {major: 1, minor: 0, patch: 0}
node_version: {major: 1, minor: 0, patch: 0}
node_type: EFFECT_GENERIC
lifecycle: experimental
runtime_profiles: []

description: >
  Scaffold of the publish effect's app interface. Returns a typed INSUFFICIENT result for any seam side it is asked to
  count, so the seam it serves reads unreadable until the step that builds it lands.

handler:
  module: omnimarket.nodes.node_view_app_interface_effect.handlers.handler_view_app_interface_effect
  class: HandlerViewAppInterfaceEffect
  input_model: omnimarket.models.seam_reading.model_seam_emitter.ModelSeamEmitterRequest

handler_routing:
  routing_strategy: operation_match
  default_handler: omnimarket.nodes.node_view_app_interface_effect.handlers.handler_view_app_interface_effect:HandlerViewAppInterfaceEffect
  handlers:
    - operation: emit_seam_count
      handler:
        name: HandlerViewAppInterfaceEffect
        module: omnimarket.nodes.node_view_app_interface_effect.handlers.handler_view_app_interface_effect

descriptor:
  node_archetype: effect
  purity: pure
  idempotent: true
  side_effects: []
  timeout_ms: 2000

event_bus:
  subscribe_topics: []
  publish_topics: []

# Declared producer of the seam family's count and window-close events (view_seam_read graph). The parity gate keeps event_bus.publish_topics for topics the node's Python publishes; this scaffold publishes none yet.
published_events:
  - topic: onex.evt.omnimarket.view-seam-counted.v1
    description: "Declared before the node emits it; the emission lands with the step that builds this emitter (status declared in the graph)."
  - topic: onex.evt.omnimarket.view-seam-window-closed.v1
    description: "Declared before the node emits it; the emission lands with the step that builds this emitter (status declared in the graph)."

metadata:
  ticket: OMN-22020
  transport_type: inmemory
