name: projection_delegation_disposition
version: "1.0.0"
description: "OMN-20242 tenant-scoped dispositions and usage by model, class and lane."
omnibase_core_compat: ">=0.39.0,<1.0.0"
capabilities:
  standalone: true
  full_runtime: true
  requires_network: true
  requires_secrets: true
  side_effect_class: write_db
dependencies:
  - "omnibase_core>=0.39.0"
  - "pyyaml>=6.0"
tags: [projection, delegation, disposition, reducer]
ownership:
  delegation_dispositions:
    ddl_owner: omnimarket.nodes.node_projection_delegation_disposition
    table_role: projection_read_model
    create_migration: "migrations/0000_create_delegation_dispositions.sql"
    duplicate_migration_policy: forbid_cross_repo_create_table
    non_owner_repos: [omnibase_infra]
    rationale: "omnimarket owns the projection; omnibase_infra applies its migrations."
pack: "data"
display_name: "Projection: Delegation Disposition"
node_role: "effect"
