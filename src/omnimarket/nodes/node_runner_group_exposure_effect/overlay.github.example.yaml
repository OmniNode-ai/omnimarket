# Synthetic values: the real-backend overlay (reads the GitHub REST API). The source mints a
# fresh GitHub App installation token once per read from the named secrets; set token_mint to
# null to read the environment variable named in token_env instead. No secret value is ever
# written here, only the NAME of a secret-store reference.
settings:
  public_reach_events: [pull_request_target, pull_request, issue_comment]
  max_age_seconds: 3600
source:
  backend: github
  api_base: http://192.0.2.10:8080
  org: example-org
  group_id: 7
  group_labels: [example-private-group]
  token_env: EXAMPLE_GROUP_READ_TOKEN
  # Set token_mint to null to read token_env instead.
  token_mint:
    org: example-org
    app_id_secret: EXAMPLE_APP_ID
    private_key_secret: EXAMPLE_APP_PRIVATE_KEY
    # Where the App id and key are read from. null reads the two names from the process environment;
    # a block reads them from that store folder with the machine identity file (names and addresses only).
    store:
      folder: /example
      secret_store:
        provider: infisical
        address: http://192.0.2.10:8880
        project_id: 00000000-0000-4000-8000-000000000000
        environment: dev
        plain_http_hosts: [192.0.2.10]
        root_folder: /
        identity_file: .omnibase/.env
        client_id_ref: EXAMPLE_CLIENT_ID
        client_secret_ref: EXAMPLE_CLIENT_SECRET
  # Set group_read to null to read the group directly with this source's token. With a block, the
  # group's settings and repositories are read through the GitHub write node over the bus instead.
  group_read:
    bus_lane: example-lane
    workspace_env: EXAMPLE_WORKSPACE_ROOT
    anchor_repository: example-org/example-repo
    requested_by_lane: example-exposure-reader
    timeout_seconds: 60
  # The NAME of the App permission the organization read of the group needs; a refusal names it.
  org_read_permission: example_org_permission_read
  max_calls: 40
  timeout_seconds: 10
