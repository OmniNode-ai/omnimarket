# Synthetic values: the real-backend overlay (reads the GitHub REST API). The token is read from
# the environment variable named in token_env; its value is never written here.
settings:
  public_reach_events: [pull_request_target, pull_request, issue_comment]
  max_age_seconds: 3600
source:
  backend: github
  github:
    api_base: http://192.0.2.10:8080
    org: example-org
    group_id: 7
    group_labels: [example-private-group]
    token_env: EXAMPLE_GROUP_READ_TOKEN
    max_calls: 40
    timeout_seconds: 10
