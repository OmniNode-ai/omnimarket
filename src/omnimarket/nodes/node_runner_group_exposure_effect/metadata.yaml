name: node_runner_group_exposure_effect
version: 1.0.0
description: Read one runner group (its org settings, the workflow files of its repositories and the jobs on it) from an in-memory fixture or the GitHub REST API, and ask node_runner_group_exposure_compute for the five-subject exposure reading.
pack: operator_tooling
node_role: effect
display_name: Runner Group Exposure Effect
omnibase_core_compat: '>=0.39.0,<1.0.0'
entry_points:
  onex.nodes:
    node_runner_group_exposure_effect: omnimarket.nodes.node_runner_group_exposure_effect
capabilities:
  standalone: true
  full_runtime: false
  requires_network: true
  requires_repo: false
