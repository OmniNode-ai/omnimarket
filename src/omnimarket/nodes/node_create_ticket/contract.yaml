---
name: node_create_ticket
contract_version: {major: 1, minor: 0, patch: 0}
node_type: compute
runtime_profiles: [main]
node_version: {major: 1, minor: 0, patch: 0}

description: >
  The one Linear ticket node (OMN-20595): create, read, comment, transition, clear_project and
  repair_project. A create is
  judged first by the installed omniclaude ticket-creation guard (OMN-17942) on
  the exact payload filed, Backlog with no project and the caller's description
  unchanged; with no guard found, or a refusal, nothing is created. A transition
  moves a ticket to a named workflow state through the adapter's update_issue,
  after the same guard judges the update payload. Read and comment go through the omnibase_infra Linear project-tracker adapter, with no
  stub fallback when the key is missing. Linear copies a parent's project onto a sub-issue
  created without one, and the Linear MCP cannot send a null project, so clear_project clears one
  ticket's project with a direct GraphQL issueUpdate(projectId: null) and reports success only
  when an independent readback shows an explicit null project; repair_project lists the
  lane-created tickets of one UTC day that sit in a named project and clears each after
  rechecking its creation day, label and project (OMN-21723). A create under a parent does the
  same clear.

handler_routing:
  routing_strategy: operation_match
  handlers:
    # HandlerCreateTicket routes create, read, comment and transition by the request's `operation`
    # field and hands clear_project and repair_project to HandlerTicketProject (OMN-21723).
    - operation: create_ticket
      handler:
        name: HandlerCreateTicket
        module: omnimarket.nodes.node_create_ticket.handlers.handler_create_ticket
    - operation: clear_project
      handler:
        name: HandlerTicketProject
        module: omnimarket.nodes.node_create_ticket.handlers.handler_ticket_project
    - operation: repair_project
      handler:
        name: HandlerTicketProject
        module: omnimarket.nodes.node_create_ticket.handlers.handler_ticket_project

handler:
  module: omnimarket.nodes.node_create_ticket.handlers.handler_create_ticket
  class: HandlerCreateTicket
  input_model: omnimarket.nodes.node_create_ticket.handlers.handler_create_ticket.ModelCreateTicketRequest

descriptor:
  node_archetype: compute
  purity: impure
  idempotent: true
  timeout_ms: 60000

inputs:
  operation:
    type: str
    description: "create (default), read, comment, transition, clear_project or repair_project"
    required: false
    default: "create"
    allowed_values: ["create", "read", "comment", "transition", "clear_project", "repair_project"]
  title:
    type: str
    description: "Ticket title (create)"
    required: false
  description:
    type: str
    description: "Ticket description (create), sent to Linear unchanged; the guard requires its Gate line and falsifiable criteria"
    required: false
  ticket_id:
    type: str
    description: "Ticket identifier, e.g. OMN-1234 (read, comment, transition, clear_project)"
    required: false
  body:
    type: str
    description: "Comment body (comment)"
    required: false
  state:
    type: str
    description: "Target workflow state name, e.g. Canceled (transition)"
    required: false
  repo:
    type: str
    description: "Repository label (e.g., omniclaude, omnibase_core)"
    required: false
  parent:
    type: str
    description: "Parent issue ID for epic relationship (e.g., OMN-1800)"
    required: false
  blocked_by:
    type: list[str]
    description: "Issue IDs that block this ticket"
    required: false
  dry_run:
    type: bool
    description: "Run the guard and validation, make no Linear write"
    required: false
    default: false
  project:
    type: str
    description: "REFUSED when non-empty: new tickets are created in the Backlog with no project (operator ruling 2026-09-30T14:30:05Z, OMN-17427)"
    required: false
  day:
    type: str
    description: "One UTC day, YYYY-MM-DD, whose lane-created tickets repair_project lists (repair_project)"
    required: false
  from_project:
    type: str
    description: "The project repair_project clears from the tickets it lists, e.g. Ready (repair_project)"
    required: false
  team:
    type: str
    description: "Linear team name (default: Omninode)"
    required: false
    default: "Omninode"
  pillar:
    type: str
    description: "Ticket pillar (dashboard, onboarding); assigns the pillar owner from omnibase_internal pillar_owners.yaml, else the creator (operator rulings 2026-09-30, OMN-17427)"
    required: false
  allow_arch_violation:
    type: bool
    description: "Bypass architecture dependency validation"
    required: false
    default: false

outputs:
  status:
    type: str
    description: "created | read | commented | transitioned | project_cleared | project_repaired | dry_run | error"
  project_cleared:
    type: bool
    description: "clear_project: the independent readback showed an explicit null project"
  cleared_ids:
    type: list[str]
    description: "repair_project: the tickets whose project was cleared and read back as null"
  candidate_ids:
    type: list[str]
    description: "repair_project: the tickets the listing found for the day, label and project"
  skipped:
    type: list[str]
    description: "repair_project: id and reason for each listed ticket the recheck refused"
  ticket_id:
    type: str
    description: "Created, read or commented Linear ticket ID (e.g., OMN-5957)"
  ticket_url:
    type: str
    description: "URL of the created ticket"
  contract_completeness:
    type: str
    description: "stub | enriched | full"

terminal_event: onex.evt.omnimarket.create-ticket-completed.v1

secrets:
  # Linear API key is contract-declared so the handler reads the ref name
  # from here — not a bare source literal. Value is resolved at the effect
  # boundary via the canonical secret-store resolver
  # (omnimarket.inference.secret_store_resolver), sourced from
  # ~/.omnibase/.env (LINEAR_API_KEY) or Infisical.
  LINEAR_API_KEY:
    description: "Linear API key for creating tickets via the GraphQL API."
    required: true

integrations:
  linear:
    graphql_url_ref: linear.graphql_url

event_bus:
  subscribe_topics:
    - onex.cmd.omnimarket.create-ticket-start.v1
  publish_topics:
    - onex.evt.omnimarket.create-ticket-completed.v1

metadata:
  transport_type: kafka

runtime_dispatch:
  invocation:
    mode: on_demand
    sender: operator via skill create_ticket, remote-lane
    reason: Census found only an on-demand entry capability, with no verified automatic sender; explicitly retain
      operator invocation.
    evidence: seam-census/2026-11-05T0716Z/skill or person only
  # OMN-18013 -- the CLI/skill dispatcher is this node's producer. Declared so it is not inferred from subscribe_topics[0].
  command_topic: onex.cmd.omnimarket.create-ticket-start.v1

# OMN-18013 -- explicit SINK declaration (contract topic graph closure).
# No node contract subscribes to these; they leave the ONEX node graph here.
externally_consumed_topics:
  - onex.evt.omnimarket.create-ticket-completed.v1
