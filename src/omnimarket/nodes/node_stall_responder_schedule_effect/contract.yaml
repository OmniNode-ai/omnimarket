---
# SPDX-FileCopyrightText: 2026 OmniNode.ai Inc.
# SPDX-License-Identifier: MIT
# ONEX Node Contract - Stall Responder Schedule Effect (OMN-26438)
#
# The producer of node_stall_responder_compute's command. The responder is pure and reads no ledger, so this node
# runs on the runtime tick, gates on its own overlay (run_interval_seconds, grace_seconds, window_seconds), reads the
# THROUGHPUT STALL rows of the window through the overlay's ledger route and returns the responder's request for the
# runtime to publish on the responder's command topic.
name: node_stall_responder_schedule_effect
contract_name: node_stall_responder_schedule_effect
node_name: node_stall_responder_schedule_effect
contract_version: {major: 0, minor: 1, patch: 0}
node_version: {major: 0, minor: 1, patch: 0}
node_type: effect
lifecycle: experimental
runtime_profiles: [effects]

description: >
  On the runtime tick, reads the throughput tick's THROUGHPUT STALL MSG rows for the overlay's look-back window and
  returns the stall responder's request. A ledger that cannot be read publishes nothing and retries on the next tick:
  an unread ledger is never an empty one.

handler:
  module: omnimarket.nodes.node_stall_responder_schedule_effect.handlers.handler_stall_responder_schedule
  class: HandlerStallResponderSchedule
  input_model: omnibase_infra.runtime.models.model_runtime_tick.ModelRuntimeTick

handler_routing:
  routing_strategy: operation_match
  handlers:
    - operation: stall_responder.scheduled_request
      handler:
        name: HandlerStallResponderSchedule
        module: omnimarket.nodes.node_stall_responder_schedule_effect.handlers.handler_stall_responder_schedule
      handler_module: omnimarket.nodes.node_stall_responder_schedule_effect.handlers.handler_stall_responder_schedule
      event_model: omnibase_infra.runtime.models.model_runtime_tick.ModelRuntimeTick
      event_type: platform.runtime-tick
      description: >
        Gate on the overlay run_interval_seconds, then read the stall rows of the overlay window and return the responder's request.

input_model:
  name: ModelRuntimeTick
  module: omnibase_infra.runtime.models.model_runtime_tick
  description: The runtime scheduler's tick.
output_model:
  name: ModelStallResponderRequest
  module: omnimarket.models.model_stall_cause
  description: "The stall responder's request: the window's THROUGHPUT STALL rows, published on its command topic."

descriptor:
  node_archetype: effect
  purity: effectful
  idempotent: true
  timeout_ms: 60000
  side_effects:
    - reads the THROUGHPUT STALL rows of the rolling work ledger through the overlay's route

input_subscriptions:
  - topic: "onex.intent.platform.runtime-tick.v1"
    operation: "stall_responder.scheduled_request"

terminal_event: onex.cmd.omnimarket.stall-responder-requested.v1

event_bus:
  subscribe_topics:
    - "onex.intent.platform.runtime-tick.v1"
  publish_topics:
    - "onex.cmd.omnimarket.stall-responder-requested.v1"

published_events:
  - event_type: ModelStallResponderRequest
    topic: onex.cmd.omnimarket.stall-responder-requested.v1
    description: "One stall responder request per due tick, carrying the window's stall rows."

# Where the schedule reads its settings. The overlays are found under ONEX_SKILL_OVERLAY_ROOTS or the file the env var names.
runtime:
  schedule_overlay: {overlay_id: node_stall_responder_schedule_effect, model: omnimarket.nodes.node_stall_responder_schedule_effect.models.model_stall_responder_schedule_overlay.ModelStallResponderScheduleOverlay}

broker_acl_grants:
  - principal: "${ONEX_ACL_RUNTIME_PRINCIPAL}"
    grants:
      - {resource_type: TOPIC, pattern: LITERAL, name: onex.cmd.omnimarket.stall-responder-requested.v1, operation: WRITE}
      - {resource_type: TOPIC, pattern: LITERAL, name: onex.cmd.omnimarket.stall-responder-requested.v1, operation: DESCRIBE}
      - {resource_type: TOPIC, pattern: LITERAL, name: onex.intent.platform.runtime-tick.v1, operation: READ}
      - {resource_type: TOPIC, pattern: LITERAL, name: onex.intent.platform.runtime-tick.v1, operation: DESCRIBE}

metadata:
  ticket: OMN-26438
  transport_type: kafka
