# Synthetic values only. A deployment overlay is found at <root>/node_stall_responder_schedule_effect/overlay.yaml
# under a root named in ONEX_SKILL_OVERLAY_ROOTS.
job_id: stall_responder
# The throughput tick runs every 600 s; the responder reads its rows on the same cadence.
run_interval_seconds: 600
grace_seconds: 300
# The look-back each run reads (the responder's own redispatch window is 24 hours).
window_seconds: 86400
ledger_read:
  route: command
  command_env: ONEX_LEDGER_BUS_READ_COMMAND
  timeout_seconds: 60
  row_limit: 5000
