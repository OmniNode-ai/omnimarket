# ONEX Node Contract - OCC State Effect (RSD-2, OMN-14619)
#
# The read-EFFECT half of the read -> compute -> write OCC-companion producer
# cycle (docs/plans/2026-07-10-occ-autogen-mechanization-design.md). Gathers
# every machine-observed PR + OCC fact the pure COMPUTE node
# (node_occ_companion_compute, RSD-1, OMN-14285) needs, and assembles the exact
# ModelOccCompanionRequest it consumes. Read-only: never clones, writes, or
# pushes to any GitHub surface. RSD-3 (the write-EFFECT + trigger/orchestrator
# that makes this the live producer) is a distinct follow-up ticket — this node
# is deliberately standalone so it can be proven against real PRs first.
#
# Related Tickets:
#   - OMN-14619: RSD-2 read-EFFECT + honest content-read check_value
#   - OMN-14285: RSD-1 (node_occ_companion_compute, the COMPUTE consumer)
#   - OMN-14393: RSD-5 fail-closed attestation gate (blocked on RSD-2/3)
name: "node_occ_state_effect"
lifecycle: experimental
node_type: "EFFECT_GENERIC"
runtime_profiles: [effects]
contract_version:
  major: 1
  minor: 0
  patch: 0
node_version: "1.0.0"
description: "Read-only EFFECT: gathers live PR + OCC state via GitHub REST and assembles the ModelOccCompanionRequest the OCC companion COMPUTE node consumes."
input_model:
  name: "ModelOccStateRequest"
  module: "omnimarket.nodes.node_occ_state_effect.models.model_occ_state_request"
  description: "Identifies the product PR (and OCC repo) to gather companion state for."
output_model:
  name: "ModelOccCompanionRequest"
  module: "omnimarket.events.occ_companion"
  description: "All PR + OCC state the COMPUTE node needs, gathered up front."
handler_routing:
  routing_strategy: "operation_match"
  handlers:
    - operation: "gather_occ_companion_state"
      handler:
        name: "HandlerOccStateEffect"
        module: "omnimarket.nodes.node_occ_state_effect.handlers.handler_occ_state_effect"

runtime_dispatch:
  command_topic: "onex.cmd.omnimarket.occ-state-effect-requested.v1"
  terminal_events:
    success: "onex.evt.omnimarket.occ-state-effect-completed.v1"
    failure: "onex.evt.omnimarket.occ-state-effect-failed.v1"

event_bus:
  subscribe_topics:
    - "onex.cmd.omnimarket.occ-state-effect-requested.v1"
  publish_topics:
    - "onex.evt.omnimarket.occ-state-effect-completed.v1"
    - "onex.evt.omnimarket.occ-state-effect-failed.v1"
  dlq_topics:
    - "onex.dlq.omnimarket.occ-state-effect.v1"

terminal_event: "onex.evt.omnimarket.occ-state-effect-completed.v1"
secrets:
  # OMN-12856 pattern: GitHub token is contract-declared so the handler reads
  # the ref name from here — not a bare source literal. Resolved at the effect
  # boundary via the canonical secret-store resolver (occ_companion_emitter's
  # env_var_fallback pattern, OMN-14452).
  GITHUB_TOKEN:
    description: "GitHub PAT or Actions token for REST API reads (PR facts, diff files, OCC contract state)."
    required: true

side_effects:
  reads:
    - github_api
  writes: []
  duplicate_handling: idempotent

descriptor:
  node_archetype: effect
  purity: effectful
  runtime_profiles: [effects]
  idempotent: true
  timeout_ms: 60000

metadata:
  transport_type: kafka
  description: "OCC companion state read-EFFECT — gathers live PR + OCC facts, zero mutation"
  author: "OmniNode Team"
  created: "2026-07-14"
  tags:
    - "effect"
    - "occ"
    - "companion"
    - "read-only"
    - "OMN-14619"
  related_tickets:
    - "OMN-14619"
    - "OMN-14285"
    - "OMN-14393"
