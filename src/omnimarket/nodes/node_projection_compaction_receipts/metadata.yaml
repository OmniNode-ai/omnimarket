name: projection_compaction_receipts
version: "1.0.0"
description: "One durable install verdict per captured compaction boundary."
omnibase_core_compat: ">=0.39.0,<1.0.0"
capabilities:
  standalone: true
  full_runtime: true
  requires_network: true
  requires_secrets: true
  side_effect_class: write_db
dependencies:
  - "omnibase_core>=0.39.0"
  - "pyyaml>=6.0"
  - "pydantic>=2.0"
tags: [projection, context-compaction, install-confirm, reducer]
ownership:
  compaction_receipts:
    ddl_owner: omnimarket.nodes.node_projection_compaction_receipts
    table_role: projection_read_model
    create_migration: "migrations/0000_create_compaction_receipts.sql"
    duplicate_migration_policy: forbid_cross_repo_create_table
    non_owner_repos: [omnibase_infra]
    rationale: "Omnimarket owns the read model; infrastructure vendors its migrations."
pack: "data"
display_name: "Projection: Compaction Receipts"
node_role: "effect"
