  seeded draws and reproducible replay bundle files. Filesystem I/O is owned by
  node_transcript_manifest_effect.
omnibase_core_compat: '>=0.39.0,<1.0.0'
pack: core
node_role: compute
display_name: Context Compaction Manifest Compute
entry_points:
  onex.nodes:
    node_context_compaction_manifest_compute: omnimarket.nodes.node_context_compaction_manifest_compute
capabilities:
  standalone: true
  full_runtime: true
  requires_network: false
  requires_repo: false
  requires_secrets: false
  requires_docker: false
  side_effect_class: read_only
dependencies:
- omnibase_core>=0.39.0
license: MIT
tags:
- compute
- context
- compaction
- replay
