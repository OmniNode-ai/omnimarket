# ONEX Node Contract - Review Response Parser Compute (OMN-13210 / B1)
#
# Pure COMPUTE: normalizes one model's raw review response into ModelReviewFinding
# instances. Wraps the A1-rehomed omnimarket.review.response_parser primitive.
---
name: node_review_response_parser_compute
contract_version: {major: 1, minor: 0, patch: 0}
node_type: compute
node_version: {major: 1, minor: 0, patch: 0}

description: >
  Pure COMPUTE: tolerant-parses one model's raw review response (JSON array,
  markdown-fenced JSON, legacy {findings: [...]}, or bracket extraction) into
  normalized ModelReviewFinding instances. No I/O; deterministic.

input_model:
  name: ModelReviewResponseParserRequest
  module: omnimarket.nodes.node_review_response_parser_compute.models.model_review_response_parser
  description: "Raw model response text + source model route key."

output_model:
  name: ModelParseResult
  module: omnimarket.review.response_parser
  description: "Parse status + normalized findings list."

handler:
  module: omnimarket.nodes.node_review_response_parser_compute.handlers.handler_response_parser_compute
  class: HandlerResponseParserCompute
  input_model: omnimarket.nodes.node_review_response_parser_compute.models.model_review_response_parser.ModelReviewResponseParserRequest

handler_routing:
  routing_strategy: operation_match
  handlers:
    - handler:
        name: HandlerResponseParserCompute
        module: omnimarket.nodes.node_review_response_parser_compute.handlers.handler_response_parser_compute

descriptor:
  node_archetype: compute
  purity: pure
  idempotent: true
  timeout_ms: 5000
  runtime_profiles:
    - effects

runtime_dispatch:
  command_topic: onex.cmd.omnimarket.review-response-parse.v1
  terminal_events:
    success: onex.evt.omnimarket.review-response-parsed.v1
    failure: onex.evt.omnimarket.review-response-parse-failed.v1

event_bus:
  subscribe_topics:
    - onex.cmd.omnimarket.review-response-parse.v1
  publish_topics:
    - onex.evt.omnimarket.review-response-parsed.v1
    - onex.evt.omnimarket.review-response-parse-failed.v1

terminal_event: onex.evt.omnimarket.review-response-parsed.v1

dependencies:
  packages:
    - "omnibase_core>=0.39.0"

metadata:
  transport_type: kafka
  description: "Review response parser compute node"
  author: "OmniNode Team"
  tags:
    - "compute"
    - "review"
    - "parse"
    - "findings"
  related_tickets:
    - "OMN-13210"
    - "OMN-13205"
