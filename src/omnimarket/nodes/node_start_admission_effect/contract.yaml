# ONEX Node Contract - Start Admission Effect (OMN-23055, step 0 row 4)
#
# The one admission effect of rebuild plan sections 6.3 and 7.5, on one gate store. A start path calls
# it at its last step before an engine, session or provisioning call: admit reserves, start consumes
# (single use). A path is in observe (log what would be refused, admit) or enforce (refuse) by the
# start_admission overlay; a store with no answer admits, logged. It starts nothing and stops nothing.
# Nothing calls it from a live start path until the start-path refusal drill has passed there.
name: node_start_admission_effect
contract_name: node_start_admission_effect
node_name: node_start_admission_effect
contract_version: {major: 0, minor: 1, patch: 0}
node_version: {major: 0, minor: 1, patch: 0}
node_type: effect
lifecycle: experimental
runtime_profiles: [effects]

description: >
  admit takes a reservation on the gate store for a start (piece, start id, path); start consumes
  it. The store's own compare decides: over the limit, a stopped piece, an unknown piece, a start
  that never reserved (a bypass), an expired or already consumed reservation. In enforce the path is
  told it is refused; in observe it is admitted and the log keeps what would have been refused. A
  store that gives no answer admits and says so. Every decision is logged.

handler:
  module: omnimarket.nodes.node_start_admission_effect.handlers.handler_start_admission
  class: HandlerStartAdmission
  input_model: omnimarket.models.model_start_admission.ModelStartAdmissionRequest

# Not a runtime-dispatched handler: HandlerStartAdmission takes the gate store, the policy and the log
# as constructor parameters, so the bus edge is answer_command.

descriptor:
  node_archetype: effect
  runtime_profiles: [effects]
  purity: impure
  idempotent: true
  side_effects: [gate-store-write, admission-log-append]
  timeout_ms: 30000

input_model:
  name: ModelStartAdmissionRequest
  module: omnimarket.models.model_start_admission
  description: One call from a start path, with its path, start id and piece.
output_model:
  name: ModelStartAdmissionResult
  module: omnimarket.models.model_start_admission
  description: The decision told to the path and whether the store would have refused it.

terminal_event: onex.evt.omnimarket.start-admission-decided.v1

runtime_dispatch:
  external_trigger: true

topics:
  admission_requested: onex.cmd.omnimarket.start-admission-requested.v1
  admission_decided: onex.evt.omnimarket.start-admission-decided.v1
  admission_failed: onex.evt.omnimarket.start-admission-failed.v1

event_bus:
  subscribe_topics: []
  publish_topics: []

externally_consumed_topics:
  - onex.evt.omnimarket.start-admission-decided.v1
  - onex.evt.omnimarket.start-admission-failed.v1

overlay:
  node: start_admission
  roots_env: ONEX_SKILL_OVERLAY_ROOTS

metadata:
  ticket: OMN-23055
  transport_type: inmemory
