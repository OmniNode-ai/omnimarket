name: overlay_store_read_effect
version: "1.0.0"
description: "The one reader of loaded overlays: the store through its protocol and a stamped local snapshot that answers with the broker and the database down."
omnibase_core_compat: ">=0.39.0,<1.0.0"
entry_points:
  onex.nodes:
    node_overlay_store_read_effect: omnimarket.nodes.node_overlay_store_read_effect
capabilities:
  standalone: true
  full_runtime: false
  requires_network: true
  requires_repo: false
  requires_secrets: true
  requires_docker: false
  side_effect_class: write
dependencies:
  - "omnibase_core>=0.39.0"
  - "omnibase_spi>=0.23.14"
  - "pyyaml>=6.0"
  - "pydantic>=2.0"
tags: [effect, overlay, configuration]
pack: "data"
display_name: "Effect: Overlay Store Reader"
node_role: "effect"
