---
name: tenant_cli_effect
contract_name: node_tenant_cli_effect
node_name: node_tenant_cli_effect
contract_version: {major: 1, minor: 0, patch: 0}
node_version: {major: 1, minor: 0, patch: 0}
description: >
  The operator's command surface for tenants and their gateway keys. HandlerTenantCreate and HandlerTenantShow publish the
  tenant provision and tenant read commands of node_tenant_provision_effect; HandlerTenantKeyMint makes a gateway key in the
  caller's process, publishes the register command of node_tenant_api_key_effect with the key's sha256 digest only (and, on
  request in the dev lane, writes the key create-only to the dev secret store); HandlerTenantKeyRevoke publishes its revoke
  command. Each command's topic pair is read from the contract of the node that serves it, and the node's typed outcome is
  what the command prints. Provides `onex tenant create | show | key mint | key revoke`. No handler holds a database
  connection.
node_type: effect
lifecycle: experimental
input_model:
  name: ModelTenantKeyMintRequest
  module: omnimarket.nodes.node_tenant_cli_effect.models.model_tenant_cli
output_model:
  name: ModelTenantCliResult
  module: omnimarket.nodes.node_tenant_cli_effect.models.model_tenant_cli

handler:
  name: HandlerTenantKeyMint
  module: omnimarket.nodes.node_tenant_cli_effect.handlers.handler_tenant_key_mint
  class: HandlerTenantKeyMint
  input_model: omnimarket.nodes.node_tenant_cli_effect.models.model_tenant_cli.ModelTenantKeyMintRequest
  output_model: omnimarket.nodes.node_tenant_cli_effect.models.model_tenant_cli.ModelTenantCliResult

dependencies:
  - name: ProtocolTenantDispatch
    dependency_type: protocol
    description: The bus caller the handlers publish each command through and read its answer from, built by the command line over the lane the serving node's overlay declares
    required: true
  - name: ProtocolGatewayKeyOverlays
    dependency_type: protocol
    description: The gateway overlay's key prefix and the key node overlay's lane and dev secret store environment
    required: true
  - name: ProtocolDevSecretStore
    dependency_type: protocol
    description: The dev secret store's gateway_key folder, written create-only in process
    required: true

descriptor:
  node_archetype: effect
  purity: effectful
  runtime_profiles: []
  idempotent: false
  # The wait for one node answer, in milliseconds; `onex tenant --wait-seconds` overrides it.
  timeout_ms: 30000

# The command line builds the handlers in process, so the runtime dispatches none; the entries below bind each handler to
# this contract by its operation.
handler_routing:
  routing_strategy: operation_match
  default_handler: omnimarket.nodes.node_tenant_cli_effect.handlers.handler_tenant_create:HandlerTenantCreate
  handlers:
    - operation: tenant_key_mint
      handler:
        name: HandlerTenantKeyMint
        module: omnimarket.nodes.node_tenant_cli_effect.handlers.handler_tenant_key_mint
    - operation: tenant_show
      handler:
        name: HandlerTenantShow
        module: omnimarket.nodes.node_tenant_cli_effect.handlers.handler_tenant_show
    - operation: tenant_key_revoke
      handler:
        name: HandlerTenantKeyRevoke
        module: omnimarket.nodes.node_tenant_cli_effect.handlers.handler_tenant_key_revoke

# The command topics belong to the nodes that serve them (node_tenant_provision_effect, node_tenant_api_key_effect); this
# node declares none of its own, and its handlers read each pair from the serving node's contract.
event_bus:
  subscribe_topics: []
  publish_topics: []
runtime_dispatch:
  external_trigger: An operator runs onex tenant create, show, key mint or key revoke by hand; nothing on the bus starts this node.
  on_demand:
    command: onex tenant create | show | key mint | key revoke, which build the handlers in process and print their typed results
    owner: OmniNode Platform Team
metadata:
  transport_type: local
