name: node_tenant_cli_effect
version: 1.0.0
description: 'Provides onex tenant create, show, key mint and key revoke: each publishes the serving node''s command on the event bus and prints its typed answer; holds no database connection.'
omnibase_core_compat: '>=0.39.0,<1.0.0'
entry_points:
  onex.nodes:
    node_tenant_cli_effect: omnimarket.nodes.node_tenant_cli_effect
capabilities:
  standalone: true
  full_runtime: false
  requires_network: true
  requires_repo: false
  requires_secrets: true
  requires_docker: false
  side_effect_class: external_effect
dependencies:
- omnibase_core>=0.39.0
- click>=8.1.0
- pydantic>=2.0
- pyyaml>=6.0
- omnibase-infra>=0.38.3,<0.39.0
authors:
- OmniNode Platform Team
license: MIT
tags:
- tenant
- gateway-key
- cli
pack: data
display_name: Tenant CLI
node_role: effect
