# ONEX Node Contract
# Node: NodeClaudeCodeHookAdapterEffect (OMN-18531, plan task T0.3)
#
# The one edge behaviour behind every generated Claude Code binding. Handler: build the
# typed command named by a client_bindings row from the hook input, publish it through
# the receipt-mode client (hosting no handler), await the named events, call the pure
# verdict compute and return client_verdict with the hook's own output shape. The
# console entry point onex-claude-code-hook (pyproject.toml) reads one hook JSON document
# from stdin and writes exactly that shape to stdout, never a ModelSkillResult wrapper.
#
# client_bindings.claude_code is the inventory of binding hooks: the hook-inventory gate
# reads it, node_claude_code_binding_render_compute renders it, and the install effect
# writes the rendered module (replacing rows) or user-settings command hooks (additive
# rows). Each binding ticket (delegation, compaction, additive profiles) adds its own row
# beside the probe rows it depends on.

name: node_claude_code_hook_adapter_effect
version: "1.0.0"
contract_name: node_claude_code_hook_adapter_effect
node_name: node_claude_code_hook_adapter_effect

contract_version:
  major: 1
  minor: 0
  patch: 0

node_version:
  major: 1
  minor: 0
  patch: 0

node_type: EFFECT_GENERIC

description: >
  Generic edge adapter for Claude Code hook bindings. Builds the typed command a
  binding names from the hook input only, publishes it through the receipt-mode
  client, awaits the correlated events (reassembling chunked replies by content-record
  id and checking their sha256 against the echoed hash), and returns a typed
  client_verdict mapped by table lookup to the hook's output shape.
  The adapter mints an invocation_id per invocation, carried on the command through
  the @invocation_id argument source, and the context_compaction_verdict compute
  installs a compaction reply only when its echoed invocation_id is the adapter's
  own and its messages hash to the echoed installed_messages_hash.

input_model:
  name: ModelHookAdapterRequest
  module: omnimarket.nodes.node_claude_code_hook_adapter_effect.models

output_model:
  name: ModelHookAdapterResult
  module: omnimarket.nodes.node_claude_code_hook_adapter_effect.models

handler:
  module: omnimarket.nodes.node_claude_code_hook_adapter_effect.handlers.handler_claude_code_hook_adapter
  class: HandlerClaudeCodeHookAdapter
  input_model: omnimarket.nodes.node_claude_code_hook_adapter_effect.models.ModelHookAdapterRequest

handler_routing:
  routing_strategy: payload_type_match
  handlers:
    - handler:
        name: HandlerClaudeCodeHookAdapter
        module: omnimarket.nodes.node_claude_code_hook_adapter_effect.handlers.handler_claude_code_hook_adapter
      event_model:
        name: ModelHookAdapterRequest
        module: omnimarket.nodes.node_claude_code_hook_adapter_effect.models

descriptor:
  node_archetype: effect
  purity: effectful
  idempotent: false
  timeout_ms: 30000
  runtime_profiles: [effects]

capabilities:
  - name: hook.claude_code.adapt
    description: Adapt one Claude Code hook call to a typed command and back to the hook's output shape
    version: 1.0.0
  - name: hook.claude_code.additive_inject
    description: >
      Answer an additive row (session_start, agent_spawn, per_prompt) with the package its
      profile builds, within the row's latency_budget_ms, or with nothing and one journalled
      miss record (OMN-22016)
    version: 1.0.0
  - name: hook.claude_code.compaction_latency_run
    description: >
      Drive the adapter over recorded PreCompact hook inputs, cold and warm, and record each
      round trip's wall time and the prepared receipt's phase split for the TA.12 latency
      qualification. Replay carries the recorded input hash, barrier, newest turn and
      compact model, validates the compaction command before publishing, and refuses
      a native verdict even if a prepared receipt has timings
      (python -m omnimarket.nodes.node_claude_code_hook_adapter_effect.runtime_compaction_latency_cli)
    version: 1.0.0

entry_point:
  console_script: onex-claude-code-hook
  module: omnimarket.nodes.node_claude_code_hook_adapter_effect.runtime_claude_code_hook_cli
  function: main
  stdin: one hook JSON document
  stdout: only the hook's output shape ({result}, {deny}, {messages}, hookSpecificOutput.additionalContext, or nothing)

event_bus:
  subscribe_topics:
    - onex.cmd.omnimarket.claude-code-hook-adapt.v1
  publish_topics:
    - onex.evt.omnimarket.claude-code-hook-adapted.v1

runtime_dispatch:
  invocation:
    mode: on_demand
    sender: operator via onex node node_claude_code_hook_adapter_effect
    reason: Census found only an on-demand entry capability, with no verified automatic sender; explicitly retain
      operator invocation.
    evidence: seam-census/2026-11-05T0716Z/skill or person only
  command_topic: onex.cmd.omnimarket.claude-code-hook-adapt.v1
  terminal_events:
    success: onex.evt.omnimarket.claude-code-hook-adapted.v1

terminal_event: onex.evt.omnimarket.claude-code-hook-adapted.v1

# The miss record of an additive call that wanted a package and injected nothing (OMN-22016):
# the profile, the reason and the elapsed time, never package text. The adapter journals it in
# the hook emit journal under the event type additive.miss, which the emit registry declares
# node-owned because this node, not a hook script, writes it.
published_events:
  - event_type: AdditivePackMissed
    topic: onex.evt.omnimarket.additive-pack-missed.v1
    description: "One additive call that injected nothing for want of a package: profile, reason (timeout, unavailable, unverified, over_cap) and elapsed_ms."

# The drainer delivers the miss record to the projection and dashboards outside this repository.
externally_consumed_topics:
  - onex.evt.omnimarket.additive-pack-missed.v1

client_bindings:
  claude_code:
    default_max_mode: observe
    host_max_modes: {}
    # /compact, manual trigger only (OMN-21335, plan task TA.15b). The auto trigger has no row:
    # the render refuses any session.compact row whose trigger is not "manual".
    bindings:
      - name: compaction
        arm: 'on'
        kind: replacing
        hook_event: session.compact
        matcher_tool: manual
        command_topic: onex.cmd.omniintelligence.context-compaction-requested.v1
        command_type: context_compaction_requested
        arguments:
          - {name: invocation_id, source: "@invocation_id"}
          - {name: session_id, source: "$.session_id"}
          - {name: cwd, source: "$.cwd"}
          - {name: trigger, source: "$.trigger"}
          - {name: input_messages_hash, source: "@input_messages_hash"}
          - {name: newest_turn, source: "$.newest_turn"}
          - {name: barrier_id, source: "@session_barrier"}
          - {name: compact_model, source: "$.compact_model"}
          # The reply topics are PER PRINCIPAL (OMN-22103): `{principal}` is replaced with the
          # requester's principal at call time, and the command names the three resolved topics
          # (`@awaited_event:<n>` is the n-th awaited event after that substitution) so the
          # orchestrator replies to exactly the topics this binding awaits. The templates are
          # declared in parts in node_context_compaction_orchestrator/contract.yaml.
          - {name: reply_topic_package, source: "@awaited_event:0"}
          - {name: reply_topic_prepared, source: "@awaited_event:1"}
          - {name: reply_topic_fallback, source: "@awaited_event:2"}
        # Declared in parts (as node_context_compaction_orchestrator does) because a
        # `{principal}` slot inside a full topic string fails the topic-name lint; the loader
        # renders them to onex.<kind>.<producer>.<name_prefix>{principal}.v<version>.
        awaited_event_parts:
          - {kind: cmd, producer: omniintelligence, name_prefix: "context-compaction-package-for-", version: 1}
          - {kind: evt, producer: omnimarket, name_prefix: "context-compaction-prepared-for-", version: 1}
          - {kind: evt, producer: omnimarket, name_prefix: "context-compaction-fallback-for-", version: 1}
        verdict_compute: context_compaction_verdict
        deadline_ms: 30000
        probe_rows: [P0, P6, P11a, P13, P14]
        deny_text: compaction unavailable

      # Additive rows (OMN-22016, plan task TC.11): installed into user settings as
      # `onex-claude-code-hook --binding <name>`, on a lab host's session only until promotion.
      # Each waits on the lab bus for its package no longer than latency_budget_ms (the cap of
      # its profile, decision D8) and prints nothing, with one journalled miss record, when the
      # package does not arrive. The orchestrator's enabled_additive_profiles list ships empty,
      # so every call is answered none; per_prompt cannot be listed before TC.13.
      # session_start acts only in a session started inside the workspace registry or an
      # internal-library clone (decision D7).
      - name: session_start
        kind: additive
        hook_event: SessionStart
        profile: session_start
        latency_budget_ms: 5000
        start_scope: workspace
        command_topic: onex.cmd.omniintelligence.context-pack-requested.v1
        command_type: context_pack_requested
        arguments:
          - {name: profile_name, source: "@profile"}
          - {name: binding_kind, source: "@binding_kind"}
          - {name: invocation_id, source: "@invocation_id"}
          - {name: session_id, source: "$.session_id"}
        awaited_events:
          - onex.cmd.omniintelligence.context-pack-built.v1
          - onex.cmd.omniintelligence.context-pack-failed.v1
        verdict_compute: client_verdict
        deadline_ms: 5000
        unverified_action: none
        probe_rows: [P16, P19]

      - name: agent_spawn
        kind: additive
        hook_event: SubagentStart
        profile: agent_spawn
        latency_budget_ms: 3000
        start_scope: any
        command_topic: onex.cmd.omniintelligence.context-pack-requested.v1
        command_type: context_pack_requested
        arguments:
          - {name: profile_name, source: "@profile"}
          - {name: binding_kind, source: "@binding_kind"}
          - {name: invocation_id, source: "@invocation_id"}
          - {name: session_id, source: "$.session_id"}
        awaited_events:
          - onex.cmd.omniintelligence.context-pack-built.v1
          - onex.cmd.omniintelligence.context-pack-failed.v1
        verdict_compute: client_verdict
        deadline_ms: 3000
        unverified_action: none
        probe_rows: [P17, P19]

      - name: per_prompt
        kind: additive
        hook_event: UserPromptSubmit
        profile: per_prompt
        latency_budget_ms: 500
        start_scope: any
        command_topic: onex.cmd.omniintelligence.context-pack-requested.v1
        command_type: context_pack_requested
        arguments:
          - {name: profile_name, source: "@profile"}
          - {name: binding_kind, source: "@binding_kind"}
          - {name: invocation_id, source: "@invocation_id"}
          - {name: session_id, source: "$.session_id"}
        awaited_events:
          - onex.cmd.omniintelligence.context-pack-built.v1
          - onex.cmd.omniintelligence.context-pack-failed.v1
        verdict_compute: client_verdict
        deadline_ms: 500
        unverified_action: none
        probe_rows: [P18, P19]

metadata:
  author: OmniNode Team
  license: MIT
  ticket: OMN-18531
  maturity: alpha
  tags:
    - effect
    - hooks
    - claude-code
    - adapter
