name: projection_topic_activity
version: "1.0.0"
description: "Bus-backed current message counts, rates, and newest-event age per broker topic."
omnibase_core_compat: ">=0.39.0,<1.0.0"
capabilities:
  standalone: true
  full_runtime: true
  requires_network: true
  requires_secrets: true
  side_effect_class: write_db
dependencies:
  - "omnibase_core>=0.39.0"
  - "pyyaml>=6.0"
tags: [projection, observability, kafka, topic-activity, reducer]
ownership:
  topic_activity:
    ddl_owner: omnimarket.nodes.node_projection_topic_activity
    table_role: projection_read_model
    create_migration: "migrations/0000_create_topic_activity.sql"
    duplicate_migration_policy: forbid_cross_repo_create_table
    non_owner_repos:
      - omnibase_infra
    rationale: >
      Omnimarket owns the fold and read model. Omnibase-infra vendors the
      migrations solely so its forward migration runner can deploy them.
pack: "data"
display_name: "Projection: Topic Activity"
node_role: "effect"
