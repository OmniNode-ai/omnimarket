name: node_standup_retrospective_compute
lifecycle: experimental
node_type: COMPUTE_GENERIC
runtime_profiles: [main]
contract_version:
  major: 1
  minor: 0
  patch: 0
node_version: 1.0.0
description: Build the Friday stand-up retrospective (OMN-21286, RULING 2026-10-20T13:51:27Z, held at
  the end of the Friday stand-up by RULING 2026-10-20T13:58:45Z). When the window ends on a Friday (UTC)
  it reads the text of a JSON list of role, product use, one idea or friction and one process change, emits one row
  per person and one unfiled Backlog ticket draft per contributed idea or friction, credited by role.
  Only those fields are read, so a name an entry carries never reaches the sheet. Also owns the text rendering
  of the section.
input_model:
  name: ModelStandupRetrospectiveRequest
  module: omnimarket.nodes.node_standup_retrospective_compute.models.model_standup_retrospective
  description: Typed input for standup retrospective compute.
output_model:
  name: ModelStandupRetrospectiveResult
  module: omnimarket.nodes.node_standup_retrospective_compute.models.model_standup_retrospective
  description: Typed output for standup retrospective compute.
handler:
  module: omnimarket.nodes.node_standup_retrospective_compute.handlers.handler_standup_retrospective
  class: HandlerStandupRetrospective
  input_model: omnimarket.nodes.node_standup_retrospective_compute.models.model_standup_retrospective.ModelStandupRetrospectiveRequest
  output_model: omnimarket.nodes.node_standup_retrospective_compute.models.model_standup_retrospective.ModelStandupRetrospectiveResult
handler_routing:
  routing_strategy: operation_match
  default_handler: omnimarket.nodes.node_standup_retrospective_compute.handlers.handler_standup_retrospective:HandlerStandupRetrospective
  handlers:
  - operation: handle
    topic: onex.cmd.omnimarket.standup-retrospective-requested.v1
    handler:
      name: HandlerStandupRetrospective
      module: omnimarket.nodes.node_standup_retrospective_compute.handlers.handler_standup_retrospective
event_bus:
  subscribe_topics:
  - onex.cmd.omnimarket.standup-retrospective-requested.v1
  publish_topics:
  - onex.evt.omnimarket.standup-retrospective-built.v1
runtime_dispatch:
  command_topic: onex.cmd.omnimarket.standup-retrospective-requested.v1
  external_trigger: A command record on the command topic, or the run envelope onex node node_standup_retrospective_compute with the request as input.
terminal_event: onex.evt.omnimarket.standup-retrospective-built.v1
externally_consumed_topics:
- onex.evt.omnimarket.standup-retrospective-built.v1
descriptor:
  node_archetype: compute
  purity: pure
  runtime_profiles: [main]
  idempotent: true
  timeout_ms: 5000
replay:
  requires_validator_version: true
  timestamp_authority: ingest_sequence
  deterministic: true
metadata:
  transport_type: inmemory
  description: Standup Retrospective Compute over its command topic or local Python invocation.
  author: OmniNode Team
  created: '2026-10-24'
  tags:
  - compute
  - standup-retrospective-compute
  related_tickets: []
config:
  standup_retrospective:
    transport: in_memory
    retro_weekday: 4
    role_vocabulary:
    - operator
    - platform engineer
    - product designer
    - product manager
    - engineer
    - designer
    role_key: role
    product_use_key: product_use
    idea_key: idea
    friction_key: friction
    process_change_key: process_change
    idea_kind: idea
    friction_kind: friction
    draft_state: Backlog
    draft_title_max_chars: 120
    credit_template: "{role}"
    draft_description_template: "{text}\n\nContributed at the Friday retrospective ending {until}, credited to the {credit}."
    messages:
      error_prefix: "retrospective: "
      not_a_retro_day_note: "not a Friday: no retrospective section"
      no_input_note: "Friday: no retrospective input (--retro); the section is empty"
      not_a_list_detail: "input is not a JSON list of entries"
      no_role_detail: "entry {number} has no role; skipped"
      unknown_role_detail: "entry {number} role is not in the role vocabulary; skipped"
      unparsable_detail: "unparsable input"
    labels:
      section_heading: "retrospective ({count}):"
      drafts_heading: "ticket drafts ({count}, not filed):"
      person_line: "  {role}: {parts}"
      part_separator: "; "
      use_part: "use: {text}"
      detail_part: "{kind}: {text}"
      change_part: "process change: {text}"
      default_kind_label: "idea or friction"
      not_reported: "not reported"
      draft_line: "  [{state}] {title} (credit: {credit})"
