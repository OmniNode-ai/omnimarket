# The settings of node_test_selection_selector_compute (OMN-23296). No value is set in code.
#
#   target_shard_seconds    estimated test seconds one shard of a narrowed selection carries: the full
#                           suite's own per-shard share, the recorded suite total in
#                           config/test_file_durations.json over full_split_count. A policy test reads the
#                           durations file and fails when target_shard_seconds * full_split_count differs
#                           from that total by more than record_tolerance_ratio, so the figure follows the
#                           record and is not typed from memory.
#   max_narrowed_shards     most shards a narrowed selection may take. The shard count is
#                           ceil(estimated seconds / target_shard_seconds), capped here.
#   narrowed_bound_seconds  estimated seconds above which a selection runs as the planned full-suite matrix
#                           instead. 1800 is provisional until the operator answers the narrowed-run size
#                           question; the policy-bound report prices the alternatives (comparison_bounds_seconds
#                           and the full-run crossover) from the replay. It may not exceed
#                           max_narrowed_shards * target_shard_seconds.
#   untimed_file_seconds    seconds a test file with no entry in the durations file costs: the durations
#                           file's p90 (nearest rank over its entries). A policy test holds it within
#                           record_tolerance_ratio of the p90 computed from the file.
#   record_tolerance_ratio  relative gap the two policy tests above allow.
#   comparison_bounds_seconds  bounds the policy-bound report prices beside narrowed_bound_seconds.
#   durations_path          recorded per-file seconds, relative to the repository root.
#   path_count_shards       the older rule, kept as a floor: [up to this many selected paths, shards].
#   path_count_max_shards   shards for more paths than the last rung.
#   selection_stage         the stage gate. A narrowing rule is active only at or above its stage.
#                           0 is shadow: what a pull request runs is today's logic, and the record
#                           keeps what the later stages would have run. Advancing it is its own change.
#   file_level_closure_stage  the stage at which the file-level import closure replaces the
#                           module-level escalations (shared_module, unmapped_module,
#                           threshold_modules); below it those escalations still apply.
#   root_conftest_edge      what a closure that reaches the root tests/conftest.py does: "cut" selects
#                           the closure's own tests and runs the whole-tree collection gate, "keep"
#                           selects the tree. "cut" is the plan's recommendation and is provisional
#                           until the operator answers decision D1; the answer is a change of this one key.
#   full_split_count        shards of the full-suite matrix: what a run with the flag off and every
#                           escalation to the full suite takes.
#   record_retention_days   days a pull request's selection record artifact is kept.
#   stage_clean_nights      consecutive nightly runs a stage receipt must cover before the stage it
#                           names may be entered. A night is clean when its published attribution record
#                           counts zero misses, zero unattributable and zero incomplete for the stage
#                           being entered, and at least one pull request record.
#   stage_min_pr_records    pull request records, summed over the receipt's nights, that hold a
#                           selection entry for the stage being entered at the promoted selector and
#                           policy versions. A receipt over fewer is refused.
#   stage_min_compared_changes
#                           fewest changes the stage 1 comparison must cover. Stage 1 is entered on one
#                           deterministic comparison over the recorded set (the replay input and the
#                           recorded full-suite runs named by the receipt, each pinned by digest): the
#                           gate replays the selector over the recorded changes itself and refuses the
#                           stage when a test that failed in a change's full run is not in that change's
#                           selection. It reads no nightly record. Stage 2 and above are entered on the
#                           nightly records stage_clean_nights and stage_min_pr_records describe.
#   graph_compared_stage    the selection_by_stage entry the code graph comparison reads as the parse side.
#                           Fixed before the comparison week starts and not changed during it.
#   graph_min_valid_comparisons
#                           fewest valid comparisons (clean, from Memgraph) the comparison's verdict
#                           part one needs; fewer is "insufficient", never a pass. Fixed before the week
#                           starts and not changed during it.
#   record_check_name_prefix the check run that carries a night's published attribution record is named
#                           <prefix>:<slot date>, on the tested head commit the receipt names for that night.
target_shard_seconds: 571
max_narrowed_shards: 5
narrowed_bound_seconds: 1800
untimed_file_seconds: 4.22
record_tolerance_ratio: 0.05
comparison_bounds_seconds: [1800, 5400]
durations_path: config/test_file_durations.json
path_count_shards:
  - [2, 1]
  - [5, 2]
  - [10, 3]
  - [16, 4]
path_count_max_shards: 5
selection_stage: 1
file_level_closure_stage: 3
root_conftest_edge: cut
full_split_count: 20
record_retention_days: 14
stage_clean_nights: 7
stage_min_pr_records: 10
stage_min_compared_changes: 10
graph_compared_stage: 0
graph_min_valid_comparisons: 20
record_check_name_prefix: nightly-attribution
