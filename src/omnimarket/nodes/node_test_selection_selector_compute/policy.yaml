# The settings of node_test_selection_selector_compute (OMN-23296). No value is set in code.
#
#   target_shard_seconds    estimated test seconds one shard of a narrowed selection carries.
#                           360 is the full suite's own per-shard share (about 7160 recorded
#                           seconds over its 20 planned shards).
#   max_narrowed_shards     most shards a narrowed selection may take. A selection that needs more
#                           than this (its estimate is over max_narrowed_shards * target_shard_seconds,
#                           1800 seconds today) runs as the planned full-suite matrix instead.
#                           tests/nodes/ with tests/unit/ is about 4,100 seconds and ran as two
#                           unplanned shards of about 24,000 tests each, 45 to 77 minutes.
#   durations_path          recorded per-file seconds, relative to the repository root.
#   path_count_shards       the older rule, kept as a floor: [up to this many selected paths, shards].
#   path_count_max_shards   shards for more paths than the last rung.
#   selection_stage         the stage gate. A narrowing rule is active only at or above its stage.
#                           0 is shadow: what a pull request runs is today's logic, and the record
#                           keeps what the later stages would have run. Advancing it is its own change.
#   file_level_closure_stage  the stage at which the file-level import closure replaces the
#                           module-level escalations (shared_module, unmapped_module,
#                           threshold_modules); below it those escalations still apply.
#   root_conftest_edge      what a closure that reaches the root tests/conftest.py does: "cut" selects
#                           the closure's own tests and runs the whole-tree collection gate, "keep"
#                           selects the tree. "cut" is the plan's recommendation and is provisional
#                           until the operator answers decision D1; the answer is a change of this one key.
#   full_split_count        shards of the full-suite matrix: what a run with the flag off and every
#                           escalation to the full suite takes.
#   record_retention_days   days a pull request's selection record artifact is kept.
#   graph_compared_stage    the selection_by_stage entry the code graph comparison reads as the parse side.
#                           Fixed before the comparison week starts and not changed during it.
#   graph_min_valid_comparisons
#                           fewest valid comparisons (clean, from Memgraph) the comparison's verdict
#                           part one needs; fewer is "insufficient", never a pass. Fixed before the week
#                           starts and not changed during it.
target_shard_seconds: 360
max_narrowed_shards: 5
durations_path: config/test_file_durations.json
path_count_shards:
  - [2, 1]
  - [5, 2]
  - [10, 3]
  - [16, 4]
path_count_max_shards: 5
selection_stage: 0
file_level_closure_stage: 3
root_conftest_edge: cut
full_split_count: 20
record_retention_days: 14
graph_compared_stage: 0
graph_min_valid_comparisons: 20
