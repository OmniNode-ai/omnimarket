name: node_test_selection_selector_compute
version: "1.0.0"
description: Decides the shard count of a narrowed test selection, and whether it is too heavy to stay narrowed, from estimated test time; builds the typed record of a pull request run's selection behind the stage gate; replays the selector over merged history against a frozen tree; validates the stage receipts that gate each stage advance (stage 1 on one comparison recomputed over the recorded set, a later stage against published nightly attribution records, which it reads as check runs through the repository gateway node)
omnibase_core_compat: ">=0.47.28,<0.48.0"
entry_points:
  onex.nodes:
    node_test_selection_selector_compute: omnimarket.nodes.node_test_selection_selector_compute
capabilities:
  standalone: true
  full_runtime: true
  requires_network: false
  requires_repo: false
  requires_secrets: false
  side_effect_class: pure
dependencies:
  - pydantic>=2.11.0
authors: [OmniNode Team]
license: MIT
tags: [compute, ci, test-selection, shard-count, selection-record, replay, stage-gate]
node_role: compute
pack: pr_lifecycle
display_name: Test Selection Selector
