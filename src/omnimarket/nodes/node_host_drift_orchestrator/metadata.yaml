name: node_host_drift_orchestrator
version: 0.1.0
description: Orchestrator - on a runtime tick, sends the host drift check to each declared lab host as one lab
  work unit and publishes one run result with one verdict per host.
omnibase_core_compat: '>=0.47.31,<0.48.0'
entry_points:
  onex.nodes:
    node_host_drift_orchestrator: omnimarket.nodes.node_host_drift_orchestrator
capabilities:
  standalone: false
  full_runtime: true
  requires_network: false
  requires_repo: false
  requires_secrets: false
  requires_docker: false
  side_effect_class: effectful
dependencies:
- pydantic>=2.0
- omnibase-infra>=0.38.3
license: MIT
authors:
- OmniNode Team
tags:
- orchestrator
- host-drift
pack: operator_tooling
display_name: Host Drift Orchestrator
node_role: orchestrator
