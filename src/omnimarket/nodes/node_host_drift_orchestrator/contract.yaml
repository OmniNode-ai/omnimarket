# ONEX Node Contract - Host Drift Orchestrator (OMN-24197)
#
# On a runtime tick, sends the host drift check to each declared lab host as one lab work unit and
# publishes one run result with one typed verdict per host. The hosts, the check command, the timeout and
# the transport are all in the node's overlay. The check only observes.
name: node_host_drift_orchestrator
lifecycle: experimental
node_type: orchestrator
runtime_profiles:
- effects
contract_version:
  major: 1
  minor: 0
  patch: 0
node_version: 1.0.0
description: On a runtime tick, sends the host drift check to each declared lab host as one lab work
  unit and publishes one run result with one verdict per host; the hosts and the check come from the overlay.
contract_name: node_host_drift_orchestrator
node_name: node_host_drift_orchestrator
handler_routing:
  routing_strategy: operation_match
  handlers:
  - operation: host_drift.scheduled_run
    topic: onex.intent.platform.runtime-tick.v1
    handler:
      name: HandlerHostDriftScheduled
      module: omnimarket.nodes.node_host_drift_orchestrator.handlers.handler_host_drift_scheduled
    event_model:
      name: ModelRuntimeTick
      module: omnibase_infra.runtime.models.model_runtime_tick
    event_type: platform.runtime-tick
input_subscriptions:
- topic: onex.intent.platform.runtime-tick.v1
  operation: host_drift.scheduled_run
event_bus:
  subscribe_topics:
  - onex.intent.platform.runtime-tick.v1
  publish_topics:
  - onex.evt.omnimarket.host-drift-run-completed.v1
  - onex.evt.omnimarket.schedule-run.v1
terminal_event: onex.evt.omnimarket.host-drift-run-completed.v1
published_events:
- topic: onex.evt.omnimarket.host-drift-run-completed.v1
  event_type: ModelHostDriftRunCompleted
- topic: onex.evt.omnimarket.schedule-run.v1
  event_type: ModelScheduleRunEvent
externally_consumed_topics:
- onex.evt.omnimarket.host-drift-run-completed.v1
- onex.evt.omnimarket.schedule-run.v1
runtime:
  schedule_overlay:
    overlay_id: node_host_drift_orchestrator
    model: omnimarket.models.model_host_drift_orchestrator.ModelHostDriftOrchestratorOverlay
overlay_profiles:
  in_memory: overlays/in_memory.yaml
  lab_work: overlays/lab_work.example.yaml
descriptor:
  node_archetype: orchestrator
  purity: effectful
  idempotent: false
  timeout_ms: 3600000
  side_effects:
  - sends one lab work unit per declared host, which runs the host drift check there
metadata:
  transport_type: kafka
  ticket: OMN-24197
  description: Sends the host drift check to each declared lab host as one lab work unit on a runtime
    tick and publishes one run result with one verdict per host.
  created: '2026-11-14'
  tags:
  - host-drift
  - orchestrator
broker_acl_grants:
- principal: "${ONEX_ACL_RUNTIME_PRINCIPAL}"
  grants:
  - {resource_type: TOPIC, pattern: LITERAL, name: onex.intent.platform.runtime-tick.v1, operation: READ}
  - {resource_type: TOPIC, pattern: LITERAL, name: onex.intent.platform.runtime-tick.v1, operation: DESCRIBE}
  - {resource_type: TOPIC, pattern: LITERAL, name: onex.evt.omnimarket.host-drift-run-completed.v1, operation: WRITE}
  - {resource_type: TOPIC, pattern: LITERAL, name: onex.evt.omnimarket.host-drift-run-completed.v1, operation: DESCRIBE}
  - {resource_type: TOPIC, pattern: LITERAL, name: onex.evt.omnimarket.schedule-run.v1, operation: WRITE}
  - {resource_type: TOPIC, pattern: LITERAL, name: onex.evt.omnimarket.schedule-run.v1, operation: DESCRIBE}
  - {resource_type: TOPIC, pattern: LITERAL, name: onex.cmd.omnimarket.lab-work-unit-requested.v1, operation: WRITE}
  - {resource_type: TOPIC, pattern: LITERAL, name: onex.cmd.omnimarket.lab-work-unit-requested.v1, operation: DESCRIBE}
  - {resource_type: TOPIC, pattern: LITERAL, name: onex.evt.omnimarket.lab-work-unit-completed.v1, operation: READ}
  - {resource_type: TOPIC, pattern: LITERAL, name: onex.evt.omnimarket.lab-work-unit-completed.v1, operation: DESCRIBE}
  - {resource_type: TOPIC, pattern: LITERAL, name: onex.evt.omnimarket.lab-work-unit-failed.v1, operation: READ}
  - {resource_type: TOPIC, pattern: LITERAL, name: onex.evt.omnimarket.lab-work-unit-failed.v1, operation: DESCRIBE}
  - {resource_type: GROUP, pattern: PREFIXED, name: local.omnimarket.node_host_drift_orchestrator.consume.v1., operation: READ}
  - {resource_type: GROUP, pattern: PREFIXED, name: local.omnimarket.node_host_drift_orchestrator.consume.v1., operation: DESCRIBE}
