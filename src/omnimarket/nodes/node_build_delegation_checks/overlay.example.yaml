# The tested defaults of node_build_delegation_checks (the settings store holds the live values; a change is made there).
# Synthetic: the owner is a role lane and no credential appears.
checks: [C11, C12, C13, C14, C15, C16, C17, C28, C29, C30]
dev_runtime_lane: dev
owner: delegation-owner
alarm_lane: orchestrator-31d9-swarm
alarm_condition: delegation_check_regression
check_timeout_seconds: 1800
max_alarm_latency_seconds: 900
history_relpath: build-delegation-checks/builds.json
history_keep: 200
merge_clone_relpath: omnimarket
merge_branch: dev
repository: OmniNode-ai/omnimarket
# Every check runs the delegation check probe node of this repository: C13, C14 and C17 on a customer machine through the responder
# chain, the other seven through the dev gateway the settings store names. No route is a cloud workflow dispatch.
check_routes:
  C11: ['{python}', -m, omnimarket.nodes.node_delegation_check_probe_effect.runtime_delegation_check_probe_tick, --omni-home, '{registry_root}', --state-dir, '{state_root}/delegation-check-probe', --trigger, manual, --check, C11]
  C12: ['{python}', -m, omnimarket.nodes.node_delegation_check_probe_effect.runtime_delegation_check_probe_tick, --omni-home, '{registry_root}', --state-dir, '{state_root}/delegation-check-probe', --trigger, manual, --check, C12]
  C13: ['{python}', -m, omnimarket.nodes.node_delegation_check_probe_effect.runtime_delegation_check_probe_tick, --omni-home, '{registry_root}', --state-dir, '{state_root}/delegation-check-probe', --trigger, manual, --check, C13]
  C14: ['{python}', -m, omnimarket.nodes.node_delegation_check_probe_effect.runtime_delegation_check_probe_tick, --omni-home, '{registry_root}', --state-dir, '{state_root}/delegation-check-probe', --trigger, manual, --check, C14]
  C15: ['{python}', -m, omnimarket.nodes.node_delegation_check_probe_effect.runtime_delegation_check_probe_tick, --omni-home, '{registry_root}', --state-dir, '{state_root}/delegation-check-probe', --trigger, manual, --check, C15]
  C16: ['{python}', -m, omnimarket.nodes.node_delegation_check_probe_effect.runtime_delegation_check_probe_tick, --omni-home, '{registry_root}', --state-dir, '{state_root}/delegation-check-probe', --trigger, manual, --check, C16]
  C17: ['{python}', -m, omnimarket.nodes.node_delegation_check_probe_effect.runtime_delegation_check_probe_tick, --omni-home, '{registry_root}', --state-dir, '{state_root}/delegation-check-probe', --trigger, manual, --check, C17]
  C28: ['{python}', -m, omnimarket.nodes.node_delegation_check_probe_effect.runtime_delegation_check_probe_tick, --omni-home, '{registry_root}', --state-dir, '{state_root}/delegation-check-probe', --trigger, manual, --check, C28]
  C29: ['{python}', -m, omnimarket.nodes.node_delegation_check_probe_effect.runtime_delegation_check_probe_tick, --omni-home, '{registry_root}', --state-dir, '{state_root}/delegation-check-probe', --trigger, manual, --check, C29]
  C30: ['{python}', -m, omnimarket.nodes.node_delegation_check_probe_effect.runtime_delegation_check_probe_tick, --omni-home, '{registry_root}', --state-dir, '{state_root}/delegation-check-probe', --trigger, manual, --check, C30]
bus_lane: dev
