name: node_build_delegation_checks
version: "0.1.0"
description: "Effect: run the ten delegation checks once against every dev build and name the merges the build added when a check goes red."
pack: pipeline
node_role: effect
display_name: "Build Delegation Checks"
omnibase_core_compat: ">=0.39.0,<1.0.0"
entry_points:
  onex.nodes:
    node_build_delegation_checks: "omnimarket.nodes.node_build_delegation_checks"
capabilities:
  standalone: true
  full_runtime: false
  requires_network: true
  requires_repo: true
  requires_secrets: false
  requires_docker: false
  side_effect_class: write
dependencies:
  - "pyyaml>=6.0"
authors: ["OmniNode Platform Team"]
license: "MIT"
tags: ["effect", "delegation", "regression", "build"]
