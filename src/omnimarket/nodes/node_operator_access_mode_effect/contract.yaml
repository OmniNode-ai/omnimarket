---
# Operator access mode and the supervision rules it switches. RULING 2026-10-10T16:55:54Z
# lane=access-mode-9f8a (mechanism ticket OMN-20892), corrected by CORRECTION
# 2026-10-10T16:56:54Z (the bare-id part of the reply check is on in every mode).
name: operator_access_mode_effect
contract_version: {major: 1, minor: 0, patch: 0}
node_type: effect
node_version: {major: 1, minor: 0, patch: 0}

description: >
  Decides how the operator is reaching a Claude Code session (local CLI at the Mac, remote client,
  or a headless run nobody reads) from the session's own environment, with an environment, prompt
  and global override, and applies the supervision rules that depend on it: the foreground Bash
  shape and wait guard (always on), the foreground fetch guard (operator-facing sessions),
  the operator reply check (bare ticket and PR ids always,
  local paths in remote mode), the attention-only push gate, and the remote setup check at
  session start. Silent turns allow only single-line attention items across all assistant text blocks.
  Agent and Workflow Mac routes are refused while the lab has free slots.
  Installed as user-level Claude Code hooks by onex-user-hooks-install.

handler:
  module: omnimarket.handlers
  class: HandlerLocalAccessMode
  input_model: omnimarket.models.model_local_access_mode_request.ModelLocalAccessModeRequest
  output_model: omnimarket.models.model_local_access_mode_result.ModelLocalAccessModeResult

handler_routing:
  routing_strategy: operation_match
  handlers:
    - operation: detect_access_mode
      handler:
        name: HandlerLocalAccessMode
        module: omnimarket.handlers
      input_model: omnimarket.models.model_local_access_mode_request.ModelLocalAccessModeRequest
      output_model: omnimarket.models.model_local_access_mode_result.ModelLocalAccessModeResult
    - operation: check_foreground_bash
      handler:
        name: HandlerForegroundBashGuard
        module: omnimarket.nodes.node_operator_access_mode_effect.handlers.handler_foreground_bash_guard
      input_model: omnimarket.nodes.node_operator_access_mode_effect.models.model_foreground_bash_request.ModelForegroundBashRequest
      output_model: omnimarket.nodes.node_operator_access_mode_effect.models.model_hook_verdict.ModelHookVerdict
    - operation: check_operator_reply
      handler:
        name: HandlerOperatorReplyCheck
        module: omnimarket.nodes.node_operator_access_mode_effect.handlers.handler_operator_reply_check
      input_model: omnimarket.nodes.node_operator_access_mode_effect.models.model_operator_reply_request.ModelOperatorReplyRequest
      output_model: omnimarket.nodes.node_operator_access_mode_effect.models.model_hook_verdict.ModelHookVerdict
    - operation: check_silence
      handler:
        name: HandlerSilenceGuard
        module: omnimarket.nodes.node_operator_access_mode_effect.handlers.handler_silence_guard
      input_model: omnimarket.nodes.node_operator_access_mode_effect.models.model_silence_request.ModelSilenceRequest
      output_model: omnimarket.nodes.node_operator_access_mode_effect.models.model_hook_verdict.ModelHookVerdict
    - operation: gate_lab_dispatch
      handler:
        name: HandlerLabDispatchGate
        module: omnimarket.nodes.node_operator_access_mode_effect.handlers.handler_lab_dispatch_gate
      input_model: omnimarket.nodes.node_operator_access_mode_effect.models.model_lab_dispatch_request.ModelLabDispatchRequest
      output_model: omnimarket.nodes.node_operator_access_mode_effect.models.model_hook_verdict.ModelHookVerdict
    - operation: gate_push_notification
      handler:
        name: HandlerAttentionPushGate
        module: omnimarket.nodes.node_operator_access_mode_effect.handlers.handler_attention_push_gate
      input_model: omnimarket.nodes.node_operator_access_mode_effect.models.model_push_gate_request.ModelPushGateRequest
      output_model: omnimarket.nodes.node_operator_access_mode_effect.models.model_hook_verdict.ModelHookVerdict
    - operation: check_remote_setup
      handler:
        name: HandlerRemoteSetupCheck
        module: omnimarket.nodes.node_operator_access_mode_effect.handlers.handler_remote_setup_check
      input_model: omnimarket.nodes.node_operator_access_mode_effect.models.model_remote_setup_request.ModelRemoteSetupRequest
      output_model: omnimarket.nodes.node_operator_access_mode_effect.models.model_remote_setup_request.ModelRemoteSetupResult

    - operation: record_operator_messages
      handler:
        name: HandlerOperatorMessageLedger
        module: omnimarket.nodes.node_operator_access_mode_effect.handlers.handler_operator_message_ledger
      input_model: omnimarket.models.model_operator_message_spool.ModelHookMessageRequest
      output_model: omnimarket.models.model_operator_message_spool.ModelHookMessageResult
    - operation: render_operator_spool_drain_unit
      handler:
        name: HandlerOperatorSpoolDrainUnit
        module: omnimarket.nodes.node_operator_access_mode_effect.handlers.handler_operator_hooks_installer
      input_model: omnimarket.models.model_operator_message_spool.ModelOperatorSpoolUnitRequest
      output_model: omnimarket.models.model_operator_message_spool.ModelOperatorSpoolUnitResult

operator_message_policy:
  packaged_overlay: contracts/operator_message_arrivals.json
  overlay_env: ONEX_OPERATOR_MESSAGE_OVERLAY
  ledger_node: node_work_ledger_append_effect
  publisher_command_env: ONEX_LEDGER_BUS_APPEND_COMMAND
  description: The configured canonical ledger client resolves its principal writer topic from the ledger node contract.
  rows:
    arrival: STATUS with kind=operator-message-arrival, item=msg-<id>, session, native_id, content_sha256 and item_state=open; no words.
    reply: STATUS with kind=operator-message-reply, session and comma-separated answers=msg-<id> values.
    acknowledgement: Private STATUS with kind=operator-message-acknowledgement, item, session, percent-encoded words and item_state=open.
  drain:
    operation: drain
    module: omnimarket.nodes.node_operator_access_mode_effect.runtime_operator_hook_cli
    render_handler: HandlerOperatorSpoolDrainUnit
    platforms: [launchd, systemd]
    schedule: drain_interval_seconds in the overlay
    dispatches_lanes: false
    runs_tick: false

descriptor:
  node_archetype: effect
  purity: effectful
  idempotent: true
  side_effects:
    - appends idempotent arrival, reply and private handoff rows through the ledger bus, with a host-wide durable spool
    - writes one state file per session and optional override and silent files under the access-mode state directory
    - refuses a tool call (exit 2) or a turn end (Stop decision block) that breaks a supervision rule
  runtime_profiles: []

runtime_dispatch:
  external_trigger: "Claude Code hooks and the onex-access-mode CLI invoke the detector locally with session facts."

event_bus:
  subscribe_topics: []
  publish_topics: []

# A Claude Code hook entry reached through its command line, not a bus topic.
lifecycle: experimental

metadata:
  tickets: [OMN-20892, OMN-20893, OMN-20894, OMN-20895, OMN-20896]
  transport_type: local
