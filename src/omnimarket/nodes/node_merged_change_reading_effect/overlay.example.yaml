# Synthetic values. The deployment's overlay lives at <root>/node_merged_change_reading_effect/overlay.yaml
# under a root named in ONEX_SKILL_OVERLAY_ROOTS. No key has a default.
#
#   schedule_hosts   hosts that install the hourly systemd user timer: the venv its unit runs (under the
#                    registry root) and the environment it carries (the ssh targets the reading's sources use)
schedule_hosts:
- name: example-lab-host
  venv: example-clone/.venv
  environment:
    EXAMPLE_SSH_TARGET: user@example-host.invalid
