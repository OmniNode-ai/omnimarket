name: node_inference_credentials
version: 1.0.0
description: Serves the customer inference-credential routes (POST, GET and DELETE under /v1/tenants/me/inference-credentials) from the runtime's HTTP port, for a caller the identity resolver accepts.
pack: catalog
node_role: effect
display_name: Inference Credentials
omnibase_core_compat: '>=0.39.0,<1.0.0'
entry_points:
  onex.nodes:
    node_inference_credentials: omnimarket.nodes.node_inference_credentials
capabilities:
  standalone: false
  full_runtime: true
  requires_network: true
  requires_repo: false
  requires_secrets: true
  requires_docker: false
  side_effect_class: write
dependencies:
- omnibase-infra>=0.38.3,<0.39.0
- fastapi>=0.100
- pydantic>=2.0
- pyyaml>=6.0
- asyncpg>=0.30.0
authors:
- OmniNode Platform Team
license: MIT
tags:
- effect
- http
- credentials
