name: node_linear_snapshot_effect
lifecycle: experimental
node_type: EFFECT_GENERIC
runtime_profiles: []
contract_version:
  major: 1
  minor: 0
  patch: 0
node_version: 1.0.0
description: >-
  Write linear-<UTC date>.json, the signed-in subject's open Linear issues with id, title, status, statusType, assignee, labels, project, updatedAt and description and the top-level operator (the resolved Linear user id), validated by one typed model. The lab fill generator reads it for the operator's open tickets and plans-today reads it as the identity sidecar; with only the compact text snapshot the generator reports linear_snapshot unread and generates no ticket. The result carries counts only.
input_model:
  name: ModelLinearSnapshotRequest
  module: omnimarket.nodes.node_linear_snapshot_effect.models.model_linear_snapshot
output_model:
  name: ModelLinearSnapshotResult
  module: omnimarket.nodes.node_linear_snapshot_effect.models.model_linear_snapshot
handler:
  module: omnimarket.nodes.node_linear_snapshot_effect.handlers.handler_linear_snapshot
  class: HandlerLinearSnapshot
  input_model: omnimarket.nodes.node_linear_snapshot_effect.models.model_linear_snapshot.ModelLinearSnapshotRequest
  output_model: omnimarket.nodes.node_linear_snapshot_effect.models.model_linear_snapshot.ModelLinearSnapshotResult
event_bus:
  subscribe_topics: []
  publish_topics: []
runtime_dispatch:
  external_trigger: The existing idle-slot-fill tick refreshes the default daily snapshot after 900 seconds, including with no free slots; manual plans-today calls use the same node.
secrets:
  LINEAR_API_KEY:
    required: true
    description: Linear read credential resolved once through the canonical secret-store resolver.
descriptor:
  node_archetype: effect
  purity: effectful
  runtime_profiles: []
  idempotent: true
  timeout_ms: 300000
  side_effects:
  - reads the signed-in subject's open Linear issues through the GraphQL API with a store-resolved key
  - writes linear-<UTC date>.json under the output directory, replacing the file atomically
metadata:
  transport_type: HTTP
  description: >-
    Write linear-<UTC date>.json, the signed-in subject's open Linear issues, validated by one typed model.
  author: OmniNode Team
  created: '2026-11-03'
  tags:
  - effect
  - linear-snapshot-effect
  - OMN-22361
  related_tickets:
  - OMN-22361
