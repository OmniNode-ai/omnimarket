name: node_morning_friction_sweep_orchestrator
contract_version: {major: 1, minor: 0, patch: 0}
node_type: orchestrator
node_version: {major: 1, minor: 0, patch: 0}
lifecycle: experimental
description: >
  Guarded morning friction sweep: same-date idempotency precheck, five
  concurrent sources, synthesis, adjudication, then report and watermark.
  Phase execution reuses the canonical delegation orchestrator and infra
  request-response wiring. The deployment's briefs, paths, lanes and bounds
  come from an overlay; the node holds none of them.
input_model:
  name: ModelMorningFrictionSweepRequest
  module: omnimarket.nodes.node_morning_friction_sweep_orchestrator.models.model_morning_friction_sweep
output_model:
  name: ModelMorningFrictionSweepResult
  module: omnimarket.nodes.node_morning_friction_sweep_orchestrator.models.model_morning_friction_sweep
handler:
  module: omnimarket.nodes.node_morning_friction_sweep_orchestrator.handlers.handler_morning_friction_sweep
  class: HandlerMorningFrictionSweep
handler_routing:
  routing_strategy: operation_match
  handlers:
    - operation: morning_friction_sweep
      handler:
        name: HandlerMorningFrictionSweep
        module: omnimarket.nodes.node_morning_friction_sweep_orchestrator.handlers.handler_morning_friction_sweep
      input_model: omnimarket.nodes.node_morning_friction_sweep_orchestrator.models.model_morning_friction_sweep.ModelMorningFrictionSweepRequest
      output_model: omnimarket.nodes.node_morning_friction_sweep_orchestrator.models.model_morning_friction_sweep.ModelMorningFrictionSweepResult
terminal_event: onex.evt.omnimarket.morning-friction-sweep-completed.v1
terminal_events:
  success: onex.evt.omnimarket.morning-friction-sweep-completed.v1
  failure: onex.evt.omnimarket.morning-friction-sweep-failed.v1
descriptor:
  node_archetype: orchestrator
  purity: impure
  idempotent: false
  timeout_ms: 18000000
  runtime_profiles: [effects]
env_dependencies:
  ONEX_ENVIRONMENT: {required: true, description: Explicit runtime environment for canonical bus wiring.}
  OMNIMARKET_MORNING_FRICTION_SWEEP_OVERLAY: {required: false, description: Path to the deployment overlay.yaml; when unset the first node_morning_friction_sweep_orchestrator/overlay.yaml under ONEX_SKILL_OVERLAY_ROOTS is used, and a run with neither refuses to start.}
event_bus:
  subscribe_topics:
    - onex.cmd.omnimarket.morning-friction-sweep-start.v1
  publish_topics:
    - onex.evt.omnimarket.morning-friction-sweep-completed.v1
    - onex.evt.omnimarket.morning-friction-sweep-failed.v1
    - onex.cmd.omnibase-infra.delegation-request.v1
  request_response:
    instances:
      - name: friction_phase
        request_topic: onex.cmd.omnibase-infra.delegation-request.v1
        reply_topics:
          completed: onex.evt.omnibase-infra.delegation-completed.v1
          failed: onex.evt.omnibase-infra.delegation-failed.v1
        correlation: {location: body, field: correlation_id}
        timeout_seconds: 7200
        consumer_group_mode: per_instance
runtime_dispatch:
  # The host scheduler (CLI dispatcher) is this node's producer; declared so it is not inferred from subscribe_topics[0].
  command_topic: onex.cmd.omnimarket.morning-friction-sweep-start.v1

# Explicit SINK declaration (contract topic graph closure): no node contract
# subscribes to these; the host scheduler that started the run reads the terminal.
externally_consumed_topics:
  - onex.evt.omnimarket.morning-friction-sweep-completed.v1
  - onex.evt.omnimarket.morning-friction-sweep-failed.v1

metadata:
  ticket: OMN-20674
  phase_order: [Precheck, Scan, Synthesize, Adjudicate, Report]
  transport_type: kafka
