# Copy to <root>/node_agent_review_cloud_rung_effect/overlay.yaml and set ONEX_SKILL_OVERLAY_ROOTS to that root.
# All values here are synthetic; supply your deployment's facts.
transport: in_memory          # in_memory | redpanda: the bus the delegation event travels on
ticket: OMN-1                 # the carrier ticket the review-only cloud lane's CLAIM names
parent: example-orchestrator  # the lane its ledger rows name as parent
lane_prefix: cloud-review     # each vote's lane is <prefix>-<pr>-<head8>-<nonce>
runner_model: sonnet          # the remote-lane runner's --model; the cloud route runs Sonnet lanes only
timeout_min: 45               # the review-only lane's runtime limit
harness: claude-cloud         # the delegation event's backend is harness:<harness>:<the session's model>
task_type: code_review
bus_lane: dev                 # the lane bus the redpanda transport opens
