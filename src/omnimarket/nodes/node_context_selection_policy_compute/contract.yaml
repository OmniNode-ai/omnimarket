# ONEX Node Contract — node_context_selection_policy_compute
# Pure compute: policy-based, reason-annotated context-factor selection that
# implements the Context Authority Rule (OMN-12843 / M3).
#
# Related: OMN-12843, OMN-12837, OMN-12842
---
name: node_context_selection_policy_compute
contract_version: {major: 1, minor: 1, patch: 0}
node_type: compute
node_version: {major: 1, minor: 1, patch: 0}
description: >
  Deterministic context-selection policy engine. Accepts candidate context
  factors/capsules with their M2-resolved effectiveness scores, required flags,
  and experiment-arm bindings plus the active experiment cohort; ranks by
  measured effectiveness (ties broken deterministically by stable source id) and
  stamps every selection with the Context Authority 5-tuple {factor, source,
  selection_reason, effectiveness_score, experiment_cohort}. Rejects hidden
  authority (optional candidates with no rule, score or cohort) and forced
  experiment arms with no matching active cohort. POLICY_SCOPE_RULE admits
  profile-declared rules with a rule reference and null score; a validated model
  ranking fills optional slots before restoring precedence order, keeping every
  required candidate. No LLM calls, no I/O, same input = same output. The
  evaluate_context_selection operation scores pinned Role C recordings against
  this ordering, with three repeats, withheld-item controls, required-factor
  validation and conservative recall eligibility.

handler:
  module: omnimarket.nodes.node_context_selection_policy_compute.handlers.handler_context_selection_policy
  class: HandlerContextSelectionPolicy
  input_model: omnimarket.nodes.node_context_selection_policy_compute.models.model_selection_request.ModelContextSelectionRequest

handler_routing:
  routing_strategy: operation_match
  handlers:
    - operation: context_selection_policy
      topic: onex.cmd.omnimarket.context-selection-policy-requested.v1
      handler:
        name: HandlerContextSelectionPolicy
        module: omnimarket.nodes.node_context_selection_policy_compute.handlers.handler_context_selection_policy

    - operation: evaluate_context_selection
      topic: onex.cmd.omnimarket.context-selection-evaluation-requested.v1
      event_type: omnimarket.evaluate-context-selection
      message_category: command
      handler:
        name: HandlerContextSelectionEvaluation
        module: omnimarket.nodes.node_context_selection_policy_compute.handlers.handler_context_selection_evaluation
      event_model:
        name: ModelSelectionEvaluationRequest
        module: omnimarket.nodes.node_context_selection_policy_compute.models.model_selection_evaluation

evaluation_policy:
  task_class: context_selection
  repeats: 3
  baseline: deterministic_score_then_source
  recall_denominator: all_labelled_relevant_optional_sources
  alternatives: not_evaluated

descriptor:
  node_archetype: compute
  purity: pure
  runtime_profiles: [main]
  idempotent: true
  timeout_ms: 1000

inputs:
  candidates:
    type: array
    description: "Candidate context factors with source id, effectiveness_score, is_required, forced_experiment_cohort, and scope_rule_ref"
    required: true
  active_experiment_cohort:
    type: str
    description: "Active experiment cohort id for this run; required for any arm-fixed candidate"
    required: false
    nullable: true
  model_ranking:
    type: array
    description: "Model ranking of eligible optional candidate source ids; invalid rankings are ignored and counted"
    required: false
  max_optional:
    type: int
    description: "Number of optional candidates to keep; null keeps all eligible"
    required: false
    nullable: true
  request_id:
    type: str
    required: false
    default: ""

outputs:
  status:
    type: str
    enum: [ok, error]
  selections:
    type: array
    description: "Ordered, reason-annotated selection; each entry carries the Authority 5-tuple"
  selection_rejected:
    type: int
    description: "Count of model rankings ignored for ineligible or duplicate ids"
  selection_rejected_ids:
    type: array
    description: "Offending model ranking ids, sorted and unique"
  request_id:
    type: str
  error:
    type: str
    required: false
    nullable: true

terminal_event: onex.evt.omnimarket.context-selection-policy-completed.v1

event_bus:
  subscribe_topics:
    - onex.cmd.omnimarket.context-selection-policy-requested.v1
    - onex.cmd.omnimarket.context-selection-evaluation-requested.v1
  publish_topics:
    - onex.evt.omnimarket.context-selection-policy-completed.v1

metadata:
  transport_type: kafka
  author: OmniNode Platform Team
  license: MIT
  maturity: stable
  implementation_wave: m3
  tags:
    - context
    - selection
    - policy
    - compute
    - authority-rule
  related_tickets:
    - "OMN-12843"
    - "OMN-12837"
    - "OMN-12842"
    - "OMN-21125"

runtime_dispatch:
  # OMN-18013 -- the CLI/skill dispatcher is this node's producer. Declared so it is not inferred from subscribe_topics[0].
  command_topic: onex.cmd.omnimarket.context-selection-policy-requested.v1

# OMN-18013 -- explicit SINK declaration (contract topic graph closure).
# No node contract subscribes to these; they leave the ONEX node graph here.
externally_consumed_topics:
  - onex.evt.omnimarket.context-selection-policy-completed.v1

externally_produced_topics:
  - topic: onex.cmd.omnimarket.context-selection-evaluation-requested.v1
    producer: "The pinned-manifest evaluation caller publishes recorded Role C observations. This compute does not run models."
