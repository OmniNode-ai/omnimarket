# Real profile: node_ilo_redfish_effect serves the ilo_redfish route. Synthetic values; the
# deployment's overlay lives at <root>/node_host_power_effect/overlay.yaml under a root named in
# ONEX_SKILL_OVERLAY_ROOTS. A host name matches its row in node_ilo_redfish_effect's overlay.
backend: ilo_redfish
writes_need_approval: true
ilo_ledger_path_env: EXAMPLE_LEDGER_PATH
hosts:
  - name: example-host-a
    power_route: ilo_redfish
    allowed_actions: [status, "on", force_off, force_restart]
  - name: example-host-no-route
    allowed_actions: [status]
