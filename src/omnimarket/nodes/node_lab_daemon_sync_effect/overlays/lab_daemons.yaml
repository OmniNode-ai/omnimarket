#
# The lab daemons node_lab_daemon_sync_effect converges on each host tick (OMN-19998). The node
# holds no daemon, path or host: they live here, and a host passes another overlay with --overlay.
# `$VAR` and `${VAR}` expand from the tick's environment when the overlay loads; a daemon naming
# an unset variable is skipped on that host with a diagnostic, never run half-expanded.
# ONEX_PLUGIN_SOURCE_CLONE is the canonical clone carrying the plugin and controller source, and
# ONEX_INSTALLERS_HOME the canonical clone carrying the launchd installers; the host tick sets both.
# `present_when` is a path that exists only on a host where the daemon is installed, so one
# overlay serves every lab host without naming them.
# Surfaces declare portable plugin trees, configuration and observed revisions by host role.
# Layer bounds limit temporary installations; transactional identities scope publishers by role.
schema_version: 2
fix_lane_repeat_hours: 6
# One detached fix lane per refusal, through the remote-lane runner.
fix_lane:
  - python3
  - ${OMNI_PLUGIN_ROOT}/skills/remote-lane/scripts/onex_remote_lane.py
  - run
  - --detach
  - --brief
  - "{brief}"
  - --lane
  - "{lane}"
  - --model
  - sonnet
  - --ticket
  - OMN-19998
  - --priority-class
  - process-fix
# The registry clones every lab host holds; the public ones are listed here and a host names its
# private ones in the JSON file ONEX_LAB_PRIVATE_CLONES_FILE points at ({"repos": [...]}). A missing clone is cloned; a clean clone on its default
# branch is fast-forwarded to origin; a dirty, detached or diverged clone is reported and left alone.
# Clones sync before the daemons, so a plugin source clone created this tick is read the same tick.
clones:
  root: ${OMNI_HOME}
  url: https://github.com/OmniNode-ai/{repo}.git
  extra_repos_file: ${ONEX_LAB_PRIVATE_CLONES_FILE}
  repos:
    - omnibase_core
    - omnibase_spi
    - omnibase_infra
    - omniclaude
    - omnidash
    - omnigemini
    - omniintelligence
    - omnimarket
    - omnimemory
# Maintenance commands run every tick, after the daemons.
chores:
  - name: pre-commit-gc
    description: >
      Drops pre-commit cache entries no config on this host still references, so a dead hook
      repository is cloned fresh by the next hook run instead of failing every commit.
    present_when: ${HOME}/.cache/pre-commit
    argv: [pre-commit, gc]
    no_change: '^0 repo\(s\) removed'
  # The lab-run passes (OMN-19998). A macOS lab host has no other job that frees ~/lab-run:
  # h101 held 875 plugin snapshots (198 GB), 349 lane worktrees (139 GB) and 466 .ctx
  # directories (85 GB) on 2026-11-05. Both read live processes from /proc, or from lsof and ps
  # on macOS, never remove what a live process names, and remove nothing when neither is readable.
  - name: lab-run-plugin-snapshots
    description: >
      Evicts all but the newest three snapshots per plugin under ~/lab-run/plugins, keeping any
      snapshot a live process names.
    present_when: ${HOME}/lab-run/plugins
    argv:
      - ${ONEX_DISPATCH_VENV}/bin/python
      - -m
      - omnimarket.nodes.node_lab_disk_growth_effect
      - plugin-snapshots
      - --plugins-dir
      - ${HOME}/lab-run/plugins
    timeout_s: 1800
    no_change: '^plugin_snapshots=ran evicted=0 '
  - name: lab-run-lane-worktrees
    description: >
      Removes lane worktrees under ~/lab-run/runs that are clean, fully pushed, named by no live
      process and idle past the bound, and .ctx directories past seven days (bounds in
      node_retention_cleanup's contract, retention_policy.lane_worktree_retention).
    present_when: ${HOME}/lab-run/runs
    argv:
      - ${ONEX_DISPATCH_VENV}/bin/python
      - -m
      - omnimarket.nodes.node_retention_cleanup
      - --lane-worktrees
    timeout_s: 3600
    no_change: '^lane_worktrees=ran removed=0 ctx_removed=0 '
daemons:
  - name: landing-controller
    description: >
      The launchd landing controller. Installed revision is the plugin source clone's main commit
      its last verified refresh recorded; its installer is the controller's own refresh-install, which
      takes install.lock and tick.lock, runs the prove-install gate on the lab, and calls
      install.sh --refresh-install. A branch install's branch_until (install.sh --branch-hours)
      holds it until expiry and reverts to main after.
    present_when: ${HOME}/Library/LaunchAgents/ai.omninode.landing-controller.plist
    installed:
      kind: json_file
      path: ${HOME}/.local/state/omni/landing/installed-revision.json
      key: source_commit
    source:
      kind: command
      argv: [git, -C, "${ONEX_PLUGIN_SOURCE_CLONE}", rev-parse, origin/main]
    installer:
      - env
      - -u
      - PYTHONPATH
      - /opt/homebrew/bin/python3.13
      - ${HOME}/.omninode/landing-controller/skills/merge-drain/scripts/landing_g_act.py
      - refresh-install
      - --config
      - ${HOME}/.omninode/landing-controller/landing_install.json
      - --state-dir
      - ${HOME}/.local/state/omni/landing
      - --installed-script
      - ${HOME}/.omninode/landing-controller/skills/merge-drain/scripts/landing_controller.py
    installer_timeout_s: 3600
    locks:
      - ${HOME}/.local/state/omni/landing/install.lock
      - ${HOME}/.local/state/omni/landing/tick.lock
    branch_record:
      path: ${HOME}/.omninode/landing-controller/landing_install.json
  - name: pr-watcher
    description: >
      The launchd PR watcher node host. Its installer is idempotent (an identical plist stays
      loaded). It records no installed revision yet, so until it does every tick refuses with that
      blocker and dispatches one fix lane to add the record.
    present_when: ${HOME}/Library/LaunchAgents/ai.omninode.pr-watcher.plist
    installed:
      kind: json_file
      path: ${HOME}/.omninode/pr-watcher/installed-revision.json
      key: source_commit
    source:
      kind: command
      argv: [git, -C, "${ONEX_INSTALLERS_HOME}", rev-parse, origin/main]
    installer: [bash, "${ONEX_INSTALLERS_HOME}/launchd/pr-watcher/install.sh"]
  - name: omni-plugin
    description: >
      The omni plugin installed for Claude Code on this host, compared by version with the omninode-internal marketplace tip: the source probe updates the marketplace and reads the plugin's plugin.json from it. The installer updates the plugin, or installs it on a host that has none. A host without the marketplace registered reads no source and is refused with that blocker.
    present_when: ${HOME}/.claude
    absent_is_lag: true
    installed:
      kind: json_file
      path: ${HOME}/.claude/plugins/installed_plugins.json
      key: plugins.omni@omninode-internal.0.version
    source:
      kind: command
      argv:
        - bash
        - -c
        - >-
          claude plugin marketplace update omninode-internal >&2
          && cat "${HOME}/.claude/plugins/marketplaces/omninode-internal/plugins/omni/.claude-plugin/plugin.json"
      key: version
    installer:
      - bash
      - -c
      - >-
        claude plugin update omni@omninode-internal
        || claude plugin install omni@omninode-internal
    installer_timeout_s: 600
  - name: onex-overlays-plugin
    description: >
      The onex-overlays plugin, converged the same way from the same marketplace.
    present_when: ${HOME}/.claude
    absent_is_lag: true
    installed:
      kind: json_file
      path: ${HOME}/.claude/plugins/installed_plugins.json
      key: plugins.onex-overlays@omninode-internal.0.version
    source:
      kind: command
      argv:
        - bash
        - -c
        - >-
          claude plugin marketplace update omninode-internal >&2
          && cat "${HOME}/.claude/plugins/marketplaces/omninode-internal/plugins/onex-overlays/.claude-plugin/plugin.json"
      key: version
    installer:
      - bash
      - -c
      - >-
        claude plugin update onex-overlays@omninode-internal
        || claude plugin install onex-overlays@omninode-internal
    installer_timeout_s: 600
  - name: dispatch-venv
    description: >
      The dispatch venv's omnimarket, compared by the commit its direct_url.json records with
      omnimarket dev. Its installer is the host reconcile node in repair mode, which owns the venv.
    source_branch: dev
    present_when: ${ONEX_DISPATCH_VENV}/bin/python
    installed:
      kind: command
      argv:
        - ${ONEX_DISPATCH_VENV}/bin/python
        - -c
        - "import json, importlib.metadata as m; print(json.loads(m.distribution('omnimarket').read_text('direct_url.json'))['vcs_info']['commit_id'])"
    source:
      kind: command
      argv: [git, -C, "${OMNI_HOME}/omnimarket", rev-parse, origin/dev]
    installer:
      - ${ONEX_DISPATCH_VENV}/bin/python
      - -m
      - omnimarket.nodes.node_host_reconcile_effect
      - --omni-home
      - ${OMNI_HOME}

# Temporary installation limits and publisher identities.
layers:
  default_life_hours: 48
  max_life_days: 7
transactional_ids:
  - {role: host-desired-state-publisher, id: host-desired-state-publisher, per_host: false}
  - {role: host-observed-state, id: "host-observed-state/{host}", per_host: true}
# Portable declarations keep host-specific locations behind environment variables.
surfaces:
  - name: omni-lane-tree
    kind: lane_tree
    applies_to_roles:
      - lab
      - lab-proof
    repository: ${ONEX_SURFACE_REPO_INTERNAL_PLUGINS}
    repository_paths:
      - plugins/omni
    runtime: python-venv
    installed:
      kind: json_file
      path: ${HOME}/lab-run/desired-trees/omni/.verified
      key: commit
    loaded:
      kind: json_file
      path: ${HOME}/lab-run/desired-trees/omni/.verified
      key: commit
  - name: onex-overlays-lane-tree
    kind: lane_tree
    applies_to_roles:
      - lab
      - lab-proof
    repository: ${ONEX_SURFACE_REPO_INTERNAL_PLUGINS}
    repository_paths:
      - plugins/onex-overlays
    runtime: bash-hooks
    installed:
      kind: json_file
      path: ${HOME}/lab-run/desired-trees/onex-overlays/.verified
      key: commit
    loaded:
      kind: json_file
      path: ${HOME}/lab-run/desired-trees/onex-overlays/.verified
      key: commit
  - name: onex-lane-tree
    kind: lane_tree
    applies_to_roles:
      - lab
      - lab-proof
    repository: omniclaude
    repository_paths:
      - plugins/onex
    runtime: python-venv
    installed:
      kind: json_file
      path: ${HOME}/lab-run/desired-trees/onex/.verified
      key: commit
    loaded:
      kind: json_file
      path: ${HOME}/lab-run/desired-trees/onex/.verified
      key: commit
  - name: typesafe-skills-lane-tree
    kind: lane_tree
    applies_to_roles:
      - lab
      - lab-proof
    repository: ${ONEX_SURFACE_REPO_TYPESAFE_PLUGIN}
    repository_paths:
      - .
    runtime: bash-hooks
    installed:
      kind: json_file
      path: ${HOME}/lab-run/desired-trees/typesafe-skills/.verified
      key: commit
    loaded:
      kind: json_file
      path: ${HOME}/lab-run/desired-trees/typesafe-skills/.verified
      key: commit
  - name: omni-installed-plugin
    kind: installed_plugin
    applies_to_roles:
      - lab-proof
      - lab
      - launcher
    repository: ${ONEX_SURFACE_REPO_INTERNAL_PLUGINS}
    repository_paths:
      - plugins/omni
    installed:
      kind: json_file
      path: ${HOME}/.claude/plugins/installed_plugins.json
      key: plugins.omni@omninode-internal.0.version
  - name: onex-overlays-installed-plugin
    kind: installed_plugin
    applies_to_roles:
      - lab-proof
      - lab
      - launcher
    repository: ${ONEX_SURFACE_REPO_INTERNAL_PLUGINS}
    repository_paths:
      - plugins/onex-overlays
    installed:
      kind: json_file
      path: ${HOME}/.claude/plugins/installed_plugins.json
      key: plugins.onex-overlays@omninode-internal.0.version
  - name: internal-marketplace-config
    kind: claude_config
    applies_to_roles:
      - lab-proof
      - lab
      - launcher
    settings:
      - key: autoUpdate
        value: false
    loaded:
      kind: json_file
      path: ${HOME}/.claude/plugins/known_marketplaces.json
      key: omninode-internal
  - name: launcher-environment
    kind: launchd_env
    applies_to_roles:
      - launcher
    env:
      - name: ONEX_LEGACY_PLUGIN_ROOT
        action: unset
  - name: lab-work-serve
    kind: observed
    applies_to_roles:
      - lab-proof
      - lab
      - launcher
    repository: omnimarket
    loaded:
      kind: command
      argv:
        - git
        - -C
        - ${HOME}/lab-run/lab-work-serve
        - rev-parse
        - HEAD
  - name: landing-controller-copy
    kind: observed
    applies_to_roles:
      - lab-proof
      - lab
      - launcher
    loaded:
      kind: json_file
      path: ${HOME}/.local/state/omni/landing/installed-revision.json
      key: source_commit
  - name: dispatch-venv
    kind: observed
    applies_to_roles:
      - lab-proof
      - lab
      - launcher
    repository: omnimarket
    loaded:
      kind: command
      argv:
        - ${HOME}/.local/share/onex/dispatch-venv/bin/python
        - -c
        - import json, importlib.metadata as m; print(json.loads(m.distribution('omnimarket').read_text('direct_url.json'))['vcs_info']['commit_id'])
  - name: host-reconciler
    kind: observed
    applies_to_roles:
      - lab-proof
      - lab
      - launcher
    repository: omnimarket
    loaded:
      kind: json_file
      path: ${HOME}/.local/state/omni/host-reconciler/installed-revision.json
      key: source_commit
  - name: desired-state-publisher
    kind: observed
    applies_to_roles:
      - lab-proof
      - lab
      - launcher
    repository: omnimarket
    loaded:
      kind: json_file
      path: ${HOME}/.local/state/omni/desired-state-publisher/installed-revision.json
      key: source_commit
