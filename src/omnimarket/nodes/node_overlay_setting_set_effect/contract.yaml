---
# OMN-24028. The overlay home is only a bootstrap (operator ruling 2026-11-12T15:16:12Z: once a system is
# initialized it goes to no file for its settings): a setting changes in the store. This node sets one declared key
# of one overlay in the store and leaves one audit row. node_overlay_store_load_effect publishes the overlay home's
# version, node_projection_overlay_store stores every version; this node publishes a version of its own on the same topic.
# OMN-26635: the write names a write id, the revision it was built on and its audit row; the projection applies it on that
# revision only, in one transaction with the audit row, publishes the audit row from the table and answers on the reply topic.
name: overlay_setting_set_effect
lifecycle: experimental
node_type: effect
contract_version: {major: 1, minor: 0, patch: 0}
node_version: {major: 1, minor: 0, patch: 0}
description: Sets one declared key of one overlay in the settings store, refusing an undeclared key, and waits for the store's reply to its write; the store leaves one audit row naming who set it with the previous and the new value.
# What the node puts on the bus is the write; the handler's own output_model below is the result the command returns.
output_model: omnimarket.models.overlay_store.ModelOverlayStoreWrite
handler:
  module: omnimarket.nodes.node_overlay_setting_set_effect.handlers.handler_overlay_setting_set
  class: HandlerOverlaySettingSet
  input_model: omnimarket.nodes.node_overlay_setting_set_effect.models.model_overlay_setting_set_request.ModelOverlaySettingSetRequest
  output_model: omnimarket.nodes.node_overlay_setting_set_effect.models.model_overlay_setting_set_result.ModelOverlaySettingSetResult
descriptor:
  node_archetype: effect
  purity: impure
  idempotent: true
  side_effects: [bus-publish, bus-subscribe]
  timeout_ms: 120000
  runtime_profiles: [effects]
runtime_dispatch:
  external_trigger: "python -m omnimarket.nodes.node_overlay_setting_set_effect --overlay <id> --key <declared key> --value-json <json> --actor <who>, which reads the live record from the snapshot topic, publishes the write and waits for the store's reply to it"
  # A setting changes when a person or a lane sets it, never on a timer: the command below is the whole trigger.
  on_demand:
    command: uv run python -m omnimarket.nodes.node_overlay_setting_set_effect --overlay <id> --key <declared key> --value-json <json> --actor <who>
    owner: OmniNode Platform Team
event_bus:
  # The store's answer to the write, committed or conflict, under the write id, is read by the command itself on its own
  # consumer (the READ grants below), as it reads the snapshot topic; no dispatcher handles it, so it is not subscribed here.
  subscribe_topics: []
  publish_topics:
    # The write: node_projection_overlay_store stores it as the overlay's current version, with its audit row, when the
    # revision it names is the current one.
    - onex.evt.omnimarket.overlay-store-loaded.v1
# OMN-18013 sink declaration: no node contract subscribes to the audit row, which node_projection_overlay_store publishes
# from the table row of the committed write; it is read from the topic by operators and audit tooling.
externally_consumed_topics:
  - onex.evt.omnimarket.overlay-setting-set.v1
# The set runs under the same host login as the loader (the overlay scope broker_acl_principals), writes the topic it publishes and
# reads the reply topic and the snapshot topic.
broker_acl_grants:
  - principal: "${ONEX_ACL_HOST_RECONCILER_PRINCIPAL}"
    grants:
      - {resource_type: TOPIC, pattern: LITERAL, name: onex.evt.omnimarket.overlay-store-loaded.v1, operation: WRITE}
      - {resource_type: TOPIC, pattern: LITERAL, name: onex.evt.omnimarket.overlay-store-loaded.v1, operation: DESCRIBE}
      - {resource_type: TOPIC, pattern: LITERAL, name: onex.evt.omnimarket.overlay-store-write-reply.v1, operation: READ}
      - {resource_type: TOPIC, pattern: LITERAL, name: onex.evt.omnimarket.overlay-store-write-reply.v1, operation: DESCRIBE}
      - {resource_type: GROUP, pattern: PREFIXED, name: node_overlay_setting_set_effect.reply, operation: READ}
      - {resource_type: GROUP, pattern: PREFIXED, name: node_overlay_setting_set_effect.reply, operation: DESCRIBE}
      - {resource_type: TOPIC, pattern: LITERAL, name: onex.snapshot.projection.overlay-store.v1, operation: READ}
      - {resource_type: TOPIC, pattern: LITERAL, name: onex.snapshot.projection.overlay-store.v1, operation: DESCRIBE}
      - {resource_type: GROUP, pattern: PREFIXED, name: node_overlay_setting_set_effect.live, operation: READ}
      - {resource_type: GROUP, pattern: PREFIXED, name: node_overlay_setting_set_effect.live, operation: DESCRIBE}
# What a set may name. A key not declared here for the overlay is refused, with nothing written. A whole segment
# ``{lane}`` stands for any one name; the lane must already be a row of the live document. ``path`` is the setting path
# the refresh keeps (keys from the document's root joined by "/"); ``document_model`` is the model the whole document
# must satisfy with the value set. A declared setting holds no secret: its values ride in the audit row.
settable_settings:
  - overlay_id: runtime_contract_hotload
    key: lanes.{lane}.lazy_start
    path: lanes/{lane}/lazy_start
    document_model: "omnimarket.models.overlay_documents.model_contract_hotload_lane_overlay:ModelContractHotloadLaneOverlay"
  # OMN-26043: the delegation responder chain every delegation check sends its task through, one list-valued row (local
  # responders, then openrouter, then claude_api). The row holds no secret: a local responder is a private http://<ipv4>:<port> base.
  - overlay_id: delegation_check_responders
    key: responders
    path: responders
    document_model: "omnimarket.models.overlay_documents.model_delegation_check_responders_overlay:ModelDelegationCheckRespondersOverlay"
    # The store may hold no record of this overlay yet: the first set creates it from this document, validated by the model above.
    first_document: {schema_version: 1}
  # OMN-26642: the dev gateway address and the test tenant the gateway-graded delegation checks act as. The row holds no secret: the
  # tenant's token is the dev tenant node's, found by the secret name its overlay declares.
  - overlay_id: delegation_check_gateway
    key: gateway
    path: gateway
    document_model: "omnimarket.models.overlay_documents.model_delegation_check_gateway_overlay:ModelDelegationCheckGatewayOverlay"
    # The gateway document has required keys with no default, so the value is the whole document; the first set creates the record.
    first_document: {}
    whole_document: true
  # OMN-26484: the age past which a held dev deploy command raises its alarm. The dev roll window gate reads its policy from this
  # overlay on every tick, so a value set here moves the alarm on the next tick; an unset value (null) switches the alarm off.
  - overlay_id: node_dev_roll_window_gate_effect
    key: held_age_alarm_after_seconds
    path: held_age_alarm_after_seconds
    document_model: "omnimarket.nodes.node_dev_roll_window_gate_effect.models.model_dev_roll_window_gate_policy:ModelDevRollWindowGatePolicy"
  # OMN-26621: the owner and thresholds of the per-build delegation checks. The owner has no default: with none set the node
  # refuses to raise an alarm. A declared setting holds no secret.
  - overlay_id: node_build_delegation_checks
    key: owner
    path: owner
    document_model: "omnimarket.models.overlay_documents.model_build_delegation_checks_overlay:ModelBuildDelegationChecksOverlay"
  - overlay_id: node_build_delegation_checks
    key: alarm_lane
    path: alarm_lane
    document_model: "omnimarket.models.overlay_documents.model_build_delegation_checks_overlay:ModelBuildDelegationChecksOverlay"
  - overlay_id: node_build_delegation_checks
    key: check_timeout_seconds
    path: check_timeout_seconds
    document_model: "omnimarket.models.overlay_documents.model_build_delegation_checks_overlay:ModelBuildDelegationChecksOverlay"
  - overlay_id: node_build_delegation_checks
    key: max_alarm_latency_seconds
    path: max_alarm_latency_seconds
    document_model: "omnimarket.models.overlay_documents.model_build_delegation_checks_overlay:ModelBuildDelegationChecksOverlay"
  # OMN-26521: the floor fill's live seam keys (the pool snapshot file and its read-at record, the ticket deadline, the andon stop queue
  # directory). Each is optional in the overlay: a seam whose key is absent answers UNKNOWN naming it. A declared setting holds no secret.
  - overlay_id: node_floor_fill_orchestrator
    key: floor_fill_live.pool_snapshot_path
    path: floor_fill_live/pool_snapshot_path
    document_model: "omnimarket.nodes.node_floor_fill_orchestrator.models.model_floor_fill_overlay_document:ModelFloorFillOverlayDocument"
  - overlay_id: node_floor_fill_orchestrator
    key: floor_fill_live.pool_record_suffix
    path: floor_fill_live/pool_record_suffix
    document_model: "omnimarket.nodes.node_floor_fill_orchestrator.models.model_floor_fill_overlay_document:ModelFloorFillOverlayDocument"
  - overlay_id: node_floor_fill_orchestrator
    key: floor_fill_live.pool_snapshot_max_age_seconds
    path: floor_fill_live/pool_snapshot_max_age_seconds
    document_model: "omnimarket.nodes.node_floor_fill_orchestrator.models.model_floor_fill_overlay_document:ModelFloorFillOverlayDocument"
  - overlay_id: node_floor_fill_orchestrator
    key: floor_fill_live.pool_engine
    path: floor_fill_live/pool_engine
    document_model: "omnimarket.nodes.node_floor_fill_orchestrator.models.model_floor_fill_overlay_document:ModelFloorFillOverlayDocument"
  - overlay_id: node_floor_fill_orchestrator
    key: floor_fill_live.mint_timeout_seconds
    path: floor_fill_live/mint_timeout_seconds
    document_model: "omnimarket.nodes.node_floor_fill_orchestrator.models.model_floor_fill_overlay_document:ModelFloorFillOverlayDocument"
  - overlay_id: node_floor_fill_orchestrator
    key: floor_fill_live.andon_state_dir
    path: floor_fill_live/andon_state_dir
    document_model: "omnimarket.nodes.node_floor_fill_orchestrator.models.model_floor_fill_overlay_document:ModelFloorFillOverlayDocument"
  # OMN-26461: the goal's ticket rule roots, the tickets and epics whose pull requests the landing goal admits. A set of the list is
  # validated against the whole overlay document, so a non-ticket string or a wrong type is refused with nothing written. The row holds no
  # secret: the list is OMN-<n> ticket ids.
  - overlay_id: goal_scope_ticket_rule
    key: ticket_roots
    path: ticket_roots
    document_model: "omnimarket.models.overlay_documents.model_goal_scope_ticket_rule_overlay:ModelGoalScopeTicketRuleOverlay"
config:
  # The live record the set builds on must have been loaded within this many seconds: the loader asserts every overlay
  # each cycle, so an older record means the read did not reach the newest one, and a set built on it would replace newer settings.
  max_live_age_s: 7200
  # How long the command listens on the snapshot topic for the live record.
  read_window_s: 30
  group_prefix: node_overlay_setting_set_effect.live
  # The store's reply to a write is waited for this long; with none, the same write id is published again (the store applies it once).
  reply_timeout_s: 30
  reply_group_prefix: node_overlay_setting_set_effect.reply
  # A write built on a revision another set had replaced is built again on what the store then holds, up to this many attempts.
  max_attempts: 5
snapshot_read:
  # onex-topic-allow: a projection snapshot topic has the projection's own name form.
  topic: onex.snapshot.projection.overlay-store.v1
# The store's answer to a write, read by the command's own consumer under the READ grants above.
reply_read:
  topic: onex.evt.omnimarket.overlay-store-write-reply.v1
overlay:
  node: node_overlay_store_load_effect
  roots_env: ONEX_SKILL_OVERLAY_ROOTS
metadata:
  transport_type: kafka
  ticket: OMN-24028
