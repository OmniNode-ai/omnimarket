name: overlay_setting_set_effect
version: "1.0.0"
description: "Sets one declared key of one overlay in the settings store and publishes one audit row naming who set it."
omnibase_core_compat: ">=0.39.0,<1.0.0"
entry_points:
  onex.nodes:
    node_overlay_setting_set_effect: omnimarket.nodes.node_overlay_setting_set_effect
capabilities:
  standalone: true
  full_runtime: false
  requires_network: true
  requires_repo: false
  requires_secrets: true
  requires_docker: false
  side_effect_class: write
dependencies:
  - "omnibase_core>=0.39.0"
  - "pyyaml>=6.0"
  - "pydantic>=2.0"
tags: [effect, overlay, configuration]
pack: "data"
display_name: "Effect: Overlay Setting Set"
node_role: "effect"
license: "MIT"
