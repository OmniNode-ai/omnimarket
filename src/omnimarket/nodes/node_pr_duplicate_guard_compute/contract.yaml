name: node_pr_duplicate_guard_compute
lifecycle: experimental
node_type: COMPUTE_GENERIC
runtime_profiles: []
contract_version:
  major: 1
  minor: 0
  patch: 0
node_version: 1.0.0
description: One fix, one pull request. Fold a new pull request (branch, title, body, what its diff changes) against the open pull requests of its repository (the PR watcher's records and what each diff changes) and the rolling ledger, and answer adopt, naming the pull request to take over, when an open one is already from the branch, changes the same lines, changes the same file under the same distinctive title words, cites the same check or cause, or when another lane holds a live CLAIM with the same cause= cell; otherwise clear. Pure; the callers (onex scm pr-create and onex scm pr-duplicate-check) read the snapshot.
input_model:
  name: ModelPrDuplicateGuardRequest
  module: omnimarket.models.model_pr_duplicate_guard
output_model:
  name: ModelPrDuplicateGuardResult
  module: omnimarket.models.model_pr_duplicate_guard
