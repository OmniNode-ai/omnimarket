  output_model: omnimarket.models.model_pr_duplicate_guard.ModelPrDuplicateGuardResult
handler_routing:
  routing_strategy: operation_match
  default_handler: omnimarket.nodes.node_pr_duplicate_guard_compute.handlers.handler_pr_duplicate_guard:HandlerPrDuplicateGuard
  handlers:
  - operation: handle
    handler:
      name: HandlerPrDuplicateGuard
      module: omnimarket.nodes.node_pr_duplicate_guard_compute.handlers.handler_pr_duplicate_guard
event_bus:
  subscribe_topics: []
  publish_topics: []
runtime_dispatch:
