name: node_work_state_panel_reducer
version: "0.1.0"
description: "Work-state panel reducer — folds each projected event into the projector-keyed panel row; the state of record is the contract-declared state_io row"
omnibase_core_compat: ">=0.39.0,<1.0.0"
entry_points:
  onex.nodes:
    node_work_state_panel_reducer: "omnimarket.nodes.node_work_state_panel_reducer"
capabilities:
  standalone: true
  full_runtime: true
  requires_network: false
  requires_repo: false
  requires_secrets: false
  requires_docker: false
  # The handler performs NO I/O. Its prior state is loaded and its fold
  # CAS-persisted by the runtime's state_io dispatch seam, so the node's own
  # side-effect class is none.
  side_effect_class: none
dependencies:
  - "omnibase_core>=0.39.0"
  # state_codec bridges omnibase_infra's CONTEXTVAR_STATE_IO_ROWS —
  # a lazy, ImportError-tolerant import, but a real dependency edge.
  - "omnibase-infra>=0.38.3"
authors: ["OmniNode Platform Team"]
license: "MIT"
tags: ["reducer", "work-state", "panel"]
pack: "pipeline"
display_name: "Work State Panel Reducer"
node_role: "reducer"
