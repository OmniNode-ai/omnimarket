name: node_delegated_test_loop_orchestrator
version: "0.1.0"
description: "Declarative orchestrator shell and definition-B handler for the delegated test write-run-fix loop. Injected ports bind its children; the handler bounds delegation to three calls, grades the must-fail control, writes a loop receipt, and returns a compact result."
pack: pipeline
node_role: orchestrator
display_name: "Delegated Test Loop Orchestrator"
omnibase_core_compat: ">=0.39.0,<1.0.0"
entry_points:
  onex.nodes:
    node_delegated_test_loop_orchestrator: "omnimarket.nodes.node_delegated_test_loop_orchestrator"
capabilities:
  standalone: false
  full_runtime: false
  requires_network: true
  requires_repo: false
  requires_secrets: false
  requires_docker: false
  side_effect_class: write
dependencies:
  - "omnibase-core>=0.39.0,<1.0.0"
authors: ["OmniNode Platform Team"]
license: "MIT"
tags: ["orchestrator", "delegated-test-loop", "delegation"]
