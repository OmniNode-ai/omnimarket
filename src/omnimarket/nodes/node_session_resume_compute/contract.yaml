name: node_session_resume_compute
lifecycle: experimental
node_type: COMPUTE_GENERIC
runtime_profiles: []
contract_version:
  major: 1
  minor: 0
  patch: 0
node_version: 1.0.0
description: List every dangling CLAIM of the rolling ledger with the principal that wrote it and whose it is, and compose the closing TERMINAL or the relaunch CLAIM for a stopped lane, bound to the session's principals through the team identity declaration. A member session sees another principal's lanes as foreign, runs the reconciler in report mode only, and is refused any closing row, relaunch or landing notice for a CLAIM that is not its own; an operator session behaves as before. Read-only; appends nothing.
input_model:
  name: ModelSessionResumeRequest
  module: omnimarket.nodes.node_session_resume_compute.models.model_session_resume
output_model:
  name: ModelSessionResumeResult
  module: omnimarket.nodes.node_session_resume_compute.models.model_session_resume
handler:
