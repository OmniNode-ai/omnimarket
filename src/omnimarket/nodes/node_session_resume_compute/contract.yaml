  class: HandlerSessionResume
  input_model: omnimarket.nodes.node_session_resume_compute.models.model_session_resume.ModelSessionResumeRequest
  output_model: omnimarket.nodes.node_session_resume_compute.models.model_session_resume.ModelSessionResumeResult
handler_routing:
  routing_strategy: operation_match
  default_handler: omnimarket.nodes.node_session_resume_compute.handlers.handler_session_resume:HandlerSessionResume
  handlers:
  - operation: handle
    handler:
      name: HandlerSessionResume
      module: omnimarket.nodes.node_session_resume_compute.handlers.handler_session_resume
event_bus:
  subscribe_topics: []
  publish_topics: []
runtime_dispatch:
  external_trigger: Direct Python invocation by the session-resume skill with the session's identity claims.
descriptor:
  node_archetype: compute
  purity: effectful  # reads the ledger, its archive rolls and the team identity overlay; writes nothing
  runtime_profiles: []
  idempotent: true
  timeout_ms: 30000
replay:
  requires_validator_version: true
  timestamp_authority: ingest_sequence
  deterministic: true
