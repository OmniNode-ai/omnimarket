name: node_ci_checkout_effect
version: "0.1.0"
description: "Effect: serve a repository at a sha from this host's clones, never GitHub."
pack: pipeline
node_role: effect
display_name: "CI Checkout Effect"
omnibase_core_compat: ">=0.39.0,<1.0.0"
entry_points:
  onex.nodes:
    node_ci_checkout_effect: "omnimarket.nodes.node_ci_checkout_effect"
capabilities:
  standalone: true
  full_runtime: false
  requires_network: true
  requires_repo: false
  requires_secrets: false
  requires_docker: false
  side_effect_class: write
dependencies:
  - "click>=8.1.0"
  - "pyyaml>=6.0"
  - "omnibase-infra>=0.38.3"
authors: ["OmniNode Platform Team"]
license: "MIT"
tags: ["effect", "ci-checkout", "git"]
