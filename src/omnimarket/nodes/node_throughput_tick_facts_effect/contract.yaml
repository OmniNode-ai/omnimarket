# ONEX Node Contract - the hourly check's facts read (OMN-23734)
name: node_throughput_tick_facts_effect
contract_name: node_throughput_tick_facts_effect
node_name: node_throughput_tick_facts_effect
lifecycle: experimental
node_type: effect
contract_version: {major: 1, minor: 0, patch: 0}
node_version: {major: 1, minor: 0, patch: 0}
runtime_profiles: [effects]
description: >-
  Reads what the retired throughput_tick.py read before its decision step: the landing controller's
  launchd state and its PID's elapsed time, the controller's newest tick lines, heartbeat and
  state.json, the PR watcher's state, the landing floors and the logins that land like the operator,
  the open-count history and the open status-check units the record step keeps, and the goal check's
  inputs (the goal_scope overlay, the controller's admission rows, the newest receipt's per-PR
  reasons and the last goal record). A source that cannot be read is the error text the script put on
  its request, never a raise and never an empty fact. It writes nothing. Parity-tested on 20 recorded
  ticks; the live run on the Mac runtime is the ticket's third criterion.
input_model:
  name: ModelThroughputTickFactsRequest
  module: omnimarket.nodes.node_throughput_tick_facts_effect.models.model_throughput_tick_facts
  description: Where to read; paths and program names are the caller's.
output_model:
  name: ModelThroughputTickFactsResult
  module: omnimarket.nodes.node_throughput_tick_facts_effect.models.model_throughput_tick_facts
  description: The decision compute's facts under the script's key names, and the goal check's inputs.
handler:
  module: omnimarket.nodes.node_throughput_tick_facts_effect.handlers.handler_throughput_tick_facts
  class: HandlerThroughputTickFacts
  input_model: omnimarket.nodes.node_throughput_tick_facts_effect.models.model_throughput_tick_facts.ModelThroughputTickFactsRequest
  output_model: omnimarket.nodes.node_throughput_tick_facts_effect.models.model_throughput_tick_facts.ModelThroughputTickFactsResult
dependencies:
  - name: ProtocolTickFactsSource
    dependency_type: protocol
    description: "the host's programs (launchctl, ps) and files; the host source by default, a scripted one in tests."
    required: true
handler_routing:
  routing_strategy: operation_match
  default_handler: omnimarket.nodes.node_throughput_tick_facts_effect.handlers.handler_throughput_tick_facts:HandlerThroughputTickFacts
  handlers:
    - operation: read_throughput_tick_facts
      topic: onex.cmd.omnimarket.throughput-tick-facts-requested.v1
      handler:
        name: HandlerThroughputTickFacts
        module: omnimarket.nodes.node_throughput_tick_facts_effect.handlers.handler_throughput_tick_facts
event_bus:
  subscribe_topics:
    - onex.cmd.omnimarket.throughput-tick-facts-requested.v1
  publish_topics:
    - onex.evt.omnimarket.throughput-tick-facts-read.v1
terminal_event: onex.evt.omnimarket.throughput-tick-facts-read.v1
runtime_dispatch:
  command_topic: onex.cmd.omnimarket.throughput-tick-facts-requested.v1
  terminal_events:
    success: onex.evt.omnimarket.throughput-tick-facts-read.v1
descriptor:
  node_archetype: effect
  purity: side_effecting
  runtime_profiles: [effects]
  idempotent: true
  timeout_ms: 30000
  side_effects:
    - runs launchctl list and ps for the landing controller's PID, and reads the controller's, the watcher's, the floors', the overlay's and the tick's state files; writes nothing
broker_acl_grants:
  - principal: "${ONEX_ACL_RUNTIME_PRINCIPAL}"
    grants:
      - {resource_type: TOPIC, pattern: LITERAL, name: onex.cmd.omnimarket.throughput-tick-facts-requested.v1, operation: READ}
      - {resource_type: TOPIC, pattern: LITERAL, name: onex.cmd.omnimarket.throughput-tick-facts-requested.v1, operation: DESCRIBE}
      - {resource_type: TOPIC, pattern: LITERAL, name: onex.evt.omnimarket.throughput-tick-facts-read.v1, operation: WRITE}
      - {resource_type: TOPIC, pattern: LITERAL, name: onex.evt.omnimarket.throughput-tick-facts-read.v1, operation: DESCRIBE}

metadata:
  transport_type: inmemory
  description: The hourly check's facts read
  author: OmniNode Team
  created: "2026-11-14"
  related_tickets: [OMN-23734]
