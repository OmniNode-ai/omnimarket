name: node_e2e_orchestrator
version: "2.0.0"
description: "E2E orchestrator — bridges build-loop completion to the PR lifecycle via a CI read loop on the bus"
omnibase_core_compat: ">=0.39.0,<1.0.0"
pack: build
node_role: orchestrator
display_name: "E2E Orchestrator"
entry_points:
  onex.nodes:
    node_e2e_orchestrator: "omnimarket.nodes.node_e2e_orchestrator"
capabilities:
  standalone: false
  full_runtime: true
  requires_network: false
  requires_repo: false
  requires_secrets: false
  requires_docker: false
  side_effect_class: pure
dependencies:
  - "omnibase_core>=0.39.0"
authors: ["OmniNode Platform Team"]
license: "MIT"
tags: ["e2e", "orchestrator", "ci-poll", "merge-sweep", "build-loop"]
