#
# ONEX Node Contract
# Node: NodePrLandingLedgerFactsCompute
#
# The ledger half of one landing-controller tick's facts as a pure definition-B compute:
#
#   handle(ModelLandingLedgerRows) -> ModelLandingLedgerFacts
#
# From ledger rows already parsed (the read of the ledger files is an effect, not this node) it derives
# the fixer kill switch, the lanes that own a shared red cause, the fix PRs an open cause CLAIM
# declares, the cause releases, the lab proof PASS readbacks and the live repo drain lane. The live
# controller keeps deriving its own copy; the two are compared on the recorded ledger before any caller
# moves. No clock (the tick's time is in the request), no I/O, no model.
name: "node_pr_landing_ledger_facts_compute"
contract_name: "node_pr_landing_ledger_facts_compute"
node_name: "node_pr_landing_ledger_facts_compute"
lifecycle: experimental
node_type: "COMPUTE_GENERIC"
contract_version:
  major: 0
  minor: 1
  patch: 0
node_version:
  major: 0
  minor: 1
  patch: 0
description: >
  Pure definition-B derivation of the landing controller's row-only ledger facts:
  fixer_hold, cause_owners (and cause_owners_skipped, the CLAIMs whose owner the model
  refuses, which are left out and never raised), cause_releases, cause_fixes, lab_passes,
  review (the new-work marks and the reviewer lane's verdicts per PR) and drain_lane, from
  the tick's ledger rows and clock. Deterministic in the row order the ledger gives.
  Per-PR owners, holds and merge-order waits are not derived here.
input_model:
  name: "ModelLandingLedgerRows"
  module: "omnimarket.nodes.node_pr_landing_ledger_facts_compute.models.model_landing_ledger_facts"
  description: "The tick's clock, the window's parsed ledger rows, and older rows read only for lab PASS readbacks."
output_model:
  name: "ModelLandingLedgerFacts"
  module: "omnimarket.nodes.node_pr_landing_ledger_facts_compute.models.model_landing_ledger_facts"
  description: "The row-only ledger facts of one tick."
handler:
  module: "omnimarket.nodes.node_pr_landing_ledger_facts_compute.handlers.handler_pr_landing_ledger_facts"
  class: "HandlerPrLandingLedgerFacts"
  input_model: "omnimarket.nodes.node_pr_landing_ledger_facts_compute.models.model_landing_ledger_facts.ModelLandingLedgerRows"
handler_routing:
  routing_strategy: "operation_match"
  default_handler: "omnimarket.nodes.node_pr_landing_ledger_facts_compute.handlers.handler_pr_landing_ledger_facts:HandlerPrLandingLedgerFacts"
  handlers:
    - operation: "derive_landing_ledger_facts"
      handler:
        name: "HandlerPrLandingLedgerFacts"
        module: "omnimarket.nodes.node_pr_landing_ledger_facts_compute.handlers.handler_pr_landing_ledger_facts"
terminal_event: "onex.evt.omnimarket.pr-landing-ledger-facts-completed.v1"
runtime_dispatch:
  command_topic: "onex.cmd.omnimarket.pr-landing-ledger-facts-requested.v1"
  terminal_events:
    success: "onex.evt.omnimarket.pr-landing-ledger-facts-completed.v1"
    failure: "onex.evt.omnimarket.pr-landing-ledger-facts-failed.v1"
event_bus:
  subscribe_topics:
    - "onex.cmd.omnimarket.pr-landing-ledger-facts-requested.v1"
  publish_topics:
    - "onex.evt.omnimarket.pr-landing-ledger-facts-completed.v1"
externally_consumed_topics:
  - "onex.evt.omnimarket.pr-landing-ledger-facts-completed.v1"
  - "onex.evt.omnimarket.pr-landing-ledger-facts-failed.v1"
broker_acl_grants:
  - principal: "${ONEX_ACL_RUNTIME_PRINCIPAL}"
    grants:
      - {resource_type: TOPIC, pattern: LITERAL, name: "onex.cmd.omnimarket.pr-landing-ledger-facts-requested.v1", operation: READ}
      - {resource_type: TOPIC, pattern: LITERAL, name: "onex.cmd.omnimarket.pr-landing-ledger-facts-requested.v1", operation: DESCRIBE}
      - {resource_type: TOPIC, pattern: LITERAL, name: "onex.evt.omnimarket.pr-landing-ledger-facts-completed.v1", operation: WRITE}
      - {resource_type: TOPIC, pattern: LITERAL, name: "onex.evt.omnimarket.pr-landing-ledger-facts-completed.v1", operation: DESCRIBE}
      - {resource_type: TOPIC, pattern: LITERAL, name: "onex.evt.omnimarket.pr-landing-ledger-facts-failed.v1", operation: WRITE}
      - {resource_type: TOPIC, pattern: LITERAL, name: "onex.evt.omnimarket.pr-landing-ledger-facts-failed.v1", operation: DESCRIBE}

descriptor:
  runtime_profiles: [main]
  node_archetype: compute
  purity: pure
  idempotent: true
  timeout_ms: 5000
replay:
  deterministic: true
metadata:
  transport_type: kafka
  description: "Row-only ledger facts of one landing tick."
  author: "OmniNode Team"
  license: "MIT"
  created: "2026-10-09"
  tags:
    - compute
    - pr-landing
    - landing-controller
    - ledger
    - pure
