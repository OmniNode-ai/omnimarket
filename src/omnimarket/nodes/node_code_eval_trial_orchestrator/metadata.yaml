name: node_code_eval_trial_orchestrator
version: "0.1.0"
description: "Code eval trial orchestrator: one run request places each task's tries on free lab hosts, scores each answer one at a time and publishes one row per verdict; it composes, the reducer decides, the lab work unit executes"
omnibase_core_compat: ">=0.39.0,<1.0.0"
entry_points:
  onex.nodes:
    node_code_eval_trial_orchestrator: "omnimarket.nodes.node_code_eval_trial_orchestrator"
capabilities:
  standalone: false
  full_runtime: true
  requires_network: false
  requires_repo: true
  requires_secrets: false
  requires_docker: false
  side_effect_class: stateful
dependencies:
  - "omnibase_core>=0.39.0"
authors: ["OmniNode Platform Team"]
license: "MIT"
tags: ["orchestrator", "code-eval", "trial-driver"]
pack: "code_eval"
display_name: "Code Eval Trial Orchestrator"
node_role: "orchestrator"
