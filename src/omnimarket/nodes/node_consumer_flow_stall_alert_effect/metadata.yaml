name: consumer_flow_stall_alert_effect
version: "1.0.0"
description: >
  Reads the consumer-flow projection and publishes a Slack alert when a
  consumer holds STALLED or STARVED for the contract-declared number of
  consecutive windows. Since the OMN-16778 redesign the node assembles its own
  evaluation: policy from its contract, window history read at its own effect
  boundary.
omnibase_core_compat: ">=0.39.0,<1.0.0"
capabilities:
  standalone: true
  full_runtime: true
  requires_network: true
  requires_secrets: true
  side_effect_class: publish_event
dependencies:
  - "omnibase_core>=0.39.0"
  - "pyyaml>=6.0"
  # The trailing-window read at this effect's boundary. Sync driver on purpose:
  # the runtime dispatches handle() as a sync def-B handler, and opening an
  # event loop per message is the OMN-16874 defect.
  - "psycopg2-binary>=2.9"
tags:
  - effect
  - observability
  - alerting
  - flow
pack: "data"
display_name: "Effect: Consumer Flow Stall Alert"
node_role: "effect"
