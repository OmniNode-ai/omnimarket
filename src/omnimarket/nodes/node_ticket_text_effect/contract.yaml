  },
  "description": "Read one ticket's title, state, description and acceptance criteria from Linear (read-only, the key resolved by the caller on the launching host) and append them to a lane brief as a quoted block, so a headless lab lane with no Linear tool reads its criteria from its prompt (OMN-17427). A verbatim request preserves the authored task without resolving the key or reading Linear, and records source=verbatim. A ticket Linear cannot answer (ticket-unreadable) or one with no description (ticket-text-empty) is a named refusal, never a note, because a headless lab lane has no Linear key or tool to read it itself (OMN-20607).",
