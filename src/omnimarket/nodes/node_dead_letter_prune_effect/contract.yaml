---
# SPDX-FileCopyrightText: 2026 OmniNode.ai Inc.
# SPDX-License-Identifier: MIT
name: node_dead_letter_prune_effect
contract_name: node_dead_letter_prune_effect
node_name: node_dead_letter_prune_effect
node_type: EFFECT_GENERIC
# Run by an operator through its entry point (dead_letter_prune), AND on a
# daily schedule (OMN-19657) driven by the platform runtime tick -- never an
# external cron or launchd trigger. The runtime scheduler
# (omnibase_infra.runtime.runtime_scheduler.RuntimeScheduler) emits
# onex.intent.platform.runtime-tick.v1 far more often than daily; the handler
# gates on config.dead_letter_prune.schedule.run_interval_seconds using an
# in-process last-run timestamp, the same idiom node_github_pr_poller_effect
# uses for poll_interval_seconds. The handler still returns a typed result
# rather than publishing; nothing consumes a completion event.
lifecycle: experimental
contract_version: {major: 1, minor: 1, patch: 0}
node_version: {major: 1, minor: 1, patch: 0}

description: >
  Retention for dead-letter rows in event_ledger (OMN-17001). event_ledger has
  no retention path of its own, so dead-letter floods stay forever: 19 million
  rows on one DLQ topic on the lab dev lane by 2026-09-25. For every UTC day
  wholly older than retention_days, this node reads the day's dead-letter rows
  in offset order, writes them as gzip JSON Lines objects with manifests to the
  archive sink (client-side encrypted by the injected cipher; a sink that
  leaves the host refuses a plaintext cipher), reads every object back and
  verifies its checksums, count and exact offsets, confirms the source still
  holds exactly those offsets, and only then deletes exactly those keys in
  committed batches. A row that is not in a verified archive object is never
  deleted. Dry run lists what would be pruned and touches nothing.

handler:
  module: omnimarket.nodes.node_dead_letter_prune_effect.handlers.handler_dead_letter_prune
  class: HandlerDeadLetterPrune
  input_model: omnimarket.nodes.node_dead_letter_prune_effect.models.ModelDeadLetterPruneRequest

handler_routing:
  routing_strategy: operation_match
  handlers:
    - operation: dead_letter_prune
      handler:
        name: HandlerDeadLetterPrune
        module: omnimarket.nodes.node_dead_letter_prune_effect.handlers.handler_dead_letter_prune
      handler_module: omnimarket.nodes.node_dead_letter_prune_effect.handlers.handler_dead_letter_prune
      event_model: omnimarket.nodes.node_dead_letter_prune_effect.models.ModelDeadLetterPruneRequest
    # OMN-19657: the daily schedule's entry. Same handler class and instance as
    # the manual operation above -- the elapsed-time gate is per-instance state
    # (self._last_scheduled_run), so it must be the one handler the runtime
    # constructs for this node, not a second one.
    - operation: dead_letter.prune_scheduled_run
      handler:
        name: HandlerDeadLetterPrune
        module: omnimarket.nodes.node_dead_letter_prune_effect.handlers.handler_dead_letter_prune
      handler_module: omnimarket.nodes.node_dead_letter_prune_effect.handlers.handler_dead_letter_prune
      event_model: omnibase_infra.runtime.models.model_runtime_tick.ModelRuntimeTick
      event_type: platform.runtime-tick
      description: >
        Gate on config.dead_letter_prune.schedule.run_interval_seconds elapsed
        since the last scheduled run; when due, run dead_letter_prune with
        retention_days from config and dry_run from schedule.dry_run.

input_model:
  name: ModelDeadLetterPruneRequest
  module: omnimarket.nodes.node_dead_letter_prune_effect.models
  description: Retention days (default the contract's), as-of instant, dry run, day cap.

output_model:
  name: ModelDeadLetterPruneResult
  module: omnimarket.nodes.node_dead_letter_prune_effect.models
  description: Per-day eligible, archived and pruned counts, manifests written or reused, and a verdict.

descriptor:
  node_archetype: effect
  purity: effectful
  idempotent: true
  timeout_ms: 21600000
  runtime_profiles: [effects]

# OMN-19657: the daily schedule's trigger. Matches node_github_pr_poller_effect
# and node_gmail_archive_cleanup_effect's own input_subscriptions -- the
# runtime tick is the ONLY trigger the runtime dispatches on a schedule; the
# actual cadence is config.dead_letter_prune.schedule.run_interval_seconds.
input_subscriptions:
  - topic: "onex.intent.platform.runtime-tick.v1"
    operation: "dead_letter.prune_scheduled_run"

event_bus:
  subscribe_topics:
    - "onex.intent.platform.runtime-tick.v1"
  # No publish_topics: the handler returns a typed ModelDeadLetterPruneResult;
  # it does not publish to the bus. runtime_dispatch.terminal_events below
  # documents what a future publishing shell would use -- unchanged from
  # before this schedule was added, and still nothing on the other end of it.

config:
  dead_letter_prune:
    table: event_ledger
    topic_like: "onex.dlq.%"  # onex-topic-allow: SQL LIKE pattern over event_ledger.topic, not a topic name
    # Operator ruling, OPERATOR-CONSENT 2026-09-25T12:40:35Z (OMN-17001):
    # keep dead-letter rows 30 days, then archive and prune.
    retention_days: 30
    day_basis: "coalesce(event_timestamp, ledger_written_at) UTC"
    # The owning principal of event_ledger; fail fast when unset.
    dsn_env: OMNIBASE_INFRA_DB_URL
    # Bounds one object in memory: the 2026-09-09 self-loop rows average about
    # 14.5 KB as base64 JSON, so 100k rows is about 1.5 GB before gzip.
    max_rows_per_object: 100000
    delete_batch_size: 5000
    local_dir_env: ONEX_DEAD_LETTER_ARCHIVE_DIR
    # OMN-19657: the daily runtime-tick schedule. Rolled out dry-run first on
    # the .201 lab lane to prove the schedule fires and touches nothing, then
    # flipped to dry_run: false once that pass is proven (PR lab-proof section
    # carries both receipts).
    schedule:
      run_interval_seconds: 86400
      dry_run: false
    sinks:
      default: local_dir
      local_dir:
        location_env: ONEX_DEAD_LETTER_ARCHIVE_DIR
        encryption: [none, age-x25519]
      s3:
        # Objects under <prefix><topic>/partition=<p>/day=<utc day>/, next to
        # the one-shot archive of the 2026-08 bursts and the 2026-09-09 loop.
        prefix: dead-letter-archive/event_ledger/
        encryption: [kms-envelope-aes256gcm]
        kms_key_ref: alias/omninode-claude-session-archive
        requires_encryption: true

runtime_dispatch:
  command_topic: onex.cmd.omnimarket.dead-letter-prune-requested.v1
  terminal_events:
    success: onex.evt.omnimarket.dead-letter-prune-completed.v1
    failure: onex.evt.omnimarket.dead-letter-prune-failed.v1

dod_evidence:
  PYTEST:
    description: "archive, readback verification, source drift, short delete, rerun and refusal tests"
    command: "uv run pytest tests/test_golden_chain_dead_letter_prune_effect.py -q"
    pass_criteria: >
      only whole UTC days older than retention on dead-letter topics are read;
      a corrupted readback, a source window that drifted and a short delete
      each fail the day with nothing further deleted; dry run reads, writes
      and deletes nothing; a rerun after a crash before prune reuses the
      verified objects; a sink that leaves the host refuses a plaintext cipher

metadata:
  # The store talks to Postgres directly. DATABASE is the label the compliance
  # sweep maps psycopg2 to, so the declared transport covers the import.
  transport_type: database
