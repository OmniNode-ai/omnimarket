---
name: node_knowledge_context_assembler_reducer
contract_version: {major: 0, minor: 1, patch: 0}
node_type: reducer
node_version: {major: 0, minor: 1, patch: 0}
input_model: omnimarket.events.knowledge_context.ModelKnowledgeContextFragment

description: >
  Pure reducer that collects backend response fragments for a correlation_id
  and materializes a ModelKnowledgeContextBundle. Handles partial failures:
  any mix of ok/error fragments produces a valid bundle with COMPLETE,
  PARTIAL, or DEGRADED status. No I/O — callers own the state.

handler:
  module: omnimarket.nodes.node_knowledge_context_assembler_reducer.handlers.handler_knowledge_context_assembler_reducer
  class: HandlerKnowledgeContextAssemblerReducer

handler_routing:
  routing_strategy: operation_match
  handlers:
    - operation: knowledge_context_assembler
      handler:
        name: HandlerKnowledgeContextAssemblerReducer
        module: omnimarket.nodes.node_knowledge_context_assembler_reducer.handlers.handler_knowledge_context_assembler_reducer
      event_model: omnimarket.events.knowledge_context.ModelKnowledgeContextFragment

descriptor:
  node_archetype: reducer
  purity: pure
  idempotent: true
  timeout_ms: 1000

event_bus:
  subscribe_topics:
    - onex.evt.omnimarket.knowledge-context-fragment-ready.v1
  publish_topics:
    - onex.evt.omnimarket.knowledge-context-assembled.v1

metadata:
  transport_type: kafka
  author: "OmniNode Platform Team"
  created: "2026-05-24"
  tags:
    - reducer
    - knowledge-context
    - pure
    - graceful-degradation
    - OMN-11935
  related_tickets:
    - OMN-11935
    - OMN-11909

# OMN-13734: machine-readable FSM (transcribed from authoritative handler/model logic).
state_machine:
  version: {major: 1, minor: 0, patch: 0}
  state_machine_name: knowledge_context_assembler_fsm
  state_machine_version: {major: 1, minor: 0, patch: 0}
  description: "knowledge_context_assembler_fsm"
  initial_state: idle
  # OMN-19549: assembled is terminal in the handler (reduce returns the state
  # unchanged once completed), so it is declared terminal here. The untyped
  # block declared no terminal state.
  terminal_states: [assembled]
  error_states: []
  persistence_enabled: false
  states:
    - version: {major: 1, minor: 0, patch: 0}
      state_name: idle
      state_type: operational
      description: "No context fragments folded yet."
      required_data: []
    - version: {major: 1, minor: 0, patch: 0}
      state_name: assembling
      state_type: operational
      description: "Fragments accumulating into a context."
      required_data: []
    - version: {major: 1, minor: 0, patch: 0}
      state_name: assembled
      state_type: terminal
      description: "Knowledge context assembled."
      is_terminal: true
      is_recoverable: false
      required_data: []
  transitions:
    # First context fragment ready.
    - version: {major: 1, minor: 0, patch: 0}
      transition_name: idle_to_assembling_on_fragment_ready
      from_state: idle
      to_state: assembling
      trigger: fragment_ready
    # Fold another fragment.
    - version: {major: 1, minor: 0, patch: 0}
      transition_name: assembling_to_assembling_on_fragment_ready
      from_state: assembling
      to_state: assembling
      trigger: fragment_ready
    # Context assembly complete.
    - version: {major: 1, minor: 0, patch: 0}
      transition_name: assembling_to_assembled_on_context_assembled
      from_state: assembling
      to_state: assembled
      trigger: context_assembled

# OMN-18013 -- explicit SINK declaration (contract topic graph closure).
# No node contract subscribes to these; they leave the ONEX node graph here.
externally_consumed_topics:
  - onex.evt.omnimarket.knowledge-context-assembled.v1
