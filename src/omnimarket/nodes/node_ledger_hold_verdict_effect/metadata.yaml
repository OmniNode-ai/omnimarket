name: ledger_hold_verdict_effect
version: "1.0.0"
description: "Decides HELD, CLEAR or UNDECIDED for one pull request from the bus-fed work ledger holds answer; a failed read is never CLEAR and a file fallback is stamped source=file-fallback."
omnibase_core_compat: ">=0.39.0,<1.0.0"
entry_points:
  onex.nodes:
    node_ledger_hold_verdict_effect: omnimarket.nodes.node_ledger_hold_verdict_effect
capabilities:
  standalone: true
  full_runtime: false
  requires_network: false
  requires_repo: false
  requires_secrets: false
  requires_docker: false
  side_effect_class: read
dependencies:
  - "omnibase_core>=0.39.0"
  - "pyyaml>=6.0"
  - "pydantic>=2.0"
tags: [effect, work-ledger, hold]
pack: "data"
display_name: "Effect: Ledger Hold Verdict"
node_role: "effect"
license: "MIT"
