name: node_federation_edge_decision_compute
version: "0.1.0"
description: "Federation edge decision: who-and-where, ACL probe and egress gate for one recorded runtime event, pass or refuse with one named reason"
omnibase_core_compat: ">=0.39.0,<1.0.0"
entry_points:
  onex.nodes:
    node_federation_edge_decision_compute: "omnimarket.nodes.node_federation_edge_decision_compute"
capabilities:
  standalone: true
  # false until the federation forwarder sends the edge decision command: the
  # bus surface is declared, the caller is not wired yet.
  full_runtime: false
  requires_network: false
  requires_repo: false
  requires_secrets: false
  requires_docker: false
  side_effect_class: read_only
dependencies:
  - "omnibase-infra>=0.38.68"
authors: ["OmniNode Platform Team"]
license: "MIT"
tags: ["compute", "federation", "edge", "pure"]
pack: "federation"
display_name: "Federation Edge Decision"
node_role: "compute"
