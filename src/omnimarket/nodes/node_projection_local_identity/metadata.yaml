name: projection_local_identity
version: "1.0.0"
description: "The local install's tenant identity and when it was minted, one row per tenant, folded from local-identity-minted events."
omnibase_core_compat: ">=0.39.0,<1.0.0"
capabilities:
  standalone: true
  # This step ships the node's migrations only; the contract and writer follow
  # after the omnibase_infra release that grants the table, and set this to true.
  full_runtime: false
  requires_network: true
  requires_secrets: true
  side_effect_class: write_db
dependencies:
  - "omnibase_core>=0.39.0"
  - "pyyaml>=6.0"
tags: [projection, local, identity, reducer]
ownership:
  local_identity:
    ddl_owner: omnimarket.nodes.node_projection_local_identity
    table_role: projection_read_model
    create_migration: "migrations/0000_create_local_identity.sql"
    duplicate_migration_policy: forbid_cross_repo_create_table
    non_owner_repos: [omnibase_infra]
    rationale: "Omnimarket owns the local identity read model; infra vendors its migration."
pack: "data"
display_name: "Projection: Local Identity"
node_role: "effect"
