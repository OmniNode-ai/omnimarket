---
name: "node_review_replay_set_effect"
# Phase 0 of the cost-shaped Hostile Reviewer rollout: the frozen set every later
# replay, baseline and shadow sample is measured against.
lifecycle: experimental
contract_name: node_review_replay_set_effect
node_name: node_review_replay_set_effect
node_type: EFFECT_GENERIC
contract_version: {major: 1, minor: 0, patch: 0}
node_version: {major: 1, minor: 0, patch: 0}
description: >
  Freezes merged PR diffs for the review replay: a target count (40 by default)
  drawn round-robin across repo x size strata (changed lines: up to 199, 200 to
  1,000, over 1,000), with pinned items (diffs already measured) taken first.
  Diffs come from the canonical clones' landing-branch history with git, never
  from GitHub. The manifest carries every diff's SHA-256, and its canonical-JSON
  SHA-256 is the manifest hash; the set is written once under that hash and a
  second freeze finds it intact or refuses. The recall bar (minimum recall) and the
  labels (which frozen items carry a defect) are frozen beside the set, once and before
  any roster is scored, under a hash that names the set; scoring reads the frozen bar and
  set from the store, refuses when either is missing or changed, and a roster whose recall
  over the labelled defective items is below the bar does not pass.

input_model: omnimarket.nodes.node_review_replay_set_effect.models.model_review_replay_set.ModelReviewReplaySetRequest

output_model:
  name: ModelReviewReplaySetResult
  module: omnimarket.nodes.node_review_replay_set_effect.models.model_review_replay_set
  description: The manifest hash and path, the item count, the shortfall and the items per stratum.

handler:
  module: omnimarket.nodes.node_review_replay_set_effect.handlers.handler_review_replay_set
  class: HandlerReviewReplaySet
  input_model: omnimarket.nodes.node_review_replay_set_effect.models.model_review_replay_set.ModelReviewReplaySetRequest

handler_routing:
  routing_strategy: operation_match
  default_handler: omnimarket.nodes.node_review_replay_set_effect.handlers.handler_review_replay_set:HandlerReviewReplaySet
  handlers:
    - operation: review_replay_set.freeze
      topic: onex.cmd.omnimarket.review-replay-set-freeze-requested.v1
      handler:
        name: HandlerReviewReplaySet
        module: omnimarket.nodes.node_review_replay_set_effect.handlers.handler_review_replay_set
      handler_module: omnimarket.nodes.node_review_replay_set_effect.handlers.handler_review_replay_set
      event_model: omnimarket.nodes.node_review_replay_set_effect.models.model_review_replay_set.ModelReviewReplaySetRequest
    - operation: review_replay_set.freeze_recall_bar
      topic: onex.cmd.omnimarket.review-replay-recall-bar-freeze-requested.v1
      handler:
        name: HandlerReviewReplayFreezeBar
        module: omnimarket.nodes.node_review_replay_set_effect.handlers.handler_review_replay_recall
      handler_module: omnimarket.nodes.node_review_replay_set_effect.handlers.handler_review_replay_recall
      event_model: omnimarket.nodes.node_review_replay_set_effect.models.model_review_replay_recall.ModelFreezeRecallBarRequest
    - operation: review_replay_set.score_recall
      topic: onex.cmd.omnimarket.review-replay-recall-score-requested.v1
      handler:
        name: HandlerReviewReplayRecall
        module: omnimarket.nodes.node_review_replay_set_effect.handlers.handler_review_replay_recall
      handler_module: omnimarket.nodes.node_review_replay_set_effect.handlers.handler_review_replay_recall
      event_model: omnimarket.nodes.node_review_replay_set_effect.models.model_review_replay_recall.ModelReviewReplayRecallRequest

descriptor:
  node_archetype: effect
  purity: effectful
  idempotent: true
  timeout_ms: 600000
  runtime_profiles: [effects]

runtime_dispatch:
  command_topic: onex.cmd.omnimarket.review-replay-set-freeze-requested.v1
  external_trigger: >-
    The replay operator runs onex run-node node_review_replay_set_effect --input <request-json>
    from a lab host. The node's deployment overlay selects the bus on which the command is
    published. Each rollout freezes a set on demand before the first roster is scored.
  terminal_events:
    success: onex.evt.omnimarket.review-replay-set-frozen.v1

terminal_event: onex.evt.omnimarket.review-replay-set-frozen.v1

event_bus:
  subscribe_topics:
    - "onex.cmd.omnimarket.review-replay-set-freeze-requested.v1"
    - "onex.cmd.omnimarket.review-replay-recall-bar-freeze-requested.v1"
    - "onex.cmd.omnimarket.review-replay-recall-score-requested.v1"
  publish_topics:
    - "onex.evt.omnimarket.review-replay-set-frozen.v1"

# The two recall operations are requested by the onex node dispatcher, which publishes each command to its own topic; no node contract
# produces them. Each operation's result is published on its own event topic, so the recall bar and the recall score are read from a
# correlated terminal and not from the frozen-set event. The runtime publishes one terminal (the frozen-set event) on the handler's behalf, so
# the two recall results are declared in published_events, where the runtime's result router reads the topic for each result model (the
# router keys are Model plus the event_type, so event_type omits the Model prefix).
externally_produced_topics:
  - topic: onex.cmd.omnimarket.review-replay-recall-bar-freeze-requested.v1
    producer: "the onex node dispatcher (`onex run-node`), which publishes this operation's command directly -- not a node contract"
  - topic: onex.cmd.omnimarket.review-replay-recall-score-requested.v1
    producer: "the onex node dispatcher (`onex run-node`), which publishes this operation's command directly -- not a node contract"
externally_consumed_topics:
  - onex.evt.omnimarket.review-replay-set-frozen.v1
  - onex.evt.omnimarket.review-replay-recall-bar-frozen.v1
  - onex.evt.omnimarket.review-replay-recall-scored.v1

published_events:
  - event_type: ReviewReplaySetResult
    topic: onex.evt.omnimarket.review-replay-set-frozen.v1
    description: "The frozen set's manifest hash, path, size and strata."
  - event_type: FreezeRecallBarResult
    topic: onex.evt.omnimarket.review-replay-recall-bar-frozen.v1
    description: "Where the recall bar was frozen, its hash and whether it was already frozen."
  - event_type: ReviewReplayRecallResult
    topic: onex.evt.omnimarket.review-replay-recall-scored.v1
    description: "The roster's recall over the frozen set against the frozen bar, and whether it passed."

# The runtime principal reads each operation's command topic and writes its result topic; the broker applies these rows through its own reconcile.
broker_acl_grants:
  - principal: "${ONEX_ACL_RUNTIME_PRINCIPAL}"
    grants:
      - {resource_type: TOPIC, pattern: LITERAL, name: onex.cmd.omnimarket.review-replay-set-freeze-requested.v1, operation: READ}
      - {resource_type: TOPIC, pattern: LITERAL, name: onex.cmd.omnimarket.review-replay-set-freeze-requested.v1, operation: DESCRIBE}
      - {resource_type: TOPIC, pattern: LITERAL, name: onex.cmd.omnimarket.review-replay-recall-bar-freeze-requested.v1, operation: READ}
      - {resource_type: TOPIC, pattern: LITERAL, name: onex.cmd.omnimarket.review-replay-recall-bar-freeze-requested.v1, operation: DESCRIBE}
      - {resource_type: TOPIC, pattern: LITERAL, name: onex.cmd.omnimarket.review-replay-recall-score-requested.v1, operation: READ}
      - {resource_type: TOPIC, pattern: LITERAL, name: onex.cmd.omnimarket.review-replay-recall-score-requested.v1, operation: DESCRIBE}
      - {resource_type: TOPIC, pattern: LITERAL, name: onex.evt.omnimarket.review-replay-set-frozen.v1, operation: WRITE}
      - {resource_type: TOPIC, pattern: LITERAL, name: onex.evt.omnimarket.review-replay-set-frozen.v1, operation: DESCRIBE}
      - {resource_type: TOPIC, pattern: LITERAL, name: onex.evt.omnimarket.review-replay-recall-bar-frozen.v1, operation: WRITE}
      - {resource_type: TOPIC, pattern: LITERAL, name: onex.evt.omnimarket.review-replay-recall-bar-frozen.v1, operation: DESCRIBE}
      - {resource_type: TOPIC, pattern: LITERAL, name: onex.evt.omnimarket.review-replay-recall-scored.v1, operation: WRITE}
      - {resource_type: TOPIC, pattern: LITERAL, name: onex.evt.omnimarket.review-replay-recall-scored.v1, operation: DESCRIBE}

overlay:
  node: node_review_replay_set_effect
  roots_env: ONEX_SKILL_OVERLAY_ROOTS

side_effects:
  reads:
    - git
  writes:
    - filesystem
  posts_to_github: false

host_requirements:
  tools: [git]
  never_in: [ci-runner]

dod_evidence:
  PYTEST_RECALL:
    description: "recall over the replay set is computed against a frozen bar and a roster below it fails; the bar and set hashes are frozen before the first run"
    command: "uv run pytest src/omnimarket/nodes/node_review_replay_set_effect -q"
    pass_criteria: "recall_bar tests and frozen_hash tests pass"
  PYTEST:
    description: "the replay set freezes a stratified set under a stable manifest hash and refuses a tampered one"
    command: "uv run pytest tests/unit/nodes/node_review_replay_set_effect -q"
    pass_criteria: "40 items balanced across repo x size strata, same set same hash, changed diff or seed changes the hash, tampered frozen manifest refused"
