name: node_redeploy_orchestrator
version: "1.0.0"
description: "Post-release runtime redeploy orchestrator — dispatches gate/deploy/readiness commands over the bus."
omnibase_core_compat: ">=0.39.0,<1.0.0"
entry_points:
  onex.nodes:
    node_redeploy_orchestrator: "omnimarket.nodes.node_redeploy_orchestrator"
capabilities:
  standalone: false
  full_runtime: true
  requires_network: true
  requires_repo: false
  requires_secrets: false
  requires_docker: false
  side_effect_class: orchestration
dependencies:
  - "omnibase_core>=0.39.0"
authors: ["OmniNode Platform Team"]
license: "MIT"
tags: ["orchestrator", "deploy", "runtime", "kafka", "promotion-gate", "OMN-13211"]
pack: "release"
display_name: "Redeploy Orchestrator"
node_role: "orchestrator"
