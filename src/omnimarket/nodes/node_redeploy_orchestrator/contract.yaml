# ONEX Node Contract - Redeploy ORCHESTRATOR
#
# Post-release runtime redeploy orchestrator (OMN-13211 / B3). Owns phase
# sequencing but dispatches commands OVER THE BUS — it never constructs sibling
# handlers in-process, never runs an in-process FSM loop, and never does I/O.
# Replaces the bespoke node_redeploy HandlerRedeployWorkflowRunner.
---
name: node_redeploy_orchestrator
contract_version: {major: 1, minor: 0, patch: 0}
node_type: orchestrator
node_version: {major: 1, minor: 0, patch: 0}

description: >
  Post-release runtime redeploy orchestrator. On redeploy-start it emits the
  prod-promotion-gate-evaluate command (the gate runs BEFORE any deploy effect so
  a bad prod request is rejected before the agent is invoked). On the gate
  decision it emits the deploy-publish command (allowed) threading the resolved
  digest + rollback target, or redeploy-completed with final_phase=BLOCKED
  (denied). Non-prod lanes pass the gate trivially, so one dispatch path serves
  dev / stability-test / prod. The orchestrator consumes the deploy effect's
  completion / rolled-back facts; it publishes the readiness-gate-start command
  and the terminal redeploy-completed event. No
  in-process handler construction, no FSM loop, no I/O.

# OMN-16939. routing_strategy is topic_match with ONE entry per topic, each declaring
# its own message_category, because handler_wiring derives an entry's category ONCE —
# explicit message_category, else _derive_message_category(subscribe_topics[0]) — and
# stamps it on every route that entry registers. subscribe_topics[0] here is a .cmd.
# topic, so the previous single operation_match entry registered all nine routes under
# 'command' and every .evt. topic (arriving as 'event') matched zero routes: consumed,
# DLQ'd and COMMITTED on every message, at LAG 0, forever. Measured on the .201 dev lane
# 2026-09-06: 30 gate decisions in, 30 to the DLQ, redeploy-deploy-publish at
# high-watermark 0. Setting `topic:` alone is NOT enough — that picks WHICH topic an
# entry owns; `message_category:` picks which category it registers under.
#
# The five topics below are the redeploy FSM's merge-to-rebuild path plus its failure
# outcome. Readiness-gate outcomes and runtime attestations are not subscribed here:
# the handler has no branch for them, so declaring them would consume and DLQ live
# traffic rather than advancing the redeploy FSM.
handler_routing:
  routing_strategy: topic_match
  handlers:
    - topic: onex.cmd.omnimarket.redeploy-start.v1
      message_category: command
      operation: "redeploy.orchestrate"
      handler:
        name: HandlerRedeployOrchestrator
        module: omnimarket.nodes.node_redeploy_orchestrator.handlers.handler_redeploy_orchestrator
      description: "Start command: route to the grant resolver (prod) or the gate (non-prod)."
    - topic: onex.evt.omnimarket.runtime-image-built.v1
      message_category: event
      operation: "redeploy.orchestrate"
      handler:
        name: HandlerRedeployOrchestrator
        module: omnimarket.nodes.node_redeploy_orchestrator.handlers.handler_redeploy_orchestrator
      description: "OMN-13655 cloud CI build-complete: coerce to a start and route to the gate."
    - topic: onex.evt.omnimarket.prod-promotion-grant-resolved.v1
      message_category: event
      operation: "redeploy.orchestrate"
      handler:
        name: HandlerRedeployOrchestrator
        module: omnimarket.nodes.node_redeploy_orchestrator.handlers.handler_redeploy_orchestrator
      description: "OMN-13439 Phase 2b: thread the out-of-band grant into the gate command."
    - topic: onex.evt.omnimarket.prod-promotion-gate-evaluated.v1
      message_category: event
      operation: "redeploy.orchestrate"
      handler:
        name: HandlerRedeployOrchestrator
        module: omnimarket.nodes.node_redeploy_orchestrator.handlers.handler_redeploy_orchestrator
      description: "Gate decision: emit the deploy-publish command, or complete BLOCKED."
    - topic: onex.evt.omnimarket.redeploy-rolled-back.v1
      message_category: event
      operation: "redeploy.orchestrate"
      handler:
        name: HandlerRedeployOrchestrator
        module: omnimarket.nodes.node_redeploy_orchestrator.handlers.handler_redeploy_orchestrator
      description: "Rollback fact: emit the terminal redeploy-completed:ROLLED_BACK."

handler:
  module: omnimarket.nodes.node_redeploy_orchestrator.handlers.handler_redeploy_orchestrator
  class: HandlerRedeployOrchestrator
  input_model: omnimarket.nodes.node_redeploy_orchestrator.models.model_redeploy_start_command.ModelRedeployStartCommand

input_model:
  name: ModelRedeployStartCommand
  module: omnimarket.nodes.node_redeploy_orchestrator.models.model_redeploy_start_command
  description: "Start command carrying deploy request + prod-promotion facts."
output_model:
  name: ModelRedeployCompletedEvent
  module: omnimarket.events.runtime_deployment
  description: "Terminal redeploy event (DONE | BLOCKED | FAILED)."

descriptor:
  node_archetype: orchestrator
  purity: orchestration
  idempotent: false
  timeout_ms: 660000
  runtime_profiles:
    - effects

terminal_event: onex.evt.omnimarket.redeploy-completed.v1

event_bus:
  subscribe_topics:
    - onex.cmd.omnimarket.redeploy-start.v1
    # OMN-13655: build-complete event from cloud CI; orchestrator coerces it into
    # a ModelRedeployStartCommand and routes through the prod-promotion gate path.
    - onex.evt.omnimarket.runtime-image-built.v1
    # OMN-13439 Phase 2b: consume the out-of-band grant resolution before the gate.
    - onex.evt.omnimarket.prod-promotion-grant-resolved.v1
    - onex.evt.omnimarket.prod-promotion-gate-evaluated.v1
    # Deploy effect completion + rollback facts.
    - onex.evt.omnimarket.redeploy-rolled-back.v1
  publish_topics:
    # OMN-13439 Phase 2b: resolve the grant from onex_change_control@main first.
    - onex.cmd.omnimarket.prod-promotion-grant-resolve.v1
    - onex.cmd.omnimarket.prod-promotion-gate-evaluate.v1
    - onex.cmd.omnimarket.redeploy-deploy-publish.v1
    - onex.evt.omnimarket.redeploy-phase-transition.v1
    - onex.evt.omnimarket.redeploy-completed.v1
    # OMN-12577 readiness handoff: start the readiness gate scoring.
    - onex.cmd.omnimarket.readiness-gate-start.v1

config_fields:
  # === Runtime lane health URLs (OMN-12807) ===
  # Semicolon-separated HTTP health-check URLs probed after each deploy phase.
  # Resolved from overlay env vars; the orchestrator reads them via lane_target()
  # which calls _resolve_health_targets() and fails closed when the var is absent.
  runtime_dev_health_urls:
    default: "${env.RUNTIME_DEV_HEALTH_URLS}"
    description: >
      Dev-lane runtime health-check URLs (semicolon-separated).
      Overlay binds RUNTIME_DEV_HEALTH_URLS.
      Example: "http://omninode-runtime:8085/health;http://runtime-effects:8086/health"
  runtime_stability_health_urls:
    default: "${env.RUNTIME_STABILITY_HEALTH_URLS}"
    description: >
      Stability-test-lane runtime health-check URLs (semicolon-separated).
      Overlay binds RUNTIME_STABILITY_HEALTH_URLS.
      Example: "http://omninode-runtime:18085/health;http://runtime-effects:18086/health"
  runtime_prod_health_urls:
    default: "${env.RUNTIME_PROD_HEALTH_URLS}"
    description: >
      Prod-lane runtime health-check URLs (semicolon-separated).
      Overlay binds RUNTIME_PROD_HEALTH_URLS.
      Example: "http://omninode-runtime:28085/health;http://runtime-effects:28086/health"

dependencies:
  packages:
    - "omnibase_core>=0.39.0"

metadata:
  transport_type: kafka
  description: "Post-release runtime redeploy orchestrator"
  author: "OmniNode Platform Team"
  related_tickets:
    - "OMN-13211"
    - "OMN-12577"
    - "OMN-12581"
    - "OMN-13439"
    - "OMN-12807"
    - "OMN-13655"
