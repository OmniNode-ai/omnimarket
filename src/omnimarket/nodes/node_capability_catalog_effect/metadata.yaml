name: node_capability_catalog_effect
version: 1.0.0
description: Collects lab hosts, lanes, model servers and host-local tools read-only, renders the catalog views byte-deterministically, and publishes the full view to the knowledge base when the catalog's structure changes.
pack: operator_tooling
node_role: effect
display_name: Capability Catalog Effect
omnibase_core_compat: '>=0.39.0,<1.0.0'
entry_points:
  onex.nodes:
    node_capability_catalog_effect: omnimarket.nodes.node_capability_catalog_effect
capabilities:
  standalone: true
  full_runtime: false
  requires_network: true
  requires_repo: true
  requires_secrets: false
  requires_docker: false
  side_effect_class: write
dependencies:
- pydantic>=2.0
- pyyaml>=6.0
authors:
- OmniNode Platform Team
license: MIT
tags:
- effect
- capability-catalog
- hosts
- lanes
