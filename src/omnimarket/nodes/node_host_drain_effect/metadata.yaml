name: node_host_drain_effect
version: 1.0.0
description: A drain verb that takes one host out of placement (running lanes finish) and an idle-only runner stop that never stops a runner holding a job.
pack: operator_tooling
node_role: effect
display_name: Host Drain Effect
omnibase_core_compat: '>=0.39.0,<1.0.0'
entry_points:
  onex.nodes:
    node_host_drain_effect: omnimarket.nodes.node_host_drain_effect
capabilities:
  standalone: true
  full_runtime: false
  requires_network: false
  requires_repo: false
  requires_secrets: false
  requires_docker: false
  side_effect_class: write
dependencies:
- pydantic>=2.0
- pyyaml>=6.0
- aiokafka>=0.10.0
- omnibase-infra>=0.1.0
authors:
- OmniNode Platform Team
license: MIT
tags:
- effect
- hosts
- drain
- runner
