name: node_lab_disk_hygiene_effect
contract_version:
  major: 1
  minor: 0
  patch: 0
node_type: effect
node_version:
  major: 1
  minor: 0
  patch: 0
description: >
  Docker hygiene on a lab host, census-aware: removes exited containers
  that belong to no declared lane and to no compose project with a running container,
  prunes unused images past an age bar, caps the build cache, and prunes anonymous
  volumes. Called in process by a host scheduler; the census path comes from the
  request or the deployment overlay.
handler_routing:
  routing_strategy: operation_match
  handlers:
  - operation: run_lab_disk_hygiene
    handler:
      name: HandlerLabDiskHygiene
      module: omnimarket.nodes.node_lab_disk_hygiene_effect.handlers.handler_lab_disk_hygiene
    input_model: omnimarket.nodes.node_lab_disk_hygiene_effect.models.model_lab_disk_hygiene_request.ModelLabDiskHygieneRequest
    output_model: omnimarket.nodes.node_lab_disk_hygiene_effect.models.model_lab_disk_hygiene_result.ModelLabDiskHygieneResult
descriptor:
  node_archetype: effect
  purity: effectful
  idempotent: true
  side_effects:
  - docker rm of exited containers outside every declared lane and every running compose
    project
  - docker image prune of unused images older than the configured bar
  - docker builder prune down to the configured build cache cap
  - docker volume prune of anonymous volumes (Docker 23 and later only)
metadata:
  ticket: OMN-20712
  origin_tickets:
  - OMN-17427
  transport_type: in_process
lifecycle: experimental
