#
# ONEX Node Contract
# Node: NodePlanReviewLadderCompute
#
# The next move of a plan's review ladder, as a pure definition-B compute:
#
#   handle(ModelPlanReviewLadderRequest) -> ModelPlanReviewLadderResult
#
# From the plan's first-slice verdict and its review history it decides the next
# move: whole-plan rounds stop once no blocking finding is open (a finding kind
# not named in blocking_kinds never blocks), then the first slice alone is
# reviewed until a round is clean, then each later rung when it is next. A rung
# is done once its LATEST later_rung round closed with no open finding.
# No clock, no I/O, no model.
name: "node_plan_review_ladder_compute"
contract_name: "node_plan_review_ladder_compute"
node_name: "node_plan_review_ladder_compute"
lifecycle: experimental
node_type: "COMPUTE_GENERIC"
contract_version:
  major: 0
  minor: 1
  patch: 0
node_version:
  major: 0
  minor: 1
  patch: 0
description: >
  Pure definition-B decision of a plan in review: what the review ladder does
  next. A first-slice verdict other than ok returns the plan to its author;
  with no round yet the first whole-plan round starts; whole-plan rounds
  repeat while an open blocking finding remains and stop in favour of the
  first slice once none does; a clean first-slice round hands over to the
  first pending later rung, an open finding in the first slice keeps it under
  review; a later rung with an open finding repeats, a clean one moves to the
  next pending rung or completes the plan. Deterministic in the history and
  settings alone.
input_model:
  name: "ModelPlanReviewLadderRequest"
  module: "omnimarket.nodes.node_plan_review_ladder_compute.models.model_plan_review_ladder"
  description: "The plan's first-slice verdict, its review history, its later rungs and the settings in force."
output_model:
  name: "ModelPlanReviewLadderResult"
  module: "omnimarket.nodes.node_plan_review_ladder_compute.models.model_plan_review_ladder"
  description: "The next move, the scope and rung it covers, the open blocking count and one plain sentence."
handler:
  module: "omnimarket.nodes.node_plan_review_ladder_compute.handlers.handler_plan_review_ladder"
  class: "HandlerPlanReviewLadder"
  input_model: "omnimarket.nodes.node_plan_review_ladder_compute.models.model_plan_review_ladder.ModelPlanReviewLadderRequest"
handler_routing:
  routing_strategy: "operation_match"
  default_handler: "omnimarket.nodes.node_plan_review_ladder_compute.handlers.handler_plan_review_ladder:HandlerPlanReviewLadder"
  handlers:
    - operation: "decide_plan_review_ladder"
      handler:
        name: "HandlerPlanReviewLadder"
        module: "omnimarket.nodes.node_plan_review_ladder_compute.handlers.handler_plan_review_ladder"
# Addressable the way the other directly-invoked compute nodes are; the topics are
# declared here and no caller publishes the command until the plan-review flow switches.
runtime_dispatch:
  command_topic: "onex.cmd.omnimarket.plan-review-ladder-decide-requested.v1"
  terminal_events:
    success: "onex.evt.omnimarket.plan-review-ladder-decide-completed.v1"
    failure: "onex.evt.omnimarket.plan-review-ladder-decide-failed.v1"
descriptor:
  node_archetype: compute
  purity: pure
  idempotent: true
  timeout_ms: 5000
replay:
  deterministic: true
metadata:
  description: "The next move of a plan's review ladder."
  author: "OmniNode Team"
  license: "MIT"
  created: "2026-11-15"
  tags:
    - compute
    - plan-review
    - pure
# The settings the overlay fills (every key required there); this section is the
# packaged default load_settings reads when no overlay is configured.
config:
  blocking_kinds:
    - wrong_fact
    - cannot_build_or_test
    - contradicts_ruling
