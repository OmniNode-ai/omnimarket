name: node_dev_merge_redeploy_trigger_effect
version: "0.1.0"
description: "Effect: when a configured repository merges to dev, decide whether the merge reaches the dev lane's runtime, publish the redeploy-start command, read the lane back and publish one receipt. Hosted by a serve process on a lab host, never by a CI runner or a shared runtime."
pack: pipeline
node_role: effect
display_name: "Dev Merge Redeploy Trigger and Verify (lab host)"
omnibase_core_compat: ">=0.39.0,<1.0.0"
entry_points:
  onex.nodes:
    node_dev_merge_redeploy_trigger_effect: "omnimarket.nodes.node_dev_merge_redeploy_trigger_effect"
capabilities:
  standalone: false
  full_runtime: false
  requires_network: true
  requires_repo: true
  requires_secrets: false
  requires_docker: false
  side_effect_class: write
dependencies:
  - "click>=8.1.0"
  - "pyyaml>=6.0"
authors: ["OmniNode Platform Team"]
license: "MIT"
tags: ["effect", "redeploy", "OMN-22478"]
