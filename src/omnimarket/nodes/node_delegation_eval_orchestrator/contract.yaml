---
name: delegation_eval_orchestrator
contract_version: {major: 1, minor: 0, patch: 0}
node_type: orchestrator
node_version: {major: 1, minor: 0, patch: 0}
runtime_profiles: [main]
input_model: omnimarket.events.delegation_eval.ModelLabelRecordRequest
output_model: omnimarket.nodes.node_delegation_eval_orchestrator.models.model_label_record.ModelLabelRecordResult
description: >
  OMN-19790. Definition-B label-record operation. An injected tenant-bound
  ProtocolDelegationEventSnapshot supplies delegation_events snapshots.
  Scrubs both prompt and response before building the labelled-item payload.
  The runtime publishes the returned payload; this stateless handler owns
  no transport. Prompt/response content lives on the lab table only because
  omnimarket is public. The run operation (OMN-19793, EV.4) is its own node,
  node_delegation_eval_run_orchestrator, so each command has one terminal.
  Committed lab command for both: python -m omnimarket.nodes.node_delegation_eval_orchestrator.lab_run.
handler:
  module: omnimarket.nodes.node_delegation_eval_orchestrator.handlers.handler_delegation_eval_orchestrator
  class: HandlerDelegationEvalOrchestrator
handler_routing:
  routing_strategy: operation_match
  handlers:
    - operation: label-record
      handler:
        name: HandlerDelegationEvalOrchestrator
        module: omnimarket.nodes.node_delegation_eval_orchestrator.handlers.handler_delegation_eval_orchestrator
      handler_module: omnimarket.nodes.node_delegation_eval_orchestrator.handlers.handler_delegation_eval_orchestrator
event_bus:
  subscribe_topics:
    - onex.cmd.omnimarket.delegation-eval-label-record.v1
  publish_topics:
    - onex.evt.omnimarket.delegation-eval-item-labelled.v1
terminal_event: onex.evt.omnimarket.delegation-eval-item-labelled.v1
# Invoking runtimes bind the tenant-scoped snapshot port before dispatch.
runtime_dispatch:
  command_topic: onex.cmd.omnimarket.delegation-eval-label-record.v1
  terminal_events:
    success: onex.evt.omnimarket.delegation-eval-item-labelled.v1
metadata:
  transport_type: kafka
