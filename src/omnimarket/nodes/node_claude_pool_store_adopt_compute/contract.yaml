name: node_claude_pool_store_adopt_compute
lifecycle: experimental
node_type: compute
contract_version: {major: 1, minor: 0, patch: 0}
node_version: "1.0.0"
description: >-
  Decides which Claude token-pool labels held on a lab host are outside the secret
  store and must be adopted into it, so the refill can hand every label to every host:
  a label held and live on a host with no value in the store gets one typed adopt
  command (source host, store key, fingerprint); a label whose hosts disagree on the
  fingerprint, whose store value differs from the host's, or that is revoked on every
  host that holds it is refused with a typed reason and never overwritten. Pure compute
  over fingerprints and labels; the handler reads no clock and no value.
input_model:
  name: ModelStoreAdoptRequest
  module: omnimarket.models.model_claude_pool_store_adopt
output_model:
  name: ModelStoreAdoptResult
  module: omnimarket.models.model_claude_pool_store_adopt
handler:
  module: omnimarket.nodes.node_claude_pool_store_adopt_compute.handlers.handler_store_adopt
  class: HandlerStoreAdopt
  input_model: omnimarket.models.model_claude_pool_store_adopt.ModelStoreAdoptRequest
  output_model: omnimarket.models.model_claude_pool_store_adopt.ModelStoreAdoptResult
handler_routing:
  routing_strategy: operation_match
  default_handler: omnimarket.nodes.node_claude_pool_store_adopt_compute.handlers.handler_store_adopt:HandlerStoreAdopt
  handlers:
    - operation: decide_store_adopt
      handler:
        name: HandlerStoreAdopt
        module: omnimarket.nodes.node_claude_pool_store_adopt_compute.handlers.handler_store_adopt
descriptor:
  node_archetype: compute
  purity: pure
  idempotent: true
  timeout_ms: 500
  runtime_profiles: []
runtime_dispatch:
  addressable: false
  invocation_mode: local
  reason: Called in process by the Claude token pool rotation tick; no bus topic reaches it.
  external_trigger: node_claude_token_pool_effect rotation tick (in-process call)
# The node publishes nothing: the pool tick calls it in process.
event_bus:
  subscribe_topics: []
  publish_topics: []
metadata:
  transport_type: local
  description: Claude token pool store adopt compute
  author: OmniNode Team
  created: "2026-11-10"
  related_tickets: [OMN-23887]
