# Synthetic values. The deployment's overlay lives at <root>/node_c32_auth_boundary_probe_effect/overlay.yaml
# under a root named in ONEX_SKILL_OVERLAY_ROOTS, or the file ONEX_C32_PROBE_OVERLAY names. No key has a default.
default_profile: inmemory
history_file: c32-runs.jsonl
history_keep: 60
result_topic: onex.evt.omnimarket.local-auth-boundary-probe-completed.v1
profiles:
  inmemory:
    kind: inmemory
  local:
    kind: local
    onex_bin_dir: /example/venv/bin
    graded_packages: [example-core, example-market]
  tick:
    kind: tick
    graded_packages: [example-core, example-market]
