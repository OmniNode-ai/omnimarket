---
name: projection_pr_state
contract_version:
  major: 1
  minor: 0
  patch: 0
node_type: reducer
node_version:
  major: 1
  minor: 0
  patch: 0
input_model: omnimarket.nodes.node_projection_pr_state.models.model_pr_state_fold_request.ModelPrStateFoldRequest
description: 'OMN-19999. Rule 7a: HandlerProjectionPrState is the pure definition-B fold; PrStateProjectionWriter persists its result with in-process dispatch. A guarded upsert retains the maximum (observed_at, digest) per (repo, pr_number), including closed and merged rows.'
runtime_lanes:
- compose-dev
- onex-lab
- onex-lab-k3s
handler:
  module: omnimarket.nodes.node_projection_pr_state.handlers.pr_state_fold
  class: HandlerProjectionPrState
handler_routing:
  routing_strategy: operation_match
  handlers:
  # Only the writer is routed (OMN-19833). A routed pure fold is handed the raw
  # event beside the writer, cannot report a write, and fails or runs on defaults
  # when its request wraps the event. The writer calls the fold in process (rule 7a).
  - operation: pr_state_projection_writer
    handler:
      name: PrStateProjectionWriter
      module: omnimarket.nodes.node_projection_pr_state.handlers.handler_pr_state_projection
    handler_module: omnimarket.nodes.node_projection_pr_state.handlers.handler_pr_state_projection
terminal_event: onex.evt.omnimarket.projection-pr-state-applied.v1
descriptor:
  node_archetype: reducer
  purity: pure
  idempotent: true
  timeout_ms: 30000
event_bus:
  subscribe_topics:
  - onex.evt.omnimarket.pr-state-observed.v1
  publish_topics:
  - onex.evt.omnimarket.projection-pr-state-applied.v1
  dlq_topics:
  - onex.dlq.omnimarket.projection-pr-state-malformed.v1
externally_consumed_topics:
- onex.evt.omnimarket.projection-pr-state-applied.v1
projection_api:
  expose: true
  topic: onex.snapshot.projection.pr-state.v1  # onex-topic-allow: projection snapshot topics use onex.snapshot.* prefix by convention
  topic_config:
    kafka_config:
      "cleanup.policy": "compact"
  route_aliases:
    - pr_state
  key_grain: mutable
  table: pr_state
  # The loader's schema field records the DATABASE the relation lives in; the
  # physical relation is omninode_internal.pr_state (db_io below).
  schema: omnidash_analytics
  columns:
    - repo
    - pr_number
    - state
    - head_sha
    - base
    - head_ref
    - title
    - draft
    - author
    - author_is_bot
    - labels
    - armed
    - queued
    - watcher_class
    - ci_verdict
    - red_contexts
    - pending_contexts
    - ci_read_at
    - merged_at
    - observed_at
  json_columns:
    - labels
    - red_contexts
    - pending_contexts
  order_by: observed_at DESC
  page_selection: order_by
  freshness_column: observed_at
  cursor_column: observed_at
  limit: 500
  bus_backed: true
  key_columns:
    - repo
    - pr_number
db_io:
  db_tables:
  - name: pr_state
    database_ref: application
    schema: omninode_internal
    migration: 0000_create_pr_state.sql
    access: write
    role: pr_state
  idempotency_key: repo,pr_number,observed_at,digest
metadata:
  transport_type: kafka
