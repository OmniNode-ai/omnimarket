name: code_quarantine_effect
version: "1.0.0"
description: "Quarantines unused code with its tests, restores it and resets the clock on a red build, lab start or missing reading, and removes it only with a git tag and a catalog row."
omnibase_core_compat: ">=0.39.0,<1.0.0"
entry_points:
  onex.nodes:
    node_code_quarantine_effect: omnimarket.nodes.node_code_quarantine_effect
capabilities:
  standalone: true
  full_runtime: false
  requires_network: false
  requires_repo: true
  requires_secrets: false
  requires_docker: false
  side_effect_class: write
dependencies:
  - "omnibase_core>=0.39.0"
  - "pyyaml>=6.0"
  - "pydantic>=2.0"
tags: [effect, quarantine, removal]
pack: "lean"
display_name: "Effect: Code Quarantine"
node_role: "effect"
license: "MIT"
