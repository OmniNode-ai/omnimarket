# ONEX Node Contract - Branch deploy command EFFECT
#
# Publishes the deploy agent's HMAC-signed rebuild command on the bus, through an injected event bus. The node builds
# the command's wire envelope from a typed request and the overlay, signs it with the key the runtime fills from the
# secret store under the name the overlay gives, and publishes it to the deploy agent's command topic. The deploy
# agent's network API (port 8098) has read routes only, so the command reaches it over the bus, as the standalone
# service redeploy node and the redeploy publish monitor already do. No trigger script, env file or ssh key is used.
---
name: node_branch_deploy_command_effect
contract_version: {major: 1, minor: 0, patch: 0}
node_type: effect
node_version: {major: 1, minor: 0, patch: 0}

description: >
  Branch deploy command effect. Builds the deploy agent's rebuild command envelope from a typed request and the overlay,
  signs it with the signing key named by the overlay, and publishes it to the deploy agent's command topic. When the
  overlay configures the key check, it reads the deploy agent's health page before it publishes and compares the agent's
  key check value with the check value of its own signing key (OMN-24396). A published command is status published; a
  missing signing key, a signing key that differs from the agent's, an unreadable health page, a page with no key check
  value and an overlay that configures only part of the check are each refused before anything is published; a publish error is failed with the error class as detail. The
  detail is cut to the overlay bound.

handler_routing:
  routing_strategy: payload_type_match
  handlers:
    - event_model:
        name: ModelBranchDeployCommandRequest
        module: omnimarket.nodes.node_branch_deploy_command_effect.models.model_branch_deploy_command
      handler:
        name: HandlerBranchDeployCommand
        module: omnimarket.nodes.node_branch_deploy_command_effect.handlers.handler_branch_deploy_command

handler:
  module: omnimarket.nodes.node_branch_deploy_command_effect.handlers.handler_branch_deploy_command
  class: HandlerBranchDeployCommand
  input_model: omnimarket.nodes.node_branch_deploy_command_effect.models.model_branch_deploy_command.ModelBranchDeployCommandRequest

input_model:
  name: ModelBranchDeployCommandRequest
  module: omnimarket.nodes.node_branch_deploy_command_effect.models.model_branch_deploy_command
  description: "The correlation id, mode, runtime lane, repo, PR number, git ref, image ref, rollback actor, rollback reason, and requested by."
output_model:
  name: ModelBranchDeployCommandResult
  module: omnimarket.nodes.node_branch_deploy_command_effect.models.model_branch_deploy_command
  description: "The result: correlation id, mode, status, and detail."

descriptor:
  node_archetype: effect
  purity: impure
  idempotent: false
  timeout_ms: 300000
  runtime_profiles: [effects]
  side_effects: [bus-publish]

terminal_event: onex.evt.omnimarket.branch-deploy-command-completed.v1

runtime_dispatch:
  command_topic: onex.cmd.omnimarket.branch-deploy-command-requested.v1

broker_acl_grants:
  - principal: "${ONEX_ACL_BRANCH_DEPLOY_PRINCIPAL}"
    grants:
      - {resource_type: TOPIC, pattern: LITERAL, name: onex.cmd.omnimarket.branch-deploy-command-requested.v1, operation: READ}
      - {resource_type: TOPIC, pattern: LITERAL, name: onex.cmd.omnimarket.branch-deploy-command-requested.v1, operation: DESCRIBE}
      - {resource_type: TOPIC, pattern: LITERAL, name: onex.evt.omnimarket.branch-deploy-command-completed.v1, operation: WRITE}
      - {resource_type: TOPIC, pattern: LITERAL, name: onex.evt.omnimarket.branch-deploy-command-completed.v1, operation: DESCRIBE}
      - {resource_type: TOPIC, pattern: LITERAL, name: onex.cmd.deploy.rebuild-requested.v1, operation: WRITE}
      - {resource_type: TOPIC, pattern: LITERAL, name: onex.cmd.deploy.rebuild-requested.v1, operation: DESCRIBE}
event_bus:
  subscribe_topics:
    - onex.cmd.omnimarket.branch-deploy-command-requested.v1
  publish_topics:
    - onex.evt.omnimarket.branch-deploy-command-completed.v1
    - onex.cmd.deploy.rebuild-requested.v1

externally_consumed_topics:
  - onex.evt.omnimarket.branch-deploy-command-completed.v1
  - onex.cmd.deploy.rebuild-requested.v1

secret_dependencies:
  DEPLOY_AGENT_HMAC_SECRET:
    required: true
    description: "Shared HMAC secret the deploy agent verifies on every command; the overlay's hmac_secret_env names the variable the runtime fills from the secret store. Its one-way check value is compared with the deploy agent's health page before every publish."

dependencies:
  packages:
    - "omnibase_core>=0.39.0"

metadata:
  transport_type: kafka
  description: "Branch deploy command effect"
  author: "OmniNode Platform Team"
  related_tickets:
    - "OMN-24027"
