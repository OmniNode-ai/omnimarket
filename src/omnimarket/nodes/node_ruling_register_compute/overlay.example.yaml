# Synthetic values. A deployment's real overlay lives in the overlays repository.
max_reading_age_seconds: 600
# One verdict detail is folded to one printable line of at most this many characters,
# so a read's output can carry no tick line of its own.
max_detail_chars: 120
# The rows may run only what allowed_commands lists. An entry is one shell-style string
# holding an argv prefix: a row is allowed when its read.argv starts token for token with
# one entry's tokens (no path normalisation, no globbing), else it becomes a refused row.
# An entry is an argv prefix: listing "sh -c" allows any shell script, so a deployment
# that lists it trusts its own overlay.
allowed_commands: [example-census-command, example-queue-count]
rows:
  - row_id: example-ruling-live
    ruling: "2026-07-01T10:00:00Z"
    must_be_true: The census command exits zero on host-a
    read:
      host: host-a
      argv: [example-census-command]
      # 1 is the code that reads FALSE; with the bare default (0,) a failing
      # census could only ever read UNREAD.
      ok_exit_codes: [0, 1]
      expect:
        kind: exit_zero
    owner: example-lane
    fix: Re-run the census and page the lane
  - row_id: example-ruling-int
    ruling: "2026-07-02T11:30:00Z"
    must_be_true: The pending queue stays at ten or fewer
    read:
      host: host-a
      argv: [example-queue-count]
      ok_exit_codes: [0]
      expect:
        kind: int_at_most
        bound: 10
    owner: none
    fix: Drain the pending queue
