name: node_overlay_tree_install_effect
version: "1.0.0"
description: "Installs the overlay plugin tree from one commit, checked before and after, with rollback"
omnibase_core_compat: ">=0.39.0,<1.0.0"
entry_points:
  onex.nodes:
    node_overlay_tree_install_effect: "omnimarket.nodes.node_overlay_tree_install_effect"
capabilities:
  standalone: true
  full_runtime: true
  requires_network: false
  requires_repo: true
  requires_secrets: false
  requires_docker: false
  side_effect_class: write
dependencies:
  - "pyyaml>=6.0"
  - "pydantic>=2.0"
authors: ["OmniNode Platform Team"]
license: "MIT"
tags: ["install", "overlay", "branch", "rollback", "effect"]
pack: "install"
display_name: "Overlay Tree Install Effect"
node_role: "effect"
