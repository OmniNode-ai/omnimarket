name: node_dispatch_brief_shape_compute
version: 1.0.0
description: Refuse a remote lane before placement when its brief asks a lab lane
  to mint a ticket, pastes the standing rules block with no task of its own, names a
  pf-drive driver lane with no PR target, or waits for a gate that does not read
  pass.
