# The unresolved step's reads and budgets. A host names its own copy with ONEX_FACTORY_FLOOR_UNRESOLVED_OVERLAY.
reads:
  - {kind: TERMINAL, grep: "outcome=blocked"}
  - {kind: TERMINAL, grep: "outcome=partial"}
  - {kind: TERMINAL, grep: "outcome=handed-off"}
  - {kind: STATUS, grep: "handed-off="}
# How many reads run together (measured: in series they took 207 s of the floor step's 231 s).
read_workers: 4
# One read's bound; the publisher step's own timeout_seconds bounds the pass.
read_timeout_seconds: 120
# The record covers rows this many hours past the window's edge, so it stays whole for that long; the floor's unresolved_max_age_hours must not exceed it.
overlap_hours: 24
