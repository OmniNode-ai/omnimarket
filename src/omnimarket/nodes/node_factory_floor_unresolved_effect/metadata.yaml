name: factory_floor_unresolved_effect
version: "1.0.0"
description: "Reads the unresolved ledger evidence older than the factory floor's window, in parallel, as its own step of the publisher cycle, and writes the record the floor reads."
omnibase_core_compat: ">=0.39.0,<1.0.0"
entry_points:
  onex.nodes:
    node_factory_floor_unresolved_effect: omnimarket.nodes.node_factory_floor_unresolved_effect
capabilities:
  standalone: true
  full_runtime: false
  requires_network: false
  requires_repo: false
  requires_secrets: false
  requires_docker: false
  side_effect_class: write
dependencies:
  - "omnibase_core>=0.39.0"
  - "pyyaml>=6.0"
  - "pydantic>=2.0"
tags: [effect, floor, ledger]
pack: "data"
display_name: "Effect: Factory Floor Unresolved Rows"
node_role: "effect"
license: "MIT"
