name: node_morning_trigger_install_compute
lifecycle: experimental
node_type: compute
runtime_profiles:
- main
contract_version:
  major: 1
  minor: 0
  patch: 0
node_version:
  major: 1
  minor: 0
  patch: 0
description: >-
  Plan what the morning-workflows installer copies for a mode. The lib-only mode refreshes
  only the package lib and reloads no launchd label; the install mode copies the bin and lib
  files and reloads the labels (OMN-24424).
input_model:
  name: ModelMorningInstallRequest
  module: omnimarket.models.model_morning_trigger_install
output_model:
  name: ModelMorningInstallPlan
  module: omnimarket.models.model_morning_trigger_install
handler:
  module: omnimarket.nodes.node_morning_trigger_install_compute.handlers.handler_morning_trigger_install
  class: HandlerMorningTriggerInstall
  input_model: omnimarket.models.model_morning_trigger_install.ModelMorningInstallRequest
  output_model: omnimarket.models.model_morning_trigger_install.ModelMorningInstallPlan
handler_routing:
  routing_strategy: payload_type_match
  handlers:
  - handler:
      name: HandlerMorningTriggerInstall
      module: omnimarket.nodes.node_morning_trigger_install_compute.handlers.handler_morning_trigger_install
    event_model:
      name: ModelMorningInstallRequest
      module: omnimarket.models.model_morning_trigger_install
event_bus:
  subscribe_topics:
  - onex.cmd.omnimarket.morning-trigger-install-requested.v1
  publish_topics:
  - onex.evt.omnimarket.morning-trigger-install-planned.v1
runtime_dispatch:
  command_topic: onex.cmd.omnimarket.morning-trigger-install-requested.v1
descriptor:
  node_archetype: compute
  purity: pure
  idempotent: true
  timeout_ms: 10000
metadata:
  transport_type: kafka
  ticket: OMN-24424
  description: Morning installer copy plan; the mode rules arrive in the request, read from
    the overlay morning_install_policy.yaml.
  tags:
  - morning-workflows
terminal_event: onex.evt.omnimarket.morning-trigger-install-planned.v1
published_events:
- topic: onex.evt.omnimarket.morning-trigger-install-planned.v1
  event_type: ModelMorningInstallPlan
externally_consumed_topics:
- onex.evt.omnimarket.morning-trigger-install-planned.v1

# The broker grants the node's two topics need (coverage gate): the runtime login reads the request and writes the answer.
broker_acl_grants:
  - principal: "${ONEX_ACL_RUNTIME_PRINCIPAL}"
    grants:
      - {resource_type: TOPIC, pattern: LITERAL, name: onex.cmd.omnimarket.morning-trigger-install-requested.v1, operation: READ}
      - {resource_type: TOPIC, pattern: LITERAL, name: onex.cmd.omnimarket.morning-trigger-install-requested.v1, operation: DESCRIBE}
      - {resource_type: TOPIC, pattern: LITERAL, name: onex.evt.omnimarket.morning-trigger-install-planned.v1, operation: WRITE}
      - {resource_type: TOPIC, pattern: LITERAL, name: onex.evt.omnimarket.morning-trigger-install-planned.v1, operation: DESCRIBE}
