---
name: projection_session_outcome
contract_version: {major: 1, minor: 0, patch: 0}
node_type: reducer
node_version: {major: 1, minor: 0, patch: 0}
input_model: omnimarket.nodes.node_projection_session_outcome.handlers.handler_projection_session_outcome.ModelSessionOutcomeEvent
description: >
  Projects session-outcome events into the session_outcomes table.
  UPSERT by session_id (latest-state-wins). Source topic:
  onex.evt.omniclaude.session-outcome.v1.

handler:
  module: omnimarket.nodes.node_projection_session_outcome.handlers.handler_projection_session_outcome
  class: HandlerProjectionSessionOutcome

handler_routing:
  routing_strategy: operation_match
  handlers:
    - handler:
        name: HandlerProjectionSessionOutcome
        module: omnimarket.nodes.node_projection_session_outcome.handlers.handler_projection_session_outcome
      handler_module: omnimarket.nodes.node_projection_session_outcome.handlers.handler_projection_session_outcome
      event_model: omnimarket.nodes.node_projection_session_outcome.handlers.handler_projection_session_outcome.ModelSessionOutcomeEvent
    - handler:
        name: SessionOutcomeProjectionRunner
        module: omnimarket.nodes.node_projection_session_outcome.handlers.handler_session_outcome
      handler_module: omnimarket.nodes.node_projection_session_outcome.handlers.handler_session_outcome

terminal_event: onex.evt.omnimarket.projection-session-outcome-applied.v1

db_io:
  db_tables:
    - name: session_outcomes
      migration: "0021_session_outcomes.sql"
      access: write
      database: omnidash_analytics
      role: outcomes

event_bus:
  subscribe_topics:
    - onex.evt.omniclaude.session-outcome.v1
  publish_topics:
    - onex.evt.omnimarket.projection-session-outcome-applied.v1

metadata:
  transport_type: kafka
