# ONEX Node Contract - Topic Provision Dry Run Effect (OMN-23614)
#
# Reads the contract tree named by the overlay and lists the broker's topics (list only: it never
# creates, alters or deletes a topic), then asks node_topic_provision_plan_compute how many of the
# live topics would exist under the provision rule. The profile, lane manifest, contract roots and
# the name of the environment variable that holds the broker address are overlay values.
name: node_topic_provision_dry_run_effect
contract_name: node_topic_provision_dry_run_effect
node_name: node_topic_provision_dry_run_effect
contract_version: {major: 0, minor: 1, patch: 0}
node_version: {major: 0, minor: 1, patch: 0}
node_type: effect
lifecycle: experimental
runtime_profiles: [effects]

description: >
  The read-only dry run of provision on demand. Returns the plan of the compute node with the live
  topic counts filled in: how many live topics are under the rule, how many are outside it, and how
  many are declared by no contract. The broker is read with list calls only.

  With --apply (python -m ...runtime_topic_provision_dry_run, the one write this node makes) it creates each service writer topic the
  plan names and the broker does not hold, and each publish topic a host-timer contract declares
  (runtime_dispatch.host_unit; a timer is no runtime node, so no boot creates them): for every contract that declares a writer_topics template,
  one topic per declared service login (the service writers overlay, and a broker scope overlay's
  WRITE grant on the topic the template composes), 1 partition and 1 replica. An existing topic is
  accepted; a second run creates nothing.

handler:
  module: omnimarket.nodes.node_topic_provision_dry_run_effect.handlers.handler_topic_provision_dry_run
  class: HandlerTopicProvisionDryRun
  input_model: omnimarket.nodes.node_topic_provision_dry_run_effect.models.model_topic_provision_dry_run_request.ModelTopicProvisionDryRunRequest

# HandlerTopicProvisionDryRun takes the broker topic lister as a constructor parameter, so the node
# runs through its own entry point (python -m ...runtime_topic_provision_dry_run), not handler_routing.
# HandlerWriterTopicApply takes the lister and the creator, so it is bound here, not routed.
entry_point_handlers:
  - operation: apply_writer_topics
    handler:
      name: HandlerWriterTopicApply
      module: omnimarket.nodes.node_topic_provision_dry_run_effect.handlers.handler_writer_topic_apply

descriptor:
  node_archetype: effect
  runtime_profiles: [effects]
  purity: impure
  idempotent: true
  side_effects: [broker-topic-list, broker-topic-create]
  timeout_ms: 120000

input_model:
  name: ModelTopicProvisionDryRunRequest
  module: omnimarket.nodes.node_topic_provision_dry_run_effect.models.model_topic_provision_dry_run_request
  description: The overlay (profile, lane manifest, contract roots) and the rule to apply.
output_model:
  name: ModelTopicProvisionPlan
  module: omnimarket.models.topic_provision.model_topic_provision_plan
  description: The plan with the live topic counts under the rule.

runtime_dispatch:
  external_trigger: true
  # An operator or a service login with create rights runs the apply from the command line; nothing on the bus starts this node.
  on_demand:
    command: uv run python -m omnimarket.nodes.node_topic_provision_dry_run_effect.runtime_topic_provision_dry_run --apply
    owner: OmniNode Platform Team
