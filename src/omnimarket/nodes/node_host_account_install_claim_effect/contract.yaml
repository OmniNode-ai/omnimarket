name: node_host_account_install_claim_effect
lifecycle: experimental
node_type: EFFECT_GENERIC
runtime_profiles:
- effects
contract_version:
  major: 1
  minor: 0
  patch: 0
node_version: 1.0.0
description: Read host facts on every durable goal tick, commit both cursors and an
  exception outbox; never repair credentials.
input_model:
  name: ModelHostCheckTick
  module: omnimarket.models.host_checks
output_model:
  name: ModelHostCheckTickResult
  module: omnimarket.models.host_checks
handler:
  module: omnimarket.nodes.node_host_account_install_claim_effect.handlers.handler_host_account_install_claim
  class: HandlerHostAccountInstallClaim
  input_model: omnimarket.models.host_checks.ModelHostCheckTick
  output_model: omnimarket.models.host_checks.ModelHostCheckTickResult
handler_routing:
  routing_strategy: operation_match
  default_handler: omnimarket.nodes.node_host_account_install_claim_effect.handlers.handler_host_account_install_claim:HandlerHostAccountInstallClaim
  handlers:
  - operation: evaluate_host_account_install_claim_effect
    handler:
      name: HandlerHostAccountInstallClaim
      module: omnimarket.nodes.node_host_account_install_claim_effect.handlers.handler_host_account_install_claim
    input_model: omnimarket.models.host_checks.ModelHostCheckTick
    output_model: omnimarket.models.host_checks.ModelHostCheckTickResult
    topic: onex.cmd.omnimarket.host-account-install-claim-effect-requested.v1
descriptor:
  node_archetype: effect
  runtime_profiles:
  - effects
  purity: effectful
  idempotent: true
  timeout_ms: 120000
runtime_dispatch:
  command_topic: onex.cmd.omnimarket.host-account-install-claim-effect-requested.v1
  terminal_events:
    success: onex.evt.omnimarket.host-account-install-claim-effect-completed.v1
terminal_event: onex.evt.omnimarket.host-account-install-claim-effect-completed.v1
event_bus:
  subscribe_topics:
  - onex.cmd.omnimarket.host-account-install-claim-effect-requested.v1
  publish_topics:
  - onex.evt.omnimarket.host-account-install-claim-effect-completed.v1
  - onex.cmd.omnimarket.exception-emit-requested.v1
  - onex.evt.omnimarket.host-check-cursor-recorded.v1
  - onex.evt.omnimarket.automation-run-observed.v1
published_events:
- event_type: ModelHostCheckTickResult
  topic: onex.evt.omnimarket.host-account-install-claim-effect-completed.v1
  description: Typed state check receipt.
- event_type: ModelExceptionEmitRequest
  topic: onex.cmd.omnimarket.exception-emit-requested.v1
  description: Durable outbox event.
- event_type: ModelHostCheckCursor
  topic: onex.evt.omnimarket.host-check-cursor-recorded.v1
  description: Durable outbox event.
- event_type: ModelAutomationRunObserved
  topic: onex.evt.omnimarket.automation-run-observed.v1
  description: Durable outbox event.
externally_consumed_topics:
- onex.evt.omnimarket.host-account-install-claim-effect-completed.v1
- onex.evt.omnimarket.host-check-cursor-recorded.v1
metadata:
  transport_type: kafka
  description: Host state check
  author: OmniNode Team
  tags:
  - effect
  - host-state
entrypoint:
  name: NodeHostAccountInstallClaimEffect
  module: omnimarket.nodes.node_host_account_install_claim_effect.node
dependencies:
- name: omnimarket.nodes.node_host_account_check_compute
  dependency_type: internal
  description: Pure state check.
  required: true
- name: omnimarket.nodes.node_install_claim_check_compute
  dependency_type: internal
  description: Pure state check.
  required: true
handler_dependencies:
- omnimarket.protocols.protocol_overlay_document.ProtocolOverlayDocument
- omnimarket.protocols.protocol_host_checks.ProtocolHostCheckFacts
- omnimarket.protocols.protocol_host_checks.ProtocolHostCheckJournal
- omnimarket.protocols.protocol_host_checks.ProtocolHostCheckEvents
host_check_topics:
  exception: onex.cmd.omnimarket.exception-emit-requested.v1
  cursor: onex.evt.omnimarket.host-check-cursor-recorded.v1
  liveness: onex.evt.omnimarket.automation-run-observed.v1
external_producers:
- topic: onex.cmd.omnimarket.host-account-install-claim-effect-requested.v1
  producer: The durable goal tick publishes one ModelHostCheckTick per interval with
    a stable tick_id.
prerequisite_reads:
  account: claude auth status --json; project orgId/email hashes through the overlay
    identity table; emit a label only
  install_claim: Broker-attributed STATUS and TERMINAL cells in the append service
    ledger mirror
  service_identity: Each host principals_read returns independently read lane_principals,
    install_principals and check_principal; any overlap or unavailable read yields
    R8 UNREAD on both cursors
