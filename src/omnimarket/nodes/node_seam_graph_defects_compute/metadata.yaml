name: node_seam_graph_defects_compute
version: 1.0.0
description: >-
  Seam graph defects: one pure scan that pins the declared checkouts, reads
  every contract of the declared repos and derives nine seam defect classes
  over the graph. Reports only; changes nothing.
pack: operator_tooling
node_role: compute
display_name: Seam Graph Defects Compute
omnibase_core_compat: '>=0.39.0,<1.0.0'
entry_points:
  onex.nodes:
    node_seam_graph_defects_compute: omnimarket.nodes.node_seam_graph_defects_compute
capabilities:
  # false: the pinned checkouts arrive in the request; the node brings none.
  standalone: false
  # true: the node owns a bus surface (the scan command and its two terminals).
  full_runtime: true
  requires_network: false
  # true: the scan reads the pinned checkouts of the declared repos.
  requires_repo: true
  requires_secrets: false
  requires_docker: false
  side_effect_class: read_only
dependencies: []
authors:
- OmniNode Platform Team
license: MIT
tags:
- compute
- seam-graph
- pure
