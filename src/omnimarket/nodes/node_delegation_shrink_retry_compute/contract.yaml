---
name: node_delegation_shrink_retry_compute
contract_version: {major: 1, minor: 0, patch: 0}
node_type: compute
node_version: {major: 1, minor: 0, patch: 0}
description: >
  Pure definition-B COMPUTE. On a rubric failure decide the next rung of the ladder:
  one configuration swap on the same model and backend, then shrink (split, run the
  units on the same model and backend, recombine, check the whole), then escalate.
  Stateless and deterministic. No model calls or I/O. Verified against the TLA+ model
  in formal/delegation_shrink_retry.

input_model:
  name: ModelShrinkRetryDecisionRequest
  module: omnimarket.models.delegation.model_shrink_retry
output_model:
  name: ModelShrinkRetryDecision
  module: omnimarket.models.delegation.model_shrink_retry

handler:
  module: omnimarket.nodes.node_delegation_shrink_retry_compute.handlers.handler_shrink_retry_policy
  class: HandlerShrinkRetryPolicy
  input_model: omnimarket.models.delegation.model_shrink_retry.ModelShrinkRetryDecisionRequest

handler_routing:
  routing_strategy: operation_match
  handlers:
    - operation: delegation_shrink_retry_decide
      handler:
        name: HandlerShrinkRetryPolicy
        module: omnimarket.nodes.node_delegation_shrink_retry_compute.handlers.handler_shrink_retry_policy

descriptor:
  node_archetype: compute
  purity: pure
  idempotent: true
  timeout_ms: 1000
  runtime_profiles: [main]

runtime_dispatch:
  command_topic: onex.cmd.omnimarket.delegation-shrink-retry-requested.v1
terminal_event: onex.evt.omnimarket.delegation-shrink-retry-decided.v1

event_bus:
  subscribe_topics:
    - onex.cmd.omnimarket.delegation-shrink-retry-requested.v1
  publish_topics:
    - onex.evt.omnimarket.delegation-shrink-retry-decided.v1
externally_consumed_topics:
  - onex.evt.omnimarket.delegation-shrink-retry-decided.v1

metadata:
  transport_type: kafka

ladder:
  order: [config_swap, shrink, escalate]
  config_swap: >
    Only on a failed whole request, only when the caller found a second MET
    configuration for the model, backend, class and band in the capability map,
    and only while config_swaps_used is under the class cap.
  shrink: >
    Only when the split compute found a boundary, the class is decomposable and
    split_depth is under the class cap. A failed unit splits once more under the
    same caps, or escalates alone; unit attempts stop at unit_attempts_per_unit
    times the unit count.
  escalate: >
    A recombined whole that fails its rubric, a request that cannot shrink, or any
    cap reached goes to the next responder in the class chain.
  caps_source: >
    escalation_policy.max_config_swaps, max_split_depth and unit_attempts_per_unit
    in the class contract. A class that declares none shrinks nothing.

inputs:
  task_id: {type: str, required: true}
  task_class: {type: str, required: true}
  scope: {type: str, enum: [whole, unit, recombined], required: true}
  caps: {type: object, required: true, description: May be null; null escalates.}
  config_swaps_used: {type: int}
  split_depth: {type: int}
  splittable: {type: bool}
  second_configuration: {type: object, description: Null skips the swap rung.}
  unit_count: {type: int}
  unit_attempts_used: {type: int}
outputs:
  task_id: {type: str}
  rung: {type: str, enum: [config_swap, shrink, resplit_unit, escalate_unit, escalate_whole]}
  reason: {type: str}
  configuration: {type: object, description: Present only on config_swap.}
