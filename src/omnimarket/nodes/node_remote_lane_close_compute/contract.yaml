name: node_remote_lane_close_compute
contract_version:
  major: 1
  minor: 0
  patch: 0
node_type: compute
node_version:
  major: 1
  minor: 0
  patch: 0
description: >
  Decide how a finished remote lane closes from its engine exit code and final
  message, without I/O: failed, rejected-no-delegation, or the outcome its final
  report declares. A clean exit alone never proves the work is done. Its own
  command topic, apart from the placement decision of node_remote_lane_compute,
  so the runtime seeds this decision's request model. Native engine_output events
  populate a typed usage block; missing measurements remain UNKNOWN. Unfenced
  Contract and Attempt brief lines populate usage identity and ledger_cells for
  the runner to copy into its receipt and CLAIM/TERMINAL rows.
  Accept withdrawn as a declared outcome. Copy an unambiguous withdrawn-by
  message stamp from the declaration into withdrawn_by and ledger_cells for
  the runner's receipt and TERMINAL. Missing or invalid citations remain absent
  so S8 can flag the withdrawn outcome rather than lose it as unknown.
handler_routing:
  routing_strategy: operation_match
  handlers:
  - operation: decide_remote_lane_close
    handler:
      name: HandlerRemoteLaneResult
      module: omnimarket.nodes.node_remote_lane_close_compute.handlers.handler_remote_lane_result
    input_model: omnimarket.models.remote_lane_close.model_remote_lane_result.ModelRemoteLaneResultRequest
    output_model: omnimarket.models.remote_lane_close.model_remote_lane_result.ModelRemoteLaneResult
descriptor:
  node_archetype: compute
  purity: pure
  idempotent: true
  side_effects: []
  runtime_profiles: [main]
event_bus:
  subscribe_topics:
  - onex.cmd.omnimarket.remote-lane-close-requested.v1
  publish_topics:
  - onex.evt.omnimarket.remote-lane-close-decided.v1
terminal_event: onex.evt.omnimarket.remote-lane-close-decided.v1
runtime_dispatch:
  command_topic: onex.cmd.omnimarket.remote-lane-close-requested.v1
externally_consumed_topics:
- onex.evt.omnimarket.remote-lane-close-decided.v1
metadata:
  ticket: OMN-20669
  transport_type: kafka
lifecycle: experimental
config:
  # OMN-23417: the binding of a lane's needs= cell. A deployment overlay (overlay.yaml under a root named in
  # ONEX_SKILL_OVERLAY_ROOTS) may narrow it; the actions are the model enum's values and nothing else.
  needs:
    actions: [rerun, update-branch, close, install, ruling, admin, ticket, release-recut]
    target_pattern: "[A-Za-z0-9][A-Za-z0-9._#/@:-]{0,119}"
    report_chars: 800
    cell_required_outcomes: [blocked, partial]
