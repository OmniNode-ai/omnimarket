name: node_host_installer_registry_units
node_type: EFFECT_GENERIC
version: 1.0.0
lifecycle: experimental
contract_version: {major: 1, minor: 0, patch: 0}
node_version: "1.0.0"
description: >-
  Install a self-contained copied alarm payload, or render and install a launchd (or, for a unit declaring platform systemd, a systemd user service and timer) registry_module_tick unit that runs a node module of a project with
  `uv run --frozen --project <project> python -m <module>`. The project is the canonical registry clone unless the
  unit declares a project path override and the request names a checkout: then the rendered unit runs that checkout,
  which must be a clean git checkout carrying the unit's entry file (and, when the request names an expected
  revision, be at it). The revision the unit runs is read from the checkout and written to the unit's install record
  beside its state directory, so the installed unit records the revision it runs. A unit may also declare
  environment variables whose value is a path the request may override (the installed overlay tree, for the factory
  floor publisher); an override of any other variable is refused. Declared environment inputs are persisted in
  the unit. A unit may declare a config_file: a document rendered from the request (refused when a placeholder is left
  unfilled) and written at the path of the environment variable it names, mode 0600, keeping the differing file it
  replaces. A unit with tick_no_sync prepares its environment at installation and reuses it on each timer tick. A unit that declares
  run_timeout_s runs under a wrapper that ends a hung run and exits 124, because launchd has no run limit for a timer job, and ends its run
  on TERM, INT and HUP, so an unload ends it too. A unit that declares tick_lock_file has a tick that holds that file in its evidence directory
  while it runs: an install or uninstall waits for a running tick to end after the unload, then stops it, and refuses the install of one it cannot stop.
input_model:
  name: ModelRegistryUnitsRequest
  module: omnimarket.nodes.node_host_installer_registry_units.models.model_registry_units
output_model:
  name: ModelRegistryUnitsResult
  module: omnimarket.nodes.node_host_installer_registry_units.models.model_registry_units
handler:
  class: HandlerRegistryUnits
  name: HandlerRegistryUnits
  module: omnimarket.nodes.node_host_installer_registry_units.handlers.handler_registry_units
entrypoint:
  name: NodeHostInstallerRegistryUnits
  module: omnimarket.nodes.node_host_installer_registry_units.node
handler_routing:
  routing_strategy: payload_type_match
  handlers:
    - event_model:
        name: ModelRegistryUnitsRequest
        module: omnimarket.nodes.node_host_installer_registry_units.models.model_registry_units
      handler:
        name: HandlerRegistryUnits
        module: omnimarket.nodes.node_host_installer_registry_units.handlers.handler_registry_units
terminal_event: onex.evt.omnimarket.host-registry-unit-completed.v1
runtime_dispatch:
  command_topic: onex.cmd.omnimarket.host-registry-unit-requested.v1
event_bus:
  subscribe_topics: [onex.cmd.omnimarket.host-registry-unit-requested.v1]
  publish_topics: [onex.evt.omnimarket.host-registry-unit-completed.v1]
externally_consumed_topics: [onex.evt.omnimarket.host-registry-unit-completed.v1]
descriptor:
  node_archetype: effect
  purity: effectful
  idempotent: false
  timeout_ms: 600000
  runtime_profiles: [effects]
metadata:
  transport_type: inmemory
execution:
  deterministic: false
  side_effects: true
# The registry_module_tick units this node renders. Placeholders in `environment` values: {home}, {registry_root},
# {workspace_config_root}, {plans_path}, {marketplace_root} (request inputs, refused when named and not given).
units:
  floor-alarm:
    platform: launchd
    kind: copied_tree
    label: ai.omninode.floor-alarm
    install_directory: .omninode/floor-alarm
    state_directory: .onex_state/floor-alarm
    script: skills/merge-drain/scripts/floor_alarm.py
    interpreter_candidates:
      - /opt/homebrew/bin/python3.13
      - /usr/local/bin/python3.13
    schedule:
      start_interval: 600
      run_at_load: false
    payload_overlay: overlays/floor-alarm.yaml
  factory-floor-publish:
    platform: launchd
    kind: registry_module_tick
    label: ai.omninode.factory-floor-publish
    template: templates/ai.omninode.registry-module-tick.plist.tmpl
    schedule:
      start_interval: 300
      run_at_load: true
      description: every 300 s and at load
    registry_project: omnimarket
    # A run that outlives this many seconds is ended with its process group and exits 124 (run_timeout_s, OMN-22881).
    # The board is stale past its 900 s freshness bound (freshness_max_age_s), so a publish that runs longer than that has already failed the page; a run took more than 7 minutes under the Background clamp and 43 s in the foreground.
    run_timeout_s: 900
    # Not Background (OMN-22699). Measured 2026-11-06 on the launching Mac at load 19 to 21 on 24 cores: the factory floor
    # step took 43 s run in the foreground (profiled) and more than 7 minutes as this unit's tick under the Background clamp,
    # which made one cycle 7 to 10 minutes against a 300 s interval, so a tick was skipped and the page refreshed every 10
    # to 12 minutes.
    process_type: Standard
    # Installation prepares and checks this environment once. A timer tick must
    # not rebuild the editable package on every 300 s invocation.
    tick_no_sync: true
    environment_inputs:
      ONEX_RUNTIME_SSH_HOST: runtime_ssh_host
      # The floor's Phoenix trace reading (node_factory_floor_effect runtime.phoenix_url_env). Not required: unset,
      # the floor draws the Phoenix row unread and says so.
      ONEX_FACTORY_FLOOR_PHOENIX_URL: phoenix_url
      # The lab-state alarm's Slack credentials: the path of the operator's bootstrap env file, from which the alarm reads
      # the two named keys its overlay refers to. Not required: unset, a Slack alarm is refused with a typed reason and
      # goes to the second channel.
      ONEX_ALERT_CHANNEL_ENV_FILE: alert_env_file
      # The name the ledger knows this host by (OMN-23086). The publish cycle's join J5 step appends a ledger row and the
      # friction rollup reads the ledger over the bus; both name the host that writes. The J5 overlay names this variable as
      # its ledger host_env. Required: a unit installed without it ran the J5 step to INDETERMINATE (exit 3) every tick.
      ONEX_LEDGER_HOST_NAME: ledger_host_name
    required_environment_inputs: [ONEX_RUNTIME_SSH_HOST, ONEX_LEDGER_HOST_NAME]
    # The interpreter the unit runs on: the first of these that exists on the host (Apple Silicon, then Intel), passed to
    # uv as `--python`. macOS grants Local Network access per binary, and the uv-managed CPython that `uv run` would
    # otherwise build the project's venv on never gets the grant: under launchd its LAN connections fail with
    # EHOSTUNREACH (measured 2026-11-02, OMN-22171; Operating Rule 11 of the registry CLAUDE.md).
    interpreter_candidates:
      - /opt/homebrew/bin/python3.13
      - /usr/local/bin/python3.13
    module: omnimarket.nodes.node_factory_floor_publish_effect
    entry_file: src/omnimarket/nodes/node_factory_floor_publish_effect/__main__.py
    project_path_override:
      request_field: project_path
      requires: clean git checkout that carries entry_file
    environment_path_overrides:
      - ONEX_SKILL_OVERLAY_ROOTS
      # A reader cut over to the overlay store names its snapshot of the host table here, and the snapshot's
      # directory, because the pool read refuses a table outside its declared roots (OMN-22561).
      - ONEX_LAB_RUN_HOSTS
      - ONEX_LAB_HOST_TABLE_ROOTS
    # OMN-23323: an overlay root is never a worktree; the installer refuses one, in a default or an override.
    environment_refuse_worktree_paths: [ONEX_SKILL_OVERLAY_ROOTS]
    environment:
      # The overlays canonical clone first (the floor's owners map and sources live there), then the plugin's overlays
      # (OMN-23323: the owners map was read from a worktree that worktree triage removed).
      ONEX_SKILL_OVERLAY_ROOTS: "{registry_root}/overlays/overlays:{marketplace_root}/plugins/onex-overlays/overlays"
      ONEX_LAB_RUN_HOSTS: ""
      ONEX_LAB_HOST_TABLE_ROOTS: ""
      ONEX_PLANS_KB_PATH: "{plans_path}"
      CLAUDE_PLUGIN_ROOT: "{marketplace_root}/plugins/omni"
      ONEX_LEDGER_PATH: "{registry_root}/docs/tracking/ROLLING_WORK_LEDGER.md"
      # The ledger over the bus (OMN-23086): the append command the J5 step writes its row with, and the read command it and the
      # friction rollup read the ledger back with. The J5 overlay names both variables as its ledger command_env and
      # projection read command_env; the commands are the ones the other ledger-writing units run.
      ONEX_LEDGER_BUS_APPEND_COMMAND: "{registry_root}/omnimarket/.venv/bin/python -m omnimarket.work_ledger_bus.cli append --bus-lane dev --omnibase-path {registry_root}"
      ONEX_LEDGER_BUS_READ_COMMAND: "{registry_root}/omnibase_infra/.venv/bin/onex ledger query --stdin"
      ONEX_STATE_DIR: "{registry_root}/.onex_state"
      ONEX_WORKSPACE_CONFIG_ROOT: "{workspace_config_root}"
      # The landing controller's state directory: the floor's running comparison reads its decisions file (OMN-23018).
      LANDING_STATE_DIR: "{home}/.local/state/omni/landing"
    evidence_file: .local/state/omni/factory-floor-publish/last-run.json
    state_directory: .onex_state/factory-floor-publish
  # A host's reader of the overlay store (OMN-22561): refreshes each overlay this host keeps and writes the fleet
  # record the floor reads. Which overlays, which store and how old is too old are its overlay.
  overlay-store-refresh:
    platform: launchd
    kind: registry_module_tick
    label: ai.omninode.overlay-store-refresh
    template: templates/ai.omninode.registry-module-tick.plist.tmpl
    schedule:
      start_interval: 300
      run_at_load: true
      description: every 300 s and at load
    registry_project: omnimarket
    tick_no_sync: true
    interpreter_candidates:
      - /opt/homebrew/bin/python3.13
      - /usr/local/bin/python3.13
    module: omnimarket.nodes.node_overlay_store_read_effect.runtime_overlay_store_tick
    entry_file: src/omnimarket/nodes/node_overlay_store_read_effect/runtime_overlay_store_tick.py
    project_path_override:
      request_field: project_path
      requires: clean git checkout that carries entry_file
    environment_path_overrides:
      - ONEX_SKILL_OVERLAY_ROOTS
      - LAB_WORK_HOST_NAME
    # OMN-23323: an overlay root is never a worktree; the installer refuses one, in a default or an override.
    environment_refuse_worktree_paths: [ONEX_SKILL_OVERLAY_ROOTS]
    environment:
      ONEX_SKILL_OVERLAY_ROOTS: "{marketplace_root}/plugins/onex-overlays/overlays"
      LAB_WORK_HOST_NAME: "{host_name}"
    evidence_file: .local/state/omni/overlay-store-refresh/last-run.json
    state_directory: .onex_state/overlay-store-refresh
    # h101's registry root links to an external volume: launchd could not open logs there (exit 78, EX_CONFIG, no log).
    log_directory: .local/state/omni/overlay-store-refresh
    # The same volume bars launchd from the working directory: uv ended up in getcwd for good (measured on h101, sample of the
    # stalled process). The job runs from, and passes the tick as its omni home, a directory under the home.
    launchd_root: .local/state/omni/overlay-store-refresh
  # The same reader on a Linux pool host (OMN-22878): a systemd user service and timer, so every lab host keeps the
  # host-list projection the lab tools, serve units and host drift read (RULING 2026-11-07T15:59:02Z).
  overlay-store-refresh-systemd:
    platform: systemd
    kind: registry_module_tick
    label: onex-overlay-store-refresh
    template: templates/onex-registry-module-tick.service.tmpl
    timer_template: templates/onex-registry-module-tick.timer.tmpl
    schedule:
      start_interval: 300
      run_timeout_s: 240
      run_at_load: true
      description: every 300 s and at load
    registry_project: omnimarket
    tick_no_sync: true
    interpreter_candidates:
      - /usr/bin/python3.12
      - /usr/bin/python3.13
      - /usr/local/bin/python3.13
    module: omnimarket.nodes.node_overlay_store_read_effect.runtime_overlay_store_tick
    entry_file: src/omnimarket/nodes/node_overlay_store_read_effect/runtime_overlay_store_tick.py
    project_path_override:
      request_field: project_path
      requires: clean git checkout that carries entry_file
    environment_path_overrides:
      - ONEX_SKILL_OVERLAY_ROOTS
      - LAB_WORK_HOST_NAME
    # OMN-23323: an overlay root is never a worktree; the installer refuses one, in a default or an override.
    environment_refuse_worktree_paths: [ONEX_SKILL_OVERLAY_ROOTS]
    environment:
      ONEX_SKILL_OVERLAY_ROOTS: "{marketplace_root}/plugins/onex-overlays/overlays"
      LAB_WORK_HOST_NAME: "{host_name}"
    evidence_file: .local/state/omni/overlay-store-refresh/last-run.json
    state_directory: .onex_state/overlay-store-refresh
  # The central test harness (node_lab_test_harness_effect): every golden and error case once an hour, its reading
  # written where the floor reads it. The cases, hosts, pinned commits and bus lane are the harness overlay's, found
  # under ONEX_SKILL_OVERLAY_ROOTS; this unit holds none of them.
  lab-test-harness:
    platform: launchd
    kind: registry_module_tick
    label: ai.omninode.lab-test-harness
    template: templates/ai.omninode.registry-module-tick.plist.tmpl
    schedule:
      start_interval: 3600
      run_at_load: true
      description: every 3600 s and at load
    registry_project: omnimarket
    # A run that outlives this many seconds is ended with its process group and exits 124 (run_timeout_s, OMN-22881).
    # Under its 3600 s interval, so a hung harness run ends before the next tick is due.
    run_timeout_s: 3300
    tick_no_sync: true
    interpreter_candidates:
      - /opt/homebrew/bin/python3.13
      - /usr/local/bin/python3.13
    module: omnimarket.nodes.node_lab_test_harness_effect.runtime_lab_test_harness
    entry_file: src/omnimarket/nodes/node_lab_test_harness_effect/runtime_lab_test_harness.py
    project_path_override:
      request_field: project_path
      requires: clean git checkout that carries entry_file
    environment_path_overrides:
      - ONEX_SKILL_OVERLAY_ROOTS
    # OMN-23323: an overlay root is never a worktree; the installer refuses one, in a default or an override.
    environment_refuse_worktree_paths: [ONEX_SKILL_OVERLAY_ROOTS]
    environment:
      ONEX_SKILL_OVERLAY_ROOTS: "{marketplace_root}/plugins/onex-overlays/overlays"
      ONEX_STATE_DIR: "{registry_root}/.onex_state"
      OMNIBASE_PATH: "{registry_root}"
      ONEX_WORKSPACE_CONFIG_ROOT: "{workspace_config_root}"
    evidence_file: .local/state/omni/lab-test-harness/last-run.json
    state_directory: .onex_state/lab-test-harness
  # The job-log filler (node_job_log_filler_effect, OMN-23032): every two minutes it reads the PR watcher's state (which lives
  # only on the host that runs the watcher) and asks the deployed gateway over the lane's bus to cache the log of each
  # failed job of every open pull request's current head, newest failure first, so a lane's cache-only `onex scm job-log`
  # answers within minutes of the failure. The overlay (profile, lane, cap, classes) is the filler's, found under
  # ONEX_SKILL_OVERLAY_ROOTS; the one setting here is where the watcher's state file is.
  job-log-filler:
    platform: launchd
    kind: registry_module_tick
    label: ai.omninode.job-log-filler
    template: templates/ai.omninode.registry-module-tick.plist.tmpl
    schedule:
      start_interval: 120
      run_at_load: true
      description: every 120 s and at load
    registry_project: omnimarket
    # Ended with its process group and exits 124 past this; launchd starts no second run while one is alive.
    # Three intervals, the bound the run-limit test holds every unit to; a pass's worst case is the overlay's.
    run_timeout_s: 360
    # The tick holds this file in the evidence directory while it runs (a second tick exits 3), and an install or uninstall
    # waits for, then stops, a tick still holding it after the unload (OMN-23349).
    tick_lock_file: tick.lock
    tick_no_sync: true
    interpreter_candidates:
      - /opt/homebrew/bin/python3.13
      - /usr/local/bin/python3.13
    module: omnimarket.nodes.node_job_log_filler_effect.runtime_job_log_filler_tick
    entry_file: src/omnimarket/nodes/node_job_log_filler_effect/runtime_job_log_filler_tick.py
    project_path_override:
      request_field: project_path
      requires: clean git checkout that carries entry_file
    environment_path_overrides:
      - ONEX_SKILL_OVERLAY_ROOTS
    # OMN-23323: an overlay root is never a worktree; the installer refuses one, in a default or an override.
    environment_refuse_worktree_paths: [ONEX_SKILL_OVERLAY_ROOTS]
    environment:
      ONEX_SKILL_OVERLAY_ROOTS: "{marketplace_root}/plugins/onex-overlays/overlays"
      ONEX_STATE_DIR: "{registry_root}/.onex_state"
      OMNIBASE_PATH: "{registry_root}"
      ONEX_PR_WATCHER_STATE: "{registry_root}/.claude_scratch/pr-watcher/state.json"
      # The gateway reads the lane declaration table (config/lab/ci_bus_lanes.yaml) under this root; without it every read fails.
      ONEX_WORKSPACE_CONFIG_ROOT: "{workspace_config_root}"
    evidence_file: .local/state/omni/job-log-filler/last-run.json
    state_directory: .onex_state/job-log-filler
  # The hourly work-ledger parity receipt writer (OMN-23258, node_work_ledger_parity_receipt_effect of OMN-23251). It runs on the
  # host that holds both the parity DSN and the current ledger file (h200). The schedule host, interval and settings are the
  # node's overlay in the overlays repository; the host-specific paths below are overridable at install (the ledger command
  # is the host's proven onex-ledger command line), none is a secret.
  work-ledger-parity-receipt:
    platform: launchd
    kind: registry_module_tick
    label: ai.omninode.work-ledger-parity-receipt
    template: templates/ai.omninode.registry-module-tick.plist.tmpl
    schedule:
      start_interval: 3600
      run_at_load: true
      description: every 3600 s and at load
    registry_project: omnimarket
    # The node's own timeout_ms is 1020000 (its contract); the unit ends a hung run at 1020 s and exits 124, before the next tick.
    run_timeout_s: 1020
    tick_no_sync: true
    interpreter_candidates:
      - /opt/homebrew/bin/python3.13
      - /usr/local/bin/python3.13
    module: omnimarket.nodes.node_work_ledger_parity_receipt_effect.runtime_parity_receipt
    entry_file: src/omnimarket/nodes/node_work_ledger_parity_receipt_effect/runtime_parity_receipt.py
    project_path_override:
      request_field: project_path
      requires: clean git checkout that carries entry_file
    environment_path_overrides:
      - ONEX_LEDGER_COMMAND
      - ONEX_LEDGER_PARITY_PYTHON
      - ONEX_LEDGER_PARITY_OVERLAY
      - ONEX_LEDGER_PARITY_ENV_FILE
    environment:
      ONEX_LEDGER_PARITY_FILE: "{registry_root}/docs/tracking/ROLLING_WORK_LEDGER.md"
      ONEX_LEDGER_COMMAND: "{home}/.local/bin/onex-ledger"
      ONEX_LEDGER_PARITY_PYTHON: "{registry_root}/.onex-dispatch-venv/bin/python"
      ONEX_LEDGER_PARITY_OVERLAY: "{marketplace_root}/plugins/onex-overlays/overlays/delegation_health/overlay.yaml"
      ONEX_LEDGER_PARITY_ENV_FILE: "{home}/.omnibase/.env"
      ONEX_LEDGER_PARITY_PG_PORT: "5436"
      ONEX_STATE_DIR: "{registry_root}/.onex_state"
    evidence_file: .local/state/omni/work-ledger-parity-receipt/last-run.json
    state_directory: .onex_state/work-ledger-parity-receipt
  # The live J8 run (OMN-23087): every 900 s, one real head the landing decision merges and one the lab-bound check holds,
  # piece 8's chain and piece 9's answer written to the floor's emission journal under one correlation id each, so the
  # floor's receipt fold reads join J8. The overlay (node_pr_landing_join_j8: the watcher state, the lab-bound check and
  # repositories, the journal) is found under ONEX_SKILL_OVERLAY_ROOTS; this unit holds none of it.
  landing-join-j8:
    platform: launchd
    kind: registry_module_tick
    label: ai.omninode.landing-join-j8
    template: templates/ai.omninode.registry-module-tick.plist.tmpl
    schedule:
      start_interval: 900
      run_at_load: true
      description: every 900 s and at load
    registry_project: omnimarket
    # A run that outlives this many seconds is ended with its process group and exits 124 (run_timeout_s, OMN-22881).
    # A tick reads one file and judges at most two heads: it ends in seconds, so 300 s is a hung run.
    run_timeout_s: 300
    tick_no_sync: true
    interpreter_candidates:
      - /opt/homebrew/bin/python3.13
      - /usr/local/bin/python3.13
    module: omnimarket.nodes.node_pr_landing_decision_compute.runtime_join_j8
    entry_file: src/omnimarket/nodes/node_pr_landing_decision_compute/runtime_join_j8.py
    project_path_override:
      request_field: project_path
      requires: clean git checkout that carries entry_file
    environment_path_overrides:
      - ONEX_SKILL_OVERLAY_ROOTS
    environment:
      ONEX_SKILL_OVERLAY_ROOTS: "{marketplace_root}/plugins/onex-overlays/overlays"
      ONEX_STATE_DIR: "{registry_root}/.onex_state"
      ONEX_WORKSPACE_CONFIG_ROOT: "{workspace_config_root}"
    evidence_file: .local/state/omni/landing-join-j8/last-run.json
    state_directory: .onex_state/landing-join-j8
  silent-failure-alarm:
    platform: launchd
    kind: registry_module_tick
    label: ai.omninode.silent-failure-alarm
    template: templates/ai.omninode.registry-module-tick.plist.tmpl
    schedule:
      start_interval: 300
      run_at_load: true
      description: every 300 s and at load
    registry_project: omnimarket
    # A run that outlives this many seconds is ended with its process group and exits 124 (run_timeout_s, OMN-22881).
    # The node's own timeout_ms is 900000 (its contract), so the unit ends a run at the bound the node declares.
    run_timeout_s: 900
    interpreter_candidates:
      - /opt/homebrew/bin/python3.13
      - /usr/local/bin/python3.13
    module: omnimarket.nodes.node_silent_failure_alarm_effect.runtime_silent_failure_alarm
    entry_file: src/omnimarket/nodes/node_silent_failure_alarm_effect/runtime_silent_failure_alarm.py
    project_path_override:
      request_field: project_path
      requires: clean git checkout that carries entry_file
    environment_path_overrides:
      - ONEX_SILENT_FAILURE_ALARM_CONFIG
    environment:
      ONEX_SILENT_FAILURE_ALARM_CONFIG: "{home}/.local/state/omni/silent-failure-alarm/config.json"
      ONEX_WORKSPACE_CONFIG_ROOT: "{workspace_config_root}"
    # The configuration the alarm reads from ONEX_SILENT_FAILURE_ALARM_CONFIG (OMN-22778), written by the installer so a
    # reinstall reproduces it and nobody writes it by hand. Built-in placeholders: {home}, {registry_root} and {ledger_path}
    # (the request's, else the registry's own ledger file). Each input is a request field, else the installing shell's
    # environment variable, else the value the last install recorded. The hosts' event names are not here: the alarm
    # derives them from host_table (OMN-22755).
    config_file:
      environment: ONEX_SILENT_FAILURE_ALARM_CONFIG
      mode: "0600"
      inputs:
        runtime_ssh_host: {field: runtime_ssh_host, env: ONEX_RUNTIME_SSH_HOST}
        appender_root: {field: appender_root, env: ONEX_ALARM_APPENDER_ROOT}
        host_table_path: {field: host_table_path, env: ONEX_ALARM_HOST_TABLE}
      document:
        registry_root: "{registry_root}"
        ledger: "{ledger_path}"
        # The appender that serialises ledger writes, run by the interpreter of the checkout the request names
        # (appender_root), because launchd's PATH has none.
        ledger_lock: "{appender_root}/.venv/bin/onex-ledger"
        python: "{appender_root}/.venv/bin/python"
        # Prints <hostname>|<newest hook event UTC stamp> for each host that sent one in the last day.
        hook_events_command:
          - ssh
          - -o
          - BatchMode=yes
          - -o
          - ConnectTimeout=10
          - "{runtime_ssh_host}"
          - >-
            docker exec omnibase-infra-postgres psql -U postgres -d omnidash_analytics -Atc
            "SELECT host || chr(124) || max(emitted_at) FROM omninode_internal.claude_hook_events
            WHERE emitted_at > now() - make_interval(days => 1) GROUP BY host"
        host_table: "{host_table_path}"
        # Leave out of the quiet-host reading each host the lab host table declares unavailable (OMN-22778); the
        # alarm reads that table through the unit's ONEX_WORKSPACE_CONFIG_ROOT, the way every other consumer does.
        skip_unavailable_hosts: true
        # The drainer this host watches and reinstalls (the launching Mac is h200).
        drainer:
          host: h200
          state_dir: "{registry_root}/.onex_state"
          installer: "{registry_root}/omniclaude/scripts/install-hook-emit-drainer.sh"
          home: "{home}"
          registry_root: "{registry_root}"
    evidence_file: .local/state/omni/silent-failure-alarm/last-run.json
    state_directory: .onex_state/silent-failure-alarm
