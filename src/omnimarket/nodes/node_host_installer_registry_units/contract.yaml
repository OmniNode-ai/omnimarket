      ONEX_SKILL_OVERLAY_ROOTS: "{registry_root}/overlays/overlays:{marketplace_root}/plugins/onex-overlays/overlays"
      ONEX_LANDING_SNAPSHOT_OVERLAY_FILE: "{registry_root}/overlays/overlays/node_pr_landing_snapshot_effect_cutover/overlay.yaml"
      OMNIBASE_PATH: "{registry_root}"
      ONEX_STATE_DIR: "{registry_root}/.onex_state"
      ONEX_WORKSPACE_CONFIG_ROOT: "{workspace_config_root}"
    evidence_file: .local/state/omni/landing-snapshot-cutover/last-run.json
    state_directory: .onex_state/landing-snapshot-cutover
