      - ONEX_LANDING_SNAPSHOT_OVERLAY_FILE
    environment_refuse_worktree_paths: [ONEX_SKILL_OVERLAY_ROOTS, ONEX_LANDING_SNAPSHOT_OVERLAY_FILE]
