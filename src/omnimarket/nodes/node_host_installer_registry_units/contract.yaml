  # The landing snapshot step for cutover repositories (OMN-23514): the same node as landing-snapshot, a second
  # instance whose overlay (node_pr_landing_snapshot_effect_cutover in the overlays repository, pinned by
  # ONEX_LANDING_SNAPSHOT_OVERLAY_FILE) reads landing-watcher-facts' output in place of the controller's facts file,
