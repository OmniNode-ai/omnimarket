name: node_gateway_batch_ingest_effect
version: 0.1.0
description: Stateless HTTPS batch ingest door that validates a whole batch and confirms each record's delivery before it answers.
pack: gateway
node_role: effect
display_name: Gateway Batch Ingest Effect
omnibase_core_compat: '>=0.39.0,<1.0.0'
entry_points:
  onex.nodes:
    node_gateway_batch_ingest_effect: omnimarket.nodes.node_gateway_batch_ingest_effect
capabilities:
  standalone: false
  full_runtime: true
  requires_network: true
  requires_repo: false
  requires_secrets: true
  requires_docker: false
  side_effect_class: write
dependencies:
- omnibase-infra>=0.38.3,<0.39.0
- confluent-kafka>=2.12.0,<3.0.0
- pyjwt[crypto]>=2.15.1
- pydantic>=2.0
- pyyaml>=6.0
