# Overlay of the never-produced listing rule (OMN-23614): <root>/node_topic_never_produced_compute/overlay.yaml
# under a root named in ONEX_SKILL_OVERLAY_ROOTS. Every key is required; the real values live in the overlays repository.
# Broker-internal prefixes that are never listed, whatever the evidence says.
protected_prefixes: ["__", "_schemas"]
# Whether a never-produced topic a contract still declares a producer for is listed anyway.
list_declared_producers: true
