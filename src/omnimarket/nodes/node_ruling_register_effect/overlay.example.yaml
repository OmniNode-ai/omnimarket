# The in-memory default. The real overlay (deployment data, kept outside this repository
# and found under ONEX_SKILL_OVERLAY_ROOTS) names the register's read hosts and their
# ssh targets; this repository ships only the synthetic route.
kind: inmemory
# One read's ceiling and the whole register read's ceiling in seconds: the sum of the
# rows' reads is bounded by the total, and both sit under the facts effect's 30000 ms.
timeout_seconds: 10
total_timeout_seconds: 20
remote_argv_prefix: ["ssh", "-o", "BatchMode=yes", "{target}"]
local_hosts: [local]
host_targets:
  host-a: 192.0.2.10
journal_env: ONEX_RULING_REGISTER_JOURNAL
