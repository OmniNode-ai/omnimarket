name: node_lane_stack_orphan_compute
lifecycle: experimental
node_type: COMPUTE_GENERIC
runtime_profiles: []
contract_version:
  major: 1
  minor: 0
  patch: 0
node_version: 1.0.0
description: Judge a host's container inventory against the lanes that are live and the lanes that are finished,
  and name the running containers that a finished lane left behind, each with its stop and restore command.
  Containers a lane label does not claim, protected dev-runtime, bus, runner and mirror containers, and containers
  of a live or unknown lane are never named for stopping.
