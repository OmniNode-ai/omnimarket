name: node_dreamsheets_structure_effect
version: "0.1.0"
description: "Effect: one DreamSheets document's structure record (counts and capabilities, no content) from DreamSheets' headless binary, run under bubblewrap with no network and a read-only hashed copy of the input. Direct invocation; hosted where bubblewrap and an extracted DreamSheets AppImage are installed."
pack: "data"
node_role: effect
display_name: "DreamSheets Structure Record"
omnibase_core_compat: ">=0.39.0,<1.0.0"
entry_points:
  onex.nodes:
    node_dreamsheets_structure_effect: "omnimarket.nodes.node_dreamsheets_structure_effect"
capabilities:
  standalone: true
  full_runtime: false
  requires_network: false
  requires_repo: false
  requires_secrets: false
  requires_docker: false
  side_effect_class: subprocess
dependencies: []
authors: ["DreamSheets"]
license: "MIT"
tags: ["effect", "dreamsheets", "structure-summary", "sandbox"]
