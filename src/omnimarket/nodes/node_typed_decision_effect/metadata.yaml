name: node_typed_decision_effect
version: "1.0.0"
description: "One typed question to the contract-pinned typed-decision backend, public-repository work only, optional incumbent fallback; blind without an incumbent — EFFECT"
omnibase_core_compat: ">=0.39.0,<1.0.0"
# No entry_points on purpose: runtime discovery walks the onex.nodes entry
# points, so the node stays unwired until a decision contract composes it.
capabilities:
  standalone: false
  full_runtime: false
  requires_network: true
  requires_repo: false
  requires_secrets: true
  requires_docker: false
  side_effect_class: external_io
dependencies:
  - "omnibase_core>=0.39.0"
  - "omnibase-spi>=0.20.0"
  - "httpx>=0.27.0"
authors: ["OmniNode Platform Team"]
license: "MIT"
tags: ["effect", "typed-decision", "routing", "OMN-19432"]
pack: "delegation"
display_name: "Typed Decision Effect"
node_role: "effect"
