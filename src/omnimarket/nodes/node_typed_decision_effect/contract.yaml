---
# SPDX-FileCopyrightText: 2026 OmniNode.ai Inc.
# SPDX-License-Identifier: MIT
# ONEX Node Contract - Typed decision effect (OMN-19432)
#
# One typed question (choice, noul or score) over a program state, answered by
# the typed-decision backend this contract pins. The backend is DATA: its
# endpoint, model, secret reference and timeout resolve from the delegation
# routing contract (bifrost_delegation.yaml plus overlay) by backend_id, and
# its key resolves at the effect boundary from the secret store by that
# reference. Nothing about the provider is a literal in the handler.
#
# The bus seam is shadow-only: it returns the incumbent and records the
# backend outcome without steering. The existing direct effect API remains
# available to bounded typed-decision callers.
name: node_typed_decision_effect
lifecycle: experimental
contract_version: {major: 1, minor: 1, patch: 0}
node_type: EFFECT_GENERIC
node_version: {major: 1, minor: 1, patch: 0}

description: >
  Observes the contract-pinned typed-decision backend in shadow without steering
  the incumbent decision, retaining the observed model, abstention, refusal or
  error outcome in the receipt. Reports independently adjudicated calibration
  only after the contract sample floor is reached. A work unit that does not
  belong to a public repository, resolved live and failing closed, is refused
  before anything is sent to the backend.

input_model:
  name: ModelTypedDecisionWorkflowRequest
  module: omnimarket.nodes.node_typed_decision_effect.models.model_typed_decision

output_model:
  name: ModelTypedDecisionWorkflowResult
  module: omnimarket.nodes.node_typed_decision_effect.models.model_typed_decision

shadow_calibration:
  minimum_samples: 300
  reliability_bins: 15

handler:
  module: omnimarket.nodes.node_typed_decision_effect.handlers.handler_typed_decision
  class: HandlerTypedDecisionWorkflow
  input_model: omnimarket.nodes.node_typed_decision_effect.models.model_typed_decision.ModelTypedDecisionWorkflowRequest
  output_model: omnimarket.nodes.node_typed_decision_effect.models.model_typed_decision.ModelTypedDecisionWorkflowResult

handler_routing:
  routing_strategy: operation_match
  handlers:
    - operation: typed_decision_shadow
      handler:
        name: HandlerTypedDecisionWorkflow
        module: omnimarket.nodes.node_typed_decision_effect.handlers.handler_typed_decision
      event_model:
        name: ModelTypedDecisionWorkflowRequest
        module: omnimarket.nodes.node_typed_decision_effect.models.model_typed_decision

terminal_event: onex.evt.omnimarket.typed-decision-shadow-completed.v1
published_events:
  - topic: onex.evt.omnimarket.typed-decision-shadow-completed.v1
    event_type: TypedDecisionWorkflowResult
event_bus:
  subscribe_topics:
    - onex.cmd.omnimarket.typed-decision-shadow-requested.v1
  publish_topics:
    - onex.evt.omnimarket.typed-decision-shadow-completed.v1
runtime_dispatch:
  command_topic: onex.cmd.omnimarket.typed-decision-shadow-requested.v1
externally_consumed_topics:
  - onex.evt.omnimarket.typed-decision-shadow-completed.v1

decision_routing:
  # The routing contract's typed-decision backend. Swapping the provider or
  # the model is a change to that backend (or an overlay), not to this node.
  backend_id: cloud-typesafe-jev
  # Below this probability the optional incumbent answers, or a blind request
  # returns no_answer. The receipt records the outcome.
  # A starting value, to be replaced by one calibrated from the arm's own
  # first decisions; it is applied before any model answer is used.
  abstain_below_probability: 0.8

work_unit_scoping:
  # The decision backend is a third party. Only work that belongs to a public
  # repository may reach it: a missing attribution, a private or absent
  # repository, and any failure to resolve visibility are all refusals.
  require_public_repository: true
  visibility_timeout_ms: 5000
  # A real 200 that reports a repository public is remembered this long, in
  # process and on disk (OMN-20149). Only that positive answer is ever kept: a
  # refusal, a 404, a rate limit or a transport failure is read again next
  # time. A repository that turns private is served from the cache for at most
  # this long, so it stays short. 0 disables the cache.
  visibility_cache_ttl_seconds: 600

secrets:
  # OMN-20149: the visibility read carries this token when the secret store
  # resolves it, which lifts the read from GitHub's anonymous 60 an hour to the
  # authenticated allowance. Optional: with none the read is anonymous and the
  # cache above is what keeps a burst under the cap. A token can widen what a
  # read can SEE, never what counts as public: the guard admits only a 200
  # whose ``private`` field is false.
  GITHUB_TOKEN:
    description: "GitHub token for the repository-visibility read (optional, read-only)."
    required: false

descriptor:
  node_archetype: effect
  purity: impure
  idempotent: true
  timeout_ms: 30000
  runtime_profiles:
    - effects

metadata:
  transport_type: kafka
  description: "Typed decision effect node"
  author: "OmniNode Team"
  tags:
    - "effect"
    - "typed-decision"
    - "routing"
  related_tickets:
    - "OMN-19432"
