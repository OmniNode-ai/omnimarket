        module: omnimarket.nodes.node_tool_use_rubric_compute.handlers.handler_tool_use_rubric
    - operation: manifest
      handler:
        name: HandlerToolUseRubric
        module: omnimarket.nodes.node_tool_use_rubric_compute.handlers.handler_tool_use_rubric
    - operation: summarize
      handler:
        name: HandlerToolUseRubric
        module: omnimarket.nodes.node_tool_use_rubric_compute.handlers.handler_tool_use_rubric
    - operation: summary_line
      handler:
        name: HandlerToolUseRubric
        module: omnimarket.nodes.node_tool_use_rubric_compute.handlers.handler_tool_use_rubric
    - operation: claude_version
      handler:
        name: HandlerToolUseRubric
        module: omnimarket.nodes.node_tool_use_rubric_compute.handlers.handler_tool_use_rubric
    - operation: schema_cache_target
      handler:
        name: HandlerToolUseRubric
        module: omnimarket.nodes.node_tool_use_rubric_compute.handlers.handler_tool_use_rubric
    - operation: pick_captured_tools
      handler:
        name: HandlerToolUseRubric
        module: omnimarket.nodes.node_tool_use_rubric_compute.handlers.handler_tool_use_rubric
