name: node_tool_use_rubric_compute
node_type: compute
runtime_profiles: [main]
contract_version: {major: 1, minor: 0, patch: 0}
node_version: "1.0.0"
description: >-
  Decide the tool-use rubric scorer plan, the verdict summary and the schema capture cache key from caller-supplied facts.
  Pure behaviour-preserving decisions; the caller performs all I/O.
input_model:
  name: ModelToolUseRubricRequest
  module: omnimarket.nodes.node_tool_use_rubric_compute.models.model_tool_use_rubric
output_model:
  name: ModelToolUseRubricResult
  module: omnimarket.nodes.node_tool_use_rubric_compute.models.model_tool_use_rubric
