name: node_topic_provision_plan_compute
node_type: COMPUTE_GENERIC
lifecycle: experimental
node_version: {major: 1, minor: 0, patch: 0}
description: >
  Plan the broker topics to create: a topic is provisioned only for a contract that a
  running profile loads (the caller passes the loaded contract names), and the rule —
  which topic kinds count, the partitions a not-yet-created topic gets and the partition
  bar the plan is held under — comes from the node overlay, never from code.
input_model:
  name: ModelTopicProvisionPlanRequest
  module: omnimarket.nodes.node_topic_provision_plan_compute.models.model_topic_provision_plan
output_model:
  name: ModelTopicProvisionPlanResult
  module: omnimarket.nodes.node_topic_provision_plan_compute.models.model_topic_provision_plan
handler_routing:
  routing_strategy: operation_match
  default_handler: omnimarket.nodes.node_topic_provision_plan_compute.handlers.handler_topic_provision_plan:HandlerTopicProvisionPlan
  handlers:
    - operation: handle
      handler:
        name: HandlerTopicProvisionPlan
        module: omnimarket.nodes.node_topic_provision_plan_compute.handlers.handler_topic_provision_plan
      topic: onex.cmd.omnimarket.topic-provision-plan-requested.v1
entrypoint:
  name: NodeTopicProvisionPlanCompute
  module: omnimarket.nodes.node_topic_provision_plan_compute
execution:
  deterministic: true
  side_effects: false
  caller: the topic provision runner, when a running profile's loaded contract names are resolved
contract_version: {major: 1, minor: 0, patch: 0}
version: {major: 1, minor: 0, patch: 0}
handler:
  module: omnimarket.nodes.node_topic_provision_plan_compute.handlers.handler_topic_provision_plan
  class: HandlerTopicProvisionPlan
  input_model: omnimarket.nodes.node_topic_provision_plan_compute.models.model_topic_provision_plan.ModelTopicProvisionPlanRequest
  output_model: omnimarket.nodes.node_topic_provision_plan_compute.models.model_topic_provision_plan.ModelTopicProvisionPlanResult
event_bus:
  subscribe_topics:
    - onex.cmd.omnimarket.topic-provision-plan-requested.v1
  publish_topics:
    - onex.evt.omnimarket.topic-provision-plan-completed.v1
runtime_dispatch:
  command_topic: onex.cmd.omnimarket.topic-provision-plan-requested.v1
descriptor:
  node_archetype: compute
  purity: pure
  runtime_profiles:
    - main
  idempotent: true
  timeout_ms: 5000
replay:
  requires_validator_version: true
  timestamp_authority: ingest_sequence
  deterministic: true
terminal_event: onex.evt.omnimarket.topic-provision-plan-completed.v1
metadata:
  transport_type: inmemory
externally_consumed_topics:
  - onex.evt.omnimarket.topic-provision-plan-completed.v1
runtime_profiles:
  - main
