#
# Example overlay for node_topic_provision_plan_compute.
#
# Copy to overlay.yaml and adjust. All values are placeholders; no host names.
#
# mode: the provision rule mode (all, profile, or profile_and_manifest).
#   When set, this overrides the contract's config.rule.mode.
# profile: the active runtime profile name (e.g. main, staging, ci).
# lane_manifest: the list of contract names this lane provisions.
#   Required for profile_and_manifest mode; must be non-empty.
# contract_roots: directories to scan for contract.yaml files.
# lane: a declared lane (e.g. dev) whose broker and identity the read-only dry run reads to
#   count live topics; without it the dry run lists no topics.
mode: profile_and_manifest
profile: main
lane_manifest:
  - example-contract-a
  - example-contract-b
contract_roots:
  - /path/to/contracts
lane: dev
