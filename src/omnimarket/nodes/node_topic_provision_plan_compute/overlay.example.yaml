# The shape of the topic provision rule; the real values live in the overlays repository,
# never in this package. Copy this file to <root>/node_topic_provision_plan_compute/overlay.yaml
# there and name that root in ONEX_SKILL_OVERLAY_ROOTS. There is no packaged fallback: with no
# overlay selected the node refuses to plan rather than guess a rule.
#
#   include_subscribe_topics  a loaded contract's subscribe topics count toward the plan
#   include_publish_topics    a loaded contract's publish topics count toward the plan
#   default_partitions        partitions a not-yet-created topic gets
#   partition_bar             the broker's declared partition bar the plan is held under
include_subscribe_topics: true
include_publish_topics: true
default_partitions: 1
partition_bar: 1000
