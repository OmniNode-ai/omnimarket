name: node_link_gate_compute
lifecycle: experimental
node_type: COMPUTE_GENERIC
runtime_profiles: []
contract_version:
  major: 1
  minor: 0
  patch: 0
node_version: 1.0.0
description: Judge one lab host's ssh link for one unit from the placing host's ping loss. A host is benched only
  on sustained loss (this read and the one before it, both over 20 percent of 50 pings), is degraded (ranked after
  cleaner hosts, still admitted) over 5 percent, and is never judged for a unit delivered over the event bus or
  for the launching host. Also owns the ping argv and the ping summary parse.
input_model:
  name: ModelLinkGateRequest
  module: omnimarket.nodes.node_link_gate_compute.models.model_link_gate
output_model:
  name: ModelLinkGateVerdict
  module: omnimarket.nodes.node_link_gate_compute.models.model_link_gate
handler:
  module: omnimarket.nodes.node_link_gate_compute.handlers.handler_link_gate
  class: HandlerLinkGate
  input_model: omnimarket.nodes.node_link_gate_compute.models.model_link_gate.ModelLinkGateRequest
  output_model: omnimarket.nodes.node_link_gate_compute.models.model_link_gate.ModelLinkGateVerdict
handler_routing:
  routing_strategy: operation_match
  default_handler: omnimarket.nodes.node_link_gate_compute.handlers.handler_link_gate:HandlerLinkGate
  handlers:
  - operation: handle
    handler:
      name: HandlerLinkGate
      module: omnimarket.nodes.node_link_gate_compute.handlers.handler_link_gate
event_bus:
  subscribe_topics: []
  publish_topics: []
runtime_dispatch:
  external_trigger: Direct Python invocation with supplied host readings.
descriptor:
  node_archetype: compute
  purity: pure
  runtime_profiles: []
  idempotent: true
  timeout_ms: 5000
replay:
  requires_validator_version: true
  timestamp_authority: ingest_sequence
  deterministic: true
metadata:
  transport_type: local
  description: Judge one lab host's ssh link for one unit from the placing host's ping loss. A host is benched only
    on sustained loss (this read and the one before it, both over 20 percent of 50 pings), is degraded (ranked after
    cleaner hosts, still admitted) over 5 percent, and is never judged for a unit delivered over the event bus or
    for the launching host. Also owns the ping argv and the ping summary parse.
  author: OmniNode Team
  created: '2026-10-24'
  tags:
  - compute
