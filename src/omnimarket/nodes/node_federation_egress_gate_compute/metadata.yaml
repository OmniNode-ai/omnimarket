name: node_federation_egress_gate_compute
version: "0.1.0"
description: "Federation egress gate: shape check and key binding for one record leaving one bus for another, pass or refuse with one named reason"
omnibase_core_compat: ">=0.39.0,<1.0.0"
entry_points:
  onex.nodes:
    node_federation_egress_gate_compute: "omnimarket.nodes.node_federation_egress_gate_compute"
capabilities:
  standalone: true
  # false until the federation forwarder sends the gate command: the bus
  # surface is declared, the caller is not wired yet.
  full_runtime: false
  requires_network: false
  requires_repo: false
  requires_secrets: false
  requires_docker: false
  side_effect_class: read_only
dependencies: []
authors: ["OmniNode Platform Team"]
license: "MIT"
tags: ["compute", "federation", "egress", "pure"]
pack: "federation"
display_name: "Federation Egress Gate"
node_role: "compute"
