---
name: projection_work_ledger
contract_version: {major: 1, minor: 2, patch: 0}
node_type: reducer
node_version: {major: 1, minor: 0, patch: 0}
input_model: omnimarket.models.model_work_ledger_fold_request.ModelWorkLedgerFoldRequest
description: >
  OMN-19513, stage 1 of retiring the manual markdown work ledger. Folds the
  eleven typed row events (one topic per canonical row type, declared under
  event_bus below) into two omninode_internal tables: work_ledger_rows, the
  whole log keyed on the row's content hash, and work_ledger_state, one row per
  entity (an open claim, a live hold with its scope, an unanswered message, a
  ruling, a consent) whose open or closed state is GENERATED from two guarded
  column groups. The markdown file
  stays authoritative in stage 1; this projection is what its readers move onto
  one at a time (pause_check, the drain map, queue_status, session-resume), and
  the parity check compares the two. Exact parity requires every shared row's
  raw text, parsed authority fields and every touched entity's relationship
  closure. Missing text is a named mismatch, including metadata-only exports;
  an incomplete comparison cannot produce an exact daily receipt.

  OMN-23694: a third derived table, work_ledger_latest, keeps per lane and per
  ticket the newest row of each tracked row type (work_ledger.latest_row_types:
  CLAIM, TERMINAL, STATUS, MSG, HOLD) with its time and the pr, outcome and to
  cells, written from the same row event with a write guarded on (at, row_id).
  It is state, not history: the work ledger query node's latest-state query
  reads one page of it where a board or lane placement would page raw rows.

  Rule 7a: a projection is two classes. HandlerProjectionWorkLedger is the pure
  definition-B fold; WorkLedgerProjectionWriter is the effect-class writer the
  runtime actually calls, and it declares in-process dispatch. The raw_row in
  each event is the truth: every typed field is re-derived from it.

# The runtime lanes this node attaches on: the lab lanes only (lab first, rule
# 24). A runtime that declares no lane does not attach it (fail-closed).
runtime_lanes:
  - compose-dev
  - onex-lab
  - onex-lab-k3s

handler:
  module: omnimarket.nodes.node_projection_work_ledger.handlers.handler_work_ledger_projection
  class: HandlerProjectionWorkLedger

handler_routing:
  routing_strategy: operation_match
  handlers:
    # Only the writer is routed (OMN-19833). A routed pure fold is handed the raw
    # event beside the writer, cannot report a write, and fails or runs on defaults
    # when its request wraps the event. The writer calls the fold in process (rule 7a).
    # The DURABLE half, the one the projection wiring path calls: without it the
    # node consumes, commits offsets and stores nothing (rule 7a, trap one).
    - operation: work_ledger_projection_writer
      handler:
        name: WorkLedgerProjectionWriter
        module: omnimarket.nodes.node_projection_work_ledger.handlers.handler_work_ledger_projection
      handler_module: omnimarket.nodes.node_projection_work_ledger.handlers.handler_work_ledger_projection

terminal_event: onex.evt.omnimarket.projection-work-ledger-applied.v1

descriptor:
  node_archetype: reducer
  purity: pure
  idempotent: true
  timeout_ms: 30000

event_bus:
  subscribe_topics:
    - onex.evt.omnimarket.work-ledger-claim.v1
    - onex.evt.omnimarket.work-ledger-status.v1
    - onex.evt.omnimarket.work-ledger-terminal.v1
    - onex.evt.omnimarket.work-ledger-hold.v1
    - onex.evt.omnimarket.work-ledger-release.v1
    - onex.evt.omnimarket.work-ledger-msg.v1
    - onex.evt.omnimarket.work-ledger-ack.v1
    - onex.evt.omnimarket.work-ledger-ruling.v1
    - onex.evt.omnimarket.work-ledger-operator-consent.v1
    - onex.evt.omnimarket.work-ledger-friction.v1
    - onex.evt.omnimarket.work-ledger-correction.v1
    - onex.evt.omnimarket.work-ledger-claim.v2
    - onex.evt.omnimarket.work-ledger-status.v2
    - onex.evt.omnimarket.work-ledger-terminal.v2
    - onex.evt.omnimarket.work-ledger-hold.v2
    - onex.evt.omnimarket.work-ledger-release.v2
    - onex.evt.omnimarket.work-ledger-msg.v2
    - onex.evt.omnimarket.work-ledger-ack.v2
    - onex.evt.omnimarket.work-ledger-ruling.v2
    - onex.evt.omnimarket.work-ledger-operator-consent.v2
    - onex.evt.omnimarket.work-ledger-friction.v2
    - onex.evt.omnimarket.work-ledger-correction.v2
  publish_topics:
    - onex.evt.omnimarket.projection-work-ledger-applied.v1
    # OMN-22915, L12: every row the judge accepted, once, with its sequence; retention -1 below.
    - onex.evt.omnimarket.work-ledger-row-accepted.v1
  dlq_topics:
    - onex.dlq.omnimarket.projection-work-ledger-malformed.v1

externally_consumed_topics:
  - onex.evt.omnimarket.projection-work-ledger-applied.v1
  # The rebuild (node_work_ledger_reducer_compute) reads it; the projection, render and mirror subscriptions move to it at L12's cutover.
  - onex.evt.omnimarket.work-ledger-row-accepted.v1

# The broker declaration of the accepted-row topic (OMN-22915, L12). It is the ledger's second copy
# on the bus: it never expires and has no size cap, and one partition makes the offset the order.
published_events:
  - event_type: ModelAcceptedRowEvent
    topic: onex.evt.omnimarket.work-ledger-row-accepted.v1
    description: One row the judge accepted, with its ledger_seq, or legacy_ordinal for bootstrap history.
    topic_config:
      partitions: 1
      kafka_config:
        "cleanup.policy": "delete"
        "retention.ms": "-1"
        "retention.bytes": "-1"

work_ledger:
  ledger_id: rolling-work-ledger
  # onex-ledger is the live dual-write source: a row of a listed source with no
  # ledger_seq is a write to a ledger file that is not the canonical one, and is
  # refused to the poison dead-letter topic. The backfill source ledger-emit is
  # not listed.
  sequence_required_sources: [onex-ledger]
  # OMN-23606: the row types work_ledger_latest keeps the newest row of, per lane and per ticket. A board or lane
  # placement reads that table (the work ledger query node's latest-state query) instead of paging raw rows.
  # Migration 0011's backfill names the same list; a test pins the two equal.
  latest_row_types: [CLAIM, TERMINAL, STATUS, MSG, HOLD]

# OMN-23152, rebuild plan 4.3 step 1: the unjudged-row reading counts projected rows with no ledger_seq
# over this window; it reads RED above zero and names each emitter by source and lane.
unjudged_reading:
  window_seconds: 86400

# OMN-23153, rebuild plan 4.3 step 6: the exact daily receipt compares the table with the accepted-row topic
# only. A UTC day's window is cut off at this time on the next day and closes close_minutes later.
daily_receipt:
  cutoff_utc: "00:00"
  close_minutes: 10
  lane: work-ledger-daily-receipt

db_io:
  db_tables:
    - name: work_ledger_rows
      database_ref: application
      schema: omninode_internal
      migration: "0000_create_work_ledger.sql"
      access: write
      role: work_ledger_rows
    - name: work_ledger_seq_conflicts
      database_ref: application
      schema: omninode_internal
      migration: "0009_work_ledger_seq_unique.sql"
      access: write
      role: work_ledger_seq_conflicts
    - name: work_ledger_state
      database_ref: application
      schema: omninode_internal
      migration: "0000_create_work_ledger.sql"
      access: write
      role: work_ledger_state
    - name: work_ledger_latest
      database_ref: application
      schema: omninode_internal
      migration: "0011_work_ledger_latest.sql"
      access: write
      role: work_ledger_latest

  # work_ledger_rows is keyed on the row's content hash (ON CONFLICT DO NOTHING);
  # work_ledger_state is keyed on the entity, each op guarded on (at, row_id).
  idempotency_key: "event_id"

metadata:
  transport_type: kafka

# OMN-19998: typed scenarios the golden and error chain tests are generated from. The
# writer returns the count of rows it wrote and the runtime publishes that on the applied
# event; a database failure makes the writer raise, which the runtime turns into silence,
# so the error half is a refusal that says why.
chain_scenarios:
  schema_version: 1
  success_topic: onex.evt.omnimarket.projection-work-ledger-applied.v1
  failures:
    - name: write_failed
      topic: onex.dlq.omnimarket.projection-work-ledger-malformed.v1
  bindings:
    - name: ledger_db
      target: ATTRIBUTE
      attribute: _db
      role: REDUCER_STATE
      in_memory_factory: omnimarket.handlers.chain_scenarios.doubles:recording_ledger_db
  cases:
    - case_name: golden_claim_event_is_folded_into_state
      kind: GOLDEN
      input:
        topic: onex.evt.omnimarket.work-ledger-claim.v1
        payload:
          _topic: onex.evt.omnimarket.work-ledger-claim.v1
          raw_row: "2026-09-28T10:00:00Z | CLAIM | lane=alpha | ticket=OMN-1 | est ~1 lane-hours; displaces x; (OMN-1) | work"
      expected_events:
        - topic: onex.evt.omnimarket.projection-work-ledger-applied.v1
          fields: {rows_upserted: 2}
      state_updates:
        - binding: ledger_db
          target: work_ledger_state
          key: "claim:alpha"
      oracle:
        basis: STATED_BY_PERSON
        statement: One CLAIM row is one log row plus one open-claim entity keyed claim:alpha, so two rows are written and reported on the applied event.
      breaks: [DROP_TERMINAL_PUBLISH, WRONG_CORRELATION_ID, SKIPPED_REDUCER_UPDATE]
  refusals:
    - applies_to: ERROR
      subject: write_failed
      kind: FAILURE_NOT_TYPED
      reason: WorkLedgerProjectionWriter lets a database error propagate out of handle(), and the runtime adapter reports a raised handler as no event at all, so no typed failure event, ledger row or reading can be asserted.
      unblocked_by: OMN-19998
    - applies_to: ERROR
      subject: unsequenced_live_row
      kind: FAILURE_NOT_TYPED
      reason: WorkLedgerProjectionWriter raises PoisonEventError for a live-source row with no ledger_seq; the runtime routes it to the poison DLQ topic, so no typed failure event is published for a chain test to assert
      unblocked_by: OMN-19998
