  class: HandlerOverlayDelivery
  input_model: omnimarket.nodes.node_issuer_overlay_delivery_effect.models.model_overlay_delivery.ModelOverlayDeliveryRequest
  output_model: omnimarket.nodes.node_issuer_overlay_delivery_effect.models.model_overlay_delivery.ModelOverlayDeliveryResult
handler_routing:
  routing_strategy: operation_match
  default_handler: omnimarket.nodes.node_issuer_overlay_delivery_effect.handlers.handler_overlay_delivery:HandlerOverlayDelivery
  handlers:
  - operation: handle
    handler:
      name: HandlerOverlayDelivery
      module: omnimarket.nodes.node_issuer_overlay_delivery_effect.handlers.handler_overlay_delivery
dependencies:
