#
# ONEX Node Contract
# Node: NodeCiRedKindRuleCompute (OMN-24322)
#
# Names the kind of one failed CI check from its check name and its log excerpt, with no model call:
#
#   handle(ModelCiRedKindRuleRequest) -> ModelCiRedKindRuleAnswer
#
# The rule table (kind name, check name pattern and/or log pattern, case flag; first match in declared order wins) is the
# overlay <root>/node_ci_red_kind_rule_compute/overlay.yaml under ONEX_SKILL_OVERLAY_ROOTS, or the file
# CI_RED_KIND_RULES_OVERLAY names. The node holds no kind name and no pattern. An unbound or invalid overlay is a
# typed refusal with no default table. A name no rule matches is answered matched=false, model_call_required=true:
# the caller sends that check to the model rung.
name: "node_ci_red_kind_rule_compute"
contract_name: "node_ci_red_kind_rule_compute"
node_name: "node_ci_red_kind_rule_compute"
lifecycle: experimental
node_type: "COMPUTE_GENERIC"
contract_version:
  major: 0
  minor: 1
  patch: 0
node_version:
  major: 0
  minor: 1
  patch: 0
description: >
  Reads the name of one failed CI check, and the log lines around its failed job's error lines, against an ordered
  pattern table from the node's overlay and names its kind when a rule's patterns all match. Every kind name and pattern is an overlay value, never this node's. A name no
  pattern matches is returned as needing the model; the node never guesses a kind.
input_model:
  name: "ModelCiRedKindRuleRequest"
  module: "omnimarket.nodes.node_ci_red_kind_rule_compute.models.model_ci_red_kind_rule_request"
  description: "The failed check's name and, when the caller has it, the log excerpt around the failed job's error lines."
output_model:
  name: "ModelCiRedKindRuleAnswer"
  module: "omnimarket.nodes.node_ci_red_kind_rule_compute.models.model_ci_red_kind_rule_answer"
  description: "The matched kind and rule position, or no match with model_call_required, or a typed refusal."
handler:
  module: "omnimarket.nodes.node_ci_red_kind_rule_compute.handlers.handler_ci_red_kind_rule"
  class: "HandlerCiRedKindRule"
  input_model: "omnimarket.nodes.node_ci_red_kind_rule_compute.models.model_ci_red_kind_rule_request.ModelCiRedKindRuleRequest"
  output_model: "omnimarket.nodes.node_ci_red_kind_rule_compute.models.model_ci_red_kind_rule_answer.ModelCiRedKindRuleAnswer"
handler_routing:
  routing_strategy: "payload_type_match"
  handlers:
    - handler:
        name: "HandlerCiRedKindRule"
        module: "omnimarket.nodes.node_ci_red_kind_rule_compute.handlers.handler_ci_red_kind_rule"
      event_model:
        name: "ModelCiRedKindRuleRequest"
        module: "omnimarket.nodes.node_ci_red_kind_rule_compute.models.model_ci_red_kind_rule_request"
# The runtime attaches a node only through the topics its contract declares: a contract with an empty
# subscribe list is never loaded on a runtime, so nothing on the dev lane can hand it a failed check and an
# integration pass can never read it handled. The caller that sends a failed check to the model rung publishes
# one command on command_topic and reads the typed answer on terminal_event; calling the handler in process
# stays available. The broker grants below are this node's own, derived by the broker ACL reconcile node
# (node_broker_acl_reconcile_effect) with the other contracts' grants.
terminal_event: "onex.evt.omnimarket.ci-red-kind-rule-answered.v1"
runtime_dispatch:
  command_topic: "onex.cmd.omnimarket.ci-red-kind-rule-requested.v1"
event_bus:
  subscribe_topics:
    - "onex.cmd.omnimarket.ci-red-kind-rule-requested.v1"
  publish_topics:
    - "onex.evt.omnimarket.ci-red-kind-rule-answered.v1"
externally_consumed_topics:
  - "onex.evt.omnimarket.ci-red-kind-rule-answered.v1"
broker_acl_grants:
  - principal: "${ONEX_ACL_RUNTIME_PRINCIPAL}"
    grants:
      - {resource_type: TOPIC, pattern: LITERAL, name: onex.cmd.omnimarket.ci-red-kind-rule-requested.v1, operation: READ}
      - {resource_type: TOPIC, pattern: LITERAL, name: onex.cmd.omnimarket.ci-red-kind-rule-requested.v1, operation: DESCRIBE}
      - {resource_type: TOPIC, pattern: LITERAL, name: onex.evt.omnimarket.ci-red-kind-rule-answered.v1, operation: WRITE}
      - {resource_type: TOPIC, pattern: LITERAL, name: onex.evt.omnimarket.ci-red-kind-rule-answered.v1, operation: DESCRIBE}
runtime_profiles: [main]
descriptor:
  runtime_profiles: [main]
  node_archetype: compute
  purity: impure  # reads the bound overlay file; writes nothing
  idempotent: true
  timeout_ms: 5000
metadata:
  transport_type: kafka
  description: "Rule-first pre-classifier for failed CI checks whose name decides their kind."
  author: "OmniNode Team"
  license: "MIT"
  created: "2026-11-13"
  tags:
    - compute
    - triage
    - ci-red
    - rule
