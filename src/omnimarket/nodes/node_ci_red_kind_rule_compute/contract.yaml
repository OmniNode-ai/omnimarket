#
# ONEX Node Contract
# Node: NodeCiRedKindRuleCompute (OMN-24322)
#
# Names the kind of one failed CI check from its check name, with no model call:
#
#   handle(ModelCiRedKindRuleRequest) -> ModelCiRedKindRuleAnswer
#
# The rule table (kind name, check name pattern, case flag; first match in declared order wins) is the
# overlay <root>/node_ci_red_kind_rule_compute/overlay.yaml under ONEX_SKILL_OVERLAY_ROOTS, or the file
# CI_RED_KIND_RULES_OVERLAY names. The node holds no kind name and no pattern. An unbound or invalid overlay is a
# typed refusal with no default table. A name no rule matches is answered matched=false, model_call_required=true:
# the caller sends that check to the model rung.
name: "node_ci_red_kind_rule_compute"
contract_name: "node_ci_red_kind_rule_compute"
node_name: "node_ci_red_kind_rule_compute"
lifecycle: experimental
node_type: "COMPUTE_GENERIC"
contract_version:
  major: 0
  minor: 1
  patch: 0
node_version:
  major: 0
  minor: 1
  patch: 0
description: >
  Reads the name of one failed CI check against an ordered pattern table from the node's overlay and names its
  kind when a pattern matches. Every kind name and pattern is an overlay value, never this node's. A name no
  pattern matches is returned as needing the model; the node never guesses a kind.
input_model:
  name: "ModelCiRedKindRuleRequest"
  module: "omnimarket.nodes.node_ci_red_kind_rule_compute.models.model_ci_red_kind_rule_request"
  description: "The failed check's name."
output_model:
  name: "ModelCiRedKindRuleAnswer"
  module: "omnimarket.nodes.node_ci_red_kind_rule_compute.models.model_ci_red_kind_rule_answer"
  description: "The matched kind and rule position, or no match with model_call_required, or a typed refusal."
handler:
  module: "omnimarket.nodes.node_ci_red_kind_rule_compute.handlers.handler_ci_red_kind_rule"
  class: "HandlerCiRedKindRule"
  input_model: "omnimarket.nodes.node_ci_red_kind_rule_compute.models.model_ci_red_kind_rule_request.ModelCiRedKindRuleRequest"
  output_model: "omnimarket.nodes.node_ci_red_kind_rule_compute.models.model_ci_red_kind_rule_answer.ModelCiRedKindRuleAnswer"
handler_routing:
  routing_strategy: "operation_match"
  default_handler: "omnimarket.nodes.node_ci_red_kind_rule_compute.handlers.handler_ci_red_kind_rule:HandlerCiRedKindRule"
  handlers:
    - operation: "classify_ci_red_kind_by_rule"
      handler:
        name: "HandlerCiRedKindRule"
        module: "omnimarket.nodes.node_ci_red_kind_rule_compute.handlers.handler_ci_red_kind_rule"
runtime_dispatch:
  external_trigger: "Direct Python invocation by the caller that sends a failed check to the model rung, with the failed check's name."
event_bus:
  subscribe_topics: []
  publish_topics: []
# No bus topics: the caller that sends a failed check to the model rung calls this handler
# in process first, like the landing controller does the decision node. A topic would need broker permission rows in
# the overlays repository (broker-acl-coverage-gate); add the topics and the rows together when a bus caller exists.
runtime_profiles: []
descriptor:
  runtime_profiles: []
  node_archetype: compute
  purity: impure  # reads the bound overlay file; writes nothing
  idempotent: true
  timeout_ms: 5000
metadata:
  transport_type: local
  description: "Rule-first pre-classifier for failed CI checks whose name decides their kind."
  author: "OmniNode Team"
  license: "MIT"
  created: "2026-11-13"
  tags:
    - compute
    - triage
    - ci-red
    - rule
