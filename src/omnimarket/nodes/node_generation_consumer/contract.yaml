name: node_generation_consumer
contract_version: {major: 1, minor: 0, patch: 0}
node_type: orchestrator
node_version: {major: 1, minor: 0, patch: 0}

description: >
  Generates ONEX compute nodes from natural language descriptions.
  Validates contract + syntax + security, retries on failure, emits benchmark metrics.
  On success, emits a registration event so ServiceMCPToolSync picks up the new tool.

handler_routing:
  routing_strategy: operation_match
  handlers:
    - handler:
        name: HandlerGenerationConsumer
        module: omnimarket.nodes.node_generation_consumer.handlers.handler_generation_consumer
      event_model:
        name: ModelNodeGenerationRequest
        module: omnimarket.nodes.node_generation_consumer.models.model_generation
      event_type: omnimarket.node-generation-requested
      message_category: command
    - handler:
        name: HandlerGeneratedExecutor
        module: omnimarket.nodes.node_generation_consumer.handlers.handler_generated_executor
      event_model:
        name: ModelNodeDeploy
        module: omnimarket.nodes.node_generation_consumer.models.model_generation
      event_type: omnimarket.node-deploy
      message_category: command

descriptor:
  node_archetype: orchestrator
  purity: effectful
  idempotent: false
  timeout_ms: 120000
  runtime_profiles:
    - effects

inputs:
  task_description:
    type: str
    description: "Natural language description of the node to generate"
    required: true
  correlation_id:
    type: uuid
    description: "Unique run ID for event tracing"
    required: true
  max_attempts:
    type: int
    description: "Maximum LLM retry attempts on validation failure"
    required: false
    default: 10
  # P2-1 context-injection seam (OMN-12794) — all optional with safe defaults.
  # Do not use previous_errors for context; that is the internal repair-loop channel.
  context_pack:
    type: str
    description: "Serialised context pack text prepended to the generation prompt; empty = off arm"
    required: false
    default: ""
  context_artifacts:
    type: list
    description: "Structured per-artifact provenance for audit/replay; handler uses context_pack for the prompt"
    required: false
    default: []
  context_pack_hash:
    type: str
    description: "SHA-256 hex digest of context_pack (sha256:<hex>); empty when context_pack is empty"
    required: false
    default: ""
  # OMN-13289 (G0): validator-generation acceptance corpus. Optional with a null
  # default so ordinary free-text node generation is unaffected. When present,
  # the run is a VALIDATOR generation: the generated scanner is accepted only if
  # it flags every violation_fixture and passes every clean_fixture, by
  # deterministic execution (the corpus, NOT the LLM, is the acceptance
  # authority). The corpus must include at least one adversarial mutation case.
  validator_corpus:
    type: object
    description: >-
      ModelValidatorCorpus gating acceptance of the generated validator
      (violation_fixtures the scanner MUST flag, clean_fixtures it MUST pass).
      Null for ordinary free-text generation (no corpus gate).
    required: false
    default: null

outputs:
  contract_passed:
    type: bool
    description: "True if the generated node passed all validation checks"
  # OMN-13289 (G0): validator-acceptance verdict (the corpus gate is the
  # acceptance authority, not the LLM).
  corpus_checked:
    type: bool
    description: "True when this run carried a validator acceptance corpus"
  corpus_passed:
    type: bool
    description: "True only when the generated scanner flagged every violation_fixture and passed every clean_fixture"
  attempt_count:
    type: int
    description: "Number of generation attempts made"
  total_latency_e2e_ms:
    type: int
    description: "Total end-to-end latency in milliseconds"
  cost_inference_usd:
    type: float
    description: "Estimated inference cost in USD"
  # P2-1 token split + attempt-reduction telemetry (OMN-12794)
  prompt_tokens:
    type: int
    description: "Total prompt tokens across all attempts"
  completion_tokens:
    type: int
    description: "Total completion tokens across all attempts"
  first_pass_success:
    type: bool
    description: "True when contract validation passed on the first attempt"
  context_pack_hash:
    type: str
    description: "Echoed context_pack_hash from the command for scorer correlation"

terminal_event: onex.evt.omnimarket.node-generation-completed.v1

event_bus:
  subscribe_topics:
    - onex.cmd.omnimarket.node-generation-requested.v1
    # OMN-12826 (B1): HandlerGeneratedExecutor consumes node-deploy commands,
    # sandbox-loads the generated handler, invokes it, and emits the terminal
    # result on generated-node-invoked. The deploy command is published by this
    # same node's generation flow (_emit_deploy) and consumed by the executor.
    - onex.cmd.omnimarket.node-deploy.v1
    # OMN-13356: the tool-reuse pre-check is bus-native. Before generating, this
    # node publishes a tool-reuse-match-requested command (below) and awaits the
    # matcher's verdict on one of these two terminals. A MATCHED verdict
    # short-circuits generation (the existing tool is returned, no LLM call); a
    # NO_MATCH verdict proceeds to fresh generation. Both terminals are produced
    # by node_tool_reuse_matcher_compute.
    - onex.evt.omnimarket.tool-reuse-matched.v1
    - onex.evt.omnimarket.tool-reuse-no-match.v1
  publish_topics:
    - onex.evt.omnimarket.node-generation-completed.v1
    - onex.evt.omnimarket.node-generation-failed.v1
    - onex.evt.platform.node-registration.v1
    - onex.cmd.omnimarket.node-deploy.v1
    # OMN-12826 (B1): terminal result of a sandbox invocation. Carries the same
    # evidence shape future runtime dispatch (NodeInvocationAdapter.dispatch)
    # produces, explicitly labelled non-hot-load (_runtime_backend=sandbox).
    - onex.evt.omnimarket.generated-node-invoked.v1
    # OMN-12829 (C1): escalation proof emitted on contract-validation failure
    # with attempts remaining. The next tier/model/endpoint is selected by the
    # ROUTING AUTHORITY (node_delegation_routing_reducer); this node only records
    # the authority's decision (tier, provider, model, endpoint, attempt_count,
    # escalation_reason). Generation does NOT select the next model itself.
    - onex.evt.omnimarket.delegation-escalation-triggered.v1
    # OMN-13356: the tool-reuse pre-check command. Published BEFORE the LLM
    # generation loop runs; consumed by node_tool_reuse_matcher_compute, which
    # replies on tool-reuse-matched.v1 / tool-reuse-no-match.v1 (subscribed
    # above). A MATCHED verdict short-circuits generation; NO_MATCH proceeds.
    - onex.cmd.omnimarket.tool-reuse-match-requested.v1

model_routing:
  # OMN-12779 + OMN-12801: provider, served_model_id, and endpoint_ref are
  # declared here. The endpoint URL + api_key reference are NOT declared via an
  # env var — they are resolved per-model from the routing authority (the bifrost
  # delegation contract overlay keyed by endpoint_ref), the same authority the
  # delegation routing reducer uses. A shared LLM_CODER_URL env cannot serve
  # multiple providers (vLLM/Gemini/OpenRouter have distinct URLs), so there is
  # no endpoint_env / endpoint_mode indirection.
  provider: local
  served_model_id: Qwen3.6-35B-A3B
  endpoint_ref: local-coder
  routing_source: contract
  # OMN-12829 (C1): task class driving the routing-authority escalation ladder
  # (task_class_contracts.escalation_policy.tier_order). Node generation is a
  # code-generation task; declared here so the escalation tier order is
  # contract-governed, never inferred from the prompt or a code literal.
  # OMN-12890: when local tier exhausts retries the routing authority escalates to
  # cheap_cloud, selecting backend cloud-gemini-flash (model: gemini-2.5-flash-lite
  # via AI Studio key GEMINI_API_KEY). The prior model gemini-2.0-flash hit free-tier
  # quota (HTTP 429); gemini-2.5-flash-lite is quota-available on the same key.
  task_type: code_generation
  # OMN-12816: provider-specific inference params merged into the LLM request body
  # (ModelLlmInferenceRequest.extra_body). enable_thinking:false suppresses the
  # reasoning preamble on Qwen vLLM backends so the FIRST attempt returns clean
  # fenced blocks (deterministic; turns attempt_count=2 into 1). Contract-native —
  # no env var, no code literal. Backends that ignore the key are unaffected.
  inference_extra_body:
    chat_template_kwargs:
      enable_thinking: false
  auth:
    shared_secret_env: LOCAL_LLM_SHARED_SECRET
    cidr_allowlist_env: LLM_ENDPOINT_CIDR_ALLOWLIST

dependencies:
  - name: llm_shared_secret
    type: environment
    key: LOCAL_LLM_SHARED_SECRET
    description: "HMAC shared secret for local LLM trust boundary enforcement"
    required: true
  - name: llm_cidr_allowlist
    type: environment
    key: LLM_ENDPOINT_CIDR_ALLOWLIST
    description: "CIDR ranges for local LLM endpoint allowlist — set via overlay from Infisical"
    required: true

mcp:
  expose: true
  tool_name: "generate_onex_node"
  description: "Generate a new ONEX compute node from a natural language description"
  timeout_seconds: 120

metadata:
  transport_type: kafka
  description: "Generation consumer node — generates ONEX nodes from natural language, validates, emits benchmark"
  author: "OmniNode Platform Team"
  created: "2026-05-16"
  demo_path: true  # OMN-12777: demo-path topic coherence gate scope marker
  tags:
    - "orchestrator"
    - "generation"
    - "hackathon"
    - "llm"
    - "node-generation"
    - "OMN-12683"
    - "OMN-11092"
    - "OMN-12794"
  related_tickets:
    - "OMN-12683"
    - "OMN-11092"
    - "OMN-11091"
    - "OMN-12794"
