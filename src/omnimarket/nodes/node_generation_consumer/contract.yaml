name: node_generation_consumer
contract_version: {major: 1, minor: 0, patch: 0}
node_type: orchestrator
node_version: {major: 1, minor: 0, patch: 0}

description: >
  Generates ONEX compute nodes from natural language descriptions.
  Validates contract + syntax + security, retries on failure, emits benchmark metrics.
  On success, emits a registration event so ServiceMCPToolSync picks up the new tool.

handler_routing:
  routing_strategy: operation_match
  handlers:
    - handler:
        name: HandlerGenerationConsumer
        module: omnimarket.nodes.node_generation_consumer.handlers.handler_generation_consumer
      event_model:
        name: ModelNodeGenerationRequest
        module: omnimarket.nodes.node_generation_consumer.models.model_generation

descriptor:
  node_archetype: orchestrator
  purity: effectful
  idempotent: false
  timeout_ms: 120000
  runtime_profiles:
    - effects

inputs:
  task_description:
    type: str
    description: "Natural language description of the node to generate"
    required: true
  correlation_id:
    type: uuid
    description: "Unique run ID for event tracing"
    required: true
  max_attempts:
    type: int
    description: "Maximum LLM retry attempts on validation failure"
    required: false
    default: 2
  # P2-1 context-injection seam (OMN-12794) — all optional with safe defaults.
  # Do not use previous_errors for context; that is the internal repair-loop channel.
  context_pack:
    type: str
    description: "Serialised context pack text prepended to the generation prompt; empty = off arm"
    required: false
    default: ""
  context_artifacts:
    type: list
    description: "Structured per-artifact provenance for audit/replay; handler uses context_pack for the prompt"
    required: false
    default: []
  context_pack_hash:
    type: str
    description: "SHA-256 hex digest of context_pack (sha256:<hex>); empty when context_pack is empty"
    required: false
    default: ""

outputs:
  contract_passed:
    type: bool
    description: "True if the generated node passed all validation checks"
  attempt_count:
    type: int
    description: "Number of generation attempts made"
  total_latency_e2e_ms:
    type: int
    description: "Total end-to-end latency in milliseconds"
  cost_inference_usd:
    type: float
    description: "Estimated inference cost in USD"
  # P2-1 token split + attempt-reduction telemetry (OMN-12794)
  prompt_tokens:
    type: int
    description: "Total prompt tokens across all attempts"
  completion_tokens:
    type: int
    description: "Total completion tokens across all attempts"
  first_pass_success:
    type: bool
    description: "True when contract validation passed on the first attempt"
  context_pack_hash:
    type: str
    description: "Echoed context_pack_hash from the command for scorer correlation"

terminal_event: onex.evt.omnimarket.node-generation-completed.v1

event_bus:
  subscribe_topics:
    - onex.cmd.omnimarket.node-generation-requested.v1
  publish_topics:
    - onex.evt.omnimarket.node-generation-completed.v1
    - onex.evt.omnimarket.node-generation-failed.v1
    - onex.evt.omnimarket.node-registered.v1
    - onex.cmd.omnimarket.node-deploy.v1

model_routing:
  # OMN-12779: all four routing authorities declared here, not via env indirection.
  # provider, served_model_id, endpoint_ref, and routing_source are explicit.
  # endpoint_env names the env var that holds the URL value (overlay mechanism);
  # the env var NAME comes from this contract, its VALUE from the overlay system.
  provider: local
  served_model_id: Qwen3.6-35B-A3B
  endpoint_ref: local-coder
  endpoint_env: LLM_CODER_URL
  endpoint_mode: complete_endpoint
  routing_source: contract
  auth:
    shared_secret_env: LOCAL_LLM_SHARED_SECRET
    cidr_allowlist_env: LLM_ENDPOINT_CIDR_ALLOWLIST

dependencies:
  - name: llm_coder_url
    type: environment
    key: LLM_CODER_URL
    description: >
      Endpoint URL for the generation LLM. Set via overlay from Infisical.
      model_routing.endpoint_mode declares whether this value is a complete
      endpoint posted verbatim via endpoint_url or an OpenAI-compatible base URL
      that keeps the /v1/chat/completions append.
      The env var NAME is declared by this contract (LLM_CODER_URL);
      its VALUE is populated by the overlay system at runtime.
    required: true
  - name: llm_shared_secret
    type: environment
    key: LOCAL_LLM_SHARED_SECRET
    description: "HMAC shared secret for local LLM trust boundary enforcement"
    required: true
  - name: llm_cidr_allowlist
    type: environment
    key: LLM_ENDPOINT_CIDR_ALLOWLIST
    description: "CIDR ranges for local LLM endpoint allowlist — set via overlay from Infisical"
    required: true

mcp:
  expose: true
  tool_name: "generate_onex_node"
  description: "Generate a new ONEX compute node from a natural language description"
  timeout_seconds: 120

metadata:
  transport_type: kafka
  description: "Generation consumer node — generates ONEX nodes from natural language, validates, emits benchmark"
  author: "OmniNode Platform Team"
  created: "2026-05-16"
  tags:
    - "orchestrator"
    - "generation"
    - "hackathon"
    - "llm"
    - "node-generation"
    - "OMN-12683"
    - "OMN-11092"
    - "OMN-12794"
  related_tickets:
    - "OMN-12683"
    - "OMN-11092"
    - "OMN-11091"
    - "OMN-12794"
