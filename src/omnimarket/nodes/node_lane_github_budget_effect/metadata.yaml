name: node_lane_github_budget_effect
version: 1.0.0
description: Enforce the remote runner's lane read budget, share successful CI reads
  across lanes on a host, and relay sanitized accounting to the landing controller.
  This is the runner's process boundary; GitHub reads remain work of the existing
  node_github_repo_gateway_effect through onex scm, never a second REST client.
pack: distributed_validation
node_role: effect
display_name: Lane Github Budget Effect
omnibase_core_compat: '>=0.39.0,<1.0.0'
entry_points:
  onex.nodes:
    node_lane_github_budget_effect: omnimarket.nodes.node_lane_github_budget_effect
capabilities:
  standalone: false
  full_runtime: false
  requires_network: true
  requires_repo: false
  requires_secrets: false
  requires_docker: false
  side_effect_class: read_write
dependencies:
- pydantic>=2.0
authors:
- OmniNode Platform Team
license: MIT
tags:
- effect
- remote-lane
