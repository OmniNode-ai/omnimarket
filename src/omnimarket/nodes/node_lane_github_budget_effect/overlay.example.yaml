# Overlay of node_lane_github_budget_effect (OMN-23832). The deployment's file lives at
# <root>/node_lane_github_budget_effect/overlay.yaml under a root named in ONEX_SKILL_OVERLAY_ROOTS,
# or the file ONEX_LANE_GITHUB_BUDGET_OVERLAY names. No key has a default.
# Gateway cache misses one lane may spend; a cache hit and a cache_only read cost nothing.
# 24 (OMN-25538): eight ended two lanes that read the failing jobs of three pull requests. The gateway's own
# lane_miss_fill_max per window still bounds the GitHub calls all lanes make together.
gateway_cache_misses_per_lane: 24
