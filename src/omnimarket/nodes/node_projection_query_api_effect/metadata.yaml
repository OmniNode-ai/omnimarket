name: node_projection_query_api_effect
version: "0.1.0"
description: "Answers the projection query routes (projections, status page, projection pages, evidence pipeline) from the writers' tables, served through the runtime's contract-declared ASGI mount"
omnibase_core_compat: ">=0.39.0,<1.0.0"
entry_points:
  onex.nodes:
    node_projection_query_api_effect: "omnimarket.nodes.node_projection_query_api_effect"
capabilities:
