name: node_one_copy_check_effect
contract_name: node_one_copy_check_effect
node_name: node_one_copy_check_effect
contract_version: {major: 1, minor: 0, patch: 0}
node_version: {major: 1, minor: 0, patch: 0}
node_type: effect
lifecycle: experimental
runtime_profiles: [effects]
description: >
  The real backend of the one-copy check (node_one_copy_check_compute): reads the installed units' declarations, the ticks' sources
  and the writers' sources the compute node's overlay names, under the registry root the caller passes, and runs the pure check over
  them. A violation (two live implementations, the fix in a copy no unit runs, a venv writer with no lock) is a result the caller
  reads and a one_copy_violation failure on the floor's emission chain; a file that cannot be read is a referrers_unreadable failure,
  never a clean check. It holds no behaviour name, marker or path: all of them are the compute node's overlay values.
handler:
  module: omnimarket.nodes.node_one_copy_check_effect.handlers.handler_one_copy_check_effect
  class: HandlerOneCopyCheckEffect
  input_model: omnimarket.nodes.node_one_copy_check_compute.models.model_one_copy_check.ModelOneCopyCheckRequest
  output_model: omnimarket.nodes.node_one_copy_check_compute.models.model_one_copy_check.ModelOneCopyCheckResult
descriptor:
  node_archetype: effect
  runtime_profiles: [effects]
  purity: impure
  idempotent: true
  side_effects: [file-read]
  timeout_ms: 30000
input_model:
  name: ModelOneCopyCheckRequest
  module: omnimarket.nodes.node_one_copy_check_compute.models.model_one_copy_check
  description: One check; it carries only the instant to stamp the result with.
output_model:
  name: ModelOneCopyCheckResult
  module: omnimarket.nodes.node_one_copy_check_compute.models.model_one_copy_check
  description: Each behaviour's live implementations and the copies nothing runs, each resource's writers, and the findings.
event_bus:
  subscribe_topics: []
  publish_topics: []
dependency_ownership:
  overlay: "The overlay is node_one_copy_check_compute's; the caller (a lane's check step or a tick) loads it and passes the registry root."
runtime_dispatch:
  external_trigger: Direct Python invocation; the chain events go to the floor's emission journal.
protocol_dependencies:
- name: ProtocolReferrerReader
  module: omnimarket.nodes.node_one_copy_check_compute.protocols.protocol_referrer_reader
  default: InMemoryReferrerReader
  real_backend: FileReferrerReader
metadata:
  ticket: OMN-19998
  transport_type: local
