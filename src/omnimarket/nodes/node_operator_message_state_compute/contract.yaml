name: node_operator_message_state_compute
node_type: COMPUTE_GENERIC
runtime_profiles: [main]
contract_version: {major: 0, minor: 1, patch: 0}
node_version: 0.1.0
lifecycle: experimental
description: Pure accountable operator message arrival and reply fold.
input_model:
  name: ModelOperatorMessageStateRequest
  module: omnimarket.models.model_operator_message_state
output_model:
  name: ModelOperatorMessageStateReport
  module: omnimarket.models.model_operator_message_state
handler:
  module: omnimarket.nodes.node_operator_message_state_compute.handlers.handler_operator_message_state
  class: HandlerOperatorMessageState
  input_model: omnimarket.models.model_operator_message_state.ModelOperatorMessageStateRequest
  output_model: omnimarket.models.model_operator_message_state.ModelOperatorMessageStateReport
handler_routing:
  routing_strategy: operation_match
  default_handler: omnimarket.nodes.node_operator_message_state_compute.handlers.handler_operator_message_state:HandlerOperatorMessageState
  handlers:
    - operation: fold_operator_message_state
      topic: onex.cmd.omnimarket.operator-message-state-requested.v1
      handler:
        name: HandlerOperatorMessageState
        module: omnimarket.nodes.node_operator_message_state_compute.handlers.handler_operator_message_state
entrypoint:
  name: NodeOperatorMessageStateCompute
  module: omnimarket.nodes.node_operator_message_state_compute.node
terminal_event: onex.evt.omnimarket.operator-message-state-completed.v1
runtime_dispatch:
  command_topic: onex.cmd.omnimarket.operator-message-state-requested.v1
  terminal_events:
    success: onex.evt.omnimarket.operator-message-state-completed.v1
    failure: onex.evt.omnimarket.operator-message-state-failed.v1
event_bus:
  subscribe_topics: [onex.cmd.omnimarket.operator-message-state-requested.v1]
  publish_topics: [onex.evt.omnimarket.operator-message-state-completed.v1, onex.evt.omnimarket.operator-message-state-failed.v1]
descriptor:
  node_archetype: compute
  purity: pure
  idempotent: true
  timeout_ms: 5000
config:
  arrival_kinds: [operator-message, operator_prompt, message, arrival]
  arrival_row_kinds: [STATUS]
  reply_kinds: [operator-reply, reply]
  reply_row_kinds: [MSG, STATUS]
  message_id_cells: [item]
  source_id_cells: [prompt_id, capture, id]
  answer_cells: [answers]
  operator_recipient: operator
  default_owner: orchestrator
  item_prefix: message-
  id_chars: 16
  unanswered_state: unanswered
  answered_state: answered
dod_evidence:
  PYTEST:
    command: uv run pytest tests/unit/nodes/node_operator_message_state_compute -q
    pass_criteria: every test passes
