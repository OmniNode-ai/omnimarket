name: node_session_front_door_compute
lifecycle: experimental
node_type: COMPUTE_GENERIC
runtime_profiles: []
contract_version:
  major: 1
  minor: 0
  patch: 0
node_version: 1.0.0
description: The session-start entry and the session file and row operations, bound to the session's principal through the team identity declaration. A session the declaration does not positively match as the operator runs the preflight under the team profile; the required-check assertion on the receipt requires, under team, the four ledger checks without coordination_host and validates profile, overlay hash, per-check success and the overall verdict, and under operator all five as before. The host mode is coordination, detached or unknown for the operator as before, and bus-member for a team session only when its current receipt passes and the bus configuration holds (bound lane login, declared host, executable append command, ledger mirror and archive); it is decided before the first CLAIM and is never attachment proof. A refused or unknown CLAIM append stops startup, and session.env records the session's profile and principal.
