# ONEX Node Contract - Delegation Scenario Days Effect (OMN-23171, readiness plan A1)
#
# One scheduled read of the delegation readiness scenarios' results. Each scenario node writes one ledger STATUS row per
# slot (scenario=, slot=, trigger=, conclusion=); this node pages through those rows for the window over the bus read
# command, has node_delegation_scenario_days_compute count the consecutive green UTC days, publishes the rows keyed by
# scenario id, writes one STATUS row and emits the result on the bus. A page that does not answer, or a read that
# reaches max_pages with more to read, makes every row red.
name: node_delegation_scenario_days_effect
contract_name: node_delegation_scenario_days_effect
node_name: node_delegation_scenario_days_effect
contract_version: {major: 0, minor: 1, patch: 0}
node_version: {major: 0, minor: 1, patch: 0}
node_type: effect
lifecycle: experimental
runtime_profiles: [effects]

description: >
  Reads the scenarios' recorded results from the ledger, computes each scenario's consecutive green UTC days with
  node_delegation_scenario_days_compute, writes scenario-green-days.json (rows keyed by scenario id), appends one STATUS
  row and emits the result on the bus. The node's own systemd user timer (`schedule install`) runs it hourly.

handler:
  module: omnimarket.nodes.node_delegation_scenario_days_effect.handlers.handler_scenario_days_run
  class: HandlerScenarioDaysRun
  input_model: omnimarket.models.model_delegation_scenario.ModelScenarioDaysRunCommand

# Not a runtime-dispatched handler: HandlerScenarioDaysRun takes its contract runtime block, paths, ledger read and
# append routes, event sink and clock as constructor parameters, so the node runs through its own CLI and schedule.

descriptor:
  node_archetype: effect
  runtime_profiles: [effects]
  purity: impure
  idempotent: true
  side_effects: [file-write, ledger-append, bus-publish]
  timeout_ms: 300000

input_model:
  name: ModelScenarioDaysRunCommand
  module: omnimarket.models.model_delegation_scenario
  description: One read of the scenarios' green days; it carries no value.
output_model:
  name: ModelScenarioGreenDays
  module: omnimarket.models.model_delegation_scenario
  description: One row per scenario, keyed by scenario id.

terminal_event: onex.evt.omnimarket.delegation-scenario-green-days-published.v1

runtime_dispatch:
  external_trigger: true

event_bus:
  subscribe_topics: []
  publish_topics:
    - onex.evt.omnimarket.delegation-scenario-green-days-published.v1

externally_consumed_topics:
  - onex.evt.omnimarket.delegation-scenario-green-days-published.v1

runtime:
  home_env: OMNI_HOME
  # The ledger is on the bus: results are read as `rows` point queries and the STATUS row is one bus append. Each command
  # is named by a variable the deployment sets; nothing here reads or names the ledger file.
  ledger_read_command_env: ONEX_LEDGER_BUS_READ_COMMAND
  ledger_read_timeout_seconds: 120
  ledger_append_command_env: ONEX_LEDGER_BUS_APPEND_COMMAND
  ledger_append_timeout_seconds: 60
  host_env: ONEX_HOST_NAME
  bus_emit_command_env: ONEX_BUS_EMIT_COMMAND
  # Every event is journalled here; when the deployment names a bus produce command in bus_emit_command_env it also gets the event.
  event_journal_relpath: .onex_state/delegation-scenario-days/events.jsonl
  bus_emit_timeout_seconds: 60
  published_relpath: .claude_scratch/delegation-readiness/scenario-green-days.json
  # The day count is a parameter of the reading, not of the rule: the plan's Q1 (five or seven days) is a bar the
  # reader of the rows applies. The window is the complete UTC days ending yesterday that are looked back over.
  window_days: 8
  stale_after_hours: 2
  rows_page_size: 500
  max_pages: 40
  ticket: OMN-23171
  lane: node_delegation_scenario_days_effect
  # The nine scenarios of the readiness plan (2.2) with their cadence and the lane each one's results are written under.
  scenarios:
    - {scenario_id: R1, cadence: hourly, lane: node_delegation_scenario_r1}
    - {scenario_id: R2, cadence: hourly, lane: node_delegation_scenario_r2_effect}
    - {scenario_id: R3, cadence: every_6h, lane: node_delegation_scenario_r3}
    - {scenario_id: R4, cadence: every_6h, lane: node_delegation_scenario_r4}
    - {scenario_id: R5, cadence: hourly, lane: node_delegation_scenario_r5}
    - {scenario_id: R6, cadence: daily, lane: node_delegation_scenario_r6}
    - {scenario_id: R7, cadence: every_6h, lane: node_delegation_scenario_r7}
    - {scenario_id: R8, cadence: every_6h, lane: node_delegation_scenario_r8}
    - {scenario_id: R9, cadence: hourly, lane: node_delegation_scenario_r9}

# Hourly at minute 20 UTC, after the hourly scenario nodes (minute 05) have written their slot's result.
schedule:
  unit_name: onex-delegation-scenario-days
  state_directory: .onex_state/delegation-scenario-days
  timeout_seconds: 300
  unit_environment: [ONEX_LEDGER_BUS_READ_COMMAND, ONEX_LEDGER_BUS_APPEND_COMMAND, ONEX_HOST_NAME, ONEX_BUS_EMIT_COMMAND]
  cadence:
    on_calendar: "*-*-* *:20:00"
    time_zone: UTC
    randomized_delay: 0s
    persistent: true
    description: the delegation scenarios' green days, read hourly at minute 20

metadata:
  ticket: OMN-23171
  transport_type: inmemory
