name: node_host_drift_check_effect
lifecycle: experimental
node_type: EFFECT_GENERIC
runtime_profiles:
- effects
contract_version:
  major: 1
  minor: 0
  patch: 0
node_version: 1.0.0
description: Compare a lab host's measured clones, venvs, prepush workroot and systemd units to its profile
  through an injected measurement port; fail on anything undeclared or missing.
input_model:
  name: ModelHostDriftCheckRequest
  module: omnimarket.models.model_host_profile
output_model:
  name: ModelHostDriftCheckResult
  module: omnimarket.models.model_host_profile
handler:
  module: omnimarket.nodes.node_host_drift_check_effect.handlers.handler_host_drift_check
  class: HandlerHostDriftCheck
  input_model: omnimarket.models.model_host_profile.ModelHostDriftCheckRequest
  output_model: omnimarket.models.model_host_profile.ModelHostDriftCheckResult
handler_routing:
  routing_strategy: payload_type_match
  handlers:
  - handler:
      name: HandlerHostDriftCheck
      module: omnimarket.nodes.node_host_drift_check_effect.handlers.handler_host_drift_check
    event_model:
      name: ModelHostDriftCheckRequest
      module: omnimarket.models.model_host_profile
event_bus:
  subscribe_topics:
  - onex.cmd.omnimarket.host-drift-check-requested.v1
  publish_topics:
  - onex.evt.omnimarket.host-drift-check-completed.v1
runtime_dispatch:
  command_topic: onex.cmd.omnimarket.host-drift-check-requested.v1
descriptor:
  node_archetype: effect
  purity: effectful
  runtime_profiles:
  - effects
  idempotent: true
  timeout_ms: 120000
metadata:
  transport_type: kafka
  description: Compare a lab host's measured clones, venvs, prepush workroot and systemd units to its
    profile through an injected measurement port; fail on anything undeclared or missing.
  created: '2026-11-01'
  tags:
  - host-declaration
terminal_event: onex.evt.omnimarket.host-drift-check-completed.v1
published_events:
- topic: onex.evt.omnimarket.host-drift-check-completed.v1
  event_type: ModelHostDriftCheckResult
externally_consumed_topics:
- onex.evt.omnimarket.host-drift-check-completed.v1
