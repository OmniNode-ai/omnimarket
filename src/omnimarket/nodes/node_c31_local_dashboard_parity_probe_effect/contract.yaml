# ONEX Node Contract - C31 Local Dashboard Parity Probe Effect (OMN-19966)
#
# Moved from the cloud repository's c31 dashboard-parity producer into omnimarket (operator ruling 2026-11-26: a check of the
# local product does not belong in the cloud repository). One run seeds a measured fixture delegation in a scratch HOME, starts
# the real `onex dashboard` there and grades the six pages' contract: the metering payload's fields, the served Runs exposure
# and Overview's savings figure against `onex metering --json` to the cent. The readiness poll and every exposure read send
# Authorization: Bearer with the token read from the credential store under the credential_ref `onex dashboard status --json`
# returns. The run record is shaped as the MVP launch block's ModelMvpRun and goes on the result topic.
# A timer unit (node_host_installer_registry_units, c31-local-dashboard-parity-probe) runs the node daily on the lab.
name: node_c31_local_dashboard_parity_probe_effect
lifecycle: experimental
node_type: effect
contract_version: {major: 0, minor: 1, patch: 0}
node_version: {major: 0, minor: 1, patch: 0}
description: >
  EFFECT: run the C31 local dashboard parity probe once and publish the run (run id, trigger, verdict PASS, FAIL,
  PRECONDITION-ABSENT or ERROR, conclusion success only for PASS, every graded clause) on the result topic. A probe
  that raises is an ERROR run that concludes failure and is still published. The in-memory profile grades nothing
  and reads PRECONDITION-ABSENT; the local profile runs the probe against the onex found in the overlay's directory.
input_model:
  name: ModelC31ProbeRequest
  module: omnimarket.nodes.node_c31_local_dashboard_parity_probe_effect.models.model_c31_probe
  description: "Correlation id and the trigger (schedule or manual)."
output_model:
  name: ModelC31ProbeResult
  module: omnimarket.nodes.node_c31_local_dashboard_parity_probe_effect.models.model_c31_probe
  description: "The run record: run id, times, event, status, conclusion, verdict, clauses, preconditions."
handler:
  module: omnimarket.nodes.node_c31_local_dashboard_parity_probe_effect.handlers.handler_c31_local_dashboard_parity_probe
  class: HandlerC31LocalDashboardParityProbe
  input_model: omnimarket.nodes.node_c31_local_dashboard_parity_probe_effect.models.model_c31_probe.ModelC31ProbeRequest
descriptor:
  node_archetype: effect
  purity: impure
  idempotent: false
  # The probe's own budget: one run may take as long as the producer workflow's limit.
  timeout_ms: 1200000
  runtime_profiles:
    - effects
event_bus:
  subscribe_topics: []
  publish_topics:
    - onex.evt.omnimarket.local-dashboard-parity-probe-completed.v1
terminal_event: onex.evt.omnimarket.local-dashboard-parity-probe-completed.v1
externally_produced_topics: []
externally_consumed_topics:
  - topic: onex.evt.omnimarket.local-dashboard-parity-probe-completed.v1
    consumer: "the MVP launch block (node_floor_simple_effect, M1) reads C31 from the newest scheduled run"
overlay:
  id: node_c31_local_dashboard_parity_probe_effect
  file_env: ONEX_C31_PROBE_OVERLAY
  example: overlay.example.yaml
# The tick publishes the run record on the result topic under the runtime's broker login.
broker_acl_grants:
  - principal: "${ONEX_ACL_RUNTIME_PRINCIPAL}"
    grants:
      - {resource_type: TOPIC, pattern: LITERAL, name: onex.evt.omnimarket.local-dashboard-parity-probe-completed.v1, operation: WRITE}
      - {resource_type: TOPIC, pattern: LITERAL, name: onex.evt.omnimarket.local-dashboard-parity-probe-completed.v1, operation: DESCRIBE}
runtime_dispatch:
  # Once a day one host timer tick runs the node's tick module on a lab host (the unit is declared in the host installer's contract).
  external_trigger: One host timer tick runs the C31 probe on a lab host and publishes the run on the result topic.
  host_unit:
    unit: c31-local-dashboard-parity-probe
reading:
  name: c31_dashboard_parity_newest_scheduled_run
  description: "The conclusion of the newest scheduled run of the probe (success only when every clause held), and its age."
  injected_fault: "A dashboard whose Overview savings figure differs from onex metering by more than a cent (planted in tests as a prober whose parity clause is not ok): the run concludes failure, verdict FAIL, and the tick exits 1."
metadata:
  transport_type: kafka
  description: "Runs the C31 local dashboard parity probe and publishes the run"
  author: "OmniNode Team"
  tags: ["effect", "probe", "c31", "mvp", "OMN-19966"]
