name: node_lane_brief_draft_compute
contract_version: {major: 1, minor: 0, patch: 0}
node_type: compute
node_version: {major: 1, minor: 0, patch: 0}
description: >
  Pure steps of drafting a lane brief on the brief_drafting task class (OMN-17427). The model drafts
  only a title, the premises prose and the task; code fills every other part of the brief. The
  assemble_lane_brief operation takes the drafted slots, the fact table they were drafted from and the
  shell parts (header facts, ticket-state acknowledgements, quoted criteria, the out-of-scope line, the
  standing rules and the 3a block) and returns the brief with each shell part pasted byte for byte, or a
  typed refusal for a missing, empty or repeated slot, a multi-line title, a slot that wrote a shell part
  and an identifier the fact table does not hold. The gate_lane_brief_draft operation takes the brief
  checker's exit code and problems and returns the verdict: only exit 0 is dispatchable; a refusal in a
  shell part is regenerated by code once and never sent back to the model; a free-text refusal redrafts
  on the local rung while attempts remain and then goes to a Claude-written brief. Reads no file, runs no
  checker and calls no model.

handler_routing:
  routing_strategy: operation_match
  handlers:
    - operation: assemble_lane_brief
      handler:
        name: HandlerLaneBriefAssemble
        module: omnimarket.nodes.node_lane_brief_draft_compute.handlers.handler_lane_brief_assemble
      input_model: omnimarket.models.lane_brief_draft.model_lane_brief_assemble_request.ModelLaneBriefAssembleRequest
      output_model: omnimarket.models.lane_brief_draft.model_lane_brief_assemble_result.ModelLaneBriefAssembleResult
    - operation: gate_lane_brief_draft
      handler:
        name: HandlerLaneBriefGate
        module: omnimarket.nodes.node_lane_brief_draft_compute.handlers.handler_lane_brief_gate
      input_model: omnimarket.models.lane_brief_draft.model_lane_brief_gate_request.ModelLaneBriefGateRequest
      output_model: omnimarket.models.lane_brief_draft.model_lane_brief_gate_result.ModelLaneBriefGateResult

handler:
  module: omnimarket.nodes.node_lane_brief_draft_compute.handlers.handler_lane_brief_assemble
  class: HandlerLaneBriefAssemble
  input_model: omnimarket.models.lane_brief_draft.model_lane_brief_assemble_request.ModelLaneBriefAssembleRequest
  output_model: omnimarket.models.lane_brief_draft.model_lane_brief_assemble_result.ModelLaneBriefAssembleResult

descriptor:
  node_archetype: compute
  purity: pure
  idempotent: true
  timeout_ms: 10000
  runtime_profiles: [main]

inputs:
  lane:
    type: str
    required: true
    description: The lane the brief is for.
  ticket:
    type: str
    required: true
    description: The ticket of the lane's CLAIM.
  fact_table:
    type: str
    required: true
    description: The text the model drafted from; an identifier in a slot must occur here.
  drafted_slots:
    type: tuple
    required: true
    description: The title, premises and task slots as the model drafted them.
  shell:
    type: object
    required: true
    description: The shell parts code fills, pasted verbatim.

outputs:
  assembled:
    type: bool
  brief:
    type: str
  issues:
    type: tuple

terminal_event: onex.evt.omnimarket.lane-brief-draft-completed.v1

event_bus:
  subscribe_topics:
    - onex.cmd.omnimarket.lane-brief-draft-requested.v1
  publish_topics:
    - onex.evt.omnimarket.lane-brief-draft-completed.v1

externally_consumed_topics:
  - onex.evt.omnimarket.lane-brief-draft-completed.v1

published_events:
  - event_type: LaneBriefDraftCompleted
    topic: onex.evt.omnimarket.lane-brief-draft-completed.v1
    description: The assembled brief or the refusals of the draft, or the gate verdict on the checker's result.

metadata:
  transport_type: kafka

runtime_dispatch:
  command_topic: onex.cmd.omnimarket.lane-brief-draft-requested.v1
