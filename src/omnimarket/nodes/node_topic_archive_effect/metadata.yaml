name: node_topic_archive_effect
version: "1.0.0"
description: "Archive event-bus topics to cold storage as verified, encrypted daily files with manifests."
omnibase_core_compat: ">=0.46.13,<0.47.0"
entry_points:
  onex.nodes:
    node_topic_archive_effect: "omnimarket.nodes.node_topic_archive_effect"
capabilities:
  standalone: true
  full_runtime: true
  requires_network: true
  requires_repo: false
  requires_secrets: true
  requires_docker: false
  side_effect_class: filesystem_write
dependencies:
  - "omnibase_core>=0.46.13"
  # Broker auth comes from the shared aiokafka auth builder.
  - "omnibase-infra>=0.38.3"
  - "aiokafka"
  - "pyrage"
  - "pyyaml"
authors: ["OmniNode Platform Team"]
license: "MIT"
tags: ["effect", "archive", "cold-storage", "retention", "hook-capture"]
pack: "observability"
display_name: "Topic Archive Effect"
node_role: "effect"
