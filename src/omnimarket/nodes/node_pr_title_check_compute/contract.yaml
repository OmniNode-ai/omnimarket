name: node_pr_title_check_compute
node_type: compute
runtime_profiles: [main]
contract_version: {major: 1, minor: 0, patch: 0}
node_version: "1.0.0"
description: >-
  Definition-B PR title decision ported from onex_change_control
  .github/workflows/pr-title-check-reusable.yml job check-title at
  babdd13ce68f07df20f989f52ff1c4514d03d896.
  Preserves admission, exemption order, exit code and output without I/O, clock or environment access.
input_model:
  name: ModelPrTitleCheckRequest
  module: omnimarket.nodes.node_pr_title_check_compute.models.model_pr_title_check
output_model:
  name: ModelPrTitleCheckResult
  module: omnimarket.nodes.node_pr_title_check_compute.models.model_pr_title_check
handler:
  module: omnimarket.nodes.node_pr_title_check_compute.handlers.handler_pr_title_check
  class: HandlerPrTitleCheck
  input_model: omnimarket.nodes.node_pr_title_check_compute.models.model_pr_title_check.ModelPrTitleCheckRequest
  output_model: omnimarket.nodes.node_pr_title_check_compute.models.model_pr_title_check.ModelPrTitleCheckResult
handler_routing:
  routing_strategy: operation_match
  default_handler: omnimarket.nodes.node_pr_title_check_compute.handlers.handler_pr_title_check:HandlerPrTitleCheck
  handlers:
    - operation: check_pr_title
      handler:
        name: HandlerPrTitleCheck
        module: omnimarket.nodes.node_pr_title_check_compute.handlers.handler_pr_title_check
descriptor:
  node_archetype: compute
  purity: pure
  idempotent: true
  timeout_ms: 1000
inputs:
  title: {type: str, required: true, description: Caller-supplied PR title.}
  author: {type: str, required: true, description: Caller-supplied PR author login.}
outputs:
  admitted: {type: bool}
  reason: {type: str, enum: [empty_title, bot_author, dependency_bump, release, ticket_reference, missing_ticket_reference]}
  exit_code: {type: int}
  output_lines: {type: list}
terminal_event: onex.evt.omnimarket.pr-title-check-completed.v1
runtime_dispatch:
  command_topic: onex.cmd.omnimarket.pr-title-check-requested.v1
event_bus:
  subscribe_topics:
    - onex.cmd.omnimarket.pr-title-check-requested.v1
  publish_topics:
    - onex.evt.omnimarket.pr-title-check-completed.v1
externally_consumed_topics:
  - onex.evt.omnimarket.pr-title-check-completed.v1
metadata:
  transport_type: inmemory
  description: >-
    PR title decision ported from onex_change_control .github/workflows/pr-title-check-reusable.yml
    job check-title at babdd13ce68f07df20f989f52ff1c4514d03d896.
  author: OmniNode Team
  created: "2026-10-10"
  related_tickets: [OMN-20885]
