name: node_agent_review_dispatch_orchestrator
version: "1.0.0"
description: Reviews one pull request head with lab models on the orchestrator's request and publishes one signed receipt as a pull request review
omnibase_core_compat: ">=0.47.28,<0.48.0"
entry_points:
  onex.nodes:
    node_agent_review_dispatch_orchestrator: omnimarket.nodes.node_agent_review_dispatch_orchestrator
capabilities:
  standalone: false
  full_runtime: true
  requires_network: true
  requires_repo: false
