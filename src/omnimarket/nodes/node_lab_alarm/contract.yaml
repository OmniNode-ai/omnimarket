# ONEX Node Contract - Lab Alarm (OMN-23024)
#
# The lab alarm's conditions as one node, starting with broker lag: the watched consumer groups are
# derived from the contracts the running runtime image serves, never listed, and the growth rule reads
# them. The effects-held condition (OMN-23106) is the second: no live member in the delegate-skill
# consumer group past its bound opens one fix lane per episode. Other conditions of scripts/lab_alarm.py
# move here one at a time.
name: node_lab_alarm
contract_name: node_lab_alarm
node_name: node_lab_alarm
contract_version: {major: 1, minor: 0, patch: 0}
node_version: {major: 1, minor: 0, patch: 0}
node_type: effect
lifecycle: experimental
runtime_profiles: [effects]

description: >
  Reads the live consumer groups of the nodes the overlay declares and applies the growth rule. The
  group names come from the manifest the running runtime serves (one group per subscribed topic, from
  each node's contract identity), so a contract version bump or a writer folded into the runtime changes
  the names read in the same step. A run is OK when no watched group grew between two samples, ALARM when
  one grew or lost its offsets, INDETERMINATE when a declared node is absent from the manifest, the
  manifest or a group cannot be read, or there is no previous sample. A manifest endpoint that does not
  answer (dev is redeploying) is retried, then the group names come from the last good manifest while it
  is within the overlay's staleness bound, its age named; with none the run reads INDETERMINATE as
  manifest-unreachable, which says the lag was not read. The backend (in-memory fixtures or
  the lane's manifest URL and broker) comes from the overlay.

  The effects-held condition (HandlerEffectsHeld, verb effects-held) reads the groups matching the overlay's
  prefix and suffix. It is OK while one is Stable with a live member or while none has been absent for the
  overlay's bound, ALARM once none has for at least the bound, INDETERMINATE when the groups cannot be read.
  An ALARM opens one lane through the overlay's dispatch command, once per episode; a dispatch that cannot
  start is retried on the next run and the run exits ALARM with escalation=failed until one starts.

  The broker-listener condition (HandlerBrokerListener, verb broker-listener, OMN-23933) dials the dev broker's
  external listener addresses from the overlay's bootstrap_servers with one Kafka ApiVersions request each. It
  is OK as soon as one address answers, ALARM when every address refused or timed out, INDETERMINATE when a
  name cannot be resolved or the bootstrap string is malformed. The verdict is handed to the alarm delivery
  when the overlay's alarm_delivery block turns it on.

  The dev-tag-heartbeat condition (HandlerDevTagHeartbeat, verb dev-tag-heartbeat) reads the deploy agent's
  heartbeat document at the overlay's agent_url and endpoint_path. For every repository in the overlay's
  repositories, a beat that is missing, stale or alarmed is a breach; a repository alarms only after its
  streak of consecutive breaching runs reaches the overlay's persistence bound, before that the run is OK
  with a waiting reason. An unreadable source, a document with no heartbeat object, or a malformed beat is
  INDETERMINATE, never ALARM and never OK. The verdict is handed to the alarm delivery when the overlay's
  alarm_delivery block turns it on.

  The delegation-chain-canary condition (HandlerDelegationChainCanary, verb delegation-chain-canary, OMN-24400) reads the
  runs of the overlay's canary workflow through the GitHub gateway node. The newest completed run of an admitted event
  decides, in both directions: red, or older than the overlay's bound, or no completed run, is a breach; an unreadable
  surface is INDETERMINATE. A breach alarms after the overlay's persist_runs consecutive runs.

  The work-ledger-projection-stale condition (HandlerWorkLedgerProjectionStale, verb work-ledger-projection-stale,
  OMN-24400) compares the newest canonical row of the rolling ledger file with the newest row of the work-ledger
  projection, asked of the work-ledger query node. A projection behind the file by more than the overlay's bound is a
  breach, alarming after persist_runs consecutive runs; an unreadable file or projection is INDETERMINATE. It measures
  file-versus-projection freshness only, never the liveness of the emit path.

  The lane-drift and container-unhealthy conditions (HandlerLaneCensus, verbs lane-drift and container-unhealthy, OMN-24425)
  read one lane census snapshot, from the overlay's file or declared command. A finding of container_unhealthy kind alarms the
  second condition; every other finding alarms the first, one alarm per snapshot named by its alert key. A snapshot that is
  unreadable, invalid, of another event type, with a mismatched alert key, or older than the overlay's bound is INDETERMINATE.

  The lab-pass-receipt condition (HandlerLabPassReceipt, verb lab-pass-receipt) reads the sha the lane runs from the deploy
  agent and the lab-pass receipt of exactly that sha through the GitHub gateway node. A FAIL receipt is an ALARM; an unresolved sha,
  an absent, stale (another commit or lane) or malformed receipt, or a surface that cannot be read is INDETERMINATE.

  The stale-indeterminate condition (HandlerStaleIndeterminate, verb stale-indeterminate) reads the run records of the overlay's
  watched conditions. A condition whose last after_runs runs all read INDETERMINATE, with no OK and no ALARM between them, alarms.

  Severity routing (HandlerAlarmRoute, OMN-24939): every alarm source carries one declared severity in alarm_sources below, and
  the delivery of every condition goes through the router, which reads it. PAGE and FIX-CAUSE post once per new condition through
  the delivery's own episode rule and once when the condition clears; DIGEST is held for the one daily digest message; DROP never
  posts. Every class still writes its ledger row through the delivery's own ledger step and window. The daily digest
  (HandlerAlarmDigest, verb alarm-digest) posts one message per held day and appends one STATUS row listing the FIX-CAUSE sources
  with their causes. A source with no severity, or an operation of this node no source covers, refuses the load.

handler:
  module: omnimarket.nodes.node_lab_alarm.handlers.handler_broker_lag
  class: HandlerBrokerLag
  input_model: omnimarket.nodes.node_lab_alarm.models.model_lab_alarm.ModelBrokerLagCommand

cli_handlers:
  - operation: broker_lag
    handler:
      name: HandlerBrokerLag
      module: omnimarket.nodes.node_lab_alarm.handlers.handler_broker_lag
  - operation: effects_held
    handler:
      name: HandlerEffectsHeld
      module: omnimarket.nodes.node_lab_alarm.handlers.handler_effects_held
  - operation: broker_listener
    handler:
      name: HandlerBrokerListener
      module: omnimarket.nodes.node_lab_alarm.handlers.handler_broker_listener
  - operation: dev_tag_heartbeat
    handler:
      name: HandlerDevTagHeartbeat
      module: omnimarket.nodes.node_lab_alarm.handlers.handler_dev_tag_heartbeat
  - operation: delegation_chain_canary
    handler:
      name: HandlerDelegationChainCanary
      module: omnimarket.nodes.node_lab_alarm.handlers.handler_delegation_chain_canary
  - operation: work_ledger_projection_stale
    handler:
      name: HandlerWorkLedgerProjectionStale
      module: omnimarket.nodes.node_lab_alarm.handlers.handler_work_ledger_projection_stale
  - operation: lane_drift
    handler:
      name: HandlerLaneCensus
      module: omnimarket.nodes.node_lab_alarm.handlers.handler_lane_census
  - operation: container_unhealthy
    handler:
      name: HandlerLaneCensus
      module: omnimarket.nodes.node_lab_alarm.handlers.handler_lane_census
  - operation: lab_pass_receipt
    handler:
      name: HandlerLabPassReceipt
      module: omnimarket.nodes.node_lab_alarm.handlers.handler_lab_pass_receipt
  - operation: stale_indeterminate
    handler:
      name: HandlerStaleIndeterminate
      module: omnimarket.nodes.node_lab_alarm.handlers.handler_stale_indeterminate
  - operation: alarm_digest
    handler:
      name: HandlerAlarmDigest
      module: omnimarket.nodes.node_lab_alarm.handlers.handler_alarm_digest

# HandlerEffectsHeld (omnimarket.nodes.node_lab_alarm.handlers.handler_effects_held, input
# ModelEffectsHeldCommand) takes its overlay settings, group reader, state store, lane dispatcher and clock
# the same way, and is selected by the CLI verb effects-held; both handlers are built by the CLI, so no
# handler_routing is declared. HandlerBrokerLag takes the overlay, the manifest source, the lag reader and the sample store as
# constructor parameters, so the node runs through its own CLI, not handler_routing.

descriptor:
  node_archetype: effect
  runtime_profiles: [effects]
  purity: impure
  idempotent: true
  side_effects: [state-file-write]
  timeout_ms: 600000

