# ONEX Node Contract - Lab Alarm (OMN-23024)
#
# The lab alarm's conditions as one node, starting with broker lag: the watched consumer groups are
# derived from the contracts the running runtime image serves, never listed, and the growth rule reads
# them. The effects-held condition (OMN-23106) is the second: no live member in the delegate-skill
# consumer group past its bound opens one fix lane per episode. Other conditions of scripts/lab_alarm.py
# move here one at a time.
name: node_lab_alarm
contract_name: node_lab_alarm
node_name: node_lab_alarm
contract_version: {major: 1, minor: 0, patch: 0}
node_version: {major: 1, minor: 0, patch: 0}
node_type: effect
lifecycle: experimental
runtime_profiles: [effects]

description: >
  Reads the live consumer groups of the nodes the overlay declares and applies the growth rule. The
  group names come from the manifest the running runtime serves (one group per subscribed topic, from
  each node's contract identity), so a contract version bump or a writer folded into the runtime changes
  the names read in the same step. A run is OK when no watched group grew between two samples, ALARM when
  one grew or lost its offsets, INDETERMINATE when a declared node is absent from the manifest, the
  manifest or a group cannot be read, or there is no previous sample. A manifest endpoint that does not
  answer (dev is redeploying) is retried, then the group names come from the last good manifest while it
  is within the overlay's staleness bound, its age named; with none the run reads INDETERMINATE as
  manifest-unreachable, which says the lag was not read. The backend (in-memory fixtures or
  the lane's manifest URL and broker) comes from the overlay.

  The effects-held condition (HandlerEffectsHeld, verb effects-held) reads the groups matching the overlay's
  prefix and suffix. It is OK while one is Stable with a live member or while none has been absent for the
  overlay's bound, ALARM once none has for at least the bound, INDETERMINATE when the groups cannot be read.
  An ALARM opens one lane through the overlay's dispatch command, once per episode; a dispatch that cannot
  start is retried on the next run and the run exits ALARM with escalation=failed until one starts.

  The broker-listener condition (HandlerBrokerListener, verb broker-listener, OMN-23933) dials the dev broker's
  external listener addresses from the overlay's bootstrap_servers with one Kafka ApiVersions request each. It
  is OK as soon as one address answers, ALARM when every address refused or timed out, INDETERMINATE when a
  name cannot be resolved or the bootstrap string is malformed. The verdict is handed to the alarm delivery
  when the overlay's alarm_delivery block turns it on.

handler:
  module: omnimarket.nodes.node_lab_alarm.handlers.handler_broker_lag
  class: HandlerBrokerLag
  input_model: omnimarket.nodes.node_lab_alarm.models.model_lab_alarm.ModelBrokerLagCommand

cli_handlers:
  - operation: broker_lag
    handler:
      name: HandlerBrokerLag
      module: omnimarket.nodes.node_lab_alarm.handlers.handler_broker_lag
  - operation: effects_held
    handler:
      name: HandlerEffectsHeld
      module: omnimarket.nodes.node_lab_alarm.handlers.handler_effects_held
  - operation: broker_listener
    handler:
      name: HandlerBrokerListener
      module: omnimarket.nodes.node_lab_alarm.handlers.handler_broker_listener

# HandlerEffectsHeld (omnimarket.nodes.node_lab_alarm.handlers.handler_effects_held, input
# ModelEffectsHeldCommand) takes its overlay settings, group reader, state store, lane dispatcher and clock
# the same way, and is selected by the CLI verb effects-held; both handlers are built by the CLI, so no
# handler_routing is declared. HandlerBrokerLag takes the overlay, the manifest source, the lag reader and the sample store as
# constructor parameters, so the node runs through its own CLI, not handler_routing.

descriptor:
  node_archetype: effect
  runtime_profiles: [effects]
  purity: impure
  idempotent: true
  side_effects: [state-file-write]
  timeout_ms: 600000

input_model:
  name: ModelBrokerLagCommand
  module: omnimarket.nodes.node_lab_alarm.models.model_lab_alarm
  description: Whether to keep the sample, and the fault a drill injects.
output_model:
  name: ModelBrokerLagResult
  module: omnimarket.nodes.node_lab_alarm.models.model_lab_alarm
  description: The derived groups, each group's reading, the alarms, the outcome and why.

terminal_event: onex.evt.omnimarket.lab-alarm-broker-lag-completed.v1

runtime_dispatch:
  external_trigger: true
  command_topic: onex.cmd.omnimarket.lab-alarm-broker-lag-requested.v1

topics:
  broker_lag_requested: onex.cmd.omnimarket.lab-alarm-broker-lag-requested.v1
  broker_lag_run_started: onex.evt.omnimarket.lab-alarm-broker-lag-started.v1
  broker_lag_group_read: onex.evt.omnimarket.lab-alarm-broker-lag-group-read.v1
  broker_lag_run_completed: onex.evt.omnimarket.lab-alarm-broker-lag-completed.v1
  broker_lag_run_failed: onex.evt.omnimarket.lab-alarm-broker-lag-failed.v1
  effects_held_requested: onex.cmd.omnimarket.lab-alarm-effects-held-requested.v1
  effects_held_run_started: onex.evt.omnimarket.lab-alarm-effects-held-started.v1
  effects_held_group_read: onex.evt.omnimarket.lab-alarm-effects-held-group-read.v1
  effects_held_lane_dispatch: onex.evt.omnimarket.lab-alarm-effects-held-lane-dispatched.v1
  effects_held_run_completed: onex.evt.omnimarket.lab-alarm-effects-held-completed.v1
  effects_held_run_failed: onex.evt.omnimarket.lab-alarm-effects-held-failed.v1
  broker_listener_requested: onex.cmd.omnimarket.lab-alarm-broker-listener-requested.v1
  broker_listener_run_started: onex.evt.omnimarket.lab-alarm-broker-listener-started.v1
  broker_listener_run_completed: onex.evt.omnimarket.lab-alarm-broker-listener-completed.v1
  broker_listener_run_failed: onex.evt.omnimarket.lab-alarm-broker-listener-failed.v1

event_bus:
  subscribe_topics: []
  publish_topics: []

externally_consumed_topics:
  - onex.evt.omnimarket.lab-alarm-broker-lag-started.v1
  - onex.evt.omnimarket.lab-alarm-broker-lag-group-read.v1
  - onex.evt.omnimarket.lab-alarm-broker-lag-completed.v1
  - onex.evt.omnimarket.lab-alarm-broker-lag-failed.v1
  - onex.evt.omnimarket.lab-alarm-effects-held-started.v1
  - onex.evt.omnimarket.lab-alarm-effects-held-group-read.v1
  - onex.evt.omnimarket.lab-alarm-effects-held-lane-dispatched.v1
  - onex.evt.omnimarket.lab-alarm-effects-held-completed.v1
  - onex.evt.omnimarket.lab-alarm-effects-held-failed.v1
  - onex.evt.omnimarket.lab-alarm-broker-listener-started.v1
  - onex.evt.omnimarket.lab-alarm-broker-listener-completed.v1
  - onex.evt.omnimarket.lab-alarm-broker-listener-failed.v1

overlay:
  node: node_lab_alarm
  roots_env: ONEX_SKILL_OVERLAY_ROOTS

metadata:
  ticket: OMN-23024
  transport_type: inmemory
