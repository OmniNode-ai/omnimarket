overlay:
  node: node_lab_alarm
  roots_env: ONEX_SKILL_OVERLAY_ROOTS

metadata:
  ticket: OMN-23024
  transport_type: inmemory

# Severity routing (OMN-24939). Read by omnimarket.nodes.node_lab_alarm.handlers.handler_alarm_route.load_alarm_severity_table;
# the load refuses a source with no severity, a fix-cause source with no cause, a condition listed twice and a CLI operation of
# this node that no router source covers. Classes come from the 2026-11-09..16 alarm review (a 12 percent sample); basis says
# whether the review names the source, the nearest named source gave its class, or none did (digest).
alarm_routing:
  digest_state_file: alarm-digest-state.json
  digest_category: lab-alarm-digest
  digest_header_template: ":newspaper: lab alarm daily digest {day} UTC - {episodes} new conditions from {sources} sources"
  digest_line_template: "- {review_name} ({condition}): {episodes} new; latest {subject}: {detail}"
  digest_line_limit: 20
  digest_detail_limit: 160
  clear_category: lab-alarm
  clear_template: ":white_check_mark: lab alarm cleared - {condition}\n*{subject}*"
  fix_cause_status:
    ticket: OMN-24939
    kind: alarm-fix-cause

alarm_sources:
  # --- delivered through node_lab_alarm's delivery: routed by this table ---
  - {condition: consumer_group_lag, severity: drop, review_name: consumer_group_lag lag GREW, basis: named, posts_via: router, operation: broker_lag,
     raised_at: omnimarket/src/omnimarket/nodes/node_lab_alarm/handlers/handler_broker_lag.py:588}
  - {condition: effects_held_behind_runtime, severity: fix-cause, review_name: consumer health STARVED, basis: nearest, posts_via: router, operation: effects_held,
     raised_at: omnimarket/src/omnimarket/nodes/node_lab_alarm/handlers/handler_effects_held.py:43,
     cause: "consumer health HANDLER ERRORS, STALLED and STARVED (node_dlq_replay_effect, github_repo_gateway_effect, pr_landing_orchestrator, node_floor_simple_scheduled_effect, claude_hook_event_effect)"}
  - {condition: broker_listener, severity: digest, review_name: none (dev broker external listener unreachable), basis: default, posts_via: router, operation: broker_listener,
     raised_at: omnimarket/src/omnimarket/nodes/node_lab_alarm/handlers/handler_broker_listener.py:39}
  - {condition: dev_tag_heartbeat, severity: page, review_name: dev deploy agent failing, basis: nearest, posts_via: router, operation: dev_tag_heartbeat,
     raised_at: omnimarket/src/omnimarket/nodes/node_lab_alarm/handlers/handler_dev_tag_heartbeat.py:41}
  - {condition: delegation_chain_canary, severity: digest, review_name: none (delegation chain canary workflow red or old), basis: default, posts_via: router, operation: delegation_chain_canary,
     raised_at: omnimarket/src/omnimarket/nodes/node_lab_alarm/handlers/handler_delegation_chain_canary.py:42}
  - {condition: work_ledger_projection_stale, severity: page, review_name: STALE PROJECTION (hook capture feed dead), basis: nearest, posts_via: router, operation: work_ledger_projection_stale,
     raised_at: omnimarket/src/omnimarket/nodes/node_lab_alarm/handlers/handler_work_ledger_projection_stale.py:47}
  - {condition: lane_drift, severity: drop, review_name: host-drift other, basis: nearest, posts_via: router, operation: lane_drift,
     raised_at: omnimarket/src/omnimarket/nodes/node_lab_alarm/models/model_lab_alarm_lane_census.py:15}
  - {condition: container_unhealthy, severity: fix-cause, review_name: host-drift unit failed, basis: nearest, posts_via: router, operation: container_unhealthy,
     raised_at: omnimarket/src/omnimarket/nodes/node_lab_alarm/models/model_lab_alarm_lane_census.py:16,
     cause: "host-drift unit failed (review-gateway, throughput-tick, hourly-tick, lab-fill exit 70, canonical-clone-sync exit 3, mostly on h200)"}
  - {condition: lab_pass_receipt, severity: page, review_name: no passing lab receipt on an aging dev head (lab-pass/dev-head), basis: named, posts_via: router, operation: lab_pass_receipt,
     raised_at: omnimarket/src/omnimarket/nodes/node_lab_alarm/handlers/handler_lab_pass_receipt.py:49}
  - {condition: stale_indeterminate, severity: digest, review_name: none (a watched condition read INDETERMINATE on its last runs), basis: default, posts_via: router, operation: stale_indeterminate,
     raised_at: omnimarket/src/omnimarket/nodes/node_lab_alarm/handlers/handler_stale_indeterminate.py:42}
  - {condition: lab_alarm_daily_digest, severity: digest, review_name: none (this node's own daily digest), basis: default, posts_via: direct, operation: alarm_digest,
     raised_at: omnimarket/src/omnimarket/nodes/node_lab_alarm/handlers/handler_alarm_digest.py:1}
  # --- delivered through node_lab_alarm_deliver_effect by another node: declared, not routed by this table ---
  - {condition: clone_local_work_refused, severity: fix-cause, review_name: host-drift clone drift, basis: nearest, posts_via: deliver-effect,
     raised_at: omnimarket/src/omnimarket/nodes/node_canonical_clone_dirty_converge_effect/contract.yaml:101,
     cause: "host-drift clone drift (stray files on h201 in the infra clone, workspace/routing_tiers.yaml; untracked lock files on h202 in the registry root)"}
  # --- post to the channel by their own path, not through this node: declared, not routed by this table ---
  - {condition: capture_source_stale, severity: page, review_name: hook capture feed dead (CAPTURE SOURCE STALE), basis: named, posts_via: direct,
     raised_at: omnimarket/src/omnimarket/nodes/node_capture_silence_watch_effect/handlers/build_slack_command.py:37}
  - {condition: quiet_host, severity: page, review_name: QUIET HOST escalation (merged into the capture page), basis: named, posts_via: direct,
     raised_at: omnimarket/src/omnimarket/nodes/node_silent_failure_alarm_compute/handlers/handler_quiet_host_alarm.py:121}
  - {condition: lab_host_disk_nearly_full, severity: page, review_name: lab host disk nearly full (and operator-mac relay disk free), basis: named, posts_via: direct, raised_at: not found}
  - {condition: dev_deploy_agent_failing, severity: page, review_name: dev deploy agent failing (deploy-job-failed), basis: named, posts_via: direct, raised_at: not found}
  - {condition: runner_fleet_canary, severity: page, review_name: CI runner fleet offline (RUNNER FLEET CANARY FAIL), basis: named, posts_via: direct,
     raised_at: omnibase_infra/scripts/ci/runner_fleet_canary.sh:248}
  - {condition: private_hosted_actions_minutes, severity: page, review_name: GitHub-hosted Actions minutes on private repositories above zero, basis: named, posts_via: direct,
     raised_at: omnimarket/src/omnimarket/nodes/node_private_hosted_minutes_watch_effect/handlers/handler_hosted_minutes_tally.py:103}
  - {condition: system_digest_hourly, severity: digest, review_name: hourly lab host system digest, basis: named, posts_via: direct, raised_at: not found}
  - {condition: lane_over_budget, severity: digest, review_name: lane over budget, basis: named, posts_via: direct,
     raised_at: omnimarket/src/omnimarket/models/model_lane_container_budget.py:87}
