# Synthetic values. The deployment's overlay lives at <root>/node_lab_alarm/overlay.yaml under a root
# named in ONEX_SKILL_OVERLAY_ROOTS. No key has a default. The runtime backend swaps the two fixtures
# for the lane's served manifest and its broker.
bus:
  backend: inmemory
  lane: example-lane
manifest:
  url: http://example-host:8085/v1/introspection/manifest
  timeout_seconds: 10
groups:
  env: local
  instance: runtime-main
  nodes:
    - {package: examplepkg, node: projection_example}
lag:
  timeout_seconds: 30
  state_path: .onex_state/lab-alarm/broker-lag-sample.json
injected_fault: A watched group's lag grows between two samples
# The effects-held condition (OMN-23106). Required like every key. The bound is the alarm script's
# own 60 seconds, held here as data.
effects_held:
  group_prefix: local.examplepkg.node_example_consumer.consume.
  group_suffix: .__i.runtime-effects.__t.onex.cmd.example.work-requested.v1
  held_after_seconds: 60
  timeout_seconds: 30
  state_path: .onex_state/lab-alarm/effects-held-state.json
  escalation:
    command: [example-lane-dispatch]
    model: example-model
    ticket: OMN-1
    settle_seconds: 20
    brief_dir: .onex_state/lab-alarm/escalation-briefs
