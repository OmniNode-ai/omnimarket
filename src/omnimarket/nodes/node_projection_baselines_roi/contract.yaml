# ONEX Node Contract — Baselines ROI snapshot projection (OMN-13075, OMN-14630)
#
# Projects daily treatment-vs-control comparison rows from the
# baselines-computed event into the baselines_roi_snapshots table, and exposes
# that table through the projection API on
#   onex.snapshot.projection.baselines.roi.v1  # onex-topic-allow: projection snapshot topics use the onex.snapshot.* prefix by convention
# so the omnidash BaselinesROICard widget (roi-trend, roi-by-model) reads live
# ROI data instead of returning 404 (unknown_topic).
---
name: projection_baselines_roi
contract_version: {major: 1, minor: 0, patch: 0}
node_type: reducer
node_version: {major: 1, minor: 0, patch: 0}
input_model: omnibase_infra.services.observability.baselines.models.model_baselines_snapshot_event.ModelBaselinesSnapshotEvent
description: >
  Aggregates baselines-computed events into a single baselines_roi_snapshots
  row per snapshot_id. Computes token_delta (control minus treatment total
  tokens), average roi_pct/latency_improvement_pct/cost_improvement_pct, and
  total sample_size across the snapshot's comparison rows. The table is
  exposed through the projection API as the baselines ROI snapshot topic
  consumed by the omnidash BaselinesROICard dashboard widget.

handler:
  module: omnimarket.nodes.node_projection_baselines_roi.handlers.handler_projection_baselines_roi
  class: HandlerProjectionBaselinesRoi

handler_routing:
  routing_strategy: operation_match
  handlers:
    - operation: projection_baselines_roi
      handler:
        name: HandlerProjectionBaselinesRoi
        module: omnimarket.nodes.node_projection_baselines_roi.handlers.handler_projection_baselines_roi
      handler_module: omnimarket.nodes.node_projection_baselines_roi.handlers.handler_projection_baselines_roi
      event_model: omnibase_infra.services.observability.baselines.models.model_baselines_snapshot_event.ModelBaselinesSnapshotEvent

terminal_event: onex.evt.omnimarket.projection-baselines-roi-applied.v1

db_io:
  db_tables:
    - name: baselines_roi_snapshots
      database_ref: application
      schema: omninode_internal
      migration: "002_realign_roi_snapshots_to_producer_schema.sql"
      access: write
      role: roi_snapshots

event_bus:
  consumer_group: local.omnimarket.node_projection_baselines_roi.consume.v1
  subscribe_topics:
    - onex.evt.omnibase-infra.baselines-computed.v1
  publish_topics:
    - onex.evt.omnimarket.projection-baselines-roi-applied.v1
  dlq_topics:
    - onex.dlq.omnimarket.projection-baselines-roi-malformed.v1

externally_consumed_topics:
  - onex.evt.omnimarket.projection-baselines-roi-applied.v1

projection_api:
  expose: true
  exposures:
    - topic: onex.snapshot.projection.baselines.roi.v1 # onex-topic-allow: projection snapshot topics use onex.snapshot.* prefix by convention
      table: baselines_roi_snapshots
      schema: public
      columns:
        - snapshot_id
        - captured_at
        - token_delta
        - roi_pct_avg
        - latency_improvement_pct_avg
        - cost_improvement_pct_avg
        - sample_size
        - projected_at
      order_by: projected_at DESC
      freshness_column: projected_at
      limit: 1

metadata:
  transport_type: kafka
