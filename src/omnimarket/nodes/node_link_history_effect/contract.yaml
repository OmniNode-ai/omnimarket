name: node_link_history_effect
lifecycle: experimental
node_type: EFFECT_GENERIC
runtime_profiles: []
contract_version:
  major: 1
  minor: 0
  patch: 0
node_version: 1.0.0
description: Keep each lab host's recent ping-loss reads in one JSON file of the placement directory, and return
  the earlier reads the link gate counts beside the current one. Reads under a minute apart are one observation,
  a read older than 30 minutes is forgotten, and a missing or damaged file reads as no history.
input_model:
  name: ModelLinkHistoryRequest
  module: omnimarket.nodes.node_link_history_effect.models.model_link_history
output_model:
  name: ModelLinkHistoryResult
  module: omnimarket.nodes.node_link_history_effect.models.model_link_history
handler:
  module: omnimarket.nodes.node_link_history_effect.handlers.handler_link_history
  class: HandlerLinkHistory
  input_model: omnimarket.nodes.node_link_history_effect.models.model_link_history.ModelLinkHistoryRequest
  output_model: omnimarket.nodes.node_link_history_effect.models.model_link_history.ModelLinkHistoryResult
handler_routing:
  routing_strategy: operation_match
  default_handler: omnimarket.nodes.node_link_history_effect.handlers.handler_link_history:HandlerLinkHistory
  handlers:
  - operation: handle
    handler:
      name: HandlerLinkHistory
      module: omnimarket.nodes.node_link_history_effect.handlers.handler_link_history
event_bus:
  subscribe_topics: []
  publish_topics: []
runtime_dispatch:
  external_trigger: Direct Python invocation by the host placement caller with supplied runtime ports.
descriptor:
  node_archetype: effect
  purity: effectful
  runtime_profiles: []
  idempotent: false
  timeout_ms: 5000
replay:
  requires_validator_version: true
  timestamp_authority: ingest_sequence
  deterministic: false
metadata:
  transport_type: local
  description: Keep each lab host's recent ping-loss reads in one JSON file of the placement directory, and return
    the earlier reads the link gate counts beside the current one. Reads under a minute apart are one observation,
    a read older than 30 minutes is forgotten, and a missing or damaged file reads as no history.
  author: OmniNode Team
  created: '2026-10-24'
  tags:
  - effect
  - link-history-effect
  - OMN-21373
  related_tickets:
