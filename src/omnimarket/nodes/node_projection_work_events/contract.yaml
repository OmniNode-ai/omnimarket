---
name: projection_work_events
contract_version: {major: 1, minor: 0, patch: 0}
node_type: reducer
node_version: {major: 1, minor: 0, patch: 0}

description: >
  Projects live omniclaude session events (started, prompt-submitted,
  tool-executed, ended) into omninode_internal.work_events -- the L1
  work-ledger surface of the OMN-16176 L0 -> L1 -> L2 ladder. One event
  produces one content-addressed row, so replay is idempotent without any
  cross-dispatch reducer state. The authoritative L0 record remains
  docs/tracking/ROLLING_WORK_LEDGER.md; L0 and L1 dual-write during the
  transition (retiring L0 is OMN-16183/C7). Claims arbitration is NOT here --
  OMN-16179 (C3) puts it on a compacted Kafka view, deliberately not in
  Postgres, so a reducer outage degrades rendering only and never the ability
  to claim work.

handler:
  module: omnimarket.nodes.node_projection_work_events.handlers.handler_projection_work_events
  class: HandlerProjectionWorkEvents
  input_model: omnimarket.nodes.node_projection_work_events.models.model_work_event.ModelWorkEventInbound

handler_routing:
  routing_strategy: topic_match
  handlers:
    - topic: onex.evt.omniclaude.session-started.v1
      operation: work_session_started_projected
      event_model:
        name: ModelWorkEventInbound
        module: omnimarket.nodes.node_projection_work_events.models.model_work_event
      handler:
        name: HandlerProjectionWorkEvents
        module: omnimarket.nodes.node_projection_work_events.handlers.handler_projection_work_events
    - topic: onex.evt.omniclaude.prompt-submitted.v1
      operation: work_prompt_submitted_projected
      event_model:
        name: ModelWorkEventInbound
        module: omnimarket.nodes.node_projection_work_events.models.model_work_event
      handler:
        name: HandlerProjectionWorkEvents
        module: omnimarket.nodes.node_projection_work_events.handlers.handler_projection_work_events
    - topic: onex.evt.omniclaude.tool-executed.v1
      operation: work_tool_executed_projected
      event_model:
        name: ModelWorkEventInbound
        module: omnimarket.nodes.node_projection_work_events.models.model_work_event
      handler:
        name: HandlerProjectionWorkEvents
        module: omnimarket.nodes.node_projection_work_events.handlers.handler_projection_work_events
    - topic: onex.evt.omniclaude.session-ended.v1
      operation: work_session_ended_projected
      event_model:
        name: ModelWorkEventInbound
        module: omnimarket.nodes.node_projection_work_events.models.model_work_event
      handler:
        name: HandlerProjectionWorkEvents
        module: omnimarket.nodes.node_projection_work_events.handlers.handler_projection_work_events

descriptor:
  node_archetype: reducer
  purity: pure
  idempotent: true
  timeout_ms: 30000

# Topic order is load-bearing: handler_projection_work_events._load_topics
# resolves the four topics BY POSITION and refuses to import unless exactly
# four are declared. Reordering this list reclassifies every projected event.
event_bus:
  subscribe_topics:
    - onex.evt.omniclaude.session-started.v1
    - onex.evt.omniclaude.prompt-submitted.v1
    - onex.evt.omniclaude.tool-executed.v1
    - onex.evt.omniclaude.session-ended.v1
  # The RUNTIME publishes this, not the handler. handler_wiring emits the
  # terminal applied-event only when the projection handler's returned
  # ModelProjectionWorkEventsResult carries rows_upserted >= 1 (OMN-13360
  # deterministic-truth gate) -- so the event asserts that a durable row
  # actually landed, never merely that handle() did not raise. That is exactly
  # why this handler returns a real count instead of None: a zero-row path must
  # be able to suppress the event.
  publish_topics:
    - onex.evt.omnimarket.projection-work-events-applied.v1

# The applied-event is a terminal deterministic-truth assertion -- "a durable
# row landed" -- consumed by the observability plane (event ledger, dashboards),
# not by another omnimarket node. Declaring that here is the sanctioned way to
# satisfy the contract-topic-graph gate; adding it to that gate's baseline is
# NOT, because the baseline is frozen pre-existing debt that may only shrink.
externally_consumed_topics:
  - onex.evt.omnimarket.projection-work-events-applied.v1

db_io:
  db_tables:
    - name: work_events
      database_ref: application
      schema: omninode_internal
      migration: "0001_create_work_events.sql"
      access: write
      role: work_events

projection_api:
  expose: true
  topic: "onex.snapshot.projection.work.events.v1"  # onex-topic-allow: projection snapshot topics use onex.snapshot.* prefix by convention
  table: "work_events"
  # OMN-17772. This field previously read "omninode_internal", and the exposure
  # loader's ALLOWED_SCHEMAS is {omnidash_analytics, public} -- so this contract
  # was EXCLUDED at discovery on every projection-api boot, with the reason
  # logged verbatim and the exposure absent from GET /projections entirely. The
  # page could not even refuse it; it was invisible, which is strictly worse
  # than a refusal. `public` is prohibited for application relations by
  # OMN-15361, so this field records the DATABASE the read model lives in. The
  # physical relation is omninode_internal.work_events inside that database,
  # declared exactly that way in db_io above, in the migration, and in the
  # handler's TABLE/SCHEMA constants. On a bus_backed exposure the serving path
  # reads bus_backed + key_columns and never this pair (OMN-15800), so nothing
  # resolves against it; it is a record, and it is an accurate one at the
  # granularity this field allows. Identical to the declaration
  # node_projection_consumer_flow already carries for the same reason.
  schema: "omnidash_analytics"
  columns:
    - "event_id"
    - "emitted_at"
    - "event_kind"
    - "actor_kind"
    - "actor_id"
    - "ticket_id"
    - "summary"
    - "source_topic"
    - "payload"
  json_columns:
    - "payload"
  order_by: "emitted_at DESC"
  freshness_column: "emitted_at"
  limit: 500
  # Declared bus_backed WITH its publish call site in the same change
  # (OMN-17772). The epic's ordering constraint is explicit that bus_backed
  # must not be flipped on a topic whose writer is not deployed and producing:
  # flipping ahead of the writer converts an honest error into a confident
  # zero (OMN-15864 enforces this mechanically). This node's writer IS
  # deployed and subscribed on the .201 dev lane -- consumer group
  # `local.omnimarket.projection_work_events.consume.1.0.0` is registered on
  # all four declared topics -- so the flag follows the writer, not the other
  # way round.
  #
  # No tenant_column: a work event is a platform-internal record of what an
  # actor did in a session, carrying no tenant-scoped customer data, so
  # publish_snapshot_delta's default tenant_id leaks nothing.
  bus_backed: true
  # OMN-17874 deleted the `consumers: none` opt-out that omnimarket#2294 added
  # here. That hatch was correct for the four hours it stood -- it unblocked
  # three unrelated omnibase_infra PRs whose required exposure-reader context had
  # gone red on a condition none of them caused -- and its own reason said reader
  # work must remove it when a surface is added. omnidash#310 added that surface:
  # the `work-events` component declares this topic in its `dataSources`, so the
  # OMN-17199 validator now resolves a real reader and fails `stale_opt_out` on
  # the opt-out standing over it. An opt-out kept past its reader is how an
  # escape hatch becomes a permanent amnesty entry.
  # The row's own content address. `event_id` is derived by `derive_event_id`
  # from (source_topic, actor_id, emitted_at, payload), so a repeat of a key is
  # by construction a byte-identical replay of the same event and there is no
  # intra-key ordering for the snapshot cache to preserve. That is what lets
  # this node publish from the runtime's DB-injection arm, which -- unlike the
  # runner arm -- is handed no Kafka MessageMeta to source real ordering
  # coordinates from (see the handler's _REPLAY_* constants).
  key_columns:
    - "event_id"

metadata:
  transport_type: kafka
