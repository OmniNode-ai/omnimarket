name: node_work_ledger_delegation_mirror
lifecycle: experimental
node_type: compute
contract_version: {major: 1, minor: 0, patch: 0}
node_version: {major: 1, minor: 0, patch: 0}
description: >
  Pure mapping of a completed or failed delegation terminal to one STATUS
  append request. Hosted by the single ledger serve process, which serializes
  these requests with ordinary ledger commands through the existing append
  handler. No shared runtime subscription: only the ledger host can append.
  Every row includes a percent-encoded reason and a reason_source cell.
  Explicit terminal causes precede construction-failure reasons and timeout
  status, then the shared terminal response's failure-evidence reduction for
  failed runs. Reported gate refusals precede remaining status fallbacks.
  An unexplained failure is unreported; a timeout without cause evidence is
  attributed only to status. Failed runs with an attempt failure class retain
  it as last_attempt_failure_class, separately from the terminal's disposition.
  Completed runs do not inherit errors from earlier escalation attempts.
  Prompt, response and raw error text are never copied into ledger cells.
input_model:
  name: ModelDelegateSkillTerminalProjection
  module: omnimarket.models.delegation.wire.model_delegate_skill_terminal_projection
output_model:
  name: ModelWorkLedgerAppendRequest
  module: omnimarket.models.work_ledger_append.model_work_ledger_append
handler:
  module: omnimarket.nodes.node_work_ledger_delegation_mirror.handlers.handler_work_ledger_delegation_mirror
  class: HandlerWorkLedgerDelegationMirror
  input_model: omnimarket.models.delegation.wire.model_delegate_skill_terminal_projection.ModelDelegateSkillTerminalProjection
  output_model: omnimarket.models.work_ledger_append.model_work_ledger_append.ModelWorkLedgerAppendRequest
descriptor:
  node_archetype: compute
  purity: pure
  idempotent: true
  timeout_ms: 5000
# The serve adapter loads these topics from the contract. Keeping event_bus
# and handler_routing absent prevents shared-runtime auto-wiring from racing
# the ledger host.
runtime_dispatch:
  command_topic: onex.evt.omnimarket.delegate-skill-completed.v1
  subscribe_topics:
    - onex.evt.omnimarket.delegate-skill-completed.v1
    - onex.evt.omnimarket.delegate-skill-failed.v1
published_events:
  - event_type: ModelWorkLedgerAppendRequest
    topic: onex.cmd.omnimarket.work-ledger-append-requested.v1
    description: Append request consumed by the ledger host's append handler.
metadata:
  transport_type: kafka
