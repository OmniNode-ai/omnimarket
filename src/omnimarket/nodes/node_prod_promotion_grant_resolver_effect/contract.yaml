# ONEX Node Contract - Prod Promotion Grant Resolver EFFECT
#
# OMN-13439 / OMN-13418 Phase 2b: the orchestrator fact-gathering EFFECT that
# resolves the prod promotion grant from the durable trust anchor BEFORE the prod
# gate evaluates. Reads grants/prod_promotion_grants.yaml from
# omninode_infra@main (anti-self-approval, OMN-10971 — mirrors
# reject-deploy-gate-skip.yml's ?ref=main fetch), parses the YAML directly (ZERO
# Python import on the repository that holds it), and emits the resolved grant (or None —
# fail closed) plus durable audit provenance.
# Every resolve failure (token unresolved or rejected, HTTP error including 404
# on the private anchor, transport error, unparseable registry) returns a typed
# UNREADABLE / UNPARSEABLE refusal on the resolved terminal event with provenance
# (reason, refusal kind, anchor repo, path, ref, http status). The refusal kind
# tells a token that cannot read the private anchor (repository_unreadable) from
# a grant file absent at a commit the token read (grant_file_missing). The orchestrator threads it into
# a gate BLOCKED decision and redeploy-completed BLOCKED. The failure terminal
# remains declared only for an envelope the runtime cannot hand to the handler.
---
name: node_prod_promotion_grant_resolver_effect
contract_version: {major: 1, minor: 0, patch: 0}
node_type: effect
node_version: {major: 1, minor: 0, patch: 0}

description: >
  EFFECT: resolves the prod promotion grant from the durable governance anchor.
  Fetches grants/prod_promotion_grants.yaml from omninode_infra@main (NOT a
  PR branch, so a request cannot author the authorization that approves it),
  keyed by (promotion_batch_id, image_digest, lane=prod), and parses the YAML
  directly without importing anything from the repository that holds it. A present,
  future-expiry, matching entry materializes ModelProdPromotionGrant; a consumed
  entry resolves to ABSENT (no replay); an expired entry to EXPIRED; no match to
  ABSENT — every non-RESOLVED outcome leaves the grant None so the prod gate fails
  closed. Dual-control (approved_by != requested_by) is NOT enforced (OMN-14814):
  a solo CODEOWNER authors and approves their own grant; the anti-self-issuance
  guarantee is the @main fetch, not an approver-identity check. Emits the resolved
  fact plus durable audit provenance (source commit SHA, grant file path,
  grant_id, file sha256, CODEOWNERS-match). The anchor read token is resolved at
  the effect boundary from the contract-declared ONEX_GRANT_ANCHOR_READ_TOKEN ref. No subprocess shell-out.
  Every resolve failure (token unresolved or rejected, HTTP error including 404 on
  the private anchor, transport error, unparseable registry) is returned as a typed
  UNREADABLE / UNPARSEABLE refusal on the resolved terminal event with provenance
  (reason, anchor repo, path, ref, http status). The orchestrator threads this into
  the gate as a BLOCKED decision and a redeploy-completed BLOCKED. The failure
  terminal remains declared only for an envelope the runtime cannot hand to the handler.

handler_routing:
  routing_strategy: operation_match
  handlers:
    - operation: "redeploy.prod_grant.resolve"
      handler:
        name: HandlerProdPromotionGrantResolver
        module: omnimarket.nodes.node_prod_promotion_grant_resolver_effect.handlers.handler_prod_promotion_grant_resolver
      description: "Resolve the prod promotion grant from omninode_infra@main."
      input_model:
        name: ModelProdPromotionGrantResolveCommand
        module: omnimarket.events.runtime_deployment
        description: "Request key + requester + deterministic evaluated_at."

handler:
  module: omnimarket.nodes.node_prod_promotion_grant_resolver_effect.handlers.handler_prod_promotion_grant_resolver
  class: HandlerProdPromotionGrantResolver
  input_model: omnimarket.events.runtime_deployment.ModelProdPromotionGrantResolveCommand

input_model:
  name: ModelProdPromotionGrantResolveCommand
  module: omnimarket.events.runtime_deployment
  description: "Request key (batch, digest, lane=prod) + requester + evaluated_at."
output_model:
  name: ModelProdPromotionGrantResolvedEvent
  module: omnimarket.events.runtime_deployment
  description: "Resolved grant (or None) + typed resolution + audit provenance."

descriptor:
  node_archetype: effect
  purity: impure
  idempotent: true
  timeout_ms: 60000
  runtime_profiles:
    - effects

secrets:
  # The anchor read token is contract-declared so the handler reads the ref name
  # from here — not a bare source literal. Value is resolved at the effect
  # boundary via the canonical secret-store resolver, never committed.
  # OMN-20068: a dedicated ref, not GITHUB_TOKEN. The anchor moved from the
  # public onex_change_control to the private omninode_infra, and a token
  # provisioned for public reads answers 404 there; a shared ref would let that
  # token be reused silently. Store under this key a fine-grained token scoped to
  # OmniNode-ai/omninode_infra only, with Contents: Read-only (Metadata read is
  # implied) and nothing else.
  ONEX_GRANT_ANCHOR_READ_TOKEN:
    description: "Fine-grained GitHub token for reading grants/prod_promotion_grants.yaml and .github/CODEOWNERS from OmniNode-ai/omninode_infra@main: repository access OmniNode-ai/omninode_infra only, Contents: Read-only. Resolved from the secret store; a 404 on the main commit read is refused as repository_unreadable (token cannot read the private anchor), a 404 on the file after that read as grant_file_missing."
    required: true

runtime_dispatch:
  command_topic: onex.cmd.omnimarket.prod-promotion-grant-resolve.v1
  terminal_events:
    success: onex.evt.omnimarket.prod-promotion-grant-resolved.v1
    failure: onex.evt.omnimarket.prod-promotion-grant-resolve-failed.v1

terminal_event: onex.evt.omnimarket.prod-promotion-grant-resolved.v1

event_bus:
  subscribe_topics:
    - onex.cmd.omnimarket.prod-promotion-grant-resolve.v1
  publish_topics:
    - onex.evt.omnimarket.prod-promotion-grant-resolved.v1
    - onex.evt.omnimarket.prod-promotion-grant-resolve-failed.v1
  dlq_topics:
    - onex.dlq.omnimarket.prod-promotion-grant-resolve.v1

dependencies:
  packages:
    - "omnibase_core>=0.39.0"
    - "pyyaml>=6.0"

metadata:
  transport_type: kafka
  description: "Prod-promotion grant resolver effect node"
  author: "OmniNode Platform Team"
  tags:
    - "effect"
    - "deploy"
    - "promotion-gate"
    - "prod"
    - "grant-resolver"
  related_tickets:
    - "OMN-13439"
    - "OMN-13418"
    - "OMN-13436"
    - "OMN-13437"
    - "OMN-10971"
