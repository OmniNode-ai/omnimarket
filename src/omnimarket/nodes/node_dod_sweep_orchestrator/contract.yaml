---
name: node_dod_sweep_orchestrator
contract_version: {major: 1, minor: 0, patch: 0}
node_type: orchestrator
node_version: {major: 1, minor: 0, patch: 0}
description: >
  Orchestrates targeted DoD sweep receipt generation for tickets, plus the L3
  close-path gate-escape audit (OMN-13854): flags Done tickets with
  startedAt=null + zero attachments/documents + no merged PR discoverable as
  wf_1628d9a5-signature gate-escape candidates.
  OMN-17022: every ticket is swept under a durable per-item retry lifecycle.
  An in-flight attempt is recorded before the checks run, so an item killed
  mid-run is distinguishable from one never attempted; a run that reaches no
  verdict is reported `unresolved` with a typed cause and is re-attempted only
  under bounded backoff, and never at all when the cause is a
  credential/resolution defect a retry would reproduce exactly.

handler:
  module: omnimarket.nodes.node_dod_sweep_orchestrator.handlers.handler_dod_sweep_orchestrator
  class: HandlerDodSweepOrchestrator
  input_model: omnimarket.nodes.node_dod_sweep_orchestrator.models.model_dod_sweep_orchestrator_request.ModelDodSweepOrchestratorRequest

handler_routing:
  routing_strategy: operation_match
  handlers:
    - operation: sweep
      handler:
        name: HandlerDodSweepOrchestrator
        module: omnimarket.nodes.node_dod_sweep_orchestrator.handlers.handler_dod_sweep_orchestrator

state_artifacts:
  # OMN-17022: durable per-item retry state, written beside the receipt the
  # sweep already produces for the same ticket. Append-only — a write that
  # would truncate or rewrite recorded attempts is refused, which is what
  # stops a fresh pass from making an unresolved item read as never-attempted.
  dod_retry_state:
    path: "<evidence_root>/.evidence/<TICKET-ID>/dod_retry_state.json"
    model: omnimarket.nodes.node_dod_verify.models.model_dod_verify_retry_state.ModelDodVerifyRetryState

env_dependencies:
  ONEX_CC_REPO_PATH:
    required: true
    description: "Path to the omni_home repo registry; required when contract_root/evidence_root is not provided explicitly"
  LINEAR_API_KEY:
    required: false
    description: "Linear API key for the gate_escape_audit=true path (OMN-13854); not read unless request.linear_api_key is empty and gate_escape_audit is requested"

descriptor:
  node_archetype: orchestrator
  purity: impure
  runtime_profiles:
    - effects
  idempotent: true
  timeout_ms: 30000
terminal_event: onex.evt.omnimarket.dod-sweep-completed.v1

runtime_dispatch:
  command_topic: onex.cmd.omnimarket.dod-sweep.v1
  terminal_events:
    success: onex.evt.omnimarket.dod-sweep-completed.v1
    failure: onex.evt.omnimarket.dod-sweep-failed.v1
  default_timeout_ms: 30000
  max_timeout_ms: 300000

event_bus:
  subscribe_topics:
    - onex.cmd.omnimarket.dod-sweep.v1
  publish_topics:
    - onex.evt.omnimarket.dod-sweep-completed.v1
    - onex.evt.omnimarket.dod-sweep-failed.v1

externally_consumed_topics:
  - onex.evt.omnimarket.dod-sweep-completed.v1
  - onex.evt.omnimarket.dod-sweep-failed.v1

config:
  ONEX_CC_REPO_PATH:
    description: "Path to the omniclaude repository for Claude Code plugin operations."
    required: true
