# ONEX Node Contract
# Node: NodeSkillDispatchEngineOrchestrator
# Skill: dispatch_engine
#
# Thin router node: routes a dispatch request through RSD scoring
# (node_rsd_fill_compute) then self-healing per-repo fan-out
# (node_self_healing_dispatch_orchestrator), returning a real dispatch receipt
# with concrete worker specs. Routing lives in HandlerDispatchEngineRouter;
# the skill-lifecycle boundary lives in HandlerSkillRequested. (OMN-13834)

name: node_skill_dispatch_engine_orchestrator
contract_name: node_skill_dispatch_engine_orchestrator
node_name: node_skill_dispatch_engine_orchestrator

contract_version:
  major: 1
  minor: 0
  patch: 0

node_version:
  major: 1
  minor: 0
  patch: 0

node_type: ORCHESTRATOR_GENERIC

description: >
  Orchestrator node for the dispatch_engine skill. A thin router over two
  already-real pieces: RSD scoring (node_rsd_fill_compute) turns a candidate
  ticket set into ranked candidates, then self-healing dispatch
  (node_self_healing_dispatch_orchestrator) groups survivors per repo into
  concrete worker specs. Returns a real dispatch receipt (worker specs, not a
  placeholder string). Subscribes to command events, emits outcome events on
  success or failure.

input_model:
  name: ModelSkillRequest
  module: omnimarket.nodes.node_skill_dispatch_engine_orchestrator.models

output_model:
  name: ModelSkillResult
  module: omnimarket.nodes.node_skill_dispatch_engine_orchestrator.models

execution:
  backend: claude_code
  model_purpose: null

event_bus:
  subscribe:
    topic: "onex.cmd.omnimarket.dispatch_engine.v1"
    consumer_group: "omnimarket.skill.dispatch_engine"
  publish:
    success_topic: "onex.evt.omnimarket.dispatch_engine-completed.v1"
    failure_topic: "onex.evt.omnimarket.dispatch_engine-failed.v1"

capabilities:
  - name: skill.dispatch_engine
    description: Dispatch dispatch_engine skill to polymorphic agent
    version: 1.0.0

io_operations:
  - operation: skill_requested
    description: Dispatch dispatch_engine skill invocation to polymorphic agent
    handler_method: handle
    input_fields:
      - skill_name: str
      - skill_path: str
      - args: dict[str, str]
      - dry_run: bool
    output_fields:
      - skill_name: str
      - skill_path: str
      - status: str
      - args: dict[str, str]
      - run_id: str
      - total_selected: int
      - worker_specs: list
      - error: str | None
    idempotent: false

handler_routing:
  routing_strategy: operation_match
  handlers:
    - operation: skill_dispatch_engine
      handler:
        name: HandlerSkillRequested
        module: omnimarket.nodes.node_skill_dispatch_engine_orchestrator.handlers.handler_skill_requested

dependencies:
  - name: handler_skill_requested
    type: handler
    function: HandlerSkillRequested
    module: omnimarket.nodes.node_skill_dispatch_engine_orchestrator.handlers
    pluggable: false

error_handling:
  retry_policy:
    max_retries: 2
    initial_delay_ms: 500
    max_delay_ms: 5000
    exponential_base: 2
    retry_on:
      - SkillDispatchError
      - SkillTimeoutError
  circuit_breaker:
    enabled: false

metadata:
  author: OmniNode Team
  license: MIT
  maturity: beta
  ticket: OMN-13834
  tags:
    - orchestrator
    - skill
    - dispatch_engine
    - router
