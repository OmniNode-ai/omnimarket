name: node_skill_dispatch_engine_orchestrator
version: "1.0.0"
description: >
  Thin router orchestrator for the dispatch_engine skill: routes a candidate
  ticket set through RSD scoring then self-healing per-repo fan-out, returning
  a real dispatch receipt with concrete worker specs.
omnibase_core_compat: ">=0.39.0,<1.0.0"
entry_points:
  onex.nodes:
    node_skill_dispatch_engine_orchestrator: "omnimarket.nodes.node_skill_dispatch_engine_orchestrator"
capabilities:
  standalone: true
  full_runtime: true
  requires_network: false
  requires_repo: false
  requires_secrets: false
  requires_docker: false
  side_effect_class: read_only
dependencies:
  - "omnibase_core>=0.39.0"
authors: ["OmniNode Platform Team"]
license: "MIT"
tags: ["orchestrator", "skill", "dispatch_engine", "router"]
pack: "pipeline"
display_name: "Dispatch Engine Orchestrator"
node_role: "orchestrator"
