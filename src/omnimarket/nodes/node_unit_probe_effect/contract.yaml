name: node_unit_probe_effect
lifecycle: experimental
node_type: EFFECT_GENERIC
runtime_profiles:
- effects
contract_version:
  major: 1
  minor: 0
  patch: 0
node_version: 1.0.0
description: Read whether a host unit is loaded and when it last ran. A launchd unit
  is read through launchctl and its log files, a systemd timer through systemctl, and
  on a host with no systemctl through one ssh systemctl show per remote lab-pool host.
  A tick that runs on a pool host is judged from that host's timer and service.
input_model:
  name: ModelUnitProbeRequest
  module: omnimarket.nodes.node_unit_probe_effect.models.model_unit_probe
output_model:
  name: ModelUnitProbeResult
  module: omnimarket.nodes.node_unit_probe_effect.models.model_unit_probe
handler:
  module: omnimarket.nodes.node_unit_probe_effect.handlers.handler_unit_probe
  class: HandlerUnitProbe
  input_model: omnimarket.nodes.node_unit_probe_effect.models.model_unit_probe.ModelUnitProbeRequest
  output_model: omnimarket.nodes.node_unit_probe_effect.models.model_unit_probe.ModelUnitProbeResult
handler_routing:
  routing_strategy: payload_type_match
  handlers:
  - handler:
      name: HandlerUnitProbe
      module: omnimarket.nodes.node_unit_probe_effect.handlers.handler_unit_probe
    event_model:
      name: ModelUnitProbeRequest
      module: omnimarket.nodes.node_unit_probe_effect.models.model_unit_probe
event_bus:
  subscribe_topics:
  - onex.cmd.omnimarket.unit-probe-requested.v1
  publish_topics:
  - onex.evt.omnimarket.unit-probe-completed.v1
runtime_dispatch:
  command_topic: onex.cmd.omnimarket.unit-probe-requested.v1
  external_trigger: A demand on the command topic from the runtime's callers, and direct Python invocation by the hourly check and the ruling audit.
terminal_event: onex.evt.omnimarket.unit-probe-completed.v1
published_events:
- topic: onex.evt.omnimarket.unit-probe-completed.v1
  event_type: ModelUnitProbeResult
externally_consumed_topics:
- onex.evt.omnimarket.unit-probe-completed.v1
broker_acl_grants:
- principal: ${ONEX_ACL_RUNTIME_PRINCIPAL}
  grants:
  - {resource_type: TOPIC, pattern: LITERAL, name: onex.cmd.omnimarket.unit-probe-requested.v1, operation: READ}
  - {resource_type: TOPIC, pattern: LITERAL, name: onex.cmd.omnimarket.unit-probe-requested.v1, operation: DESCRIBE}
  - {resource_type: TOPIC, pattern: LITERAL, name: onex.evt.omnimarket.unit-probe-completed.v1, operation: WRITE}
  - {resource_type: TOPIC, pattern: LITERAL, name: onex.evt.omnimarket.unit-probe-completed.v1, operation: DESCRIBE}
descriptor:
  node_archetype: effect
  purity: effectful
  runtime_profiles:
  - effects
  idempotent: true
  timeout_ms: 30000
metadata:
  transport_type: kafka
  created: '2026-11-14'
  tags:
  - effect
  - unit-probe
  related_tickets:
  - OMN-23733
