name: node_pr_duplicate_snapshot_effect
lifecycle: experimental
node_type: EFFECT_GENERIC
runtime_profiles: []
contract_version:
  major: 1
  minor: 0
  patch: 0
node_version: 1.0.0
description: Read what the duplicate-fix pull request guard folds over, from local sources only and never a GitHub search. The PR watcher's state file for the open pull requests of one repository (refused when its last_tick is older than 15 minutes), the live ledger CLAIM rows the ledger reader node answers, and git diff -U0 for what the new branch and each open pull request change against the merge base. Changed-line digests supply intent evidence; draft facts let the guard distinguish ownerless drafts. Git ancestry flags stacked ancestors and descendants, and the new diff excludes the tip-most open ancestor changes. The deployment overlay node_pr_duplicate_guard_compute/overlay.yaml (read from ONEX_SKILL_OVERLAY_ROOTS, then ONEX_WORKSPACE_CONFIG_ROOT/config/onex/overlays) names per repository the paths it regenerates in every pull request of a kind, passed to the guard as generated_paths; an absent overlay declares none. A source it cannot read, or an overlay it cannot parse, is returned as unchecked_reason, never as no duplicate.
input_model:
  name: ModelPrDuplicateSnapshotRequest
  module: omnimarket.models.model_pr_duplicate_guard
output_model:
  name: ModelPrDuplicateSnapshotResult
  module: omnimarket.models.model_pr_duplicate_guard
handler:
  module: omnimarket.nodes.node_pr_duplicate_snapshot_effect.handlers.handler_pr_duplicate_snapshot
  class: HandlerPrDuplicateSnapshot
  input_model: omnimarket.models.model_pr_duplicate_guard.ModelPrDuplicateSnapshotRequest
  output_model: omnimarket.models.model_pr_duplicate_guard.ModelPrDuplicateSnapshotResult
handler_routing:
  routing_strategy: operation_match
  default_handler: omnimarket.nodes.node_pr_duplicate_snapshot_effect.handlers.handler_pr_duplicate_snapshot:HandlerPrDuplicateSnapshot
  handlers:
  - operation: handle
    handler:
      name: HandlerPrDuplicateSnapshot
      module: omnimarket.nodes.node_pr_duplicate_snapshot_effect.handlers.handler_pr_duplicate_snapshot
config:
  digest:
    min_line_chars: 4
    prefix_chars: 12
  stack:
    base_rule: newest_contained_open_pr_head
  # The claims read through the ledger reader node (OMN-26433). A CLAIM is live 0.75 hours after its lane's last row, so the
  # primary read is the CLAIM, TERMINAL and RELEASE rows of the window plus every row of the last heartbeat_window_hours,
  # which the dev broker answers in a page each; the fallback is every row of the window. A tier waits at most its own timeout,
  # the two together at most total_budget_s, and when neither answers the guard is unchecked and opens nothing.
  ledger_read:
    reader: pr-duplicate-guard-claims
    window_hours: 168
    heartbeat_window_hours: 1
    claim_kinds: [CLAIM, TERMINAL, RELEASE]
    primary_timeout_s: 180
    fallback_timeout_s: 420
    total_budget_s: 600
event_bus:
  subscribe_topics: []
  publish_topics: []
runtime_dispatch:
  external_trigger: Direct Python invocation by onex scm pr-create and onex scm pr-duplicate-check.
descriptor:
  node_archetype: effect
  purity: effectful
  runtime_profiles: []
  idempotent: true
  timeout_ms: 5000
replay:
  requires_validator_version: true
  timestamp_authority: ingest_sequence
  deterministic: true
metadata:
  transport_type: local
  description: Reads the watcher state, ledger and git diffs the duplicate-fix pull request guard folds over.
  author: OmniNode Team
  created: '2026-10-30'
  tags:
  - effect
  - pr-duplicate-snapshot-effect
  - OMN-17427
  related_tickets:
  - OMN-17427
