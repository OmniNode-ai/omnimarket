name: node_lane_parent_notice_recovery_effect
version: 0.1.0
description: >
  Consumes the parent notices of ended lanes with a durable cursor, reads a failed placement as failed and starts one
  recovery lane per failure within a retry budget; statuses, budget, backoff and commands come from the overlay.
omnibase_core_compat: '>=0.47.31,<0.48.0'
entry_points:
  onex.nodes:
    node_lane_parent_notice_recovery_effect: omnimarket.nodes.node_lane_parent_notice_recovery_effect
capabilities:
  standalone: true
  full_runtime: false
  requires_network: true
  requires_repo: false
  requires_secrets: false
  requires_docker: false
  side_effect_class: write
dependencies:
- PyYAML>=6.0.3
license: MIT
authors:
- OmniNode Team
tags:
- effect
- lab
- in_process
pack: operator_tooling
display_name: Lane Parent Notice Recovery Effect
node_role: effect
