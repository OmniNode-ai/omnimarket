name: node_lane_parent_notice_recovery_effect
node_type: EFFECT_GENERIC
version: 1.0.0
lifecycle: experimental
contract_version: {major: 1, minor: 0, patch: 0}
node_version: "1.0.0"
description: >-
  Consume the parent notices of lanes that ended (the ledger rows a lane's runner writes to its parent) with a
  durable cursor and an acknowledgement, and start one recovery lane for a lane that failed placement. A lane whose
  placement failed (status node-unavailable) reads failed in the lane read the moment its notice stands, never running.
  The cursor moves only after the notice is acknowledged and, for a failed placement, after the recovery lane's start
  is recorded; every recovery carries the original lane's attempt family, a retry budget and a backoff, and the budget
  ends in one escalation row. The recovery starts through the placement path the overlay names, not the node that
  failed. Statuses, budget, backoff, state file and every command are rows of the node overlay (OMN-23389, R12 of the
  h053 cascade plan).
input_model:
  name: ModelNoticeConsumeRequest
  module: omnimarket.nodes.node_lane_parent_notice_recovery_effect.models.model_notice_recovery
output_model:
  name: ModelNoticeConsumeResult
  module: omnimarket.nodes.node_lane_parent_notice_recovery_effect.models.model_notice_recovery
handler:
  name: HandlerNoticeRecovery
  module: omnimarket.nodes.node_lane_parent_notice_recovery_effect.handlers.handler_notice_recovery
entrypoint:
  name: NodeLaneParentNoticeRecoveryEffect
  module: omnimarket.nodes.node_lane_parent_notice_recovery_effect.node
execution:
  deterministic: false
  side_effects: true
overlay:
  file: overlay.yaml
  environment_pin: ONEX_LANE_NOTICE_RECOVERY_OVERLAY
runtime_dispatch:
  external_trigger: "Run by the host timer on each fire (python -m omnimarket.nodes.node_lane_parent_notice_recovery_effect consume --ledger <ledger>); the lanes verb prints the lane read."
descriptor:
  node_archetype: effect
  purity: effectful
  idempotent: true
  side_effects:
  - writes the durable cursor and attempt state
  - starts a recovery lane
  - writes acknowledgement and escalation rows
metadata:
  ticket: OMN-23389
  transport_type: in_process
