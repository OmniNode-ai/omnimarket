# Copy to <root>/node_host_job_claim_compute/overlay.yaml and set ONEX_SKILL_OVERLAY_ROOTS to that
# root. Every value here is synthetic; supply your deployment's facts. No key has a default, and an
# overlay that cannot be found refuses the run.
#
#   roles        the host roles and, per role, its jobs: each job's owner unit, the marker its
#                ExecStart must contain, and every unit that claims the job (owner included)
#   hosts        each host and the role its jobs are read against; a host appears once and its role
#                must be declared
#   unit_dirs    the directories holding the unit files; a leading ~ means the user's home
#   unit_suffix  the file suffix of a service unit file; the suffix is stripped to get the unit name
roles:
- role: example-role
  jobs:
  - job_id: example-job
    owner_unit: example-unit
    owner_command_marker: example-marker
    claimants:
    - example-unit
    - example-unit-old
hosts:
- host: example-host
  role: example-role
unit_dirs:
- ~/.config/systemd/user
unit_suffix: .service
