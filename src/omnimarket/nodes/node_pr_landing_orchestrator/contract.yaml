      from_state: READY
      to_state: MERGED
      trigger: merged
    - version: {major: 2, minor: 0, patch: 0}
      transition_name: armed_to_merged_on_merged
      from_state: ARMED
      to_state: MERGED
      trigger: merged
    - version: {major: 2, minor: 0, patch: 0}
      transition_name: needs_agent_to_merged_on_merged
      from_state: NEEDS_AGENT
      to_state: MERGED
      trigger: merged
    # revision row 38: any non-terminal | closed, newer by the ordering key
    - version: {major: 2, minor: 0, patch: 0}
      transition_name: observed_to_closed_on_closed
      from_state: OBSERVED
      to_state: CLOSED
      trigger: closed
    - version: {major: 2, minor: 0, patch: 0}
      transition_name: parked_to_closed_on_closed
      from_state: PARKED
      to_state: CLOSED
      trigger: closed
    - version: {major: 2, minor: 0, patch: 0}
      transition_name: companion_pending_to_closed_on_closed
      from_state: COMPANION_PENDING
      to_state: CLOSED
      trigger: closed
    - version: {major: 2, minor: 0, patch: 0}
      transition_name: companion_open_to_closed_on_closed
      from_state: COMPANION_OPEN
      to_state: CLOSED
      trigger: closed
    - version: {major: 2, minor: 0, patch: 0}
      transition_name: checks_pending_to_closed_on_closed
      from_state: CHECKS_PENDING
      to_state: CLOSED
      trigger: closed
    - version: {major: 2, minor: 0, patch: 0}
      transition_name: ready_to_closed_on_closed
      from_state: READY
      to_state: CLOSED
      trigger: closed
    - version: {major: 2, minor: 0, patch: 0}
