# OMN-20866: the orchestrator's operator config, read by the handler at start
# (orchestration/contract_config.py). The canary is omnimarket:
#   * enforce for reads and the arm. The landing controller and auto-merge.yml
#     already arm omnimarket PRs with auto-merge; the effect completes an arm
#     that is already in place without sending the mutation again, so a second
#     arm path changes nothing on GitHub.
#   * companion-exempt: omnimarket's change-control cut-over has landed (its dev
#     ruleset and classic protection require no change-control context), so its
#     PRs go from evaluation straight to the head-check read.
#   * rerun_runs, update_branch and disarm stay dry_run in every repository
#     until the landing controller stops taking those actions for the same
#     repositories (plan slice S8): one owner per class of PR action.
#   * review threads: omnimarket's dev branch requires no conversation
#     resolution and no review, so an unresolved thread cannot block the merge.
#   * observed prompts: omnimarket publishes no autobind prompt since its
#     cut-over, so the PR watcher's observations prompt its reads instead.
landing_config:
  github_mode: dry_run
  github_mode_by_repository:
    OmniNode-ai/omnimarket: enforce
  dry_run_operations:
    - rerun_runs
    - update_branch
    - disarm
  companion_exempt_repositories:
    - OmniNode-ai/omnimarket
  queue_repositories: []
  review_threads_not_required_repositories:
    - OmniNode-ai/omnimarket
  observed_prompt_repositories:
    - OmniNode-ai/omnimarket
  arm_policy:
    action_mode: enforce
    kill_switch: false
event_bus:
  version:
    major: 1
    minor: 0
    patch: 0
  subscribe_topics:
    # I1: a product push or ready flip. A prompt, not a snapshot (section 6).
    - onex.cmd.omnimarket.occ-autobind.v1
    # I2: the Actions merged producers.
    - onex.evt.github.pr-merged.v1
    # The producer's typed answer to a companion command (T5, T10).
    - onex.evt.omnimarket.pr-landing-companion-outcome.v1
    # The GitHub landing effect's answers (T4, T9).
    - onex.evt.omnimarket.pr-landing-github-completed.v1
    - onex.evt.omnimarket.pr-landing-github-failed.v1
    # I3 (OMN-20866): the PR watcher's observations, a prompt for the
    # repositories landing_config.observed_prompt_repositories names.
    - onex.evt.omnimarket.pr-state-observed.v1
  publish_topics:
    # Companion commands (op derive, regenerate, verify) to the producer.
    - onex.cmd.omnimarket.occ-autobind.v1
    - onex.cmd.omnimarket.pr-landing-github-requested.v1
    - onex.evt.omnimarket.pr-landing-transitioned.v1
    - onex.evt.omnimarket.pr-landing-agent-needed.v1
    - onex.evt.omnimarket.pr-landing-merged.v1
    - onex.evt.omnimarket.pr-landing-closed.v1
published_events:
  - event_type: "PrLandingTransitioned"
    topic: onex.evt.omnimarket.pr-landing-transitioned.v1
    description: "One per transition, with the per-key seq the landing projection orders by."
  - event_type: "PrLandingAgentNeeded"
    topic: onex.evt.omnimarket.pr-landing-agent-needed.v1
    description: "A PR only an agent can move; at most one per (head, reason)."
  - event_type: "PrLandingMerged"
    topic: onex.evt.omnimarket.pr-landing-merged.v1
    description: "Terminal: GitHub merged the PR; one per (PR, episode)."
  - event_type: "PrLandingClosed"
    topic: onex.evt.omnimarket.pr-landing-closed.v1
    description: "Terminal: the PR was closed unmerged; one per (PR, episode)."
  - event_type: "PrLandingGithubRequest"
    topic: onex.cmd.omnimarket.pr-landing-github-requested.v1
    description: "One GitHub effect, sent only when no other effect for the PR is in flight (R4)."
  - event_type: "PrLifecycleFixCommand"
    topic: onex.cmd.omnimarket.occ-autobind.v1
    description: "A companion command (op derive, regenerate or verify) to the change-control producer."
handler_routing:
  routing_strategy: "payload_type_match"
  handlers:
    - operation: "pr_landing.orchestrate.prompt"
      message_category: "command"
      handler:
        name: "HandlerPrLandingOrchestrator"
        module: "omnimarket.nodes.node_pr_landing_orchestrator.handlers.handler_pr_landing_orchestrator"
      event_model:
        name: "ModelPrLandingAutobindPrompt"
        module: "omnimarket.nodes.node_pr_landing_orchestrator.models.model_pr_landing_ingress"
      topic: onex.cmd.omnimarket.occ-autobind.v1
      description: "A push prompt issues a conditional read_pr_state; the workflow's own companion commands are ignored."
    - operation: "pr_landing.orchestrate.merged"
      message_category: "event"
      handler:
        name: "HandlerPrLandingOrchestrator"
        module: "omnimarket.nodes.node_pr_landing_orchestrator.handlers.handler_pr_landing_orchestrator"
      event_model:
        name: "ModelPrLandingMergedIngress"
        module: "omnimarket.nodes.node_pr_landing_orchestrator.models.model_pr_landing_ingress"
      topic: onex.evt.github.pr-merged.v1
      description: "Merged moves any non-terminal row to MERGED and emits its terminal once per episode."
    - operation: "pr_landing.orchestrate.companion_outcome"
      message_category: "event"
      handler:
        name: "HandlerPrLandingOrchestrator"
        module: "omnimarket.nodes.node_pr_landing_orchestrator.handlers.handler_pr_landing_orchestrator"
      event_model:
        name: "ModelPrLandingCompanionOutcomeIngress"
        module: "omnimarket.nodes.node_pr_landing_orchestrator.models.model_pr_landing_ingress"
      topic: onex.evt.omnimarket.pr-landing-companion-outcome.v1
      description: "A companion outcome correlated to the command in flight (F5); any other is dropped."
    - operation: "pr_landing.orchestrate.github_completed"
      message_category: "event"
      handler:
        name: "HandlerPrLandingOrchestrator"
        module: "omnimarket.nodes.node_pr_landing_orchestrator.handlers.handler_pr_landing_orchestrator"
      event_model:
        name: "ModelPrLandingGithubCompletedIngress"
        module: "omnimarket.nodes.node_pr_landing_orchestrator.models.model_pr_landing_ingress"
      topic: onex.evt.omnimarket.pr-landing-github-completed.v1
      description: "The effect in flight answered: a snapshot, a check read or a confirmed arm; frees the PR for the next effect."
    - operation: "pr_landing.orchestrate.github_failed"
      message_category: "event"
      handler:
        name: "HandlerPrLandingOrchestrator"
        module: "omnimarket.nodes.node_pr_landing_orchestrator.handlers.handler_pr_landing_orchestrator"
      event_model:
        name: "ModelPrLandingGithubFailedIngress"
        module: "omnimarket.nodes.node_pr_landing_orchestrator.models.model_pr_landing_ingress"
      topic: onex.evt.omnimarket.pr-landing-github-failed.v1
      description: "The effect in flight failed with a typed reason; frees the PR, and the next tick re-reads."
    - operation: "pr_landing.orchestrate.observed"
      message_category: "event"
      handler:
        name: "HandlerPrLandingOrchestrator"
        module: "omnimarket.nodes.node_pr_landing_orchestrator.handlers.handler_pr_landing_orchestrator"
      event_model:
        name: "ModelPrLandingObservedPrompt"
        module: "omnimarket.nodes.node_pr_landing_orchestrator.models.model_pr_landing_ingress"
      topic: onex.evt.omnimarket.pr-state-observed.v1
      description: "A watcher observation of a named repository issues a conditional read_pr_state and drains the row; any other repository is dropped."
metadata:
  description: "Deterministic per-PR landing workflow: change-control companion, re-runs, update-branch and arming as one FSM."
  author: "OmniNode Team"
  license: "MIT"
  created: "2026-09-26"
  tags:
    - orchestrator
    - pr-landing
    - fsm
    - workflow
    - change-control
  related_tickets:
    - "OMN-19822"
    - "OMN-19824"
    - "OMN-20866"
