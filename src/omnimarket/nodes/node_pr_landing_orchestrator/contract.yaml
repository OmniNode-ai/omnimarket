    # revision row 42: OBSERVED, COMPANION_PENDING, COMPANION_OPEN, CHECKS_PENDING, READY, ARMED, NEEDS_AGENT | completion bound expired, carrying the (episode, state_entry_generation) it was set for, both equal to the row's
    - version: {major: 2, minor: 0, patch: 0}
