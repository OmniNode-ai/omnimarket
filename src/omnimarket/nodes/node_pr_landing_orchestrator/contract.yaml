      to_state: PARKED
      trigger: hold_applied
    # revision row 37: any non-terminal | merged
    - version: {major: 2, minor: 0, patch: 0}
      transition_name: observed_to_merged_on_merged
      from_state: OBSERVED
      to_state: MERGED
