#
# ONEX Node Contract
# Node: NodePrLandingOrchestrator
#
# The per-PR landing workflow: every mechanical step between a product PR push
# and its merge (derive and stamp the change-control companion, arm it,
# regenerate it on conflict, re-run the product PR's change-control checks when
# it merges, update the branch when behind, re-run timed-out checks, arm the
# product PR when green) as one deterministic, event-driven FSM. No language
# model anywhere. Modelled on node_delegation_orchestrator (state_machine,
# state_io, class-name routing of typed terminals) with a pure definition-B
# reducer beside it (node_pr_landing_reducer).
#
# WAVE-1 SEAM. This contract freezes the machine, the row, and the names. It
# deliberately declares no handler_routing, no handler, no event_bus and no
# published_events yet:
#
#   * Runtime auto-wiring (omnibase_infra runtime/auto_wiring) prepares a
#     contract with no handler_routing as SKIPPED, with no subscription, on every
#     runtime profile. Both wave-1 nodes are therefore discovered and wired to
#     nothing until the orchestrator handler lands in wave 2. The conformance
#     test runs that wiring code over the whole node tree and asserts it.
#   * The contract-topic-graph gate (hard, omnimarket scope) refuses a
#     subscription with no handler_routing (DECLARED_BUT_UNWIRED), a subscription
#     nobody publishes, and a publication nobody consumes. The bus edges this
#     node will have close only when the handler, the GitHub landing effect, the
#     companion outcome and the landing projection exist, so they are declared
#     with them. The exact names are frozen now: events/topics.py for the four
#     this node owns, event_topics.py for the class routing, and the bus_seam
#     section of tests/fixtures/pr_landing/fsm_transitions.yaml for the rest.
#   * runtime_lanes is not declared: a lane-scoped contract on a runtime that
#     names no lane is a fail-closed discovery error (a DEGRADED health
#     dimension), and the cluster runtimes declare no ONEX_RUNTIME_LANE. Wave 2
#     scopes the lane when the node has something to attach.
#   * completion_bound (the runtime-enforced block) is not declared: its only
#     policy terminalises the row as failed, while plan 5.1 hands an expired PR
#     to an agent (NEEDS_AGENT, reason stalled). The per-state bounds are the
#     state_machine's timeout_ms; the runtime policy is a wave-2 decision.
#   * state_io names its table and key; the codec lands with the handler.
name: "node_pr_landing_orchestrator"
contract_name: "node_pr_landing_orchestrator"
node_name: "node_pr_landing_orchestrator"
contract_version:
  major: 0
  minor: 1
  patch: 0
node_version:
  major: 0
  minor: 1
  patch: 0
node_type: "ORCHESTRATOR_GENERIC"
# Wave-1 seam: no handler yet, so the node is experimental until the wave-2
# handler lands and wires it. The node-drift and state-coverage gates read
# this annotation; wave 2 removes it together with adding handler_routing.
lifecycle: experimental
description: >
  Per-PR landing workflow orchestrator. Keyed by (repository, pr_number) as the
  landing_key owner/repo#123, it folds each normalized ModelPrLandingObservation
  through the pure node_pr_landing_reducer, issues the returned intents as typed
  commands (the autobind command with op derive, regenerate or verify; GitHub
  landing effect requests), and emits one transitioned event per transition, an
  agent-needed event for real reds, declined companions, spent budgets and
  stalls, and exactly one merged or closed terminal per PR. It never merges:
  GitHub merges an armed or enqueued PR when its required contexts pass. Wave 1
  declares the state machine, the state_io row and the models only.
input_model:
  name: "ModelPrLandingObservation"
  module: "omnimarket.nodes.node_pr_landing_orchestrator.models"
  description: "One normalized fact about one PR, from any landing ingress."
output_model:
  name: "ModelPrLandingTransitioned"
  module: "omnimarket.nodes.node_pr_landing_orchestrator.models"
  description: "The transition taken, with its per-key seq and intents."
runtime_profiles:
  - effects
state_io:
  database: "omnibase_infra"
  table: "pr_landing_workflow_state"
  key: "landing_key"
state_machine:
  version: {major: 1, minor: 0, patch: 0}
  state_machine_name: pr_landing_workflow
  state_machine_version: {major: 1, minor: 0, patch: 0}
  description: "PR landing workflow machine, keyed by (repository, pr_number). Transcribed from plan section 5.1 and held equal to tests/fixtures/pr_landing/fsm_transitions.yaml by the conformance test. timeout_ms is the per-state completion bound; its expiry is the completion_bound_expired trigger."
  initial_state: OBSERVED
  terminal_states: [MERGED, CLOSED]
  error_states: []
  persistence_enabled: true
  states:
    - version: {major: 1, minor: 0, patch: 0}
      state_name: OBSERVED
      state_type: operational
      description: "A new head or first sight; the reducer evaluates at once."
      timeout_ms: 300000
    - version: {major: 1, minor: 0, patch: 0}
      state_name: PARKED
      state_type: operational
      description: "Draft, held (label or hold marker), no ticket token, or a base branch the workflow does not serve."
      timeout_ms: null
    - version: {major: 1, minor: 0, patch: 0}
      state_name: COMPANION_PENDING
      state_type: operational
      description: "A derive or regenerate command is in flight."
      timeout_ms: 1800000
    - version: {major: 1, minor: 0, patch: 0}
      state_name: COMPANION_OPEN
      state_type: operational
      description: "Companion open, stamp on the product body, companion armed."
      timeout_ms: 7200000
    - version: {major: 1, minor: 0, patch: 0}
      state_name: CHECKS_PENDING
      state_type: operational
      description: "Companion merged or not required; change-control reds re-run; waiting for check results."
      timeout_ms: 7200000
    - version: {major: 1, minor: 0, patch: 0}
      state_name: READY
      state_type: operational
      description: "Every required context green, not held, not draft."
      timeout_ms: 900000
    - version: {major: 1, minor: 0, patch: 0}
      state_name: ARMED
      state_type: operational
      description: "Auto-merge armed or enqueued."
      timeout_ms: 14400000
    - version: {major: 1, minor: 0, patch: 0}
      state_name: NEEDS_AGENT
      state_type: operational
      description: "Real red, declined companion, budget spent or stalled; one agent-needed event per (head, reason)."
      timeout_ms: null
    - version: {major: 1, minor: 0, patch: 0}
      state_name: MERGED
      state_type: terminal
      description: "Terminal."
      is_terminal: true
      is_recoverable: false
    - version: {major: 1, minor: 0, patch: 0}
      state_name: CLOSED
      state_type: terminal
      description: "Terminal."
      is_terminal: true
      is_recoverable: false
  transitions:
    # plan 5.1 row 1: any non-terminal | pushed (new head)
    - version: {major: 1, minor: 0, patch: 0}
      transition_name: observed_to_observed_on_pushed
      from_state: OBSERVED
      to_state: OBSERVED
      trigger: pushed
    - version: {major: 1, minor: 0, patch: 0}
      transition_name: parked_to_observed_on_pushed
      from_state: PARKED
      to_state: OBSERVED
      trigger: pushed
    - version: {major: 1, minor: 0, patch: 0}
      transition_name: companion_pending_to_observed_on_pushed
      from_state: COMPANION_PENDING
      to_state: OBSERVED
      trigger: pushed
    - version: {major: 1, minor: 0, patch: 0}
      transition_name: companion_open_to_observed_on_pushed
      from_state: COMPANION_OPEN
      to_state: OBSERVED
      trigger: pushed
    - version: {major: 1, minor: 0, patch: 0}
      transition_name: checks_pending_to_observed_on_pushed
      from_state: CHECKS_PENDING
      to_state: OBSERVED
      trigger: pushed
    - version: {major: 1, minor: 0, patch: 0}
      transition_name: ready_to_observed_on_pushed
      from_state: READY
      to_state: OBSERVED
      trigger: pushed
    - version: {major: 1, minor: 0, patch: 0}
      transition_name: armed_to_observed_on_pushed
      from_state: ARMED
      to_state: OBSERVED
      trigger: pushed
    - version: {major: 1, minor: 0, patch: 0}
      transition_name: needs_agent_to_observed_on_pushed
      from_state: NEEDS_AGENT
      to_state: OBSERVED
      trigger: pushed
    # plan 5.1 row 2: OBSERVED | evaluation: draft, held or no ticket
    - version: {major: 1, minor: 0, patch: 0}
      transition_name: observed_to_parked_on_evaluated_parked
      from_state: OBSERVED
      to_state: PARKED
      trigger: evaluated_parked
    # plan 5.1 row 3: OBSERVED | evaluation: companion required, none bound
    - version: {major: 1, minor: 0, patch: 0}
      transition_name: observed_to_companion_pending_on_evaluated_companion_required
      from_state: OBSERVED
      to_state: COMPANION_PENDING
      trigger: evaluated_companion_required
    # plan 5.1 row 4: OBSERVED | evaluation: companion bound and open
    - version: {major: 1, minor: 0, patch: 0}
      transition_name: observed_to_companion_open_on_evaluated_companion_open
      from_state: OBSERVED
      to_state: COMPANION_OPEN
      trigger: evaluated_companion_open
    # plan 5.1 row 5: OBSERVED | evaluation: companion merged, or not required
    - version: {major: 1, minor: 0, patch: 0}
      transition_name: observed_to_checks_pending_on_evaluated_checks_required
      from_state: OBSERVED
      to_state: CHECKS_PENDING
      trigger: evaluated_checks_required
    # plan 5.1 row 6: COMPANION_PENDING | outcome MINTED (occ_pr, stamped, armed)
    - version: {major: 1, minor: 0, patch: 0}
      transition_name: companion_pending_to_companion_open_on_companion_minted
      from_state: COMPANION_PENDING
      to_state: COMPANION_OPEN
      trigger: companion_minted
    # plan 5.1 row 7: COMPANION_PENDING | outcome DECLINED (reason)
    - version: {major: 1, minor: 0, patch: 0}
      transition_name: companion_pending_to_needs_agent_on_companion_declined
      from_state: COMPANION_PENDING
      to_state: NEEDS_AGENT
      trigger: companion_declined
    # plan 5.1 row 8: COMPANION_PENDING | outcome ERROR, budget left
    - version: {major: 1, minor: 0, patch: 0}
      transition_name: companion_pending_to_companion_pending_on_companion_error_budget_left
      from_state: COMPANION_PENDING
      to_state: COMPANION_PENDING
      trigger: companion_error_budget_left
    # plan 5.1 row 9: COMPANION_PENDING | outcome ERROR, budget spent
    - version: {major: 1, minor: 0, patch: 0}
      transition_name: companion_pending_to_needs_agent_on_companion_error_budget_spent
      from_state: COMPANION_PENDING
      to_state: NEEDS_AGENT
      trigger: companion_error_budget_spent
    # plan 5.1 row 10: COMPANION_OPEN | companion conflicting, budget left
    - version: {major: 1, minor: 0, patch: 0}
      transition_name: companion_open_to_companion_pending_on_companion_conflicting_budget_left
      from_state: COMPANION_OPEN
      to_state: COMPANION_PENDING
      trigger: companion_conflicting_budget_left
    # plan 5.1 row 11: COMPANION_OPEN | companion closed unmerged
    - version: {major: 1, minor: 0, patch: 0}
      transition_name: companion_open_to_companion_pending_on_companion_closed_unmerged
      from_state: COMPANION_OPEN
      to_state: COMPANION_PENDING
      trigger: companion_closed_unmerged
    # plan 5.1 row 12: COMPANION_OPEN | companion merged
    - version: {major: 1, minor: 0, patch: 0}
      transition_name: companion_open_to_checks_pending_on_companion_merged
      from_state: COMPANION_OPEN
      to_state: CHECKS_PENDING
      trigger: companion_merged
    # plan 5.1 row 13: CHECKS_PENDING | verdict green
    - version: {major: 1, minor: 0, patch: 0}
      transition_name: checks_pending_to_ready_on_verdict_green
      from_state: CHECKS_PENDING
      to_state: READY
      trigger: verdict_green
    # plan 5.1 row 14: CHECKS_PENDING | verdict change_control_stale, budget left
    - version: {major: 1, minor: 0, patch: 0}
      transition_name: checks_pending_to_checks_pending_on_verdict_change_control_stale_budget_left
      from_state: CHECKS_PENDING
      to_state: CHECKS_PENDING
      trigger: verdict_change_control_stale_budget_left
    # plan 5.1 row 15: CHECKS_PENDING | verdict timed_out, runner_infra or cancelled, budget left
    - version: {major: 1, minor: 0, patch: 0}
      transition_name: checks_pending_to_checks_pending_on_verdict_rerunnable_budget_left
      from_state: CHECKS_PENDING
      to_state: CHECKS_PENDING
      trigger: verdict_rerunnable_budget_left
    # plan 5.1 row 16: CHECKS_PENDING | verdict stale_caller_pin or behind_required
    - version: {major: 1, minor: 0, patch: 0}
      transition_name: checks_pending_to_checks_pending_on_verdict_update_branch
      from_state: CHECKS_PENDING
      to_state: CHECKS_PENDING
      trigger: verdict_update_branch
    # plan 5.1 row 17: CHECKS_PENDING | verdict product_failed, or any budget spent
    - version: {major: 1, minor: 0, patch: 0}
      transition_name: checks_pending_to_needs_agent_on_verdict_real_red
      from_state: CHECKS_PENDING
      to_state: NEEDS_AGENT
      trigger: verdict_real_red
    # plan 5.1 row 18: CHECKS_PENDING | verdict pending
    - version: {major: 1, minor: 0, patch: 0}
      transition_name: checks_pending_to_checks_pending_on_verdict_pending
      from_state: CHECKS_PENDING
      to_state: CHECKS_PENDING
      trigger: verdict_pending
    # plan 5.1 row 19: READY | armed confirmed
    - version: {major: 1, minor: 0, patch: 0}
      transition_name: ready_to_armed_on_armed_confirmed
      from_state: READY
      to_state: ARMED
      trigger: armed_confirmed
    # plan 5.1 row 20a: ARMED | disarmed
    - version: {major: 1, minor: 0, patch: 0}
      transition_name: armed_to_checks_pending_on_disarmed
      from_state: ARMED
      to_state: CHECKS_PENDING
      trigger: disarmed
    # plan 5.1 row 20b: ARMED | hold applied
    - version: {major: 1, minor: 0, patch: 0}
      transition_name: armed_to_parked_on_hold_applied
      from_state: ARMED
      to_state: PARKED
      trigger: hold_applied
    # plan 5.1 row 21: any non-terminal | merged
    - version: {major: 1, minor: 0, patch: 0}
      transition_name: observed_to_merged_on_merged
      from_state: OBSERVED
      to_state: MERGED
      trigger: merged
    - version: {major: 1, minor: 0, patch: 0}
      transition_name: parked_to_merged_on_merged
      from_state: PARKED
      to_state: MERGED
      trigger: merged
    - version: {major: 1, minor: 0, patch: 0}
      transition_name: companion_pending_to_merged_on_merged
      from_state: COMPANION_PENDING
      to_state: MERGED
      trigger: merged
    - version: {major: 1, minor: 0, patch: 0}
      transition_name: companion_open_to_merged_on_merged
      from_state: COMPANION_OPEN
      to_state: MERGED
      trigger: merged
    - version: {major: 1, minor: 0, patch: 0}
      transition_name: checks_pending_to_merged_on_merged
      from_state: CHECKS_PENDING
      to_state: MERGED
      trigger: merged
    - version: {major: 1, minor: 0, patch: 0}
      transition_name: ready_to_merged_on_merged
      from_state: READY
      to_state: MERGED
      trigger: merged
    - version: {major: 1, minor: 0, patch: 0}
      transition_name: armed_to_merged_on_merged
      from_state: ARMED
      to_state: MERGED
      trigger: merged
    - version: {major: 1, minor: 0, patch: 0}
      transition_name: needs_agent_to_merged_on_merged
      from_state: NEEDS_AGENT
      to_state: MERGED
      trigger: merged
    # plan 5.1 row 22: any non-terminal | closed
    - version: {major: 1, minor: 0, patch: 0}
      transition_name: observed_to_closed_on_closed
      from_state: OBSERVED
      to_state: CLOSED
      trigger: closed
    - version: {major: 1, minor: 0, patch: 0}
      transition_name: parked_to_closed_on_closed
      from_state: PARKED
      to_state: CLOSED
      trigger: closed
    - version: {major: 1, minor: 0, patch: 0}
      transition_name: companion_pending_to_closed_on_closed
      from_state: COMPANION_PENDING
      to_state: CLOSED
      trigger: closed
    - version: {major: 1, minor: 0, patch: 0}
      transition_name: companion_open_to_closed_on_closed
      from_state: COMPANION_OPEN
      to_state: CLOSED
      trigger: closed
    - version: {major: 1, minor: 0, patch: 0}
      transition_name: checks_pending_to_closed_on_closed
      from_state: CHECKS_PENDING
      to_state: CLOSED
      trigger: closed
    - version: {major: 1, minor: 0, patch: 0}
      transition_name: ready_to_closed_on_closed
      from_state: READY
      to_state: CLOSED
      trigger: closed
    - version: {major: 1, minor: 0, patch: 0}
      transition_name: armed_to_closed_on_closed
      from_state: ARMED
      to_state: CLOSED
      trigger: closed
    - version: {major: 1, minor: 0, patch: 0}
      transition_name: needs_agent_to_closed_on_closed
      from_state: NEEDS_AGENT
      to_state: CLOSED
      trigger: closed
    # plan 5.1 row 23: any non-terminal | completion bound expired
    - version: {major: 1, minor: 0, patch: 0}
      transition_name: observed_to_needs_agent_on_completion_bound_expired
      from_state: OBSERVED
      to_state: NEEDS_AGENT
      trigger: completion_bound_expired
    - version: {major: 1, minor: 0, patch: 0}
      transition_name: parked_to_needs_agent_on_completion_bound_expired
      from_state: PARKED
      to_state: NEEDS_AGENT
      trigger: completion_bound_expired
    - version: {major: 1, minor: 0, patch: 0}
      transition_name: companion_pending_to_needs_agent_on_completion_bound_expired
      from_state: COMPANION_PENDING
      to_state: NEEDS_AGENT
      trigger: completion_bound_expired
    - version: {major: 1, minor: 0, patch: 0}
      transition_name: companion_open_to_needs_agent_on_completion_bound_expired
      from_state: COMPANION_OPEN
      to_state: NEEDS_AGENT
      trigger: completion_bound_expired
    - version: {major: 1, minor: 0, patch: 0}
      transition_name: checks_pending_to_needs_agent_on_completion_bound_expired
      from_state: CHECKS_PENDING
      to_state: NEEDS_AGENT
      trigger: completion_bound_expired
    - version: {major: 1, minor: 0, patch: 0}
      transition_name: ready_to_needs_agent_on_completion_bound_expired
      from_state: READY
      to_state: NEEDS_AGENT
      trigger: completion_bound_expired
    - version: {major: 1, minor: 0, patch: 0}
      transition_name: armed_to_needs_agent_on_completion_bound_expired
      from_state: ARMED
      to_state: NEEDS_AGENT
      trigger: completion_bound_expired
    - version: {major: 1, minor: 0, patch: 0}
      transition_name: needs_agent_to_needs_agent_on_completion_bound_expired
      from_state: NEEDS_AGENT
      to_state: NEEDS_AGENT
      trigger: completion_bound_expired
    # plan 5.1 state table, 'Leaves on' exits with no transition-table row
    - version: {major: 1, minor: 0, patch: 0}
      transition_name: parked_to_observed_on_ready_for_review
      from_state: PARKED
      to_state: OBSERVED
      trigger: ready_for_review
    - version: {major: 1, minor: 0, patch: 0}
      transition_name: parked_to_observed_on_hold_lifted
      from_state: PARKED
      to_state: OBSERVED
      trigger: hold_lifted
    - version: {major: 1, minor: 0, patch: 0}
      transition_name: parked_to_observed_on_body_edited
      from_state: PARKED
      to_state: OBSERVED
      trigger: body_edited
    - version: {major: 1, minor: 0, patch: 0}
      transition_name: needs_agent_to_observed_on_hold_lifted
      from_state: NEEDS_AGENT
      to_state: OBSERVED
      trigger: hold_lifted
metadata:
  description: "Deterministic per-PR landing workflow: change-control companion, re-runs, update-branch and arming as one FSM."
  author: "OmniNode Team"
  license: "MIT"
  created: "2026-09-26"
  tags:
    - orchestrator
    - pr-landing
    - fsm
    - workflow
    - change-control
  related_tickets:
    - "OMN-19822"
    - "OMN-19824"
