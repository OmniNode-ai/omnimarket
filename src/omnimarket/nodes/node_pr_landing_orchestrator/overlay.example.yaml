# Synthetic values. The deployment's overlay lives at <root>/node_pr_landing_orchestrator/overlay.yaml under a
# root named in ONEX_SKILL_OVERLAY_ROOTS. No key has a default.
#
#   landing_goal   the hourly requirements a landing reading is judged against
#   repo_scope     the repositories the landing nodes act on, and the visibility kept
landing_goal:
  merges_per_window: 10
  window_seconds: 3600
  waiting_threshold: 10
  eligible_head_bound_seconds: 3600
  canary_bound_seconds: 3600
repo_scope:
  repositories:
    - example-org/example-repo-a
    - example-org/example-repo-b
  visibility: all
