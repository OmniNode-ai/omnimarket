name: node_pr_landing_orchestrator
version: "0.3.0"
description: "PR landing workflow orchestrator: per-PR FSM from push to merge (per-repository mode from its contract, enforce for the omnimarket canary)"
omnibase_core_compat: ">=0.39.0,<1.0.0"
entry_points:
  onex.nodes:
    node_pr_landing_orchestrator: "omnimarket.nodes.node_pr_landing_orchestrator"
capabilities:
  standalone: false
  # The contract declares its routes (wave-3 compose, OMN-19829); the
  # runtime's state_io seam holds its row in pr_landing_workflow_state.
  # OMN-20866: before an arm it reads the ledger's HOLD rows and the head's
  # lab proof from the omninode_internal projections (read-only).
  full_runtime: true
  requires_network: false
  requires_repo: false
  requires_secrets: false
  requires_docker: false
  side_effect_class: stateful
dependencies:
  - "omnibase_core>=0.39.0"
  - "omnibase-infra>=0.34.0"
  # OMN-20866: the arm decision reads the ledger and lab proof projections.
  - "asyncpg>=0.30.0"
authors: ["OmniNode Platform Team"]
license: "MIT"
tags: ["orchestrator", "pr-landing", "fsm", "workflow"]
pack: "pr_lifecycle"
display_name: "PR Landing Orchestrator"
node_role: "orchestrator"
