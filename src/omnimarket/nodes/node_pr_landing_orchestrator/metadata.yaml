name: node_pr_landing_orchestrator
version: "0.2.0"
description: "PR landing workflow orchestrator: per-PR FSM from push to merge (handler built; runtime wiring lands with its sibling handlers)"
omnibase_core_compat: ">=0.39.0,<1.0.0"
entry_points:
  onex.nodes:
    node_pr_landing_orchestrator: "omnimarket.nodes.node_pr_landing_orchestrator"
capabilities:
  standalone: false
  # false until the runtime wiring lands with the GitHub effect handler, the
  # producer's typed outcome and the landing projection: the handler exists,
  # but the contract declares no route yet (auto-wiring prepares it SKIPPED).
  full_runtime: false
  requires_network: false
  requires_repo: false
  requires_secrets: false
  requires_docker: false
  side_effect_class: stateful
dependencies:
  - "omnibase_core>=0.39.0"
  - "omnibase-infra>=0.34.0"
authors: ["OmniNode Platform Team"]
license: "MIT"
tags: ["orchestrator", "pr-landing", "fsm", "workflow"]
pack: "pr_lifecycle"
display_name: "PR Landing Orchestrator"
node_role: "orchestrator"
