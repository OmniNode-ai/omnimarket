name: node_git_query_mirror_effect
version: "0.1.0"
description: "Fetch-only git mirror with a durable merge-event outbox; pending merges are published with the event emit node's Kafka adapter and marked published after broker acknowledgement."
pack: pr-lifecycle
node_role: effect
display_name: "Git Query Mirror Effect"
omnibase_core_compat: ">=0.39.0,<1.0.0"
entry_points:
  onex.nodes:
    node_git_query_mirror_effect: "omnimarket.nodes.node_git_query_mirror_effect"
capabilities:
  standalone: true
  full_runtime: true
  requires_network: true
  requires_repo: false
  requires_secrets: false
  requires_docker: false
  side_effect_class: write
dependencies:
  - "omnibase-infra>=0.38.3,<0.39.0"
authors: ["OmniNode Platform Team"]
license: "MIT"
tags: ["effect", "git", "github-quota", "outbox", "kafka"]
