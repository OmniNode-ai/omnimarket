# ONEX Node Contract - Reading Writer Effect (OMN-22478, B0 reading writer)
#
# The only writer of reading rows. It reads ledger rows through the route the overlay names
# (the ledger file and its rolls, or the configured read command), computes each piece's reading
# with node_reading_compute, checks the row key against the readings already on the ledger and
# appends the reading row through the configured append command. It writes reading rows and
# nothing else: a reading is never a gate, a stop or an admission.
name: node_reading_writer_effect
contract_name: node_reading_writer_effect
node_name: node_reading_writer_effect
contract_version: {major: 1, minor: 0, patch: 0}
node_version: {major: 1, minor: 0, patch: 0}
node_type: effect
lifecycle: experimental
runtime_profiles: [effects]

description: >
  Runs the readings of one closed window: probes the ledger (read only), computes WORKING,
  NOT_WORKING or UNKNOWN per piece, and appends one reading row per piece. A conflicting
  duplicate fails the window; the same row key with different content is a replay failure; a
  source that cannot be read gives UNKNOWN; a window that has not reached its cutoff is refused
  with a typed failure. A piece that declares landing requirements (piece 9) is read from the pull
  request watcher's snapshot through the overlay's landing route, beside the ledger rows of its canary.

handler:
  module: omnimarket.nodes.node_reading_writer_effect.handlers.handler_reading_writer
  class: HandlerReadingWriter
  input_model: omnimarket.models.model_reading.ModelReadingWindowCommand

# Not a runtime-dispatched handler: HandlerReadingWriter takes its overlay, source, appender and clock
# as constructor parameters, so the node runs through its own CLI and schedule, not handler_routing.

descriptor:
  node_archetype: effect
  runtime_profiles: [effects]
  purity: impure
  idempotent: true
  side_effects: [ledger-append]
  timeout_ms: 600000

input_model:
  name: ModelReadingWindowCommand
  module: omnimarket.models.model_reading
  description: A closed window's start, optionally some pieces, and whether to write.
output_model:
  name: ModelReadingWindowResult
  module: omnimarket.models.model_reading
  description: Per piece verdict, outcome, row key and what happened on the ledger.

terminal_event: onex.evt.omnimarket.reading-window-completed.v1

runtime_dispatch:
  external_trigger: true

# The topics by role; the handler's event mapping reads these and holds no topic string.
topics:
  reading_window_requested: onex.cmd.omnimarket.reading-window-requested.v1
  reading_piece_written: onex.evt.omnimarket.reading-piece-written.v1
  reading_piece_failed: onex.evt.omnimarket.reading-piece-failed.v1
  reading_window_completed: onex.evt.omnimarket.reading-window-completed.v1
  reading_window_failed: onex.evt.omnimarket.reading-window-failed.v1

event_bus:
  subscribe_topics: []
  publish_topics: []

externally_consumed_topics:
  - onex.evt.omnimarket.reading-piece-written.v1
  - onex.evt.omnimarket.reading-piece-failed.v1
  - onex.evt.omnimarket.reading-window-completed.v1
  - onex.evt.omnimarket.reading-window-failed.v1

# The node's own hourly schedule, installed by `schedule install --host <name>` as a systemd user
# timer on each host the overlay's schedule_hosts names, removed by `schedule uninstall`.
# `on_calendar` runs a quarter of an hour after each hour, after the window's cutoff.
schedule:
  unit_name: onex-reading-hourly
  state_directory: .onex_state/reading-writer
  timeout_seconds: 600
  cadence:
    on_calendar: "*-*-* *:15:00"
    randomized_delay: 30s
    persistent: true
    description: hourly, fifteen minutes past, after the previous window's cutoff
  schedulers:
    systemd-user: installed by this node (schedule install) as a systemd user timer

overlay:
  node: node_reading_writer_effect
  roots_env: ONEX_SKILL_OVERLAY_ROOTS

metadata:
  ticket: OMN-22478
  transport_type: inmemory
