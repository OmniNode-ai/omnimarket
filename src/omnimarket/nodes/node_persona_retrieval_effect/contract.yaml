---

name: "node_persona_retrieval_effect"
contract_version: {major: 0, minor: 1, patch: 0}
node_version: {major: 0, minor: 1, patch: 0}
description: >
  Read-only EFFECT node that retrieves the latest PersonaSnapshot for a user_id/agent_id from Postgres.
  No event bus (read-only). Phase 3 Adaptive Personalization (OMN-7305).
node_type: effect
input_model: "ModelPersonaRetrievalRequest"
output_model: "ModelPersonaRetrievalResponse"
handler:
  module: omnimarket.nodes.node_persona_retrieval_effect
  class: NodePersonaRetrievalEffect
  input_model: omnimarket.nodes.node_persona_retrieval_effect.models.model_persona_retrieval_request.ModelPersonaRetrievalRequest

descriptor:
  node_archetype: effect
  purity: effectful
  runtime_profiles: [effects]

runtime_dispatch:
  command_topic: onex.cmd.omnimemory.persona-retrieval.v1
  terminal_events:
    success: onex.evt.omnimemory.persona-retrieval-completed.v1
    failure: onex.evt.omnimemory.persona-retrieval-failed.v1

event_bus:
  subscribe_topics:
    - onex.cmd.omnimemory.persona-retrieval.v1
  publish_topics:
    - onex.evt.omnimemory.persona-retrieval-completed.v1
    - onex.evt.omnimemory.persona-retrieval-failed.v1

externally_consumed_topics:
  - onex.evt.omnimemory.persona-retrieval-completed.v1
  - onex.evt.omnimemory.persona-retrieval-failed.v1

io_operations:
  - operation_type: "database_read"
    atomic: false
    timeout_seconds: 5
    validation_enabled: true

tags:
  - persona
  - effect
  - retrieval
  - postgres
  - phase-3
