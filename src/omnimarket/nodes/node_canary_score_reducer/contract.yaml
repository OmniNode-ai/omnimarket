---
name: canary_score_reducer
contract_version: {major: 1, minor: 0, patch: 0}
node_type: reducer
node_version: {major: 1, minor: 0, patch: 0}

description: >
  Subscribes to canary-completed events and materializes grading scores
  (recall, precision, fidelity, format_compliance) into the capability_scores
  table, closing the feedback loop between canary runs and routing decisions.

handler_routing:
  routing_strategy: operation_match
  handlers:
    - operation: canary_score_reducer.accumulate
      handler:
        name: HandlerCanaryScoreReducer
        module: omnimarket.nodes.node_canary_score_reducer.handlers.handler_canary_score_reducer
      event_model:
        name: ModelScoreReducerState
        module: omnimarket.nodes.node_canary_score_reducer.models.model_score_reducer_state

# Retained for legacy resolution; canonical dispatch uses handler_routing above.
handler:
  module: omnimarket.nodes.node_canary_score_reducer.handlers.handler_canary_score_reducer
  class: HandlerCanaryScoreReducer
  input_model: omnimarket.nodes.node_canary_score_reducer.models.model_score_reducer_state.ModelScoreReducerState

descriptor:
  node_archetype: reducer
  purity: pure
  idempotent: true
  timeout_ms: 30000

db_io:
  db_tables:
    - name: capability_scores
      database_ref: application
      # OMN-15655 / operator ruling 2026-08-02 (house tenant): workload-
      # attributable rows live in the tenant domain; platform-own workloads
      # are the house tenant's rows. ADR-0027 classification, not a rename.
      schema: tenant
      migration: "0001_create_capability_scores.sql"
      access: write
      role: capability_scores

event_bus:
  subscribe_topics:
    - onex.evt.omnimarket.adr-canary-completed.v1
  publish_topics:
    - onex.evt.omnimarket.capability-scores-updated.v1

projection_api:
  expose: true
  topic: "onex.snapshot.projection.capability-scores.v1"  # onex-topic-allow: projection snapshot topics use onex.snapshot.* prefix by convention
  table: "capability_scores"
  schema: "public"
  columns:
    - "model_key"
    - "task_type"
    - "success_rate"
    - "avg_latency_ms"
    - "total_cost"
    - "total_count"
    - "success_count"
    - "failure_count"
    - "last_updated"
  order_by: "last_updated DESC"
  freshness_column: "last_updated"
  limit: 100

metadata:
  transport_type: kafka

# OMN-13734: machine-readable FSM (transcribed from authoritative handler/model logic).
state_machine:
  state_machine_name: canary_score_fsm
  initial_state: idle
  states:
    - state_name: idle
      description: "No canary result folded yet."
      required_data: []
    - state_name: scored
      description: "Capability scores projection materialized."
      required_data: []
  transitions:
    - from_state: idle
      to_state: scored
      trigger: adr_canary_completed
      description: "Canary completed; fold into scores."
    - from_state: scored
      to_state: scored
      trigger: adr_canary_completed
      description: "Fold another canary result."
    - from_state: scored
      to_state: scored
      trigger: capability_scores_updated
      description: "Re-observe own scores (idempotent)."
  terminal_states: []
  persistence_enabled: false
