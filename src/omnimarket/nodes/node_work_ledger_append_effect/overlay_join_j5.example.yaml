# Synthetic values. The deployment's overlay lives at <root>/node_work_ledger_join_j5/overlay.yaml under a root named in
# ONEX_SKILL_OVERLAY_ROOTS. No key has a default; an overlay never holds a secret value. The upstream rule and the emission
# journal are read from the join refusal overlay (node_join_refusal_effect), join J5.
identity:
  ref: example-ledger-writer
  folder: /shared/env
  key: EXAMPLE_LEDGER_WRITER_KEY
  principal: example-writer
ledger:
  ledger_id: example-ledger
  path_env: EXAMPLE_LEDGER_PATH
  command_env: EXAMPLE_LEDGER_APPEND_COMMAND
  host_env: EXAMPLE_LEDGER_HOST_NAME
  append_timeout_seconds: 150
row:
  lane: example-join-j5
  requesting_lane: example-join-j5
  text: piece 6 appended a row for a piece 5 reading under a store-resolved identity
projection:
  read:
    route: command
    command_env: EXAMPLE_LEDGER_READ_COMMAND
    timeout_seconds: 60
    row_limit: 5000
  attempts: 6
  interval_seconds: 5
  slack_seconds: 120
max_appends_per_run: 1
# OMN-23591: the run's own time limit, inside the publish step's (90 s). A run still open at it closes its chain typed.
run_deadline_seconds: 75
allow_injected_break: false
injected_fault: Point the projection read at a ledger that never hears the row, or revoke the identity's key in the store
