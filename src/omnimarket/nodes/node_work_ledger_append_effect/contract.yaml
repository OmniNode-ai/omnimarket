# ONEX Node Contract - Work Ledger Append Effect (OMN-20275)
#
# WHO HOSTS THIS NODE. One process on the ledger host (`onex work-ledger serve`)
# runs the append command locally. Shared runtimes must NEVER attach it: a
# runtime container would race the ledger host for rows it cannot append.
# The contract therefore declares runtime_dispatch and NO event_bus block;
# runtime auto-wiring attaches only contracts declaring both handler_routing
# and event_bus, just like node_lab_work_unit_effect.
#
# ADDRESSING. The serve process reads the writer topics in ONE consumer group and
# handles each command inside its subscription callback, so the group's position
# passes a command only after its receipt is published. A lock beside the ledger
# file admits one serve process per ledger. The handler dedups on the request's
# req= cell, so a command redelivered after a crash is answered, never appended
# twice (TLA+ model and review: omnibase_internal tla/ledger_bus_append).
# IDENTITY. Rows are attributed to the broker principal of the producing
# connection, attested by the per-principal topic WRITE ACL declared in
# omnibase_infra deploy/lab/developer-principal-grants.yaml (issued principals)
# and the deployment's broker ACL declaration (host logins and the ledger
# host's read side). Each principal
# writes only its own topic; the serve process takes identity from that topic.
# Every row is stamped with that writer; RULING and OPERATOR-CONSENT require
# the operator identity configured locally on the ledger host. No row signing.
# The ledger host and append argv are deployment facts
# given on the serve command line; nothing here names a machine.
name: "node_work_ledger_append_effect"
lifecycle: experimental
node_type: "EFFECT_GENERIC"
runtime_profiles: [effects]
contract_version: {major: 0, minor: 4, patch: 0}
node_version: "0.4.0"
description: >
  Attributes rows to the broker principal of the producing connection, attested
  by per-principal topic WRITE ACLs declared in omnibase_infra
  deploy/lab/developer-principal-grants.yaml, with no per-row signing. Appends
  on the ledger host, deduplicating by request id and returning line numbers.
input_model:
  name: "ModelWorkLedgerAppendRequest"
  module: "omnimarket.models.work_ledger_append.model_work_ledger_append"
  description: "Request id, rows, ledger id, lane, host and time; writer identity comes from the broker."
output_model:
  name: "ModelWorkLedgerAppendReceipt"
  module: "omnimarket.models.work_ledger_append.model_work_ledger_append"
  description: "Status, exit code, output tail, ledger lines, host, duration and broker writer principal."
handler:
  module: "omnimarket.nodes.node_work_ledger_append_effect.handlers.handler_work_ledger_append_effect"
  class: "HandlerWorkLedgerAppendEffect"
  input_model: "omnimarket.models.work_ledger_append.model_work_ledger_append.ModelWorkLedgerAppendRequest"
handler_routing:
  routing_strategy: "operation_match"
  default_handler: "omnimarket.nodes.node_work_ledger_append_effect.handlers.handler_work_ledger_append_effect:HandlerWorkLedgerAppendEffect"
  handlers:
    - operation: "append_work_ledger"
      handler:
        name: "HandlerWorkLedgerAppendEffect"
        module: "omnimarket.nodes.node_work_ledger_append_effect.handlers.handler_work_ledger_append_effect"
descriptor:
  node_archetype: effect
  purity: effectful
  idempotent: true
  timeout_ms: 180000
# One command topic per writer principal: onex.<kind>.<producer>.<name_prefix><principal>.v<version>.
# The parts are declared apart, because the writer's name is the last piece of
# the topic's name and a `{principal}` slot inside a full topic string fails the
# architecture lint's topic-name rule.
writer_topics:
  kind: "cmd"
  producer: "omnimarket"
  name_prefix: "work-ledger-append-from-"
  version: 1
  principal_pattern: "^[a-z0-9][a-z0-9-]{0,62}$"
# OMN-20275: the serve host watches that its consumers hold partition assignments. When they do not for
# `unhealthy_probes_before_degraded` probes in a row the host reports degraded, raises one alarm for the
# episode and drops and retakes every subscription, waiting `backoff_initial_seconds` growing by
# `backoff_factor` up to `backoff_cap_seconds` between attempts, until the assignments return.
consume_watch:
  probe_interval_seconds: 15
  unhealthy_probes_before_degraded: 3
  resubscribe_timeout_seconds: 60
  backoff_initial_seconds: 15
  backoff_factor: 2
  backoff_cap_seconds: 300
runtime_dispatch:
  # UNATTRIBUTED legacy topic: serve answers parsed requests with a refusal.
  command_topic: "onex.cmd.omnimarket.work-ledger-append-requested.v1"
  terminal_events:
    success: "onex.evt.omnimarket.work-ledger-append-completed.v1"
    failure: "onex.evt.omnimarket.work-ledger-append-failed.v1"
published_events:
  - event_type: ModelWorkLedgerAppendReceipt
    topic: onex.evt.omnimarket.work-ledger-append-completed.v1
    description: "The receipt of an accepted, duplicate, refused or errored append."
  - event_type: ModelWorkLedgerAppendCommandFailure
    topic: onex.evt.omnimarket.work-ledger-append-failed.v1
    description: "An unreadable command or handler crash."
  # A refused TERMINAL leaves the CLAIM it would close open on the ledger. The
  # host publishes this beside the refused receipt so the refusal is loud; the
  # owner claim's lease (node_pr_lifecycle_state_reducer owner_claim_lease) ends
  # the claim's hold on its PRs at the TTL.
  - event_type: ModelWorkLedgerTerminalRefused
    topic: onex.evt.omnimarket.work-ledger-terminal-refused.v1
    description: "TERMINAL_REFUSED: a refused request carried TERMINAL rows; names their lanes, tickets and PRs."
# TERMINAL_REFUSED is read off the bus by the orchestrator's lab readback and the
# operator (rpk on the dev lane broker); no node acts on it, because the claim's
# lease, not this event, ends the claim's hold on its PRs.
externally_consumed_topics:
  - onex.evt.omnimarket.work-ledger-terminal-refused.v1
metadata:
  transport_type: kafka
  description: "Hosted by the ledger-host serve process, never a shared runtime"
  author: "OmniNode Team"
  created: "2026-10-01"
  tags: ["effect", "work-ledger", "OMN-20275"]
  related_tickets: ["OMN-20275"]
