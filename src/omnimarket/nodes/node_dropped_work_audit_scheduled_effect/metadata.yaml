name: node_dropped_work_audit_scheduled_effect
version: "0.1.0"
description: "Runs the dropped-work audit hourly on the runtime tick and raises one owner-missing event and one alarm row per item with no live owner"
omnibase_core_compat: ">=0.39.0,<1.0.0"
entry_points:
  onex.nodes:
    node_dropped_work_audit_scheduled_effect: "omnimarket.nodes.node_dropped_work_audit_scheduled_effect"
capabilities:
  standalone: true
  full_runtime: true
  requires_network: false
  requires_repo: false
  requires_secrets: false
  requires_docker: false
  side_effect_class: none
dependencies:
  - "omnibase_core>=0.39.0"
  - "omnibase-infra>=0.38.3"
authors: ["OmniNode Platform Team"]
license: "MIT"
tags: ["effect", "schedule", "ledger", "dropped-work", "OMN-26205"]
pack: "pipeline"
display_name: "Dropped Work Audit Scheduled"
node_role: "effect"
