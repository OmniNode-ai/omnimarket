---
# SPDX-FileCopyrightText: 2026 OmniNode.ai Inc.
# SPDX-License-Identifier: MIT
# ONEX Node Contract - Dropped Work Audit Scheduled Effect (OMN-26205)
#
# Runs the dropped-work audit hourly on the runtime tick (the dev runtime).
# Shape of node_commitment_check_scheduled_effect: it subscribes to the runtime scheduler's tick, gates on its own overlay
# (run_interval_seconds, grace_seconds, schedule_host) and returns its terminal event for the runtime to publish. The audit
# reads the ledger, the pull request watcher's state and the admission refusals, publishes one owner-missing event per item
# with no live owner (the topic is declared by node_dropped_work_audit_compute) and appends one alarm row per item.
name: node_dropped_work_audit_scheduled_effect
contract_name: node_dropped_work_audit_scheduled_effect
node_name: node_dropped_work_audit_scheduled_effect
contract_version: {major: 0, minor: 1, patch: 0}
node_version: {major: 0, minor: 1, patch: 0}
node_type: effect
lifecycle: experimental
runtime_profiles: [effects]

description: >
  Runs the dropped-work audit on the runtime's tick, once per overlay interval, and returns a typed run event. It reads the ledger, the merged pull requests and the admission refusals, publishes one owner-missing event per item with no live owner and appends one alarm row per item unowned past the alarm delay. It fails by name when a source cannot be read. It assigns no owner and never admits or refuses work.

handler:
  module: omnimarket.nodes.node_dropped_work_audit_scheduled_effect.handlers.handler_dropped_work_audit_scheduled
  class: HandlerDroppedWorkAuditScheduled
  input_model: omnibase_infra.runtime.models.model_runtime_tick.ModelRuntimeTick

handler_routing:
  routing_strategy: operation_match
  handlers:
    - operation: dropped_work_audit.scheduled_run
      handler:
        name: HandlerDroppedWorkAuditScheduled
        module: omnimarket.nodes.node_dropped_work_audit_scheduled_effect.handlers.handler_dropped_work_audit_scheduled
      handler_module: omnimarket.nodes.node_dropped_work_audit_scheduled_effect.handlers.handler_dropped_work_audit_scheduled
      event_model: omnibase_infra.runtime.models.model_runtime_tick.ModelRuntimeTick
      event_type: platform.runtime-tick
      description: >
        Gate on the overlay's run_interval_seconds, then run the dropped-work audit and return the run event.

input_model:
  name: ModelRuntimeTick
  module: omnibase_infra.runtime.models.model_runtime_tick
  description: The runtime scheduler's tick.
output_model:
  name: ModelScheduleRunEvent
  module: omnimarket.models.schedule_trigger.model_schedule_trigger
  description: "One scheduled job run, with when it was scheduled, when it fired and how it went."

descriptor:
  node_archetype: effect
  purity: effectful
  idempotent: true
  timeout_ms: 120000
  side_effects:
    - reads the ledger and appends one alarm row per item with no live owner; publishes one owner-missing event per item

input_subscriptions:
  - topic: "onex.intent.platform.runtime-tick.v1"
    operation: "dropped_work_audit.scheduled_run"

terminal_event: onex.evt.omnimarket.schedule-run.v1

# The typed owner-missing event (ModelOwnerMissingEvent, omnimarket.models.dropped_work_audit): one per item with no live
# owner, its event id the item id, ordered by the ledger row it was derived from (source_stamp). No lease and no second
# writer: the audit only reports. The topic is read from here by role; no handler holds a topic string.
topics:
  owner_missing: onex.evt.omnimarket.owner-missing.v1

event_bus:
  subscribe_topics:
    - "onex.intent.platform.runtime-tick.v1"
  publish_topics:
    - "onex.evt.omnimarket.schedule-run.v1"
    - "onex.evt.omnimarket.owner-missing.v1"

published_events:
  - event_type: ModelScheduleRunEvent
    topic: onex.evt.omnimarket.schedule-run.v1
    description: "One scheduled dropped-work audit run."
  - event_type: ModelOwnerMissingEvent
    topic: onex.evt.omnimarket.owner-missing.v1
    description: "One item of dropped work with no live owner."

externally_consumed_topics:
  - onex.evt.omnimarket.schedule-run.v1
  - onex.evt.omnimarket.owner-missing.v1

# Where the schedule reads its settings. The overlays are found under ONEX_SKILL_OVERLAY_ROOTS or the file the env var names.
runtime:
  schedule_overlay: {overlay_id: node_dropped_work_audit_scheduled_effect, model: omnimarket.models.dropped_work_audit.model_dropped_work_audit_schedule.ModelDroppedWorkAuditScheduleOverlay}

broker_acl_grants:
  - principal: "${ONEX_ACL_RUNTIME_PRINCIPAL}"
    grants:
      - {resource_type: TOPIC, pattern: LITERAL, name: onex.evt.omnimarket.schedule-run.v1, operation: WRITE}
      - {resource_type: TOPIC, pattern: LITERAL, name: onex.evt.omnimarket.schedule-run.v1, operation: DESCRIBE}
      - {resource_type: TOPIC, pattern: LITERAL, name: onex.evt.omnimarket.owner-missing.v1, operation: WRITE}
      - {resource_type: TOPIC, pattern: LITERAL, name: onex.evt.omnimarket.owner-missing.v1, operation: DESCRIBE}
      - {resource_type: TOPIC, pattern: LITERAL, name: onex.intent.platform.runtime-tick.v1, operation: READ}
      - {resource_type: TOPIC, pattern: LITERAL, name: onex.intent.platform.runtime-tick.v1, operation: DESCRIBE}

metadata:
  ticket: OMN-26205
  transport_type: kafka
