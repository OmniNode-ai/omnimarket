  "description": "A remote lane writes its report under the running host's claude_scratch reports directory; at close the launching host copies the lane's own report files into its own reports directory in one remote call, or leaves the lane's final message there when the lane wrote none. It never raises and never changes the lane's outcome. It follows the delegation receipt relay: the runner already holds the ssh path to the host at close, so no second store is added.",
