# ONEX Node Contract - Ask Done Check Effect (OMN-22478, piece 6: operator asks as durable commitments)
#
# Runs each operator ask's declared done check against the running system (the floor's JSON, or a
# ledger row read through the bus-fed query node) and appends one STATUS verdict row on the check
# lane. node_ask_state_compute closes an ask on a TRUE verdict row only, never on a report or a merge.
name: node_ask_done_check_effect
contract_name: node_ask_done_check_effect
node_name: node_ask_done_check_effect
contract_version: {major: 1, minor: 0, patch: 0}
node_version: {major: 1, minor: 0, patch: 0}
node_type: effect
lifecycle: experimental
runtime_profiles: [effects]

description: >
  For each ask with a declared done check, reads the running system and records TRUE, FALSE or
  UNKNOWN as a STATUS row on the check lane citing the ask. A floor check reads a piece's status
  on the floor's JSON; a row check reads the ledger through the bus-fed query node for a row of
  the named lane, type and cells stamped after the ask. A source that cannot be read is UNKNOWN,
  never FALSE and never TRUE.

handler:
  module: omnimarket.nodes.node_ask_done_check_effect.handlers.handler_ask_done_check_bus
  class: HandlerAskDoneCheckBus
  input_model: omnimarket.nodes.node_ask_done_check_effect.models.model_ask_done_check.ModelAskDoneCheckRequest
  output_model: omnimarket.nodes.node_ask_done_check_effect.models.model_ask_done_check.ModelAskDoneCheckResult

# The runtime builds a handler with no arguments, so a command on the bus reaches HandlerAskDoneCheckBus,
# which reads the overlay and the environment when it is called and hands the request to
# HandlerAskDoneCheck. HandlerAskDoneCheck takes the overlay, the floor read, the ledger row source, the
# appender and the clock as constructor parameters, so the CLI builds it and routes nothing through
# handler_routing. A deployment with no overlay answers every ask UNKNOWN, never TRUE and never FALSE.
secondary_handlers:
  ask_done_check:
    handler:
      name: HandlerAskDoneCheck
      module: omnimarket.nodes.node_ask_done_check_effect.handlers.handler_ask_done_check

handler_routing:
  routing_strategy: topic_match
  handlers:
    - operation: ask_done_check_requested
      topic: onex.cmd.omnimarket.ask-done-check-requested.v1
      message_category: command
      event_model: omnimarket.nodes.node_ask_done_check_effect.models.model_ask_done_check.ModelAskDoneCheckRequest
      handler_module: omnimarket.nodes.node_ask_done_check_effect.handlers.handler_ask_done_check_bus
      handler:
        name: HandlerAskDoneCheckBus
        module: omnimarket.nodes.node_ask_done_check_effect.handlers.handler_ask_done_check_bus

descriptor:
  node_archetype: effect
  runtime_profiles: [effects]
  purity: impure
  idempotent: false
  side_effects: [http-read, bus-read, ledger-append]
  timeout_ms: 300000

input_model:
  name: ModelAskDoneCheckRequest
  module: omnimarket.nodes.node_ask_done_check_effect.models.model_ask_done_check
  description: The asks with their declared done checks, and whether to write the verdict rows.
output_model:
  name: ModelAskDoneCheckResult
  module: omnimarket.nodes.node_ask_done_check_effect.models.model_ask_done_check
  description: Per ask, the verdict, its reason, the verdict row and whether it landed.

terminal_event: onex.evt.omnimarket.ask-done-check-completed.v1

runtime_dispatch:
  command_topic: onex.cmd.omnimarket.ask-done-check-requested.v1
  terminal_events:
    success: onex.evt.omnimarket.ask-done-check-completed.v1
    failure: onex.evt.omnimarket.ask-done-check-failed.v1
  external_trigger: "python -m omnimarket.nodes.node_ask_done_check_effect --ask <id> --said-at <UTC stamp> --check <spec> (runtime_ask_done_check.py), or a command on the request topic."

# The bus demand path: a command on the request topic runs the checks and the verdicts return on the
# completed topic (the failed topic on a refused request), so the dev runtime subscribes and a dispatch
# reaches the handler.
event_bus:
  subscribe_topics:
    - onex.cmd.omnimarket.ask-done-check-requested.v1
  publish_topics:
    - onex.evt.omnimarket.ask-done-check-completed.v1
    - onex.evt.omnimarket.ask-done-check-failed.v1

# No node contract subscribes to the result events: the caller that sent the request reads the verdicts from them.
externally_consumed_topics:
  - onex.evt.omnimarket.ask-done-check-completed.v1
  - onex.evt.omnimarket.ask-done-check-failed.v1

# The broker grants the three topics need (coverage gate): the runtime login reads the request and writes both answers.
broker_acl_grants:
  - principal: "${ONEX_ACL_RUNTIME_PRINCIPAL}"
    grants:
      - {resource_type: TOPIC, pattern: LITERAL, name: onex.cmd.omnimarket.ask-done-check-requested.v1, operation: READ}
      - {resource_type: TOPIC, pattern: LITERAL, name: onex.cmd.omnimarket.ask-done-check-requested.v1, operation: DESCRIBE}
      - {resource_type: TOPIC, pattern: LITERAL, name: onex.evt.omnimarket.ask-done-check-completed.v1, operation: WRITE}
      - {resource_type: TOPIC, pattern: LITERAL, name: onex.evt.omnimarket.ask-done-check-completed.v1, operation: DESCRIBE}
      - {resource_type: TOPIC, pattern: LITERAL, name: onex.evt.omnimarket.ask-done-check-failed.v1, operation: WRITE}
      - {resource_type: TOPIC, pattern: LITERAL, name: onex.evt.omnimarket.ask-done-check-failed.v1, operation: DESCRIBE}

overlay:
  node: node_ask_done_check_effect
  roots_env: ONEX_SKILL_OVERLAY_ROOTS

metadata:
  ticket: OMN-22478
  transport_type: inmemory
