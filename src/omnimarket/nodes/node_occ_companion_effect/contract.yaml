# ONEX Node Contract - OCC Companion Effect (RSD-3, OMN-14622)
#
# The write-EFFECT + orchestrator half of the read -> compute -> write
# OCC-companion producer cycle (docs/plans/2026-07-10-occ-autogen-mechanization-design.md).
# Drives RSD-2 (node_occ_state_effect, read) -> RSD-1 (node_occ_companion_compute,
# pure compute) -> write: clones onex_change_control, writes the compute plan's
# net-new companion files to a branch off dev, opens the OCC PR, then re-runs the
# SAME pure compute with the OCC PR facts to render the self-bind receipt and the
# Evidence-Source-stamped product body. Every committed byte is a pure function of
# the compute plan; this node performs ONLY the git/gh side effects. Reuses the
# shared occ_git_transport (OMN-14622 promotion) — no second transport surface.
#
# Net-negative-surface (OMN-13976): the end state retires the legacy
# OccCompanionEmitter (node_pr_lifecycle_fix_effect) AND the manual companion
# lane, so this becomes the single OCC-companion producer.
#
# Related Tickets:
#   - OMN-14622: RSD-3 write-EFFECT + orchestrator (this node)
#   - OMN-14619: RSD-2 read-EFFECT (node_occ_state_effect)
#   - OMN-14285: RSD-1 (node_occ_companion_compute, the COMPUTE core)
#   - OMN-14393: RSD-5 fail-closed attestation gate (blocked on RSD-2/3 live)
#   - OMN-14550 / OMN-14429: producer bugs this deterministic path fixes
name: "node_occ_companion_effect"
lifecycle: experimental
node_type: "EFFECT_GENERIC"
runtime_profiles: [effects]
contract_version:
  major: 1
  minor: 0
  patch: 0
node_version: "1.0.0"
description: "Write-EFFECT + orchestrator: drives read->compute->write to author the deterministic OCC companion PR and stamp the product PR body."
input_model:
  name: "ModelOccCompanionEffectRequest"
  module: "omnimarket.nodes.node_occ_companion_effect.models.model_occ_companion_effect_request"
  description: "Identifies the product PR to author an OCC companion for; mode gates mutation."
output_model:
  name: "ModelOccCompanionEffectResult"
  module: "omnimarket.nodes.node_occ_companion_effect.models.model_occ_companion_effect_result"
  description: "The OCC PR authored (or the plan, in dry_run) + reproducibility digest."
handler_routing:
  routing_strategy: "operation_match"
  handlers:
    - operation: "author_occ_companion"
      handler:
        name: "HandlerOccCompanionEffect"
        module: "omnimarket.nodes.node_occ_companion_effect.handlers.handler_occ_companion_effect"

# OMN-16665: a mint DECLINE is no longer uniformly a success. The handler
# surfaces every decline onto the product PR (idempotent comment + the
# `occ-companion-effect / mint status` check-run) and RAISES
# OccCompanionEvidenceLostError when the compute plan reports
# `suppression.evidence_lost` — a product PR that MERGED unbound, whose evidence
# record the born path can never author. That raise is what routes the terminal
# event to `-failed.v1` below. Before it, a lost companion was published on the
# `-completed.v1` SUCCESS topic, so every projection and every "did the mint
# work" probe read green over a permanently missing record (live: omnimemory#447
# / OMN-16669, where the PR merged ~90s before the held publisher job reached
# the broker). Recoverable declines (draft, hold marker/label, no ticket,
# already bound, closed-unmerged) stay on the success topic and post a `neutral`
# check-run — they are correct and retriable, and observability must not newly
# block a PR that policy only paused.
runtime_dispatch:
  command_topic: "onex.cmd.omnimarket.occ-companion-effect-requested.v1"
  terminal_events:
    success: "onex.evt.omnimarket.occ-companion-effect-completed.v1"
    failure: "onex.evt.omnimarket.occ-companion-effect-failed.v1"

event_bus:
  subscribe_topics:
    - "onex.cmd.omnimarket.occ-companion-effect-requested.v1"
  publish_topics:
    - "onex.evt.omnimarket.occ-companion-effect-completed.v1"
    - "onex.evt.omnimarket.occ-companion-effect-failed.v1"
  dlq_topics:
    - "onex.dlq.omnimarket.occ-companion-effect.v1"

terminal_event: "onex.evt.omnimarket.occ-companion-effect-completed.v1"
secrets:
  GITHUB_TOKEN:
    description: "GitHub PAT or Actions token for REST (PR read/patch, OCC PR open) and HTTPS git clone/push."
    required: true
  # OMN-14893: the onexbot-occ-writer GitHub App credentials, consumed ONLY
  # when OMNI_OCC_GITHUB_AUTH_MODE=app. See node_pr_lifecycle_fix_effect's
  # contract.yaml for the identical declaration + rationale (both OCC
  # companion producers share the same auth-mode contract).
  ONEXBOT_OCC_APP_ID:
    description: "onexbot-occ-writer GitHub App id (app-auth mode only)."
    required: false
  ONEXBOT_OCC_PRIVATE_KEY:
    description: "onexbot-occ-writer GitHub App private key PEM (app-auth mode only)."
    required: false
  # OMN-15441: the product-repo-scoped credential for the ONE write this node
  # makes outside onex_change_control (PATCH the product PR body with
  # Evidence-Source). GITHUB_TOKEN above is scoped to onex_change_control in
  # the CI mutate path and 403s on that call. Optional: when absent the handler
  # falls back to GITHUB_TOKEN, which is correct for the single-cross-repo-PAT
  # bus-runtime path.
  OMNI_OCC_PRODUCT_TOKEN:
    description: "Product-repo-scoped GitHub token with pull_requests:write, used only for the product PR-body Evidence-Source stamp. Falls back to GITHUB_TOKEN when unset."
    required: false

side_effects:
  reads:
    - github_api
    - git
  writes:
    - github_pull_request
    - onex_change_control_branch
  duplicate_key_fields:
    - repo
    - pr_number
  duplicate_handling: idempotent

descriptor:
  node_archetype: effect
  purity: effectful
  runtime_profiles: [effects]
  idempotent: true
  timeout_ms: 300000

metadata:
  transport_type: kafka
  description: "OCC companion write-EFFECT + orchestrator — clones/pushes/opens the OCC PR from the deterministic compute plan"
  author: "OmniNode Team"
  created: "2026-07-14"
  tags:
    - "effect"
    - "orchestrator"
    - "occ"
    - "companion"
    - "producer"
    - "OMN-14622"
  related_tickets:
    - "OMN-14622"
    - "OMN-14619"
    - "OMN-14285"
    - "OMN-14393"
