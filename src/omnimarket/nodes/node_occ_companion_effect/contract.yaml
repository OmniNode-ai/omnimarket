# ONEX Node Contract - OCC Companion Effect (RSD-3, OMN-14622)
#
# The write-EFFECT + orchestrator half of the read -> compute -> write
# OCC-companion producer cycle (docs/plans/2026-07-10-occ-autogen-mechanization-design.md).
# Drives RSD-2 (node_occ_state_effect, read) -> RSD-1 (node_occ_companion_compute,
# pure compute) -> write: clones onex_change_control, writes the compute plan's
# net-new companion files to a branch off dev, opens the OCC PR, then re-runs the
# SAME pure compute with the OCC PR facts to render the self-bind receipt and the
# Evidence-Source-stamped product body. Every committed byte is a pure function of
# the compute plan; this node performs ONLY the git/gh side effects. Reuses the
# shared occ_git_transport (OMN-14622 promotion) — no second transport surface.
#
# Net-negative-surface (OMN-13976): the end state retires the legacy
# OccCompanionEmitter (node_pr_lifecycle_fix_effect) AND the manual companion
# lane, so this becomes the single OCC-companion producer.
#
# Related Tickets:
#   - OMN-14622: RSD-3 write-EFFECT + orchestrator (this node)
#   - OMN-14619: RSD-2 read-EFFECT (node_occ_state_effect)
#   - OMN-14285: RSD-1 (node_occ_companion_compute, the COMPUTE core)
#   - OMN-14393: RSD-5 fail-closed attestation gate (blocked on RSD-2/3 live)
#   - OMN-14550 / OMN-14429: producer bugs this deterministic path fixes
name: "node_occ_companion_effect"
lifecycle: experimental
node_type: "EFFECT_GENERIC"
runtime_profiles: [effects]
contract_version:
  major: 1
  minor: 0
  patch: 0
node_version: "1.0.0"
description: "Write-EFFECT + orchestrator: drives read->compute->write to author the deterministic OCC companion PR and stamp the product PR body."
input_model:
  name: "ModelOccCompanionEffectRequest"
  module: "omnimarket.nodes.node_occ_companion_effect.models.model_occ_companion_effect_request"
  description: "Identifies the product PR to author an OCC companion for; mode gates mutation."
output_model:
  name: "ModelOccCompanionEffectResult"
  module: "omnimarket.nodes.node_occ_companion_effect.models.model_occ_companion_effect_result"
  description: "The OCC PR authored (or the plan, in dry_run) + reproducibility digest."
handler_routing:
  routing_strategy: "operation_match"
  handlers:
    - operation: "author_occ_companion"
      handler:
        name: "HandlerOccCompanionEffect"
        module: "omnimarket.nodes.node_occ_companion_effect.handlers.handler_occ_companion_effect"
# No event_bus block: this node is deliberately NOT wired to any Kafka trigger in
# this first PR (same staging as RSD-2). It is invoked directly (handler.handle(...))
# so the full read->compute->write chain can be proven against a real gated PR
# before anything is wired into the live process. Declaring subscribe/publish
# topics with no live producer/consumer trips the contract-topic-graph gate's
# ORPHANED_CONSUMER/ORPHANED_PRODUCER checks. The trigger (consuming the same
# occ-autobind command the legacy path uses) lands in the follow-up that retires
# OccCompanionEmitter, alongside the producer/consumer that makes it real.
secrets:
  GITHUB_TOKEN:
    description: "GitHub PAT or Actions token for REST (PR read/patch, OCC PR open) and HTTPS git clone/push."
    required: true

side_effects:
  reads:
    - github_api
    - git
  writes:
    - github_pull_request
    - onex_change_control_branch
  duplicate_key_fields:
    - repo
    - pr_number
  duplicate_handling: idempotent

descriptor:
  node_archetype: effect
  purity: effectful
  runtime_profiles: [effects]
  idempotent: true
  timeout_ms: 300000

metadata:
  transport_type: kafka
  description: "OCC companion write-EFFECT + orchestrator — clones/pushes/opens the OCC PR from the deterministic compute plan"
  author: "OmniNode Team"
  created: "2026-07-14"
  tags:
    - "effect"
    - "orchestrator"
    - "occ"
    - "companion"
    - "producer"
    - "OMN-14622"
  related_tickets:
    - "OMN-14622"
    - "OMN-14619"
    - "OMN-14285"
    - "OMN-14393"
