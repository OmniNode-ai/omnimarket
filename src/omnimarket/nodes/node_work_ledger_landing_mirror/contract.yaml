name: node_work_ledger_landing_mirror
lifecycle: experimental
node_type: compute
contract_version: {major: 1, minor: 0, patch: 0}
node_version: {major: 1, minor: 0, patch: 0}
description: >
  Pure mapping of one landing decision event to the STATUS append request for
  its actions, recorded outcomes, DEGRADED reasons and violations. A tick with
  none of them maps to no request. Hosted by the single ledger serve process,
  which serializes these requests with ordinary ledger commands through the
  existing append handler. No shared runtime subscription: only the ledger
  host can append.
input_model:
  name: ModelWorkLedgerLandingMirrorRequest
  module: omnimarket.nodes.node_work_ledger_landing_mirror.models.model_work_ledger_landing_mirror
output_model:
  name: ModelWorkLedgerLandingMirrorResult
  module: omnimarket.nodes.node_work_ledger_landing_mirror.models.model_work_ledger_landing_mirror
handler:
  module: omnimarket.nodes.node_work_ledger_landing_mirror.handlers.handler_work_ledger_landing_mirror
  class: HandlerWorkLedgerLandingMirror
  input_model: omnimarket.nodes.node_work_ledger_landing_mirror.models.model_work_ledger_landing_mirror.ModelWorkLedgerLandingMirrorRequest
  output_model: omnimarket.nodes.node_work_ledger_landing_mirror.models.model_work_ledger_landing_mirror.ModelWorkLedgerLandingMirrorResult
descriptor:
  node_archetype: compute
  purity: pure
  idempotent: true
  timeout_ms: 5000
# The serve adapter loads these topics from the contract. Keeping event_bus
# and handler_routing absent prevents shared-runtime auto-wiring from racing
# the ledger host. The topic is the landing decision node's success terminal.
runtime_dispatch:
  command_topic: onex.evt.omnimarket.pr-landing-decision-completed.v1
  subscribe_topics:
    - onex.evt.omnimarket.pr-landing-decision-completed.v1
published_events:
  - event_type: ModelWorkLedgerAppendRequest
    topic: onex.cmd.omnimarket.work-ledger-append-requested.v1
    description: Append request consumed by the ledger host's append handler.
metadata:
  transport_type: kafka
