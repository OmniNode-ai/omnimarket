name: node_standalone_service_redeploy_effect
version: "0.1.0"
description: "Effect: publish the signed deploy-agent command that recreates one declared service of one declared standalone compose file, dev lane only. Refuses an undeclared compose file or service and any other lane."
pack: operator_tooling
node_role: effect
display_name: "Standalone Service Redeploy Effect"
omnibase_core_compat: ">=0.47.31,<0.48.0"
entry_points:
  onex.nodes:
    node_standalone_service_redeploy_effect: "omnimarket.nodes.node_standalone_service_redeploy_effect"
capabilities:
  standalone: false
  full_runtime: false
  requires_network: true
  requires_repo: false
  requires_secrets: true
  requires_docker: false
  side_effect_class: write
dependencies:
- pydantic>=2.0
- pyyaml>=6.0
license: "MIT"
authors: ["OmniNode Team"]
tags: ["effect", "deploy"]
