---
name: verify_effect
contract_version: {major: 1, minor: 0, patch: 0}
node_type: effect
node_version: {major: 1, minor: 0, patch: 0}

description: >
  Verifies system health before building: dashboard, runtime, data flow.
  Non-critical failures produce warnings; only critical check failures
  block the loop. Exposes ProtocolHealthChecker for pluggable check
  implementations.

# Top-level initial-payload model for the event-driven routing path. The
# RuntimeLocal event-driven resolver (_resolve_event_driven_payload_spec)
# consults contract.input_model first; the handler.input_model below is only
# read on the single-handler path. Both must be declared so either execution
# path can seed the caller payload instead of failing closed.
input_model:
  module: omnimarket.nodes.node_verify_effect.models.model_verify_input
  class: ModelVerifyInput

handler:
  module: omnimarket.nodes.node_verify_effect.handlers.handler_verify
  class: HandlerVerify
  input_model: omnimarket.nodes.node_verify_effect.models.model_verify_input.ModelVerifyInput

handler_routing:
  routing_strategy: operation_match
  handlers:
    - operation: verify
      handler:
        name: HandlerVerify
        module: omnimarket.nodes.node_verify_effect.handlers.handler_verify

descriptor:
  node_archetype: effect
  purity: side_effect
  idempotent: true
  timeout_ms: 60000
  runtime_profiles:
    - effects

terminal_event: onex.evt.omnimarket.build-loop-verify-completed.v1

event_bus:
  subscribe_topics:
    - onex.cmd.omnimarket.build-loop-verify.v1
  publish_topics:
    - onex.evt.omnimarket.build-loop-verify-completed.v1

metadata:
  transport_type: kafka
