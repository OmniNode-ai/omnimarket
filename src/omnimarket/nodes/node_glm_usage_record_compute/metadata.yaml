name: node_glm_usage_record_compute
version: "0.1.0"
description: "one harness run on the GLM Coding Plan as a usage event with its credits, and a refusal event on a cap refusal"
omnibase_core_compat: ">=0.39.0,<1.0.0"
entry_points:
  onex.nodes:
    node_glm_usage_record_compute: "omnimarket.nodes.node_glm_usage_record_compute"
capabilities:
