  requires_repo: false
  requires_secrets: false
  requires_docker: false
  side_effect_class: read_only
dependencies: []
authors: ["OmniNode Platform Team"]
license: "MIT"
tags: ["compute", "delegation", "glm", "usage", "pure"]
pack: "routing"
display_name: "GLM Usage Record"
