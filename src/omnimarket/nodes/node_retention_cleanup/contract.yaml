---
name: retention_cleanup
contract_version:
  major: 1
  minor: 5
  patch: 0
node_type: effect
node_version:
  major: 1
  minor: 4
  patch: 0
description: >
  Prunes stale records from projection tables per declarative retention policy.
  Deletes never-store topics immediately, high-volume topics after 3 days,
  and general events after 5 days. Tables and retention windows are
  declared in this contract — changes require a contract bump, not a handler edit.
  A target with batch_size deletes in bounded batches, one committed
  transaction each. Runs once per schedule.run_interval_seconds on the
  platform runtime tick of each lab runtime, and publishes one completed event
  per run with rows removed per table. Ledger, credential, tenant registry and
  migration history tables are refused at load. The same contract declares
  the lab hosts' unbounded file paths (retention_policy.file_retention), each
  with the keep window its readers set; the host timer runs them with the
  tables and the completed event carries files and bytes removed and archived.
handler:
  module: omnimarket.nodes.node_retention_cleanup.handlers.handler_retention_cleanup
  class: NodeRetentionCleanup
  input_model: omnimarket.nodes.node_retention_cleanup.handlers.handler_retention_cleanup.RetentionCleanupRequest

handler_routing:
  handlers:
    - operation: retention_cleanup
      topic: onex.cmd.omnimarket.retention-cleanup-requested.v1
      handler:
        name: NodeRetentionCleanup
        module: omnimarket.nodes.node_retention_cleanup.handlers.handler_retention_cleanup
    # The schedule's entry. Same handler class as the manual operation: the
    # elapsed-time stamp is per-instance state.
    - operation: retention_cleanup.scheduled_run
      topic: onex.intent.platform.runtime-tick.v1
      handler:
        name: NodeRetentionCleanup
        module: omnimarket.nodes.node_retention_cleanup.handlers.handler_retention_cleanup
      event_model: omnibase_infra.runtime.models.model_runtime_tick.ModelRuntimeTick
      event_type: platform.runtime-tick
      description: >
        Gate on retention_policy.schedule.run_interval_seconds elapsed since
        the last scheduled run; when due, run retention_cleanup against the
        database in retention_policy.schedule.database_url_env.

input_subscriptions:
  - topic: "onex.intent.platform.runtime-tick.v1"
    operation: "retention_cleanup.scheduled_run"
descriptor:
  node_archetype: effect
  purity: impure
  idempotent: false
  timeout_ms: 1800000
  runtime_profiles:
    - effects
terminal_event: onex.evt.omnimarket.retention-cleanup-completed.v1
event_bus:
  subscribe_topics:
    - onex.cmd.omnimarket.retention-cleanup-requested.v1
    - onex.intent.platform.runtime-tick.v1
  publish_topics:
    - onex.evt.omnimarket.retention-cleanup-completed.v1
retention_policy:
  schedule:
    run_interval_seconds: 3600
    database_url_env: OMNIDASH_ANALYTICS_DB_URL
    dry_run: false
    # A run that deletes a backlog in one go held the runtime's event loop, and
    # the container's health endpoint with it (OMN-17427). The runtime entry
    # point (handle_async) runs a run in a worker thread, and a run stops after
    # the first batch past this budget, so one run holds that thread for at most
    # one slow batch past it; the next tick resumes after backlog_retry_seconds.
    max_run_seconds: 5
    backlog_retry_seconds: 30
  targets:
    - table: agent_actions
      column: created_at
      retention_days: 30
    - table: agent_routing_decisions
      column: created_at
      retention_days: 30
    # One row per (consumer_group, topic) per 30 s window, about 1.8 million
    # rows a day on the lab dev lane. Its readers need minutes: the board's
    # live read is the last 10 minutes, the stall alert reads N trailing
    # windows, the serving exposure the newest limit * 4 rows. Seven days
    # keeps a week of history over that.
    - schema: omninode_internal
      table: consumer_flow_windows
      column: window_start
      retention_days: 7
      batch_size: 10000
      max_batches: 500
      # No index leads with window_start; the unique cursor index rises with
      # insertion, so each batch reads the oldest rows first.
      batch_order_column: projection_cursor
  # File retention (OMN-17427). Paths belong to the host the timer runs on;
  # a path that is absent there is skipped. keep_days has a floor of 7: nothing
  # modified in the last week is touched. A unit (a file, or a directory matched
  # by `pattern`) goes only when every file in it is older than keep_days.
  # `archive` compresses into <archive_root>/<host>/<name>/, reads the copy back
  # and compares checksums, and removes the local unit only then. The archive
  # tree is the directory named by archive_root_env (the Google Drive folder on
  # the host that syncs it); with none, an archive entry removes nothing.
  # Unit directories that hold a .git entry are git worktrees; onex-lane-closeout
  # owns those and retention skips them. Memory directories, symlinks and the
  # live ledger are never touched.
  #
  # Sync check: Google Drive for desktop sets the com.google.drivefs.item-id
  # extended attribute on a file once Drive has registered it. An archive copy
  # that lacks it keeps its local unit; the next run finds the verified copy,
  # reads it back again and removes the unit once the attribute is there.
  file_retention:
    archive_root_env: ONEX_RETENTION_ARCHIVE_ROOT
    synced_marker_xattr: com.google.drivefs.item-id
    entries:
      # Readers: the lane that ran the ledger verb reads the detail= path in the
      # refusal within the session. Nothing reads one later.
      - name: ledger-detail
        path: $OMNI_HOME/.claude_scratch/ledger-detail
        pattern: "*"
        keep_days: 7
        action: archive
        readers: [onex-ledger verb output, read in the same session]
        consent_ref: "OPERATOR-CONSENT 2026-10-17T00:06:56Z"
      # Readers: a ledger TERMINAL cell worktree=pinned-removed:<path>@<archive>
      # cites a pin, and a person restores from one by hand after a lane stops.
      # Two weeks covers a lane's review and re-dispatch cycle.
      - name: worktree-pins
        path: $OMNI_HOME/.onex_state/worktree-pins
        pattern: "*/*"
        keep_days: 14
        action: archive
        readers: [ledger TERMINAL worktree=pinned-removed cell, manual restore of unpushed work]
      # Readers: prune-worktrees safety checks read INDEX.tsv (kept) and a
      # snapshot is restored by hand within days of a removal.
      - name: worktree-removal-snapshots
        path: $OMNI_HOME/.onex_state/worktree-removal-snapshots
        pattern: "*"
        exclude: [INDEX.tsv]
        keep_days: 14
        action: archive
        readers: [prune-worktrees INDEX.tsv, manual restore after a removal]
      # Readers: lane_scratch.py mints unique paths under it for live lanes;
      # nothing reads a finished lane's scratch.
      - name: lane-scratch
        path: $OMNI_HOME/.onex_state/lane_scratch
        pattern: "*"
        keep_days: 14
        action: archive
        readers: [lane_scratch.py, the lane that minted the path]
      # Readers: node_lab_fill_effect reads */*.json to see running lanes and
      # node_throughput_tick_decision_compute reads receipts inside its window
      # (hours). The ledger STATUS and TERMINAL rows are the durable record.
      - name: remote-lane-receipts
        path: ~/.local/state/omni/remote-lanes
        pattern: "*/*.json"
        keep_days: 14
        action: archive
        readers: [node_lab_fill_effect, node_throughput_tick_decision_compute]
      # Launching-host run outputs live beside receipts, outside ~/lab-run/runs.
      # They are history: archive at seven days, never the receipts' plain delete.
      - name: remote-lane-outputs
        path: ~/.local/state/omni/remote-lanes
        pattern: "*/*.out"
        keep_days: 7
        action: archive
        readers: [onex-remote-lane output, operator lane history]
        consent_ref: "OPERATOR-CONSENT 2026-10-17T00:06:56Z"
      # Readers: the lane's own session while it runs; onex-lane-closeout
      # archives and removes the worktree trees (skipped here by their .git).
      - name: lab-run-lane-dirs
        path: ~/lab-run/runs
        pattern: "*"
        keep_days: 7
        action: archive
        readers: [onex-remote-lane receipt reads, the lane while it runs]
        consent_ref: "OPERATOR-CONSENT 2026-10-17T00:06:56Z"
      # Readers: node_merge_sweep_plan_compute reads the latest reports for its
      # brief; an orchestrator reads a lane report within days of its terminal.
      - name: lane-reports
        path: $OMNI_HOME/.claude_scratch/reports
        pattern: "*"
        keep_days: 14
        action: archive
        readers: [node_merge_sweep_plan_compute, orchestrator report reads]
        consent_ref: "OPERATOR-CONSENT 2026-10-17T00:06:56Z"
      # Session transcripts as *.jsonl session files only; the memory
      # directories are excluded. Readers: claude --resume reads a recent
      # session; memory and audits read history, which the archive keeps.
      - name: claude-transcripts
        path: ~/.claude/projects
        pattern: "*/*.jsonl"
        exclude: [memory]
        keep_days: 7
        action: archive
        readers: [claude --resume, memory and audit reads of history]
        consent_ref: "OPERATOR-CONSENT 2026-10-17T00:06:56Z"
      # Declared, not enabled: the consent row names Claude transcripts, not
      # Codex sessions. Enable with a consent row for them.
      - name: codex-sessions
        path: ~/.codex/sessions
        pattern: "*/*/*/*.jsonl"
        keep_days: 7
        action: archive
        enabled: false
        readers: [codex resume]

metadata:
  transport_type: kafka

runtime_dispatch:
  # OMN-18013 -- the CLI/skill dispatcher is this node's producer. Declared so it is not inferred from subscribe_topics[0].
  command_topic: onex.cmd.omnimarket.retention-cleanup-requested.v1

# OMN-18013 -- explicit SINK declaration (contract topic graph closure).
# No node contract subscribes to these; they leave the ONEX node graph here.
externally_consumed_topics:
  - onex.evt.omnimarket.retention-cleanup-completed.v1
