---

name: "node_persona_storage_effect"
contract_version: {major: 0, minor: 1, patch: 0}
node_version: {major: 0, minor: 1, patch: 0}
description: >
  EFFECT node that writes PersonaSnapshot to Postgres (append-only). Emits persona-snapshot-created event
  on successful new insert. Idempotent: duplicate (user_id, persona_version) is caught and logged. Phase
  3 Adaptive Personalization (OMN-7305).
node_type: effect
input_model: "ModelPersonaStorageRequest"
output_model: "ModelPersonaStorageResponse"
handler_routing:
  routing_strategy: operation_match
  handlers:
    - operation: persona.storage
      handler:
        name: NodePersonaStorageEffect
        module: omnimarket.nodes.node_persona_storage_effect
      event_model:
        name: ModelPersonaStorageRequest
        module: omnimarket.nodes.node_persona_storage_effect.models.model_persona_storage_request

# Retained for legacy resolution; canonical dispatch uses handler_routing above.
handler:
  module: omnimarket.nodes.node_persona_storage_effect
  class: NodePersonaStorageEffect
  input_model: omnimarket.nodes.node_persona_storage_effect.models.model_persona_storage_request.ModelPersonaStorageRequest

descriptor:
  node_archetype: effect
  purity: effectful
  runtime_profiles: [effects]

runtime_dispatch:
  invocation:
    mode: on_demand
    sender: operator via onex node node_persona_storage_effect
    reason: Outside the loaded census surface; no automatic sender verified. Explicit operator diagnostic invocation
      only.
    evidence: seam-census/2026-11-05T0716Z/outside loaded census
  command_topic: onex.cmd.omnimemory.persona-storage.v1
  terminal_events:
    success: onex.evt.omnimemory.persona-storage-completed.v1
    failure: onex.evt.omnimemory.persona-storage-failed.v1

io_operations:
  - operation_type: "database_write"
    atomic: true
    timeout_seconds: 10
    validation_enabled: true

event_bus:
  subscribe_topics:
    - "onex.cmd.omnimemory.persona-storage.v1"
  publish_topics:
    - "onex.evt.omnimemory.persona-snapshot-created.v1"
    - "onex.evt.omnimemory.persona-storage-completed.v1"
    - "onex.evt.omnimemory.persona-storage-failed.v1"

externally_consumed_topics:
  - "onex.evt.omnimemory.persona-snapshot-created.v1"
  - "onex.evt.omnimemory.persona-storage-completed.v1"
  - "onex.evt.omnimemory.persona-storage-failed.v1"

tags:
  - persona
  - effect
  - storage
  - postgres
  - phase-3

metadata:
  transport_type: kafka
