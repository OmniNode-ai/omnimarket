# Overlay of the required-and-absent topic reading (OMN-19998): <root>/node_topic_required_absent_compute/overlay.yaml
# under a root named in ONEX_SKILL_OVERLAY_ROOTS. Every key is required; the real values live in the overlays repository.
# A live topic listing with fewer topics than this is a failed read, so the reading is UNKNOWN and never WORKING or NOT_WORKING.
min_live_topics: 10
