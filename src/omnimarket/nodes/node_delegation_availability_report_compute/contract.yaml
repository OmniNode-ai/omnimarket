name: node_delegation_availability_report_compute
node_type: compute
runtime_profiles: [main]
contract_version: {major: 1, minor: 0, patch: 0}
node_version: "1.0.0"
description: >-
  OMN-18931 fixed single-attempt cohort report, separating operational
  availability from evaluated content. Retains usage provenance and source
  hashes. No dispatch, retry, grading, or I/O.
input_model:
  name: ModelDelegationAvailabilityRequest
  module: omnimarket.nodes.node_delegation_availability_report_compute.models.model_delegation_availability_request
output_model:
  name: ModelDelegationAvailabilityReport
  module: omnimarket.nodes.node_delegation_availability_report_compute.models.model_delegation_availability_report
handler:
  module: omnimarket.nodes.node_delegation_availability_report_compute.handlers.handler_delegation_availability_report
  class: HandlerDelegationAvailabilityReport
  input_model: omnimarket.nodes.node_delegation_availability_report_compute.models.model_delegation_availability_request.ModelDelegationAvailabilityRequest
  output_model: omnimarket.nodes.node_delegation_availability_report_compute.models.model_delegation_availability_report.ModelDelegationAvailabilityReport
handler_routing:
  routing_strategy: operation_match
  default_handler: omnimarket.nodes.node_delegation_availability_report_compute.handlers.handler_delegation_availability_report:HandlerDelegationAvailabilityReport
  handlers:
    - operation: report_availability
      handler:
        name: HandlerDelegationAvailabilityReport
        module: omnimarket.nodes.node_delegation_availability_report_compute.handlers.handler_delegation_availability_report
descriptor:
  node_archetype: compute
  purity: pure
  idempotent: true
  timeout_ms: 5000
inputs:
  observations:
    type: tuple
    required: true
    description: Caller-selected fixed-cohort observations, including missing terminals.
outputs:
  rows: {type: tuple}
  tiers: {type: tuple}
  excluded_requests: {type: tuple}
terminal_event: onex.evt.omnimarket.delegation-availability-reported.v1
runtime_dispatch:
  command_topic: onex.cmd.omnimarket.delegation-availability-report-requested.v1
event_bus:
  subscribe_topics:
    - onex.cmd.omnimarket.delegation-availability-report-requested.v1
  publish_topics:
    - onex.evt.omnimarket.delegation-availability-reported.v1
externally_consumed_topics:
  - onex.evt.omnimarket.delegation-availability-reported.v1
metadata:
  transport_type: inmemory
  related_tickets: [OMN-18931]
