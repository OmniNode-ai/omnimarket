# ONEX Node Contract - Secret store effect (OMN-20944)
#
# One canonical secret store adapter, as a node. The handler is vendor-neutral
# and depends only on the omnibase_spi ProtocolSecretStore seam; the store
# product is chosen by the machine's private overlay (block secret_store of
# <onex_home>/config.yaml) from the node's adapters package, the only place a
# product is named. Nothing deployment specific is in this contract.
#
# A machine whose overlay block names no store is read as the local one only by a
# caller that says so (the delegation key store does); everyone else is told
# not_configured.
#
# On the bus a request and a result never carry a value: both value fields are
# excluded from serialization. An event can resolve (proving a secret exists
# and this identity can read it), list a folder's key names, or be told
# value_missing for a create. Values move only in process.
name: node_secret_store_effect
lifecycle: experimental
contract_version: {major: 1, minor: 0, patch: 0}
node_type: effect
node_version: {major: 1, minor: 0, patch: 0}

description: >
  Secret store EFFECT. Resolves a secret by secret://onex reference or by
  folder and key, creates a secret create-only (an existing key is reported,
  never read or updated), and lists a folder's key names. The machine identity
  resolves at run time from the bootstrap secret store, the endpoint, project
  and environment from the private overlay. Every failure is a typed outcome;
  no value, digest or credential is logged, published or put in a detail.

input_model:
  name: ModelSecretStoreRequest
  module: omnimarket.models.secret_store.model_secret_store_request

output_model:
  name: ModelSecretStoreResult
  module: omnimarket.models.secret_store.model_secret_store_result

handler:
  module: omnimarket.nodes.node_secret_store_effect.handlers.handler_secret_store
  class: HandlerSecretStore
  input_model: omnimarket.models.secret_store.model_secret_store_request.ModelSecretStoreRequest
  output_model: omnimarket.models.secret_store.model_secret_store_result.ModelSecretStoreResult

handler_routing:
  routing_strategy: operation_match
  handlers:
    - operation: resolve
      handler:
        name: HandlerSecretStore
        module: omnimarket.nodes.node_secret_store_effect.handlers.handler_secret_store
      event_model:
        name: ModelSecretStoreRequest
        module: omnimarket.models.secret_store.model_secret_store_request
    - operation: create
      handler:
        name: HandlerSecretStore
        module: omnimarket.nodes.node_secret_store_effect.handlers.handler_secret_store
      event_model:
        name: ModelSecretStoreRequest
        module: omnimarket.models.secret_store.model_secret_store_request
    - operation: list
      handler:
        name: HandlerSecretStore
        module: omnimarket.nodes.node_secret_store_effect.handlers.handler_secret_store
      event_model:
        name: ModelSecretStoreRequest
        module: omnimarket.models.secret_store.model_secret_store_request
    # OMN-23695: generate a declared key inside the runtime (generated_keys below) and store it create-only; the answer never carries the value.
    - operation: generate_key
      handler:
        name: HandlerGenerateKey
        module: omnimarket.nodes.node_secret_store_effect.handlers.handler_generate_key
      event_model:
        name: ModelGenerateKeyRequest
        module: omnimarket.models.secret_store.model_generate_key_request
    # OMN-22417: a house model key (LLM_<PROVIDER>_API_KEY) is the secret of that
    # name in the house folder /shared/env. In process the result carries the
    # value to the host's harness login; on the bus it carries the outcome, the
    # secret reference and the value's length only.
    - operation: resolve_house_model_key
      handler:
        name: HandlerHouseModelKey
        module: omnimarket.nodes.node_secret_store_effect.handlers.handler_house_model_key
      event_model:
        name: ModelHouseModelKeyRequest
        module: omnimarket.models.secret_store.model_house_model_key_request

# Keys the node generates itself (OMN-23695): the value is made inside the runtime from the system's random source, stored create-only
# under `folder`/`key`, and never printed, serialized, logged or put on a command line. A request names only the id.
generated_keys:
  # (OMN-24237) the secret of the dev-only Keycloak service client node_dev_keycloak_client_effect ensures
  dev_keycloak_client_secret: {folder: /shared/env, key: KEYCLOAK_DEV_CLIENT_SECRET, bytes: 32, prefix: ""}
  # The probe tenant key scenario R8 reads (settings overlay of node_delegation_scenario_r8_effect).
  r8_probe_tenant_key: {folder: /shared/env, key: R8_PROBE_TENANT_API_KEY, bytes: 32, prefix: ""}
  # OMN-24278: the NUT monitor users' passwords (overlay nut_ups of the overlays repository reads them through node_host_installer_net_units).
  # The primary user is upsmon's login on the host that owns the UPS cable; the secondary user is the login of every host that only watches it.
  nut_primary_password: {folder: /shared/env, key: NUT_PRIMARY_PASSWORD, bytes: 24, prefix: ""}
  nut_secondary_password: {folder: /shared/env, key: NUT_SECONDARY_PASSWORD, bytes: 24, prefix: ""}
  # (OMN-24115) the dev probe user's password, read by node_dev_identity_provision_effect
  dev_probe_user_password: {folder: /shared/env, key: DEV_PROBE_USER_PASSWORD, bytes: 24, prefix: "Dp1!"}

# A reference's first segment, when it names one of these, maps through it:
# secret://onex/captured/<digest> is key CAPTURED_<digest> in folder /captured
# (relative to the overlay's root folder). Any other reference is read as
# secret://onex/<folder segments>/<key>.
reference_namespaces:
  captured:
    folder: /captured
    key_template: "CAPTURED_{name}"
  # OMN-20994: a tenant's provider key is key <ref> in the folder the lane
  # resolver reads tenant references from (OMN-16944): secret://onex/tenant/<ref>
  # is <ref> in /tenant-inference-credentials. A caller holds the reference,
  # never the folder.
  tenant:
    folder: /tenant-inference-credentials
    key_template: "{name}"
  # OMN-21921: a provider key a backend's routing declares (llm.<provider>.<name>)
  # is key <ref> in /provider-credentials: secret://onex/provider/<ref>. The
  # overlay may point a name at the path its own store keeps it under
  # (secret_store.references), so a deployment's layout is never in this contract.
  provider:
    folder: /provider-credentials
    key_template: "{name}"
    overlay_mapped: true

terminal_event: onex.evt.omnimarket.secret-store-completed.v1
published_events:
  - topic: onex.evt.omnimarket.secret-store-completed.v1
    event_type: SecretStoreResult
event_bus:
  subscribe_topics:
    - onex.cmd.omnimarket.secret-store-requested.v1
  publish_topics:
    - onex.evt.omnimarket.secret-store-completed.v1
runtime_dispatch:
  command_topic: onex.cmd.omnimarket.secret-store-requested.v1
externally_consumed_topics:
  - onex.evt.omnimarket.secret-store-completed.v1

descriptor:
  node_archetype: effect
  purity: impure
  idempotent: true
  timeout_ms: 15000
  runtime_profiles:
    - effects

metadata:
  transport_type: http
  description: "Secret store effect node"
  author: "OmniNode Team"
  tags:
    - "effect"
    - "secret-store"
  related_tickets:
    - "OMN-20944"
    - "OMN-20994"
    - "OMN-21921"
    - "OMN-22417"
    - "OMN-23695"
