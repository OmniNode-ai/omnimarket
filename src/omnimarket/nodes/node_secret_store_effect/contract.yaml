# ONEX Node Contract - Secret store effect (OMN-20944)
#
# One canonical secret store adapter, as a node. The handler is vendor-neutral
# and depends only on the omnibase_spi ProtocolSecretStore seam; the store
# product is chosen by the machine's private overlay (block secret_store of
# <onex_home>/config.yaml) from the node's adapters package, the only place a
# product is named. Nothing deployment specific is in this contract.
#
# On the bus a request and a result never carry a value: both value fields are
# excluded from serialization. An event can resolve (proving a secret exists
# and this identity can read it), list a folder's key names, or be told
# value_missing for a create. Values move only in process.
name: node_secret_store_effect
lifecycle: experimental
contract_version: {major: 1, minor: 0, patch: 0}
node_type: effect
node_version: {major: 1, minor: 0, patch: 0}

description: >
  Secret store EFFECT. Resolves a secret by secret://onex reference or by
  folder and key, creates a secret create-only (an existing key is reported,
  never read or updated), and lists a folder's key names. The machine identity
  resolves at run time from the bootstrap secret store, the endpoint, project
  and environment from the private overlay. Every failure is a typed outcome;
  no value, digest or credential is logged, published or put in a detail.

input_model:
  name: ModelSecretStoreRequest
  module: omnimarket.nodes.node_secret_store_effect.models.model_secret_store_request

output_model:
  name: ModelSecretStoreResult
  module: omnimarket.nodes.node_secret_store_effect.models.model_secret_store_result

handler:
  module: omnimarket.nodes.node_secret_store_effect.handlers.handler_secret_store
  class: HandlerSecretStore
  input_model: omnimarket.nodes.node_secret_store_effect.models.model_secret_store_request.ModelSecretStoreRequest
  output_model: omnimarket.nodes.node_secret_store_effect.models.model_secret_store_result.ModelSecretStoreResult

handler_routing:
  routing_strategy: operation_match
  handlers:
    - operation: resolve
      handler:
        name: HandlerSecretStore
        module: omnimarket.nodes.node_secret_store_effect.handlers.handler_secret_store
      event_model:
        name: ModelSecretStoreRequest
        module: omnimarket.nodes.node_secret_store_effect.models.model_secret_store_request
    - operation: create
      handler:
        name: HandlerSecretStore
        module: omnimarket.nodes.node_secret_store_effect.handlers.handler_secret_store
      event_model:
        name: ModelSecretStoreRequest
        module: omnimarket.nodes.node_secret_store_effect.models.model_secret_store_request
    - operation: list
      handler:
        name: HandlerSecretStore
        module: omnimarket.nodes.node_secret_store_effect.handlers.handler_secret_store
      event_model:
        name: ModelSecretStoreRequest
        module: omnimarket.nodes.node_secret_store_effect.models.model_secret_store_request

# A reference's first segment, when it names one of these, maps through it:
# secret://onex/captured/<digest> is key CAPTURED_<digest> in folder /captured
# (relative to the overlay's root folder). Any other reference is read as
# secret://onex/<folder segments>/<key>.
reference_namespaces:
  captured:
    folder: /captured
    key_template: "CAPTURED_{name}"

terminal_event: onex.evt.omnimarket.secret-store-completed.v1
published_events:
  - topic: onex.evt.omnimarket.secret-store-completed.v1
    event_type: SecretStoreResult
event_bus:
  subscribe_topics:
    - onex.cmd.omnimarket.secret-store-requested.v1
  publish_topics:
    - onex.evt.omnimarket.secret-store-completed.v1
runtime_dispatch:
  command_topic: onex.cmd.omnimarket.secret-store-requested.v1
externally_consumed_topics:
  - onex.evt.omnimarket.secret-store-completed.v1

descriptor:
  node_archetype: effect
  purity: impure
  idempotent: true
  timeout_ms: 15000
  runtime_profiles:
    - effects

metadata:
  transport_type: http
  description: "Secret store effect node"
  author: "OmniNode Team"
  tags:
    - "effect"
    - "secret-store"
  related_tickets:
    - "OMN-20944"
