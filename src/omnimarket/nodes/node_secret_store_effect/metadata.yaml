name: node_secret_store_effect
version: "1.0.0"
description: "Resolves a secret by reference or folder and key, creates one create-only, and lists a folder's key names, through the secret store the private overlay names; never logs or publishes a value"
omnibase_core_compat: ">=0.39.0,<1.0.0"
entry_points:
  onex.nodes:
    node_secret_store_effect: "omnimarket.nodes.node_secret_store_effect"
capabilities:
  standalone: true
  full_runtime: true
  requires_network: true
  requires_repo: false
  requires_secrets: true
  requires_docker: false
  side_effect_class: write
dependencies:
  - "omnibase_core>=0.39.0"
  - "omnibase-spi>=0.20.0"
  - "omnibase-infra>=0.38.3,<0.39.0"
  - "httpx>=0.27.0"
  - "pydantic>=2.11.0"
  - "pyyaml>=6.0"
authors: ["OmniNode Platform Team"]
license: "MIT"
tags: ["effect", "secret-store"]
pack: "platform"
display_name: "Secret Store Effect"
node_role: "effect"
