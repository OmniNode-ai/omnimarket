name: node_merge_sweep_orchestrator
version: "0.1.0"
description: "Orchestrator: one whole merge sweep - load the fleet's facts, read them, plan the lanes, then brief, start and retry each lane, by the sibling merge-sweep nodes' operations. Hosted by the serve process that hosts node_merge_sweep_effect, never by a shared runtime."
pack: operator_tooling
node_role: orchestrator
display_name: "Merge Sweep Orchestrator"
omnibase_core_compat: ">=0.47.31,<0.48.0"
entry_points:
  onex.nodes:
    node_merge_sweep_orchestrator: "omnimarket.nodes.node_merge_sweep_orchestrator"
capabilities:
  standalone: false
  full_runtime: false
  requires_network: false
  requires_repo: false
  requires_secrets: false
  requires_docker: false
  side_effect_class: write
dependencies:
- PyYAML>=6.0.3
- pydantic>=2.0
license: "MIT"
authors: ["OmniNode Team"]
tags: ["orchestrator", "lab", "merge-sweep"]
