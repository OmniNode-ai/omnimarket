# ONEX Node Contract - Merge Sweep Orchestrator (OMN-20676)
#
# One whole merge sweep as a chain of the sibling nodes' operations. The decisions (the reading, the
# lane plan, the dispatch cap, each lane's brief, the retry of a lane) are
# node_merge_sweep_reading_compute's and node_merge_sweep_plan_compute's; the I/O (the facts from the
# PR watcher state, starting a lane through the remote-lane runner) is node_merge_sweep_effect's. This
# node wires them in the order of workflow_coordination below and holds none of their logic.
#
# WHO HOSTS THIS NODE. The same serve process that hosts node_merge_sweep_effect: the host that holds
# the PR watcher's state, the ledger copy, the controller's tick log and the remote-lane runner.
# Shared runtimes must NOT attach it. The contract declares runtime_dispatch and NO event_bus block,
# as node_merge_sweep_effect does.
#
# OVERLAY. No project, operator, host path, ticket, model or lane name lives in this node: they
# arrive on the request, read by the caller from its overlay.
name: node_merge_sweep_orchestrator
contract_version:
  major: 1
  minor: 0
  patch: 0
node_type: orchestrator
node_version:
  major: 1
  minor: 0
  patch: 0
lifecycle: experimental
description: >
  Run one merge sweep: load the fleet's facts from the PR watcher state, read them, plan the lanes
  (capped), then for each lane render its brief, start it through the remote-lane runner and
  retry it as the plan node decides (wait on no host, retry once on another host when the account
  is limited or its login expired). Returns the plan, what was skipped or deferred, the facts it
  could not read, and each lane's final receipt.
input_model:
  name: ModelMergeSweepRunRequest
  module: omnimarket.nodes.node_merge_sweep_orchestrator.models.model_merge_sweep_run
  description: Where the sweep's facts are, how its lanes are started, and its limits.
output_model:
  name: ModelMergeSweepRunResult
  module: omnimarket.nodes.node_merge_sweep_orchestrator.models.model_merge_sweep_run
  description: The sweep's plan, its unread facts and each dispatched lane's final receipt.
handler:
  module: omnimarket.nodes.node_merge_sweep_orchestrator.handlers.handler_merge_sweep_run
  class: HandlerMergeSweepRun
  input_model: omnimarket.nodes.node_merge_sweep_orchestrator.models.model_merge_sweep_run.ModelMergeSweepRunRequest
handler_routing:
  routing_strategy: operation_match
  default_handler: omnimarket.nodes.node_merge_sweep_orchestrator.handlers.handler_merge_sweep_run:HandlerMergeSweepRun
  handlers:
  - operation: run_merge_sweep
    handler:
      name: HandlerMergeSweepRun
      module: omnimarket.nodes.node_merge_sweep_orchestrator.handlers.handler_merge_sweep_run
    input_model: omnimarket.nodes.node_merge_sweep_orchestrator.models.model_merge_sweep_run.ModelMergeSweepRunRequest
    output_model: omnimarket.nodes.node_merge_sweep_orchestrator.models.model_merge_sweep_run.ModelMergeSweepRunResult
workflow_coordination:
  workflow_definition:
    workflow_metadata:
      workflow_name: merge_sweep
      workflow_version:
        major: 1
        minor: 0
        patch: 0
      description: Load, read, plan, then brief, start and retry each planned lane.
    execution_graph:
      nodes:
      - node_id: load_facts
        node_type: EFFECT_GENERIC
        description: Gather the facts of one reading from the watcher state, the ledger and the tick log.
        step_config:
          node: node_merge_sweep_effect
          operation: load_merge_sweep_facts
      - node_id: read_fleet
        node_type: COMPUTE_GENERIC
        description: Evaluate the product merges, the controller stall, the owners, the red classes and the chain heads.
        depends_on: [load_facts]
        step_config:
          node: node_merge_sweep_reading_compute
          operation: read_merge_sweep_state
      - node_id: plan_lanes
        node_type: COMPUTE_GENERIC
        description: Plan the lanes and cap the dispatch.
        depends_on: [read_fleet]
        step_config:
          node: node_merge_sweep_plan_compute
          operation: plan_merge_sweep_lanes
      - node_id: render_brief
        node_type: COMPUTE_GENERIC
        description: Render the brief of one planned lane.
        depends_on: [plan_lanes]
        step_config:
          node: node_merge_sweep_plan_compute
          operation: render_merge_sweep_lane_brief
          for_each: dispatch
      - node_id: run_lane
        node_type: EFFECT_GENERIC
        description: Start one lane through the remote-lane runner and wait for its receipt.
        depends_on: [render_brief]
        step_config:
          node: node_merge_sweep_effect
          operation: run_merge_sweep_lane
          for_each: dispatch
      - node_id: decide_retry
        node_type: COMPUTE_GENERIC
        description: Decide from the receipt's exit code whether to accept, wait and retry, or retry on another host.
        depends_on: [run_lane]
        step_config:
          node: node_merge_sweep_plan_compute
          operation: decide_merge_sweep_lane_retry
          for_each: dispatch
          loops_to: render_brief
    coordination_rules:
      execution_mode: sequential
      parallel_execution_allowed: false
      failure_recovery_strategy: fail_fast
      recovery_enabled: false
descriptor:
  node_archetype: orchestrator
  purity: impure
  idempotent: false
  timeout_ms: 25000000
  runtime_profiles: [effects]
runtime_dispatch:
  command_topic: onex.cmd.omnimarket.merge-sweep-run-requested.v1
  terminal_events:
    success: onex.evt.omnimarket.merge-sweep-run-completed.v1
    failure: onex.evt.omnimarket.merge-sweep-run-failed.v1
terminal_event: onex.evt.omnimarket.merge-sweep-run-completed.v1
published_events:
- event_type: ModelMergeSweepRunResult
  topic: onex.evt.omnimarket.merge-sweep-run-completed.v1
  description: The outcome of one merge sweep, answered whatever happened to a lane.
externally_consumed_topics:
- onex.evt.omnimarket.merge-sweep-run-completed.v1
- onex.evt.omnimarket.merge-sweep-run-failed.v1
metadata:
  ticket: OMN-20676
  transport_type: kafka
  description: "Merge sweep: load, read, plan, brief, dispatch and retry in one request"
  author: OmniNode Team
  tags: [orchestrator, lab, merge-sweep, OMN-20676]
