<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lean Factory Floor</title>
<link rel="icon" href="data:,">
<style>
/* One page, a tab bar across the top. The first tab is a dashboard drawn from the same files the other tabs read:
   each assembly line with its stop reason, each machine with its lanes, today's merges and reds, and how old every
   source is. The other four tabs draw their own page inside this one. */
:root{
  --floor:#eceee9; --panel:#fbfbf8; --ink:#1c2320; --muted:#5b6660; --rule:#cdd3cc;
  --steel:#4b5c68; --car:#3d6f8f; --car-edge:#24475d;
  --safety:#d9a300; --safety-soft:#f6e6ae;
  --ok:#2e8649; --warn:#bf7400; --stop:#c3352b; --stop-soft:#f3d2ce; --idle:#b4bdb6;
  --belt:#3a403d;
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --floor:#161a18; --panel:#202623; --ink:#e7ebe7; --muted:#9ba69f; --rule:#343d39;
  --steel:#90a4b3; --car:#5f9cc4; --car-edge:#9cc7e3;
  --safety:#f0c232; --safety-soft:#4a3f17;
  --ok:#5ac277; --warn:#e8a43a; --stop:#ef5b4f; --stop-soft:#4a2421; --idle:#4a554f;
  --belt:#0f1211; color-scheme:dark}}
:root[data-theme="dark"]{
  --floor:#161a18; --panel:#202623; --ink:#e7ebe7; --muted:#9ba69f; --rule:#343d39;
  --steel:#90a4b3; --car:#5f9cc4; --car-edge:#9cc7e3;
  --safety:#f0c232; --safety-soft:#4a3f17;
  --ok:#5ac277; --warn:#e8a43a; --stop:#ef5b4f; --stop-soft:#4a2421; --idle:#4a554f;
  --belt:#0f1211; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--floor);color:var(--ink);font:15px/1.5 var(--f-body);overflow:hidden}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:.01em;text-transform:uppercase}
h2{font-size:1.45rem;font-weight:800;line-height:1}
h3{font-size:1.05rem;font-weight:600;letter-spacing:.03em}
p{margin:0}
a{color:var(--car-edge)}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--safety);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.unread{color:var(--muted);font-style:italic}
.age-stale{color:var(--stop);font-weight:600}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* frame: the title and tab bar stay put, the chosen tab scrolls */
.app{height:100vh;height:100dvh;display:flex;flex-direction:column;min-width:0}
.top{flex:none;background:var(--panel);border-bottom:1px solid var(--rule);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hazard{height:8px;margin:0 -16px;background:repeating-linear-gradient(-45deg,var(--safety) 0 12px,var(--belt) 12px 24px)}
.titlerow{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:2px 20px;padding:10px 0 4px;min-width:0}
h1{font-size:1.7rem;font-weight:800;line-height:1;text-transform:uppercase}
#stamp{font:500 .74rem/1.4 var(--f-mono);color:var(--muted);min-width:0}
.banner{background:var(--stop-soft);border:1px solid var(--stop);border-radius:4px;padding:8px 12px;margin:6px 0 2px;font-size:.88rem}
.banner[hidden]{display:none}

/* tab bar */
.tabs{display:flex;gap:4px;margin:6px 0 0;min-width:0}
.tab{flex:1 1 0;min-width:0;appearance:none;background:transparent;border:1px solid transparent;border-bottom:0;border-radius:6px 6px 0 0;
  color:var(--muted);font:inherit;text-align:left;cursor:pointer;padding:8px 12px 9px;display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:9px;align-items:center}
.tab:hover{color:var(--ink);background:color-mix(in srgb,var(--safety) 10%,transparent)}
.tab[aria-selected="true"]{background:var(--floor);border-color:var(--rule);color:var(--ink);box-shadow:inset 0 4px 0 var(--safety);padding-top:11px;margin-bottom:-1px}
.tab i{grid-row:span 2;width:12px;height:12px;border-radius:50%;background:var(--c,var(--idle));box-shadow:0 0 0 3px color-mix(in srgb,var(--c,var(--idle)) 25%,transparent)}
.tab i.c-stop{animation:blink 1.1s steps(2,jump-none) infinite}
.tab i.c-none{background:transparent;box-shadow:none;border:1.5px dashed var(--idle)}
@keyframes blink{50%{opacity:.3}}
.tab b{font:600 1.05rem/1.1 var(--f-display);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab small{font-size:.72rem;line-height:1.3;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab .short{display:none}
.c-ok{--c:var(--ok)} .c-warn{--c:var(--warn)} .c-stop{--c:var(--stop)} .c-idle{--c:var(--idle)}

main{flex:1 1 auto;min-height:0;position:relative}
.pane{position:absolute;inset:0;overflow:auto;overscroll-behavior:contain}
.pane[hidden]{display:none}
.pane iframe{display:block;width:100%;height:100%;border:0;background:var(--floor)}

/* dashboard */
.dash{max-width:1500px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-right,0px)) 56px max(16px,env(safe-area-inset-left,0px));display:grid;gap:22px;min-width:0}
.board{display:flex;flex-wrap:wrap;gap:2px;background:var(--belt);border-radius:6px;overflow:hidden}
.lamp{flex:1 1 210px;background:var(--panel);padding:12px 16px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 12px;align-items:center;min-width:0}
.lamp i{width:16px;height:16px;border-radius:50%;grid-row:span 2;background:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 25%,transparent)}
.lamp.c-stop i{animation:blink 1.1s steps(2,jump-none) infinite}
.lamp b{font:800 1.5rem/1.05 var(--f-display);letter-spacing:.02em;text-transform:uppercase}
.lamp b small{font:600 .85rem/1 var(--f-display);letter-spacing:.05em;color:var(--muted);margin-left:6px}
.lamp span{font-size:.8rem;color:var(--muted);line-height:1.35;overflow-wrap:anywhere}

.cols{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:22px;align-items:start}
@media (max-width:1060px){.cols{grid-template-columns:minmax(0,1fr)}}
.stack{display:grid;gap:22px;min-width:0;align-content:start}
.sec{display:grid;gap:12px;min-width:0;align-content:start}
.sec>header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:2px 14px}
.sec>header p{font-size:.8rem;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--rule);border-radius:6px;padding:14px 16px;display:grid;gap:10px;min-width:0;align-content:start}
.card.ghost{border-style:dashed;background:repeating-linear-gradient(45deg,transparent 0 6px,color-mix(in srgb,var(--idle) 35%,transparent) 6px 7px),var(--panel)}
.card.stopped{border-color:var(--stop);box-shadow:inset 4px 0 0 var(--stop)}

/* assembly lines */
.line-top{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.sign{font:800 .8rem/1 var(--f-display);letter-spacing:.16em;text-transform:uppercase;background:var(--belt);color:var(--safety);padding:6px 9px;border-radius:2px}
.pill{display:inline-flex;align-items:center;font:500 .72rem/1 var(--f-mono);letter-spacing:.06em;padding:4px 7px;border-radius:3px;border:1px solid currentColor;white-space:nowrap}
.pill.stop{color:var(--stop)} .pill.done,.pill.ok{color:var(--ok)} .pill.active,.pill.warn{color:var(--warn)} .pill.wait,.pill.idle{color:var(--muted)}
.pill.right{margin-left:auto}
.line-name{font-size:.95rem;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.belt{position:relative;padding-top:20px}
.cells{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:1px;height:14px;background:var(--belt);padding:2px;border-radius:2px}
.cells b{display:block;border-radius:1px;background:transparent;box-shadow:inset 0 0 0 1px var(--idle)}
.cells b.done{background:var(--car);box-shadow:none}
.cells b.active{background:var(--safety);box-shadow:none}
.cells b.prep{background:repeating-linear-gradient(45deg,transparent 0 2px,var(--steel) 2px 3px);box-shadow:inset 0 0 0 1px var(--steel)}
.cells b.stop{background:var(--stop);box-shadow:none}
.car{position:absolute;top:0;left:var(--pos);width:38px;height:17px;transform:translateX(-50%)}
.cause{border-left:3px solid var(--stop);background:var(--stop-soft);padding:6px 10px;border-radius:0 3px 3px 0;font-size:.86rem;display:grid;gap:3px;overflow-wrap:anywhere}
.cause b{font:600 .72rem/1 var(--f-mono);letter-spacing:.06em;color:var(--stop)}
.cause.nocause{border-left-color:var(--idle);background:transparent;border:1px dashed var(--idle);border-left-width:3px;color:var(--muted)}
.facts{font-size:.8rem;color:var(--muted)}
.go{font-size:.8rem}

/* machines */
.bays{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px}
.bay{background:var(--panel);border:1px solid var(--rule);border-radius:6px;padding:12px 14px;display:grid;gap:9px;align-content:start;min-width:0}
.bay.repair{border-style:dashed}
.bay.unreadbay{border-style:dashed;background:repeating-linear-gradient(45deg,transparent 0 6px,color-mix(in srgb,var(--idle) 30%,transparent) 6px 7px),var(--panel)}
.bay-top{display:flex;gap:8px;justify-content:space-between;align-items:baseline;flex-wrap:wrap}
.bay-top b{font:800 1.25rem/1 var(--f-display);text-transform:uppercase;letter-spacing:.02em;overflow-wrap:anywhere}
.slots{display:flex;flex-wrap:wrap;gap:3px}
.slots i{width:14px;height:10px;border-radius:2px;border:1.5px solid var(--idle);background:transparent}
.slots i.used{background:var(--car);border-color:var(--car-edge)}
.slots i.codex{background:var(--steel);border-color:var(--steel)}
.slots i.stall{background:var(--stop);border-color:var(--stop)}
.slots i.over{background:var(--warn);border-color:var(--warn)}
.capline{font-size:.78rem;color:var(--muted);overflow-wrap:anywhere}
.gauges{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px}
.gauge{display:grid;gap:3px;font-size:.76rem;color:var(--muted);min-width:0}
.gauge .v{font:500 .78rem/1.2 var(--f-mono);color:var(--ink)}
.gbar{height:5px;background:var(--rule);border-radius:3px;overflow:hidden}
.gbar b{display:block;height:100%;width:var(--w);background:var(--car)}
.gbar.hot b{background:var(--stop)}
.lrows{display:grid;gap:0;margin:0 -14px -12px;border-top:1px solid var(--rule)}
.lrow{display:grid;gap:3px;padding:8px 14px;text-decoration:none;color:inherit;border-bottom:1px dashed var(--rule)}
.lrow:last-child{border-bottom:0}
.lrow:hover{background:color-mix(in srgb,var(--safety) 10%,transparent)}
.lrow .tk{font:500 .7rem/1.3 var(--f-mono);color:var(--muted);overflow-wrap:anywhere}
.lrow .doing{font-size:.82rem;line-height:1.35;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.lrow .side{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px}
.chip{font:500 .66rem/1 var(--f-mono);padding:3px 5px;border-radius:3px;border:1px solid var(--rule);white-space:nowrap;color:var(--muted)}
.chip.red{color:var(--stop);border-color:var(--stop)} .chip.green{color:var(--ok);border-color:var(--ok)}
.chip.pending{color:var(--warn);border-color:var(--warn)} .chip.stall{color:var(--stop);border-color:var(--stop);font-weight:600}
.lrow .when{font:500 .66rem/1 var(--f-mono);color:var(--muted);margin-left:auto}
details.more{font-size:.82rem}
details.more>summary{cursor:pointer;color:var(--muted);padding:4px 0}
details.fold{grid-column:1/-1;background:var(--panel);border:1px solid var(--rule);border-radius:6px}
details.fold>summary{cursor:pointer;padding:10px 14px;font-size:.86rem;color:var(--muted)}
details.fold[open]>summary{border-bottom:1px solid var(--rule)}
details.fold .lrows{margin:0;border-top:0}
.lamp-stop{border-left:3px solid var(--stop);background:var(--stop-soft);padding:6px 10px;border-radius:0 3px 3px 0;font-size:.84rem}
ul.plain{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:.82rem}
ul.plain li{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 10px}

/* today */
.pair{display:grid;grid-template-columns:1fr 1fr;gap:2px;background:var(--belt);border-radius:6px;overflow:hidden}
.pair>div{background:var(--panel);padding:12px 14px;display:grid;gap:2px;align-content:start;min-width:0}
.pair b{font:800 2.4rem/1 var(--f-display)}
.pair b.unread{font:italic 400 1rem/1.4 var(--f-body)}
.pair span{font-size:.8rem;color:var(--muted)}
.pair .bad b{color:var(--stop)}
.lst{list-style:none;margin:0;padding:0;display:grid}
.lst li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:1px 12px;padding:6px 0;border-bottom:1px dashed var(--rule);font-size:.84rem}
.lst li:last-child{border-bottom:0}
.lst li span:first-child{min-width:0;overflow-wrap:anywhere}
.lst li small{color:var(--muted);font:500 .7rem/1.4 var(--f-mono);overflow-wrap:anywhere;text-align:right;max-width:16em}
.lst a{color:inherit;text-decoration:none}
.lst a:hover{text-decoration:underline}
.sub{font:600 .78rem/1 var(--f-mono);letter-spacing:.04em;color:var(--steel);margin-top:2px}

/* freshness */
.fresh{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:8px}
.src{background:var(--panel);border:1px solid var(--rule);border-left:4px solid var(--c,var(--ok));border-radius:4px;padding:8px 10px;display:grid;gap:2px;min-width:0}
.src.c-idle{border-left-style:dashed;background:repeating-linear-gradient(45deg,transparent 0 6px,color-mix(in srgb,var(--idle) 30%,transparent) 6px 7px),var(--panel)}
.src b{font-size:.8rem;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.src span{font:500 .78rem/1.3 var(--f-mono);overflow-wrap:anywhere}
.src small{font-size:.72rem;color:var(--muted);line-height:1.3;overflow-wrap:anywhere}
.fgroup{font:600 .78rem/1 var(--f-mono);letter-spacing:.04em;color:var(--steel);margin:6px 0 -2px;grid-column:1/-1}
.fgroup:first-child{margin-top:0}

footer.note{font-size:.78rem;color:var(--muted);max-width:90ch}

/* phone: five short tabs in one row, one column of content, nothing wider than the screen */
@media (max-width:700px){
  h1{font-size:1.35rem}
  .titlerow{padding-top:8px}
  #stamp{font-size:.68rem}
  .tabs{gap:2px;margin-top:4px}
  .tab{display:block;text-align:center;padding:7px 2px 8px}
  .tab[aria-selected="true"]{padding-top:10px}
  .tab i{display:inline-block;width:9px;height:9px;margin:0 auto 3px;box-shadow:none}
  .tab i{display:block}
  .tab b{font-size:.78rem;letter-spacing:0;text-overflow:clip}
  .tab small{display:none}
  .tab .long{display:none}
  .tab .short{display:inline}
  .dash{padding-top:12px;gap:18px}
  .lamp{flex-basis:calc(50% - 2px);padding:10px 12px;grid-template-columns:minmax(0,1fr);gap:2px}
  .lamp i{grid-row:auto;width:10px;height:10px}
  .lamp:last-child{flex-basis:100%}
  .lamp b{font-size:1.2rem}
  .lamp b small{display:block;margin:2px 0 0;font-size:.72rem}
  .lamp span{font-size:.74rem}
  .pair b{font-size:2rem}
  .lst li{grid-template-columns:minmax(0,1fr)}
  .lst li small{text-align:left;max-width:none}
  .gauges{grid-template-columns:1fr 1fr}
}
@media (prefers-reduced-motion:reduce){.tab i.c-stop,.lamp.c-stop i{animation:none}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="hazard" aria-hidden="true"></div>
    <div class="titlerow">
      <h1>Lean Factory Floor</h1>
      <div id="stamp" role="status">Reading the factory record</div>
    </div>
    <div class="banner" id="banner" role="alert" hidden></div>
    <div class="tabs" role="tablist" aria-label="Factory views" id="tabs"></div>
  </div>
  <main>
    <section class="pane" id="pane-dashboard" role="tabpanel" aria-labelledby="tab-dashboard" tabindex="-1">
      <div class="dash" id="dash"><p class="muted">Reading the factory record.</p></div>
    </section>
    <section class="pane" id="pane-floor" role="tabpanel" aria-labelledby="tab-floor" hidden></section>
    <section class="pane" id="pane-process" role="tabpanel" aria-labelledby="tab-process" hidden></section>
    <section class="pane" id="pane-map" role="tabpanel" aria-labelledby="tab-map" hidden></section>
    <section class="pane" id="pane-quality" role="tabpanel" aria-labelledby="tab-quality" hidden></section>
  </main>
</div>

<script>
const SITE = "";
const DATA_FILE = "factory-floor.json";
const STATUS_FILE = "publish-status.json";
const HEALTH_FILE = "process-health.json";
const REPORTS_FILE = "reports/manifest.json";
const DELEGATION_FILE = "delegation.json";
const POLL_MS = 60000;
const STALE_MIN = 90;
const STORE_KEY = "factory-floor.tab";
const LETTERS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

// The tabs, in order. A tab with a page draws that page inside this one the first time it is chosen and keeps it.
const TABS = [
  {id: "dashboard", label: "Dashboard", short: "Dashboard"},
  {id: "floor", label: "Factory floor", short: "Floor", page: "floor/?embed=1", report: "factory_floor"},
  {id: "process", label: "Process before and after", short: "Process", page: "reports/process-health/?embed=1", report: "process_health"},
  {id: "map", label: "Decision map", short: "Map", page: "reports/decision-map/?embed=1", report: "decision_map"},
  {id: "quality", label: "Decision quality", short: "Quality", page: "reports/decision-quality/?embed=1", report: "decision_quality"}
];
const TAB_IDS = TABS.map(t => t.id);

const esc = s => String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const safeId = s => String(s).replace(/[^A-Za-z0-9_-]/g,"_");
const el = id => document.getElementById(id);
const num = (v, d = 0) => Number.isFinite(Number(v)) && v !== null && v !== "" ? Number(v) : d;
const fmt = v => Number(v).toLocaleString("en-US", {maximumFractionDigits: 1});
const plural = (n, one, many) => `${fmt(n)} ${n === 1 ? one : many}`;

function ageText(ms){
  const m = Math.max(0, Math.round(ms / 60000));
  return m < 1 ? "under a minute" : m < 120 ? `${m} min` : m < 2880 ? `${(m / 60).toFixed(1)} h` : `${(m / 1440).toFixed(1)} days`;
}
function ageMs(iso){
  const t = Date.parse(iso);
  return Number.isNaN(t) ? null : Date.now() - t;
}
function sinceText(iso){ const ms = ageMs(iso); return ms == null ? "unread" : ageText(ms); }
// Every time is drawn in the viewer's zone with the zone named; the record keeps UTC instants.
const TIME_LOCALE = "en-US";
const TIME_FMT = new Intl.DateTimeFormat(TIME_LOCALE, {month: "short", day: "numeric", hour: "numeric", minute: "2-digit", timeZoneName: "short"});
const DAY_FMT = new Intl.DateTimeFormat(TIME_LOCALE, {year: "numeric", month: "2-digit", day: "2-digit"});
function clock(iso){ const t = Date.parse(/T[\d:.]+$/.test(String(iso)) ? iso + "Z" : iso); return Number.isNaN(t) ? "" : TIME_FMT.format(new Date(t)); }
function localDay(ms){ const p = Object.fromEntries(DAY_FMT.formatToParts(new Date(ms)).map(x => [x.type, x.value])); return `${p.year}-${p.month}-${p.day}`; }
// Minute counts in the record were measured when it was computed; this adds the time since, so they read against the real clock.
let recordAt = NaN;
function sinceRecord(){ return Number.isNaN(recordAt) ? 0 : Math.max(0, Date.now() - recordAt); }
function liveMs(min){ return num(min) * 60000 + sinceRecord(); }

// ---- Tabs: the hash names the tab (and, for the floor, a place on it); the last tab is kept per browser.
function remembered(){
  try { const v = localStorage.getItem(STORE_KEY); return TAB_IDS.includes(v) ? v : ""; } catch (e) { return ""; }
}
function remember(id){
  try { localStorage.setItem(STORE_KEY, id); } catch (e) { /* private window or blocked storage: the hash still works */ }
}
function parseHash(){
  const raw = decodeURIComponent((location.hash || "").replace(/^#/, ""));
  const [tab, ...rest] = raw.split("/");
  return {tab: TAB_IDS.includes(tab) ? tab : "", anchor: rest.join("/")};
}

let currentTab = "";
const frames = {};

function buildTabs(){
  el("tabs").innerHTML = TABS.map((t, i) => `<button type="button" class="tab" role="tab" id="tab-${t.id}" data-tab="${t.id}" aria-controls="pane-${t.id}" aria-selected="false" tabindex="-1" title="${esc(t.label)}">
    <i class="c-none" id="lamp-${t.id}"></i><b><span class="long">${esc(t.label)}</span><span class="short">${esc(t.short)}</span></b><small id="sub-${t.id}">reading</small></button>`).join("");
  el("tabs").addEventListener("click", ev => {
    const b = ev.target.closest ? ev.target.closest(".tab") : null;
    if (b) go(b.dataset.tab);
  });
  el("tabs").addEventListener("keydown", ev => {
    const i = TAB_IDS.indexOf(currentTab);
    const to = ev.key === "ArrowRight" ? (i + 1) % TABS.length : ev.key === "ArrowLeft" ? (i + TABS.length - 1) % TABS.length : ev.key === "Home" ? 0 : ev.key === "End" ? TABS.length - 1 : -1;
    if (to < 0) return;
    ev.preventDefault();
    go(TAB_IDS[to]);
    el("tab-" + TAB_IDS[to]).focus();
  });
}

function go(id, anchor){
  const next = "#" + id + (anchor ? "/" + anchor : "");
  if (location.hash === next) { show(id, anchor); return; }
  location.hash = next;
}

function show(id, anchor){
  if (!TAB_IDS.includes(id)) id = "dashboard";
  currentTab = id;
  remember(id);
  TABS.forEach(t => {
    const sel = t.id === id;
    const b = el("tab-" + t.id);
    b.setAttribute("aria-selected", String(sel));
    b.tabIndex = sel ? 0 : -1;
    el("pane-" + t.id).hidden = !sel;
  });
  const tab = TABS.find(t => t.id === id);
  document.title = (id === "dashboard" ? "" : tab.label + " · ") + "Lean Factory Floor";
  if (tab.page && !frames[id]){
    const f = document.createElement("iframe");
    f.title = tab.label;
    f.setAttribute("referrerpolicy", "no-referrer");
    f.src = tab.page;
    frames[id] = f;
    el("pane-" + id).appendChild(f);
  }
  if (anchor && frames[id]) jumpIn(frames[id], anchor);
}

// Move to a place on a tab's page once it has drawn it (the floor page draws after it reads the record).
function jumpIn(frame, anchor){
  let tries = 0;
  const timer = setInterval(() => {
    tries++;
    let target = null;
    try { target = frame.contentDocument && frame.contentDocument.getElementById(anchor); } catch (e) { target = null; }
    if (target){
      clearInterval(timer);
      if (target.tagName === "DETAILS") target.open = true;
      target.scrollIntoView({block: "center", inline: "nearest"});
      target.classList.remove("flash");
      void target.offsetWidth;
      target.classList.add("flash");
    } else if (tries > 40) clearInterval(timer);
  }, 250);
}

window.addEventListener("hashchange", () => { const h = parseHash(); if (h.tab) show(h.tab, h.anchor); });

// ---- Lines, as the floor page reads them: the overlay-declared order, a slot for a line no plan matched.
function buildSlots(lines, status){
  const decl = status && status.lines_declared;
  if (!decl || decl.state !== "read" || !Array.isArray(decl.plan_path_contains)){
    return {declared: false, reason: decl && decl.reason ? decl.reason : "the publish status carries no declaration", slots: lines.map(line => ({line, fragment: ""}))};
  }
  const used = new Set();
  const slots = decl.plan_path_contains.map(fragment => {
    const line = lines.find(x => !used.has(x) && String(x.plan_path).includes(fragment)) || null;
    if (line) used.add(line);
    return {line, fragment};
  });
  lines.forEach(line => { if (!used.has(line)) slots.push({line, fragment: ""}); });
  return {declared: true, reason: "", slots};
}

function lineFacts(L){
  const stations = L.stations || [];
  const n = stations.length;
  let cur = stations.findIndex(s => s.state === "active" || s.state === "stop");
  if (cur < 0) cur = n && stations.every(s => s.state === "done") ? n - 1 : 0;
  const items = stations.flatMap(s => s.items || []);
  return {stations, n, cur, items, done: items.filter(i => i.state === "done").length,
    active: items.filter(i => i.state === "active").length,
    stopped: L.status_pill === "stopped" || !!(L.andon && L.andon.flag)};
}

const CAR = `<svg class="car" viewBox="0 0 64 28" aria-hidden="true"><path d="M2 20 L2 14 Q3 11 7 11 L19 10 L26 4 Q28 2 31 2 L45 2 Q48 2 50 5 L55 11 L60 12 Q62 13 62 16 L62 20 Z" style="fill:var(--c);stroke:var(--belt)" stroke-width="2"/><circle cx="17" cy="22" r="5" style="fill:var(--belt)"/><circle cx="48" cy="22" r="5" style="fill:var(--belt)"/></svg>`;

function lineCard(slot, i){
  const letter = "Line " + (LETTERS[i] || i + 1);
  if (!slot.line){
    return `<article class="card ghost" aria-label="${esc(letter)}, not in the record">
      <div class="line-top"><span class="sign">${esc(letter)}</span><span class="pill idle">not in the record</span></div>
      <p class="line-name unread">No plan matched “${esc(slot.fragment)}”</p>
      <p class="facts">The deployment declares this line, but no plan in the plans repository matches it, so there are no parts, no percent and no stop reason to show.</p>
    </article>`;
  }
  const L = slot.line, f = lineFacts(L);
  const pill = f.stopped ? ["stop", "Stopped"] : L.status_pill === "done" ? ["done", "Done"] : L.status_pill === "building" ? ["active", "Building"] : ["wait", "Queued"];
  const cells = f.items.length ? f.items : f.stations;
  const pct = Math.max(0, Math.min(100, num(L.percent_built)));
  const reason = ((L.andon && L.andon.reason) || "").replace(/[:\s]+$/, "");
  const causes = (L.andon && Array.isArray(L.andon.causes) ? L.andon.causes : []).map(c => String(c).replace(/[:\s]+$/, "")).filter(Boolean);
  const shown = causes.length ? causes : (reason ? [reason] : []);
  const cause = f.stopped
    ? (shown.length
      ? `<div class="cause"><b>Why it is stopped</b>${shown.slice(0, 3).map(c => `<span>${esc(c)}</span>`).join("")}${shown.length > 3 ? `<span class="muted">and ${shown.length - 3} more on the floor tab</span>` : ""}</div>`
      : `<div class="cause nocause"><b>Why it is stopped</b><span>The record flags this line stopped and gives no reason.</span></div>`)
    : "";
  const cur = f.stations[f.cur];
  const c = f.stopped ? "var(--stop)" : "var(--safety)";
  return `<article class="card${f.stopped ? " stopped" : ""}" aria-label="${esc(letter)}">
    <div class="line-top"><span class="sign">${esc(letter)}</span><span class="pill ${pill[0]}">${pill[1]}</span><span class="pill wait right" title="Share of the car built">${fmt(pct)}% built</span></div>
    <p class="line-name">${esc(L.name)}</p>
    <div class="belt" style="--pos:${pct}%;--c:${c}" role="img" aria-label="${f.done} of ${cells.length} parts done">${CAR}<div class="cells">${cells.map(x => `<b class="${esc(x.state)}"></b>`).join("")}</div></div>
    ${cause}
    <p class="facts">${f.n ? `Station ${f.cur + 1} of ${f.n}${cur ? `, ${esc(cur.name)}` : ""}; ` : ""}${f.done} of ${f.items.length} parts done${f.active ? `, ${f.active} being built` : ""}.</p>
    <a class="go" href="#floor/line-${esc(safeId(L.line_id))}">Open this line on the factory floor</a>
  </article>`;
}

// ---- Machines and their lanes. Every figure is from floor.machines, floor.lanes and floor.cloud.
function ciChip(l){
  if (!l.pr) return `<span class="chip" title="This lane has written no pull request">no PR yet</span>`;
  const word = {green: "CI green", red: "CI red", pending: "CI pending", none: "no CI runs", unread: "CI unread"}[l.pr_ci] || "CI unread";
  const merged = l.pr_state && l.pr_state !== "OPEN" && l.pr_state !== "unread" ? ` · ${String(l.pr_state).toLowerCase()}` : "";
  return `<span class="chip ${esc(l.pr_ci || "")}" title="${esc(l.pr + (l.pr_title ? ": " + l.pr_title : "") + (l.pr_ci_note ? " · " + l.pr_ci_note : ""))}">${esc(l.pr)} · ${word}${esc(merged)}</span>`;
}

function laneRow(l){
  const doing = l.status_text ? esc(l.status_text) : l.title ? esc(l.title) : `<span class="unread">no status written</span>`;
  return `<a class="lrow" href="#floor/lane-${esc(safeId(l.lane))}" title="${esc([l.ticket, l.title, l.status_full].filter(Boolean).join(" · "))}">
    <span class="tk">${esc(l.ticket || "no ticket")} · ${esc(l.lane)}${l.engine === "codex" ? " · Codex" : ""}</span>
    <span class="doing">${doing}</span>
    <span class="side">${ciChip(l)}${l.stalled ? `<span class="chip stall">stalled ${esc(ageText(liveMs(l.silent_minutes)))}</span>` : ""}<span class="when">${esc(sinceText(l.status_at))} ago</span></span>
  </a>`;
}

function gauge(label, value, frac, why, hot){
  if (value == null) return `<div class="gauge"><span>${esc(label)}</span><span class="v unread">unread${why ? ` (${esc(why)})` : ""}</span></div>`;
  const bar = frac == null ? "" : `<div class="gbar${hot ? " hot" : ""}" role="img" aria-label="${esc(label)}"><b style="--w:${Math.max(0, Math.min(100, Math.round(frac * 100)))}%"></b></div>`;
  return `<div class="gauge"><span>${esc(label)}</span><span class="v">${esc(value)}</span>${bar}</div>`;
}

function bayCard(m, byId){
  const lanes = (m.lanes || []).map(id => byId[id]).filter(Boolean);
  const rd = m.state === "read";
  const word = rd ? (m.stale ? "reading stale" : "read") : m.state === "repair" ? "in repair" : m.state === "out" ? "out of selection" : "unread";
  const tone = rd ? (m.stale ? "warn" : "ok") : "idle";
  const cls = rd ? "" : m.state === "repair" || m.state === "out" ? " repair" : " unreadbay";
  const cap = m.cap == null ? null : num(m.cap);
  const age = m.read_age_min == null ? "" : ` · ${m.read_at ? sinceText(m.read_at) : ageText(liveMs(m.read_age_min))} ago`;
  let body;
  if (rd){
    const cells = lanes.map(l => `<i class="${l.stalled ? "stall" : l.engine === "codex" ? "codex" : "used"}" title="${esc(l.lane)}"></i>`);
    const free = cap == null ? 0 : Math.max(0, cap - lanes.length);
    const over = cap == null ? 0 : Math.max(0, lanes.length - cap);
    const load = m.load_per_core;
    const memFrac = m.mem_total_gb ? 1 - num(m.mem_free_gb) / num(m.mem_total_gb) : null;
    body = `<div class="slots" role="img" aria-label="${lanes.length} lanes placed${cap == null ? "" : " of " + cap}">${cells.join("")}${"<i></i>".repeat(Math.min(free, 60))}</div>
      <p class="capline"><span class="mono">${lanes.length}</span> lanes placed${cap == null ? ` · cap <span class="unread">unread</span>` : ` of <span class="mono">${cap}</span>`}${over ? ` · <b class="age-stale">${over} over the cap</b>` : ""}${m.refusal ? ` · refuses new work: ${esc(m.refusal)}` : ""}</p>
      <div class="gauges">
        ${gauge("load per core", load == null ? null : fmt(load), load == null ? null : num(load), "", num(load) >= 1)}
        ${gauge("memory free", m.mem_free_gb == null ? null : `${fmt(m.mem_free_gb)} GB${m.mem_total_gb ? " of " + fmt(m.mem_total_gb) : ""}`, memFrac, "", memFrac != null && memFrac > 0.9)}
      </div>`;
  } else {
    body = `<p class="capline">${esc(m.note || "no reading")}${lanes.length ? ` The ledger still places ${plural(lanes.length, "lane", "lanes")} here.` : ""}</p>`;
  }
  return `<article class="bay${cls}" aria-label="${esc(m.label)}">
    <div class="bay-top"><b>${esc(m.label)}</b><span class="pill ${tone}">${esc(word)}${esc(age)}</span></div>
    ${body}
    ${lanes.length ? `<div class="lrows">${lanes.map(laneRow).join("")}</div>` : (rd ? `<p class="capline">No lane is placed here.</p>` : "")}
  </article>`;
}

function cloudCard(cloud, lanes){
  if (!cloud) return `<article class="bay unreadbay"><div class="bay-top"><b>Cloud</b><span class="pill idle">unread</span></div><p class="capline">The record carries no cloud bay.</p></article>`;
  const rd = cloud.state === "read";
  const live = lanes.filter(l => l.placement === "cloud");
  const stops = (cloud.lamps || []).map(x => `<div class="lamp-stop" role="alert"><b>${esc(x.text)}</b></div>`).join("");
  const accts = (cloud.accounts || []).map(a => `<li><span><b>${esc(a.name)}</b> · ${a.ready ? "signed in" : esc(a.login || "not signed in")}</span><span class="mono">${num(a.open_sessions)} open${a.cap != null ? " of " + num(a.cap) : ""}</span></li>`).join("");
  const sessions = cloud.sessions || [];
  const open = sessions.filter(s => s.open).length;
  return `<article class="bay${rd ? "" : " unreadbay"}" aria-label="Cloud">
    <div class="bay-top"><b>Cloud</b><span class="pill ${rd ? "ok" : "idle"}">${rd ? "read" : "unread"}</span></div>
    ${stops}
    ${rd ? (accts ? `<ul class="plain">${accts}</ul>` : `<p class="capline">No cloud account is signed in.</p>`) : `<p class="capline">${esc(cloud.note || "the cloud accounts file could not be read")}</p>`}
    ${rd ? `<p class="capline">${open} of ${sessions.length} recent cloud sessions open${cloud.note ? ` · ${esc(cloud.note)}` : ""}</p>` : ""}
    ${live.length ? `<div class="lrows">${live.map(laneRow).join("")}</div>` : ""}
  </article>`;
}

// ---- The day: the newest day of the process-health series, and the pull requests that are red now.
function metric(day, key){
  const ms = day && day.window && Array.isArray(day.window.metrics) ? day.window.metrics : [];
  const m = ms.find(x => x.key === key);
  return m && m.value != null && m.status !== "unread" ? m : null;
}

const redRow = l => `<li><span><a href="#floor/lane-${esc(safeId(l.lane))}">${esc(l.pr)}</a> <span class="muted">${esc(l.pr_title || l.title || "")}</span></span><small>${esc(l.pr_ci_note || "CI red")} · ${esc(l.lane)}</small></li>`;

function todayCard(floor, health){
  const days = health && Array.isArray(health.days) ? health.days : [];
  const day = days.length ? days[days.length - 1] : null;
  const prev = days.length > 1 ? days[days.length - 2] : null;
  const mt = metric(day, "merges.total"), mp = metric(day, "merges.product");
  const re = metric(day, "reds.episodes_opened"), rh = metric(day, "reds.hours_red");
  const pm = metric(prev, "merges.total");
  const today = localDay(Date.now());
  const dayNote = !day ? "The process-health series is not published, so the day's counts are unread."
    : `Series day ${esc(day.date)}${day.partial ? ", so far" : ""}${day.window && day.window.end ? ` (to ${esc(clock(day.window.end))})` : ""}${day.date < today ? `. <b class="age-stale">This is not today (${esc(today)}): the series is behind.</b>` : ""}`;
  const redLanes = (floor.lanes || []).filter(l => l.pr && l.pr_ci === "red" && (!l.pr_state || l.pr_state === "OPEN"));
  const merged = (floor.shipped || []).slice(0, 6);
  const mergeTime = p => { const t = /merged (\S+)/.exec(p.detail || ""); return t ? sinceText(t[1]) + " ago" : esc(p.detail || ""); };
  return `<section class="sec" aria-labelledby="todayH">
    <header><h2 id="todayH">Merged and red today</h2></header>
    <p class="facts">${dayNote}</p>
    <div class="pair">
      <div><b ${mt ? "" : 'class="unread"'}>${mt ? fmt(mt.value) : "unread"}</b><span>merges${mp ? `, ${fmt(mp.value)} to product code` : ""}${pm ? `; the day before ${fmt(pm.value)}` : ""}</span></div>
      <div class="${redLanes.length || (re && re.value > 0) ? "bad" : ""}"><b>${redLanes.length}</b><span>pull requests red now on live lanes${re ? `; ${fmt(re.value)} dev-branch red ${num(re.value) === 1 ? "episode" : "episodes"} opened today${rh ? `, ${fmt(rh.value)} repo-hours red` : ""}` : "; dev-branch red episodes unread"}</span></div>
    </div>
    <div class="card">
      <p class="sub">Newest merges in the record</p>
      ${merged.length ? `<ul class="lst">${merged.map(p => `<li><span>${esc(p.title)} <span class="muted">(${esc(p.pr)})</span></span><small>${mergeTime(p)}</small></li>`).join("")}</ul>` : `<p class="unread">The record lists no merged change.</p>`}
      <p class="sub">Red now</p>
      ${redLanes.length ? `<ul class="lst">${redLanes.slice(0, 5).map(redRow).join("")}</ul>${redLanes.length > 5 ? `<details class="more"><summary>Show the other ${redLanes.length - 5}</summary><ul class="lst">${redLanes.slice(5).map(redRow).join("")}</ul></details>` : ""}` : `<p class="muted">No live lane has a red pull request.</p>`}
    </div>
  </section>`;
}

// ---- Freshness of every source.
function freshRows(rec, status, health, manifest, delegation){
  const s = rec.sources || {};
  const rows = [];
  const timed = (group, name, iso, note) => rows.push({group, name, iso, note: note || ""});
  const flag = (group, name, ok, note) => rows.push({group, name, ok, note: note || "", flag: true});
  timed("Factory record", "Factory record computed", rec.generated_at);
  if (status && status.published_at) timed("Factory record", "Published to this page", status.published_at);
  timed("Factory record", "Pull request watcher, last tick", s.watcher_last_tick);
  timed("Factory record", "Newest ledger row read", s.ledger_newest_row, s.ledger_rows != null ? `${fmt(num(s.ledger_rows))} rows read` : "");
  timed("Factory record", "Pool read of the machines", s.pool_read_at, s.placement_hosts ? `${plural(num(s.placement_hosts), "host", "hosts")} advertising slots` : "no host advertising slots");
  flag("Factory record", "Lab host table (caps, repair)", s.host_table_read);
  flag("Factory record", "Placement markers (units)", s.placement_markers_read);
  flag("Factory record", "Remote-lane receipts", s.receipts_read);
  flag("Factory record", "Cloud accounts", s.cloud_accounts_read);
  flag("Factory record", "CI runner fleet observation", s.runner_fleet_read, "no node writes this file yet");
  flag("Factory record", "Friction report", s.stoppage_report);
  flag("Factory record", "Linear issues", num(s.linear_issues) > 0, num(s.linear_issues) > 0 ? `${fmt(num(s.linear_issues))} issues read` : "");
  if (status && Array.isArray(status.steps)){
    status.steps.filter(st => st.status !== "ok").forEach(st => rows.push({group: "Factory record", name: `Input step: ${st.name}`, ok: false, flag: true, note: `failed (${st.detail || "no detail"})`}));
  }
  const d = status && status.lines_declared;
  flag("Factory record", "Lines declared by the overlay", !!(d && d.state === "read"), d && d.state === "read" ? `${plural(d.plan_path_contains.length, "line", "lines")} declared` : (d && d.reason) || "");
  if (health) timed("Reports and series", "Process-health series", health.generated_at, healthNote(health));
  else rows.push({group: "Reports and series", name: "Process-health series", ok: false, flag: true, note: "not published"});
  if (delegation) timed("Reports and series", "Delegation counts", delegation.generated_at);
  else rows.push({group: "Reports and series", name: "Delegation counts", ok: false, flag: true, note: "no node writes this file yet"});
  if (manifest && Array.isArray(manifest.reports)){
    timed("Reports and series", "Reports manifest", manifest.published_at);
    // The record and the series are listed above from their own files, so their manifest rows are not listed twice.
    manifest.reports.filter(r => r.id !== "factory_floor" && r.id !== "process_health").forEach(r => (r.data || []).forEach(x => {
      if (x.status === "read") timed("Reports and series", x.name, x.as_of, r.refresh === "snapshot" ? "a snapshot, not refreshed by a tick" : "", r.refresh);
      else rows.push({group: "Reports and series", name: x.name, ok: false, flag: true, note: x.reason || "unread"});
    }));
  } else {
    rows.push({group: "Reports and series", name: "Reports manifest", ok: false, flag: true, note: "not published"});
  }
  return rows;
}

function healthNote(h){
  const src = Array.isArray(h.sources) ? h.sources : [];
  const bad = src.filter(x => x.status !== "read");
  return src.length ? `${src.length - bad.length} of ${src.length} inputs read${bad.length ? `; ${bad.map(x => x.name).join(", ")} ${bad.length === 1 ? "is" : "are"} not fully read` : ""}` : "";
}

function freshState(r){
  if (r.flag) return r.ok ? "ok" : "idle";
  const ms = ageMs(r.iso);
  if (ms == null) return "idle";
  if (/snapshot/.test(r.note)) return "ok";
  return ms > STALE_MIN * 60000 ? "stop" : "ok";
}

function freshnessCard(rows){
  const withState = rows.map(r => Object.assign({st: freshState(r)}, r));
  let last = "";
  const html = withState.map(r => {
    const g = r.group !== last ? `<p class="fgroup">${esc(r.group)}</p>` : "";
    last = r.group;
    let value;
    if (r.flag) value = r.ok ? "read" : `<span class="unread">unread</span>`;
    else { const ms = ageMs(r.iso); value = ms == null ? `<span class="unread">unread (no readable time)</span>` : `<span class="${r.st === "stop" ? "age-stale" : ""}">${esc(ageText(ms))} old</span>`; }
    return `${g}<div class="src c-${r.st}" ><b>${esc(r.name)}</b><span>${value}</span><small>${r.iso && !r.flag ? esc(clock(r.iso)) + (r.note ? " · " : "") : ""}${esc(r.note)}</small></div>`;
  }).join("");
  const stale = withState.filter(r => r.st === "stop").length, unread = withState.filter(r => r.st === "idle").length;
  return {stale, unread, total: withState.length, html};
}

// ---- Dashboard
function lamp(cls, head, small, sub){
  return `<div class="lamp c-${cls}" role="listitem"><i></i><b>${head}${small ? `<small>${esc(small)}</small>` : ""}</b><span>${esc(sub)}</span></div>`;
}

function renderDashboard(p){
  const rec = p.record, status = p.status, health = p.health;
  const floor = Object.assign({machines: [], lanes: [], cloud: null, shipped: [], waiting: [], stoppages: []}, rec.floor || {});
  const built = buildSlots(rec.lines || [], status);
  const slots = built.slots;
  const facts = slots.filter(s => s.line).map(s => lineFacts(s.line));
  const stoppedN = facts.filter(f => f.stopped).length;
  const missing = slots.filter(s => !s.line).length;

  const ms = floor.machines || [], lanes = floor.lanes || [];
  const read = ms.filter(m => m.state === "read");
  const repair = ms.filter(m => m.state === "repair" || m.state === "out").length;
  const unreadM = ms.filter(m => m.state === "unread").length;
  const placed = ms.reduce((a, m) => a + num(m.lanes_placed), 0);
  const cap = read.reduce((a, m) => a + num(m.cap), 0);
  const stalled = lanes.filter(l => l.stalled).length;
  const redLanes = lanes.filter(l => l.pr && l.pr_ci === "red" && (!l.pr_state || l.pr_state === "OPEN")).length;

  const days = health && Array.isArray(health.days) ? health.days : [];
  const day = days.length ? days[days.length - 1] : null;
  const mt = metric(day, "merges.total");
  const fresh = freshnessCard(freshRows(rec, status, health, p.manifest, p.delegation));

  const board = [];
  board.push(slots.length
    ? lamp(stoppedN ? "stop" : missing ? "warn" : "ok", `${stoppedN} of ${slots.length}`, stoppedN === 1 ? "line stopped" : "lines stopped", missing ? `${plural(missing, "declared line is", "declared lines are")} not in the record` : `${facts.length} read, ${plural(facts.reduce((a, f) => a + f.active, 0), "part", "parts")} being built`)
    : lamp("idle", "Lines", "unread", "The record holds no lines"));
  board.push(ms.length
    ? lamp(unreadM ? "warn" : "ok", `${read.length} of ${ms.length}`, "machines read", `${placed} lanes placed on ${cap} slots${repair ? `; ${repair} in repair or out of selection` : ""}${unreadM ? `; ${unreadM} unread` : ""}`)
    : lamp("idle", "Machines", "unread", "The record declares no machine bays"));
  board.push(lamp(stalled ? "stop" : lanes.length ? "ok" : "idle", `${lanes.length}`, "live lanes", stalled ? `${stalled} stalled: nothing written for ${floor.stall_minutes || "the stall"} minutes` : lanes.length ? "none stalled" : "no lane is live in the record"));
  board.push(mt ? lamp("ok", fmt(mt.value), "merges today", `${redLanes} live ${redLanes === 1 ? "lane has" : "lanes have"} a red pull request`) : lamp("idle", "Merges today", "unread", "The process-health series is not published"));
  board.push(lamp(fresh.stale ? "stop" : fresh.unread ? "warn" : "ok", `${fresh.stale}`, "stale sources", `${fresh.unread} unread of ${fresh.total} sources; stale means older than ${STALE_MIN} minutes`));

  const byId = {};
  lanes.forEach(l => { byId[l.lane] = l; });
  const unplaced = lanes.filter(l => l.placement === "unplaced");
  const bays = ms.map(m => bayCard(m, byId));
  bays.push(cloudCard(floor.cloud, lanes));
  if (unplaced.length) bays.push(`<details class="fold"><summary>${plural(unplaced.length, "live lane names", "live lanes name")} no machine the floor draws</summary><div class="lrows">${unplaced.map(laneRow).join("")}</div></details>`);

  el("dash").innerHTML = `
    <div class="board" role="list" aria-label="Right now">${board.join("")}</div>
    <div class="cols">
      <div class="stack">
        <section class="sec" aria-labelledby="linesH">
          <header><h2 id="linesH">Assembly lines</h2><p>${built.declared ? "In the order the deployment declares them" : esc("Which lines are declared is unread (" + built.reason + ")")}</p></header>
          ${slots.length ? slots.map(lineCard).join("") : `<p class="unread">The record holds no lines.</p>`}
        </section>
        ${todayCard(floor, health)}
      </div>
      <section class="sec" aria-labelledby="baysH">
        <header><h2 id="baysH">Machines and what runs on them</h2><p>${floor.stall_minutes ? `A lane is stalled after ${floor.stall_minutes} minutes without a row` : ""}</p></header>
        <div class="bays">${bays.join("")}</div>
      </section>
    </div>
    <section class="sec" aria-labelledby="freshH">
      <header><h2 id="freshH">How fresh each source is</h2><p>${fresh.stale} stale, ${fresh.unread} unread</p></header>
      <div class="fresh">${fresh.html}</div>
    </section>
    <footer class="note">Nothing here is typed in. The page reads the factory record, the publish status, the process-health series and the reports manifest again every minute. A source that could not be read is drawn as unread, never as zero.</footer>`;

  return {stoppedN, slots: slots.length, stale: fresh.stale, unread: fresh.unread, unreadM, stalled};
}

// ---- Tab lamps and captions, read from the same files.
function setTab(id, cls, sub, title){
  const i = el("lamp-" + id), s = el("sub-" + id);
  if (i){ i.className = "c-" + cls; i.title = title || ""; }
  if (s) s.textContent = sub;
}

function renderTabs(p, d){
  const rec = p.record;
  setTab("dashboard", d.stoppedN || d.stale || d.stalled ? "stop" : d.unread || d.unreadM ? "warn" : "ok",
    `${d.stoppedN} of ${d.slots} lines stopped`, `${d.stale} stale and ${d.unread} unread sources`);
  setTab("floor", d.stoppedN ? "stop" : "ok", `record ${sinceText(rec.generated_at)} old`, d.stoppedN ? `${d.stoppedN} lines stopped` : "no line stopped");
  const h = p.health && p.health.summary;
  if (!h) setTab("process", "none", "series not published", "unread");
  else if (h.measured === false) setTab("process", "idle", "not measured", h.reason || "");
  else setTab("process", num(h.worse) > 0 ? "warn" : "ok", `${num(h.improved)} better, ${num(h.worse)} worse`, `${num(h.flat)} flat, ${num(h.unmeasured)} unmeasured since the reset`);
  const m = p.manifest && Array.isArray(p.manifest.reports) ? p.manifest.reports : null;
  [["map", "decision_map"], ["quality", "decision_quality"]].forEach(([tab, rid]) => {
    const r = m && m.find(x => x.id === rid);
    const x = r && (r.data || []).find(y => y.status === "read");
    if (!m) setTab(tab, "none", "manifest unread", "unread");
    else if (!x) setTab(tab, "idle", "data unread", r ? ((r.data || [])[0] || {}).reason || "" : "not in the manifest");
    else setTab(tab, "none", `${r.refresh === "snapshot" ? "snapshot, " : ""}${sinceText(x.as_of)} old`, `data from ${clock(x.as_of)}`);
  });
}

// ---- Header: the record's age
function renderStamp(rec){
  const gen = Date.parse(rec.generated_at);
  recordAt = gen;
  const age = Number.isNaN(gen) ? null : Date.now() - gen;
  el("stamp").textContent = Number.isNaN(gen) ? "Record time unreadable" : `Record computed ${clock(rec.generated_at)} · ${ageText(age)} old`;
  const banner = el("banner");
  if (age != null && age > STALE_MIN * 60000){ banner.hidden = false; banner.textContent = `This record is ${ageText(age)} old. The tick that refreshes it has not published since; what follows may be out of date.`; }
  else banner.hidden = true;
}

let lastKey = "";
function render(p){
  renderStamp(p.record);
  const key = JSON.stringify([p.record, p.status, p.health && p.health.generated_at, p.manifest, p.delegation && p.delegation.generated_at, Math.floor(Date.now() / 60000)]);
  if (key === lastKey) return;
  lastKey = key;
  renderTabs(p, renderDashboard(p));
}

async function fetchOptional(name){
  try {
    const r = await fetch(SITE + name, {cache: "no-store"});
    if (r.status === 404) return {data: null, error: "not published"};
    if (!r.ok) return {data: null, error: "HTTP " + r.status};
    return {data: await r.json(), error: ""};
  } catch (e) { return {data: null, error: e.message}; }
}

async function load(){
  try {
    const [r, st] = await Promise.all([fetch(SITE + DATA_FILE, {cache: "no-store"}), fetchOptional(STATUS_FILE)]);
    const none = {data: null, error: "not published"};
    const [ph, mf, dg] = await Promise.all([fetchOptional(HEALTH_FILE), fetchOptional(REPORTS_FILE), st.data && st.data.delegation === "absent" ? none : fetchOptional(DELEGATION_FILE)]);
    if (!r.ok) throw new Error("HTTP " + r.status);
    render({record: await r.json(), status: st.data, health: ph.data, manifest: mf.data, delegation: dg.data});
  } catch (e) {
    const banner = el("banner");
    banner.hidden = false;
    banner.textContent = "The factory record could not be read (" + e.message + "). Retrying every minute.";
    el("dash").innerHTML = `<p class="unread">Nothing is drawn: the factory record is unread.</p>`;
    TAB_IDS.forEach(id => setTab(id, "none", "unread", "the factory record could not be read"));
  }
}

buildTabs();
const startHash = parseHash();
show(startHash.tab || remembered() || "dashboard", startHash.anchor);
if (!startHash.tab) history.replaceState(null, "", "#" + currentTab);
load();
setInterval(load, POLL_MS);
</script>
