<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Factory floor</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg" id="icon-svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--ink:#1c2024;--mute:#646b73;--line:#dfe2e6;--bg:#f6f7f8;--card:#fff;--red:#b3261e;--amber:#a56a00;--green:#1f7a4d;--blue:#2b6cb0;--grey:#9aa1a9}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:20px 16px 32px}
.now{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--grey);border-radius:8px;padding:16px 18px}
.now.red{border-left-color:var(--red)}.now.amber{border-left-color:var(--amber)}.now.green{border-left-color:var(--green)}
.now h1{font-size:22px;line-height:1.3;margin:0 0 6px;font-weight:650}.now p{margin:0;color:var(--mute)}.now p.age{margin-top:6px;font-size:13px}.now p.age.old{color:var(--red);font-weight:650}
.frozen{background:var(--red);color:#fff;border-radius:8px;padding:12px 16px;margin-bottom:12px;font-weight:650}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.num{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.num b{display:block;font-size:26px;font-weight:650;line-height:1.1}.num span{font-size:13px;color:var(--mute)}
.num.unread b{color:var(--red)}
h2{font-size:14px;font-weight:650;margin:20px 0 8px}
.row{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-bottom:6px;display:flex;gap:12px;align-items:flex-start}
.dot{flex:none;width:10px;height:10px;border-radius:50%;margin-top:7px;background:var(--grey)}
.dot.red{background:var(--red)}.dot.amber{background:var(--amber)}.dot.green{background:var(--green)}
.row b{font-weight:600}.row small{display:block;color:var(--mute);font-size:13px;margin-top:2px}
.strip{display:grid;grid-template-columns:repeat(18,1fr);gap:3px}
.p{height:30px;border-radius:4px;background:#e6e8eb;color:var(--mute);font-size:12px;display:flex;align-items:center;justify-content:center}
.p.cur{background:var(--blue);color:#fff;font-weight:650}.p.green{background:var(--green);color:#fff}.p.red{background:var(--red);color:#fff}.p.amber{background:var(--amber);color:#fff}
.piece{margin-top:8px;font-size:14px;color:var(--mute)}.piece b{color:var(--ink);font-weight:600}
.line{display:flex;gap:10px;align-items:baseline;padding:5px 2px;border-bottom:1px solid var(--line);font-size:14px}
.line .n{flex:none;width:1.8em;color:var(--mute);text-align:right}.line .t{flex:1}.line .t small{color:var(--mute)}.line .a{flex:none;color:var(--mute);font-size:12px}
.line.red .t b{color:var(--red)}.line.amber .t b{color:var(--amber)}.line.grey{color:var(--mute)}
.rule{margin-top:14px;font-size:13px;color:var(--mute)}.rule.bad{color:var(--red);font-weight:650}
a{color:var(--blue);font-size:14px;text-decoration:none}.more{margin-top:18px}
@media(max-width:480px){.now h1{font-size:19px}.num b{font-size:22px}.nums{gap:6px}.num{padding:10px}}
.tabs{display:flex;gap:6px;margin-bottom:14px;border-bottom:1px solid var(--line)}
.tabs a{padding:8px 14px;border:1px solid transparent;border-bottom:0;border-radius:8px 8px 0 0;color:var(--mute);font-size:15px;font-weight:650}
.tabs a[aria-selected="true"]{background:var(--card);border-color:var(--line);color:var(--ink);margin-bottom:-1px}
.hs{font-size:13px;color:var(--mute);margin:0 0 10px}
.hcards{display:grid;gap:10px}
.hcard{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:grid;gap:8px;min-width:0}
.hcard.out{border-style:dashed}
.hcard.unread{border-style:dashed;background:repeating-linear-gradient(45deg,transparent 0 6px,#e6e8eb 6px 7px),var(--card)}
.hcard.stale,.hcard.refusing{border-left:6px solid var(--amber)}
.mtop{display:flex;gap:6px 12px;align-items:baseline;flex-wrap:wrap}.mtop b{font-size:18px}.mtop .pill{margin-left:auto}
.pill{font-size:12px;font-weight:650;padding:3px 8px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.pill.ok{color:var(--green)}.pill.warn{color:var(--amber)}.pill.idle{color:var(--mute)}
.hwhy{margin:0;font-size:13px;color:var(--mute);overflow-wrap:anywhere}
.capline{margin:0;font-size:14px}.unread{font-style:italic;color:var(--mute)}.sub{margin:0;font-size:13px;font-weight:650;color:var(--mute)}
.slots{display:flex;flex-wrap:wrap;gap:3px}.slots i{width:12px;height:12px;border-radius:3px;background:#e6e8eb}.slots i.used{background:var(--blue)}.slots i.over{outline:2px solid var(--red);outline-offset:1px}
.hgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px}
.hcell{display:grid;gap:2px;font-size:13px;color:var(--mute);min-width:0}.hcell .v{font-size:15px;font-weight:600;color:var(--ink);overflow-wrap:anywhere}
.hcell .v.unread{font-weight:400;font-style:italic;color:var(--mute);font-size:13px}.chip{margin-left:6px;font-size:11px;padding:1px 5px;border-radius:4px;background:var(--amber);color:#fff}
.hocc{display:grid;gap:2px;font-size:14px;margin:0;padding:0;list-style:none}.hocc li{display:flex;flex-wrap:wrap;gap:2px 10px;justify-content:space-between;overflow-wrap:anywhere}.hocc li span:last-child{color:var(--mute);font-size:13px}
</style></head><body><main>
<div class="tabs" role="tablist" aria-label="Floor views"><a role="tab" id="tab-process" href="#process" aria-controls="pane-process">Process</a><a role="tab" id="tab-machines" href="#machines" aria-controls="pane-machines">Machines</a></div>
<section id="pane-process" role="tabpanel" aria-labelledby="tab-process"><div id="app"><div class="frozen">Reading the floor...</div></div></section>
<section id="pane-machines" role="tabpanel" aria-labelledby="tab-machines" hidden><div id="machines"><div class="frozen">Reading the machines...</div></div></section>
</main>
<script>
"use strict";
const DATA = "floor-simple.json", MACHINES_DATA = "factory-floor.json", FALLBACK_MAX_AGE_S = 900, REFRESH_MS = 30000, TABS = ["process", "machines"];
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ago = s => s == null ? "never" : s < 120 ? s + " s ago" : s < 7200 ? Math.floor(s / 60) + " min ago" : s < 172800 ? Math.floor(s / 3600) + " h ago" : Math.floor(s / 86400) + " d ago";
let doc = null, failure = "";
const ICON_BASE = "#2b6cb0", ICON_TINT = {green: "#1f7a4d", amber: "#a56a00", red: "#b3261e", grey: "#9aa1a9"};
let iconSvg = null, iconTint = "";
async function tintIcon(tint){
  if (tint === iconTint) return;
  iconTint = tint;
  try {
    if (iconSvg === null) { const r = await fetch("favicon.svg"); if (!r.ok) throw new Error("HTTP " + r.status); iconSvg = await r.text(); }
    document.getElementById("icon-svg").href = "data:image/svg+xml," + encodeURIComponent(iconSvg.split(ICON_BASE).join(ICON_TINT[tint]));
  } catch (e) { iconTint = ""; }
}
async function load(){
  try {
    const r = await fetch(DATA, {cache: "no-store"});
    if (!r.ok) throw new Error("HTTP " + r.status);
    doc = await r.json(); failure = "";
  } catch (e) { failure = String(e.message || e); }
  draw();
}
function draw(){
  const app = document.getElementById("app");
  if (!doc) { app.innerHTML = `<div class="frozen">The floor record cannot be read (${esc(failure)}). Nothing below can be trusted.</div><div class="more"><a href="detail.html">Details: lines, machines, shipping, delegation</a></div>`; return; }
  const age = Math.max(0, Math.floor((Date.now() - Date.parse(doc.generated_at)) / 1000));
  const limit = doc.freshness_max_age_s || FALLBACK_MAX_AGE_S;
  let h = "";
  tintIcon(failure || age > limit || !ICON_TINT[doc.level] ? "grey" : doc.level);
  document.title = (failure || age > limit ? "STALE " : "") + "Factory floor, record " + ago(age);
  if (failure) h += `<div class="frozen">The last refresh failed (${esc(failure)}); this is the record from ${ago(age)}.</div>`;
  else if (age > limit) h += `<div class="frozen">The floor is frozen: its record is ${ago(age)} old, the limit is ${Math.floor(limit / 60)} min. Everything below is old.</div>`;
  h += `<section class="now ${esc(doc.level)}"><h1>${esc(doc.sentence)}</h1><p>${esc(doc.subline)}</p><p class="age${age > limit ? " old" : ""}">Record read ${ago(age)}, limit ${Math.floor(limit / 60)} min.</p></section>`;
  h += `<div class="nums">` + doc.numbers.map(n => `<div class="num${n.read ? "" : " unread"}" title="${esc(n.basis)}"><b>${esc(n.value)}</b><span>${esc(n.label)}</span></div>`).join("") + `</div>`;
  const open = doc.alarms.filter(a => a.delivery !== "delivered");
  if (open.length) h += `<div class="row"><span class="dot red"></span><div><b>${open.length} lab alarms have no delivery receipt</b><small>${open.some(a => a.delivery === "undelivered") ? "No channel has proven delivery; it needs you." : "Waiting for a delivery receipt."} Oldest raised ${ago(Math.max(...open.map(a => Math.floor((Date.now() - Date.parse(a.raised_at)) / 1000))))}.</small></div></div>`;
  const listed = doc.causes.filter(c => c.listed);
  h += `<h2>What's holding things up, biggest first</h2>`;
  if (!listed.length) h += `<div class="row"><span class="dot green"></span><div><b>Nothing is holding things up.</b></div></div>`;
  for (const c of listed.slice(0, doc.causes_shown)) {
    const who = c.state === "red" ? (c.needs_operator ? "It needs you." : "Nobody is on it.") : "A lane is on it: " + c.lanes.slice(0, 2).join(", ") + ".";
    h += `<div class="row"><span class="dot ${esc(c.state)}"></span><div><b>${esc(c.title)}</b><small>${esc(c.detail)} ${esc(who)}</small></div></div>`;
  }
  if (listed.length > doc.causes_shown) h += `<div class="piece">${listed.length - doc.causes_shown} more holdups are in the details.</div>`;
  const cur = doc.rebuild.current_piece;
  h += `<h2>The rebuild</h2><div class="strip">` + doc.pieces.map(p => `<div class="p ${p.piece === cur ? "cur" : p.status === "not_started" ? "" : esc(p.draw)}" title="${esc(p.name)}">${p.piece}</div>`).join("") + `</div>`;
  h += `<div class="piece"><b>${esc(doc.rebuild.headline)}</b> ${esc(doc.rebuild.next_text)}</div>`;
  h += `<h2>The lab, read ${ago(Math.max(0, ...doc.lab_state.map(l => l.reading_age_s || 0)))} at the oldest</h2>`;
  for (const l of doc.lab_state) h += `<div class="line ${esc(l.draw)}"><span class="n"><span class="dot ${esc(l.draw)}" style="display:inline-block"></span></span><span class="t"><b>${esc(l.title)}</b> <small>${esc(l.text)}</small></span><span class="a">${l.reading_age_s == null ? "not read" : "read " + ago(l.reading_age_s)}, max ${Math.floor(l.max_age_s / 60)} min</span></div>`;
  h += `<h2>The 18 pieces, with their joins</h2>`;
  for (const p of doc.pieces) {
    const joins = p.joins.map(j => `${esc(j.id)} ${esc(j.state.replace("_", " "))}${j.golden_age_s == null ? "" : ", golden " + ago(j.golden_age_s)}${j.error_age_s == null ? "" : ", error " + ago(j.error_age_s)}`).join("; ");
    h += `<div class="line ${p.status === "not_started" ? "grey" : esc(p.draw)}"><span class="n">${p.piece}</span><span class="t"><b>${esc(p.name)}</b> <small>${esc(p.text)}${joins ? " · join " + joins : ""}</small></span><span class="a">${p.reading_age_s == null ? "no reading" : "read " + ago(p.reading_age_s)}</span></div>`;
  }
  const r = doc.red_rule;
  h += `<div class="rule${r.state === "WORKING" ? "" : " bad"}">Colour rule ${esc(r.state)}: ${r.red_rows} red rows, ${r.red_with_work_under_way} with work under way${r.violations.length ? " (" + esc(r.violations[0]) + ")" : ""}. Read ${ago(age)}.</div>`;
  if (doc.chain_findings.length) h += `<div class="rule bad">${doc.chain_findings.length} emission chains break the contract: ${esc(doc.chain_findings[0].subject)} ${esc(doc.chain_findings[0].code)}.</div>`;
  if (doc.outside_goal) h += `<div class="rule${doc.outside_goal.read ? "" : " bad"}">${esc(doc.outside_goal.text)}</div>`;
  h += `<div class="more"><a href="${esc(doc.details_href)}">Details: lines, machines, shipping, delegation</a></div>`;
  app.innerHTML = h;
}
// ---- Tabs. The address picks the view: #process (also no hash or an unknown one) and #machines are deep links.
const tabFromHash = () => { const h = String(location.hash || "").replace(/^#/, ""); return TABS.includes(h) ? h : "process"; };
function showTab(){
  const cur = tabFromHash();
  for (const id of TABS) {
    document.getElementById("pane-" + id).hidden = id !== cur;
    document.getElementById("tab-" + id).setAttribute("aria-selected", id === cur ? "true" : "false");
  }
}
// ---- Machines tab: one card per host of floor.host_status in the factory floor record (the same card the Details page
// draws, test_simple_page_machines holds the two equal). Every cell names its source, its state (read, stale or unread)
// and the reason; an unread cell is never drawn as a number and a stale one is marked.
let mdoc = null, mfailure = "";
const num = (v, d = 0) => Number.isFinite(Number(v)) && v !== null && v !== "" ? Number(v) : d;
const fmt = v => Number(v).toLocaleString("en-US", {maximumFractionDigits: 1});
function ageText(ms){
  const m = Math.max(0, Math.round(ms / 60000));
  return m < 1 ? "under a minute" : m < 120 ? `${m} min` : m < 2880 ? `${(m / 60).toFixed(1)} h` : `${(m / 1440).toFixed(1)} days`;
}
function sinceRecord(){ const t = mdoc ? Date.parse(mdoc.generated_at) : NaN; return Number.isNaN(t) ? 0 : Math.max(0, Date.now() - t); }
function liveMs(min){ return num(min) * 60000 + sinceRecord(); }
const HOST_WORD = {out: "Out of selection", unread: "Not read", stale: "Reading out of date", refusing: "Refusing new work", read: "Read"};
const HOST_TONE = {out: "idle", unread: "idle", stale: "warn", refusing: "warn", read: "ok"};
function cellMin(c){ return c.age_min == null ? "" : `, read ${ageText(liveMs(c.age_min))} ago`; }
function cellHTML(label, c, f){
  if (!c || c.state === "unread" || c.value == null){
    return `<div class="hcell"><span>${esc(label)}</span><span class="v unread" title="${esc(c ? c.source : "")}">unread${c && c.reason ? " (" + esc(c.reason) + ")" : ""}</span></div>`;
  }
  const stale = c.state === "stale" ? `<span class="chip stall" title="${esc(c.reason)}">stale</span>` : "";
  return `<div class="hcell"><span>${esc(label)}</span><span class="v mono" title="${esc(c.source + cellMin(c))}">${esc(f(c.value))}${stale}</span></div>`;
}
const fmtGB = v => fmt(v) + " GB";
function flagHTML(label, c, yes, no){
  if (!c || c.state === "unread" || c.value == null) return cellHTML(label, c ? Object.assign({}, c, {value: null}) : null, String);
  const stale = c.state === "stale" ? `<span class="chip stall" title="${esc(c.reason)}">stale</span>` : "";
  return `<div class="hcell"><span>${esc(label)}</span><span class="v" title="${esc(c.source + cellMin(c))}">${esc(c.value ? yes : no)}${stale}</span></div>`;
}
function occRows(list){
  return list.map(u => `<li><span><b>${esc(u.lane)}</b>${u.ticket ? " · " + esc(u.ticket) : ""}${u.engine === "codex" ? " · Codex" : ""}${u.stalled ? ` <span class="chip stall">gone quiet</span>` : ""}</span><span>running ${esc(ageText(liveMs(u.run_minutes)))}</span></li>`).join("");
}
function hostCard(h){
  const used = h.slots_used, cap = h.cap;
  const slotLine = used.value == null
    ? `<p class="capline">Lane slots used: <span class="unread">unread (${esc(used.reason)})</span> of ${cap.value == null ? `<span class="unread">unread</span>` : esc(fmt(cap.value))}</p>`
    : `<p class="capline"><b>${esc(fmt(used.value))}</b> of ${cap.value == null ? `<span class="unread">cap unread (${esc(cap.reason)})</span>` : `<b>${esc(fmt(cap.value))}</b>`} lane slots used${h.slots_free.value != null ? `; ${esc(fmt(h.slots_free.value))} free by the pool read` : ""}${used.state === "stale" ? " (stale)" : ""}</p>`;
  const cells = cap.value != null && used.value != null ? Math.min(60, Math.max(0, Math.round(cap.value))) : 0;
  const usedN = used.value == null ? 0 : Math.round(used.value);
  const bar = cells ? `<div class="slots" role="img" aria-label="${esc(fmt(usedN) + " of " + fmt(cap.value) + " lane slots used")}">${Array.from({length: cells}, (_, i) => `<i class="${i < usedN ? "used" : ""}${i >= usedN && usedN > cells ? " over" : ""}"></i>`).join("")}</div>` : "";
  const why = h.condition === "out" ? h.unavailable_reason || "out of selection, no reason in the host table"
    : h.admission_refusal ? h.admission_refusal
    : h.condition === "unread" ? h.load_per_core.reason
    : h.condition === "stale" ? h.reading_age.reason : "";
  const lanes = h.lanes.length ? `<div><p class="sub">Lanes on this machine (${h.lanes.length})</p><ul class="hocc">${occRows(h.lanes)}</ul></div>` : "";
  const landing = h.landing_workers.length ? `<div><p class="sub">Landing workers (${h.landing_workers.length})</p><ul class="hocc">${occRows(h.landing_workers)}</ul></div>` : "";
  const other = h.other_units.value == null
    ? `<p class="capline">Lab-run jobs: <span class="unread">unread (${esc(h.other_units.reason)})</span></p>`
    : `<p class="capline">${esc(fmt(h.other_units.value))} other placed units (lab-run jobs and the landing workers' own leases; the slot marker does not say which)</p>`;
  const pressure = h.mem_pressure.unit === "psi" ? v => fmt(v) + " PSI" : v => "level " + fmt(v) + " (1 normal)";
  // The cells the pool read gives. When none of them read, they share one cause and are drawn once, not eight times.
  const poolCells = [["Load per core", h.load_per_core, v => fmt(v)], ["Free memory", h.mem_free_gb, fmtGB], ["Memory pressure", h.mem_pressure, pressure],
    ["Swap used", h.swap_used_pct, v => fmt(v) + "%"], ["Free disk (run volume)", h.disk_free_gb, fmtGB], ["Disk used", h.disk_used_pct, v => fmt(v) + "%"],
    ["Last reading", h.reading_age, v => ageText(v * 60000) + " old"]];
  const noneRead = poolCells.every(([, c]) => !c || c.state === "unread" || c.value == null);
  const poolFold = noneRead ? `<p class="capline"><span class="unread">Unread from the pool read: ${esc(poolCells.map(x => x[0].toLowerCase()).join(", "))} (${esc(h.reading_age.reason || "no reason recorded")})</span></p>` : "";
  const poolHTML = noneRead ? "" : poolCells.map(([label, c, f]) => cellHTML(label, c, f)).join("");
  return `<article class="hcard ${esc(h.condition)}" aria-label="${esc(h.label)}">
    <div class="mtop"><b>${esc(h.label)}</b><span class="pill ${HOST_TONE[h.condition]}">${esc(HOST_WORD[h.condition])}${h.reading_age.value != null ? " · " + esc(ageText(liveMs(h.reading_age.age_min == null ? 0 : h.reading_age.age_min))) + " ago" : ""}</span></div>
    ${why ? `<p class="hwhy">${esc(why)}</p>` : ""}
    ${slotLine}${bar}${lanes}${landing}${other}
    ${poolFold}
    <div class="hgrid">
      ${poolHTML}
      ${cellHTML("Heartbeat age", h.heartbeat_age_min, v => ageText(v * 60000))}
      ${cellHTML("Open drift items", h.drift_open, v => fmt(v))}
      ${flagHTML("Docker", h.docker, "present", "absent")}
    </div>
  </article>`;
}
function drawMachines(){
  const box = document.getElementById("machines");
  if (!mdoc) { box.innerHTML = `<div class="frozen">The machine record cannot be read (${esc(mfailure)}). No machine below can be trusted.</div>`; return; }
  const age = Math.max(0, Math.floor(sinceRecord() / 1000));
  const limit = (doc && doc.freshness_max_age_s) || FALLBACK_MAX_AGE_S;
  let h = "";
  if (mfailure) h += `<div class="frozen">The last refresh of the machines failed (${esc(mfailure)}); this is the record from ${ago(age)}.</div>`;
  else if (age > limit) h += `<div class="frozen">The machine record was read ${ago(age)}, the limit is ${Math.floor(limit / 60)} min. Everything below is old.</div>`;
  const rows = ((mdoc.floor || {}).host_status) || [];
  if (!rows.length) { box.innerHTML = h + `<p class="unread">The record carries no per-host status: it was written before the Machines tab existed, or the host table was not read.</p>`; return; }
  const out = rows.filter(r => r.condition === "out").length, ok = rows.filter(r => r.condition === "read").length;
  h += `<p class="hs">${esc(rows.length + " hosts in the host table: " + ok + " read, " + (rows.length - out - ok) + " not read fresh or refusing work, " + out + " out of selection")}. Record read ${ago(age)}. Each figure names its source when you hover it; a figure with no source is drawn unread with the reason, and a reading past its bound is marked stale.</p>`;
  h += `<div class="hcards">${rows.map(hostCard).join("")}</div>`;
  box.innerHTML = h;
}
async function loadMachines(){
  try {
    const r = await fetch(MACHINES_DATA, {cache: "no-store"});
    if (!r.ok) throw new Error("HTTP " + r.status);
    mdoc = await r.json(); mfailure = "";
  } catch (e) { mfailure = String(e.message || e); }
  drawMachines();
}
window.addEventListener("hashchange", showTab);
showTab();
load(); loadMachines(); setInterval(load, REFRESH_MS); setInterval(loadMachines, REFRESH_MS); setInterval(draw, 10000); setInterval(drawMachines, 10000);
</script></body></html>
