name: node_factory_floor_publish_effect
lifecycle: experimental
node_type: EFFECT_GENERIC
runtime_profiles: []
contract_version:
  major: 1
  minor: 0
  patch: 0
node_version: 1.0.0
description: >-
  Refresh the factory floor's inputs and record (lab host reading, friction report, process-health series, node_factory_floor_effect), then publish the page and the data
  to the directory a static server on the lab serves, over ssh, each file written to a temporary name and
  renamed into place. The serving host, the directory and the URL come from the deployment overlay; this
  contract declares only where the record is, what the files are called and the time limits.
input_model:
  name: ModelFactoryFloorPublishRequest
  module: omnimarket.nodes.node_factory_floor_publish_effect.models.model_factory_floor_publish
  description: The flags of one run.
output_model:
  name: ModelFactoryFloorPublishResult
  module: omnimarket.nodes.node_factory_floor_publish_effect.models.model_factory_floor_publish
  description: What was published and which record it carried.
handler:
  module: omnimarket.nodes.node_factory_floor_publish_effect.handlers.handler_factory_floor_publish
  class: HandlerFactoryFloorPublish
  input_model: omnimarket.nodes.node_factory_floor_publish_effect.models.model_factory_floor_publish.ModelFactoryFloorPublishRequest
  output_model: omnimarket.nodes.node_factory_floor_publish_effect.models.model_factory_floor_publish.ModelFactoryFloorPublishResult
handler_routing:
  routing_strategy: operation_match
  default_handler: omnimarket.nodes.node_factory_floor_publish_effect.handlers.handler_factory_floor_publish:HandlerFactoryFloorPublish
  handlers:
  - operation: handle
    handler:
      name: HandlerFactoryFloorPublish
      module: omnimarket.nodes.node_factory_floor_publish_effect.handlers.handler_factory_floor_publish
  - operation: publish_reports
    handler:
      name: HandlerReportsPublish
      module: omnimarket.nodes.node_factory_floor_publish_effect.handlers.handler_reports_publish
event_bus:
  subscribe_topics: []
  publish_topics: []
runtime_dispatch:
  external_trigger: python -m omnimarket.nodes.node_factory_floor_publish_effect, from the registry module tick that the host installer contract declares.
descriptor:
  node_archetype: effect
  purity: effectful
  runtime_profiles: []
  idempotent: true
  timeout_ms: 900000
  side_effects:
  - runs the lab host reading, the pool read of the machines (which writes its own receipt), the friction report copy, node_process_health_effect and node_factory_floor_effect, which write their JSON under the registry home
  - reads the factory floor JSON and the packaged pages (the tab page and the factory floor page)
  - reads the factory floor effect's overlay for the declared lines and the delegation counts file when there is one
  - writes the tab page, the factory floor page, the status, the process-health series, the delegation counts and the record to the serving host's directory over ssh
  - writes a timestamped snapshot of the record under the history subdirectory on the serving host, and removes past-window snapshots beyond the declared count there
  - reads the data files of the reports site under the registry home and writes the reports index, each report's page and data, and the reports manifest to the same serving directory over ssh
  - writes last-run.json into the tick's state directory

# Where the record is, which input steps run before it is read, and what the served files are called. Paths are
# relative to the registry home (the environment variable named by home_env); {home} and {bus_lane} in a step are
# the registry home and the overlay's bus lane. The record path must equal runtime.output.relpath of
# node_factory_floor_effect (OMN-21682), and the process-health path the output of node_process_health_effect
# (OMN-21686, its ${ONEX_STATE_DIR}/process-health/process-health.json, the tick sets ONEX_STATE_DIR). The
# serving host, its directory, the URL and the bus lane are the deployment overlay's: a file named by
# overlay_file_env, else <ONEX_SKILL_OVERLAY_ROOTS root>/node_factory_floor_publish_effect/overlay.yaml.
# The friction step keeps the 24-hour window of the rollup's report (the part with the classes the record reads).
# Steps run in order. A step that is not required may fail: the status file records it and the page shows that
# source as unread. The factory floor effect is last and required: without a record nothing is published.
runtime:
  home_env: OMNI_HOME
  plugin_root_env: CLAUDE_PLUGIN_ROOT
  overlay_file_env: ONEX_FACTORY_FLOOR_PUBLISH_OVERLAY
  # The site's page is the tab page (the dashboard and the four tabs); the factory floor artwork is its own page, drawn
  # inside the Factory floor tab, so both are packaged and both are published.
  page_relpath: page/index.html
  floor_page_relpath: page/floor/index.html
  evidence_file: last-run.json
  source:
    relpath: .claude_scratch/factory-floor/factory-floor.json
  process_health_relpath: .onex_state/process-health/process-health.json
  # The delegation counts of a window, a JSON object {generated_at, window: {start, end}, total, outcomes:
  # [{label, count, tone}], routes: [{label, done, total}], why}. No node writes it yet: when the file is absent or
  # is not that shape nothing is published and the page draws the delegation card as unread.
  delegation_relpath: .claude_scratch/delegation/delegation-window.json
  # Which plans are lines is the factory floor effect's overlay. This node reads that overlay's plan_path_contains
  # to tell the page which lines are declared, so a declared line with no plan is drawn as unread.
  lines_overlay:
    overlay_id: node_factory_floor_effect
    file_env: ONEX_FACTORY_FLOOR_OVERLAY
  # The step that makes the record. Its status is not ok while a declared line has no line in the record (a line is
  # drawn when a record line's plan_path contains the declared text; the effect draws a declared line no plan matched
  # stopped, with the declared text as its plan_path), and its detail
  # names the missing lines, so a line the board cannot draw is never silent.
  record_step: factory_floor
  steps:
  - name: hosts
    kind: capture
    required: false
    timeout_seconds: 120
    argv: ["{home}/omnibase_infra/scripts/onex", "lab-work", "hosts", "--json", "--bus-lane", "{bus_lane}"]
    output_relpath: .claude_scratch/lab-run/hosts.json
  # The landing placement's pool read of every machine (load, memory, swap, cap, or UNREADABLE), the one the
  # throughput tick reads; it writes its receipt (hosts-probe/latest.json in the remote-lane directory), which
  # node_factory_floor_effect reads for the machine bays. It takes about 30 seconds: every host is probed over its link.
  - name: pool
    kind: command
    required: false
    timeout_seconds: 180
    argv: ["python3", "{plugin_root}/scripts/onex_lab_run.py", "--lane", "factory-floor-pool", "--hosts"]
  - name: friction
    kind: copy
    required: false
    timeout_seconds: 30
    source_relpath: .onex_state/friction-rollup/latest.json
    select: [windows, 24h]
    output_relpath: .claude_scratch/friction/friction-report.json
  - name: process_health
    kind: module
    required: false
    timeout_seconds: 600
    module: omnimarket.nodes.node_process_health_effect.runtime_process_health
  - name: factory_floor
    kind: module
    required: true
    timeout_seconds: 600
    module: omnimarket.nodes.node_factory_floor_effect
    args: ["--home", "{home}"]
  names:
    page: index.html
    floor_page: floor/index.html
    data: factory-floor.json
    process_health: process-health.json
    delegation: delegation.json
    status: publish-status.json
  transport:
    connect_timeout_seconds: 10
    transfer_timeout_seconds: 60
  # The record's history: every publish also stores the record as a timestamped snapshot under <history_root>/<subdirectory>/
  # (history_root is the overlay's, normally the serving directory), written to a temporary name and renamed in without
  # replacing an existing name. A snapshot is never rewritten. Pruning removes only snapshots older than days, oldest
  # first and only while the snapshot count exceeds max_count; it never touches the live record or a younger snapshot.
  history:
    subdirectory: history
    timestamp_format: "%Y%m%dT%H%M%S%fZ"
    retention:
      days: 30
      max_count: 5000
  # The reports site (OMN-21733): an index at reports/index.html that reads reports/manifest.json, and one page per
  # report. A report's data is a file under the registry home that a node (or, for a snapshot, a lane) wrote;
  # as_of_key names the JSON key that holds the data's own time, else the file's modified time is the age and the
  # manifest says so. publish: false is for the data the floor publish already copies (listed so the index shows
  # its age). A data file that cannot be read is not published and is listed unread. Published names are relative
  # to the serving directory.
  reports:
    index:
      page_relpath: page/reports/index.html
      remote: reports/index.html
    manifest: reports/manifest.json
    entries:
    - id: factory_floor
      title: Lean Factory Floor
      summary: Every plan as a car on its assembly line, the lab bays, the shipping dock and the stoppages.
      href: ../
      refresh: tick
      data:
      - name: Factory record
        remote: factory-floor.json
        relpath: .claude_scratch/factory-floor/factory-floor.json
        as_of_key: generated_at
        publish: false
    - id: process_health
      title: Process before and after the factory reset
      summary: Daily quality measures since 15 October with the reset marked, a before and after comparison and the read status of every source.
      href: process-health/
      refresh: tick
      pages:
      - page_relpath: page/reports/process-health/index.html
        remote: reports/process-health/index.html
      data:
      - name: Process-health series
        remote: process-health.json
        relpath: .onex_state/process-health/process-health.json
        as_of_key: generated_at
        publish: false
    - id: decision_map
      title: October decision map
      summary: Problems the system ran into, the decisions they led to, and whether each problem came back after the change.
      href: decision-map/
      refresh: snapshot
      refresh_note: No node writes this data yet. It is the 30 October snapshot of the ledger rulings, consents and friction rows, cleaned of credentials and people.
      pages:
      - page_relpath: page/reports/decision-map/index.html
        remote: reports/decision-map/index.html
      data:
      - name: Decision map data
        remote: reports/decision-map/decisions.json
        relpath: .claude_scratch/reports/decision-map/decisions.json
        as_of_key: asof
    - id: decision_quality
      title: Decision quality, October
      summary: How the operator's 465 October rulings held up, what was reversed or reshaped, and which directions had to be restated.
      href: decision-quality/
      refresh: snapshot
      refresh_note: A lane's written report, not a node's output. The age is the report file's modified time.
      pages:
      - page_relpath: page/reports/decision-quality/index.html
        remote: reports/decision-quality/index.html
      data:
      - name: Decision quality report
        remote: reports/decision-quality/decision-quality.md
        relpath: .claude_scratch/reports/decision-quality/decision-quality.md
metadata:
  transport_type: local
  description: >-
    Refresh the factory floor record and publish it with its page to the lab web server's directory.
  author: OmniNode Team
  created: '2026-10-31'
  tags:
  - effect
  - factory-floor-publish
  - OMN-21733
  related_tickets:
  - OMN-21733
  - OMN-21682
