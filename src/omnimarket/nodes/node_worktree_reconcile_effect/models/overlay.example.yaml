# Deployment supplies literal absolute paths and explicit host identities.
# Start observe-only; enabling execute retains the existing preservation rules.
python: /srv/onex/venv/bin/python
project: /srv/onex/market
state_directory: /srv/onex/state/worktree-reconcile
environment_file: /srv/onex/host.env
hosts:
  lab-host:
    host: lab-host
    roots: [/srv/onex/worktrees]
    ledger_path: /srv/onex/state/ledger.md
    execute: false
    policy:
      quiet_hours: 6
      stale_hours: 72
      # A worktree lock is judged stale only when its reason is one of lane_lock_reasons (the text the lane runner writes; a person's
      # lock is never stale), the ledger named by ledger_path was read fresh just now (its newest row younger than
      # ledger_max_age_hours, the rolled files of the last ledger_lookback_days days read too, under ledger_max_bytes) and shows the
      # owning lane finished, and the tree is quiet past stale_lock_hours. Only then is it unlocked and judged like any tree; clean,
      # pushed and merged work is what a removal needs. Without a ledger_path, or with an unread one, every locked tree stays.
      stale_lock_hours: 24
      lane_lock_reasons: ["codex lane running (OMN-20363)"]
      ledger_max_age_hours: 6
      ledger_lookback_days: 30
      ledger_max_bytes: 536870912
      # A linked worktree whose gitdir is gone (git cannot read it) is never removed: it is kept and reported for a person.
      allow_standalone_clone_removal: false
      max_removals_per_run: 200
      # A systemd EnvironmentFile the run user cannot open: declared by the host overlay, never obtained by changing a file mode.
      unreadable_environment_files: {}
      # A launchd definition the run user cannot read or parse: declared by the host overlay, never obtained by changing a file mode.
      unreadable_launchd_definitions: {}
    # Template only: each scheduled tick generates its own correlation UUID.
    correlation_id: 00000000-0000-4000-8000-000000000000
# A host whose layout differs (a Mac under launchd) is declared beside the hosts. `$OMNI_HOME` at the start of a path is the
# installing process's registry root, so no home directory path is written here.
# schedulers:
#   mac-host: launchd
# host_paths:
#   mac-host:
#     project: $OMNI_HOME/worktree-reconcile/omnimarket
