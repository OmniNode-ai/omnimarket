---
# Host-timer effect, like node_typed_decision_effect: no subscription and no
# onex.nodes entry point, invoked by `python -m` on the host it reconciles.
# `experimental` is the drift gate's marker for an intentionally unregistered
# node; the topic graph sees it as an externally triggered ingress root.
name: worktree_reconcile_effect
lifecycle: experimental
contract_version:
  major: 1
  minor: 0
  patch: 0
node_type: effect
node_version:
  major: 1
  minor: 0
  patch: 0
description: Portable host worktree reconciliation with conservative preservation
  rails.
input_model: omnimarket.events.worktree_reconcile.ModelWorktreeReconcileCommand
output_model: omnimarket.events.worktree_reconcile.ModelWorktreeReconcileRunResult
handler:
  # OMN-19399: invoked by __main__.py on a host timer, which supplies the
  # effect boundaries. This handler is not a runtime routing target: its host
  # dependencies are supplied by the CLI. Run with:
  # python -m omnimarket.nodes.node_worktree_reconcile_effect --input <command.json>
  module: omnimarket.nodes.node_worktree_reconcile_effect.handlers.handler_worktree_reconcile
  class: HandlerWorktreeReconcile
  input_model: omnimarket.events.worktree_reconcile.ModelWorktreeReconcileCommand
descriptor:
  node_archetype: effect
  purity: side_effect
  idempotent: true
  timeout_ms: 3600000
  runtime_profiles:
  - effects
terminal_event: onex.evt.omnimarket.worktree-reconcile-run-completed.v1
# Publish only. The node reads the host's own filesystem, so a host timer runs
# it through __main__.py; a runtime container cannot see host worktrees and
# never dispatches it, which is why it subscribes to no topic and is declared an
# externally triggered ingress root.
event_bus:
  subscribe_topics: []
  publish_topics:
  - onex.evt.omnimarket.worktree-reconcile-decided.v1
  - onex.evt.omnimarket.worktree-reconcile-run-completed.v1
runtime_dispatch:
  external_trigger: true
# Host deployment facts are supplied by a typed overlay; no host paths ship here.
# `schedule --input <request.json>` calls HandlerWorktreeSchedule.handle(request).
# `tick --host <host> --overlay <overlay.yaml>` invokes the existing reconcile
# handler under a host-local lock and writes latest.json after event publication.
schedule:
  unit_name: onex-worktree-reconcile
  interval_seconds: 1800
  on_boot_seconds: 120
  timeout_seconds: 3600
  # The tick runs behind lane work, so it yields CPU, but it must still read its disk: at the
  # idle IO class one git read took 5 to 10 s on a lab host that served it in 0.1 s (OMN-22799),
  # and the 60 s git budget then fired on most trees. The installer writes these into the
  # unit's drop-in; nothing outside the installer sets them.
  resources:
    nice: 19
    io_scheduling_class: best-effort
    io_scheduling_priority: 7
    cpu_weight: 10
handler_routing:
  routing_strategy: operation_match
  # The reconcile handler is the node's canonical handler (handler: above). It is
  # named here as the default handler so the table does not drop it; the only routed
  # operation stays schedule, because the host CLI supplies the reconcile
  # handler's dependencies and a runtime cannot.
  default_handler: omnimarket.nodes.node_worktree_reconcile_effect.handlers.handler_worktree_reconcile:HandlerWorktreeReconcile
  handlers:
  - operation: schedule
    handler:
      module: omnimarket.nodes.node_worktree_reconcile_effect.handlers.handler_worktree_schedule
      name: HandlerWorktreeSchedule
    input_model: omnimarket.nodes.node_worktree_reconcile_effect.models.model_worktree_schedule.ModelWorktreeScheduleRequest
    output_model: omnimarket.nodes.node_worktree_reconcile_effect.models.model_worktree_schedule.ModelWorktreeScheduleResult
    overlay_example: models/overlay.example.yaml
    overlay_model: omnimarket.nodes.node_worktree_reconcile_effect.models.model_worktree_schedule.ModelWorktreeScheduleOverlay
externally_consumed_topics:
- onex.evt.omnimarket.worktree-reconcile-decided.v1
metadata:
  transport_type: kafka
inputs:
  host:
    type: str
    required: true
    description: Configured host identity.
  roots:
    type: list[str]
    required: true
    description: Worktree roots; each parent is the canonical clone registry.
  extra_clone_roots:
    type: list[str]
    required: false
    description: Standalone clone scan roots, maximum depth two, excluding canonical
      registries.
  ledger_path:
    type: str
    required: false
    description: Optional lane ledger path, parsed once per run.
  execute:
    type: bool
    required: false
    description: 'Default false: emit decisions without pinning or removal.'
  policy:
    type: object
    required: false
    description: Quiet/stale thresholds, clone policy, removal cap and merged_only
      (remove only merged work; every other removal rule is held at keep).
  decider_command:
    type: list[str]
    required: false
    description: 'Argv: facts-only JSON on stdin; decision records as a JSON list
      on stdout.'
  pin_command:
    type: list[str]
    required: false
    description: 'Argv with {path} and {branch} placeholders; exit 0 claims the pin.
      The node then requires origin to serve refs/heads/{branch} at the tree HEAD,
      read back with git ls-remote, before anything is removed.'
  merged_pr_command:
    type: list[str]
    required: false
    description: 'Argv with a {slug} placeholder; stdout lists the head commit of
      each merged pull request of that repository, one 40-digit id per line. A tree
      whose HEAD is one of them has pushed, landed work (reason pr_merged_head). Unset:
      no pull request evidence is read.'
  correlation_id:
    type: str
    required: true
    description: Run correlation UUID.
outputs:
  decided_events:
    type: list[object]
    description: Per-path facts, final decision and outcome.
  completed_event:
    type: object
    description: Run counts, freed bytes and paths requiring a human.
  errors:
    type: list[str]
    description: Run-level discovery or decider failures.
