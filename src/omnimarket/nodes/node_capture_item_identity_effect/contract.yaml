---
name: capture_item_identity_effect
contract_version:
  major: 1
  minor: 0
  patch: 0
node_type: effect
node_version:
  major: 1
  minor: 0
  patch: 0
description: Shared item identity, per-session per-stream producer sequence and
  barrier fields for the two Claude Code capture streams. A content record id is
  a uuid5 over the lineage event id and the field name; the event id of a hook
  call is settled between the lineage hook and the content hook through a
  per-session item state under a file lock; a producer sequence is issued from
  a lock-guarded counter. The callers' hooks load the handler module by file
  path, because a per-tool-call hook cannot pay a package import or a bus
  round-trip; the module level imports the standard library only. Three
  composite operations, stamp_lineage_event,
  stamp_content_records and session_barrier, let each hook make one call.
input_model: omnimarket.nodes.node_capture_item_identity_effect.models.ModelCaptureItemIdentityRequest
output_model: omnimarket.nodes.node_capture_item_identity_effect.models.ModelCaptureItemIdentityResult
handler:
  module: omnimarket.nodes.node_capture_item_identity_effect.handlers.handler_item_identity
  class: HandlerCaptureItemIdentity
  input_model: omnimarket.nodes.node_capture_item_identity_effect.models.ModelCaptureItemIdentityRequest
handler_routing:
  routing_strategy: payload_type_match
  handlers:
  - handler:
      name: HandlerCaptureItemIdentity
      module: omnimarket.nodes.node_capture_item_identity_effect.handlers.handler_item_identity
    event_model:
      name: ModelCaptureItemIdentityRequest
      module: omnimarket.nodes.node_capture_item_identity_effect.models
descriptor:
  node_archetype: effect
  purity: impure
  idempotent: false
  timeout_ms: 3000
  runtime_profiles:
  - effects
terminal_event: onex.evt.omnimarket.capture-item-identity-resolved.v1
event_bus:
  subscribe_topics:
  - onex.cmd.omnimarket.capture-item-identity-resolve.v1
  publish_topics:
  - onex.evt.omnimarket.capture-item-identity-resolved.v1
runtime_dispatch:
  command_topic: onex.cmd.omnimarket.capture-item-identity-resolve.v1
externally_consumed_topics:
- onex.evt.omnimarket.capture-item-identity-resolved.v1
metadata:
  transport_type: kafka
inputs:
  operation:
    type: string
    required: true
    description: One of content_record_id, claim_event_id, next_producer_seq,
      high_water, stamp_lineage_event, stamp_content_records, session_barrier.
  item_dir:
    type: string
    required: false
    description: The directory that holds the session's item state; read by
      claim_event_id, next_producer_seq and high_water.
  session_id:
    type: string
    required: false
    description: The session whose state is read; needed with item_dir.
  stream:
    type: string
    required: false
    description: lineage or content; read by claim_event_id, next_producer_seq
      and high_water.
  agent_id:
    type: string
    required: false
    description: The agent of the hook call, when a subagent made it.
  hook_event_name:
    type: string
    required: false
    description: The hook's event name; read by claim_event_id.
  discriminator:
    type: string
    required: false
    description: The value both hooks of a call read from the same stdin.
  minted_event_id:
    type: string
    required: false
    description: The event id this stream minted, kept when it is first of its pair.
  event_id:
    type: string
    required: false
    description: The lineage event id; read by content_record_id.
  field:
    type: string
    required: false
    description: The lineage field name; read by content_record_id.
  journal_dir:
    type: string
    required: false
    description: The capture journal directory; the item state is its sibling.
      Read by stamp_lineage_event, stamp_content_records and session_barrier.
  hook_input:
    type: object
    required: false
    description: The hook's stdin object, from which the item discriminator is
      read; read by stamp_lineage_event and stamp_content_records.
  payload:
    type: object
    required: false
    description: The mapped hook.event payload; read by stamp_lineage_event.
  records:
    type: array
    required: false
    description: The content records of one hook call in journal order, each
      with its content_kind; read by stamp_content_records.
  streams:
    type: array
    required: false
    description: The streams whose producer is on; read by session_barrier.
  content_capture_enabled:
    type: boolean
    required: false
    description: Whether content capture is enabled; read by session_barrier.
  barrier_id:
    type: string
    required: false
    description: The barrier's id, minted when absent; read by session_barrier.
  emitted_at:
    type: string
    required: false
    description: The barrier's timestamp, now when absent; read by
      session_barrier.
outputs:
  event_id:
    type: string
    description: The event id the stream uses for this call (claim_event_id).
  content_record_id:
    type: string
    description: The id of the content record that fulfils the field
      (content_record_id).
  sequence:
    type: integer
    description: The issued sequence number, or the stream's high-water
      (next_producer_seq, high_water).
  payload:
    type: object
    description: The lineage event with its settled event id, rebound content
      references, stream and producer_seq (stamp_lineage_event).
  records:
    type: array
    description: The content records with content_record_id, stream and
      producer_seq (stamp_content_records), or one barrier per stream
      (session_barrier).
