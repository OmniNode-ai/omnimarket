name: node_host_drift_plugin_revision_compute
lifecycle: experimental
node_type: compute
runtime_profiles:
- main
contract_version:
  major: 1
  minor: 0
  patch: 0
node_version:
  major: 1
  minor: 0
  patch: 0
description: Decide a plugin's host drift by installed revision, not version string, and route it through
  the plugin rules of the host-drift sync policy. Pure compute over typed probe facts (OMN-20689).
input_model:
  name: ModelPluginRevisionFacts
  module: omnimarket.models.model_plugin_revision
output_model:
  name: ModelPluginRevisionVerdict
  module: omnimarket.models.model_plugin_revision
handler:
  module: omnimarket.nodes.node_host_drift_plugin_revision_compute.handlers.handler_plugin_revision
  class: HandlerHostDriftPluginRevision
  input_model: omnimarket.models.model_plugin_revision.ModelPluginRevisionFacts
  output_model: omnimarket.models.model_plugin_revision.ModelPluginRevisionVerdict
handler_routing:
  routing_strategy: payload_type_match
  handlers:
  - handler:
      name: HandlerHostDriftPluginRevision
      module: omnimarket.nodes.node_host_drift_plugin_revision_compute.handlers.handler_plugin_revision
    event_model:
      name: ModelPluginRevisionFacts
      module: omnimarket.models.model_plugin_revision
event_bus:
  subscribe_topics:
  - onex.cmd.omnimarket.host-drift-plugin-revision-requested.v1
  publish_topics:
  - onex.evt.omnimarket.host-drift-plugin-revision-decided.v1
runtime_dispatch:
  command_topic: onex.cmd.omnimarket.host-drift-plugin-revision-requested.v1
descriptor:
  node_archetype: compute
  purity: pure
  idempotent: true
  timeout_ms: 10000
metadata:
  transport_type: kafka
  ticket: OMN-20689
  description: Plugin drift by revision; the plugin sync rules arrive in the input, read from their overlay by node_host_drift_plugin_rules_effect.
  tags:
  - host-drift
terminal_event: onex.evt.omnimarket.host-drift-plugin-revision-decided.v1
published_events:
- topic: onex.evt.omnimarket.host-drift-plugin-revision-decided.v1
  event_type: ModelPluginRevisionVerdict
externally_consumed_topics:
- onex.evt.omnimarket.host-drift-plugin-revision-decided.v1

# The broker grants the node's two topics need (coverage gate): the runtime login reads the request and writes the answer.
broker_acl_grants:
  - principal: "${ONEX_ACL_RUNTIME_PRINCIPAL}"
    grants:
      - {resource_type: TOPIC, pattern: LITERAL, name: onex.cmd.omnimarket.host-drift-plugin-revision-requested.v1, operation: READ}
      - {resource_type: TOPIC, pattern: LITERAL, name: onex.cmd.omnimarket.host-drift-plugin-revision-requested.v1, operation: DESCRIBE}
      - {resource_type: TOPIC, pattern: LITERAL, name: onex.evt.omnimarket.host-drift-plugin-revision-decided.v1, operation: WRITE}
      - {resource_type: TOPIC, pattern: LITERAL, name: onex.evt.omnimarket.host-drift-plugin-revision-decided.v1, operation: DESCRIBE}
