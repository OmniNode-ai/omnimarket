name: node_automation_liveness_overlay_check_effect
version: 0.1.0
description: >
  Reads the private automation-liveness overlay, its sources declaration and the candidate files of
  every registry clone, hands the text to the pure overlay completeness check and reports what it
  found; the onex-automation-liveness-check console script is its command line.
omnibase_core_compat: '>=0.47.31,<0.48.0'
entry_points:
  onex.nodes:
    node_automation_liveness_overlay_check_effect: omnimarket.nodes.node_automation_liveness_overlay_check_effect
capabilities:
  standalone: true
  full_runtime: false
  requires_network: false
  requires_repo: true
  requires_secrets: false
  requires_docker: false
  side_effect_class: filesystem
dependencies: []
license: MIT
authors:
- OmniNode Team
tags:
- effect
- liveness
- overlay
pack: liveness
display_name: Automation Liveness Overlay Check Effect
node_role: effect
