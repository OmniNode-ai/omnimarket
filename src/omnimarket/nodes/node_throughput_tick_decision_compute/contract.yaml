name: node_throughput_tick_decision_compute
node_type: compute
runtime_profiles: [main]
contract_version: {major: 1, minor: 0, patch: 0}
node_version: "1.0.0"
description: >-
  Definition-B deterministic decisions of the merge-throughput tick (OMN-20686). Turns the
  facts a caller read (launchd state and the PID's elapsed time, the landing controller's
  last tick lines, heartbeat and state.json, the PR watcher's state, the per-repo landing
  floors and the landing policy's land-like-operator logins) into the tick's finding lines
  and status line: controller liveness, merges per hour, repositories under their landing
  floor, and escalated PRs with the cause lease or park that covers them. Reads no files,
  runs no process, has no clock (the caller supplies now), mutates nothing. Behaviour-preserving
  port of the controller, merges, floors and escalation findings of the retired
  throughput_tick.py, and the lab-headroom finding from the pool, marks and receipts a caller read.
  OMN-20840: a park lasting past park_max_hours over a repository with zero merges is MISSING, an
  unread lab host is UNKNOWN, a runner receipt that ended without running is MISSING until its brief
  runs, and an open count rising more than open_rise_pct across three tick runs is MISSING.
input_model:
  name: ModelThroughputTickRequest
  module: omnimarket.nodes.node_throughput_tick_decision_compute.models.model_throughput_tick_decision
output_model:
  name: ModelThroughputTickResult
  module: omnimarket.nodes.node_throughput_tick_decision_compute.models.model_throughput_tick_decision
handler:
  module: omnimarket.nodes.node_throughput_tick_decision_compute.handlers.handler_throughput_tick_decision
  class: HandlerThroughputTickDecision
  input_model: omnimarket.nodes.node_throughput_tick_decision_compute.models.model_throughput_tick_decision.ModelThroughputTickRequest
  output_model: omnimarket.nodes.node_throughput_tick_decision_compute.models.model_throughput_tick_decision.ModelThroughputTickResult
handler_routing:
  routing_strategy: operation_match
  default_handler: omnimarket.nodes.node_throughput_tick_decision_compute.handlers.handler_throughput_tick_decision:HandlerThroughputTickDecision
  handlers:
    - operation: decide_throughput_tick
      handler:
        name: HandlerThroughputTickDecision
        module: omnimarket.nodes.node_throughput_tick_decision_compute.handlers.handler_throughput_tick_decision
descriptor:
  node_archetype: compute
  purity: pure
  idempotent: true
  timeout_ms: 1000
inputs:
  now: {type: str, required: true, description: ISO-Z time of the tick.}
  controller_max_minutes: {type: int, required: false}
  controller_run_max_minutes: {type: int, required: false}
  watcher_max_minutes: {type: int, required: false}
  min_merges_per_hour: {type: int, required: false}
  launchctl: {type: str, required: true, enum: [loaded, not_loaded, unavailable]}
  launchctl_error: {type: str, required: false}
  launchctl_stdout: {type: str, required: false}
  pid_etime: {type: str, required: false, description: Stripped ps etime output for the launchd PID.}
  ticks: {type: list, required: false, description: Newest complete controller tick lines, newest first, at most two.}
  ticks_error: {type: str, required: false}
  heartbeat_text: {type: str, required: false}
  heartbeat_write_error: {type: str, required: false, description: "`<path>: <error>` when the tick heartbeat file could not be written."}
  state_json: {type: object, required: false}
  watcher_path: {type: str, required: false}
  watcher_state: {type: object, required: false}
  watcher_read_error: {type: str, required: false}
  floors_per_repo: {type: object, required: false}
  floors_error: {type: str, required: false}
  policy_load_error: {type: str, required: false}
  policy_error: {type: str, required: false}
  land_like_operator: {type: list, required: false}
  lab_headroom: {type: object, required: false, description: "Pool hosts, marks, runner receipts and live placement markers; omitted skips the lab-headroom finding."}
  park_max_hours: {type: float, required: false, description: "A park over a floor-stalled repository with zero merges covers it only while it ends within this many hours (default 2)."}
  dispatch_window_hours: {type: float, required: false, description: "Runner receipts started this many hours back that ended without running are findings; omitted skips the dispatches finding."}
  open_history: {type: list, required: false, description: "Open counts earlier tick runs recorded, oldest first; omitted skips the open-trend finding."}
  open_rise_pct: {type: float, required: false}
  open_history_max_age_hours: {type: float, required: false}
outputs:
  lines: {type: list}
  status_line: {type: str}
  missing: {type: list}
  unknown: {type: list}
  checked: {type: list}
  exit_code: {type: int}
  open_count: {type: int, description: The open PR count of a fresh watcher state, for the caller to record.}
terminal_event: onex.evt.omnimarket.throughput-tick-decision-completed.v1
runtime_dispatch:
  command_topic: onex.cmd.omnimarket.throughput-tick-decision-requested.v1
event_bus:
  subscribe_topics:
    - onex.cmd.omnimarket.throughput-tick-decision-requested.v1
  publish_topics:
    - onex.evt.omnimarket.throughput-tick-decision-completed.v1
externally_consumed_topics:
  - onex.evt.omnimarket.throughput-tick-decision-completed.v1
metadata:
  transport_type: inmemory
  description: Merge-throughput tick decisions
  author: OmniNode Team
  created: "2026-10-09"
  related_tickets: [OMN-20686, OMN-20840]
