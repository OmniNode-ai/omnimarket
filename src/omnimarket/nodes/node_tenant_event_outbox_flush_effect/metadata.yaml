name: node_tenant_event_outbox_flush_effect
version: "0.1.0"
display_name: "Tenant Event Outbox Flush Effect"
description: >
  Publishes each unpublished tenant_event_outbox envelope to the tenant lifecycle topic and stamps it published only
  after the broker acknowledged it, so a tenant reaches the tenant registry mirror and its delegation terminals project.
omnibase_core_compat: ">=0.39.0,<1.0.0"
entry_points:
  onex.nodes:
    node_tenant_event_outbox_flush_effect: "omnimarket.nodes.node_tenant_event_outbox_flush_effect"
capabilities:
  standalone: false
  full_runtime: true
  requires_network: true
  requires_repo: false
  requires_secrets: true
  requires_docker: false
  side_effect_class: write
dependencies:
  - "asyncpg"
  - "omnibase_core>=0.39.0"
  - "omnibase-infra>=0.38.3,<0.39.0"
authors: ["OmniNode Platform Team"]
license: "MIT"
tags: ["tenant", "outbox", "flush", "effect", "postgres"]
pack: "tenant"
node_role: "effect"
