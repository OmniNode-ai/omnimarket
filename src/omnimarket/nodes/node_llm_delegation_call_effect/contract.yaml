---

# LLM Delegation Call EFFECT - ONEX Contract
# EFFECT node that executes LLM calls via httpx with health probes, event emission, and cost telemetry.

# === REQUIRED ROOT FIELDS ===
name: "node_llm_delegation_call_effect"
contract_version: {major: 0, minor: 1, patch: 0}
node_version: {major: 0, minor: 1, patch: 0}
uuid: "a3f7c821-9e4d-4b82-bc01-d5e6f2a38c14"
node_type: effect
input_model: "ModelLlmDelegationCallRequest"
output_model: "ModelLlmDelegationCallResult"
handler:
  module: omnimarket.nodes.node_llm_delegation_call_effect.handlers.handler_llm_delegation_call
  class: HandlerLlmDelegationCall
  input_model: omnimarket.nodes.node_llm_delegation_call_effect.models.model_llm_delegation_call_request.ModelLlmDelegationCallRequest
description: |
  LLM delegation call effect node. Executes LLM API calls via httpx against
  OpenAI-compatible endpoints, with health probe caching (60s TTL), per-call
  cost telemetry derived from the pricing manifest, and typed terminal event
  emission on success, escalation, or total failure.

  Endpoint authority is resolved by routing/contract configuration before this
  effect runs; the handler consumes the route-supplied endpoint URL.

# === RUNTIME PROFILES ===
descriptor:
  runtime_profiles:
    - effects

# === IO OPERATIONS ===
io_operations:
  - operation_type: "http_request"
    atomic: false
    timeout_seconds: 120
    validation_enabled: true

# === TOOL SPECIFICATION ===
tool_specification:
  tool_name: "llm_delegation_call_effect"
  main_tool_class: "NodeLlmDelegationCallEffect"

# === SERVICE CONFIGURATION ===
service_configuration:
  is_persistent_service: false
  requires_external_dependencies: true

config_dependencies:
  - key: "INFERENCE_PROTOCOL_CONFIG_PATH"
    required: false
    description: "Optional override for typed provider request-shaping profiles (defaults to configs/inference_protocols.v1.yaml)."

# === INPUT/OUTPUT STATE ===
input_state:
  object_type: "object"
  required: ["request_id", "correlation_id", "causation_id", "model_id", "endpoint_ref", "prompt", "prompt_hash"]
  optional: ["max_tokens", "temperature", "task_type", "task_id", "routing_policy_hash", "registry_hash", "pricing_manifest_version", "pricing_manifest_hash"]

output_state:
  object_type: "object"
  required: ["success", "request_id"]
  optional: ["content", "tokens_in", "tokens_out", "latency_ms", "actual_cost_usd", "failure_class", "error_message"]

# Endpoint authority is resolved by the routing/contract layer before this
# effect runs. ModelLlmDelegationCallRequest.endpoint_ref carries the resolved
# endpoint URL for compatibility with the existing wire field name.
env_vars: []

# =============================================================================
# EVENT BUS SUBCONTRACT - Runtime Routing Layer
# =============================================================================
event_bus:
  version:
    major: 1
    minor: 0
    patch: 0

  subscribe_topics:
    - "onex.cmd.omnimarket.delegation-execute.v1"
    - "onex.cmd.omnibase-infra.delegation-inference-request.v1"

  publish_topics:
    - "onex.evt.omnibase-infra.inference-response.v1"
    - "onex.evt.omnimarket.delegation-call-completed.v1"
    - "onex.evt.omnimarket.delegation-escalation-triggered.v1"
    - "onex.evt.omnimarket.delegation-all-tiers-failed.v1"
    - "onex.evt.omnimarket.delegation-model-degraded.v1"
    # OMN-17445: the address the consume boundary answers at when a record on
    # either subscribed topic fails for good. APPENDED, never prepended: the
    # dispatch-result applier resolves this contract's SUCCESS terminal as the
    # FIRST publish topic (this contract declares no top-level terminal_event),
    # so a prepended failure terminal would silently become the success
    # terminal and mis-route every returned model.
    - "onex.evt.omnibase-infra.inference-response-failed.v1"

  subscribe_topic_metadata:
    "onex.cmd.omnimarket.delegation-execute.v1":
      schema_ref: "omnimarket.nodes.node_llm_delegation_call_effect.models.model_llm_delegation_call_request.ModelLlmDelegationCallRequest"
      description: "Command to execute a single LLM delegation call for the given model and route-supplied endpoint URL."
    "onex.cmd.omnibase-infra.delegation-inference-request.v1":
      schema_ref: "omnibase_core.models.delegation.wire.ModelInferenceIntent"
      description: "Inference intent from the delegation orchestrator. Handler resolves base_url directly."

  publish_topic_metadata:
    "onex.evt.omnimarket.delegation-call-completed.v1":
      schema_ref: "omnimarket.models.delegation.llm_cost_routing.model_llm_delegation_completed_event.ModelLlmDelegationCompletedEvent"
      description: "Emitted when the LLM call succeeds. Carries full cost provenance."
    "onex.evt.omnimarket.delegation-escalation-triggered.v1":
      schema_ref: "omnimarket.models.delegation.llm_cost_routing.model_llm_delegation_escalation_triggered_event.ModelLlmDelegationEscalationTriggeredEvent"
      description: "Emitted when output fails quality gate and escalation to the next tier is triggered."
    "onex.evt.omnimarket.delegation-all-tiers-failed.v1":
      schema_ref: "omnimarket.models.delegation.llm_cost_routing.model_llm_delegation_all_tiers_failed_event.ModelLlmDelegationAllTiersFailedEvent"
      description: "Emitted when all model tiers fail. Terminal event — caller must handle error path."
    "onex.evt.omnimarket.delegation-model-degraded.v1":
      schema_ref: "omnimarket.models.delegation.llm_cost_routing.model_llm_delegation_model_degraded_event.ModelLlmDelegationModelDegradedEvent"
      description: "Emitted when a model exceeds the escalation rate threshold for a task type."
    "onex.evt.omnibase-infra.inference-response.v1":
      schema_ref: "omnibase_core.models.delegation.wire.ModelInferenceResponseData"
      description: "Inference response published to the orchestrator's subscribe topic after handling ModelInferenceIntent."
    "onex.evt.omnibase-infra.inference-response-failed.v1":
      schema_ref: "omnibase_infra.runtime.boundary_failure_terminal.ModelBoundaryFailureTerminal"
      description: "OMN-17445: emitted by omnibase_infra's auto-wired consume boundary — not by a handler here — when a record on this node's subscribed topics fails for good and the offset is about to advance over it."

# =============================================================================
# OMN-17445 -- WHY THIS DECLARATION EXISTS AND WHAT ARMING IT ALSO CHANGES.
#
# OMN-16812 gave the auto-wired consume boundary the ability to terminalize a
# handler failure it is about to ACK, but it refuses to guess an address: it
# publishes only onto the failing contract's OWN declared failure terminal, and
# only when `_declared_failure_terminal_topics` resolves EXACTLY ONE. This
# contract declared no terminal events at all, so that gate resolved zero and
# the emitter was inert here. A dispatch failure on the inference leg was
# DLQ'd safely, produced no terminal anywhere, and left the delegation FSM
# parked in ROUTED -- `delegation-failed.v1` never published, onex-api's
# workflow_terminal_consumer never fired, `gateway_workflows.status` stuck at
# 'published' with completed_at NULL. That is OMN-17397's incident reached
# through a door OMN-17397 did not shut.
#
# Declared under `runtime_dispatch` (as the routing reducer's is) because that
# is the site `runtime_local_ingress._extract_terminal_events` builds the
# Pattern B broker's subscription set from; both sites feed the one reader
# (`extract_terminal_event_topics`), so the broker's view and the boundary's
# view cannot drift apart. `success` is declared alongside `failure` and is
# NOT optional: with a failure entry alone the broker would treat
# `terminal_events[0]` -- the failure topic -- as this contract's success
# topic.
#
# THE SECOND EFFECT, MEASURED NOT ASSUMED. The same
# `_declared_failure_terminal_topics` also feeds
# `DispatchResultApplier(failure_terminal_topics=...)`, the OMN-15468 AC2
# guard that re-routes a RETURNED model stating a failure verdict off the
# success terminal. Declaring here arms that guard over this node's return
# values, so it was adjudicated before the declaration landed rather than
# after (tests/unit/delegation/test_omn17445_effect_and_gate_failure_terminals.py,
# band A):
#   * `ModelInferenceResponseData` with `error_message` set -- the normal
#     failure the tier-escalation ladder rides -- is NOT re-routed.
#     `resolve_terminal_verdict` reads exactly `terminal_failure_cause`,
#     `status`, `ok`, `success`, `contract_passed`; that model (frozen,
#     `extra="forbid"`) declares none of them, so the verdict is None and
#     routing is unchanged. The ladder is proven intact end-to-end against
#     real wiring, not argued.
#   * `ModelLlmDelegationCallResult` with `success=False` IS re-routed here,
#     and that is the intended improvement: it is absent from
#     `published_events`, so it was falling back onto
#     `inference-response.v1` -- a channel typed to
#     `ModelInferenceResponseData`, where it could never validate.
# =============================================================================
runtime_dispatch:
  terminal_events:
    success: "onex.evt.omnibase-infra.inference-response.v1"
    failure: "onex.evt.omnibase-infra.inference-response-failed.v1"

externally_consumed_topics:
  - "onex.evt.omnimarket.delegation-call-completed.v1"
  - "onex.evt.omnimarket.delegation-escalation-triggered.v1"
  - "onex.evt.omnimarket.delegation-all-tiers-failed.v1"
  - "onex.evt.omnimarket.delegation-model-degraded.v1"

# === HANDLER ROUTING ===
handler_routing:
  routing_strategy: "payload_type_match"
  handlers:
    - operation: "execute_delegation_call"
      event_type: "omnimarket.delegation-execute"
      event_model:
        name: "ModelLlmDelegationCallRequest"
        module: "omnimarket.nodes.node_llm_delegation_call_effect.models.model_llm_delegation_call_request"
      handler:
        name: "HandlerLlmDelegationCall"
        module: "omnimarket.nodes.node_llm_delegation_call_effect.handlers.handler_llm_delegation_call"
      description: "Execute one LLM delegation call (swarm/A2A path); handle() returns the terminal event (call-completed or all-tiers-failed), runtime auto-publishes via published_events (OMN-12409/F-a)."
    - operation: "execute_inference_intent"
      event_type: "omnibase-infra.delegation-inference-request"
      event_model:
        name: "ModelInferenceIntent"
        module: "omnibase_core.models.delegation.wire"
      handler:
        name: "HandlerInferenceIntent"
        module: "omnimarket.nodes.node_llm_delegation_call_effect.handlers.handler_inference_intent"
      description: "Handle ModelInferenceIntent from delegation orchestrator; publish ModelInferenceResponseData to inference-response.v1 (OMN-12294). event_model type-scopes the dispatcher + validates the payload before handle()."
  default_handler: "HandlerLlmDelegationCall"

# Maps HandlerInferenceIntent's returned model to its publish topic so the
# runtime dispatch-result applier routes ModelInferenceResponseData to
# inference-response.v1. event_type is the Model-prefix-stripped short class
# name the applier looks up (OMN-12294).
published_events:
  - event_type: "InferenceResponseData"
    topic: "onex.evt.omnibase-infra.inference-response.v1"
    description: "Inference response emitted by HandlerInferenceIntent for the delegation orchestrator."
  - event_type: "LlmDelegationCompletedEvent"
    topic: "onex.evt.omnimarket.delegation-call-completed.v1"
    description: "Terminal call-completed event returned by HandlerLlmDelegationCall.handle() on success."
  - event_type: "LlmDelegationAllTiersFailedEvent"
    topic: "onex.evt.omnimarket.delegation-all-tiers-failed.v1"
    description: "Terminal all-tiers-failed event returned by HandlerLlmDelegationCall.handle() on unhealthy endpoint."

# === DEPENDENCIES ===
dependencies:
  - name: httpx
    dependency_type: library
    description: Async HTTP client for OpenAI-compatible API calls
    required: true
  - name: omnimarket.models.delegation.llm_cost_routing
    dependency_type: internal
    description: Typed event models from OMN-11772
    required: true

# === PERFORMANCE ===
performance:
  max_response_time_ms: 120000

# === VALIDATION RULES ===
validation_rules:
  strict_typing_enabled: true
  input_validation_enabled: true
  output_validation_enabled: true
  performance_validation_enabled: false

# === TAGS ===
tags:
  - llm
  - delegation
  - effect
  - httpx
  - cost-telemetry
  - health-probe

metadata:
  transport_type: kafka
  demo_path: true  # OMN-12777: demo-path topic coherence gate scope marker
