---
name: node_integration_sweep_orchestrator
contract_version: {major: 1, minor: 0, patch: 0}
node_type: orchestrator
node_version: {major: 1, minor: 0, patch: 0}
description: >
  Writes deterministic integration sweep artifacts for explicit ticket scopes.

handler:
  module: omnimarket.nodes.node_integration_sweep_orchestrator.handlers.handler_integration_sweep_orchestrator
  class: HandlerIntegrationSweepOrchestrator
  input_model: omnimarket.nodes.node_integration_sweep_orchestrator.models.model_integration_sweep_orchestrator_request.ModelIntegrationSweepOrchestratorRequest

handler_routing:
  routing_strategy: operation_match
  handlers:
    - operation: sweep
      handler:
        name: HandlerIntegrationSweepOrchestrator
        module: omnimarket.nodes.node_integration_sweep_orchestrator.handlers.handler_integration_sweep_orchestrator
    - operation: surface_probes
      handler:
        name: surface_probes
        module: omnimarket.nodes.node_integration_sweep_orchestrator.handlers.surface_probes

env_dependencies:
  ONEX_CC_REPO_PATH:
    required: true
    description: "Path to the omni_home repo registry; required when artifact_root is not provided explicitly"

descriptor:
  node_archetype: orchestrator
  purity: impure
  runtime_profiles:
    - effects
  idempotent: true
  timeout_ms: 30000
terminal_event: onex.evt.omnimarket.integration-sweep-completed.v1

runtime_dispatch:
  command_topic: onex.cmd.omnimarket.integration-sweep.v1
  terminal_events:
    success: onex.evt.omnimarket.integration-sweep-completed.v1
    failure: onex.evt.omnimarket.integration-sweep-failed.v1
  default_timeout_ms: 30000
  max_timeout_ms: 300000

event_bus:
  subscribe_topics:
    - onex.cmd.omnimarket.integration-sweep.v1
  publish_topics:
    - onex.evt.omnimarket.integration-sweep-completed.v1
    - onex.evt.omnimarket.integration-sweep-failed.v1

externally_consumed_topics:
  - onex.evt.omnimarket.integration-sweep-completed.v1
  - onex.evt.omnimarket.integration-sweep-failed.v1

config:
  ONEX_CC_REPO_PATH:
    description: "Path to the omniclaude repository for Claude Code plugin operations."
    required: true
