#
# ONEX Node Contract
# Node: NodeReviewGateContextCompute
#
# The pure verdict of a required review check for one pull request head:
#
#   handle(ModelReviewGateContextRequest) -> ModelReviewGateContextDecision
#
# A pull request's head passes only on a CLEAN review verdict recorded for that exact head, or when the pull
# request belongs to a declared bypass class; every other head is a failure with a named reason. No clock, no I/O.
#
# The decision reuses the review verdict reading the landing decision already uses (read_head_review); it builds
# no second reading. It is called in process, so it has no event_bus; it is addressable through runtime_dispatch
# like the other directly-invoked compute nodes.
name: "node_review_gate_context_compute"
contract_name: "node_review_gate_context_compute"
node_name: "node_review_gate_context_compute"
lifecycle: experimental
node_type: "COMPUTE_GENERIC"
contract_version:
  major: 0
  minor: 1
  patch: 0
node_version:
  major: 0
  minor: 1
  patch: 0
description: >
  Pure decision of a required review check for one pull request head. The head passes only on a CLEAN review
  verdict recorded for that exact head, or when the pull request belongs to a declared bypass class; every other
  head is a failure with a named reason. No clock, no I/O.
input_model:
  name: "ModelReviewGateContextRequest"
  module: "omnimarket.models.model_review_gate_context"
  description: "The pull request subject and the declared review-gate context policy."
output_model:
  name: "ModelReviewGateContextDecision"
  module: "omnimarket.models.model_review_gate_context"
  description: "The check's state, named reason, bypass class, title and summary."
handler:
  module: "omnimarket.nodes.node_review_gate_context_compute.handlers.handler_review_gate_context"
  class: "HandlerReviewGateContext"
  input_model: "omnimarket.models.model_review_gate_context.ModelReviewGateContextRequest"
handler_routing:
  routing_strategy: "operation_match"
  default_handler: "omnimarket.nodes.node_review_gate_context_compute.handlers.handler_review_gate_context:HandlerReviewGateContext"
  handlers:
    - operation: "decide_review_gate_context"
      handler:
        name: "HandlerReviewGateContext"
        module: "omnimarket.nodes.node_review_gate_context_compute.handlers.handler_review_gate_context"
# Addressable the way the other directly-invoked compute nodes are; nothing publishes the command yet (the caller
# invokes the handler in process).
runtime_dispatch:
  command_topic: "onex.cmd.omnimarket.review-gate-context-requested.v1"
  terminal_events:
    success: "onex.evt.omnimarket.review-gate-context-completed.v1"
    failure: "onex.evt.omnimarket.review-gate-context-failed.v1"
descriptor:
  node_archetype: compute
  purity: pure
  idempotent: true
  timeout_ms: 1000
replay:
  deterministic: true
metadata:
  description: "Pure verdict of a required review check for one pull request head."
  author: "OmniNode Team"
  license: "MIT"
  created: "2026-11-15"
  ticket: "OMN-24614"
  tags:
    - compute
    - review-gate
    - pure
