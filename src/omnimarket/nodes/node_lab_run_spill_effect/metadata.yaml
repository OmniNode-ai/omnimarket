name: node_lab_run_spill_effect
version: 0.1.0
description: >
  Sparse-aware, byte-capped spill of idle lab run state to disk, with restore, worktree patch
  preservation and age-based pruning; skip names and patterns and the byte cap come from the overlay.
omnibase_core_compat: '>=0.47.31,<0.48.0'
entry_points:
  onex.nodes:
    node_lab_run_spill_effect: omnimarket.nodes.node_lab_run_spill_effect
capabilities:
  standalone: true
  full_runtime: false
  requires_network: false
  requires_repo: false
  requires_secrets: false
  requires_docker: false
  side_effect_class: destructive
dependencies:
- PyYAML>=6.0.3
license: MIT
authors:
- OmniNode Team
