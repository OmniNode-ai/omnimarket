# ONEX Node Contract - Delegation Scenario R4 Effect (OMN-23173, readiness plan A6)
#
# Scenario R4, every rung fails and time is shared fairly. One scheduled run drives the delegation skill handler with
# synthetic requests and rungs-mode probe ladders (rungs are loopback stubs this node starts): a rung stopped, a rung killed
# mid-call and a rung slowed past its deadline, each followed by a healthy rung, then a ladder with every rung down. Every
# assertion is a typed field of the delegation terminal or a byte comparison of the answer; no model judges a pass, a missing
# input is a failure and never a skip. The result is emitted on the bus and written as one ledger STATUS row (the row
# node_delegation_scenario_days_effect reads for the scenario's green days).
name: node_delegation_scenario_r4_effect
contract_name: node_delegation_scenario_r4_effect
node_name: node_delegation_scenario_r4_effect
contract_version: {major: 0, minor: 1, patch: 0}
node_version: {major: 0, minor: 1, patch: 0}
node_type: effect
lifecycle: experimental
runtime_profiles: [effects]

description: >
  Runs readiness scenario R4 once through the delegation skill handler with probe ladders, publishes the result on the bus
  and writes one ledger STATUS row. The node's own systemd user timer (`schedule install`) runs it every six hours.

handler:
  module: omnimarket.nodes.node_delegation_scenario_r4_effect.handlers.handler_scenario_r4
  class: HandlerScenarioR4
  input_model: omnimarket.nodes.node_delegation_scenario_r4_effect.handlers.handler_scenario_r4.ModelScenarioR4RunCommand

# Not a runtime-dispatched handler: HandlerScenarioR4 takes its contract runtime block, leg transport, ledger append route,
# event sink and clock as constructor parameters, so the node runs through its own CLI and schedule.

descriptor:
  node_archetype: effect
  runtime_profiles: [effects]
  purity: impure
  idempotent: false
  side_effects: [loopback-socket, file-write, ledger-append, bus-publish]
  timeout_ms: 900000

input_model:
  name: ModelScenarioR4RunCommand
  module: omnimarket.nodes.node_delegation_scenario_r4_effect.handlers.handler_scenario_r4
  description: One run of scenario R4; it carries no value.
output_model:
  name: ModelScenarioResult
  module: omnimarket.models.model_delegation_scenario
  description: The slot, trigger, conclusion and each assertion that held or did not.

terminal_event: onex.evt.omnimarket.delegation-scenario-result.v1

runtime_dispatch:
  external_trigger: true

event_bus:
  subscribe_topics: []
  publish_topics:
    - onex.evt.omnimarket.delegation-scenario-result.v1

externally_consumed_topics:
  - onex.evt.omnimarket.delegation-scenario-result.v1

runtime:
  home_env: OMNI_HOME
  ledger_append_command_env: ONEX_LEDGER_BUS_APPEND_COMMAND
  ledger_append_timeout_seconds: 60
  host_env: ONEX_HOST_NAME
  bus_emit_command_env: ONEX_BUS_EMIT_COMMAND
  # Every event is journalled here; when the deployment names a bus produce command in bus_emit_command_env it also gets the event.
  event_journal_relpath: .onex_state/delegation-scenario-r4/events.jsonl
  bus_emit_timeout_seconds: 60
  scenario_id: R4
  cadence: every_6h
  ticket: OMN-23173
  lane: node_delegation_scenario_r4_effect
  actor: script:node_delegation_scenario_r4_effect
  work_relpath: .onex_state/delegation-scenario-r4/work
  # loopback: one stub HTTP server per rung, called by the real delegation effect. inmemory: scripted typed replies.
  leg_backend: loopback
  loopback_host: 127.0.0.1
  probe_tenant_slug: readiness-probe
  inputs_relpath: inputs/r4_legs.yaml

schedule:
  unit_name: onex-delegation-scenario-r4
  state_directory: .onex_state/delegation-scenario-r4
  timeout_seconds: 900
  unit_environment: [ONEX_LEDGER_BUS_APPEND_COMMAND, ONEX_HOST_NAME, ONEX_BUS_EMIT_COMMAND]
  cadence:
    on_calendar: "*-*-* 00,06,12,18:20:00"
    time_zone: UTC
    randomized_delay: 0s
    persistent: false
    description: delegation readiness scenario R4, every six hours at minute 20 UTC

metadata:
  ticket: OMN-23173
  transport_type: inmemory
