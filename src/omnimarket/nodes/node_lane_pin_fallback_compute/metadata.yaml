name: node_lane_pin_fallback_compute
version: 1.0.0
description: Decide whether a remote lane whose pinned host refused it is placed again
  on any admitting host, and why. A pin only the caller gave is a preference; a host
  the brief requires, a priority holdback and a placement node that gave no answer
  keep the no-host outcome.
pack: distributed_validation
node_role: compute
display_name: Lane Pin Fallback Compute
omnibase_core_compat: '>=0.39.0,<1.0.0'
entry_points:
  onex.nodes:
    node_lane_pin_fallback_compute: omnimarket.nodes.node_lane_pin_fallback_compute
capabilities:
  standalone: false
  full_runtime: false
  requires_network: false
  requires_repo: false
  requires_secrets: false
  requires_docker: false
  side_effect_class: none
dependencies: []
