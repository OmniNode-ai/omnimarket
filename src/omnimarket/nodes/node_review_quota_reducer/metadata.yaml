name: node_review_quota_reducer
version: "0.1.0"
description: "admits a frontier review only while its route's preregistered weekly quota has room, and refuses it otherwise"
omnibase_core_compat: ">=0.39.0,<1.0.0"
entry_points:
  onex.nodes:
    node_review_quota_reducer: "omnimarket.nodes.node_review_quota_reducer"
capabilities:
  standalone: true
  # false until the review producers reserve here before each covered model call.
  full_runtime: false
  requires_network: false
  requires_repo: false
  requires_secrets: false
  requires_docker: false
  side_effect_class: read_only
dependencies: []
authors: ["OmniNode Platform Team"]
license: "MIT"
tags: ["reducer", "review", "quota", "preregistration", "pure"]
pack: "routing"
display_name: "Review Quota Reducer"
node_role: "reducer"
