name: node_floor_fill_lines_compute
version: "0.1.0"
description: "Floor fill lines compute: the tick names each startable floor line that no lane touched, as MISSING and NOTE lines in the tick's finding shape"
omnibase_core_compat: ">=0.39.0,<1.0.0"
entry_points:
  onex.nodes:
    node_floor_fill_lines_compute: "omnimarket.nodes.node_floor_fill_lines_compute"
capabilities:
  standalone: true
  # false until the fill orchestrator calls the handler in the runtime: auto-wiring
  # prepares this node as SKIPPED, since it has no bus surface of its own.
  full_runtime: false
  requires_network: false
  requires_repo: false
  requires_secrets: false
  requires_docker: false
  side_effect_class: none
dependencies:
  - "omnibase_core>=0.39.0"
authors: ["OmniNode Platform Team"]
license: "MIT"
tags: ["compute", "floor-fill", "pure"]
pack: "routing"
display_name: "Floor Fill Lines Compute"
node_role: "compute"
