name: node_secret_rotation_readback_effect
version: 1.0.0
description: Piece 5's rotation readback. After a rotation each declared consumer resolves its key from the store and completes one call; a consumer left on the old key reads NOT WORKING by name, and a rotation with no named approver is refused.
pack: operator_tooling
node_role: effect
display_name: Secret Rotation Readback Effect
omnibase_core_compat: '>=0.39.0,<1.0.0'
entry_points:
  onex.nodes:
    node_secret_rotation_readback_effect: omnimarket.nodes.node_secret_rotation_readback_effect
capabilities:
  standalone: true
  full_runtime: false
  requires_network: true
  requires_repo: false
  requires_secrets: true
  requires_docker: false
  side_effect_class: write
dependencies:
- pydantic>=2.0
- pyyaml>=6.0
authors:
- OmniNode Platform Team
license: MIT
tags:
- effect
- reading
- secrets
- rotation
