---
name: projection_llm_cost
contract_version: {major: 2, minor: 0, patch: 0}
node_type: reducer
node_version: {major: 2, minor: 0, patch: 0}
input_model: omnimarket.nodes.node_projection_llm_cost.handlers.handler_projection_llm_cost.ModelLlmCallCompletedEvent
description: >
  Projects llm-call-completed events into the llm_call_metrics table — the
  per-call read model the dashboard reads via node_projection_cost_token_usage
  (cost.token_usage.v1) and node_ab_compare_reducer (ab-compare.v1).
  SOW WARN blocker — cost tracking must be operational for budget compliance.
  Source topic: onex.evt.omniintelligence.llm-call-completed.v1.
  OMN-13001: this node owns llm_call_metrics. The aggregate read model
  (llm_cost_aggregates) is owned by node_projection_cost_summary, not here.

handler:
  module: omnimarket.nodes.node_projection_llm_cost.handlers.handler_llm_cost
  class: LlmCostProjectionRunner

handler_routing:
  routing_strategy: operation_match
  handlers:
    - operation: projection_llm_cost
      handler:
        name: LlmCostProjectionRunner
        module: omnimarket.nodes.node_projection_llm_cost.handlers.handler_llm_cost
      handler_module: omnimarket.nodes.node_projection_llm_cost.handlers.handler_llm_cost
      event_model: omnimarket.nodes.node_projection_llm_cost.handlers.handler_projection_llm_cost.ModelLlmCallCompletedEvent

env_dependencies:
  POSTGRES_HOST:
    required: false
    description: "Postgres host for direct DB connection fallback (OMNIDASH_ANALYTICS_DB_URL preferred)."
  POSTGRES_PORT:
    required: false
    description: "Postgres port for direct DB connection fallback (default 5436)."

terminal_event: onex.evt.omnimarket.projection-llm-cost-applied.v1

# Golden path: llm_cost chain (llm-call-completed -> llm_call_metrics table)
golden_path:
  - "Consume llm-call-completed event from onex.evt.omniintelligence.llm-call-completed.v1"
  - "Projection handler inserts per-call row into llm_call_metrics table"
  - "Dedup by input_hash (ON CONFLICT (input_hash) DO NOTHING — idempotent replay)"
  - "Emit projection-applied event to onex.evt.omnimarket.projection-llm-cost-applied.v1"
  - "Verify row exists with model_id, total_tokens, estimated_cost_usd, usage_source fields"
  - "Golden chain test: omnimarket/tests/test_golden_chain_projection_llm_cost.py"

db_io:
  db_tables:
    - name: llm_call_metrics
      migration: "0001_create_llm_call_metrics.sql"
      access: write
      database: omnidash_analytics
      role: per_call_metrics

event_bus:
  subscribe_topics:
    - onex.evt.omniintelligence.llm-call-completed.v1
  publish_topics:
    - onex.evt.omnimarket.projection-llm-cost-applied.v1

externally_consumed_topics:
  - onex.evt.omnimarket.projection-llm-cost-applied.v1

config:
  OMNI_PRICING_MANIFEST_PATH:
    description: "Path to the LLM pricing manifest JSON file."
    required: false
