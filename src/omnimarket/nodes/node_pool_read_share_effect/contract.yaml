name: node_pool_read_share_effect
lifecycle: experimental
node_type: EFFECT_GENERIC
runtime_profiles: []
contract_version:
  major: 1
  minor: 0
  patch: 0
node_version: 1.0.0
description: Share one capture of each pool probe (a host's ssh probe, its ping read, the launching host's
  own probe) between every placement for a short window, so the pool is read outside the placement lock
  and 150 waiting placements cost one read of each host. The answer is kept per probe in a dot directory
  of the placement directory, captured under that probe's own lock and written atomically; a failed capture
  is shared too. Also recounts the slot markers on readings made before the lock.
input_model:
  name: ModelPoolReadShareRequest
  module: omnimarket.nodes.node_pool_read_share_effect.models.model_pool_read_share
  description: Typed input for pool read share effect.
output_model:
  name: ModelPoolReadShareResult
  module: omnimarket.nodes.node_pool_read_share_effect.models.model_pool_read_share
  description: Typed output for pool read share effect.
handler:
  module: omnimarket.nodes.node_pool_read_share_effect.handlers.handler_pool_read_share
  class: HandlerPoolReadShare
  input_model: omnimarket.nodes.node_pool_read_share_effect.models.model_pool_read_share.ModelPoolReadShareRequest
  output_model: omnimarket.nodes.node_pool_read_share_effect.models.model_pool_read_share.ModelPoolReadShareResult
handler_routing:
  routing_strategy: operation_match
  default_handler: omnimarket.nodes.node_pool_read_share_effect.handlers.handler_pool_read_share:HandlerPoolReadShare
  handlers:
  - operation: handle
    handler:
      name: HandlerPoolReadShare
      module: omnimarket.nodes.node_pool_read_share_effect.handlers.handler_pool_read_share
event_bus:
  subscribe_topics: []
  publish_topics: []
runtime_dispatch:
  external_trigger: Direct Python invocation of HandlerPoolReadShare.handle with its typed request.
descriptor:
  node_archetype: effect
  purity: impure
  runtime_profiles: []
  idempotent: false
  timeout_ms: 5000
replay:
  requires_validator_version: true
  timestamp_authority: ingest_sequence
  deterministic: false
metadata:
  transport_type: local
  description: Pool Read Share Effect through local Python invocation.
  author: OmniNode Team
  created: '2026-10-24'
  tags:
  - effect
  - pool-read-share-effect
  related_tickets: []
