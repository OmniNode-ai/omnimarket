---
name: node_swarm_worker_agent
contract_name: node_swarm_worker_agent
node_name: node_swarm_worker_agent
contract_version: {major: 1, minor: 0, patch: 0}
node_version: {major: 1, minor: 0, patch: 0}
node_type: effect
description: >
  Worker agent that pulls subtask assignments from the work queue, executes
  them against a local model endpoint, and publishes results back. Designed
  for multi-site deployments where workers connect out to the runtime —
  no inbound connections required.

input_model:
  name: ModelWorkerAgentRequest
  class: ModelWorkerAgentRequest
  module: omnimarket.nodes.node_swarm_worker_agent.models.model_worker_agent_request

output_model:
  name: ModelWorkerAgentResult
  class: ModelWorkerAgentResult
  module: omnimarket.nodes.node_swarm_worker_agent.models.model_worker_agent_result

handler:
  name: HandlerSwarmWorkerAgent
  module: omnimarket.nodes.node_swarm_worker_agent.handlers.handler_swarm_worker_agent
  class: HandlerSwarmWorkerAgent

descriptor:
  node_archetype: effect
  purity: effectful
  idempotent: false
  timeout_ms: 300000
  runtime_profiles: [effects]

event_bus:
  version: {major: 1, minor: 0, patch: 0}
  plugin_managed: false
  subscribe_topics:
    - onex.cmd.omnimarket.swarm-subtask-assigned.v1
  publish_topics:
    - onex.evt.omnimarket.swarm-subtask-completed.v1

externally_consumed_topics:
  - onex.cmd.omnimarket.swarm-subtask-assigned.v1

terminal_event: onex.evt.omnimarket.swarm-subtask-completed.v1

published_events:
  - event_type: SwarmSubtaskCompleted
    topic: onex.evt.omnimarket.swarm-subtask-completed.v1
    description: Worker completed a subtask assignment and published the result.

io_operations:
  - http_call
  - kafka_subscribe
  - kafka_publish

error_handling:
  retry_policy:
    max_retries: 0
    initial_delay_ms: 0
    max_delay_ms: 0
    exponential_base: 1
    retry_on: []
  error_types:
    - name: HttpError
      description: HTTP call to local model endpoint failed
      recoverable: false
    - name: TimeoutError
      description: Per-subtask timeout exceeded
      recoverable: false

timeout_behavior:
  default_ms: 300000
  max_ms: 300000
  terminal_response:
    status: timeout
    error_message: "Worker subtask execution timed out"

metadata:
  transport_type: kafka
  author: OmniNode Team
  license: MIT
  created: "2026-05-25"
  tags: [effect, swarm, worker, worker-pull, multi-site, OMN-12000]
  related_tickets:
    - "OMN-12000"
