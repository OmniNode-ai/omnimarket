# ONEX Node Contract - Topic Reaper Compute (OMN-21594, hot-loading plan task A6, sections 3.11.7 and 3.11.9)
#
# Pure compute: folds one broker observation into the per-topic reaper record. A topic with no produce and no
# committed consume for the overlay's first interval is flagged; a flag that has stood for the overlay's second
# interval with the overlay's number of quiet observations makes the topic deletable. Nothing here has a default
# policy value: with none, nothing is flagged or deleted and REAPER_POLICY_MISSING is reported. Deletion itself is
# the guarded delete effect's (node_broker_topic_delete_effect); this node only names what may go.
name: node_topic_reaper_compute
contract_name: node_topic_reaper_compute
node_name: node_topic_reaper_compute
contract_version: {major: 1, minor: 0, patch: 0}
node_version: {major: 1, minor: 0, patch: 0}
node_type: COMPUTE_GENERIC
lifecycle: experimental
runtime_profiles: []

description: >
  Flags broker topics that nothing produces to or consumes from, and after a second interval and quiet
  observations names them deletable. Never flags a baseline, control or protected topic, a topic a boot-set
  contract subscribes to or publishes, or a topic whose evidence was not read; never hands out a topic with a
  live group member, moving end offsets or an unfinished-work reference; a re-announcement clears a flag.

handler:
  module: omnimarket.nodes.node_topic_reaper_compute.handlers.handler_topic_reaper
  class: HandlerTopicReaper
  input_model: omnimarket.nodes.node_topic_reaper_compute.models.model_topic_reaper.ModelTopicReaperRequest
  output_model: omnimarket.nodes.node_topic_reaper_compute.models.model_topic_reaper.ModelTopicReaperResult

handler_routing:
  routing_strategy: operation_match
  handlers:
    - operation: topic_reaper_observe
      handler:
        name: HandlerTopicReaper
        module: omnimarket.nodes.node_topic_reaper_compute.handlers.handler_topic_reaper

descriptor:
  node_archetype: compute
  purity: pure
  runtime_profiles: []
  idempotent: true
  side_effects: []
  timeout_ms: 10000

input_model:
  name: ModelTopicReaperRequest
  module: omnimarket.nodes.node_topic_reaper_compute.models.model_topic_reaper
  description: The injected clock, the lane's reaper policy, the broker observation, the prior records and the guard sets.
output_model:
  name: ModelTopicReaperResult
  module: omnimarket.nodes.node_topic_reaper_compute.models.model_topic_reaper
  description: The new records, one decision per topic, the delete targets and the counts.

# The reaper takes its observation from the caller (the broker reading effects) and declares no bus topic of
# its own: a topic would need a broker permission row, and the reaper is run in process by its caller.
runtime_dispatch:
  external_trigger: HandlerTopicReaper.handle, called in process by the broker reading effect with the injected clock and the observation

event_bus:
  subscribe_topics: []
  publish_topics: []

overlay:
  node: node_topic_reaper_compute
  roots_env: ONEX_SKILL_OVERLAY_ROOTS
  model: omnimarket.nodes.node_topic_reaper_compute.models.model_topic_reaper.ModelTopicReaperPolicy

replay:
  deterministic: true

metadata:
  ticket: OMN-21594
  transport_type: local

# The reaper lifecycle of hot-loading plan 3.11.9, run by core's FSM transition executor. The age guard reads the
# injected `interval_elapsed` value, never a clock.
state_machine:
  version: {major: 1, minor: 0, patch: 0}
  state_machine_name: topic_reaper_fsm
  state_machine_version: {major: 1, minor: 0, patch: 0}
  description: One topic, from active through flagged to deleted by topic id; both intervals are overlay values.
  initial_state: active
  terminal_states: [deleted]
  persistence_enabled: false
  states:
    - {version: {major: 1, minor: 0, patch: 0}, state_name: active, state_type: operational, description: a boot-set contract declares the topic, or it is not quiet}
    - {version: {major: 1, minor: 0, patch: 0}, state_name: flagged, state_type: operational, description: nothing produces or consumes; the flag time is recorded and nothing is deleted}
    - {version: {major: 1, minor: 0, patch: 0}, state_name: eligible, state_type: operational, description: the second interval has passed with the required quiet observations}
    - {version: {major: 1, minor: 0, patch: 0}, state_name: deleting, state_type: operational, description: the deletion was handed out by topic id}
    - {version: {major: 1, minor: 0, patch: 0}, state_name: deleted, state_type: terminal, is_terminal: true, is_recoverable: false, description: the broker no longer lists the topic}
  transitions:
    - {version: {major: 1, minor: 0, patch: 0}, transition_name: flag, from_state: active, to_state: flagged, trigger: last_declarer_withdrawn_or_removed}
    - {version: {major: 1, minor: 0, patch: 0}, transition_name: unflag, from_state: flagged, to_state: active, trigger: contract_re_announced}
    - version: {major: 1, minor: 0, patch: 0}
      transition_name: age_out
      from_state: flagged
      to_state: eligible
      trigger: interval_and_quiet_observations_met
      conditions:
        - {condition_name: interval_elapsed, condition_type: expression, expression: interval_elapsed == True, required: true}
    - {version: {major: 1, minor: 0, patch: 0}, transition_name: activity_seen, from_state: eligible, to_state: flagged, trigger: member_or_offset_movement_observed}
    - {version: {major: 1, minor: 0, patch: 0}, transition_name: unflag_late, from_state: eligible, to_state: active, trigger: contract_re_announced}
    - version: {major: 1, minor: 0, patch: 0}
      transition_name: delete_by_id
      from_state: eligible
      to_state: deleting
      trigger: deletion_issued
      conditions:
        - {condition_name: no_unfinished_work_reference, condition_type: expression, expression: unfinished_work_references == False, required: true}
    - {version: {major: 1, minor: 0, patch: 0}, transition_name: confirm_deleted, from_state: deleting, to_state: deleted, trigger: deletion_conclusive}
