# Synthetic values. The deployment's overlay lives at <root>/node_topic_reaper_compute/overlay.yaml under a root
# named in ONEX_SKILL_OVERLAY_ROOTS. One block per lane under `lanes`; no key has a default. A lane with no block
# (or no overlay file) gets REAPER_POLICY_MISSING and nothing is ever deleted.
#
#   quiet_days_before_flag        days with no produce and no committed consume before a topic is flagged
#   flag_to_delete_days           days a flag stands before the topic is deletable
#   quiet_observations_required   observations showing zero group members and unmoved end offsets before a delete
#   enforce                       whether the reaper hands out delete targets; false reports what would go
#   protected_prefixes            topic name prefixes never flagged
#   baseline_topics               exact baseline and control topic names never flagged
lanes:
  example-lane:
    quiet_days_before_flag: 14
    flag_to_delete_days: 3
    quiet_observations_required: 2
    enforce: false
    protected_prefixes: ["_", "__consumer_offsets"]
    baseline_topics: []
