name: "sentiment-classifier-v1"
description: "Basic sentiment classification correctness check"
min_score: 0.85
entries:
  - input: "This product is terrible and I want a refund"
    expected: "negative"
    scoring: "exact_match"
  - input: "Best purchase I've ever made"
    expected: "positive"
    scoring: "exact_match"
  - input: "It arrived on time"
    expected: "neutral"
    scoring: "exact_match"
  - input: "Absolutely love it, 5 stars"
    expected: "positive"
    scoring: "exact_match"
  - input: "Worst experience ever, never buying again"
    expected: "negative"
    scoring: "exact_match"
