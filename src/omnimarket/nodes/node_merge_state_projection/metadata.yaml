name: node_merge_state_projection
version: "1.0.0"
description: "Projects merge-flow state-transition events into a queryable monotonic-cursor projection for merge-flow telemetry (per-state duration, evidence-volume ratio, same-head reruns by reason)"
omnibase_core_compat: ">=0.39.0,<1.0.0"
entry_points:
  onex.nodes:
    node_merge_state_projection: "omnimarket.nodes.node_merge_state_projection"
capabilities:
  standalone: false
  full_runtime: true
  requires_network: true
  requires_repo: false
  requires_secrets: true
  requires_docker: false
  side_effect_class: read_write
dependencies:
  - "omnibase_core>=0.39.0"
authors: ["OmniNode Platform Team"]
license: "MIT"
tags: ["merge-state", "telemetry", "projection", "reducer", "evidence-volume-ratio"]
pack: "platform"
display_name: "Merge State Projection"
node_role: "reducer"
