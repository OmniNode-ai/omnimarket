# ONEX Node Contract - Delegation Scenario R9 Effect (OMN-24554, readiness plan A9)
#
# Scenario R9, malformed and injected tasks are refused. One scheduled run takes each committed bad request of the C11
# corpus (cases E1 to E6 and E11, the corpus the retired hosted probe published to a web service) and sends it as a raw
# bus command to the delegation runtime's command topic, then reads the typed refusal terminal the runtime answers with.
# It holds only when the positive control read over the bus lane completes first (a bus the corpus payloads cannot reach
# must never read as all refused) and every case is refused: the terminal failed, its failure_code is the declared refusal
# code, its retryable flag is the declared one, and its failure_reason names the declared field where one is named (E4's
# reason is redacted by the runtime, so it names none). Every assertion compares typed fields; no model judges a pass.
# The result is emitted on the bus and written as one ledger STATUS row (the row node_delegation_scenario_days_effect
# reads for the scenario's green days).
name: node_delegation_scenario_r9_effect
contract_name: node_delegation_scenario_r9_effect
node_name: node_delegation_scenario_r9_effect
contract_version: {major: 0, minor: 1, patch: 0}
node_version: {major: 0, minor: 1, patch: 0}
node_type: effect
lifecycle: experimental
runtime_profiles: [effects]

description: >
  Runs readiness scenario R9 once: it sends each committed malformed or injected request as a raw bus command to the
  delegation runtime and reads the typed refusal terminal, publishes the result on the bus and writes one ledger STATUS
  row. The node's own systemd user timer (`schedule install`) runs it every hour.

handler:
  module: omnimarket.nodes.node_delegation_scenario_r9_effect.handlers.handler_scenario_r9
  class: HandlerScenarioR9
  input_model: omnimarket.nodes.node_delegation_scenario_r9_effect.handlers.handler_scenario_r9.ModelScenarioR9RunCommand

# Not a runtime-dispatched handler: HandlerScenarioR9 takes its contract runtime block, corpus bus request, control lane,
# ledger append route, event sink and clock as constructor parameters, so the node runs through its own CLI and schedule.

descriptor:
  node_archetype: effect
  runtime_profiles: [effects]
  purity: impure
  idempotent: false
  side_effects: [http-read, bus-publish, file-write, ledger-append, bus-read]
  timeout_ms: 1800000

input_model:
  name: ModelScenarioR9RunCommand
  module: omnimarket.nodes.node_delegation_scenario_r9_effect.handlers.handler_scenario_r9
  description: One run of scenario R9; it carries no value.
output_model:
  name: ModelScenarioResult
  module: omnimarket.models.model_delegation_scenario
  description: The slot, trigger, conclusion and each assertion that held or did not.

terminal_event: onex.evt.omnimarket.delegation-scenario-result.v1

runtime_dispatch:
  external_trigger: true

# The result goes out through the host's bus emit command (runtime.bus_emit_command_env), the same way R8's does, under the
# identity that command runs as: the node opens no producer of its own, so it declares no publish topic of its own. Its
# terminal_event is still a use of the topic, and a new node's use needs a declared broker grant row (OMN-24005): the one
# the runtime identity needs to write the scenario result, declared here and applied only by the broker permission reconcile.
event_bus:
  subscribe_topics: []
  publish_topics:
    - onex.evt.omnimarket.delegation-scenario-result.v1

broker_acl_grants:
  - principal: "${ONEX_ACL_RUNTIME_PRINCIPAL}"
    grants:
      - {resource_type: TOPIC, pattern: LITERAL, name: onex.evt.omnimarket.delegation-scenario-result.v1, operation: WRITE}
      - {resource_type: TOPIC, pattern: LITERAL, name: onex.evt.omnimarket.delegation-scenario-result.v1, operation: DESCRIBE}

externally_consumed_topics:
  - onex.evt.omnimarket.delegation-scenario-result.v1

# The corpus bus: the package whose contract.yaml runtime_dispatch block names the command topic the bad requests are
# published on and the terminal_events.success/failure topics the answer is read from. The bus, lane and probe tenant of
# the control read are R8's: R9 declares no overlay document of its own and reads node_delegation_scenario_r8_effect's
# tenant_read block, the same bus, lane and probe tenant, so it opens the bus exactly as R8's tenant reads do.
bus:
  command_node: omnimarket.nodes.node_delegate_skill_orchestrator
  workspace_env: ONEX_WORKSPACE_CONFIG_ROOT

runtime:
  dev_readiness:
    host: h201
    port: 8085
    wait_seconds: 850
    poll_seconds: 5
  home_env: OMNI_HOME
  ledger_append_command_env: ONEX_LEDGER_BUS_APPEND_COMMAND
  ledger_append_timeout_seconds: 60
  host_env: ONEX_HOST_NAME
  bus_emit_command_env: ONEX_BUS_EMIT_COMMAND
  # Every event is journalled here; when the deployment names a bus produce command in bus_emit_command_env it also gets the event.
  event_journal_relpath: .onex_state/delegation-scenario-r9/events.jsonl
  bus_emit_timeout_seconds: 60
  scenario_id: R9
  cadence: hourly
  ticket: OMN-24554
  # The lane the green-days reader (node_delegation_scenario_days_effect) names for R9.
  lane: node_delegation_scenario_r9
  actor: script:node_delegation_scenario_r9_effect
  work_relpath: .onex_state/delegation-scenario-r9/work
  # R9 runs no probe ladder: these two keys are the shared runtime block's and are unused here.
  leg_backend: inmemory
  loopback_host: 127.0.0.1
  probe_tenant_slug: readiness-probe
  inputs_relpath: inputs/r9_run.yaml

schedule:
  unit_name: onex-delegation-scenario-r9
  state_directory: .onex_state/delegation-scenario-r9
  timeout_seconds: 900
  unit_environment: [ONEX_LEDGER_BUS_APPEND_COMMAND, ONEX_HOST_NAME, ONEX_WORKSPACE_CONFIG_ROOT, ONEX_BUS_EMIT_COMMAND]
  cadence:
    on_calendar: "*-*-* *:05:00"
    time_zone: UTC
    randomized_delay: 0s
    persistent: false
    description: delegation readiness scenario R9, hourly at 5 minutes past the hour UTC

metadata:
  ticket: OMN-24554
  transport_type: inmemory
