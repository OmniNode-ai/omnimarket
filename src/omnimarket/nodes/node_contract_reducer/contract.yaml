---
name: node_contract_reducer
contract_version: {major: 1, minor: 0, patch: 0}
node_type: reducer
node_version: {major: 1, minor: 0, patch: 0}

description: >
  Generic contract-driven state machine reducer. Accepts accumulated state,
  a user response, and a transition table declared in the calling contract.
  Evaluates the transition, merges any state updates, advances current_step,
  and reports whether the flow is terminal. Pure reducer — no I/O.

handler:
  module: omnimarket.nodes.node_contract_reducer.handlers.handler_contract_reducer
  class: HandlerContractReducer
  input_model: omnimarket.nodes.node_contract_reducer.models.model_reducer_input.ModelReducerInput

handler_routing:
  routing_strategy: operation_match
  handlers:
    - operation: reduce
      handler:
        name: HandlerContractReducer
        module: omnimarket.nodes.node_contract_reducer.handlers.handler_contract_reducer

descriptor:
  node_archetype: reducer
  purity: pure
  idempotent: true
  timeout_ms: 5000

inputs:
  current_state:
    type: dict
    description: "Accumulated state dict; must contain 'current_step' key"
    required: true
  user_response:
    type: str
    description: "The user's response token for the current step"
    required: true
  contract_transitions:
    type: list
    description: "Transition table from the calling contract"
    required: true

outputs:
  updated_state:
    type: dict
    description: "State after applying the transition"
  next_step:
    type: str
    description: "Step identifier the flow advances to"
  is_terminal:
    type: bool
    description: "True when next_step is 'done' or has no outgoing transition"

runtime_dispatch:
  command_topic: onex.cmd.omnimarket.contract-reducer.v1
  terminal_events:
    success: onex.evt.omnimarket.contract-reducer-completed.v1
    failure: onex.evt.omnimarket.contract-reducer-failed.v1

event_bus:
  subscribe_topics:
    - onex.cmd.omnimarket.contract-reducer.v1
  publish_topics:
    - onex.evt.omnimarket.contract-reducer-completed.v1
    - onex.evt.omnimarket.contract-reducer-failed.v1

externally_consumed_topics:
  - onex.evt.omnimarket.contract-reducer-completed.v1
  - onex.evt.omnimarket.contract-reducer-failed.v1

metadata:
  transport_type: kafka

# OMN-13734: machine-readable FSM (transcribed from authoritative handler/model logic).
state_machine:
  state_machine_name: contract_reducer_fsm
  initial_state: idle
  states:
    - state_name: idle
      description: "No contract reduction folded yet."
      required_data: []
    - state_name: reduced
      description: "Contract state projection materialized."
      required_data: []
    - state_name: failed
      description: "Contract reduction failed (terminal)."
      is_terminal: true
      required_data: []
  transitions:
    - from_state: idle
      to_state: reduced
      trigger: contract_reducer_request
      description: "Reduction requested."
    - from_state: reduced
      to_state: reduced
      trigger: contract_reducer_request
      description: "Fold another reduction request."
    - from_state: reduced
      to_state: reduced
      trigger: contract_reducer_completed
      description: "Re-observe own projection (idempotent)."
    - from_state: idle
      to_state: failed
      trigger: contract_reducer_failed
      description: "Reduction failed before any projection."
    - from_state: reduced
      to_state: failed
      trigger: contract_reducer_failed
      description: "Reduction failed."
  terminal_states: [failed]
  persistence_enabled: false
