# Explicit local source selection for exported keys; never an implicit lane fallback.
enable_convention_fallback: false
required_secrets: [LINEAR_API_KEY, GITHUB_TOKEN]
require_infisical_for_required_secrets: false
mappings:
  - logical_name: LINEAR_API_KEY
    source: {source_type: env, source_path: LINEAR_API_KEY}
  - logical_name: GITHUB_TOKEN
    source: {source_type: env, source_path: GITHUB_TOKEN}
