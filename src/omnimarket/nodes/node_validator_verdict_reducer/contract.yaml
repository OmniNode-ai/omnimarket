# ONEX Node Contract - Validator Verdict Reducer (OMN-23078)
#
# Folds the findings of the canonical validators that ran on one pull request head into that
# pull request's verdict, the ratchet baselines (one-way state: a baseline moves only in its
# declared direction, a reading against it is refused) and the floor's canonical-validator
# count. The fold is pure; the state lives in the injected verdict store, in memory by default
# and a JSON file when the overlay says store.backend: file (that store does I/O, so it lives in
# node_validator_workflow_orchestrator's adapters).
name: node_validator_verdict_reducer
contract_name: node_validator_verdict_reducer
node_name: node_validator_verdict_reducer
lifecycle: experimental
node_type: REDUCER_GENERIC
contract_version: {major: 1, minor: 0, patch: 0}
node_version: {major: 1, minor: 0, patch: 0}
description: >
  Folds one pull request head's validator outcomes and ratchet readings into the pull request's
  verdict (fail when a validator failed or errored, or a ratchet reading was refused), the
  one-way ratchet baselines and the count of canonical validators that have run.
input_model:
  name: ModelVerdictFoldRequest
  module: omnimarket.models.model_validator_verdict
  description: One pull request head's validator outcomes and ratchet readings.
output_model:
  name: ModelVerdictFoldResult
  module: omnimarket.models.model_validator_verdict
  description: The verdict, the ratchet moves, the canonical-validator count and the new state.
handler:
  module: omnimarket.nodes.node_validator_verdict_reducer.handlers.handler_validator_verdict_reducer
  class: HandlerValidatorVerdictReducer
  input_model: omnimarket.models.model_validator_verdict.ModelVerdictFoldRequest
  output_model: omnimarket.models.model_validator_verdict.ModelVerdictFoldResult
# Not a runtime-dispatched handler: HandlerValidatorVerdictReducer takes its overlay and store as
# constructor parameters; node_validator_workflow_orchestrator builds and calls it.
event_bus:
  subscribe_topics: []
  publish_topics: []
dependency_ownership:
  overlay: "Owned by node_validator_workflow_orchestrator, which loads the node overlay and constructs the handler in process."
  store: "Owned by node_validator_workflow_orchestrator, which builds the configured verdict store and injects it."
runtime_dispatch:
  external_trigger: Called by node_validator_workflow_orchestrator with one pull request head's outcomes.
descriptor:
  node_archetype: reducer
  purity: pure
  runtime_profiles: []
  idempotent: true
  timeout_ms: 2000
replay:
  deterministic: true
# On both backends (OMN-22911): the state store is in memory by default and a JSON file when
# the overlay says store.backend: file.
backends:
  default: in_memory
  in_memory:
    factory: omnimarket.nodes.node_validator_verdict_reducer.adapters.two_backend.make_in_memory_backend
  real:
    factory: omnimarket.nodes.node_validator_workflow_orchestrator.adapters.verdict_store.make_reducer_file_backend
    overlay_key: store.backend
  suite:
    scenario: omnimarket.nodes.node_validator_verdict_reducer.adapters.two_backend.scenario_ratchet_roundtrip
overlay:
  node: node_validator_verdict_reducer
  roots_env: ONEX_SKILL_OVERLAY_ROOTS
metadata:
  ticket: OMN-23078
  transport_type: inmemory
