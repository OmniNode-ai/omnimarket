name: node_temp_retention_effect
version: "1.0.0"
description: "Ages out unheld entries under a host's declared temp directories and bounds its package stores under declared ceilings, on the same windows as the run directories"
omnibase_core_compat: ">=0.39.0,<1.0.0"
entry_points:
  onex.nodes:
    node_temp_retention_effect: "omnimarket.nodes.node_temp_retention_effect"
capabilities:
  standalone: true
  full_runtime: true
  requires_network: false
  requires_repo: false
  requires_secrets: false
  requires_docker: false
  side_effect_class: destructive
dependencies:
  - "pyyaml>=6.0"
  - "pydantic>=2.0"
authors: ["OmniNode Platform Team"]
license: "MIT"
tags: ["retention", "temp", "disk", "systemd", "effect"]
pack: "install"
display_name: "Temp Retention Effect"
node_role: "effect"
