#
# ONEX Node Contract
# Node: NodePrLandingDecisionCompute
#
# One tick of the landing controller as a pure definition-B compute:
#
#   handle(ModelLandingFacts) -> ModelLandingDecision
#
# The rule set is the controller half of the TLC-checked landing controller
# model (fix-first results verified against push evidence, one lease per PR
# released only on confirmed termination, companion-first reconciliation by
# membership, blocked-chain gating, rebuild requests with idempotency keys
# written ahead of delivery). The fixed worker briefs are typed models in the
# output. No clock (observed_at is the snapshot's time), no I/O, no model.
#
# 0.2.0 adds shared red causes: red PRs in one repo failing one check with one
# normalized failure signature form a cluster, and one bounded cause worker is
# dispatched per cause (cause caps inside the pool, a two-attempt budget per
# park episode, a 12-hour park with one operator escalation, a fixer HOLD that
# revokes and dispatches nothing), with per-PR dispatch suppressed for the
# members of a leased, fixing or owned cause; a cause parked with no owner
# releases its members to per-PR dispatch (the fallback).
# An exit with no result after the spawn window spends an attempt (LC-F2), and the
# park's operator MSG is deduped against the ledger row, not the state (LC-F3);
# both from the T1 model, omnibase_internal#144.
#
# 0.3.0 names every gate: a gate suspension carries its gate_reasons (a closed
# vocabulary, one word per collector gate source) or the facts are refused. The
# decision lists every gated open PR with its reasons (gates), and every open,
# green, CLEAN PR with no merge on its head gets one named reason (land_skips);
# a tick that leaves such a PR with neither raises. A gate whose every reason's
# premise is a red head (companion_wait, autobind, pending_required,
# worker_gate) is released on a green, CLEAN head older than stale_gate_seconds
# (two ticks), so that head takes the ordinary merge path.
#
# 0.4.0 (OMN-20865) adds typed no-new-commits update readbacks and external
# shared-check verdict observations to the snapshot. A transient response
# permits one same-head update retry after update_retry_seconds; a green
# external verdict permits one rerun per member head, check and verdict id.
# A green head already armed and owned still receives a strict-base update;
# its other exclusions and the owned merge exclusion continue to apply.
# Neither a base SHA change nor an arbitrary 422 is evidence for these paths.
# Effects must collect these new optional facts; absent facts keep the
# previous behavior. This compute performs no collection or GitHub effects.
#
# Exhausted PRs and causes retain a typed exhaustion_owner in next_state,
# and their degraded rows carry that owner on every tick. Cause park actions
# carry it too. A live cause claimant takes precedence; otherwise a parked
# subject keeps its assignment, or adopts policy.exhaustion_owner. Ownership
# is accountability, never an extra attempt, a claim or a dispatch exclusion.
# A claim-sourced assignment returns to policy when its live claim ends.
# At composition, an explicit policy owner wins over the optional
# <root>/node_pr_landing_decision_compute/overlay.yaml (kind and name), then
# the exhaustion_owner declared below. The pure tick reads no overlay.
#
# The landing controller calls it in process, so it has no event_bus; it is
# addressable through runtime_dispatch like the other directly-invoked compute
# nodes. Experimental until the controller runs it (observe-only first).
name: "node_pr_landing_decision_compute"
contract_name: "node_pr_landing_decision_compute"
node_name: "node_pr_landing_decision_compute"
lifecycle: experimental
node_type: "COMPUTE_GENERIC"
contract_version:
  major: 0
  minor: 4
  patch: 0
node_version:
  major: 0
  minor: 4
  patch: 0
description: >
  Pure definition-B decision of one landing-controller tick. Reads one
  consistent snapshot (GitHub truth, the process-table probe of every lease,
  worker result files, producer acknowledgements and failures, and the
  controller's last state) and returns the tick's actions (merge pinned to a
  head, rerun, update-branch, eligibility rerun, companion rebuild or close,
  dispatch of a fixed worker brief or of one cause brief per shared red cause,
  kill, discard, observe-only, operator escalation of a parked cause), the
  outcomes recorded, DEGRADED reasons with named exhausted-subject owners,
  violations, the named gate of every
  gated PR, the named reason every green, CLEAN PR was not merged, and the
  next state to write ahead of acting. Deterministic in any input order.
  Fail-closed on its own coverage invariant: a tick that would leave an open,
  green, CLEAN PR with neither a merge on its head nor a named land_skip
  returns no decision and raises LandingCoverageError (deterministic for the
  same facts, no side effect), which runtime_dispatch reports on the declared
  failure terminal event; the caller acts on nothing from that tick.
input_model:
  name: "ModelLandingFacts"
  module: "omnimarket.nodes.node_pr_landing_decision_compute.models.model_landing_facts"
  description: "One tick's snapshot and the controller's last state."
output_model:
  name: "ModelLandingDecision"
  module: "omnimarket.nodes.node_pr_landing_decision_compute.models.model_landing_decision"
  description: "Actions, withheld observe-only actions, recorded outcomes, DEGRADED, violations, next state."
handler:
  module: "omnimarket.nodes.node_pr_landing_decision_compute.handlers.handler_pr_landing_decision"
  class: "HandlerPrLandingDecision"
  input_model: "omnimarket.nodes.node_pr_landing_decision_compute.models.model_landing_facts.ModelLandingFacts"
handler_routing:
  routing_strategy: "operation_match"
  default_handler: "omnimarket.nodes.node_pr_landing_decision_compute.handlers.handler_pr_landing_decision:HandlerPrLandingDecision"
  handlers:
    - operation: "decide_landing"
      handler:
        name: "HandlerPrLandingDecision"
        module: "omnimarket.nodes.node_pr_landing_decision_compute.handlers.handler_pr_landing_decision"
# HandlerLandingJoinJ8 is deliberately NOT a handler_routing entry. It is an
# EFFECT handler that takes an emission sink and a ModelJoinJ8Policy through its
# constructor, and the auto-wiring has no way to supply either: an entry that
# declares no event_model is granted EVERY contract subscribe_topic, so it would
# be wired as an independent consumer of the command topic below and throw on
# the mismatched payload, exactly the silent no-op node_build_loop_orchestrator
# records in its own contract. Nothing publishes `join_j8_landing_decision`:
# before this was removed, the operation appeared in this file and nowhere else
# in src, and only the J8 unit tests construct the handler. The landing
# controller calls it in process. OMN-23076; the entry arrived with OMN-22919.
# Addressable the way the other directly-invoked compute nodes are; nothing
# publishes the command yet (the controller calls the handler in process).
runtime_dispatch:
  command_topic: "onex.cmd.omnimarket.pr-landing-decision-requested.v1"
  terminal_events:
    success: "onex.evt.omnimarket.pr-landing-decision-completed.v1"
    failure: "onex.evt.omnimarket.pr-landing-decision-failed.v1"
descriptor:
  node_archetype: compute
  purity: pure
  idempotent: true
  timeout_ms: 1000
replay:
  deterministic: true
metadata:
  description: "Pure decision core of the landing controller."
  author: "OmniNode Team"
  license: "MIT"
  created: "2026-09-28"
  tags:
    - compute
    - pr-landing
    - landing-controller
    - pure
config:
  exhaustion_owner:
    kind: lane
    name: landing-controller
# OMN-22919, rebuild plan 4.1 join J8 (piece 8 to piece 9): the decision reads a lab-bound check run on the exact head
# and only a check carrying the current attempt's identity counts. The join handler answers piece 9's chain on the
# floor's emission contract under the correlation id piece 8's chain carries: a typed `upstream_` refusal that never
# started when the check is missing, superseded or failing, and a start then a success or a typed failure otherwise.
# Nothing of this is spelled in code. The pure decision itself is unchanged for a PR that carries no lab_check fact.
join_j8:
  join_id: "J8"
  from_piece: 8
  to_piece: 9
  emission_node: "node_pr_landing_decision_compute"
  missing_failure_code: "upstream_lab_check_missing"
  superseded_failure_code: "upstream_lab_check_superseded"
  failed_failure_code: "upstream_lab_check_failed"
  not_merged_failure_code: "landing_not_merged"
# The in-process join handler, bound here and not in handler_routing so the
# canonical-file-shape ratchet finds it inside this node while the auto-wiring,
# which reads only handler_routing, never constructs it (OMN-23076).
in_process_handlers:
  join_j8:
    handler:
      module: "omnimarket.nodes.node_pr_landing_decision_compute.handlers.handler_landing_join_j8"
      class: "HandlerLandingJoinJ8"
