  requires_network: false
  requires_repo: false
  requires_secrets: false
  requires_docker: false
  side_effect_class: read_only
dependencies: []
authors: ["OmniNode Platform Team"]
license: "MIT"
tags: ["compute", "pr-landing", "landing-controller", "pure"]
pack: "pr_lifecycle"
display_name: "PR Landing Decision"
