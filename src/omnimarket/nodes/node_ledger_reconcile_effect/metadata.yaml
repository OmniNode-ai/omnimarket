name: node_ledger_reconcile_effect
version: "0.1.0"
description: "Effect: the I/O of a ledger reconciliation - read the rolling ledger, its archives, the clone registry and the live roster, verify cited pull requests and commits, append the rows the decision planned through the ledger writer. Decisions are node_ledger_reconcile_compute's. Hosted by a serve process on the host that holds the ledger, never by a shared runtime."
pack: operator_tooling
node_role: effect
display_name: "Ledger Reconcile Effect"
omnibase_core_compat: ">=0.47.31,<0.48.0"
entry_points:
  onex.nodes:
    node_ledger_reconcile_effect: "omnimarket.nodes.node_ledger_reconcile_effect"
capabilities:
  standalone: false
  full_runtime: false
  requires_network: true
  requires_repo: true
  requires_secrets: false
  requires_docker: false
  side_effect_class: write
dependencies:
- pydantic>=2.0
- pyyaml>=6.0
license: "MIT"
authors: ["OmniNode Team"]
tags: ["effect", "ledger", "reconcile"]
