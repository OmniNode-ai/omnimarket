# ONEX Node Contract - Delegated Test Control Compute (OMN-19361)
#
# Task T5 of the delegated test loop first slice (knowledge-base-internal
# beta/plans/2026-09-23-delegated-test-loop-first-slice.md). Pure def-B
# compute: handle(request: ModelControlGradeRequest) -> ModelControlGrade.
# The delegated test loop orchestrator (T6) invokes it in-process;
# runtime_dispatch declares the command and terminal topics the same way
# the other directly-invoked compute nodes do.
name: "node_delegated_test_control_compute"
lifecycle: experimental
node_type: "COMPUTE_GENERIC"
runtime_profiles: [main]
contract_version:
  major: 0
  minor: 1
  patch: 0
node_version: "0.1.0"
description: >
  Pure computation: grades a generated test's must-fail control. Maps
  the fixed-ref outcome (which must be passed), the pre-fix outcome, the
  optional mutation outcome and whether the pre-fix ref equals the fixed
  ref to one status: accepted_call, accepted_mutation (both
  headline-grade), accepted_collection (accepted-weak),
  control_did_not_fail, needs_mutation_control or infra_error. The
  negative control never accepts. Zero I/O; deterministic.
input_model:
  name: "ModelControlGradeRequest"
  module: "omnimarket.nodes.node_delegated_test_control_compute.models.model_delegated_test_control"
  description: "The compute's typed input."
output_model:
  name: "ModelControlGrade"
  module: "omnimarket.nodes.node_delegated_test_control_compute.models.model_delegated_test_control"
  description: "The compute's typed output."
handler:
  module: "omnimarket.nodes.node_delegated_test_control_compute.handlers.handler_delegated_test_control"
  class: "HandlerDelegatedTestControl"
  input_model: "omnimarket.nodes.node_delegated_test_control_compute.models.model_delegated_test_control.ModelControlGradeRequest"
handler_routing:
  routing_strategy: "operation_match"
  default_handler: "omnimarket.nodes.node_delegated_test_control_compute.handlers.handler_delegated_test_control:HandlerDelegatedTestControl"
  handlers:
    - operation: "grade_delegated_test_control"
      handler:
        name: "HandlerDelegatedTestControl"
        module: "omnimarket.nodes.node_delegated_test_control_compute.handlers.handler_delegated_test_control"
descriptor:
  node_archetype: compute
  purity: pure
  idempotent: true
  timeout_ms: 500
outputs:
  status:
    type: str
  headline:
    type: str
  control_ref_role:
    type: str
  control_outcome:
    type: str
  reason:
    type: str
runtime_dispatch:
  command_topic: "onex.cmd.omnimarket.delegated-test-control-requested.v1"
  terminal_events:
    success: "onex.evt.omnimarket.delegated-test-control-completed.v1"
    failure: "onex.evt.omnimarket.delegated-test-control-failed.v1"
metadata:
  transport_type: inmemory
  description: "Delegated Test Control Compute (no external transport)"
  author: "OmniNode Team"
  created: "2026-09-23"
  tags:
    - "compute"
    - "delegated-test-loop"
    - "OMN-19361"
  related_tickets:
    - "OMN-19361"
