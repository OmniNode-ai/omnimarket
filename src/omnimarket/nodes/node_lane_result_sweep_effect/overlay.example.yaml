# Synthetic values. The deployment's overlay lives at
# <root>/node_lane_result_sweep_effect/overlay.yaml under a root named in ONEX_SKILL_OVERLAY_ROOTS.
# No key has a default.
ledger_read:
  route: file
  path_env: EXAMPLE_LEDGER_FILE
  archive_subdir: archive
  timeout_seconds: 60
  row_limit: 200000
ledger_append:
  command_env: ONEX_LEDGER_BUS_APPEND_COMMAND
  host_env: ONEX_LEDGER_HOST_NAME
  timeout_seconds: 90
publish:
  lane: lane-result-sweep
  actor: node:node_lane_result_sweep_effect
  piece: 12
  action_deadline_seconds: 3600
source: lane
producer: remote-lane-runner
normalizer_facts:
  configuration:
    strip_stages:
    - name: tickets
      kind: regex
      pattern: \b[A-Z]{2,8}-\d+\b
      replacement: <ticket>
    - name: numbers
      kind: regex
      pattern: \b\d+(?:\.\d+)?\b
      replacement: <number>
    producer_adapters:
    - source: lane
      producer: remote-lane-runner
      unique_codes: false
    lane_name_patterns: []
    max_open_triage: 4
  hosts: []
outcome_classes:
  done: done
  complete: done
  delivered: done
  pass_evidence: done
  handed-off: handed-off
  skipped-owned: skipped-owned
  skipped: skipped-owned
  skipped-built: skipped-owned
  skipped-already-built: skipped-owned
  skipped-superseded: skipped-owned
  superseded: skipped-owned
  partial: partial
  prepared-draft: partial
  blocked: blocked
  failed: failed
  fail_contract_refused: failed
  rejected-no-delegation: failed
  timeout: failed
  abandoned: failed
  unknown: unknown
result_classes:
  blocked: blocked
  external_blocker: blocked
  cause_found_fix_needs_credential_owner: blocked
  no_result_file: failed
  push_failed: failed
  push_timeout: failed
  codex_capacity_retry: failed
  fix_submitted: handed-off
  cause_fix_submitted: handed-off
  close_superseded: handed-off
  armed: handed-off
  waiting_ci: handed-off
  cause_not_shared: handed-off
  handed-off: handed-off
  done: done
error_rule_document:
  error_rules:
  - id: example-rule
    class_keys:
    - lane.remote-lane-runner.template.0000000000
    mode: shadow
    action:
      kind: fill-backlog-item
