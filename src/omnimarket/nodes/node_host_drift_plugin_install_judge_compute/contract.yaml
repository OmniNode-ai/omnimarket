name: node_host_drift_plugin_install_judge_compute
lifecycle: experimental
node_type: compute
runtime_profiles:
- main
contract_version:
  major: 1
  minor: 0
  patch: 0
node_version:
  major: 1
  minor: 0
  patch: 0
description: Judge one plugin repair attempt from the installed record before and after it. An install that exits 0 and
  leaves the installed revision and version unchanged is ALERT_ONLY with its reason, spends no fix attempt and is not
  retried identically; a failed install is FAILED; an install that moved the revision or version is APPLIED (OMN-24194).
input_model:
  name: ModelPluginInstallObservation
  module: omnimarket.models.model_plugin_install_judgement
output_model:
  name: ModelPluginInstallJudgement
  module: omnimarket.models.model_plugin_install_judgement
handler:
  module: omnimarket.nodes.node_host_drift_plugin_install_judge_compute.handlers.handler_plugin_install_judge
  class: HandlerHostDriftPluginInstallJudge
  input_model: omnimarket.models.model_plugin_install_judgement.ModelPluginInstallObservation
  output_model: omnimarket.models.model_plugin_install_judgement.ModelPluginInstallJudgement
handler_routing:
  routing_strategy: payload_type_match
  handlers:
  - handler:
      name: HandlerHostDriftPluginInstallJudge
      module: omnimarket.nodes.node_host_drift_plugin_install_judge_compute.handlers.handler_plugin_install_judge
    event_model:
      name: ModelPluginInstallObservation
      module: omnimarket.models.model_plugin_install_judgement
event_bus:
  subscribe_topics:
  - onex.cmd.omnimarket.host-drift-plugin-install-judge-requested.v1
  publish_topics:
  - onex.evt.omnimarket.host-drift-plugin-install-judged.v1
runtime_dispatch:
  command_topic: onex.cmd.omnimarket.host-drift-plugin-install-judge-requested.v1
descriptor:
  node_archetype: compute
  purity: pure
  idempotent: true
  timeout_ms: 10000
metadata:
  transport_type: kafka
  ticket: OMN-24194
  description: Plugin repair attempt judgement; the installer's exit code and the installed record before and after arrive in the input.
  tags:
  - host-drift
terminal_event: onex.evt.omnimarket.host-drift-plugin-install-judged.v1
published_events:
- topic: onex.evt.omnimarket.host-drift-plugin-install-judged.v1
  event_type: ModelPluginInstallJudgement
externally_consumed_topics:
- onex.evt.omnimarket.host-drift-plugin-install-judged.v1

# The broker grants the node's two topics need (coverage gate): the runtime login reads the request and writes the answer.
broker_acl_grants:
  - principal: "${ONEX_ACL_RUNTIME_PRINCIPAL}"
    grants:
      - {resource_type: TOPIC, pattern: LITERAL, name: onex.cmd.omnimarket.host-drift-plugin-install-judge-requested.v1, operation: READ}
      - {resource_type: TOPIC, pattern: LITERAL, name: onex.cmd.omnimarket.host-drift-plugin-install-judge-requested.v1, operation: DESCRIBE}
      - {resource_type: TOPIC, pattern: LITERAL, name: onex.evt.omnimarket.host-drift-plugin-install-judged.v1, operation: WRITE}
      - {resource_type: TOPIC, pattern: LITERAL, name: onex.evt.omnimarket.host-drift-plugin-install-judged.v1, operation: DESCRIBE}
