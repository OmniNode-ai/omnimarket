# ONEX Node Contract - OCC Companion Compute (RSD-1, OMN-14285)
#
# The pure, stateless, deterministic "what the OCC companion must be": renders the
# exact companion files (contract, downstream receipt, self-bind, two-audiences
# supersede) + stamped product body from PR + OCC state gathered UP FRONT. Zero
# I/O. Doubles as the OMN-14055 attestation oracle (the gate re-invokes this same
# handler and byte-diffs the deterministic subset).
#
# Related Tickets:
#   - OMN-14285: define the OCC-producer node graph + retire the bespoke adapters
#   - OMN-14233: per-entry hashing / two-audiences supersession (T3)
#   - OMN-14055: COMPUTE-node-as-attestation-oracle (RSD-5, consumes this handler)
name: "node_occ_companion_compute"
lifecycle: experimental
node_type: "COMPUTE_GENERIC"
contract_version:
  major: 1
  minor: 0
  patch: 0
node_version: "1.0.0"
description: "Pure computation: renders the deterministic OCC companion plan (files + stamped body + attestation fingerprint) from PR + OCC state with zero I/O."
input_model:
  name: "ModelOccCompanionRequest"
  module: "omnimarket.nodes.node_occ_companion_compute.models.model_occ_companion_request"
  description: "All PR + OCC state, gathered up front by the read-EFFECT."
output_model:
  name: "ModelOccCompanionPlan"
  module: "omnimarket.nodes.node_occ_companion_compute.models.model_occ_companion_plan"
  description: "The deterministic companion plan: net-new files + stamped body + reproducibility fingerprint."
handler_routing:
  routing_strategy: "operation_match"
  handlers:
    - operation: "compute_companion_plan"
      handler:
        name: "HandlerOccCompanionCompute"
        module: "omnimarket.nodes.node_occ_companion_compute.handlers.handler_occ_companion_compute"
metadata:
  transport_type: kafka
  description: "OCC companion compute node — pure deterministic producer + attestation oracle"
  author: "OmniNode Team"
  created: "2026-07-10"
  tags:
    - "compute"
    - "occ"
    - "companion"
    - "attestation-oracle"
    - "OMN-14285"
  related_tickets:
    - "OMN-14285"
    - "OMN-14233"
    - "OMN-14055"
