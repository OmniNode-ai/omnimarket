# ONEX Node Contract - Seam Read Orchestrator (OMN-21459)
#
# The factory line as one graph: the backlog, then alternately a seam reading and a station,
# ending with the last seam reading. This file is the one registry of the line: a seam node is a
# COMPUTE_GENERIC reading (a pure classification of supplied crossings); a station node is an
# EFFECT_GENERIC endpoint that carries no operation. A seam's step_config names its classify
# operation, its canonical `shape` or the named `gap` that stands in for one (a seam with a gap
# reads as unbound), and, where it has one, `bound_minutes`.
#
# This task writes the contract and a pure handler that lists the seam readings in line order;
# walking the graph and the node that gathers the facts arrive with the tasks that read the
# seams, so this node has no topic yet.
#
# The graph is not the `seams:` declaration that node_seam_graph_compute extracts or the
# projection that node_seam_match_compute compares: those are code seams between repositories
# (a producer and a consumer of one topic), not the crossings of a work item from station to
# station.
name: node_seam_read_orchestrator
contract_name: node_seam_read_orchestrator
node_name: node_seam_read_orchestrator
contract_version: {major: 1, minor: 0, patch: 0}
node_version: {major: 1, minor: 0, patch: 0}
node_type: orchestrator
lifecycle: experimental
runtime_profiles: [effects]

description: >
  Read every seam of the factory line from backlog to running, in line order. The execution
  graph below is the registry of the line: 14 seam readings between 13 stations and the backlog.
  The second graph, view_seam_read, declares the 17 seams of the view-centric interfaces.

descriptor:
  node_archetype: orchestrator
  purity: impure
  idempotent: false
  timeout_ms: 60000

handler:
  module: omnimarket.nodes.node_seam_read_orchestrator.handlers.handler_seam_read_plan
  class: HandlerSeamReadPlan
  input_model: omnimarket.nodes.node_seam_read_orchestrator.models.model_seam_read_plan.ModelSeamReadPlanRequest

# Bindings: the event bus and the clock. The seam readers it calls take facts and `now` and
# depend on no protocol.
protocol_dependencies:
  - name: BUS
    protocol: omnibase_core.protocols.event_bus.protocol_event_bus:ProtocolEventBus
    bind_as: bus
    required: true
  - name: CLK
    protocol: omnimarket.protocols.protocol_clock:ProtocolClock
    bind_as: clock
    required: true

workflow_coordination:
  workflow_definition:
    workflow_metadata:
      workflow_name: factory_line_seam_read
      workflow_version: {major: 1, minor: 0, patch: 0}
      description: Read every seam of the factory line from backlog to running, in line order.
    execution_graph:
      nodes:
      - {node_id: backlog, node_type: EFFECT_GENERIC, description: Backlog (source)}
      - node_id: sm_00_backlog_to_fill
        node_type: COMPUTE_GENERIC
        description: SM-00 backlog to fill
        depends_on: [backlog]
        step_config: {operation: classify_sm_00, shape: ModelBacklogItem}
      - node_id: st01_fill
        node_type: EFFECT_GENERIC
        description: St1 Fill
        depends_on: [sm_00_backlog_to_fill]
      - node_id: sm_01_fill_to_brief
        node_type: COMPUTE_GENERIC
        description: SM-01 fill to brief
        depends_on: [st01_fill]
        step_config: {operation: classify_sm_01, shape: ModelIdleSlotFillResult, gap: GAP-2}
      - node_id: st02_brief
        node_type: EFFECT_GENERIC
        description: St2 Brief
        depends_on: [sm_01_fill_to_brief]
      - node_id: sm_02_brief_to_runner
        node_type: COMPUTE_GENERIC
        description: SM-02 brief to runner
        depends_on: [st02_brief]
        step_config: {operation: classify_sm_02, shape: ModelWorkLedgerAppendRequest, gap: GAP-3}
      - node_id: st03_runner
        node_type: EFFECT_GENERIC
        description: St3 Runner
        depends_on: [sm_02_brief_to_runner]
      - node_id: sm_03_runner_to_placement
        node_type: COMPUTE_GENERIC
        description: SM-03 runner to placement
        depends_on: [st03_runner]
        step_config: {operation: classify_sm_03, shape: ModelRemoteLanePlacementRequest, gap: GAP-4, bound_minutes: 5}
      - node_id: st04_placement
        node_type: EFFECT_GENERIC
        description: St4 Placement
        depends_on: [sm_03_runner_to_placement]
      - node_id: sm_04_placement_to_lane_run
        node_type: COMPUTE_GENERIC
        description: SM-04 placement to lane run
        depends_on: [st04_placement]
        step_config: {operation: classify_sm_04, shape: ModelCodexSandboxProbeRequest, bound_minutes: 5}
      - node_id: st05_lane_run
        node_type: EFFECT_GENERIC
        description: St5 Lane run
        depends_on: [sm_04_placement_to_lane_run]
      - node_id: sm_05_lane_run_to_commit
        node_type: COMPUTE_GENERIC
        description: SM-05 lane run to commit and push
        depends_on: [st05_lane_run]
        step_config: {operation: classify_sm_05, gap: GAP-5}
      - node_id: st06_commit_push
        node_type: EFFECT_GENERIC
        description: St6 Commit and push
        depends_on: [sm_05_lane_run_to_commit]
      - node_id: sm_06_commit_to_handoff
        node_type: COMPUTE_GENERIC
        description: SM-06 commit and push to handoff
        depends_on: [st06_commit_push]
        step_config: {operation: classify_sm_06, shape: ModelPrHandoffDecisionRequest, bound_minutes: 30}
      - node_id: st07_handoff
        node_type: EFFECT_GENERIC
        description: St7 Handoff
        depends_on: [sm_06_commit_to_handoff]
      - node_id: sm_07_handoff_to_controller
        node_type: COMPUTE_GENERIC
        description: SM-07 handoff to controller
        depends_on: [st07_handoff]
        step_config: {operation: classify_sm_07, shape: ModelPrHandoffDecisionRequest, bound_minutes: 60}
      - node_id: st08_landing_controller
        node_type: EFFECT_GENERIC
        description: St8 Landing controller
        depends_on: [sm_07_handoff_to_controller]
      - node_id: sm_08_controller_to_ci
        node_type: COMPUTE_GENERIC
        description: SM-08 controller to CI
        depends_on: [st08_landing_controller]
        step_config: {operation: classify_sm_08, shape: ModelLandingFacts}
      - node_id: st09_ci
        node_type: EFFECT_GENERIC
        description: St9 CI
        depends_on: [sm_08_controller_to_ci]
      - node_id: sm_09_ci_to_merge
        node_type: COMPUTE_GENERIC
        description: SM-09 CI to merge
        depends_on: [st09_ci]
        step_config: {operation: classify_sm_09, shape: ModelLandingDecision, gap: GAP-10, bound_minutes: 30}
      - node_id: st10_merge
        node_type: EFFECT_GENERIC
        description: St10 Merge
        depends_on: [sm_09_ci_to_merge]
      - node_id: sm_10_merge_to_release
        node_type: COMPUTE_GENERIC
        description: SM-10 merge to release
        depends_on: [st10_merge]
        step_config: {operation: classify_sm_10, shape: ModelPluginBumpStuckRequest, gap: GAP-7, bound_minutes: 90}
      - node_id: st11_plugin_bump_release
        node_type: EFFECT_GENERIC
        description: St11 Plugin bump and release
        depends_on: [sm_10_merge_to_release]
      - node_id: sm_11_release_to_deploy
        node_type: COMPUTE_GENERIC
        description: SM-11 release to deploy
        depends_on: [st11_plugin_bump_release]
        step_config: {operation: classify_sm_11, gap: GAP-8, bound_minutes: 90}
      - node_id: st12_deploy
        node_type: EFFECT_GENERIC
        description: St12 Deploy
        depends_on: [sm_11_release_to_deploy]
      - node_id: sm_12_deploy_to_adoption
        node_type: COMPUTE_GENERIC
        description: SM-12 deploy to adoption
        depends_on: [st12_deploy]
        step_config: {operation: classify_sm_12, shape: ModelAdoptionRecoveryRequest, bound_from: node_adoption_recovery_effect/stale_minutes}
      - node_id: st13_adoption_running
        node_type: EFFECT_GENERIC
        description: St13 Adoption and running
        depends_on: [sm_12_deploy_to_adoption]
      - node_id: sm_13_adoption_to_running
        node_type: COMPUTE_GENERIC
        description: SM-13 adoption to running
        depends_on: [st13_adoption_running]
        step_config: {operation: classify_sm_13, shape: decide_running_vs_merged, bound_minutes: 60}

  # The second execution graph: the seventeen seams of the view-centric interfaces, declared whole
  # before any is built. A seam entry names its two stations (the EFFECT_GENERIC nodes it sits between),
  # its measures and units, its identity, the causes it permits under blocked and refused, the causes it
  # forbids, the node that emits each side (each emitter's contract publishes the count and window-close
  # topics), its overlay keys (budgets and deadlines are keys in the view_seams overlay, never literals)
  # and its status: declared until the step that builds it lands, then measured.
  additional_workflows:
    view_seam_read:
      workflow_metadata:
        workflow_name: view_seam_read
        workflow_version: {major: 1, minor: 0, patch: 0}
        description: The seventeen seams of the view-centric interfaces, declared as one graph before any is built.
      execution_graph:
        nodes:
        - {node_id: data_sources, node_type: EFFECT_GENERIC, description: data sources}
        - node_id: floor_effect
          node_type: EFFECT_GENERIC
          description: floor effect
          depends_on: [vs_01_data_sources_to_floor_effect]
        - node_id: view_document
          node_type: EFFECT_GENERIC
          description: view document
          depends_on: [vs_02_floor_effect_to_view_document]
        - {node_id: view_manifest, node_type: EFFECT_GENERIC, description: view manifest}
        - node_id: compose
          node_type: EFFECT_GENERIC
          description: compose
          depends_on: [vs_03_view_manifest_to_compose]
        - {node_id: threshold_policy, node_type: EFFECT_GENERIC, description: threshold policy}
        - node_id: severity
          node_type: EFFECT_GENERIC
          description: severity
          depends_on: [vs_04_threshold_policy_to_severity]
        - node_id: web_renderer
          node_type: EFFECT_GENERIC
          description: web renderer
          depends_on: [vs_05_compose_to_web_renderer, vs_09_token_artifact_to_web_renderer]
        - node_id: text_renderer
          node_type: EFFECT_GENERIC
          description: text renderer
          depends_on: [vs_06_compose_to_text_renderer, vs_10_token_artifact_to_text_renderer]
        - node_id: slack_renderer
          node_type: EFFECT_GENERIC
          description: slack renderer
          depends_on: [vs_07_compose_to_slack_renderer, vs_11_token_artifact_to_slack_renderer]
        - node_id: swiftui_container
          node_type: EFFECT_GENERIC
          description: swiftui container
          depends_on: [vs_08_compose_to_swiftui_container, vs_12_token_artifact_to_swiftui_container]
        - {node_id: token_artifact, node_type: EFFECT_GENERIC, description: token artifact}
        - node_id: published_web_surface
          node_type: EFFECT_GENERIC
          description: published web surface
          depends_on: [vs_13_web_renderer_to_published_web_surface]
        - node_id: status_line
          node_type: EFFECT_GENERIC
          description: status line
          depends_on: [vs_14_text_renderer_to_status_line]
        - node_id: slack_message
          node_type: EFFECT_GENERIC
          description: slack message
          depends_on: [vs_15_slack_renderer_to_slack_message]
        - {node_id: publish_effect, node_type: EFFECT_GENERIC, description: publish effect}
        - node_id: iphone_app
          node_type: EFFECT_GENERIC
          description: iphone app
          depends_on: [vs_16_publish_effect_to_iphone_app]
        - {node_id: publish_status, node_type: EFFECT_GENERIC, description: publish status}
        - node_id: throughput_tick
          node_type: EFFECT_GENERIC
          description: throughput tick
          depends_on: [vs_17_publish_status_to_throughput_tick]
        - node_id: vs_01_data_sources_to_floor_effect
          node_type: COMPUTE_GENERIC
          description: VS-01 data sources to the snapshot-taking effect
          depends_on: [data_sources]
          step_config:
            operation: reconcile_seam
            seam_id: VS-01
            sender_station: data_sources
            receiver_station: floor_effect
            measures:
            - {measure_id: sources, unit: sources, kind: transit}
            - {measure_id: rows, unit: rows, kind: transit}
            identity: binding ids handed over equal binding ids reported; per readable source the row ids equal rows accepted plus refused; a source
              not read is upstream-blocked and its rows measure is not taken
            permits:
              blocked: [upstream-blocked, compacted]
              refused: [schema-invalid, duplicate-key]
            forbids: []
            emitters: {sender: node_factory_floor_effect, receiver: node_factory_floor_effect}
            one_emitter: true
            overlay_keys: {latency_budget: view_seams.VS-01.latency_budget_seconds, settlement_deadline: view_seams.VS-01.settlement_deadline_seconds}
            status: declared
        - node_id: vs_02_floor_effect_to_view_document
          node_type: COMPUTE_GENERIC
          description: VS-02 floor effect to the typed view contract and the composed view document
          depends_on: [floor_effect]
          step_config:
            operation: reconcile_seam
            seam_id: VS-02
            sender_station: floor_effect
            receiver_station: view_document
            measures:
            - {measure_id: lines, unit: lines, kind: transit}
            - {measure_id: sections, unit: sections, kind: transit}
            identity: declared line ids = drawn + drawn as stopped with a cause; declared section ids = with rows + typed empty state; refused is
              forbidden for both
            permits:
              blocked: [no-matching-plan, upstream-blocked]
              refused: []
            forbids: []
            emitters: {sender: node_factory_floor_effect, receiver: node_factory_floor_effect}
            one_emitter: true
            overlay_keys: {latency_budget: view_seams.VS-02.latency_budget_seconds, settlement_deadline: view_seams.VS-02.settlement_deadline_seconds}
            status: declared
        - node_id: vs_03_view_manifest_to_compose
          node_type: COMPUTE_GENERIC
          description: VS-03 view manifest and overlay-declared views to the compose node
          depends_on: [view_manifest]
          step_config:
            operation: reconcile_seam
            seam_id: VS-03
            sender_station: view_manifest
            receiver_station: compose
            measures:
            - {measure_id: declarations, unit: declarations, kind: transit}
            - {measure_id: compose-inputs, unit: compose-inputs, kind: transit}
            identity: listed view ids = accepted + refused per reason; accepted ids = ids compose received = manifest entries marked published; refused
              ids = manifest entries marked refused
            permits:
              blocked: []
              refused: [schema-invalid, duplicate-key]
            forbids: []
            emitters: {sender: node_factory_floor_publish_effect, receiver: node_factory_floor_publish_effect}
            one_emitter: true
            overlay_keys: {latency_budget: view_seams.VS-03.latency_budget_seconds, settlement_deadline: view_seams.VS-03.settlement_deadline_seconds}
            status: declared
        - node_id: vs_04_threshold_policy_to_severity
          node_type: COMPUTE_GENERIC
          description: VS-04 threshold policy into severity
          depends_on: [threshold_policy]
          step_config:
            operation: reconcile_seam
            seam_id: VS-04
            sender_station: threshold_policy
            receiver_station: severity
            measures:
            - {measure_id: verdict-rows, unit: verdict-rows, kind: transit}
            identity: verdict row ids = evaluated + source + blocked; every evaluated verdict's policy digest = the digest the view contract pins
            permits:
              blocked: [out-of-band, missing-verdict]
              refused: []
            forbids: []
            identity_artifacts: [policy_digest]
            emitters: {sender: node_factory_floor_effect, receiver: node_factory_floor_effect}
            one_emitter: true
            overlay_keys: {latency_budget: view_seams.VS-04.latency_budget_seconds, settlement_deadline: view_seams.VS-04.settlement_deadline_seconds}
            status: declared
        - node_id: vs_05_compose_to_web_renderer
          node_type: COMPUTE_GENERIC
          description: VS-05 compose to the web renderer
          depends_on: [compose]
          step_config:
            operation: reconcile_seam
            seam_id: VS-05
            sender_station: compose
            receiver_station: web_renderer
            measures:
            - {measure_id: sections, unit: sections, kind: transit}
            - {measure_id: rows, unit: rows, kind: transit}
            identity: section and row ids handed over = drawn + drawn with a cause + refused; the embedded source_document_digest = the served document's
              digest
            permits:
              blocked: [upstream-blocked]
              refused: [verify-widget-envelope-failed]
            forbids: []
            identity_artifacts: [source_document_digest]
            emitters: {sender: node_factory_floor_publish_effect, receiver: node_view_render_web_effect}
            one_emitter: false
            overlay_keys: {latency_budget: view_seams.VS-05.latency_budget_seconds, settlement_deadline: view_seams.VS-05.settlement_deadline_seconds}
            status: declared
        - node_id: vs_06_compose_to_text_renderer
          node_type: COMPUTE_GENERIC
          description: VS-06 compose to the terminal renderer
          depends_on: [compose]
          step_config:
            operation: reconcile_seam
            seam_id: VS-06
            sender_station: compose
            receiver_station: text_renderer
            measures:
            - {measure_id: sections, unit: sections, kind: transit}
            - {measure_id: rows, unit: rows, kind: transit}
            identity: as VS-05; summarised is permitted
            permits:
              blocked: [upstream-blocked, summarised]
              refused: [verify-widget-envelope-failed]
            forbids: []
            identity_artifacts: [source_document_digest]
            emitters: {sender: node_factory_floor_publish_effect, receiver: node_view_render_text_effect}
            one_emitter: false
            overlay_keys: {latency_budget: view_seams.VS-06.latency_budget_seconds, settlement_deadline: view_seams.VS-06.settlement_deadline_seconds}
            status: declared
        - node_id: vs_07_compose_to_slack_renderer
          node_type: COMPUTE_GENERIC
          description: VS-07 compose to the Slack renderer
          depends_on: [compose]
          step_config:
            operation: reconcile_seam
            seam_id: VS-07
            sender_station: compose
            receiver_station: slack_renderer
            measures:
            - {measure_id: sections, unit: sections, kind: transit}
            - {measure_id: rows, unit: rows, kind: transit}
            - {measure_id: commands, unit: commands, kind: transit}
            identity: as VS-05; document digests = commands emitted + suppressed; truncated is permitted, counted per row
            permits:
              blocked: [upstream-blocked, truncated]
              refused: [verify-widget-envelope-failed]
            forbids: []
            identity_artifacts: [source_document_digest]
            emitters: {sender: node_factory_floor_publish_effect, receiver: node_view_render_slack_effect}
            one_emitter: false
            overlay_keys: {latency_budget: view_seams.VS-07.latency_budget_seconds, settlement_deadline: view_seams.VS-07.settlement_deadline_seconds}
            status: declared
        - node_id: vs_08_compose_to_swiftui_container
          node_type: COMPUTE_GENERIC
          description: VS-08 compose to the SwiftUI container
          depends_on: [compose]
          step_config:
            operation: reconcile_seam
            seam_id: VS-08
            sender_station: compose
            receiver_station: swiftui_container
            measures:
            - {measure_id: sections, unit: sections, kind: transit}
            - {measure_id: rows, unit: rows, kind: transit}
            identity: per render id, started section and row ids = completed drawn + drawn with a cause + refused; started ids = the served document's
              ids for that digest
            permits:
              blocked: [upstream-blocked]
              refused: [schema-invalid]
            forbids: []
            identity_artifacts: [source_document_digest]
            emitters: {sender: node_view_receipt_endpoint_effect, receiver: node_view_receipt_endpoint_effect}
            one_emitter: true
            overlay_keys: {latency_budget: view_seams.VS-08.latency_budget_seconds, settlement_deadline: view_seams.VS-08.settlement_deadline_seconds}
            status: declared
        - node_id: vs_09_token_artifact_to_web_renderer
          node_type: COMPUTE_GENERIC
          description: VS-09 OmniUI token artifact to the web renderer
          depends_on: [token_artifact]
          step_config:
            operation: reconcile_seam
            seam_id: VS-09
            sender_station: token_artifact
            receiver_station: web_renderer
            measures:
            - {measure_id: tokens, unit: tokens, kind: coverage}
            identity: every declared token reference resolves in the inventory; missing is forbidden; unused inventory is reported and not a fault;
              the output's theme_digest = the instance digest
            permits:
              blocked: []
              refused: []
            forbids: [missing]
            identity_artifacts: [theme_digest]
            emitters: {sender: node_factory_floor_publish_effect, receiver: node_view_render_web_effect}
            one_emitter: false
            overlay_keys: {latency_budget: view_seams.VS-09.latency_budget_seconds, settlement_deadline: view_seams.VS-09.settlement_deadline_seconds}
            status: declared
        - node_id: vs_10_token_artifact_to_text_renderer
          node_type: COMPUTE_GENERIC
          description: VS-10 token artifact to the terminal renderer
          depends_on: [token_artifact]
          step_config:
            operation: reconcile_seam
            seam_id: VS-10
            sender_station: token_artifact
            receiver_station: text_renderer
            measures:
            - {measure_id: roles, unit: roles, kind: coverage}
            identity: every severity role the renderer's contract declares has a mapping and is in the instance's roles; unmapped is forbidden
            permits:
              blocked: []
              refused: []
            forbids: [unmapped]
            identity_artifacts: [theme_digest]
            emitters: {sender: node_factory_floor_publish_effect, receiver: node_view_render_text_effect}
            one_emitter: false
            overlay_keys: {latency_budget: view_seams.VS-10.latency_budget_seconds, settlement_deadline: view_seams.VS-10.settlement_deadline_seconds}
            status: declared
        - node_id: vs_11_token_artifact_to_slack_renderer
          node_type: COMPUTE_GENERIC
          description: VS-11 token artifact to the Slack renderer
          depends_on: [token_artifact]
          step_config:
            operation: reconcile_seam
            seam_id: VS-11
            sender_station: token_artifact
            receiver_station: slack_renderer
            measures:
            - {measure_id: roles, unit: roles, kind: coverage}
            identity: as VS-10
            permits:
              blocked: []
              refused: []
            forbids: [unmapped]
            identity_artifacts: [theme_digest]
            emitters: {sender: node_factory_floor_publish_effect, receiver: node_view_render_slack_effect}
            one_emitter: false
            overlay_keys: {latency_budget: view_seams.VS-11.latency_budget_seconds, settlement_deadline: view_seams.VS-11.settlement_deadline_seconds}
            status: declared
        - node_id: vs_12_token_artifact_to_swiftui_container
          node_type: COMPUTE_GENERIC
          description: VS-12 token artifact to the SwiftUI container
          depends_on: [token_artifact]
          step_config:
            operation: reconcile_seam
            seam_id: VS-12
            sender_station: token_artifact
            receiver_station: swiftui_container
            measures:
            - {measure_id: theme, unit: theme, kind: transit}
            identity: every receipt's theme digest = the instance digest of the app's build, and the instance digest current within the overlay's
              app-release window
            permits:
              blocked: []
              refused: []
            forbids: []
            identity_artifacts: [theme_digest]
            emitters: {sender: node_factory_floor_publish_effect, receiver: node_view_receipt_endpoint_effect}
            one_emitter: false
            overlay_keys: {latency_budget: view_seams.VS-12.latency_budget_seconds, settlement_deadline: view_seams.VS-12.settlement_deadline_seconds}
            status: declared
        - node_id: vs_13_web_renderer_to_published_web_surface
          node_type: COMPUTE_GENERIC
          description: VS-13 renderers to the published web surface
          depends_on: [web_renderer]
          step_config:
            operation: reconcile_seam
            seam_id: VS-13
            sender_station: web_renderer
            receiver_station: published_web_surface
            measures:
            - {measure_id: artifacts, unit: artifacts, kind: transit}
            identity: expected artifacts = readback matching + transfer failures; digest-mismatch and orphaned are forbidden
            permits:
              blocked: []
              refused: [transfer-failure]
            forbids: [digest-mismatch, orphaned]
            identity_artifacts: [output_content_digest]
            emitters: {sender: node_factory_floor_publish_effect, receiver: node_factory_floor_publish_effect}
            one_emitter: true
            overlay_keys: {latency_budget: view_seams.VS-13.latency_budget_seconds, settlement_deadline: view_seams.VS-13.settlement_deadline_seconds}
            status: declared
        - node_id: vs_14_text_renderer_to_status_line
          node_type: COMPUTE_GENERIC
          description: VS-14 terminal renderer to the status line
          depends_on: [text_renderer]
          step_config:
            operation: reconcile_seam
            seam_id: VS-14
            sender_station: text_renderer
            receiver_station: status_line
            measures:
            - {measure_id: line, unit: line, kind: transit}
            identity: the digest read is one written within the overlay's delivery window; an older digest is stale inside the window and forbidden
              beyond it
            permits:
              blocked: []
              refused: []
            forbids: []
            identity_artifacts: [output_content_digest]
            emitters: {sender: node_view_render_text_effect, receiver: node_view_status_line_receipt_effect}
            one_emitter: false
            overlay_keys: {latency_budget: view_seams.VS-14.latency_budget_seconds, settlement_deadline: view_seams.VS-14.settlement_deadline_seconds,
              delivery_window: view_seams.VS-14.delivery_window_seconds}
            status: declared
        - node_id: vs_15_slack_renderer_to_slack_message
          node_type: COMPUTE_GENERIC
          description: VS-15 Slack renderer to the posted message
          depends_on: [slack_renderer]
          step_config:
            operation: reconcile_seam
            seam_id: VS-15
            sender_station: slack_renderer
            receiver_station: slack_message
            measures:
            - {measure_id: commands, unit: commands, kind: transit}
            identity: command ids emitted = posted + refused per cause
            permits:
              blocked: []
              refused: [channel-not-found, rate-limited, auth]
            forbids: []
            emitters: {sender: node_view_render_slack_effect, receiver: node_slack_publish_effect}
            one_emitter: false
            overlay_keys: {latency_budget: view_seams.VS-15.latency_budget_seconds, settlement_deadline: view_seams.VS-15.settlement_deadline_seconds}
            status: declared
        - node_id: vs_16_publish_effect_to_iphone_app
          node_type: COMPUTE_GENERIC
          description: VS-16 publish effect to the iPhone app
          depends_on: [publish_effect]
          step_config:
            operation: reconcile_seam
            seam_id: VS-16
            sender_station: publish_effect
            receiver_station: iphone_app
            measures:
            - {measure_id: requests, unit: requests, kind: transit}
            identity: request ids answered = request ids receipted (decoded or refused with a cause); every receipted digest is one served for that
              request
            permits:
              blocked: []
              refused: [schema-invalid]
            forbids: []
            identity_artifacts: [source_document_digest]
            emitters: {sender: node_view_app_interface_effect, receiver: node_view_receipt_endpoint_effect}
            one_emitter: false
            overlay_keys: {latency_budget: view_seams.VS-16.latency_budget_seconds, settlement_deadline: view_seams.VS-16.settlement_deadline_seconds}
            status: declared
        - node_id: vs_17_publish_status_to_throughput_tick
          node_type: COMPUTE_GENERIC
          description: VS-17 publish status to the throughput tick
          depends_on: [publish_status]
          step_config:
            operation: reconcile_seam
            seam_id: VS-17
            sender_station: publish_status
            receiver_station: throughput_tick
            measures:
            - {measure_id: readings, unit: readings, kind: transit}
            - {measure_id: findings, unit: findings, kind: transit}
            identity: expected reading ids (VS-01 to VS-16, from the graph) = recorded = consumed, with an absent reading synthesised as unreadable;
              readings not matched = MISSING + UNKNOWN findings raised
            permits:
              blocked: []
              refused: []
            forbids: []
            emitters: {sender: node_seam_conservation_compute, receiver: node_seam_conservation_compute}
            one_emitter: true
            overlay_keys: {latency_budget: view_seams.VS-17.latency_budget_seconds, settlement_deadline: view_seams.VS-17.settlement_deadline_seconds}
            status: measured

config:
  seam_read:
    default_minimum_crossings: 20
    consecutive_clean_windows: 2
    window_hours: 24
    freshness_ticks: 1
    # reader_time_budget_seconds and each seam's expected_crossings (a key of the seam node's
    # step_config) are set from a pasted reading; until then the reading node refuses naming
    # the key.

metadata:
  ticket: OMN-21459
  transport_type: inmemory
