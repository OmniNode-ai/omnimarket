---
name: node_pr_state_emit_effect
contract_version:
  major: 1
  minor: 0
  patch: 0
node_type: EFFECT_GENERIC
node_version:
  major: 0
  minor: 1
  patch: 0
node_not_implemented: false
description: OMN-19999. Types a watcher observation and emits pr.state.observed through node_event_emit_effect. Delivery identity is its digest; partition key is repo#pr_number. Emits ci-run-failed from a watcher observation (schema version 1 or 2) or from a webhook check-run conclusion.
handler:
  module: omnimarket.nodes.node_pr_state_emit_effect.handlers.handler_pr_state_emit
  class: HandlerPrStateEmit
  input_model: omnimarket.events.pr_state.ModelPrStateEmitRequest
handler_routing:
  handlers:
  - operation: pr_state_emit
    topic: onex.cmd.omnimarket.pr-state-emit.v1
    handler:
      name: HandlerPrStateEmit
      module: omnimarket.nodes.node_pr_state_emit_effect.handlers.handler_pr_state_emit
  - operation: detect_ci_red
    topic: onex.evt.omnimarket.pr-state-observed.v1
    message_category: event
    event_model:
      name: ModelDetectCiRedRequest
      module: omnimarket.nodes.node_pr_state_emit_effect.handlers.handler_detect_ci_red
    handler:
      name: HandlerDetectCiRed
      module: omnimarket.nodes.node_pr_state_emit_effect.handlers.handler_detect_ci_red
  - operation: detect_ci_red_check_run
    topic: onex.evt.github.check-run.v1
    message_category: event
    event_model:
      name: ModelDetectCiRedCheckRunRequest
      module: omnimarket.nodes.node_pr_state_emit_effect.handlers.handler_detect_ci_red_check_run
    handler:
      name: HandlerDetectCiRedCheckRun
      module: omnimarket.nodes.node_pr_state_emit_effect.handlers.handler_detect_ci_red_check_run
  - operation: record_workflow_run
    topic: onex.evt.github.workflow-run.v1
    message_category: event
    event_model:
      name: ModelRecordWorkflowRunRequest
      module: omnimarket.nodes.node_pr_state_emit_effect.handlers.handler_record_workflow_run
    handler:
      name: HandlerRecordWorkflowRun
      module: omnimarket.nodes.node_pr_state_emit_effect.handlers.handler_record_workflow_run
published_events:
- event_type: CiRunFailedEvent
  topic: onex.evt.omnimarket.ci-run-failed.v1
input_model:
  name: ModelPrStateEmitRequest
  module: omnimarket.events.pr_state
  description: One typed watcher observation.
output_model:
  name: ModelPrStateEmitResult
  module: omnimarket.nodes.node_pr_state_emit_effect.models.model_pr_state_emit_result
  description: Durable delivery result or spool refusal.
descriptor:
  node_archetype: effect
  purity: effectful
  runtime_profiles:
  - effects
  idempotent: true
  timeout_ms: 10000
runtime_dispatch:
  command_topic: onex.cmd.omnimarket.pr-state-emit.v1
  terminal_events:
    success: onex.evt.omnimarket.pr-state-emit-completed.v1
    failure: onex.evt.omnimarket.pr-state-emit-failed.v1
  default_timeout_ms: 10000
  max_timeout_ms: 10000
terminal_event: onex.evt.omnimarket.pr-state-emit-completed.v1
event_bus:
  subscribe_topics:
  - onex.cmd.omnimarket.pr-state-emit.v1
  - onex.evt.omnimarket.pr-state-observed.v1
  - onex.evt.github.check-run.v1
  - onex.evt.github.workflow-run.v1
  publish_topics:
  - onex.evt.omnimarket.pr-state-observed.v1
  - onex.evt.omnimarket.pr-state-emit-completed.v1
  - onex.evt.omnimarket.pr-state-emit-failed.v1
  - onex.evt.omnimarket.ci-run-failed.v1
externally_consumed_topics:
- onex.evt.omnimarket.pr-state-emit-completed.v1
- onex.evt.omnimarket.pr-state-emit-failed.v1
externally_produced_topics:
- topic: onex.evt.github.check-run.v1
  producer: node_github_webhook_ingress_effect, which folds check_run deliveries
- topic: onex.evt.github.workflow-run.v1
  producer: node_github_webhook_ingress_effect, which folds workflow_run deliveries
metadata:
  transport_type: kafka
event_type: pr.state.observed
