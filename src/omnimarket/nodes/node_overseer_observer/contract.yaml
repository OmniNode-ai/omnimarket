# ONEX Node Contract - Overseer Observer
#
# Phase-0 stubs: SideEffectObserver and EvidenceEvaluator interfaces.
# No Kafka wiring yet — wiring happens in Wave 3+.
#
# Related Tickets:
#   - OMN-8506: stub side-effect observer + evidence evaluator interfaces
#   - OMN-8025: Overseer seam integration epic
---
name: node_overseer_observer
contract_version: {major: 0, minor: 1, patch: 0}
node_type: compute
node_version: {major: 0, minor: 1, patch: 0}

description: >
  Phase-0 stub node declaring SideEffectObserver and EvidenceEvaluator
  extension points for the overseer pipeline. Records Kafka side effects
  emitted by nodes (SideEffectObserver) and checks dod_evidence fields
  against observed outputs (EvidenceEvaluator). No Kafka wiring until Wave 3+.

handler:
  module: omnimarket.nodes.node_overseer_observer.handlers.handler_evidence_evaluator
  class: NullEvidenceEvaluator
  input_model: omnimarket.nodes.node_overseer_observer.models.model_overseer_observation_request.ModelOverseerObservationRequest

input_model:
  name: ModelOverseerObservationRequest
  module: omnimarket.nodes.node_overseer_observer.models.model_overseer_observation_request
  description: "Observed side effects and required DOD evidence to evaluate."
output_model:
  name: ModelOverseerObservationResult
  module: omnimarket.nodes.node_overseer_observer.models.model_overseer_observation_result
  description: "Evidence evaluation result and observed/evidence counts."

descriptor:
  node_archetype: compute
  purity: pure
  idempotent: true
  timeout_ms: 5000

runtime_dispatch:
  command_topic: onex.cmd.omnimarket.overseer-observer.v1
  terminal_events:
    success: onex.evt.omnimarket.overseer-observer-completed.v1
    failure: onex.evt.omnimarket.overseer-observer-failed.v1

event_bus:
  subscribe_topics:
    - onex.cmd.omnimarket.overseer-observer.v1
  publish_topics:
    - onex.evt.omnimarket.overseer-observer-completed.v1
    - onex.evt.omnimarket.overseer-observer-failed.v1

externally_consumed_topics:
  - onex.evt.omnimarket.overseer-observer-completed.v1
  - onex.evt.omnimarket.overseer-observer-failed.v1

# Phase-0 stubs — no active bus subscription yet (Wave 3+). Declared here for
# contract completeness so the compliance scanner can verify module paths (OMN-11907).
#
# Route to the CONCRETE Null* implementations, not the EvidenceEvaluator /
# SideEffectObserver typing.Protocol interfaces. The runtime handler resolver
# instantiates the routed class; a Protocol target raises
# "TypeError: Protocols cannot be instantiated" and crash-loops main-runtime
# bootstrap on infra builds predating the OMN-12501 quarantine guard (OMN-12956).
handler_routing:
  routing_strategy: payload_type_match
  handlers:
    - handler:
        name: NullEvidenceEvaluator
        module: omnimarket.nodes.node_overseer_observer.handlers.handler_evidence_evaluator
      description: "Phase-0 no-op: checks dod_evidence against observed outputs (Wave 3+)"
    - handler:
        name: NullSideEffectObserver
        module: omnimarket.nodes.node_overseer_observer.handlers.handler_side_effect_observer
      description: "Phase-0 no-op: records Kafka side effects for downstream inspection (Wave 3+)"

stub_interfaces:
  - name: SideEffectObserver
    module: omnimarket.nodes.node_overseer_observer.handlers.handler_side_effect_observer
    class: SideEffectObserver
    null_impl: NullSideEffectObserver
    phase: "Wave 3+"
    description: >
      Records Kafka side effects emitted by a node for downstream inspection.

  - name: EvidenceEvaluator
    module: omnimarket.nodes.node_overseer_observer.handlers.handler_evidence_evaluator
    class: EvidenceEvaluator
    null_impl: NullEvidenceEvaluator
    phase: "Wave 3+"
    description: >
      Checks dod_evidence fields against observed side-effect outputs.

dependencies:
  packages:
    - "pydantic>=2.0.0"

dod_evidence:
  - type: pytest
    description: >
      SideEffectObserver and EvidenceEvaluator are importable and instances
      pass isinstance checks against their Protocol types.
    check: uv run pytest tests/test_golden_chain_overseer_observer.py -v
  - type: bash_script
    description: >
      Python import check confirms both stub classes are importable and pass isinstance checks.
    check: >-
      uv run python -c "
      from omnimarket.nodes.node_overseer_observer.handlers.handler_side_effect_observer import SideEffectObserver, NullSideEffectObserver;
      from omnimarket.nodes.node_overseer_observer.handlers.handler_evidence_evaluator import EvidenceEvaluator, NullEvidenceEvaluator;
      assert isinstance(NullSideEffectObserver(), SideEffectObserver);
      assert isinstance(NullEvidenceEvaluator(), EvidenceEvaluator);
      print('OK')"
