name: node_onex_setup_effect
version: "1.0.0"
description: "Package client onboarding through versioned setup plugins and portable configuration profiles, endpoint discovery, selected-component preflight, model proofs, dashboard lifecycle and Claude integration"
omnibase_core_compat: ">=0.40.0,<1.0.0"
entry_points:
  onex.nodes:
    node_onex_setup_effect: "omnimarket.nodes.node_onex_setup_effect"
capabilities:
  standalone: true
  full_runtime: false
  requires_network: true
  requires_repo: false
  requires_secrets: true
  requires_docker: false
  side_effect_class: filesystem_write
dependencies:
  - "omnibase_core>=0.40.0"
  - "pydantic>=2.0"
  - "click>=8.0"
  - "httpx>=0.27.0"
  - "PyYAML>=6.0"
  - "packaging>=24.0"
  - "omnibase-infra>=0.38.75,<0.39.0"
  - "rich>=13.0.0"
  - "textual>=8.2"
authors: ["OmniNode Platform Team"]
license: "MIT"
tags: ["effect", "onboarding", "setup", "cli"]
pack: "onboarding"
display_name: "ONEX Setup Effect"
node_role: "effect"
