---
name: "node_onex_setup_effect"
# Run by a developer through `onex setup`, which resolves the workspace root (prompting only
# when nothing names it), hands the handler a typed request and prints the typed result. The
# command topic names the bus entry a runtime would take; the result is the terminal event.
lifecycle: experimental
contract_name: node_onex_setup_effect
node_name: node_onex_setup_effect
node_type: EFFECT_GENERIC
contract_version: {major: 1, minor: 0, patch: 0}
node_version: {major: 1, minor: 0, patch: 0}
description: >
  One typed reconciliation engine for interactive and unattended machine setup.
  Selected-component checks precede workspace/configuration,
  local identity and the existing pinned model proof. Selected dashboard and Claude
  plugin/hook components use their canonical lifecycle and settings owners. Verify
  observes without provisioning; repair resumes failed effects. Unchanged observations
  preserve completed state, while atomic per-effect checkpoints retain interrupted
  progress under one lock. The v1 request/result handler is a compatibility adapter to
  that same engine and never writes the old state format. Selections without an
  installed component adapter refuse before mutations. The additive legacy inventory
  beside this contract distinguishes integrated capabilities from remaining migration
  work; this experimental node does not yet implement the complete lab walk.

input_model: omnimarket.nodes.node_onex_setup_effect.models.model_onex_setup.ModelOnexSetupRequest

output_model:
  name: ModelOnexSetupResult
  module: omnimarket.nodes.node_onex_setup_effect.models.model_onex_setup
  description: The steps that completed and the failure that stopped the walk, with its fix and retry.

handler:
  module: omnimarket.nodes.node_onex_setup_effect.handlers.handler_onex_setup
  class: HandlerOnexSetup
  input_model: omnimarket.nodes.node_onex_setup_effect.models.model_onex_setup.ModelOnexSetupRequest

handler_routing:
  routing_strategy: operation_match
  handlers:
    - operation: onex_setup.claude_component
      handler:
        name: HandlerSetupClaude
        module: omnimarket.nodes.node_onex_setup_effect.handlers.handler_setup_claude
      handler_module: omnimarket.nodes.node_onex_setup_effect.handlers.handler_setup_claude
      event_model: omnimarket.nodes.node_onex_setup_effect.models.model_setup_claude_request.ModelSetupClaudeRequest
    - operation: onex_setup.dashboard
      handler:
        name: HandlerSetupDashboard
        module: omnimarket.nodes.node_onex_setup_effect.handlers.handler_setup_dashboard
      handler_module: omnimarket.nodes.node_onex_setup_effect.handlers.handler_setup_dashboard
      event_model: omnimarket.nodes.node_onex_setup_effect.models.model_setup_plan.ModelSetupPlan
    - operation: onex_setup.command
      handler:
        name: HandlerSetupCommand
        module: omnimarket.nodes.node_onex_setup_effect.handlers.handler_setup_command
      handler_module: omnimarket.nodes.node_onex_setup_effect.handlers.handler_setup_command
      event_model: omnimarket.nodes.node_onex_setup_effect.models.model_setup_command_request.ModelSetupCommandRequest
    - operation: onex_setup.reconcile
      handler:
        name: HandlerSetupWorkflow
        module: omnimarket.nodes.node_onex_setup_effect.handlers.handler_setup_workflow
      handler_module: omnimarket.nodes.node_onex_setup_effect.handlers.handler_setup_workflow
      event_model: omnimarket.nodes.node_onex_setup_effect.models.model_setup_plan.ModelSetupPlan
    - operation: onex_setup.component
      handler:
        name: HandlerSetupEnvironment
        module: omnimarket.nodes.node_onex_setup_effect.handlers.handler_setup_environment
      handler_module: omnimarket.nodes.node_onex_setup_effect.handlers.handler_setup_environment
      event_model: omnimarket.nodes.node_onex_setup_effect.models.model_setup_step_request.ModelSetupStepRequest
    - operation: onex_setup.import_legacy
      handler:
        name: HandlerSetupLegacyImport
        module: omnimarket.nodes.node_onex_setup_effect.handlers.handler_setup_legacy_import
      handler_module: omnimarket.nodes.node_onex_setup_effect.handlers.handler_setup_legacy_import
      event_model: omnimarket.nodes.node_onex_setup_effect.models.model_setup_legacy_import_request.ModelSetupLegacyImportRequest
    - operation: onex_setup.preflight
      handler:
        name: HandlerSetupPreflight
        module: omnimarket.nodes.node_onex_setup_effect.handlers.handler_setup_preflight
      handler_module: omnimarket.nodes.node_onex_setup_effect.handlers.handler_setup_preflight
      event_model: omnimarket.nodes.node_onex_setup_effect.models.model_setup_plan.ModelSetupPlan
    - operation: onex_setup.run_walk
      handler:
        name: HandlerOnexSetup
        module: omnimarket.nodes.node_onex_setup_effect.handlers.handler_onex_setup
      handler_module: omnimarket.nodes.node_onex_setup_effect.handlers.handler_onex_setup
      event_model: omnimarket.nodes.node_onex_setup_effect.models.model_onex_setup.ModelOnexSetupRequest
    # The model step registers a keyless local model server through this handler, which lives on
    # the dispatch side so the node imports no model class from the model setup node (OMN-23207).
    - operation: onex_setup.add_local_model
      handler:
        name: HandlerLocalModelSetup
        module: omnimarket.handlers.handler_local_model_setup
      handler_module: omnimarket.handlers.handler_local_model_setup
      event_model: omnimarket.handlers.handler_local_model_setup.ModelLocalModelSetupRequest

descriptor:
  node_archetype: effect
  purity: effectful
  idempotent: true
  timeout_ms: 7200000
  runtime_profiles: [effects]

terminal_event: onex.evt.omnimarket.onex-setup-completed.v1

event_bus:
  subscribe_topics:
    - "onex.cmd.omnimarket.onex-setup-requested.v1"
  publish_topics:
    - "onex.evt.omnimarket.onex-setup-completed.v1"

published_events:
  - event_type: ModelOnexSetupResult
    topic: onex.evt.omnimarket.onex-setup-completed.v1
    description: "One onboarding walk: the completed steps, or the failed step with its fix."

runtime_dispatch:
  command_topic: onex.cmd.omnimarket.onex-setup-requested.v1
  terminal_events:
    success: onex.evt.omnimarket.onex-setup-completed.v1

externally_consumed_topics:
  - onex.evt.omnimarket.onex-setup-completed.v1

dod_evidence:
  PYTEST:
    description: "inventory coverage of install.sh, the walk's prompts, idempotence, resume and help; the model step's proven delegation, unattended refusals, wrong-key resume, local URL and key secrecy"
    command: "uv run pytest tests/unit/cli/test_setup_command.py tests/unit/cli/test_setup_step_inventory.py tests/unit/nodes/node_onex_setup_effect -q"
    pass_criteria: >
      every install.sh section and flag has an inventory entry; the walk prompts only for an
      underivable workspace root; a second run leaves an identical snapshot; each injected step
      failure names one fix and a retry that completes; setup's help claims machine setup and no
      core command does.

metadata:
  transport_type: filesystem
