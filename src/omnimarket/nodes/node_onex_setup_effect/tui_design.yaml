# Compact header on the start screen (OMN-26620 AC2): two rows, one per
# wordmark row; {version} {model} {folder} are filled in at run time.
header:
  lines:
    - "{mark}   {version}"
    - "{mark}   {model} · {folder}"
  version: "v{version}"
  packages: [omninode-onex, omnimarket]
  home: "~"
  ellipsis: "…"
  compact: true

# Delegated task card (OMN-26620 AC3).
task_card:
  state_bar_colour: success
  facts_template: "{model} · {tokens} tokens · {seconds} s · ${cost}"
  fallback_facts_template: "{model} · {tokens} tokens · {seconds} s"
  failure_template: "Could not reach {model}. Check its key with /config."
  glyphs:
    running: "⠋"
    done: "✓"
    fallback: "◐"
    failed: "✗"
  bar_colours:
    running: route_cheap
    done: success
    fallback: route_fallback
    failed: error

# Spinner (OMN-26620 AC11).
spinner:
  frames: ["◐", "◓", "◑", "◒"]
  fallback_frames: ["|", "/", "-", "\\"]
  ascii_frames: ["|", "/", "-", "\\"]
  frame_seconds: 0.1
  text: "Thinking… (ctrl+c to interrupt)"
  wording: "Thinking… (ctrl+c to interrupt)"
  message: "Thinking… (ctrl+c to interrupt)"
  line: "Thinking… (ctrl+c to interrupt)"

# Key footer (OMN-26620 AC4): per-screen keys and drop order.
footer:
  separator: " · "
  screens:
    main:
      keys:
        - {label: "/", words: commands}
        - {label: "↑↓", words: history}
        - {label: ctrl+p, words: palette}
        - {label: "?", words: help}
        - {label: ctrl+c, words: quit}
      drop_order: [ctrl+p, "?", "↑↓", "/"]
    config:
      keys:
        - {label: Space}
        - {label: Enter}
        - {label: Esc}
        - {label: Ctrl+S}
      drop_order: [Ctrl+S, Enter, Space, Esc]

# /theme registry (OMN-26620 AC5).
themes:
  onex-light:
    name: onex-light
    dark: false
    primary: "#7a5c00"
    secondary: "#1b7a70"
    accent: "#6b4c8a"
    success: "#3a7d12"
    info: "#1b6f8a"
    warning: "#8a5a1b"
    error: "#8a3a2a"
    foreground: "#1c1915"
    muted: "#5a5246"
    background: "#f4efe6"
    surface: "#ece6dc"
    panel: "#e3ddd2"
    boost: "#00000008"
    border: "#b8b0a2"
    chip: "#e3ddd2"
    toggle_on: "#d6ebcc"
    toggle_off: "#e3ddd2"
    route_cheap: "#1b6f8a"
    route_fallback: "#8a6a00"

# Icons (OMN-26620 AC6): Unicode symbols by default, Nerd Font glyphs only when
# mode is nerd, plain ASCII when mode is ascii. Each icon carries all three.
icons:
  mode: plain
  enabled: false
  glyphs:
    ask:
      nerd: "\uf120"
      fallback: "❯"
      ascii: ">"
    answer:
      nerd: "\uf005"
      fallback: "◆"
      ascii: "*"
    done:
      nerd: "\uf00c"
      fallback: "✓"
      ascii: "v"
    task:
      nerd: "\uf054"
      fallback: "›"
      ascii: ">"
    cmd_config:
      nerd: "\uf013"
      fallback: "⚙"
      ascii: "*"
    cmd_model:
      nerd: "\uf2db"
      fallback: "◈"
      ascii: "+"
    cmd_delegation:
      nerd: "\uf0ec"
      fallback: "⇄"
      ascii: "<>"
    cmd_dashboard:
      nerd: "\uf0e4"
      fallback: "▦"
      ascii: "#"
    cmd_doctor:
      nerd: "\uf0f1"
      fallback: "✚"
      ascii: "+"
    cmd_theme:
      nerd: "\uf1fc"
      fallback: "◐"
      ascii: "~"
    cmd_metering:
      nerd: "\uf080"
      fallback: "≋"
      ascii: "="

# The / palette and ctrl+p (OMN-26620): a short hint per customer command, the
# commands that carry an icon, the width of the name column, and Themes.
palette:
  name_width: 14
  themes_title: Themes
  themes_help: Pick a colour theme
  icon_commands: [config, model, delegation, dashboard, doctor, metering, theme]
  hints:
    config: providers, keys and models
    model: pick the model to try first
    delegation: Claude Code on or off
    dashboard: open the local dashboard
    doctor: check your setup
    metering: usage and cost
    theme: pick a colour theme
    clear: clear the screen
    help: keys and how commands work
    quit: leave onex

# /doctor page (OMN-26620 pages worker).
doctor_page:
  title: "Setup check"
  summary_all_good: "✓ all good · {passed} of {total}"
  summary_attention: "{problems} need attention · {passed} of {total}"
  status_ok: "✓ ok"
  status_attention: "! needs attention"
  status_skipped: "– optional/skipped"
  fix_prefix: "fix:"
  # The checks /config can fix, by the name onex doctor gives them; no
  # other row offers a fix it cannot make (end-to-end pass 2026-11-26).
  fixes:
    "Delegation API key": /config
    "Delegation local model": /config
  # A check's fault code, said plainly (its own text holds a URL or path).
  # Every code omnibase_infra's EnumDelegationDoctorFault names.
  codes:
    no_identity: "Not signed in to OmniNode delegation."
    no_key: "No OmniNode delegation key is stored."
    wrong_key: "OmniNode delegation refused the stored key."
    gateway_down: "OmniNode delegation does not answer."
    quota_exhausted: "The delegation quota is used up."
    no_local_model: "No local model server is set up."
    local_model_not_serving: "A model server you added does not answer."
    local_model_id_mismatch: "A model server you added serves a different model."
  # A check's own text by how it starts, said plainly (verify pass 2026-11-26).
  starts:
    "Node.js not found": "Node.js is not installed."
    "Node.js not working": "Node.js is installed but does not run."
  # "Missing: A, B" names settings; each by a plain name, never its own.
  missing: "Not set: {names}."
  settings:
    LINEAR_API_KEY: "Linear key (only Linear features use it)"
  # A row that needs attention never shows no reason at all.
  fallback: "Run onex doctor in a terminal for the details."

# /metering page (OMN-26620 pages worker).
metering_page:
  title: "Usage and cost"
  tasks: "Tasks"
  tokens: "Tokens"
  cost: "Cost"
  saved: "Saved ≈ {amount} (modelled)"
  unmeasured: "not measured"
  savings_line: "Savings are modelled, not billed."
  period: "{period}"

# Plain messages for customer-visible errors (OMN-26620 AC9).
messages:
  could_not: "Could not {what}."
  next_step: "Run /doctor."
