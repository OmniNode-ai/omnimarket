# The onex TUI's design system (OMN-23413): colours, banner, words, shortcuts
# and timings. The TUI reads this file when it starts; none of these values is
# written in code. Loaded and checked by models/model_tui_design.py.

# Colour tokens. Every widget and every line of output uses these by name.
# Midnight neon (operator choice, 2026-11-13): deep navy, electric violet and cyan.
theme:
  name: onex
  dark: true
  primary: "#7c5cff"
  secondary: "#22d3ee"
  accent: "#c084fc"
  success: "#34d399"
  warning: "#fbbf24"
  error: "#fb7185"
  foreground: "#e2e8f0"
  muted: "#7c88a8"
  background: "#0b1020"
  surface: "#10172e"
  panel: "#141c38"

# Left-to-right colour ramps for the banner words.
gradients:
  cool: ["#00d2ff", "#3a9bff", "#6a7bff", "#9a5cf5", "#c64cec", "#ff4fa3"]
  warm: ["#ffd166", "#ffb347", "#ff8c5a", "#ff6b81", "#ff4fa3"]
  fresh: ["#3ddc97", "#2fd4c4", "#22c3ee", "#3a9bff"]

# Three-row block letters for the banner words.
font:
  " ": ["  ", "  ", "  "]
  A: ["▄▀▀▄", "█▀▀█", "▀  ▀"]
  C: ["▄▀▀▀", "█   ", " ▀▀▀"]
  D: ["█▀▀▄", "█  █", "▀▀▀ "]
  E: ["█▀▀▀", "█▀▀ ", "▀▀▀▀"]
  G: ["▄▀▀▀", "█ ▀█", " ▀▀▀"]
  I: ["█", "█", "▀"]
  L: ["█   ", "█   ", "▀▀▀▀"]
  M: ["█▄ ▄█", "█ ▀ █", "▀   ▀"]
  N: ["█▄  █", "█ ▀▄█", "▀   ▀"]
  O: ["▄▀▀▄", "█  █", " ▀▀ "]
  T: ["▀█▀", " █ ", " ▀ "]
  W: ["█   █", "█ █ █", " ▀ ▀ "]

banner:
  greeting: ""
  words:
    - {text: WELCOME TO, gradient: fresh}
    - {text: OMNINODE, gradient: cool}
    - {text: DELEGATION, gradient: warm}
  tagline: "Your tasks, your models: run them where it costs least."
  tips:
    - {key: type a task, text: and press Enter to delegate it}
    - {key: /config, text: "providers, keys and models"}
    - {key: /model, text: pick the model to use first}
    - {key: /delegation, text: Claude Code on or off}
    - {key: /, text: "every command   ·   ↑↓ history   ·   ctrl+c quit"}

# Shortcuts lead the / palette in this order; every onex CLI command follows.
shortcuts:
  - {path: [config], action: config, help: "Providers, keys and models for delegation."}
  - {path: [model], action: model, help: Pick the model every task tries first.}
  - {path: [delegation], action: delegation, help: Turn delegation on or off for Claude Code.}
  - {path: [clear], action: clear, help: Clear the output.}
  - {path: [help], action: help, help: Show keys and how commands work.}
  - {path: [quit], action: quit, help: Leave the TUI.}

# Typed but not listed: each opens the shortcut it names.
aliases:
  exit: quit

# CLI commands a shortcut replaces in the TUI: neither listed nor typed here.
# /config collects the choices and runs `onex setup` with them, so /setup is
# not a second way in (operator decision 2026-11-12). The CLI command itself stays.
replaced_commands:
  - [setup]

# Marks used in the output pane.
glyphs:
  task: "›"
  tip: "▸"
  done: "✓"
  unchanged: "·"
  failed: "✗"

prompt_placeholder: Ask ONEX to delegate a task, or type / for commands
help: >-
  Type a task and press Enter to delegate it. /config sets up providers, keys
  and models, /model picks the model tried first, /delegation turns Claude Code
  delegation on or off, /clear empties this pane. Type / to list every onex
  command; keep typing to filter, Tab to complete, Enter to run, Esc to close.
  Up and Down recall earlier entries.

# /config loads a provider's models this long after the key or URL stops
# changing; a key shorter than min_key_length is never sent.
auto_find_seconds: 0.8
min_key_length: 8

# The model table every model screen shows: /config (tick models), /model
# (pick the first or Auto) and /delegation (read-only). Columns, words and
# colours are read here; the screens hold none of them (OMN-23413 AC20, AC27).
model_table:
  columns:
    - {key: pick, title: " "}
    - {key: provider, title: Provider}
    - {key: model, title: Model}
    - {key: context, title: Ctx}
    - {key: price, title: "Price $/1M (in / out)"}
    - {key: status, title: Status}
    - {key: capabilities, title: Capabilities}
  # Price words: an unknown price is never shown as free.
  price_local: Local
  # The I details view: its title, each row's name, and the words it uses.
  details:
    title: Model details
    provider: Provider
    server: Server
    model: Model
    name: Name
    runs: Runs
    context: Context
    max_output: Max output
    input: Input
    output: Output
    cache_read: Cache read
    cache_write: Cache write
    per_million: per 1M
    pricing: Pricing
    tiered: changes with context size or tier
    status: Status
    why: Why
    metadata: Metadata
    fetched: "models.dev, fetched {at}"
    stale: "(stale: could not refresh)"
    "yes": "Yes"
    "no": "No"
  # A model on the user's own server: the provider, then the server that answered.
  server_label: "{provider} · {server}"
  # Shown for any value no source states (price, context, capabilities).
  unknown_mark: "-"
  price_unknown: "-"
  price_variable: Variable
  # Shown after a price that changes with context size or another tier.
  price_tier_mark: "*"
  ticked: "●"
  unticked: "○"
  # A row starts with a bar in its deployment's colour; a status is a coloured pill.
  row_bar: "▍"
  status_pill: "●"
  status:
    ready: {text: READY, colour: success}
    listed: {text: AVAILABLE, colour: secondary}
    untested: {text: UNTESTED, colour: warning}
    failed: {text: FAILED, colour: error}
    unavailable: {text: UNAVAILABLE, colour: muted}
  deployment:
    local: {text: Local, colour: success}
    cloud: {text: Cloud, colour: secondary}
  # Capability badges: a supported capability is a coloured badge; unknown is dim.
  capability_colours: [primary, secondary, success, accent, warning, error]
  filters: [all, local, cloud]
  filter_labels: {all: All, local: Local, cloud: Cloud}
  sorts: [name, context, input, output]
  sort_labels: {name: Name, context: Context, input: Input price, output: Output price}
  search_placeholder: Search models, providers or capabilities
  auto_label: "Auto: ONEX picks per task (cost and availability)"
  help:
    config: "Tab next screen · Space ticks · Enter moves on · I details · / search · F filter · S sort · Ctrl+S saves · Esc back"
    model: "Tab next screen · Enter selects · A auto · R remove · I details · / search · F filter · S sort · Esc back"
    delegation: "Tab next screen · Space switches · M mode · I details · Ctrl+S saves · Esc back"

# /delegation (OMN-23413 AC25, AC26): nothing is typed. Each mode names the onex
# commands it runs; "{connection}" and "{model}" are filled from the selected
# model that can serve it. The screen holds no command, bit or word of its own.
delegation:
  title: Claude Code delegation
  switch_label: Delegate Claude Code work to your selected models
  table_title: Your selected models (from /config), in the order delegation tries them
  modes:
    - id: hook
      label: "Subagent tasks: the delegation hook routes them across your models"
      detail: "Claude Code keeps its own model for the conversation. When it hands a task to a subagent, the ONEX hook sends that task to your selected models, in order, and returns the answer. Works with any selected model."
      needs_gateway_model: false
      enable:
        - [setup, --yes, --no-interactive, --json, --component, claude-plugin, --component, claude-hooks]
        - [hooks, enable, post_skill_delegation_enforcer]
      disable:
        - [hooks, disable, post_skill_delegation_enforcer]
    - id: gateway
      label: "All Claude Code requests: through the ONEX gateway"
      detail: "Every Claude Code request, the conversation included, goes to a local ONEX gateway that answers with one of your models instead of Anthropic. Needs a selected model whose connection speaks the Anthropic Messages API."
      needs_gateway_model: true
      enable:
        - [setup, --yes, --no-interactive, --json, --component, claude-gateway, --gateway-connection, "{connection}", --gateway-model, "{model}"]
      disable:
        - [claude, disable, --yes]
  switched_on: "Claude Code delegation is on: {mode}."
  switched_off: "Claude Code delegation is off."
  not_switched: "Claude Code delegation was not switched {state}: {reason}"
  nothing_ticked: "Tick at least one model first: click it, or press Space on it."
  # Registers a server that speaks Anthropic Messages as a connection, so the
  # gateway can use it; run first when the chosen model has no connection yet.
  connect: [models, connect, "{connection}", --url, "{url}", --model, "{model}", --native-messages, --no-test, --yes, --json]
  no_models: "Select a model with /config first: Claude delegation needs at least one selected model."
  no_gateway_model: "None of your selected models' servers answers Anthropic Messages, which the gateway needs. Use the delegation hook, or select a model on such a server (Ollama does) with /config."
  gateway_marker: Gateway

# /config, /model and /delegation are three tabs of one place: Tab and
# Shift+Tab move between them, and a click on a tab opens it.
tabs:
  - {id: config, label: "  Config  "}
  - {id: model, label: "  Model  "}
  - {id: delegation, label: "  Delegation  "}

# Every word the /config, /model and /delegation screens show; {name} parts
# are filled in. The screens hold no sentence of their own (OMN-23413 AC27).
words:
  config_title: "Models for delegation: provider, key or URL, then models"
  key_placeholder: "API key"
  url_placeholder: "Server URL, such as http://<host>:<port>"
  basket_empty: "Selected: none yet (at least one is needed)"
  basket: "Selected: {choices}"
  loading: "loading {provider} models…"
  key_first: "enter your {provider} API key first"
  found: "{count} found: tick any number (Space), then Add or Ctrl+S"
  none_found: "no models found"
  needs_key: "{provider} needs an API key"
  still_loading: "still loading models… tick them once they appear"
  added: "added; pick another provider, or Save"
  tick_first: "tick a model first (Space)"
  model_title: "Choose the model every task tries first"
  model_now: "Now: {current}"
  cannot_be_first: "{model} cannot be tried first: {reason}"
  nothing_set_up: "No model is set up yet. Type /config to connect one."
  now_first: "{model} is now tried first ({provider})"
  # The model tried first, and the server it runs on when it was added by URL.
  first_model: "{model} ({provider})"
  model_on_server: "{model} on {server}"
  first_failed: "could not change the first model: {reason}"
  # /model: R asks, R again removes the model (only from its own server).
  remove_confirm: "Press R again to remove {model} ({provider}); move to another row to keep it."
  removed: "{model} removed ({provider})"
  remove_failed: "could not remove {model}: {reason}"
  # /config: what is set up already, shown before anything new is ticked.
  basket_current: "Set up now: {models}. Tick more to add them, or Esc to keep these."
  setting_up: "Setting up {provider} · {models} …"
  # The one line under the tabs: how many models, on how many servers, and the first.
  summary: "{dot} {models} models · {servers} servers · {first}"
  summary_auto: "Auto picks per task"
  summary_first: "{model} first"
  # The status bar at the foot of the main screen.
  status_reading: "reading your setup…"
  status_none: "no model set up · /config"
  status_auto: "Auto · {count} models"
  status_first: "{model} first"
  gateway_on: "gateway on"
  gateway_off: "gateway off"
  status_working: "working {seconds}s · esc cancels"
  status_hint: "/ commands · ctrl+c quit"
  status_unavailable: "status unavailable: {error}"
  unreadable_command: "could not read that command: {error}"
  exit_code: "exit {code}"
  no_match: "no onex command matches '/{command}'; type / to list them"
  setup_ready: "Ready: {provider} · {models}. Type a task to try it, or /model to choose which goes first."
  # One delegated task's facts, and the status bar's note of the last one.
  run_unknown_model: "unknown model"
  run_tokens: "{tokens} tokens"
  run_seconds: "{seconds} s"
  run_cost: "${cost}"
  run_saved: "saved ${saved}"
  run_id: "run {run}"
  last_run: "last run {model} ${cost}"
