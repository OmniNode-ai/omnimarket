  raw_text_pattern: '\[Errno|Traceback|\w+(Error|Exception)\b|(?:^|[\s(\x27"])(?:/[\w.\-]+){2,}|~/[\w.\-]+|\b[A-Za-z]:\\|\b[A-Z][A-Z0-9]*_[A-Z0-9_]+\b'
