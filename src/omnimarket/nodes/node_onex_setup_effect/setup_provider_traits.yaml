# Setup inputs each provider takes (OMN-23413). Setup reads this to decide
# whether to ask for a server URL or a key and which canonical owner registers
# the choice. Routing never reads it, and no code compares a provider name
# (deployment-fact gate). Loaded by models/model_setup_provider_traits.py.
url_required: [local, openai_compatible, ollama]
# The user's own server: keyless unless they say it needs a key.
endpoint_auth: [ollama]
# The credential owner a provider's key is stored under, when not its own.
key_provider:
  ollama: openai_compatible
# The canonical endpoint owner a selection registers as, keyed or keyless.
registers_as:
  ollama:
    keyed: openai_compatible
    keyless: local
# What the TUI's /config offers, in this order; /config opens on the first.
# A provider in url_required asks for its server's URL, which nothing fills in
# for the user (the server they already use is offered when one is set up);
# any other asks for its key. Each hint comes from the provider's own docs
# (aistudio.google.com/docs/api-key, docs.ollama.com/faq, openrouter.ai/docs).
picker:
  - provider: gemini
    label: Google Gemini
    hint: Create a key at aistudio.google.com/apikey.
  - provider: openai
    label: OpenAI
    hint: Create a key under API keys in your OpenAI dashboard.
  - provider: openrouter
    label: OpenRouter
    hint: Create a key at openrouter.ai/keys.
  - provider: local
    label: Local model
    hint: >-
      Any model server that speaks the OpenAI API: Ollama, vLLM, llama.cpp, LM
      Studio or MLX. Enter its address; its models load on their own and the
      server is named from its answer.
