# Setup inputs each provider takes (OMN-23413). Setup reads this to decide
# whether to ask for a server URL or a key and which canonical owner registers
# the choice. Routing never reads it, and no code compares a provider name
# (deployment-fact gate). Loaded by models/model_setup_provider_traits.py.
url_required: [local, openai_compatible]
# The user's own server, a Local Model: keyless unless they say it needs a key
# (OMN-23413: any model server, by its endpoint URL).
endpoint_auth: [local]
# The credential owner a provider's key is stored under, when not its own.
key_provider:
  local: openai_compatible
# The canonical endpoint owner a selection registers as, keyed or keyless.
registers_as:
  local:
    keyed: openai_compatible
    keyless: local
# What the TUI's /config offers, in this order; /config opens on the first.
# A provider in url_required asks for its server's URL, which nothing fills in
# for the user (the server they already use is offered when one is set up);
# any other asks for its key. Each hint comes from the provider's own docs
# (aistudio.google.com/docs/api-key, openrouter.ai/docs).
picker:
  - provider: gemini
    label: Google Gemini
    hint: Create a key at aistudio.google.com/apikey.
  - provider: openai
    label: OpenAI
    hint: Create a key under API keys in your OpenAI dashboard.
  - provider: openrouter
    label: OpenRouter
    hint: Create a key at openrouter.ai/keys.
  - provider: reflection
    label: Reflection AI
    hint: Create a key under API Keys at platform.reflection.ai.
  # Operator 2026-11-26: more providers. Both are already set up and listed by
  # the same code as the rest (onex models add; byok_provider_backends key_page
  # and models_url); the hints name those key pages.
  - provider: anthropic
    label: Anthropic
    hint: Create a key at platform.claude.com/settings/keys.
  # docs.z.ai (read 2026-11-26): the provider is Z.AI, GLM its model family; a
  # Standard API Key is created on its API Keys page.
  - provider: glm
    label: Z.AI
    hint: Create a Standard API Key at z.ai/manage-apikey/apikey-list.
  # docs.hopscotchlabs.ai (read 2026-11-26): the product is Hopscotch; a key is
  # created on the dashboard's Keys screen at platform.hopscotchlabs.ai
  # (get-started/quickstart, get-started/authentication). OMN-26688, operator
  # 2026-11-26: "add ... as new provider".
  - provider: hopscotch
    label: Hopscotch
    hint: Create a key on the Keys screen at platform.hopscotchlabs.ai.
  # opencode.ai/docs (read 2026-11-26): pay as you go, per request, from credits;
  # a key is made in the Console at opencode.ai/console (Account, Personal API
  # keys) and shown once; the base URL is opencode.ai/inference with
  # /openai/v1/chat/completions. Free-tier models answer only OpenCode itself.
  # OMN-26688, operator 2026-11-26: "add https://opencode.ai/ as a provider".
  - provider: opencode
    label: OpenCode
    hint: >-
      Create a key in the OpenCode Console at opencode.ai/console: Account, then
      Personal API keys. Paid models only; the free ones answer only OpenCode.
  # opencode.ai/docs/go (read 2026-11-26): a subscription ($10, $40, or $20 a
  # member a month); subscribe, then copy the Console key. The base URL is
  # opencode.ai/inference/go; every request carries the client's own user agent
  # and an x-opencode-session id (provider_client_headers.py); a key with no Go
  # subscription is refused. OMN-26688, operator 2026-11-26: "add both".
  - provider: opencode-go
    label: OpenCode Go
    hint: >-
      Needs a Go subscription: subscribe at opencode.ai/console, then create a
      key there under Account, Personal API keys.
  - provider: local
    label: Local Model
    hint: >-
      Any model server you run that speaks the OpenAI API. Enter its endpoint
      URL; its models load on their own and the server is named from its
      answer.
