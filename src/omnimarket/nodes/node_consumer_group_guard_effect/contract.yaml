name: node_consumer_group_guard_effect
contract_version:
  major: 1
  minor: 0
  patch: 0
node_type: effect
node_version:
  major: 1
  minor: 0
  patch: 0
description: Counts a bus's consumer groups by state, fails when the Empty groups pass the threshold this contract declares, and deletes long-Empty per-call groups under the limits this contract declares.
# The threshold the guard enforces (OMN-21818). The dev broker segfaulted three times
# on 2026-10-31 holding 19,154 Empty groups and the CI bus crash-looped holding about
# 15,400; a bus that leaks per-call groups again reaches this within hours, because the
# broker keeps an Empty group for 24 hours.
consumer_group_guard:
  empty_group_max: 2000
  # Reaping (OMN-21818). A group is deleted only when it has been Empty in every run for
  # min_empty_age_seconds (two listings at least that far apart agree), its name matches a
  # reapable pattern (a per-call hex suffix) and matches no protected pattern. Protected
  # names win. Stable-named groups (the host drift fleet's `<prefix>.<host>` group,
  # anything unlisted) are never deleted. The host drift check's persisted
  # `<host>.<hex12>` reader group (the hex is its stored reader id, one per host and topic
  # consumer) is Empty between its 15 minute runs, so it is protected as well: deleting it
  # sent every run back to the start of the topic (measured 2026-11-12: 21,911 and 11,115
  # events read per run), and a run cut off at its 30 second window then reported healthy
  # hosts as silent. Its orphans expire on the broker's own 24 hour retention. The
  # per-session gateway groups are per-call names and are reapable. The broker is
  # checked after every batch; the run stops at the first error or unhealthy reading.
  reap:
    enabled: true
    min_empty_age_seconds: 600
    max_deletes_per_run: 1000
    batch_size: 200
    reapable_patterns:
      - '^local\.omnimarket\.work_ledger_append_client\.consume\.v1\.[0-9a-f]{12}(\..*)?$'
      - '^local\.omnimarket\.scm_command_client\.consume\.v1\.[0-9a-f]{12}(\..*)?$'
      - '^local\.omnibase_core\.runtime_local_terminal_run_[0-9a-f]{12}(_t[0-9]+)?\.consume\.v1(\..*)?$'
      - '^local\.omnibase_core\.runtime_local_terminal_t[0-9]+_run_[0-9a-f]{12}\.consume\.v1(\..*)?$'
      - '^local\.omnibase_core\.handlerdevheadmonitor_run_[0-9a-f]{12}\.consume\.v1(\..*)?$'
      - '^local\.omnimarket\.lab_work_client\.consume\.v1\.[0-9a-f]{12}\.(t|cap)(\..*)?$'
      - '^receipt-mode-client\.[0-9a-f]{12}(\..*)?$'
      - '^gateway-canary-probe-[a-z]+-[0-9a-f]{32}$'
      - '^local\.[a-z_]+\.host_drift_fleet\.h[0-9]+\.[0-9a-f]{12}(\..*)?$'
      - '^onex\.gateway-session\.[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
    protected_patterns:
      - 'host_drift_fleet\.h[0-9]+(\.__t\..*)?$'
      - '^local\.[a-z_]+\.host_drift_fleet\.h[0-9]+\.[0-9a-f]{12}(\.__t\..*)?$'
schedule:
  # The node's own timer (OMN-22194). The host installer cannot take the lab form as data, so
  # this node renders a systemd user timer the way node_host_reconcile_effect does:
  # `python -m omnimarket.nodes.node_consumer_group_guard_effect schedule <verb>`. The cadence is
  # a first pass, then every `interval` after the previous run began. The service has no start
  # timeout, because the launchd unit this replaces has none. The hosts, and the bus lane and
  # workspace config root each runs with, are rows of the node overlay.
  unit_name: onex-consumer-group-guard
  dispatch_venv: .onex-dispatch-venv
  state_directory: .onex_state/consumer-group-guard
  cadence:
    first_pass: 1s
    interval_seconds: 300
    accuracy: 1s
    description: a first pass at install, then every 300 s
  schedulers:
    systemd-user: installed by this node (schedule install) as a systemd user timer
input_model:
  name: ModelConsumerGroupGuardRequest
  module: omnimarket.models.consumer_group_guard
output_model:
  name: ModelConsumerGroupCensus
  module: omnimarket.models.consumer_group_guard
handler:
  module: omnimarket.nodes.node_consumer_group_guard_effect.handlers.handler_consumer_group_guard
  class: HandlerConsumerGroupGuardEffect
handler_routing:
  routing_strategy: operation_match
  handlers:
    - operation: consumer_group_guard_effect
      handler:
        name: HandlerConsumerGroupGuardEffect
        module: omnimarket.nodes.node_consumer_group_guard_effect.handlers.handler_consumer_group_guard
    - operation: consumer_group_reap_effect
      handler:
        name: HandlerConsumerGroupReaper
        module: omnimarket.nodes.node_consumer_group_guard_effect.handlers.handler_group_reaper
descriptor:
  node_archetype: effect
  purity: impure
  idempotent: true
  timeout_ms: 60000
  runtime_profiles:
    - effects
event_bus:
  subscribe_topics:
    - onex.cmd.omnimarket.consumer-group-guard-effect-requested.v1
  publish_topics:
    - onex.evt.omnimarket.consumer-group-guard-effect-completed.v1
terminal_event: onex.evt.omnimarket.consumer-group-guard-effect-completed.v1
runtime_dispatch:
  command_topic: onex.cmd.omnimarket.consumer-group-guard-effect-requested.v1
externally_consumed_topics:
  - onex.evt.omnimarket.consumer-group-guard-effect-completed.v1
metadata:
  transport_type: http
  additional_transports:
    - kafka
