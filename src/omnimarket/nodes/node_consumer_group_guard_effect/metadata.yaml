name: node_consumer_group_guard_effect
version: 1.0.0
description: Counts and reaps long-Empty consumer groups under contract limits, renders the node-owned timer, and validates supplied cutover readbacks with schedule verify-cutover.
omnibase_core_compat: '>=0.47.44,<1.0.0'
entry_points:
  onex.nodes:
    node_consumer_group_guard_effect: omnimarket.nodes.node_consumer_group_guard_effect
capabilities:
  standalone: true
  full_runtime: true
  requires_network: true
  requires_repo: false
  requires_secrets: true
  requires_docker: false
  side_effect_class: destructive
dependencies:
  - pydantic>=2.0
  - omnibase-infra>=0.38.77
  - pyyaml>=6.0
  - confluent-kafka>=2.0
pack: observability
display_name: Consumer Group Guard Effect
node_role: effect
authors:
  - OmniNode Platform Team
license: MIT
tags:
  - effect
  - health
  - consumer-groups
