name: node_operator_waiting_tick_effect
node_type: effect
contract_version:
  major: 1
  minor: 0
  patch: 0
node_version: 1.0.0
description: 'Reads the live ledger with the caller''s capture and archive snapshot
  through the Wave 1 fold. Both waiting and throughput ticks consume that one typed
  snapshot. The waiting list is the pure operator item renderer''s exhaustive output,
  grouped by owner and oldest first. An unread source prints UNKNOWN open-items and
  exits nonzero. An otherwise healthy tick still prints every old item. Nonempty known
  lists append one STATUS row with actor=script:operator-waiting-tick through the
  row writer; a refused write never hides the list.

  '
