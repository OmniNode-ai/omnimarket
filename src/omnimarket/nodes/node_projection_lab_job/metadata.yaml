name: projection_lab_job
version: "1.0.0"
description: >
  Materializes lab job transitioned events into lab_job_state (one complete
  post-transition row per job_id, ordered by the orchestrator's CAS-assigned
  seq) and lab_job_transitions (one append-only row per job_id and seq).
omnibase_core_compat: ">=0.39.0,<1.0.0"
capabilities:
  standalone: true
  full_runtime: true
  requires_network: true
  requires_secrets: true
  side_effect_class: write_db
dependencies:
  - "omnibase_core>=0.39.0"
  - "pyyaml>=6.0"
tags:
  - projection
  - lab-job
  - reducer
ownership:
  lab_job_state:
    ddl_owner: omnimarket.nodes.node_projection_lab_job
    table_role: projection_read_model
    create_migration: "migrations/0000_create_lab_job.sql"
    duplicate_migration_policy: forbid_cross_repo_create_table
    non_owner_repos:
      - omnibase_infra
    rationale: >
      omnibase_infra APPLIES the migration through its forward-migration
      runner and does not own the read model. The table is an omnimarket
      projection written only by this node.
  lab_job_transitions:
    ddl_owner: omnimarket.nodes.node_projection_lab_job
    table_role: projection_read_model
    create_migration: "migrations/0000_create_lab_job.sql"
    duplicate_migration_policy: forbid_cross_repo_create_table
    non_owner_repos:
      - omnibase_infra
    rationale: >
      omnibase_infra APPLIES the migration through its forward-migration
      runner and does not own the read model. The table is an omnimarket
      projection written only by this node.
pack: "data"
display_name: "Projection: Lab Job"
node_role: "effect"
