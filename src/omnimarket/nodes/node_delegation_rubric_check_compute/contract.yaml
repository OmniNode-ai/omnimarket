name: node_delegation_rubric_check_compute
contract_version:
  major: 1
  minor: 0
  patch: 0
node_type: compute
node_version:
  major: 1
  minor: 0
  patch: 0
description: Pure definition-B per-class delegated answer rubric checks (OMN-20165).
  Records typed correctness evidence without gating, I/O, or execution.
handler_routing:
  routing_strategy: operation_match
  handlers:
  - operation: delegation_rubric_check
    handler:
      name: HandlerDelegationRubricCheck
      module: omnimarket.nodes.node_delegation_rubric_check_compute.handlers.handler_delegation_rubric_check
handler:
  module: omnimarket.nodes.node_delegation_rubric_check_compute.handlers.handler_delegation_rubric_check
  class: HandlerDelegationRubricCheck
  input_model: omnimarket.nodes.node_delegation_rubric_check_compute.models.model_rubric_check_request.ModelRubricCheckRequest
descriptor:
  node_archetype: compute
  purity: pure
  idempotent: true
  timeout_ms: 5000
  runtime_profiles:
  - main
inputs:
  task_class:
    type: str
    required: true
    description: Delegated task class.
  request_text:
    type: str
    required: true
    description: Prompt supplied to the delegate.
  answer_text:
    type: str
    required: true
    description: One delegated answer.
  source_text:
    type: str
    required: false
    description: Optional source context.
  rubric:
    type: object
    required: true
    description: Resolved typed class rubric.
  execution_results:
    type: tuple
    required: false
    description: Caller-supplied test execution evidence.
outputs:
  task_class:
    type: str
  rubric_version:
    type: str
  criteria:
    type: tuple
  outcome:
    type: str
  failed_criteria:
    type: tuple
terminal_event: onex.evt.omnimarket.delegation-rubric-checked.v1
event_bus:
  subscribe_topics:
  - onex.cmd.omnimarket.delegation-rubric-check-requested.v1
  publish_topics:
  - onex.evt.omnimarket.delegation-rubric-checked.v1
metadata:
  transport_type: kafka
runtime_dispatch:
  command_topic: onex.cmd.omnimarket.delegation-rubric-check-requested.v1
externally_consumed_topics:
- onex.evt.omnimarket.delegation-rubric-checked.v1
