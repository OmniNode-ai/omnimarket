name: node_host_capability_compute
version: 1.0.0
description: Render the capability half of the lab host parity probe (pr-create over the bus, git push with workflow
  scope, shellcheck, the delegation key, ssh to the other lab hosts), parse its PARITY-CAP lines into typed capabilities,
  and name the refusal, with what the host owner adds, for each capability a unit needs and the host lacks.
pack: distributed_validation
node_role: compute
display_name: Host Capability Compute
omnibase_core_compat: '>=0.39.0,<1.0.0'
entry_points:
  onex.nodes:
    node_host_capability_compute: omnimarket.nodes.node_host_capability_compute
capabilities:
  standalone: true
  full_runtime: false
  requires_network: false
  requires_repo: false
  requires_secrets: false
  requires_docker: false
  side_effect_class: none
dependencies: []
authors:
- OmniNode Platform Team
license: MIT
tags:
- compute
- host-capability-compute
- OMN-21373
