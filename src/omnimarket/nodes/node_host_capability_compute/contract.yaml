name: node_host_capability_compute
lifecycle: experimental
node_type: COMPUTE_GENERIC
runtime_profiles: []
contract_version:
  major: 1
  minor: 0
  patch: 0
node_version: 1.0.0
description: Render the capability half of the lab host parity probe (pr-create over the bus, git push with workflow
  scope, shellcheck, the delegation key, ssh to the other lab hosts), parse its PARITY-CAP lines into typed capabilities,
  and name the refusal, with what the host owner adds, for each capability a unit needs and the host lacks.
input_model:
  name: ModelHostCapabilityRequest
  module: omnimarket.nodes.node_host_capability_compute.models.model_host_capability
output_model:
  name: ModelHostCapabilityResult
  module: omnimarket.nodes.node_host_capability_compute.models.model_host_capability
handler:
  module: omnimarket.nodes.node_host_capability_compute.handlers.handler_host_capability
  class: HandlerHostCapability
  input_model: omnimarket.nodes.node_host_capability_compute.models.model_host_capability.ModelHostCapabilityRequest
  output_model: omnimarket.nodes.node_host_capability_compute.models.model_host_capability.ModelHostCapabilityResult
handler_routing:
  routing_strategy: operation_match
  default_handler: omnimarket.nodes.node_host_capability_compute.handlers.handler_host_capability:HandlerHostCapability
  handlers:
  - operation: handle
    handler:
      name: HandlerHostCapability
      module: omnimarket.nodes.node_host_capability_compute.handlers.handler_host_capability
event_bus:
  subscribe_topics: []
  publish_topics: []
runtime_dispatch:
  external_trigger: Direct Python invocation with supplied host readings.
descriptor:
  node_archetype: compute
  purity: pure
  runtime_profiles: []
  idempotent: true
  timeout_ms: 5000
replay:
  requires_validator_version: true
  timestamp_authority: ingest_sequence
  deterministic: true
metadata:
  transport_type: local
  description: Render the capability half of the lab host parity probe (pr-create over the bus, git push with workflow
    scope, shellcheck, the delegation key, ssh to the other lab hosts), parse its PARITY-CAP lines into typed capabilities,
    and name the refusal, with what the host owner adds, for each capability a unit needs and the host lacks.
  author: OmniNode Team
  created: '2026-10-24'
  tags:
  - compute
  - host-capability-compute
  - OMN-21373
  related_tickets:
  - OMN-21373
