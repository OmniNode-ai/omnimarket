---
name: golden_chain_sweep
contract_version: {major: 1, minor: 0, patch: 0}
node_type: compute
runtime_profiles: [main]
node_version: {major: 1, minor: 0, patch: 0}

description: >
  Validate end-to-end Kafka-to-DB-projection data flow for golden chains.
  Accepts pre-collected projected_rows and validates field-level correctness
  against chain definitions — pure compute, no Kafka publish or DB polling.

handler:
  module: omnimarket.nodes.node_golden_chain_sweep.handlers.handler_golden_chain_sweep
  class: NodeGoldenChainSweep
  input_model: omnimarket.nodes.node_golden_chain_sweep.handlers.handler_golden_chain_sweep.GoldenChainSweepRequest

handler_routing:
  routing_strategy: operation_match
  handlers:
    - operation: sweep_golden_chains
      handler:
        name: NodeGoldenChainSweep
        module: omnimarket.nodes.node_golden_chain_sweep.handlers.handler_golden_chain_sweep

descriptor:
  node_archetype: compute
  purity: pure
  idempotent: true
  timeout_ms: 180000

inputs:
  chains:
    type: list[ChainDefinition]
    description: >
      Chain definitions with head topic, tail table, and expected fields. Each
      chain may optionally declare max_row_age_seconds + timestamp_field for a
      per-chain recency assertion (OMN-13639).
    required: true
  timeout_ms:
    type: int
    description: "Timeout per chain validation in milliseconds"
    required: false
    default: 15000
  now_iso:
    type: string
    description: >
      ISO-8601 reference clock for the per-chain freshness check (OMN-13639).
      Injected by the caller so the compute stays pure and deterministic; the
      handler never reads the system clock. Required when any selected chain
      declares max_row_age_seconds — a freshness-gated chain dispatched without
      it surfaces as ERROR (fail-fast), never a silent pass.
    required: false

outputs:
  chain_results:
    type: list[ChainResult]
    description: >
      Per-chain validation results with timing, field assertions, and
      row_age_seconds when a freshness threshold is configured. A field-complete
      row older than max_row_age_seconds is reported as status STALE (a distinct
      non-PASS tri-state), not PASS (OMN-13639).
  summary:
    type: object
    description: >
      Overall sweep status (pass/partial/fail/gated/warn) with chain counts. WARN
      means all non-passing chains are stale-only (non-blocking recency warning);
      green PASS requires recent flow, not merely a matching historical row.

terminal_event: onex.evt.omnimarket.golden-chain-sweep-completed.v1

event_bus:
  # OMN-18013: the topic(s) removed here were declared subscriptions with NO handler
  # branch anywhere in this node -- NodeGoldenChainSweep.handle() takes a GoldenChainSweepRequest and probes chain HEAD
  # topics; it has no consume branch for either topic. A declared subscription with no
  # dispatcher is consumed, DLQ'd and COMMITTED on every message while the consumer
  # group reads Stable / LAG 0, so the declaration was worse than its absence.
  subscribe_topics:
    - onex.cmd.omnimarket.golden-chain-sweep-start.v1
    # Monitored golden-chain head topics — swept for Kafka-to-DB-projection health
  publish_topics:
    - onex.evt.omnimarket.golden-chain-sweep-result.v1
    - onex.evt.omnimarket.golden-chain-sweep-completed.v1

metadata:
  transport_type: kafka

runtime_dispatch:
  # OMN-18013 -- the CLI/skill dispatcher is this node's producer. Declared so it is not inferred from subscribe_topics[0].
  command_topic: onex.cmd.omnimarket.golden-chain-sweep-start.v1

# OMN-18013 -- explicit SINK declaration (contract topic graph closure).
# No node contract subscribes to these; they leave the ONEX node graph here.
externally_consumed_topics:
  - onex.evt.omnimarket.golden-chain-sweep-completed.v1
  - onex.evt.omnimarket.golden-chain-sweep-result.v1

# OMN-19998: typed scenarios the golden and error chain tests are generated from. The node
# reports a failed sweep in-band on its completed event (overall_status), so the failure
# shares the success topic and is told apart by that field.
chain_scenarios:
  schema_version: 1
  success_topic: onex.evt.omnimarket.golden-chain-sweep-completed.v1
  failures:
    - name: sweep_failed
      topic: onex.evt.omnimarket.golden-chain-sweep-completed.v1
      discriminators:
        overall_status: fail
  cases:
    - case_name: golden_complete_row_passes_the_sweep
      kind: GOLDEN
      input:
        topic: onex.cmd.omnimarket.golden-chain-sweep-start.v1
        correlation_field: correlation_id
        payload:
          chains:
            - name: registration
              head_topic: onex.evt.omniclaude.routing-decision.v1
              tail_table: agent_routing_decisions
              expected_fields: [correlation_id, selected_agent]
          projected_rows:
            registration:
              correlation_id: golden-chain-reg-123
              selected_agent: agent-api-architect
      expected_events:
        - topic: onex.evt.omnimarket.golden-chain-sweep-completed.v1
          fields: {overall_status: pass, chains_total: 1, chains_passed: 1, chains_failed: 0}
      oracle:
        basis: STATED_BY_PERSON
        statement: One chain whose projected row carries every expected field passes, and a sweep of one passing chain is a pass.
      breaks: [DROP_TERMINAL_PUBLISH, WRONG_CORRELATION_ID]
    - case_name: error_row_missing_a_field_fails_the_sweep
      kind: ERROR
      input:
        topic: onex.cmd.omnimarket.golden-chain-sweep-start.v1
        correlation_field: correlation_id
        payload:
          chains:
            - name: delegation
              head_topic: onex.evt.omniclaude.task-delegated.v1
              tail_table: delegation_events
              expected_fields: [correlation_id, delegated_to]
          projected_rows:
            delegation:
              correlation_id: golden-chain-del-456
      fault:
        kind: BAD_PAYLOAD
      expected_events:
        - topic: onex.evt.omnimarket.golden-chain-sweep-completed.v1
          fields: {overall_status: fail, chains_failed: 1}
      failure: sweep_failed
      ledger_failure_row:
        row_type: FRICTION
        subject: golden_chain_sweep
      reading: NOT_WORKING
      oracle:
        basis: STATED_BY_PERSON
        statement: A projected row that lacks an expected field is a failed chain, and one failed chain fails the sweep; it is never reported as a pass.
      breaks: [DROP_TERMINAL_PUBLISH, WRONG_CORRELATION_ID]
