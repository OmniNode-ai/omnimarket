name: node_compaction_arm_run_effect
lifecycle: experimental
node_type: EFFECT_GENERIC
runtime_profiles: [effects]
contract_version: {major: 1, minor: 0, patch: 0}
node_version: 1.0.0
description: >-
  Produce the compacted context of every arm of a compaction replay case from one frozen prefix.
  Each arm is a fork of the prefix in its own directory with its own configuration directory, so
  the arms differ only at the compaction; equal prefix, ledger, state and compaction-input hashes
  across the arms of a case are checked, and a case that fails the check is removed from every arm.
  The headless premises (a manual compaction at the boundary is accepted; a fork keeps its
  transcript) are falsified first: when either is not established, stock_rerun is REFUSED, the
  report says so, and stock_recorded is the stock arm (label RECORDED_STOCK). A stock_rerun fork
  that shows any custom-boundary evidence is INVALID and is never scored. A mod fork whose reply
  is native counts in the fallback rate.
input_model:
  name: ModelArmRunRequest
  module: omnimarket.nodes.node_compaction_arm_run_effect.models.model_arm_run
output_model:
  name: ModelArmRunResult
  module: omnimarket.nodes.node_compaction_arm_run_effect.models.model_arm_run
handler:
  module: omnimarket.nodes.node_compaction_arm_run_effect.handlers.handler_arm_run
  class: HandlerCompactionArmRun
  input_model: omnimarket.nodes.node_compaction_arm_run_effect.models.model_arm_run.ModelArmRunRequest
  output_model: omnimarket.nodes.node_compaction_arm_run_effect.models.model_arm_run.ModelArmRunResult
handler_routing:
  routing_strategy: operation_match
  handlers:
    - operation: run_compaction_arms
      handler:
        name: HandlerCompactionArmRun
        module: omnimarket.nodes.node_compaction_arm_run_effect.handlers.handler_arm_run
      input_model: omnimarket.nodes.node_compaction_arm_run_effect.models.model_arm_run.ModelArmRunRequest
      output_model: omnimarket.nodes.node_compaction_arm_run_effect.models.model_arm_run.ModelArmRunResult
# The arm adapters (plan section 3.2). track decides isolation: arms of different tracks share
# no worktree and no configuration. calls_model is false for every arm that needs no compactor.
arm_adapters:
  - {arm: stock_rerun, track: stock, kind: native_compaction, calls_model: true}
  - {arm: mod, track: mod, kind: pinned_pack_build, calls_model: true}
  - {arm: stock_recorded, track: stock, kind: recorded_summary, calls_model: false}
  - {arm: oracle, track: control, kind: control, calls_model: false}
  - {arm: empty, track: control, kind: control, calls_model: false}
  - {arm: inverted, track: control, kind: control, calls_model: false}
terminal_event: onex.evt.omnimarket.compaction-arm-run-completed.v1
event_bus:
  subscribe_topics:
    - onex.cmd.omnimarket.compaction-arm-run-start.v1
  publish_topics:
    - onex.evt.omnimarket.compaction-arm-run-completed.v1
runtime_dispatch:
  command_topic: onex.cmd.omnimarket.compaction-arm-run-start.v1
externally_consumed_topics:
  - onex.evt.omnimarket.compaction-arm-run-completed.v1
descriptor:
  node_archetype: effect
  purity: effectful  # copies the frozen prefix into per-arm forks and writes append-only arm records under the run root
  idempotent: true
  timeout_ms: 3600000
  runtime_profiles: [effects]
metadata:
  transport_type: kafka
