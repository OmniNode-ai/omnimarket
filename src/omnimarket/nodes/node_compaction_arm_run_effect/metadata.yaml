name: node_compaction_arm_run_effect
version: 1.0.0
description: Forks one frozen compaction prefix per arm, runs each arm's compactor through an injected adapter and records the compacted context, usage and hashes, with typed refusals.
pack: core
node_role: effect
display_name: Compaction Arm Run Effect
omnibase_core_compat: '>=0.39.0,<1.0.0'
entry_points:
  onex.nodes:
    node_compaction_arm_run_effect: omnimarket.nodes.node_compaction_arm_run_effect
capabilities:
  standalone: false
  full_runtime: false
  requires_network: false
  requires_repo: false
  requires_secrets: false
  requires_docker: false
