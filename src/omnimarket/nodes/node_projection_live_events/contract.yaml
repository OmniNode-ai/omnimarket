---
name: projection_live_events
contract_version: {major: 1, minor: 3, patch: 0}
node_type: reducer
node_version: {major: 1, minor: 3, patch: 0}
input_model: omnimarket.nodes.node_projection_live_events.handlers.handler_projection_live_events.ModelLiveEvent
description: >
  Projects operator-relevant platform and workflow bus events into the live_events table.
  Provides the single real-time event feed for the OmniDash System Event Stream.
  Deduplicates by event_id. Retains the most recent 1000 events.
  Source topics cover platform lifecycle, node generation, delegation commands,
  routing outcomes, failures, registration, deployment, and generated-node invocation.

handler:
  module: omnimarket.nodes.node_projection_live_events.handlers.handler_projection_live_events
  class: HandlerProjectionLiveEvents

handler_routing:
  routing_strategy: operation_match
  handlers:
    - operation: projection_live_events
      handler:
        name: HandlerProjectionLiveEvents
        module: omnimarket.nodes.node_projection_live_events.handlers.handler_projection_live_events
      handler_module: omnimarket.nodes.node_projection_live_events.handlers.handler_projection_live_events
      event_model: omnimarket.nodes.node_projection_live_events.handlers.handler_projection_live_events.ModelLiveEvent
    # OMN-15800: dedicated Kafka->Postgres consumer that additionally
    # publishes a bus-fed snapshot delta per upserted row (mirrors
    # node_projection_registration's registration_projection_runner
    # operation, handler_registration.py::RegistrationProjectionRunner).
    - operation: live_events_projection_runner
      handler:
        name: HandlerLiveEventsProjectionRunner
        module: omnimarket.nodes.node_projection_live_events.handlers.handler_live_events
      handler_module: omnimarket.nodes.node_projection_live_events.handlers.handler_live_events

descriptor:
  node_archetype: reducer
  purity: effectful
  idempotent: true
  timeout_ms: 30000
  runtime_profiles: [effects]

terminal_event: onex.evt.omnimarket.projection-live-events-applied.v1

golden_path:
  - "Consume platform event from any declared subscribe_topic"
  - "Normalise into ModelLiveEvent (id, type, timestamp, source, topic, summary, payload, correlation_id)"
  - "UPSERT row into live_events table keyed on event_id"
  - "Trim table to retain only the most recent 1000 rows"
  - "Emit projection-applied event to terminal_event topic"
  - "Verify row exists in live_events with correct topic, source, and summary"
  - "Projection-API serves the live-events snapshot exposure from the table"

db_io:
  db_tables:
    - name: live_events
      database_ref: application
      schema: omninode_internal
      migration: "0000_create_live_events.sql"
      access: write
      role: live_events

event_bus:
  subscribe_topics:
    # Platform lifecycle and health
    - onex.evt.platform.log-entry.v1
    - onex.evt.platform.node-heartbeat.v1
    - onex.evt.platform.node-introspection.v1
    - onex.evt.platform.node-state-change.v1
    - onex.evt.platform.node-registration.v1
    # Delegation lifecycle
    - onex.cmd.omnimarket.delegate-skill.v1
    - onex.evt.omnimarket.delegate-skill-completed.v1
    - onex.evt.omnimarket.delegate-skill-failed.v1
    - onex.cmd.omnibase-infra.delegation-request.v1
    - onex.evt.omnibase-infra.routing-decision.v1
    - onex.evt.omnibase-infra.inference-response.v1
    - onex.evt.omnibase-infra.quality-gate-result.v1
    - onex.evt.omnibase-infra.delegation-completed.v1
    - onex.evt.omnibase-infra.delegation-failed.v1
    # Node-generation lifecycle
    - onex.cmd.omnimarket.node-generation-requested.v1
    - onex.evt.omnimarket.node-generation-completed.v1
    - onex.evt.omnimarket.node-generation-failed.v1
    - onex.cmd.omnimarket.node-deploy.v1
    - onex.evt.omnimarket.generated-node-invoked.v1
    - onex.evt.omnimarket.delegation-escalation-triggered.v1
    - onex.cmd.omnimarket.tool-reuse-match-requested.v1
    - onex.evt.omnimarket.tool-reuse-matched.v1
    - onex.evt.omnimarket.tool-reuse-no-match.v1
  publish_topics:
    - onex.evt.omnimarket.projection-live-events-applied.v1
    - onex.snapshot.projection.live-events.v1  # onex-topic-allow: projection snapshot topic
  dlq_topics:
    - onex.dlq.omnimarket.projection-live-events-malformed.v1

externally_consumed_topics:
  - onex.evt.omnimarket.projection-live-events-applied.v1
  - onex.snapshot.projection.live-events.v1  # onex-topic-allow: projection snapshot topic

projection_api:
  expose: true
  exposures:
    - topic: onex.snapshot.projection.live-events.v1  # onex-topic-allow: projection snapshot topics use onex.snapshot.* prefix by convention
      table: live_events
      schema: public
      columns:
        - id
        - event_id
        - type
        - timestamp
        - source
        - topic
        - summary
        - payload
        - correlation_id
        - created_at
      order_by: created_at DESC
      freshness_column: created_at
      limit: 100
      # OMN-15800: served from the bus-fed SnapshotCache, never from
      # Postgres (2026-08-09 operator ruling). table/schema above stay for
      # the writer-side / pre-conversion record; the serving path reads
      # bus_backed + key_columns only. Unlike node_projection_savings's
      # savings.v1 (reverted to bus_backed: false in the OMN-15800
      # corrective round over a live cross-tenant SnapshotCache.get_rows()
      # leak), live_events carries NO tenant_id column anywhere in its
      # migrations -- it is a genuinely global, platform-wide operational
      # event stream, so publish_snapshot_delta's default
      # tenant_id="omninode" leaks nothing tenant-scoped. See
      # handler_live_events.py's module docstring for the full analysis.
      bus_backed: true
      key_columns:
        - "event_id"

metadata:
  transport_type: kafka
  operator_surface: true
  demo_path: false
  widget_topics:
    - onex.snapshot.projection.live-events.v1  # onex-topic-allow: projection snapshot topic
