# ONEX Node Contract - Triage Fences Effect (OMN-24248)
#
# The fence derivation as an effect node, moved from a frozen internal repository
# (OMN-20682). The handler reads the rolling work ledger, the open pull
# requests from the PR watcher's local state (no GitHub call) and the lane runner receipts, takes the
# fence list from node_triage_fences_compute and returns the report the lab fill reads. 0.2.0: every
# value that was a default in code (the live window, the pull-request window, the repositories, the
# receipt folder) comes from the node overlay, and a lane whose runner receipt reads running counts
# as live however long it has written no ledger row. Its console script is onex-triage-fences-node.
name: "node_triage_fences_effect"
contract_name: "node_triage_fences_effect"
node_name: "node_triage_fences_effect"
lifecycle: experimental
node_type: effect
contract_version: {major: 0, minor: 2, patch: 0}
node_version: {major: 0, minor: 2, patch: 0}
runtime_profiles: [effects]
description: >
  Derive the triage fence list mechanically from the rolling work ledger: read the ledger file, the
  open pull requests of every overlay repository from the PR watcher's state, and the running lanes
  from the runner receipts, take the fence list from the compute node, and return the report the
  triage lanes read. An unreadable ledger is a refusal, never an empty fence list; an unreadable
  receipt is an error in the report, never a lane silently counted as dead.

input_model:
  name: ModelTriageFencesRequest
  module: omnimarket.nodes.node_triage_fences_effect.models.model_triage_fences_request
  description: Whether to include open pull requests, and the replay clock and window overrides.
output_model:
  name: ModelTriageFencesResult
  module: omnimarket.nodes.node_triage_fences_effect.models.model_triage_fences_report
  description: The fence report, or an exit code and the reason the run could not start.

entry_points:
  console_scripts:
    onex-triage-fences-node: omnimarket.nodes.node_triage_fences_effect.runtime_triage_fences_cli:main

handler:
  module: omnimarket.nodes.node_triage_fences_effect.handlers.handler_triage_fences
  class: HandlerTriageFences
  input_model: omnimarket.nodes.node_triage_fences_effect.models.model_triage_fences_request.ModelTriageFencesRequest
  output_model: omnimarket.nodes.node_triage_fences_effect.models.model_triage_fences_report.ModelTriageFencesResult

runtime_dispatch:
  external_trigger: onex-triage-fences-node (console script), which loads the node overlay and constructs the handler in process.

event_bus:
  subscribe_topics: []
  publish_topics: []

metadata:
  transport_type: local

descriptor:
  node_archetype: effect
  runtime_profiles: []
  purity: effectful
  idempotent: true
  side_effects:
    - read of the rolling work ledger file
    - read of the lane runner receipts folder
    - read-only open pull-request listing from the PR watcher's local state file, when asked (no GitHub call)

overlay:
  node: node_triage_fences_effect
  roots_env: ONEX_SKILL_OVERLAY_ROOTS
