# Redpanda profile of node_lane_host_pool_snapshot_effect (OMN-23664), the shape of the deployed copy in the overlays repository
# (node_lane_host_pool_snapshot_effect/overlay.yaml). The snapshot record goes on the dev bus lane; the broker resolves from the lane
# config under workspace_root, never from this file. The accounts remote argv is a shell loop: the wiring substitutes the declared
# lab_hosts registry_root_candidates for {registry_roots} and the remote shell resolves each root. Synthetic values.
backend: redpanda
snapshot_topic: onex.evt.omnimarket.lane-host-pool-snapshot-recorded.v1
failed_topic: onex.evt.omnimarket.lane-host-pool-snapshot-failed.v1
floor_piece: 2
bus_lane: dev
workspace_root: $OMNIBASE_PATH
advertisement_max_age_seconds: 120
snapshot_max_age_seconds: 180
cores_per_lane: 2
engines:
  - claude_opus
  - claude_sonnet
codex_engine: codex
ledger_lookback_hours: 6
record_suffix: .read-at.json
snapshot_path: $OMNIBASE_PATH/.onex_state/lane-host-pool-snapshot/pool.json
advertisements:
  route: command
  argv: [onex, lab-work, hosts, --json, --bus, kafka, --bus-lane, dev]
  timeout_seconds: 40
ledger_read:
  route: command
  command_env: EXAMPLE_LEDGER_READ_COMMAND
  timeout_seconds: 30
  row_limit: 20000
accounts:
  local_argv: [$OMNIBASE_PATH/.onex-dispatch-venv/bin/python, -m, omnimarket.nodes.node_claude_token_pool_effect, status, --json]
  remote_argv:
    - ssh
    - "{target}"
    - >-
      for r in {registry_roots}; do
      if [ -x "$r/.onex-dispatch-venv/bin/python" ]; then
      exec "$r/.onex-dispatch-venv/bin/python" -m omnimarket.nodes.node_claude_token_pool_effect status --json;
      fi;
      done;
      echo no registry root with the venv >&2;
      exit 127
  timeout_seconds: 20
emission_journal: $OMNIBASE_PATH/.onex_state/floor-simple/emissions.jsonl
