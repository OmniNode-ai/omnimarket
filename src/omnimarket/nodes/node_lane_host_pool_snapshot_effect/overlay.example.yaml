# Example overlay of node_lane_host_pool_snapshot_effect (OMN-23664). The deployed copy lives in the overlays repository under
# node_lane_host_pool_snapshot_effect/overlay.yaml; this example is the in-memory default with synthetic values.
# overlay.redpanda.example.yaml is the redpanda profile.
backend: inmemory
snapshot_topic: onex.evt.omnimarket.lane-host-pool-snapshot-recorded.v1
failed_topic: onex.evt.omnimarket.lane-host-pool-snapshot-failed.v1
floor_piece: 2
advertisement_max_age_seconds: 120
snapshot_max_age_seconds: 180
cores_per_lane: 2
engines:
  - claude_opus
  - claude_sonnet
codex_engine: codex
ledger_lookback_hours: 6
record_suffix: .read-at.json
