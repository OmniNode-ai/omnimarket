# The delegation scenario alarm (OMN-24874). Each scheduled tick reads the last-run record of every watched scenario on this
# host (the evidence file its own unit writes) and writes one ledger STATUS row with src=alarm and alarm=<scenario alarm name>
# for a run that did not succeed, or whose record is missing or unreadable. The row's request id is the scenario and the run's
# own time, so a later tick over the same failed run is a duplicate on the work ledger and writes nothing twice; the next failed
# run is a new row. A successful run writes nothing. The pattern is the deploy-job-failed alarm row of omnibase_infra.
name: node_delegation_scenario_alarm_effect
contract_name: node_delegation_scenario_alarm_effect
node_name: node_delegation_scenario_alarm_effect
contract_version: {major: 0, minor: 1, patch: 0}
node_version: {major: 0, minor: 1, patch: 0}
node_type: effect
lifecycle: experimental
runtime_profiles: [effects]
description: >
  Read the last-run record of each watched delegation scenario (R8, R9) on this host and write one ledger alarm row for a
  run that failed or left no readable record. The node's systemd user timer (scenario-alarm-systemd in
  node_host_installer_registry_units) runs it every 900 seconds.

handler:
  module: omnimarket.nodes.node_delegation_scenario_alarm_effect.handlers.handler_delegation_scenario_alarm
  class: HandlerDelegationScenarioAlarm
  input_model: omnimarket.nodes.node_delegation_scenario_alarm_effect.handlers.handler_delegation_scenario_alarm.ModelScenarioAlarmRequest

# Not a runtime-dispatched handler: the handler takes its alarm block, home directory, ledger append route and clock as
# constructor parameters, so the node runs through its own scheduled tick. It declares no topic: the bus append command owns
# the ledger's.

descriptor:
  node_archetype: effect
  runtime_profiles: [effects]
  purity: impure
  idempotent: true
  side_effects: [file-read, process-spawn, ledger-append]
  timeout_ms: 300000

input_model:
  name: ModelScenarioAlarmRequest
  module: omnimarket.nodes.node_delegation_scenario_alarm_effect.handlers.handler_delegation_scenario_alarm
  description: One alarm tick over the watched scenarios.
output_model:
  name: ModelScenarioAlarmResult
  module: omnimarket.nodes.node_delegation_scenario_alarm_effect.handlers.handler_delegation_scenario_alarm
  description: The alarm row each failed scenario wrote, and the scenarios read as passing.

alarm:
  lane: delegation-scenario-alarm
  ticket: OMN-24874
  actor: node_delegation_scenario_alarm_effect
  owner: item4 delegation scenario lane
  home_env: HOME
  host_env: ONEX_HOST_NAME
  ledger_append_command_env: ONEX_LEDGER_BUS_APPEND_COMMAND
  ledger_append_timeout_seconds: 120
  success_conclusion: success
  # Each watched scenario: its id, the alarm name its row carries, the unit that runs it and the last-run record that unit
  # writes, relative to the home directory.
  scenarios:
    - scenario: R8
      alarm: delegation-scenario-r8-failed
      unit: onex-delegation-scenario-r8
      evidence_file: .local/state/omni/delegation-scenario-r8/last-run.json
    - scenario: R9
      alarm: delegation-scenario-r9-failed
      unit: onex-delegation-scenario-r9
      evidence_file: .local/state/omni/delegation-scenario-r9/last-run.json
