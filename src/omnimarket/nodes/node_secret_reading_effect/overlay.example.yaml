# Synthetic values. The deployment's overlay lives at <root>/node_secret_reading_effect/overlay.yaml
# under a root named in ONEX_SKILL_OVERLAY_ROOTS. No key has a default. Keys are named by folder
# and key only; an overlay never holds a secret value.
ledger_append:
  command_env: ONEX_LEDGER_BUS_APPEND_COMMAND
  host_env: ONEX_LEDGER_HOST_NAME
  timeout_seconds: 90
publish:
  lane: secret-reading
  actor: node:node_secret_reading_effect
  piece: 5
  drill: false
  publish_max_age_seconds: 7200
store:
  backend: secret-store-effect
  secret_store:
    provider: example-provider
    address: https://store.example.invalid
    project_id: 00000000-0000-4000-8000-000000000000
    environment: example
    root_folder: /
    client_id_ref: EXAMPLE_CLIENT_ID
    client_secret_ref: EXAMPLE_CLIENT_SECRET
    identity_file: .example/identity.env
consumers:
  - consumer: example-gate
    folder: /shared/env
    key: EXAMPLE_GATE_PASSWORD
  - consumer: example-decider
    folder: /shared/env
    key: EXAMPLE_DECIDER_KEY
exposure:
  surfaces:
    - /example/ledger/LEDGER.md
    - /example/logs/*.log
  max_bytes_per_surface: 33554432
  planted_dummy:
    surface: /example/drill/planted-dummy.txt
    marker: example-planted-dummy-marker-0000
open_exposures:
  - name: example-broker-password
    recorded_at: "2026-01-01T00:00:00Z"
    awaiting: operator rotation consent
injected_fault: Revoke one consumer's scope in the test store, or point one consumer at a key outside the identity's scope
