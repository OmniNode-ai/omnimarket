name: projection_delegation_eval
version: "1.0.0"
description: "Tenant-scoped labelled delegation items with stale-guarded replacement."
omnibase_core_compat: ">=0.39.0,<1.0.0"
capabilities:
  standalone: true
  full_runtime: true
  requires_network: true
  requires_secrets: true
  side_effect_class: write_db
dependencies:
  - "omnibase_core>=0.39.0"
  - "pyyaml>=6.0"
tags: [projection, delegation, evaluation, reducer]
ownership:
  delegation_eval_items:
    ddl_owner: omnimarket.nodes.node_projection_delegation_eval
    table_role: projection_read_model
    create_migration: "migrations/0000_create_delegation_eval_items.sql"
    duplicate_migration_policy: forbid_cross_repo_create_table
    non_owner_repos: [omnibase_infra]
    rationale: "omnimarket owns the projection; omnibase_infra applies its migrations."
pack: "data"
display_name: "Projection: Delegation Eval"
node_role: "effect"
