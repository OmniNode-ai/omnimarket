# ONEX Node Contract - Board Truth Reconcile (dry run)
#
# Effect node: reads the rolling work ledger, merges its CLAIM/TERMINAL rows
# into the supplied board fact bundles, runs the pure board-truth projection,
# and renders the diff table that replaces the manual board sweep.
#
# This node has NO write path. Dry-run is structural, not a flag default.
# Arming live Linear writes is OMN-16733.
#
# Related Tickets:
#   - OMN-16729: Epic — board-truth mechanization
#   - OMN-16732: node_board_truth_reconcile_effect
#   - OMN-16731: the projection this composes
#   - OMN-16733: the live writer, deliberately absent here
#   - OMN-16735: retires the manual sweep in favour of reading this report
name: "node_board_truth_reconcile_effect"
node_type: "EFFECT_GENERIC"
runtime_profiles:
  - effects
contract_version:
  major: 1
  minor: 0
  patch: 0
node_version: "1.0.0"
description: "Effect node: dry-run board reconciliation — reads the ledger, derives board truth, renders the diff table. No writes."
publish_topics:
  - topic: "onex.evt.omnimarket.board-truth-reconciled.v1"
    description: "Emitted when a dry-run reconciliation completes."
subscribe_topics:
  - topic: "onex.cmd.omnimarket.board-truth-reconcile.v1"
    description: "Command to run a dry-run board reconciliation."
input_model:
  name: "ModelBoardReconcileInput"
  module: "omnimarket.nodes.node_board_truth_reconcile_effect.models.model_board_reconcile_input"
  description: "Board fact bundles, ledger path, evaluation instant, staleness window."
output_model:
  name: "ModelBoardReconcileOutput"
  module: "omnimarket.nodes.node_board_truth_reconcile_effect.models.model_board_reconcile_output"
  description: "Projection rows, rendered diff table, and headline counts."
handler_routing:
  routing_strategy: "operation_match"
  handlers:
    - operation: "reconcile_board_truth"
      handler:
        name: "HandlerBoardTruthReconcile"
        module: "omnimarket.nodes.node_board_truth_reconcile_effect.handlers.handler_board_truth_reconcile"
golden_path:
  - step: "Publish onex.cmd.omnimarket.board-truth-reconcile.v1 with board fact bundles and a ledger path"
  - step: "Handler reads the ledger and parses CLAIM/TERMINAL rows, dropping rows it cannot bind to a ticket"
  - step: "Parsed claims are merged into the fact bundles"
  - step: "HandlerBoardTruth derives one projected row per ticket"
  - step: "The diff table is rendered — FLIPS with citable evidence, then DISCREPANCIES"
  - step: "Emits onex.evt.omnimarket.board-truth-reconciled.v1; nothing is written to Linear"
dod_evidence:
  - "tests/unit/nodes/node_board_truth_reconcile_effect/test_handler_board_truth_reconcile.py — ledger grammar and no-write-path asserted"
  - "Ledger parser proven against verbatim row shapes from docs/tracking/ROLLING_WORK_LEDGER.md"
  - "Idempotence: rerunning over unchanged facts yields an identical report"
  - "ModelBoardReconcileInput rejects a dry_run flag (extra=forbid) — the dry-run cannot be inverted"
metadata:
  description: "Dry-run board reconciler — the projection readback that replaces the manual sweep"
  author: "OmniNode Team"
  created: "2026-08-27"
  tags:
    - "effect"
    - "board-truth"
    - "projection"
    - "OMN-16729"
  related_tickets:
    - "OMN-16729"
    - "OMN-16732"
    - "OMN-16731"
    - "OMN-16733"
