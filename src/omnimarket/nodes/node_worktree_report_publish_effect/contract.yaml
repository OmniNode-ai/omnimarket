name: node_worktree_report_publish_effect
node_type: EFFECT_GENERIC
runtime_profiles: [effects]
contract_version: {major: 1, minor: 0, patch: 0}
node_version: "1.0.0"
description: >
  Scrub and publish completed worktree reports through a detached checkout,
  then hand the exact PR head to the landing controller. No removal, CI polling
  or merge operation. Scrub, publishing and handoff failures remain visible
  through a failed result, a ledger friction row and the configured alert script.
input_model:
  name: ModelWorktreeReportPublishRequest
  module: omnimarket.nodes.node_worktree_report_publish_effect.models
output_model:
  name: ModelWorktreeReportPublishResult
  module: omnimarket.nodes.node_worktree_report_publish_effect.models
handler:
  module: omnimarket.nodes.node_worktree_report_publish_effect.handlers.handler_worktree_report_publish
  class: HandlerWorktreeReportPublish
  input_model: omnimarket.nodes.node_worktree_report_publish_effect.models.ModelWorktreeReportPublishRequest
  output_model: omnimarket.nodes.node_worktree_report_publish_effect.models.ModelWorktreeReportPublishResult
entrypoint:
  name: NodeWorktreeReportPublishEffect
  module: omnimarket.nodes.node_worktree_report_publish_effect.node
handler_routing:
  routing_strategy: operation_match
  default_handler: omnimarket.nodes.node_worktree_report_publish_effect.handlers.handler_worktree_report_publish:HandlerWorktreeReportPublish
  handlers:
    - operation: publish
      topic: onex.cmd.omnimarket.worktree-report-publish-requested.v1
      handler:
        name: HandlerWorktreeReportPublish
        module: omnimarket.nodes.node_worktree_report_publish_effect.handlers.handler_worktree_report_publish
terminal_event: onex.evt.omnimarket.worktree-report-publish-completed.v1
runtime_dispatch:
  command_topic: onex.cmd.omnimarket.worktree-report-publish-requested.v1
event_bus:
  subscribe_topics: [onex.cmd.omnimarket.worktree-report-publish-requested.v1]
  publish_topics: [onex.evt.omnimarket.worktree-report-publish-completed.v1]
metadata:
  transport_type: inmemory
descriptor:
  node_archetype: effect
  purity: effectful
  runtime_profiles: [effects]
  idempotent: false
  timeout_ms: 3600000
externally_consumed_topics:
  - onex.evt.omnimarket.worktree-report-publish-completed.v1
