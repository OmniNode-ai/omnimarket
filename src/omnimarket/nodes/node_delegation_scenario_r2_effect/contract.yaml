# ONEX Node Contract - Delegation Scenario R2 Effect (OMN-23172, readiness plan A4)
#
# Scenario R2, a local model added after onboarding. One scheduled run, in a fresh state directory of its own:
#   onboard with one key (`onex models add <provider> --model <m>`), refuse a URL that does not answer (no route written),
#   add the first local model, read `onex models list --json`, delegate pinned to `local-url` (in process), add a second
#   local model and read the list again. Registration is read from the list: the add's own test delegation goes through
#   the shared bus, which a fresh home with no lane identity cannot reach. Every assertion is a byte or field comparison; no model judges a pass, a missing setting
#   is a failure and never a skip. The result is emitted on the bus and written as one ledger STATUS row (the row
#   node_delegation_scenario_days_effect reads for the scenario's green days).
name: node_delegation_scenario_r2_effect
contract_name: node_delegation_scenario_r2_effect
node_name: node_delegation_scenario_r2_effect
contract_version: {major: 0, minor: 1, patch: 0}
node_version: {major: 0, minor: 1, patch: 0}
node_type: effect
lifecycle: experimental
runtime_profiles: [effects]

description: >
  Runs readiness scenario R2 once with the onex command line in an isolated home, publishes the result on the bus and
  writes one ledger STATUS row. The node's own systemd user timer (`schedule install`) runs it hourly.

handler:
  module: omnimarket.nodes.node_delegation_scenario_r2_effect.handlers.handler_scenario_r2
  class: HandlerScenarioR2
  input_model: omnimarket.models.model_delegation_scenario.ModelScenarioR2RunCommand

# Not a runtime-dispatched handler: HandlerScenarioR2 takes its contract runtime block, command runner, ledger append
# route, event sink and clock as constructor parameters, so the node runs through its own CLI and schedule.

descriptor:
  node_archetype: effect
  runtime_profiles: [effects]
  purity: impure
  idempotent: false
  side_effects: [subprocess, file-write, ledger-append, bus-publish]
  timeout_ms: 900000

input_model:
  name: ModelScenarioR2RunCommand
  module: omnimarket.models.model_delegation_scenario
  description: One run of scenario R2; it carries no value.
output_model:
  name: ModelScenarioResult
  module: omnimarket.models.model_delegation_scenario
  description: The slot, trigger, conclusion and each assertion that held or did not.

terminal_event: onex.evt.omnimarket.delegation-scenario-result.v1

runtime_dispatch:
  external_trigger: true

event_bus:
  subscribe_topics: []
  publish_topics:
    - onex.evt.omnimarket.delegation-scenario-result.v1

externally_consumed_topics:
  - onex.evt.omnimarket.delegation-scenario-result.v1

runtime:
  home_env: OMNI_HOME
  ledger_append_command_env: ONEX_LEDGER_BUS_APPEND_COMMAND
  ledger_append_timeout_seconds: 60
  host_env: ONEX_HOST_NAME
  bus_emit_command_env: ONEX_BUS_EMIT_COMMAND
  # Every event is journalled here; when the deployment names a bus produce command in bus_emit_command_env it also gets the event.
  event_journal_relpath: .onex_state/delegation-scenario-r2/events.jsonl
  bus_emit_timeout_seconds: 60
  scenario_id: R2
  cadence: hourly
  ticket: OMN-23172
  lane: node_delegation_scenario_r2_effect
  actor: script:node_delegation_scenario_r2_effect
  # The scenario runs in a fresh home each time (a fresh machine): this directory under the registry home is wiped first.
  work_relpath: .onex_state/delegation-scenario-r2/home
  onex_command: [onex]
  command_timeout_seconds: 240
  # Deployment data, each named by the variable that holds it. The key itself is never in the contract, a command line,
  # a log or a row: it is read from the variable and written to the command's stdin.
  onboarding:
    provider_env: ONEX_SCENARIO_R2_PROVIDER
    provider_url_env: ONEX_SCENARIO_R2_PROVIDER_URL
    key_env: ONEX_SCENARIO_R2_KEY
    model_env: ONEX_SCENARIO_R2_PROVIDER_MODEL
  # The first and second local model: `<base url>|<model id>` each. dead_url is a base URL that must not answer.
  local_first_env: ONEX_SCENARIO_R2_LOCAL_FIRST
  local_second_env: ONEX_SCENARIO_R2_LOCAL_SECOND
  # A base URL that must not answer (the refusal leg).
  dead_url_env: ONEX_SCENARIO_R2_DEAD_URL
  # The scenario's settings are read from this folder of the secret store when the environment does not
  # hold them; no value is in the contract.
  secret_store_folder: /shared/env
  # Where each run variable is found, by existing names (OMN-23602): the environment, the host environment file, the store.
  settings_overlay_relpath: inputs/settings_overlay.yaml
  local_backend_id: local-url
  delegate_task_type: summarization
  # A sentence, not a single word: the quality gate vetoes a bare one-word answer.
  delegate_prompt: "Summarize in one full sentence: a local model server added after onboarding answers the tasks a customer delegates to it."
  delegate_args: [--bus, inmemory, --locus, in-process]

schedule:
  unit_name: onex-delegation-scenario-r2
  state_directory: .onex_state/delegation-scenario-r2
  timeout_seconds: 900
  unit_environment: [ONEX_LEDGER_BUS_APPEND_COMMAND, ONEX_HOST_NAME, ONEX_WORKSPACE_CONFIG_ROOT, ONEX_BUS_EMIT_COMMAND, ONEX_SCENARIO_R2_DEAD_URL, ONEX_SCENARIO_R2_PROVIDER, ONEX_SCENARIO_R2_PROVIDER_URL, ONEX_SCENARIO_R2_PROVIDER_MODEL, ONEX_SCENARIO_R2_LOCAL_FIRST, ONEX_SCENARIO_R2_LOCAL_SECOND]
  # The key variable is loaded from this file under the home directory when it exists; it never sits in the unit.
  environment_file: .config/onex/scenario-r2.env
  cadence:
    on_calendar: "*-*-* *:05:00"
    time_zone: UTC
    randomized_delay: 0s
    persistent: false
    description: delegation readiness scenario R2, hourly at minute 05 UTC

metadata:
  ticket: OMN-23172
  transport_type: inmemory
