name: node_factory_floor_effect
lifecycle: experimental
node_type: EFFECT_GENERIC
runtime_profiles: []
contract_version:
  major: 1
  minor: 0
  patch: 0
node_version: 1.0.0
description: >-
  Read the factory floor's sources (plans and their .tasks.yaml manifests, the PR watcher state, the ledger
  through the ledger reader, the Linear snapshot plans-today writes, the lab placement reading, the friction
  report), call node_factory_floor_compute with them and write its JSON to the path this contract declares.
  The only reads and the only write of the factory floor live here; the compute node is pure.
dependencies:
  - name: omnimarket.nodes.node_cloud_session_placement_effect
    dependency_type: internal
    description: Read-only typed cloud account snapshot through the canonical runtime.
    required: true
input_model:
  name: ModelFactoryFloorRunRequest
  module: omnimarket.nodes.node_factory_floor_effect.models.model_factory_floor_run
  description: The flags of one run.
output_model:
  name: ModelFactoryFloorRunResult
  module: omnimarket.nodes.node_factory_floor_effect.models.model_factory_floor_run
  description: Where the JSON was written and how many lines it holds.
handler:
  module: omnimarket.nodes.node_factory_floor_effect.handlers.handler_factory_floor_effect
  class: HandlerFactoryFloorEffect
  input_model: omnimarket.nodes.node_factory_floor_effect.models.model_factory_floor_run.ModelFactoryFloorRunRequest
  output_model: omnimarket.nodes.node_factory_floor_effect.models.model_factory_floor_run.ModelFactoryFloorRunResult
handler_routing:
  routing_strategy: operation_match
  default_handler: omnimarket.nodes.node_factory_floor_effect.handlers.handler_factory_floor_effect:HandlerFactoryFloorEffect
  handlers:
  - operation: handle
    handler:
      name: HandlerFactoryFloorEffect
      module: omnimarket.nodes.node_factory_floor_effect.handlers.handler_factory_floor_effect
  - operation: emit_seam_count
    handler:
      name: HandlerSeamEmitter
      module: omnimarket.nodes.node_factory_floor_effect.handlers.handler_seam_emitter
    input_model: omnimarket.models.seam_reading.model_seam_emitter.ModelSeamEmitterRequest
    output_model: omnimarket.models.seam_reading.model_seam_emitter.ModelSeamEmitterInsufficient
event_bus:
  subscribe_topics: []
  publish_topics: []

# Declared producer of the seam family's count and window-close events (view_seam_read graph). The floor effect emits VS-01, VS-02 and VS-04 once the floor effect step builds them.
published_events:
  - event_type: ModelSeamCount
    topic: onex.evt.omnimarket.view-seam-counted.v1
    description: "Declared before the node emits it; the emission lands with the step that builds this emitter (status declared in the graph)."
  - event_type: ModelSeamWindowClose
    topic: onex.evt.omnimarket.view-seam-window-closed.v1
    description: "Declared before the node emits it; the emission lands with the step that builds this emitter (status declared in the graph)."
runtime_dispatch:
  external_trigger: python -m omnimarket.nodes.node_factory_floor_effect (runtime_factory_floor.py), from a schedule or by hand.
descriptor:
  node_archetype: effect
  purity: effectful
  runtime_profiles: []
  idempotent: true
  timeout_ms: 600000
  side_effects:
  - reads the plans repository clone, the PR watcher state, the plans-today output, the lab placement reading and the friction report
  - reads the rolling ledger through the plugin's reader, the window and, for unresolved hand-offs, the live ledger and every archive roll through the same reader
  - reads the goal file in the plans repository clone and the queue-status tick's saved required-contexts map
  - reads the trace count and newest span time from the Phoenix GraphQL API at the URL the phoenix_url_env variable names (a read that fails is recorded as unread)
  - reads each declared host's container listing over ssh (read-only listing; a host that cannot be read draws UNKNOWN with its cause)
  - reads the remote-lane receipts, the pool read receipt, the placement markers and cloud accounts file, the lab host table and the runner fleet observation (any of them unread is recorded as unread)
  - reads the API credit meter, engine usage and lab rung status, and token pool status mirrors (any of them unread is recorded as unread)
  - writes the factory floor JSON to runtime.output.relpath under the registry home

# Where the entry reads and writes. Paths are relative to the registry home (the environment variable named by
# home_env) except the plans, which are relative to the plans repository clone (plans_kb_env). Which plans are
# lines is the deployment overlay's plan_path_contains: a file named by overlay_file_env, else
# <ONEX_SKILL_OVERLAY_ROOTS root>/node_factory_floor_effect/overlay.yaml.
runtime:
  home_env: OMNI_HOME
  plans_kb_env: ONEX_PLANS_KB_PATH
  overlay_file_env: ONEX_FACTORY_FLOOR_OVERLAY
  # The goal's scope overlay: which tickets are in scope. A stopped lane is listed only inside it; unread, none is listed.
  goal_scope_overlay_id: goal_scope
  goal_scope_file_env: ONEX_GOAL_SCOPE_OVERLAY
  # The goal's ticket rule overlay: its ticket_roots are the tickets whose work is in scope.
  goal_ticket_rule_overlay_id: goal_scope_ticket_rule
  goal_ticket_rule_file_env: ONEX_GOAL_SCOPE_TICKET_RULE_OVERLAY
  plugin_root_env: CLAUDE_PLUGIN_ROOT
  # The Phoenix base URL the floor reads its trace count and newest span age from; unset draws the reading unread.
  phoenix_url_env: ONEX_FACTORY_FLOOR_PHOENIX_URL
  ledger_window_days: 14
  # The reader cuts each row's text at this many characters (its own default drops the sentence a CLAIM carries).
  ledger_cut_chars: 1200
  # The reader returns 14 days (57 MB) in 8 s in the foreground and 69 s as the Background-class module tick runs it on a Mac at load 56.
  ledger_timeout_seconds: 480
  # The kinds kept from the window. The first five were read before OMN-22368; RULING, MSG, ACK, CORRECTION and FRICTION
  # rows are forwarded whole so the line board can map a ruling to its line and a stop to its cause.
  ledger_kinds: [CLAIM, TERMINAL, HOLD, RELEASE, STATUS, RULING, MSG, ACK, CORRECTION, FRICTION]
  # Unresolved evidence outlives the window: the same ledger reader, over the live ledger and every archive roll with no
  # age limit, filtered by kind and text. Whether a row is resolved is the compute's call, not the effect's.
  unresolved_reads:
    - {kind: TERMINAL, grep: "outcome=blocked"}
    - {kind: TERMINAL, grep: "outcome=partial"}
    - {kind: TERMINAL, grep: "outcome=handed-off"}
    - {kind: STATUS, grep: "handed-off="}
  # Minutes after which a source reads stale. The ledger is read live, so its bar measures the reader's own read time.
  source_max_age_min:
    plans_clone: 1440
    pr_watcher: 90
    ledger_window: 30
    plans_today: 1440
    linear_snapshot: 1440
    running_evidence: 60
    required_contexts: 120
    goal_file: 1440
  # The goal file in the plans repository: rows are ``id | what | verdict | next action | probe``; these verdicts close a row.
  goal_relpath: beta/GOAL.md
  goal_closed_verdicts: [LANDED, DONE]
  watcher_max_age_min: 90
  manifest_suffix: .tasks.yaml
  # A plan without a plans-today entry maps tickets and pull requests only from the header lines that start with
  # one of these keys (text before the first section heading), never from every mention in its prose.
  plan_header_keys: [ticket, tickets, epic]
  plans_relpath: beta/plans
  # A plan with no manifest and no plans-today table of parts draws its tasks from its own text. Each pattern reads one
  # task: its named group "id" is the task id, "title" its title, "rest" the rest of its lead line. The first pattern
  # that finds a task in the plan is the plan's form; the others are not read. Bold-led task paragraphs
  # (``**T1. Title.** ...``, ``1. **S1, now:** ...``) come first; markdown task headings of level 2 to 4
  # (``### T1. Title``, ``## Task W2.3: Title``) are read for a plan that has none.
  heading_task_patterns:
    - '^(?:\d+\.\s+|[-*]\s+)?\*\*(?P<id>[A-Z]{1,4}\.?\d+(?:\.\d+)*[a-z]?)[.,:]?(?:\s+(?P<title>.+?))?\*\*(?P<rest>.*)$'
    - '^#{2,4}\s+(?:Task\s+)?(?P<id>[A-Z]{1,4}\.?\d+(?:\.\d+)*[a-z]?)[.,:]?\s+(?P<title>.+?)\s*$'
  sources:
    watcher_relpath: .claude_scratch/pr-watcher/state.json
    plans_today_dir: .claude_scratch/plans-today
    plans_today_file: plans-today.json
    linear_snapshot_glob: linear-*.txt
    placement_relpath: .claude_scratch/lab-run/hosts.json
    friction_report_relpath: .claude_scratch/friction/friction-report.json
    # The Linear snapshot with ticket titles (plans-today writes it beside the status text file).
    linear_titles_glob: linear-*.json
    # The runner monitor's fleet observation (docker/runners/runner-monitor.sh builds the event with
    # scripts/runner_fleet_event.py); node_projection_runner_fleet saves the newest observation to this path (its
    # state_file), and a bay draws its CI runners as unread until it has.
    runner_fleet_relpath: .onex_state/runner-fleet/runner-fleet.json
    # The host-drift fleet projection (node_host_drift_fleet's persisted fold): each host's newest heartbeat and open items.
    host_drift_relpath: .onex_state/host-drift/fleet.json
    # The queue-status tick's saved required contexts, a map keyed by repository (or repository:branch).
    required_contexts_relpath: .claude_scratch/queue-status/required-contexts.json
  # Limits status mirrors under the registry home; absent or invalid files remain unread.
  limit_sources:
    api_meter_relpath: .claude_scratch/limits/api-credit-meter.json
    engines_relpath: .claude_scratch/limits/engines.json
    token_pool_glob: .claude_scratch/limits/claude-token-pool.*.json
  # The machine bays and the live lanes (OMN-21733). The remote-lane receipts are the runner's per-run JSON files;
  # the pool receipt is the one `onex_lab_run.py --hosts` writes: the landing placement's pool read (load, memory,
  # swap, cap per host, or UNREADABLE). The placement directory holds the live placement markers
  # (<host>.<lease>.<pid>; a lease id at or over lane_marker_min_id is a remote lane) and the cloud accounts file.
  # The lab host table is the file host_table_env names, else the one the deployment overlay's host_table_relpath names.
  lane_sources:
    remote_lane_dir_env: ONEX_REMOTE_LANE_DIR
    remote_lane_dir_fallback: .local/state/omni/remote-lanes
    pool_receipt: hosts-probe/latest.json
    receipt_glob: "rlane-*.json"
    receipt_window_hours: 24
    # Measured 2026-11-06 on the launching Mac at load 29 under the Background clamp: 19,273 directories took 94 s one at
    # a time, 20.7 s with 8 workers and 2.6 s with 32.
    receipt_scan_workers: 32
    result_chars: 600
    placement_dir_env: LANDING_PLACEMENT_DIR
    placement_dir_fallback: .local/state/omni/landing/placement
    lane_marker_min_id: 1000000000
    host_table_env: ONEX_LAB_RUN_HOSTS
    # Run on the launching/controller host: receipt pids, worker leases and placement pids are local there.
    # Reuse landing_workers' group/tag probe so a surviving descendant stays live after its parent exits.
    controller_dir_env: LANDING_STATE_DIR
    controller_dir_fallback: .local/state/omni/landing
    process_start_grace_seconds: 120
  # The node reads v2 accounts on its own host. The deployment overlay may supply
  # cloud_accounts_node_command: [ssh, reachable-state-owner, onex, node].
  # No raw state, credentials or publisher-local filename cross this boundary.
  cloud_source:
    node_name: node_cloud_session_placement_effect
    action: floor_snapshot
    timeout_seconds: 60
  # The lane containers (application container budget): the hosts and budgets are the overlay's; each host is read over ssh with
  # this listing command and judged by node_lane_container_budget_compute. A host that cannot be read draws UNKNOWN with the
  # cause, never an empty count. The command names its fields: the default JSON form makes the engine compute every size.
  container_source:
    ssh_options: ["-o", "BatchMode=yes", "-o", "ConnectTimeout=10"]
    listing_command: >-
      docker ps -a --no-trunc --format
      '{"Names":{{json .Names}},"State":{{json .State}},"Labels":{{json .Labels}}}'
    timeout_seconds: 90
  output:
    relpath: .claude_scratch/factory-floor/factory-floor.json
metadata:
  transport_type: local
  description: >-
    Read the factory floor's sources, call node_factory_floor_compute and write its JSON to the contract's path.
  author: OmniNode Team
  created: '2026-10-31'
  tags:
  - effect
  - factory-floor-effect
  - OMN-21682
  related_tickets:
  - OMN-21682
