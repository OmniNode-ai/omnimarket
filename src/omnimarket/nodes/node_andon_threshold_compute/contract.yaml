#
# ONEX Node Contract
# Node: NodeAndonThresholdCompute (rebuild piece 7, plan rule 11)
#
# Two pure operations, no clock and no file read: the caller supplies the census window
# counts, the date, the frozen thresholds and one tick's observations.
#   compute_thresholds: ModelThresholdComputeRequest -> ModelThresholdComputeResult
#   scope_burst:        ModelBurstScopeRequest       -> ModelBurstScopeResult
name: node_andon_threshold_compute
node_type: compute
lifecycle: experimental
runtime_profiles: []
contract_version: {major: 1, minor: 0, patch: 0}
node_version: {major: 1, minor: 0, patch: 0}
description: >-
  Computes the andon threshold of each census class as its measured peak over 24 hour
  windows and freezes the set with a hash of its values and a recalibration date; a changed
  value without a new hash is refused when the freeze is read. Decides, for one tick's
  observations, which pieces a friction burst stops: only the piece that originated a class
  count above its frozen threshold, every other listed piece stays admitted.
input_model:
  name: ModelThresholdComputeRequest
  module: omnimarket.models.model_andon_threshold
output_model:
  name: ModelThresholdComputeResult
  module: omnimarket.models.model_andon_threshold
handler:
  module: omnimarket.nodes.node_andon_threshold_compute.handlers.handler_threshold_compute
  class: HandlerThresholdCompute
  input_model: omnimarket.models.model_andon_threshold.ModelThresholdComputeRequest
  output_model: omnimarket.models.model_andon_threshold.ModelThresholdComputeResult
handler_routing:
  routing_strategy: operation_match
  default_handler: omnimarket.nodes.node_andon_threshold_compute.handlers.handler_threshold_compute:HandlerThresholdCompute
  handlers:
    - operation: compute_thresholds
      handler:
        name: HandlerThresholdCompute
        module: omnimarket.nodes.node_andon_threshold_compute.handlers.handler_threshold_compute
      input_model: omnimarket.models.model_andon_threshold.ModelThresholdComputeRequest
      output_model: omnimarket.models.model_andon_threshold.ModelThresholdComputeResult
    - operation: scope_burst
      handler:
        name: HandlerBurstScope
        module: omnimarket.nodes.node_andon_threshold_compute.handlers.handler_burst_scope
      input_model: omnimarket.models.model_andon_threshold.ModelBurstScopeRequest
      output_model: omnimarket.models.model_andon_threshold.ModelBurstScopeResult
descriptor:
  node_archetype: compute
  purity: pure
  idempotent: true
  side_effects: []
  runtime_profiles: []
  timeout_ms: 2000
event_bus:
  subscribe_topics: []
  publish_topics: []
runtime_dispatch:
  external_trigger: Direct Python invocation by the process spine tick with supplied census counts, frozen thresholds and observations.
metadata:
  transport_type: local
