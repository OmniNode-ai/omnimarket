# Copy to <root>/node_overlay_merge_order_compute/overlay.yaml and set ONEX_SKILL_OVERLAY_ROOTS to that
# root. Every value here is synthetic; supply your deployment's facts. No key has a default, and an
# overlay that cannot be found refuses the run.
#
#   ahead_verdicts  the merged tree's per-overlay verdicts that mean an overlay is ahead of its code. "accepted"
#                   is the one passing verdict and is never listed. A verdict that is neither accepted nor listed
#                   refuses the run (the overlay must rule on every verdict the merged tree can give).
#   max_named       the most ahead overlays the decided event names; the count is always the full number
#   injected_fault  the fault injected on purpose that must turn the decision AHEAD_OF_CODE
ahead_verdicts:
- rejected
- model_missing
- unreadable
- overlay_missing
max_named: 10
injected_fault: A touched overlay carries a key the merged tree's model refuses
