# ONEX Node Contract - Delegation Scenario Green Days Compute (OMN-23171, readiness plan A1)
#
# Pure: handle(ModelScenarioHistory) -> ModelScenarioGreenDays. node_delegation_scenario_days_effect reads the
# scenarios' recorded results from the ledger and publishes this node's rows.
name: node_delegation_scenario_days_compute
contract_name: node_delegation_scenario_days_compute
node_name: node_delegation_scenario_days_compute
contract_version: {major: 0, minor: 1, patch: 0}
node_version: {major: 0, minor: 1, patch: 0}
node_type: compute
lifecycle: experimental
runtime_profiles: [main]

description: >
  Counts, per delegation readiness scenario, the consecutive complete UTC days ending yesterday that are green.
  Only scheduled results fill a slot, one result per slot (the latest attempt). Every completed conclusion other than
  success is not green, and a run queued or in progress for more than the stale bound is not green. A day is green
  when enough slots settled (hourly 20 of 24, every 6 h 4 of 4, daily 1 of 1) and every settled slot succeeded. A
  history that was not read to its end is red for every scenario. The day count is a request parameter. No clock read,
  no state, no I/O.

handler:
  module: omnimarket.nodes.node_delegation_scenario_days_compute.handlers.handler_scenario_green_days
  class: HandlerScenarioGreenDays
  input_model: omnimarket.models.model_delegation_scenario.ModelScenarioHistory

handler_routing:
  routing_strategy: operation_match
  handlers:
    - operation: compute_scenario_green_days
      handler:
        name: HandlerScenarioGreenDays
        module: omnimarket.nodes.node_delegation_scenario_days_compute.handlers.handler_scenario_green_days
      input_model: omnimarket.models.model_delegation_scenario.ModelScenarioHistory
      output_model: omnimarket.models.model_delegation_scenario.ModelScenarioGreenDays

descriptor:
  node_archetype: compute
  purity: pure
  idempotent: true
  timeout_ms: 5000

input_model:
  name: ModelScenarioHistory
  module: omnimarket.models.model_delegation_scenario
  description: The declared scenarios, every result read, the window and whether the read finished.
output_model:
  name: ModelScenarioGreenDays
  module: omnimarket.models.model_delegation_scenario
  description: One row per scenario, keyed by scenario id, with its green days and each day's slot counts.

terminal_event: onex.evt.omnimarket.delegation-scenario-green-days-computed.v1

runtime_dispatch:
  command_topic: onex.cmd.omnimarket.delegation-scenario-green-days-compute-requested.v1

event_bus:
  subscribe_topics: []
  publish_topics:
    - onex.evt.omnimarket.delegation-scenario-green-days-computed.v1

externally_consumed_topics:
  - onex.evt.omnimarket.delegation-scenario-green-days-computed.v1

metadata:
  ticket: OMN-23171
  transport_type: inmemory
