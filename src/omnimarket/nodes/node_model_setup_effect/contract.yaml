# ONEX Node Contract - Model Setup Effect (OMN-20817)
#
# CLI-run effect, like node_local_secret_store_effect: no subscription and no
# onex.nodes entry point, invoked by the `onex models` shim. `experimental` is
# the drift gate's marker for an intentionally unregistered node; the topic
# graph sees it as an externally triggered ingress root.
name: model_setup_effect
lifecycle: experimental
contract_version: {major: 1, minor: 0, patch: 0}
node_type: effect
node_version: {major: 1, minor: 0, patch: 0}

description: >
  Model setup EFFECT. Reports which of the models delegation can use (Gemini,
  OpenRouter, OpenAI, Anthropic, GLM, Ollama, a local URL) are set up on this machine, and tests one by
  running a single delegation pinned to its backend (`onex delegate
  --backend-id`, pin-or-refuse), recording pass, or fail with the provider's
  reason, and the time. Storing a key is not this node's work: the `onex models`
  shim stores it through node_local_secret_store_effect first. No request,
  result or record carries a key. It also reports the model onboarding registers
  for OpenRouter (`default_model`): ONEX_OPENROUTER_DEFAULT_MODEL, else this node's
  deployment overlay (`<root>/node_model_setup_effect/overlay.yaml`, field
  `openrouter_default_model`), else the model registry entry this contract names
  under `config`, so a first run needs no private overlay. Never from code; the
  customer changes it with `onex models add openrouter --model <id>`. A local
  model server on an OpenAI-compatible URL needs no key (`add_local`): the URL
  must answer a models or chat request, then it is declared as the `local-url`
  backend in the local routes overlay, beside the entries already there, and
  `remove_local` takes only that entry out.

output_model: omnimarket.nodes.node_model_setup_effect.models.model_model_setup_result.ModelModelSetupResult

handler:
  module: omnimarket.nodes.node_model_setup_effect.handlers.handler_model_setup
  class: HandlerModelSetup
  input_model: omnimarket.nodes.node_model_setup_effect.models.model_model_setup_request.ModelModelSetupRequest

handler_routing:
  default_handler: omnimarket.nodes.node_model_setup_effect.handlers.handler_model_setup:HandlerModelSetup

descriptor:
  node_archetype: effect
  purity: impure
  idempotent: false  # every test runs, and records, one delegation
  timeout_ms: 1200000  # up to four test delegations, each bounded at 300 s
  runtime_profiles:
    - effects

# The packaged default: what a developer with no overlay gets on a first run. The
# model id lives in the model registry (the one source of model ids); this names
# the registry entry. A deployment overrides it with its overlay or the
# environment variable; an overlay that is present but broken is refused.
config:
  openrouter_default_model:
    description: "The model registry entry whose model_name onboarding registers when neither ONEX_OPENROUTER_DEFAULT_MODEL nor an overlay names a model."
    registry_model: "openrouter-onboarding-default"

# The node publishes nothing: the test delegation writes its own record, and the
# result is returned to the shim that asked.
event_bus:
  subscribe_topics: []
  publish_topics: []

metadata:
  transport_type: kafka
