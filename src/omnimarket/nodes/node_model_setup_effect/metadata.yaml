name: node_model_setup_effect
version: "1.0.0"
description: "Discovers models from user-managed endpoints, reports configured delegation models, and tests selected models with pinned delegations"
omnibase_core_compat: ">=0.39.0,<1.0.0"
entry_points:
  onex.nodes:
    node_model_setup_effect: "omnimarket.nodes.node_model_setup_effect"
capabilities:
  standalone: true
  full_runtime: true
  requires_network: true
  requires_repo: false
  requires_secrets: true
  requires_docker: false
  side_effect_class: write
dependencies:
  - "omnibase_core>=0.39.0"
  - "omnibase-infra>=0.1.0"
  - "pydantic>=2.0"
  - "httpx>=0.27.0"
  - "click>=8.1.0"
authors: ["OmniNode Platform Team"]
license: "MIT"
tags: ["byok", "models", "delegation", "effect", "onboarding"]
pack: "delegation"
display_name: "Model Setup Effect"
node_role: "effect"
