tags: [validator_support_node]
description: >
  Effect boundary of the effect-backends check (OMN-22911, OMN-23114): reads the contract.yaml of every
  node folder under a directory and returns the parsed documents, the unreadable paths and why the root
  was unavailable. Split from node_effect_backends_check_compute, whose judging step must stay pure, when
  both moved out of omnibase_core (OMN-23932).
input_model: omnimarket.nodes.node_effect_backends_load_effect.models.model_effect_backends_load_request.ModelEffectBackendsLoadRequest
output_model: omnimarket.nodes.node_effect_backends_load_effect.models.model_loaded_contracts.ModelLoadedContracts
handler_routing:
  version: {major: 1, minor: 0, patch: 0}
  routing_strategy: payload_type_match
  handlers:
    - operation: load_contracts
      handler:
        name: HandlerEffectBackendsLoader
        module: omnimarket.nodes.node_effect_backends_load_effect.handlers.handler_effect_backends_loader
      event_model:
        name: ModelEffectBackendsLoadRequest
        module: omnimarket.nodes.node_effect_backends_load_effect.models.model_effect_backends_load_request
  default_handler: omnimarket.nodes.node_effect_backends_load_effect.handlers.handler_effect_backends_loader:HandlerEffectBackendsLoader
handler:
  module: omnimarket.nodes.node_effect_backends_load_effect.handlers.handler_effect_backends_loader
  class: HandlerEffectBackendsLoader
  input_model: omnimarket.nodes.node_effect_backends_load_effect.models.model_effect_backends_load_request.ModelEffectBackendsLoadRequest
descriptor:
  node_archetype: effect
  purity: side_effecting
  idempotent: true
  timeout_ms: 60000
runtime_profiles: [effects]
terminal_event: onex.evt.omnimarket.effect-backends-load-completed.v1
runtime_dispatch:
