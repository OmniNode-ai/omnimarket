name: node_stability_lane_refresh_effect
version: "0.1.0"
description: "Effect: refresh a stability lane from a committed dated release pin on a per-host overlay (addresses, box id, consumer groups, ports, caps). Release tags only; a different tag set needs a bump; the pinned set already running recreates nothing."
pack: pipeline
node_role: effect
display_name: "Stability Lane Refresh from a Release Pin (lab host)"
omnibase_core_compat: ">=0.39.0,<1.0.0"
entry_points:
  onex.nodes:
    node_stability_lane_refresh_effect: "omnimarket.nodes.node_stability_lane_refresh_effect"
capabilities:
  standalone: false
  full_runtime: false
  requires_network: true
  requires_repo: true
  requires_secrets: false
  requires_docker: true
  side_effect_class: write
dependencies:
  - "pyyaml>=6.0"
authors: ["OmniNode Platform Team"]
license: "MIT"
tags: ["effect", "stability-lane", "OMN-21613"]
