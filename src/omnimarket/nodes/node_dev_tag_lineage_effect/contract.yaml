        name: ModelDevTagLineageRequest
        module: omnibase_core.models.validation.model_dev_tag_lineage_request
  default_handler: omnimarket.nodes.node_dev_tag_lineage_effect.handlers.handler_dev_tag_lineage:HandlerDevTagLineage
handler:
