---
name: environment_health_scanner
contract_version: {major: 1, minor: 0, patch: 0}
node_type: compute
node_version: {major: 1, minor: 0, patch: 0}

description: >
  Live environment health scanner — reads contracts to know what should exist,
  probes the running environment to verify it does, and emits a structured
  PASS/WARN/FAIL report per subsystem.

handler:
  module: omnimarket.nodes.node_environment_health_scanner.handlers.handler_environment_health_scanner
  class: NodeEnvironmentHealthScanner
  input_model: omnimarket.nodes.node_environment_health_scanner.handlers.handler_environment_health_scanner.EnvironmentHealthRequest

handler_routing:
  handlers:
    - operation: environment_health_scanner
      handler:
        name: NodeEnvironmentHealthScanner
        module: omnimarket.nodes.node_environment_health_scanner.handlers.handler_environment_health_scanner
    - operation: containers
      handler:
        name: prober_containers
        module: omnimarket.nodes.node_environment_health_scanner.handlers.prober_containers
    - operation: emit_daemon
      handler:
        name: prober_emit_daemon
        module: omnimarket.nodes.node_environment_health_scanner.handlers.prober_emit_daemon
    - operation: entry_points
      handler:
        name: prober_entry_points
        module: omnimarket.nodes.node_environment_health_scanner.handlers.prober_entry_points
    - operation: hooks
      handler:
        name: prober_hooks
        module: omnimarket.nodes.node_environment_health_scanner.handlers.prober_hooks
    - operation: kafka
      handler:
        name: prober_kafka
        module: omnimarket.nodes.node_environment_health_scanner.handlers.prober_kafka
    - operation: model_endpoints
      handler:
        name: prober_model_endpoints
        module: omnimarket.nodes.node_environment_health_scanner.handlers.prober_model_endpoints
    - operation: projections
      handler:
        name: prober_projections
        module: omnimarket.nodes.node_environment_health_scanner.handlers.prober_projections

metadata:
  transport_type: httpx

descriptor:
  node_archetype: compute
  purity: impure
  idempotent: true
  timeout_ms: 300000

inputs:
  subsystems:
    type: list[str]
    description: "Subsystems to scan. Empty list = all."
    required: false
    default: []
  omni_home:
    type: str
    description: "Path to omni_home repository registry"
    required: false
  ssh_target:
    type: str
    description: "SSH target for infrastructure checks"
    required: false

env_dependencies:
  ONEX_INFRA_SSH_TARGET:
    required: false
    description: "SSH target string for infrastructure health checks; used as fallback when ssh_target input is not provided"

outputs:
  subsystem_results:
    type: list[SubsystemResult]
    description: "Per-subsystem PASS/WARN/FAIL with details"
  overall:
    type: str
    description: "Aggregate status: PASS | WARN | FAIL"
  findings:
    type: list[ModelHealthFinding]
    description: "All individual findings"

terminal_event: onex.evt.omnimarket.environment-health-scan-completed.v1

event_bus:
  subscribe_topics:
    - onex.cmd.omnimarket.environment-health-scan-start.v1
  publish_topics:
    - onex.evt.omnimarket.environment-health-scan-finding.v1
    - onex.evt.omnimarket.environment-health-scan-completed.v1

config:
  ONEX_INFRA_SSH_TARGET:
    description: "SSH target for infrastructure commands (user@host)."
    required: false
  ONEX_EMIT_DAEMON_SOCKET:
    description: "Unix socket path for the emit daemon."
    required: false
