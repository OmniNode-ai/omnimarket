name: node_lane_guard_admission_compute
lifecycle: experimental
node_type: COMPUTE_GENERIC
runtime_profiles: []
contract_version:
  major: 1
  minor: 0
  patch: 0
node_version: 1.0.0
description: Judge whether one bus pool host can run a unit under the lane guard. A bus unit runs a stub that execs
  the host's installed copy of the launcher's lane guard and exits 78 LANE-GUARD-MISSING in 0 s when it is absent,
  so the host must advertise lane-guard:<sha256> for the launcher's own guard sha256. A host that advertises only
  other guards is refused with "lane guard <sha8> not installed". An advertisement with no lane-guard entry at all
  comes from a serve that predates the entry and is admitted as not yet upgraded, because the host-side stub still
  exits 78 when the guard file is missing; this tolerance is temporary and its follow-up ticket removes it once
  every pool host advertises. A unit that is not delivered over the bus ships the guard inline and is never judged.
input_model:
  name: ModelLaneGuardAdmissionRequest
  module: omnimarket.nodes.node_lane_guard_admission_compute.models.model_lane_guard_admission
output_model:
  name: ModelLaneGuardAdmissionVerdict
  module: omnimarket.nodes.node_lane_guard_admission_compute.models.model_lane_guard_admission
handler:
  module: omnimarket.nodes.node_lane_guard_admission_compute.handlers.handler_lane_guard_admission
  class: HandlerLaneGuardAdmission
  input_model: omnimarket.nodes.node_lane_guard_admission_compute.models.model_lane_guard_admission.ModelLaneGuardAdmissionRequest
  output_model: omnimarket.nodes.node_lane_guard_admission_compute.models.model_lane_guard_admission.ModelLaneGuardAdmissionVerdict
handler_routing:
  routing_strategy: operation_match
  default_handler: omnimarket.nodes.node_lane_guard_admission_compute.handlers.handler_lane_guard_admission:HandlerLaneGuardAdmission
  handlers:
  - operation: handle
    handler:
      name: HandlerLaneGuardAdmission
      module: omnimarket.nodes.node_lane_guard_admission_compute.handlers.handler_lane_guard_admission
event_bus:
  subscribe_topics: []
  publish_topics: []
runtime_dispatch:
  external_trigger: Direct Python invocation with supplied host readings.
descriptor:
  node_archetype: compute
  purity: pure
  runtime_profiles: []
  idempotent: true
  timeout_ms: 5000
replay:
  requires_validator_version: true
  timestamp_authority: ingest_sequence
  deterministic: true
