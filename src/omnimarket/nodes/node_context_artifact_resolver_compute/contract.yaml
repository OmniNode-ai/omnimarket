---
name: node_context_artifact_resolver_compute
contract_version: {major: 2, minor: 0, patch: 0}
node_type: compute
runtime_profiles: [main]
node_version: {major: 2, minor: 0, patch: 0}
description: >
  Pure deterministic resolver that turns pre-read artifact sources
  (golden-chain YAML, exemplar files, CLAUDE.md / architecture-doc bodies,
  local-failure notes) into ModelContextPackArtifact entries with provenance,
  one per whole-body source and one per markdown section. Primitives only
  (OMN-21137): section parsing and source resolution. It applies no section
  selection, deduplication, token budget or pack hash; the context-ROI runner
  passes its artifacts to node_context_pack_builder_compute, the one assembler
  that selects, budgets and hashes. No filesystem/network I/O: the EFFECT
  boundary supplies file content as strings. No hardcoded paths; artifact
  sources are declared in the artifact_source_registry below by logical name +
  provenance + factor.

handler_routing:
  routing_strategy: operation_match
  handlers:
    - operation: context_artifact_resolver
      handler:
        name: HandlerArtifactResolver
        module: omnimarket.nodes.node_context_artifact_resolver_compute.handlers.handler_artifact_resolver

handler:
  module: omnimarket.nodes.node_context_artifact_resolver_compute.handlers.handler_artifact_resolver
  class: HandlerArtifactResolver
  input_model: omnimarket.nodes.node_context_artifact_resolver_compute.models.model_artifact_resolver_request.ModelArtifactResolverRequest
  output_model: omnimarket.nodes.node_context_artifact_resolver_compute.models.model_artifact_resolver_result.ModelArtifactResolverResult

descriptor:
  node_archetype: compute
  purity: pure
  idempotent: true
  timeout_ms: 2000

inputs:
  contract_hash:
    type: str
    required: true
  generated_at:
    type: str
    required: true
    description: Caller-supplied timezone-aware ISO8601 UTC timestamp.
  sources:
    type: array
    required: true
    description: Pre-read artifact sources, one or more per factor.

outputs:
  status:
    type: str
    enum: [ok, failed]
  artifacts:
    type: array
    description: >
      ModelContextPackArtifact entries in source order, then section order,
      unselected and unbudgeted, for node_context_pack_builder_compute.
  resolved_factors:
    type: array
  errors:
    type: array
  warnings:
    type: array

terminal_event: onex.evt.omnimarket.context-artifact-resolve-completed.v1

event_bus:
  subscribe_topics:
    - onex.cmd.omnimarket.context-artifact-resolve-requested.v1
  publish_topics:
    - onex.evt.omnimarket.context-artifact-resolve-completed.v1
    - onex.evt.omnimarket.context-artifact-resolve-failed.v1

externally_consumed_topics:
  - onex.evt.omnimarket.context-artifact-resolve-completed.v1
  - onex.evt.omnimarket.context-artifact-resolve-failed.v1

# Declarative artifact source registry: which logical artifact feeds each
# factor, and how to resolve it. Logical source names only -- NEVER absolute
# filesystem paths. The EFFECT boundary maps a logical name to a real file and
# supplies its content as a string at resolve time.
#   - sectioned: true  -> markdown body split into heading sections, one
#                         artifact per section; the pack builder selects.
#   - sectioned: false -> whole resolved body used as one artifact.
artifact_source_registry:
  golden_chain:
    logical_source: golden_chains.yaml
    provenance: curated
    sectioned: false
  exemplar:
    logical_source: exemplar_node
    provenance: curated
    sectioned: false
  local_failures:
    logical_source: local_failure_notes
    provenance: observed
    sectioned: false
  architecture_patterns:
    logical_source: architecture_canonical_doc
    provenance: curated
    sectioned: true
  claude_md:
    logical_source: CLAUDE.md
    provenance: curated
    sectioned: true

metadata:
  transport_type: kafka
  description: "Context-artifact resolver -- resolves pre-read sources into pack-builder artifacts"
  author: "OmniNode Platform Team"
  tags:
    - "compute"
    - "context-roi"
    - "artifact-resolution"
    - "OMN-12948"
  related_tickets:
    - "OMN-21137"
    - "OMN-12948"
    - "OMN-12798"
    - "OMN-12795"
    - "OMN-12792"

runtime_dispatch:
  # OMN-18013 -- the CLI/skill dispatcher is this node's producer. Declared so it is not inferred from subscribe_topics[0].
  command_topic: onex.cmd.omnimarket.context-artifact-resolve-requested.v1
