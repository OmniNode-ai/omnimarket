name: node_idle_slot_fill_effect
version: 1.1.0
description: 'The lab is never idle: from the throughput tick''s live pool hosts and finding lines, choose the lanes that
  fill the free lab slots from the standing pillar backlog, and refuse an orchestrator Stop turn that left free
  headroom or an unowned red with nothing dispatched. Repository names, the cloud backlog declaration and the experiment
  designs come from the idle_slot_fill and repos overlays. The fill reads active repository fixer HOLDs
  from the declared ledger and its archives before selecting work; an unread ledger blocks repository work.
  Each tick also recovers abandoned blocked or partial ruled work through the same dispatcher, queues repeat
  blocks for the orchestrator, and reads declared live ruling checks. All admitted engines, including shared
  Codex capacity, are ranked by the lane model policy contract; current limit and auth marks remove capacity.'
pack: distributed_validation
node_role: effect
display_name: Idle Slot Fill Effect
omnibase_core_compat: '>=0.39.0,<1.0.0'
entry_points:
  onex.nodes:
    node_idle_slot_fill_effect: omnimarket.nodes.node_idle_slot_fill_effect
capabilities:
  standalone: true
  full_runtime: false
  requires_network: true
  requires_repo: false
  requires_secrets: false
  requires_docker: true
  side_effect_class: write
dependencies:
- PyYAML>=6.0
