name: node_compaction_probe_run_effect
lifecycle: experimental
node_type: EFFECT_GENERIC
runtime_profiles: [effects]
contract_version: {major: 1, minor: 0, patch: 0}
node_version: 1.0.0
description: >-
  Run the fixed answering model and a different judge model over compaction probe cases and
  record every call under its key: manifest digest, served model id, prompt hash, context hash,
  decoding settings and repeat index. Recordings are append-only, one writer per file; a retry
  appends an attempt and the scorer reads the latest valid one. REPLAY mode reads recordings
  alone and makes no model call; a key with no valid recording scores UNAVAILABLE. The judge's
  calibration on the oracle, empty and inverted controls (Wilson lower bounds) is a report, and
  a scoring run is refused without a passing report for the same manifest and model pair.
input_model:
  name: ModelProbeRunRequest
  module: omnimarket.nodes.node_compaction_probe_run_effect.models.model_probe_run
output_model:
  name: ModelProbeRunResult
  module: omnimarket.nodes.node_compaction_probe_run_effect.models.model_probe_run
handler:
  module: omnimarket.nodes.node_compaction_probe_run_effect.handlers.handler_probe_run
  class: HandlerCompactionProbeRun
  input_model: omnimarket.nodes.node_compaction_probe_run_effect.models.model_probe_run.ModelProbeRunRequest
  output_model: omnimarket.nodes.node_compaction_probe_run_effect.models.model_probe_run.ModelProbeRunResult
handler_routing:
  routing_strategy: operation_match
  handlers:
    - operation: run_compaction_probes
      handler:
        name: HandlerCompactionProbeRun
        module: omnimarket.nodes.node_compaction_probe_run_effect.handlers.handler_probe_run
      input_model: omnimarket.nodes.node_compaction_probe_run_effect.models.model_probe_run.ModelProbeRunRequest
      output_model: omnimarket.nodes.node_compaction_probe_run_effect.models.model_probe_run.ModelProbeRunResult
    - operation: calibrate_probe_judge
      handler:
        name: HandlerJudgeCalibration
        module: omnimarket.nodes.node_compaction_probe_run_effect.handlers.handler_probe_run
      input_model: omnimarket.nodes.node_compaction_probe_run_effect.models.model_probe_run.ModelCalibrationRequest
      output_model: omnimarket.nodes.node_compaction_probe_run_effect.models.model_probe_run.ModelCalibrationReport
terminal_event: onex.evt.omnimarket.compaction-probe-run-completed.v1
event_bus:
  subscribe_topics:
    - onex.cmd.omnimarket.compaction-probe-run-start.v1
  publish_topics:
    - onex.evt.omnimarket.compaction-probe-run-completed.v1
runtime_dispatch:
  command_topic: onex.cmd.omnimarket.compaction-probe-run-start.v1
externally_consumed_topics:
  - onex.evt.omnimarket.compaction-probe-run-completed.v1
descriptor:
  node_archetype: effect
  purity: effectful  # writes append-only recordings under the replay root; calls a model only in RECORD mode
  idempotent: true
  timeout_ms: 600000
  runtime_profiles: [effects]
metadata:
  transport_type: kafka
