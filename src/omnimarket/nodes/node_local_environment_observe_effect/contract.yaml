name: node_local_environment_observe_effect
contract_name: node_local_environment_observe_effect
node_name: node_local_environment_observe_effect
contract_version: {major: 1, minor: 0, patch: 0}
node_version: {major: 1, minor: 0, patch: 0}
node_type: EFFECT_GENERIC
runtime_profiles: [effects]
description: >
  Observe each long-running, probeable service in the local catalog bundle
  over the compose network. Return one tenant-attributed status per service
  every fifteen seconds; exclude one-shots and portless services.
input_subscriptions:
  - topic: onex.intent.platform.runtime-tick.v1
    operation: local_environment.observe
event_bus:
  version: {major: 1, minor: 0, patch: 0}
  subscribe_topics:
    - onex.intent.platform.runtime-tick.v1
  publish_topics:
    - onex.evt.omnimarket.local-environment-status.v1
terminal_event: onex.evt.omnimarket.local-environment-status.v1
input_model:
  name: ModelRuntimeTick
  module: omnibase_infra.runtime.models.model_runtime_tick
output_model:
  name: ModelLocalEnvironmentStatus
  module: omnimarket.models.model_local_environment_status
handler_routing:
  routing_strategy: operation_match
  handlers:
    - operation: local_environment.observe
      event_model:
        name: ModelRuntimeTick
        module: omnibase_infra.runtime.models.model_runtime_tick
      event_type: platform.runtime-tick
      message_category: INTENT
      handler:
        name: HandlerLocalEnvironmentObserve
        module: omnimarket.nodes.node_local_environment_observe_effect.handlers.handler_local_environment_observe
      output_fields: [events]
metadata:
  transport_type: http
config:
  local_environment_observe:
    catalog_dir: /app/docker/catalog
    bundle: local
    probe_timeout_seconds: 3
    schedule:
      run_interval_seconds: 15
