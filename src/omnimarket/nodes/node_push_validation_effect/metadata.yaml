name: node_push_validation_effect
version: "1.0.0"
description: "Push-validation write-EFFECT: hook-verified, suite-gated, fail-closed branch push with a tenant-scoped receipt (gateway P2 tenant #1; def-B handler hand-written under the 2026-07-22 documented-exception grant, future RSD regeneration target)."
pack: push_validation
node_role: effect
display_name: "Push Validation Effect"
omnibase_core_compat: ">=0.39.0,<1.0.0"
entry_points:
  onex.nodes:
    node_push_validation_effect: "omnimarket.nodes.node_push_validation_effect"
capabilities:
  standalone: false
  full_runtime: true
  requires_network: true
  requires_repo: false
  # Interim credential is the host-resident interactive `gh` login (read back
  # into the receipt's credential_identity field), not a contract secret.
  requires_secrets: false
  requires_docker: false
  side_effect_class: write
# The handler + concrete client use stdlib (subprocess/hashlib/socket) and
# pydantic only (pydantic is a shared runtime dependency) — no extra deps.
dependencies: []
authors: ["OmniNode Platform Team"]
license: "MIT"
tags: ["effect", "push-validation", "gateway", "push-farm", "OMN-14920", "OMN-14976"]
