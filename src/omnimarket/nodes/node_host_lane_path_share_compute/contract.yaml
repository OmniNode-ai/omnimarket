name: node_host_lane_path_share_compute
node_type: COMPUTE_GENERIC
version: 1.0.0
lifecycle: experimental
contract_version: {major: 1, minor: 0, patch: 0}
node_version: "1.0.0"
description: >-
  Read the lane path sizes a host reports and the mount points that are its mounted data drives, and raise one alarm
  row naming the host's owner while those drives hold under 10 percent of the host's lane path bytes. A host at or over
  the bar gets an ok row that resolves the alarm. A host reporting no bytes is refused (exit 65), never read as ok. The
  rows are STATUS rows the failure alarm router node reads and delivers; this node sends nothing.
input_model:
  name: ModelLanePathShareRequest
  module: omnimarket.nodes.node_host_lane_path_share_compute.models.model_lane_path_share
output_model:
  name: ModelLanePathShareResult
  module: omnimarket.nodes.node_host_lane_path_share_compute.models.model_lane_path_share
handler:
  name: HandlerLanePathShare
  module: omnimarket.nodes.node_host_lane_path_share_compute.handlers.handler_lane_path_share
  class: HandlerLanePathShare
  input_model: omnimarket.nodes.node_host_lane_path_share_compute.models.model_lane_path_share.ModelLanePathShareRequest
  output_model: omnimarket.nodes.node_host_lane_path_share_compute.models.model_lane_path_share.ModelLanePathShareResult
entrypoint:
  name: NodeHostLanePathShareCompute
  module: omnimarket.nodes.node_host_lane_path_share_compute.node
handler_routing:
  routing_strategy: "operation_match"
  default_handler: "omnimarket.nodes.node_host_lane_path_share_compute.handlers.handler_lane_path_share:HandlerLanePathShare"
  handlers:
    - operation: "handle"
      handler:
        name: "HandlerLanePathShare"
        module: "omnimarket.nodes.node_host_lane_path_share_compute.handlers.handler_lane_path_share"
event_bus:
  subscribe_topics: []
  publish_topics: []
runtime_dispatch:
  external_trigger: "Direct Python invocation (python -m omnimarket.nodes.node_host_lane_path_share_compute < request.json); the rows it prints are appended to the ledger, where node_failure_alarm_router_effect reads class lane-path-share."
  # A host's lane path sizes are measured by a lane or an operator who then pipes them in: the command below is the whole trigger.
  on_demand:
    command: uv run python -m omnimarket.nodes.node_host_lane_path_share_compute < request.json
    owner: OmniNode Platform Team
execution:
  deterministic: true
  side_effects: false
descriptor:
  node_archetype: compute
  purity: pure
  runtime_profiles: []
metadata:
  transport_type: local
  description: "Lane Path Share Compute: pure policy with no external transport."
