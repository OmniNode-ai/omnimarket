name: node_usage_privileges
version: 1.0.0
description: Serves the usage privilege catalog read, GET /v1/usage/privileges, on the runtime port, for a caller the identity resolver accepts.
pack: catalog
node_role: effect
display_name: Usage Privileges
omnibase_core_compat: '>=0.39.0,<1.0.0'
entry_points:
