# ONEX Node Contract - Host Bring-up Overlay Compute
#
# One pure fold: the check part of the declared bring-up target rows (read from
# node_host_bringup_orchestrator) plus one host's overlay data, into one observed
# check state per target for node_host_bringup_plan_compute. Overlay facts are
# keyed by the symbolic check subject; a target with no fact is unknown, and
# facts that disagree are unknown, so neither reads as ok. A fact naming a
# subject no row checks, or a target declared twice, refuses the overlay.
#
# No clock, no file, no network, no shell.
name: "node_host_bringup_overlay_compute"
node_type: "COMPUTE_GENERIC"
contract_version:
  major: 0
  minor: 1
  patch: 0
node_version: "0.1.0"
lifecycle: experimental
description: "One host's overlay facts resolved into one observed check state per declared bring-up target, or a refusal naming the bad subject or target."
input_model:
  name: "ModelHostBringupOverlayRequest"
  module: "omnimarket.nodes.node_host_bringup_overlay_compute.models.model_host_bringup_overlay"
  description: "The declared check rows and one host's overlay facts."
output_model:
  name: "ModelHostBringupOverlayResult"
  module: "omnimarket.nodes.node_host_bringup_overlay_compute.models.model_host_bringup_overlay"
  description: "One observation per target sorted by name, or the refusals."
handler:
  module: "omnimarket.nodes.node_host_bringup_overlay_compute.handlers.handler_host_bringup_overlay"
  class: "HandlerHostBringupOverlay"
  input_model: "omnimarket.nodes.node_host_bringup_overlay_compute.models.model_host_bringup_overlay.ModelHostBringupOverlayRequest"
  output_model: "omnimarket.nodes.node_host_bringup_overlay_compute.models.model_host_bringup_overlay.ModelHostBringupOverlayResult"
handler_routing:
  routing_strategy: "operation_match"
  default_handler: "omnimarket.nodes.node_host_bringup_overlay_compute.handlers.handler_host_bringup_overlay:HandlerHostBringupOverlay"
  handlers:
    - operation: "resolve_host_bringup_overlay"
      handler:
        name: "HandlerHostBringupOverlay"
        module: "omnimarket.nodes.node_host_bringup_overlay_compute.handlers.handler_host_bringup_overlay"
runtime_dispatch:
  command_topic: "onex.cmd.omnimarket.host-bringup-overlay-requested.v1"
  terminal_events:
    success: "onex.evt.omnimarket.host-bringup-overlay-completed.v1"
    failure: "onex.evt.omnimarket.host-bringup-overlay-failed.v1"
descriptor:
  node_archetype: compute
  purity: pure
  idempotent: true
  timeout_ms: 5000
dod_evidence:
  PYTEST:
    description: "overlay resolves all 57 declared targets, feeds the plan end to end, refuses an unknown subject and a duplicate target, and is order independent"
    command: "uv run pytest tests/unit/nodes/test_node_host_bringup_overlay_compute.py -q"
    pass_criteria: "every test passes"
