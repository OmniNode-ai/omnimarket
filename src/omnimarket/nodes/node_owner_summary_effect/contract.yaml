name: owner_summary_effect
contract_version: {major: 1, minor: 0, patch: 0}
node_type: effect
node_version: {major: 1, minor: 0, patch: 0}

description: >
  Gather what the factory did in a window from the PR watcher's local state, the canonical clones and the work ledger, check a drafted summary against those facts (footer, length, no secrets or home paths, every ticket and repo#number cited must be in the facts, and the coverage the facts list: the headline, each merged and blocked ticket, each count, plain words, no overclaim, the friction gap), and record the window end as sent.

input_model: omnimarket.nodes.node_owner_summary_effect.models.model_owner_summary_request.ModelOwnerSummaryRequest
output_model: omnimarket.nodes.node_owner_summary_effect.models.model_owner_summary_result.ModelOwnerSummaryResult
handler:
  module: omnimarket.nodes.node_owner_summary_effect.handlers.handler_owner_summary
  class: HandlerOwnerSummary
  input_model: omnimarket.nodes.node_owner_summary_effect.models.model_owner_summary_request.ModelOwnerSummaryRequest

handler_routing:
  routing_strategy: operation_match
  handlers:
    - operation: run_owner_summary_command
      handler:
        name: HandlerOwnerSummary
        module: omnimarket.nodes.node_owner_summary_effect.handlers.handler_owner_summary
      input_model: omnimarket.nodes.node_owner_summary_effect.models.model_owner_summary_request.ModelOwnerSummaryRequest
      output_model: omnimarket.nodes.node_owner_summary_effect.models.model_owner_summary_result.ModelOwnerSummaryResult

descriptor:
  node_archetype: effect
  purity: effectful
  idempotent: true
  side_effects:
    - reads of the PR watcher state file, the work ledger and the registry clones' git history, with no fetch and no GitHub call
    - the send watermark file under the registry's state directory, written only by the mark-sent command
  runtime_profiles: [effects]

terminal_event: onex.evt.omnimarket.owner-summary-command-completed.v1

event_bus:
  subscribe_topics:
    - onex.cmd.omnimarket.owner-summary-command-requested.v1
  publish_topics:
    - onex.evt.omnimarket.owner-summary-command-completed.v1

runtime_dispatch:
  command_topic: onex.cmd.omnimarket.owner-summary-command-requested.v1

externally_consumed_topics:
  - onex.evt.omnimarket.owner-summary-command-completed.v1

metadata:
  ticket: OMN-17427
  transport_type: kafka
