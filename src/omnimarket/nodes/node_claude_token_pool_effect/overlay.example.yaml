# Synthetic values: the real overlay is <root>/node_claude_token_pool_effect/overlay.yaml under a root named in
# ONEX_SKILL_OVERLAY_ROOTS. A host's place in this list is its rank: it sets which token the host draws first.
hosts:
  - name: host-a
    scheduler: systemd-user
    venv: omnimarket/.venv
    token_file: .config/omni/claude-oauth-token
  - name: host-b
    scheduler: systemd-user
    venv: omnimarket/.venv
    token_file: .config/omni/claude-oauth-token
  - name: mac
    scheduler: launchd
    venv: omnimarket/.venv
    token_file: .config/omni/claude-oauth-token
# The one source of limited and revoked marks: this host's pool status mirror.
marks_source:
  host: host-a
  ssh_target: host-a.example.invalid
  mirror_path: .cache/omni/claude-token-pool.json
  max_age_seconds: 900
events_file: token-rotations.jsonl
# When a usable login has been in use longer than the bound, under which the host's lanes have
# already started, the tick spreads it onto a token no host's lanes have used yet; absent (or
# enabled: false) means the tick only swaps a login that is limited or revoked.
spread:
  enabled: true
  in_use_longer_than_seconds: 3600
# Account steering for NEW lane starts. enabled is the switch: off, a lane start draws as it did before
# the block existed. On, the lane start runs verdict_argv (the command that prints the usage verdict
# node's result as JSON), passes its drain_labels to resolve, and counts the lanes running under each
# label from the open CLAIM rows no older than open_claim_max_age_seconds. max_lanes_per_label is the
# hard cap resolve holds those counts against; left out, a label carries any number of lanes. The
# values below are examples: the deployed ones are the operator's, in the overlays repository.
steering:
  enabled: true
  max_lanes_per_label: 4
  verdict_argv: [onex-example-verdict, --json]
  verdict_timeout_seconds: 20
  open_claim_max_age_seconds: 21600
unit_environment: {}
schedule:
  interval_seconds: 300
# Stale-revoke rule (OMN-23887). Absent: no revoke is ever cleared as stale (the tick keeps every revoked mark, as before).
# Present: a revoked label is cleared only when the same fingerprint was limited on the source host more than margin_seconds
# AFTER the revoke stamp (a revoke with no later success of that token anywhere stands). The value is the operator's.
stale_revoke:
  margin_seconds: 60
