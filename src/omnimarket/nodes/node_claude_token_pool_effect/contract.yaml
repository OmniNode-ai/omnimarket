# ONEX Node Contract - Claude Token Pool Effect (OMN-17427)
#
# CLI-run effect, like node_local_secret_store_effect: it has an onex.nodes
# entry point and is invoked locally, with no subscription, as `python -m
# omnimarket.nodes.node_claude_token_pool_effect` on the lab host whose pool it
# is (the remote-lane runner at lane start, the operator adding a token). It also
# owns its schedule (OMN-23000): the `tick` verb, run by the timer
# `schedule install --host <name>` writes, rotates the host's login off a limited
# or revoked token.
# `experimental` is the drift gate's marker for an intentionally unregistered
# node; the topic graph sees it as an externally triggered ingress root.
name: claude_token_pool_effect
lifecycle: experimental
contract_version: {major: 1, minor: 0, patch: 0}
node_type: effect
node_version: {major: 1, minor: 0, patch: 0}

description: >
  Claude token pool EFFECT for one lab host. Each token is an entry in the local
  secret store under lab.claude-oauth.<label>, the label naming its account.
  resolve returns the first token, in the order added, whose usage limit has
  passed; mark_limited marks one token (not the host) until its reset; status
  reads the tokens, how many are limited and the next reset, with an ALARM line
  when every token is limited. Every operation rewrites a status mirror holding
  labels and limit times only. No result, refusal or log line carries a value.
  mark_revoked skips a token whose OAuth login was revoked until it is re-added.
  sync_marks makes the limit and revoked marks of the labels a source names equal
  the source's, so a stale mark is cleared. The scheduled tick (OMN-23000) reads
  the one source's marks (refusing an unreadable or stale source), draws a
  different first token on every host, and swaps the host's login to a usable token
  when the one in use is limited or revoked, appending one event per rotation. When
  the overlay declares a spread rule, a usable login that has been in use longer than
  the bound, under which the host's lanes have already started, is spread onto a token
  no host's lanes have used yet. assign installs the pool token an operator names on
  the host's login, refusing one that is not in the pool, limited or revoked, and
  records one event per assignment. For a NEW lane start, resolve also takes drain_labels (the usage
  verdict's labels close to their limit: skipped while another label is usable, used when nothing else
  is, and a limited or revoked label is never returned) and lane_counts (the lanes running under each
  label), which it holds against the overlay's steering.max_lanes_per_label; at the cap it answers a
  typed refusal and no token. The lane start passes both only when the overlay's steering.enabled is
  true; off, which is how it ships, a draw is what it was.
  Inside the tick's mark sync (OMN-23887), when the overlay carries a stale_revoke block, the tick asks the
  node_claude_pool_revoke_staleness_compute node whether each revoked label's revoke is stale (the same fingerprint
  was limited after the revoke stamp plus the margin) and sends the pool one typed clear_revokes command per stale
  label; the pool clears a mark only while it still holds that fingerprint and that exact revoke stamp. A revoke with
  no later success stays; an overlay without the block keeps every revoke, as before.
  Inside the same tick on the marks-source host (OMN-23895), when the overlay carries a limit_recheck block, the tick asks
  node_claude_pool_limit_recheck_compute which limited labels are due for a re-test, runs the pool's own headless probe
  (an injected port) on each, asks the compute node what the answer means and sends the pool one apply_limit_rechecks
  command: an ok answer clears the mark, a limited answer naming a newer reset replaces the stamp (even an earlier one),
  a limited answer without one keeps it, an error answer proves nothing; the pool executes a command only while it holds
  that fingerprint and that exact stamp. mark-limited takes --exact for a notice that names its own reset, which replaces
  the stamp; an estimate never shortens one. export --label L --name KEY writes KEY=value to a pipe (never a terminal) so
  the refill's adopt step can move a host-held label into the secret store through the secret seed node.
  Inside the same tick on the marks-source host (OMN-19998), when the overlay carries a revoke_recheck block, the tick asks
  node_claude_pool_revoke_recheck_compute which revoked or challenged labels are due, runs the same headless probe, and has
  the pool execute the typed apply_revoke_rechecks commands: an ok or limited answer clears the mark (the token answers, so
  the revocation is not real), a refused answer keeps it and confirms a challenged one as a revoke, an error answer proves
  nothing; the pool executes a command only while it holds that fingerprint and that exact revoke stamp. mark-revoked
  --evidence-stdin reads the failing engine's closing output on stdin and asks node_claude_pool_revoke_cause_compute
  whether a runner-written revoke is a 403 challenge page, recorded challenged (out of rotation like a revoke until the
  recheck clears it) instead of revoked.

output_model: omnimarket.nodes.node_claude_token_pool_effect.models.model_claude_token_pool.ModelClaudeTokenPoolResult

handler:
  module: omnimarket.nodes.node_claude_token_pool_effect.handlers.handler_claude_token_pool
  class: HandlerClaudeTokenPool
  input_model: omnimarket.nodes.node_claude_token_pool_effect.models.model_claude_token_pool.ModelClaudeTokenPoolRequest
  output_model: omnimarket.nodes.node_claude_token_pool_effect.models.model_claude_token_pool.ModelClaudeTokenPoolResult

handler_routing:
  default_handler: omnimarket.nodes.node_claude_token_pool_effect.handlers.handler_claude_token_pool:HandlerClaudeTokenPool
  routing_strategy: operation_match
  handlers:
    - operation: tick
      handler:
        name: HandlerClaudeTokenRotationTick
        module: omnimarket.nodes.node_claude_token_pool_effect.handlers.handler_claude_token_rotation_tick
      input_model: omnimarket.nodes.node_claude_token_pool_effect.models.model_claude_token_rotation.ModelClaudeTokenRotationRequest
      output_model: omnimarket.nodes.node_claude_token_pool_effect.models.model_claude_token_rotation.ModelClaudeTokenRotationResult
    - operation: assign
      handler:
        name: HandlerClaudeTokenAssignOperation
        module: omnimarket.nodes.node_claude_token_pool_effect.handlers.handler_claude_token_rotation_tick
      input_model: omnimarket.nodes.node_claude_token_pool_effect.models.model_claude_token_rotation.ModelClaudeTokenAssignRequest
      output_model: omnimarket.nodes.node_claude_token_pool_effect.models.model_claude_token_rotation.ModelClaudeTokenAssignResult
    # The diff behind every mark event (OMN-19998): one operation's live marks before and after in, one typed event per changed mark out.
    - operation: mark_diff
      handler:
        name: HandlerPoolMarkDiff
        module: omnimarket.nodes.node_claude_token_pool_effect.handlers.handler_pool_mark_diff
      input_model: omnimarket.nodes.node_claude_token_pool_effect.models.model_claude_token_pool_mark_event.ModelPoolMarkDiffRequest
      output_model: omnimarket.nodes.node_claude_token_pool_effect.models.model_claude_token_pool_mark_event.ModelPoolMarkDiffResult
    # The status the CLI prints (OMN-19998): on a host the overlay does not declare (the launching Mac) it reads the marks from the
    # overlay's marks source, and when the source cannot be read or is over its age bound it prints that it reads an unsynced local
    # copy, with the copy's age, and names no limited or revoked label.
    - operation: status_view
      handler:
        name: HandlerClaudeTokenPoolStatusView
        module: omnimarket.nodes.node_claude_token_pool_effect.handlers.handler_claude_token_pool_status_view
      input_model: omnimarket.nodes.node_claude_token_pool_effect.models.model_claude_token_pool_status_view.ModelPoolStatusViewRequest
      output_model: omnimarket.nodes.node_claude_token_pool_effect.models.model_claude_token_pool_status_view.ModelPoolStatusViewResult
    # Read by the lane start in process (lane_start_steer), not routed through the runtime:
    # the entry binds the handler to this node for the canonical-file-shape ratchet. The handler
    # builds from no arguments (steering off) so the boot resolver can instantiate it.
    - operation: steer
      handler:
        name: HandlerPoolSteering
        module: omnimarket.nodes.node_claude_token_pool_effect.handlers.handler_pool_steering
      output_model: omnimarket.models.engine_login.ModelEngineLoginSteer

descriptor:
  node_archetype: effect
  purity: impure
  idempotent: false  # resolve records the token chosen; mark_limited moves a limit
  timeout_ms: 10000
  runtime_profiles: []

# The node's result goes to the runner's shell, and every change of a token mark (a limit set, replaced or cleared, a revoke
# set, confirmed or cleared; verbs mark_limited, mark_revoked, add, sync_marks, clear_revokes, apply_limit_rechecks,
# apply_revoke_rechecks) also leaves one ModelPoolMarkEvent (who, at, verb, host, label, change, cause) on the topic the host's
# overlay names in mark_events.topic, on the bus its event_bus block names (OMN-19998). The topic below is the one the overlay
# in the overlays repository declares; an overlay without a mark_events block publishes nothing and the result says
# mark_events_state=not_configured. The node is a local invocation, so event_bus stays empty (the runtime-dogfood check
# requires it); the topic is declared by externally_consumed_topics and the broker_acl_grants below, and the overlay names the bus.
event_bus:
  subscribe_topics: []
  publish_topics: []

externally_consumed_topics:
  - onex.evt.omnimarket.claude-pool-mark-changed.v1

# The Mac login (the guard principal of the mac_edge role of broker_acl_principals in the overlays repository) publishes the mark
# events of the status, mark-limited and mark-revoked verbs run on the operator's Mac. The six lab host logins hold the same two rows by
# the lab_lane_units role, which lists this node there (no login is written here).
broker_acl_grants:
  - principal: "${ONEX_ACL_GUARD_PRINCIPAL}"
    grants:
      - {resource_type: TOPIC, pattern: LITERAL, name: onex.evt.omnimarket.claude-pool-mark-changed.v1, operation: WRITE}
      - {resource_type: TOPIC, pattern: LITERAL, name: onex.evt.omnimarket.claude-pool-mark-changed.v1, operation: DESCRIBE}

runtime_dispatch:
  external_trigger: "python -m omnimarket.nodes.node_claude_token_pool_effect on the lab host whose pool it is (the remote-lane runner at lane start, the operator adding a token) and its scheduled tick timer."

# The node's own timer, installed by `schedule install --host <name>` as the scheduler the overlay
# names for that host (a systemd user timer on a lab host, a launchd agent on the Mac), removed by
# `schedule uninstall`. The interval is the overlay's; this block holds only how the unit is run.
schedule:
  unit_name: onex-claude-token-rotation
  launchd_label: ai.omninode.claude-token-rotation
  state_directory: .onex_state/claude-token-rotation
  timeout_seconds: 120
  boot_delay: 2min
  randomized_delay: 30s
  persistent: true

overlay:
  node: node_claude_token_pool_effect
  roots_env: ONEX_SKILL_OVERLAY_ROOTS

# Two more seams are held by tests rather than declared here: the marks source to the status view (the mirror file the source
# host's pool writes against the keys MirrorMarksSource reads, tests/nodes/node_claude_token_pool_effect/test_status_view_seam.py)
# and the mark event on its topic (the pool's published ModelPoolMarkEvent against the model a consumer validates it with, on the
# in-memory bus and on the lane's broker, tests/nodes/node_claude_token_pool_effect/test_mark_event_seam.py).
#
# The other side of the usage verdict node's pool_resolve seam: the field its result carries and this
# node's resolve request takes. tests/nodes/node_claude_token_pool_effect/test_seam_drain_labels.py
# fails when either side changes the name or the element type.
seams:
  usage_verdict:
    node: node_pool_usage_verdict_compute
    operation: resolve
    field: drain_labels
    element_type: str

metadata:
  ticket: OMN-23000
  transport_type: local
