#
# ONEX Node Contract
# Node: NodeTenantSavingsReadEffect
#
# /v1/tenants/me/savings
# Served from the runtime's contract-declared HTTP mount. The mount prefix equals
# the route path, so the private tenant siblings under /v1/tenants/me/ and the
# platform routes mount later without an overlap. The caller tenant comes from
# the identity resolver the hosted edge binds (ProtocolHttpTenantIdentity); an
# unbound resolver refuses every request.
name: "node_tenant_savings_read_effect"
contract_name: "node_tenant_savings_read_effect"
node_name: "node_tenant_savings_read_effect"
node_type: "EFFECT_GENERIC"
runtime_profiles:
  - effects
contract_version:
  major: 1
  minor: 0
  patch: 0
node_version: "0.1.0"
descriptor:
  node_archetype: effect
  purity: effectful
  runtime_profiles:
    - effects
  idempotent: true
description: >
  Serve GET /v1/tenants/me/savings: the caller tenant's delegation savings headline from the savings and delegation projections, keyed by the canonical tenant UUID.

input_model:
  name: "ModelTenantReadRequest"
  module: "omnimarket.models.model_tenant_delegation_projection"
  description: "The canonical tenant UUID resolved by the edge, and a bounded limit."
event_bus:
  version:
    major: 1
    minor: 0
    patch: 0
  subscribe_topics:
    - onex.cmd.omnimarket.tenant-savings-read-requested.v1
  publish_topics:
    - onex.evt.omnimarket.tenant-savings-read-completed.v1
    - onex.evt.omnimarket.tenant-savings-read-failed.v1
handler_routing:
  routing_strategy: "operation_match"
  handlers:
    - operation: "tenant_savings.read"
      event_model:
        name: "ModelTenantReadRequest"
        module: "omnimarket.models.model_tenant_delegation_projection"
      event_type: "tenant_savings.read"
      message_category: "COMMAND"
      handler:
        name: "HandlerTenantSavingsRead"
        module: "omnimarket.nodes.node_tenant_savings_read_effect.handlers.handler_tenant_savings_read"
      supported_operations:
        - "tenant_savings.read"
      description: "Serve GET /v1/tenants/me/savings: the caller tenant's delegation savings headline from the savings and delegation projections, keyed by the canonical tenant UUID."
    - operation: "tenant_savings.read_bus"
      topic: "onex.cmd.omnimarket.tenant-savings-read-requested.v1"
      event_model:
        name: "ModelTenantReadCommand"
        module: "omnimarket.models.model_tenant_read_bus"
      event_type: "omnimarket.tenant-savings-read-requested"
      message_category: "COMMAND"
      handler:
        name: "HandlerTenantSavingsReadBus"
        module: "omnimarket.nodes.node_tenant_savings_read_effect.handlers.handler_tenant_savings_read_bus"
      supported_operations:
        - "tenant_savings.read_bus"
      description: "Bus entry for the tenant savings read; the command carries the tenant and limit, the answer is the same JSON body the HTTP route answers."
  execution_mode: "single"
  max_timeout_seconds: 30
terminal_event: onex.evt.omnimarket.tenant-savings-read-completed.v1
runtime_dispatch:
  command_topic: onex.cmd.omnimarket.tenant-savings-read-requested.v1
  terminal_events:
    success: onex.evt.omnimarket.tenant-savings-read-completed.v1
    failure: onex.evt.omnimarket.tenant-savings-read-failed.v1
config:
  # Logical secret name the runtime secret resolver maps to the read-only DSN of
  # the analytics projection database. The value is never in this repository.
  analytics_dsn_secret: "omnidash.analytics.db_url"
  # The bus handler builds its projection reader through this contract-declared factory, so the
  # handler module holds no import of a database driver.
  reader_factory: "omnimarket.handlers.tenant_projection_read.resolver_reader:reader_for_node"
handler_dependencies:
  - omnimarket.protocols.protocol_http_tenant_identity.ProtocolHttpTenantIdentity
  - omnimarket.protocols.protocol_tenant_delegation_projection_reader.ProtocolTenantDelegationProjectionReader
http_mount:
  factory: "omnimarket.nodes.node_tenant_savings_read_effect.handlers.http_app:create_app"
  path_prefix: "/v1/tenants/me/savings"
http_route:
  handler:
    name: HandlerTenantSavingsRead
    module: omnimarket.nodes.node_tenant_savings_read_effect.handlers.handler_tenant_savings_read
  path: "/v1/tenants/me/savings"
  methods: [GET]
dependencies:
  - name: "secret_resolver"
    type: "service"
    class_name: "SecretResolver"
    module: "omnibase_infra.runtime.secret_resolver"
    description: "Handed to the bus handler's constructor, or built by the bus handler from the lane's rendered resolver config (ONEX_SECRET_RESOLVER_CONFIG_PATH) when it maps the logical name in config.analytics_dsn_secret. Absent means every read answers 503 not configured, and the bus handler answers not_configured."
    required: false
capabilities:
  - name: "tenant_savings.read"
    description: "Serve GET /v1/tenants/me/savings: the caller tenant's delegation savings headline from the savings and delegation projections, keyed by the canonical tenant UUID."
metadata:
  # Bus topics: the read is served over the runtime's HTTP mount and the bus entry
  # beside it; the liveness gate (both topic sides or an explicit lifecycle) reads this annotation.
  lifecycle: experimental
  description: "Serve GET /v1/tenants/me/savings: the caller tenant's delegation savings headline from the savings and delegation projections, keyed by the canonical tenant UUID."
  author: "OmniNode Team"
  license: "MIT"
  created: "2026-11-03"
  ticket: "OMN-22339"
  tags:
    - "effect"
    - "http"
    - "tenant"
