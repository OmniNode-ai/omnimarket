name: node_work_ledger_reducer_compute
node_type: compute
runtime_profiles: [main]
contract_version: {major: 1, minor: 0, patch: 0}
node_version: "1.0.0"
description: >-
  The work-ledger reducer's three read-only questions (OMN-22915, steps L10 to L12 of the bus-only cutover).
  shadow_judge: the reducer judge, the ledger row grammar's guards composed as one verdict, judges a row the
  live judge already answered, on the ledger text before it, and returns its verdict beside the live one with
  the difference named; it writes nothing. guard_replay: recorded rows are re-judged in order, each against
  the rows the live judge had accepted before it, and every row whose verdict or refusal rule changed is
  listed. rebuild: an empty table is fed from the accepted-row topic's events (bootstrap history by legacy
  ordinal, then rows by ledger_seq) and compared with the live table row for row, sequence for sequence and
  entity for entity. Pure compute: no clock, no broker, no database. Nothing is wired to the serve here.
input_model:
  name: ModelWorkLedgerReducerRequest
  module: omnimarket.nodes.node_work_ledger_reducer_compute.models.model_work_ledger_reducer
output_model:
  name: ModelWorkLedgerReducerResult
  module: omnimarket.nodes.node_work_ledger_reducer_compute.models.model_work_ledger_reducer
handler:
  module: omnimarket.nodes.node_work_ledger_reducer_compute.handlers.handler_work_ledger_reducer
  class: HandlerWorkLedgerReducer
  input_model: omnimarket.nodes.node_work_ledger_reducer_compute.models.model_work_ledger_reducer.ModelWorkLedgerReducerRequest
  output_model: omnimarket.nodes.node_work_ledger_reducer_compute.models.model_work_ledger_reducer.ModelWorkLedgerReducerResult
handler_routing:
  routing_strategy: operation_match
  default_handler: omnimarket.nodes.node_work_ledger_reducer_compute.handlers.handler_work_ledger_reducer:HandlerWorkLedgerReducer
  handlers:
    - operation: work_ledger_reducer
      handler:
        name: HandlerWorkLedgerReducer
        module: omnimarket.nodes.node_work_ledger_reducer_compute.handlers.handler_work_ledger_reducer
descriptor:
  node_archetype: compute
  purity: pure
  idempotent: true
  timeout_ms: 30000
inputs:
  operation: {type: str, required: true, enum: [shadow_judge, guard_replay, rebuild], description: Which question is asked.}
  shadow: {type: dict, required: false, description: The row, the ledger text before it, the ledger name and the live verdict, for shadow_judge.}
  replay: {type: dict, required: false, description: The ledger name and the recorded rows with their verdicts, in order, for guard_replay.}
  rebuild: {type: dict, required: false, description: The accepted-row events and optionally the live table, for rebuild.}
outputs:
  operation: {type: str}
  shadow: {type: dict}
  replay: {type: dict}
  rebuild: {type: dict}
terminal_event: onex.evt.omnimarket.work-ledger-reducer-completed.v1
runtime_dispatch:
  command_topic: onex.cmd.omnimarket.work-ledger-reducer-requested.v1
event_bus:
  subscribe_topics:
    - onex.cmd.omnimarket.work-ledger-reducer-requested.v1
  publish_topics:
    - onex.evt.omnimarket.work-ledger-reducer-completed.v1
externally_consumed_topics:
  - onex.evt.omnimarket.work-ledger-reducer-completed.v1
metadata:
  transport_type: inmemory
  description: work-ledger reducer shadow judge, guard replay and accepted-row rebuild
  author: OmniNode Team
  created: "2026-11-07"
  related_tickets: [OMN-22915]
