# Real profile: argv lists run as subprocesses, behind a host's transport prefix. Synthetic values;
# the deployment's overlay lives at <root>/node_host_storage_effect/overlay.yaml under a root named
# in ONEX_SKILL_OVERLAY_ROOTS. A host name matches its row in the lab host table.
backend: subprocess
free_bytes_argv: [df, "--output=avail", "-B1", "{path}"]
free_bytes_timeout_seconds: 30
commands:
  - name: prune_example
    argv: [/example/bin/prune-example, --apply]
    measured_path: /example/work
    timeout_seconds: 900
  - name: evict_cache
    kind: remove_entries
    measured_path: /example/cache
    timeout_seconds: 900
  - name: remove_worktrees
    kind: remove_worktrees
    measured_path: /example/work
    timeout_seconds: 900
    lease_marker_names: [.example-lease]
hosts:
  # An entry command runs on the host itself (an empty transport prefix) and removes only entries under
  # a root the host declares for it.
  - name: example-local-host
    transport_prefix: []
    commands: [prune_example, evict_cache, remove_worktrees]
    entry_roots:
      - {command: evict_cache, path: /example/cache}
      - {command: remove_worktrees, path: /example/work/worktrees}
  - name: example-remote-host
    transport_prefix: [ssh, -o, BatchMode=yes, example-remote-host]
    commands: [prune_example]
