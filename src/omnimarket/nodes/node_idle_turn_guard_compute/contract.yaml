name: node_idle_turn_guard_compute
node_type: compute
runtime_profiles: [main]
contract_version: {major: 1, minor: 0, patch: 0}
node_version: "1.0.0"
description: >-
  Pure compute over one orchestrator Stop turn: the finding lines it read (free lab
  headroom, UNOWNED reds, broken lab pieces), whether a tool call dispatched, and the
  facts the Stop hook's adapter read. A hold or stop row in force holds the guard. A
  headroom line for a host that refuses lanes is not headroom. A runner receipt in the
  turn's window whose state config.idle_turn_guard.dispatch_receipt_states names counts
  as a dispatch. Anything left with no dispatch refuses the turn. The handler takes the
  policy by injection and reads no file, environment or clock while it decides.
input_model:
  name: ModelIdleTurnGuardDecisionRequest
  module: omnimarket.models.idle_turn_guard.model_idle_turn_guard
output_model:
  name: ModelIdleTurnGuardDecision
  module: omnimarket.models.idle_turn_guard.model_idle_turn_guard
handler:
  module: omnimarket.nodes.node_idle_turn_guard_compute.handlers.handler_idle_turn_guard_decision
  class: HandlerIdleTurnGuardDecision
  input_model: omnimarket.models.idle_turn_guard.model_idle_turn_guard.ModelIdleTurnGuardDecisionRequest
  output_model: omnimarket.models.idle_turn_guard.model_idle_turn_guard.ModelIdleTurnGuardDecision
handler_routing:
  routing_strategy: operation_match
  default_handler: omnimarket.nodes.node_idle_turn_guard_compute.handlers.handler_idle_turn_guard_decision:HandlerIdleTurnGuardDecision
  handlers:
    - operation: decide_idle_turn
      topic: onex.cmd.omnimarket.idle-turn-guard-decision-requested.v1
      handler:
        name: HandlerIdleTurnGuardDecision
        module: omnimarket.nodes.node_idle_turn_guard_compute.handlers.handler_idle_turn_guard_decision
descriptor:
  node_archetype: compute
  purity: pure
  idempotent: true
  timeout_ms: 2000
config:
  idle_turn_guard:
    dispatch_receipt_states: [placed, placing]
terminal_event: onex.evt.omnimarket.idle-turn-guard-decided.v1
runtime_dispatch:
  command_topic: onex.cmd.omnimarket.idle-turn-guard-decision-requested.v1
  terminal_events:
    success: onex.evt.omnimarket.idle-turn-guard-decided.v1
event_bus:
  subscribe_topics:
    - onex.cmd.omnimarket.idle-turn-guard-decision-requested.v1
  publish_topics:
    - onex.evt.omnimarket.idle-turn-guard-decided.v1
published_events:
  - event_type: IdleTurnGuardDecided
    topic: onex.evt.omnimarket.idle-turn-guard-decided.v1
    description: The verdict on one orchestrator Stop turn.
metadata:
  transport_type: inmemory
  description: Decides whether an idle orchestrator Stop turn is refused, held or passed
  author: OmniNode Team
  created: "2026-11-05"
