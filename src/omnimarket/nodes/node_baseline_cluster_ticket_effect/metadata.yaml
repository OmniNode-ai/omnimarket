name: node_baseline_cluster_ticket_effect
version: 0.1.0
description: >-
  Find or continue the one ticket of a dev-baseline cluster by its stable signature lines
  through the ticket store, commenting on an open ticket, linking through a duplicate chain,
  or creating a new ticket under the overlay's parent.
omnibase_core_compat: '>=0.47.31,<0.48.0'
entry_points:
  onex.nodes:
    node_baseline_cluster_ticket_effect: omnimarket.nodes.node_baseline_cluster_ticket_effect
capabilities:
  standalone: true
  full_runtime: false
  requires_network: false
  requires_repo: false
  requires_secrets: true
  requires_docker: false
  side_effect_class: write
license: MIT
authors:
  - OmniNode Team
tags:
  - effect
  - baseline
  - cluster
  - ticket
  - in_process
pack: operator_tooling
display_name: Baseline Cluster Ticket Effect
node_role: effect
