---
# ONEX Contract: node_projection_dep_health
# Projects dep-health-sweep-completed events into the dep_health_findings table.

name: node_projection_dep_health
contract_version: {major: 0, minor: 1, patch: 0}
node_version: {major: 0, minor: 1, patch: 0}
node_type: reducer
lifecycle: experimental
description: >
  Projects dep-health-sweep-completed events into the dep_health_findings table.
  Upsert keyed by (run_id, finding_type, file_path, symbol). Idempotent.

# OMN-17556: this projection writes a TENANT-domain table, so its handler
# resolves the tenant_projection binding. That binding's credential is a
# store-resolved secret_ref read through SecretResolver at the binding
# boundary, and exactly one process holds it: the consolidated writer that
# boots RUNTIME_PROFILE=tenant-projection and owns every TENANT-domain
# projection contract. `tenant-projection` is a registered, consumer-attached
# runtime profile, so this contract is drained by that writer and is
# deliberately absent from `main` and `effects` -- neither of those processes
# carries the credential, and per the 2026-09-03 operator ruling neither ever
# will as a container env var. This is the permanent ownership boundary, not
# a temporary orphaning.
runtime_profiles: [tenant-projection]

handler:
  module: omnimarket.nodes.node_projection_dep_health.handlers.handler_projection_dep_health
  class: HandlerProjectionDepHealth

handler_routing:
  routing_strategy: operation_match
  handlers:
    - operation: projection_dep_health
      handler:
        name: HandlerProjectionDepHealth
        module: omnimarket.nodes.node_projection_dep_health.handlers.handler_projection_dep_health

runtime_dispatch:
  addressable: false
  invocation_mode: projection_reducer
  reason: "Dep-health projection is an event-sourced reducer invoked by the projection host with a database adapter, not a request/response command node."

db_io:
  db_tables:
    - name: dep_health_findings
      database_ref: application
      # OMN-15655 / operator ruling 2026-08-02 (house tenant): workload-
      # attributable rows live in the tenant domain; platform-own workloads
      # are the house tenant's rows. ADR-0027 classification, not a rename.
      schema: tenant
      migration: "001_create_dep_health_findings.sql"
      access: write
      role: findings

event_bus:
  subscribe_topics:
    - onex.evt.omnimarket.dep-health-sweep-completed.v1
  publish_topics: []

projection_api:
  expose: true
  topic: "onex.snapshot.projection.dep-health.findings.v1" # onex-topic-allow: projection snapshot topics use onex.snapshot.* prefix by convention
  table: "dep_health_findings"
  schema: "public"
  columns:
    - "run_id"
    - "finding_type"
    - "severity"
    - "repo"
    - "file_path"
    - "symbol"
    - "detail"
    - "rule_id"
    - "rule_version"
    - "captured_at"
  order_by: "captured_at DESC, severity ASC"
  freshness_column: "captured_at"
  limit: 500

metadata:
  transport_type: kafka
