---
# OMN-22478, RULING 2026-11-06T00:23:28Z: "We should have a fucking overlay that gets loaded into the
# fucking database or into the KV store." The overlay home is the source; this node loads one overlay by id
# onto the bus, and node_projection_overlay_store stores it, the work ledger's pattern. The host table
# is its first overlay.
name: overlay_store_load_effect
lifecycle: experimental
node_type: effect
contract_version: {major: 1, minor: 0, patch: 0}
node_version: {major: 1, minor: 0, patch: 0}
description: Validates one overlay of the overlay home by the model the home names for it and publishes one version on the bus.
output_model: omnimarket.models.overlay_store.ModelOverlayStoreRecord
handler:
  module: omnimarket.nodes.node_overlay_store_load_effect.handlers.handler_overlay_store_load
  class: HandlerOverlayStoreLoad
  output_model: omnimarket.models.overlay_store.ModelOverlayStoreLoadResult
descriptor:
  node_archetype: effect
  purity: impure
  idempotent: true
  side_effects: [bus-publish]
  timeout_ms: 60000
  runtime_profiles: [effects]
runtime_dispatch:
  external_trigger: true
event_bus:
  subscribe_topics: []
  publish_topics:
    - onex.evt.omnimarket.overlay-store-loaded.v1
    # OMN-26495: a setting an operator set differs from the overlay home (digests, never values), and a run
    # refused because the live record could not be read.
    - onex.evt.omnimarket.overlay-store-drift.v1
    - onex.evt.omnimarket.overlay-store-refused.v1
# OMN-26495: drift and refusal reports are read by operators and monitors outside the repo's contracts.
externally_consumed_topics:
  - onex.evt.omnimarket.overlay-store-drift.v1
  - onex.evt.omnimarket.overlay-store-refused.v1
# OMN-26495: the loader runs hourly on h053 under that host's login, which ONEX_ACL_HOST_RECONCILER_PRINCIPAL names alone
# (the overlay scope broker_acl_principals); the rows below are what the two new topics and the live read's consumer groups need.
# The loaded topic's own row stays declared in the overlay scope broker_acls_overlay_store_dev_lane.
broker_acl_grants:
  - principal: "${ONEX_ACL_HOST_RECONCILER_PRINCIPAL}"
    grants:
      - {resource_type: TOPIC, pattern: LITERAL, name: onex.evt.omnimarket.overlay-store-drift.v1, operation: WRITE}
      - {resource_type: TOPIC, pattern: LITERAL, name: onex.evt.omnimarket.overlay-store-drift.v1, operation: DESCRIBE}
      - {resource_type: TOPIC, pattern: LITERAL, name: onex.evt.omnimarket.overlay-store-refused.v1, operation: WRITE}
      - {resource_type: TOPIC, pattern: LITERAL, name: onex.evt.omnimarket.overlay-store-refused.v1, operation: DESCRIBE}
      - {resource_type: GROUP, pattern: PREFIXED, name: node_overlay_store_load_effect.live., operation: READ}
      - {resource_type: GROUP, pattern: PREFIXED, name: node_overlay_store_load_effect.live., operation: DESCRIBE}
# OMN-26495: read directly within live_read_window_s by the loader, never dispatched by a runtime, so it is no
# subscription of this node: node_projection_overlay_store publishes it. The live record says which settings an
# operator set.
snapshot_read:
  # onex-topic-allow: a projection snapshot topic has the projection's own name form.
  topic: onex.snapshot.projection.overlay-store.v1
overlay:
  node: node_overlay_store_load_effect
  roots_env: ONEX_SKILL_OVERLAY_ROOTS
metadata:
  transport_type: kafka
  ticket: OMN-22478
