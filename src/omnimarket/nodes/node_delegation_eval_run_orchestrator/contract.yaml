---
name: delegation_eval_run_orchestrator
contract_version: {major: 1, minor: 0, patch: 0}
node_type: orchestrator
node_version: {major: 1, minor: 0, patch: 0}
runtime_profiles: [main]
input_model: omnimarket.events.delegation_eval.ModelDelegationEvalRunRequest
output_model: omnimarket.nodes.node_delegation_eval_run_orchestrator.models.model_eval_run.ModelEvalRunResult
description: >
  OMN-19793 (EV.4). Definition-B run operation of the delegation evals plan. An
  injected tenant-bound ProtocolDelegationEvalLabelledItems supplies one rater's
  labelled items of a manifest; the gate-eval compute replays each three times;
  the handler returns one content-free run-completed payload under eval run id
  uuid5(manifest id, label-set sha256, gate version), so a redelivered command
  yields the same id and rows and a gate change is a new run. One terminal per
  command, completed or failed. TLA+ model: formal/delegation_eval_run.
  Committed lab command: python -m omnimarket.nodes.node_delegation_eval_orchestrator.lab_run run.
handler_routing:
  routing_strategy: operation_match
  handlers:
    - operation: delegation-eval-run
      handler:
        name: HandlerDelegationEvalRun
        module: omnimarket.nodes.node_delegation_eval_run_orchestrator.handlers.handler_delegation_eval_run
      handler_module: omnimarket.nodes.node_delegation_eval_run_orchestrator.handlers.handler_delegation_eval_run
event_bus:
  subscribe_topics:
    - onex.cmd.omnimarket.delegation-eval-run.v1
  publish_topics:
    - onex.evt.omnimarket.delegation-eval-run-completed.v1
terminal_event: onex.evt.omnimarket.delegation-eval-run-completed.v1
# Invoking runtimes bind the tenant-scoped labelled-item port before dispatch.
runtime_dispatch:
  command_topic: onex.cmd.omnimarket.delegation-eval-run.v1
  terminal_events:
    success: onex.evt.omnimarket.delegation-eval-run-completed.v1
metadata:
  transport_type: kafka
