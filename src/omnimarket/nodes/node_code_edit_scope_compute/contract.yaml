description: >
  Derive exact writable files and declared checks from tracked paths named in a
  delegated code task. A task naming no tracked file yields no scope. Checks are
  git diff --check and py_compile of the named Python files. Pure computation:
  callers supply task text, tracked paths and the interpreter; no I/O occurs.
