---
# SPDX-FileCopyrightText: 2025 OmniNode.ai Inc.
# SPDX-License-Identifier: MIT
# ONEX Node Contract - Dep Cascade Dedup Orchestrator (OMN-12213)
#
# Post-release cleanup orchestrator: discovers open dep-bump PRs across repos,
# groups by (repo, package), identifies superseded PRs, and closes them with
# a supersession comment.
name: node_dep_cascade_dedup_orchestrator
contract_version: {major: 1, minor: 0, patch: 0}
node_type: orchestrator
node_version: {major: 1, minor: 0, patch: 0}
node_not_implemented: false

description: >
  Dep cascade dedup orchestrator. Discovers open automated dependency-bump PRs
  (Dependabot / Renovate) across a set of repos, groups them by (repo, package),
  identifies superseded PRs (all but the highest-target-version keeper, or all if
  the package is already on main), and closes superseded PRs with a comment.
  Designed to run as a post-release hook or on-demand cleanup.

handler:
  module: omnimarket.nodes.node_dep_cascade_dedup_orchestrator.handlers.handler_dep_cascade_dedup_orchestrator
  class: HandlerDepCascadeDedupOrchestrator
  input_model: omnimarket.nodes.node_dep_cascade_dedup_orchestrator.models.model_dep_cascade_dedup_request.ModelDepCascadeDedupRequest

handler_routing:
  routing_strategy: operation_match
  handlers:
    - handler:
        name: HandlerDepCascadeDedupOrchestrator
        module: omnimarket.nodes.node_dep_cascade_dedup_orchestrator.handlers.handler_dep_cascade_dedup_orchestrator

descriptor:
  node_archetype: orchestrator
  purity: impure
  idempotent: true
  timeout_ms: 600000
  runtime_profiles:
    - effects

terminal_event: onex.evt.omnimarket.dep-cascade-dedup-completed.v1

event_bus:
  consumer_group: omnimarket.dep_cascade_dedup_orchestrator.consume.v1
  subscribe_topics:
    - onex.cmd.omnimarket.dep-cascade-dedup-start.v1
  publish_topics:
    - onex.evt.omnimarket.dep-cascade-dedup-pr-closed.v1
    - onex.evt.omnimarket.dep-cascade-dedup-completed.v1
  dlq_topics:
    - onex.dlq.omnimarket.dep-cascade-dedup.v1

metadata:
  transport_type: kafka
  implementation_wave: 2
  related_tickets: ["OMN-12213", "OMN-12343"]
