name: node_job_start_source_effect
version: 1.0.0
description: Read which GitHub Actions jobs start and when (repository, run, job, runner group, labels, fork head, start time) for the repositories an overlay declares, judge the read, and keep one record per read in a retained store (in-memory, or the ledger through the reading appender).
pack: operator_tooling
node_role: effect
display_name: Job Start Source Effect
omnibase_core_compat: '>=0.39.0,<1.0.0'
entry_points:
  onex.nodes:
    node_job_start_source_effect: omnimarket.nodes.node_job_start_source_effect
capabilities:
  standalone: true
  full_runtime: false
  requires_network: true
  requires_repo: false
  requires_secrets: true
  requires_docker: false
  side_effect_class: read
dependencies:
- pydantic>=2.0
- pyyaml>=6.0
authors:
- OmniNode Platform Team
license: MIT
tags:
- effect
- job-start-source
