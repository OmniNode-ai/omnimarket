# ONEX Node Contract - Delegation Scenario R6 Effect (OMN-23174, readiness plan A8)
#
# Scenario R6, a task longer than 240 seconds completes under a configured 600 second ceiling. One scheduled run drives the
# delegation skill handler with a synthetic summarization request and a rungs-mode probe ladder whose one stub rung answers after
# 300 s: with a site overlay that sets the summarization ceiling to 600 s the run completes, takes longer than 240 s and its
# budget evidence names ceiling 600 from the overlay; the same request without the overlay is refused before dispatch. Every
# assertion is a typed field of the delegation terminal or a byte comparison of the answer; no model judges a pass.
name: node_delegation_scenario_r6_effect
contract_name: node_delegation_scenario_r6_effect
node_name: node_delegation_scenario_r6_effect
contract_version: {major: 0, minor: 1, patch: 0}
node_version: {major: 0, minor: 1, patch: 0}
node_type: effect
lifecycle: experimental
runtime_profiles: [effects]

description: >
  Runs readiness scenario R6 once through the delegation skill handler with a probe ladder, publishes the result on the bus
  and writes one ledger STATUS row. The node's own systemd user timer (`schedule install`) runs it daily.

handler:
  module: omnimarket.nodes.node_delegation_scenario_r6_effect.handlers.handler_scenario_r6
  class: HandlerScenarioR6
  input_model: omnimarket.nodes.node_delegation_scenario_r6_effect.handlers.handler_scenario_r6.ModelScenarioR6RunCommand

# Not a runtime-dispatched handler: HandlerScenarioR6 takes its contract runtime block, leg transport, ledger append route,
# event sink and clock as constructor parameters, so the node runs through its own CLI and schedule.

descriptor:
  node_archetype: effect
  runtime_profiles: [effects]
  purity: impure
  idempotent: false
  side_effects: [loopback-socket, file-write, ledger-append, bus-publish]
  timeout_ms: 900000

input_model:
  name: ModelScenarioR6RunCommand
  module: omnimarket.nodes.node_delegation_scenario_r6_effect.handlers.handler_scenario_r6
  description: One run of scenario R6; it carries no value.
output_model:
  name: ModelScenarioResult
  module: omnimarket.models.model_delegation_scenario
  description: The slot, trigger, conclusion and each assertion that held or did not.

terminal_event: onex.evt.omnimarket.delegation-scenario-result.v1

runtime_dispatch:
  external_trigger: true

event_bus:
  subscribe_topics: []
  publish_topics:
    - onex.evt.omnimarket.delegation-scenario-result.v1

externally_consumed_topics:
  - onex.evt.omnimarket.delegation-scenario-result.v1

runtime:
  home_env: OMNI_HOME
  ledger_append_command_env: ONEX_LEDGER_BUS_APPEND_COMMAND
  ledger_append_timeout_seconds: 60
  host_env: ONEX_HOST_NAME
  bus_emit_command_env: ONEX_BUS_EMIT_COMMAND
  # Every event is journalled here; when the deployment names a bus produce command in bus_emit_command_env it also gets the event.
  event_journal_relpath: .onex_state/delegation-scenario-r6/events.jsonl
  bus_emit_timeout_seconds: 60
  scenario_id: R6
  cadence: daily
  ticket: OMN-23174
  lane: node_delegation_scenario_r6_effect
  actor: script:node_delegation_scenario_r6_effect
  work_relpath: .onex_state/delegation-scenario-r6/work
  # loopback: one stub HTTP server per rung, called by the real delegation effect. inmemory: scripted typed replies.
  leg_backend: loopback
  loopback_host: 127.0.0.1
  probe_tenant_slug: readiness-probe
  inputs_relpath: inputs/r6_legs.yaml

schedule:
  unit_name: onex-delegation-scenario-r6
  state_directory: .onex_state/delegation-scenario-r6
  timeout_seconds: 900
  unit_environment: [ONEX_LEDGER_BUS_APPEND_COMMAND, ONEX_HOST_NAME, ONEX_WORKSPACE_CONFIG_ROOT, ONEX_BUS_EMIT_COMMAND]
  cadence:
    on_calendar: "*-*-* 03:40:00"
    time_zone: UTC
    randomized_delay: 0s
    persistent: false
    description: delegation readiness scenario R6, daily at 03:40 UTC

metadata:
  ticket: OMN-23174
  transport_type: inmemory
