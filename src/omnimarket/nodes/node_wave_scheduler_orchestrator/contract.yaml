---
# SPDX-FileCopyrightText: 2025 OmniNode.ai Inc.
# SPDX-License-Identifier: MIT
# ONEX Node Contract - Wave Scheduler Orchestrator (OMN-12210, repaired OMN-17017)
#
# Dependency-aware wave scheduler: parse plan file → build dependency DAG →
# dispatch one wave at a time → read observed terminal outcomes back → compute
# the next wave from what actually completed.
#
# OMN-17017 made this contract honest. Deleted claims the handler did not
# implement: stall monitoring, agent_healthcheck integration, and three publish
# topics the node never published (wave-dispatched, wave-completed,
# stall-detected, dependency-violation). Dependency violations are returned as a
# typed result field, not published. The terminal event is published by the
# runtime, not by the handler.
name: node_wave_scheduler_orchestrator
contract_version: {major: 1, minor: 0, patch: 0}
node_type: orchestrator
node_version: {major: 1, minor: 0, patch: 0}
node_not_implemented: false

description: >
  Wave scheduler orchestrator. Consumes a ModelWaveSchedulerRequest carrying a
  plan file path and max_concurrency cap, builds a dependency DAG from ticket
  `depends_on` relationships, and dispatches one wave at a time. Each wave is
  computed from OBSERVED completion reported by the dispatcher — never from
  selection — so a failed, stalled or unreported ticket removes its transitive
  dependent closure from the remaining waves and those tickets are reported
  BLOCKED without ever being dispatched. A ticket the dispatcher does not report
  is recorded UNREPORTED and forbids run_status=COMPLETED; a status outside the
  enum is a hard error. `fail_fast` aborts the run on the first wave carrying any
  non-COMPLETED ticket. `resume` reads the run's persisted checkpoint and reports
  `resumed` only when one was actually read. The default effect boundary
  (HandlerWaveDispatchStateStore) records dispatch-lifecycle transitions as
  append-only NDJSON under the resolved state dir and reads terminal outcomes
  back from it; an alternative dispatcher may be injected.

handler:
  module: omnimarket.nodes.node_wave_scheduler_orchestrator.handlers.handler_wave_scheduler_orchestrator
  class: HandlerWaveSchedulerOrchestrator
  input_model: omnimarket.nodes.node_wave_scheduler_orchestrator.models.model_wave_scheduler_request.ModelWaveSchedulerRequest

handler_routing:
  routing_strategy: operation_match
  handlers:
    - operation: wave_scheduler
      handler:
        name: HandlerWaveSchedulerOrchestrator
        module: omnimarket.nodes.node_wave_scheduler_orchestrator.handlers.handler_wave_scheduler_orchestrator

descriptor:
  node_archetype: orchestrator
  purity: impure
  idempotent: false
  # OMN-17017: was 14400000 (4h), which read as a long-running supervisor. The
  # handler waits on nothing — it dispatches, reads observed outcomes back from
  # durable state, and returns. 10 minutes is the honest ceiling.
  timeout_ms: 600000
  runtime_profiles:
    - effects

terminal_event: onex.evt.omnimarket.wave-scheduler-completed.v1

event_bus:
  subscribe_topics:
    - onex.cmd.omnimarket.wave-scheduler-start.v1
  publish_topics:
    # Terminal event only — published by the runtime on the handler's behalf.
    # A topic is listed here ONLY when something actually publishes it
    # (enforced by scripts/ci/check_contract_publish_parity.py, OMN-17017).
    - onex.evt.omnimarket.wave-scheduler-completed.v1
  dlq_topics:
    - onex.dlq.omnimarket.wave-scheduler.v1

metadata:
  transport_type: kafka
  handlers_deferred: false
  related_tickets: ["OMN-12210", "OMN-17017"]
