sub_handler_dependencies:
  - name: closeout
    protocol: omnimarket.nodes.node_build_loop_orchestrator.protocols.protocol_sub_handlers.ProtocolCloseoutHandler
    default_impl: omnimarket.nodes.node_closeout_effect.handlers.handler_closeout.HandlerCloseout
    optional: true
  - name: verify
    protocol: omnimarket.nodes.node_build_loop_orchestrator.protocols.protocol_sub_handlers.ProtocolVerifyHandler
    default_impl: omnimarket.nodes.node_verify_effect.handlers.handler_verify.HandlerVerify
    optional: true
  - name: rsd_fill
    protocol: omnimarket.nodes.node_build_loop_orchestrator.protocols.protocol_sub_handlers.ProtocolRsdFillHandler
    default_impl: omnimarket.nodes.node_rsd_fill_compute.handlers.handler_rsd_fill.HandlerRsdFill
    optional: true
  - name: classify
    protocol: omnimarket.nodes.node_build_loop_orchestrator.protocols.protocol_sub_handlers.ProtocolTicketClassifyHandler
    default_impl: omnimarket.nodes.node_ticket_classify_compute.handlers.handler_ticket_classify.HandlerTicketClassify
    optional: true
  - name: dispatch
    protocol: omnimarket.nodes.node_build_loop_orchestrator.protocols.protocol_sub_handlers.ProtocolBuildDispatchHandler
    default_impl: omnimarket.nodes.node_build_dispatch_effect.handlers.handler_build_dispatch.HandlerBuildDispatch
    optional: true

terminal_event: onex.evt.omnimarket.build-loop-orchestrator-completed.v1

event_bus:
  subscribe_topics:
    - onex.cmd.omnimarket.build-loop-orchestrator-start.v1
    # Canonical topic from node_overseer_verifier/contract.yaml (OMN-8025)
    - onex.evt.omnimarket.overseer-verifier-completed.v1
  publish_topics:
    - onex.evt.omnimarket.build-loop-orchestrator-phase-transition.v1
    - onex.evt.omnimarket.build-loop-orchestrator-completed.v1
    - onex.evt.omnimarket.delegation-attempt.v1
    - onex.evt.omnimarket.delegation-metrics.v1
    - onex.cmd.omnimarket.delegation-request.v1
    - onex.evt.omnimarket.build-loop-started.v1
    - onex.evt.omnimarket.build-loop-fill-completed.v1
    - onex.evt.omnimarket.build-loop-classify-completed.v1
    - onex.evt.omnimarket.build-loop-closeout-completed.v1
    - onex.evt.omnimarket.build-loop-build-completed.v1
    - onex.evt.omnimarket.build-loop-failed.v1
    - onex.evt.omnimarket.build-loop-dod-checked.v1
    # Canonical topic from node_overseer_verifier/contract.yaml (OMN-8025)
    - onex.cmd.omnimarket.overseer-verify.v1
# OMN-18013 — explicit SINK declaration. node_platform_readiness names this topic in
# SOW_PHASE2_REQUIRED_TOPICS (handler_platform_readiness.py:28) and PROBES it off the
# broker as a readiness dimension. It never consumed it through a subscription -- the
# subscribe declaration it used to carry resolved to zero dispatchers and DLQ'd every
# message. The probe is the real consumer, and it lives outside the contract corpus.
externally_consumed_topics:
  - onex.evt.omnimarket.build-loop-dod-checked.v1
  - onex.cmd.omnimarket.delegation-request.v1
  - onex.evt.omnimarket.build-loop-orchestrator-phase-transition.v1
  # referenced outside the node graph at omnimarket/src/omnimarket/nodes/node_build_loop_orchestrator/handlers/adapter_llm_dispatch.py
  - onex.evt.omnimarket.delegation-attempt.v1
  # referenced outside the node graph at omnimarket/src/omnimarket/nodes/node_build_loop_orchestrator/handlers/adapter_llm_dispatch.py
  - onex.evt.omnimarket.delegation-metrics.v1


state_machine:
  version: {major: 1, minor: 0, patch: 0}
  state_machine_name: build_loop_orchestrator
  state_machine_version: {major: 1, minor: 0, patch: 0}
  description: "Build loop cycle as advanced by node_build_loop HandlerBuildLoop.advance for the orchestrator's modes (build, close_out, full, observe). A failed phase below the circuit-breaker threshold stays in place for a retry; at the threshold it fails."
  initial_state: IDLE
  terminal_states: [COMPLETE, FAILED]
  error_states: [FAILED]
  states:
    - version: {major: 1, minor: 0, patch: 0}
      state_name: IDLE
      state_type: operational
      description: "No cycle started."
    - version: {major: 1, minor: 0, patch: 0}
      state_name: CLOSING_OUT
      state_type: operational
      description: "Close-out sub-handler."
    - version: {major: 1, minor: 0, patch: 0}
      state_name: VERIFYING
      state_type: operational
      description: "Verification sub-handler."
    - version: {major: 1, minor: 0, patch: 0}
      state_name: FILLING
      state_type: operational
      description: "Ticket fill sub-handler."
    - version: {major: 1, minor: 0, patch: 0}
      state_name: CLASSIFYING
      state_type: operational
      description: "Ticket classification sub-handler."
    - version: {major: 1, minor: 0, patch: 0}
      state_name: BUILDING
      state_type: operational
      description: "Build dispatch sub-handler."
    - version: {major: 1, minor: 0, patch: 0}
      state_name: RELEASING
      state_type: operational
      description: "Release phase of the close_out and full modes. The orchestrator has no sub-handler for it (_execute_phase returns Unknown phase), so it can only retry and then fail; OMN-19548 records this."
    - version: {major: 1, minor: 0, patch: 0}
      state_name: COMPLETE
      state_type: terminal
      description: "The mode's phase sequence finished."
      is_terminal: true
      is_recoverable: false
    - version: {major: 1, minor: 0, patch: 0}
      state_name: FAILED
      state_type: terminal
      description: "Circuit breaker tripped after consecutive phase failures."
      is_terminal: true
      is_recoverable: false
  transitions:
    # start command received
    - version: {major: 1, minor: 0, patch: 0}
      transition_name: idle_to_closing_out
      from_state: IDLE
      to_state: CLOSING_OUT
      trigger: start_received
    # start command with skip_closeout, or observe mode (sequence starts at VERIFYING)
    - version: {major: 1, minor: 0, patch: 0}
      transition_name: idle_to_verifying
      from_state: IDLE
      to_state: VERIFYING
      trigger: start_received_skip_closeout
    # closeout completed
    - version: {major: 1, minor: 0, patch: 0}
      transition_name: closing_out_to_verifying
      from_state: CLOSING_OUT
      to_state: VERIFYING
      trigger: closeout_completed
    # verification passed (build and full modes)
    - version: {major: 1, minor: 0, patch: 0}
      transition_name: verifying_to_filling
      from_state: VERIFYING
      to_state: FILLING
      trigger: verification_passed
    # fill completed
    - version: {major: 1, minor: 0, patch: 0}
      transition_name: filling_to_classifying
      from_state: FILLING
      to_state: CLASSIFYING
      trigger: fill_completed
    # classification completed
    - version: {major: 1, minor: 0, patch: 0}
      transition_name: classifying_to_building
      from_state: CLASSIFYING
      to_state: BUILDING
      trigger: classification_completed
    # build dispatch completed (build mode)
    - version: {major: 1, minor: 0, patch: 0}
      transition_name: building_to_complete
      from_state: BUILDING
      to_state: COMPLETE
      trigger: build_dispatch_completed
    # OMN-19548: observe mode's sequence is VERIFYING alone, so a passed
    # verification completes the cycle. Taken by next_phase(); not declared before.
    - version: {major: 1, minor: 0, patch: 0}
      transition_name: verifying_to_complete
      from_state: VERIFYING
      to_state: COMPLETE
      trigger: verification_passed_observe
    # OMN-19548: close_out mode continues to RELEASING after VERIFYING (next_phase).
    - version: {major: 1, minor: 0, patch: 0}
      transition_name: verifying_to_releasing
      from_state: VERIFYING
      to_state: RELEASING
      trigger: verification_passed_close_out
    # OMN-19548: full mode continues to RELEASING after BUILDING (next_phase).
    - version: {major: 1, minor: 0, patch: 0}
      transition_name: building_to_releasing
      from_state: BUILDING
      to_state: RELEASING
      trigger: build_dispatch_completed_full
    # OMN-19548: a phase failure below the circuit-breaker threshold stays in
    # the same phase for a retry (HandlerBuildLoop.advance emits from == to).
    - version: {major: 1, minor: 0, patch: 0}
      transition_name: closing_out_to_closing_out
      from_state: CLOSING_OUT
      to_state: CLOSING_OUT
      trigger: phase_failure_retry
    - version: {major: 1, minor: 0, patch: 0}
      transition_name: verifying_to_verifying
      from_state: VERIFYING
      to_state: VERIFYING
      trigger: phase_failure_retry
    - version: {major: 1, minor: 0, patch: 0}
      transition_name: filling_to_filling
      from_state: FILLING
      to_state: FILLING
      trigger: phase_failure_retry
    - version: {major: 1, minor: 0, patch: 0}
      transition_name: classifying_to_classifying
      from_state: CLASSIFYING
      to_state: CLASSIFYING
      trigger: phase_failure_retry
    - version: {major: 1, minor: 0, patch: 0}
      transition_name: building_to_building
      from_state: BUILDING
      to_state: BUILDING
      trigger: phase_failure_retry
    - version: {major: 1, minor: 0, patch: 0}
      transition_name: releasing_to_releasing
      from_state: RELEASING
      to_state: RELEASING
      trigger: phase_failure_retry
    # consecutive phase failures reached the circuit-breaker threshold
    - version: {major: 1, minor: 0, patch: 0}
      transition_name: closing_out_to_failed
      from_state: CLOSING_OUT
      to_state: FAILED
      trigger: error
    - version: {major: 1, minor: 0, patch: 0}
      transition_name: verifying_to_failed
      from_state: VERIFYING
      to_state: FAILED
      trigger: error
    - version: {major: 1, minor: 0, patch: 0}
      transition_name: filling_to_failed
      from_state: FILLING
      to_state: FAILED
      trigger: error
    - version: {major: 1, minor: 0, patch: 0}
      transition_name: classifying_to_failed
      from_state: CLASSIFYING
      to_state: FAILED
      trigger: error
    - version: {major: 1, minor: 0, patch: 0}
      transition_name: building_to_failed
      from_state: BUILDING
      to_state: FAILED
      trigger: error
    - version: {major: 1, minor: 0, patch: 0}
      transition_name: releasing_to_failed
      from_state: RELEASING
      to_state: FAILED
      trigger: error

metadata:
  transport_type: kafka
  description: "Build loop orchestrator composing 6 sub-handlers via FSM reducer"
  author: "OmniNode Platform Team"
  created: "2026-04-07"
  tags:
    - "orchestrator"
    - "build-loop"
    - "fsm"
    - "workflow"
