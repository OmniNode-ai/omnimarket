---
name: build_loop_orchestrator
contract_version: {major: 1, minor: 0, patch: 0}
node_type: orchestrator
node_version: {major: 1, minor: 0, patch: 0}

description: >
  Top-level orchestrator composing 6 sub-handlers via FSM reducer. Takes
  protocol-based ProtocolCloseoutHandler, ProtocolVerifyHandler,
  ProtocolRsdFillHandler, ProtocolTicketClassifyHandler,
  ProtocolBuildDispatchHandler, plus the HandlerBuildLoop FSM. Emits phase
  transition events. Synchronous sub-handler calls, in-process state ownership.

  FSM: IDLE -> CLOSING_OUT -> VERIFYING -> FILLING -> CLASSIFYING -> BUILDING -> COMPLETE
  Circuit breaker trips after 3 consecutive failures -> FAILED.

# OMN-15002: this contract previously declared 3 additional handler_routing
# entries (linear_fill/AdapterLinearFill, llm_classify/AdapterLlmClassify,
# llm_dispatch/AdapterLlmDispatch). Those adapters are legacy composition-only
# classes consumed exclusively by the non-canonical assemble_live.py script
# (constructed directly in Python, never resolved via contract dispatch) --
# the live DI path (_ensure_sub_handlers()) always uses the real sub-handler
# implementations declared under sub_handler_dependencies below
# (HandlerRsdFill/HandlerTicketClassify/HandlerBuildDispatch from their own
# node packages). Because none of those 3 entries declared an event_model,
# omnibase_infra's auto-wiring (_topics_for_handler_entry) granted each of
# them EVERY contract subscribe_topic unconditionally, so all 3 were
# auto-wired as independent Kafka consumers of
# onex.cmd.omnimarket.build-loop-orchestrator-start.v1 alongside the real
# handler below. Every live dispatch fanned out to all 4 handlers; the 3 dead
# adapters threw ValidationError/TypeError on the mismatched payload shape,
# the aggregate failure was swallowed by the auto-wiring boundary catch-all
# (no DLQ on this lane), and HandlerBuildLoopOrchestrator.handle() -- the only
# real dispatcher -- never ran. Result: the daily build-loop trigger was a
# 100% silent no-op for 6+ consecutive days. Removing the 3 dead entries
# makes HandlerBuildLoopOrchestrator the SOLE handler_routing entry, so it
# deterministically owns both subscribe_topics again (the pre-existing
# single-handler rule in _topics_for_handler_entry). See OMN-15002/OMN-15001
# for the full forensic trace.
# OMN-18013 / OMN-16939 — routing_strategy is topic_match with ONE entry per topic, each
# declaring its own message_category. handler_wiring derives an entry's category ONCE
# (explicit message_category, else _derive_message_category(subscribe_topics[0])) and
# stamps it on every route that entry registers, so a single entry spanning both a .cmd.
# and a .evt. topic registers ALL of them under subscribe_topics[0]'s category and every
# topic of the other category matches zero routes: consumed, DLQ'd and COMMITTED on every
# message, at LAG 0, forever. Setting `topic:` alone is NOT sufficient — that picks WHICH
# topic an entry owns; `message_category:` picks which category it registers under.
handler_routing:
  routing_strategy: topic_match
  handlers:
    - topic: onex.cmd.omnimarket.build-loop-orchestrator-start.v1
      message_category: command
      operation: build_loop_orchestrator
      event_model:
        name: ModelOrchestratorStartCommand
        module: omnimarket.nodes.node_build_loop_orchestrator.models.model_orchestrator_start_command
      handler:
        name: HandlerBuildLoopOrchestrator
        module: omnimarket.nodes.node_build_loop_orchestrator.handlers.handler_build_loop_orchestrator
      description: "Build-loop start command."
    - topic: onex.evt.omnimarket.overseer-verifier-completed.v1
      message_category: event
      operation: build_loop_orchestrator
      handler:
        name: HandlerBuildLoopOrchestrator
        module: omnimarket.nodes.node_build_loop_orchestrator.handlers.handler_build_loop_orchestrator
      description: "Overseer verification fact (_topic_overseer_verification_completed branch)."


descriptor:
  node_archetype: orchestrator
  purity: effectful
  runtime_profiles:
    - effects
  idempotent: false
  timeout_ms: 300000

inputs:
  correlation_id:
    type: uuid
    description: "Unique cycle ID"
    required: true
  max_cycles:
    type: int
    description: "Maximum number of build loop cycles to run"
    required: false
    default: 1
  skip_closeout:
    type: bool
    description: "Skip the CLOSING_OUT phase"
    required: false
    default: false
  dry_run:
    type: bool
    description: "Run without side effects"
    required: false
    default: false

outputs:
  cycles_completed:
    type: int
    description: "Number of cycles that completed successfully"
  cycles_failed:
    type: int
    description: "Number of cycles that failed"
  total_tickets_dispatched:
    type: int
    description: "Total tickets dispatched across all cycles"

