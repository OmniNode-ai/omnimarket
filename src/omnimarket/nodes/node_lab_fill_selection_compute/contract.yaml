name: node_lab_fill_selection_compute
contract_version:
  major: 1
  minor: 0
  patch: 0
node_type: compute
node_version:
  major: 1
  minor: 0
  patch: 0
description: Deterministically select lab-fill work using ownership, handoffs and
  input baselines, and mark approved work done from completion facts.
handler:
  module: omnimarket.nodes.node_lab_fill_selection_compute.handlers.handler_lab_fill_selection
  class: HandlerLabFillSelection
  input_model: omnimarket.nodes.node_lab_fill_selection_compute.models.model_lab_fill_selection_request.ModelLabFillSelectionRequest
  output_model: omnimarket.nodes.node_lab_fill_selection_compute.models.model_lab_fill_selection_result.ModelLabFillSelectionResult
runtime_dispatch:
  external_trigger: Called in process by the lab fill step, with the deployment overlay and the facts supplied by the caller.
event_bus:
  subscribe_topics: []
  publish_topics: []
handler_routing:
  routing_strategy: operation_match
  handlers:
  - operation: select_lab_fill_work
    handler:
      name: HandlerLabFillSelection
      module: omnimarket.nodes.node_lab_fill_selection_compute.handlers.handler_lab_fill_selection
    input_model: omnimarket.nodes.node_lab_fill_selection_compute.models.model_lab_fill_selection_request.ModelLabFillSelectionRequest
    output_model: omnimarket.nodes.node_lab_fill_selection_compute.models.model_lab_fill_selection_result.ModelLabFillSelectionResult
  - operation: mark_approved_work_done
    handler:
      name: HandlerApprovedWorkFreshness
      module: omnimarket.nodes.node_lab_fill_selection_compute.handlers.handler_approved_work_freshness
    input_model: omnimarket.nodes.node_lab_fill_selection_compute.models.model_approved_work_freshness.ModelApprovedWorkFreshnessRequest
    output_model: omnimarket.nodes.node_lab_fill_selection_compute.models.model_approved_work_freshness.ModelApprovedWorkFreshnessResult
  - operation: read_lane_resends
    handler:
      name: HandlerLaneResend
      module: omnimarket.nodes.node_lab_fill_selection_compute.handlers.handler_lane_resend
    input_model: omnimarket.nodes.node_lab_fill_selection_compute.models.model_lane_resend.ModelLaneResendRequest
    output_model: omnimarket.nodes.node_lab_fill_selection_compute.models.model_lane_resend.ModelLaneResendResult
descriptor:
  node_archetype: compute
  runtime_profiles: []
  purity: pure
  idempotent: true
  side_effects: []
metadata:
  ticket: OMN-20712
  origin_tickets:
  - OMN-17427
  - OMN-20662
  - OMN-23250
  transport_type: local
lifecycle: experimental
