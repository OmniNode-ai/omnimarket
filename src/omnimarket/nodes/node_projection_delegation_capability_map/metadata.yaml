name: projection_delegation_capability_map
version: "1.0.0"
description: "OMN-20169 tenant-scoped delegation capability cells per model, backend, configuration, class and size band."
omnibase_core_compat: ">=0.39.0,<1.0.0"
capabilities:
  standalone: true
  full_runtime: true
  requires_network: true
  requires_secrets: true
  side_effect_class: write_db
dependencies:
  - "omnibase_core>=0.39.0"
  - "pyyaml>=6.0"
tags: [projection, delegation, capability-map, reducer]
ownership:
  delegation_capability_cells:
    ddl_owner: omnimarket.nodes.node_projection_delegation_capability_map
    table_role: projection_read_model
    create_migration: "migrations/0000_create_delegation_capability_cells.sql"
    duplicate_migration_policy: forbid_cross_repo_create_table
    non_owner_repos: [omnibase_infra]
    rationale: "omnimarket owns the projection; omnibase_infra applies its migrations."
pack: "data"
display_name: "Projection: Delegation Capability Map"
node_role: "effect"
