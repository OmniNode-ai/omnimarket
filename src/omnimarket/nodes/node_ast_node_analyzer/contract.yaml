---
name: node_ast_node_analyzer
contract_version: {major: 1, minor: 0, patch: 0}
node_type: compute
node_version: {major: 1, minor: 0, patch: 0}
description: >
  Pure deterministic AST analyzer for a single ONEX node source file. Parses the
  node source text with the standard-library ast module and returns the node
  class name, its base class and mixins, its method names, its class docstring,
  and the I/O operation classes inferred from imports and source substrings. No
  side effects, no I/O, no bus or DB dependencies.

handler:
  module: omnimarket.nodes.node_ast_node_analyzer.handlers.handler_ast_node_analyzer
  class: HandlerAstNodeAnalyzer
  input_model: omnimarket.nodes.node_ast_node_analyzer.models.model_ast_node_analyzer_request.ModelAstNodeAnalyzerRequest
  output_model: omnimarket.nodes.node_ast_node_analyzer.models.model_node_analysis.ModelNodeAnalysis

handler_routing:
  routing_strategy: operation_match
  handlers:
    - operation: analyze_node
      handler:
        name: HandlerAstNodeAnalyzer
        module: omnimarket.nodes.node_ast_node_analyzer.handlers.handler_ast_node_analyzer

descriptor:
  node_archetype: compute
  purity: pure
  idempotent: true
  timeout_ms: 500
  runtime_profiles: [main]

inputs:
  source_text:
    type: str
    required: true
    description: Full Python source text of a single ONEX node source file.

outputs:
  class_name:
    type: str
  base_class:
    type: str
  mixins:
    type: array
    items:
      type: str
  methods:
    type: array
    items:
      type: str
  docstring:
    type: str
  io_operations:
    type: array
    items:
      type: str

terminal_event: onex.evt.omnimarket.ast-node-analysis-completed.v1

event_bus:
  subscribe_topics:
    - onex.cmd.omnimarket.ast-node-analysis-requested.v1
  publish_topics:
    - onex.evt.omnimarket.ast-node-analysis-completed.v1

externally_consumed_topics:
  - onex.evt.omnimarket.ast-node-analysis-completed.v1

metadata:
  transport_type: kafka
