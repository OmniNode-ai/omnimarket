name: node_compaction_cost_compute
version: 1.0.0
description: Accounts the cost of a compaction per arm as compaction tokens, context size after,
  recovery tokens and net saved context, each with measured, estimated or unavailable provenance,
  and the cost(mod)/cost(stock) ratio with its 50 percent perturbation bound.
pack: core
node_role: compute
display_name: Compaction Cost Compute
omnibase_core_compat: '>=0.39.0,<1.0.0'
entry_points:
  onex.nodes:
    node_compaction_cost_compute: omnimarket.nodes.node_compaction_cost_compute
capabilities:
  standalone: true
  full_runtime: true
  requires_network: false
  requires_repo: false
  requires_secrets: false
  requires_docker: false
  side_effect_class: none
dependencies:
- omnibase_core>=0.39.0
- pydantic>=2.11.0
- pyyaml>=6.0.2
license: MIT
tags:
- compute
- context
- compaction
