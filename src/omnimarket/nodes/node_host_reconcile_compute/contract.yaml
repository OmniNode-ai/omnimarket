---
name: host_reconcile_compute
contract_version:
  major: 1
  minor: 1
  patch: 0
node_type: compute
node_version:
  major: 1
  minor: 1
  patch: 0
description: >
  Host-local reconciliation with content-proven surfaces and dispatch floor eligibility.
  Installed component revision facts yield a typed IMPORT_DRIFT refusal on the
  host-reconcile-evaluated event when the installed revision differs from the expected
  repo revision. A stale installed copy blocks the dispatch floor without doing I/O.
input_model: omnimarket.models.model_host_reconcile.ModelHostReconcileEvaluateRequest
output_model: omnimarket.models.model_host_reconcile.ModelHostReconcileDecisions
handler:
  module: omnimarket.nodes.node_host_reconcile_compute.handlers.handler_host_reconcile_compute
  class: HandlerHostReconcileCompute
  input_model: omnimarket.models.model_host_reconcile.ModelHostReconcileEvaluateRequest
handler_routing:
  routing_strategy: payload_type_match
  handlers:
  - handler:
      name: HandlerHostReconcileCompute
      module: omnimarket.nodes.node_host_reconcile_compute.handlers.handler_host_reconcile_compute
    event_model:
      name: ModelHostReconcileEvaluateRequest
      module: omnimarket.models.model_host_reconcile
descriptor:
  node_archetype: compute
  purity: pure
  idempotent: true
  timeout_ms: 1000
  runtime_profiles:
  - main
terminal_event: onex.evt.omnimarket.host-reconcile-evaluated.v1
event_bus:
  subscribe_topics:
  - onex.cmd.omnimarket.host-reconcile-evaluate.v1
  publish_topics:
  - onex.evt.omnimarket.host-reconcile-evaluated.v1
runtime_dispatch:
  command_topic: onex.cmd.omnimarket.host-reconcile-evaluate.v1
externally_consumed_topics:
- onex.evt.omnimarket.host-reconcile-evaluated.v1
metadata:
  transport_type: kafka
inputs:
  facts:
    type: list[object]
    required: true
    description: >
      Observed host surfaces in recording order, including installed_revision facts
      with component_name, installed_revision and expected_revision.
outputs:
  surfaces:
    type: list[object]
    description: >
      Content verdicts in recording order. A stale installed component carries
      import_drift with outcome IMPORT_DRIFT, component_name, installed_revision
      and expected_revision on the declared host-reconcile-evaluated event.
