# Host retention for a lab host's root disk (OMN-22290, the five-whys read of 2026-11-13: h053 `/` 546G, 75 percent used with a 99G
# uv cache, ~120G of runner work and cache folders and 40G of lane scratch). Like the temp-directory retention node this is a
# host-local filesystem effect: it runs in the host's own process through its command line, with the in-memory default.
name: node_host_retention_effect
node_type: EFFECT_GENERIC
version: 1.0.0
lifecycle: experimental
contract_version: {major: 1, minor: 2, patch: 0}
node_version: "1.0.0"
runtime_profiles: []
description: >-
  Hold a lab host's disk under control, one path class at a time, each with its own overlay value. LANE SCRATCH and LANE RESULTS:
  a direct entry of a declared directory is removed when its owner is the user running the pass, no live process holds it (a
  working directory inside it, or its path in a command line, environment or open file), no live lane names it (a lane run
  directory whose run.pid names a running process, or a lane receipt whose final flag is false), nothing under it changed inside
  keep_days, and it holds no socket, pipe or other filesystem. RUNNER WORK: a CI runner container's mounted work and cache folders
  are evicted, largest declared entry first, down to keep_gib, only while `docker top` shows no Runner.Worker in the runner's
  container (re-read before every removal; an unreadable state refuses the runner) and only through `docker exec` in that
  container as the runner's own user. UV CACHE: `uv cache prune` once the cache holds min_gib, and, when a cap is declared, evict whole entries (unpacked wheels, git dependency checkouts) of the declared buckets oldest-first until the cache is at or under cap_gib, keeping entries that are hardlinked into a virtual environment, changed within keep_days, held by a live process, or not a plain folder.
  PRE-COMMIT STORE: a hook repository folder of the pre-commit cache is removed when nothing under it changed inside
  keep_days and no live process names it, together with its row in the store's index under the store's lock. A dry run reads everything and removes
  nothing: it lists each entry it would remove with its bytes and the totals per class. Never a docker volume, never a secret path,
  never a symlink target. Every host, path, window and size is a row of the node overlay, never of this node.
input_model:
  name: ModelHostRetentionRequest
  module: omnimarket.nodes.node_host_retention_effect.models.model_host_retention
output_model:
  name: ModelHostRetentionResult
  module: omnimarket.nodes.node_host_retention_effect.models.model_host_retention
handler:
  name: HandlerHostRetention
  module: omnimarket.nodes.node_host_retention_effect.handlers.handler_host_retention
  class: HandlerHostRetention
  input_model: omnimarket.nodes.node_host_retention_effect.models.model_host_retention.ModelHostRetentionRequest
  output_model: omnimarket.nodes.node_host_retention_effect.models.model_host_retention.ModelHostRetentionResult
entrypoint:
  name: NodeHostRetentionEffect
  module: omnimarket.nodes.node_host_retention_effect.node
handler_routing:
  routing_strategy: operation_match
  default_handler: omnimarket.nodes.node_host_retention_effect.handlers.handler_host_retention:HandlerHostRetention
  handlers:
    - operation: run_host_retention
      topic: onex.cmd.omnimarket.host-retention-requested.v1
      handler:
        name: HandlerHostRetention
        module: omnimarket.nodes.node_host_retention_effect.handlers.handler_host_retention
      input_model: omnimarket.nodes.node_host_retention_effect.models.model_host_retention.ModelHostRetentionRequest
      output_model: omnimarket.nodes.node_host_retention_effect.models.model_host_retention.ModelHostRetentionResult
terminal_event: onex.evt.omnimarket.host-retention-completed.v1
runtime_dispatch:
  command_topic: onex.cmd.omnimarket.host-retention-requested.v1
  terminal_events:
    success: onex.evt.omnimarket.host-retention-completed.v1
    failure: onex.evt.omnimarket.host-retention-failed.v1
externally_consumed_topics:
  - onex.evt.omnimarket.host-retention-completed.v1
  - onex.evt.omnimarket.host-retention-failed.v1
descriptor:
  node_archetype: effect
  purity: effectful
  runtime_profiles: []
  idempotent: true
  timeout_ms: 900000
execution:
  deterministic: false
  side_effects: true
  locus: host-local
  prerequisites:
    - The pass runs as the user that owns the scratch and result directories; runner folders are removed through docker exec only.
    - A shared runtime must never subscribe to this host-local filesystem command.
# The overlay this node reads (schema ModelHostRetentionOverlay): one row per host with its lane run roots, receipt roots, age
# classes, runner groups and uv caches. `overlay.example.yaml` beside this contract is the example; the lab rows are in the overlays repository.
overlay:
  file: overlay.yaml
  environment_pin: ONEX_HOST_RETENTION_OVERLAY
  model: omnimarket.nodes.node_host_retention_effect.models.model_host_retention.ModelHostRetentionOverlay
# What an overlay may not exceed. A declared root whose last component is not named here is refused, so an overlay cannot make
# this node remove from anywhere else; a runner mount's container root must sit under one of the allowed container roots.
retention_bounds:
  min_keep_days: 1
  root_leaf_names:
    lane_scratch: [scratch]
    lane_results: [harness-delegate, runs, remote-lanes, reports, delegation-receipts]
    runner_mount: [work, tmp, npm, pip, pnpm, pre-commit, ci-envs, ms-playwright]
    uv_cache: [uv-cache, uv]
    pre_commit_store: [pre-commit]
  # A runner mount's container root is relative to the runner user's home and must sit under one of these.
  allowed_container_roots: [actions-runner/_work, tmp, .npm, .cache]
  protected_leaf_names_always: [_actions, _temp, _PipelineMapping, .git, memory]
  # The folders of a uv cache a cap may evict whole entries from, and how deep an entry sits under each: `archive-v0/<id>`
  # is an unpacked wheel; `git-v0/checkouts/<repository>/<revision>` is one checkout of a git dependency (uv makes a new
  # one for every revision it installs and never removes an old one). A cap naming any other folder is refused.
  uv_evictable_buckets:
    archive-v0: 1
    git-v0/checkouts: 2
metadata:
  transport_type: inmemory
  execution_locus: host-local
