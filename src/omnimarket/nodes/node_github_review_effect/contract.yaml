---
# SPDX-FileCopyrightText: 2026 OmniNode.ai Inc.
# SPDX-License-Identifier: MIT
# ONEX Node Contract - GitHub Review Effect (OMN-13212 / B2)
#
# EFFECT: GitHub review-side I/O boundary absorbing the deleted node_pr_review_bot
# adapter_github_bridge + thread poster + thread watcher + report poster. Performs
# one of three operations per dispatch: post_threads, watch_threads, post_report.
name: node_github_review_effect
contract_version: {major: 1, minor: 0, patch: 0}
node_type: effect
node_version: {major: 1, minor: 0, patch: 0}

description: >
  EFFECT: performs one GitHub review-side I/O operation per dispatch —
  post_threads (post MAJOR/CRITICAL findings as review threads, bundle MINOR/NIT
  into a summary), watch_threads (single poll pass for thread resolution), or
  post_report (post the final summary comment). The GitHub token is resolved at
  the effect boundary from the contract-declared api_key_ref via the canonical
  secret-store resolver. No subprocess shell-out.

input_model:
  name: ModelGithubReviewCommand
  module: omnimarket.review.pr_review_node_io
  description: "Operation selector + review target + findings/thread states."

output_model:
  name: ModelGithubReviewResultEvent
  module: omnimarket.review.pr_review_node_io
  description: "Updated thread states (or posted-report comment id)."

handler:
  module: omnimarket.nodes.node_github_review_effect.handlers.handler_github_review_effect
  class: HandlerGithubReviewEffect
  input_model: omnimarket.review.pr_review_node_io.ModelGithubReviewCommand

handler_routing:
  routing_strategy: operation_match
  handlers:
    - handler:
        name: HandlerGithubReviewEffect
        module: omnimarket.nodes.node_github_review_effect.handlers.handler_github_review_effect

descriptor:
  node_archetype: effect
  purity: impure
  idempotent: false
  timeout_ms: 120000
  runtime_profiles:
    - effects

secrets:
  # GitHub token is contract-declared so the handler reads the ref name from
  # here — not a bare source literal. Value is resolved at the effect boundary
  # via the canonical secret-store resolver.
  GITHUB_TOKEN:
    description: "GitHub PAT or Actions token for review thread / comment posting."
    required: true

runtime_dispatch:
  command_topic: onex.cmd.omnimarket.github-review-op.v1
  terminal_events:
    success: onex.evt.omnimarket.github-review-op-completed.v1
    failure: onex.evt.omnimarket.github-review-op-failed.v1

event_bus:
  consumer_group: omnimarket.github_review_effect.consume.v1
  subscribe_topics:
    - onex.cmd.omnimarket.github-review-op.v1
  publish_topics:
    - onex.evt.omnimarket.github-review-op-completed.v1
    - onex.evt.omnimarket.github-review-op-failed.v1
    - onex.evt.omnimarket.pr-review-bot-thread-posted.v1
    - onex.evt.omnimarket.pr-review-bot-thread-verified.v1
  dlq_topics:
    - onex.dlq.omnimarket.github-review-op.v1

terminal_event: onex.evt.omnimarket.github-review-op-completed.v1

dependencies:
  packages:
    - "omnibase_core>=0.39.0"
    - "httpx>=0.27.0"

metadata:
  transport_type: kafka
  description: "GitHub review-side I/O effect node"
  author: "OmniNode Team"
  tags:
    - "effect"
    - "github"
    - "review"
    - "pr-bot"
  related_tickets:
    - "OMN-13212"
    - "OMN-13205"
