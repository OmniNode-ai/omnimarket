---
# SPDX-FileCopyrightText: 2026 OmniNode.ai Inc.
# SPDX-License-Identifier: MIT
# ONEX Node Contract - Receipt Gate Pin Friction Report Compute (OMN-20134)
#
# The query half of the pin friction measurement. Given the rows of
# node_projection_receipt_gate_pin_friction and a window, it returns, for each pin
# kind (sha, tag): the pull requests the updater opened, how many merged with no
# fix push and no CI re-run, the median time to merge, the touches per pull
# request, and the refusals (audit, guard, conflict, unmatched, other), over the
# pull requests first seen in the window.
#
# How to read it: the columns are the two pin forms the ruling of 2026-10-31T00:13:02Z
# left in place (omnibase_infra's caller holds a sha with the tag beside it; the other
# callers hold the dev-merge tag). A form that costs more shows a lower untouched
# rate, a higher touches-per-PR and more refusals over the same window.
name: "node_receipt_gate_pin_friction_report_compute"
lifecycle: experimental
node_type: "COMPUTE_GENERIC"
runtime_profiles: []
contract_version:
  major: 1
  minor: 0
  patch: 0
node_version: "1.0.0"
description: >-
  Pure per-pin-kind friction comparison over a window: PRs opened, merged untouched,
  median time to merge, touches per PR and refusals, from the projection's rows.
input_model:
  name: "ModelPinFrictionReportRequest"
  module: "omnimarket.nodes.node_receipt_gate_pin_friction_report_compute.models.model_pin_friction_report"
  description: "The projection's rows and the window [window_start, window_end)."
output_model:
  name: "ModelPinFrictionReport"
  module: "omnimarket.nodes.node_receipt_gate_pin_friction_report_compute.models.model_pin_friction_report"
  description: "One summary per pin kind over the window, and a rendered table."

handler:
  module: "omnimarket.nodes.node_receipt_gate_pin_friction_report_compute.handlers.handler_pin_friction_report"
  class: "HandlerReceiptGatePinFrictionReport"
  input_model: "omnimarket.nodes.node_receipt_gate_pin_friction_report_compute.models.model_pin_friction_report.ModelPinFrictionReportRequest"
  output_model: "omnimarket.nodes.node_receipt_gate_pin_friction_report_compute.models.model_pin_friction_report.ModelPinFrictionReport"

handler_routing:
  routing_strategy: "operation_match"
  default_handler: "omnimarket.nodes.node_receipt_gate_pin_friction_report_compute.handlers.handler_pin_friction_report:HandlerReceiptGatePinFrictionReport"
  handlers:
    - operation: "report_receipt_gate_pin_friction"
      handler:
        name: "HandlerReceiptGatePinFrictionReport"
        module: "omnimarket.nodes.node_receipt_gate_pin_friction_report_compute.handlers.handler_pin_friction_report"

event_bus:
  subscribe_topics: []
  publish_topics: []

runtime_dispatch:
  external_trigger: "an operator or a recurring tick reads the projection's rows (onex.snapshot.projection.receipt-gate-pin-friction.v1 through node_projection_read_effect) and runs this node on them with a window; it declares empty event_bus topics and a typed local invocation."

descriptor:
  node_archetype: compute
  purity: pure
  runtime_profiles: []
  idempotent: true
  timeout_ms: 5000

replay:
  requires_validator_version: true
  timestamp_authority: ingest_sequence
  deterministic: true

metadata:
  transport_type: local
  description: "Receipt gate pin friction report COMPUTE - per pin kind over a window (OMN-20134, no external transport)"
  author: "OmniNode Team"
  created: "2026-10-31"
  tags:
    - "compute"
    - "ci"
    - "pin"
    - "receipt-gate"
    - "friction"
    - "OMN-20134"
  related_tickets:
    - "OMN-20134"
