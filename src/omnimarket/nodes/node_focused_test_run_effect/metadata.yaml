name: node_focused_test_run_effect
version: "0.1.0"
description: "Effect: runs one focused pytest node id at one commit, with an uncommitted overlay, in a new throwaway container with no network on the lab docker host this node runs on, and returns the focused-run receipt. Reached over its own bus command topic by the delegated test loop; hosted by a process on the lab host, never by a shared runtime."
pack: pipeline
node_role: effect
display_name: "Focused Test Run Effect (lab host)"
omnibase_core_compat: ">=0.39.0,<1.0.0"
entry_points:
  onex.nodes:
    node_focused_test_run_effect: "omnimarket.nodes.node_focused_test_run_effect"
capabilities:
  standalone: false
  full_runtime: false
  requires_network: true
  requires_repo: true
  requires_secrets: false
  requires_docker: true
  side_effect_class: write
dependencies: []
authors: ["OmniNode Platform Team"]
license: "MIT"
tags: ["effect", "focused-test-run", "delegated-test-loop"]
