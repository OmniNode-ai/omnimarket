name: node_orchestrator_promise_classify_compute
node_type: COMPUTE_GENERIC
runtime_profiles: [main]
contract_version: {major: 0, minor: 1, patch: 0}
node_version: 0.1.0
lifecycle: experimental
description: Classify every orchestrator reply sentence, retaining uncertain promises for review.
input_model:
  name: ModelPromiseClassifyRequest
  module: omnimarket.models.model_orchestrator_promise
output_model:
  name: ModelPromiseClassification
  module: omnimarket.models.model_orchestrator_promise
handler:
  module: omnimarket.nodes.node_orchestrator_promise_classify_compute.handlers.handler_promise_classify
  class: HandlerPromiseClassify
  input_model: omnimarket.models.model_orchestrator_promise.ModelPromiseClassifyRequest
  output_model: omnimarket.models.model_orchestrator_promise.ModelPromiseClassification
handler_routing:
  routing_strategy: operation_match
  default_handler: omnimarket.nodes.node_orchestrator_promise_classify_compute.handlers.handler_promise_classify:HandlerPromiseClassify
  handlers:
    - operation: classify_promise
      topic: onex.cmd.omnimarket.orchestrator-promise-classify-requested.v1
      handler:
        name: HandlerPromiseClassify
        module: omnimarket.nodes.node_orchestrator_promise_classify_compute.handlers.handler_promise_classify
    - operation: measure_promise_bar
      topic: onex.cmd.omnimarket.orchestrator-promise-bar-requested.v1
      handler:
        name: HandlerPromiseBar
        module: omnimarket.nodes.node_orchestrator_promise_classify_compute.handlers.handler_promise_bar
    - operation: render_promises
      topic: onex.cmd.omnimarket.orchestrator-promise-render-requested.v1
      handler:
        name: HandlerPromiseRender
        module: omnimarket.nodes.node_orchestrator_promise_classify_compute.handlers.handler_promise_render
entrypoint:
  name: NodeOrchestratorPromiseClassifyCompute
  module: omnimarket.nodes.node_orchestrator_promise_classify_compute.node
terminal_event: onex.evt.omnimarket.orchestrator-promise-classify-completed.v1
runtime_dispatch:
  command_topic: onex.cmd.omnimarket.orchestrator-promise-classify-requested.v1
  terminal_events:
    success: onex.evt.omnimarket.orchestrator-promise-classify-completed.v1
    failure: onex.evt.omnimarket.orchestrator-promise-classify-failed.v1
event_bus:
  subscribe_topics: [onex.cmd.omnimarket.orchestrator-promise-classify-requested.v1, onex.cmd.omnimarket.orchestrator-promise-bar-requested.v1, onex.cmd.omnimarket.orchestrator-promise-render-requested.v1]
  publish_topics: [onex.evt.omnimarket.orchestrator-promise-classify-completed.v1, onex.evt.omnimarket.orchestrator-promise-classify-failed.v1]
descriptor:
  node_archetype: compute
  purity: pure
  idempotent: true
  timeout_ms: 5000
config:
  mode: shadow
  orchestrator_lane_pattern: '^orchestrator(?:-|$)'
  default_owner: orchestrator
  session_lanes: {}
  sentence_pattern: '(?:[^.!?\n]|\.(?=\d))+(?:[.!?]+|$)'
  commitment_separator_pattern: '(?:[,;]\s*|\s+and\s+)(?=(?:I|we)(?:\s+(?:will|shall)|[''’]ll)\b)'
  promise_patterns:
    - "^\\s*(?:[-*]\\s*|\\d+[.)]\\s*)?(?:I|we)\\s+(?:will\\b|shall\\b|am going to\\b|are going to\\b|promise to\\b|commit to\\b)"
    - "^\\s*(?:[-*]\\s*|\\d+[.)]\\s*)?(?:I|we)['’]ll\\b"
    - "^\\s*(?:[-*]\\s*)?(?:I'll|I’ll|I will|we'll|we’ll|we will)\\s+not\\b"
  uncertain_patterns:
    - "^\\s*(?:[-*]\\s*)?(?:I|we)\\s+(?:plan to|intend to|can try to|will try to|might|may|should be able to|can)\\b"
    - "^\\s*(?:if|once|after)\\b.+\\b(?:I|we)(?:\\s+will|['’]ll)\\b"
  machine_prefixes: ['<tool', '<bash-', '<local-command-', '<command-', '<system-reminder', '<task-notification', '<scheduled-task', '[workflow harness', 'this session is being continued from a previous conversation', 'tick:', 'tick ', 'tool echo:', 'tool output:']
  machine_patterns:
    - '^\s*\d{4}-\d{2}-\d{2}T\S+\s+\|\s+(?:STATUS|MSG|TERMINAL|CLAIM)\s+\|'
    - '^\s*\{\s*"(?:tool|tool_name|tick|event_type)"\s*:'
  heuristic_confidence: 0.9
  uncertain_confidence: 0.4
  confidence_floor: 0.8
  minimum_replies: 60
  # No measured decision-1 values were supplied with this package. Missing bars refuse activation.
  minimum_precision: null
  minimum_recall: null
  interval_confidence: 0.95
  bar_statistic: lower_bound
  classifier_revision: promise-wording-v1
  id_chars: 20
  subject_terms: 5
  row_lane: operator-capture
  row_actor: script:orchestrator-promise-capture
  disposition_kind: disposition
  chat_item: chat
dod_evidence:
  PYTEST:
    command: uv run pytest tests/unit/nodes/node_orchestrator_promise_classify_compute/test_promise_classify.py -q
    pass_criteria: every focused promise regression passes
