name: node_context_install_confirm_trigger_effect
version: "1.0.0"
contract_name: node_context_install_confirm_trigger_effect
node_name: node_context_install_confirm_trigger_effect
contract_version: {major: 1, minor: 0, patch: 0}
node_version: {major: 1, minor: 0, patch: 0}
node_type: effect
description: >
  Triggered by the session-content projection's applied event. Reads the event's
  session captured compact content and published activations through
  ProtocolSessionCompactSource, builds the request with
  HandlerContextInstallConfirmRequest and derives the confirmation with
  HandlerContextInstallConfirm. Only request_ready carries a confirmation, published on
  the completed topic the receipts projection folds; not_applied (rows_upserted of zero),
  session_unresolved, no_compact_records and all_packages_unreadable publish nothing.
  The reader is an optional injected dependency (OMN-22478): the runtime has no
  implementation of ProtocolSessionCompactSource until the compaction line builds one
  (OMN-21115 under OMN-21090), and with none every applied event is answered by one
  InstallConfirmSkipped event on the skipped topic, never an exception. Topics come
  from this contract.
input_model:
  name: ModelSessionContentAppliedEvent
  module: omnimarket.models.context_install_confirm_trigger
output_model:
  name: ModelInstallConfirmTriggerResult
  module: omnimarket.models.context_install_confirm_trigger
handler:
  module: omnimarket.nodes.node_context_install_confirm_trigger_effect.handlers.handler_context_install_confirm_trigger
  class: HandlerContextInstallConfirmTrigger
  input_model: omnimarket.models.context_install_confirm_trigger.ModelSessionContentAppliedEvent
handler_routing:
  routing_strategy: payload_type_match
  handlers:
    - handler:
        name: HandlerContextInstallConfirmTrigger
        module: omnimarket.nodes.node_context_install_confirm_trigger_effect.handlers.handler_context_install_confirm_trigger
      event_model:
        name: ModelSessionContentAppliedEvent
        module: omnimarket.models.context_install_confirm_trigger
descriptor:
  node_archetype: effect
  purity: impure
  idempotent: true
  timeout_ms: 1000
  runtime_profiles: [main]
event_bus:
  subscribe_topics:
    - onex.evt.omnimarket.projection-session-content-applied.v1
  publish_topics:
    - onex.evt.omnimarket.context-install-confirm-completed.v1
    - onex.evt.omnimarket.context-install-confirm-skipped.v1
published_events:
  - event_type: InstallConfirmSkipped
    topic: onex.evt.omnimarket.context-install-confirm-skipped.v1
    description: An applied session-content event was not turned into a confirmation, with the typed reason (reader_not_wired while the compaction source is not built).
dependencies:
  - name: reader
    dependency_type: protocol
    description: "ProtocolSessionCompactSource (omnimarket.protocols.protocol_session_compact_source): the session's captured compact content and published activations. Supplied by the runtime when an implementation exists; the compaction line (OMN-21115) builds it."
    required: false
runtime_dispatch:
  command_topic: onex.evt.omnimarket.projection-session-content-applied.v1
  terminal_events:
    success: onex.evt.omnimarket.context-install-confirm-completed.v1
terminal_event: onex.evt.omnimarket.context-install-confirm-completed.v1
metadata:
  author: OmniNode Team
  license: MIT
  ticket: OMN-21115
  maturity: alpha
  tags: [context-compaction, install-confirm]
