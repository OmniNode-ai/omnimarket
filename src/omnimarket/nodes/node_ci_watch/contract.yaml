---
name: ci_watch
contract_version: {major: 1, minor: 0, patch: 0}
node_type: compute
node_version: {major: 1, minor: 0, patch: 0}

description: >
  CI watch WorkflowPackage. Polls GitHub Actions for a PR's CI status,
  classifies the terminal state (passed, failed, fixed, unfixable), and
  emits a completion event with failure details. When auto_fix=true,
  dispatches a fixer worker on failures and re-polls after each cycle up
  to max_fix_cycles times.

handler:
  module: omnimarket.nodes.node_ci_watch.handlers.handler_ci_watch
  class: HandlerCiWatch
  input_model: omnimarket.nodes.node_ci_watch.handlers.handler_ci_watch.ModelCiWatchCommand

handler_routing:
  routing_strategy: operation_match
  handlers:
    - operation: ci_watch
      handler:
        name: HandlerCiWatch
        module: omnimarket.nodes.node_ci_watch.handlers.handler_ci_watch

descriptor:
  node_archetype: compute
  purity: pure
  idempotent: true
  timeout_ms: 3600000

inputs:
  pr_number:
    type: int
    description: "GitHub PR number to watch"
    required: true
  repo:
    type: str
    description: "GitHub repo slug (org/repo)"
    required: true
  correlation_id:
    type: uuid
    description: "Unique run ID"
    required: true
  timeout_minutes:
    type: int
    description: "Max minutes to wait for CI (default 60)"
    required: false
    default: 60
  auto_fix:
    type: bool
    description: "When true, dispatch a fixer worker on failures and re-poll"
    required: false
    default: false
  max_fix_cycles:
    type: int
    description: "Max auto-fix attempts before escalating (default 3)"
    required: false
    default: 3
  dry_run:
    type: bool
    description: "Run without side effects"
    required: false
    default: false
  auto_retrigger:
    type: bool
    description: >
      When true, detect a CI event-delivery gap (a required workflow that
      produced 0 runs on HEAD while the PR sits BLOCKED) and perform ONE safe
      empty-commit re-trigger to re-deliver the dropped workflow events
      (OMN-13416).
    required: false
    default: true
  max_retriggers:
    type: int
    description: "Max safe re-triggers per run before giving up (default 1)"
    required: false
    default: 1
  base_branch:
    type: str
    description: "Base branch whose required status checks define the gap set"
    required: false
    default: dev

outputs:
  terminal_status:
    type: str
    description: >
      passed | failed | timeout | error | fixed | unfixable | retriggered.
      `error` is emitted when the gh query itself fails (CLI error, transport
      failure, or unparseable output) — an UNKNOWN CI state that MUST NOT be
      coerced into `passed` (OMN-12428 fail-loud guarantee).
      `retriggered` is emitted when a CI event-delivery gap was detected and a
      safe empty-commit re-trigger was performed (OMN-13416).
  failed_checks:
    type: list
    description: "Names of failed CI checks"
  failure_summary:
    type: str
    description: "Condensed failure log excerpt"
  auto_fix_status:
    type: str
    description: "Human-readable auto-fix outcome summary"
  cycles:
    type: list
    description: "Per-cycle fix attempt records (cycle_number, checks before/after, dispatch status)"

terminal_event: onex.evt.omnimarket.ci-watch-completed.v1

event_bus:
  subscribe_topics:
    - onex.cmd.omnimarket.ci-watch-start.v1
  publish_topics:
    - onex.evt.omnimarket.ci-watch-completed.v1

metadata:
  transport_type: kafka
