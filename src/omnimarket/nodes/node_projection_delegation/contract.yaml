---
name: projection_delegation
contract_version: {major: 1, minor: 0, patch: 0}
node_type: reducer
node_version: {major: 1, minor: 0, patch: 0}
input_model: omnimarket.nodes.node_projection_delegation.handlers.handler_projection_delegation.ModelProjectionTaskDelegatedEvent
description: >
  Projects delegation terminal events into the delegation_events table.
  Dedup by correlation_id. Sources are the canonical delegation terminal pair
  (delegation-completed/failed.v1), shadow comparisons, node generation
  completions, and delegate-skill terminal events. (OMN-13629: the legacy compat
  task-delegated.v1 secondary path was dropped; the canonical terminal is
  converted internally.)

handler:
  module: omnimarket.nodes.node_projection_delegation.handlers.handler_projection_delegation
  class: HandlerProjectionDelegation

handler_routing:
  routing_strategy: operation_match
  handlers:
    - operation: delegation_projection_runner
      handler:
        name: DelegationProjectionRunner
        module: omnimarket.nodes.node_projection_delegation.handlers.handler_delegation
      handler_module: omnimarket.nodes.node_projection_delegation.handlers.handler_delegation
    - operation: projection_delegation
      handler:
        name: HandlerProjectionDelegation
        module: omnimarket.nodes.node_projection_delegation.handlers.handler_projection_delegation
      handler_module: omnimarket.nodes.node_projection_delegation.handlers.handler_projection_delegation
      event_model: omnimarket.nodes.node_projection_delegation.handlers.handler_projection_delegation.ModelProjectionTaskDelegatedEvent

terminal_event: onex.evt.omnimarket.projection-delegation-applied.v1

# Golden path: delegation chain (terminal event -> delegation_events table)
golden_path:
  - "Consume delegation terminal event from a contract-declared topic"
  - "Projection handler upserts row into delegation_events table"
  - "Dedup by correlation_id (UPSERT semantics)"
  - "Emit projection-applied event to onex.evt.omnimarket.projection-delegation-applied.v1"
  - "Verify row exists with correlation_id, task_type, delegated_to fields"
  - "Golden chain test: omnimarket/tests/test_golden_chain_projection_delegation.py"

db_io:
  db_tables:
    - name: delegation_events
      migration: "0020_delegation_context_pack_hash.sql"
      access: write
      database: omnidash_analytics
      role: events
    - name: delegation_shadow_comparisons
      migration: "0007_delegation_events.sql"
      access: write
      database: omnidash_analytics
      role: shadow_comparisons
    - name: generation_events
      migration: "0015_generation_corpus_acceptance.sql"
      access: write
      database: omnidash_analytics
      role: generation_events
    - name: delegation_judge_verdict_events
      migration: "0016_delegation_judge_verdict_events.sql"
      access: write
      database: omnidash_analytics
      role: judge_verdict_events
    # OMN-13235: per-tenant ceiling budget state (cap + consumption), event-sourced
    # from delegation source events for budgeted tiers.
    - name: delegation_budget_state
      migration: "0019_delegation_budget_state.sql"
      access: write
      database: omnidash_analytics
      role: budget_state

event_bus:
  subscribe_topics:
    # OMN-13629 (WS-F Phase 1): dropped the legacy compat
    # onex.evt.omniclaude.task-delegated.v1 secondary path. The orchestrator now
    # emits a SINGLE canonical terminal; the canonical
    # delegation-{completed,failed}.v1 pair below is converted internally via
    # _canonical_result_to_task_delegated_payload, so the legacy co-writer that
    # caused the OMN-13408/13475 divergence is gone.
    - onex.evt.omniclaude.delegation-shadow-comparison.v1
    - onex.evt.omnimarket.node-generation-completed.v1
    # OMN-13468: the failure terminal was absent, making failed runs invisible
    # at GET /projection/onex.evt.omnimarket.node-generation-failed.v1 (404
    # unknown_topic). Both terminals share the same payload shape and write to
    # the same generation_events table; only contract_passed differs in value.
    - onex.evt.omnimarket.node-generation-failed.v1
    - onex.evt.omnimarket.delegate-skill-completed.v1
    - onex.evt.omnimarket.delegate-skill-failed.v1
    - onex.evt.omnibase-infra.delegation-completed.v1
    - onex.evt.omnibase-infra.delegation-failed.v1
    - onex.evt.omnibase-infra.delegation-judge-verdict.v1
  publish_topics:
    - onex.evt.omnimarket.projection-delegation-applied.v1
    # Projection-API snapshot topics: this reducer materializes each exposure
    # into the projection table; the projection-API serves reads from those tables.
    # Declared here so the OMN-12777 topic gate can verify widget_topics have a producer.
    - onex.snapshot.projection.delegation.correlation-trace.v1  # onex-topic-allow: projection snapshot topic
    - onex.snapshot.projection.delegation.decisions.v1  # onex-topic-allow: projection snapshot topic
    - onex.snapshot.projection.delegation.summary.v1  # onex-topic-allow: projection snapshot topic
    - onex.snapshot.projection.delegation.quality-gate.v1  # onex-topic-allow: projection snapshot topic
    - onex.snapshot.projection.delegation.token-usage.v1  # onex-topic-allow: projection snapshot topic
    - onex.snapshot.projection.delegation.model-routing.v1  # onex-topic-allow: projection snapshot topic
    - onex.snapshot.projection.delegation.judge-verdicts.v1  # onex-topic-allow: projection snapshot topic
    - onex.snapshot.projection.delegation.budget-state.v1  # onex-topic-allow: projection snapshot topic
  # OMN-13548 (D-03): malformed inbound events (ValidationError / missing required
  # fields) are routed here as a DURABLE failure signal carrying the offending
  # envelope + correlation_id, instead of being logged + dropped silently.
  dlq_topics:
    - onex.dlq.omnimarket.projection-delegation-malformed.v1

externally_consumed_topics:
  # Projection snapshot topics are served through projection_api/dashboard reads
  # rather than consumed by another Kafka node.
  - onex.snapshot.projection.delegation.correlation-trace.v1  # onex-topic-allow: projection snapshot topic
  - onex.snapshot.projection.delegation.decisions.v1  # onex-topic-allow: projection snapshot topic
  - onex.snapshot.projection.delegation.summary.v1  # onex-topic-allow: projection snapshot topic
  - onex.snapshot.projection.delegation.quality-gate.v1  # onex-topic-allow: projection snapshot topic
  - onex.snapshot.projection.delegation.token-usage.v1  # onex-topic-allow: projection snapshot topic
  - onex.snapshot.projection.delegation.model-routing.v1  # onex-topic-allow: projection snapshot topic
  - onex.snapshot.projection.delegation.judge-verdicts.v1  # onex-topic-allow: projection snapshot topic
  - onex.snapshot.projection.delegation.budget-state.v1  # onex-topic-allow: projection snapshot topic

projection_api:
  expose: true
  exposures:
    - topic: delegation
      table: delegation_events
      schema: public
      columns:
        - id
        - correlation_id
        - session_id
        - task_type
        - delegated_to
        - model_name
        - quality_gate_passed
        - quality_gate_detail
        - latency_ms
        - delegation_latency_ms
        - tokens_input
        - tokens_output
        - context_pack_hash
        - tokens_to_compliance
        - compliance_attempts
        - required_bar
        - actual_score
        - escalation_count
        - authority_source
        - score_source
        - request_override_applied
        - override_within_bounds
        - cost_usd
        - cost_savings_usd
        - pricing_manifest_version
        - timestamp
        - created_at
      order_by: created_at DESC
      freshness_column: created_at
      limit: 500
    - topic: onex.evt.omnimarket.projection-delegation-events.v1
      table: delegation_events
      schema: public
      columns:
        - correlation_id
        - timestamp
        - task_type
        - delegated_to
        - model_name
        - quality_gate_passed
        - cost_usd
        - cost_savings_usd
        - delegation_latency_ms
        - tokens_input
        - tokens_output
        - context_pack_hash
        - tokens_to_compliance
        - compliance_attempts
        - required_bar
        - actual_score
        - escalation_count
        - authority_source
        - pricing_manifest_version
      order_by: timestamp DESC
      freshness_column: timestamp
      limit: 100
    - topic: onex.snapshot.projection.delegation.decisions.v1 # onex-topic-allow: projection snapshot topics use onex.snapshot.* prefix by convention
      table: delegation_events
      schema: public
      columns:
        - id
        - correlation_id
        - session_id
        - task_type
        - delegated_to
        - model_name
        - quality_gate_passed
        - quality_gate_detail
        - latency_ms
        - tokens_input
        - tokens_output
        - context_pack_hash
        - tokens_to_compliance
        - required_bar
        - actual_score
        - escalation_count
        - authority_source
        - score_source
        # OMN-13649: the authoritative routing/cost tier (local | cheap_cloud |
        # cheap_frontier | claude) + its typed cost regime. Carried from the
        # delegation terminal, persisted on the row, exposed here so the dashboard
        # Tier Distribution reads tier from the projection (deletes modelTier.ts).
        - cost_tier_name
        - cost_tier_type
        - created_at
      order_by: created_at DESC
      freshness_column: created_at
      limit: 500
    # OMN-12748: per-correlation detail surface. Read by the dashboard via
    # /projection/<topic>?correlation_id=<id> to render the actual delegated
    # work — prompt_text + response_text — for a selected run. Dedicated detail
    # topic so the high-frequency decisions.v1 list poll stays lean.
    - topic: onex.snapshot.projection.delegation.correlation-trace.v1 # onex-topic-allow: projection snapshot topics use onex.snapshot.* prefix by convention
      table: delegation_events
      schema: public
      columns:
        - id
        - correlation_id
        - session_id
        - task_type
        - delegated_to
        - delegated_by
        - model_name
        - quality_gate_passed
        - quality_gate_detail
        - quality_gates_checked
        - quality_gates_failed
        - latency_ms
        - delegation_latency_ms
        - tokens_input
        - tokens_output
        - context_pack_hash
        - tokens_to_compliance
        - compliance_attempts
        - required_bar
        - actual_score
        - escalation_count
        - authority_source
        - score_source
        - request_override_applied
        - override_within_bounds
        - cost_usd
        - cost_savings_usd
        # OMN-13649: authoritative serving tier + typed cost regime on the
        # per-correlation detail surface.
        - cost_tier_name
        - cost_tier_type
        - pricing_manifest_version
        - prompt_text
        - response_text
        - timestamp
        - created_at
      order_by: created_at ASC
      freshness_column: created_at
      limit: 100
    - topic: onex.snapshot.projection.delegation.summary.v1 # onex-topic-allow: projection snapshot topics use onex.snapshot.* prefix by convention
      table: projection_delegation_summary
      schema: public
      columns:
        - '"totalDelegations"'
        - '"qualityGatePassRate"'
        - '"qualityGatePassed"'
        - '"qualityGateTotal"'
        - '"totalSavingsUsd"'
        - '"avgLatencyMs"'
        - '"latestEventAt"'
        - total_events
        - quality_passed_count
        - quality_failed_count
        - avg_latency_ms
        - latest_event_at
        - '"byTaskType"'
        - '"byModel"'
        - latest_projection_updated_at
      json_columns:
        - byTaskType
        - byModel
      freshness_column: latest_projection_updated_at
      limit: 1
    - topic: onex.snapshot.projection.delegation.model-routing.v1 # onex-topic-allow: projection snapshot topics use onex.snapshot.* prefix by convention
      table: projection_delegation_model_routing
      schema: public
      columns:
        - total_delegations
        - rows
        - by_model
        - decision_traces
        - captured_at
        - provisioned
        - latest_projection_updated_at
        # OMN-13662: tier distribution with explicit not_tier_routed
        # classification. Maps empty cost_tier_name (delegate-skill terminals)
        # to 'not_tier_routed', excludes those rows from the tier-% denominator
        # (tier_routed_total), and surfaces total_tasks + not_tier_routed_count
        # so the dashboard reads the classification instead of re-deriving it.
        - by_tier
      json_columns:
        - rows
        - by_model
        - decision_traces
        - by_tier
      freshness_column: latest_projection_updated_at
      limit: 1
    - topic: onex.snapshot.projection.delegation.quality-gate.v1 # onex-topic-allow: projection snapshot topics use onex.snapshot.* prefix by convention
      table: projection_delegation_quality_gate
      schema: public
      columns:
        - overall_pass_rate
        - total_passed
        - total_failed
        - total_checks
        - escalation_count
        - escalation_rate
        - avg_actual_score
        - avg_required_bar
        - by_check_type
        - failure_categories
        - avg_tokens_to_compliance
        - median_tokens_to_compliance
        - avg_compliance_attempts
        - tokens_to_compliance_by_model
        - captured_at
        - provisioned
        - latest_projection_updated_at
      json_columns:
        - by_check_type
        - failure_categories
        - tokens_to_compliance_by_model
      freshness_column: latest_projection_updated_at
      limit: 1
    - topic: onex.snapshot.projection.delegation.judge-verdicts.v1 # onex-topic-allow: projection snapshot topics use onex.snapshot.* prefix by convention
      table: delegation_judge_verdict_events
      schema: public
      columns:
        - id
        - event_hash
        - correlation_id
        - task_type
        - score_source
        - judge_model
        - judge_model_version
        - judge_provider
        - rubric_id
        - rubric_hash
        - prompt_hash
        - input_hash
        - temperature
        - judge_node_version
        - reasoning_hash
        - verdict
        - actual_score
        - failure_kind
        - failure_message
        - created_at
      order_by: created_at DESC
      freshness_column: created_at
      limit: 500
    - topic: onex.snapshot.projection.delegation.token-usage.v1 # onex-topic-allow: projection snapshot topics use onex.snapshot.* prefix by convention
      table: projection_delegation_token_usage
      schema: public
      columns:
        - total_prompt_tokens
        - total_completion_tokens
        - total_tokens
        - total_estimated_cost_usd
        - provenance_summary
        - by_model
        - captured_at
        - provisioned
        - latest_projection_updated_at
      json_columns:
        - provenance_summary
        - by_model
      freshness_column: latest_projection_updated_at
      limit: 1
    # OMN-12780 (Wave 1C): expose the full generated output via projection-API.
    # Projection-API is the ONLY valid read path — no raw DB reads, no express reader.
    # contract_yaml + handler_source are the full generated artifacts, never truncated.
    # SHA256 verification: encode(sha256(contract_yaml::bytea), 'hex') at query time.
    - topic: onex.evt.omnimarket.node-generation-completed.v1
      table: generation_events
      schema: public
      columns:
        - id
        - correlation_id
        - task_description
        - provider
        - model_id
        - endpoint_class
        - attempt_count
        - total_latency_e2e_ms
        - contract_passed
        # OMN-13166: behavioral verdict, surfaced separately from contract_passed
        # so the dashboard can show a shape-valid-but-behaviorally-wrong
        # generation (the gate-zero false-green) as NOT a task-behavior pass.
        - semantic_checked
        - semantic_passed
        # OMN-13289 (G0) / OMN-13350: validator-acceptance (corpus) verdict,
        # surfaced so the dashboard can show a shape-valid validator that does NOT
        # actually enforce its rule (corpus_checked=true, corpus_passed=false).
        - corpus_checked
        - corpus_passed
        - corpus_errors
        - cost_inference_usd
        - contract_yaml
        - handler_source
        # OMN-12775 (close-the-loop A3): proof fields populated by the write path.
        # The canonical projection API returns these so the dashboard renders the
        # real evidence (SHA256 digests of the full payload, the routing decision,
        # and the owning projection node) instead of NULLs.
        - output_payload_sha256
        - contract_sha256
        - handler_sha256
        - routing_source
        - resolved_endpoint
        - projection_owner
        - timestamp
        - created_at
      order_by: created_at DESC
      freshness_column: created_at
      limit: 500
    # OMN-13468: expose the failure terminal via the projection-API so failed runs
    # are observable at GET /projection/onex.evt.omnimarket.node-generation-failed.v1.
    # Same table + columns as the completed exposure — contract_passed will be False
    # for every row returned here. Rows are written by the same
    # _project_generation_completed handler that processes the completed terminal.
    - topic: onex.evt.omnimarket.node-generation-failed.v1
      table: generation_events
      schema: public
      columns:
        - id
        - correlation_id
        - task_description
        - provider
        - model_id
        - endpoint_class
        - attempt_count
        - total_latency_e2e_ms
        - contract_passed
        - semantic_checked
        - semantic_passed
        - corpus_checked
        - corpus_passed
        - corpus_errors
        - cost_inference_usd
        - contract_yaml
        - handler_source
        - output_payload_sha256
        - contract_sha256
        - handler_sha256
        - routing_source
        - resolved_endpoint
        - projection_owner
        - timestamp
        - created_at
      order_by: created_at DESC
      freshness_column: created_at
      limit: 500
    # OMN-13235: per-tenant ceiling budget-state surface — cap, period
    # consumption, and remaining headroom for budgeted ceiling tiers. Readable so
    # the dashboard / API can show how much of a tenant's monthly ceiling budget
    # is consumed and confirm consumption rising after a ceiling escalation probe.
    - topic: onex.snapshot.projection.delegation.budget-state.v1 # onex-topic-allow: projection snapshot topics use onex.snapshot.* prefix by convention
      table: delegation_budget_state
      schema: public
      columns:
        - id
        - tenant_id
        - cost_tier_name
        - budget_period
        - monthly_cap_usd
        - consumed_usd
        - overage_usd
        - headroom_remaining_usd
        - delegation_count
        - first_event_at
        - last_event_at
        - created_at
        - updated_at
      order_by: updated_at DESC
      freshness_column: updated_at
      limit: 500

metadata:
  transport_type: kafka
  demo_path: true  # OMN-12777: demo-path topic coherence gate scope marker
  # Projection-API exposure topics declared here so the topic gate can verify
  # each widget topic has a producing node. These snapshot topics are written
  # by this reducer's projection_api exposures.
  widget_topics:
    - onex.snapshot.projection.delegation.correlation-trace.v1  # onex-topic-allow: projection snapshot topic
    - onex.snapshot.projection.delegation.decisions.v1  # onex-topic-allow: projection snapshot topic
    - onex.snapshot.projection.delegation.summary.v1  # onex-topic-allow: projection snapshot topic
    - onex.snapshot.projection.delegation.quality-gate.v1  # onex-topic-allow: projection snapshot topic
    - onex.snapshot.projection.delegation.token-usage.v1  # onex-topic-allow: projection snapshot topic
    - onex.snapshot.projection.delegation.model-routing.v1  # onex-topic-allow: projection snapshot topic
    - onex.snapshot.projection.delegation.judge-verdicts.v1  # onex-topic-allow: projection snapshot topic
    - onex.snapshot.projection.delegation.budget-state.v1  # onex-topic-allow: projection snapshot topic
