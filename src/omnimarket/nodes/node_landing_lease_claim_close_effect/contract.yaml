name: node_landing_lease_claim_close_effect
lifecycle: experimental
node_type: EFFECT_GENERIC
runtime_profiles: []
contract_version:
  major: 1
  minor: 0
  patch: 0
node_version: 1.0.0
description: Close open controller lease claims through the supplied writer after
  release predates the ledger read. Skip live leases, releases in the current tick,
  recent unstamped leases, and recorded successful closes. Bound writes by the request
  limit, record attempts in each lease directory, and retry refused appends.
input_model:
  name: ModelLeaseClaimCloseRequest
  module: omnimarket.nodes.node_landing_lease_claim_close_effect.models.model_landing_lease_claim_close
output_model:
  name: ModelLeaseClaimCloseResult
  module: omnimarket.nodes.node_landing_lease_claim_close_effect.models.model_landing_lease_claim_close
handler:
  module: omnimarket.nodes.node_landing_lease_claim_close_effect.handlers.handler_landing_lease_claim_close
  class: HandlerLandingLeaseClaimClose
  input_model: omnimarket.nodes.node_landing_lease_claim_close_effect.models.model_landing_lease_claim_close.ModelLeaseClaimCloseRequest
  output_model: omnimarket.nodes.node_landing_lease_claim_close_effect.models.model_landing_lease_claim_close.ModelLeaseClaimCloseResult
handler_routing:
  routing_strategy: operation_match
  default_handler: omnimarket.nodes.node_landing_lease_claim_close_effect.handlers.handler_landing_lease_claim_close:HandlerLandingLeaseClaimClose
  handlers:
  - operation: close
    handler:
      name: HandlerLandingLeaseClaimClose
      module: omnimarket.nodes.node_landing_lease_claim_close_effect.handlers.handler_landing_lease_claim_close
event_bus:
  subscribe_topics: []
  publish_topics: []
runtime_dispatch:
  external_trigger: Direct Python invocation by the landing controller.
descriptor:
  node_archetype: effect
  purity: effectful
  runtime_profiles: []
  idempotent: true
  timeout_ms: 30000
metadata:
  transport_type: local
  created: '2026-10-24'
  tags:
  - effect
  - landing-lease-claim-close
  related_tickets:
  - OMN-21373
