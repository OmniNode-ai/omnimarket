# ONEX Node Contract - Local Secret Store Effect (OMN-19985)
#
# CLI-run effect, like node_dev_seed_effect: no subscription and no onex.nodes
# entry point, invoked by the `onex secret set` / `onex secret delete` shim.
# `experimental` is the drift gate's marker for an intentionally unregistered
# node; the topic graph sees it as an externally triggered ingress root.
name: local_secret_store_effect
lifecycle: experimental
contract_version: {major: 1, minor: 0, patch: 0}
node_type: effect
node_version: {major: 1, minor: 0, patch: 0}

description: >
  Local secret store EFFECT. Stores or deletes a secret in the local credential
  store, as `onex secret` always has. For a provider key it also registers the
  key under a freshly minted route ref (the credential generation id) and
  returns credential-registered with the key's fingerprint prefix
  (sha256(value)[:8]) and set time, and credential-revoked for a route ref it
  replaces or deletes. The local runtime folds those events into
  tenant_inference_credentials. No event, result or refusal carries the value.

output_model: omnimarket.nodes.node_local_secret_store_effect.models.model_local_secret_result.ModelLocalSecretResult

handler:
  module: omnimarket.nodes.node_local_secret_store_effect.handlers.handler_local_secret_store
  class: HandlerLocalSecretStore
  input_model: omnimarket.nodes.node_local_secret_store_effect.models.model_local_secret_request.ModelLocalSecretRequest

handler_routing:
  default_handler: omnimarket.nodes.node_local_secret_store_effect.handlers.handler_local_secret_store:HandlerLocalSecretStore

descriptor:
  node_archetype: effect
  purity: impure
  idempotent: false  # every set mints a new route ref
  timeout_ms: 10000
  runtime_profiles:
    - effects

# The node publishes nothing: it RETURNS the credential-registered /
# credential-revoked events in its result, and the `onex secret` shim folds them
# in-process into the local store (mode 1 has no broker). Declaring the topics
# here would claim a publish the node never makes.
event_bus:
  subscribe_topics: []
  publish_topics: []

metadata:
  transport_type: kafka
