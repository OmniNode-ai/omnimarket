  name: ModelLaneCensusAliasParityRequest
  module: omnimarket.nodes.node_lane_census_alias_parity_compute.models
output_model:
  name: ModelLaneCensusAliasParityResult
  module: omnimarket.nodes.node_lane_census_alias_parity_compute.models
handler:
  module: omnimarket.nodes.node_lane_census_alias_parity_compute.handler
  class: HandlerLaneCensusAliasParity
  input_model: omnimarket.nodes.node_lane_census_alias_parity_compute.models.ModelLaneCensusAliasParityRequest
  output_model: omnimarket.nodes.node_lane_census_alias_parity_compute.models.ModelLaneCensusAliasParityResult
entrypoint:
  name: NodeLaneCensusAliasParityCompute
  module: omnimarket.nodes.node_lane_census_alias_parity_compute.node
handler_routing:
  routing_strategy: operation_match
  default_handler: omnimarket.nodes.node_lane_census_alias_parity_compute.handler:HandlerLaneCensusAliasParity
  handlers:
    - operation: check_alias_parity
      topic: onex.cmd.omnimarket.lane-census-alias-parity-requested.v1
