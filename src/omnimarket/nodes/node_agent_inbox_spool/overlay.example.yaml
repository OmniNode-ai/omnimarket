# Copy to <root>/agent_inbox_spool/overlay.yaml and set ONEX_SKILL_OVERLAY_ROOTS
# to that root. All values here are synthetic; supply your deployment's facts.
# Exactly one group per host: {consumer_group_prefix}-{host}.
consumer_group_prefix: example-agent-inbox
# One sub-directory per lane is created beneath this directory.
spool_root: /var/lib/example/agent-inbox
read_window_seconds: 30
# The caller uses this lane when constructing the injected bus.
bus_lane: example
