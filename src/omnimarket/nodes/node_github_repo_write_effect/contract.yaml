---
# SPDX-FileCopyrightText: 2026 OmniNode.ai Inc.
# SPDX-License-Identifier: MIT
# ONEX Node Contract - GitHub repo write effect (OMN-20912, slice 1 of OMN-20768)
#
# The PR authoring writes lanes ran with gh: pr_create, pr_edit, pr_ready,
# pr_close, pr_comment, pr_thread_reply and workflow_dispatch. A separate node from
# node_github_repo_gateway_effect because that node declares itself read-only
# (metadata side_effect_class read_only, descriptor idempotent true); a write
# needs a mode, a quota floor and guards a read never does.
name: node_github_repo_write_effect
contract_version: {major: 1, minor: 5, patch: 0}
node_type: EFFECT_GENERIC
node_version: {major: 1, minor: 4, patch: 0}

description: >
  EFFECT: the PR authoring writes a lane makes. One ModelRepoWriteRequest on
  onex.cmd.omnimarket.github-repo-write-requested.v1 is answered by one
  ModelRepoWriteCompleted on onex.evt.omnimarket.github-repo-write-completed.v1
  or one ModelRepoWriteFailed on onex.evt.omnimarket.github-repo-write-failed.v1.
  Every call goes through the shared landing transport; no gh subprocess. The
  mode comes from write_config per repository, then per owner (dry_run plans
  the calls and sends nothing). The quota floor is the landing effect's rule,
  read from the x-ratelimit-* response headers. pr_edit, pr_ready and pr_close
  refuse a moved head (head_moved) before any mutation; pr_create and workflow_dispatch check
  the branch tip when given an expected head. A retried command with the same
  idempotency key writes nothing twice. pr_close is refused (claim_not_held)
  unless the requesting lane and run hold a live claim on the PR. The claim is
  read from node_pr_claim_registry_effect's registry when this runtime keeps
  one; a live claim there held by another lane or run refuses the close. With
  none there, the claim the caller took (lane, run, action, taken-at,
  heartbeat) and carried on the command is checked against the request and the
  registry's liveness rule. A close with neither is refused.
  Before creating an M4 pull request, the cited ticket contracts are read at
  the branch head and checked through node_dod_verify's static prerequisites.
  Missing or invalid evidence is refused with contract_required, naming the
  contract file. A moved head during preflight is refused with head_moved.
  check_run_create posts a check name, immutable head_sha, status, optional
  conclusion and typed output (title and summary) through the same transport.
  completed requires conclusion; queued and in_progress omit it. Its replay
  record is in-process only, so a retry after restart can create another run.
  pr_thread_reply posts one reply on the review-comment thread that
  thread_comment_id starts, under the node's own write identity. It checks the
  PR's head when given an expected one, and a review comment carrying the
  idempotency key returns the first reply replayed. A thread that is not on
  that pull request is refused not_found; GitHub refuses a reply to a reply
  with github_refused.
  A command carrying lease {kind, resource, fence, expires_at} is refused before
  any GitHub call unless the runtime's fence port answers ok: lease_fence_stale
  for a newer grant, lease_expired for no live grant or a lease expiring inside
  descriptor.timeout_ms, lease_unreadable when the port answers unknown, fails
  or is not wired.

input_model:
  name: ModelRepoWriteRequest
  module: omnimarket.nodes.node_github_repo_write_effect.models.model_repo_write_io

output_model:
  name: ModelRepoWriteCompleted
  module: omnimarket.nodes.node_github_repo_write_effect.models.model_repo_write_io

# The operation table slice 2 (`onex scm`) and slice 3 (the gh shim coverage
# table) read. Names are stable and match the gh verb each one replaces.
operations:
  - name: pr_create
    description: "Request ModelRepoWriteRequest, result ModelRepoWriteCompleted or ModelRepoWriteFailed; replaces gh pr create. POST /repos/{o}/{r}/pulls; an open PR for the head is returned replayed instead."
    transport: rest
  - name: pr_edit
    description: "Request ModelRepoWriteRequest, result ModelRepoWriteCompleted or ModelRepoWriteFailed; replaces gh pr edit. GET the PR (expected head), PATCH title/body/base, GraphQL convertPullRequestToDraft or markPullRequestReadyForReview for draft."
    transport: rest
  - name: pr_ready
    description: "Request ModelRepoWriteRequest, result ModelRepoWriteCompleted or ModelRepoWriteFailed; replaces gh pr ready. GET the PR (expected head), GraphQL markPullRequestReadyForReview."
    transport: graphql
  - name: pr_close
    description: "Request ModelRepoWriteRequest, result ModelRepoWriteCompleted or ModelRepoWriteFailed; replaces gh pr close. Claim check: the runtime's claim registry, else the claim carried on the command; GET the PR (expected head), PATCH state=closed."
    transport: rest
  - name: pr_comment
    description: "Request ModelRepoWriteRequest, result ModelRepoWriteCompleted or ModelRepoWriteFailed; replaces gh pr comment. Scan comments for the idempotency marker, POST /repos/{o}/{r}/issues/{n}/comments."
    transport: rest
  - name: pr_thread_reply
    description: "Request ModelRepoWriteRequest with pr_number, thread_comment_id and body, result ModelRepoWriteCompleted (comment_id, html_url) or ModelRepoWriteFailed; replaces gh api --method POST /repos/{o}/{r}/pulls/{n}/comments/{id}/replies. Scan the PR's review comments for the idempotency marker, POST the reply."
    transport: rest
  - name: workflow_dispatch
    description: "Request ModelRepoWriteRequest, result ModelRepoWriteCompleted or ModelRepoWriteFailed; replaces gh workflow run. POST /repos/{o}/{r}/actions/workflows/{w}/dispatches."
    transport: rest
  - name: check_run_create
    description: "Request ModelRepoWriteRequest with name, head_sha, status (queued, in_progress, completed), optional conclusion and output (title, summary); replaces gh api --method POST /repos/{o}/{r}/check-runs. Result ModelRepoWriteCompleted with check_run_id, html_url and head_sha or ModelRepoWriteFailed. POST /repos/{o}/{r}/check-runs via the existing GitHub transport and auth. Requires checks write permission; replay protection is in-process only."
    transport: rest

modes:
  - dry_run
  - enforce

# Default dry_run. enforce is declared for the OmniNode-ai owner, the
# registry repositories lanes open pull requests in, so `onex scm` writes in
# each of them; a repository of any other owner keeps dry_run and sends
# nothing. The expected-head, quota-floor and claim guards apply to every
# write in either mode. The landing orchestrator's per-repository github_mode
# (OMN-20866) is the precedent: a repository row wins over its owner's row, so
# one repository is pinned to dry_run by adding `OmniNode-ai/<repo>: dry_run`
# under github_mode_by_repository. A request may still force dry_run; it can
# never force enforce. Widening the owner table is a contract change.
write_config:
  github_mode: dry_run
  github_mode_by_owner:
    OmniNode-ai: enforce
  github_mode_by_repository: {}

quota_floor:
  # The landing effect's rule (OMN-19826): quota is read only from response
  # headers, never the rate_limit endpoint; an undeclared resource is refused.
  source: response_headers
  min_remaining:
    core: 500
    graphql: 500

# Any runtime that loads this node may answer it (OMN-21423): every such
# runtime joins the one consumer group the runtime derives for the node, so
# stopping one leaves the others answering. The block names a mode, never a
# group; the group stays runtime-owned. Each runtime resolves credential_choice through the same secret store,
# regardless of its event-bus binding.
placement:
  mode: any

descriptor:
  node_archetype: effect
  purity: impure
  idempotent: false
  timeout_ms: 30000
  runtime_profiles:
    - effects

# Ordered choice: a resolved token wins; only an absent token selects the App.
# Resolution errors refuse rather than switching identities. GITHUB_TOKEN stays
# the required primary credential (OMN-21423); the App refs are optional, and the
# handler requires either the token or the App id and private key.
credential_choice:
  token_secret: GITHUB_TOKEN
  fallback_app:
    app_id_secret: ONEXBOT_OCC_APP_ID
    private_key_secret: ONEXBOT_OCC_PRIVATE_KEY
    installation_id_secret: ONEXBOT_OCC_INSTALLATION_ID

secrets:
  GITHUB_TOKEN:
    description: "Preferred GitHub token for API calls (REST + GraphQL)."
    required: true
  ONEXBOT_OCC_APP_ID:
    description: "Fallback writer GitHub App id, resolved only when GITHUB_TOKEN is absent."
    required: false
  ONEXBOT_OCC_PRIVATE_KEY:
    description: "Fallback writer App signing key; never logged."
    required: false
  ONEXBOT_OCC_INSTALLATION_ID:
    description: "Optional writer installation id; absent means discover the App installation on the request's owner."
    required: false

event_bus:
  version:
    major: 1
    minor: 0
    patch: 0
  subscribe_topics:
    - onex.cmd.omnimarket.github-repo-write-requested.v1
  publish_topics:
    - onex.evt.omnimarket.github-repo-write-completed.v1
    - onex.evt.omnimarket.github-repo-write-failed.v1

published_events:
  - event_type: "RepoWriteCompleted"
    topic: onex.evt.omnimarket.github-repo-write-completed.v1
    description: "The write ran (or, in dry_run, the requests it would send), with the quota reading from its response headers."
  - event_type: "RepoWriteFailed"
    topic: onex.evt.omnimarket.github-repo-write-failed.v1
    description: "The write was refused or failed, with a typed reason; no mutation was sent after a refusal."

handler_routing:
  routing_strategy: "payload_type_match"
  handlers:
    - operation: "github_repo.write"
      message_category: "command"
      handler:
        name: "HandlerGithubRepoWriteEffect"
        module: "omnimarket.nodes.node_github_repo_write_effect.handlers.handler_github_repo_write"
      event_model:
        name: "ModelRepoWriteRequest"
        module: "omnimarket.nodes.node_github_repo_write_effect.models.model_repo_write_io"
      topic: onex.cmd.omnimarket.github-repo-write-requested.v1
      description: "One PR authoring write from a lane (or the onex scm command); answered by one completed or failed event."

terminal_event: onex.evt.omnimarket.github-repo-write-completed.v1

runtime_dispatch:
  # The CLI/skill dispatcher (slice 2, onex scm) is this node's producer.
  command_topic: onex.cmd.omnimarket.github-repo-write-requested.v1
  # ModelRepoWriteFailed carries terminal_failure_cause, so the runtime's
  # failure-terminal guard (OMN-15468) publishes it on the failure topic.
  terminal_events:
    success: onex.evt.omnimarket.github-repo-write-completed.v1
    failure: onex.evt.omnimarket.github-repo-write-failed.v1

# Both results leave the ONEX node graph here: the caller reads them.
externally_consumed_topics:
  - onex.evt.omnimarket.github-repo-write-completed.v1
  - onex.evt.omnimarket.github-repo-write-failed.v1

dependencies:
  packages:
    - "omnibase_core>=0.39.0"

metadata:
  transport_type: kafka
  description: "Typed GitHub PR authoring write effect node"
  author: "OmniNode Team"
  tags:
    - "effect"
    - "github"
    - "write"
