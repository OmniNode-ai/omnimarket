name: node_dead_letter_redrive_effect
version: "1.0.0"
description: "Re-publish dead-lettered records to the topic they came from, read back by their source coordinates without touching any consumer group offset."
omnibase_core_compat: ">=0.46.13,<0.47.0"
entry_points:
  onex.nodes:
    node_dead_letter_redrive_effect: "omnimarket.nodes.node_dead_letter_redrive_effect"
capabilities:
  standalone: true
  full_runtime: true
  requires_network: true
  requires_repo: false
  requires_secrets: true
  requires_docker: false
  side_effect_class: kafka_publish
dependencies:
  - "omnibase_core>=0.46.13"
  - "omnibase-infra>=0.38.66"
  - "omnibase-spi>=0.23.3"
  - "psycopg2-binary"
  - "aiokafka"
  - "pyyaml"
authors: ["OmniNode Platform Team"]
license: "MIT"
tags: ["effect", "dead-letter", "redrive", "event-ledger"]
pack: "observability"
display_name: "Dead-Letter Redrive Effect"
node_role: "effect"
