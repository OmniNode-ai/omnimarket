# One scoped broker permission overlay: <root>/<scope>/overlay.yaml under a root named in ONEX_SKILL_OVERLAY_ROOTS.
# Every key is required; the real rows live in the overlays repository. The shape is also what the broker permission
# apply tool reads as its declaration.
scope: broker_acls_example
ticket: OMN-00000
why: one line saying which refusal these rows clear
operator_ssh_target: broker-host-alias
operator_command: "example-apply-tool apply --declaration {declaration} --ssh-target {ssh_target}"
declaration_path: "<overlays clone>/overlays/{scope}/overlay.yaml"
lane: dev
host: dev-lane-broker
compose_project: omnibase-infra
broker_container: omnibase-infra-redpanda
superuser_source_container: omnibase-infra-redpanda-sasl-enable
principals:
  - principal: User:example-login
    role: what the login is
    grants:
      - {resource_type: TOPIC, pattern: LITERAL, name: onex.evt.omnimarket.example.v1, operation: READ}
