name: node_host_table_keys_ingest_effect
lifecycle: experimental
node_type: EFFECT_GENERIC
runtime_profiles:
- effects
contract_version:
  major: 1
  minor: 0
  patch: 0
node_version: 1.0.0
description: Ingest the lab host table into the key-value store when the overlay loads (OMN-23983, OMN-22251).
input_model:
  name: ModelOverlayStoreWrite
  module: omnimarket.models.overlay_store.model_overlay_store_write
overlay:
  node: node_host_table_keys_ingest_effect
  roots_env: ONEX_SKILL_OVERLAY_ROOTS
handler:
  module: omnimarket.nodes.node_host_table_keys_ingest_effect.handlers.handler_host_table_keys_ingest
  class: HandlerHostTableKeysIngest
  input_model: omnimarket.models.overlay_store.model_overlay_store_write.ModelOverlayStoreWrite
handler_routing:
  routing_strategy: topic_match
  handlers:
  - operation: handle
    handler:
      name: HandlerHostTableKeysIngest
      module: omnimarket.nodes.node_host_table_keys_ingest_effect.handlers.handler_host_table_keys_ingest
    event_model:
      name: ModelOverlayStoreWrite
      module: omnimarket.models.overlay_store.model_overlay_store_write
    topic: onex.evt.omnimarket.overlay-store-loaded.v1
    message_category: event
  - operation: handle
    handler:
      name: HandlerOverlaySnapshotWrite
      module: omnimarket.nodes.node_host_table_keys_ingest_effect.handlers.handler_overlay_snapshot_write
    event_model:
      name: ModelOverlaySettingsRecord
      module: omnimarket.models.overlay_store.model_overlay_settings_record
    topic: onex.snapshot.projection.overlay-store.v1
    message_category: event
# The compacted snapshot topic is read, not subscribed: its name carries no message category, so a subscribe
# declaration would resolve to no dispatcher (OMN-18013). Same declaration as node_floor_projection_read_effect.
snapshot_reads:
  - onex.snapshot.projection.overlay-store.v1
event_bus:
  subscribe_topics:
  - onex.evt.omnimarket.overlay-store-loaded.v1
  publish_topics: []
broker_acl_grants:
  - principal: "${ONEX_ACL_DEV_RUNTIME_EFFECTS_PRINCIPAL}"
    grants:
      - {resource_type: TOPIC, pattern: LITERAL, name: onex.evt.omnimarket.overlay-store-loaded.v1, operation: READ}
      - {resource_type: TOPIC, pattern: LITERAL, name: onex.evt.omnimarket.overlay-store-loaded.v1, operation: DESCRIBE}
      - {resource_type: TOPIC, pattern: LITERAL, name: onex.snapshot.projection.overlay-store.v1, operation: READ}
      - {resource_type: TOPIC, pattern: LITERAL, name: onex.snapshot.projection.overlay-store.v1, operation: DESCRIBE}
runtime_dispatch:
  command_topic: onex.evt.omnimarket.overlay-store-loaded.v1
  terminal_events:
    success: onex.evt.omnimarket.host-table-keys-ingested.v1
side_effects:
- key-value-write
descriptor:
  node_archetype: effect
  purity: impure
  runtime_profiles:
  - effects
  idempotent: true
  timeout_ms: 30000
metadata:
  transport_type: kafka
  ticket: OMN-23983
  related_tickets:
  - OMN-22251
