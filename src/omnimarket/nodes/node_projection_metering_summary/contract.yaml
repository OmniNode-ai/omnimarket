name: projection_metering_summary
contract_version: {major: 1, minor: 0, patch: 0}
node_type: reducer
# OMN-17556: this projection writes a TENANT-domain table, so its handler
# resolves the tenant_projection binding. That binding's credential is a
# store-resolved secret_ref read through SecretResolver at the binding
# boundary, and exactly one process holds it: the consolidated writer that
# boots RUNTIME_PROFILE=tenant-projection and owns every TENANT-domain
# projection contract. `tenant-projection` is a registered, consumer-attached
# runtime profile, so this contract is drained by that writer and is
# deliberately absent from `main` and `effects` -- neither of those processes
# carries the credential, and per the 2026-09-03 operator ruling neither ever
# will as a container env var. This is the permanent ownership boundary, not
# a temporary orphaning.
# OMN-19998: moved off main, which boots without that credential on a lab lane.
runtime_profiles: [tenant-projection]
node_version: {major: 1, minor: 0, patch: 0}
input_model: omnimarket.nodes.node_projection_metering_summary.models.ModelMeteringSummaryFoldRequest
output_model: omnimarket.nodes.node_projection_metering_summary.models.ModelMeteringSummaryFoldResult
description: >
  OMN-19977. Fold a complete metering snapshot into durable daily and all-time
  summaries, preserving unknown measurements and the requested baseline.
handler:
  module: omnimarket.nodes.node_projection_metering_summary.handlers.handler_projection_metering_summary
  class: HandlerProjectionMeteringSummary
handler_routing:
  routing_strategy: operation_match
  handlers:
    - operation: metering_summary_projection_writer
      handler:
        name: MeteringSummaryProjectionWriter
        module: omnimarket.nodes.node_projection_metering_summary.handlers.handler_metering_summary_writer
      handler_module: omnimarket.nodes.node_projection_metering_summary.handlers.handler_metering_summary_writer
terminal_event: onex.evt.omnimarket.projection-metering-summary-applied.v1
golden_path:
  - Receive a complete recorded snapshot, resolved baseline and explicit as_of
  - Fold each UTC day and all-time through HandlerMeteringSummary
  - Replace rows by tenant, window kind, window start and requested baseline model
  - Render the durable stored row through the local CLI
dod_evidence:
  - test: tests/nodes/node_projection_metering_summary/test_golden_chain_projection_metering_summary.py::test_the_contract_declares_the_terminal_topic
    description: The applied terminal is declared and published by the contract
  - test: tests/nodes/node_projection_metering_summary/test_golden_chain_projection_metering_summary.py::test_the_writer_declares_in_process_dispatch
    description: The runtime routes only the writer through in-process dispatch
  - test: tests/nodes/node_projection_metering_summary/test_golden_chain_projection_metering_summary.py::test_fold_to_writer_to_stored_rows_and_replay
    description: The runtime writer stores the folded rows and replay changes nothing
  - test: tests/test_omn19977_metering_summary_real_postgres.py::test_replacement_and_replay_against_real_postgres
    description: Real Postgres replaces the same key, preserves NULL savings and replays identical JSON
  - test: tests/nodes/node_projection_metering_summary/test_projection.py::test_fold_and_store_are_byte_identical
    description: Replaying a recorded snapshot preserves every byte and column
  - test: tests/nodes/node_projection_metering_summary/test_projection.py::test_cli_json_is_stored_content_and_keys
    description: CLI JSON equals the stored summary and its key fields
  - test: tests/nodes/node_projection_metering_summary/test_projection.py::test_unknown_measurements_do_not_become_money
    description: Unknown runs are counted but never summed into money
  - test: tests/nodes/node_projection_metering_summary/test_projection.py::test_refresh_baseline_changes_every_window_and_replaces
    description: Baseline changes recompute all windows and repeated keys replace
  - test: tests/nodes/node_projection_metering_summary/test_projection.py::test_unresolved_preserves_requested_model
    description: Unresolved baselines preserve the request and expose null savings
  - test: tests/nodes/node_projection_metering_summary/test_projection.py::test_dispatch_capability_only_on_writer
    description: Only the writer takes the runtime projection dispatch arm
  - test: tests/nodes/node_projection_metering_summary/test_omn17427_store_refresh.py::test_every_tenant_with_runs_gets_day_and_all_rows
    description: The store refresh folds every tenant with runs into day and all-time rows under its own RLS context
  - test: tests/nodes/node_projection_metering_summary/test_omn17427_store_refresh.py::test_named_tenant_and_day_refolds_that_day_once_the_all_row_exists
    description: A delegation terminal's refresh refolds its day and the all-time row only
db_io:
  db_tables:
    - name: metering_summary
      database_ref: application
      schema: public
      migration: "0000_create_metering_summary.sql"
      access: read_write
      role: metering_summary
    # OMN-17427: the store refresh reads each tenant's runs under that
    # tenant's row-level-security context. node_projection_delegation owns
    # the DDL; this node only reads it.
    - name: delegation_events
      database_ref: application
      schema: public
      migration: "0049_delegation_events_data_source.sql"
      access: read
      role: delegation_history
  dedupe_key: [tenant_id, window_kind, window_start, baseline_model]
  ordering_key: as_of
event_bus:
  subscribe_topics:
    - onex.cmd.omnimarket.refresh-metering-summary.v1
    - onex.cmd.omnimarket.metering-summary-refresh-requested.v1
  publish_topics:
    - onex.evt.omnimarket.projection-metering-summary-applied.v1
  dlq_topics:
    - onex.dlq.omnimarket.projection-metering-summary-malformed.v1
externally_consumed_topics:
  - onex.evt.omnimarket.projection-metering-summary-applied.v1
externally_produced_topics:
  - topic: onex.cmd.omnimarket.refresh-metering-summary.v1
    producer: Snapshot caller supplying ModelMeteringSummaryFoldRequest (the local end-of-delegate refresh, omnimarket.projection.sqlite_metering_summary)
  - topic: onex.cmd.omnimarket.metering-summary-refresh-requested.v1
    producer: node_metering_summary_refresh_compute, on each delegation terminal and on its runtime-tick schedule (OMN-17427)
config:
  metering_summary:
    # A complete snapshot: every run of the tenant rides in the command.
    fold_command_topic: onex.cmd.omnimarket.refresh-metering-summary.v1
    # OMN-17427: tenants and days only; the writer reads the runs. A shared
    # lane's tenant does not fit one bus message as a snapshot.
    store_refresh_command_topic: onex.cmd.omnimarket.metering-summary-refresh-requested.v1
# metering-summary.v1: the stored rows, served per tenant. The day rows are the
# daily series and the all row the headline, from one fold, so they add up.
projection_api:
  expose: true
  # The nested form, so the exposure-drift gate reconciles these columns
  # against the migration DDL (it reads only projection_api.exposures).
  exposures:
    - topic: "onex.snapshot.projection.metering-summary.v1" # onex-topic-allow: projection snapshot topics use the onex.snapshot.* prefix by convention
      topic_config:
        kafka_config:
          "cleanup.policy": "compact"
      key_grain: "mutable"
      table: "metering_summary"
      schema: "public"
      columns:
        - tenant_id
        - window_kind
        - window_start
        - window_end
        - as_of
        - baseline_model
        - pricing_manifest_version
        - baseline_state
        - runs_total
        - runs_measured
        - runs_unknown_tokens
        - runs_unknown_spend
        - tokens_in
        - tokens_out
        - spend_usd
        - counterfactual_usd
        - savings_usd
        - savings_per_measured_run_usd
        - savings_pct_of_counterfactual
        - compression_ratio
        - cache_hit_rate
        - runs_cache_answered
        - summary_json
      json_columns:
        - summary_json
      order_by: "window_kind ASC, window_start ASC, baseline_model ASC"
      # The all row's window_start is empty, so the walk serves it first and then
      # the days in date order. window_start is unique per tenant and baseline
      # model, not across baseline models: a page boundary between two baselines'
      # rows for the same window can skip one (pinned by a test).
      cursor_column: window_start
      freshness_column: as_of
      limit: 500
      bus_backed: true
      key_columns: [tenant_id, window_kind, window_start, baseline_model]
      tenant_column: tenant_id
metadata:
  transport_type: kafka
