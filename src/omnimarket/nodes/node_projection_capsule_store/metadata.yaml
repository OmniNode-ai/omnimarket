name: projection_capsule_store
version: "1.0.0"
description: >
  Materializes a durable, scored capsule/exemplar store from context-ROI score
  events. Keyed by deterministic capsule_hash with ROI-driven effectiveness and
  staleness decay (OMN-12842 / M2).
omnibase_core_compat: ">=0.39.0,<1.0.0"
capabilities:
  standalone: true
  full_runtime: true
  requires_network: true
  requires_secrets: true
  side_effect_class: write_db
tags:
  - projection
  - capsule
  - exemplar
  - context
  - reducer
pack: "data"
display_name: "Projection: Capsule Store"
node_role: "reducer"
