#
# ONEX Node Contract
# Node: NodePrLandingTickOrchestrator
#
# Rebuild piece 9 (OMN-22921): the landing tick as an orchestrator beside the 300 s script.
#
#   handle(ModelTickRequest) -> ModelTickResult
#
# One tick's facts go through the node path (the decision node with the fair share), the
# reducer node (node_pr_landing_tick_reducer) folds the decision per pull request and names each
# one that differs from the decision the script recorded. Replay and observe modes write no
# merge, arm or rerun; act mode is refused unless the overlay enables it. The script keeps
# landing until the node reads true too.
#
# Profiles: main carries the in-memory default; the Redpanda backend is selected by the
# overlay (backend: redpanda) and reads the script's tick records from the overlay's topic.
name: "node_pr_landing_tick_orchestrator"
contract_name: "node_pr_landing_tick_orchestrator"
node_name: "node_pr_landing_tick_orchestrator"
lifecycle: experimental
node_type: "ORCHESTRATOR_GENERIC"
contract_version:
  major: 0
  minor: 1
  patch: 0
node_version:
  major: 0
  minor: 1
  patch: 0
description: >
  Landing tick orchestrator. Runs one tick's facts through the decision node and the tick
  reducer, compares the decision per pull request with the script's recorded decision, and
  emits one compared event (or a typed failure). Observe and replay never write. During the
  cutover the tick record can carry the old controller's finished tick, with its decision rows
  (kind, subject, outcome, reason; never its facts): when it does, the comparison runs against the controller's real decision
  for that tick, scoped to the cutover repository, instead of a synthetic no action
  (OMN-23665).
input_model:
  name: "ModelTickRequest"
  module: "omnimarket.nodes.node_pr_landing_tick_orchestrator.models.model_tick_orchestrator"
  description: "One tick's facts and the script's recorded decision."
output_model:
  name: "ModelTickResult"
  module: "omnimarket.nodes.node_pr_landing_tick_orchestrator.models.model_tick_orchestrator"
  description: "The per-pull-request comparison, or the typed failure."
handler:
  module: "omnimarket.nodes.node_pr_landing_tick_orchestrator.handlers.handler_pr_landing_tick_orchestrator"
  class: "HandlerPrLandingTickOrchestrator"
  input_model: "omnimarket.nodes.node_pr_landing_tick_orchestrator.models.model_tick_orchestrator.ModelTickRequest"
  output_model: "omnimarket.nodes.node_pr_landing_tick_orchestrator.models.model_tick_orchestrator.ModelTickResult"
dependencies:
  - name: ProtocolTickDecider
    dependency_type: protocol
    description: "the decision node path, injected by keyword; the default is the decision node with the fair share."
    required: false
  - name: ProtocolTickWriter
    dependency_type: protocol
    description: "the only door to a merge, an arm or a rerun; never called in observe or replay mode."
    required: false
  - name: ProtocolTickPublisher
    dependency_type: protocol
    description: "publishes the compared or failed event on the contract topics."
    required: false
  - name: ProtocolTickSnapshotSource
    dependency_type: protocol
    description: "the recorded tick snapshots, in memory or from the overlay's Redpanda topic."
    required: false
handler_routing:
  routing_strategy: "operation_match"
  default_handler: "omnimarket.nodes.node_pr_landing_tick_orchestrator.handlers.handler_pr_landing_tick_orchestrator:HandlerPrLandingTickOrchestrator"
  handlers:
    - operation: "compare_landing_tick"
      handler:
        name: "HandlerPrLandingTickOrchestrator"
        module: "omnimarket.nodes.node_pr_landing_tick_orchestrator.handlers.handler_pr_landing_tick_orchestrator"
event_bus:
  subscribe_topics:
    - "onex.cmd.omnimarket.pr-landing-tick-compare-requested.v1"
  publish_topics:
    - "onex.evt.omnimarket.pr-landing-tick-compared.v1"
    - "onex.evt.omnimarket.pr-landing-tick-compare-failed.v1"
    - "onex.evt.omnimarket.pr-landing-rerun-completed.v1"
    - "onex.evt.omnimarket.pr-landing-rerun-failed.v1"
    # OMN-23964: listed so boot provisioning creates the request topic. The onex scm rerun-request verb publishes it
    # and this node's topic reader consumes it; it is never a subscription, so the runtime wires no handler to it.
    - "onex.cmd.omnimarket.pr-landing-rerun-requested.v1"
terminal_event: "onex.evt.omnimarket.pr-landing-tick-compared.v1"
externally_consumed_topics:
  - "onex.evt.omnimarket.pr-landing-tick-compared.v1"
  - "onex.evt.omnimarket.pr-landing-tick-compare-failed.v1"
  - "onex.evt.omnimarket.pr-landing-rerun-completed.v1"
  - "onex.evt.omnimarket.pr-landing-rerun-failed.v1"
  - "onex.cmd.omnimarket.pr-landing-rerun-requested.v1"
externally_produced_topics:
  - topic: "onex.cmd.omnimarket.pr-landing-rerun-requested.v1"
    producer: "the onex scm rerun-request verb (omnimarket.handlers.scm.scm_rerun_request), which publishes the request directly and reads the answer -- not a node contract"
# OMN-23830: any lane's request to re-run one failed job on the current head. The request is a fact the tick
# reads (read from command_topic by the unit's topic reader under the overlay's rerun_requests section, never a
# handler subscription), the rerun decision node answers it, and the tick publishes the answer: completed for a
# re-run or a duplicate, failed for limit_reached, head_moved or job_not_failed. The per-head limit is the
# overlay's. onex scm rerun-request publishes the command and reads the answer.
rerun_request:
  command_topic: "onex.cmd.omnimarket.pr-landing-rerun-requested.v1"
  completed_topic: "onex.evt.omnimarket.pr-landing-rerun-completed.v1"
  failed_topic: "onex.evt.omnimarket.pr-landing-rerun-failed.v1"
  request_model: "omnimarket.models.pr_landing_rerun_request.model_landing_rerun_request.ModelLandingRerunRequest"
  answer_model: "omnimarket.models.pr_landing_rerun_request.model_landing_rerun_answer.ModelLandingRerunAnswer"
  decision_node: "node_pr_landing_rerun_request_compute"
runtime_dispatch:
  command_topic: "onex.cmd.omnimarket.pr-landing-tick-compare-requested.v1"
  terminal_events:
    success: "onex.evt.omnimarket.pr-landing-tick-compared.v1"
    failure: "onex.evt.omnimarket.pr-landing-tick-compare-failed.v1"
  external_trigger: "A compare command from the floor reading or a replay run; decider, writer and publisher are injected."
# The landing snapshot step's tick record, which this node's topic reader reads under its
# overlay's consumer group. It is a consumed event, not an event_bus subscription, so the
# runtime wires no handler subscription for it; the topic itself is provisioned from the
# snapshot step's event_bus.publish_topics (OMN-23494).
consumed_events:
  - event_type: ModelLandingRerunRequest
    topic: "onex.cmd.omnimarket.pr-landing-rerun-requested.v1"
    description: A lane's request to re-run one failed job on the current head (OMN-23830), read by this node's topic reader under the overlay's rerun_requests consumer group; declared as a consumed event and not in event_bus.subscribe_topics so the runtime wires no handler subscription for it. The request is a fact of the tick that reads it and is answered once on the rerun completed or failed topic.
  - event_type: ModelLandingTickRecord
    topic: "onex.evt.omnimarket.pr-landing-tick-facts-recorded.v1"
    description: The landing snapshot step's tick record, read by this node's topic reader under its overlay's consumer group; declared as a consumed event and not in event_bus.subscribe_topics so the runtime wires no handler subscription for it (OMN-23494). During the cutover the record carries the old controller's finished tick, as its decision rows only, and the compare step compares the node's decision for the record's facts with those rows, the controller's real decision, instead of a synthetic no action (OMN-23665); a record with no controller tick in observe mode is unread, controller_tick_missing, never an assumed decision (OMN-22921).
descriptor:
  node_archetype: orchestrator
  purity: side_effecting
  runtime_profiles:
    - main
  idempotent: true
  timeout_ms: 30000
overlay:
  id: node_pr_landing_tick_orchestrator
  roots_env: ONEX_SKILL_OVERLAY_ROOTS
replay:
  deterministic: true
metadata:
  description: "The landing tick as an orchestrator beside the script, compared per pull request."
  author: "OmniNode Team"
  license: "MIT"
  created: "2026-11-07"
  tags:
    - orchestrator
    - pr-landing
    - landing-tick
    - observe
  related_tickets:
    - OMN-22921
