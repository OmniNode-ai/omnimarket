# ONEX Node Contract - Stability Stack Compose Effect (OMN-23968)
#
# The effect half of the stability stack pair: executes ONE step of the
# ordered plan node_stability_stack_plan_compute produced. Each request names
# the stack and carries one ModelStackStep; the answer is one terminal event,
# completed or failed, carrying the typed outcome (ok, failed, refused) and
# the reason.
#
# The handler runs the stack's own docker compose commands as argv tuples
# (never a shell), the plan overlay declaring the stack and this node's
# compose overlay declaring the lab host, the docker binary and the step
# timeouts. No host, port, path, binary, name or timeout is written in code:
# every one of them comes from the two overlays, the request or the
# environment the runner is handed.
name: "node_stability_stack_compose_effect"
node_type: "EFFECT_GENERIC"
contract_version:
  major: 0
  minor: 1
  patch: 0
node_version: "0.1.0"
lifecycle: experimental
description: "Executes one step of a declared stability stack's install or remove plan - render, snapshot, up, read_services, read_health, event_roundtrip, down or read_gone - and answers ok, failed or refused with the typed reason."
input_model:
  name: "ModelStackStepRequest"
  module: "omnimarket.nodes.node_stability_stack_compose_effect.models.model_stack_compose"
  description: "The correlation id, the stack name and the one step to execute."
output_model:
  name: "ModelStackStepResult"
  module: "omnimarket.nodes.node_stability_stack_compose_effect.models.model_stack_compose"
  description: "The outcome with its typed reason, what was read, the rendered digest and the produced items."
handler:
  module: "omnimarket.nodes.node_stability_stack_compose_effect.handlers.handler_stack_compose"
  class: "HandlerStackCompose"
  input_model: "omnimarket.nodes.node_stability_stack_compose_effect.models.model_stack_compose.ModelStackStepRequest"
  output_model: "omnimarket.nodes.node_stability_stack_compose_effect.models.model_stack_compose.ModelStackStepResult"
handler_routing:
  routing_strategy: "operation_match"
  default_handler: "omnimarket.nodes.node_stability_stack_compose_effect.handlers.handler_stack_compose:HandlerStackCompose"
  handlers:
    - operation: "compose_stability_stack_step"
      handler:
        name: "HandlerStackCompose"
        module: "omnimarket.nodes.node_stability_stack_compose_effect.handlers.handler_stack_compose"
runtime_dispatch:
  command_topic: "onex.cmd.omnimarket.stability-stack-step-requested.v1"
  terminal_events:
    success: "onex.evt.omnimarket.stability-stack-step-completed.v1"
    failure: "onex.evt.omnimarket.stability-stack-step-failed.v1"
descriptor:
  node_archetype: effect
  purity: impure
  idempotent: false
  timeout_ms: 300000
  # The compose project's containers, networks and volumes change, and the
  # rendered compose files are written under the render directory.
  side_effects:
    - "docker compose project lifecycle changes (up, down, remove-orphans, volume removal)"
    - "writes of the rendered compose files under the render directory"
overlay:
  node: node_stability_stack_compose_effect
  roots_env: ONEX_SKILL_OVERLAY_ROOTS
metadata:
  ticket: OMN-23968
  transport_type: inmemory
dod_evidence:
  PYTEST:
    description: "the golden chain ok with exact argv, every refusal reason, failed commands, unhealthy services, health mismatches, lost roundtrips and leftover containers"
    command: "uv run pytest tests/nodes/node_stability_stack_compose_effect/test_golden_chain_stability_stack_compose_effect.py -q"
    pass_criteria: "every test passes"
