name: node_ticket_contract_prerequisite_effect
lifecycle: experimental
node_type: EFFECT_GENERIC
contract_version: {major: 1, minor: 0, patch: 0}
node_version: {major: 1, minor: 0, patch: 0}
description: >
  Local ticket-contract precondition (OMN-20864). Read the outgoing
  commit through the invoking worktree's git context, then import dod_verify's
  static prerequisite for every branch/subject citation, or every explicit PR
  title citation. If the base is absent, fetch only its branch from the configured
  remote into its remote-tracking ref, then pin the resolved commit for all checks.
  Existing bases need no network. Never execute evidence, author contracts, commit
  or push. Git read or fetch errors and missing evidence return a failed result.
  A push that changes
  a path that runs (OMN-21887, operator ruling 2026-11-01T14:45:51Z) also needs an
  integration-proof evidence item, checked by HandlerIntegrationProof. The CLI maps
  that result to exit 1; pre-push and CI invoke this same node in-process.
  A push that adds an entry to an umbrella ticket's contract is refused unless its
  body or commits carry an umbrella evidence line (OMN-21301): every other open pull
  request appends to the same place, so each landing conflicts the rest.
config:
  umbrella_tickets: [OMN-17427, OMN-19998, OMN-22478]
descriptor:
  node_archetype: effect
  purity: effectful
  idempotent: true
  timeout_ms: 60000
  runtime_profiles: []
handler:
  module: omnimarket.nodes.node_ticket_contract_prerequisite_effect.handlers.handler_ticket_contract_prerequisite
  class: HandlerTicketContractPrerequisite
  input_model: omnimarket.nodes.node_ticket_contract_prerequisite_effect.models.model_ticket_contract_prerequisite_request.ModelTicketContractPrerequisiteRequest
  output_model: omnimarket.nodes.node_ticket_contract_prerequisite_effect.models.model_ticket_contract_prerequisite_result.ModelTicketContractPrerequisiteResult
handler_routing:
  routing_strategy: operation_match
  handlers:
    - operation: check_ticket_contract_prerequisite
      handler:
        name: HandlerTicketContractPrerequisite
        module: omnimarket.nodes.node_ticket_contract_prerequisite_effect.handlers.handler_ticket_contract_prerequisite
      event_model: omnimarket.nodes.node_ticket_contract_prerequisite_effect.models.model_ticket_contract_prerequisite_request.ModelTicketContractPrerequisiteRequest
    - operation: check_integration_proof
      handler:
        name: HandlerIntegrationProof
        module: omnimarket.nodes.node_ticket_contract_prerequisite_effect.handlers.handler_integration_proof
      event_model: omnimarket.nodes.node_ticket_contract_prerequisite_effect.models.model_integration_proof_request.ModelIntegrationProofRequest
input_model:
  name: ModelTicketContractPrerequisiteRequest
  module: omnimarket.nodes.node_ticket_contract_prerequisite_effect.models.model_ticket_contract_prerequisite_request
output_model:
  name: ModelTicketContractPrerequisiteResult
  module: omnimarket.nodes.node_ticket_contract_prerequisite_effect.models.model_ticket_contract_prerequisite_result
event_bus:
  subscribe_topics: []
  publish_topics: []
runtime_dispatch:
  external_trigger: pre-push and CI invoke the local node module in the target worktree
metadata:
  transport_type: local
