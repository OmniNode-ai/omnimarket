description: "Runs the schedule verdict on the runtime's tick and reads red when a declared schedule has not fired inside its interval plus grace"
omnibase_core_compat: ">=0.39.0,<1.0.0"
entry_points:
  onex.nodes:
    node_schedule_verdict_effect: "omnimarket.nodes.node_schedule_verdict_effect"
capabilities:
