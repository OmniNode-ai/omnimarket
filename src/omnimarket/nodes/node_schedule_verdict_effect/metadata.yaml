  full_runtime: true
  requires_network: false
  requires_repo: false
  requires_secrets: false
  requires_docker: false
  side_effect_class: none
dependencies:
  - "omnibase_core>=0.39.0"
  - "omnibase-infra>=0.38.3"
authors: ["OmniNode Platform Team"]
license: "MIT"
tags: ["effect", "schedule", "verdict", "OMN-19998"]
pack: "pipeline"
display_name: "Schedule Verdict Effect"
node_role: "effect"
