# ONEX Node Contract - Schedule Verdict Effect (OMN-19998)
#
# Effect with one operation:
#   schedule_verdict.scheduled: ModelRuntimeTick -> ModelScheduleVerdictResult | None
#                               (the tick-driven verdict pass; a declared schedule that has not fired inside its
#                                interval plus grace reads red)
name: node_schedule_verdict_effect
contract_name: node_schedule_verdict_effect
node_name: node_schedule_verdict_effect
contract_version: {major: 0, minor: 1, patch: 0}
node_version: {major: 0, minor: 1, patch: 0}
node_type: effect
lifecycle: experimental
runtime_profiles: [main]

description: >
  Runs the schedule verdict on the runtime's tick. A tick inside the overlay's interval returns nothing; the tick that
  is due loads the declared job overlays, builds the request from the run store's held states and returns the verdict.
  A declared schedule that has not fired inside its interval plus grace reads red.

handler:
  module: omnimarket.nodes.node_schedule_verdict_effect.handlers.handler_schedule_verdict_scheduled
  class: HandlerScheduleVerdictScheduled
  input_model: omnibase_infra.runtime.models.model_runtime_tick.ModelRuntimeTick

handler_routing:
  routing_strategy: operation_match
  handlers:
    - operation: schedule_verdict.scheduled
      handler:
        name: HandlerScheduleVerdictScheduled
        module: omnimarket.nodes.node_schedule_verdict_effect.handlers.handler_schedule_verdict_scheduled
      input_model: omnibase_infra.runtime.models.model_runtime_tick.ModelRuntimeTick
      output_model: omnimarket.models.schedule_trigger.model_schedule_trigger.ModelScheduleVerdictResult

descriptor:
  node_archetype: effect
  purity: impure
  idempotent: false
  timeout_ms: 2000

input_model:
  name: ModelRuntimeTick
  module: omnibase_infra.runtime.models.model_runtime_tick
  description: The runtime tick.
output_model:
  name: ModelScheduleVerdictResult
  module: omnimarket.models.schedule_trigger.model_schedule_trigger
  description: The verdicts, the red flag and the reason.

terminal_event: onex.evt.omnimarket.schedule-verdict.v1

runtime_dispatch:
  command_topic: onex.cmd.omnimarket.schedule-verdict-requested.v1

event_bus:
  subscribe_topics: []
  publish_topics:
    - onex.evt.omnimarket.schedule-verdict.v1

externally_consumed_topics:
  - onex.evt.omnimarket.schedule-verdict.v1

input_subscriptions:
  - topic: onex.intent.platform.runtime-tick.v1
    operation: schedule_verdict.scheduled
    event_type: platform.runtime-tick

# Where the schedule reads its settings. The overlays are found under ONEX_SKILL_OVERLAY_ROOTS or the file the env var names.
runtime:
  schedule_overlay: {overlay_id: node_schedule_verdict_effect, model: omnimarket.models.schedule_trigger.model_schedule_trigger.ModelScheduleVerdictOverlay}

broker_acl_grants:
  - principal: "${ONEX_ACL_RUNTIME_PRINCIPAL}"
    grants:
      - {resource_type: TOPIC, pattern: LITERAL, name: onex.evt.omnimarket.schedule-verdict.v1, operation: WRITE}
      - {resource_type: TOPIC, pattern: LITERAL, name: onex.evt.omnimarket.schedule-verdict.v1, operation: DESCRIBE}

metadata:
  ticket: OMN-19998
  transport_type: kafka
