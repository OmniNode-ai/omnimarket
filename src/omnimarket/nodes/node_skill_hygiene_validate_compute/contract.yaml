name: node_skill_hygiene_validate_compute
contract_version:
  major: 1
  minor: 0
  patch: 0
node_type: compute
node_version:
  major: 1
  minor: 0
  patch: 0
description: Skill directory hygiene over one skills tree (naming, duplicates, index nesting, SKILL.md presence and name, no Python outside _-prefixed dirs, no orphan topics.yaml). The verdict passes when no violation is an error.
handler_routing:
  routing_strategy: operation_match
  handlers:
  - operation: skill_hygiene_validate
    handler:
      name: HandlerSkillHygieneValidate
      module: omnimarket.nodes.node_skill_hygiene_validate_compute.handlers.handler_skill_hygiene_validate
handler:
  module: omnimarket.nodes.node_skill_hygiene_validate_compute.handlers.handler_skill_hygiene_validate
  class: HandlerSkillHygieneValidate
  input_model: omnimarket.nodes.node_skill_hygiene_validate_compute.models.model_skill_hygiene_validate_request.ModelSkillHygieneValidateRequest
descriptor:
  node_archetype: compute
  purity: pure  # read-only deterministic over the skills tree on disk
  idempotent: true
  timeout_ms: 30000
  runtime_profiles:
  - main
inputs:
  skills_root:
    type: str
    required: true
    description: Directory whose child directories are skills.
  strict:
    type: bool
    required: false
    description: Promote skill-md-required and name-matches-dir from warning to error.
outputs:
  skills_root:
    type: str
  strict:
    type: bool
  violations:
    type: tuple
  error_count:
    type: int
  warning_count:
    type: int
  passed:
    type: bool
terminal_event: onex.evt.omnimarket.skill-hygiene-validated.v1
event_bus:
  subscribe_topics:
  - onex.cmd.omnimarket.skill-hygiene-validate-requested.v1
  publish_topics:
  - onex.evt.omnimarket.skill-hygiene-validated.v1
metadata:
  transport_type: kafka
runtime_dispatch:
  command_topic: onex.cmd.omnimarket.skill-hygiene-validate-requested.v1
externally_consumed_topics:
- onex.evt.omnimarket.skill-hygiene-validated.v1
