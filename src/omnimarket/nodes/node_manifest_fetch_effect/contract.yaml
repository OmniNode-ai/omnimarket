# ONEX Node Contract
# Node: NodeManifestFetchEffect
#
# Capability-oriented effect node for fetching the ONEX runtime manifest.
# Named by capability ("manifest.fetch"), not by transport (HTTP).
# Principle: "I'm interested in what you do, not what you are"
#
# Fetches the structured system manifest from the ONEX runtime
# /v1/introspection/manifest endpoint.

# Contract identifiers
name: node_manifest_fetch_effect
contract_name: node_manifest_fetch_effect
node_name: node_manifest_fetch_effect

contract_version:
  major: 0
  minor: 1
  patch: 0

node_version:
  major: 0
  minor: 1
  patch: 0

# Node type
node_type: effect
# Canary is invoked in process; event-bus activation is a separate step.
lifecycle: experimental

# Description
description: >
  Capability-oriented effect node for fetching the ONEX runtime manifest.
  Calls the /v1/introspection/manifest endpoint on the configured ONEX
  runtime and returns the structured manifest payload. Supports configurable
  runtime URL and request timeout. Graceful fallback to empty manifest on
  timeout or unavailability.

# Strongly typed I/O models
input_model:
  name: ModelManifestFetchRequest
  module: omnimarket.nodes.node_manifest_fetch_effect.models

output_model:
  name: ModelManifestFetchResult
  module: omnimarket.nodes.node_manifest_fetch_effect.models

# Capabilities
capabilities:
  - name: manifest.fetch
    description: Fetch the ONEX runtime manifest via HTTP
    version: 0.1.0

# IO operations
io_operations:
  - operation: fetch
    description: Fetch the ONEX runtime manifest from the runtime endpoint
    protocol_method: handle
    input_fields:
      - runtime_url: str
      - timeout_ms: int
      - correlation_id: UUID | None
    output_fields:
      - result: ModelManifestFetchResult
    idempotent: true

# Typed handler, invoked in process by the canary proof.
handler:
  module: omnimarket.nodes.node_manifest_fetch_effect.handlers.handler_manifest_fetch
  class: HandlerManifestFetch
  input_model: omnimarket.nodes.node_manifest_fetch_effect.models.ModelManifestFetchRequest
  output_model: omnimarket.nodes.node_manifest_fetch_effect.models.ModelManifestFetchResult

descriptor:
  node_archetype: effect
  purity: effectful
  idempotent: true
  timeout_ms: 60000
  runtime_profiles: [effects]

# Error handling
error_handling:
  retry_policy:
    max_retries: 2
    initial_delay_ms: 500
    max_delay_ms: 5000
    exponential_base: 2
    retry_on:
      - ManifestFetchTimeoutError
      - ManifestFetchConnectionError
  circuit_breaker:
    enabled: true
    failure_threshold: 5
    reset_timeout_ms: 60000

# Metadata
metadata:
  author: OmniNode Team
  license: MIT
  ticket: OMN-18008
  maturity: alpha
  tags:
    - effect
    - manifest
    - introspection
    - runtime
