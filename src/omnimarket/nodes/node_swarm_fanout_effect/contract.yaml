---
name: node_swarm_fanout_effect
contract_name: node_swarm_fanout_effect
node_name: node_swarm_fanout_effect
contract_version: {major: 1, minor: 1, patch: 0}
node_version: {major: 1, minor: 1, patch: 0}
node_type: effect
description: >
  Effect node for swarm parallel fan-out dispatch. Sends subtask prompts
  to model endpoints via HTTP (direct mode) or via a work queue (queue mode)
  for multi-site deployments where workers connect out to the runtime.

input_model:
  name: ModelSwarmFanoutRequest
  class: ModelSwarmFanoutRequest
  module: omnimarket.nodes.node_swarm_fanout_effect.models.model_swarm_fanout_request

output_model:
  name: ModelSwarmFanoutResult
  class: ModelSwarmFanoutResult
  module: omnimarket.nodes.node_swarm_fanout_effect.models.model_swarm_fanout_result

handler:
  name: HandlerSwarmFanout
  module: omnimarket.nodes.node_swarm_fanout_effect.handlers.handler_swarm_fanout
  class: HandlerSwarmFanout

descriptor:
  node_archetype: effect
  purity: effectful
  idempotent: false
  timeout_ms: 600000
  runtime_profiles: [effects]

event_bus:
  version: {major: 1, minor: 1, patch: 0}
  plugin_managed: false
  subscribe_topics:
    - onex.cmd.omnimarket.swarm-fanout.v1
    - onex.evt.omnimarket.swarm-subtask-completed.v1
  publish_topics:
    - onex.evt.omnimarket.swarm-fanout-completed.v1
    - onex.cmd.omnimarket.swarm-subtask-assigned.v1

externally_consumed_topics:
  - onex.evt.omnimarket.swarm-fanout-completed.v1
  - onex.evt.omnimarket.swarm-subtask-completed.v1

terminal_event: onex.evt.omnimarket.swarm-fanout-completed.v1

published_events:
  - event_type: SwarmFanoutCompleted
    topic: onex.evt.omnimarket.swarm-fanout-completed.v1
    description: Swarm fan-out completed with all dispatch results.
  - event_type: SwarmSubtaskAssigned
    topic: onex.cmd.omnimarket.swarm-subtask-assigned.v1
    description: Subtask assignment published to work queue for worker-pull dispatch.

io_operations:
  - http_call
  - kafka_publish
  - kafka_subscribe

error_handling:
  retry_policy:
    max_retries: 1
    initial_delay_ms: 0
    max_delay_ms: 0
    exponential_base: 1
    retry_on:
      - HttpError
      - TimeoutError
  error_types:
    - name: HttpError
      description: HTTP dispatch to model endpoint failed
      recoverable: true
    - name: TimeoutError
      description: Per-endpoint or total run timeout exceeded
      recoverable: false

timeout_behavior:
  default_ms: 600000
  max_ms: 600000
  terminal_response:
    status: timeout
    error_message: "Swarm fan-out timed out"

metadata:
  transport_type: kafka
  author: OmniNode Team
  license: MIT
  created: "2026-05-23"
  tags: [effect, swarm, fanout, dispatch, parallel, worker-pull, OMN-11812, OMN-12000]
  related_tickets:
    - "OMN-11812"
    - "OMN-12000"
