# ONEX Node Contract - Hostile Reviewer WorkflowPackage
#
# Multi-model adversarial code review. Coordinates dispatch of reviews to
# multiple models, aggregates findings via weighted-union, checks convergence,
# and produces a report.
#
# Related Tickets:
#   - OMN-7802: Update contract for new handler routing
#   - OMN-7781: Unified LLM Workflow Migration epic
#   - OMN-9269: Repair handler_routing drift (1 topic / 7 handlers / missing event_model)
#   - OMN-7981: Contract-driven model routing (replaces hardcoded env var reads)
---
name: hostile_reviewer
contract_version: {major: 3, minor: 1, patch: 0}
node_type: workflow
node_version: {major: 3, minor: 1, patch: 0}

description: >
  Multi-model adversarial code review WorkflowPackage. Coordinates dispatch of
  reviews to multiple models, aggregates findings via weighted-union, checks
  convergence, and produces a report. Phases: INIT -> DISPATCH_REVIEWS ->
  AGGREGATE -> CONVERGENCE_CHECK -> REPORT -> DONE.
  Circuit breaker trips after 3 consecutive failures.

handler_routing:
  # Top-level workflow entry: the single externally-addressable handler is the
  # workflow runner. Internal helpers (prompt builder, response parser,
  # convergence reducer, FSM state machine, finding aggregator, review
  # orchestrator) are invoked synchronously by HandlerWorkflowRunner — they
  # are NOT independent bus subscribers and therefore do not belong in
  # handler_routing.handlers. Mirrors the canonical multi-handler orchestrator
  # pattern used by node_pr_lifecycle_orchestrator,
  # node_build_loop_orchestrator, and node_autopilot_orchestrator (OMN-9269).
  routing_strategy: payload_type_match
  handlers:
    - handler:
        name: HandlerWorkflowRunner
        module: omnimarket.nodes.node_hostile_reviewer.handlers.handler_workflow_runner
      event_model:
        name: ModelHostileReviewerStartCommand
        module: omnimarket.nodes.node_hostile_reviewer.models.model_hostile_reviewer_start_command

  adapters:
    - name: "AdapterInferenceBridge"
      module: "omnimarket.nodes.node_hostile_reviewer.handlers.adapter_inference_bridge"
      transport_type: http
      description: "Bridges orchestrator to inference endpoints (HTTP/CLI). Implements ModelInferenceAdapter ABC."

  # Internal synchronous helpers invoked by HandlerWorkflowRunner. Declared
  # here for contract completeness (OMN-11907) but are NOT independent bus
  # subscribers. See OMN-9269 for the canonical multi-handler workflow pattern.
  internal_handlers:
    - handler:
        name: HandlerConvergenceReducer
        module: omnimarket.nodes.node_hostile_reviewer.handlers.handler_convergence_reducer
    - handler:
        name: HandlerHostileReviewer
        module: omnimarket.nodes.node_hostile_reviewer.handlers.handler_hostile_reviewer
    - handler:
        name: HandlerPromptBuilder
        module: omnimarket.nodes.node_hostile_reviewer.handlers.handler_prompt_builder
    - handler:
        name: HandlerResponseParser
        module: omnimarket.nodes.node_hostile_reviewer.handlers.handler_response_parser
    - handler:
        name: HandlerReviewOrchestrator
        module: omnimarket.nodes.node_hostile_reviewer.handlers.handler_review_orchestrator

input_model:
  name: "ModelHostileReviewerStartCommand"
  module: "omnimarket.nodes.node_hostile_reviewer.models.model_hostile_reviewer_start_command"
  description: "Start command for hostile reviewer workflow."

output_model:
  name: "ModelHostileReviewerCompletedEvent"
  module: "omnimarket.nodes.node_hostile_reviewer.models.model_hostile_reviewer_completed_event"
  description: "Completed event with verdict, findings, and phase history."

descriptor:
  node_archetype: workflow
  purity: side_effect
  idempotent: true
  timeout_ms: 600000
  runtime_profiles:
    - effects

inputs:
  pr_number:
    type: int
    description: "PR number to review"
    required: false
  repo:
    type: str
    description: "GitHub repo (owner/repo)"
    required: false
  file_path:
    type: str
    description: "File path to review (alternative to PR)"
    required: false
  models:
    type: list
    description: "Caller-provided logical model route keys to use for review"
    required: true
  dry_run:
    type: bool
    description: "Run without side effects"
    required: false
    default: false

outputs:
  final_phase:
    type: str
    description: "Terminal phase reached"
  pass_count:
    type: int
    description: "Number of review passes completed"
  total_findings:
    type: int
    description: "Total findings across all passes"
  verdict:
    type: str
    description: "Overall verdict (clean, risks_noted, blocking_issue)"

terminal_event: onex.evt.omnimarket.hostile-reviewer-completed.v1

event_bus:
  subscribe_topics:
    - onex.cmd.omnimarket.hostile-reviewer-start.v1
  publish_topics:
    - onex.evt.omnimarket.hostile-reviewer-phase-transition.v1
    - onex.evt.omnimarket.hostile-reviewer-completed.v1
    - onex.evt.omnimarket.hostile-reviewer-prompt-built.v1
    - onex.evt.omnimarket.hostile-reviewer-response-parsed.v1
    - onex.evt.omnimarket.hostile-reviewer-convergence-reduced.v1
    - onex.evt.omnimarket.hostile-reviewer-inference-dispatched.v1

model_routing:
  policy_id: "hostile_reviewer.caller_supplied_routes.v1"
  route_keys_input: "models"
  route_config_env: "HOSTILE_REVIEWER_MODEL_CONFIGS_JSON"
  description: >
    Hostile reviewer accepts caller-provided logical route keys only. Runtime
    route configs are injected separately and must map each requested key to a
    concrete transport configuration; this contract intentionally does not
    declare served model IDs or model-specific endpoint environment variables.
  route_schema:
    logical_key:
      type: str
      required: true
      description: "Opaque logical route key supplied in inputs.models."
    transport:
      type: str
      required: true
      allowed_values: ["http", "cli"]
    http:
      required_fields:
        - "base_url or base_url_env"
        - "model_id"
      optional_fields:
        - "api_key"
        - "extra_headers"
        - "temperature"
        - "context_window"
        - "timeout_seconds"
    cli:
      required_fields:
        - "cli_command"
      optional_fields:
        - "context_window"
        - "timeout_seconds"

config:
  openrouter_base_url:
    env_var: "OPENROUTER_BASE_URL"
    description: "Optional API base URL supplied by runtime overlay for testing or proxy routing."
    required: false

dependencies:
  nodes:
    - name: "node_finding_aggregator_compute"
      reason: "Weighted-union dedup of findings from N models"
      required: true
  packages:
    - "omnibase_core>=0.39.0"
    - "httpx>=0.27.0"

dod_evidence:
  ticket_id: "OMN-7981"
  evidence_requirements:
    - kind: "tests"
      description: "Contract-driven model routing unit tests (12 new)"
      command: "uv run pytest tests/test_hostile_reviewer_contract_routing.py -v"
    - kind: "tests"
      description: "Existing golden chain + contract routing regression tests"
      command: "uv run pytest tests/test_node_hostile_reviewer_contract.py tests/test_golden_chain_hostile_reviewer.py -v"
    - kind: "deploy"
      description: "Node available via onex run-node node_hostile_reviewer"
      command: "uv run onex run-node node_hostile_reviewer --input '{\"dry_run\": true}' 2>/dev/null"

metadata:
  transport_type: kafka
  description: "Multi-model adversarial code review WorkflowPackage"
  author: "OmniNode Team"
  created: "2026-04-06"
  updated: "2026-05-19"
  tags:
    - "review"
    - "adversarial"
    - "multi-model"
    - "fsm"
    - "convergence"
    - "llm-workflow"
    - "OMN-7781"
  related_tickets:
    - "OMN-7781"
    - "OMN-7794"
    - "OMN-7795"
    - "OMN-7796"
    - "OMN-7797"
    - "OMN-7798"
    - "OMN-7799"
    - "OMN-7800"
    - "OMN-7801"
    - "OMN-7802"
    - "OMN-9269"
    - "OMN-7981"
