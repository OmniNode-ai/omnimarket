---
name: projection_pattern_learning
contract_version: {major: 1, minor: 0, patch: 0}
node_type: reducer
node_version: {major: 1, minor: 0, patch: 0}
input_model: omnimarket.nodes.node_projection_pattern_learning.handlers.handler_projection_pattern_learning.ModelPatternStoredEvent
description: >
  Projects pattern-stored events into the pattern_learning_artifacts table.
  UPSERT by pattern_id (latest-state-wins). Source topic:
  onex.evt.omniintelligence.pattern-stored.v1. Closes the golden chain
  pattern_learning chain (OMN-13124): the tail table had no consumer for
  pattern-stored.v1, so the sweep timed out. This reducer is the consumer.

# Legacy single-handler declaration. Auto-wiring reads it ONLY when
# handler_routing declares no handlers (omnibase_infra
# runtime/auto_wiring/discovery.py), which is never the case here, so
# this block is inert for dispatch. Kept because the class is still the
# node's typed projection surface: ProjectionPatternLearning is what the golden-chain
# tests drive and what the standalone runner's SQL mirrors.
handler:
  module: omnimarket.nodes.node_projection_pattern_learning.handlers.handler_projection_pattern_learning
  class: HandlerProjectionPatternLearning

# OMN-17519. pattern_learning_artifacts is a TENANT-domain relation
# (schema: tenant, below), granted in the onex-dev topology to principal
# tenant_projection_writer ONLY -- the shared runtime's own principal
# omninode_runtime holds no grant on it. Per the 2026-09-02 operator ruling,
# a projection that needs the tenant-domain database is owned by its dedicated
# writer Deployment (OMN-15905 shape), not by omninode-runtime.
#
# PatternLearningProjectionRunner is that writer: a BaseProjectionRunner with
# its own consume loop, run from
# omninode_infra k8s/onex-dev/runtime/deployment-omnimarket-projection-pattern-learning-writer.yaml
# as `python -m ...handlers.handler_pattern_learning`.
#
# The in-process HandlerProjectionPatternLearning entry that used to sit here
# was the pre-OMN-15905 sibling and is REMOVED, not merely deprioritized. It
# could not simply be left in place: this contract declares exactly ONE
# subscribe topic, and _topics_for_handler_entry short-circuits
# `if len(topics) == 1: return topics` before the multi-handler ambiguity
# guard, so BOTH entries were assigned that topic. The runner no-ops in the
# shared runtime (OMN-16874 standalone-runner branch) but the in-process
# sibling was genuinely dispatched, which made omninode-runtime resolve
# tenant_projection:ONEX_TENANT_DB_URL -- bound on no onex-dev pod -- and under
# ONEX_WIRING_STRICT_MODE=1 that took the entire boot down (deploy run
# 33638367122, 2026-09-02, CrashLoopBackOff). node_projection_savings and
# node_projection_delegation keep both entries only because their 5 and 9
# subscribe topics let the ambiguity guard starve the in-process sibling; with
# one topic there is no such starvation to rely on.
handler_routing:
  routing_strategy: operation_match
  handlers:
    - operation: pattern_learning_projection_runner
      handler:
        name: PatternLearningProjectionRunner
        module: omnimarket.nodes.node_projection_pattern_learning.handlers.handler_pattern_learning
      handler_module: omnimarket.nodes.node_projection_pattern_learning.handlers.handler_pattern_learning

terminal_event: onex.evt.omnimarket.projection-pattern-learning-applied.v1

# Golden path: pattern_learning chain (pattern-stored -> pattern_learning_artifacts table)
golden_path:
  - "Consume pattern-stored event from onex.evt.omniintelligence.pattern-stored.v1"
  - "Projection handler upserts row into pattern_learning_artifacts table"
  - "Dedup by pattern_id (UPSERT semantics)"
  - "Preserve existing scoring evidence when a sparse event arrives later"
  - "Emit projection-applied event to onex.evt.omnimarket.projection-pattern-learning-applied.v1"
  - "Verify row exists with pattern_id, pattern_name, correlation_id fields"
  - "Golden chain test: omnimarket/tests/test_golden_chain_pattern_learning.py"

db_io:
  db_tables:
    - name: pattern_learning_artifacts
      database_ref: application
      # OMN-15655 / operator ruling 2026-08-02 (house tenant): workload-
      # attributable rows live in the tenant domain; platform-own workloads
      # are the house tenant's rows. ADR-0027 classification, not a rename.
      schema: tenant
      migration: "0000_create_pattern_learning_artifacts.sql"
      # OMN-16690: this handler QUERIES this table (idempotency / lookup)
      # before writing. `access: write` is refused fail-closed at the
      # runtime read seam (ProjectionTableOperation._assert_read_declared),
      # which quarantines every event while the caller still sees a 202.
      # The declaration must cover what the handler actually does.
      access: read_write
      role: artifacts

event_bus:
  subscribe_topics:
    - onex.evt.omniintelligence.pattern-stored.v1
  publish_topics:
    - onex.evt.omnimarket.projection-pattern-learning-applied.v1

externally_consumed_topics:
  - onex.evt.omnimarket.projection-pattern-learning-applied.v1

projection_api:
  expose: true
  topic: "onex.snapshot.projection.pattern-learning.v1" # onex-topic-allow: projection snapshot topics use onex.snapshot.* prefix by convention
  table: "pattern_learning_artifacts"
  schema: "public"
  columns:
    - "pattern_id"
    - "pattern_name"
    - "pattern_type"
    - "language"
    - "lifecycle_state"
    - "composite_score"
    - "correlation_id"
    - "created_at"
    - "updated_at"
    - "projected_at"
  order_by: "updated_at DESC"
  freshness_column: "updated_at"
  limit: 100

metadata:
  transport_type: kafka
