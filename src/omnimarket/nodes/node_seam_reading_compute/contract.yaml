# ONEX Node Contract - Seam Reading Compute (OMN-21459)
#
# Pure compute: handle(ModelSeamReadingRequest) -> ModelSeamReadingResult. It takes readings and
# `now`, reads no clock, file, network or protocol, and so declares no protocol_dependencies.
# The seam nodes and the thresholds (config.seam_read) are read from the contract of
# node_seam_read_orchestrator.
name: node_seam_reading_compute
contract_name: node_seam_reading_compute
node_name: node_seam_reading_compute
contract_version: {major: 1, minor: 0, patch: 0}
node_version: {major: 1, minor: 0, patch: 0}
node_type: compute
lifecycle: experimental
runtime_profiles: [main]

description: >
  Render seam readings as lines, in the order of the factory line graph: a SEAM line per
  reading, then a line naming the seam when any crossing mismatched or when the reading is
  unreadable, empty or under the minimum crossings. A seam of the graph with no reading prints
  as unknown, never clean.

handler:
  module: omnimarket.nodes.node_seam_reading_compute.handlers.handler_seam_reading
  class: HandlerSeamReading
  input_model: omnimarket.nodes.node_seam_reading_compute.models.model_seam_reading_request.ModelSeamReadingRequest

handler_routing:
  routing_strategy: topic_pattern
  handlers:
    - operation: render_seam_readings
      topic: onex.cmd.omnimarket.seam-reading-render-requested.v1
      handler:
        name: HandlerSeamReading
        module: omnimarket.nodes.node_seam_reading_compute.handlers.handler_seam_reading
      event_model:
        name: ModelSeamReadingRequest
        module: omnimarket.nodes.node_seam_reading_compute.models.model_seam_reading_request
      input_model: omnimarket.nodes.node_seam_reading_compute.models.model_seam_reading_request.ModelSeamReadingRequest
      output_model: omnimarket.nodes.node_seam_reading_compute.models.model_seam_reading_request.ModelSeamReadingResult
    - operation: command_seam_reading
      topic: onex.evt.omnimarket.command-seam-facts.v1
      handler:
        name: HandlerCommandSeamReading
        module: omnimarket.nodes.node_seam_reading_compute.handlers.handler_command_seam_reading
      event_model:
        name: ModelCommandSeamFacts
        module: omnimarket.models.model_command_seam
      input_model: omnimarket.models.model_command_seam.ModelCommandSeamFacts
      output_model: omnimarket.models.model_command_seam.ModelCommandSeamReadings

descriptor:
  node_archetype: compute
  purity: pure
  idempotent: true
  side_effects: []
  timeout_ms: 2000

input_model:
  name: ModelSeamReadingRequest
  module: omnimarket.nodes.node_seam_reading_compute.models.model_seam_reading_request
  description: Seam readings and `now`.
output_model:
  name: ModelSeamReadingResult
  module: omnimarket.nodes.node_seam_reading_compute.models.model_seam_reading_request
  description: The rendered lines in line order.

terminal_event: onex.evt.omnimarket.seam-reading-rendered.v1

runtime_dispatch:
  invocation:
    mode: on_demand
    sender: operator via skill lean_contract_seams, lean_seam_read
    reason: Census found only an on-demand entry capability, with no verified automatic sender; explicitly retain
      operator invocation.
    evidence: seam-census/2026-11-05T0716Z/skill or person only
  command_topic: onex.cmd.omnimarket.seam-reading-render-requested.v1
  terminal_events:
    success: onex.evt.omnimarket.seam-reading-rendered.v1

event_bus:
  subscribe_topics:
    - onex.cmd.omnimarket.seam-reading-render-requested.v1
    - onex.evt.omnimarket.command-seam-facts.v1
  publish_topics:
    - onex.evt.omnimarket.seam-reading-rendered.v1
    - onex.evt.omnimarket.command-seam-readings.v1

externally_consumed_topics:
  - onex.evt.omnimarket.seam-reading-rendered.v1
  - onex.evt.omnimarket.command-seam-readings.v1

metadata:
  ticket: OMN-21459
  transport_type: kafka

published_events:
  - event_type: ModelSeamReadingResult
    topic: onex.evt.omnimarket.seam-reading-rendered.v1
  - event_type: ModelCommandSeamReadings
    topic: onex.evt.omnimarket.command-seam-readings.v1
