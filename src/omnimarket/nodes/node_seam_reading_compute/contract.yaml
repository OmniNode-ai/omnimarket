# ONEX Node Contract - Seam Reading Compute (OMN-21459)
#
# Pure compute: handle(ModelSeamReadingRequest) -> ModelSeamReadingResult. It takes readings and
# `now`, reads no clock, file, network or protocol, and so declares no protocol_dependencies.
# The seam nodes and the thresholds (config.seam_read) are read from the contract of
# node_seam_read_orchestrator.
name: node_seam_reading_compute
contract_name: node_seam_reading_compute
node_name: node_seam_reading_compute
contract_version: {major: 1, minor: 0, patch: 0}
node_version: {major: 1, minor: 0, patch: 0}
node_type: compute
lifecycle: experimental
runtime_profiles: [main]

description: >
  Render seam readings as lines, in the order of the factory line graph: a SEAM line per
  reading, then a line naming the seam when any crossing mismatched or when the reading is
  unreadable, empty or under the minimum crossings. A seam of the graph with no reading prints
  as unknown, never clean.

handler:
  module: omnimarket.nodes.node_seam_reading_compute.handlers.handler_seam_reading
  class: HandlerSeamReading
  input_model: omnimarket.nodes.node_seam_reading_compute.models.model_seam_reading_request.ModelSeamReadingRequest

handler_routing:
  routing_strategy: operation_match
  handlers:
    - operation: render_seam_readings
      topic: onex.cmd.omnimarket.seam-reading-render-requested.v1
      handler:
        name: HandlerSeamReading
        module: omnimarket.nodes.node_seam_reading_compute.handlers.handler_seam_reading
      input_model: omnimarket.nodes.node_seam_reading_compute.models.model_seam_reading_request.ModelSeamReadingRequest
      output_model: omnimarket.nodes.node_seam_reading_compute.models.model_seam_reading_request.ModelSeamReadingResult
    - operation: read_required_sender
      topic: onex.cmd.omnimarket.seam-required-sender-read-requested.v1
      handler:
        name: HandlerRequiredSender
        module: omnimarket.nodes.node_seam_reading_compute.handlers.handler_required_sender
      input_model: omnimarket.models.seam_reading.model_required_sender.ModelRequiredSenderRequest
      output_model: omnimarket.models.seam_reading.model_required_sender.ModelRequiredSenderResult
    - operation: append_seam_rows
      topic: onex.cmd.omnimarket.seam-rows-append-requested.v1
      handler:
        name: HandlerSeamRowAppend
        module: omnimarket.nodes.node_seam_reading_compute.handlers.handler_seam_row_append
      input_model: omnimarket.nodes.node_seam_reading_compute.models.model_seam_row.ModelSeamRowAppendRequest
      output_model: omnimarket.nodes.node_seam_reading_compute.models.model_seam_row.ModelSeamRowAppendResult

descriptor:
  node_archetype: compute
  purity: pure
  idempotent: true
  side_effects: []
  timeout_ms: 2000

input_model:
  name: ModelSeamReadingRequest
  module: omnimarket.nodes.node_seam_reading_compute.models.model_seam_reading_request
  description: Seam readings and `now`.
output_model:
  name: ModelSeamReadingResult
  module: omnimarket.nodes.node_seam_reading_compute.models.model_seam_reading_request
  description: The rendered lines in line order.

terminal_event: onex.evt.omnimarket.seam-reading-rendered.v1

runtime_dispatch:
  command_topic: onex.cmd.omnimarket.seam-reading-render-requested.v1
  terminal_events:
    success: onex.evt.omnimarket.seam-reading-rendered.v1

event_bus:
  subscribe_topics:
    - onex.cmd.omnimarket.seam-reading-render-requested.v1
  publish_topics:
    - onex.evt.omnimarket.seam-reading-rendered.v1

# OMN-22909: HandlerRequiredSender is pure and HandlerSeamRowAppend takes its row store as a
# constructor parameter (in-memory by default), so both run through answer_command, not
# handler_routing. The store has no update and no delete: a row whose key is stored with
# different content is refused as a rewrite.
topics:
  required_sender_read_requested: onex.cmd.omnimarket.seam-required-sender-read-requested.v1
  required_sender_read_completed: onex.evt.omnimarket.seam-required-sender-read-completed.v1
  required_sender_read_failed: onex.evt.omnimarket.seam-required-sender-read-failed.v1
  seam_rows_append_requested: onex.cmd.omnimarket.seam-rows-append-requested.v1
  seam_rows_append_started: onex.evt.omnimarket.seam-rows-append-started.v1
  seam_rows_appended: onex.evt.omnimarket.seam-rows-appended.v1
  seam_rows_refused: onex.evt.omnimarket.seam-rows-refused.v1

externally_consumed_topics:
  - onex.evt.omnimarket.seam-reading-rendered.v1
  - onex.evt.omnimarket.seam-required-sender-read-completed.v1
  - onex.evt.omnimarket.seam-required-sender-read-failed.v1
  - onex.evt.omnimarket.seam-rows-append-started.v1
  - onex.evt.omnimarket.seam-rows-appended.v1
  - onex.evt.omnimarket.seam-rows-refused.v1

metadata:
  ticket: OMN-21459
  transport_type: inmemory
