# ONEX Node Contract - Seam Classify Compute (OMN-21459)
#
# Pure compute: handle(ModelSeamClassifyRequest) -> ModelSeamClassifyResult. It takes facts and
# `now`, reads no clock, file, network or protocol, and so declares no protocol_dependencies.
# Created with operation_match routing and no seam operations (OMN-21459). OMN-21475 (T-S3)
# registers classify_sm_00 (backlog items against ModelBacklogItem) and the engine reads of
# classify_sm_01 and classify_sm_02; later seam readers add their operations here.
name: node_seam_classify_compute
contract_name: node_seam_classify_compute
node_name: node_seam_classify_compute
contract_version: {major: 1, minor: 0, patch: 0}
node_version: {major: 1, minor: 0, patch: 0}
node_type: compute
lifecycle: experimental
runtime_profiles: [main]

description: >
  Route a seam classify operation to its classifier. Registered: classify_sm_00 (ModelBacklogItem
  crossings), classify_sm_01 and classify_sm_02 (the model a lane ran against the adopted lane model
  policy); an unregistered operation refuses naming it.

handler:
  module: omnimarket.nodes.node_seam_classify_compute.handlers.handler_seam_classify
  class: HandlerSeamClassify
  input_model: omnimarket.nodes.node_seam_classify_compute.models.model_seam_classify_request.ModelSeamClassifyRequest

handler_routing:
  routing_strategy: operation_match
  handlers:
    - operation: classify_sm_00
      handler:
        name: HandlerSeamClassify
        module: omnimarket.nodes.node_seam_classify_compute.handlers.handler_seam_classify
    - operation: classify_sm_01
      handler:
        name: HandlerSeamClassify
        module: omnimarket.nodes.node_seam_classify_compute.handlers.handler_seam_classify
    - operation: classify_sm_02
      handler:
        name: HandlerSeamClassify
        module: omnimarket.nodes.node_seam_classify_compute.handlers.handler_seam_classify

descriptor:
  node_archetype: compute
  purity: pure
  idempotent: true
  side_effects: []
  timeout_ms: 2000

input_model:
  name: ModelSeamClassifyRequest
  module: omnimarket.nodes.node_seam_classify_compute.models.model_seam_classify_request
  description: A seam operation, the facts it classifies and `now`.
output_model:
  name: ModelSeamClassifyResult
  module: omnimarket.nodes.node_seam_classify_compute.models.model_seam_classify_request
  description: The seam readings the operation produced.

terminal_event: onex.evt.omnimarket.seam-classified.v1

runtime_dispatch:
  command_topic: onex.cmd.omnimarket.seam-classify-requested.v1
  terminal_events:
    success: onex.evt.omnimarket.seam-classified.v1

event_bus:
  subscribe_topics:
    - onex.cmd.omnimarket.seam-classify-requested.v1
  publish_topics:
    - onex.evt.omnimarket.seam-classified.v1

externally_consumed_topics:
  - onex.evt.omnimarket.seam-classified.v1

metadata:
  ticket: OMN-21459
  transport_type: inmemory
