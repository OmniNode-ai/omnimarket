#
# ONEX Node Contract
# Node: NodeDelegationOrchestrator
#
# Coordinates the delegation workflow: receive request -> invoke
# routing reducer -> dispatch to effect lane -> react to terminal
# lifecycle or legacy inference/gate path -> emit completion or failure.
#
# FSM States: RECEIVED -> ROUTED -> EXECUTING -> COMPLETED | FAILED
#
# Related Tickets:
#   - OMN-7040: Node-based delegation pipeline
name: "node_delegation_orchestrator"
contract_name: "node_delegation_orchestrator"
node_name: "node_delegation_orchestrator"
contract_version:
  major: 0
  minor: 4
  patch: 0
node_version:
  major: 0
  minor: 3
  patch: 0
node_type: "ORCHESTRATOR_GENERIC"
terminal_events:
  success: "onex.evt.omnibase-infra.delegation-completed.v1"
  failure: "onex.evt.omnibase-infra.delegation-failed.v1"
compatibility_publish_topics:
  - "onex.evt.omniclaude.task-delegated.v1"
description: >
  Orchestrator node that coordinates delegation through a correlation_id-keyed FSM: receive delegation request, invoke routing reducer, dispatch typed invocation commands to the selected effect lane, react to remote agent lifecycle events or the legacy inference and quality-gate path, then emit delegation-completed or delegation-failed. As of 0.2.0 (OMN-10792), exposes HandlerComplianceLoop as an in-process helper. As of 0.3.0 (OMN-10794), HandlerDelegationWorkflow invokes the loop per inference attempt when ModelDelegationRequest sets ``output_schema_key`` + ``compliance_budget``: validation failure with budget CONTINUE emits a fresh repair-prompt ModelInferenceIntent and stays in ROUTED (self-loop); compliant or budget ABORT forwards to the quality gate. tokens_to_compliance + compliance_attempts are accumulated across attempts and forwarded onto the terminal ModelDelegationResult and ModelTaskDelegatedEvent.

config_dependencies:
  - key: "INFERENCE_PROTOCOL_CONFIG_PATH"
    required: false
    description: "Optional override for typed provider request-shaping profiles (defaults to configs/inference_protocols.v1.yaml)."

input_model:
  name: "ModelDelegationRequest"
  module: "omnimarket.nodes.node_delegation_orchestrator.models"
  description: "Delegation command with prompt, task_type, and context."
output_model:
  name: "ModelDelegationResult"
  module: "omnimarket.nodes.node_delegation_orchestrator.models"
  description: "Delegation outcome with content, quality assessment, and metrics."
event_bus:
  version:
    major: 1
    minor: 0
    patch: 0
  plugin_managed: true
  subscribe_topics:
    - "onex.cmd.omnibase-infra.delegation-request.v1"
    - "onex.cmd.omnibase-infra.invocation.v1"
    - "onex.evt.omnibase-infra.routing-decision.v1"
    - "onex.evt.omnibase-infra.inference-response.v1"
    - "onex.evt.omnibase-infra.agent-task-lifecycle.v1"
    - "onex.evt.omnibase-infra.quality-gate-result.v1"
  publish_topics:
    - "onex.evt.omnibase-infra.delegation-completed.v1"
    - "onex.evt.omnibase-infra.delegation-failed.v1"
    - "onex.cmd.omnibase-infra.delegation-routing-request.v1"
    - "onex.cmd.omnibase-infra.remote-agent-invoke.v1"
    - "onex.cmd.omnibase-infra.delegation-inference-request.v1"
    - "onex.cmd.omnibase-infra.delegation-quality-gate-request.v1"
    - "onex.evt.omnibase-infra.inference-response.v1"
    - "onex.evt.omniclaude.task-delegated.v1"
    - "onex.cmd.omnibase-infra.baseline-comparison-request.v1"
    # OMN-13140: terminal escalation proof emitted at the escalation decision
    # point (quality-gate-recommends-fallback, or retryable-inference-error, with
    # a routable next tier). Consumed by node_delegation_routing_feedback_reducer.
    - "onex.evt.omnimarket.delegation-escalation-triggered.v1"
published_events:
  - event_type: "RoutingIntent"
    topic: "onex.cmd.omnibase-infra.delegation-routing-request.v1"
    description: "Intent emitted by orchestrator to invoke the routing reducer for a delegation request."
  - event_type: "InvocationCommand"
    topic: "onex.cmd.omnibase-infra.remote-agent-invoke.v1"
    description: "Typed invocation command dispatched by the orchestrator to the selected effect topic."
  - event_type: "InferenceIntent"
    topic: "onex.cmd.omnibase-infra.delegation-inference-request.v1"
    description: "Intent emitted by orchestrator to invoke LLM inference via the inference effect."
  - event_type: "QualityGateIntent"
    topic: "onex.cmd.omnibase-infra.delegation-quality-gate-request.v1"
    description: "Intent emitted by orchestrator to invoke the quality gate reducer."
  - event_type: "DelegationEvent"
    topic: "onex.evt.omnibase-infra.delegation-completed.v1"
    description: "Delegation pipeline terminal event (completed or failed, topic set per-instance)."
  - event_type: "TaskDelegatedEvent"
    topic: "onex.evt.omniclaude.task-delegated.v1"
    description: "Backward-compatible task-delegated event for omnidash projection."
  - event_type: "BaselineIntent"
    topic: "onex.cmd.omnibase-infra.baseline-comparison-request.v1"
    description: "Intent to trigger baseline cost comparison for savings tracking."
  # OMN-13140: maps the typed escalation event returned from the escalation
  # branches of HandlerDelegationWorkflow to its declared topic, so the runtime
  # DispatchResultApplier publishes it to the canonical escalation topic. The
  # event_type is the Model-prefix-stripped short class name the applier looks up.
  - event_type: "LlmDelegationEscalationTriggeredEvent"
    topic: "onex.evt.omnimarket.delegation-escalation-triggered.v1"
    description: "Terminal escalation event emitted when the orchestrator escalates a delegation to a higher routing tier (quality-gate fallback or retryable inference error)."
fsm:
  states:
    - RECEIVED
    - ROUTED
    - EXECUTING
    - INFERENCE_COMPLETED
    - GATE_EVALUATED
    - ESCALATING
    - COMPLETED
    - FAILED
  initial_state: RECEIVED
  terminal_states:
    - COMPLETED
    - FAILED
  transitions:
    - from: RECEIVED
      to: ROUTED
      trigger: "invocation command accepted"
    - from: ROUTED
      to: ROUTED
      trigger: "schema-compliance loop emits repair re-prompt (OMN-10794)"
    - from: ROUTED
      to: EXECUTING
      trigger: "agent lifecycle progress received"
    - from: ROUTED
      to: INFERENCE_COMPLETED
      trigger: "inference response received (loop accepted or budget aborted)"
    - from: EXECUTING
      to: COMPLETED
      trigger: "agent lifecycle completed"
    - from: EXECUTING
      to: FAILED
      trigger: "agent lifecycle failed"
    - from: INFERENCE_COMPLETED
      to: GATE_EVALUATED
      trigger: "quality gate result received"
    - from: GATE_EVALUATED
      to: ESCALATING
      trigger: "quality gate failed with fallback recommended and escalation budget remaining"
    - from: ESCALATING
      to: ROUTED
      trigger: "escalation tier selected, re-routing"
    - from: GATE_EVALUATED
      to: COMPLETED
      trigger: "quality gate passed"
    - from: GATE_EVALUATED
      to: FAILED
      trigger: "quality gate failed"
    # OMN-13473: reconciled handler-driven transitions. The imperative handler
    # (handler_delegation_workflow.py _VALID_TRANSITIONS) drives these three
    # ROUTED-origin edges that were previously undeclared. The contract is the
    # single source of truth, so they are added here rather than removed from
    # the handler — each is a real, reachable transition:
    - from: ROUTED
      to: ESCALATING
      trigger: "retryable inference infra-error on current tier with a routable next tier (OMN-13140; handle_inference_response)"
    - from: ROUTED
      to: FAILED
      trigger: "terminal inference failure with no escalation possible, or remote lifecycle FAILED received before EXECUTING (handle_inference_response / handle_agent_task_lifecycle)"
    - from: ROUTED
      to: COMPLETED
      trigger: "remote lifecycle COMPLETED received before any PROGRESS event reached EXECUTING (handle_agent_task_lifecycle)"
handler_routing:
  routing_strategy: "payload_type_match"
  handlers:
    - operation: "delegation.orchestrate"
      message_category: "command"
      handler:
        name: "HandlerDelegationWorkflow"
        module: "omnimarket.nodes.node_delegation_orchestrator.handlers.handler_delegation_workflow"
      event_model:
        name: "ModelDelegationRequest"
        module: "omnibase_core.models.delegation.wire"
      event_type: "omnibase-infra.delegation-request"
      description: "Receive a delegation request and emit the routing intent."
    - operation: "delegation.orchestrate.invocation"
      message_category: "command"
      handler:
        name: "HandlerDelegationWorkflow"
        module: "omnimarket.nodes.node_delegation_orchestrator.handlers.handler_delegation_workflow"
      event_model:
        name: "ModelInvocationCommand"
        module: "omnibase_core.models.delegation.model_invocation_command"
      event_type: "omnibase-infra.invocation"
      description: "Accept typed invocation commands on the delegation workflow."
    - operation: "delegation.orchestrate.routing"
      message_category: "event"
      handler:
        name: "HandlerDelegationWorkflow"
        module: "omnimarket.nodes.node_delegation_orchestrator.handlers.handler_delegation_workflow"
      event_model:
        name: "ModelRoutingDecision"
        module: "omnimarket.nodes.node_delegation_routing_reducer.models.model_routing_decision"
      event_type: "omnibase-infra.routing-decision"
      description: "Advance the workflow after model-routing selection."
    - operation: "delegation.orchestrate.inference"
      message_category: "event"
      handler:
        name: "HandlerDelegationWorkflow"
        module: "omnimarket.nodes.node_delegation_orchestrator.handlers.handler_delegation_workflow"
      event_model:
        name: "ModelInferenceResponseData"
        module: "omnibase_core.models.delegation.wire"
      event_type: "omnibase-infra.inference-response"
      description: "Advance the workflow after an LLM inference response."
    - operation: "delegation.orchestrate.lifecycle"
      message_category: "event"
      handler:
        name: "HandlerDelegationWorkflow"
        module: "omnimarket.nodes.node_delegation_orchestrator.handlers.handler_delegation_workflow"
      event_model:
        name: "ModelAgentTaskLifecycleEvent"
        module: "omnibase_core.models.delegation.model_agent_task_lifecycle_event"
      event_type: "omnibase-infra.agent-task-lifecycle"
      description: "Advance the workflow from remote-agent lifecycle events."
    - operation: "delegation.orchestrate.quality"
      message_category: "event"
      handler:
        name: "HandlerDelegationWorkflow"
        module: "omnimarket.nodes.node_delegation_orchestrator.handlers.handler_delegation_workflow"
      event_model:
        name: "ModelQualityGateResult"
        module: "omnimarket.nodes.node_delegation_quality_gate_reducer.models"
      event_type: "omnibase-infra.quality-gate-result"
      description: "Complete or fail the workflow after quality evaluation."
# PluginDelegation owns the Kafka subscription/result-applier lifecycle
# (event_bus.plugin_managed=true), while generic contract auto-wiring owns the
# dispatch route into HandlerDelegationWorkflow.handle(). All six subscribed
# topics route through that handler, which performs payload-type dispatch into
# the FSM methods declared by handler_routing. The legacy per-payload dispatcher
# classes are retained only for backward-compatible tests and are no longer the
# live wiring authority (OMN-12688, OMN-12724).
# HandlerComplianceLoop is intentionally omitted from handler_routing because it
# is invoked in-process by HandlerDelegationWorkflow per inference attempt. A
# handler_routing entry without an event_model becomes a catch-all bus route.
# Cross-repo topic ownership declarations.
# Topics published by this node that are consumed by nodes in other repos.
# The dependency-health sweep runs per-repo-root; these declarations suppress
# false-positive MISSING_TOPIC_EDGE findings for legitimate cross-repo wiring.
externally_consumed_topics:
  - "onex.cmd.omnibase-infra.remote-agent-invoke.v1"
  # Owner: omnibase_infra/node_remote_agent_invoke_effect
  # Runtime profile: runtime (A2A delegation bridge effect node)
  # OMN-11058: verified subscriber exists; classified intentionally_external

escalation:
  max_attempts: 10
  # OMN-13215: the shelled ``cli_agents`` tier was removed. Every tier — including
  # the ceiling (claude) — runs over the canonical HTTP inference path, so no tier
  # is excluded from escalation.
  excluded_tiers: []

error_handling:
  retry_policy:
    max_retries: 1
    initial_delay_ms: 1000
    max_delay_ms: 5000
    exponential_base: 2
    retry_on:
      - "InferenceTimeoutError"
  error_types:
    - name: "OrchestrationError"
      description: "Unexpected error during delegation orchestration"
      recoverable: false
    - name: "InferenceTimeoutError"
      description: "LLM inference did not respond within timeout"
      recoverable: true
    - name: "InvalidStateTransitionError"
      description: "Attempted invalid FSM state transition"
      recoverable: false
health_check:
  enabled: true
  endpoint: "/health"
  interval_seconds: 30
  checks:
    - name: "orchestrator_handler_loaded"
      type: "handler"
      critical: true
metadata:
  description: "Coordinates the full delegation workflow: routing, LLM inference, quality gate, and completion."
  demo_path: true  # OMN-12777: demo-path topic coherence gate scope marker
  author: "OmniNode Team"
  license: "MIT"
  created: "2026-03-30"
  tags:
    - orchestrator
    - delegation
    - fsm
    - workflow
    - llm
  related_tickets:
    - "OMN-7040"
