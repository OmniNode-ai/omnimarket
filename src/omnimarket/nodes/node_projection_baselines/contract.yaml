---
name: projection_baselines
contract_version: {major: 1, minor: 0, patch: 0}
node_type: reducer
node_version: {major: 1, minor: 0, patch: 0}
input_model: omnibase_infra.services.observability.baselines.models.model_baselines_snapshot_event.ModelBaselinesSnapshotEvent
description: >
  Projects baselines-computed events into 4 baselines tables
  (baselines_snapshots, baselines_comparisons, baselines_trend,
  baselines_breakdown) as a single transactional unit.
  Source topic: onex.evt.omnibase-infra.baselines-computed.v1.

handler:
  module: omnimarket.nodes.node_projection_baselines.handlers.handler_projection_baselines
  class: HandlerProjectionBaselines

handler_routing:
  routing_strategy: operation_match
  handlers:
    - operation: baselines_projection_runner
      handler:
        name: BaselinesProjectionRunner
        module: omnimarket.nodes.node_projection_baselines.handlers.handler_baselines
      handler_module: omnimarket.nodes.node_projection_baselines.handlers.handler_baselines
    - operation: projection_baselines
      handler:
        name: HandlerProjectionBaselines
        module: omnimarket.nodes.node_projection_baselines.handlers.handler_projection_baselines
      handler_module: omnimarket.nodes.node_projection_baselines.handlers.handler_projection_baselines
      event_model: omnibase_infra.services.observability.baselines.models.model_baselines_snapshot_event.ModelBaselinesSnapshotEvent

terminal_event: onex.evt.omnimarket.projection-baselines-applied.v1

db_io:
  db_tables:
    - name: baselines_snapshots
      database_ref: application
      schema: omninode_internal
      migration: "0001_create_baselines_tables.sql"
      access: write
      role: snapshots
    - name: baselines_comparisons
      database_ref: application
      schema: omninode_internal
      migration: "0002_realign_child_tables_to_producer_schema.sql"
      access: write
      role: comparisons
    - name: baselines_trend
      database_ref: application
      schema: omninode_internal
      migration: "0002_realign_child_tables_to_producer_schema.sql"
      access: write
      role: trend
    - name: baselines_breakdown
      database_ref: application
      schema: omninode_internal
      migration: "0002_realign_child_tables_to_producer_schema.sql"
      access: write
      role: breakdown

event_bus:
  subscribe_topics:
    - onex.evt.omnibase-infra.baselines-computed.v1
  publish_topics:
    - onex.evt.omnimarket.projection-baselines-applied.v1
  dlq_topics:
    - onex.dlq.omnimarket.projection-baselines-malformed.v1

externally_consumed_topics:
  - onex.evt.omnimarket.projection-baselines-applied.v1

metadata:
  transport_type: kafka
