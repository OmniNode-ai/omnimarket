name: node_operator_item_render_compute
node_type: COMPUTE_GENERIC
runtime_profiles:
- main
contract_version:
  major: 0
  minor: 1
  patch: 0
node_version: 0.1.0
lifecycle: experimental
description: Pure exhaustive open-item block, grouped by owner and ordered by oldest item within each group. An
  unread source is UNKNOWN, never empty.
input_model:
  name: ModelOperatorItemRenderRequest
  module: omnimarket.models.model_operator_item_render
output_model:
  name: ModelOperatorItemRenderResult
  module: omnimarket.models.model_operator_item_render
handler:
  module: omnimarket.nodes.node_operator_item_render_compute.handlers.handler_operator_item_render
  class: HandlerOperatorItemRender
  input_model: omnimarket.models.model_operator_item_render.ModelOperatorItemRenderRequest
  output_model: omnimarket.models.model_operator_item_render.ModelOperatorItemRenderResult
handler_routing:
  routing_strategy: operation_match
  default_handler: omnimarket.nodes.node_operator_item_render_compute.handlers.handler_terminal:HandlerOperatorItemRender
  handlers:
  - operation: render_operator_items
    topic: onex.cmd.omnimarket.operator-item-render-requested.v1
    handler:
      name: HandlerOperatorItemRender
      module: omnimarket.nodes.node_operator_item_render_compute.handlers.handler_terminal
entrypoint:
  name: NodeOperatorItemRenderCompute
  module: omnimarket.nodes.node_operator_item_render_compute.node
terminal_event: onex.evt.omnimarket.operator-item-render-completed.v1
runtime_dispatch:
  command_topic: onex.cmd.omnimarket.operator-item-render-requested.v1
  terminal_events:
    success: onex.evt.omnimarket.operator-item-render-completed.v1
    failure: onex.evt.omnimarket.operator-item-render-failed.v1
event_bus:
  subscribe_topics:
  - onex.cmd.omnimarket.operator-item-render-requested.v1
  publish_topics:
  - onex.evt.omnimarket.operator-item-render-completed.v1
  - onex.evt.omnimarket.operator-item-render-failed.v1
descriptor:
  node_archetype: compute
  purity: pure
  idempotent: true
  timeout_ms: 5000
config:
  words_chars: 160
  age_limit_minutes: 60
  closed_states:
  - done
  new_states:
  - new
dod_evidence:
  PYTEST:
    command: uv run pytest tests/nodes/node_operator_item_render_compute/test_item_render.py -k item_render -q
    pass_criteria: every test passes
externally_consumed_topics:
- onex.evt.omnimarket.operator-item-render-completed.v1
- onex.evt.omnimarket.operator-item-render-failed.v1
