name: projection_skill_lifecycle
version: "1.0.0"
description: "One skill_executions row per skill-started or skill-completed event, keyed on a replay-stable event id."
omnibase_core_compat: ">=0.39.0,<1.0.0"
capabilities:
  standalone: true
  full_runtime: true
  requires_network: true
  requires_secrets: true
  side_effect_class: write_db
dependencies:
  - "omnibase_core>=0.39.0"
  - "pyyaml>=6.0"
tags: [projection, skill, lifecycle, reducer]
ownership:
  skill_executions:
    ddl_owner: omnimarket.nodes.node_projection_skill_lifecycle
    table_role: projection_read_model
    create_migration: "migrations/0001_create_skill_executions.sql"
    duplicate_migration_policy: forbid_cross_repo_create_table
    non_owner_repos: [omnibase_infra]
    rationale: "omnimarket owns the projection; omnibase_infra vendors and applies its migrations."
pack: "data"
display_name: "Projection: Skill Lifecycle"
node_role: "effect"
