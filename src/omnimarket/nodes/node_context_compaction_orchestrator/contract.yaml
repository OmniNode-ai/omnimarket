---
name: node_context_compaction_orchestrator
contract_version: {major: 1, minor: 0, patch: 0}
node_type: orchestrator
node_version: {major: 1, minor: 0, patch: 0}
lifecycle: experimental
description: >
  Answers a compaction command by publishing a context-pack command on the bus
  for the compaction_orchestrator profile. The command's id correlates the
  completed or failed reply. One monotonic deadline covers the barrier, request
  publication and reply wait; late packages fall back natively without activation.
  The revision probe must match the requested session and barrier before publishing. A built package is published as prepared, receives a fresh activation_id
  on its identity trailer, and is replied as install after the activated receipt.
  An unset tenant or unwired transport falls back pack_builder_unavailable.
  The existing barrier wait reads committed sequence stamps from both session
  projections; its recorded timestamp supplies ledger and session source revisions.
  The runtime binding injects the projection probe's read adapters explicitly from
  the package's projection read boundary; the handler never imports a database
  driver or another node's handler (OMN-21372, OMN-21099).
  Receipts carry identities and timings; the restricted package reply carries content.

handler_routing:
  routing_strategy: payload_type_match
  handlers:
    - operation: context_compaction.orchestrate.requested
      message_category: command
      handler:
        name: HandlerContextCompactionOrchestrator
        module: omnimarket.nodes.node_context_compaction_orchestrator.handlers.handler_context_compaction_orchestrator
      event_model:
        name: ModelContextCompactionRequested
        module: omnimarket.models.context_compaction.model_context_compaction_requested
      topic: onex.cmd.omniintelligence.context-compaction-requested.v1
      description: "Build the compaction package, or fall back to native compaction with a typed receipt."

handler:
  module: omnimarket.nodes.node_context_compaction_orchestrator.handlers.handler_context_compaction_orchestrator
  class: HandlerContextCompactionOrchestrator
  input_model: omnimarket.models.context_compaction.model_context_compaction_requested.ModelContextCompactionRequested
  output_model: omnimarket.models.context_compaction.model_context_compaction_result.ModelContextCompactionResult

descriptor:
  node_archetype: orchestrator
  purity: effectful
  idempotent: false
  timeout_ms: 60000
  runtime_profiles: [effects]

dependencies:
  - name: node_context_pack_orchestrator
    type: node
    optional: false
  - name: node_projection_claude_hook_events
    type: node
    optional: false
  - name: node_projection_session_content
    type: node
    optional: false

# Runtime ports are bound from this contract (OMN-21334, TA.11b).
# Barrier probe read adapters come from the projection read boundary (OMN-21372, OMN-21099).
compaction_runtime:
  # Tenants are overlay data, as for the context sources: the deploy overlay sets it.
  # Unset leaves the pack build unbound, so every command falls back pack_builder_unavailable.
  tenant_id: "${env.ONEX_CONTEXT_SOURCE_TENANT_ID:}"
  barrier_wait:
    deadline_s: 30.0
    poll_interval_s: 0.5
    probe:
      dsn_env: OMNINODE_INTERNAL_DB_URL
      lineage_relation: omninode_internal.claude_hook_events
      content_relation: omninode_internal.session_content
      statement_timeout_ms: 1000

db_io:
  db_tables:
    - name: claude_hook_events
      database_ref: application
      schema: omninode_internal
      migration: "0000_create_claude_hook_events.sql"
      access: read
      role: session_lineage_barrier
    - name: session_content
      database_ref: application
      schema: omninode_internal
      migration: "0001_create_session_content.sql"
      access: read
      role: session_content_barrier

inputs:
  invocation_id:
    type: str
    required: true
  session_id:
    type: str
    required: true
  cwd:
    type: str
    required: true
  trigger:
    type: str
    enum: [manual, auto, precompute]
  input_messages_hash:
    type: str
    required: true
  newest_turn:
    type: str
    required: false
    nullable: true
  compact_model:
    type: str
    required: false
    nullable: true
  barrier_id:
    type: str
    required: false
    nullable: true

outputs:
  reply:
    type: object
  prepared:
    type: object
    required: false
    nullable: true
  activated:
    type: object
    required: false
    nullable: true
  fallback:
    type: object
    required: false
    nullable: true

event_bus:
  subscribe_topics:
    - onex.cmd.omniintelligence.context-compaction-requested.v1
  publish_topics:
    - onex.cmd.omniintelligence.context-pack-requested.v1
    - onex.cmd.omniintelligence.context-compaction-package.v1
    - onex.evt.omnimarket.context-compaction-prepared.v1
    - onex.evt.omnimarket.context-compaction-activated.v1
    - onex.evt.omnimarket.context-compaction-fallback.v1
  request_response:
    instances:
      - name: compaction_pack_build
        request_topic: onex.cmd.omniintelligence.context-pack-requested.v1
        reply_topics:
          completed: onex.cmd.omniintelligence.context-pack-built.v1
          failed: onex.cmd.omniintelligence.context-pack-failed.v1
        correlation: {location: body, field: correlation_id}
        timeout_seconds: 30

# The runtime publishes each event the handler returns on the topic its row
# names for the class (event_type is the class name minus its Model prefix):
# prepared then activated then the install reply, or fallback then the native
# reply. Only the package reply carries content.
published_events:
  - event_type: ContextCompactionPrepared
    topic: onex.evt.omnimarket.context-compaction-prepared.v1
    description: "One deterministic assembly: candidate_id, assembly_hash, version vector and profile identity."
  - event_type: ContextCompactionActivated
    topic: onex.evt.omnimarket.context-compaction-activated.v1
    description: "This invocation offered this candidate: activation_id, model and final hashes, installed_messages_hash."
  - event_type: ContextCompactionFallback
    topic: onex.evt.omnimarket.context-compaction-fallback.v1
    description: "A failure before activation: invocation_id and the failure class."
  - event_type: ContextCompactionPackageReply
    topic: onex.cmd.omniintelligence.context-compaction-package.v1
    description: "The adapter's reply, correlated by invocation_id: install with the messages, or native."

externally_consumed_topics:
  - onex.cmd.omniintelligence.context-compaction-package.v1
  - onex.evt.omnimarket.context-compaction-prepared.v1
  - onex.evt.omnimarket.context-compaction-activated.v1
  - onex.evt.omnimarket.context-compaction-fallback.v1

metadata:
  transport_type: kafka

runtime_dispatch:
  command_topic: onex.cmd.omniintelligence.context-compaction-requested.v1
  terminal_events:
    success: onex.cmd.omniintelligence.context-compaction-package.v1

terminal_event: onex.cmd.omniintelligence.context-compaction-package.v1
