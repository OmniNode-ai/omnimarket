name: node_ledger_reconcile_compute
version: 0.1.0
description: Decide a ledger reconciliation from supplied facts - parse the rolling
  ledger, pair CLAIM rows with their closers, bind cited evidence, give dangling claims
  and stale HOLDs their verdicts and compose the closing rows and the report.
omnibase_core_compat: '>=0.47.31,<0.48.0'
entry_points:
  onex.nodes:
    node_ledger_reconcile_compute: omnimarket.nodes.node_ledger_reconcile_compute
capabilities:
  standalone: true
  full_runtime: false
  requires_network: false
  requires_repo: false
  requires_secrets: false
  requires_docker: false
  side_effect_class: none
dependencies:
- pydantic>=2.0
license: MIT
authors:
- OmniNode Team
tags:
- compute
- ledger
- reconcile
pack: operator_tooling
display_name: Ledger Reconcile Compute
node_role: compute
