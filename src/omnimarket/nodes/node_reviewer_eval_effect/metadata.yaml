name: node_reviewer_eval_effect
version: "1.0.0"
description: "Scores the hostile reviewer's recall and false-block rate on an eval set from recorded history"
omnibase_core_compat: ">=0.47.0,<0.48.0"
entry_points:
  onex.nodes:
    node_reviewer_eval_effect: "omnimarket.nodes.node_reviewer_eval_effect"
capabilities:
  standalone: true
  full_runtime: false
  requires_network: false
  requires_repo: false
  requires_secrets: false
  requires_docker: false
  side_effect_class: event_publish
dependencies:
  - "omnibase_core>=0.47.0"
  - "pydantic>=2.0"
  - "pyyaml>=6.0"
  - "aiokafka>=0.10.0"
  - "omnibase-infra>=0.32.0"
authors: ["OmniNode Platform Team"]
license: "MIT"
tags: ["effect", "review", "hostile-reviewer", "evaluation"]
pack: "review"
display_name: "Reviewer Eval Effect"
node_role: "effect"
