# ONEX Node Contract - Operator Capture Compute (OMN-20905, OMN-20906, OMN-20907)
#
# Pure decisions, called in process by node_operator_capture_effect (as the PR
# handoff orchestrator calls its decision compute). No clock, no file, no network:
# every request carries the text, the ledger rows and the time it is judged at.
#
#   classify_utterance   one operator message -> items (decision, ask, idea,
#                        preference, status question), from the delegated
#                        model's answer when it is valid whole, else the
#                        deterministic fallback; machine injections -> none
#   build_capture_rows   items -> one ledger STATUS row each, verbatim words
#   detect_ruling_drift  a decision -> the earlier rulings it re-rules
#   fold_open_asks       ledger rows -> open asks and the session digest
#   guard_dispatch       a main-session dispatch -> allow, or refuse when the
#                        newest operator message has no capture record
name: "node_operator_capture_compute"
node_type: "COMPUTE_GENERIC"
contract_version:
  major: 0
  minor: 1
  patch: 0
node_version: "0.1.0"
description: "Pure decisions of the operator capture: classify, rows, drift, open asks, dispatch guard."
lifecycle: experimental
input_model:
  name: "ModelUtteranceClassifyRequest"
  module: "omnimarket.models.operator_capture"
  description: "One operator message and the delegated model's raw answer, if any."
output_model:
  name: "ModelUtteranceClassification"
  module: "omnimarket.models.operator_capture"
  description: "The message's items, who classified them and why."
runtime_dispatch:
  command_topic: "onex.cmd.omnimarket.operator-capture-decision-requested.v1"
  terminal_events:
    success: "onex.evt.omnimarket.operator-capture-decision-completed.v1"
    failure: "onex.evt.omnimarket.operator-capture-decision-failed.v1"
descriptor:
  node_archetype: compute
  purity: pure
  idempotent: true
  timeout_ms: 1000
handler_routing:
  routing_strategy: "operation_match"
  handlers:
    - operation: "classify_utterance"
      handler:
        name: "HandlerUtteranceClassify"
        module: "omnimarket.nodes.node_operator_capture_compute.handlers.handler_utterance_classify"
    - operation: "build_capture_rows"
      handler:
        name: "HandlerCaptureRows"
        module: "omnimarket.nodes.node_operator_capture_compute.handlers.handler_capture_rows"
    - operation: "detect_ruling_drift"
      handler:
        name: "HandlerRulingDrift"
        module: "omnimarket.nodes.node_operator_capture_compute.handlers.handler_ruling_drift"
    - operation: "fold_open_asks"
      handler:
        name: "HandlerOpenAsks"
        module: "omnimarket.nodes.node_operator_capture_compute.handlers.handler_open_asks"
    - operation: "guard_dispatch"
      handler:
        name: "HandlerDispatchCaptureGuard"
        module: "omnimarket.nodes.node_operator_capture_compute.handlers.handler_dispatch_capture_guard"
dod_evidence:
  PYTEST:
    description: "operator capture decisions on this week's sample messages, closure, drift and the guard"
    command: "uv run pytest tests/unit/nodes/node_operator_capture_compute -q"
    pass_criteria: "every handler test passes"
metadata:
  description: "Operator capture decisions"
  author: "OmniNode Team"
  created: "2026-10-10"
  tags:
    - "compute"
    - "operator-capture"
    - "work-ledger"
