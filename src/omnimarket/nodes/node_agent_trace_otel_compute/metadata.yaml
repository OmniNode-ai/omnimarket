name: node_agent_trace_otel_compute
version: 0.1.0
description: Converts the recorded log of one headless agent run into an OpenTelemetry GenAI trace (tool calls, results, final message) and an MCP-style tools list.
omnibase_core_compat: '>=0.39.0,<1.0.0'
entry_points:
  onex.nodes:
    node_agent_trace_otel_compute: omnimarket.nodes.node_agent_trace_otel_compute
