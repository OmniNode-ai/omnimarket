# Synthetic values. The deployment's overlay lives at <root>/node_dev_deploy_reading_effect/overlay.yaml
# under a root named in ONEX_SKILL_OVERLAY_ROOTS. No key has a default.
ledger_append:
  command_env: ONEX_LEDGER_BUS_APPEND_COMMAND
  host_env: ONEX_LEDGER_HOST_NAME
  timeout_seconds: 90
publish:
  lane: dev-deploy-reading
  actor: node:node_dev_deploy_reading_effect
  piece: 11
  publish_max_age_seconds: 7200
thresholds:
  required_lane: example-lane
  receipt_deadline_seconds: 3600
  probe_max_age_seconds: 86400
merges:
  clone_path_env: EXAMPLE_RUNTIME_CLONE
  ref: origin/dev
  lookback_seconds: 86400
  runtime_path_globs:
    - src/**
    - docker/**
  git_timeout_seconds: 60
receipts:
  projection_url: http://store.example.invalid/projection-api/projection/example-topic
  timeout_seconds: 10
probe:
  health_url: http://runtime.example.invalid/health
  health_ok_path: [details, healthy]
  ssh_host_env: EXAMPLE_RUNTIME_SSH_HOST
  compose_project: example-project
  provenance_service: example-runtime
  provenance_path: /app/build-provenance.json
  sha_path: [vcs_ref]
  timeout_seconds: 30
# The drill verb adds this runtime-affecting merge, which no receipt covers, and writes the row as a drill row.
drill_fault:
  synthetic_merge_sha: dddddddddddddddddddddddddddddddddddddddd
  age_seconds: 7200
injected_fault: No PASS receipt within an hour of a runtime-affecting merge, or the probe saw another sha
schedule_units:
  unit_name: example-dev-deploy-reading
  drill_unit_name: example-dev-deploy-reading-drill
schedule_hosts:
  - name: example-host
    scheduler: systemd-user
    venv: omnimarket/.venv
unit_environment:
  ONEX_LEDGER_HOST_NAME: example-host
