name: node_delivery_path_reducer
version: 1.0.0
description: Fold the events of one delivery path into its state; a path reaches verified only when the install receipt names the current tag and target.
pack: operator_tooling
node_role: reducer
display_name: Delivery Path Reducer
omnibase_core_compat: '>=0.39.0,<1.0.0'
entry_points:
  onex.nodes:
    node_delivery_path_reducer: omnimarket.nodes.node_delivery_path_reducer
capabilities:
  standalone: true
  full_runtime: false
  requires_network: false
  requires_repo: false
  requires_secrets: false
  requires_docker: false
  side_effect_class: none
dependencies:
- pydantic>=2.0
- pyyaml>=6.0
authors:
- OmniNode Platform Team
license: MIT
tags:
- reducer
- delivery
- tag-delivery
