---
# SPDX-FileCopyrightText: 2026 OmniNode.ai Inc.
# SPDX-License-Identifier: MIT
name: node_swarm_dispatch_orchestrator
contract_name: node_swarm_dispatch_orchestrator
node_name: node_swarm_dispatch_orchestrator
contract_version: {major: 1, minor: 0, patch: 0}
node_version: {major: 1, minor: 0, patch: 0}
node_type: orchestrator
description: >
  FSM orchestrator for swarm dispatch. Coordinates health check, decomposition,
  endpoint selection, fan-out, and aggregation through command/event pairs.
  Pure coordination — all I/O delegated to effect nodes.

handler:
  name: HandlerSwarmDispatchOrchestrator
  module: omnimarket.nodes.node_swarm_dispatch_orchestrator.handlers.handler_swarm_dispatch
  class: HandlerSwarmDispatchOrchestrator

handler_routing:
  routing_strategy: topic_match
  handlers:
    - topic: onex.cmd.omnimarket.swarm-dispatch.v1
      operation: swarm_dispatch_orchestrator
      handler:
        name: HandlerSwarmDispatchOrchestrator
        module: omnimarket.nodes.node_swarm_dispatch_orchestrator.handlers.handler_swarm_dispatch
      event_model:
        name: ModelSwarmDispatchRequest
        module: omnimarket.nodes.node_swarm_dispatch_orchestrator.models.model_swarm_dispatch_request
      message_category: "COMMAND"
      event_type: "omnimarket.swarm-dispatch"
    # OMN-18013: the fsm.events entry declared no `topic:`, so
    # _topics_for_handler_entry gave it EVERY subscribe topic including the .cmd.
    # one, and the entry's single category is stamped on all of them. One entry per
    # phase-completion EVENT instead, each naming its own topic and category.
    - topic: onex.evt.omnimarket.swarm-endpoint-health-completed.v1
      message_category: "EVENT"
      operation: "fsm.events"
      handler:
        name: HandlerSwarmDispatchOrchestrator
        module: omnimarket.nodes.node_swarm_dispatch_orchestrator.handlers.handler_swarm_dispatch
    - topic: onex.evt.omnimarket.swarm-decomposition-completed.v1
      message_category: "EVENT"
      operation: "fsm.events"
      handler:
        name: HandlerSwarmDispatchOrchestrator
        module: omnimarket.nodes.node_swarm_dispatch_orchestrator.handlers.handler_swarm_dispatch
    - topic: onex.evt.omnimarket.swarm-endpoints-selected.v1
      message_category: "EVENT"
      operation: "fsm.events"
      handler:
        name: HandlerSwarmDispatchOrchestrator
        module: omnimarket.nodes.node_swarm_dispatch_orchestrator.handlers.handler_swarm_dispatch
    - topic: onex.evt.omnimarket.swarm-fanout-completed.v1
      message_category: "EVENT"
      operation: "fsm.events"
      handler:
        name: HandlerSwarmDispatchOrchestrator
        module: omnimarket.nodes.node_swarm_dispatch_orchestrator.handlers.handler_swarm_dispatch
    - topic: onex.evt.omnimarket.swarm-aggregation-completed.v1
      message_category: "EVENT"
      operation: "fsm.events"
      handler:
        name: HandlerSwarmDispatchOrchestrator
        module: omnimarket.nodes.node_swarm_dispatch_orchestrator.handlers.handler_swarm_dispatch

descriptor:
  node_archetype: orchestrator
  purity: effectful
  idempotent: false
  timeout_ms: 900000
  runtime_profiles: [effects]

event_bus:
  version: {major: 1, minor: 0, patch: 0}
  plugin_managed: false
  subscribe_topics:
    - onex.cmd.omnimarket.swarm-dispatch.v1
    - onex.evt.omnimarket.swarm-endpoint-health-completed.v1
    - onex.evt.omnimarket.swarm-decomposition-completed.v1
    - onex.evt.omnimarket.swarm-endpoints-selected.v1
    - onex.evt.omnimarket.swarm-fanout-completed.v1
    - onex.evt.omnimarket.swarm-aggregation-completed.v1
  publish_topics:
    - onex.cmd.omnimarket.swarm-check-endpoint-health.v1
    - onex.cmd.omnimarket.swarm-decompose.v1
    - onex.cmd.omnimarket.swarm-select-endpoints.v1
    - onex.cmd.omnimarket.swarm-fanout.v1
    - onex.cmd.omnimarket.swarm-aggregate.v1
    - onex.evt.omnimarket.swarm-dispatch-completed.v1
    - onex.evt.omnimarket.swarm-dispatch-failed.v1

terminal_event: onex.evt.omnimarket.swarm-dispatch-completed.v1

externally_consumed_topics:
  - onex.evt.omnimarket.swarm-dispatch-completed.v1
  - onex.evt.omnimarket.swarm-dispatch-failed.v1

published_events:
  - event_type: SwarmDispatchCompleted
    topic: onex.evt.omnimarket.swarm-dispatch-completed.v1
    description: Swarm dispatch completed successfully with aggregated output.
  - event_type: SwarmDispatchFailed
    topic: onex.evt.omnimarket.swarm-dispatch-failed.v1
    description: Swarm dispatch failed at some FSM stage.

state_machine:
  version: {major: 1, minor: 0, patch: 0}
  state_machine_name: swarm_dispatch_orchestrator
  state_machine_version: {major: 1, minor: 0, patch: 0}
  description: "Swarm dispatch run, one transition per consumed response topic (_TOPIC_TRANSITION_MAP), persisted per run_id. transition_failed moves any non-terminal state to FAILED."
  initial_state: RECEIVED
  terminal_states: [COMPLETED, FAILED]
  error_states: [FAILED]
  states:
    - version: {major: 1, minor: 0, patch: 0}
      state_name: RECEIVED
      state_type: operational
      description: "Dispatch command received; health check queued."
    - version: {major: 1, minor: 0, patch: 0}
      state_name: HEALTH_CHECKED
      state_type: operational
      description: "Endpoint health received."
    - version: {major: 1, minor: 0, patch: 0}
      state_name: DECOMPOSED
      state_type: operational
      description: "Task decomposed into subtasks."
    - version: {major: 1, minor: 0, patch: 0}
      state_name: ENDPOINTS_SELECTED
      state_type: operational
      description: "Endpoints chosen per subtask."
    - version: {major: 1, minor: 0, patch: 0}
      state_name: DISPATCHING
      state_type: operational
      description: "Fan-out published."
    - version: {major: 1, minor: 0, patch: 0}
      state_name: AGGREGATING
      state_type: operational
      description: "Results received for aggregation."
    - version: {major: 1, minor: 0, patch: 0}
      state_name: COMPLETED
      state_type: terminal
      description: "Terminal completed event published."
      is_terminal: true
      is_recoverable: false
    - version: {major: 1, minor: 0, patch: 0}
      state_name: FAILED
      state_type: terminal
      description: "Terminal failed event published."
      is_terminal: true
      is_recoverable: false
  transitions:
    # endpoint-health-completed
    - version: {major: 1, minor: 0, patch: 0}
      transition_name: received_to_health_checked
      from_state: RECEIVED
      to_state: HEALTH_CHECKED
      trigger: endpoint_health_completed
    # decomposition-completed
    - version: {major: 1, minor: 0, patch: 0}
      transition_name: health_checked_to_decomposed
      from_state: HEALTH_CHECKED
      to_state: DECOMPOSED
      trigger: decomposition_completed
    # endpoints-selected
    - version: {major: 1, minor: 0, patch: 0}
      transition_name: decomposed_to_endpoints_selected
      from_state: DECOMPOSED
      to_state: ENDPOINTS_SELECTED
      trigger: endpoints_selected
    # fanout-completed
    - version: {major: 1, minor: 0, patch: 0}
      transition_name: endpoints_selected_to_dispatching
      from_state: ENDPOINTS_SELECTED
      to_state: DISPATCHING
      trigger: fanout_completed
    # aggregation-completed
    - version: {major: 1, minor: 0, patch: 0}
      transition_name: dispatching_to_aggregating
      from_state: DISPATCHING
      to_state: AGGREGATING
      trigger: aggregation_completed
    # terminal
    - version: {major: 1, minor: 0, patch: 0}
      transition_name: aggregating_to_completed
      from_state: AGGREGATING
      to_state: COMPLETED
      trigger: terminal
    # OMN-19548: FAILED was declared with no edge into it. transition_failed
    # ("Any state -> FAILED") takes these edges; in production only the
    # RECEIVED edge has a caller (handle_async), because route_event raises instead
    # of failing the run. That gap is recorded on OMN-19548.
    - version: {major: 1, minor: 0, patch: 0}
      transition_name: received_to_failed
      from_state: RECEIVED
      to_state: FAILED
      trigger: run_failed
    - version: {major: 1, minor: 0, patch: 0}
      transition_name: health_checked_to_failed
      from_state: HEALTH_CHECKED
      to_state: FAILED
      trigger: run_failed
    - version: {major: 1, minor: 0, patch: 0}
      transition_name: decomposed_to_failed
      from_state: DECOMPOSED
      to_state: FAILED
      trigger: run_failed
    - version: {major: 1, minor: 0, patch: 0}
      transition_name: endpoints_selected_to_failed
      from_state: ENDPOINTS_SELECTED
      to_state: FAILED
      trigger: run_failed
    - version: {major: 1, minor: 0, patch: 0}
      transition_name: dispatching_to_failed
      from_state: DISPATCHING
      to_state: FAILED
      trigger: run_failed
    - version: {major: 1, minor: 0, patch: 0}
      transition_name: aggregating_to_failed
      from_state: AGGREGATING
      to_state: FAILED
      trigger: run_failed

metadata:
  transport_type: kafka
  author: OmniNode Team
  license: MIT
  created: "2026-05-24"
  tags: [orchestrator, swarm, dispatch, fsm, OMN-11814]
  related_tickets:
    - "OMN-11814"

runtime_dispatch:
  # OMN-18013 -- the CLI/skill dispatcher is this node's producer. Declared so it is not inferred from subscribe_topics[0].
  command_topic: onex.cmd.omnimarket.swarm-dispatch.v1
