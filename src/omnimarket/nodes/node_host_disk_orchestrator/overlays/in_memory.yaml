# Default profile (OMN-23866): synthetic values only. A deployment's overlay lives at
# <root>/node_host_disk_orchestrator/overlay.yaml under a root named in ONEX_SKILL_OVERLAY_ROOTS. Practice mode stays
# true until the host disk effect (the next step) is installed and read back.
job_id: host_disk
run_interval_seconds: 3600
grace_seconds: 600
practice_mode: true
result_deadline_seconds: 300
alarm_channel: CEXAMPLE0001
max_hosts: 256
max_open_runs: 16
