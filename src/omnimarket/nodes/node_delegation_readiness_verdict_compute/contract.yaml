# ONEX Node Contract - Delegation Readiness Verdict Compute (OMN-23181, readiness plan A2)
#
# Pure: handle(ModelReadinessVerdictRequest) -> ModelReadinessVerdict. node_delegation_readiness_verdict_effect reads the
# scenarios' recorded results from the ledger and publishes this node's verdict.
name: node_delegation_readiness_verdict_compute
contract_name: node_delegation_readiness_verdict_compute
node_name: node_delegation_readiness_verdict_compute
contract_version: {major: 0, minor: 1, patch: 0}
node_version: {major: 0, minor: 1, patch: 0}
node_type: compute
lifecycle: experimental
runtime_profiles: [main]

description: >
  Decides whether the delegation suite is shippable. PASS only when, for every declared scenario, the consecutive green
  UTC days reach the requested bar, no slot failed today (UTC), and the latest due slot (the slot that contains now minus
  the cadence's grace) has a successful scheduled run. A due slot with no run is red, a manual run never fills a slot, a
  history that was not read to its end makes every scenario red, and a scenario with no rows is red. The bar and the
  grace are request parameters. No clock read, no state, no I/O.

handler:
  module: omnimarket.nodes.node_delegation_readiness_verdict_compute.handlers.handler_readiness_verdict
  class: HandlerReadinessVerdict
  input_model: omnimarket.models.model_delegation_readiness_verdict.ModelReadinessVerdictRequest

handler_routing:
  routing_strategy: operation_match
  handlers:
    - operation: compute_readiness_verdict
      handler:
        name: HandlerReadinessVerdict
        module: omnimarket.nodes.node_delegation_readiness_verdict_compute.handlers.handler_readiness_verdict
      input_model: omnimarket.models.model_delegation_readiness_verdict.ModelReadinessVerdictRequest
      output_model: omnimarket.models.model_delegation_readiness_verdict.ModelReadinessVerdict

descriptor:
  node_archetype: compute
  purity: pure
  idempotent: true
  timeout_ms: 5000

input_model:
  name: ModelReadinessVerdictRequest
  module: omnimarket.models.model_delegation_readiness_verdict
  description: The scenario history, the green-day bar and the due-slot grace per cadence.
output_model:
  name: ModelReadinessVerdict
  module: omnimarket.models.model_delegation_readiness_verdict
  description: PASS or FAIL, one row per scenario and every miss.

terminal_event: onex.evt.omnimarket.delegation-readiness-verdict-computed.v1

runtime_dispatch:
  command_topic: onex.cmd.omnimarket.delegation-readiness-verdict-compute-requested.v1

# OMN-19998: the declared broker grants for the topics this contract's event_bus lists (the permission coverage check, OMN-24005).
# The principal is the dev runtime's login, read from the environment where the reconcile runs; no login name is written in a repository.
broker_acl_grants:
  - principal: "${ONEX_ACL_DEV_RUNTIME_PRINCIPAL}"
    grants:
      - {resource_type: TOPIC, pattern: LITERAL, name: onex.cmd.omnimarket.delegation-readiness-verdict-compute-requested.v1, operation: READ}
      - {resource_type: TOPIC, pattern: LITERAL, name: onex.cmd.omnimarket.delegation-readiness-verdict-compute-requested.v1, operation: DESCRIBE}
      - {resource_type: TOPIC, pattern: LITERAL, name: onex.evt.omnimarket.delegation-readiness-verdict-computed.v1, operation: WRITE}
      - {resource_type: TOPIC, pattern: LITERAL, name: onex.evt.omnimarket.delegation-readiness-verdict-computed.v1, operation: DESCRIBE}
event_bus:
  subscribe_topics:
    - onex.cmd.omnimarket.delegation-readiness-verdict-compute-requested.v1
  publish_topics:
    - onex.evt.omnimarket.delegation-readiness-verdict-computed.v1

externally_consumed_topics:
  - onex.evt.omnimarket.delegation-readiness-verdict-computed.v1

metadata:
  ticket: OMN-23181
  transport_type: inmemory
