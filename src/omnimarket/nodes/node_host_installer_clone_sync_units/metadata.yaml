name: node_host_installer_clone_sync_units
version: "1.0.0"
description: "Installs the canonical clone sync agent of a host (launchd agent or systemd user timer) that runs from the registry root, carries the skill overlay roots and writes its refusals to the journal"
omnibase_core_compat: ">=0.39.0,<1.0.0"
entry_points:
  onex.nodes:
    node_host_installer_clone_sync_units: "omnimarket.nodes.node_host_installer_clone_sync_units"
capabilities:
  standalone: true
  full_runtime: true
  requires_network: false
  requires_repo: false
  requires_secrets: false
  requires_docker: false
  side_effect_class: write
dependencies:
  - "pyyaml>=6.0"
  - "pydantic>=2.0"
authors: ["OmniNode Platform Team"]
license: "MIT"
tags: ["install", "launchd", "systemd", "clone-sync", "effect"]
pack: "install"
display_name: "Host Installer Clone Sync Units"
node_role: "effect"
