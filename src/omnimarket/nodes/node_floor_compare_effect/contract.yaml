# ONEX Node Contract - Floor Running Comparison Effect (OMN-23018)
#
# One cycle, run as a step of the factory floor publish after the simple floor is written: keep the floor's published
# numbers (merges, open pull requests, slots busy, red rows, each cause and alarm, each rebuild piece, stoppage costs) as a
# dated history, read each number at now minus 1, 7 and 30 days, and write the better and worse lines the floor's compare
# page shows. A missing point is unread and is never zero. Paths are relative to the registry home (OMNI_HOME).
name: node_floor_compare_effect
contract_name: node_floor_compare_effect
node_name: node_floor_compare_effect
contract_version: {major: 0, minor: 1, patch: 0}
node_version: {major: 0, minor: 1, patch: 0}
node_type: effect
lifecycle: experimental
runtime_profiles: []

description: >
  Keeps the floor's published numbers as a dated history and writes what is better and worse than 1, 7 and 30 days ago,
  each line with its old value, its new value and the direction that counts as better.

handler:
  module: omnimarket.nodes.node_floor_compare_effect.handlers.handler_floor_compare
  class: HandlerFloorCompare
  input_model: omnimarket.nodes.node_floor_compare_effect.models.model_floor_compare.ModelFloorCompareRequest

handler_routing:
  routing_strategy: operation_match
  handlers:
    - operation: run_floor_compare_cycle
      handler:
        name: HandlerFloorCompare
        module: omnimarket.nodes.node_floor_compare_effect.handlers.handler_floor_compare
      input_model: omnimarket.nodes.node_floor_compare_effect.models.model_floor_compare.ModelFloorCompareRequest
      output_model: omnimarket.nodes.node_floor_compare_effect.models.model_floor_compare.ModelFloorCompareResult

descriptor:
  node_archetype: effect
  purity: effectful
  idempotent: true
  timeout_ms: 60000
  side_effects:
    - reads the simple floor and the dated copies the backfill globs name under the registry home
    - appends snapshots to the history file and rewrites it without the snapshots past the retention window
    - appends emission events to the floor's journal under the state directory
    - writes the comparison file the publish copies to the serving host
    - appends each live rebuild piece's day-7 verdict once to the verdict record the piece measures overlay names
    - reads the node's deployment overlay (the category grouping of the page) from ONEX_SKILL_OVERLAY_ROOTS

input_model:
  name: ModelFloorCompareRequest
  module: omnimarket.nodes.node_floor_compare_effect.models.model_floor_compare
  description: The flags of one cycle.
output_model:
  name: ModelFloorCompareResult
  module: omnimarket.nodes.node_floor_compare_effect.models.model_floor_compare
  description: Whether the cycle wrote the comparison, and the history it read.

terminal_event: onex.evt.omnimarket.floor-compare-written.v1

runtime_dispatch:
  command_topic: onex.cmd.omnimarket.floor-compare-cycle-requested.v1
  external_trigger: python -m omnimarket.nodes.node_floor_compare_effect, and as a step of python -m omnimarket.nodes.node_factory_floor_publish_effect, from the registry module tick that the host installer contract declares.

event_bus:
  subscribe_topics: []
  publish_topics:
    - onex.evt.omnimarket.floor-compare-written.v1
    # The start, success and typed-failure emissions go through the emission sink to the floor's journal, not the bus,
    # so they are not declared here.

externally_consumed_topics:
  - onex.evt.omnimarket.floor-compare-written.v1

runtime:
  home_env: OMNI_HOME
  simple_relpath: .claude_scratch/factory-floor/floor-simple.json
  record_relpath: .claude_scratch/factory-floor/factory-floor.json
  history_relpath: .onex_state/floor-compare/history.jsonl
  output_relpath: .claude_scratch/factory-floor/floor-compare.json
  # The category grouping of the page (which keys belong to which card) is deployment data, not code: it is the overlay
  # <root>/node_floor_compare_effect/overlay.yaml under ONEX_SKILL_OVERLAY_ROOTS, or the file the variable names.
  overlay_id: node_floor_compare_effect
  overlay_file_env: ONEX_FLOOR_COMPARE_OVERLAY
  # The history is kept 35 days so the 30-day read has its point and a margin.
  retention_days: 35
  # The tick runs every few minutes; a snapshot is stored when it is at least this far from the previous tick snapshot.
  min_gap_seconds: 1500
  max_lines_per_window: 40
  # The page's details table shows this many rows to a page; its search and category filter run over every line of the window.
  details_page_size: 25
  # A snapshot is the reading at now minus N days only inside the tolerance; outside it the number is unread.
  windows:
    - {days: 1, label: "1 day", tolerance_hours: 3}
    - {days: 7, label: "7 days", tolerance_hours: 12}
    - {days: 30, label: "30 days", tolerance_hours: 24}
  # Which way is better, per family of keys (longest prefix wins). Colours are ranked by piece_rank, lower is better.
  families:
    - {prefix: merges_all, polarity: higher_is_better, unit: merges in the last hour (every repository), noun: "Merges in the last hour, every repository", source: "throughput tick log: NOTE merges last 60 min (backfilled by its watcher tick time)"}
    - {prefix: merges, polarity: higher_is_better, unit: merges in the last hour, noun: "In-scope merges", source: "throughput tick log: GOAL merges_60m (only since 2026-11-05, when the goal line began); today from the published floor"}
    - {prefix: open_prs, polarity: lower_is_better, unit: open, noun: "Open in-scope pull requests", source: "throughput tick log: GOAL open (only since 2026-11-05); today from the published floor"}
    - {prefix: slots_busy, polarity: higher_is_better, unit: slots busy, noun: "Lab slots working", source: "published floor only; no dated source holds busy slots"}
    - {prefix: red_rows, polarity: lower_is_better, unit: red rows, noun: "Red rows on the floor", source: "published floor only; red rows are derived from the floor's own state"}
    - {prefix: "cause:stoppage:", polarity: lower_is_better, unit: occurrences, noun: "Cause", source: "ledger FRICTION rows, classed by the friction rollup node's report over 24 hours; today from the rollup's latest window"}
    - {prefix: "cause:", polarity: lower_is_better, unit: occurrences, noun: "Cause", source: "published floor only (chains, red pull requests, lab state, rebuild pieces have no dated source)"}
    - {prefix: "stoppage_cost:", polarity: lower_is_better, unit: lane-minutes lost, noun: "Stoppage cost of", source: "ledger FRICTION rows, cost cell of each row, 24 hours; today from the rollup's latest window"}
    - {prefix: alarms_total, polarity: lower_is_better, unit: alarms, noun: "Alarms raised", source: "published floor only; the floor's alarm list has no dated copy"}
    - {prefix: "alarm:", polarity: lower_is_better, unit: alarms, noun: "Alarm", source: "published floor only"}
    - {prefix: "piece:", polarity: lower_is_better, unit: colour, noun: "Rebuild piece", source: "published floor only; only the dated floor copies backfill it"}
    - {prefix: "lab:", polarity: lower_is_better, unit: colour, noun: "Lab state", source: "published floor only"}
    # New lines the dated sources hold and the published floor does not carry. Each counts the 24 hours that end at its time.
    - {prefix: lanes_started, polarity: higher_is_better, unit: lanes started in 24 h, noun: "Lanes started", source: "work ledger CLAIM rows"}
    - {prefix: "lanes_ended:done", polarity: higher_is_better, unit: lanes ended done in 24 h, noun: "Lanes that ended done", source: "work ledger TERMINAL rows, outcome=done"}
    - {prefix: "lanes_ended:handed-off", polarity: higher_is_better, unit: lanes handed off in 24 h, noun: "Lanes that ended handed off", source: "work ledger TERMINAL rows, outcome=handed-off"}
    - {prefix: "lanes_ended:partial", polarity: lower_is_better, unit: lanes ended partial in 24 h, noun: "Lanes that ended partial", source: "work ledger TERMINAL rows, outcome=partial"}
    - {prefix: "lanes_ended:blocked", polarity: lower_is_better, unit: lanes ended blocked in 24 h, noun: "Lanes that ended blocked", source: "work ledger TERMINAL rows, outcome=blocked"}
    - {prefix: "lanes_ended:failed", polarity: lower_is_better, unit: lanes ended failed in 24 h, noun: "Lanes that ended failed", source: "work ledger TERMINAL rows, outcome=failed"}
    - {prefix: "lanes_ended:skipped-owned", polarity: lower_is_better, unit: lanes skipped as owned in 24 h, noun: "Lanes that ended skipped as owned", source: "work ledger TERMINAL rows, outcome=skipped-owned"}
    - {prefix: friction_rows, polarity: lower_is_better, unit: friction rows in 24 h, noun: "Friction rows recorded", source: "ledger FRICTION rows through the friction rollup node"}
    - {prefix: friction_lane_minutes, polarity: lower_is_better, unit: lane-minutes lost in 24 h, noun: "Lane-minutes lost to stoppages", source: "ledger FRICTION rows, summed cost, through the friction rollup node"}
    - {prefix: refusals, polarity: lower_is_better, unit: refusals in 24 h, noun: "Hook refusals", source: "ledger FRICTION rows of the hook-refusal classes"}
    - {prefix: git_merges_total, polarity: higher_is_better, unit: merges in 24 h, noun: "Merges to the default branches", source: "canonical clones, git first-parent history of origin/HEAD"}
    - {prefix: "git_merges:", polarity: higher_is_better, unit: merges in 24 h, noun: "Merges to", source: "canonical clone of that repository, git first-parent history of origin/HEAD"}
    - {prefix: landing_merged, polarity: higher_is_better, unit: merged by the controller in 24 h, noun: "Pull requests the landing controller merged", source: "landing decisions file, kind merge outcome merged"}
    - {prefix: landing_armed, polarity: higher_is_better, unit: queued by the controller in 24 h, noun: "Pull requests the landing controller queued to merge", source: "landing decisions file, kind merge outcome enqueued"}
    - {prefix: landing_merge_failed, polarity: lower_is_better, unit: failed merges in 24 h, noun: "Merges the landing controller tried and failed", source: "landing decisions file, kind merge outcome failed"}
    - {prefix: landing_refused, polarity: lower_is_better, unit: controller refusals in 24 h, noun: "Refusals by the landing controller", source: "landing decisions file, outcomes refused, claim-refused, claim_refused, refuse"}
    - {prefix: lab_alarms_total, polarity: lower_is_better, unit: lab alarms in 24 h, noun: "Lab alarms raised", source: "lab alarm history, raised_at"}
    - {prefix: "lab_alarms:", polarity: lower_is_better, unit: lab alarms in 24 h, noun: "Lab alarm", source: "lab alarm history, raised_at, by condition"}
    - {prefix: lab_fill_sent_per_tick, polarity: higher_is_better, unit: lanes sent per tick, noun: "Lanes the lab fill sent per tick (mean over 24 h)", source: "throughput tick log: NOTE lab-fill sent=N, mean over the ticks logged"}
    - {prefix: parked_causes, polarity: lower_is_better, unit: causes parked, noun: "Causes parked by the landing controller", source: "throughput tick log: lines naming a parked cause, per tick"}
    # The live rebuild pieces' outcome measures (OMN-23081); node overlay.example.yaml names which piece reads which.
    - {prefix: slots_free, polarity: higher_is_better, unit: slots free, noun: "Lab slots available", source: "factory floor record bays[].free summed over the hosts read fresh (a stale host has none available); dated record copies backfill it"}
    - {prefix: ledger_read_lag_s, polarity: lower_is_better, unit: seconds behind, noun: "Ledger read lag", source: "factory floor record generated_at minus sources.ledger_newest_row; dated record copies backfill it"}
    - {prefix: capacity_refusals, polarity: lower_is_better, unit: rows in 24 h, noun: "Lanes refused for capacity", source: "work ledger FRICTION, STATUS and TERMINAL rows naming a capacity refusal"}
    - {prefix: parity_failures, polarity: lower_is_better, unit: rows in 24 h, noun: "Ledger parity failures", source: "work ledger FRICTION, STATUS and TERMINAL rows naming a parity failure"}
    - {prefix: "piece_golden_age_h:", polarity: lower_is_better, unit: hours, noun: "Hours since the last good run of piece", source: "published floor piece row golden_age_s; only the dated floor copies backfill it"}
    - {prefix: floor_breaches, polarity: lower_is_better, unit: repositories under their merge floor, noun: "Repositories under their hourly merge floor", source: "floor alarm history, breaches of the latest run"}
  piece_rank: {green: 0, grey: 1, amber: 2, red: 3}
  # The stoppage cost the simple floor prints in a cause's detail ("144 lane-minutes logged").
  stoppage_cost_pattern: '(\d+(?:\.\d+)?) lane-minutes'
  # Stoppages whose logged cost is the reporter's estimate of idle capacity: the live floor leaves the figure out, so a dated copy's
  # figure is not kept as lane-minutes lost either (the same ids as the floor overlay's estimated_cost_stoppages).
  estimated_cost_stoppages: ["stoppage:lab-idle", "stoppage:lab-source-unreadable"]
  # Dated copies read once into the history at the first cycle that finds them. Nothing here is a guess about a host: a glob
  # that matches nothing backfills nothing, and the result says how many snapshots it added.
  backfill:
    - {kind: floor_simple, glob: ".claude_scratch/factory-floor/history/floor-simple-*.json"}
    - {kind: floor_simple, glob: ".claude_scratch/floor-simple-snapshots/*.json"}
    - {kind: factory_record, glob: ".claude_scratch/factory-floor/history/factory-floor-*.json"}
    # The piece measures of the same dated records (OMN-23081): lab slots free and the ledger read lag.
    - {kind: factory_measures, glob: ".claude_scratch/factory-floor/history/factory-floor-*.json"}
  # The dated sources the history is backfilled from (verb --backfill-history) and read again for today's value. Every counted
  # key is the number of records in the trailing window_hours that end at its time. A source that recorded less than min_alive
  # records of any kind in that window, or began after the window did, leaves its keys out: that point stays unread.
  history:
    window_hours: 24
    backfill_days: 30
    grid_hours: 1
    friction_grid_hours: 2
    friction_grid_minute: 7
    min_alive: {ledger: 100, landing-decisions: 100, lab-alarm: 12}
    min_tick_samples: 12
    level_max_age_minutes: 90
    # The ledger is on the bus: counts come from typed row reads of the kinds below, one window of ledger_chunk_hours at a time,
    # through the command the variable holds. A failed or truncated read leaves the ledger keys unread; nothing reads a file.
    ledger_read_command_env: ONEX_LEDGER_BUS_READ_COMMAND
    ledger_read_timeout_seconds: 120
    ledger_row_limit: 5000
    ledger_row_kinds: [CLAIM, TERMINAL, FRICTION, STATUS]
    ledger_chunk_hours: 24
    ledger_lane_outcomes: [done, handed-off, partial, blocked, failed, skipped-owned]
    friction_umbrella_ticket: OMN-17427
    friction_rules_node: node_friction_rollup_compute
    friction_rules_file: overlay.example.yaml
    friction_latest_relpath: .onex_state/friction-rollup/latest.json
    refusal_class_prefix: "hook-refusal:"
    throughput_relpath: .onex_state/throughput-tick/throughput-tick.out.log
    lab_alarms_relpath: .onex_state/lab-alarm/alarms.jsonl
    lab_alarm_runs_relpath: .onex_state/lab-alarm/alarm-runs.jsonl
    floor_alarm_runs_relpath: .onex_state/floor-alarm/runs.jsonl
    landing_env: LANDING_STATE_DIR
    landing_decisions_file: decisions.jsonl
    landing_refusal_outcomes: [refused, claim-refused, claim_refused, refuse]
    git_timeout_seconds: 60
    # Every canonical clone directly under the registry home (a directory holding .git); the clones are found, not named.
    git_clone_glob: "*/.git"
    # Ledger rows counted as piece measures (OMN-23081). Each key counts the rows of the listed types whose text matches.
    ledger_patterns:
      - key: capacity_refusals
        row_types: [FRICTION, STATUS, TERMINAL]
        pattern: '(?i)exit(?:ed)? 75\b|over the (?:load )?bar|no free (?:slot|lane)|refused[^|]{0,40}capacity|capacity[^|]{0,30}refus'
      - key: parity_failures
        row_types: [FRICTION, STATUS, TERMINAL]
        pattern: '(?i)parity[^|]{0,40}(?:fail|mismatch|not working|under 100)'
  # The cycle ends itself with a typed failure when it has not finished in this time (OMN-22864). It stays below the publish
  # node's own 15 s limit for the floor_compare step, whose kill cannot be answered and leaves a start with no terminal.
  cycle_deadline_seconds: 12
  emission_journal_relpath: .onex_state/floor-simple/emissions.jsonl
  emission_node: "node_floor_compare_effect:run_floor_compare_cycle"
  emission_piece: 17
