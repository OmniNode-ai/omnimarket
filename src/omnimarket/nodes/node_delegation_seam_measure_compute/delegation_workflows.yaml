    verified_by: rg -n 'receipt.json' src/omnimarket/delegated_code_edit/loop_ports.py src/omnimarket/cli/cli_code_edit.py
      | head -3 => receipt.json and loop_receipt.json are read and written under the run directory
  usage_record:
    value: A delegation_events row in the SQLite target when no overlay is configured, or the overlay
