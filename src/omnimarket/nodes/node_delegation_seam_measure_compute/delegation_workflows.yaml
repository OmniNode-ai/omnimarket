    verified_by: ls omnidash/src/pages/local/*.page.yaml => runs.page.yaml, usage.page.yaml, overview.page.yaml,
      workflow.page.yaml present
  stations: *id001
  seams: *id002
  shapes:
    value: As W1.
    verified_by: ls src/omnimarket/models/delegation/wire | rg skill_request => shared wire models
  measurement: DS-2
  criteria:
  - C12
  - C13
  - C14
  canary:
    family: canary_customer_local_and_plugin
    ref: canary_customer_local_and_plugin; producers of C13 and C14
    verified_by: read the plan task text for family canary_customer_local_and_plugin => the task names
      operation canary_customer_local_and_plugin
  owner: customer path owner
- id: W3
  name: /onex:delegate skill in Claude Code (the first-hour path)
  entry:
    value: The plugin skill onex:delegate runs `onex delegate ... --json` inline (no subagent) and shows
