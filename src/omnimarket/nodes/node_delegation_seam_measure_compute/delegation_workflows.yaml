# Delegation workflow registry: the 19 workflows, re-read at current heads.
# Each cell is a value plus `verified_by: <command> => <observation>`. Commands are
# written relative to a checkout of each named repository and the plugin's skills
# directory (<plugin>/skills); `knowledge-plan` stands for the factory plan's task text.
station_shapes:
- station: DSt1
  seam: DS-1
  name: Entry
  shape:
    value: 'ModelDelegateSkillRequest (omnimarket.models.delegation.wire.model_delegate_skill_request):
      prompt, task_type, source (closed set claude-code, codex, external-client), plus the caller-lane
      type in models/delegation/delegation_caller_lane.py.'
    verified_by: 'rg -n ''class ModelDelegateSkillRequest|source: Literal'' src/omnimarket/models/delegation/wire/model_delegate_skill_request.py;
      ls src/omnimarket/models/delegation/delegation_caller_lane.py => class at line 66, source is a Literal
      of three adapter names at line 100, caller-lane module present'
- station: DSt2
  seam: DS-2
  name: Admission and routing
  shape:
    value: ModelDelegationRequest (wire/model_delegation_request.py) to ModelRoutingDecision (wire/model_routing_decision.py),
      routed by node_delegation_routing_reducer; the routing-decision event topic onex.evt.omnibase-infra.routing-decision.v1
      is consumed by node_projection_live_events.
    verified_by: rg -n 'class ModelDelegationRequest|class ModelRoutingDecision' src/omnimarket/models/delegation/wire;
      rg -n 'routing-decision.v1' src/omnimarket/nodes/node_projection_live_events/contract.yaml => ModelDelegationRequest
      at model_delegation_request.py:74, ModelRoutingDecision at model_routing_decision.py:19, topic subscribed
      at contract.yaml:84
- station: DSt3
  seam: DS-3
  name: Call
  shape:
    value: ModelInferenceIntent (omnibase_core.models.delegation.wire) published on onex.cmd.omnibase-infra.delegation-inference-request.v1
      and executed by HandlerInferenceIntent of node_llm_delegation_call_effect, which answers with ModelInferenceResponseData
      on onex.evt.omnibase-infra.inference-response.v1. This names the request model that the first inventory
      left open.
    verified_by: rg -n 'delegation-inference-request|ModelInferenceIntent|inference-response.v1' src/omnimarket/nodes/node_llm_delegation_call_effect/contract.yaml
      => subscribe topic at line 206, schema_ref omnibase_core.models.delegation.wire.ModelInferenceIntent
      at line 237, publish topic inference-response.v1 at line 209
- station: DSt4
  seam: DS-4
  name: Quality gate
  shape:
    value: ModelQualityGateInput to ModelQualityGateResult (wire/model_quality_gate.py), reduced by node_delegation_quality_gate_reducer.
    verified_by: rg -n 'class ModelQualityGateInput|class ModelQualityGateResult' src/omnimarket/models/delegation/wire/model_quality_gate.py;
      ls src/omnimarket/nodes | rg quality_gate_reducer => classes at lines 108 and 157, node_delegation_quality_gate_reducer
      present
- station: DSt5
  seam: DS-5
  name: Escalation and terminal
  shape:
    value: 'node_delegation_escalation_decision_compute decides the next rung; the terminal carries terminal_failure_cause,
      an optional field whose closed set is EnumDelegationTerminalFailureCause (omnibase_core enums/enum_delegation_terminal_failure_cause.py):
      nine members, none named unknown, returned_to_caller ends the ladder. A failed run with the field
      absent is the null case that DS-5 counts.'
    verified_by: 'rg -n ''^    [A-Z_]* = '' omnibase_core/src/omnibase_core/enums/enum_delegation_terminal_failure_cause.py
      | wc -l; rg -n -i unknown omnibase_core/src/omnibase_core/enums/enum_delegation_terminal_failure_cause.py;
      rg -n ''terminal_failure_cause'' -A3 src/omnimarket/nodes/node_delegate_skill_orchestrator/contract.yaml
      => 9 members, no unknown member, the contract field is required: false with the same nine values
      enumerated'
- station: DSt6
  seam: DS-6
  name: Receipt
  shape:
    value: ModelDelegateSkillResponse (provider, model, response, metrics, quality gate) and ModelDelegateSkillTerminalProjection,
      a subclass of the response.
    verified_by: rg -n 'class ModelDelegateSkillResponse|class ModelDelegateSkillTerminalProjection' src/omnimarket/models/delegation/wire
      => response at model_delegate_skill_response.py:442, projection at model_delegate_skill_terminal_projection.py:84
      extends ModelDelegateSkillResponse
- station: DSt7
  seam: DS-7
  name: Usage record
  shape:
    value: ModelProjectionTaskDelegatedEvent into node_projection_delegation (the delegation_events rows);
      node_work_ledger_delegation_mirror maps a completed or failed terminal to one ModelWorkLedgerAppendRequest
      STATUS append.
    verified_by: rg -n 'class ModelProjectionTaskDelegatedEvent' src/omnimarket/nodes/node_projection_delegation/handlers/handler_projection_delegation.py;
      rg -n 'class ModelWorkLedgerAppendRequest' src/omnimarket/models/work_ledger_append; sed -n 9,12p
      src/omnimarket/nodes/node_work_ledger_delegation_mirror/contract.yaml => event model at line 322,
      append request at model_work_ledger_append.py:22, mirror described as a pure mapping of a terminal
      to one STATUS append request
- station: DSt8
  seam: DS-8
  name: Dashboard read
  shape:
    value: 'Declared endpoints /api/delegation/summary, /recent, /model-routing, /quality-gate and /savings
      (node_projection_delegation api_contract.yaml, five rather than four); dashboard pages: DelegationEvidencePage.tsx
      and the local pages overview, runs, usage, workflow, credentials, api-keys. Row provenance is data_source
      in real, experiment or fixture (omnimarket.projection.envelope).'
    verified_by: 'rg -n ''path: /api/delegation'' src/omnimarket/nodes/node_projection_delegation/api_contract.yaml;
      ls omnidash/src/pages/local/*.page.yaml; rg -n ''DATA_SOURCES'' src/omnimarket/projection/envelope.py
      => five paths at lines 12, 18, 24, 30, 36; six local page files; DATA_SOURCES holds real, fixture,
      experiment'
workflows:
- id: W1
  name: onex delegate on the deployed-lane locus (the product path)
  entry:
    value: onex delegate publishes a ModelDelegateSkillRequest to node_delegate_skill_orchestrator, which
      hands a ModelDelegationRequest to node_delegation_orchestrator; the workflow handler emits the inference
      intent on the delegation-inference-request topic.
    verified_by: rg -n 'delegation-inference-request' src/omnimarket/nodes/node_delegation_orchestrator/contract.yaml;
      ls src/omnimarket/nodes/node_delegate_skill_orchestrator/handlers => topic declared in the orchestrator
      contract, handler_delegate_skill.py present
  routing_fallback:
    value: Routing reducer by task-class tier order, escalation up the ladder by node_delegation_escalation_decision_compute;
      the ladder ends at returned_to_caller, which is a member of the terminal-cause enum.
    verified_by: rg -n 'returned_to_caller' src/omnimarket/nodes/node_delegate_skill_orchestrator/contract.yaml;
      ls src/omnimarket/nodes | rg 'delegation_(routing_reducer|escalation_decision)' => returned_to_caller
      is the last enumerated cause; both nodes present
  quality_gate:
    value: node_delegation_quality_gate_reducer, ModelQualityGateInput to ModelQualityGateResult.
    verified_by: ls src/omnimarket/nodes | rg quality_gate_reducer => node present
  receipt:
    value: CLI run directory under the state root plus the delegate-skill terminal events.
    verified_by: rg -n 'delegate-skill-completed' src/omnimarket/nodes/node_projection_delegation/contract.yaml
      => the projection subscribes to the completed terminal at line 269
  usage_record:
    value: One delegation_events row per correlation id through node_projection_delegation; node_work_ledger_delegation_mirror
      maps each terminal to a ledger STATUS append.
    verified_by: ls src/omnimarket/nodes | rg 'projection_delegation$|work_ledger_delegation_mirror' =>
      both nodes present
  dashboard_read:
    value: The /api/delegation endpoints and the Runs and Usage pages.
    verified_by: 'rg -n ''path: /api/delegation'' src/omnimarket/nodes/node_projection_delegation/api_contract.yaml
      => five endpoints declared'
  stations: &id001
  - DSt1
  - DSt2
  - DSt3
  - DSt4
  - DSt5
  - DSt6
  - DSt7
  - DSt8
  seams: &id002
  - DS-1
  - DS-2
  - DS-3
  - DS-4
  - DS-5
  - DS-6
  - DS-7
  - DS-8
  shapes:
    value: ModelDelegateSkillRequest, ModelRoutingDecision, ModelQualityGateResult, ModelDelegateSkillResponse,
      delegation_events row.
    verified_by: ls src/omnimarket/models/delegation/wire | rg 'skill_request|routing_decision|quality_gate|skill_response'
      => all four wire modules present
  measurement: DS-6
  criteria:
  - C11
  - C12
  - C15
  - C16
  - C28
  canary:
    family: existing_producer
    ref: chain canary producer of C15 and the producers of C11, C12, C16 and C28
    verified_by: rg -n 'delegation' src/omnimarket/nodes/node_golden_chain_sweep/golden_chains.yaml |
      head -3 => golden chain entries for the delegation topics exist in node_golden_chain_sweep
  owner: delegation owner
- id: W2
  name: onex delegate in-process locus, customer-local
  entry:
    value: The in-process locus dispatches through LocalDelegationDispatchPort in node_delegate_skill_orchestrator/ports.
    verified_by: rg -n 'class LocalDelegationDispatchPort' src/omnimarket/nodes/node_delegate_skill_orchestrator/ports/port_local_delegation_dispatch.py
      => class found
  routing_fallback:
    value: The same ladder resolved from the task-class contract (tier_order, required_bar) a second time,
