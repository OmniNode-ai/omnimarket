    verified_by: rg -n 'tier_order|required_bar' src/omnimarket/nodes/node_delegate_skill_orchestrator/ports/port_local_delegation_dispatch.py
      | head -3 => both names occur in the port
  quality_gate:
    value: The port imports the gate's helper functions and the answer-gate rules.
    verified_by: rg -n 'quality|gate' src/omnimarket/nodes/node_delegate_skill_orchestrator/ports/port_local_delegation_dispatch.py
      | head -3 => quality-gate references occur in the port
  receipt:
    value: CLI run directory <state root>/runs/<correlation id>/ with receipt.json (the loop CLIs add
