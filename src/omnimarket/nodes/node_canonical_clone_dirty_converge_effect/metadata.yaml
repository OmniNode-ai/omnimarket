name: node_canonical_clone_dirty_converge_effect
version: "0.1.0"
description: "Effect: run the canonical clone sync engine, then save and converge each clone refused for tracked changes past a declared age. Hosted by one launchd or systemd tick per host, never by a shared runtime."
pack: pipeline
node_role: effect
display_name: "Canonical Clone Dirty Converge Effect (per host)"
omnibase_core_compat: ">=0.39.0,<1.0.0"
entry_points:
  onex.nodes:
    node_canonical_clone_dirty_converge_effect: "omnimarket.nodes.node_canonical_clone_dirty_converge_effect"
capabilities:
  standalone: false
  full_runtime: false
  requires_network: true
  requires_repo: true
  requires_secrets: false
  requires_docker: false
  side_effect_class: write
dependencies:
  - "click>=8.1.0"
  - "pyyaml>=6.0"
authors: ["OmniNode Platform Team"]
license: "MIT"
tags: ["effect", "canonical-clone"]
