# ONEX Node Contract - Stability Stack Plan Compute (OMN-23968)
#
# One pure fold: the request (stack name, install or remove), the declared
# stability stack descriptions and the reserved lanes of the other stacks,
# into an ordered plan. The plan is refused, naming the subject and the lane
# or stack it collides with, for an unknown stack name, a release_tag that
# does not fullmatch the overlay's tag_pattern (which admits only dev-merge
# tags), or a collision with a reserved lane or another declared stack: the
# same compose_project (any host), a container name or a volume (whatever the
# host - names are global), or a published port on the same host. Any refusal
# means no steps at all: nothing may start.
#
# No clock, no file, no network, no shell. Every host, project, container,
# volume, port, image tag and path comes from the overlay: the code carries
# none of them.
name: "node_stability_stack_plan_compute"
node_type: "COMPUTE_GENERIC"
contract_version:
  major: 0
  minor: 1
  patch: 0
node_version: "0.1.0"
lifecycle: experimental
description: "The ordered install or remove plan for a declared stability stack, or a refusal naming the unknown stack, the bad release tag or the collision."
input_model:
  name: "ModelStackPlanRequest"
  module: "omnimarket.nodes.node_stability_stack_plan_compute.models.model_stack_plan"
  description: "Which stack to plan for, and whether to install or remove it."
output_model:
  name: "ModelStackPlan"
  module: "omnimarket.nodes.node_stability_stack_plan_compute.models.model_stack_plan"
  description: "The ordered steps with rollback, or the refusals and no steps."
handler:
  module: "omnimarket.nodes.node_stability_stack_plan_compute.handlers.handler_stack_plan"
  class: "HandlerStackPlan"
  input_model: "omnimarket.nodes.node_stability_stack_plan_compute.models.model_stack_plan.ModelStackPlanRequest"
  output_model: "omnimarket.nodes.node_stability_stack_plan_compute.models.model_stack_plan.ModelStackPlan"
handler_routing:
  routing_strategy: "operation_match"
  default_handler: "omnimarket.nodes.node_stability_stack_plan_compute.handlers.handler_stack_plan:HandlerStackPlan"
  handlers:
    - operation: "plan_stability_stack"
      handler:
        name: "HandlerStackPlan"
        module: "omnimarket.nodes.node_stability_stack_plan_compute.handlers.handler_stack_plan"
runtime_dispatch:
  command_topic: "onex.cmd.omnimarket.stability-stack-plan-requested.v1"
  terminal_events:
    success: "onex.evt.omnimarket.stability-stack-plan-completed.v1"
    failure: "onex.evt.omnimarket.stability-stack-plan-failed.v1"
descriptor:
  node_archetype: compute
  purity: pure
  idempotent: true
  timeout_ms: 5000
overlay:
  node: node_stability_stack_plan_compute
  roots_env: ONEX_SKILL_OVERLAY_ROOTS
metadata:
  ticket: OMN-23968
  transport_type: inmemory
dod_evidence:
  PYTEST:
    description: "unknown stack, bad release tag, every collision kind, ordered install steps, remove steps, byte-equal output"
    command: "uv run pytest tests/nodes/node_stability_stack_plan_compute/test_golden_chain_stability_stack_plan_compute.py -q"
    pass_criteria: "every test passes"
