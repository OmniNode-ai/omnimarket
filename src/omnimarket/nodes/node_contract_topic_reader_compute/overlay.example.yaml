# Overlay of the contract topic reader (OMN-19998): <root>/node_contract_topic_reader_compute/overlay.yaml
# under a root named in ONEX_SKILL_OVERLAY_ROOTS. Every key is required; the real values live in the overlays repository.
# A string in a topic position is a topic when it fully matches this pattern; any other string is reported as rejected.
topic_pattern: '^onex\.(evt|cmd|intent|dlq|snapshot)\.[a-z0-9._-]+\.v\d+$'
