# ONEX Node Contract - Delegation Scenario R3 Effect (OMN-23182, readiness plan A5)
#
# Scenario R3, forced escalation from a free rung to a paid rung. One scheduled run drives the delegation skill handler with a
# synthetic request on a large input and rungs-mode probe ladders: a free rung that answers 503 on every call, then a paid rung.
# Leg a's paid rung is a loopback stub with a fixed answer; leg b's paid rung is a real OpenRouter model on the probe key. A
# control ladder with both rungs down must end returned_to_caller. Every assertion is a typed field of the delegation terminal or
# a byte comparison of the answer; no model judges a pass, a missing input or key is a failure and never a skip. The result is
# emitted on the bus and written as one ledger STATUS row (the row node_delegation_scenario_days_effect reads for the
# scenario's green days).
name: node_delegation_scenario_r3_effect
contract_name: node_delegation_scenario_r3_effect
node_name: node_delegation_scenario_r3_effect
contract_version: {major: 0, minor: 1, patch: 0}
node_version: {major: 0, minor: 1, patch: 0}
node_type: effect
lifecycle: experimental
runtime_profiles: [effects]

description: >
  Runs readiness scenario R3 once through the delegation skill handler with probe ladders (one paid rung on a real model), publishes the result on the bus
  and writes one ledger STATUS row. The node's own systemd user timer (`schedule install`) runs it every six hours.

handler:
  module: omnimarket.nodes.node_delegation_scenario_r3_effect.handlers.handler_scenario_r3
  class: HandlerScenarioR3
  input_model: omnimarket.nodes.node_delegation_scenario_r3_effect.handlers.handler_scenario_r3.ModelScenarioR3RunCommand

# Not a runtime-dispatched handler: HandlerScenarioR3 takes its contract runtime block, leg transport, ledger append route,
# event sink and clock as constructor parameters, so the node runs through its own CLI and schedule.

descriptor:
  node_archetype: effect
  runtime_profiles: [effects]
  purity: impure
  idempotent: false
  side_effects: [loopback-socket, network-egress, file-write, ledger-append, bus-publish]
  timeout_ms: 900000

input_model:
  name: ModelScenarioR3RunCommand
  module: omnimarket.nodes.node_delegation_scenario_r3_effect.handlers.handler_scenario_r3
  description: One run of scenario R3; it carries no value.
output_model:
  name: ModelScenarioResult
  module: omnimarket.models.model_delegation_scenario
  description: The slot, trigger, conclusion and each assertion that held or did not.

terminal_event: onex.evt.omnimarket.delegation-scenario-result.v1

runtime_dispatch:
  external_trigger: true

event_bus:
  subscribe_topics: []
  publish_topics:
    - onex.evt.omnimarket.delegation-scenario-result.v1

externally_consumed_topics:
  - onex.evt.omnimarket.delegation-scenario-result.v1

runtime:
  home_env: OMNI_HOME
  ledger_append_command_env: ONEX_LEDGER_BUS_APPEND_COMMAND
  ledger_append_timeout_seconds: 60
  host_env: ONEX_HOST_NAME
  bus_emit_command_env: ONEX_BUS_EMIT_COMMAND
  # Every event is journalled here; when the deployment names a bus produce command in bus_emit_command_env it also gets the event.
  event_journal_relpath: .onex_state/delegation-scenario-r3/events.jsonl
  bus_emit_timeout_seconds: 60
  scenario_id: R3
  cadence: every_6h
  ticket: OMN-23182
  # The lane the green-days reader (node_delegation_scenario_days_effect, scenario R3) counts rows under.
  lane: node_delegation_scenario_r3
  actor: script:node_delegation_scenario_r3_effect
  work_relpath: .onex_state/delegation-scenario-r3/work
  # loopback: one stub HTTP server per rung, called by the real delegation effect. inmemory: scripted typed replies.
  leg_backend: loopback
  loopback_host: 127.0.0.1
  probe_tenant_slug: readiness-probe
  inputs_relpath: inputs/r3_legs.yaml
  # Where each run variable is found, by existing names (OMN-23602): the environment, the host environment file, the store.
  settings_overlay_relpath: inputs/settings_overlay.yaml
  # Leg b: the paid rung is a real OpenRouter model on the probe key. The key VALUE is read from the variable named below when
  # the call is made and is never printed, logged, emitted or stored. Enabled with an empty variable the run is red, never skipped.
  leg_b_enabled: true
  openrouter_probe_key_env: ONEX_R3_OPENROUTER_PROBE_KEY
  openrouter_max_tokens: 16
  # The paid model id and its endpoint are the overlay's: the file below holds them, never this contract.
  openrouter_overlay_relpath: inputs/r3_openrouter_overlay.yaml

schedule:
  unit_name: onex-delegation-scenario-r3
  state_directory: .onex_state/delegation-scenario-r3
  timeout_seconds: 900
  unit_environment: [ONEX_LEDGER_BUS_APPEND_COMMAND, ONEX_HOST_NAME, ONEX_WORKSPACE_CONFIG_ROOT, ONEX_BUS_EMIT_COMMAND]
  # The probe key is loaded from this file under the home directory, so its value never sits in the unit.
  environment_file: .config/onex/scenario-r3.env
  cadence:
    on_calendar: "*-*-* 00/6:25:00"
    time_zone: UTC
    randomized_delay: 0s
    persistent: false
    description: delegation readiness scenario R3, every six hours at minute 25 UTC

metadata:
  ticket: OMN-23182
  transport_type: inmemory
