name: node_convergence_orchestrator
version: 0.1.0
description: Orchestrator - on a runtime tick sends one convergence command per host as a lab work
  unit and publishes one typed result per host; the hosts, mode and commands come from the overlay.
omnibase_core_compat: '>=0.47.31,<0.48.0'
entry_points:
  onex.nodes:
    node_convergence_orchestrator: omnimarket.nodes.node_convergence_orchestrator
capabilities:
  standalone: false
  full_runtime: true
  requires_network: false
  requires_repo: false
  requires_secrets: false
  requires_docker: false
  side_effect_class: effectful
dependencies:
- pydantic>=2.0
- omnibase-infra>=0.38.3
license: MIT
authors:
- OmniNode Team
tags:
- orchestrator
- convergence
pack: operator_tooling
display_name: Convergence Orchestrator
node_role: orchestrator
