---
name: "node_review_finding_veto_effect"
# Run by the hostile-reviewer workflow between the reviewer's result and its verdict:
# `python -m omnimarket.nodes.node_review_finding_veto_effect` hands the handler a typed
# request and prints each dropped finding. The command topic names the bus entry a runtime
# would take; the result is the terminal event.
lifecycle: experimental
contract_name: node_review_finding_veto_effect
node_name: node_review_finding_veto_effect
node_type: EFFECT_GENERIC
contract_version: {major: 1, minor: 0, patch: 0}
node_version: {major: 1, minor: 0, patch: 0}
description: >
  A blocking review finding that claims a Python, YAML or JSON file is syntactically invalid
  is checked by parsing that file at the pull request head (ast.parse, yaml.safe_load_all,
  json.loads). When the file parses the finding is dropped from the blocking set with a logged
  reason, and a verdict that rested only on such findings becomes passed. Findings of every
  other class, syntax claims that hold, and claims the check cannot tie to the file it parsed
  are left exactly as the reviewers raised them.

input_model: omnimarket.nodes.node_review_finding_veto_effect.models.model_review_finding_veto.ModelReviewFindingVetoRequest

output_model:
  name: ModelReviewFindingVetoResult
  module: omnimarket.nodes.node_review_finding_veto_effect.models.model_review_finding_veto
  description: The reviewer's document without the disproved findings, and each dropped finding with its reason.

handler:
  module: omnimarket.nodes.node_review_finding_veto_effect.handlers.handler_review_finding_veto
  class: HandlerReviewFindingVeto
  input_model: omnimarket.nodes.node_review_finding_veto_effect.models.model_review_finding_veto.ModelReviewFindingVetoRequest

handler_routing:
  routing_strategy: operation_match
  handlers:
    - operation: review_finding_veto.verify_syntax_claims
      handler:
        name: HandlerReviewFindingVeto
        module: omnimarket.nodes.node_review_finding_veto_effect.handlers.handler_review_finding_veto
      handler_module: omnimarket.nodes.node_review_finding_veto_effect.handlers.handler_review_finding_veto
      event_model: omnimarket.nodes.node_review_finding_veto_effect.models.model_review_finding_veto.ModelReviewFindingVetoRequest

descriptor:
  node_archetype: effect
  purity: effectful
  idempotent: true
  timeout_ms: 120000
  runtime_profiles: [effects]

terminal_event: onex.evt.omnimarket.review-finding-veto-completed.v1

event_bus:
  subscribe_topics:
    - "onex.cmd.omnimarket.review-finding-veto-requested.v1"
  publish_topics:
    - "onex.evt.omnimarket.review-finding-veto-completed.v1"

published_events:
  - event_type: ModelReviewFindingVetoResult
    topic: onex.evt.omnimarket.review-finding-veto-completed.v1
    description: "The reviewer's document with the findings a parse disproved removed."

runtime_dispatch:
  command_topic: onex.cmd.omnimarket.review-finding-veto-requested.v1
  terminal_events:
    success: onex.evt.omnimarket.review-finding-veto-completed.v1

externally_consumed_topics:
  - onex.evt.omnimarket.review-finding-veto-completed.v1

dod_evidence:
  PYTEST:
    description: "a blocking 'invalid Python' finding on a file that parses is dropped; every other finding class is kept"
    command: "uv run pytest tests/unit/nodes/node_review_finding_veto_effect -q"
    pass_criteria: >
      the omnimarket#4063 test file at its blocked head parses and its finding is dropped with a
      reason; a file that does not parse keeps its finding; findings of other classes, non-blocking
      findings and syntax claims about another file are untouched.

metadata:
  transport_type: filesystem
