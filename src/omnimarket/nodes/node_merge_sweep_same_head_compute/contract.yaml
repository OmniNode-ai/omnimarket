# ONEX Node Contract - Merge Sweep Same Head Compute
# Direct invocation only: no event bus or terminal event.
name: "node_merge_sweep_same_head_compute"
lifecycle: experimental
node_type: "COMPUTE_GENERIC"
runtime_profiles: []
contract_version:
  major: 1
  minor: 0
  patch: 0
node_version: "1.0.0"
description: >-
  The merge sweep skips an open chain head in scope that is queued or handed off at its current head.
  Preserve the controller's strict-order reason for handed-off heads, otherwise carry the queue or handoff reason.
  Pure: callers read watcher records and ledger handoffs; this node reads and writes nothing.
