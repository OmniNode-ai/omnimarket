  class: "HandlerMergeSweepSameHead"
  input_model: "omnimarket.nodes.node_merge_sweep_same_head_compute.models.model_merge_sweep_same_head.ModelMergeSweepSameHeadRequest"
  output_model: "omnimarket.nodes.node_merge_sweep_same_head_compute.models.model_merge_sweep_same_head.ModelMergeSweepSameHeadResult"
handler_routing:
