name: node_item_owner_dispatch_effect
version: 1.0.0
description: Folds blocked lanes, pending rulings, plan-owner MISSING verdicts and operator asks into one typed item each, gives every item unowned past its bound exactly one owner lane through the remote-lane runner, writes the owner onto the item, and reads FINDING while any item stays unowned.
pack: operator_tooling
node_role: effect
display_name: Item Owner Dispatch
omnibase_core_compat: '>=0.39.0,<1.0.0'
entry_points:
  onex.nodes:
    node_item_owner_dispatch_effect: omnimarket.nodes.node_item_owner_dispatch_effect
capabilities:
  standalone: true
  full_runtime: false
  requires_network: true
  requires_repo: false
  requires_secrets: false
  requires_docker: false
  side_effect_class: read_write
dependencies:
- pydantic>=2.0
- pyyaml>=6.0
authors:
- OmniNode Platform Team
license: MIT
tags:
- effect
- owner
- nothing-dropped
