name: node_agent_sender_registry_effect
version: "0.1.0"
description: "Registers, lists and revokes one agent message sender and its signing key in the settings store, in the folders the agent message node's contract declares."
pack: agent_message
node_role: effect
display_name: "Agent Sender Registry Effect"
omnibase_core_compat: ">=0.39.0,<1.0.0"
entry_points:
  onex.nodes:
    node_agent_sender_registry_effect: "omnimarket.nodes.node_agent_sender_registry_effect"
capabilities:
  standalone: false
  full_runtime: true
  requires_network: true
  requires_repo: false
  requires_secrets: true
  requires_docker: false
  side_effect_class: write
dependencies:
  - "omnibase-infra>=0.38.3,<0.39.0"
  - "cryptography>=50.0.1,<51.0.0"
authors: ["OmniNode Platform Team"]
license: "MIT"
tags: ["effect", "agent-message", "sender-registry", "settings-store"]
