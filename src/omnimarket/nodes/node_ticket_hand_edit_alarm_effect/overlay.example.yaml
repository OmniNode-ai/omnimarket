# Example only. Copy to <root>/node_ticket_hand_edit_alarm_effect/overlay.yaml under ONEX_SKILL_OVERLAY_ROOTS and set your own values.
# At most one Linear read per interval; the share of Linear's rate limit it uses is unmeasured.
check_interval_seconds: 60
# Linear user id the ticket node writes as. A revision by any other actor after its last write is a finding.
node_actor_id: example-ticket-node-linear-user-id
initial_lookback_seconds: 600
# An issue changed within this many seconds is judged by a later sweep, so a write's event can arrive first.
write_grace_seconds: 30
# Rewrites applied to both texts before the rendered-text comparison (the tracker's own markdown round trip).
normalizations: []
