---
name: node_linear_updater_effect
contract_version: {major: 1, minor: 0, patch: 0}
node_type: EFFECT_GENERIC
node_version: {major: 0, minor: 1, patch: 0}
node_not_implemented: true
description: >
  Contract-only Wave 2 effect node that writes advisory validation status back
  to Linear. Linear annotations are supporting evidence surfaces and are not
  authoritative completion proof.

input_model:
  name: ModelEvidenceValidationResult
  module: omnibase_compat.contracts.evidence_pipeline.wire.model_evidence_validation_result
  description: "Validation result used to annotate the Linear ticket."
output_model:
  name: ModelEvidenceValidationResult
  module: omnibase_compat.contracts.evidence_pipeline.wire.model_evidence_validation_result
  description: "Acknowledged validation result after advisory annotation."

descriptor:
  node_archetype: effect
  purity: effectful
  runtime_profiles: [effects]
  idempotent: true
  timeout_ms: 120000

terminal_event: onex.evt.omnimarket.linear-evidence-updated.v1

event_bus:
  subscribe_topics:
    - onex.evt.omnimarket.evidence-validated.v1
  publish_topics:
    - onex.evt.omnimarket.linear-evidence-updated.v1

externally_consumed_topics:
  - onex.evt.omnimarket.linear-evidence-updated.v1

side_effects:
  reads:
    - linear_api
  writes:
    - linear_comment
    - linear_dod_evidence_annotation
  duplicate_key_fields:
    - ticket_id
    - validation_run_id

metadata:
  transport_type: kafka
  implementation_wave: 2
  handlers_deferred_until_wave: 3
  related_tickets: ["OMN-11443"]
