name: node_projection_mcp_tools
version: "1.0.0"
description: >
  Reducer node for MCP tool projection. Upserts mcp_tools table from
  mcp_eligible node-registration events. Drives omnidash mcp-tools widget.
omnibase_core_compat: ">=0.39.0,<1.0.0"
capabilities:
  standalone: true
  full_runtime: true
  requires_network: true
  requires_secrets: true
  side_effect_class: write_db
tags:
  - projection
  - mcp
  - reducer
pack: "data"
display_name: "Projection: MCP Tools"
node_role: "effect"
