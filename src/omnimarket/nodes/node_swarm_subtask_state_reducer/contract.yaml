---
# SPDX-FileCopyrightText: 2025 OmniNode.ai Inc.
# SPDX-License-Identifier: MIT
# ONEX Node Contract - Swarm Subtask State Reducer
#
# Pure reducer: materializes per-subtask lifecycle state from delegation events.
# Makes fan-out/fan-in replay-safe and observable.
# Idempotency key: run_id + subtask_id + terminal_event_id
#
# Related Tickets:
#   - OMN-12120: node_swarm_subtask_state_reducer
name: node_swarm_subtask_state_reducer
node_type: reducer
contract_version: {major: 1, minor: 0, patch: 0}
node_version: {major: 1, minor: 0, patch: 0}

runtime_profiles: [main]

description: >
  Pure reducer that materializes per-subtask lifecycle state from delegation events.
  delta(state, event) -> (new_state, projection_applied_event).
  Idempotent: replaying the same terminal event produces the same state with no
  duplicate transitions. Ordering authority is topic/partition/offset, not timestamps.

handler:
  module: omnimarket.nodes.node_swarm_subtask_state_reducer.handlers.handler_swarm_subtask_state
  class: HandlerSwarmSubtaskState

input_model:
  name: ModelSwarmSubtaskReducerInput
  module: omnimarket.nodes.node_swarm_subtask_state_reducer.models.model_swarm_subtask_input
  description: "Wrapper for incoming delegation event + current run state."

output_model:
  name: ModelSwarmSubtaskReducerOutput
  module: omnimarket.nodes.node_swarm_subtask_state_reducer.models.model_swarm_subtask_output
  description: "New run state + projection freshness fields."

# OMN-14534: routing_strategy was operation_match with NO event_model declared
# on the single handler entry. With no event_model, the auto-wiring dispatcher
# (omnibase_infra handler_wiring.py) calls handle() with the RAW
# ModelEventEnvelope object instead of a validated payload — every real
# dispatch raised TypeError inside handle(), which MessageDispatchEngine
# swallowed into a HANDLER_ERROR status while the offset still committed:
# silent, permanent data loss on every message across all 5 subscribed
# topics. topic_match + a per-topic event_model (matching node_projection_swarm's
# established pattern) makes the dispatcher validate the real producer wire
# shape before calling handle(). The 5 topics carry 3 distinct real producer
# models (delegation-execute is the fan-out command; the 3 delegation-* event
# topics are node_llm_delegation_call_effect's outputs; swarm-fanout-completed
# is node_swarm_fanout_orchestrator's terminal) — none of them is the
# reducer's own ModelDelegationEvent, so handle() now adapts each real shape
# instead of the (never-matched) invented one.
handler_routing:
  routing_strategy: topic_match
  handlers:
    - topic: onex.cmd.omnimarket.delegation-execute.v1
      operation: reduce_subtask_state
      event_model:
        name: ModelLlmDelegationCallRequest
        module: omnimarket.nodes.node_llm_delegation_call_effect.models.model_llm_delegation_call_request
      handler:
        name: HandlerSwarmSubtaskState
        module: omnimarket.nodes.node_swarm_subtask_state_reducer.handlers.handler_swarm_subtask_state
    - topic: onex.evt.omnimarket.delegation-call-completed.v1
      operation: reduce_subtask_state
      event_model:
        name: ModelLlmDelegationCompletedEvent
        module: omnimarket.models.delegation.llm_cost_routing.model_llm_delegation_completed_event
      handler:
        name: HandlerSwarmSubtaskState
        module: omnimarket.nodes.node_swarm_subtask_state_reducer.handlers.handler_swarm_subtask_state
    - topic: onex.evt.omnimarket.delegation-escalation-triggered.v1
      operation: reduce_subtask_state
      event_model:
        name: ModelLlmDelegationEscalationTriggeredEvent
        module: omnimarket.models.delegation.llm_cost_routing.model_llm_delegation_escalation_triggered_event
      handler:
        name: HandlerSwarmSubtaskState
        module: omnimarket.nodes.node_swarm_subtask_state_reducer.handlers.handler_swarm_subtask_state
    - topic: onex.evt.omnimarket.delegation-all-tiers-failed.v1
      operation: reduce_subtask_state
      event_model:
        name: ModelLlmDelegationAllTiersFailedEvent
        module: omnimarket.models.delegation.llm_cost_routing.model_llm_delegation_all_tiers_failed_event
      handler:
        name: HandlerSwarmSubtaskState
        module: omnimarket.nodes.node_swarm_subtask_state_reducer.handlers.handler_swarm_subtask_state
    - topic: onex.evt.omnimarket.swarm-fanout-completed.v1
      operation: reduce_subtask_state
      event_model:
        name: ModelSwarmFanoutResult
        module: omnimarket.nodes.node_swarm_fanout_orchestrator.models.model_swarm_fanout_result
      handler:
        name: HandlerSwarmSubtaskState
        module: omnimarket.nodes.node_swarm_subtask_state_reducer.handlers.handler_swarm_subtask_state

descriptor:
  node_archetype: reducer
  purity: pure
  idempotent: true
  timeout_ms: 5000

event_bus:
  subscribe_topics:
    - onex.cmd.omnimarket.delegation-execute.v1
    - onex.evt.omnimarket.delegation-call-completed.v1
    - onex.evt.omnimarket.delegation-escalation-triggered.v1
    - onex.evt.omnimarket.delegation-all-tiers-failed.v1
    - onex.evt.omnimarket.swarm-fanout-completed.v1
  publish_topics:
    - onex.evt.omnimarket.swarm-subtask-state-changed.v1
    - onex.evt.omnimarket.swarm-subtask-projection-applied.v1

metadata:
  transport_type: kafka
  description: "Swarm subtask lifecycle state reducer — replay-safe, idempotent"
  author: "OmniNode Team"
  created: "2026-05-25"
  tags:
    - reducer
    - swarm
    - subtask
    - idempotent
    - OMN-12120
  related_tickets:
    - OMN-12120

# OMN-13734: machine-readable FSM (transcribed from authoritative handler/model logic).
state_machine:
  state_machine_name: swarm_subtask_state_fsm
  initial_state: assigned
  states:
    - state_name: assigned
      description: "Subtask assigned to a delegation tier (delegation_execute)."
      required_data: []
    - state_name: escalating
      description: "Subtask escalated to a higher tier."
      required_data: []
    - state_name: completed
      description: "Subtask completed successfully."
      is_terminal: true
      required_data: []
    - state_name: failed
      description: "All tiers exhausted; subtask failed."
      is_terminal: true
      required_data: []
  transitions:
    - from_state: assigned
      to_state: assigned
      trigger: delegation_execute
      description: "Re-receive execute for the subtask."
    - from_state: assigned
      to_state: completed
      trigger: delegation_call_completed
      description: "Delegation call completed."
    - from_state: assigned
      to_state: escalating
      trigger: delegation_escalation_triggered
      description: "Guard: tier failed, attempts remain."
    - from_state: assigned
      to_state: failed
      trigger: delegation_all_tiers_failed
      description: "All tiers exhausted."
    - from_state: escalating
      to_state: completed
      trigger: delegation_call_completed
      description: "Escalated call completed."
    - from_state: escalating
      to_state: escalating
      trigger: delegation_escalation_triggered
      description: "Guard: escalate again, attempts remain."
    - from_state: escalating
      to_state: failed
      trigger: delegation_all_tiers_failed
      description: "All tiers exhausted after escalation."
  terminal_states: [completed, failed]
  persistence_enabled: false
