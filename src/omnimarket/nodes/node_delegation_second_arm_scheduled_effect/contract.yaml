---
# SPDX-FileCopyrightText: 2026 OmniNode.ai Inc.
# SPDX-License-Identifier: MIT
# ONEX Node Contract - Delegation Second Arm Scheduled Effect (OMN-25052)
#
# Runs one run of the delegation ladder's second local benchmark arm on the runtime tick, in place of a hand-run benchmark script.
# Shape of node_commitment_check_scheduled_effect: it subscribes to the runtime scheduler's tick, gates on its own overlay
# (run_interval_seconds, grace_seconds) and returns its terminal event for the runtime to publish.
name: node_delegation_second_arm_scheduled_effect
contract_name: node_delegation_second_arm_scheduled_effect
node_name: node_delegation_second_arm_scheduled_effect
contract_version: {major: 0, minor: 1, patch: 0}
node_version: {major: 0, minor: 1, patch: 0}
node_type: effect
lifecycle: experimental
runtime_profiles: [effects]

description: >
  Sends one delegate run pinned on the second local arm's backend id on the runtime's tick, with the task and delegate command the schedule overlay names, and returns a typed run event naming the backend that answered. A run that did not complete, that another backend answered or that printed no receipt is a failed run event that names it.

handler:
  module: omnimarket.nodes.node_delegation_second_arm_scheduled_effect.handlers.handler_second_arm_scheduled
  class: HandlerSecondArmScheduled
  input_model: omnibase_infra.runtime.models.model_runtime_tick.ModelRuntimeTick

handler_routing:
  routing_strategy: operation_match
  handlers:
    - operation: second_arm.scheduled_tick
      handler:
        name: HandlerSecondArmScheduled
        module: omnimarket.nodes.node_delegation_second_arm_scheduled_effect.handlers.handler_second_arm_scheduled
      handler_module: omnimarket.nodes.node_delegation_second_arm_scheduled_effect.handlers.handler_second_arm_scheduled
      event_model: omnibase_infra.runtime.models.model_runtime_tick.ModelRuntimeTick
      event_type: platform.runtime-tick
      description: >
        Gate on the overlay's run_interval_seconds, then send one pinned delegate run and return the run event.

input_model:
  name: ModelRuntimeTick
  module: omnibase_infra.runtime.models.model_runtime_tick
  description: The runtime scheduler's tick.
output_model:
  name: ModelScheduleRunEvent
  module: omnimarket.models.schedule_trigger.model_schedule_trigger
  description: "One scheduled job run, with when it was scheduled, when it fired and how it went."

descriptor:
  node_archetype: effect
  purity: effectful
  idempotent: false
  # The overlay's timeout_seconds bounds the one delegate command; one scheduled tick may take as long as one run.
  timeout_ms: 1200000
  side_effects:
    - sends one pinned delegate run on the runtime tick

input_subscriptions:
  - topic: "onex.intent.platform.runtime-tick.v1"
    operation: "second_arm.scheduled_tick"

terminal_event: onex.evt.omnimarket.schedule-run.v1

event_bus:
  subscribe_topics:
    - "onex.intent.platform.runtime-tick.v1"
  publish_topics:
    - "onex.evt.omnimarket.schedule-run.v1"

published_events:
  - event_type: ModelScheduleRunEvent
    topic: onex.evt.omnimarket.schedule-run.v1
    description: "One scheduled second benchmark arm run."

externally_consumed_topics:
  - onex.evt.omnimarket.schedule-run.v1

# Where the schedule reads its settings. The overlays are found under ONEX_SKILL_OVERLAY_ROOTS or the file the env var names.
runtime:
  schedule_overlay: {overlay_id: node_delegation_second_arm_scheduled_effect, model: omnimarket.nodes.node_delegation_second_arm_scheduled_effect.models.model_second_arm_schedule_overlay.ModelSecondArmScheduleOverlay}

broker_acl_grants:
  - principal: "${ONEX_ACL_RUNTIME_PRINCIPAL}"
    grants:
      - {resource_type: TOPIC, pattern: LITERAL, name: onex.evt.omnimarket.schedule-run.v1, operation: WRITE}
      - {resource_type: TOPIC, pattern: LITERAL, name: onex.evt.omnimarket.schedule-run.v1, operation: DESCRIBE}
      - {resource_type: TOPIC, pattern: LITERAL, name: onex.intent.platform.runtime-tick.v1, operation: READ}
      - {resource_type: TOPIC, pattern: LITERAL, name: onex.intent.platform.runtime-tick.v1, operation: DESCRIBE}

metadata:
  ticket: OMN-25052
  transport_type: kafka
