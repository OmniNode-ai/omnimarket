# ONEX Node Contract - Ask State Compute (OMN-21713)
#
# Operator ruling 2026-10-31 (kind=process, OMN-17427): every ask or idea the operator states is
# captured as a tracked item (owner, ticket or parked reason, sequence position) so none is
# dropped; parked items stay visible; an ask with no owner, ticket or parked row is reported as
# dropped.
#
# One pure fold: the operator prompts node_operator_capture_effect stored, plus the ledger rows
# (CLAIM, TERMINAL, STATUS, HOLD, MSG, RULING, CORRECTION), into each ask with its state and the
# parked queue. It reuses node_operator_capture_compute's row parser, evidence rule and term
# extraction. No clock, no file, no network: the caller supplies the prompts, the rows and the time.
#
# Row grammar the node reads (no new row type): a lane that takes, parks or tickets an ask cites
# it with ask=<id> on its CLAIM, TERMINAL, MSG or HOLD row, or on a STATUS row
#   STATUS | lane=<lane> | ask=<id> | state=parked | reason=<why> | seq=<n>
#   STATUS | lane=<lane> | ask=<id> | state=ticketed | ticket=OMN-n
# An ask no row cites is tied to a CLAIM or verbatim RULING by its words and reported as inferred.
name: "node_ask_state_compute"
node_type: "COMPUTE_GENERIC"
contract_version:
  major: 0
  minor: 1
  patch: 0
node_version: "0.1.0"
lifecycle: experimental
description: "Each operator ask or idea with its state: owned, ticketed, parked, done or dropped."
input_model:
  name: "ModelAskStateRequest"
  module: "omnimarket.nodes.node_ask_state_compute.models.model_ask_state"
  description: "Captured operator prompts, ledger rows, the window start, the judging time and the config."
output_model:
  name: "ModelAskStateReport"
  module: "omnimarket.nodes.node_ask_state_compute.models.model_ask_state"
  description: "Every tracked ask with its state, the parked queue, the dropped ids, counts and WIP."
handler:
  module: "omnimarket.nodes.node_ask_state_compute.handlers.handler_ask_state"
  class: "HandlerAskState"
  input_model: "omnimarket.nodes.node_ask_state_compute.models.model_ask_state.ModelAskStateRequest"
  output_model: "omnimarket.nodes.node_ask_state_compute.models.model_ask_state.ModelAskStateReport"
handler_routing:
  routing_strategy: "operation_match"
  default_handler: "omnimarket.nodes.node_ask_state_compute.handlers.handler_ask_state:HandlerAskState"
  handlers:
    - operation: "fold_ask_state"
      handler:
        name: "HandlerAskState"
        module: "omnimarket.nodes.node_ask_state_compute.handlers.handler_ask_state"
runtime_dispatch:
  command_topic: "onex.cmd.omnimarket.ask-state-requested.v1"
  terminal_events:
    success: "onex.evt.omnimarket.ask-state-completed.v1"
    failure: "onex.evt.omnimarket.ask-state-failed.v1"
  external_trigger: "node_ask_state_effect (python -m omnimarket.nodes.node_ask_state_effect --since <UTC stamp>) reads the sources and calls HandlerAskState.handle in process."
descriptor:
  node_archetype: compute
  purity: pure
  idempotent: true
  timeout_ms: 5000
dod_evidence:
  PYTEST:
    description: "ask states on fixtures: chat-only ask dropped, lane-spawning ask owned then done, parked queue order, grace window, inferred link"
    command: "uv run pytest tests/unit/nodes/node_ask_state_compute -q"
    pass_criteria: "every test passes"

# Vocabularies and limits the handler reads from its request (ModelAskStateConfig). The handler holds none.
# wip_limit stays null until an overlay or the operator sets it: a missing limit prints UNKNOWN and is
# never read as unlimited.
config:
  schema_id: omni.ask-state/1
  tracked_kinds: [ask, idea]
  grace_minutes: 30
  link_window_hours: 24
  min_shared_terms: 2
  min_shared_fraction: 0.5
  stem_chars: 5
  min_term_chars: 3
  ask_term_limit: 8
  max_claim_frequency: 0.2
  min_quote_chars: 24
  done_outcomes: [done, merged]
  handoff_outcomes: [handed-off]
  capture_lane: operator-capture
  ask_cells: [ask, asks]
  closes_ask_cell: closes-ask
  state_cell: state
  parked_state: parked
  ticketed_state: ticketed
  reason_cell: reason
  seq_cell: seq
  excerpt_chars: 140
  wip_limit: null

metadata:
  description: "Operator ask state"
  author: "OmniNode Team"
  created: "2026-10-31"
  tags:
    - "compute"
    - "operator-capture"
    - "work-ledger"
  related_tickets: [OMN-21713, OMN-17427, OMN-20906]
