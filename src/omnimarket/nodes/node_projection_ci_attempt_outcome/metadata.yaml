name: projection_ci_attempt_outcome
version: "1.0.0"
description: >
  Materializes one row per (repository, pull request, head commit, check, run
  attempt) carrying the OMN-18902 merge-check cause code, its provenance and
  the attempt ordinal, from the pull-request inventory node's completed event.
omnibase_core_compat: ">=0.39.0,<1.0.0"
capabilities:
  standalone: true
  full_runtime: true
  requires_network: true
  requires_secrets: true
  side_effect_class: write_db
dependencies:
  - "omnibase_core>=0.39.0"
  - "pyyaml>=6.0"
tags:
  - projection
  - observability
  - merge-control
  - reducer
ownership:
  ci_attempt_outcome:
    ddl_owner: omnimarket.nodes.node_projection_ci_attempt_outcome
    table_role: projection_read_model
    create_migration: "migrations/0000_create_ci_attempt_outcome.sql"
    duplicate_migration_policy: forbid_cross_repo_create_table
    non_owner_repos:
      - omnibase_infra
    rationale: >
      omnibase_infra APPLIES the migration -- its forward-migration runner is
      where the vendored copy lives -- and does not own the read model. The
      materialized outcome table is an omnimarket projection, like every other
      node_projection_* read model, and the classifier whose verdict it stores
      is an omnimarket module.
pack: "data"
display_name: "Projection: CI Attempt Outcome"
node_role: "effect"
