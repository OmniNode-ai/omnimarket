# Neutral default swarm endpoint registry (OMN-20935).
#
# The endpoints a deployment serves its models from are deployment facts, supplied
# by whoever runs the system, not by this package. With no overlay this registry
# declares no endpoint, so selection reports every subtask unroutable and the
# endpoint-health and fleet-discovery nodes find nothing to probe.
#
# To supply a registry, either name a file in OMNIMARKET_SWARM_ENDPOINT_REGISTRY or
# put it at <root>/node_swarm_registry_compute/overlay.yaml under a root listed in
# ONEX_SKILL_OVERLAY_ROOTS. The file has this shape; the address is from the
# documentation range (RFC 5737):
#
#   registry_schema_version: "1.0.0"
#   endpoints:
#     - id: "example-endpoint"
#       base_url: "http://192.0.2.10:8000/v1"
#       model_id: "example-model"
#       endpoint_ref: "LLM_EXAMPLE_URL"
#       provider: "vllm"
#       capabilities: [code_generation, reasoning]
#       context_window: 131072
#       context_window_source: "probe"
#       cost_basis: "local"
#       health_check_path: "/health"
#       declared_by: "operator"
registry_schema_version: "1.0.0"
endpoints: []
