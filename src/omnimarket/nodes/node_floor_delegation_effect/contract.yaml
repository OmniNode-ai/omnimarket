# ONEX Node Contract - Floor Delegation Tracker Effect (OMN-23081)
#
# Three stages, run as steps of the factory floor publish. "scenarios" reads the latest scheduled runs of each delegation
# scenario's workflow through the source-control node. "routes" (OMN-23381) reads the delegations per hour by route (local, GLM,
# other) from the lab's database over ssh in a read only transaction. "build" reads the ticket mirror, the pull request watcher and the
# factory floor record, and writes the tracker the floor's Delegation tab shows: a shippable line (every scenario passes on
# its latest scheduled run), and the delegation readiness plan's tickets grouped by where they stand. A source that cannot be
# read is unread and is never counted as a pass. Paths are relative to the registry home (OMNI_HOME).
name: node_floor_delegation_effect
contract_name: node_floor_delegation_effect
node_name: node_floor_delegation_effect
contract_version: {major: 0, minor: 1, patch: 0}
node_version: {major: 0, minor: 1, patch: 0}
node_type: effect
lifecycle: experimental
runtime_profiles: []

description: >
  Reads the delegation scenarios' latest scheduled runs and the delegation readiness plan's ticket states, and writes the
  delegation tracker: whether delegation is shippable, each scenario's latest result, each plan ticket's group, and the delegations
  per hour by route with the local share.

handler:
  module: omnimarket.nodes.node_floor_delegation_effect.handlers.handler_floor_delegation
  class: HandlerFloorDelegation
  input_model: omnimarket.nodes.node_floor_delegation_effect.models.model_floor_delegation.ModelFloorDelegationRequest
  output_model: omnimarket.nodes.node_floor_delegation_effect.models.model_floor_delegation.ModelFloorDelegationResult

handler_routing:
  routing_strategy: operation_match
  handlers:
    - operation: run_floor_delegation_stage
      handler:
        name: HandlerFloorDelegation
        module: omnimarket.nodes.node_floor_delegation_effect.handlers.handler_floor_delegation
      input_model: omnimarket.nodes.node_floor_delegation_effect.models.model_floor_delegation.ModelFloorDelegationRequest
      output_model: omnimarket.nodes.node_floor_delegation_effect.models.model_floor_delegation.ModelFloorDelegationResult

descriptor:
  node_archetype: effect
  purity: effectful
  runtime_profiles: []
  idempotent: true
  timeout_ms: 60000
  side_effects:
    - runs the registry's onex source-control read (run-list) once per scenario workflow, in parallel, and writes the answers to the node's state file
    - reads the ticket mirror, the pull request watcher state and the factory floor record under the registry home
    - reads the delegation events table of the lab's database over ssh in a read only transaction and writes the hour counts to the node's state file
    - writes the tracker file the publish copies to the serving host

input_model:
  name: ModelFloorDelegationRequest
  module: omnimarket.nodes.node_floor_delegation_effect.models.model_floor_delegation
  description: The stage to run and the registry home.
output_model:
  name: ModelFloorDelegationResult
  module: omnimarket.nodes.node_floor_delegation_effect.models.model_floor_delegation
  description: Whether the stage wrote its file, and for the build stage whether delegation is shippable.

runtime_dispatch:
  external_trigger: python -m omnimarket.nodes.node_floor_delegation_effect scenarios|routes|build|run, as a step of python -m omnimarket.nodes.node_factory_floor_publish_effect, from the registry module tick that the host installer contract declares.

event_bus:
  subscribe_topics: []
  publish_topics: []

runtime:
  home_env: OMNI_HOME
  onex_relpath: omnibase_infra/scripts/onex
  # Which repositories, workflows and plan tickets the tracker follows, the scenarios and the operator's answers are deployment
  # facts of a private estate: the overlay <root>/node_floor_delegation_effect/overlay.yaml under ONEX_SKILL_OVERLAY_ROOTS, or the file
  # the variable names. There is no packaged fallback.
  overlay_id: node_floor_delegation_effect
  overlay_file_env: ONEX_FLOOR_DELEGATION_OVERLAY
  record_relpath: .claude_scratch/factory-floor/factory-floor.json
  watcher_relpath: .claude_scratch/pr-watcher/state.json
  ticket_mirror_relpath: .onex_state/ticket-mirror
  scenario_reads_relpath: .onex_state/floor-delegation/scenario-runs.json
  output_relpath: .claude_scratch/factory-floor/delegation-tracker.json
  # OMN-23381: the delegations per hour by route. The routes stage writes the hour counts here; the tracker's routes block shows
  # them only while the read is newer than routes_max_age_min, else it is stale (or unread) and shows no number and no share.
  # Which backend names are local and GLM, how many hours are read and where the database is are the overlay's routes block.
  route_reads_relpath: .onex_state/floor-delegation/route-reads.json
  routes_max_age_min: 90
  routes_read_timeout_seconds: 12
  routes_table: delegation_events
  routes_data_source: real
  # A scenario's result is its latest finished run of this event. One read lists this many runs, newest first.
  scenario_event: schedule
  scenario_run_limit: 10
  scenario_read_timeout_seconds: 25
  # One read is a source-control round trip of 3 s on an idle host and several times that under the launchd clamp, and
  # parallel reads queue behind each other, so the stage reads one scenario at a time, the least recently read first, and
  # stops starting reads at the deadline (it runs in the publish's first concurrent group, whose limit is 90 s). A scenario
  # read within scenario_refresh_seconds is not read again, so a run refreshes about half of them and none waits longer than two runs.
  scenario_stage_deadline_seconds: 70
  scenario_refresh_seconds: 420
  # A scenario read older than this is drawn unread instead of reading old state as current.
  scenario_reads_max_age_seconds: 1800
  # The tracker runs in the publish's first input group, before the factory floor record of this cycle is written, so the lanes
  # come from the record of the cycle before; a record older than this is not trusted and no ticket is shown as running a lane.
  record_max_age_seconds: 900
  watcher_max_age_seconds: 5400
  details_page_size: 25
  # A floor lane in one of these states does not count as running a ticket.
  live_lane_dead_states: [dead, finished]

metadata:
  transport_type: local
