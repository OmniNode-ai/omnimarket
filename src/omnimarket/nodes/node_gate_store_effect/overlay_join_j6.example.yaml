# Synthetic values. The deployment's overlay lives at <root>/node_gate_store_join_j6/overlay.yaml under a root named in
# ONEX_SKILL_OVERLAY_ROOTS. No key has a default. The upstream rule and the emission journal are read from the join refusal
# overlay (node_join_refusal_effect), join J6.
emission_node: "example_gate_store_node:join_j6"
