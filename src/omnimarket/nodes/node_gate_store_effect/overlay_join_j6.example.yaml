other_piece: example_piece_other
piece_limit: 3
reservation_ttl_seconds: 60
max_chains_per_run: 1
drill_window_hours: 6
drill_commit_deadline_seconds: 0.2
drill_silence_seconds: 2.0
allow_injected_break: false
injected_fault: Swap the audit sink for one that reports the append and keeps nothing
