---
name: node_evidence_extractor_compute
contract_version: {major: 1, minor: 0, patch: 0}
node_type: COMPUTE_GENERIC
node_version: {major: 0, minor: 1, patch: 0}
node_not_implemented: false
description: >
  Native pure compute node that normalizes raw evidence into a
  structured evidence bundle. The handler must perform no I/O and must declare
  validator_version for deterministic replay.

handler:
  module: omnimarket.nodes.node_evidence_extractor_compute.handlers.handler_evidence_extractor_compute
  class: HandlerEvidenceExtractorCompute
  input_model: omnibase_compat.contracts.evidence_pipeline.wire.model_raw_evidence_payload.ModelRawEvidencePayload

handler_routing:
  handlers:
    - handler:
        name: HandlerEvidenceExtractorCompute
        module: omnimarket.nodes.node_evidence_extractor_compute.handlers.handler_evidence_extractor_compute

input_model:
  name: ModelRawEvidencePayload
  module: omnibase_compat.contracts.evidence_pipeline.wire.model_raw_evidence_payload
  description: "Raw collected evidence from GitHub, CI, filesystem, git, and projection surfaces."
output_model:
  name: ModelEvidenceBundle
  module: omnibase_compat.contracts.evidence_pipeline.wire.model_evidence_bundle
  description: "Structured evidence bundle with provenance, hashes, scope, and ticket identity."

descriptor:
  node_archetype: compute
  purity: pure
  runtime_profiles: [compute]
  idempotent: true
  timeout_ms: 120000

terminal_event: onex.evt.omnimarket.evidence-extracted.v1

event_bus:
  subscribe_topics:
    - onex.evt.omnimarket.evidence-collected.v1
  publish_topics:
    - onex.evt.omnimarket.evidence-extracted.v1

replay:
  requires_validator_version: true
  timestamp_authority: ingest_sequence
  deterministic: true

metadata:
  transport_type: kafka
  implementation_wave: 3
  related_tickets: ["OMN-11443", "OMN-12395"]
