name: node_prepush_preflight_effect
lifecycle: experimental
node_type: EFFECT_GENERIC
contract_version: {major: 1, minor: 0, patch: 0}
node_version: {major: 1, minor: 0, patch: 0}
description: >
  Run a repository's pre-push stage hooks against a lane's pending push range
  (upstream or base to HEAD, with the staged change as its tip) before the lane
  pushes, and report each refusal with its hook id and finding (OMN-22452). The
  remote-lane hook-preflight makes this one call, so a lane learns of a pre-push
  refusal while it can still fix it. Runs the repository's own pre-commit
  configuration; never skips, edits or bypasses a hook, commits or pushes.
descriptor:
  node_archetype: effect
  purity: effectful
  idempotent: true
  timeout_ms: 300000
  runtime_profiles: []
handler:
  module: omnimarket.nodes.node_prepush_preflight_effect.handlers.handler_prepush_preflight
  class: HandlerPrepushPreflight
  input_model: omnimarket.nodes.node_prepush_preflight_effect.models.model_prepush_preflight_request.ModelPrepushPreflightRequest
  output_model: omnimarket.nodes.node_prepush_preflight_effect.models.model_prepush_preflight_result.ModelPrepushPreflightResult
handler_routing:
  routing_strategy: operation_match
  handlers:
    - operation: check_prepush_preflight
      handler:
        name: HandlerPrepushPreflight
        module: omnimarket.nodes.node_prepush_preflight_effect.handlers.handler_prepush_preflight
      event_model: omnimarket.nodes.node_prepush_preflight_effect.models.model_prepush_preflight_request.ModelPrepushPreflightRequest
input_model:
  name: ModelPrepushPreflightRequest
  module: omnimarket.nodes.node_prepush_preflight_effect.models.model_prepush_preflight_request
output_model:
  name: ModelPrepushPreflightResult
  module: omnimarket.nodes.node_prepush_preflight_effect.models.model_prepush_preflight_result
event_bus:
  subscribe_topics: []
  publish_topics: []
runtime_dispatch:
  external_trigger: the remote-lane hook-preflight asks this node through onex node in the lane's worktree
metadata:
  ticket: OMN-22452
  transport_type: local
