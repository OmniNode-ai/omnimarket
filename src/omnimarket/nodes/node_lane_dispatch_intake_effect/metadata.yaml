name: node_lane_dispatch_intake_effect
version: "0.1.0"
description: "Effect: read MSG rows addressed to labdispatch over the ledger bus, build and check each requested lane brief through the lane-brief skill, place each lane with the remote-lane runner detached, strictly one at a time, and write one STATUS row per placement. Hosted by one systemd user timer tick on the standing dispatcher host, never by a shared runtime."
pack: operator_tooling
node_role: effect
display_name: "Lane Dispatch Intake Effect (lab host)"
omnibase_core_compat: ">=0.39.0,<1.0.0"
entry_points:
  onex.nodes:
    node_lane_dispatch_intake_effect: "omnimarket.nodes.node_lane_dispatch_intake_effect"
capabilities:
  standalone: false
  full_runtime: false
  requires_network: true
  requires_repo: false
  requires_secrets: false
  requires_docker: false
  side_effect_class: write
dependencies:
  - "pydantic>=2.0"
authors: ["OmniNode Platform Team"]
license: "MIT"
tags: ["effect", "lab", "lane-dispatch"]
