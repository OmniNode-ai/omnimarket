# ONEX Node Contract - Floor Emission Compute (OMN-19998, 17a)
#
# Pure compute: handle(ModelFloorReceiptInput) -> ModelFloorReceipts.
# The emission contract lives here: every node of every piece emits a start, then a success or a typed failure, with
# counters, on the three topics below. This node folds those events into the golden and error receipts the floor draws
# per piece and per join. The pieces, the joins and the freshness bounds are the floor overlay's, never this file's.
name: node_floor_emission_compute
contract_name: node_floor_emission_compute
node_name: node_floor_emission_compute
contract_version: {major: 0, minor: 1, patch: 0}
node_version: {major: 0, minor: 1, patch: 0}
node_type: compute
lifecycle: experimental
runtime_profiles: [main]

description: >
  Folds emission events into golden and error receipts per piece and per join. A chain that breaks the emission
  contract (a terminal with no start, a start with no terminal past the deadline, a success and a failure under one
  correlation id, a second start) is named by a finding and is never counted. A join passes only on a golden chain
  (A succeeded, B started after it and succeeded) and an error chain (A failed, B holds a typed upstream failure and
  never started). No clock read, no state, no I/O.

handler:
  module: omnimarket.nodes.node_floor_emission_compute.handlers.handler_floor_receipt
  class: HandlerFloorReceipt
  input_model: omnimarket.models.floor_17a.ModelFloorReceiptInput

handler_routing:
  routing_strategy: operation_match
  handlers:
    - operation: compute_floor_receipts
      handler:
        name: HandlerFloorReceipt
        module: omnimarket.nodes.node_floor_emission_compute.handlers.handler_floor_receipt
      input_model: omnimarket.models.floor_17a.ModelFloorReceiptInput
      output_model: omnimarket.models.floor_17a.ModelFloorReceipts

descriptor:
  node_archetype: compute
  purity: pure
  idempotent: true
  timeout_ms: 1000

input_model:
  name: ModelFloorReceiptInput
  module: omnimarket.models.floor_17a
  description: The emission events of the window, the declared pieces and joins, and the freshness bounds.
output_model:
  name: ModelFloorReceipts
  module: omnimarket.models.floor_17a
  description: Chains, golden and error receipts per piece and join, and the named findings.

terminal_event: onex.evt.omnimarket.floor-receipts-computed.v1

runtime_dispatch:
  external_trigger: run in process by node_floor_simple_effect (chain node_floor_emission_compute:compute_floor_receipts); the input is a whole window, never a single event, so the node subscribes to nothing (OMN-24298).

event_bus:
  subscribe_topics: []
  # This node publishes only its receipts. The three emission topics are published by node_floor_simple_effect and read at
  # once by node_floor_emissions_publish_effect (its snapshot_reads); a single event is never dispatched to this node.
  publish_topics:
    - onex.evt.omnimarket.floor-receipts-computed.v1

externally_consumed_topics:
  - onex.evt.omnimarket.floor-receipts-computed.v1
