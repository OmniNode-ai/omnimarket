name: node_consumer_flow_prune_effect
version: "1.0.0"
description: "Archive consumer_flow_windows rows older than 30 days to verified, encrypted objects, then prune them."
omnibase_core_compat: ">=0.46.13,<0.47.0"
entry_points:
  onex.nodes:
    node_consumer_flow_prune_effect: "omnimarket.nodes.node_consumer_flow_prune_effect"
capabilities:
  standalone: true
  full_runtime: true
  requires_network: true
  requires_repo: false
  requires_secrets: true
  requires_docker: false
  side_effect_class: database_write
dependencies:
  - "omnibase_core>=0.46.13"
  - "omnibase-infra>=0.38.3"
  - "psycopg2-binary"
  - "boto3"
  - "cryptography"
  - "pyyaml"
authors: ["OmniNode Platform Team"]
license: "MIT"
tags: ["effect", "archive", "retention", "consumer-flow", "observability"]
pack: "observability"
display_name: "Consumer-Flow Prune Effect"
node_role: "effect"
