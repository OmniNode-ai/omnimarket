name: node_host_down_reading_effect
version: 1.0.0
description: A host-down reading published from a lab host. One sweep probes every available host of the lab host table, asks node_host_down_compute for each host's state, writes the readings to a store, reads them back and publishes each reading; lab placement reads the store.
pack: operator_tooling
node_role: effect
display_name: Host Down Reading Effect
omnibase_core_compat: '>=0.39.0,<1.0.0'
entry_points:
  onex.nodes:
    node_host_down_reading_effect: omnimarket.nodes.node_host_down_reading_effect
capabilities:
  standalone: true
  full_runtime: false
  requires_network: true
  requires_repo: false
  requires_secrets: false
  requires_docker: false
  side_effect_class: write
dependencies:
- pydantic>=2.0
- pyyaml>=6.0
- omnibase-infra>=0.1.0
