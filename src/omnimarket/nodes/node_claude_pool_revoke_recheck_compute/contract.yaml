name: node_claude_pool_revoke_recheck_compute
lifecycle: experimental
node_type: compute
contract_version: {major: 1, minor: 0, patch: 0}
node_version: "1.0.0"
description: >-
  Decides, for one revoked Claude token-pool label, whether its mark is due for a
  re-probe and, once a probe answered, what to do with the revoked mark: an ok answer
  clears it, a limited answer shows the token still authenticates so the revoke is not
  real and clears it too, a refused answer on a challenged label confirms the
  revocation, a refused answer on a revoked label keeps the mark with the probe time
  recorded, an error answer proves nothing. Pure compute over the mark, the clock value
  passed in, the overlay interval and the probe answer; the handler reads no clock and
  carries no token or secret value.
input_model:
  name: ModelRevokeRecheckRequest
  module: omnimarket.models.model_claude_pool_revoke_recheck
output_model:
  name: ModelRevokeRecheckResult
  module: omnimarket.models.model_claude_pool_revoke_recheck
handler:
  module: omnimarket.nodes.node_claude_pool_revoke_recheck_compute.handlers.handler_revoke_recheck
  class: HandlerRevokeRecheck
  input_model: omnimarket.models.model_claude_pool_revoke_recheck.ModelRevokeRecheckRequest
  output_model: omnimarket.models.model_claude_pool_revoke_recheck.ModelRevokeRecheckResult
handler_routing:
  routing_strategy: operation_match
  default_handler: omnimarket.nodes.node_claude_pool_revoke_recheck_compute.handlers.handler_revoke_recheck:HandlerRevokeRecheck
  handlers:
    - operation: decide_revoke_recheck
      handler:
        name: HandlerRevokeRecheck
        module: omnimarket.nodes.node_claude_pool_revoke_recheck_compute.handlers.handler_revoke_recheck
descriptor:
  node_archetype: compute
  purity: pure
  idempotent: true
  timeout_ms: 500
  runtime_profiles: []
runtime_dispatch:
  addressable: false
  invocation_mode: local
  reason: Called in process by the Claude token pool rotation tick; no bus topic reaches it.
  external_trigger: node_claude_token_pool_effect rotation tick (in-process call)
# The node publishes nothing: the pool tick calls it in process.
event_bus:
  subscribe_topics: []
  publish_topics: []
metadata:
  transport_type: local
  description: Claude token pool revoke recheck compute
  author: OmniNode Team
  created: "2026-11-13"
  related_tickets: [OMN-19998]
