name: projection_savings
version: "1.0.0"
description: >
  Projects savings-estimated events into savings_estimates table.
  SOW WARN blocker for cost attribution.
omnibase_core_compat: ">=0.39.0,<1.0.0"
capabilities:
  standalone: true
  full_runtime: true
  requires_network: true
  requires_secrets: true
  side_effect_class: write_db
tags:
  - projection
  - savings
  - sow-blocker
  - reducer
pack: "data"
display_name: "Projection: Savings"
node_role: "effect"
dependencies:
  # OMN-13548 (D-03): the savings runner gained a lazy Kafka producer so its DLQ
  # path has a publisher in the live runtime (it previously had none and could
  # not signal a malformed event at all).
  - "aiokafka>=0.10.0"
