---
name: projection_savings
contract_version: {major: 1, minor: 0, patch: 0}
node_type: reducer
node_version: {major: 1, minor: 0, patch: 0}
input_model: omnimarket.nodes.node_projection_savings.handlers.handler_projection_savings.ModelSavingsEstimatedEvent
description: >
  Projects savings-estimated events into the savings_estimates table.
  Source topics include omnibase-infra savings estimates and omnimarket
  delegate-skill terminal events that already carry measured token/cost
  savings metrics.

handler:
  module: omnimarket.nodes.node_projection_savings.handlers.handler_projection_savings
  class: HandlerProjectionSavings

handler_routing:
  routing_strategy: operation_match
  handlers:
    - operation: projection_savings
      handler:
        name: HandlerProjectionSavings
        module: omnimarket.nodes.node_projection_savings.handlers.handler_projection_savings
      handler_module: omnimarket.nodes.node_projection_savings.handlers.handler_projection_savings
      event_model: omnimarket.nodes.node_projection_savings.handlers.handler_projection_savings.ModelSavingsEstimatedEvent
    - operation: savings_projection_runner
      handler:
        name: SavingsProjectionRunner
        module: omnimarket.nodes.node_projection_savings.handlers.handler_savings
      handler_module: omnimarket.nodes.node_projection_savings.handlers.handler_savings

terminal_event: onex.evt.omnimarket.projection-savings-applied.v1

db_io:
  db_tables:
    - name: savings_estimates
      migration: "075_add_savings_estimates_updated_at.sql"
      access: write
      database: omnidash_analytics
      role: estimates

event_bus:
  consumer_group: local.omnibase_infra.node_projection_savings.consume.v1
  subscribe_topics:
    - onex.evt.omnibase-infra.savings-estimated.v1
    - onex.evt.omnimarket.delegate-skill-completed.v1
    - onex.evt.omnimarket.delegate-skill-failed.v1
    # OMN-13629 (WS-F Phase 1): repointed from the legacy compat
    # onex.evt.omniclaude.task-delegated.v1 to the canonical delegation terminal
    # pair. The orchestrator now emits a SINGLE canonical terminal
    # (ModelDelegationResult on delegation-{completed,failed}.v1); the savings
    # runner materializes savings_estimates from that same stream that drives
    # delegation_events, so savings is a measurement, not an estimate. The
    # Delegation Savings widget stays truthful-empty when a real delegation with
    # a derivable counterfactual lands. (OMN-12494 origin; OMN-13598 stopgap on
    # task-delegated.v1 superseded architecturally.)
    - onex.evt.omnibase-infra.delegation-completed.v1
    - onex.evt.omnibase-infra.delegation-failed.v1
  publish_topics:
    - onex.evt.omnimarket.projection-savings-applied.v1
    - onex.snapshot.projection.cost.savings-overview.v1  # onex-topic-allow: projection snapshot topic
  # OMN-13548 (D-03): malformed inbound events (ValidationError / failed
  # required-field check) are routed here as a DURABLE failure signal carrying the
  # offending envelope + correlation_id, instead of being logged + dropped silently.
  dlq_topics:
    - onex.dlq.omnimarket.projection-savings-malformed.v1

externally_consumed_topics:
  - onex.evt.omnimarket.projection-savings-applied.v1
  - onex.snapshot.projection.cost.savings-overview.v1  # onex-topic-allow: projection snapshot topic
  - onex.snapshot.projection.delegation.savings-series.v1  # onex-topic-allow: projection snapshot topic

projection_api:
  expose: true
  exposures:
    - topic: onex.snapshot.projection.savings.v1 # onex-topic-allow: projection snapshot topics use onex.snapshot.* prefix by convention
      table: savings_estimates
      schema: public
      columns:
        - id
        - session_id
        - event_timestamp
        - model_local
        - model_cloud_baseline
        - local_cost_usd
        - cloud_cost_usd
        - savings_usd
        - repo_name
        - machine_id
        - created_at
        - updated_at
      order_by: created_at DESC
      freshness_column: updated_at
      limit: 500
    - topic: onex.snapshot.projection.delegation.savings.v1 # onex-topic-allow: projection snapshot topics use onex.snapshot.* prefix by convention
      table: projection_delegation_savings
      schema: public
      columns:
        - cumulative_savings_usd
        - cumulative_local_cost_usd
        - cumulative_cloud_cost_usd
        - baseline_model
        - pricing_manifest_version
        - session_count
        - sessions
        - captured_at
        - provisioned
        - latest_projection_updated_at
      json_columns:
        - sessions
      freshness_column: latest_projection_updated_at
      limit: 1
    # OMN-13648 (G1): time-bucketed savings-over-time series for the new omnidash
    # delegation dashboard depth view (OMN-13602). Aggregates the same bus-fed
    # savings_estimates + delegation_events source as the delegation.savings.v1
    # exposure into one row per UTC day (view migration 078).
    # OMN-13661 (T2): tier-mix percentages (local_pct/cheap_pct/prem_pct) added
    # per bucket from the authoritative delegation_events.cost_tier_name (view
    # migration 079). Each pct is over LLM-tier-routed rows only; not_tier_routed
    # rows (savings_estimates source / empty tier) are excluded from the
    # denominator but still counted in task_count.
    - topic: onex.snapshot.projection.delegation.savings-series.v1 # onex-topic-allow: projection snapshot topics use onex.snapshot.* prefix by convention
      table: projection_delegation_savings_series
      schema: public
      columns:
        - bucket
        - actual_cost_usd
        - baseline_cost_usd
        - savings_usd
        - task_count
        - local_pct
        - cheap_pct
        - prem_pct
      order_by: bucket ASC
      freshness_column: bucket
      limit: 365
    - topic: onex.snapshot.projection.cost.savings-overview.v1 # onex-topic-allow: projection snapshot topics use onex.snapshot.* prefix by convention
      table: projection_cost_savings_overview
      schema: public
      columns:
        - "window"
        - total_cost_usd
        - total_baseline_cost_usd
        - total_savings_usd
        - savings_rate
        - tokens_total
        - tokens_to_compliance
        - local_token_pct
        - captured_at
        - rows
        - recent_runs
        - measured_run_count
        - zero_token_run_count
        - warnings
        - provisioned
        - latest_projection_updated_at
      json_columns:
        - rows
        - recent_runs
        - warnings
      freshness_column: latest_projection_updated_at
      limit: 1

metadata:
  transport_type: kafka
  delegate_skill_baseline_model_source: pricing_manifest
