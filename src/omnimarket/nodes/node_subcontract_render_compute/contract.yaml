---
name: node_subcontract_render_compute
contract_version: {major: 1, minor: 0, patch: 0}
node_type: compute
node_version: {major: 1, minor: 0, patch: 0}

# Top-level input_model seeds the RuntimeLocal event-driven command (mirrors the
# OMN-13276 pattern): the shared serialization boundary model is the source of the
# initial command fields.
input_model: omnimarket.contract_assembly.models.ModelSubcontractRenderRequest

description: >
  Pure deterministic subcontract renderer. One discriminated-union compute over
  the subcontract type renders a single YAML fragment (operations plus optional
  type-specific fields) and its content digest, replacing the per-type generator
  classes of the dormant contract serializer. No I/O, no bus or DB dependencies.

handler:
  module: omnimarket.nodes.node_subcontract_render_compute.handlers.handler_subcontract_render
  class: HandlerSubcontractRender
  input_model: omnimarket.contract_assembly.models.ModelSubcontractRenderRequest
  output_model: omnimarket.contract_assembly.models.ModelSubcontractFragment

descriptor:
  node_archetype: compute
  purity: pure
  idempotent: true
  timeout_ms: 500
  runtime_profiles:
    - main

inputs:
  type:
    type: str
    required: true
    description: EnumSubcontractType discriminator (database, api, event, compute, state, workflow)
  operations:
    type: array
    required: false
    description: Operation-name override; empty selects the canonical list for the type
  extra_fields:
    type: object
    required: false
    description: Optional type-specific scalar fields merged into the fragment body

outputs:
  type:
    type: str
  yaml_fragment:
    type: str
  sha256:
    type: str

terminal_event: onex.evt.omnimarket.subcontract-render-completed.v1

event_bus:
  subscribe_topics:
    - onex.cmd.omnimarket.subcontract-render-requested.v1
  publish_topics:
    - onex.evt.omnimarket.subcontract-render-completed.v1

externally_consumed_topics:
  - onex.evt.omnimarket.subcontract-render-completed.v1

handler_routing:
  routing_strategy: operation_match
  handlers:
    - operation: subcontract_render
      handler:
        name: HandlerSubcontractRender
        module: omnimarket.nodes.node_subcontract_render_compute.handlers.handler_subcontract_render
      event_model:
        name: ModelSubcontractRenderRequest
        module: omnimarket.contract_assembly.models

metadata:
  transport_type: kafka
