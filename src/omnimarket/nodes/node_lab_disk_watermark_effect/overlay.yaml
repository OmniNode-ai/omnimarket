# Declared disk marks of the pool hosts (OMN-23384). Read by `node_lab_disk_watermark_effect`.
#
# h053: the one 546 GB root volume (/data included) read 96 percent used at 20:01Z on 2026-11-09 after one finished
#   lane's spill held 176 GB, and a full disk stopped every merge-queue job on its runners from 18:14Z. The warn mark is
#   the 80 percent every host's RAM-filesystem upkeep already treats as pressure; the page mark of 90 percent leaves
#   about 55 GB on that volume for a person or a unit to act in.
# reading_file: where the latest reading is written (a leading $HOME/ is the running user's home).
hosts:
  - name: h053
    scheduler: systemd-user
    reading_file: $HOME/.local/state/onex/lab-disk-watermark/h053.json
    volumes:
      - {path: /, warn_percent: 80, page_percent: 90}
