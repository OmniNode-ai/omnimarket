# ONEX Node Contract
# Node: NodeTranscriptChunkCompute (OMN-21139, plan task TE.2)

name: node_transcript_chunk_compute
version: "1.0.0"
contract_name: node_transcript_chunk_compute
node_name: node_transcript_chunk_compute

contract_version:
  major: 1
  minor: 0
  patch: 0

node_version:
  major: 1
  minor: 0
  patch: 0

node_type: COMPUTE_GENERIC
runtime_profiles: [main]

description: >
  Pure lossless chunker for transcript text. The chunk cores partition [0, len) of the text and join back to it exactly; each window adds up to the declared overlap before its core; a cut never falls inside a code fence or a table; chunk ids are hashes of each window's offsets and text; no chunk is dropped by a size or word-count filter. No I/O.

input_model:
  name: ModelTranscriptChunkRequest
  module: omnimarket.models.transcript_extraction

output_model:
  name: ModelTranscriptChunkResult
  module: omnimarket.models.transcript_extraction

handler:
  module: omnimarket.nodes.node_transcript_chunk_compute.handlers.handler_transcript_chunk
  class: HandlerTranscriptChunk
  input_model: omnimarket.models.transcript_extraction.ModelTranscriptChunkRequest

handler_routing:
  routing_strategy: payload_type_match
  handlers:
    - handler:
        name: HandlerTranscriptChunk
        module: omnimarket.nodes.node_transcript_chunk_compute.handlers.handler_transcript_chunk
      event_model:
        name: ModelTranscriptChunkRequest
        module: omnimarket.models.transcript_extraction

descriptor:
  node_archetype: compute
  purity: pure
  idempotent: true
  timeout_ms: 1000

capabilities:
  - name: context.transcript.chunk
    description: Split a transcript into overlapping windows over a lossless partition of cores
    version: 1.0.0

# The request and the result both carry transcript or operator words verbatim, so
# both topics are on the restricted onex.cmd.omniintelligence.*
# family, never onex.evt.* (plan section 2 privacy split).
event_bus:
  subscribe_topics:
    - onex.cmd.omniintelligence.transcript-chunk-requested.v1
  publish_topics:
    - onex.cmd.omniintelligence.transcript-chunked.v1

runtime_dispatch:
  command_topic: onex.cmd.omniintelligence.transcript-chunk-requested.v1
  terminal_events:
    success: onex.cmd.omniintelligence.transcript-chunked.v1

terminal_event: onex.cmd.omniintelligence.transcript-chunked.v1

# The chunks are read by the caller that sends each window to the extraction proposer
# (plan tasks TE.4 and TE.8); no node subscribes in this repository yet.
externally_consumed_topics:
  - onex.cmd.omniintelligence.transcript-chunked.v1

metadata:
  author: OmniNode Team
  license: MIT
  ticket: OMN-21139
  maturity: alpha
  tags:
    - context-pack
    - transcript-extraction
    - chunker
