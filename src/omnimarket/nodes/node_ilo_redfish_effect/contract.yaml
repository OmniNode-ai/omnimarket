# ONEX Node Contract - iLO 4 Redfish Effect (OMN-21835)
#
# Manages HPE Gen8 and Gen9 servers through the iLO 4 RESTful (Redfish) API. Read verbs change nothing.
# Write verbs (power, virtual-media, boot-once) refuse without a cited operator approval, an identity
# match, and a journal that shows no earlier attempt. Smart Array and RAID configuration are NOT
# offered: Gen9 RAID changes use SSA or ssacli.
#
# WHO HOSTS THIS NODE. The caller's own process, in-process (the skill's CLI): the node reaches a
# private lab network address from the overlay and reads credentials from the lab secret store at use.
# It declares no event bus block, so runtime auto-wiring never attaches it to a shared runtime.
name: node_ilo_redfish_effect
lifecycle: experimental
node_type: effect
contract_version: {major: 0, minor: 1, patch: 0}
node_version: {major: 0, minor: 1, patch: 0}

description: >
  iLO 4 Redfish EFFECT for the Gen8 and Gen9 lab servers. Verbs: discover, identity, inventory,
  health, logs, power-status (read); power, virtual-media, boot-once (write, approval-gated); setup (the
  one-run host setup of OMN-22870: accounts, store keys, certificate pin, overlay row, first read). Hosts,
  addresses, pinned certificates and credential key names come from a private overlay; credentials
  come from the lab secret store at use; TLS verification is never disabled; every returned field is
  redacted. Design: reference/ilo4-redfish-management-design.md in the shared knowledge base.

input_model: omnimarket.nodes.node_ilo_redfish_effect.models.model_ilo_redfish_request.ModelIloRedfishRequest
output_model: omnimarket.nodes.node_ilo_redfish_effect.models.model_ilo_redfish_result.ModelIloRedfishResult

handler:
  module: omnimarket.nodes.node_ilo_redfish_effect.handlers.handler_ilo_envelope
  class: HandlerIloRedfishEnvelope
  input_model: omnimarket.nodes.node_ilo_redfish_effect.models.model_ilo_redfish_request.ModelIloRedfishRequest
  output_model: omnimarket.nodes.node_ilo_redfish_effect.models.model_ilo_redfish_result.ModelIloRedfishResult

# handler_routing binds both handlers to the node (the canonical-file-shape ratchet reads it). There is
# empty event_bus topics: the node is called in process by the operator's lab tooling, not by a bus
# command, so runtime auto-wiring must not attach it.
runtime_dispatch:
  external_trigger: the operator's lab tooling calls the node in process through its CLI

event_bus:
  subscribe_topics: []
  publish_topics: []

handler_routing:
  routing_strategy: operation_match
  handlers:
    - operation: ilo_redfish
      handler:
        name: HandlerIloRedfishEnvelope
        module: omnimarket.nodes.node_ilo_redfish_effect.handlers.handler_ilo_envelope
      event_model:
        name: ModelIloRedfishRequest
        module: omnimarket.nodes.node_ilo_redfish_effect.models.model_ilo_redfish_request
    - operation: ilo_setup
      handler:
        name: HandlerIloSetupEnvelope
        module: omnimarket.nodes.node_ilo_redfish_effect.handlers.handler_ilo_envelope
      event_model:
        name: ModelIloSetupRequest
        module: omnimarket.nodes.node_ilo_redfish_effect.models.model_ilo_setup

# The in-process handler takes lab-private ports at construction, so it is not a runtime-dispatched
# route. This block only binds it to the node for the canonical-file-shape ratchet; handler_routing
# above is what routes.
in_process_handlers:
  ilo_redfish:
    handler:
      name: HandlerIloRedfish
      module: omnimarket.nodes.node_ilo_redfish_effect.handlers.handler_ilo_redfish

descriptor:
  node_archetype: effect
  purity: impure
  # A write is made idempotent by the action journal, not by the device: see the design note.
  idempotent: false
  timeout_ms: 300000
  runtime_profiles: []

config:
  # The secret-store key names for a host without explicit names in its overlay row.
  # {HOST} is the upper-cased lab host name, {ROLE} READ or WRITE, {FIELD} USERNAME or PASSWORD.
  credential_key_template:
    type: str
    default: "ILO_{HOST}_{ROLE}_{FIELD}"
    description: "Template of the lab secret store keys that hold a host's iLO accounts. Names only; the values live in the store."
  # The folder of the lab secret store the setup verb lists, reads and creates the iLO keys in (names
  # only here; ROLE is READ, WRITE, or ADMIN for an administrator credential the operator filed).
  secret_folder:
    type: str
    default: "/shared/env"
    description: "Folder of the lab secret store that holds the iLO account keys the setup verb creates."
  # Where the lab secret store is and who may read it. The project and the environment are declared
  # here, not taken from the shell: an operator shell can carry another project's identifier.
  secret_project_id:
    type: str
    default: "872e00f4-1279-49a4-8e16-a2bd961f4996"
    description: "Project of the lab secret store that holds the iLO keys (onex-platform)."
  secret_environment:
    type: str
    default: "dev"
    description: "Environment of the lab secret store the setup verb reads and writes."
  identity_env_file:
    type: str
    default: "~/.omnibase/.env"
    description: "The operator env file that holds the machine identity (INFISICAL_ADDR, INFISICAL_CLIENT_ID, INFISICAL_CLIENT_SECRET). It wins over the shell, which can be older than the file."

metadata:
  transport_type: local
  ticket: OMN-21835
