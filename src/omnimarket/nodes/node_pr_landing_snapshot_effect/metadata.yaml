name: node_pr_landing_snapshot_effect
version: "0.1.0"
description: "The landing snapshot step: each tick's facts filled with the PR node id and failed run ids and recorded on the bus (OMN-23409)"
omnibase_core_compat: ">=0.39.0,<1.0.0"
entry_points:
  onex.nodes:
    node_pr_landing_snapshot_effect: "omnimarket.nodes.node_pr_landing_snapshot_effect"
capabilities:
  standalone: false
  # false until a deployed source and the Redpanda recorder are bound: the script still runs.
  full_runtime: false
  requires_network: false
  requires_repo: false
  requires_secrets: false
  requires_docker: false
  side_effect_class: external_io
dependencies:
- omnibase_core>=0.39.0
- pyyaml>=6.0
- aiokafka>=0.10.0
- omnibase-infra>=0.1.0
authors: ["OmniNode Platform Team"]
license: "MIT"
tags: ["effect", "pr-landing", "landing-tick", "snapshot", "OMN-23409"]
pack: "pr_lifecycle"
display_name: "PR Landing Snapshot Effect"
node_role: "effect"
