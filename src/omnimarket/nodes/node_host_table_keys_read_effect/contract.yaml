name: node_host_table_keys_read_effect
lifecycle: experimental
node_type: EFFECT_GENERIC
runtime_profiles:
- effects
contract_version:
  major: 1
  minor: 0
  patch: 0
node_version: 1.0.0
description: Read the lab host table back from the key-value store (OMN-23983, OMN-22251). The reading is READ with
  the stored document, or UNKNOWN with the reason (no key, a store that does not answer, a malformed value, an empty
  row list, a document older than the overlay's bound); a host list that cannot be read is never an empty list.
# One overlay holds the values both key nodes read: the node that ingests the keys names them.
overlay:
  node: node_host_table_keys_ingest_effect
  roots_env: ONEX_SKILL_OVERLAY_ROOTS
input_model:
  name: ModelHostTableKeysReadRequest
  module: omnimarket.nodes.node_host_table_keys_read_effect.models.model_host_table_keys_read
output_model:
  name: ModelHostTableKeysReading
  module: omnimarket.nodes.node_host_table_keys_ingest_effect.models.model_host_table_keys
handler:
  module: omnimarket.nodes.node_host_table_keys_read_effect.handlers.handler_host_table_keys_read
  class: HandlerHostTableKeysRead
  input_model: omnimarket.nodes.node_host_table_keys_read_effect.models.model_host_table_keys_read.ModelHostTableKeysReadRequest
  output_model: omnimarket.nodes.node_host_table_keys_ingest_effect.models.model_host_table_keys.ModelHostTableKeysReading
handler_routing:
  routing_strategy: operation_match
  default_handler: omnimarket.nodes.node_host_table_keys_read_effect.handlers.handler_host_table_keys_read:HandlerHostTableKeysRead
  handlers:
  - operation: handle
    handler:
      name: HandlerHostTableKeysRead
      module: omnimarket.nodes.node_host_table_keys_read_effect.handlers.handler_host_table_keys_read
event_bus:
  subscribe_topics: []
  publish_topics: []
runtime_dispatch:
  external_trigger: Direct Python invocation by a reader of the lab host table (read_host_table_rows), which names the
    admitted hosts and the excluded ones with their reasons from the key-value store.
descriptor:
  node_archetype: effect
  purity: impure
  runtime_profiles:
  - effects
  idempotent: true
  timeout_ms: 30000
metadata:
  transport_type: local
  ticket: OMN-23983
  related_tickets:
  - OMN-22251
