---
# SPDX-FileCopyrightText: 2025 OmniNode.ai Inc.
# SPDX-License-Identifier: MIT
# ONEX Node Contract - Ledger State Reducer (OMN-8950)
name: ledger_state_reducer
contract_version: {major: 1, minor: 0, patch: 0}
node_type: reducer
node_version: {major: 1, minor: 0, patch: 0}

description: >
  Ledger demo REDUCER. Pure delta(state, event) -> (new_state, intents).
  Handler returns dict {"state": ..., "intents": [ModelPersistStateIntent]}
  per the pure-reducer-as-effect pattern (epic OMN-9006 / OMN-9009). The
  downstream node_state_persist_effect consumes the intent and performs the
  ProtocolStateStore.put() side effect — the reducer itself does no I/O.

handler:
  module: omnimarket.nodes.node_ledger_state_reducer.handlers.handler_ledger_state
  class: HandlerLedgerStateReducer
  input_model: omnimarket.nodes.node_ledger_hash_compute.models.model_ledger_hash_computed.ModelLedgerHashComputed

handler_routing:
  default_handler: omnimarket.nodes.node_ledger_state_reducer.handlers.handler_ledger_state:HandlerLedgerStateReducer

descriptor:
  node_archetype: reducer
  purity: pure
  idempotent: true
  timeout_ms: 5000

event_bus:
  subscribe_topics:
    - onex.evt.omnimarket.ledger-hash-computed.v1
  publish_topics:
    - onex.evt.omnimarket.ledger-state-reduced.v1

metadata:
  transport_type: kafka

# OMN-13734: machine-readable FSM (transcribed from authoritative handler/model logic).
state_machine:
  state_machine_name: ledger_state_fsm
  initial_state: idle
  states:
    - state_name: idle
      description: "No ledger hash folded yet."
      required_data: []
    - state_name: reduced
      description: "Ledger state projection materialized."
      required_data: []
  transitions:
    - from_state: idle
      to_state: reduced
      trigger: ledger_hash_computed
      description: "Ledger hash computed; fold into state."
    - from_state: reduced
      to_state: reduced
      trigger: ledger_hash_computed
      description: "Fold another ledger hash."
    - from_state: reduced
      to_state: reduced
      trigger: ledger_state_reduced
      description: "Re-observe own projection (idempotent)."
  terminal_states: []
  persistence_enabled: false
