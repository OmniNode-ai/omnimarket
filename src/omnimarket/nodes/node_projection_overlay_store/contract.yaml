---
name: projection_overlay_store
contract_version: {major: 1, minor: 0, patch: 0}
node_type: reducer
node_version: {major: 1, minor: 0, patch: 0}
input_model: omnimarket.models.overlay_store.ModelOverlayStoreRecord
description: >
  OMN-22478, RULING 2026-11-06T00:23:28Z. Holds loaded deployment overlays in the database, the host table
  first: the overlay home is the source, node_overlay_store_load_effect puts a version of one overlay on the
  bus, and this node stores it, every version kept and the one asserted last the current one, and
  publishes the overlay read back from the store on the snapshot topic hosts read. A malformed load is
  dead-lettered and the stored overlay stays.

runtime_profiles: [main]

handler:
  module: omnimarket.nodes.node_projection_overlay_store.handlers.handler_overlay_store_projection
  class: OverlayStoreProjectionWriter

handler_routing:
  routing_strategy: operation_match
  handlers:
    - operation: overlay_store_projection_writer
      handler:
        name: OverlayStoreProjectionWriter
        module: omnimarket.nodes.node_projection_overlay_store.handlers.handler_overlay_store_projection
      handler_module: omnimarket.nodes.node_projection_overlay_store.handlers.handler_overlay_store_projection

# onex-topic-allow: a projection snapshot topic has the projection's own name form.
terminal_event: onex.snapshot.projection.overlay-store.v1

descriptor:
  node_archetype: reducer
  purity: pure
  idempotent: true
  timeout_ms: 30000

event_bus:
  subscribe_topics:
    - onex.evt.omnimarket.overlay-store-loaded.v1
  publish_topics:
    # onex-topic-allow: a projection snapshot topic has the projection's own name form.
    - onex.snapshot.projection.overlay-store.v1
  dlq_topics:
    - onex.dlq.omnimarket.projection-overlay-store-malformed.v1

externally_consumed_topics:
  # onex-topic-allow: a projection snapshot topic has the projection's own name form.
  - onex.snapshot.projection.overlay-store.v1

db_io:
  db_tables:
    - name: overlay_store
      database_ref: application
      schema: omninode_internal
      migration: "0000_create_overlay_store.sql"
      access: write
      role: overlay_store
  idempotency_key: "overlay_id,digest"

metadata:
  transport_type: kafka
  ticket: OMN-22478
