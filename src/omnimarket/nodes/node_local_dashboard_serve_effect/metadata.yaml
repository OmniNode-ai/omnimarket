name: node_local_dashboard_serve_effect
version: "0.1.0"
description: "Serves this install's declared projection exposures to the local dashboard on a loopback port, through the projection read node"
omnibase_core_compat: ">=0.39.0,<1.0.0"
entry_points:
  onex.nodes:
    node_local_dashboard_serve_effect: "omnimarket.nodes.node_local_dashboard_serve_effect"
capabilities:
  standalone: true
  full_runtime: false
  requires_network: true
  requires_repo: false
  requires_secrets: false
  requires_docker: false
  side_effect_class: read_only
dependencies:
  - "omnibase_core>=0.39.0"
  - "fastapi>=0.100"
  - "uvicorn>=0.20"
  - "pydantic>=2.0"
authors: ["OmniNode Team"]
license: "MIT"
tags: ["projection", "dashboard", "local", "effect"]
pack: "projection"
display_name: "Local Dashboard Serve Effect"
node_role: "effect"
