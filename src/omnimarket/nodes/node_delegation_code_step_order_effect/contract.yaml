---
name: node_delegation_code_step_order_effect
contract_version: {major: 1, minor: 0, patch: 0}
node_type: effect
node_version: {major: 1, minor: 0, patch: 0}
description: >
  Resolves the code-engine step order and attempts per engine for a task class
  from the routing contract (task_class_contracts.v1.yaml tier_order, falling
  back to the routing_tiers.yaml declaration order) and the overlay
  (overlays/node_delegation_code_step_order_effect/overlay.yaml). The node
  holds no value of its own: all engine names, tier mappings, and disabled
  engines come from the overlay. It reads three yaml files, calls no model,
  and holds no clock.

handler_routing:
  routing_strategy: operation_match
  handlers:
    - operation: resolve_code_step_order
      handler:
        name: HandlerCodeStepOrder
        module: omnimarket.nodes.node_delegation_code_step_order_effect.handlers.handler_code_step_order

handler:
  module: omnimarket.nodes.node_delegation_code_step_order_effect.handlers.handler_code_step_order
  class: HandlerCodeStepOrder
  input_model: omnimarket.nodes.node_delegation_code_step_order_effect.models.model_code_step_order.ModelCodeStepOrderRequest
  output_model: omnimarket.nodes.node_delegation_code_step_order_effect.models.model_code_step_order.ModelCodeStepOrderResult

descriptor:
  node_archetype: effect
  purity: pure
  idempotent: true
  timeout_ms: 5000
  runtime_profiles: [main]

inputs:
  task_class_contracts_path:
    type: str
    required: true
    description: Path to task_class_contracts.v1.yaml.
  routing_tiers_path:
    type: str
    required: true
    description: Path to routing_tiers.yaml.
  overlay_path:
    type: str
    required: true
    description: Path to the overlay yaml mapping tiers to engines.

outputs:
  ok:
    type: bool
  steps:
    type: list
  refusal:
    type: str
  detail:
    type: str

terminal_event: onex.evt.omnimarket.code-step-order-resolved.v1

event_bus:
  subscribe_topics:
    - onex.cmd.omnimarket.code-step-order-requested.v1
  publish_topics:
    - onex.evt.omnimarket.code-step-order-resolved.v1

metadata:
  transport_type: kafka

runtime_dispatch:
  command_topic: onex.cmd.omnimarket.code-step-order-requested.v1

externally_consumed_topics:
  - onex.evt.omnimarket.code-step-order-resolved.v1
