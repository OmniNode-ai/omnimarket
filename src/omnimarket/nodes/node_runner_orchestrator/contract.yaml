---
# SPDX-FileCopyrightText: 2026 OmniNode.ai Inc.
# SPDX-License-Identifier: MIT
# ONEX Node Contract - Runner Orchestrator (OMN-12218)
#
# Thin-skill orchestrator: manages GitHub Actions self-hosted runners —
# deploy, update, and status-check operations currently handled inline
# in the runner skill (omniclaude/plugins/onex/skills/runner/).
name: node_runner_orchestrator
contract_version: {major: 1, minor: 0, patch: 0}
node_type: orchestrator
node_version: {major: 1, minor: 0, patch: 0}
node_not_implemented: false

description: >
  Runner management orchestrator. Wraps the GitHub Actions self-hosted runner
  skill (runner/SKILL.md) as an ONEX ORCHESTRATOR node with typed I/O.

  Supported actions:
    deploy  — SSH to CI host, invoke deploy-runners.sh (with optional --rebuild).
              Prerequisites: gh token org scope + SSH key in agent.
    update  — Force Docker image rebuild then redeploy (--rebuild shorthand).
    status  — Query GitHub API + SSH-inspect CI host containers; emit per-runner
              health table and host-level disk/build-cache metrics.

  Bounded handler slice supports dry-run previews and adapter-gated live
  deploy, update, and status operations. Read-only watch routes observe configured
  pools and send version or liveness findings to the existing operator exception queue.

entrypoint:
  name: NodeRunnerOrchestrator
  module: omnimarket.nodes.node_runner_orchestrator.node

handler:
  module: omnimarket.nodes.node_runner_orchestrator.handlers.handler_runner_orchestrator
  class: HandlerRunnerOrchestrator
  input_model: omnimarket.nodes.node_runner_orchestrator.models.model_runner_request.ModelRunnerRequest

handler_routing:
  routing_strategy: operation_match
  handlers:
    - operation: runner
      topic: onex.cmd.omnimarket.runner-action-start.v1
      handler:
        name: HandlerRunnerOrchestrator
        module: omnimarket.nodes.node_runner_orchestrator.handlers.handler_runner_orchestrator

    - operation: runner_version_watch
      topic: onex.cmd.omnimarket.runner-version-watch-requested.v1
      handler:
        name: HandlerRunnerVersionWatch
        module: omnimarket.nodes.node_runner_orchestrator.handlers.handler_runner_version_watch
      event_model: omnimarket.nodes.node_runner_orchestrator.models.model_runner_version_watch.ModelRunnerWatchRequest
      output_model: omnimarket.nodes.node_runner_orchestrator.models.model_runner_version_watch.ModelRunnerWatchResult
    - operation: runner_version_watch.scheduled_tick
      topic: onex.intent.platform.runtime-tick.v1
      handler:
        name: HandlerRunnerVersionWatchTick
        module: omnimarket.nodes.node_runner_orchestrator.handlers.handler_runner_version_watch_tick
      event_model: omnibase_infra.runtime.models.model_runtime_tick.ModelRuntimeTick
      event_type: platform.runtime-tick
      output_model: omnimarket.nodes.node_runner_orchestrator.models.model_runner_version_watch.ModelRunnerWatchResult

descriptor:
  node_archetype: orchestrator
  purity: impure
  idempotent: false
  timeout_ms: 120000
  runtime_profiles:
    - effects

terminal_event: onex.evt.omnimarket.runner-action-completed.v1

event_bus:
  subscribe_topics:
    - onex.cmd.omnimarket.runner-action-start.v1
    - onex.cmd.omnimarket.runner-version-watch-requested.v1
    - onex.intent.platform.runtime-tick.v1
  publish_topics:
    - onex.evt.omnimarket.runner-action-completed.v1
    - onex.evt.omnimarket.runner-version-watch-completed.v1
    - onex.evt.omnimarket.runner-version-watch-alarm.v1
    - onex.cmd.omnimarket.exception-emit-requested.v1
  dlq_topics:
    - onex.dlq.omnimarket.runner-action.v1

metadata:
  transport_type: kafka
  implementation_wave: 4
  handlers_deferred_until_wave: 4
  related_tickets: ["OMN-12218"]
  skill_source: omniclaude/plugins/onex/skills/runner/

runtime_dispatch:
  # OMN-18013 -- the CLI/skill dispatcher is this node's producer. Declared so it is not inferred from subscribe_topics[0].
  command_topic: onex.cmd.omnimarket.runner-action-start.v1

# OMN-18013 -- explicit SINK declaration (contract topic graph closure).
# No node contract subscribes to these; they leave the ONEX node graph here.
externally_consumed_topics:
  - onex.evt.omnimarket.runner-action-completed.v1
  - onex.evt.omnimarket.runner-version-watch-completed.v1
  - onex.evt.omnimarket.runner-version-watch-alarm.v1

# Read-only health observations share the runner node; no deploy adapter is invoked.
runner_version_watch:
  policy:
    max_releases_behind: 1
    observation_max_age_seconds: 600
    max_future_skew_seconds: 30
  schedule:
    workflow: runner-version-watch
    interval_seconds: 180
    offset_seconds: 0
  topics:
    command: onex.cmd.omnimarket.runner-version-watch-requested.v1
    completed: onex.evt.omnimarket.runner-version-watch-completed.v1
    alarm: onex.evt.omnimarket.runner-version-watch-alarm.v1
    attention: onex.cmd.omnimarket.exception-emit-requested.v1
  overlay_id: runner_version_watch
  source_contract:
    pin: docker/runners/runner-image.lock.json in the deployment's infrastructure checkout
    online_state: runner-fleet observation saved by projection_runner_fleet, including runner_name
    listener_version: read-only argv invoking each expected runner's Runner.Listener --version
    releases: actions/runner releases API, stable releases only, newest first
    release_history: must contain more stable releases than max_releases_behind
  delivery: >
    An alarm event carries every finding. Each finding also enters the existing
    exception queue as a decision row, coalesced by code, pool and runner.
    Every publication is awaited; failures propagate for retry.
input_subscriptions:
  - topic: onex.intent.platform.runtime-tick.v1
    operation: runner_version_watch.scheduled_tick
externally_produced_topics:
  - topic: onex.intent.platform.runtime-tick.v1
    producer: platform runtime tick scheduler
  - topic: onex.cmd.omnimarket.runner-version-watch-requested.v1
    producer: operator or runtime requesting a read-only runner health observation
# The exception queue is the existing operator attention sink; this node sends no chat messages.
published_events:
  - event_type: ModelRunnerWatchResult
    topic: onex.evt.omnimarket.runner-version-watch-completed.v1
    description: A watch evaluation, routed separately from runner action results.
