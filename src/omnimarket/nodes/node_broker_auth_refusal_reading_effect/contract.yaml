# ONEX Node Contract - Broker Authentication Refusal Reading Effect (OMN-19044, AC-4)
#
# Reads the dev broker's own log for authentication refusals (kafka_authentication_exception: a client that
# dials a SASL listener and sends a request before it authenticates) over a window, and appends one reading
# row. Before this, such a client surfaced only in the broker's own warnings. The window, the needle and the
# bar are overlay values. It writes reading rows and nothing else: a reading is never a gate, a stop or an
# admission, and the node never changes the broker.
name: node_broker_auth_refusal_reading_effect
contract_name: node_broker_auth_refusal_reading_effect
node_name: node_broker_auth_refusal_reading_effect
contract_version: {major: 1, minor: 0, patch: 0}
node_version: {major: 1, minor: 0, patch: 0}
node_type: effect
lifecycle: experimental
runtime_profiles: [effects]

description: >
  The reading of the dev broker's authentication refusals. WORKING when the refusals in the window are at or
  under the bar, NOT_WORKING when over (the row names the count, the first and last time, the minutes that held
  any and the first line), UNKNOWN when the broker's log cannot be read.

handler:
  module: omnimarket.nodes.node_broker_auth_refusal_reading_effect.handlers.handler_broker_auth_refusal
  class: HandlerBrokerAuthRefusal
  input_model: omnimarket.nodes.node_broker_auth_refusal_reading_effect.models.model_broker_auth_refusal.ModelBrokerAuthRefusalCommand

# HandlerBrokerAuthRefusal takes the overlay, host, log source, appender and clock as constructor
# parameters, so the node runs through its own CLI, not handler_routing.

descriptor:
  node_archetype: effect
  runtime_profiles: [effects]
  purity: impure
  idempotent: true
  side_effects: [ledger-append, broker-log-read]
  timeout_ms: 120000

input_model:
  name: ModelBrokerAuthRefusalCommand
  module: omnimarket.nodes.node_broker_auth_refusal_reading_effect.models.model_broker_auth_refusal
  description: A correlation id and whether to write.
output_model:
  name: ModelBrokerAuthRefusalResult
  module: omnimarket.nodes.node_broker_auth_refusal_reading_effect.models.model_broker_auth_refusal
  description: The verdict, the counted refusals, the bar and what happened on the ledger.

terminal_event: onex.evt.omnimarket.broker-auth-refusal-run-completed.v1

runtime_dispatch:
  external_trigger: true

topics:
  broker_auth_refusal_requested: onex.cmd.omnimarket.broker-auth-refusal-requested.v1
  broker_auth_refusal_written: onex.evt.omnimarket.broker-auth-refusal-written.v1
  broker_auth_refusal_failed: onex.evt.omnimarket.broker-auth-refusal-failed.v1
  broker_auth_refusal_run_completed: onex.evt.omnimarket.broker-auth-refusal-run-completed.v1
  broker_auth_refusal_run_failed: onex.evt.omnimarket.broker-auth-refusal-run-failed.v1

# OMN-19998: the declared broker grants for the topics this contract's event_bus lists (the permission coverage check, OMN-24005).
# The principal is the dev runtime's login, read from the environment where the reconcile runs; no login name is written in a repository.
broker_acl_grants:
  - principal: "${ONEX_ACL_DEV_RUNTIME_EFFECTS_PRINCIPAL}"
    grants:
      - {resource_type: TOPIC, pattern: LITERAL, name: onex.cmd.omnimarket.broker-auth-refusal-requested.v1, operation: WRITE}
      - {resource_type: TOPIC, pattern: LITERAL, name: onex.cmd.omnimarket.broker-auth-refusal-requested.v1, operation: DESCRIBE}
      - {resource_type: TOPIC, pattern: LITERAL, name: onex.evt.omnimarket.broker-auth-refusal-written.v1, operation: WRITE}
      - {resource_type: TOPIC, pattern: LITERAL, name: onex.evt.omnimarket.broker-auth-refusal-written.v1, operation: DESCRIBE}
      - {resource_type: TOPIC, pattern: LITERAL, name: onex.evt.omnimarket.broker-auth-refusal-failed.v1, operation: WRITE}
      - {resource_type: TOPIC, pattern: LITERAL, name: onex.evt.omnimarket.broker-auth-refusal-failed.v1, operation: DESCRIBE}
      - {resource_type: TOPIC, pattern: LITERAL, name: onex.evt.omnimarket.broker-auth-refusal-run-completed.v1, operation: WRITE}
      - {resource_type: TOPIC, pattern: LITERAL, name: onex.evt.omnimarket.broker-auth-refusal-run-completed.v1, operation: DESCRIBE}
      - {resource_type: TOPIC, pattern: LITERAL, name: onex.evt.omnimarket.broker-auth-refusal-run-failed.v1, operation: WRITE}
      - {resource_type: TOPIC, pattern: LITERAL, name: onex.evt.omnimarket.broker-auth-refusal-run-failed.v1, operation: DESCRIBE}
# OMN-19998: boot provisioning reads only event_bus; the topics are listed as publish topics so they
# exist on the broker, never as subscriptions, because the handler takes constructor arguments and a
# subscription would make the runtime wire it.
event_bus:
  subscribe_topics: []
  publish_topics:
    - onex.cmd.omnimarket.broker-auth-refusal-requested.v1
    - onex.evt.omnimarket.broker-auth-refusal-written.v1
    - onex.evt.omnimarket.broker-auth-refusal-failed.v1
    - onex.evt.omnimarket.broker-auth-refusal-run-completed.v1
    - onex.evt.omnimarket.broker-auth-refusal-run-failed.v1

externally_consumed_topics:
  - onex.cmd.omnimarket.broker-auth-refusal-requested.v1
  - onex.evt.omnimarket.broker-auth-refusal-written.v1
  - onex.evt.omnimarket.broker-auth-refusal-failed.v1
  - onex.evt.omnimarket.broker-auth-refusal-run-completed.v1
  - onex.evt.omnimarket.broker-auth-refusal-run-failed.v1

overlay:
  node: node_broker_auth_refusal_reading_effect
  roots_env: ONEX_SKILL_OVERLAY_ROOTS
  model: omnimarket.nodes.node_broker_auth_refusal_reading_effect.overlay.ModelBrokerAuthRefusalOverlay

metadata:
  ticket: OMN-19044
  transport_type: inmemory
