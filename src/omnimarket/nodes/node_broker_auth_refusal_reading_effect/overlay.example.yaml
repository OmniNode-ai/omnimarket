# Synthetic values. The deployment's overlay lives at <root>/node_broker_auth_refusal_reading_effect/overlay.yaml
# under a root named in ONEX_SKILL_OVERLAY_ROOTS. No key has a default.
#
#   log_source       the broker's container log, read over ssh
#   reading          the text a refusal line holds, the look-back window and how much of the first line a row keeps
#   bars             the most refusals in the window that still read WORKING (0: any refusal is a finding)
#   injected_fault   the fault injected on purpose that must turn the reading NOT WORKING
log_source:
  ssh_host_env: EXAMPLE_BROKER_SSH_HOST
  compose_project: example-project
  service: example-broker
  read_timeout_seconds: 30
reading:
  needle: example_authentication_exception
  window_seconds: 600
  sample_max_chars: 160
bars:
  max_refusals: 0
ledger_append:
  command_env: EXAMPLE_LEDGER_APPEND_COMMAND
  host_env: EXAMPLE_HOST_NAME
  timeout_seconds: 60
publish:
  lane: broker-auth-refusal
  actor: node:node_broker_auth_refusal_reading_effect
  publish_max_age_seconds: 1800
injected_fault: Connect a client to the SASL listener without authenticating, or point the needle at a line the broker logs
