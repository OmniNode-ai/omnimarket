name: node_broker_auth_refusal_reading_effect
version: 1.0.0
description: Reads the dev broker's authentication refusals over a window (clients that dial a SASL listener without authenticating) against a bar from an overlay and appends one reading row.
pack: operator_tooling
node_role: effect
display_name: Broker Authentication Refusal Reading Effect
omnibase_core_compat: '>=0.39.0,<1.0.0'
entry_points:
  onex.nodes:
    node_broker_auth_refusal_reading_effect: omnimarket.nodes.node_broker_auth_refusal_reading_effect
capabilities:
  standalone: true
  full_runtime: false
  requires_network: true
  requires_repo: false
  requires_secrets: false
  requires_docker: false
  side_effect_class: write
dependencies:
- pydantic>=2.0
- omnibase-infra>=0.38.3
authors:
- OmniNode Platform Team
license: MIT
tags:
- effect
- reading
- broker
