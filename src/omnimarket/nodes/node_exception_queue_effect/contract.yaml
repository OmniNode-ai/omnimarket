name: node_exception_queue_effect
node_type: effect
contract_version: {major: 1, minor: 0, patch: 0}
node_version: "1.0.0"
description: >
  The exception queue (OMN-17427, operator 2026-10-18): a detector or actor that cannot resolve its case in code
  emits one typed row (class, key, evidence, what it tried, proposed fix); the operator reads only rows marked
  decision and the orchestrator drains the rest. A class's second occurrence dispatches one lane through the
  remote-lane runner to mechanize it (a detector, an actor and a friction replay scenario). A row of a class in
  the stop registry of node_andon_stop_reducer also opens an andon stop; stop_event persists a writer's event to it
  through that reducer's rule (a write from a role other than the trigger's is refused and the refusal recorded),
  and open_stops reads the stops for stop_gate. queue_status.py reaches it
  through --exception (HandlerExceptionCli) and prints its read (HandlerExceptionQueueRead) in every block.
input_model:
  name: ModelExceptionEmitRequest
  module: omnimarket.nodes.node_exception_queue_effect.models
output_model:
  name: ModelExceptionEmitResult
  module: omnimarket.nodes.node_exception_queue_effect.models
handler:
  module: omnimarket.nodes.node_exception_queue_effect.handler
  class: HandlerExceptionEmit
  input_model: omnimarket.nodes.node_exception_queue_effect.models.ModelExceptionEmitRequest
  output_model: omnimarket.nodes.node_exception_queue_effect.models.ModelExceptionEmitResult
entrypoint:
  name: NodeExceptionQueueEffect
  module: omnimarket.nodes.node_exception_queue_effect.node
protocol_dependencies:
  - {name: LED, protocol: "omnimarket.protocols.protocol_work_ledger_store:ProtocolWorkLedgerStore", bind_as: ledger, required: true}
  - {name: STO, protocol: "omnibase_core.protocols.storage.protocol_state_store:ProtocolStateStore", bind_as: state, required: true}
  - {name: CHG, protocol: "omnimarket.protocols.protocol_change_source:ProtocolChangeSource", bind_as: changes, required: true}
  - {name: HST, protocol: "omnimarket.protocols.protocol_lane_host_pool:ProtocolLaneHostPool", bind_as: hosts, required: true}
  - {name: CLK, protocol: "omnimarket.protocols.protocol_clock:ProtocolClock", bind_as: clock, required: true}
handler_routing:
  routing_strategy: operation_match
  default_handler: omnimarket.nodes.node_exception_queue_effect.handler:HandlerExceptionEmit
  handlers:
    - operation: emit
      topic: onex.cmd.omnimarket.exception-emit-requested.v1
      handler:
        name: HandlerExceptionEmit
        module: omnimarket.nodes.node_exception_queue_effect.handler
    - operation: list
      topic: onex.cmd.omnimarket.exception-queue-requested.v1
      handler:
        name: HandlerExceptionQueue
        module: omnimarket.nodes.node_exception_queue_effect.handler
    - operation: resolve
      topic: onex.cmd.omnimarket.exception-resolve-requested.v1
      handler:
        name: HandlerExceptionResolve
        module: omnimarket.nodes.node_exception_queue_effect.handler
    - operation: read
      topic: onex.cmd.omnimarket.exception-queue-read-requested.v1
      handler:
        name: HandlerExceptionQueueRead
        module: omnimarket.nodes.node_exception_queue_effect.handler
    - operation: stop_event
      topic: onex.cmd.omnimarket.stop-event-requested.v1
      handler:
        name: HandlerStopEvent
        module: omnimarket.nodes.node_exception_queue_effect.handler
    - operation: open_stops
      topic: onex.cmd.omnimarket.open-stops-requested.v1
      handler:
        name: HandlerOpenStops
        module: omnimarket.nodes.node_exception_queue_effect.handler
terminal_event: onex.evt.omnimarket.exception-queued.v1
runtime_dispatch:
  command_topic: onex.cmd.omnimarket.exception-emit-requested.v1
descriptor:
  node_archetype: effect
  purity: effectful
  idempotent: false
  timeout_ms: 120000
  runtime_profiles:
    - effects
event_bus:
  subscribe_topics:
    - onex.cmd.omnimarket.exception-emit-requested.v1
  publish_topics:
    - onex.evt.omnimarket.exception-queued.v1
metadata:
  transport_type: inmemory
  related_tickets: [OMN-17427]
externally_consumed_topics:
- onex.evt.omnimarket.exception-queued.v1
