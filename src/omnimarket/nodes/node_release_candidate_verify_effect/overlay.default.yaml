# The in-memory default overlay of node_release_candidate_verify_effect (OMN-23343).
# Launcher templates were generated by installing a stub distribution with each installer, then
# replacing the interpreter path and the import target with placeholders; never typed by hand.
# uv 0.12.10 (uv tool, uv pip), pip 24.0 (pip) and pip 26.3 (pipx 1.4.3); each also in its long-path form.
protected_groups: [onex.cli, onex.nodes]
launcher_script_name: onex
plugin_ignored_names: [.in_use]
launcher_templates:
  - name: uv
    installer: uv
    installer_version: "0.12.10"
    interpreter_names: ["python"]
    text: "#!{interpreter}\n# -*- coding: utf-8 -*-\nimport sys\nfrom {target_module} import {target_attr}\nif __name__ == \"__main__\":\n    if sys.argv[0].endswith(\"-script.pyw\"):\n        sys.argv[0] = sys.argv[0][:-11]\n    elif sys.argv[0].endswith(\".exe\"):\n        sys.argv[0] = sys.argv[0][:-4]\n    sys.exit({target_attr}())\n"
  - name: uv-long-path
    installer: uv
    installer_version: "0.12.10"
    interpreter_names: ["python"]
    text: "#!/bin/sh\n'''exec' '{interpreter}' \"$0\" \"$@\"\n' '''\n# -*- coding: utf-8 -*-\nimport sys\nfrom {target_module} import {target_attr}\nif __name__ == \"__main__\":\n    if sys.argv[0].endswith(\"-script.pyw\"):\n        sys.argv[0] = sys.argv[0][:-11]\n    elif sys.argv[0].endswith(\".exe\"):\n        sys.argv[0] = sys.argv[0][:-4]\n    sys.exit({target_attr}())\n"
  - name: pip
    installer: pip
    installer_version: "24.0"
    interpreter_names: ["python3", "python"]
    text: "#!{interpreter}\n# -*- coding: utf-8 -*-\nimport re\nimport sys\nfrom {target_module} import {target_attr}\nif __name__ == '__main__':\n    sys.argv[0] = re.sub(r'(-script\\.pyw|\\.exe)?$', '', sys.argv[0])\n    sys.exit({target_attr}())\n"
  - name: pip-long-path
    installer: pip
    installer_version: "24.0"
    interpreter_names: ["python3", "python"]
    text: "#!/bin/sh\n'''exec' {interpreter} \"$0\" \"$@\"\n' '''\n# -*- coding: utf-8 -*-\nimport re\nimport sys\nfrom {target_module} import {target_attr}\nif __name__ == '__main__':\n    sys.argv[0] = re.sub(r'(-script\\.pyw|\\.exe)?$', '', sys.argv[0])\n    sys.exit({target_attr}())\n"
  - name: pip-26
    installer: pip
    installer_version: "26.3"
    interpreter_names: ["python", "python3"]
    text: "#!{interpreter}\nimport sys\nfrom {target_module} import {target_attr}\nif __name__ == '__main__':\n    sys.argv[0] = sys.argv[0].removesuffix('.exe')\n    sys.exit({target_attr}())\n"
  - name: pip-26-long-path
    installer: pip
    installer_version: "26.3"
    interpreter_names: ["python", "python3"]
    text: "#!/bin/sh\n'''exec' {interpreter} \"$0\" \"$@\"\n' '''\nimport sys\nfrom {target_module} import {target_attr}\nif __name__ == '__main__':\n    sys.argv[0] = sys.argv[0].removesuffix('.exe')\n    sys.exit({target_attr}())\n"
