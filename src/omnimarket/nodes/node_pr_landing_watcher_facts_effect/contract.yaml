# ONEX Node Contract - the landing watcher facts source (OMN-23507, rebuild piece 9)
#
# The old landing controller gives a repository ruled out of its scope no facts, so the composed
# landing workflow's snapshot step (node_pr_landing_snapshot_effect) would read no pull request of
# a repository switched to the workflow. This node writes those facts from the PR watcher's state,
# in the shape the snapshot step's facts source reads. It only reads and records.
name: "node_pr_landing_watcher_facts_effect"
contract_name: "node_pr_landing_watcher_facts_effect"
node_name: "node_pr_landing_watcher_facts_effect"
lifecycle: experimental
node_type: "EFFECT_GENERIC"
contract_version:
  major: 0
  minor: 1
  patch: 0
node_version:
  major: 0
  minor: 1
  patch: 0
description: >
  Landing watcher facts source. Reads the PR watcher's state once, keeps the open pull requests of
  the repositories the overlay names, and writes them as one tick of landing facts
  (ModelLandingFacts, tick = the watcher's last_tick in epoch seconds) to the declared facts sink,
  the file the landing snapshot step's facts source reads. A state that is unreadable, holds no pr
  table or is older than the overlay's bound ends in the typed failed event and writes nothing. It
  never writes to GitHub and never acts on a pull request.
runtime_profiles:
  - effects
input_model:
  name: "ModelWatcherFactsRequest"
  module: "omnimarket.nodes.node_pr_landing_watcher_facts_effect.models.model_watcher_facts"
  description: "One pass."
output_model:
  name: "ModelWatcherFactsResult"
  module: "omnimarket.nodes.node_pr_landing_watcher_facts_effect.models.model_watcher_facts"
  description: "The written event and facts, or the typed failure."
handler:
  module: "omnimarket.nodes.node_pr_landing_watcher_facts_effect.handlers.handler_pr_landing_watcher_facts"
  class: "HandlerPrLandingWatcherFacts"
  input_model: "omnimarket.nodes.node_pr_landing_watcher_facts_effect.models.model_watcher_facts.ModelWatcherFactsRequest"
  output_model: "omnimarket.nodes.node_pr_landing_watcher_facts_effect.models.model_watcher_facts.ModelWatcherFactsResult"
dependencies:
  - name: ProtocolWatcherStateSource
    dependency_type: protocol
    description: "the PR watcher's state; in memory by default; the file profile reads overlay watcher_state_path."
    required: true
  - name: ProtocolLandingFactsSink
    dependency_type: protocol
    description: "where the facts go; in memory by default; the file profile replaces overlay facts_path whole, the file node_pr_landing_snapshot_effect's facts source reads."
    required: true
  - name: ProtocolWatcherFactsPublisher
    dependency_type: protocol
    description: "publishes the written or failed event; in memory by default; the file profile appends to watcher-facts-events.jsonl beside the overlay's emission_journal."
    required: true
handler_routing:
  routing_strategy: "operation_match"
  default_handler: "omnimarket.nodes.node_pr_landing_watcher_facts_effect.handlers.handler_pr_landing_watcher_facts:HandlerPrLandingWatcherFacts"
  handlers:
    - operation: "write_watcher_landing_facts"
      handler:
        name: "HandlerPrLandingWatcherFacts"
        module: "omnimarket.nodes.node_pr_landing_watcher_facts_effect.handlers.handler_pr_landing_watcher_facts"
event_bus:
  subscribe_topics:
    - "onex.cmd.omnimarket.pr-landing-watcher-facts-requested.v1"
  publish_topics:
    - "onex.evt.omnimarket.pr-landing-watcher-facts-written.v1"
    - "onex.evt.omnimarket.pr-landing-watcher-facts-failed.v1"
terminal_event: "onex.evt.omnimarket.pr-landing-watcher-facts-written.v1"
runtime_dispatch:
  command_topic: "onex.cmd.omnimarket.pr-landing-watcher-facts-requested.v1"
  terminal_events:
    success: "onex.evt.omnimarket.pr-landing-watcher-facts-written.v1"
    failure: "onex.evt.omnimarket.pr-landing-watcher-facts-failed.v1"
  external_trigger: "One pass per landing tick, before the snapshot step, on the host that holds the PR watcher's state: python -m omnimarket.nodes.node_pr_landing_watcher_facts_effect."
descriptor:
  node_archetype: effect
  purity: side_effecting
  runtime_profiles:
    - effects
  idempotent: true
  timeout_ms: 30000
overlay:
  id: node_pr_landing_watcher_facts_effect
  roots_env: ONEX_SKILL_OVERLAY_ROOTS
replay:
  deterministic: true
metadata:
  description: "Landing facts for the repositories switched to the composed landing workflow, read from the PR watcher's state."
  author: "OmniNode Team"
  license: "MIT"
  created: "2026-11-10"
  tags:
    - effect
    - pr-landing
    - landing-tick
    - watcher-facts
  related_tickets:
    - OMN-23507
