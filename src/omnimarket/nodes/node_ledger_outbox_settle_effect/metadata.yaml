name: node_ledger_outbox_settle_effect
version: "1.0.0"
description: "Settles the refused requests in a host's bus outbox: sends each again, restamps a row the serve's clock guard refused as stale with the original marked, and leaves a receipt"
omnibase_core_compat: ">=0.39.0,<1.0.0"
entry_points:
  onex.nodes:
    node_ledger_outbox_settle_effect: "omnimarket.nodes.node_ledger_outbox_settle_effect"
capabilities:
  standalone: true
  full_runtime: true
  requires_network: false
  requires_repo: false
  requires_secrets: false
  requires_docker: false
  side_effect_class: write
dependencies:
  - "pyyaml>=6.0"
  - "pydantic>=2.0"
authors: ["OmniNode Platform Team"]
license: "MIT"
tags: ["ledger", "outbox", "settle", "effect"]
pack: "ledger"
display_name: "Ledger Outbox Settle"
node_role: "effect"
