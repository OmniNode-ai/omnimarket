---
name: work_ledger_query_effect
node_type: effect
contract_version: {major: 1, minor: 4, patch: 0}
node_version: {major: 1, minor: 4, patch: 0}
# The main runtime declares ONEX_RUNTIME_LANE and carries OMNINODE_INTERNAL_DB_URL;
# effects lacks the lane, so lane-scoped discovery fails closed there (OMN-19408).
runtime_profiles: [main]
runtime_lanes: [compose-dev, onex-lab, onex-lab-k3s]
runtime_dispatch:
  command_topic: onex.cmd.omnimarket.work-ledger-query-requested.v1
  terminal_events:
    success: onex.evt.omnimarket.work-ledger-query-completed.v1
input_model: omnimarket.models.work_ledger_query.model_work_ledger_query.ModelWorkLedgerQueryRequest
output_model: omnimarket.models.work_ledger_query.model_work_ledger_query.ModelWorkLedgerQueryResult
description: >
  Answers reads of the work ledger from omninode_internal.work_ledger_rows on
  the lab with the markdown ledger's own read rules (rows by window, kind,
  lane, ticket, PR or term; open claims; holds in force; a lane's inbox; newest
  row per lane; rulings and consents). Every answer carries freshness and the
  window's parity status from the daily parity receipts. A database error is
  an error answer, never an empty one.
  The point queries (holds, open-claims, inbox, open-rulings) are answered from
  omninode_internal.work_ledger_state by its generated is_open column instead
  of folding rows: one keyset page of the open set, each entity joined to the
  row that opened it, rendered with the markdown read rules so the answer's
  lines are the onex-ledger verb's lines (a db:<row_id> tail where the file
  prints its line number). Every point-query answer carries status (error
  exactly when error is set), the page_size it was cut to and a watermark, the
  newest projected_at of the state table at the read; a page that has more
  carries next_cursor.
  A latest-state query (OMN-23694) answers one keyset page of the newest CLAIM, TERMINAL, STATUS, MSG and HOLD
  row per lane and per ticket from omninode_internal.work_ledger_latest, which node_projection_work_ledger keeps
  from each ledger row event: a board or a lane placement reads when each lane and ticket was last claimed, closed,
  updated, asked about and put on hold, never the rows. It narrows by subject_kind, lanes or tickets, kinds (row
  types) and since (newest-at start), carries the point queries' status, page_size, watermark and next_cursor, and a
  reader with no latest table answers status=error, never an empty page.
  A rows query carrying page_size answers one keyset page, oldest first, with the
  rows' lines and a next_cursor while more remain; its lanes are a union.
  A rows query with no since (and no row_ref or history) is bounded (OMN-23541): it reads back only
  the declared default window (the overlay's default_rows_window_days, else rows_default_window_days
  below) from its until, and its answer says so (bounded, bounded_window_days; window_since is the
  start it read from). A caller that wants more names a since.
  A rows query carrying history reads an explicit ledger_seq interval using an exclusive
  database-ingest cutoff. It retains raw rows and source names, checks source
  coverage before discovery filters, and binds cursors to the request and the
  source snapshot hash. Missing sequence/time authority, gaps, duplicates,
  missing sources or a truncated page report incomplete. It never certifies
  archive extents the caller has not supplied from a sealed source manifest.
handler:
  module: omnimarket.nodes.node_work_ledger_query_effect.handlers.handler_work_ledger_query
  class: HandlerWorkLedgerQuery
handler_routing:
  routing_strategy: topic_match
  handlers:
    - operation: work_ledger_query_requested
      topic: onex.cmd.omnimarket.work-ledger-query-requested.v1
      message_category: command
      event_model: omnimarket.models.work_ledger_query.model_work_ledger_query.ModelWorkLedgerQueryRequest
      handler_module: omnimarket.nodes.node_work_ledger_query_effect.handlers.handler_work_ledger_query
      handler:
        name: HandlerWorkLedgerQuery
        module: omnimarket.nodes.node_work_ledger_query_effect.handlers.handler_work_ledger_query
terminal_event: onex.evt.omnimarket.work-ledger-query-completed.v1
event_bus:
  subscribe_topics: [onex.cmd.omnimarket.work-ledger-query-requested.v1]
  publish_topics: [onex.evt.omnimarket.work-ledger-query-completed.v1]
  dlq_topics: [onex.dlq.omnimarket.work-ledger-query-malformed.v1]
work_ledger_query:
  ledger_source:
    relation: omninode_internal.work_ledger_rows
    # The entity table the point queries read (holds, open-claims, inbox,
    # open-rulings), by its generated is_open column (OMN-21948).
    state_relation: omninode_internal.work_ledger_state
    # The newest-row-per-lane-and-ticket table the latest-state query reads (OMN-23606), kept by
    # node_projection_work_ledger from each ledger row event.
    latest_relation: omninode_internal.work_ledger_latest
    binding_ref: omninode_runtime_service
    dsn_env: OMNINODE_INTERNAL_DB_URL
    parity_receipt_lane: work-ledger-parity
  # An until=open HOLD with no RELEASE older than this is stale, not in force: holds lists it under
  # a stale heading with its age and inbox does not count it (cutover plan section 13, answer 2).
  hold_stale_after_days: 14
  # A rows query with no since reads this many days back from its until (OMN-23541), not the whole
  # table (326 thousand rows, 22.5 s). The node's overlay field default_rows_window_days, when an
  # overlay supplies it, replaces this declared default.
  rows_default_window_days: 3
  # A rows query that carries page_size reads its window from the store once and holds it (OMN-24031):
  # the cursor of each page names the window's until, so the next page is cut from the held copy
  # instead of re-reading the window (measured on the dev bus: 108,757 rows over 7 days, about 109
  # pages, each page paid the whole read). A page that finds no held window re-reads it, so the held
  # copy is an optimisation, never a source of truth. The node's overlay fields
  # rows_window_cache_ttl_seconds and rows_window_cache_max_windows replace these declared values.
  rows_window_cache:
    ttl_seconds: 600
    max_windows: 2
  # A latest-state query with no page_size reads this many entries (OMN-23606): entries are small, so the
  # default page is larger than a point query's, and the answer bound below still refuses an answer over it.
  latest_default_page_size: 1000
  # Every answer travels as one record on the completed topic. The producer
  # refuses a record over its max_request_size (1,048,588 on the dev bus), and
  # an unbounded newest-per-lane answer measured 73 MB there (OMN-22478). An
  # answer over max_answer_bytes is replaced by a typed refusal.
  answer_bound:
    broker_max_request_size: 1048588
    envelope_headroom_bytes: 131072
    max_answer_bytes: 917516
db_io:
  db_tables:
    - name: work_ledger_rows
      database_ref: application
      schema: omninode_internal
      migration: "0000_create_work_ledger.sql"
      access: read
      role: work_ledger_rows
    - name: work_ledger_state
      database_ref: application
      schema: omninode_internal
      migration: "0000_create_work_ledger.sql"
      access: read
      role: work_ledger_state
    - name: work_ledger_latest
      database_ref: application
      schema: omninode_internal
      migration: "0011_work_ledger_latest.sql"
      access: read
      role: work_ledger_latest
golden_path:
  - "Command arrives"
  - "Read the window rows, receipts and freshness"
  - "Replay the rows with the markdown read rules"
  - "Return the typed answer on terminal_event"
dod_evidence:
  - test: tests/test_work_ledger_history_query.py::test_history_returns_both_rolls_in_canonical_order_with_authoritative_time
    description: "History preserves sequence order, raw sources and database ingest authority"
  - test: tests/test_work_ledger_history_postgres.py::test_postgres_history_returns_both_sources_and_rejects_truncation_and_gaps
    description: "Production PostgreSQL reader reports gaps and truncation as incomplete"
  - test: tests/test_golden_chain_work_ledger_query.py::test_work_ledger_query_golden_chain
    description: "Every query returns the rows the markdown read verbs return over the fixture"
  - test: tests/test_golden_chain_work_ledger_query.py::test_work_ledger_query_golden_chain_real_runtime_typed_dispatch
    description: "Command reaches the node through real runtime typed dispatch"
  - test: tests/unit/nodes/node_work_ledger_query_effect/test_point_query_state.py::test_point_query_holds_answers_the_verb_line_from_state
    description: "A point query renders the verb's own line from work_ledger_state"
  - test: tests/test_work_ledger_point_query_postgres.py::test_point_query_postgres_holds_read_is_open_not_the_log
    description: "Against real PostgreSQL the is_open column, not a fold of rows, selects the holds"
  - test: tests/unit/nodes/node_work_ledger_query_effect/test_point_query_state.py::test_point_query_fault_answers_status_error_never_an_empty_page
    description: "A database fault answers status=error, never an empty page"
  - test: tests/unit/nodes/node_work_ledger_query_effect/test_rows_default_window_omn23541.py::test_golden_no_since_rows_query_is_bounded_to_the_window
    description: "A rows query with no start reads the declared window and says it was bounded"
  - test: tests/unit/nodes/node_work_ledger_query_effect/test_point_query_state.py::test_page_and_watermark_ride_every_point_query_answer
    description: "Every point-query answer carries a page size and a watermark"
  - test: tests/unit/nodes/node_work_ledger_query_effect/test_latest_state_query.py::test_golden_paging_follows_next_cursor_without_repeat_or_gap
    description: "A latest-state page follows next_cursor without repeat or gap"
  - test: tests/unit/nodes/node_work_ledger_query_effect/test_latest_state_query.py::test_error_chain_a_reader_that_cannot_read_answers_an_error_never_an_empty_page
    description: "A latest-state read that fails answers status=error, never an empty page"
  - test: tests/unit/nodes/node_work_ledger_query_effect/test_latest_state_seams.py::test_seam_the_answer_fields_the_consumers_read_exist
    description: "The answer fields the board floor step and the work-state projection read exist"
  - test: tests/unit/nodes/node_work_ledger_query_effect/test_rows_window_read_once.py::test_reads_the_window_once_for_every_page
    description: "A multi-page rows read of one window reads the store once, not once per page"
  - test: tests/unit/nodes/node_work_ledger_query_effect/test_rows_window_read_once.py::test_error_chain_a_store_failure_on_any_page_is_an_error_answer_and_is_not_held
    description: "A store failure on any page is an error answer, never an empty page, and a failed window is not held"
  - test: tests/unit/nodes/node_work_ledger_query_effect/test_rows_window_read_once.py::test_reader_seam_a_window_read_through_the_reader_reads_the_store_once
    description: "The reader node paging the query node by next_cursor reads the store once for the window"
metadata:
  transport_type: kafka
  related_tickets: [OMN-20738, OMN-19513, OMN-21948, OMN-23541, OMN-23694, OMN-24031]
