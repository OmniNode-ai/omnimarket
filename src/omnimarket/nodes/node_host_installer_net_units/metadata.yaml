name: node_host_installer_net_units
version: "1.0.0"
description: "Installs declared root-owned Linux host units (a systemd service with its script, sshd drop-ins) byte for byte, validating sshd before it reloads"
omnibase_core_compat: ">=0.39.0,<1.0.0"
entry_points:
  onex.nodes:
    node_host_installer_net_units: "omnimarket.nodes.node_host_installer_net_units"
capabilities:
  standalone: true
  full_runtime: true
  requires_network: false
  requires_repo: false
  requires_secrets: false
  requires_docker: false
  side_effect_class: write
dependencies:
  - "pyyaml>=6.0"
  - "pydantic>=2.0"
authors: ["OmniNode Platform Team"]
license: "MIT"
tags: ["install", "systemd", "sshd", "linux", "effect"]
pack: "install"
display_name: "Host Installer Net Units"
node_role: "effect"
