# OVERLAY. No project, operator, repository owner, account, host name or host path
# lives in this node; they arrive on the request, read by the caller from its overlay.
name: "node_cloud_session_placement_effect"
lifecycle: experimental
node_type: "EFFECT_GENERIC"
runtime_profiles: [effects]
contract_version:
  major: 0
  minor: 1
  patch: 0
node_version: "0.1.0"
description: >
  Decides cloud eligibility and account placement per claude.ai login, maintains local account state,
  and renders or parses cloud session text. Callers perform network probes.
# DATA (OMN-21373, operator 2026-10-29T17:47:11Z "use cloud to supplement local capacity"): the order the
# runner tries places for --placement auto, read by the route action. A lab host that admits the lane comes
# first; a cloud session is the overflow when none does. The runner holds no order of its own.
placement_order:
  auto: [lab, cloud]
  lab: [lab]
  cloud: [cloud]
# OVERLAY KEYS (OMN-22243): a cloud session's capacity is counted per claude.ai login, never per host. The caller reads
# these from <root>/node_cloud_session_placement_effect/overlay.yaml (overlay.example.yaml shows the shape) and puts
# them on the request; the node holds none of them. The registry loader refuses a missing key, a duplicate label and
# a duplicate hash pair, each by name.
overlay:
  accounts:
    description: "One entry per consented claude.ai login."
    keys:
      label: "the account's name (the key of its usage state in cloud-accounts-v2.json)"
      org_hash: "first 10 hex of the sha256 of the login's organization id"
      email_hash: "first 10 hex of the sha256 of the login's lowercased email; both hashes must match"
      consent: "the ledger row stamp of the operator consent"
      consent_expires: "optional full stamp; the consent holds strictly before it"
      credit_expires: "optional date or stamp; the credit holds through it, inclusive"
      legacy_hosts: "host names whose entries in the old cloud-accounts.json merge into this account once"
      transport_exclude: "hosts that never make a start call for any account"
  login_fresh_s: "seconds a login observation stays usable"
  probe_timeout_s: "seconds the caller allows each auth and cloud probe; returned by transports"
# WIRE SHAPES (OMN-22243). transports: input rows [{name, target, local, push, contributor}] (other table fields are
# ignored, a host's lab availability is never read), output transports [{name, target, local}] and excluded [sentence]
# plus probe_timeout_s. observe_logins: input observations [{host, reachable, auth_text, probe_text}] (the raw texts of
# `claude auth status --json` and the cloud probe), output logins, unconsented [{host, org_hash, email_hash, seen_at,
# sentence}], unreachable and sentences. pick and slots: input accounts, transports (table order) and login_fresh_s;
# output account, transport, transports (that account's usable hosts in order), sentences, flags, unconsented,
# needs_probe (stale hosts to observe again). start_outcome: input account, run_id, transport, began (the start call
# began), text (its raw answer), untried (the transports left); output verdict started | try-next | refused |
# start-unknown | failed, next_transport, sentence. Usage state lives in cloud-accounts-v2.json keyed by account label.
dependencies:
  - name: omnimarket.nodes.node_llm_delegation_call_effect
    dependency_type: internal
    description: "Public cloud-session start renderer owns the harness invocation."
    required: true
input_model:
  name: "ModelCloudSessionPlacementRequest"
  module: "omnimarket.models.cloud_session_placement.model_cloud_session_placement"
  description: "Action, overlay values, account state directory, and caller probe verdicts."
output_model:
  name: "ModelCloudSessionPlacementResult"
  module: "omnimarket.models.cloud_session_placement.model_cloud_session_placement"
  description: "Placement decision, probe continuation, session text, or error."
handler:
  module: "omnimarket.nodes.node_cloud_session_placement_effect.handlers.handler_cloud_session_placement"
  class: "HandlerCloudSessionPlacement"
  input_model: "omnimarket.models.cloud_session_placement.model_cloud_session_placement.ModelCloudSessionPlacementRequest"
handler_routing:
  routing_strategy: "operation_match"
  default_handler: "omnimarket.nodes.node_cloud_session_placement_effect.handlers.handler_cloud_session_placement:HandlerCloudSessionPlacement"
  handlers:
    - operation: "decide_cloud_session_placement"
      handler:
        name: "HandlerCloudSessionPlacement"
        module: "omnimarket.nodes.node_cloud_session_placement_effect.handlers.handler_cloud_session_placement"
      input_model: "omnimarket.models.cloud_session_placement.model_cloud_session_placement.ModelCloudSessionPlacementRequest"
      output_model: "omnimarket.models.cloud_session_placement.model_cloud_session_placement.ModelCloudSessionPlacementResult"
descriptor:
  node_archetype: effect
  purity: effectful
  idempotent: true
  timeout_ms: 130000
runtime_dispatch:
  command_topic: "onex.cmd.omnimarket.cloud-session-placement-requested.v1"
  terminal_events:
    success: "onex.evt.omnimarket.cloud-session-placement-completed.v1"
    failure: "onex.evt.omnimarket.cloud-session-placement-failed.v1"
published_events:
  - event_type: ModelCloudSessionPlacementResult
    topic: onex.evt.omnimarket.cloud-session-placement-completed.v1
    description: "The outcome of one cloud session placement operation."
externally_consumed_topics:
  - onex.evt.omnimarket.cloud-session-placement-completed.v1
  - onex.evt.omnimarket.cloud-session-placement-failed.v1
metadata:
  transport_type: kafka
  ticket: OMN-21373
  description: "Cloud session placement and account state"
  author: "OmniNode Team"
  tags:
    - "effect"
    - "lab"
    - "cloud-session"
    - "OMN-21373"
    - "OMN-22243"
  related_tickets:
    - "OMN-21373"
    - "OMN-22243"
