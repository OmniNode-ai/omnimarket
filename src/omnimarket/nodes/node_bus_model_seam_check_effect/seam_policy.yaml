#
# Policy of node_bus_model_seam_check_effect (OMN-23995): every value the check reads that is not
# a contract. Edited by hand only to SHRINK `pins`; the check refuses a pin that no longer matches
# its pair exactly, so a fixed seam forces its pin out, and refuses any new refusing pair.
#
# strict_models: a model on either side of a pair that must have zero refused and zero missing
#   fields with no pin, and must appear in at least one pair. These are the seams of the two
#   incidents the check starts from: the host capacity advertisement the factory board reads
#   (a bus model gained a field and the board refused every publish for 68 minutes on 2026-11-10)
#   and the silent-failure alarm's request.
strict_models:
- omnimarket.models.model_host_capacity_advertisement.ModelHostCapacityAdvertisement
- omnimarket.nodes.node_silent_failure_alarm_effect.models.ModelSilentFailureAlarmRequest

# external_producers: a topic whose producer is not a node contract (the contract names it only in
#   free text under externally_produced_topics). The model is the one the producer builds.
#   The alarm's three command topics are published by its own command-line runtime
#   (runtime_silent_failure_alarm builds the request with ModelSilentFailureAlarmRequest).
external_producers:
- topic: onex.cmd.omnimarket.silent-failure-alarm-requested.v1
  model: omnimarket.nodes.node_silent_failure_alarm_effect.models.ModelSilentFailureAlarmRequest
- topic: onex.cmd.omnimarket.silent-failure-drainer-observe-requested.v1
  model: omnimarket.nodes.node_silent_failure_alarm_effect.models.ModelSilentFailureAlarmRequest
- topic: onex.cmd.omnimarket.silent-failure-drainer-repair-requested.v1
  model: omnimarket.nodes.node_silent_failure_alarm_effect.models.ModelSilentFailureAlarmRequest

# pins: pairs that refuse today, read from the contracts on 2026-11-12 by
#   `python -m omnimarket.nodes.node_bus_model_seam_check_effect --list-findings`.
#   A pair here is measured debt, never an exemption: only an inferred pair (a side the contract
#   does not state outright) can be pinned, and the pin must equal the pair's refused and
#   missing names exactly, so it can only shrink as a seam is fixed.
