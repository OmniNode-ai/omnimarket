  - ci_artifact_refs
  - collected_at
  - collector_identity
  - diff_refs
  - provenance
  - raw_payload_refs
  - repository
  - source_ci_run
  - source_commit_sha
  - source_pr
  - source_surfaces
  - test_output_refs
  - validation_run_id
  missing:
  - event_id
