name: node_host_drift_plugin_rules_effect
lifecycle: experimental
node_type: EFFECT_GENERIC
runtime_profiles:
- effects
contract_version:
  major: 1
  minor: 0
  patch: 0
node_version:
  major: 1
  minor: 0
  patch: 0
description: Load and validate the host-drift plugin sync rules from plugin_sync_policy.yaml (OMN-20689).
input_model:
  name: ModelPluginRulesRequest
  module: omnimarket.models.model_plugin_rules
output_model:
  name: ModelPluginRulesResult
  module: omnimarket.models.model_plugin_rules
handler:
  module: omnimarket.nodes.node_host_drift_plugin_rules_effect.handlers.handler_plugin_rules
  class: HandlerHostDriftPluginRules
  input_model: omnimarket.models.model_plugin_rules.ModelPluginRulesRequest
  output_model: omnimarket.models.model_plugin_rules.ModelPluginRulesResult
handler_routing:
  routing_strategy: payload_type_match
  handlers:
  - handler:
      name: HandlerHostDriftPluginRules
      module: omnimarket.nodes.node_host_drift_plugin_rules_effect.handlers.handler_plugin_rules
    event_model:
      name: ModelPluginRulesRequest
      module: omnimarket.models.model_plugin_rules
event_bus:
  subscribe_topics:
  - onex.cmd.omnimarket.host-drift-plugin-rules-requested.v1
  publish_topics:
  - onex.evt.omnimarket.host-drift-plugin-rules-loaded.v1
runtime_dispatch:
  command_topic: onex.cmd.omnimarket.host-drift-plugin-rules-requested.v1
descriptor:
  node_archetype: effect
  runtime_profiles:
  - effects
  purity: effectful
  idempotent: true
  timeout_ms: 10000
metadata:
  transport_type: kafka
  ticket: OMN-20689
  description: Plugin sync rules overlay; its settings are the overlay plugin_sync_policy.yaml.
  tags:
  - host-drift
terminal_event: onex.evt.omnimarket.host-drift-plugin-rules-loaded.v1
published_events:
- topic: onex.evt.omnimarket.host-drift-plugin-rules-loaded.v1
  event_type: ModelPluginRulesResult
externally_consumed_topics:
- onex.evt.omnimarket.host-drift-plugin-rules-loaded.v1

# The broker grants the node's two topics need (coverage gate): the runtime login reads the request and writes the answer.
broker_acl_grants:
  - principal: "${ONEX_ACL_RUNTIME_PRINCIPAL}"
    grants:
      - {resource_type: TOPIC, pattern: LITERAL, name: onex.cmd.omnimarket.host-drift-plugin-rules-requested.v1, operation: READ}
      - {resource_type: TOPIC, pattern: LITERAL, name: onex.cmd.omnimarket.host-drift-plugin-rules-requested.v1, operation: DESCRIBE}
      - {resource_type: TOPIC, pattern: LITERAL, name: onex.evt.omnimarket.host-drift-plugin-rules-loaded.v1, operation: WRITE}
      - {resource_type: TOPIC, pattern: LITERAL, name: onex.evt.omnimarket.host-drift-plugin-rules-loaded.v1, operation: DESCRIBE}
