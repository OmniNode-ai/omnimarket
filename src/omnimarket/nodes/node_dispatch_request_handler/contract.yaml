---
name: dispatch_request_handler
contract_version: {major: 1, minor: 0, patch: 0}
node_type: orchestrator
node_version: {major: 1, minor: 0, patch: 0}
input_model: ModelDispatchRequest

description: >
  Routes dispatch requests from the dashboard UI to target nodes.
  Validates command envelope, resolves target node, invokes it.

handler:
  module: omnimarket.nodes.node_dispatch_request_handler.handlers.handler_dispatch_request
  class: NodeDispatchRequestHandler
  input_model: ModelDispatchRequest

handler_routing:
  routing_strategy: operation_match
  handlers:
    - operation: dispatch_request_handler
      handler:
        name: NodeDispatchRequestHandler
        module: omnimarket.nodes.node_dispatch_request_handler.handlers.handler_dispatch_request

descriptor:
  node_archetype: orchestrator
  purity: effectful
  runtime_profiles:
    - effects
  idempotent: false
  timeout_ms: 30000

terminal_event: onex.evt.omnimarket.dispatch-request-completed.v1

event_bus:
  subscribe_topics:
    - onex.cmd.omnimarket.dispatch-request.v1
  publish_topics:
    - onex.evt.omnimarket.dispatch-request-completed.v1

externally_consumed_topics:
  - onex.evt.omnimarket.dispatch-request-completed.v1

metadata:
  transport_type: kafka
  description: "Routes dashboard dispatch requests to target nodes"
  author: "OmniNode Platform Team"
  created: "2026-05-25"
  tags:
    - "orchestrator"
    - "dispatch"
    - "dashboard"
    - "routing"
    - "OMN-12146"
  related_tickets:
    - "OMN-12146"
