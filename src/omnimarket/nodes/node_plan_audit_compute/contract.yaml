---
name: node_plan_audit_compute
contract_version: {major: 1, minor: 0, patch: 0}
node_type: compute
node_version: {major: 1, minor: 0, patch: 0}
node_not_implemented: false
description: >
  Audit plan files in YAML or Markdown format. YAML plans get field presence
  checks, schema validation, and dependency cycle detection (top-level mapping
  with a non-empty title and a non-empty tasks list; each task requires
  non-empty id and title fields, and may declare dependencies or depends_on
  as a list of task id strings). Markdown plans get structure (H1 title),
  Linear ticket linkage (OMN-XXXX), and verified-state marker checks
  (missing verified-state is advisory WARN). Unsupported file formats are
  reported as SKIPPED with a reason, never a crash. plan_path may reference a
  single file or a directory of plan files; a run that audits zero files is
  an error, never a vacuous pass. Produces a per-file PASS/WARN/FAIL/SKIPPED
  verdict plus an aggregate verdict. Pure deterministic transform — no LLM
  calls.

handler:
  module: omnimarket.nodes.node_plan_audit_compute.handlers.handler_plan_audit_compute
  class: HandlerPlanAuditCompute
  input_model: omnimarket.nodes.node_plan_audit_compute.models.model_plan_audit_compute_request.ModelPlanAuditComputeRequest

handler_routing:
  handlers:
    - operation: plan_audit
      handler:
        name: HandlerPlanAuditCompute
        module: omnimarket.nodes.node_plan_audit_compute.handlers.handler_plan_audit_compute

descriptor:
  node_archetype: compute
  purity: pure
  idempotent: true
  timeout_ms: 30000

inputs:
  plan_path:
    type: str
    required: true
    description: >-
      Absolute path to the plan file (YAML or Markdown) to audit, or to a
      directory of plan files (each *.md/*.yaml/*.yml audited; other files
      reported as SKIPPED)

outputs:
  passed:
    type: bool
    description: "True when all checks pass"
  verdict:
    type: str
    enum: [PASS, WARN, FAIL, SKIPPED, ERROR]
    description: "Aggregate audit verdict across all scanned plan files"
  checks:
    type: list[object]
    description: "Per-check result objects with name, passed, and violation detail"
  violations:
    type: list[str]
    description: "Human-readable list of violation messages"
  warnings:
    type: list[str]
    description: "Human-readable list of advisory messages"
  plans:
    type: list[object]
    description: "Per-file audit results (path, verdict, checks, skip reason)"
  status:
    type: str
    enum: [ok, error]

terminal_event: onex.evt.omnimarket.plan-audit-completed.v1

event_bus:
  subscribe_topics:
    - onex.cmd.omnimarket.plan-audit-start.v1
  publish_topics:
    - onex.evt.omnimarket.plan-audit-completed.v1

metadata:
  transport_type: kafka
