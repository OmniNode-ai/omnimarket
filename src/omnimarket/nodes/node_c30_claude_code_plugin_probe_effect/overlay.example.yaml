# Synthetic values. The deployment's overlay lives at <root>/node_c30_claude_code_plugin_probe_effect/overlay.yaml
# under a root named in ONEX_SKILL_OVERLAY_ROOTS, or the file ONEX_C30_PROBE_OVERLAY names. No key has a default.
