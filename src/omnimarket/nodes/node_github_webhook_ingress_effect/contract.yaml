# ONEX Node Contract
# Node: NodeGitHubWebhookIngressEffect
#
# The lab end of the GitHub webhook feed (OMN-14375, T2.1 OMN-19492 of the
# 2026-09-25 GitHub-quota plan). GitHub posts signed deliveries to the
# onex-api door on dev.api.omninode.ai (OMN-19592, operator RULING
# 2026-09-25T14:18:52Z Q2); the door publishes one command per delivery; the
# gateway forwarder's inbound leg (OMN-19593) carries it to the dev lane,
# where this node re-verifies the signature and folds the delivery into:
#   - onex.evt.github.pr-status.v1: partial PR-state observations (consumed by
#     node_branch_claim_check_effect); a column a delivery says nothing about
#     is None;
#   - onex.evt.github.pr-merged.v1: one event per merge, for every repository
#     the onexbot-pr-reader App is installed on, which omnimarket's
#     node_pr_merged_projection materializes into pr_merged_events.
#   - onex.evt.github.branch-head.v1: watched branch ref advances, branch-head
#     summary CI verdicts and separate merge-group verdicts (OMN-19932).
name: "node_github_webhook_ingress_effect"
contract_name: "node_github_webhook_ingress_effect"
node_name: "node_github_webhook_ingress_effect"
node_type: "EFFECT_GENERIC"
runtime_profiles:
  - effects
contract_version:
  major: 1
  minor: 0
  patch: 1
node_version: "0.1.1"
descriptor:
  node_archetype: effect
  purity: effectful
  runtime_profiles:
    - effects
  idempotent: true
description: >
  Consumes signed GitHub webhook deliveries from onex.cmd.github.webhook-delivery.v1, re-verifies the X-Hub-Signature-256 HMAC over the exact received bytes in constant time, refuses (typed error, dead-lettered) any delivery it cannot verify or parse, and folds pull_request, pull_request_review and summary check_run deliveries into partial PR-state observations on onex.evt.github.pr-status.v1 plus one merged event per merge on onex.evt.github.pr-merged.v1. Push and summary check_run deliveries also produce watched branch ref advances, branch-head CI verdicts and distinct merge-group verdicts on onex.evt.github.branch-head.v1. Any completed check_run with a red conclusion also yields one observation per pull request on onex.evt.github.check-run.v1, and workflow_run deliveries yield run-id-to-workflow-name observations on onex.evt.github.workflow-run.v1. Refuses every delivery when no webhook secret is configured.

input_model:
  name: "ModelGitHubWebhookDelivery"
  module: "omnimarket.nodes.node_github_webhook_ingress_effect.models"
  description: "One signed GitHub delivery: event name, delivery id, signature header and the base64 raw body."
event_bus:
  version:
    major: 1
    minor: 0
    patch: 0
  subscribe_topics:
    - "onex.cmd.github.webhook-delivery.v1"
  publish_topics:
    - "onex.evt.github.pr-status.v1"
    - "onex.evt.github.pr-merged.v1"
    - "onex.evt.github.branch-head.v1"
    - "onex.evt.github.check-run.v1"
    - "onex.evt.github.workflow-run.v1"
    - "onex.evt.github.webhook-delivery-refused.v1"
consumed_events:
  - topic: "onex.cmd.github.webhook-delivery.v1"
    event_type: "GitHubWebhookDelivery"
    message_category: "COMMAND"
    description: "A signed GitHub webhook delivery forwarded from the onex-api door."
published_events:
  - topic: "onex.evt.github.pr-status.v1"
    event_type: "GitHubPrStateObservation"
    description: "Partial PR state one delivery observed; None fields leave the stored pr_state column unchanged."
  - topic: "onex.evt.github.pr-merged.v1"
    event_type: "GitHubPrMergedObservation"
    description: "A merged pull request, with a deterministic event_id per (repo, number, merge sha)."
  - topic: "onex.evt.github.webhook-delivery-refused.v1"
    event_type: "BoundaryFailureTerminal"
    description: "The failure terminal: one record per refused delivery (no secret, bad signature, malformed body), published by the consume boundary."
  - topic: "onex.evt.github.branch-head.v1"
    event_type: "GitHubBranchHeadObservation"
    description: "Watched branch ref advances, branch-head summary CI verdicts and separate merge-group CI verdicts."
  - topic: "onex.evt.github.check-run.v1"
    event_type: "GitHubCheckRunObservation"
    description: "A completed check run with a red conclusion (any check, not only the summary), once per pull request the run names: conclusion, workflow run id and completion time (OMN-20743)."
  - topic: "onex.evt.github.workflow-run.v1"
    event_type: "GitHubWorkflowRunObservation"
    description: "A workflow run's id and workflow name as it is requested, runs and completes, which no check-run delivery names (OMN-20743)."
# The FAILURE terminal. A refused delivery raises a typed error; the consume
# boundary dead-letters the command and publishes its failure terminal HERE.
# Without this declaration the boundary answers at the first output topic of
# the contract, onex.evt.github.pr-status.v1, and a pr-status consumer then
# refuses that record as a malformed status event (measured on the
# pre-PR slot).
runtime_dispatch:
  terminal_events:
    success: "onex.evt.github.webhook-delivery-refused.v1"
handler_routing:
  routing_strategy: "operation_match"
  handlers:
    - operation: "github_webhook.ingest"
      event_model:
        name: "ModelGitHubWebhookDelivery"
        module: "omnimarket.nodes.node_github_webhook_ingress_effect.models"
      event_type: "github.webhook-delivery"
      message_category: "COMMAND"
      handler:
        name: "HandlerGitHubWebhookIngress"
        module: "omnimarket.nodes.node_github_webhook_ingress_effect.handlers.handler_github_webhook_ingress"
      supported_operations:
        - "github_webhook.ingest"
      description: "Verify the delivery signature and fold it into PR-state, merge and watched branch observations."
  execution_mode: "single"
  max_timeout_seconds: 30
config:
  watched_branches: [dev, main]
  # Check runs that stand for a PR's CI verdict. A lone check run is not a
  # verdict; the one required summary context is. Repositories without one of
  # these get their verdict from the reconciler (OMN-19493).
  summary_check_names:
    - "CI Summary"
dependencies:
  - name: "secret_resolver"
    type: "service"
    class_name: "SecretResolver"
    module: "omnibase_infra.runtime.secret_resolver"
    description: "Built by omnibase_infra's service_kernel from the lane's rendered resolver config when it maps the logical name github.webhook.secret (the onexbot-pr-reader App webhook HMAC secret; secret store key dev:/shared/env/GITHUB_WEBHOOK_SECRET). Absent means every delivery is refused."
    required: false
capabilities:
  - name: "github_webhook_signature_verification"
    description: "Constant-time HMAC-SHA256 verification of X-Hub-Signature-256 over the raw body."
  - name: "github_pr_state_fold"
    description: "Fold pull_request, pull_request_review and summary check_run deliveries into pr_state observations."
  - name: "github_red_check_run_fold"
    description: "Fold any red check_run conclusion, and workflow_run names, into observations a red-CI consumer reads when GitHub reports them (OMN-20743)."
  - name: "github_pr_merged_all_repos"
    description: "Emit one pr-merged event per merge for every installed repository."
metadata:
  description: "Lab end of the GitHub webhook feed (OMN-14375)."
  author: "OmniNode Team"
  license: "MIT"
  created: "2026-09-27"
  ticket: "OMN-19492"
  tags:
    - "effect"
    - "github"
    - "webhook"
    - "pr_state"
