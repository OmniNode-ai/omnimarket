name: node_host_drift_owner_dispatch_effect
version: 1.0.0
description: Gives each open host drift item past its bound one owned fix lane - the item is rendered as an alarm row, the alarm owner responder decides, and the remote-lane runner starts the lane.
pack: operator_tooling
node_role: effect
display_name: Host Drift Owner Dispatch
omnibase_core_compat: '>=0.39.0,<1.0.0'
entry_points:
  onex.nodes:
    node_host_drift_owner_dispatch_effect: omnimarket.nodes.node_host_drift_owner_dispatch_effect
capabilities:
  standalone: true
  full_runtime: false
  requires_network: true
  requires_repo: false
  requires_secrets: false
  requires_docker: false
  side_effect_class: read_write
dependencies:
- pydantic>=2.0
- pyyaml>=6.0
authors:
- OmniNode Platform Team
license: MIT
tags:
- effect
- host-drift
- alarm
