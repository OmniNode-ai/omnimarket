# Compaction ground truth derived from the ledger (OMN-21975).
# Reads a pinned ledger prefix at a boundary instant and returns the must-survive set: rulings in
# force, consents in scope, open claims, open asks, sent promises, unsent drafts, holds and
# unacknowledged messages, each with its quote, required spans, expected conduct and the stamps of
# the rows that cover it. A second operation audits a derived set against the plan author's
# positive and negative lists and the TE.1 labelled propositions. The caller reads the ledger and
# passes its rows in; the node performs no I/O and declares no topic.
name: node_compaction_ground_truth_compute
lifecycle: experimental
contract_version: {major: 1, minor: 0, patch: 0}
node_type: compute
node_version: {major: 1, minor: 0, patch: 0}
description: >
  Derive the compaction must-survive set at a boundary instant from a pinned ledger prefix,
  using the work-ledger reducer for what is in force, and audit it as a strict selection.
handler:
  module: omnimarket.nodes.node_compaction_ground_truth_compute.handlers.handler_ground_truth
  class: HandlerCompactionGroundTruth
  input_model: omnimarket.nodes.node_compaction_ground_truth_compute.models.model_ground_truth.ModelGroundTruthRequest
  output_model: omnimarket.nodes.node_compaction_ground_truth_compute.models.model_ground_truth.ModelGroundTruthResult
handler_routing:
  routing_strategy: operation_match
  handlers:
    - operation: derive_ground_truth
      handler:
        name: HandlerCompactionGroundTruth
        module: omnimarket.nodes.node_compaction_ground_truth_compute.handlers.handler_ground_truth
      input_model: omnimarket.nodes.node_compaction_ground_truth_compute.models.model_ground_truth.ModelGroundTruthRequest
      output_model: omnimarket.nodes.node_compaction_ground_truth_compute.models.model_ground_truth.ModelGroundTruthResult
    - operation: audit_ground_truth
      handler:
        name: HandlerCompactionGroundTruthAudit
        module: omnimarket.nodes.node_compaction_ground_truth_compute.handlers.handler_ground_truth_audit
      input_model: omnimarket.nodes.node_compaction_ground_truth_compute.models.model_ground_truth.ModelGroundTruthAuditRequest
      output_model: omnimarket.nodes.node_compaction_ground_truth_compute.models.model_ground_truth.ModelGroundTruthAuditResult
descriptor:
  node_archetype: compute
  purity: pure
  idempotent: true
  side_effects: []
  runtime_profiles: []
  timeout_ms: 10000

event_bus:
  subscribe_topics: []
  publish_topics: []

runtime_dispatch:
  external_trigger: Direct invocation with the pinned ledger prefix rows and the boundary instant.

metadata:
  ticket: OMN-21975
  transport_type: local
