---
# SPDX-FileCopyrightText: 2026 OmniNode.ai Inc.
# SPDX-License-Identifier: MIT
# ONEX Node Contract - GitHub Repo Gateway (read-only status reader)
#
# EFFECT (read-only): runs one typed read operation against the GitHub API and
# returns a small discriminated-union result. Reuses the existing GitHub
# GraphQL/REST transport; performs no mutation and no subprocess shell-out.
name: node_github_repo_gateway_effect
contract_version: {major: 1, minor: 1, patch: 0}
node_type: effect
node_version: {major: 1, minor: 0, patch: 0}
lifecycle: experimental

description: >
  EFFECT (read-only): typed GitHub repo status reader. Selects one read
  operation (pr_status, ci_checks, open_prs_list, branch_protection,
  review_gate, merge_commit_sha, ticket_ref, workflow_runs, run_jobs,
  job_log_tail, artifacts, pr_text, releases) and returns a small typed object
  so callers replace raw `gh pr checks/view --json`, `gh run list/view`, job
  log reads, `gh run download` and `gh release list`. Every operation is one
  ModelGithubGatewayRequest on
  onex.cmd.omnimarket.github-repo-gateway-read-requested.v1 answered by one
  ModelGithubGatewayResponse on
  onex.evt.omnimarket.github-repo-gateway-read-completed.v1, whose result is
  discriminated by `operation`. List reads page inside the node up to the
  request's limit (at most 300) and say when they were cut; job_log_tail keeps
  at most 64 KiB of the log's end; artifacts fetches one archive only when it
  is at most max_bytes (at most 512 KiB) and otherwise refuses with a typed
  reason. The GitHub token is resolved at the effect boundary from the
  contract-declared api_key_ref via the canonical secret-store resolver.

# OMN-20912: the operation table slice 2 (`onex scm`) and slice 3 (the gh shim
# coverage table) read. Names are stable; the gh verb each one replaces is on
# the right.
operations:
  - name: pr_status
    description: "Request ModelGithubGatewayRequest, result ModelPrStatusResult; replaces gh pr view --json mergeStateStatus."
  - name: ci_checks
    description: "Request ModelGithubGatewayRequest, result ModelCiChecksResult; replaces gh pr checks."
  - name: open_prs_list
    description: "Request ModelGithubGatewayRequest, result ModelOpenPrsResult; replaces gh pr list."
  - name: branch_protection
    description: "Request ModelGithubGatewayRequest, result ModelBranchProtectionResult; replaces gh api branches/<b>/protection."
  - name: review_gate
    description: "Request ModelGithubGatewayRequest, result ModelReviewGateResult; replaces gh pr view --json reviewDecision."
  - name: merge_commit_sha
    description: "Request ModelGithubGatewayRequest, result ModelMergeCommitShaResult; replaces gh pr view --json mergeCommit."
  - name: ticket_ref
    description: "Request ModelGithubGatewayRequest, result ModelTicketRefResult; replaces gh pr view --json headRefName."
  - name: workflow_runs
    description: "Request ModelGithubGatewayRequest, result ModelWorkflowRunsResult; replaces gh run list."
  - name: run_jobs
    description: "Request ModelGithubGatewayRequest, result ModelRunJobsResult; replaces gh run view."
  - name: job_log_tail
    description: "Request ModelGithubGatewayRequest, result ModelJobLogTailResult; replaces gh run view --log / actions/jobs/<id>/logs."
  - name: artifacts
    description: "Request ModelGithubGatewayRequest, result ModelArtifactsResult; replaces gh run download."
  - name: pr_text
    description: "Request ModelGithubGatewayRequest, result ModelPrTextResult; replaces gh pr view --comments."
  - name: releases
    description: "Request ModelGithubGatewayRequest, result ModelReleasesResult; replaces gh release list."

input_model:
  name: ModelGithubGatewayRequest
  module: omnimarket.nodes.node_github_repo_gateway_effect.models.model_gateway_io
  description: "Read request: operation + repo + optional pr_number."

output_model:
  name: ModelGithubGatewayResponse
  module: omnimarket.nodes.node_github_repo_gateway_effect.models.model_gateway_io
  description: "Correlation-tagged wrapper carrying the discriminated result."

handler:
  module: omnimarket.nodes.node_github_repo_gateway_effect.handlers.handler_github_repo_gateway
  class: HandlerGithubRepoGatewayEffect
  input_model: omnimarket.nodes.node_github_repo_gateway_effect.models.model_gateway_io.ModelGithubGatewayRequest

handler_routing:
  routing_strategy: operation_match
  handlers:
    - operation: github_repo_read
      handler:
        name: HandlerGithubRepoGatewayEffect
        module: omnimarket.nodes.node_github_repo_gateway_effect.handlers.handler_github_repo_gateway

descriptor:
  node_archetype: effect
  purity: impure
  idempotent: true
  timeout_ms: 30000
  runtime_profiles:
    - effects

secrets:
  # GitHub token is contract-declared so the token resolver reads the ref name
  # from here — not a bare source literal. Value is resolved at the effect
  # boundary via the canonical secret-store resolver.
  GITHUB_TOKEN:
    description: "GitHub PAT or Actions token for read-only PR/repo status."
    required: true

terminal_event: onex.evt.omnimarket.github-repo-gateway-read-completed.v1

event_bus:
  subscribe_topics:
    - onex.cmd.omnimarket.github-repo-gateway-read-requested.v1
  publish_topics:
    - onex.evt.omnimarket.github-repo-gateway-read-completed.v1

dependencies:
  packages:
    - "omnibase_core>=0.39.0"

metadata:
  transport_type: kafka
  description: "Typed GitHub repo status reader effect node (read-only)"
  author: "OmniNode Team"
  tags:
    - "effect"
    - "github"
    - "read-only"
    - "status"

runtime_dispatch:
  # OMN-18013 -- the CLI/skill dispatcher is this node's producer. Declared so it is not inferred from subscribe_topics[0].
  command_topic: onex.cmd.omnimarket.github-repo-gateway-read-requested.v1

# OMN-18013 -- explicit SINK declaration (contract topic graph closure).
# No node contract subscribes to these; they leave the ONEX node graph here.
externally_consumed_topics:
  - onex.evt.omnimarket.github-repo-gateway-read-completed.v1
