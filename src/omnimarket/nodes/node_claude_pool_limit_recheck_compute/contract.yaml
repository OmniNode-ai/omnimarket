name: node_claude_pool_limit_recheck_compute
lifecycle: experimental
node_type: compute
contract_version: {major: 1, minor: 0, patch: 0}
node_version: "1.0.0"
description: >-
  Decides, for one limited Claude token-pool label, whether its mark is due for a
  re-test and, once a probe answered, what to do with the mark: an ok answer clears it,
  a limited answer with a newer reset time replaces the stamp, a limited answer with
  no newer reset keeps it, an error answer proves nothing. Pure compute over the mark,
  the clock value passed in, the overlay interval and the probe answer; the handler
  reads no clock and carries no token or secret value.
input_model:
  name: ModelLimitRecheckRequest
  module: omnimarket.nodes.node_claude_pool_limit_recheck_compute.models.model_limit_recheck
output_model:
  name: ModelLimitRecheckResult
  module: omnimarket.nodes.node_claude_pool_limit_recheck_compute.models.model_limit_recheck
handler:
  module: omnimarket.nodes.node_claude_pool_limit_recheck_compute.handlers.handler_limit_recheck
  class: HandlerLimitRecheck
  input_model: omnimarket.nodes.node_claude_pool_limit_recheck_compute.models.model_limit_recheck.ModelLimitRecheckRequest
  output_model: omnimarket.nodes.node_claude_pool_limit_recheck_compute.models.model_limit_recheck.ModelLimitRecheckResult
handler_routing:
  routing_strategy: operation_match
  default_handler: omnimarket.nodes.node_claude_pool_limit_recheck_compute.handlers.handler_limit_recheck:HandlerLimitRecheck
  handlers:
    - operation: decide_limit_recheck
      handler:
        name: HandlerLimitRecheck
        module: omnimarket.nodes.node_claude_pool_limit_recheck_compute.handlers.handler_limit_recheck
descriptor:
  node_archetype: compute
  purity: pure
  idempotent: true
  timeout_ms: 500
  runtime_profiles:
    - main
# The node publishes nothing: the pool tick calls it in process.
event_bus:
  subscribe_topics: []
  publish_topics: []
metadata:
  transport_type: inmemory
  description: Claude token pool limit recheck compute
  author: OmniNode Team
  created: "2026-11-10"
  related_tickets: [OMN-23887]
