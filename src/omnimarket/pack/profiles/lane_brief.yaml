# Context profile for a lane brief built at dispatch (TA.9 replay evaluation finding).
# Inline: the dispatcher builds the pack itself and pastes it into the brief; no hook is
# involved. The same pack nodes serve it as every other profile; only this data differs.
# Values are first values: the 2026-10-19 replay evaluation built a 677-token lane-brief
# pack (559 lane_rules, 118 operator_rulings), with every required item present, and
# a profile changes only through a data PR that cites measured evidence.
model_id: claude-code-subagent
profile_version: 1.0.0
binding_kind: inline
required_factors:
  - lane_rules
optional_factors:
  - operator_rulings
  - plan_excerpts
# Authority order, section 4.2: standing rules, then the rulings the brief cites, then plans.
factor_precedence:
  - lane_rules
  - operator_rulings
  - plan_excerpts
stable_factors:
  - lane_rules
token_budget: 4000
# Window data (port item AP-B5): a lane brief is read by the same subagent consumer as the
# agent_spawn profile, so it declares the same window and reserved shares.
context_window_tokens: 200000
reserved_output_tokens: 32000
reserved_system_tokens: 76738
