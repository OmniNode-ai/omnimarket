# SWE-discriminator SMOKE corpus (OMN-13988) — 2 repo-grounded tasks replayed
# from held-back merged OmniNode PRs. One L1 (mechanical field-add) and one L2/3
# (AST-level algorithmic rewrite). Each task serves task_text + context_code
# (pre-fix source); held_back_asserts is the merged-PR-derived deterministic
# floor and is NEVER served to an arm. Grading assembles grader_preamble + the
# arm's produced code + held_back_asserts and execs it in isolation.
#
# task-scope note: for this SMOKE the "repo state" is reconstructed at the
# FUNCTION/MODULE-SLICE level (not a full-repo checkout) so the deterministic
# floor runs hermetically. The held-back asserts are derived from the real PR's
