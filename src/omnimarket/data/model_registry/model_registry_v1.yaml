    pricing_per_1m_output: "2.20"
    cost_basis: "cloud_api_cost"
    observed_at: "2026-10-16T00:00:00Z"
    source: "openrouter catalog"
    notes: >
      The model onboarding registers on a developer's own OpenRouter key when
      neither ONEX_OPENROUTER_DEFAULT_MODEL nor a node_model_setup_effect overlay
      names one, so a first run needs no private overlay. It is the customer's
      model on the customer's key, not a delegation rung: no bifrost backend
