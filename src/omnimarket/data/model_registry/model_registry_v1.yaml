    context_window: 1000000
    pricing_per_1m_input: "0.00"
    pricing_per_1m_output: "0.00"
    cost_basis: "zero_marginal_api_cost"
    observed_at: "2026-08-01T00:00:00Z"
    source: "openrouter catalog"
    notes: >
      OpenRouter free tier — NVIDIA Nemotron 3 Ultra (550B total / 55B active
      hybrid Mamba-Transformer MoE, 1M context, native tool-calling). Cheap
      frontier direct (OMN-12492). OMN-15638: repointed from
      qwen/qwen3-coder:free, which OpenRouter RETIRED to paid-only — that slug
      now returns a permanent HTTP 404 and is absent from the live catalog. Per
      operator ruling R9-amended the rung stays FREE rather than adopting the
      paid qwen/qwen3-coder ($0.30/$1.00 per M), so pricing 0.00/0.00 and
      zero_marginal_api_cost remain TRUE — verified in-band, the provider's own
      usage payload returned "cost": 0. Rate-limited (429), no SLA. Requires
      OPENROUTER_API_KEY. Falls back to the cheap_cloud direct z.ai GLM-5.2
      (cloud-glm) or local when key absent (OMN-13380). The id
      names the model the backend serves (nvidia nemotron-3-ultra); an earlier
      id that named a different model is mapped by formerly_model_ids below.
      model_id must stay byte-identical to the bifrost backend_id.

