    pricing_per_1m_input: "0.00"
    pricing_per_1m_output: "0.00"
    cost_basis: "zero_marginal_api_cost"
    observed_at: "2026-09-05T23:12:00Z"
    source: "live probe"
    notes: >
      Routing key retained for downstream contract stability; the actual served
      model is Qwen3.6-35B-A3B on the deployment's primary local endpoint via vLLM. Live-probed 2026-09-05
      (OMN-16999): GET /v1/models -> http=200, {"id": "Qwen3.6-35B-A3B",
      "owned_by": "vllm", "root": "/data/inference/hf-cache/Qwen3.6-35B-A3B-GPTQ-Int4",
      "max_model_len": 131072}. This SUPERSEDES the OMN-16419/OMN-16492 readback
      of 2026-08-23, which recorded {"id": "qwen3.8", "owned_by": "sglang",
      "max_model_len": 122880}: the endpoint has since been redeployed
      SGLang -> vLLM and serves the pre-OMN-16419 id again. Zero marginal API
      cost. context_window=131072 (live max_model_len).

  gemini-2.5-flash-lite:
    model_id: "gemini-2.5-flash-lite"
    provider: "google"
    endpoint_env: "GEMINI_API_URL"
    model_name: "gemini-2.5-flash-lite"
    served_model_names:
      # AI Studio (generativelanguage) serves the bare model id.
      ai_studio: "gemini-2.5-flash-lite"
      # Vertex AI requires the publisher-qualified resource path. Posting the
      # bare AI-Studio name to the Vertex environment 404s — the P2.7 failure
      # mode (OMN-12937: gemini-2.0-flash 404 on Vertex). Live Vertex resource:
      # publishers/google/models/gemini-2.5-flash-lite (Vertex model garden, 2026-06).
      vertex: "publishers/google/models/gemini-2.5-flash-lite"
    requires_api_key_env: "GEMINI_API_KEY"
    context_window: 1048576
    pricing_per_1m_input: "0.10"
    pricing_per_1m_output: "0.40"
    cost_basis: "cloud_api_cost"
    observed_at: "2026-06-11T00:00:00Z"
    source: "provider docs"
    notes: >
      Gemini 2.5 Flash Lite. 1M context window. GEMINI_API_KEY or GOOGLE_API_KEY required.
      Pricing: $0.10/1M input, $0.40/1M output (Google AI pricing 2026-06-11).
      endpoint_url empty in repo default; overlay fills https://generativelanguage.googleapis.com/v1beta/openai/.
      Routed via cloud-gemini-flash bifrost backend.
      OMN-12937: retargeted from gemini-2.0-flash, whose free tier was quota-exhausted
      (HTTP 429). The delegation inference effect sources the wire model id from this
      registry entry directly; gemini-2.5-flash-lite probes HTTP 200 on the deployed key.
      OMN-12972 (P2.7): served_model_names maps each serving environment to its exact
      Vertex/AI-Studio wire name. The key-path id stays stable; the call boundary picks
      the env-specific served name so neither environment receives a name it 404s on.
      model_name retains the AI-Studio (default) served name for single-name consumers.

  vertex-gemini-flash:
    model_id: "vertex-gemini-flash"
    provider: "vertex"
    endpoint_env: "BIFROST_VERTEX_GEMINI_ENDPOINT_URL"
    model_name: "gemini-2.5-flash-lite"
    requires_secret_ref: "llm.vertex.access_token"
    context_window: 1048576
    pricing_per_1m_input: "0.10"
    pricing_per_1m_output: "0.40"
    cost_basis: "cloud_api_cost"
    observed_at: "2026-06-11T00:00:00Z"
    source: "provider docs"
    notes: >
      Vertex-served Gemini 2.5 Flash Lite (OMN-12971). Burns the Vertex $500
      credit via Vertex AI. The outbound call carries Authorization: Bearer
      <token>, where the token is a short-lived OAuth access token minted from
      Application Default Credentials (ADC) and published to the secret store as
      llm.vertex.access_token. ADC delivery to the effects container is a mounted
      credential file (GOOGLE_APPLICATION_CREDENTIALS) exchanged for that token;
      the token VALUE is resolved fail-closed at the effect boundary and never
      committed. ADDITIVE next to gemini-2.5-flash-lite (AI Studio key path);
      both routes stay selectable (provider-agnostic). endpoint_url null in repo
      default; the overlay supplies the COMPLETE project+region Vertex
      OpenAI-compat URL via BIFROST_VERTEX_GEMINI_ENDPOINT_URL. ADC proven HTTP
      200 from the deployment host. Routed via cloud-vertex-gemini bifrost backend.

