# OMN-19998: declared provider refs the lab secret store holds, and the store path of each. Names and
# paths only, never a value. A host with its machine identity (INFISICAL_ADDR, INFISICAL_CLIENT_ID,
# INFISICAL_CLIENT_SECRET, INFISICAL_PROJECT_ID, INFISICAL_ENVIRONMENT_SLUG, in the process
# environment or in ~/.omnibase/.env) resolves these refs from the store first; its local entry is only
# a cache. A provider ref not listed here keeps resolving from the local store alone (OMN-18695).
sources:
  llm.openrouter.api_key: /lab-provider-keys/OPENROUTER_API_KEY
