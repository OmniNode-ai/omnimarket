#
# task_class_bars.v1.yaml: the routing overlay of per-task-class bars (rebuild piece 15, OMN-22976).
#
# Each task class in task_class_contracts.v1.yaml owns one entry here: the bar its delegated
# answers are held to, frozen under bar_hash. bar_hash is the full sha256 of the canonical JSON
# of {"task_class": <name>, "bar": <bar>} (sorted keys, no spaces, ASCII), so a hash cannot be
# copied from one class to another. Read by node_delegation_routing_overlay_check_compute, which
# refuses a class with no entry, a bar edited without a new hash, and a contract bar that has
# moved away from the frozen one. To change a bar: edit the contract, rewrite the bar here and
# recompute its hash from ModelTaskClassBar.frozen_hash(<class>) in the same change; the
# checker's hash_mismatch finding names the class if the hash was left behind.

