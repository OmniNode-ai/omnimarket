        # "imports in isolation". Declared in the gate node's contract.yaml
        # (name_resolution); reject-only, skipped without a grounding source.
        - names_resolve
        - final_artifact_only
        - uses_pytest_mark_unit
      heuristic:
        - no_refusal
        - covers_edge_cases
        - covers_error_paths
