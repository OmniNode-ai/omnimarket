#
# task_class_contracts.v1.yaml — Task-class routing contracts.
#
# Loaded by node_delegation_routing_reducer to augment tier routing with
# per-task-class pricing ceilings, cloud routing policies, and escalation order.
#
# cloud_routing_policy values:
#   opt_in   — cloud routing requires explicit caller opt-in
#   allowed  — cloud routing is permitted when local tiers are unavailable
#   blocked  — cloud routing is never permitted for this task class
#
# pricing_ceiling_per_1k_tokens: maximum acceptable cost per 1000 tokens (USD).
#   local tier ≈ $0.000, cheap_cloud ≈ $0.002, cli_agents use OAuth/subscription CLIs.
#
# escalation_policy.tier_order: the COMPLETE, CLOSED, ORDERED set of tiers
#   eligible for this task class. Only the tiers named here are tried, in this
#   order. Tiers NOT listed are excluded for this task class (they are not
#   appended after the declared order) — the listed ceiling tier is the final
#   tier tried. When tier_order is absent, the routing_tiers.yaml declaration
#   order is used instead; that file is the source of truth for fallback order.
#
# default_task_model_ref: model ID used when no per-task override is declared.
#   Maps to the model `id` field in routing_tiers.yaml (e.g. "qwen3-coder-30b").
#
# task_model_overrides: per-task-type model ID overrides. The routing reducer
#   prioritizes the declared model over tier-order selection when the model is
#   available in the tier with a configured bifrost endpoint (OMN-10942).
#
# Related Tickets:
#   - OMN-10615: Wire routing reducer to read task-class contracts
#   - OMN-10942: Task routing policy from contract with model defaults
version: "1.0"
default_task_model_ref: "Qwen3.6-35B-A3B"
task_model_overrides:
  # OMN-7980: OpenRouter GLM Flash is the primary code-gen backend (preferred in cheap_cloud tier).
  # Local .201 served models are the fallback when OPENROUTER_API_KEY is absent.
  code_generation: "openrouter-glm-flash"
  test: "openrouter-glm-flash"
  refactor: "openrouter-glm-flash"
  reasoning: "Qwen3.6-35B-A3B"
  complex_reasoning: "Qwen3.6-35B-A3B"
  planning: "Qwen3.6-35B-A3B"
  review: "Qwen3.6-35B-A3B"
  research: "Qwen3.6-35B-A3B"
task_classes:
  code_generation:
    required_capabilities:
      - code_completion
      - context_window_large
    pricing_ceiling_per_1k_tokens: 0.015
    latency_sla_p99_ms: 30000
    cloud_routing_policy: allowed
    definition_of_done:
      deterministic:
        - compiles_without_errors
        - final_artifact_only
        - passes_existing_tests
      heuristic:
        - no_refusal
        - follows_codebase_conventions
        - no_obvious_regressions
    escalation_policy:
      max_escalations: 2
      # OMN-13158: OpenRouter (cheap_cloud) is primary; local is fallback when
      # cloud keys are absent; headless Codex in cli_agents is the final
      # OAuth/subscription-backed escalation tier.
      tier_order:
        - cheap_cloud
        - local
        - cli_agents
  documentation:
    required_capabilities:
      - natural_language_generation
    pricing_ceiling_per_1k_tokens: 0.002
    latency_sla_p99_ms: 20000
    cloud_routing_policy: allowed
    definition_of_done:
      deterministic:
        - docstring_present
      heuristic:
        - no_refusal
        - follows_google_style
        - covers_args_returns_raises
        # OMN-12964: min_length ensures a single-line summary (e.g. docstring_summary_only)
        # fails a third heuristic so the per-class margin (min_good - max_bad) reaches >= 0.3.
        - min_length_chars_50
    escalation_policy:
      max_escalations: 1
      tier_order:
        - local
        - cheap_cloud
  # OMN-12964: `document` is a PROSE natural-language task (write/explain), not a
  # code-docstring task. Its DoD must not require docstring syntax — that defect
  # forced every prose output to fail `docstring_present` / `follows_google_style`
  # / `covers_args_returns_raises` (code-docstring markers `args:`/`returns:`/
  # `raises:`) and score 0.000 on both tiers (live CID a604cd40). The docstring
  # DoD lives on the `documentation` task class below, which is the correct home.
  document:
    required_capabilities:
      - natural_language_generation
    pricing_ceiling_per_1k_tokens: 0.002
    latency_sla_p99_ms: 20000
    cloud_routing_policy: allowed
    definition_of_done:
      deterministic:
        - response_non_empty
      heuristic:
        - no_refusal
        - accurate
        # OMN-12964: min_length_chars_200 ensures a short refusal or uncertain stub
        # fails a third heuristic so the per-class margin (min_good - max_bad) reaches >= 0.3.
        # A well-formed prose document (the only accepted good output) comfortably exceeds 200 chars.
        - min_length_chars_200
    escalation_policy:
      max_escalations: 1
      tier_order:
        - local
        - cheap_cloud
  research:
    required_capabilities:
      - context_window_large
      - reasoning
    pricing_ceiling_per_1k_tokens: 0.002
    latency_sla_p99_ms: 60000
    cloud_routing_policy: allowed
    definition_of_done:
      deterministic:
        - response_non_empty
      heuristic:
        - no_refusal
        - cites_specific_lines
        - explains_tradeoffs
    escalation_policy:
      max_escalations: 2
      tier_order:
        - local
        - cheap_cloud
        - cli_agents
  test:
    required_capabilities:
      - code_completion
    pricing_ceiling_per_1k_tokens: 0.015
    latency_sla_p99_ms: 30000
    cloud_routing_policy: allowed
    definition_of_done:
      deterministic:
        - compiles_without_errors
        - final_artifact_only
        - uses_pytest_mark_unit
      heuristic:
        - no_refusal
        - covers_edge_cases
        - covers_error_paths
    escalation_policy:
      max_escalations: 2
      tier_order:
        - local
        - cheap_cloud
        - cli_agents
  reasoning:
    required_capabilities:
      - reasoning
    pricing_ceiling_per_1k_tokens: 0.002
    latency_sla_p99_ms: 60000
    cloud_routing_policy: allowed
    definition_of_done:
      deterministic:
        - response_non_empty
      heuristic:
        - no_refusal
        - step_by_step_explanation
    escalation_policy:
      max_escalations: 1
      tier_order:
        - local
        - cheap_cloud
  complex_reasoning:
    required_capabilities:
      - reasoning
      - context_window_large
    pricing_ceiling_per_1k_tokens: 0.015
    latency_sla_p99_ms: 120000
    cloud_routing_policy: allowed
    definition_of_done:
      deterministic:
        - response_non_empty
      heuristic:
        - step_by_step_explanation
        - methodical_analysis
    escalation_policy:
      max_escalations: 2
      tier_order:
        - local
        - cli_agents
  planning:
    required_capabilities:
      - reasoning
      - natural_language_generation
    pricing_ceiling_per_1k_tokens: 0.002
    latency_sla_p99_ms: 60000
    cloud_routing_policy: allowed
    definition_of_done:
      deterministic:
        - response_non_empty
      heuristic:
        - structured_output
        - covers_dependencies
    escalation_policy:
      max_escalations: 1
      tier_order:
        - local
        - cheap_cloud
  review:
    required_capabilities:
      - reasoning
      - code_completion
    pricing_ceiling_per_1k_tokens: 0.002
    latency_sla_p99_ms: 60000
    cloud_routing_policy: allowed
    definition_of_done:
      deterministic:
        - response_non_empty
      heuristic:
        - cites_specific_lines
        - explains_tradeoffs
    escalation_policy:
      max_escalations: 1
      tier_order:
        - local
        - cheap_cloud
  summarization:
    required_capabilities:
      - natural_language_generation
    pricing_ceiling_per_1k_tokens: 0.002
    latency_sla_p99_ms: 10000
    cloud_routing_policy: allowed
    definition_of_done:
      deterministic:
        - response_non_empty
      heuristic:
        - no_refusal
        - concise
        - accurate
        # OMN-12964: min_length_chars_100 ensures a short uncertain stub fails a third
        # heuristic so the per-class margin (min_good - max_bad) reaches >= 0.3.
        # A useful summary must be at least one full sentence (~100 chars minimum).
        - min_length_chars_100
    escalation_policy:
      max_escalations: 1
      tier_order:
        - local
        - cheap_cloud
  agent_delegation:
    required_capabilities:
      - agent_orchestration
    pricing_ceiling_per_1k_tokens: 0.015
    latency_sla_p99_ms: 120000
    cloud_routing_policy: opt_in
    definition_of_done:
      deterministic:
        - task_completed
      heuristic:
        - no_refusal
        - sub_tasks_verified
    escalation_policy:
      max_escalations: 1
      tier_order:
        - cli_agents
  escalation:
    required_capabilities:
      - reasoning
      - context_window_large
    pricing_ceiling_per_1k_tokens: 0.015
    latency_sla_p99_ms: 120000
    cloud_routing_policy: allowed
    definition_of_done:
      deterministic:
        - response_non_empty
      heuristic:
        - no_refusal
        - methodical_analysis
    escalation_policy:
      max_escalations: 1
      tier_order:
        - cli_agents
