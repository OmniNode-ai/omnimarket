#
# task_class_contracts.v1.yaml — Task-class routing contracts.
#
# Loaded by node_delegation_routing_reducer to augment tier routing with
# per-task-class pricing ceilings, cloud routing policies, and escalation order.
#
# cloud_routing_policy values:
#   opt_in   — cloud routing requires explicit caller opt-in
#   allowed  — cloud routing is permitted when local tiers are unavailable
#   blocked  — cloud routing is never permitted for this task class
#
# pricing_ceiling_per_1k_tokens: maximum acceptable cost per 1000 tokens (USD).
#   local tier ≈ $0.000, cheap_cloud ≈ $0.002, claude ≈ $0.015
#
# escalation_policy.tier_order: the COMPLETE, CLOSED, ORDERED set of tiers
#   eligible for this task class. Only the tiers named here are tried, in this
#   order. Tiers NOT listed are excluded for this task class (they are not
#   appended after the declared order) — the listed ceiling tier is the final
#   tier tried. When tier_order is absent, the routing_tiers.yaml declaration
#   order is used instead; that file is the source of truth for fallback order.
#
# default_task_model_ref: model ID used when no per-task override is declared.
#   Maps to the model `id` field in routing_tiers.yaml (e.g. "qwen3-coder-30b").
#
# task_model_overrides: per-task-type model ID overrides. The routing reducer
#   prioritizes the declared model over tier-order selection when the model is
#   available in the tier with a configured bifrost endpoint (OMN-10942).
#
# gateway_exposure: closed public/internal admission policy. The Gateway may
#   project only entries declared public; internal entries remain valid Market
#   task classes but are not admitted at the public Gateway boundary.
#
# response_contract_ref: OPTIONAL dotted "module.path.AttrName" naming a pydantic
#   model (or a discriminated Union type alias) whose JSON Schema
#   (resolve_task_class_response_contract, node_delegation_routing_reducer)
#   becomes the DEFAULT response_contract for a local dispatch of this task
#   class when the caller supplies none of its own (OMN-15196). This is a
#   structural REPLACEMENT for that class's dod_heuristic keyword checks (the
#   quality gate validates the response against the schema instead of
#   substring-matching) — a migrated class's dod_heuristic keyword entries for
#   the retired checks are deleted, not merely superseded, per the
#   net-negative-surface rule. A caller-declared response_contract (e.g. a
#   per-request schema) always takes precedence over this default. Absent —
#   the pre-OMN-15196 DoD-heuristic-only behavior — for every class not listed
#   here.
#
# Related Tickets:
#   - OMN-10615: Wire routing reducer to read task-class contracts
#   - OMN-10942: Task routing policy from contract with model defaults
#   - OMN-15161: Per-role dispatch report contracts ported into omnibase_core
#   - OMN-15193: Contract-declared response validation replaces keyword heuristics
#   - OMN-15196: Migrate task classes to declared response contracts; retire
#     the keyword heuristics those classes made obsolete
version: "1.0"
# OMN-16419: default_task_model_ref and every "Qwen3.6-35B-A3B" task_model_overrides
# entry below were repointed to "qwen3.8" — the live-verified SGLang served id at
# .201:8000 (the stale label was never running post-reboot; see bifrost_delegation.yaml
# local-coder/local-heavy-reasoning and routing_tiers.yaml for the matching backend
# model ids this id-match escape hatch resolves against).
default_task_model_ref: "qwen3.8"
task_model_overrides:
  # OMN-13380/OMN-13599: Direct z.ai GLM-5.2 was the cloud fallback for code/test/
  # refactor (preferred inside the cheap_cloud tier, backend cloud-glm,
  # secret_ref llm.glm.api_key). The
  # former openrouter-glm-flash override was repointed here: we hold a direct GLM
  # key, so GLM routed direct to z.ai rather than through the OpenRouter
  # aggregator (routing-cost principle — OpenRouter is for FREE models only).
  #
  # OMN-14625: repointed off GLM ("glm-5-turbo") to Gemini ("gemini-2.5-flash")
  # — the z.ai GLM route is DEAD from the .201 runtime (resolve_api_key
  # succeeds but every completion call 401s / loops FAILED-only). The model id
  # "gemini-2.5-flash" matches the cheap_cloud tier model id in
  # routing_tiers.yaml (backend cloud-gemini-pro, secret_ref
  # llm.gemini.api_key). A dangling override here would strand routing (see
  # test_code_generation_contract_model_ref_is_resolvable).
  code_generation: "gemini-2.5-flash"
  test: "gemini-2.5-flash"
  refactor: "gemini-2.5-flash"
  reasoning: "qwen3.8"
  complex_reasoning: "qwen3.8"
  planning: "qwen3.8"
  review: "qwen3.8"
  # OMN-15961: the OMN-15503 agent_delegation override REMOVED. It pinned
  # agent_delegation to local-reasoner via this EXPLICIT override map, which
  # (per _select_model_for_task's id-match escape hatch) bypasses use_for
  # capability checks entirely — so even after routing_tiers.yaml's
  # agent_delegation use_for entries were stripped (same ticket), this pin
  # alone would have silently kept resolving agent_delegation to
  # local-reasoner's plain HTTP completion, restoring the exact false
  # capability claim (real agent_orchestration, not just text completion)
  # the routing_tiers.yaml fix was meant to remove. agent_delegation now
  # correctly has no model ref anywhere and fails closed
  # (no_routable_backend_for_task) until the real coding-agent producer is
  # wired (WS-4/C6).
  # OMN-13541: code_review is its own task class (distinct from the generic
  # `review`); the local Qwen coder serves it, with cheap_cloud fallback.
  code_review: "qwen3.8"
  research: "qwen3.8"
task_classes:
  code_generation:
    gateway_exposure: public
    score_source: deterministic_acceptance
    acceptance_authority:
      type: deterministic_acceptance
      acceptance_version: delegation-deterministic-acceptance.v1
      evidence_fields:
        - acceptance_version
        - corpus_hash
        - validator_or_artifact_hash
        - acceptance_command
        - actual_score
        - pass
        - failure_cases
    required_capabilities:
      - code_completion
      - context_window_large
    pricing_ceiling_per_1k_tokens: 0.015
    latency_sla_p99_ms: 30000
    cloud_routing_policy: allowed
    definition_of_done:
      deterministic:
        - compiles_without_errors
        - final_artifact_only
        - passes_existing_tests
      heuristic:
        - no_refusal
        - follows_codebase_conventions
        - no_obvious_regressions
    quality_gate:
      score_source: quality_gate_graded_score
      required_bar: 0.85
      request_override_bounds:
        min: 0.6
        max: 1.0
    escalation_policy:
      # OMN-13943: bumped 2 -> 3 so the ladder can actually reach `claude` now
      # that `cheap_frontier` sits between `cheap_cloud` and it — 3 escalations
      # are required to walk local -> cheap_cloud -> cheap_frontier -> claude.
      max_escalations: 3
      # OMN-13599: local AI-PC coder is primary when the Tailscale hostname overlay
      # supplies a complete endpoint. Direct z.ai GLM-5.2 remains the metered
      # cloud fallback/ceiling; Gemini is not in the code-generation first-hop path.
      # OMN-13943: `cheap_frontier` (OpenRouter Qwen3-Coder-480B, free tier) is
      # now reachable via escalation — previously declared in routing_tiers.yaml
      # but absent from every task class's tier_order, so a `cheap_cloud`
      # RATE_LIMITED (GLM 429) had nowhere retryable to escalate to before
      # `claude`. Inserted between `cheap_cloud` and `claude` so a GLM 429
      # transparently falls through to OpenRouter before exhausting the ladder.
      tier_order:
        # OMN-14225: free before paid. cheap_frontier (OpenRouter Qwen3-Coder-480B,
        # free_local) precedes cheap_cloud (z.ai glm-5.2, metered/PAID) so a task that
        # must escalate off local tries the FREE frontier tier before any paid tier.
        - local
        - cheap_frontier
        - cheap_cloud
        - claude
  # OMN-14218: `refactor` is accepted at the delegation surface (allowed_task_types,
  # the CLI --task-type enum, task_model_overrides, and routing_tiers.yaml `use_for`)
  # but had NO task-class contract here. Consequence: with no acceptance_authority
  # and no adequacy_authority the quality gate returned _NO_ADEQUACY_AUTHORITY_REASON
  # ("TASK_MISMATCH: no deterministic acceptance or judge adequacy authority") on
  # every tier, so a valid LOCAL code artifact could never PASS and the workflow
  # force-escalated local -> cheap_cloud (PAID glm-5.2, real spend) -> cheap_frontier
  # (OpenRouter 429) -> failed. This mirrors the OMN-13541 fix that gave `code_review`
  # a contract for the same "accepted at surface, no contract" gap. `refactor` is a
  # code-writing task, so its contract mirrors `code_generation`: a deterministic
  # acceptance authority + code DoD with the same closed tier_order, which lets local
  # output PASS at $0 exactly like code_generation. (A minimal-diff / precision DoD
  # for surgical edits to large files is tracked separately under OMN-14214.)
  refactor:
    gateway_exposure: public
    score_source: deterministic_acceptance
    acceptance_authority:
      type: deterministic_acceptance
      acceptance_version: delegation-deterministic-acceptance.v1
      evidence_fields:
        - acceptance_version
        - corpus_hash
        - validator_or_artifact_hash
        - acceptance_command
        - actual_score
        - pass
        - failure_cases
    required_capabilities:
      - code_completion
      - context_window_large
    pricing_ceiling_per_1k_tokens: 0.015
    latency_sla_p99_ms: 30000
    cloud_routing_policy: allowed
    definition_of_done:
      deterministic:
        - compiles_without_errors
        - final_artifact_only
      heuristic:
        - no_refusal
        - follows_codebase_conventions
        - no_obvious_regressions
    quality_gate:
      score_source: quality_gate_graded_score
      required_bar: 0.85
      request_override_bounds:
        min: 0.6
        max: 1.0
    escalation_policy:
      # Same closed ladder as code_generation (OMN-13943): local -> cheap_cloud ->
      # cheap_frontier -> claude. With a working local acceptance authority the
      # common path terminates at local ($0) and never escalates.
      max_escalations: 3
      tier_order:
        # OMN-14225: free before paid. cheap_frontier (OpenRouter Qwen3-Coder-480B,
        # free_local) precedes cheap_cloud (z.ai glm-5.2, metered/PAID) so a task that
        # must escalate off local tries the FREE frontier tier before any paid tier.
        - local
        - cheap_frontier
        - cheap_cloud
        - claude
  documentation:
    gateway_exposure: internal
    required_capabilities:
      - natural_language_generation
    pricing_ceiling_per_1k_tokens: 0.002
    latency_sla_p99_ms: 20000
    cloud_routing_policy: allowed
    definition_of_done:
      deterministic:
        - docstring_present
      heuristic:
        - no_refusal
        - follows_google_style
        - covers_args_returns_raises
        # OMN-13218: semantic_adequacy replaces the blunt min_length_chars_50 floor.
        # A complete docstring passes; an empty/truncated stub fails. A correct
        # short docstring is no longer rejected on character count, while the
        # bad docstring cases still fail on real defects (google-style /
        # covers_args_returns_raises) so the per-class margin holds.
        - semantic_adequacy
    quality_gate:
      score_source: quality_gate_graded_score
      required_bar: 0.8
      request_override_bounds:
        min: 0.6
        max: 1.0
    escalation_policy:
      max_escalations: 1
      tier_order:
        - local
        - cheap_cloud
  # OMN-12964: `document` is a PROSE natural-language task (write/explain), not a
  # code-docstring task. Its DoD must not require docstring syntax — that defect
  # forced every prose output to fail `docstring_present` / `follows_google_style`
  # / `covers_args_returns_raises` (code-docstring markers `args:`/`returns:`/
  # `raises:`) and score 0.000 on both tiers (live CID a604cd40). The docstring
  # DoD lives on the `documentation` task class below, which is the correct home.
  document:
    gateway_exposure: public
    required_capabilities:
      - natural_language_generation
    pricing_ceiling_per_1k_tokens: 0.002
    latency_sla_p99_ms: 20000
    cloud_routing_policy: allowed
    definition_of_done:
      deterministic:
        - response_non_empty
      heuristic:
        - no_refusal
        - accurate
        # OMN-13218: semantic_adequacy replaces the blunt min_length_chars_200 floor.
        # A complete prose answer passes at any length; an empty/truncated stub
        # fails. A correct short document is no longer rejected on character
        # count. The bad prose cases still fail on real defects (refusal /
        # accuracy disclaimer) so the per-class margin holds.
        - semantic_adequacy
    quality_gate:
      score_source: quality_gate_graded_score
      required_bar: 0.8
      request_override_bounds:
        min: 0.6
        max: 1.0
    adequacy_authority:
      score_source: reproducible_judge
      rubric_id: delegation_non_verifiable_v1
      rubric_hash: "sha256:321240472e3b52d21fd8cb9b9b7639bb73161a2945adf580948e86275ce20681"
      event_topic_ref: delegation_judge_verdict_v1
      terminology: controlled_reproducible_auditable
    escalation_policy:
      max_escalations: 1
      tier_order:
        - local
        - cheap_cloud
  research:
    gateway_exposure: public
    required_capabilities:
      - context_window_large
      - reasoning
    # OMN-13215: research declares ``claude`` as its escalation ceiling tier, which
    # is the HTTP frontier ceiling backend. OMN-13351 repointed that backend off the
    # dead Anthropic cloud-sonnet to the resolvable Gemini cloud-gemini-pro
    # (gemini-2.5-flash, served on the AI Studio free-tier key → ceiling tier cost
    # 0.0). This 0.015 cap stays as a generous ceiling-cap headroom (the 0.0 ceiling
    # tier is well under it); the prior $0.002 ceiling contradicted the tier_order —
    # it only "worked" while the ceiling was the free codex-cli OAuth tier.
    pricing_ceiling_per_1k_tokens: 0.015
    latency_sla_p99_ms: 60000
    cloud_routing_policy: allowed
    definition_of_done:
      deterministic:
        - response_non_empty
      heuristic:
        - no_refusal
        # OMN-13354: research is a PROSE research task (cites theorems / papers /
        # sections), NOT a code review. The prior `cites_specific_lines` +
        # `explains_tradeoffs` pair was a catch-22: `cites_specific_lines` is a
        # CODE-line-citation regex (`line N` / `Lnn` / `:nn`) that a legitimate
        # research answer cannot satisfy, so every research output failed the gate
        # at every tier with `TASK_MISMATCH: missing specific line citations`
        # (live 2026-06-19 reprove, score 0.733). `cites_sources` is the
        # research-appropriate citation check (references / theorem N / [12] /
        # (Author, 2020) / URL / DOI); `methodical_analysis` replaces the narrow
        # `explains_tradeoffs` keyword form with a reasoning-structure check
        # (because / therefore / evidence / risk). A substantive, attributed
        # research answer passes; a thin/empty answer still fails. The
        # `cites_specific_lines` / `explains_tradeoffs` code-review checks stay on
        # the `review` task class below.
        - cites_sources
        - methodical_analysis
        - semantic_adequacy
    quality_gate:
      score_source: quality_gate_graded_score
      required_bar: 0.8
      request_override_bounds:
        min: 0.6
        max: 1.0
    adequacy_authority:
      score_source: reproducible_judge
      rubric_id: delegation_non_verifiable_v1
      rubric_hash: "sha256:321240472e3b52d21fd8cb9b9b7639bb73161a2945adf580948e86275ce20681"
      event_topic_ref: delegation_judge_verdict_v1
      terminology: controlled_reproducible_auditable
    escalation_policy:
      max_escalations: 2
      tier_order:
        - local
        - cheap_cloud
        - claude
  test:
    gateway_exposure: public
    score_source: deterministic_acceptance
    acceptance_authority:
      type: deterministic_acceptance
      acceptance_version: delegation-deterministic-acceptance.v1
      evidence_fields:
        - acceptance_version
        - corpus_hash
        - validator_or_artifact_hash
        - acceptance_command
        - actual_score
        - pass
        - failure_cases
    required_capabilities:
      - code_completion
    pricing_ceiling_per_1k_tokens: 0.015
    latency_sla_p99_ms: 30000
    cloud_routing_policy: allowed
    definition_of_done:
      deterministic:
        - compiles_without_errors
        - final_artifact_only
        - uses_pytest_mark_unit
      heuristic:
        - no_refusal
        - covers_edge_cases
        - covers_error_paths
    quality_gate:
      score_source: quality_gate_graded_score
      required_bar: 0.8
      request_override_bounds:
        min: 0.6
        max: 1.0
    escalation_policy:
      max_escalations: 3
      # OMN-16891: `cheap_frontier` INSERTED ahead of every metered tier, per
      # the operator directive "openrouter can also do work for ... code".
      # tier_order is a CLOSED set — `_tier_order_from_contract` excludes any
      # tier absent from it — so this class could not reach the free coder rung
      # at all before, no matter what routing_tiers.yaml `use_for` declared.
      # Placement mirrors code_generation/refactor, which have carried this
      # exact ladder since OMN-13943/OMN-14225 (free before paid: a task that
      # must escalate off local tries the ZERO-COST frontier rung before any
      # tier that spends money). max_escalations is raised by one so the ladder
      # can still be walked to its ceiling now that it is one rung longer —
      # the same adjustment OMN-13943 made for code_generation.
      tier_order:
        - local
        - cheap_frontier
        - cheap_cloud
        - claude
  validator_generation:
    gateway_exposure: internal
    score_source: deterministic_acceptance
    acceptance_authority:
      type: deterministic_acceptance
      acceptance_version: node_generation_consumer.corpus_acceptance.v1
      evidence_fields:
        - acceptance_version
        - corpus_hash
        - validator_or_artifact_hash
        - acceptance_command
        - actual_score
        - pass
        - failure_cases
    required_capabilities:
      - code_completion
    pricing_ceiling_per_1k_tokens: 0.015
    latency_sla_p99_ms: 30000
    cloud_routing_policy: allowed
    definition_of_done:
      deterministic:
        - compiles_without_errors
        - final_artifact_only
        - passes_existing_tests
      heuristic:
        - no_refusal
    escalation_policy:
      max_escalations: 3
      # OMN-16891: `cheap_frontier` INSERTED ahead of every metered tier, per
      # the operator directive "openrouter can also do work for ... code".
      # tier_order is a CLOSED set — `_tier_order_from_contract` excludes any
      # tier absent from it — so this class could not reach the free coder rung
      # at all before, no matter what routing_tiers.yaml `use_for` declared.
      # Placement mirrors code_generation/refactor, which have carried this
      # exact ladder since OMN-13943/OMN-14225 (free before paid: a task that
      # must escalate off local tries the ZERO-COST frontier rung before any
      # tier that spends money). max_escalations is raised by one so the ladder
      # can still be walked to its ceiling now that it is one rung longer —
      # the same adjustment OMN-13943 made for code_generation.
      tier_order:
        - local
        - cheap_frontier
        - cheap_cloud
        - claude
  reasoning:
    gateway_exposure: public
    required_capabilities:
      - reasoning
    pricing_ceiling_per_1k_tokens: 0.002
    latency_sla_p99_ms: 60000
    cloud_routing_policy: allowed
    definition_of_done:
      deterministic:
        - response_non_empty
      heuristic:
        # OMN-13963: `semantic_adequacy` is the LOCAL acceptance authority. Without
        # a non-reject-only check the quality gate had NO adequacy authority for
        # `reasoning` (response_non_empty / no_refusal / step_by_step_explanation
        # are all reject-only), so a valid LOCAL Qwen answer could never PASS —
        # the gate returned TASK_MISMATCH:no-adequacy-authority, force-escalated
        # local→cheap_cloud, and hit the throttled GLM (429), killing the whole
        # class during a cloud outage. `semantic_adequacy` (a real completeness
        # check) is the SAME local authority the sibling reproducible_judge classes
        # `document`/`research`/`summarization` already carry and complete on local
        # with; it accepts a complete answer while a refusal/empty still fails.
        - no_refusal
        - step_by_step_explanation
        - semantic_adequacy
    quality_gate:
      score_source: quality_gate_graded_score
      required_bar: 0.8
      request_override_bounds:
        min: 0.6
        max: 1.0
    adequacy_authority:
      score_source: reproducible_judge
      rubric_id: delegation_non_verifiable_v1
      rubric_hash: "sha256:321240472e3b52d21fd8cb9b9b7639bb73161a2945adf580948e86275ce20681"
      event_topic_ref: delegation_judge_verdict_v1
      terminology: controlled_reproducible_auditable
    escalation_policy:
      max_escalations: 1
      tier_order:
        - local
        - cheap_cloud
  complex_reasoning:
    gateway_exposure: public
    required_capabilities:
      - reasoning
      - context_window_large
    pricing_ceiling_per_1k_tokens: 0.015
    latency_sla_p99_ms: 120000
    cloud_routing_policy: allowed
    definition_of_done:
      deterministic:
        - response_non_empty
      heuristic:
        # OMN-13963: LOCAL acceptance authority (see `reasoning` above). Without a
        # non-reject-only check `complex_reasoning` had no adequacy authority and
        # force-escalated valid local output to the throttled cloud judge.
        - step_by_step_explanation
        - methodical_analysis
        - semantic_adequacy
    quality_gate:
      score_source: quality_gate_graded_score
      required_bar: 0.8
      request_override_bounds:
        min: 0.6
        max: 1.0
    adequacy_authority:
      score_source: reproducible_judge
      rubric_id: delegation_non_verifiable_v1
      rubric_hash: "sha256:321240472e3b52d21fd8cb9b9b7639bb73161a2945adf580948e86275ce20681"
      event_topic_ref: delegation_judge_verdict_v1
      terminology: controlled_reproducible_auditable
    escalation_policy:
      max_escalations: 2
      tier_order:
        - local
        - claude
  planning:
    gateway_exposure: public
    required_capabilities:
      - reasoning
      - natural_language_generation
    pricing_ceiling_per_1k_tokens: 0.002
    latency_sla_p99_ms: 60000
    cloud_routing_policy: allowed
    definition_of_done:
      deterministic:
        - response_non_empty
      heuristic:
        - structured_output
        - covers_dependencies
        # OMN-14220: local acceptance authority. structured_output/covers_dependencies
        # are reject-only markers; without a non-reject-only check a valid LOCAL plan
        # could never PASS and force-escalated to paid cloud. semantic_adequacy is the
        # same local authority the reproducible_judge siblings use.
        - semantic_adequacy
    quality_gate:
      score_source: quality_gate_graded_score
      required_bar: 0.8
      request_override_bounds:
        min: 0.6
        max: 1.0
    adequacy_authority:
      score_source: reproducible_judge
      rubric_id: delegation_non_verifiable_v1
      rubric_hash: "sha256:321240472e3b52d21fd8cb9b9b7639bb73161a2945adf580948e86275ce20681"
      event_topic_ref: delegation_judge_verdict_v1
      terminology: controlled_reproducible_auditable
    escalation_policy:
      max_escalations: 1
      tier_order:
        - local
        - cheap_cloud
  review:
    gateway_exposure: public
    required_capabilities:
      - reasoning
      - code_completion
    pricing_ceiling_per_1k_tokens: 0.002
    latency_sla_p99_ms: 60000
    cloud_routing_policy: allowed
    definition_of_done:
      deterministic:
        - response_non_empty
      heuristic:
        - cites_specific_lines
        # OMN-14220: `explains_tradeoffs` removed — it was a reject-only catch-22
        # (identical to the OMN-13354 research fix): a valid bug-focused review cites
        # lines but need not discuss tradeoffs, so requiring tradeoff language
        # false-rejected correct reviews (live: a line-cited review scored 0.867 but
        # failed `explains_tradeoffs`). `cites_specific_lines` stays as the genuine
        # "is this a code review" reject-only filter; `semantic_adequacy` is the local
        # acceptance authority so a complete review PASSES locally.
        - semantic_adequacy
    quality_gate:
      score_source: quality_gate_graded_score
      required_bar: 0.8
      request_override_bounds:
        min: 0.6
        max: 1.0
    escalation_policy:
      max_escalations: 1
      tier_order:
        - local
        - cheap_cloud
  # OMN-13541: code_review is a first-class task class. It was accepted at the
  # consumer-facing delegation surface (allowed_task_types + the claude/codex
  # adapter) but had no task-class contract here and only the local-coder tier in
  # routing_tiers.yaml `use_for`, so a missing local backend stranded it and the
  # quality gate's required-bar authority had nothing to resolve. Mirrors `review`
  # but with code-review-specific DoD heuristics and a cloud fallback ladder.
  code_review:
    gateway_exposure: public
    required_capabilities:
      - reasoning
      - code_completion
    pricing_ceiling_per_1k_tokens: 0.002
    latency_sla_p99_ms: 60000
    cloud_routing_policy: allowed
    definition_of_done:
      deterministic:
        - response_non_empty
      heuristic:
        - cites_specific_lines
        # OMN-14220: `no_obvious_regressions` removed — same reject-only catch-22 as
        # `review` above: a valid code review that finds bugs need not use
        # regression/backward-compat language, so requiring it false-rejected correct
        # reviews. `cites_specific_lines` stays as the reject-only filter;
        # `semantic_adequacy` is the local acceptance authority.
        - semantic_adequacy
    quality_gate:
      score_source: quality_gate_graded_score
      required_bar: 0.8
      request_override_bounds:
        min: 0.6
        max: 1.0
    escalation_policy:
      max_escalations: 2
      # OMN-16891: `cheap_frontier` INSERTED ahead of every metered tier, per
      # the operator directive "openrouter can also do work for ... code".
      # tier_order is a CLOSED set — `_tier_order_from_contract` excludes any
      # tier absent from it — so this class could not reach the free coder rung
      # at all before, no matter what routing_tiers.yaml `use_for` declared.
      # Placement mirrors code_generation/refactor, which have carried this
      # exact ladder since OMN-13943/OMN-14225 (free before paid: a task that
      # must escalate off local tries the ZERO-COST frontier rung before any
      # tier that spends money). max_escalations is raised by one so the ladder
      # can still be walked to its ceiling now that it is one rung longer —
      # the same adjustment OMN-13943 made for code_generation.
      tier_order:
        - local
        - cheap_frontier
        - cheap_cloud
  summarization:
    gateway_exposure: public
    required_capabilities:
      - natural_language_generation
    pricing_ceiling_per_1k_tokens: 0.002
    latency_sla_p99_ms: 10000
    cloud_routing_policy: allowed
    definition_of_done:
      deterministic:
        - response_non_empty
      heuristic:
        - no_refusal
        - concise
        - accurate
        # OMN-13218: semantic_adequacy replaces the blunt min_length_chars_100 floor.
        # A correct short summary (one complete sentence) passes at tier 1 instead
        # of escalating on a length floor; an empty/truncated stub still fails.
        # The bad summary cases fail on real defects (refusal / accuracy disclaimer /
        # truncation) so the per-class margin (min_good - max_bad >= 0.3) holds.
        - semantic_adequacy
    quality_gate:
      score_source: quality_gate_graded_score
      required_bar: 0.8
      request_override_bounds:
        min: 0.6
        max: 1.0
    adequacy_authority:
      score_source: reproducible_judge
      rubric_id: delegation_non_verifiable_v1
      rubric_hash: "sha256:321240472e3b52d21fd8cb9b9b7639bb73161a2945adf580948e86275ce20681"
      event_topic_ref: delegation_judge_verdict_v1
      terminology: controlled_reproducible_auditable
    escalation_policy:
      max_escalations: 1
      tier_order:
        - local
        - cheap_cloud
  agent_delegation:
    gateway_exposure: internal
    required_capabilities:
      - agent_orchestration
    # OMN-16811: the OMN-15961 fail-closed decision, promoted from a test-local
    # exception dict to a contract-declared, machine-readable fact. No tier in
    # routing_tiers.yaml is anything but a plain HTTP chat-completion backend,
    # so none can satisfy ``agent_orchestration``; wiring this class onto one
    # would be the false capability claim OMN-15961 removed and
    # ``test_no_use_for_entry_claims_a_capability_its_tier_cannot_serve``
    # mechanically forbids. Until the real coding-agent producer lands the
    # class resolves NO backend on any of its declared tiers and a live
    # delegation raises ONEX_CORE_041_INVALID_CONFIGURATION. Declaring it here
    # is what lets a consumer (dashboard menu, gateway admission) refuse the
    # class up front instead of offering it and hanging for the full ingress
    # budget, and what lets the OMN-16811 drift gate fail in BOTH directions —
    # an undeclared class that stops routing, and a stale declaration on a
    # class that has become routable. Delete this block in the same change
    # that wires the producer.
    routing_availability:
      status: pending_capability
      missing_capability: agent_orchestration
      tracking: "OMN-15961 WS-4/C6"
      reason: >-
        No routing tier can execute agentic/tool-using work; every tier is an
        HTTP chat-completion backend. A text completion returned for this class
        would be a dispatch report nobody executed.
    pricing_ceiling_per_1k_tokens: 0.015
    latency_sla_p99_ms: 120000
    cloud_routing_policy: opt_in
    # OMN-15196: declared response contract replaces the retired
    # sub_tasks_verified/no_refusal keyword heuristics below (OMN-15193 gave the
    # quality gate the ability to validate structurally against a declared JSON
    # Schema instead of substring-matching). DispatchReport is the per-role
    # (implementer/verifier/lander/scout) closed report contract ported from
    # steel_onslaught PR #213 into omnibase_core (OMN-15161). The routing
    # authority (resolve_task_class_response_contract) resolves this ref to a
    # JSON Schema and threads it as the default response_contract for any local
    # dispatch that does not supply its own (e.g. steel's per-request tactical
    # decision schema still takes precedence when a caller declares one).
    response_contract_ref: "omnibase_core.models.dispatch.report.DispatchReport"
    definition_of_done:
      deterministic:
        - task_completed
      heuristic:
        # OMN-15196: sub_tasks_verified (substring match on "verified"/"passed"/
        # "evidence"/"check") and no_refusal (phrase match) are RETIRED for this
        # class -- response_contract_ref above is now the sole acceptance
        # authority for any request that reaches the quality gate without its
        # own caller-declared response_contract. This DoD block is retained ONLY
        # as the fallback for a request that somehow reaches the gate with
        # response_contract_ref unresolved (defensive; not expected in normal
        # operation) and for the bus-intent path, which does not yet thread a
        # response_contract at all (wire-model gap, OMN-15193 note) -- semantic_adequacy
        # stays as that path's local acceptance authority.
        - semantic_adequacy
    quality_gate:
      score_source: quality_gate_graded_score
      required_bar: 0.8
      request_override_bounds:
        min: 0.6
        max: 1.0
    # OMN-13215: the former shelled ``cli_agents`` tier was removed. Agent
    # delegation now escalates local → cheap_cloud → the canonical HTTP ceiling
    # (claude), all of which execute over the bus/inference-effect HTTP path.
    escalation_policy:
      max_escalations: 2
      tier_order:
        - local
        - cheap_cloud
        - claude
  escalation:
    gateway_exposure: internal
    required_capabilities:
      - reasoning
      - context_window_large
    pricing_ceiling_per_1k_tokens: 0.015
    latency_sla_p99_ms: 120000
    cloud_routing_policy: allowed
    definition_of_done:
      deterministic:
        - response_non_empty
      heuristic:
        - no_refusal
        - methodical_analysis
    quality_gate:
      score_source: quality_gate_graded_score
      required_bar: 0.8
      request_override_bounds:
        min: 0.6
        max: 1.0
    adequacy_authority:
      score_source: reproducible_judge
      rubric_id: delegation_non_verifiable_v1
      rubric_hash: "sha256:321240472e3b52d21fd8cb9b9b7639bb73161a2945adf580948e86275ce20681"
      event_topic_ref: delegation_judge_verdict_v1
      terminology: controlled_reproducible_auditable
    # OMN-16811: ``local`` prepended. This class's tier_order was ``[claude]``
    # alone — the ONLY admitted task class whose entire ladder was a single
    # credentialed cloud backend (``cloud-gemini-pro``). A read-only probe run
    # inside the dev-lane runtime container resolved escalation to exactly
    # ``[('claude', 'cloud-gemini-pro')]`` while all eleven terminating classes
    # kept a free local rung, which is why a quota-exhausted / unreachable
    # Gemini stranded this class specifically. Cheapest-first doctrine: the
    # zero-cost owned-GPU tier is tried first and the metered ceiling stays the
    # ceiling. max_escalations is unchanged at 1 — local -> claude is exactly
    # one escalation.
    escalation_policy:
      max_escalations: 1
      tier_order:
        - local
        - claude
