#
# task_class_contracts.v1.yaml — Task-class routing contracts.
#
# Loaded by node_delegation_routing_reducer to augment tier routing with
# per-task-class pricing ceilings, cloud routing policies, and escalation order.
#
# cloud_routing_policy values:
#   opt_in   — cloud routing requires explicit caller opt-in
#   allowed  — cloud routing is permitted when local tiers are unavailable
#   blocked  — cloud routing is never permitted for this task class
#
# pricing_ceiling_per_1k_tokens: maximum acceptable cost per 1000 tokens (USD).
#   local tier ≈ $0.000, cheap_cloud ≈ $0.002, claude ≈ $0.015
#
# escalation_policy.tier_order: the COMPLETE, CLOSED, ORDERED set of tiers
#   eligible for this task class. Only the tiers named here are tried, in this
#   order. Tiers NOT listed are excluded for this task class (they are not
#   appended after the declared order) — the listed ceiling tier is the final
#   tier tried. When tier_order is absent, the routing_tiers.yaml declaration
#   order is used instead; that file is the source of truth for fallback order.
#
# default_task_model_ref: model ID used when no per-task override is declared.
#   Maps to the model `id` field in routing_tiers.yaml (e.g. "qwen3-coder-30b").
#
# task_model_overrides: per-task-type model ID overrides. The routing reducer
#   prioritizes the declared model over tier-order selection when the model is
#   available in the tier with a configured bifrost endpoint (OMN-10942).
#
# gateway_exposure: closed public/internal admission policy. The Gateway may
#   project only entries declared public; internal entries remain valid Market
#   task classes but are not admitted at the public Gateway boundary.
#
# selection: how a PROMPT selects this task class (OMN-18305). Required on
#   every class. `phrases` are matched on WORD BOUNDARIES and by PRESENCE ONLY
#   — never counted, so the bulk of a document cannot outvote its purpose, and
#   "latest" can no longer match "test". `min_words`/`max_words` gate which
#   prompt SHAPES the class is eligible for at all and are evaluated before any
#   phrase, which is what keeps a 7,000-word coordination ledger structurally
#   ineligible for `test`. `priority` ranks eligible classes (higher wins; ties
#   broken by class name, so resolution is total and deterministic) and puts
#   the prose classes above the keyword classes. An empty `phrases` list means
#   the class is never resolved from a prompt — the internal classes. This
#   replaces the hardcoded keyword table the `onex delegate` CLI used to carry;
#   see ModelTaskClassSelection in inference/task_class_authority.py.
#
# response_contract_ref: OPTIONAL dotted "module.path.AttrName" naming a pydantic
#   model (or a discriminated Union type alias) whose JSON Schema
#   (resolve_task_class_response_contract, node_delegation_routing_reducer)
#   becomes the DEFAULT response_contract for a local dispatch of this task
#   class when the caller supplies none of its own (OMN-15196). This is a
#   structural REPLACEMENT for that class's dod_heuristic keyword checks (the
#   quality gate validates the response against the schema instead of
#   substring-matching) — a migrated class's dod_heuristic keyword entries for
#   the retired checks are deleted, not merely superseded, per the
#   net-negative-surface rule. A caller-declared response_contract (e.g. a
#   per-request schema) always takes precedence over this default. Absent —
#   the pre-OMN-15196 DoD-heuristic-only behavior — for every class not listed
#   here.
#
# Related Tickets:
#   - OMN-10615: Wire routing reducer to read task-class contracts
#   - OMN-10942: Task routing policy from contract with model defaults
#   - OMN-15161: Per-role dispatch report contracts ported into omnibase_core
#   - OMN-15193: Contract-declared response validation replaces keyword heuristics
#   - OMN-15196: Migrate task classes to declared response contracts; retire
#     the keyword heuristics those classes made obsolete
version: "1.0"
# OMN-16419: default_task_model_ref and every "Qwen3.6-35B-A3B" task_model_overrides
# entry below were repointed to "Qwen3.6-35B-A3B" — the live-verified SGLang served id at
# .201:8000 (the stale label was never running post-reboot; see bifrost_delegation.yaml
# local-coder/local-heavy-reasoning and routing_tiers.yaml for the matching backend
# model ids this id-match escape hatch resolves against).
default_task_model_ref: "Qwen3.8-27B"
task_model_overrides:
  # OMN-13380/OMN-13599: Direct z.ai GLM-5.2 was the cloud fallback for code/test/
  # refactor (preferred inside the cheap_cloud tier, backend cloud-glm,
  # secret_ref llm.glm.api_key). The
  # former openrouter-glm-flash override was repointed here: we hold a direct GLM
  # key, so GLM routed direct to z.ai rather than through the OpenRouter
  # aggregator (routing-cost principle — OpenRouter is for FREE models only).
  #
  # OMN-14625: repointed off GLM ("glm-5-turbo") to Gemini ("gemini-2.5-flash")
  # — the z.ai GLM route is DEAD from the .201 runtime (resolve_api_key
  # succeeds but every completion call 401s / loops FAILED-only). The model id
  # "gemini-2.5-flash" matches the cheap_cloud tier model id in
  # routing_tiers.yaml (backend cloud-gemini-pro, secret_ref
  # llm.gemini.api_key). A dangling override here would strand routing (see
  # test_code_generation_contract_model_ref_is_resolvable).
  code_generation: "gemini-2.5-flash"
  test: "gemini-2.5-flash"
  refactor: "gemini-2.5-flash"
  reasoning: "Qwen3.8-27B"
  complex_reasoning: "Qwen3.8-27B"
  planning: "Qwen3.8-27B"
  review: "Qwen3.8-27B"
  # OMN-15961: the OMN-15503 agent_delegation override REMOVED. It pinned
  # agent_delegation to local-reasoner via this EXPLICIT override map, which
  # (per _select_model_for_task's id-match escape hatch) bypasses use_for
  # capability checks entirely — so even after routing_tiers.yaml's
  # agent_delegation use_for entries were stripped (same ticket), this pin
  # alone would have silently kept resolving agent_delegation to
  # local-reasoner's plain HTTP completion, restoring the exact false
  # capability claim (real agent_orchestration, not just text completion)
  # the routing_tiers.yaml fix was meant to remove. agent_delegation now
  # correctly has no model ref anywhere and fails closed
  # (no_routable_backend_for_task) until the real coding-agent producer is
  # wired (WS-4/C6).
  # OMN-13541: code_review is its own task class (distinct from the generic
  # `review`); the local Qwen coder serves it, with cheap_cloud fallback.
  code_review: "Qwen3.8-27B"
  research: "Qwen3.8-27B"
# ── OMN-16932: request-scoped response shape ──────────────────────────────────
#
# A task class's definition_of_done describes the CLASS, not the request. When a
# prompt explicitly constrains its own answer ("Reply with exactly the word:
# alive"), the class rubric is a category error: on 2026-08-30 the dev lane
# scored that obedient one-word answer 0.7 against `research`'s prose rubric
# (cites_sources + methodical_analysis + semantic_adequacy), rejected it three
# times on the FREE local rung, and climbed into two metered 429s looking for a
# longer wrong answer.
#
# `response_shape_directives` are the CLOSED set of prompt directives that
# declare a shape. Each pattern is a Python `re` pattern matched case-
# insensitively against the prompt. A prompt matching none of them resolves to
# `unconstrained` and the class DoD applies unchanged — the default path is
# byte-for-byte the prior behaviour.
#
# `definition_of_done.shape_overrides.<shape>` replaces the HEURISTIC band for
# that shape. A class that declares no override for the resolved shape falls
# back to `default_shape_overrides` below.
#
# OMN-16932 also said the deterministic band is never overridden, because a
# structural floor is a property of the artifact rather than of how long the
# caller asked the answer to be. That general principle stands. What OMN-17765
# narrows is the pair of examples this comment used to give for it:
# `compiles_without_errors` is a property of a CODE artifact and
# `uses_pytest_mark_unit` of a TEST artifact, so neither is artifact-agnostic in
# the way the sentence implied. `response_non_empty` is the one that genuinely
# holds for any artifact.
#
# So a class MAY now declare `shape_overrides.<shape>.deterministic`, and where
# it does, that tuple IS the deterministic band for the request -- no merge with
# the class band, no union, no stricter-of-the-two. A class that declares no
# `deterministic` key keeps its class band untouched: a missing key means NOT
# DECLARED and never "drop the floor".
#
# Two hard limits, both enforced in `_shape_override_deterministic`:
#   - Per task class ONLY. `default_shape_overrides` has no `deterministic` key
#     and must not gain one -- it applies to every class at once, so a
#     deterministic sibling there is a caller-controlled bypass of the
#     deterministic proof surface.
#   - Never empty. An empty or non-list `deterministic` is a contract error, not
#     "no floor" -- an empty band presents a degraded verdict as complete truth.
response_shape_directives:
  exact_literal:
    - "reply with exactly the word"
    - "respond with exactly the word"
    - "reply with exactly:"
    - "respond with exactly:"
    - "answer with exactly:"
    - "output exactly:"
  single_word:
    - "in (?:exactly )?one word"
    - "in a single word"
    - "one[- ]word (?:answer|response|reply)"
    - "single[- ]word (?:answer|response|reply)"
    # The determiner is open on purpose: the live dev-lane probes used BOTH
    # "reply with the single word: ok" (2026-08-30T14:42Z) and "Reply with
    # exactly the word: alive" (14:47Z). An `(?:a )?`-only alternation matched
    # the second and missed the first, so the operator's own row-1 probe still
    # resolved `unconstrained` and still climbed the paid ladder.
    - "(?:answer|reply|respond) with (?:only )?(?:the |a |one )?single word"
    # OMN-19016: `exactly` belongs in the same optional adverb run as `only`
    # and `just`. Without it "Reply with exactly one word and nothing else:
    # READY" resolved `unconstrained`, was graded against the `document` prose
    # rubric, and was refused four times for being one word -- on correlations
    # f037b9be-b242-4b83-9912-3e6a5af83e82 and
    # ebfce7f3-873a-40f9-bb10-19be64ca602b, the READY probe the chain canary
    # uses to prove itself. The adjacent `in (?:exactly )?one word` pattern
    # already accepted the adverb, so a prompt saying the same thing with
    # `answer in` resolved correctly while one saying `reply with` did not.
    - "(?:answer|reply|respond) with (?:only )?(?:just )?(?:exactly )?one word"

# Applied when a task class declares no shape_overrides entry of its own for the
# resolved shape. `short_form_adequacy` is the adequacy authority here: it keeps
# every non-length failure mode of `semantic_adequacy` (empty, truncated
# mid-token, truncated mid-clause) and drops only the bare-single-word-fragment
# rule, which is precisely the rule the prompt overrode. `no_refusal` is kept
# because a constrained shape never licenses a refusal.
default_shape_overrides:
  exact_literal:
    heuristic:
      - no_refusal
      - short_form_adequacy
  single_word:
    heuristic:
      - no_refusal
      - short_form_adequacy

# Every quality rule a task class may declare, with its threshold and — the
# load-bearing half — WHO IT ANSWERS TO (OMN-18295).
#
# THE DEFECT THIS SECTION CLOSES. Cloud delegation
# ca144d1a-ea03-475f-bc81-650ccfa0495e (summarization, 2026-09-13) was
# terminalised `failed` carrying its own contradiction:
#
#     acceptance_criteria_failed: actual_score=0.900 required_bar=0.800
#     score_vs_bar=at_or_above_bar ...; failures=WEAK_OUTPUT: response is not
#     concise
#
# 0.900 is exactly (0.6 x 1/1) + (0.4 x 3/4): everything passed except
# `concise`. The concise miss was already priced into the score, the 0.800 bar
# forgave it — the receipt says so — and then the same miss was charged again
# as an absolute veto no bar can forgive. A usable ~400-word ticket body ended
# up under a `failed` status that a human had to know to look past.
#
# THE RULE NOW. Each check declares which authority it answers to, HERE, in
# the contract, instead of in a Python frozenset nothing outside the reducer
# can read:
#
#   scored    Contributes to the graded quality score and does NOT veto. The
#             task class's `required_bar` is the single authority on the
#             verdict. For a quality GRADIENT — a response can be less concise
#             and still be worth returning.
#
#   blocking  Vetoes acceptance outright, whatever the score. For FLOORS and
#             for the adequacy AUTHORITY: conditions under which the output is
#             not a worse answer but not an answer.
#
# WHY ALMOST EVERYTHING IS STILL BLOCKING, stated rather than implied. The
# reject-only design is settled and proven: OMN-13370 (a marker or length
# prefilter may reject but may never promote), OMN-13354 (an unattributed
# research answer fails), OMN-14220 (a bad planning output fails), OMN-13479
# (an inadequate research answer is not `completed`). Reclassifying those
# rules wholesale was tried while writing this ticket and broke eleven of
# those proofs — an inadequate research answer scored exactly 0.800 against an
# 0.800 bar and passed. Their veto is the property, not the bug.
#
# `concise` is the one rule this ticket has live evidence about, and it is the
# one rule that moves. What every other entry gains is DECLARATION: its class
# is now readable, attributed, and changeable by a one-token contract edit
# with a stated reason, instead of being implicit in code.
#
# A blocking rule's failure still lowers the graded score as well as vetoing.
# That is not the double-charge above: for a blocking rule the score is openly
# telemetry and the veto is openly the verdict, and `rule_evaluations` on the
# receipt now names the deciding rule and its enforcement, so a reader can
# never again meet 0.900-and-failed without being told which rule decided.
#
# Deterministic checks are blocking by construction (the OMN-13470 hard floor)
# and are not listed here. A check absent from this section is treated as
# blocking — fail-closed, so forgetting to declare one cannot silently strip
# its veto.
#
# Thresholds live HERE, not in handler code. `concise`'s 250 was a literal in
# `_check_concise`: a number a customer was held to that appeared in no
# contract and on no receipt.
quality_rules:
  # -- the one gradient (scored) -----------------------------------------
  concise:
    enforcement: scored
    threshold: 250
    threshold_unit: words
    rationale: >-
      Length above a rule of thumb is a gradient, not a floor. The delegation
      this section exists for returned a ~400-word ticket body that was
      accurate, grounded and immediately usable; the only thing wrong with it
      was that it was long. That belongs in the score, where the bar weighs it
      against everything the response got right. A summary that is ALSO
      unattributed, inadequate or a refusal still fails — on those rules,
      which are blocking.

  # -- floors and authorities (blocking) ---------------------------------
  no_refusal:
    enforcement: blocking
    rationale: >-
      A refusal is not a low-quality answer, it is the absence of one. No
      score can make it usable, so no bar gets to forgive it.
  accurate:
    enforcement: blocking
    rationale: >-
      Fires only on an EXPLICIT self-disclaimer ("this may be inaccurate",
      "do not rely on this"). A response that tells the reader not to trust it
      cannot be handed on regardless of how it scores elsewhere.
  semantic_adequacy:
    enforcement: blocking
    rationale: >-
      The adequacy authority for the unconstrained shape. It decides whether
      the content does the task at all, so its verdict IS the verdict — it can
      never be outvoted by a weighted average that includes it.
  short_form_adequacy:
    enforcement: blocking
    rationale: >-
      The adequacy authority for a contract-declared constrained shape
      (OMN-16932). Same standing as semantic_adequacy, for the shape it owns.
  # OMN-18349: `model_directive` is what the model is asked to do so its answer
  # meets the rule. It is stated at the end of the user turn of every request
  # graded against the rule, so the rule the gate vetoes on and the rule the
  # model is told are one value. Measured 2026-09-23 on the lab endpoint
  # (Qwen3.8-27B, thinking off): with no directive, 0 of 8 research answers
  # passed cites_sources and 0 of 4 code reviews passed cites_specific_lines;
  # with these directives, 8 of 8 each.
  cites_sources:
    enforcement: blocking
    model_directive: >-
      Attribute its claims to named sources: say where each one comes from
      (for example 'according to the PostgreSQL documentation') and end with
      a References line naming them.
    rationale: >-
      OMN-13354: an unattributed research answer fails. Attribution is the
      thing that makes a research answer checkable, so its absence is a floor
      rather than a gradient.
  cites_specific_lines:
    enforcement: blocking
    model_directive: >-
      Cite the exact line of the provided code each finding refers to (for
      example `line 1`).
    rationale: >-
      The code-review counterpart of cites_sources. A review that points at
      nothing specific cannot be acted on.
  methodical_analysis:
    enforcement: blocking
    model_directive: >-
      Give the reasoning behind each point, saying why it holds (because ...,
      therefore ...) and what risk or tradeoff it carries.
    rationale: >-
      OMN-14220: the reject-only filter that keeps a bad planning or review
      output from terminalising as adequate.
  covers_args_returns_raises:
    enforcement: blocking
    rationale: A docstring missing its contract sections is incomplete, not merely terse.
  covers_edge_cases:
    enforcement: blocking
    rationale: A declared coverage floor for the classes that require it.
  covers_error_paths:
    enforcement: blocking
    rationale: A declared coverage floor for the classes that require it.
  covers_dependencies:
    enforcement: blocking
    rationale: A declared coverage floor for the classes that require it.
  follows_codebase_conventions:
    enforcement: blocking
    rationale: A declared marker floor; reject-only, never promoting (OMN-13370).
  follows_google_style:
    enforcement: blocking
    rationale: A declared marker floor; reject-only, never promoting (OMN-13370).
  no_obvious_regressions:
    enforcement: blocking
    rationale: A declared marker floor; reject-only, never promoting (OMN-13370).
  # OMN-19400: the directive was missing, and complex_reasoning had never
  # completed. Dev-lane run d2893ea5 (2026-09-24): three local answers
  # refused on this rule alone, then a 429 at the ceiling. The only instruction
  # the model received about reasoning was the Markdown one, "do not include
  # analysis or reasoning before the deliverable", so it gave none.
  step_by_step_explanation:
    enforcement: blocking
    model_directive: >-
      Show how the answer is reached as numbered steps (1., 2., ...), then
      state the conclusion.
    rationale: A declared marker floor; reject-only, never promoting (OMN-13370).
  structured_output:
    enforcement: blocking
    rationale: A declared marker floor; reject-only, never promoting (OMN-13370).
  # OMN-19529: a number the input does not hold is an invented fact, not a
  # weaker answer, so it vetoes like identifiers_grounded does. The directive
  # states the rule to the model; the capability matrix of 2026-09-25 recorded
  # a summary adding a derived count the prompt had already forbidden.
  numbers_grounded:
    enforcement: blocking
    model_directive: >-
      Use only numbers that appear in the input. Do not count, add up or
      derive new numbers; if a derived number is essential, write (derived)
      right after it.
    rationale: >-
      Reject-only grounding. A number absent from the input is fabricated
      content that no score can make usable; it can fail a response and
      never promote one.

# ===========================================================================
# reasoning_preamble — where a leaked scratchpad ends and the answer begins
# ===========================================================================
#
# OMN-18379. A local model asked to answer a question sometimes answers it and
# ALSO ships the scratchpad it used to get there, ahead of the answer, as plain
# text. On 2026-09-14 run 43d269f5 that scratchpad opened "Here's a thinking
# process:", ran 123 lines, and closed with a trace terminator that had no
# matching opener — so the ordinary paired-tag strip left every line of it in
# place. Two things then went wrong that have nothing to do with the answer:
#
#   1. The blocking rule `accurate` scans the response for hedging phrases and
#      found the word "unverified" in line 31 of the SCRATCHPAD, where the model
#      was reasoning about which asks it could verify. The answer hedged
#      nothing. A correct response was vetoed for text the model was talking to
#      itself with.
#   2. The scratchpad reached the caller: `result.txt` began with "Here's a
#      thinking process:", and a downstream renderer read that as a failed
#      render, twice in one day.
#
# THE RULE. The boundary is found DETERMINISTICALLY, in the order below, and
# the search is declared here rather than inferred in Python:
#
#   1. unpaired_closing_tag  A closing trace tag from `closing_trace_tags` with
#                            no matching opener before it. The tag is the
#                            model's own statement that its reasoning ended, so
#                            it needs no other corroboration.
#   2. answer_marker         A line equal to one of `answer_markers`, when a
#                            lead-in is present. This is the boundary a prompt
#                            can ASK for and then rely on.
#   3. markdown_header       The first ATX header at line start, when a lead-in
#                            is present.
#   4. fenced_block          The first fence opener at line start, when a
#                            lead-in is present.
#
# Rules 2-4 require a declared `lead_in_phrases` match at the START of the
# response. Without that requirement the segmenter would cut the opening
# paragraph off every well-formed document that happens to have a header — a
# far worse failure than the one it is fixing. Rule 1 does not, because an
# unpaired terminator is unambiguous.
#
# NO BOUNDARY FOUND IS A REAL ANSWER. When none of the four resolves, the WHOLE
# response is verified and returned exactly as today, and the receipt records
# `no_boundary_found` so a reader can tell "there was nothing to strip" from
# "the segmenter was never run". Text is never dropped on a guess.
reasoning_preamble:
  lead_in_phrases:
    - "here's a thinking process"
    - "here is a thinking process"
    - "here's my thinking process"
    - "here is my thinking process"
    - "thinking process:"
    - "here's my reasoning"
    - "here is my reasoning"
    - "let me think through"
    - "let me think about"
    - "first, let me analyze"
    - "okay, let me"
    - "okay, the user"
    # OMN-18967: measured openings from the lab's local tier, which none of the
    # phrases above matched. Both were captured 2026-09-21 on Qwen3.8-27B:
    # "We need to respond to user: ..." and "We need answer user's request.
    # Need output only body text ...". The second scored quality 1.0 with the
    # boundary rule recording that nothing matched (correlation
    # ae8cd09b-628a-4466-b2c0-6f8174c244bd).
    #
    # Each entry names the REQUEST or the USER as a meta-object the model is
    # reasoning ABOUT. That specificity is deliberate and load-bearing: a bare
    # "we need to" would match a legitimate document opening "We need to reduce
    # tail latency", and under the OMN-18967 AC3 rule an unresolved lead-in is
    # a refusal — so an over-broad phrase here does not merely mis-strip, it
    # rejects a correct answer. Add a phrase only with a captured response
    # behind it, and only in a form a deliverable would not use.
    - "we need to respond to user"
    - "we need to respond to the user"
    - "we need answer user"
    - "we need to answer the user"
    - "the user is asking me to"
    - "the user wants me to"
    - "we need to produce"
  answer_markers:
    - "=== ANSWER ==="
    - "### ANSWER"
    - "<answer>"
  closing_trace_tags:
    - "</think>"
    - "</thinking>"
    - "</reasoning>"
  rationale: >-
    Declared here, beside the quality rules that read the segmented answer, so
    the phrase list a response is judged against is a contract a customer can
    read rather than a frozenset inside a reducer. OMN-18379.

# ===========================================================================
# output_only_acceptance — the D1 release bar (OMN-18932, K5 of OMN-18925)
# ===========================================================================
#
# D1, accepted: a response that needs extraction before it is usable is a
# release-acceptance failure, even when the extracted text is correct. The
# runtime still extracts (so a correct answer is not thrown away at run time);
# this bar is read only by omnimarket.delegation.output_only_acceptance, which
# judges the raw provider bytes against the bytes the caller received and
# changes no runtime verdict.
#
# Leading planning prose and reasoning-trace terminators are matched with the
# `reasoning_preamble` lists above. The list below covers the other end: a
# FINAL paragraph that is the model talking about its answer. It is matched at
# the START of the final paragraph only, so a document that merely contains
# one of these words elsewhere is unaffected. Add an entry only with a captured
# response behind it. The current entries were captured on the lab's local
# tier: "Let me know which direction is useful to you, ..." (run
# 2c74b5b9-54ee-4e5a-bae0-6476662dc556), "Let me know what you'd like to do
# with it." (run d408f945-ce3a-41e1-b0e7-334341643ef1), "Just let me know your
# specific request, ..." (run 06c18e0a-119e-413d-b402-956f1da7ac7a), and "Once
# I have the content or context, I'll provide ..." (runs
# 66bf5abb-0d82-422f-9d2b-7e2d8deb1ef0 and 832a6fb1-bece-49a1-84b4-2a79cc2d03fb).
output_only_acceptance:
  trailing_self_review_openers:
    - "let me know"
    - "just let me know"
    - "once i have the content"
  rationale: >-
    Declared beside the reasoning_preamble lists so every phrase a release is
    refused on is a contract a reader can check, not a literal in Python.
    OMN-18932.

# Contract-owned extraction and handler budget authority (OMN-18278/OMN-15504).
delegation_output:
  min_deliverable_share: 0.5
  markdown_markers:
    - "### ANSWER"
    - "=== ANSWER ==="
  plain_text_markers:
    - "=== ANSWER ==="
    - "FINAL:"
execution_budgets:
  code_generation: {task_class_timeout_ceiling_seconds: 240, terminal_delivery_margin_seconds: 60}
  refactor: {task_class_timeout_ceiling_seconds: 240, terminal_delivery_margin_seconds: 60}
  documentation: {task_class_timeout_ceiling_seconds: 240, terminal_delivery_margin_seconds: 60}
  document: {task_class_timeout_ceiling_seconds: 240, terminal_delivery_margin_seconds: 60}
  research: {task_class_timeout_ceiling_seconds: 240, terminal_delivery_margin_seconds: 60}
  test: {task_class_timeout_ceiling_seconds: 240, terminal_delivery_margin_seconds: 60}
  validator_generation: {task_class_timeout_ceiling_seconds: 240, terminal_delivery_margin_seconds: 60}
  reasoning: {task_class_timeout_ceiling_seconds: 240, terminal_delivery_margin_seconds: 60}
  complex_reasoning: {task_class_timeout_ceiling_seconds: 240, terminal_delivery_margin_seconds: 60}
