#
# task_class_contracts.v1.yaml — Task-class routing contracts.
#
# Loaded by node_delegation_routing_reducer to augment tier routing with
# per-task-class pricing ceilings, cloud routing policies, and escalation order.
#
# cloud_routing_policy values:
#   opt_in   — cloud routing requires explicit caller opt-in
#   allowed  — cloud routing is permitted when local tiers are unavailable
#   blocked  — cloud routing is never permitted for this task class
#
# pricing_ceiling_per_1k_tokens: maximum acceptable cost per 1000 tokens (USD).
#   local tier ≈ $0.000, cheap_cloud ≈ $0.002, claude ≈ $0.015
#
# escalation_policy.tier_order: the COMPLETE, CLOSED, ORDERED set of tiers
#   eligible for this task class. Only the tiers named here are tried, in this
#   order. Tiers NOT listed are excluded for this task class (they are not
#   appended after the declared order) — the listed ceiling tier is the final
#   tier tried. When tier_order is absent, the routing_tiers.yaml declaration
#   order is used instead; that file is the source of truth for fallback order.
#
# default_task_model_ref: model ID used when no per-task override is declared.
#   Maps to the model `id` field in routing_tiers.yaml (e.g. "qwen3-coder-30b").
#
# task_model_overrides: per-task-type model ID overrides. The routing reducer
#   prioritizes the declared model over tier-order selection when the model is
#   available in the tier with a configured bifrost endpoint (OMN-10942).
#
# gateway_exposure: closed public/internal admission policy. The Gateway may
#   project only entries declared public; internal entries remain valid Market
#   task classes but are not admitted at the public Gateway boundary.
#
# selection: how a PROMPT selects this task class (OMN-18305). Required on
#   every class. `phrases` are matched on WORD BOUNDARIES and by PRESENCE ONLY
#   — never counted, so the bulk of a document cannot outvote its purpose, and
#   "latest" can no longer match "test". `min_words`/`max_words` gate which
#   prompt SHAPES the class is eligible for at all and are evaluated before any
#   phrase, which is what keeps a 7,000-word coordination ledger structurally
#   ineligible for `test`. `priority` ranks eligible classes (higher wins; ties
#   broken by class name, so resolution is total and deterministic) and puts
#   the prose classes above the keyword classes. An empty `phrases` list means
#   the class is never resolved from a prompt — the internal classes. This
#   replaces the hardcoded keyword table the `onex delegate` CLI used to carry;
#   see ModelTaskClassSelection in inference/task_class_authority.py.
#
# response_contract_ref: OPTIONAL dotted "module.path.AttrName" naming a pydantic
#   model (or a discriminated Union type alias) whose JSON Schema
#   (resolve_task_class_response_contract, node_delegation_routing_reducer)
#   becomes the DEFAULT response_contract for a local dispatch of this task
#   class when the caller supplies none of its own (OMN-15196). This is a
#   structural REPLACEMENT for that class's dod_heuristic keyword checks (the
#   quality gate validates the response against the schema instead of
#   substring-matching) — a migrated class's dod_heuristic keyword entries for
#   the retired checks are deleted, not merely superseded, per the
#   net-negative-surface rule. A caller-declared response_contract (e.g. a
#   per-request schema) always takes precedence over this default. Absent —
#   the pre-OMN-15196 DoD-heuristic-only behavior — for every class not listed
#   here.
#
# Related Tickets:
#   - OMN-10615: Wire routing reducer to read task-class contracts
#   - OMN-10942: Task routing policy from contract with model defaults
#   - OMN-15161: Per-role dispatch report contracts ported into omnibase_core
#   - OMN-15193: Contract-declared response validation replaces keyword heuristics
#   - OMN-15196: Migrate task classes to declared response contracts; retire
#     the keyword heuristics those classes made obsolete
version: "1.0"
