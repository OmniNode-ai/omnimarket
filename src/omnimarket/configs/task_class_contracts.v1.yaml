    # decision schema still takes precedence when a caller declares one).
    response_contract_ref: "omnibase_core.models.dispatch.report.DispatchReport"
    definition_of_done:
      deterministic:
        - task_completed
      heuristic:
        # OMN-15196: sub_tasks_verified (substring match on "verified"/"passed"/
        # "evidence"/"check") and no_refusal (phrase match) are RETIRED for this
        # class -- response_contract_ref above is now the sole acceptance
        # authority for any request that reaches the quality gate without its
        # own caller-declared response_contract. This DoD block is retained ONLY
        # as the fallback for a request that somehow reaches the gate with
        # response_contract_ref unresolved (defensive; not expected in normal
        # operation) and for the bus-intent path, which does not yet thread a
        # response_contract at all (wire-model gap, OMN-15193 note) -- semantic_adequacy
        # stays as that path's local acceptance authority.
        - semantic_adequacy
    quality_gate:
      score_source: quality_gate_graded_score
      required_bar: 0.8
      request_override_bounds:
        min: 0.6
        max: 1.0
    # OMN-13215: the former shelled ``cli_agents`` tier was removed. Agent
    # delegation now escalates local → cheap_cloud → the canonical HTTP ceiling
    # (claude), all of which execute over the bus/inference-effect HTTP path.
    escalation_policy:
      max_escalations: 2
      tier_order:
        - local
        - cheap_cloud
        - claude
