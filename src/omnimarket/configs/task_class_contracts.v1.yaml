        # legitimately contains hex-shaped tokens its prompt never mentioned.
        - identifiers_grounded
        # OMN-19529: number grounding. Every number the response states, in
        # digits or spelled out, must occur in the input it was derived from,
        # or be marked unverified or derived. Declared in the gate node's
        # contract.yaml (numeric_grounding); reject-only, never promoting.
        - numbers_grounded
    quality_gate:
      score_source: quality_gate_graded_score
      required_bar: 0.8
      request_override_bounds:
        min: 0.6
        max: 1.0
    adequacy_authority:
      score_source: reproducible_judge
      rubric_id: delegation_non_verifiable_v1
      rubric_hash: "sha256:321240472e3b52d21fd8cb9b9b7639bb73161a2945adf580948e86275ce20681"
      event_topic_ref: delegation_judge_verdict_v1
      terminology: controlled_reproducible_auditable
    # OMN-13640: the PROSE ladder now tries the genuinely-FREE cloud rung before
    # it spends, and the flat-rate rung before the metered one.
    #
    # RED-before, measured 2026-09-14: this class declared
    # `tier_order: [local, cheap_cloud]`, so `cheap_frontier` -- the ONLY tier
    # whose `cost.cost_type` is `free_local` (OpenRouter) -- appeared in no prose
    # class's tier_order at all. Every prose escalation therefore landed on the
    # metered `cheap_cloud` tier and was answered by `gemini-2.5-flash-lite`
    # (backend `cloud-gemini-flash`): 4 of 4 accepted drafts from the hourly
    # Linear sweep (`--task-type document`), $0.001809 mean, free rungs
    # contributing nothing.
    #
    # `max_escalations` is raised 1 -> 2 IN THE SAME EDIT, and that is not
    # cosmetic. It bounds TRANSITIONS, not tiers visited -- the gate is
    # `workflow.escalation_count < max_escalation_attempts`
    # (node_delegation_orchestrator/handlers/handler_delegation_workflow.py), so
    # reaching the Nth entry of tier_order costs N-1 transitions. A 3-entry
    # tier_order left at `max_escalations: 1` makes its LAST entry unreachable
    # and the whole added rung decorative. Pinned by
    # tests/unit/delegation/test_prose_free_tier_ladder_omn13640.py::
    # test_every_declared_class_can_reach_the_last_entry_of_its_tier_order,
    # which asserts `max_escalations >= len(tier_order) - 1` for EVERY declared
    # class, not only these three.
    #
    # Within `cheap_cloud` the order is unchanged and already correct:
    # `glm-5.3-flash` (backend `cloud-glm`) is declared BEFORE `gemini-flash`,
    # and declaration order is the tiebreaker in `_select_model_for_task`, so
    # adding this class to GLM's `use_for` puts the flat-rate rung ahead of the
    # metered Gemini rung without reordering anything.
    #
    # QUOTA HONESTY, recorded rather than implied: `cloud-glm` is a flat-rate
    # z.ai Coding Plan with a HARD PERIODIC CEILING (5-hour, weekly and MCP
    # quotas), NOT a per-token meter. Pointing these three prose classes at it
    # spends the SAME plan quota the operator's own GLM coding usage draws on.
    # That is why it sits BELOW the free OpenRouter rung and is never an
    # unconditional primary (the standing OMN-6790 discipline). When the cap
    # trips, `bifrost_delegation.yaml`'s `provider_quota_policy` classifies
    # z.ai 1310 as `disable_until_reset` (parsed from the provider's own stated
    # reset) and 1113 as a WRONG-ENDPOINT alert that is NEVER a billing action;
    # `_backend_routable` then skips the backend by quota domain, so a trip
    # falls through to the next model in the SAME tier rather than stranding the
    # class.
    #
    # The `claude` ceiling tier is deliberately NOT added. Its only model
    # resolves to backend `cloud-gemini-pro`, which carries the SAME provider
    # and the SAME `llm.gemini.api_key` secret_ref as `cheap_cloud`'s Gemini
    # rung (`cloud-gemini-flash`) -- verified in bifrost_delegation.yaml this
    # ticket. A fourth rung would therefore buy a fourth attempt and ~20s of
    # added latency against the identical quota domain, with zero
    # quota-domain independence. Reopen that only if the ceiling is repointed
    # to a genuinely separate provider.
    escalation_policy:
      max_escalations: 2
      tier_order:
        - local
        - cheap_frontier
        - cheap_cloud
  agent_delegation:
    gateway_exposure: internal
    output_contract: {output_shape: markdown, start_marker: "### ANSWER"}
    selection:
      priority: 0
      phrases: []
    required_capabilities:
      - agent_orchestration
    # OMN-16811: the OMN-15961 fail-closed decision, promoted from a test-local
    # exception dict to a contract-declared, machine-readable fact. No tier in
    # routing_tiers.yaml is anything but a plain HTTP chat-completion backend,
    # so none can satisfy ``agent_orchestration``; wiring this class onto one
    # would be the false capability claim OMN-15961 removed and
    # ``test_no_use_for_entry_claims_a_capability_its_tier_cannot_serve``
    # mechanically forbids. Until the real coding-agent producer lands the
    # class resolves NO backend on any of its declared tiers and a live
    # delegation raises ONEX_CORE_041_INVALID_CONFIGURATION. Declaring it here
    # is what lets a consumer (dashboard menu, gateway admission) refuse the
    # class up front instead of offering it and hanging for the full ingress
    # budget, and what lets the OMN-16811 drift gate fail in BOTH directions —
    # an undeclared class that stops routing, and a stale declaration on a
    # class that has become routable. Delete this block in the same change
    # that wires the producer.
    routing_availability:
      status: pending_capability
      missing_capability: agent_orchestration
      tracking: "OMN-15961 WS-4/C6"
      reason: >-
        No routing tier can execute agentic/tool-using work; every tier is an
        HTTP chat-completion backend. A text completion returned for this class
        would be a dispatch report nobody executed.
    pricing_ceiling_per_1k_tokens: 0.015
    latency_sla_p99_ms: 120000
    cloud_routing_policy: opt_in
    # OMN-15196: declared response contract replaces the retired
    # sub_tasks_verified/no_refusal keyword heuristics below (OMN-15193 gave the
    # quality gate the ability to validate structurally against a declared JSON
    # Schema instead of substring-matching). DispatchReport is the per-role
    # (implementer/verifier/lander/scout) closed report contract ported from
    # steel_onslaught PR #213 into omnibase_core (OMN-15161). The routing
    # authority (resolve_task_class_response_contract) resolves this ref to a
    # JSON Schema and threads it as the default response_contract for any local
    # dispatch that does not supply its own (e.g. steel's per-request tactical
    # decision schema still takes precedence when a caller declares one).
    response_contract_ref: "omnibase_core.models.dispatch.report.DispatchReport"
    definition_of_done:
      deterministic:
        - task_completed
      heuristic:
        # OMN-15196: sub_tasks_verified (substring match on "verified"/"passed"/
        # "evidence"/"check") and no_refusal (phrase match) are RETIRED for this
        # class -- response_contract_ref above is now the sole acceptance
        # authority for any request that reaches the quality gate without its
        # own caller-declared response_contract. This DoD block is retained ONLY
        # as the fallback for a request that somehow reaches the gate with
        # response_contract_ref unresolved (defensive; not expected in normal
        # operation) and for the bus-intent path, which does not yet thread a
        # response_contract at all (wire-model gap, OMN-15193 note) -- semantic_adequacy
        # stays as that path's local acceptance authority.
        - semantic_adequacy
    quality_gate:
      score_source: quality_gate_graded_score
      required_bar: 0.8
      request_override_bounds:
        min: 0.6
        max: 1.0
    # OMN-13215: the former shelled ``cli_agents`` tier was removed. Agent
    # delegation now escalates local → cheap_cloud → the canonical HTTP ceiling
    # (claude), all of which execute over the bus/inference-effect HTTP path.
    escalation_policy:
      max_escalations: 2
      tier_order:
        - local
        - cheap_cloud
        - claude
  escalation:
    gateway_exposure: internal
    output_contract: {output_shape: markdown, start_marker: "### ANSWER"}
    selection:
      priority: 0
      phrases: []
    required_capabilities:
      - reasoning
      - context_window_large
    pricing_ceiling_per_1k_tokens: 0.015
    latency_sla_p99_ms: 120000
    cloud_routing_policy: allowed
    definition_of_done:
      deterministic:
        - response_non_empty
      heuristic:
        - no_refusal
        - methodical_analysis
        # OMN-19406: `semantic_adequacy` is the LOCAL acceptance authority, the
        # same one `reasoning` and `complex_reasoning` carry (OMN-13963), and
        # this class is served on the same local rung as `complex_reasoning`
        # (routing_tiers.yaml, OMN-16811). `no_refusal` and
        # `methodical_analysis` are reject-only, so without it the gate
        # returned "no deterministic acceptance or judge adequacy authority"
        # for every answer: dev-lane run 0249bf01 (2026-09-24) refused three
        # local answers scored 1.0 and climbed to a 429 at the ceiling slot.
        # The refusal and reasoning floors are unchanged and still veto.
        - semantic_adequacy
        # OMN-18297 identifier grounding, as on every other prose class. An
        # escalation names the tickets, runs and PRs it escalates, so an
        # identifier absent from its input is exactly what must not pass.
        - identifiers_grounded
    quality_gate:
      score_source: quality_gate_graded_score
      required_bar: 0.8
      request_override_bounds:
        min: 0.6
        max: 1.0
    adequacy_authority:
      score_source: reproducible_judge
      rubric_id: delegation_non_verifiable_v1
      rubric_hash: "sha256:321240472e3b52d21fd8cb9b9b7639bb73161a2945adf580948e86275ce20681"
      event_topic_ref: delegation_judge_verdict_v1
      terminology: controlled_reproducible_auditable
    # OMN-16811: ``local`` prepended. This class's tier_order was ``[claude]``
    # alone — the ONLY admitted task class whose entire ladder was a single
    # credentialed cloud backend (``cloud-gemini-pro``). A read-only probe run
    # inside the dev-lane runtime container resolved escalation to exactly
    # ``[('claude', 'cloud-gemini-pro')]`` while all eleven terminating classes
    # kept a free local rung, which is why a quota-exhausted / unreachable
    # Gemini stranded this class specifically. Cheapest-first doctrine: the
    # zero-cost owned-GPU tier is tried first and the metered ceiling stays the
    # ceiling. max_escalations is unchanged at 1 — local -> claude is exactly
    # one escalation.
    escalation_policy:
      max_escalations: 1
      tier_order:
        - local
        - claude
