          - "assertions"
          - "test case"
          - "test cases"
        qualifiers:
          - "assert"
          - "asserts"
          - "class"
          - "code"
          - "coverage"
          - "fixture"
          - "fixtures"
          - "function"
          - "method"
          - "mock"
          - "mocks"
          - "module"
          - "pytest"
          - "spec"
          - "specs"
          - "suite"
          # OMN-19017 removed the bare singular "test" from this list. With
          # "test case" gated above, a qualifier of "test" would sit INSIDE
          # the phrase it qualifies, and a phrase carrying its own qualifier
          # can never be refused -- the condition
          # `test_every_gated_phrase_has_a_qualifier_that_is_not_itself`
          # exists to catch exactly that and did catch it here. It is also
          # redundant: every genuine code use is already reached by "tests",
          # "testing", "unittest", "pytest", "suite", "fixture" or one of the
          # other code terms below, and "unit test" and "failing test" are
          # unqualified phrases of this class in their own right. Keeping it
          # would have let an incidental nearby "test" qualify a prose
          # request, which is the defect being removed rather than a
          # different one.
          - "testing"
          - "tests"
          - "unittest"
