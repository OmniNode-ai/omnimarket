task_classes:
  code_generation:
    gateway_exposure: public
    output_contract: {output_shape: markdown, start_marker: "### ANSWER"}
    selection:
      priority: 30
      max_words: 600
      phrases:
        - "implement"
        - "scaffold"
        - "port the"
      # OMN-18831. "write a" / "create a" / "build a" / "generate" are ordinary
      # English before they are code requests. A 388-word prose request opening
      # "Write a GitHub PR body in markdown" was claimed here on the two-word
      # match, and `test`'s `compiles_without_errors` floor then refused five
      # correct English answers in a row. These phrases now claim a prompt only
      # when one of the declared code artifacts sits within `within_words` words
      # of the phrase -- "write a parser" is a code request, "write a PR body"
      # is not. The qualifier list is the word sense, so it is contract data.
      qualified_phrases:
        within_words: 6
        phrases:
          # OMN-19523. A bare "write" opens requests such as "Write three
          # Pydantic v2 model modules" and "Write three small Python files",
          # which "write a" never matched, so the capability matrix of
          # 2026-09-25 saw them routed by a noun further down (runs ea0b2d12,
          # 15fffef6). Gated like its siblings: it claims only with a code
          # artifact within `within_words` words.
          - "write"
          - "write a"
          - "write an"
          - "create a"
          - "create an"
          - "build a"
          - "build an"
          - "generate"
        qualifiers:
          - "adapter"
          - "algorithm"
          - "api"
          - "bash"
          - "class"
          - "classes"
          - "cli"
          - "client"
          - "command"
          - "component"
          - "daemon"
          - "dataclass"
          - "decorator"
          - "dockerfile"
          - "endpoint"
          - "enum"
          - "fixture"
          - "function"
          - "functions"
          - "handler"
          - "helper"
          - "hook"
          - "interface"
          - "javascript"
          - "job"
          - "makefile"
          - "method"
          - "methods"
          - "middleware"
          - "migration"
          - "model"
          - "module"
          - "node"
          - "parser"
          - "patch"
          - "plugin"
          - "program"
          - "protocol"
          - "python"
          - "query"
          - "regex"
          - "route"
          - "rust"
          - "schema"
          - "script"
          - "server"
          - "service"
          - "shell"
          - "snippet"
          - "sql"
          - "subcommand"
          - "test"
          - "tests"
          - "type"
          - "typescript"
          - "util"
          - "utility"
          - "validator"
          - "worker"
          - "workflow"
          - "wrapper"
          - "yaml"
      # OMN-18831, the residual its 2026-09-20 comment recorded. The
      # qualifier gate above settles an ambiguous VERB; it cannot help an
      # unambiguous phrase that appears because the prompt DESCRIBES code
      # work. Run 1a67961a-664e-4a98-8680-378e8c393921 asked for "a markdown
      # table ... for a pull request description. Output only the table, no
      # prose" whose numbers were "collectable pytest modules", and `test`
      # claimed it on "pytest"; three local rungs returned the table and
      # were refused on the compilation floor at 0.333 before a cloud 429
      # ended the run. Correlation 03953fba-18a9-4c85-a77b-bcc3bb860a01 is the
      # same shape on "unit tests" inside a PR body. `vetoed_by` names the
      # REQUESTED OUTPUT, which the prompt states outright: where a prose
      # artifact or a no-code instruction is named, this class does not claim
      # the prompt. It is declared once here and aliased onto every public
      # class graded by `deterministic_acceptance`, so the three cannot drift
      # apart. It fails toward the prose fallback, never toward a compilation
      # floor, and an explicit --task-type still selects the class. A code
      # request that happens to NAME one of these artifacts as its subject
      # ("a pytest test for the PR body parser") is vetoed too; that residual
      # is pinned by a test in omnibase_infra rather than left latent.
      vetoed_by: &prose_output_vetoes
        - "pr body"
        - "pr description"
        - "pr comment"
        - "pull request body"
        - "pull request description"
        - "pull request comment"
        - "github comment"
        - "linear comment"
        - "ticket comment"
        - "ticket description"
        - "closing comment"
        - "close comment"
        - "commit message"
        - "release notes"
        - "changelog entry"
        - "status update"
        - "slack message"
        - "problem statement"
        - "in prose"
        - "as prose"
        - "plain prose"
        - "in plain english"
        - "no code blocks"
        - "do not write code"
    score_source: deterministic_acceptance
    acceptance_authority:
      type: deterministic_acceptance
      acceptance_version: delegation-deterministic-acceptance.v1
      evidence_fields:
        - acceptance_version
        - corpus_hash
        - validator_or_artifact_hash
        - acceptance_command
        - actual_score
        - pass
        - failure_cases
    required_capabilities:
      - code_completion
      - context_window_large
    pricing_ceiling_per_1k_tokens: 0.015
    latency_sla_p99_ms: 30000
    cloud_routing_policy: allowed
    definition_of_done:
      deterministic:
        - compiles_without_errors
        # OMN-19529: static name resolution, the non-executing half of
        # "imports in isolation". Declared in the gate node's contract.yaml
        # (name_resolution); reject-only, skipped without a grounding source.
        - names_resolve
        - final_artifact_only
        - passes_existing_tests
      heuristic:
        - no_refusal
        - follows_codebase_conventions
        - no_obvious_regressions
    quality_gate:
      score_source: quality_gate_graded_score
      required_bar: 0.85
      request_override_bounds:
        min: 0.6
        max: 1.0
    escalation_policy:
      # OMN-13943: bumped 2 -> 3 so the ladder can actually reach `claude` now
      # that `cheap_frontier` sits between `cheap_cloud` and it — 3 escalations
      # are required to walk local -> cheap_cloud -> cheap_frontier -> claude.
      max_escalations: 3
      # OMN-13599: local AI-PC coder is primary when the Tailscale hostname overlay
      # supplies a complete endpoint. Direct z.ai GLM-5.2 remains the metered
      # cloud fallback/ceiling; Gemini is not in the code-generation first-hop path.
      # OMN-13943: `cheap_frontier` (OpenRouter Qwen3-Coder-480B, free tier) is
      # now reachable via escalation — previously declared in routing_tiers.yaml
      # but absent from every task class's tier_order, so a `cheap_cloud`
      # RATE_LIMITED (GLM 429) had nowhere retryable to escalate to before
      # `claude`. Inserted between `cheap_cloud` and `claude` so a GLM 429
      # transparently falls through to OpenRouter before exhausting the ladder.
      tier_order:
        # OMN-14225: free before paid. cheap_frontier (OpenRouter Qwen3-Coder-480B,
        # free_local) precedes cheap_cloud (z.ai glm-5.2, metered/PAID) so a task that
        # must escalate off local tries the FREE frontier tier before any paid tier.
        - local
        - cheap_frontier
        - cheap_cloud
        - claude
  # OMN-14218: `refactor` is accepted at the delegation surface (allowed_task_types,
  # the CLI --task-type enum, task_model_overrides, and routing_tiers.yaml `use_for`)
  # but had NO task-class contract here. Consequence: with no acceptance_authority
  # and no adequacy_authority the quality gate returned _NO_ADEQUACY_AUTHORITY_REASON
  # ("TASK_MISMATCH: no deterministic acceptance or judge adequacy authority") on
  # every tier, so a valid LOCAL code artifact could never PASS and the workflow
  # force-escalated local -> cheap_cloud (PAID glm-5.2, real spend) -> cheap_frontier
  # (OpenRouter 429) -> failed. This mirrors the OMN-13541 fix that gave `code_review`
  # a contract for the same "accepted at surface, no contract" gap. `refactor` is a
  # code-writing task, so its contract mirrors `code_generation`: a deterministic
  # acceptance authority + code DoD with the same closed tier_order, which lets local
  # output PASS at $0 exactly like code_generation. (A minimal-diff / precision DoD
  # for surgical edits to large files is tracked separately under OMN-14214.)
  refactor:
    gateway_exposure: public
    output_contract: {output_shape: markdown, start_marker: "### ANSWER"}
    selection:
      priority: 45
      max_words: 600
      phrases:
        - "refactor"
        - "clean up"
        - "cleanup"
        - "simplify"
        - "extract the"
        - "rename"
        - "de-duplicate"
        - "deduplicate"
      # OMN-18831: the prose-output veto declared on code_generation.
      vetoed_by: *prose_output_vetoes
    score_source: deterministic_acceptance
    acceptance_authority:
      type: deterministic_acceptance
      acceptance_version: delegation-deterministic-acceptance.v1
      evidence_fields:
        - acceptance_version
        - corpus_hash
        - validator_or_artifact_hash
        - acceptance_command
        - actual_score
        - pass
        - failure_cases
    required_capabilities:
      - code_completion
      - context_window_large
    pricing_ceiling_per_1k_tokens: 0.015
    latency_sla_p99_ms: 30000
    cloud_routing_policy: allowed
    definition_of_done:
      deterministic:
        - compiles_without_errors
        # OMN-19529: static name resolution, the non-executing half of
        # "imports in isolation". Declared in the gate node's contract.yaml
        # (name_resolution); reject-only, skipped without a grounding source.
        - names_resolve
        - final_artifact_only
      heuristic:
        - no_refusal
        - follows_codebase_conventions
        - no_obvious_regressions
    quality_gate:
      score_source: quality_gate_graded_score
      required_bar: 0.85
      request_override_bounds:
        min: 0.6
        max: 1.0
    escalation_policy:
      # Same closed ladder as code_generation (OMN-13943): local -> cheap_cloud ->
      # cheap_frontier -> claude. With a working local acceptance authority the
      # common path terminates at local ($0) and never escalates.
      max_escalations: 3
      tier_order:
        # OMN-14225: free before paid. cheap_frontier (OpenRouter Qwen3-Coder-480B,
        # free_local) precedes cheap_cloud (z.ai glm-5.2, metered/PAID) so a task that
        # must escalate off local tries the FREE frontier tier before any paid tier.
        - local
        - cheap_frontier
        - cheap_cloud
        - claude
  documentation:
    gateway_exposure: internal
    output_contract: {output_shape: markdown, start_marker: "### ANSWER"}
    selection:
      priority: 0
      phrases: []
    required_capabilities:
      - natural_language_generation
    pricing_ceiling_per_1k_tokens: 0.002
    latency_sla_p99_ms: 20000
    cloud_routing_policy: allowed
    definition_of_done:
      deterministic:
        - docstring_present
      heuristic:
        - no_refusal
        - follows_google_style
        - covers_args_returns_raises
        # OMN-13218: semantic_adequacy replaces the blunt min_length_chars_50 floor.
        # A complete docstring passes; an empty/truncated stub fails. A correct
        # short docstring is no longer rejected on character count, while the
        # bad docstring cases still fail on real defects (google-style /
        # covers_args_returns_raises) so the per-class margin holds.
        - semantic_adequacy
        # OMN-18297: identifier grounding. Every repo#NNN / OMN-NNNN / sha /
        # run-id / UUID the response emits must occur in the input it was
        # derived from, or be marked unverified. The classes, the lookup form
        # and the failure policy are declared in the gate node's contract.yaml
        # (identifier_grounding). Reject-only: it can fail a response, never
        # promote one. Armed on the prose classes only -- a code artifact
        # legitimately contains hex-shaped tokens its prompt never mentioned.
        - identifiers_grounded
    quality_gate:
      score_source: quality_gate_graded_score
      required_bar: 0.8
      request_override_bounds:
        min: 0.6
        max: 1.0
    # OMN-13640: the PROSE ladder now tries the genuinely-FREE cloud rung before
    # it spends, and the flat-rate rung before the metered one.
    #
    # RED-before, measured 2026-09-14: this class declared
    # `tier_order: [local, cheap_cloud]`, so `cheap_frontier` -- the ONLY tier
    # whose `cost.cost_type` is `free_local` (OpenRouter) -- appeared in no prose
    # class's tier_order at all. Every prose escalation therefore landed on the
    # metered `cheap_cloud` tier and was answered by `gemini-2.5-flash-lite`
    # (backend `cloud-gemini-flash`): 4 of 4 accepted drafts from the hourly
    # Linear sweep (`--task-type document`), $0.001809 mean, free rungs
    # contributing nothing.
    #
    # `max_escalations` is raised 1 -> 2 IN THE SAME EDIT, and that is not
    # cosmetic. It bounds TRANSITIONS, not tiers visited -- the gate is
    # `workflow.escalation_count < max_escalation_attempts`
    # (node_delegation_orchestrator/handlers/handler_delegation_workflow.py), so
    # reaching the Nth entry of tier_order costs N-1 transitions. A 3-entry
    # tier_order left at `max_escalations: 1` makes its LAST entry unreachable
    # and the whole added rung decorative. Pinned by
    # tests/unit/delegation/test_prose_free_tier_ladder_omn13640.py::
    # test_every_declared_class_can_reach_the_last_entry_of_its_tier_order,
    # which asserts `max_escalations >= len(tier_order) - 1` for EVERY declared
    # class, not only these three.
    #
    # Within `cheap_cloud` the order is unchanged and already correct:
    # `glm-5.3-flash` (backend `cloud-glm`) is declared BEFORE `gemini-flash`,
    # and declaration order is the tiebreaker in `_select_model_for_task`, so
    # adding this class to GLM's `use_for` puts the flat-rate rung ahead of the
    # metered Gemini rung without reordering anything.
    #
    # QUOTA HONESTY, recorded rather than implied: `cloud-glm` is a flat-rate
    # z.ai Coding Plan with a HARD PERIODIC CEILING (5-hour, weekly and MCP
    # quotas), NOT a per-token meter. Pointing these three prose classes at it
    # spends the SAME plan quota the operator's own GLM coding usage draws on.
    # That is why it sits BELOW the free OpenRouter rung and is never an
    # unconditional primary (the standing OMN-6790 discipline). When the cap
    # trips, `bifrost_delegation.yaml`'s `provider_quota_policy` classifies
    # z.ai 1310 as `disable_until_reset` (parsed from the provider's own stated
    # reset) and 1113 as a WRONG-ENDPOINT alert that is NEVER a billing action;
    # `_backend_routable` then skips the backend by quota domain, so a trip
    # falls through to the next model in the SAME tier rather than stranding the
    # class.
    #
    # The `claude` ceiling tier is deliberately NOT added. Its only model
    # resolves to backend `cloud-gemini-pro`, which carries the SAME provider
    # and the SAME `llm.gemini.api_key` secret_ref as `cheap_cloud`'s Gemini
    # rung (`cloud-gemini-flash`) -- verified in bifrost_delegation.yaml this
    # ticket. A fourth rung would therefore buy a fourth attempt and ~20s of
    # added latency against the identical quota domain, with zero
    # quota-domain independence. Reopen that only if the ceiling is repointed
    # to a genuinely separate provider.
    escalation_policy:
      max_escalations: 2
      tier_order:
        - local
        - cheap_frontier
        - cheap_cloud
  # OMN-12964: `document` is a PROSE natural-language task (write/explain), not a
  # code-docstring task. Its DoD must not require docstring syntax — that defect
  # forced every prose output to fail `docstring_present` / `follows_google_style`
  # / `covers_args_returns_raises` (code-docstring markers `args:`/`returns:`/
  # `raises:`) and score 0.000 on both tiers (live CID a604cd40). The docstring
  # DoD lives on the `documentation` task class below, which is the correct home.
  document:
    gateway_exposure: public
    output_contract: {output_shape: markdown, start_marker: "### ANSWER"}
    selection:
      priority: 62
      phrases:
        - "document"
        - "documentation"
        - "docstring"
        - "readme"
        - "explain how"
        - "write the docs"
        - "write docs"
    required_capabilities:
      - natural_language_generation
    pricing_ceiling_per_1k_tokens: 0.002
    latency_sla_p99_ms: 20000
    cloud_routing_policy: allowed
    definition_of_done:
      deterministic:
        - response_non_empty
      heuristic:
        - no_refusal
        - accurate
        # OMN-13218: semantic_adequacy replaces the blunt min_length_chars_200 floor.
        # A complete prose answer passes at any length; an empty/truncated stub
        # fails. A correct short document is no longer rejected on character
        # count. The bad prose cases still fail on real defects (refusal /
        # accuracy disclaimer) so the per-class margin holds.
        - semantic_adequacy
        # OMN-18297: identifier grounding. Every repo#NNN / OMN-NNNN / sha /
        # run-id / UUID the response emits must occur in the input it was
        # derived from, or be marked unverified. The classes, the lookup form
        # and the failure policy are declared in the gate node's contract.yaml
        # (identifier_grounding). Reject-only: it can fail a response, never
        # promote one. Armed on the prose classes only -- a code artifact
        # legitimately contains hex-shaped tokens its prompt never mentioned.
        - identifiers_grounded
        # OMN-19529: number grounding. Every number the response states, in
        # digits or spelled out, must occur in the input it was derived from,
        # or be marked unverified or derived. Declared in the gate node's
        # contract.yaml (numeric_grounding); reject-only, never promoting.
        - numbers_grounded
    quality_gate:
      score_source: quality_gate_graded_score
      required_bar: 0.8
      request_override_bounds:
        min: 0.6
        max: 1.0
    adequacy_authority:
      score_source: reproducible_judge
      rubric_id: delegation_non_verifiable_v1
      rubric_hash: "sha256:321240472e3b52d21fd8cb9b9b7639bb73161a2945adf580948e86275ce20681"
      event_topic_ref: delegation_judge_verdict_v1
      terminology: controlled_reproducible_auditable
    # OMN-13640: the PROSE ladder now tries the genuinely-FREE cloud rung before
    # it spends, and the flat-rate rung before the metered one.
    #
    # RED-before, measured 2026-09-14: this class declared
    # `tier_order: [local, cheap_cloud]`, so `cheap_frontier` -- the ONLY tier
    # whose `cost.cost_type` is `free_local` (OpenRouter) -- appeared in no prose
    # class's tier_order at all. Every prose escalation therefore landed on the
    # metered `cheap_cloud` tier and was answered by `gemini-2.5-flash-lite`
    # (backend `cloud-gemini-flash`): 4 of 4 accepted drafts from the hourly
    # Linear sweep (`--task-type document`), $0.001809 mean, free rungs
    # contributing nothing.
    #
    # `max_escalations` is raised 1 -> 2 IN THE SAME EDIT, and that is not
    # cosmetic. It bounds TRANSITIONS, not tiers visited -- the gate is
    # `workflow.escalation_count < max_escalation_attempts`
    # (node_delegation_orchestrator/handlers/handler_delegation_workflow.py), so
    # reaching the Nth entry of tier_order costs N-1 transitions. A 3-entry
    # tier_order left at `max_escalations: 1` makes its LAST entry unreachable
    # and the whole added rung decorative. Pinned by
    # tests/unit/delegation/test_prose_free_tier_ladder_omn13640.py::
    # test_every_declared_class_can_reach_the_last_entry_of_its_tier_order,
    # which asserts `max_escalations >= len(tier_order) - 1` for EVERY declared
    # class, not only these three.
    #
    # Within `cheap_cloud` the order is unchanged and already correct:
    # `glm-5.3-flash` (backend `cloud-glm`) is declared BEFORE `gemini-flash`,
    # and declaration order is the tiebreaker in `_select_model_for_task`, so
    # adding this class to GLM's `use_for` puts the flat-rate rung ahead of the
    # metered Gemini rung without reordering anything.
    #
    # QUOTA HONESTY, recorded rather than implied: `cloud-glm` is a flat-rate
    # z.ai Coding Plan with a HARD PERIODIC CEILING (5-hour, weekly and MCP
    # quotas), NOT a per-token meter. Pointing these three prose classes at it
    # spends the SAME plan quota the operator's own GLM coding usage draws on.
    # That is why it sits BELOW the free OpenRouter rung and is never an
    # unconditional primary (the standing OMN-6790 discipline). When the cap
    # trips, `bifrost_delegation.yaml`'s `provider_quota_policy` classifies
    # z.ai 1310 as `disable_until_reset` (parsed from the provider's own stated
    # reset) and 1113 as a WRONG-ENDPOINT alert that is NEVER a billing action;
    # `_backend_routable` then skips the backend by quota domain, so a trip
    # falls through to the next model in the SAME tier rather than stranding the
    # class.
    #
    # The `claude` ceiling tier is deliberately NOT added. Its only model
    # resolves to backend `cloud-gemini-pro`, which carries the SAME provider
    # and the SAME `llm.gemini.api_key` secret_ref as `cheap_cloud`'s Gemini
    # rung (`cloud-gemini-flash`) -- verified in bifrost_delegation.yaml this
    # ticket. A fourth rung would therefore buy a fourth attempt and ~20s of
    # added latency against the identical quota domain, with zero
    # quota-domain independence. Reopen that only if the ceiling is repointed
    # to a genuinely separate provider.
    escalation_policy:
      max_escalations: 2
      tier_order:
        - local
        - cheap_frontier
        - cheap_cloud
  research:
    gateway_exposure: public
    output_contract: {output_shape: markdown, start_marker: "### ANSWER"}
    selection:
      priority: 50
      phrases:
        - "research"
        - "investigate"
        - "look into"
        - "find out"
        - "what does"
        - "what is"
        - "survey"
    required_capabilities:
      - context_window_large
      - reasoning
    # OMN-13215: research declares ``claude`` as its escalation ceiling tier, which
    # is the HTTP frontier ceiling backend. OMN-13351 repointed that backend off the
    # dead Anthropic cloud-sonnet to the resolvable Gemini cloud-gemini-pro
    # (gemini-2.5-flash, served on the AI Studio free-tier key → ceiling tier cost
    # 0.0). This 0.015 cap stays as a generous ceiling-cap headroom (the 0.0 ceiling
    # tier is well under it); the prior $0.002 ceiling contradicted the tier_order —
    # it only "worked" while the ceiling was the free codex-cli OAuth tier.
    pricing_ceiling_per_1k_tokens: 0.015
    latency_sla_p99_ms: 60000
    cloud_routing_policy: allowed
    definition_of_done:
      deterministic:
        - response_non_empty
      heuristic:
        - no_refusal
        # OMN-13354: research is a PROSE research task (cites theorems / papers /
        # sections), NOT a code review. The prior `cites_specific_lines` +
        # `explains_tradeoffs` pair was a catch-22: `cites_specific_lines` is a
        # CODE-line-citation regex (`line N` / `Lnn` / `:nn`) that a legitimate
        # research answer cannot satisfy, so every research output failed the gate
        # at every tier with `TASK_MISMATCH: missing specific line citations`
        # (live 2026-06-19 reprove, score 0.733). `cites_sources` is the
        # research-appropriate citation check (references / theorem N / [12] /
        # (Author, 2020) / URL / DOI); `methodical_analysis` replaces the narrow
        # `explains_tradeoffs` keyword form with a reasoning-structure check
        # (because / therefore / evidence / risk). A substantive, attributed
        # research answer passes; a thin/empty answer still fails. The
        # `cites_specific_lines` / `explains_tradeoffs` code-review checks stay on
