    check_class: range
    range_status: declared
    blocks:
      - routing read of the code_generation acceptance eval
    source: >-
      false-pass line of the delegation evals plan, section 2.1: among accepted answers, the share
      labelled adequate has a lower bound of at least 0.90. Measured, recorded verdict arm, first
      rater: 40 false passes in 111 accepted items (36%, Wilson 95% 28% to 45%); second rater: 46 in
      114. Line verdict MISSED. Report: reports/2026-09-30-delegation-gate-false-pass-first-run.md
      (eval runs 02ef53fd-8f09-5f9d-80d0-f41db6cbbfe2, 38ff2fb6-b4bb-5e79-90b9-e6f611fef56e). An
      item the replay cannot decide counts against the line.
    acceptance_line:
      check_id: delegation.acceptance.false_pass.code_generation
      case_set: >-
        accepted delegation gate decisions of class code_generation, house tenant, dev lane,
        labelled adequate or inadequate
      floor: 0.90
      window: trailing 30 days
      method:
        sample_size: 100
        confidence: 0.95
        power: 0.8
        margin: 0.07
        incomplete_run_treatment: count_as_failure

