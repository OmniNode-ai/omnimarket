#
# routing_tiers.yaml — Declarative delegation escalation ladder.
#
# Loaded by node_delegation_routing_reducer at startup.
# To change tier order, model assignments, or retry counts, edit this file only.
# No handler changes are needed for operational tuning.
#
# Tier evaluation order: local → cheap_cloud → claude
# The handler iterates tiers top-to-bottom, stopping at the first accepted result.
# The claude-named terminal tier is preserved for task-class escalation-policy
# compatibility, but it routes to OAuth-backed headless Codex CLI rather than an
# Anthropic API-key backend.
#
# Endpoint URLs are resolved from the repo bifrost contract deep-merged with
# the user overlay at ~/.omninode/delegation/bifrost_overrides.yaml. The
# backend_id field maps each model to a backend entry in the merged contract.
# See OMN-10657 and OMN-10717.
#
# Related Tickets:
#   - OMN-8029: Delegation pipeline — local→cheap-cloud→claude routing
#   - OMN-10657: Endpoint resolution from bifrost contract, not env vars
#   - OMN-10717: Default contract + endpoint overlay merge semantics
tiers:
  - name: local
    cost_per_1k_tokens: 0.0
    models:
      - id: Qwen3.6-35B-A3B
        backend_id: local-coder
        max_context_tokens: 65536
        use_for:
          - code_generation
          - code_review
          - refactor
          - test
          - research
      - id: Qwen3.6-27B-MTP-IQ4_XS.gguf
        backend_id: local-reasoner
        max_context_tokens: 24576
        use_for:
          - test
          - research
          - reasoning
          - planning
          - review
          - document
        fast_path_threshold_tokens: 24576
      - id: Qwen3.6-35B-A3B
        backend_id: local-heavy-reasoning
        max_context_tokens: 8192
        use_for:
          - research
          - reasoning
          - complex_reasoning
          - planning
          - review
          - document
        fast_path_threshold_tokens: 8192
      - id: ds-v4-flash
        backend_id: local-ds-v4-flash
        max_context_tokens: 65536
        use_for:
          - research
          - reasoning
          - complex_reasoning
          - code_generation
        fast_path_threshold_tokens: 8192
    eval_before_accept: true
    eval_model: qwen3.6-35b
    max_retries: 2
  - name: cheap_cloud
    cost_per_1k_tokens: 0.002
    models:
      # OpenRouter GLM Flash — primary cheap-cloud code-gen backend (OMN-7980).
      # Requires OPENROUTER_API_KEY. Falls back to glm-z-ai when key absent.
      - id: openrouter-glm-flash
        backend_id: openrouter-glm-flash
        max_context_tokens: 131072
        use_for:
          - code_generation
          - reasoning
          - research
          - test
          - refactor
        fast_path_threshold_tokens: 8192
      - id: glm-z-ai
        backend_id: cloud-glm
        max_context_tokens: 128000
        use_for:
          - code_generation
          - reasoning
          - research
      - id: gemini-flash
        backend_id: cloud-gemini-flash
        max_context_tokens: 1000000
        use_for:
          # OMN-13140: code_generation added so the canonical cloud-escalation
          # target (AI Studio cloud-gemini-flash) is SELECTABLE for the hackathon
          # code_generation proof. Without it the cheap_cloud tier could not route
          # code_generation to Gemini and escalation never reached Google.
          - code_generation
          - summarization
          - simple_tasks
          - document
    eval_before_accept: true
    eval_model: qwen3.6-35b
    max_retries: 1
  # cheap_frontier tier — high-capability free-tier cloud models for the June 5
  # model-experimentation campaign (OMN-12492). Requires OPENROUTER_API_KEY.
  # Sits between cheap_cloud and claude to offer frontier-quality output at zero
  # marginal API cost when the key is available.
  - name: cheap_frontier
    cost_per_1k_tokens: 0.0
    models:
      # Qwen3 Coder 480B via OpenRouter free tier — cheap frontier direct (OMN-12492)
      - id: openrouter-qwen3-coder-480b
        backend_id: openrouter-qwen3-coder-480b
        max_context_tokens: 262144
        use_for:
          - code_generation
          - reasoning
          - research
          - refactor
          - test
        fast_path_threshold_tokens: 8192
    eval_before_accept: true
    eval_model: qwen3.6-35b
    max_retries: 1
  - name: claude
    cost_per_1k_tokens: 0.0
    models:
      - id: codex-cli
        backend_id: cli-codex
        max_context_tokens: 200000
        use_for:
          - escalation
          - complex_reasoning
          - agent_orchestration
          - code_generation
          - reasoning
          - planning
          - test
          - document
          - research
    eval_before_accept: false
    max_retries: 0
  # CLI agent delegation tier (OMN-10137)
  # Models dispatched via subprocess rather than HTTP API.
  # Availability confirmed at dispatch time via shutil.which inside HandlerLlmCliSubprocess.
  - name: cli_agents
    cost_per_1k_tokens: 0.002
    models:
      - id: claude-cli
        backend_id: cli-claude
        max_context_tokens: 200000
        use_for:
          - agent_delegation
          - complex_reasoning
      - id: opencode-cli
        backend_id: cli-opencode
        max_context_tokens: 200000
        use_for:
          - agent_delegation
          - code_generation
    eval_before_accept: false
    max_retries: 0
