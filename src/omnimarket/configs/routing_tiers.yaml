#
# routing_tiers.yaml — Declarative delegation escalation ladder.
#
# Loaded by node_delegation_routing_reducer at startup.
# To change tier order, model assignments, or retry counts, edit this file only.
# No handler changes are needed for operational tuning.
#
# Tier evaluation order: local → cheap_cloud → claude
# The handler iterates tiers top-to-bottom, stopping at the first accepted result.
#
# OMN-13215: every tier — INCLUDING the ceiling (claude) — resolves provider +
# endpoint + model + api_key_ref per-tier from this contract deep-merged with the
# overlay, and executes through the canonical HTTP inference path (Bifrost
# complete-URL-from-contract) identical to the lower tiers. The ceiling tier model
# maps to an HTTP frontier backend (default backend_id ``cloud-gemini-pro`` since
# OMN-13351 — repointed off the dead Anthropic ``cloud-sonnet``); it is
# swappable across gemini / glm / openrouter / claude purely via contract overlay
# (repoint the model's backend_id, or override the backend's endpoint_url /
# model_name / secret_ref) — no code change, no env var, no CLI shell-out. The
# former shelled ``codex-cli`` / ``cli_agents`` tiers were REMOVED.
#
# Endpoint URLs are resolved from the repo bifrost contract deep-merged with
# the user overlay at ~/.omninode/delegation/bifrost_overrides.yaml. The
# backend_id field maps each model to a backend entry in the merged contract.
# See OMN-10657 and OMN-10717.
#
# Related Tickets:
#   - OMN-8029: Delegation pipeline — local→cheap-cloud→claude routing
#   - OMN-10657: Endpoint resolution from bifrost contract, not env vars
#   - OMN-10717: Default contract + endpoint overlay merge semantics
#   - OMN-13215: Canonical, provider-swappable ceiling tier; remove shelled CLI
tiers:
  - name: local
    cost_per_1k_tokens: 0.0
    # OMN-13234: typed per-tier cost model. local is served on owned GPUs
    # (.201/.200) — no marginal API cost. The dollar figure for a local call,
    # when surfaced, comes from the pricing manifest's GPU compute_cost
    # (electricity + amortization), not a per-token rate.
    cost:
      cost_type: free_local
    models:
      - id: Qwen3.6-35B-A3B
        backend_id: local-coder
        max_context_tokens: 65536
        use_for:
          - code_generation
          - code_review
          - refactor
          - test
          - research
      - id: Qwen3.6-27B-MTP-IQ4_XS.gguf
        backend_id: local-reasoner
        max_context_tokens: 24576
        use_for:
          - test
          - research
          - reasoning
          - planning
          - review
          - document
        fast_path_threshold_tokens: 24576
      - id: Qwen3.6-35B-A3B
        backend_id: local-heavy-reasoning
        max_context_tokens: 8192
        use_for:
          - research
          - reasoning
          - complex_reasoning
          - planning
          - review
          - document
        fast_path_threshold_tokens: 8192
      - id: ds-v4-flash
        backend_id: local-ds-v4-flash
        max_context_tokens: 65536
        use_for:
          - research
          - reasoning
          - complex_reasoning
          - code_generation
        fast_path_threshold_tokens: 8192
    eval_before_accept: true
    eval_model: qwen3.6-35b
    max_retries: 2
  - name: cheap_cloud
    cost_per_1k_tokens: 0.002
    # OMN-13234: metered tier — billed per token at a fixed rate (direct z.ai
    # GLM key + Gemini Flash key), no monthly cap. Mirrors the legacy
    # cost_per_1k_tokens above; the typed model is the authoritative source for
    # the projection's actual-cost computation.
    cost:
      cost_type: metered
      rate_per_1k_usd: 0.002
    models:
      # OMN-13380: Direct z.ai GLM-5.2 — PRIMARY cheap-cloud code-gen backend.
      # We hold a resolvable DIRECT GLM key (secret_ref llm.glm.api_key), so GLM
      # routes direct to z.ai (backend cloud-glm) rather than through the
      # OpenRouter aggregator. The former openrouter-glm-flash primary entry was
      # REMOVED: OpenRouter is reserved for genuinely FREE models (the
      # cheap_frontier Qwen3-Coder-480B free tier) — paying an aggregator markup
      # for a model we can hit directly with our own key is a routing-cost bug,
      # not a fallback strategy. model_name (glm-5.2) is resolved from the
      # cloud-glm backend in bifrost_delegation.yaml (OMN-13343 verified id).
      - id: glm-5.2
        backend_id: cloud-glm
        max_context_tokens: 128000
        use_for:
          - code_generation
          # OMN-13541: code_review added so the cheap_cloud tier is a real
          # escalation fallback for code_review (its escalation_policy.tier_order
          # is [local, cheap_cloud]). Without it code_review could only route to
          # the single local-coder backend — a single point of failure.
          - code_review
          - reasoning
          - research
          - test
          - refactor
        fast_path_threshold_tokens: 8192
      - id: gemini-flash
        backend_id: cloud-gemini-flash
        max_context_tokens: 1000000
        use_for:
          # OMN-13140: code_generation added so the canonical cloud-escalation
          # target (AI Studio cloud-gemini-flash) is SELECTABLE for the hackathon
          # code_generation proof. Without it the cheap_cloud tier could not route
          # code_generation to Gemini and escalation never reached Google.
          - code_generation
          - summarization
          - simple_tasks
          - document
      # OMN-12971: Vertex-served Gemini (ADC / $500-credit path), ADDITIVE next to
      # gemini-flash (AI Studio key path). Both routes stay selectable; the Vertex
      # entry uses backend_id cloud-vertex-gemini, whose secret_ref is
      # llm.vertex.access_token — a short-lived OAuth bearer token minted from ADC,
      # resolved fail-closed at the effect boundary and posted as Authorization:
      # Bearer <token> via the standard api-key path (no token VALUE committed).
      - id: vertex-gemini-flash
        backend_id: cloud-vertex-gemini
        max_context_tokens: 1000000
        use_for:
          - summarization
          - simple_tasks
          - document
    eval_before_accept: true
    eval_model: qwen3.6-35b
    max_retries: 1
  # cheap_frontier tier — high-capability free-tier cloud models for the June 5
  # model-experimentation campaign (OMN-12492). Requires OPENROUTER_API_KEY.
  # Sits between cheap_cloud and claude to offer frontier-quality output at zero
  # marginal API cost when the key is available.
  - name: cheap_frontier
    cost_per_1k_tokens: 0.0
    # OMN-13234: free_local-class cost — the OpenRouter Qwen3-Coder-480B entry is
    # the genuinely FREE tier (zero marginal API cost). Modeled as free_local so
    # the projection records 0 actual cost without a per-token rate.
    cost:
      cost_type: free_local
    models:
      # Qwen3 Coder 480B via OpenRouter free tier — cheap frontier direct (OMN-12492)
      - id: openrouter-qwen3-coder-480b
        backend_id: openrouter-qwen3-coder-480b
        max_context_tokens: 262144
        use_for:
          - code_generation
          - reasoning
          - research
          - refactor
          - test
        fast_path_threshold_tokens: 8192
    eval_before_accept: true
    eval_model: qwen3.6-35b
    max_retries: 1
  # Ceiling tier (OMN-13215). Executes through the canonical HTTP inference path
  # like every lower tier — NO subprocess, NO shelled CLI. The model maps to an
  # HTTP frontier backend. To swap the ceiling provider (gemini / glm / openrouter
  # / claude) edit ONLY this contract/overlay: repoint backend_id to another HTTP
  # backend, or override that backend's endpoint_url / model_name / secret_ref in
  # bifrost_overrides.yaml. No code change required.
  #
  # OMN-13351: the ceiling backend was repointed from the dead Anthropic
  # ``cloud-sonnet`` (secret_ref llm.anthropic.api_key, which resolves to None in
  # every lane — this org has NO Anthropic key, Claude Code is OAuth) to the
  # resolvable Gemini frontier backend ``cloud-gemini-pro`` (secret_ref
  # llm.gemini.api_key, model gemini-2.5-flash). The 2026-06-19 stability-test
  # escalation reprove proved the Anthropic key resolves to None and the ceiling
  # terminated ``no_routable_backend_for_task`` on every escalation; a live
  # key-resolution + 1-token model probe this ticket confirmed llm.gemini.api_key
  # resolves and gemini-2.5-flash returns HTTP 200 (gemini-2.5-pro is quota-zero
  # 429 on the only resolvable Gemini key, OMN-12890-class free-tier exhaustion).
  #
  # The tier slot is kept named ``claude`` because every task-class
  # escalation_policy.tier_order and the handler cost_tier_map key on this literal
  # tier name; ``claude`` is now a stable ceiling-slot identifier, NOT a provider
  # claim. The backend it routes to is provider-correct (Gemini). cost_per_1k_tokens
  # drops 0.015 -> 0.0 because gemini-2.5-flash is served on the AI Studio free-tier
  # key (no marginal API cost), matching the resolved-key reality.
  - name: claude
    cost_per_1k_tokens: 0.0
    # OMN-13234: ceiling tier now routes to gemini-2.5-flash on the AI Studio
    # free-tier key (OMN-13351), so there is no marginal API cost — modeled as
    # free_local-class zero cost. If the ceiling is later repointed to a metered
    # frontier backend, switch cost_type to metered with the billed rate.
    cost:
      cost_type: free_local
    models:
      - id: gemini-2.5-flash
        backend_id: cloud-gemini-pro
        max_context_tokens: 1000000
        use_for:
          - escalation
          - complex_reasoning
          - agent_orchestration
          - code_generation
          - reasoning
          - planning
          - test
          - document
          - research
    eval_before_accept: false
    max_retries: 0
