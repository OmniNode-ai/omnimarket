#
# routing_tiers.yaml — Declarative delegation escalation ladder.
#
# Loaded by node_delegation_routing_reducer at startup.
# To change tier order, model assignments, or retry counts, edit this file only.
# No handler changes are needed for operational tuning.
#
# Tier evaluation order: local → cheap_cloud → claude
# The handler iterates tiers top-to-bottom, stopping at the first accepted result.
#
# OMN-13215: every tier — INCLUDING the ceiling (claude) — resolves provider +
# endpoint + model + api_key_ref per-tier from this contract deep-merged with the
# overlay, and executes through the canonical HTTP inference path (Bifrost
# complete-URL-from-contract) identical to the lower tiers. The ceiling tier model
# maps to an HTTP frontier backend (default backend_id ``cloud-gemini-pro`` since
# OMN-14625 — repointed off direct z.ai GLM (``cloud-glm``), whose route is DEAD
# from the .201 runtime (resolve_api_key succeeds but every completion call
# 401s / loops FAILED-only); OMN-13667 previously repointed off free-tier AI
# Studio Gemini that 503s on escalation; OMN-13351 before that repointed off
# the dead Anthropic ``cloud-sonnet``); it is swappable across gemini / glm /
# openrouter / claude purely via contract overlay (repoint the model's
# backend_id, or override the backend's endpoint_url / model_name /
# secret_ref) — no code change, no env var, no CLI shell-out. The former
# shelled ``codex-cli`` / ``cli_agents`` tiers were REMOVED.
#
# Endpoint URLs are resolved from the repo bifrost contract deep-merged with
# the user overlay at ~/.omninode/delegation/bifrost_overrides.yaml. The
# backend_id field maps each model to a backend entry in the merged contract.
# See OMN-10657 and OMN-10717.
#
# Related Tickets:
#   - OMN-8029: Delegation pipeline — local→cheap-cloud→claude routing
#   - OMN-10657: Endpoint resolution from bifrost contract, not env vars
#   - OMN-10717: Default contract + endpoint overlay merge semantics
#   - OMN-13215: Canonical, provider-swappable ceiling tier; remove shelled CLI
#   - OMN-14625: GLM z.ai route dead from .201 — cheap_cloud/ceiling/judge
#     repointed to Gemini (cloud-gemini-pro)
tiers:
  - name: local
    cost_per_1k_tokens: 0.0
    # OMN-13234: typed per-tier cost model. local is served on owned GPUs
    # (.201/.200) — no marginal API cost. The dollar figure for a local call,
    # when surfaced, comes from the pricing manifest's GPU compute_cost
    # (electricity + amortization), not a per-token rate.
    cost:
      cost_type: free_local
    models:
      # OMN-16419: was "Qwen3.6-35B-A3B" — repointed to match the corrected
      # bifrost_delegation.yaml local-coder model_name (live-verified served id
      # "qwen3.8" at .201:8000). Keeping this id in sync with the backend's
      # model_name is required for the task_model_overrides id-match escape
      # hatch in task_class_contracts.v1.yaml to resolve (see that file's
      # header comment) — a mismatch here would strand routing.
      - id: qwen3.8
        backend_id: local-coder
        max_context_tokens: 65536
        # OMN-13599 (SUPERSEDED by OMN-16442 for `test`): local-coder was the
        # CODE backend only; `test` and `research` were removed here so the
        # code-only fast_path_threshold did not bleed local-coder into task
        # types the local-reasoner rung owned. That rung is GONE — OMN-16442
        # deleted the local-reasoner entry because its endpoint (.201:8001) is
        # the RTX 4090 slot physically removed for RMA (OMN-16407; re-probed
        # 2026-08-28: `curl .201:8001/v1/models` → exit 7
        # "Couldn't connect to server"). `test` was left with ZERO local rung
        # by that deletion, so it is restored here rather than demoted to the
        # metered cheap_cloud tier. This is not a reversal of OMN-13599's
        # reasoning: bifrost_delegation.yaml's `test` routing_rule ALREADY
        # declares backend_ids [local-coder, cloud-gemini-pro], so the two
        # surfaces now agree instead of contradicting each other. `research`
        # is deliberately NOT restored here — it keeps two live local rungs
        # (local-heavy-reasoning, local-ds-v4-flash) without local-coder.
        #
        # OMN-15630: validator_generation added — its DoD (compiles_without_errors,
        # final_artifact_only, passes_existing_tests) is an exact match for
        # code_generation's, and required_capabilities is {code_completion}, a
        # subset of code_generation's. Before this the class had NO local server
        # (task_class_contracts.v1.yaml declares it with no task_model_overrides
        # entry, so unpinned selection returned None on every local-tier model —
        # a routing-completeness gap, not a deliberate cloud-only class).
        use_for:
          - code_generation
          - code_review
          - refactor
          - validator_generation
          # OMN-16442: restored — see the block comment above.
          - test
        # OMN-13599: AI-PC local-coder is the preferred local code backend when
        # its Tailscale hostname overlay is present. Without a threshold, the
        # fast-path selector can prefer later local models that also declare
        # code_generation.
        fast_path_threshold_tokens: 65536
      # OMN-16442: the `local-reasoner` rung (id Qwen3.6-27B-MTP-IQ4_XS.gguf,
      # .201:8001) was DELETED here. That endpoint is the RTX 4090 slot
      # physically removed from .201 for RMA (OMN-16407); re-probed 2026-08-28
      # against the canonical inventory (omni_home/docs/reference/
      # AI_LAB_HARDWARE.md, "Last verified: 2026-08-28"), `curl
      # .201:8001/v1/models` returns exit 7 "Couldn't connect
      # to server" and the inventory marks the slot DEAD / RETIRED. It was the
      # FIRST unpinned pick for test/research/reasoning/planning/review/
      # document/documentation/summarization (OMN-16442's defect report), so
      # every one of those requests paid a health-probe-then-fallback round
      # trip to reach a live backend. Its task types are rehomed, not dropped:
      # `test` -> local-coder above; documentation + summarization ->
      # local-heavy-reasoning below; research/reasoning/planning/review/
      # document were already served by local-heavy-reasoning and/or
      # local-ds-v4-flash. Proof that no task_type lost its last backend is the
      # before/after resolution table on OMN-16442 and
      # test_no_task_type_loses_its_last_local_backend_omn16442.
      # OMN-16419: was "Qwen3.6-35B-A3B" — same repoint as local-coder above
      # (same .201:8000 SGLang endpoint, live-verified served id "qwen3.8").
      # OMN-16442 re-probe 2026-08-28: GET .201:8000/v1/models still reports
      # id "qwen3.8" with max_model_len 122880. The endpoint currently permits
      # ONE running generation request, so concurrency must be queued ABOVE
      # the model server — a second concurrent delegation to this backend
      # queues rather than parallelizes. local-coder and local-heavy-reasoning
      # are the SAME physical endpoint, so that single-slot budget is shared
      # across both rungs.
      - id: qwen3.8
        backend_id: local-heavy-reasoning
        max_context_tokens: 8192
        use_for:
          - research
          - reasoning
          - complex_reasoning
          - planning
          - review
          - document
          # OMN-16811: escalation added. Before this the escalation class's
          # ENTIRE ladder was one rung — claude/cloud-gemini-pro — the only
          # admitted class with no credential-free fallback, so a
          # quota-exhausted or unreachable Gemini stranded it while every
          # other class kept routing on the owned GPUs (dev-lane matrix: 11 of
          # 13 classes terminated, escalation did not). This backend already
          # serves ``complex_reasoning``, the hardest reasoning class in the
          # taxonomy, so serving escalation's declared ``reasoning`` capability
          # is not a new claim. escalation's other declared capability,
          # ``context_window_large``, stays mechanically honoured rather than
          # asserted: ``max_context_tokens`` (8192 here) excludes this model
          # from selection for any prompt that does not fit, which escalates to
          # the large-window rungs below / the ceiling instead.
          - escalation
          # OMN-16442: documentation and summarization rehomed here from the
          # deleted local-reasoner rung. Both are the prose family OMN-15630
          # placed alongside `document`, which this backend already serves with
          # the identical required_capabilities/pricing/latency profile — so
          # this inherits an existing placement rather than making a new
          # capability claim. Without it both classes would have had NO local
          # rung at all and would fall straight to the metered cheap_cloud
          # tier.
          - documentation
          - summarization
        fast_path_threshold_tokens: 8192
      # OMN-16442: `id` here is the routing CATALOG KEY, not the served id —
      # the served ids at .200:8101 are {deepseek-v4-flash, deepseek-v4-pro}
      # (live readback 2026-08-28), and bifrost_delegation.yaml's
      # local-ds-v4-flash.model_name carries the served id per OMN-16833.
      - id: ds-v4-flash
        backend_id: local-ds-v4-flash
        max_context_tokens: 65536
        use_for:
          - research
          - reasoning
          - complex_reasoning
          - code_generation
          # OMN-16811: escalation added here too — this is the LARGE-window
          # local rung (65536 vs local-heavy-reasoning's 8192), so an
          # escalation prompt too big for the entry above binds here instead of
          # jumping straight to the metered ceiling. Live-lane caveat recorded
          # on the ticket: this backend's endpoint_url is null in the deployed
          # dev-lane bifrost contract, so on that lane the rung above is the
          # one that carries escalation today.
          - escalation
        fast_path_threshold_tokens: 8192
      # OMN-16442: the `local-coder-mlx` rung (id
      # mlx-community/Qwen3.6-35B-A3B-8bit, .200:8401) was DELETED here for the
      # same reason as local-reasoner above — the endpoint is dead and the
      # named artifact is served nowhere on the fleet. Live probe 2026-08-28:
      # `curl .200:8401/v1/models` → exit 7 "Couldn't connect
      # to server". The Mac Studio's MLX server was replaced (canonical
      # inventory omni_home/docs/reference/AI_LAB_HARDWARE.md, verified
      # 2026-08-28): it now serves `Qwen3.8-27B-8bit` on 127.0.0.1:8099 and is
      # bound LOCALHOST-ONLY, so it is not reachable from the .201 runtime and
      # must NOT be re-registered as a routable rung until it has explicit
      # availability semantics + a health check — the same gate the inventory
      # places on the mini/laptop/Gemma-canary endpoints. That re-registration
      # is the scoped follow-on recorded on OMN-16442, not this pass.
      #
      # OMN-15180's same-tier fallback (sibling_backend_available_in_tier) is
      # NOT lost: code_generation keeps two local siblings (local-coder,
      # local-ds-v4-flash), so a transport failure on the first still retries
      # inside `local` before escalating to cheap_cloud.
    eval_before_accept: true
    eval_model: qwen3.6-35b
    max_retries: 2
  - name: cheap_cloud
    cost_per_1k_tokens: 0.002
    # OMN-13234: metered tier — billed per token at a fixed rate (direct z.ai
    # GLM key + Gemini Flash key), no monthly cap. Mirrors the legacy
    # cost_per_1k_tokens above; the typed model is the authoritative source for
    # the projection's actual-cost computation.
    cost:
      cost_type: metered
      rate_per_1k_usd: 0.002
    models:
      # OMN-14625: PRIMARY cheap-cloud code-gen backend repointed off direct
      # z.ai GLM (backend cloud-glm) to Gemini (backend cloud-gemini-pro,
      # model gemini-2.5-flash). The z.ai GLM route is DEAD from the .201
      # runtime (OMN-14625 forensics: resolve_api_key succeeds but every
      # completion call 401s / loops FAILED-only — see
      # reference_glm_zai_wiring_and_consumers). Gemini's cloud-gemini-pro
      # backend is proven resolvable (secret_ref llm.gemini.api_key, live
      # 200s) and is already the ceiling's Gemini entry below, so this reuses
      # a backend already known-good on this lane rather than introducing a
      # new one.
      - id: gemini-2.5-flash
        backend_id: cloud-gemini-pro
        max_context_tokens: 1000000
        use_for:
          - code_generation
          # OMN-13541: code_review added so the cheap_cloud tier is a real
          # escalation fallback for code_review (its escalation_policy.tier_order
          # is [local, cheap_cloud]). Without it code_review could only route to
          # the single local-coder backend — a single point of failure.
          - code_review
          - reasoning
          - research
          - test
          - refactor
          # OMN-15503: these classes declare cheap_cloud as a closed-set
          # fallback, so the tier must explicitly serve them rather than remain
          # a decorative/unreachable policy rung.
          - planning
          - review
          # OMN-15961: agent_delegation REMOVED here too — see the local-tier
          # comment above (routing_tiers.yaml:88-98) for the full rationale.
          # This entry was the same false capability claim one tier over.
          # OMN-15630: validator_generation added — mirrors code_generation/
          # test/refactor above (same DoD family); the class declared
          # cheap_cloud in its closed tier_order but no cheap_cloud model
          # served it, another decorative/unreachable rung of the class above.
          - validator_generation
        fast_path_threshold_tokens: 8192
      - id: gemini-flash
        backend_id: cloud-gemini-flash
        max_context_tokens: 1000000
        use_for:
          # OMN-13599: Gemini remains available for prose/simple work, but it is
          # intentionally not a code_generation fallback. Code routes local first,
          # then direct z.ai GLM, avoiding the AI Studio failures seen in dogfood.
          - summarization
          - simple_tasks
          - document
          # OMN-15630: documentation is document's docstring-flavored sibling
          # (same required_capabilities/pricing/latency profile); mirrors
          # document's existing placement on this backend.
          - documentation
      # OMN-12971: Vertex-served Gemini (ADC / $500-credit path), ADDITIVE next to
      # gemini-flash (AI Studio key path). Both routes stay selectable; the Vertex
      # entry uses backend_id cloud-vertex-gemini, whose secret_ref is
      # llm.vertex.access_token — a short-lived OAuth bearer token minted from ADC,
      # resolved fail-closed at the effect boundary and posted as Authorization:
      # Bearer <token> via the standard api-key path (no token VALUE committed).
      - id: vertex-gemini-flash
        backend_id: cloud-vertex-gemini
        max_context_tokens: 1000000
        use_for:
          - summarization
          - simple_tasks
          # OMN-15630: mirrors gemini-flash above (same secondary route for
          # documentation's cheap_cloud rung).
          - documentation
          - document
    eval_before_accept: true
    eval_model: qwen3.6-35b
    max_retries: 1
  # cheap_frontier tier — high-capability free-tier cloud models for the June 5
  # model-experimentation campaign (OMN-12492). Requires OPENROUTER_API_KEY.
  # Sits between cheap_cloud and claude to offer frontier-quality output at zero
  # marginal API cost when the key is available.
  - name: cheap_frontier
    cost_per_1k_tokens: 0.0
    # OMN-13234: free_local-class cost — the OpenRouter Qwen3-Coder-480B entry is
    # the genuinely FREE tier (zero marginal API cost). Modeled as free_local so
    # the projection records 0 actual cost without a per-token rate.
    cost:
      cost_type: free_local
    models:
      # Qwen3 Coder 480B via OpenRouter free tier — cheap frontier direct (OMN-12492)
      - id: openrouter-qwen3-coder-480b
        backend_id: openrouter-qwen3-coder-480b
        max_context_tokens: 262144
        use_for:
          - code_generation
          - reasoning
          - research
          - refactor
          - test
        fast_path_threshold_tokens: 8192
    eval_before_accept: true
    eval_model: qwen3.6-35b
    max_retries: 1
  # Ceiling tier (OMN-13215). Executes through the canonical HTTP inference path
  # like every lower tier — NO subprocess, NO shelled CLI. The model maps to an
  # HTTP frontier backend. To swap the ceiling provider (gemini / glm / openrouter
  # / claude) edit ONLY this contract/overlay: repoint backend_id to another HTTP
  # backend, or override that backend's endpoint_url / model_name / secret_ref in
  # bifrost_overrides.yaml. No code change required.
  #
  # OMN-13351: the ceiling backend was repointed from the dead Anthropic
  # ``cloud-sonnet`` (secret_ref llm.anthropic.api_key, which resolves to None in
  # every lane — this org has NO Anthropic key, Claude Code is OAuth) to the
  # resolvable Gemini frontier backend ``cloud-gemini-pro`` (secret_ref
  # llm.gemini.api_key, model gemini-2.5-flash). The 2026-06-19 stability-test
  # escalation reprove proved the Anthropic key resolves to None and the ceiling
  # terminated ``no_routable_backend_for_task`` on every escalation; a live
  # key-resolution + 1-token model probe this ticket confirmed llm.gemini.api_key
  # resolves and gemini-2.5-flash returns HTTP 200 (gemini-2.5-pro is quota-zero
  # 429 on the only resolvable Gemini key, OMN-12890-class free-tier exhaustion).
  #
  # OMN-13667: ceiling repointed a second time — from free-tier AI Studio Gemini
  # (cloud-gemini-pro, gemini-2.5-flash) which 503s on every escalation to
  # GLM-5.2 z.ai direct (cloud-glm, secret_ref llm.glm.api_key) — the proven
  # backend already used by the judge lane and the cheap_cloud tier. Cost model
  # updated to metered (0.002 / 1k tokens) to match the billed z.ai direct key.
  # max_retries raised 0 → 2 for resilience against transient z.ai errors.
  # A fallback model entry (openrouter-qwen3-coder-480b, separate provider,
  # genuinely free tier) is added so the ceiling is not a single point of failure.
  #
  # OMN-14625: ceiling repointed a THIRD time — from GLM-5.2 z.ai direct
  # (cloud-glm) back to Gemini (cloud-gemini-pro, gemini-2.5-flash). The z.ai
  # GLM route is DEAD from the .201 runtime: resolve_api_key succeeds but every
  # completion call 401s / loops FAILED-only (forensics this ticket; see memory
  # reference_glm_zai_wiring_and_consumers). The openrouter-qwen3-coder-480b
  # fallback entry added under OMN-13667 is REMOVED — with the primary ceiling
  # back on a proven-resolvable backend, the free-aggregator fallback is not
  # worth its markup-avoidance tradeoff on the ceiling slot specifically
  # (cheap_frontier below still carries the same OpenRouter model for the
  # lower-cost escalation path).
  #
  # The tier slot is kept named ``claude`` because every task-class
  # escalation_policy.tier_order and the handler cost_tier_map key on this literal
  # tier name; ``claude`` is now a stable ceiling-slot identifier, NOT a provider
  # claim.
  - name: claude
    cost_per_1k_tokens: 0.002
    # OMN-14625: ceiling repointed off GLM-5.2 z.ai direct (cloud-glm) to Gemini
    # (cloud-gemini-pro) — same billed/metered rate class as cheap_cloud above.
    cost:
      cost_type: metered
      rate_per_1k_usd: 0.002
    models:
      # OMN-14625: primary ceiling model repointed from GLM-5.2 z.ai direct
      # (cloud-glm) to Gemini (cloud-gemini-pro, model gemini-2.5-flash). The
      # z.ai GLM route is DEAD from the .201 runtime — resolve_api_key succeeds
      # but every completion call 401s / loops FAILED-only (OMN-14625
      # forensics; see reference_glm_zai_wiring_and_consumers). Gemini's
      # cloud-gemini-pro backend is proven resolvable on this lane (live 200s,
      # secret_ref llm.gemini.api_key). The OpenRouter Qwen3-Coder-480B
      # fallback entry that previously sat below GLM is REMOVED from this
      # ceiling: it is not a routine escalation backend (OpenRouter is
      # reserved for the genuinely-free cheap_frontier tier per OMN-14225
      # policy), and with the primary ceiling now on a proven-resolvable
      # backend a paid-tier single point of failure is preferable to a free
      # aggregator markup as the ceiling's own fallback.
      - id: gemini-2.5-flash
        backend_id: cloud-gemini-pro
        max_context_tokens: 1000000
        use_for:
          - escalation
          - complex_reasoning
          # OMN-15961: agent_delegation REMOVED — see the local-tier comment
          # (routing_tiers.yaml:88-98) for the full rationale. OMN-15503's
          # framing ("agent_orchestration is the required-capability label,
          # not a routable task taxonomy value") was itself the false
          # premise: agent_orchestration IS the capability this ceiling
          # cannot provide, which is exactly why claiming agent_delegation
          # here was wrong.
          - code_generation
          - reasoning
          - planning
          - test
          - document
          - research
          # OMN-15630: refactor and validator_generation added. Both classes
          # declare `claude` as their tier_order ceiling but this backend did
          # not serve either — the ceiling rung was unreachable (refactor's
          # explicit task_model_overrides pin to this exact model id already
          # resolved here regardless of use_for, and validator_generation's
          # implicit default_task_model_ref pin does not match this tier's id,
          # so both silently terminated no_routable_backend_for_task instead
          # of reaching a capability that already declares code_generation/
          # test for the identical DoD family).
          - refactor
          - validator_generation
    eval_before_accept: false
    max_retries: 2
