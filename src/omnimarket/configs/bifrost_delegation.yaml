# Routing rules — evaluated in ascending priority order.
# First matching rule wins. Each rule maps a task_class to an ordered
# list of backends to try.
#
# Required fields per rule (OMN-10637):
#   rule_id: stable UUID for audit provenance
#   task_class_contract_version: version of the contract this rule targets
#   backend_policy_version: version of the backend policy applied
#   fallback_policy: what to do when all backends in backend_ids fail
#   shadow_policy_id: UUID of the shadow policy used for A/B evaluation
routing_rules:
  # ── code_generation ──────────────────────────────────────────────────────
  # Route code generation to local coder first (zero API cost),
  # then try the existing non-Gemini free cloud rungs for reliability.
  - rule_id: "d4e5f6a7-0001-4000-8000-000000000001"
    priority: 10
    task_class: code_generation
    task_class_contract_version: "1.0.0"
    backend_policy_version: "2.0.0"
    match_operation_types:
      - chat_completion
      - completion
    match_capabilities:
      - code_generation
    latency_sla_ms: 30000
    backend_ids:
      - local-coder
      - openrouter-qwen3-coder-480b
      - openrouter-nemotron-super
      - openrouter-north-mini-code
    fallback_policy:
      action: escalate_to_next_tier
      max_retries: 2
      on_exhaust: return_error
    shadow_policy_id: "e5f6a7b8-0001-4000-8000-000000000001"
  # ── test ────────────────────────────────────────────────────────────────
  # Unit-test generation is code generation with stricter quality gates.
  # Route locally first with a longer timeout because test artifacts regularly
  # approach the 30s boundary on quantized local models.
  - rule_id: "d4e5f6a7-0004-4000-8000-000000000004"
    priority: 15
    task_class: test
    task_class_contract_version: "1.0.0"
    backend_policy_version: "2.0.0"
    match_operation_types:
      - chat_completion
      - completion
    match_capabilities:
      - code_generation
    latency_sla_ms: 60000
    backend_ids:
      - local-coder
      - openrouter-qwen3-coder-480b
      - openrouter-nemotron-super
      - openrouter-north-mini-code
    fallback_policy:
      action: escalate_to_next_tier
      max_retries: 1
      on_exhaust: return_error
    shadow_policy_id: "e5f6a7b8-0004-4000-8000-000000000004"
  # ── documentation ────────────────────────────────────────────────────────
  # Documentation tasks start locally, then try the existing free cloud rungs.
  - rule_id: "d4e5f6a7-0002-4000-8000-000000000002"
    priority: 20
    task_class: documentation
    task_class_contract_version: "1.0.0"
    backend_policy_version: "2.0.0"
    match_operation_types:
      - chat_completion
      - completion
    match_capabilities:
      - documentation
    cost_ceiling_usd_per_1k_tokens: 0.004
    backend_ids:
      - local-coder
      - openrouter-qwen3-coder-480b
      - openrouter-nemotron-super
      - openrouter-north-mini-code
    fallback_policy:
      action: escalate_to_next_tier
      max_retries: 1
      on_exhaust: return_error
    shadow_policy_id: "e5f6a7b8-0002-4000-8000-000000000002"
  # ── research ─────────────────────────────────────────────────────────────
  # Research tasks require deep reasoning; route to the heavy-reasoning local
  # slot first, then the existing non-Gemini free cloud rungs.
  - rule_id: "d4e5f6a7-0003-4000-8000-000000000003"
    priority: 30
    task_class: research
    task_class_contract_version: "1.0.0"
    backend_policy_version: "2.0.0"
    match_operation_types:
      - chat_completion
      - reasoning
    match_capabilities:
      - deep_reasoning
    # OMN-16442: `local-reasoner` removed from this list — see the deletion
    # note on the backends block above. This rule referencing it was the sole
    # reason OMN-16419 could not delete the backend definition. `research`
    # keeps two live local rungs via routing_tiers.yaml
    # (local-heavy-reasoning, local-ds-v4-flash) plus the free cloud rungs here.
    backend_ids:
      - local-heavy-reasoning
      - openrouter-qwen3-coder-480b
      - openrouter-nemotron-super
      - openrouter-north-mini-code
    fallback_policy:
      action: escalate_to_next_tier
      max_retries: 2
      on_exhaust: return_error
    shadow_policy_id: "e5f6a7b8-0003-4000-8000-000000000003"
# Default fallback when no routing rule matches.
# Attempts backends in order.
default_backends:
  - local-coder
  # OMN-17427: local backends precede the existing non-Gemini cloud rungs.
  - local-heavy-reasoning
  - openrouter-qwen3-coder-480b
  - openrouter-nemotron-super
  - openrouter-north-mini-code
# Provider quota policy (OMN-16891) — how to read a 429 from each provider.
#
# A 429 is not one failure class. Retrying the same tier on a quota-exhaustion
# 429 burns latency for a GUARANTEED failure, and retrying on a billing 429
# burns it forever. The provider's own error code distinguishes them, so the
# classification is declared here rather than inferred from the status line.
#
# Contract-first: adding a provider or recoding a disposition is an overlay
# edit, never a code change (OMN-13215).
#
# Dispositions:
#   retryable              — transient throttle; the tier may retry within its
#                            declared max_retries, then escalate normally.
#   disable_until_reset    — the plan's periodic cap is spent. Disable the tier
#                            until the reset instant the provider states in the
#                            error body, then let it re-enter the ladder.
#   disable_until_billing  — no balance / no resource package. No reset will
#                            arrive on its own, so retrying is pure waste;
#                            disable and raise an operator alert instead.
provider_quota_policy:
  schema_version: "provider_quota_policy.v1"
  # Applied when a provider match yields no explicit code entry.
  default_disposition: retryable
  providers:
    - provider_id: zai
      # Matched against the backend's endpoint_url host.
      match_endpoint_host: "api.z.ai"
      # OMN-6790: this host serves TWO PRODUCTS on two prefixes. We hold the
      # Coding Plan, served only under /api/coding/paas/v4. Declaring the
      # prefix here makes a config that points any api.z.ai backend elsewhere
      # UN-LOADABLE (config_loader_bifrost_delegation.
      # _reject_backends_off_a_declared_provider_surface), on whatever host is
      # resolving it. The two existing OMN-6790 tests scan a source checkout;
      # they were both green on 2026-08-31 while a delegation call still hit
      # /api/paas/v4, because the client ran an INSTALLED omnimarket build
      # predating the fix. This declaration is what a stale build cannot be
      # green against — it travels inside the same artifact as the endpoint.
      required_path_prefix: "/api/coding/paas/v4"
      required_path_prefix_hint: >-
        We hold a z.ai GLM Coding Plan, served ONLY at
        /api/coding/paas/v4. The bare /api/paas/v4 is the
        pay-as-you-go product, which this account does not hold; it answers a
        Coding-Plan key with 429 code 1113 "Insufficient balance or no resource
        package". That is a WRONG-ENDPOINT signal, never a billing fact, and
        never a reason to fund the account.
      codes:
        # Live-observed 2026-08-28 on the coding-plan surface, verbatim:
        #   {"error":{"code":"1310","message":"Weekly/Monthly Limit Exhausted.
        #    Your limit will reset at 2026-08-30 20:32:52"}}
        # The reset instant is parsed out of the message; when it cannot be
        # parsed the fallback cooldown below applies (fail-closed: a cap we
        # cannot time is still a cap).
        - code: "1310"
          disposition: disable_until_reset
          scope: provider
          reset_from: message_reset_timestamp
          fallback_cooldown_seconds: 3600
          alert: false
        # OMN-19432: the other two plan windows. z.ai's error-code page
        # (docs.z.ai/api-reference/api-code, read 2026-09-30) lists 1308 as
        # "Usage limit reached for {number} {unit}. Your limit will reset at
        # {next_flush_time}" -- the 5-hour credit window, same message shape as
        # 1310, and shared by every model on the plan, so it disables the
        # provider (flash and glm-5.3 alike) until the stated reset. glm-5.3
        # spends about six times flash's credits per task, so this window is the
        # one the second rung reaches first.
        - code: "1308"
          disposition: disable_until_reset
          reset_from: message_reset_timestamp
          fallback_cooldown_seconds: 3600
          alert: false
        # 1302 "Rate limit reached for requests" and 1305 "The service may be
        # temporarily overloaded" are CAPACITY signals, not quality verdicts and
        # not plan caps: nothing is disabled (a retry after a short wait works),
        # the failing rung is excluded for THIS request, and the ladder moves to
        # the next rung (flash -> glm-5.3 -> the rest of the tier). The
        # attempt is recorded with failure_class rate_limited, which the
        # projection counts as a capacity refusal (quota_refusal_count) and
        # never as a quality miss. Declared rather than left to the default so a
        # receipt reads "declared retryable" instead of "unmapped code".
        #
        # OMN-20154: both are now COOLDOWNS rather than plain retries, scoped
        # to the MODEL that answered: the key is skipped until the provider's
        # Retry-After (else the stated delay, else 60s), the ladder still moves
        # to the next rung at once (glm-5.3 after flash), and the refusal is
        # RECORDED in provider_quota_state, so the next delegation does not
        # walk into the same throttle. A retryable verdict recorded nothing.
        # Model scope, not provider scope, because the flash -> glm-5.3 fall
        # through measured by OMN-19432 answers on the other model.
        - code: "1302"
          disposition: cooldown
          scope: model
          fallback_cooldown_seconds: 60
          alert: false
        - code: "1305"
          disposition: cooldown
          scope: model
          fallback_cooldown_seconds: 60
          alert: false
        # Live-observed on the PAY-AS-YOU-GO surface (/api/paas/v4), verbatim:
        #   {"error":{"code":"1113","message":"Insufficient balance or no
        #    resource package. Please recharge."}}
        # OMN-6790: on THIS account 1113 is a WRONG-ENDPOINT signal, not a
        # billing one. We hold an active GLM Coding Plan, which is served only
        # at /api/coding/paas/v4; the same key on that surface returns 200 for
        # every probed model (see the cloud-glm backend block above, probed
        # 2026-08-30). Reaching this code means a GLM request went to the
        # pay-as-you-go product — fix the endpoint, do NOT fund the account.
        # The disposition stays disable-and-alert because retrying a
        # misrouted request is pure waste and the misroute needs a human.
        - code: "1113"
          disposition: disable_until_billing
          scope: provider
          alert: true
          # Surfaced on the alert so the on-call reads the cause, not the text.
          alert_hint: >-
            z.ai 1113 on an OmniNode GLM request means the request hit the
            pay-as-you-go surface (/api/paas/v4) with a Coding-Plan key.
            The Coding Plan path is /api/coding/paas/v4 (direct calls parked, OMN-20173).
            This is a routing defect, never a billing action.
        # OMN-20154: the rest of z.ai's documented quota codes
        # (https://docs.z.ai/api-reference/api-code, read 2026-09-30 and relayed
        # by ledger MSG 2026-09-30T15:39:58Z-glm-quota-facts; not yet
        # live-observed here). 1302, 1305 and 1308 are declared above
        # (OMN-19432, with OMN-20154's cooldown).
        # 1313: fair-usage throttle; back off hard.
        - code: "1313"
          disposition: cooldown
          scope: provider
          fallback_cooldown_seconds: 1800
          alert: false
        # 1316/1317: a plan window is spent; the reset instant is stated inline.
        - code: "1316"
          disposition: disable_until_reset
          scope: provider
          reset_from: message_reset_timestamp
          fallback_cooldown_seconds: 3600
          alert: false
        - code: "1317"
          disposition: disable_until_reset
          scope: provider
          reset_from: message_reset_timestamp
          fallback_cooldown_seconds: 3600
          alert: false
        # 1318-1321: monthly spend-cap periods; treated as a spent window.
        - code: "1318"
          disposition: disable_until_reset
          scope: provider
          reset_from: message_reset_timestamp
          fallback_cooldown_seconds: 3600
          alert: false
        - code: "1319"
          disposition: disable_until_reset
          scope: provider
          reset_from: message_reset_timestamp
          fallback_cooldown_seconds: 3600
          alert: false
        - code: "1320"
          disposition: disable_until_reset
          scope: provider
          reset_from: message_reset_timestamp
          fallback_cooldown_seconds: 3600
          alert: false
        - code: "1321"
          disposition: disable_until_reset
          scope: provider
          reset_from: message_reset_timestamp
          fallback_cooldown_seconds: 3600
          alert: false
    # OMN-20154: z.ai's GENERAL API is a second product on the same host as the
    # Coding Plan rule above, metered separately and served under its own path.
    # No house backend addresses it (we offer no inference to customers, INV-068);
    # a tenant's own BYOK credential does, through the glm/general_api row of
    # byok_provider_backends.v1.yaml. This rule gives that surface its own quota
    # domain (a spent Coding Plan window must not bar it, and the reverse) and its
    # own reading of 1113. provider_surfaces.v1.yaml makes this rule win over the
    # host-wide `zai` rule for any /api/paas/v4 endpoint and lists the only model
    # admitted there: no paid balance is approved.
    - provider_id: zai-general
      match_endpoint_host: "api.z.ai"
      codes:
        # Capacity signals, not quality verdicts and not plan caps: measured
        # 2026-09-30, glm-4.5-flash answers 1302 above 2 requests in flight, and
        # a sustained run of real tasks drew 159 refusals in 257 attempts. A
        # retry after a short wait works; nothing is disabled.
        - code: "1302"
          disposition: retryable
          alert: false
        - code: "1305"
          disposition: retryable
          alert: false
        # 1113 on this surface is NOT the Coding Plan wrong-endpoint signal. A
        # free model needs no balance, so the code means a model that is not
        # free was addressed, or z.ai changed the free model's status.
        - code: "1113"
          disposition: disable_until_billing
          alert: true
          alert_hint: >-
            z.ai 1113 on the general API means the model addressed is not free
            or its free status changed; glm-4.5-flash is the only model admitted
            here and no paid balance is approved. Check the model id against
            z.ai's pricing page. This is never a funding action.
    - provider_id: openrouter
      match_endpoint_host: "openrouter.ai"
      # The free tier is rate-limited with no SLA. OMN-20154: its 429 carries
      # the bare HTTP status as error.code and the limit is counted per free
      # model, so a 429 cools down that one model and the other free models
      # behind the same key stay routable. Recorded rather than retried: the
      # 59 free calls in 24h on 2026-09-30 had nothing to learn from otherwise.
      codes:
        - code: "429"
          disposition: cooldown
          scope: model
          fallback_cooldown_seconds: 60
          alert: false
    # OMN-19432: cloud-typesafe-jev (above) is a newly added metered backend.
    # test_every_metered_backend_host_is_declared_in_the_quota_policy
    # (OMN-16932) fails closed on any backend host this policy does not
    # describe, so the host is declared here even though no 429 has been
    # observed from it yet. No structured error code is known for this
    # vendor, so there is no per-code rule to add; an unmapped 429 falls
    # through to `default_disposition: retryable`, the same outcome as
    # leaving it undeclared, but recorded here so a future live-observed
    # code (billing gap vs periodic cap) has a place to land instead of a
    # silent retryable default.
    - provider_id: typesafe
      match_endpoint_host: "api.typesafe.ai"
      codes: []
    # OMN-16932: Gemini was the ONE metered host the lane actually calls and
    # the one this policy did not describe, so its 429s fell through to
    # `default_disposition: retryable` — an exhausted daily cap read as a
    # transient throttle, and nothing ever stopped routing to it.
    #
    # Live-observed 2026-08-29T12:13:33Z on the dev lane, verbatim (docker logs
    # omninode-runtime-effects, correlation 414e11bf-…):
    #   {"error":{"code":429,"status":"RESOURCE_EXHAUSTED","message":
    #    "You exceeded your current quota … * Quota exceeded for metric:
    #     generativelanguage.googleapis.com/generate_content_free_tier_requests,
    #     limit: 20, model: gemini-2.5-flash\nPlease retry in 27.024259969s."}}
    #
    # Two shape differences from z.ai drive the entry below:
    #   * `error.code` is the bare HTTP status (429), not a provider-native
    #     sub-code — Gemini has no 1310/1113 equivalent, so the status code IS
    #     the code and one rule covers the class.
    #   * the reset is stated as a retry DELAY, not an absolute instant, so
    #     `reset_from: message_retry_delay` reads it. When the delay is absent
    #     the fallback cooldown applies (fail-closed: a cap we cannot time is
    #     still a cap).
    #
    # `alert: false` because this one DOES clear on its own — it is a periodic
    # free-tier cap, not a billing gap. Raising the cap is a capacity decision
    # for an operator, not something a retry can fix, but the ladder recovering
    # by itself is the correct default.
    - provider_id: google-gemini
      match_endpoint_host: "generativelanguage.googleapis.com"
      codes:
        # OMN-20154: Google names the class in error.status. Matched before the
        # bare "429" below, and scoped per model: the free-tier counter is per
        # model ("limit: 20, model: gemini-2.5-flash").
        - code: "RESOURCE_EXHAUSTED"
          disposition: disable_until_reset
          scope: model
          reset_from: message_retry_delay
          fallback_cooldown_seconds: 3600
          alert: false
        - code: "429"
          disposition: disable_until_reset
          scope: model
          reset_from: message_retry_delay
          # The free tier's request counter is a DAILY cap; when the provider
          # does not state a delay, an hour is a conservative re-probe interval
          # that neither hammers the endpoint nor strands the rung for the day.
          fallback_cooldown_seconds: 3600
          alert: false

# Saturation policy (OMN-16891) — bounded-wait-then-escalate.
#
# The local backends share ONE physical endpoint (.201:8000 serves both
# local-coder and local-heavy-reasoning). It runs up to four sequences at once
# (vLLM --max-num-seqs 4, OMN-19447), and the delegate-skill orchestrator admits
# four records, so a fifth concurrent local delegation waits in the lane.
# Two failure modes bound the correct behavior:
#   * never queue on local indefinitely — a saturated local rung must be able
#     to hand work to a free cloud rung rather than stall the ladder;
#   * never skip straight to cloud while local is idle — that spends money (or
#     free-tier goodwill) on capacity we already own.
# Bounded wait is the resolution: wait up to `max_wait_ms` for the local slot,
# then escalate and record `saturation-escalate` as the placement_reason.
#
# The bound is enforced at dispatch by elapsed wait, not by reading a queue
# signal, which is what keeps this from becoming a new metrics subsystem. (The
# 2026-08-28 note that `.201:8000` exposes no queue counters is stale: the vLLM
# server now serves `vllm:num_requests_running` and `vllm:num_requests_waiting`,
# which is how OMN-19447 measured the declared capacity below.)
saturation_policy:
  schema_version: "saturation_policy.v1"
  # Tiers not listed escalate immediately on contention (no owned capacity to
  # wait for).
  default_max_wait_ms: 0
  tiers:
    - tier: local
      # Operator-tunable. Long enough that a short in-flight generation is
      # worth waiting out, short enough that a long one does not stall the
      # ladder.
      max_wait_ms: 45000
      poll_interval_ms: 1500
      # OMN-18349: the single slot described in this block's header, stated as a
      # number a caller can read instead of a sentence it cannot. The nightly
      # delegation regression published its whole nine-case corpus at once on
      # the premise that the platform would serve them concurrently; it cannot,
      # and the run collapsed -- measured 2026-09-14 on the stability lane, five
      # consecutive cases cancelled at an exact 240.000s cadence because each
      # one spent its entire handler execution budget behind the abandoned work
      # of the cases before it. The probe now paces itself from this field.
      #
      # OMN-19447: 4, the server's own --max-num-seqs, recorded beside
      # tests/unit/delegation/test_local_serving_capacity_omn19447.py, which
      # fails if this number and that record drift apart. The delegate-skill
      # orchestrator admits four records since OMN-18852, so the 1 above had
      # gone stale and the nightly ran one case at a time behind a server that
      # takes four. Measured 2026-09-24 at 4 and 8 concurrent dev-lane runs:
      # the server peaked at 4 running and 0 waiting both times, and at 8 the
      # extra four waited in the lane (queue wait up to 21 s). Memory is the
      # other limit (the KV cache holds about 1.35 requests at FULL context),
      # so four long-context prompts at once can still wait at the server.
      max_concurrent_generations: 4

# Gateway-level circuit breaker settings (apply to all backends).
circuit_breaker:
  failure_threshold: 5
  window_seconds: 30
# Gateway-level failover settings.
failover:
  max_attempts: 3
  backoff_base_ms: 500
# Shadow mode for delegation A/B testing (OMN-10638).
# Disabled by default — prevents accidental learned-policy activation during demo.
# To enable: set enabled: true and provide a policy_version identifier.
# Shadow decisions are emitted as comparison events only and NEVER affect
# live routing output. Dashboard/eval must label them SHADOW (shadow_label field).
shadow_mode:
  enabled: false
  policy_version: "unknown"
  log_sample_rate: 1.0
  comparison_logging_enabled: true
  max_shadow_latency_ms: 5.0
# Ollama on a developer Mac: the port, the chat path and the default model per
# memory size. The HOST is deliberately not declared here -- the onboarding
# script chooses host.docker.internal from inside Docker and localhost otherwise.
# The first entry whose min_memory_gb <= the Mac's memory wins; entries are
# ordered by min_memory_gb strictly descending and the last one is 0.
ollama:
  port: 11434
  chat_path: /v1/chat/completions
  models:
    - min_memory_gb: 16
      model: qwen2.5-coder:7b
      download_gb: 5
    - min_memory_gb: 0
      model: qwen2.5-coder:1.5b
      download_gb: 1
