    # holding a caller that falls back to its incumbent on any error.
    timeout_ms: 30000
    # A decision answer is a few dozen tokens (the vendor's own examples report
    # 18-34 output tokens). Declared because the resolver fails closed without it.
    max_tokens: 1024
    capabilities:
      - typed_decision
