  # takes a program state plus one typed question (choice, noul or score) and
  # returns a typed answer with calibrated probabilities, on TypeSafe's own
  # System One schema (not OpenAI-compatible). It is therefore NOT a rung: no
  # routing rule and no routing_tiers.yaml ladder entry references it, so the
  # text-generation chain of responders can never select it (the same
  # pinned-by-id pattern as cloud-glm-judge above). The only caller is
  # node_typed_decision_effect, whose contract pins this backend_id and which
  # refuses any work unit that does not belong to a public repository before
  # this endpoint is called (the typed-decision evaluation plan,
  # sections 4 and 5, Task 8).
  #
  # The key is `llm.typesafe.api_key`, resolved at the effect boundary through
  # the canonical secret-store resolver exactly as cloud-glm's llm.glm.api_key
  # is. The llm.<provider>.<name> shape is what makes it LOCAL-STORE-ONLY on a
  # machine with no configured lane store (OMN-18695): it is answered by
  # ~/.omninode/delegation/delegation.sqlite and never by the environment.
  #
  # Live probe, 2026-09-27 ~13:15Z, key from that store: POST of a one-question
  # noul body to this URL with model jev-latest returned HTTP 200, served model
  # jev-1.13.0, 0.21 s.
  - backend_id: cloud-typesafe-jev
    provider: typesafe
    # COMPLETE URL, posted VERBATIM (OMN-12815). The path names the operation.
    endpoint_url: "https://api.typesafe.ai/v1/systemone"
    # The vendor's stable alias; the response names the concrete served model
    # (jev-1.13.0 on 2026-09-27), which the decision receipt records.
    model_name: "jev-latest"
    secret_ref: llm.typesafe.api_key
