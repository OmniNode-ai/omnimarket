# bifrost_delegation.yaml — Delegation routing rules for Claude Code task classes.
#
# Maps task-class contracts to bifrost backend routing policies.
# Every gateway response MUST include the selected rule_id and config_version
# to make provenance auditable (OMN-10637 requirement R1).
#
# OMN-12815 / OMN-13159: every endpoint_url is the COMPLETE final URL incl. the
# full chat path (e.g. .../v1/chat/completions). It is posted VERBATIM at every
# call site — no in-code construction, append, rstrip, or path-resolver exists
# anymore. Public cloud endpoints carry the complete URL here; site-specific
# LOCAL endpoints are null in the repo default and the env var named by
# `endpoint_url_env` (formerly `base_url_env`) MUST hold the COMPLETE URL (incl.
# /v1/chat/completions) — supplied by the overlay file the installer writes,
# usually ~/.omninode/delegation/bifrost_overrides.yaml. A bare base (no chat
# path) is a misconfiguration — resolution fails closed rather than
# constructing a path.
#
# See routing_tiers.yaml for tier escalation ladder.
#
# Tickets: OMN-10637, OMN-10638, OMN-10657, OMN-12815, OMN-13170, OMN-13343, OMN-13351, OMN-15155, OMN-16442
config_version: "2.5.0"
schema_version: "bifrost_delegation.v1"
# Backend definitions — endpoint_url values are merged from the overlay at load time.
# model_name is null here; resolved at deploy time via bifrost_overrides.yaml overlay.
# backend_ids are capability-named (not model-named) so the public config never
# embeds site-specific model identifiers.
backends:
  # Local backends (vLLM on .201) — capability-named, model_name resolved via overlay
  - backend_id: local-coder
    endpoint_url_env: BIFROST_LOCAL_CODER_ENDPOINT_URL
    endpoint_url: null
    # OMN-16419: was "Qwen3.6-35B-A3B" — stale since the 2026-08-23 .201 reboot.
    # Live readback (GET .201:8000's /v1/models, this ticket) confirms the
    # SGLang-served id is "qwen3.8". A backend whose model_name does not
    # match this endpoint's served id is now caught at dispatch by the
    # fail-closed guard in HandlerLlmDelegationCall (transport.
    # probe_served_models + the OMN-16419 mismatch check) instead of silently
    # attributing to a model that isn't running.
    model_name: qwen3.8
    tier: local
    # OMN-13170: timeout_ms is sized to the 65536-token output budget below — a
    # 64k-token code-generation artifact at local vLLM throughput exceeds 60s and
    # was failing with error="request timed out" / output_tokens=0 once OMN-13170
    # deleted the hardcoded 120s transport cap. 300000 ms (5 min) gives the model
    # room to finish a full module + tests. Overlay-overridable per deploy lane.
    timeout_ms: 300000
    # OMN-13161: per-backend output-token ceiling. The served model (qwen3.8,
    # OMN-16419) reports max_model_len=122880; a 64k output budget stays well
    # within range for code-generation artifacts.
    max_tokens: 65536
    capabilities:
      - code_generation
      - refactoring
      - documentation
  # OMN-16442: the `local-reasoner` backend (model_name
  # Qwen3.6-27B-MTP-IQ4_XS.gguf, endpoint_url_env
  # BIFROST_LOCAL_REASONER_ENDPOINT_URL → .201:8001) was DELETED. OMN-16419
  # left it wired ONLY because routing_rules.research still referenced it and
  # a routing-table change was out of that ticket's bounded scope; this ticket
  # IS that routing-table change, so the reference is removed below and the
  # definition goes with it. The endpoint is the RTX 4090 slot physically
  # removed from .201 for RMA (OMN-16407) — re-probed 2026-08-28, `curl
  # .201:8001/v1/models` returns exit 7 "Couldn't connect to
  # server", and the canonical inventory
  # (omni_home/docs/reference/AI_LAB_HARDWARE.md, verified 2026-08-28) marks
  # the slot DEAD / RETIRED. Restore a reasoner rung by REGISTERING the
  # replacement hardware, never by reviving this backend_id against a slot
  # that no longer exists.
  - backend_id: local-heavy-reasoning
    endpoint_url_env: BIFROST_LOCAL_CODER_ENDPOINT_URL
    endpoint_url: null
    # OMN-16419: was "Qwen3.6-35B-A3B" — same stale label as local-coder above
    # (same .201:8000 SGLang endpoint, live-verified served id "qwen3.8").
    model_name: qwen3.8
    tier: local
    # OMN-13170: same 65536-token budget as local-coder → same 300000 ms ceiling so
    # large deep-reasoning/research outputs are not killed at 60s.
    timeout_ms: 300000
    # OMN-13161: same qwen3.8 model as local-coder (OMN-16419) → 64k output budget.
    max_tokens: 65536
    capabilities:
      - deep_reasoning
      - reasoning
      - research
      - classification
      - documentation
  # OMN-16442: model_name was the literal string "local-embedding" — the
  # backend_id echoed into the served-model field, not a served id at all.
  # Live readback 2026-08-28, GET .201:8002/v1/models:
  #   id "text-embedding-qwen3", owned_by vllm,
  #   root /data/inference/hf-cache/qwen3-embedding-0.6b, max_model_len 8192.
  # Artifact is Qwen/Qwen3-Embedding-0.6B (BF16); its config.json reports
  # hidden_size 1024, i.e. the endpoint emits 1,024-DIMENSIONAL vectors. That
  # dimension is a HARD placement constraint (canonical inventory
  # omni_home/docs/reference/AI_LAB_HARDWARE.md → Routing Intent #2): any
  # consumer collection sized for a different embedding width cannot be served
  # by this endpoint.
  - backend_id: local-embedding
    endpoint_url_env: BIFROST_LOCAL_EMBEDDING_ENDPOINT_URL
    endpoint_url: null
    model_name: text-embedding-qwen3
    tier: local
    timeout_ms: 30000
    # OMN-13161: embedding backend produces vectors, not chat completions — it never
    # consumes an output-token budget. The field is required by the schema, so set
    # the minimum (1); it is never read on the embedding path.
    max_tokens: 1
    capabilities:
      - embedding
  # Cloud fallback / ceiling backends
  #
  # OMN-13351: the former Anthropic ceiling backends `cloud-sonnet`
  # (claude-sonnet-4-6) and `cloud-haiku` (claude-haiku-4-5-20251001) were DELETED.
  # Both declared secret_ref `llm.anthropic.api_key`, which resolves to None in
  # every deployed lane — this org has NO Anthropic key and NO OpenAI key (Claude
  # Code + Codex are OAuth). The 2026-06-19 stability-test escalation reprove
  # (docs/evidence/2026-06-19-sea-escalation-reprove.md §2d) proved live, in
  # `omninode-stability-test-runtime`, that `resolve_api_key('llm.anthropic.api_key',
  # required=False)` returns None, so the ceiling terminated
  # `no_routable_backend_for_task` on every escalation. A config-wired but
  # secret-dead ceiling is functionally absent, so both Anthropic backends are
  # removed from the active ladder rather than left as zombie entries. The new
  # ceiling is `cloud-gemini-pro` below (secret_ref `llm.gemini.api_key`, which
  # DOES resolve IN-CLUSTER — see the OMN-16530 correction on the line below
  # before trusting this off an unconfigured off-box machine).
  - backend_id: cloud-gemini-pro
    # OMN-13351: resolvable Gemini frontier ceiling backend. Replaces the dead
    # Anthropic `cloud-sonnet` ceiling. COMPLETE endpoint URL incl. the full chat
    # path, posted VERBATIM (OMN-12815) — the AI Studio OpenAI-compatibility
    # endpoint, identical host to cloud-gemini-flash.
    #
    # model_name verification (live, in `omninode-stability-test-runtime` —
    # IN-CLUSTER, where Infisical resolves `llm.gemini.api_key`; see OMN-16530
    # below for why this does not generalize to every caller): the resolved
    # `llm.gemini.api_key` AUTHENTICATES (1-token probes return HTTP 200/429,
    # never 401/403). `gemini-2.5-pro` was the first-preference ceiling but
    # is quota-zero on the only resolvable Gemini key (HTTP 429 "exceeded current
    # quota" — the same AI Studio free-tier failure mode OMN-12890 documented for
    # gemini-2.0-flash). `gemini-2.5-flash` returns HTTP 200 (echo
    # `model=gemini-2.5-flash`), so it is pinned here: it is the most capable
    # Gemini model that actually RESPONDS on the resolved key, strictly more capable
    # than the cheap_cloud `gemini-2.5-flash-lite`, and a real escalation step above
    # the cheap_cloud glm-5.2 tier. A wrong/quota-blocked id fails closed, so the
    # exact verified-200 id is pinned.
    #
    # OMN-16530 (2026-08-25): the "AUTHENTICATES" claim above was verified
    # IN-CLUSTER only and does NOT unconditionally hold for every caller — it
    # was live-reproduced FALSE from an off-box LAN Mac (400 "Please pass a
    # valid API key"). Root cause is a stale/wrong local VALUE, not a broken
    # resolution mechanism: `resolve_api_key_async("llm.gemini.api_key", ...)`
    # already resolves off-box, through the SAME fallback chain other local
    # tooling uses — `_ConventionFallbackSecretStore`
    # (omnimarket/src/omnimarket/inference/secret_store_resolver.py) checks,
    # in order, (1) a literal env match, (2) the dotted-ref -> `LLM_*_API_KEY`
    # convention, (3) the OMN-13960 provider-native alias
    # (`llm.gemini.api_key` -> `GEMINI_API_KEY`), which is exactly the name
    # the local bootstrap file `~/.omnibase/.env` defines and other local
    # tooling already relies on. That chain resolved a real value on the
    # off-box repro — the VALUE it found was simply not the same working
    # secret the in-cluster Infisical store holds, so the provider rejected
    # it. There is no sanctioned off-box path to the in-cluster Infisical
    # value itself (memory `reference_onexdev_infisical_is_in_cluster_sync_identity_writable.md`);
    # keeping `~/.omnibase/.env`'s `GEMINI_API_KEY` current is an operator
    # bootstrap-hygiene task, not a code defect, and no raw-env-key shortcut
    # was added to paper over it (secret-ref discipline: this file still
    # carries only the reference, never a literal key). A rejected-but-
    # resolved secret now fails with the provider's own diagnostic
    # (`HandlerLlmDelegationCall._execute_call`'s `httpx.HTTPStatusError`
    # branch appends `response.text`) instead of a bare status code — see
    # `transport._curl_post`, which previously ran `curl -f` and silently
    # discarded the response body on any >=400, the actual source of the
    # "bare 400" this ticket fixed. The ARCHITECTURALLY PREFERRED path
    # remains the bus (OMN-16529): once a caller's health probe clears and
    # escalation routes through `RuntimeDelegationDispatchPort` to the
    # deployed dev-lane consumer, `llm.gemini.api_key` resolves the SAME way
    # the in-cluster verification above did — this off-box local-mode path
    # exists for callers running the bus-less `LocalDelegationDispatchPort`.
    endpoint_url: "https://generativelanguage.googleapis.com/v1beta/openai/chat/completions"
    model_name: "gemini-2.5-flash"
    secret_ref: llm.gemini.api_key
    api_key_env: GEMINI_API_KEY
    tier: frontier_api
    # OMN-13170: size the timeout to the output budget below (300000 ms) so large
    # ceiling-tier generations are not killed at the 60s default.
    timeout_ms: 300000
    # Gemini 2.5 Flash serves a 1M context window and supports a large output
    # budget; 65536 tokens is well within range and >= the 16384 floor this ceiling
    # requires.
    max_tokens: 65536
    capabilities:
      - code_generation
      - reasoning
      - documentation
      - research
    extra_headers:
      HTTP-Referer: "https://omninode.ai"
      X-Title: "OmniNode ONEX"
  # GLM — DIRECT z.ai, never through OpenRouter (paying aggregator markup for a
  # model we hold a key for is a cost bug). Ships DECLARED-BUT-DISABLED as of
  # OMN-16891: the entry is complete and correct, and the tier self-enables the
  # moment `llm.glm.api_key` resolves. See the routing_tiers.yaml cheap_cloud
  # block for the activation runbook.
  - backend_id: cloud-glm
    # OMN-12819: COMPLETE endpoint URL incl. the full chat path, posted VERBATIM.
    #
    # OMN-16891: repointed off the CODING-PLAN surface
    # (https://api.z.ai/api/coding/paas/v4/chat/completions) to the STANDARD
    # direct-API surface below. These are different z.ai PRODUCTS, not two
    # spellings of one endpoint:
    #   * /api/coding/paas/v4/ is the coding-plan product. It is shared with
    #     ZCode.app, a separate z.ai desktop agent OAuth-configured against the
    #     SAME account (ledger, 2026-07-14 zai-trace, read-only). Its 429/1310
    #     "Weekly/Monthly Limit Exhausted" was a CO-TENANT's cap, misread on
    #     this ticket as our own subscription being exhausted; the operator
    #     corrected it — "we haven't used glm at all."
    #   * /api/paas/v4/ is the standard direct-API surface this tier's
    #     subscription actually addresses. Verbatim from the official docs
    #     (https://docs.z.ai/api-reference/llm/chat-completion, base
    #     https://api.z.ai/api/paas/v4).
    # Known live state, recorded so it is not rediscovered as a bug: probed
    # 2026-08-28 with the then-present key, this surface returned 429 code 1113
    # "Insufficient balance or no resource package" — a BILLING/entitlement gap
    # on the standard product, distinct from 1310. The operator has since
    # removed the keys, so the tier is credential-disabled regardless; both
    # codes are classified by the provider_quota_policy block at the bottom of
    # this file so neither is retried blindly.
    endpoint_url: "https://api.z.ai/api/paas/v4/chat/completions"
    # OMN-16891: was "glm-5-turbo" (OMN-14225). That id appears NOWHERE in
    # current z.ai documentation on either surface — it is a dead pin, and a
    # wrong id fails closed. Repointed to `glm-5.3`, the current flagship text
    # model on the documented standard-surface list (glm-5.3, glm-5.2, glm-5.1,
    # glm-5, glm-4.7*, glm-4.6, glm-4.5*, glm-4-32b-0414-128k). Re-pin via
    # overlay if the plan's entitlement covers a cheaper documented id.
    model_name: "glm-5.3"
    secret_ref: llm.glm.api_key
    api_key_env: LLM_GLM_API_KEY
    tier: cheap_cloud
    # OMN-13170: GLM large reads/generations (64k output budget) were timing
    # out at 60s on the dev runtime; size the timeout to the budget (300000 ms).
    timeout_ms: 300000
    # OMN-13161: the z.ai GLM coding endpoint serves a 128k context window; 64k
    # output budget.
    max_tokens: 65536
    capabilities:
      - code_generation
      - reasoning
      - research
  - backend_id: cloud-glm-judge
    # OMN-14225: the quality-gate JUDGE's OWN backend, DECOUPLED from the
    # cheap_cloud escalation model. This backend is pinned by backend_id from
    # the judge adapter (RoutingResolvedJudgeInferenceAdapter,
    # _DEFAULT_JUDGE_BACKEND_ID) and is referenced by NO routing rule / tier, so
    # it is never selected on the delegation escalation ladder — only the judge
    # rides it. To move the judge model, repoint this backend — the escalation
    # tiers are unaffected, and vice versa. The backend_id (``cloud-glm-judge``)
    # is kept as-is (it is a stable pin string, not a provider claim) even
    # though it no longer points at z.ai/GLM — same pattern as the ``claude``
    # ceiling tier name.
    #
    # OMN-14625: repointed off z.ai GLM-5.2 to Gemini. The z.ai GLM route is
    # DEAD from the .201 runtime: resolve_api_key succeeds but every completion
    # call 401s / loops FAILED-only (forensics this ticket; see memory
    # reference_glm_zai_wiring_and_consumers). Verified nothing else keys on
    # this backend's z.ai identity (endpoint_url/model_name) — only the
    # backend_id string is pinned by the judge adapter — so repointing this
    # definition in place is sufficient.
    endpoint_url: "https://generativelanguage.googleapis.com/v1beta/openai/chat/completions"
    model_name: "gemini-2.5-flash"
    secret_ref: llm.gemini.api_key
    api_key_env: GEMINI_API_KEY
    tier: judge
    # Match the ceiling/cheap_cloud Gemini budget: the judge issues a small
    # structured verdict but rides the same endpoint, so the same generous
    # timeout/output ceiling apply.
    timeout_ms: 300000
    max_tokens: 65536
    capabilities:
      - judge_adequacy
  - backend_id: cloud-gemini-flash
    # OMN-12815: COMPLETE endpoint URL incl. the full chat path, posted VERBATIM.
    # No in-code construction/append; the routing authority returns this unchanged.
    # OMN-12890: model_name repointed from gemini-2.0-flash (AI Studio free-tier
    # quota-zero, HTTP 429) to gemini-2.5-flash-lite (quota-available on same key).
    # Key is valid; the sole failing dimension was external quota exhaustion.
    endpoint_url: "https://generativelanguage.googleapis.com/v1beta/openai/chat/completions"
    model_name: "gemini-2.5-flash-lite"
    secret_ref: llm.gemini.api_key
    api_key_env: GEMINI_API_KEY
    tier: cheap_cloud
    timeout_ms: 60000
    # OMN-13161: Gemini Flash family caps output at ~8192 tokens; do not exceed the
    # provider's real output limit.
    max_tokens: 8192
    capabilities:
      # OMN-13140: code_generation added so AI Studio cloud-gemini-flash is the
      # canonical cloud-escalation target for the hackathon code_generation proof.
      # cloud-vertex-gemini (below) intentionally does NOT carry code_generation —
      # exactly one canonical Gemini target is live for the escalation path.
      - code_generation
      - summarization
      - simple_tasks
      - document
    extra_headers:
      HTTP-Referer: "https://omninode.ai"
      X-Title: "OmniNode ONEX"
  # Vertex-served Gemini (OMN-12971) — burns the Vertex $500 credit via Vertex AI.
  # ADDITIVE next to cloud-gemini-flash (AI Studio key path); both routes stay
  # selectable so the project remains provider-agnostic. This backend is NOT a
  # replacement — neither provider is removed or forced.
  #
  # Auth (secret-ref discipline): the outbound call carries a standard
  #   Authorization: Bearer <token>
  # header (the same path every cloud backend uses). For Vertex that token is a
  # short-lived OAuth access token MINTED FROM ADC. ADC delivery to the effects
  # container: a mounted service-account / Application-Default-Credentials file
  # (GOOGLE_APPLICATION_CREDENTIALS) is exchanged for the bearer token, and that
  # token is published to the secret store under the logical ref
  # ``llm.vertex.access_token``. Only the logical ref name lives here; the token
  # VALUE is resolved fail-closed at the effect boundary via ProtocolSecretStore
  # (OMN-12824). No credential value is ever committed in this config.
  #
  # endpoint_url is null in the repo default because the Vertex OpenAI-compat URL
  # is project + region specific
  #   https://{LOCATION}-aiplatform.googleapis.com/v1/projects/{PROJECT}/
  #     locations/{LOCATION}/endpoints/openapi/chat/completions
  # The overlay (bifrost_overrides.yaml) supplies the COMPLETE chat-completions
  # URL via BIFROST_VERTEX_GEMINI_ENDPOINT_URL. A bare base fails closed
  # (OMN-12815) — no in-code path construction.
  #
  # OMN-16833 — PARKED AND UNREFERENCED. This declaration is retained on
  # purpose, but routing_tiers.yaml no longer points any tier at it. Vertex
  # cannot be bound on any lane today: the deploy-time renderer
  # (omnibase_infra render_bifrost_delegation_contract) never reads endpoint
  # bindings from the process environment, and the typed lane overlay that IS
  # the binding authority admits only unauthenticated local http:// backends —
  # so BIFROST_VERTEX_GEMINI_ENDPOINT_URL above is inert on the render path.
  # Live 2026-08-29: the dev lane's llm.vertex.access_token resolves to the FILE
  # /run/secrets/vertex_access_token, which is a character device 1,3 (/dev/null),
  # and onex-dev pins BIFROST_VERTEX_GEMINI_ENDPOINT_URL to "" pending the ADC
  # mount. The declaration stays because Vertex is a SEPARATE quota domain from
  # the AI Studio key that cloud-gemini-pro / cloud-gemini-flash / cloud-glm-judge
  # all share, so it remains the cheapest available answer to that coupling once
  # the ADC token is mounted. Mount the token and give this a concrete
  # endpoint_url BEFORE restoring the tier reference, not after.
  - backend_id: cloud-vertex-gemini
    endpoint_url_env: BIFROST_VERTEX_GEMINI_ENDPOINT_URL
    endpoint_url: null
    model_name: "gemini-2.5-flash-lite"
    secret_ref: llm.vertex.access_token
    tier: cheap_cloud
    timeout_ms: 60000
    # OMN-13161: Vertex-served Gemini Flash carries the same ~8192 output cap.
    max_tokens: 8192
    capabilities:
      - summarization
      - simple_tasks
      - document
    extra_headers:
      HTTP-Referer: "https://omninode.ai"
      X-Title: "OmniNode ONEX"
  # Local DS-V4-Flash backend — DeepSeek V4 Flash (284B MoE) on .200:8101 (OMN-12492)
  - backend_id: local-ds-v4-flash
    endpoint_url_env: BIFROST_LOCAL_DS_V4_FLASH_ENDPOINT_URL
    endpoint_url: null
    # endpoint_url null in repo default; overlay sets .200:8101  # onex-allow-internal-ip OMN-12492 reason="repo-default comment documenting local overlay target for DS-V4-Flash"
    # OMN-16833: was "ds-v4-flash" — that is the ROUTING CATALOG KEY
    # (model_registry_v1.yaml `ds-v4-flash:` / routing_tiers.yaml `id:`), not the
    # SERVED id.  `model_name` is the wire field POSTed as "model", and the
    # registry entry for this same backend already declares
    # `model_name: "deepseek-v4-flash"` — the bifrost contract had simply drifted
    # from it.  Live readback 2026-08-28: GET .200:8101/v1/models lists exactly
    # {"deepseek-v4-flash", "deepseek-v4-pro"}, so the old value was rejected by
    # the OMN-16419 served-model guard in HandlerLlmDelegationCall
    # (transport.probe_served_models) — the same silent-misattribution class that
    # ticket closed for local-coder.  The catalog key stays `ds-v4-flash`
    # everywhere (routing_tiers `id`, generated_llm_routing_constants,
    # telemetry); only the wire name is corrected here.
    model_name: deepseek-v4-flash
    tier: local
    # OMN-13170: DS-V4-Flash is a 284B MoE serving code_generation; full
    # module/test-suite generation at its throughput well exceeds 60s and was
    # failing with error="timed out" on the dev runtime. Size the timeout to the
    # 65536-token budget below (300000 ms). Overlay-overridable per deploy lane.
    timeout_ms: 300000
    # OMN-13161: 64k output budget. OMN-16833 correction: the SERVER's context
    # window is 131072 (live: /v1/models context_length=131072; ds4-server is
    # launched with --ctx 131072), not 65536. 65536 is the ROUTING budget
    # (routing_tiers.yaml max_context_tokens) — a deliberate conservative cap,
    # kept as-is here. The 64k output budget fits either way.
    max_tokens: 65536
    capabilities:
      - deep_reasoning
      - reasoning
      - research
      - code_generation
  # OMN-16442: the `local-coder-mlx` backend (model_name
  # mlx-community/Qwen3.6-35B-A3B-8bit, endpoint_url_env
  # BIFROST_LOCAL_CODER_MLX_ENDPOINT_URL → .200:8401, registered by OMN-15155)
  # was DELETED. Live probe 2026-08-28: `curl
  # .200:8401/v1/models` → exit 7 "Couldn't connect to
  # server", and the named artifact is served nowhere on the fleet. The Mac
  # Studio's MLX server now serves `Qwen3.8-27B-8bit` on 127.0.0.1:8099, bound
  # LOCALHOST-ONLY (canonical inventory
  # omni_home/docs/reference/AI_LAB_HARDWARE.md, verified 2026-08-28) — not
  # reachable from the .201 runtime, so it is NOT registered here. Registering
  # it needs explicit availability semantics + a health check first, the same
  # gate the inventory places on the mini/laptop/Gemma-canary endpoints;
  # tracked as the scoped follow-on on OMN-16442.
  # OpenRouter backends (OMN-7980) — route authority carries logical secret refs
  # (secret_ref). OMN-13943: api_key_env is a genuine ADDITIONAL fallback the
  # effect boundary resolves when secret_ref's dotted convention mapping (→
  # LLM_OPENROUTER_API_KEY) misses — it must name the REAL canonical env var,
  # not migration metadata.
  #
  # OMN-16891: that canonical name is OPENROUTER_API_KEY (no underscore), the
  # provider's own documented variable and the only spelling carrying a value
  # on the .201 runtime host. The deployed lanes resolve this ref through
  # omnibase_infra's per-lane `secret_resolver_mappings` with
  # `enable_convention_fallback: false`, so the lane mapping and this field
  # must name the SAME variable or the rung is credential-dead with no alias
  # path to rescue it — which is exactly what it was until this ticket.
  - backend_id: openrouter-glm-flash
    # OMN-12815: COMPLETE endpoint URL incl. the full chat path, posted VERBATIM.
    endpoint_url: "https://openrouter.ai/api/v1/chat/completions"
    model_name: "thudm/glm-4-9b-chat:free"
    secret_ref: llm.openrouter.api_key
    # OMN-16891: REVERTS OMN-13943's rename. That ticket changed this field to
    # OPEN_ROUTER_API_KEY on the stated premise that "canonical
    # ~/.omnibase/.env declares OPEN_ROUTER_API_KEY (with underscore)". Live
    # probe 2026-08-28 (names + LENGTHS only) falsifies it: the .201 runtime
    # host exports OPENROUTER_API_KEY (len 73) and defines the underscored form
    # nowhere. api_key_env IS genuinely resolved as a fallback, so naming a
    # variable no host defines made this rung silently unauthenticatable.
    api_key_env: OPENROUTER_API_KEY
    tier: cheap_cloud
    timeout_ms: 60000
    # OMN-13161: GLM-4-9B (free OpenRouter tier) — modest 8192 output budget.
    max_tokens: 8192
    capabilities:
      - code_generation
      - reasoning
      - research
    extra_headers:
      HTTP-Referer: "https://omninode.ai"
      X-Title: "OmniNode ONEX Build Loop"
  # OpenRouter cheap-frontier-direct — free frontier-class model (OMN-12492;
  # slug repointed OMN-15638).
  #
  # OMN-15638: backend_id is a STABLE SEAM KEY, deliberately NOT renamed with the
  # slug. routing_tiers.yaml, generated_llm_routing_constants.py, the model
  # registry, and ~20 tests bind this literal; it names the RUNG (cheap frontier
  # direct), not the vendor model. Renaming it is a separate, wider change.
  - backend_id: openrouter-qwen3-coder-480b
    # OMN-12815: COMPLETE endpoint URL incl. the full chat path, posted VERBATIM.
    endpoint_url: "https://openrouter.ai/api/v1/chat/completions"
    # OMN-15638: was "qwen/qwen3-coder:free". OpenRouter RETIRED that slug to
    # paid-only; it returns a permanent HTTP 404 — verbatim body: "This model is
    # unavailable for free. The paid version is available now - use this slug
    # instead: qwen/qwen3-coder" — and it is absent from GET /api/v1/models
    # entirely. Not a credential defect (key resolves, len 73).
    #
    # Repointed to the strongest FREE model live in the catalog on 2026-08-01,
    # per operator ruling R9-amended: stay free, do NOT adopt the paid slug.
    # NVIDIA Nemotron 3 Ultra — 550B total / 55B active hybrid Mamba-Transformer
    # MoE, self-described open frontier-reasoning + orchestration model, 1M
    # context, native tool-calling. Closest capability analog to the retired
    # 480B coder and the largest free model OpenRouter serves.
    #
    # COST: genuinely free — the provider's own usage accounting returned
    # "cost": 0 on the liveness probe, so routing_tiers.yaml's
    # cost_per_1k_tokens: 0.0 / cost_type: free_local stay TRUE (no silent-paid
    # regression of OMN-14224/14225). CAVEAT: free tier is rate-limited (429)
    # and carries NO SLA — the retired slug was itself 429-throttled for a week
    # in July (see tests/unit/delegation/graded_ladder/recorded_rung_outputs.json).
    # Zero cost is paid for in availability, not dollars.
    model_name: "nvidia/nemotron-3-ultra-550b-a55b:free"
    secret_ref: llm.openrouter.api_key
    # OMN-16891: REVERTS OMN-13943's rename. That ticket changed this field to
    # OPEN_ROUTER_API_KEY on the stated premise that "canonical
    # ~/.omnibase/.env declares OPEN_ROUTER_API_KEY (with underscore)". Live
    # probe 2026-08-28 (names + LENGTHS only) falsifies it: the .201 runtime
    # host exports OPENROUTER_API_KEY (len 73) and defines the underscored form
    # nowhere. api_key_env IS genuinely resolved as a fallback, so naming a
    # variable no host defines made this rung silently unauthenticatable.
    api_key_env: OPENROUTER_API_KEY
    tier: cheap_frontier
    # OMN-13170: 64k-output frontier backend — align the timeout to the budget
    # (300000 ms); 120s was short for full 64k generations.
    timeout_ms: 300000
    # OMN-13161 / OMN-15638: 64k output budget, unchanged across the repoint —
    # Nemotron 3 Ultra's live top_provider.max_completion_tokens is exactly
    # 65536, so this ceiling is still the provider's, not an arbitrary cap. Its
    # context window is 1,000,000 tokens (up from the retired slug's 262,144);
    # routing_tiers.yaml still declares max_context_tokens: 262144, which is now
    # a conservative UNDERSTATEMENT, not a false claim. Deliberately left
    # untouched to stay off OMN-15630's live use_for edits in that same block.
    max_tokens: 65536
    capabilities:
      - code_generation
      - reasoning
      - research
      - refactoring
    extra_headers:
      HTTP-Referer: "https://omninode.ai"
      X-Title: "OmniNode ONEX Experiment"
  # OMN-13215: shelled CLI agent backends (cli-codex / cli-claude / cli-opencode,
  # endpoint_url "cli://...") were REMOVED. The ceiling tier now maps to an HTTP
  # frontier backend and executes through the canonical HTTP inference path
  # identical to every lower tier. To swap the ceiling provider, repoint the
  # ceiling tier model's backend_id (routing_tiers.yaml) to another HTTP backend,
  # or override that backend's endpoint_url / model_name / secret_ref in the
  # overlay. No subprocess, no env var, no code change.
  #
  # OMN-13351: the ceiling backend is `cloud-gemini-pro` (secret_ref
  # llm.gemini.api_key, model gemini-2.5-flash) — NOT the former `cloud-sonnet`,
  # which was deleted because llm.anthropic.api_key resolves to None in every lane.
# Routing rules — evaluated in ascending priority order.
# First matching rule wins. Each rule maps a task_class to an ordered
# list of backends to try.
#
# Required fields per rule (OMN-10637):
#   rule_id: stable UUID for audit provenance
#   task_class_contract_version: version of the contract this rule targets
#   backend_policy_version: version of the backend policy applied
#   fallback_policy: what to do when all backends in backend_ids fail
#   shadow_policy_id: UUID of the shadow policy used for A/B evaluation
routing_rules:
  # ── code_generation ──────────────────────────────────────────────────────
  # Route code generation to local coder first (zero API cost),
  # fall back to the resolvable Gemini ceiling (cloud-gemini-pro) for reliability.
  - rule_id: "d4e5f6a7-0001-4000-8000-000000000001"
    priority: 10
    task_class: code_generation
    task_class_contract_version: "1.0.0"
    backend_policy_version: "2.0.0"
    match_operation_types:
      - chat_completion
      - completion
    match_capabilities:
      - code_generation
    latency_sla_ms: 30000
    backend_ids:
      - local-coder
      - cloud-gemini-pro
    fallback_policy:
      action: escalate_to_next_tier
      max_retries: 2
      on_exhaust: return_error
    shadow_policy_id: "e5f6a7b8-0001-4000-8000-000000000001"
  # ── test ────────────────────────────────────────────────────────────────
  # Unit-test generation is code generation with stricter quality gates.
  # Route locally first with a longer timeout because test artifacts regularly
  # approach the 30s boundary on quantized local models.
  - rule_id: "d4e5f6a7-0004-4000-8000-000000000004"
    priority: 15
    task_class: test
    task_class_contract_version: "1.0.0"
    backend_policy_version: "2.0.0"
    match_operation_types:
      - chat_completion
      - completion
    match_capabilities:
      - code_generation
    latency_sla_ms: 60000
    backend_ids:
      - local-coder
      - cloud-gemini-pro
    fallback_policy:
      action: escalate_to_next_tier
      max_retries: 1
      on_exhaust: return_error
    shadow_policy_id: "e5f6a7b8-0004-4000-8000-000000000004"
  # ── documentation ────────────────────────────────────────────────────────
  # Documentation tasks: local coder is capable; the resolvable Gemini ceiling
  # (cloud-gemini-pro) is the cloud fallback. The former cheaper Anthropic haiku
  # fallback was deleted (OMN-13351 — llm.anthropic.api_key resolves to None).
  - rule_id: "d4e5f6a7-0002-4000-8000-000000000002"
    priority: 20
    task_class: documentation
    task_class_contract_version: "1.0.0"
    backend_policy_version: "2.0.0"
    match_operation_types:
      - chat_completion
      - completion
    match_capabilities:
      - documentation
    cost_ceiling_usd_per_1k_tokens: 0.004
    backend_ids:
      - local-coder
      - cloud-gemini-pro
    fallback_policy:
      action: escalate_to_next_tier
      max_retries: 1
      on_exhaust: return_error
    shadow_policy_id: "e5f6a7b8-0002-4000-8000-000000000002"
  # ── research ─────────────────────────────────────────────────────────────
  # Research tasks require deep reasoning; route to the heavy-reasoning local
  # slot first, then reasoner as secondary, then the resolvable Gemini ceiling
  # (cloud-gemini-pro) as fallback.
  - rule_id: "d4e5f6a7-0003-4000-8000-000000000003"
    priority: 30
    task_class: research
    task_class_contract_version: "1.0.0"
    backend_policy_version: "2.0.0"
    match_operation_types:
      - chat_completion
      - reasoning
    match_capabilities:
      - deep_reasoning
    # OMN-16442: `local-reasoner` removed from this list — see the deletion
    # note on the backends block above. This rule referencing it was the sole
    # reason OMN-16419 could not delete the backend definition. `research`
    # keeps two live local rungs via routing_tiers.yaml
    # (local-heavy-reasoning, local-ds-v4-flash) plus the Gemini ceiling here.
    backend_ids:
      - local-heavy-reasoning
      - cloud-gemini-pro
    fallback_policy:
      action: escalate_to_next_tier
      max_retries: 2
      on_exhaust: return_error
    shadow_policy_id: "e5f6a7b8-0003-4000-8000-000000000003"
# Default fallback when no routing rule matches.
# Attempts backends in order.
default_backends:
  - local-coder
  # OMN-13351: ceiling fallback is the resolvable Gemini backend, not the dead
  # Anthropic cloud-sonnet (llm.anthropic.api_key resolves to None in every lane).
  - cloud-gemini-pro
# Provider quota policy (OMN-16891) — how to read a 429 from each provider.
#
# A 429 is not one failure class. Retrying the same tier on a quota-exhaustion
# 429 burns latency for a GUARANTEED failure, and retrying on a billing 429
# burns it forever. The provider's own error code distinguishes them, so the
# classification is declared here rather than inferred from the status line.
#
# Contract-first: adding a provider or recoding a disposition is an overlay
# edit, never a code change (OMN-13215).
#
# Dispositions:
#   retryable              — transient throttle; the tier may retry within its
#                            declared max_retries, then escalate normally.
#   disable_until_reset    — the plan's periodic cap is spent. Disable the tier
#                            until the reset instant the provider states in the
#                            error body, then let it re-enter the ladder.
#   disable_until_billing  — no balance / no resource package. No reset will
#                            arrive on its own, so retrying is pure waste;
#                            disable and raise an operator alert instead.
provider_quota_policy:
  schema_version: "provider_quota_policy.v1"
  # Applied when a provider match yields no explicit code entry.
  default_disposition: retryable
  providers:
    - provider_id: zai
      # Matched against the backend's endpoint_url host.
      match_endpoint_host: "api.z.ai"
      codes:
        # Live-observed 2026-08-28 on the coding-plan surface, verbatim:
        #   {"error":{"code":"1310","message":"Weekly/Monthly Limit Exhausted.
        #    Your limit will reset at 2026-08-30 20:32:52"}}
        # The reset instant is parsed out of the message; when it cannot be
        # parsed the fallback cooldown below applies (fail-closed: a cap we
        # cannot time is still a cap).
        - code: "1310"
          disposition: disable_until_reset
          reset_from: message_reset_timestamp
          fallback_cooldown_seconds: 3600
          alert: false
        # Live-observed 2026-08-28 on the standard surface, verbatim:
        #   {"error":{"code":"1113","message":"Insufficient balance or no
        #    resource package. Please recharge."}}
        # No reset instant exists — this clears only when a human funds the
        # account, so it alerts instead of retrying.
        - code: "1113"
          disposition: disable_until_billing
          alert: true
    - provider_id: openrouter
      match_endpoint_host: "openrouter.ai"
      # The free tier is rate-limited with no SLA and no structured code; its
      # 429s are ordinary throttling that clears on its own.
      codes: []

# Saturation policy (OMN-16891) — bounded-wait-then-escalate.
#
# The local backends share ONE physical endpoint (.201:8000 serves both
# local-coder and local-heavy-reasoning) which permits a SINGLE running
# generation, so concurrent local delegations queue above the model server.
# Two failure modes bound the correct behavior:
#   * never queue on local indefinitely — a saturated local rung must be able
#     to hand work to a free cloud rung rather than stall the ladder;
#   * never skip straight to cloud while local is idle — that spends money (or
#     free-tier goodwill) on capacity we already own.
# Bounded wait is the resolution: wait up to `max_wait_ms` for the local slot,
# then escalate and record `saturation-escalate` as the placement_reason.
#
# `.201:8000` exposes no queue-depth counters (probed 2026-08-28: no /metrics
# `queue`, `running_req`, or `num_queue`), so there is no saturation SIGNAL to
# read — the bound is enforced at dispatch by elapsed wait, which is also what
# keeps this from becoming a new metrics subsystem.
saturation_policy:
  schema_version: "saturation_policy.v1"
  # Tiers not listed escalate immediately on contention (no owned capacity to
  # wait for).
  default_max_wait_ms: 0
  tiers:
    - tier: local
      # Operator-tunable. Sized to the single-slot local endpoint: long enough
      # that a short in-flight generation is worth waiting out, short enough
      # that a long one does not stall the ladder.
      max_wait_ms: 45000
      poll_interval_ms: 1500

# Gateway-level circuit breaker settings (apply to all backends).
circuit_breaker:
  failure_threshold: 5
  window_seconds: 30
# Gateway-level failover settings.
failover:
  max_attempts: 3
  backoff_base_ms: 500
# Shadow mode for delegation A/B testing (OMN-10638).
# Disabled by default — prevents accidental learned-policy activation during demo.
# To enable: set enabled: true and provide a policy_version identifier.
# Shadow decisions are emitted as comparison events only and NEVER affect
# live routing output. Dashboard/eval must label them SHADOW (shadow_label field).
shadow_mode:
  enabled: false
  policy_version: "unknown"
  log_sample_rate: 1.0
  comparison_logging_enabled: true
  max_shadow_latency_ms: 5.0
