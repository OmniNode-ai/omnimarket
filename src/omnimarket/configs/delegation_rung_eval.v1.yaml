rungs:
  - rung_id: lab-201
    kind: local
    base_url_env: RUNG_EVAL_LAB_201_BASE_URL
    model_env: RUNG_EVAL_LAB_201_MODEL
    api_key_env: null
  - rung_id: lab-202
    kind: local
    base_url_env: RUNG_EVAL_LAB_202_BASE_URL
    model_env: RUNG_EVAL_LAB_202_MODEL
    api_key_env: null
  - rung_id: planner-200
    kind: planner
    base_url_env: RUNG_EVAL_PLANNER_200_BASE_URL
    model_env: RUNG_EVAL_PLANNER_200_MODEL
    api_key_env: null
  # OMN-20173: the cloud-glm rung is removed. The nightly eval called z.ai's
  # GLM Coding Plan directly, which the plan's terms bar (knowledge-base-internal
  # reference/zai-glm-coding-plan-terms.md, OMN-20154).
  # OMN-20974: the team is its own customer. This rung holds no provider key: it
  # is an `onex delegate` pinned to a backend and run as the dogfood tenant, whose
  # registered key the effect boundary resolves by reference. The backend id and
  # the tenant are environment names; the values arrive as repository variables.
  - rung_id: cloud-openrouter
    kind: cloud
    backend_id_env: RUNG_EVAL_CLOUD_OPENROUTER_BACKEND_ID
    tenant_env: RUNG_EVAL_DOGFOOD_TENANT_ID
