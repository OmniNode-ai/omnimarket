# key -> (url env var, model_id env var); the keys are logical model keys of the bridge.
bridge_model_keys:
  - {key: "qwen3-coder", url_env: "LLM_CODER_URL", model_env: "LLM_CODER_MODEL_NAME"}
  - {key: "qwen3-14b", url_env: "LLM_CODER_FAST_URL", model_env: "LLM_CODER_FAST_MODEL_NAME"}
  - {key: "deepseek-r1", url_env: "LLM_DEEPSEEK_R1_URL", model_env: "LLM_DEEPSEEK_R1_MODEL_NAME"}
  - {key: "qwen3-next", url_env: "LLM_QWEN3_NEXT_URL", model_env: "LLM_QWEN3_NEXT_MODEL_NAME"}

# Default routing policy for Phase 2 LLM commands of the merge-sweep triage node.
# It must match omnibase_compat.routing.model_routing_policy.ModelRoutingPolicy.
triage_routing_policy:
  primary: "deepseek-r1-14b"
  fallback: "qwen3-coder-30b"
  fallback_allowed_roles: [ci_fixer, thread_reply, conflict_hunk]
  max_tokens: 2048
  temperature: 0.0
  ci_override:
    primary: "deepseek-r1-14b"

bindings:
  design_to_plan_model_key: "qwen3-coder"
  plans_today_glm_model: "glm-5.3-flash"
  shadow_review_glm_model: "glm-5.3"
  navigation_embedding_model: "Qwen3-Embedding-8B"
  cost_demo_local_model: "qwen3-coder-30b"
  lab_measure_rater_role: "blind_model:claude-opus-5-5"
  route_check_local_model: "Qwen3.8-27B"
  route_check_cheap_cloud_model: "gemini-2.5-flash-lite"
