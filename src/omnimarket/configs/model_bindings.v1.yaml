# model_bindings.v1.yaml -- the model ids that omnimarket code binds, declared here
# and read through omnimarket.handlers.model_binding_reader. Code names no model id:
# each owner reads its section and takes the value by injection (OMN-21760).
# Fail-closed: a missing section or key raises at the first read.

