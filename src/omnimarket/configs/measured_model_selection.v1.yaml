#
# measured_model_selection.v1.yaml — the measured-selection contract (OMN-21207).
#
# Ranks delegation candidates on MEASURED cost and MEASURED latency instead of a
# declared order. Loaded by omnimarket.routing.measured_model_selection.
#
# WHAT A CANDIDATE DECLARES
#
#   Where each measure is read, never its value. A candidate carries no number:
#   - measured_cost_per_1m: a key in the pricing manifest (omnibase_infra
#     ModelPricingTable). The cost is blended over input and output tokens at
#     `input_share` below. Captured at the entry's effective_date.
#   - measured_p50_latency: the backend_id and model_name of recorded delegation
#     runs (delegation_events). The p50 is the median latency of terminal-ok runs
#     inside `latency.window_days`. Captured at the newest run used.
#   The loader refuses a candidate that lacks either source, and refuses any
#   extra key, so a literal value cannot be smuggled in.
#
# MISSING MEASURES RAISE
#
#   A candidate with no pricing entry, or fewer than `latency.min_samples` runs
#   in the window, has a missing measure. The selector raises
#   MeasureMissingError and never falls back to the declared order.
#
# OBJECTIVE
#
#   One declared objective. `cheapest_acceptable` ranks on cost, then on p50
#   latency, and the ladder moves to the next ranked candidate when the quality
#   gate refuses an answer. The operator's words that approve it are quoted in
#   the knowledge-base note named by `objective.basis`.
#
# The candidates are the routing_tiers.yaml models that the pricing manifest
# prices. Candidate order here carries no meaning.

schema_version: "measured_model_selection.v1"

objective:
  kind: cheapest_acceptable
  basis: "knowledge-base-internal reference/decisions/delegation-measured-selection-objective.md"

# Delegation prompts carry far more input than output; three quarters input is
# the blend used for the cost per 1M tokens.
input_share: 0.75

latency:
  window_days: 14
  min_samples: 3

candidates:
  - model_id: Qwen3.8-27B
    backend_ref: local-coder
    measured_cost_per_1m:
      source: pricing_manifest
      pricing_key: Qwen3.8-27B
    measured_p50_latency:
      source: delegation_runs
      backend_id: local-coder
      model_name: Qwen3.8-27B
  - model_id: Qwen3.8-27B
    backend_ref: local-heavy-reasoning
    measured_cost_per_1m:
      source: pricing_manifest
      pricing_key: Qwen3.8-27B
    measured_p50_latency:
      source: delegation_runs
      backend_id: local-heavy-reasoning
      model_name: Qwen3.8-27B
  - model_id: gemini-2.5-flash
    backend_ref: cloud-gemini-2-5-flash
    measured_cost_per_1m:
      source: pricing_manifest
      pricing_key: gemini-2.5-flash
    measured_p50_latency:
      source: delegation_runs
      backend_id: cloud-gemini-2-5-flash
      model_name: gemini-2.5-flash
