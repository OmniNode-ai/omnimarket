---
# The alert sources the lab declares, and whether each one's alerts reach the bus as a lab alert transition.
#
# One entry per source declared in node_lab_alarm's alarm_sources table, in the table's order; a test fails
# when a declared source is missing here. `publishes_transition` is true only when the source publishes
# onex.evt.omnimarket.lab-alert-transitioned.v1, the event node_projection_lab_alerts folds into the lab
# alerts read (lab-alerts-projection-read.yaml). A source with false has its alerts delivered by its
# `posts_via` path and does not appear in that read. Set it to true in the change that makes the source
# publish the transition.
name: lab-alert-sources
reader: node_projection_lab_alerts
transition_topic: onex.evt.omnimarket.lab-alert-transitioned.v1

sources:
  - condition: consumer_group_lag
    posts_via: router
    publishes_transition: false
  - condition: effects_held_behind_runtime
    posts_via: router
    publishes_transition: false
  - condition: broker_listener
    posts_via: router
    publishes_transition: false
