title: 'Model call inventory: every source file that names the chat route'
scope: Python files under src/ whose text contains chat/completions
classes:
  real_direct_call: The file posts to a model address, imports a model SDK or runs a model CLI itself.
    Each one carries a scope (customer or internal) and the callers that prove it; customer rows name
    the customer path.
  declared_route: The file builds, resolves, serves or compares a model route and sends through a named
    sender, or reads only.
  mention: The route text appears as documentation, a message, test data, a validator sample or a log
    pattern.
customer_paths:
- delegation
- gateway
- onboarding_setup
- dashboard
- metering
baseline: .onex_ratchets/direct_model_call_baseline.yaml
counts:
  files: 42
  real_direct_call: 9
  declared_route: 21
  mention: 12
