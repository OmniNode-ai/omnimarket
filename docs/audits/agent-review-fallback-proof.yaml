how_observed:
- The credit outage is the setup, not an observation. A local stand-in for the review gateway answers 503 with the typed credit
  reason; its body is built with the gateway handler's own error constructor, and the two voter results of the simulated attempt
  carry that reply in the error text the live client produces. The real gateway, its keys and its state were not touched.
- The accept side is the workflow's own text. The harness executes the Hostile Reviewer workflow's review, accept and enforcement
  steps and its gate job as written, with the expressions substituted and each step's condition evaluated over the earlier
  steps' outputs. The accept step makes a real git worktree of the integration commit and runs the real runtime_gate_accept
  module from it, with the overlay root, token and API address the step names. Only the review step's reviewer output and
  the network are stood in for.
- The verifier is the merged one. The module is the verifier handler of the merged commit, served behind a local HTTP endpoint
  that the gate-accept overlay names. The receipt key is a lab-local value that signs nothing outside this proof. The approved
  voter identities and the forbidden provenance are the merged roster overlay's policy block, read from its default branch.
- 'The dispatch side is the real handler on fixture ports. The handler runs with the merged roster as its configuration. Its
  head, lab, signer, store, poster and terminal-log ports are fixtures: voter replies are fixture reviews, not model calls,
  and the poster writes to a local stand-in for the pull request''s reviews list, which the accept side reads.'
- Heads. The pull request under review is the scratch draft in omnimarket. Its first head is the receipt's head and its second
  head, pushed at 2026-11-03T06:47:19Z, is the new head of observation 3. The reviews list is a stand-in; no review was posted
  on the scratch pull request.
- Focused tests. The 219 focused tests of the two units (gate-accept unit and golden-chain suites, dispatch unit and golden-chain
  suites, and the two workflow tests of the accept step) passed on the integration commit at 2026-11-03T06:46:23Z.
- Command. PROOF_PR=4954 PROOF_H1=<first head> PROOF_H2=<second head> <integration worktree>/.venv/bin/python lab_proof.py
  <out>.json, run from the integration worktree. The harness is a scratch script that composes the units above; it is not
  shipped.
what_stopped_the_live_form:
- The dispatch node as shipped has no production binding for any of its six ports, so it cannot be run through the node runner
  against a real pull request; only its handler can, with fixtures.
- The base branch carries neither new node. The workflow's accept step runs the node from the pull request's base commit and,
  on a base that lacks it, skips with decision=unchanged, so cases 2 and 3 cannot be seen live before the accept pull request
  merges.
- 'The gate-accept overlay (agent_review_gate_accept/overlay.yaml: the publisher login and the verifier endpoint) is not in
  the CI overlay repository''s default branch at the time of reading; the node fails closed with policy_unavailable without
  it. The workflow''s sparse checkout already names that path.'
- The gate-accept node asks the verifier over HTTP at the overlay's endpoint; the verifier merged as a compute node, and no
  HTTP surface for it was found while reading.
- The review-post verb of the source-control node is in the dispatch pull request and is not in the deployed verb list; the
  writer-app permission to post a review as onexbot-occ-writer[bot] is untested.
- The omniclaude workflow defines the same two job names and requires only Hostile Review Gate; it carries no accept step
  at its default branch, so the omniclaude half of the proof has nothing to observe yet.
- The deployed gateway's 503 carries no typed credit reason today. The accept node still treats those voters as eligible,
  since its unavailable cause matches the 503; the live baseline shows that reply.
required_rules_note: Both reads are under required_rules with their read times. The settings read lists the contexts; the
  source-control node's branch-protection read confirmed both repositories answer (it reports the required approving review
  count only, null for each). Context names are recorded without their ticket suffixes.
live_rerun:
  preconditions:
  - Both omnimarket pull requests merged; git -C <omnimarket clone> tag --contains <merge commit> names a dev-<stamp>-<sha>
    tag, and the lab's dev runtime reports that tag as running. Write each tag into the unit's tag field.
  - 'The gate-accept overlay exists on the CI overlay repository''s default branch with the publisher login onexbot-occ-writer[bot]
    and a verifier endpoint that answers POST (check: git -C <overlay clone> ls-tree -r --name-only origin/main | grep agent_review_gate_accept).'
  - The dispatch node has production ports bound, and the source-control node's verb list (onex scm verbs) includes the review-post
    verb.
  - 'The voters fail with a credit reason on the scratch pull request: either the keys are still out of credit, or a ruling
    allows the scratch pull request''s voters overlay to point at a stub that answers the typed 503.'
  steps:
  - 'Open a scratch draft in omnimarket and one in omniclaude, each from a branch off the landing branch carrying one empty
    commit and its ticket contract file: onex scm pr-create OmniNode-ai/<repo> --lane <lane> --head <scratch branch> --base
    <landing branch> --bus-lane dev --draft --title <scratch title> --body-file <body>. Claim each with python3 <omniclaude
    clone>/scripts/pr_claim_registry_cli.py claim OmniNode-ai/<repo>#<n> --action pr-close.'
  - 'Case 1: publish one dispatch command per scratch pull request (onex run-node node_agent_review_dispatch_orchestrator
    with command_id, repo, pr, head_sha); read the terminal on the agent-review-completed event; read the reviews with onex
    scm pr-review OmniNode-ai/<repo>#<n> and require one review by onexbot-occ-writer[bot] holding one onex-review-receipt
    block. Publish a second command with a new command_id for the same head and require the same receipt id and still one
    review.'
  - 'Case 2: rerun the head''s Hostile Reviewer run by the existing path, onex scm run-rerun OmniNode-ai/<repo> --run-id <run
    id> --lane <lane>, with the lane that holds the pull request claim; write that lane''s name into reran_by. Read onex scm
    pr-checks OmniNode-ai/<repo>#<n> and require the repository''s required names green; read the accept step''s summary with
    onex scm job-log and require source=agent. Write the Hostile Reviewer check-run id into check_run_id.'
  - 'Case 3: push one more empty commit to the scratch branch; require the new head''s required names red after the run settles,
    then dispatch for the new head, rerun, and require green.'
  - 'Cases 4 to 6: ask the issuer node for a receipt for the scratch head and post it as a review with the review-post verb
    in three variants, one defect each: change one field of the signed receipt (altered); request a blocked receipt from the
    issuer (blocked); request a receipt for the other scratch head (another head). After each, rerun and require the gate
    red and the job log to carry the verifier''s typed reason named in the observation. The issuer node signs under its own
    key, so no key is read.'
  - 'Close both scratch pull requests unmerged: onex scm pr-close OmniNode-ai/<repo>#<n> --lane <lane> --run <claim run> --head-sha
    <head>; never mark ready, arm or merge.'
  - 'Flip each case to mode: live, remove live_rerun_pending, add its check-run id, set status: final, and run uv run pytest
    tests/unit/test_agent_review_proof_record.py -v -rs.'
  needs_key_topup_or_ruling:
  - 'Key top-up (the operator): the review gateway''s keys are out of credit. A top-up ends the outage that the fallback exists
    for, and the voters then pass, so live cases 2 to 6 need the outage to still hold or the ruling below.'
  - 'A ruling: whether a scratch pull request may run its Hostile Reviewer with a voters overlay pointing at a stub 503 once
    the keys are topped up; and whether the writer-app permission to post a review as the review identity may be granted (an
    infra change outside this proof).'
