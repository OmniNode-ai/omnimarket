  - id: "2026-04-23-registry-owned-consumer-surface"
    root_paths:
    - "docs/decisions/"
    ground_truth_adr: |
      # ADR: Registry-Owned Consumer Surface

      **Date:** 2026-04-23
      **Status:** Proposed
      **Related:** `OMN-9542`, `OMN-9420`, `OMN-7889`

      ## Why This Exists

      The registration architecture boundary is now clearer, but the supported consumer surface is still too implicit.

      Current evidence shows:

      - `registration_projections` is the only live, fresh registry projection on `.201`
      - `node_registrations` behaves like a storage/effect table, not canonical read truth
      - `node_service_registry` is a downstream compatibility read model and does not exist in the live infra database

      This ADR names the supported registry-owned consumer surfaces so follow-on API and verification work can proceed against one explicit target.

      ## Decision

      ### 1. Canonical registry source

      `registration_projections` is the canonical current registry truth surface for node registration state.

      This means:

      - registry-owned reads must trace back to `registration_projections`
      - projection freshness and correctness are judged at `registration_projections`
      - no new canonical projection layer should be introduced for this workstream

      ### 2. Supported synchronous consumer surface

      The supported query surface is the registry API backed by `ProjectionReaderRegistration`.

      That includes:

      - registry node list/detail reads
      - registry discovery summaries that are derived from those projection-backed node results
      - future synchronous consumers that need registry state without reading tables directly

      This does **not** authorize direct downstream reads from `registration_projections` as the default integration contract. The supported contract is the registry-owned API surface built on that projection.

      ### 3. Snapshot surface stance

      Registration snapshot publication remains an existing registry-owned capability, but it is **not** the primary supported consumer boundary in this tranche.

      For this workstream:

      - query-time registry API is the primary supported consumer surface
      - snapshot publication may remain as an internal or compatibility path
      - any future decision to promote snapshots into a supported consumer contract must explicitly define payload, topic, intended consumers, and verification

      ### 4. Non-canonical surfaces

      The following are not canonical registry truth for this stream:

      - `node_service_registry`
      - runtime memory or startup state
      - Consul-derived or instance-oriented compatibility surfaces
      - ad hoc direct table reads by downstream consumers

      `node_service_registry` may continue to exist as a downstream adapter or legacy consumer artifact, but it is not the source this workstream will harden.

      ## Consequences

      ### What this enables now

      1. Registry API hardening can proceed against one named source: `registration_projections`.
      2. Identity and field-exposure decisions can be judged against projection truth instead of legacy discovery semantics.
      3. Focused verification can assert the projection -> reader -> API path directly.

      ### What this defers

      - snapshot promotion into a supported public consumer contract
      - any dashboard implementation work
      - any attempt to revive `node_service_registry` as canonical truth

      ## Truth Boundary

      This ADR names the target supported consumer surface for the current registry stream. It does **not** claim every existing registry API payload is already semantically correct or complete.

      In particular:

      - canonical source correctness does not imply current API identity semantics are correct
      - projection-backed source ownership does not imply every useful projection field is already exposed
      - discovery payloads may still carry degraded post-Consul compatibility residue that follow-on tickets must simplify

      ## Done Means

      This ADR is realized for the current stream when:

      - registry API work references `registration_projections` as canonical source
      - follow-on tickets stop treating `node_service_registry` as target truth
      - focused verification covers the projection-backed registry consumer path
      - no new registry truth layer is introduced to satisfy downstream consumers
