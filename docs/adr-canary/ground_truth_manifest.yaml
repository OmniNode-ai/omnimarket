  - id: "2026-03-25-dependabot-approval-manual"
    root_paths:
      - "docs/decisions/"
    ground_truth_adr: |
      # Decision: Dependabot PR Approval Remains Manual

      **Date:** 2026-03-25
      **Status:** Accepted
      **Friction Item:** F29 (2026-03-24 close-out)
      **Ticket:** OMN-6489

      ## Context

      GitHub requires approval for first-party Dependabot workflow runs before CI will execute.
      While the GitHub REST API does support programmatic approval via
      `POST /repos/{owner}/{repo}/actions/runs/{run_id}/approve`, and `gh api` can invoke this
      endpoint, our organization policy requires UI-based approval for the Dependabot actor.
      The `gh` CLI has no dedicated `gh run approve` subcommand, though the raw API call works.

      ## Decision

      Accept Dependabot PR CI approval as a manual step. This is a GitHub platform limitation,
      not an OmniNode pipeline gap.

      ## Rationale

      - Dependabot PRs are non-critical (dependency bumps, not feature work)
      - Frequency is low (~2-4 PRs per week across all repos)
      - Attempting browser automation (Playwright) for GitHub UI approval introduces fragility
        that outweighs the ~2 min manual cost per batch
      - GitHub may add API support in the future (tracked as a GitHub community feature request)

      ## Consequences

      - Dependabot PRs will not be fully autonomous
      - Autopilot merge-sweep classifies Dependabot PRs as needing manual approval and skips
        them (does not loop or attempt workarounds)
      - Batch-approve during daily triage sessions (~2 min for all repos)
      - If GitHub adds API support, revisit this decision and automate

      ## Alternatives Considered

      1. **Playwright browser automation** - Rejected: fragile, depends on GitHub UI structure,
         breaks on UI changes, requires browser session management
      2. **Personal access token with workflow scope** - Technically feasible: GitHub supports
         programmatic approval using `GH_TOKEN` or a PAT with `actions: write` scope via the
         `POST /repos/{owner}/{repo}/actions/runs/{run_id}/approve` endpoint. However, our
         organization policy enforces UI-based approval for the Dependabot actor, so this
         path requires policy changes before it can be automated.
      3. **Disable required CI for Dependabot PRs** - Rejected: security risk, bypasses
         CI validation for dependency changes
