  - id: "2026-04-23-registration-runtime-registry-boundary"
    root_paths:
      - "docs/decisions/"
    ground_truth_adr: |
      # ADR: Registration Runtime / Registry Boundary

      **Date:** 2026-04-23
      **Status:** Proposed
      **Related:** `OMN-9420`, `OMN-7889`, `OMN-2309`

      ## Why This Exists

      Registration currently spans four mixed concerns:

      1. runtime contract discovery and wiring
      2. registration workflow orchestration
      3. durable registry projection state
      4. downstream registry consumers

      That drift is now visible in live verification, contract/runtime mismatches, and projection freshness issues. This ADR defines the target ownership boundaries so follow-on tickets stop patching symptoms against a mixed model.

      ## Decision

      ### 1. Runtime owns discovery and wiring

      `RuntimeHostProcess` is the authority for:

      - discovering contracts from package and market surfaces
      - wiring handlers, dispatchers, and subscriptions
      - starting consumers
      - emitting normalized lifecycle facts about runtime-managed nodes

      Runtime does **not** own durable registry truth or dashboard/API read semantics.

      ### 2. Registration owns registration orchestration

      `node_registration_orchestrator` is the authority for:

      - consuming normalized runtime lifecycle facts and explicit registry events
      - orchestrating acceptance, ack, liveness, expiry, and recovery
      - producing registration-domain outputs that feed registry projections

      Registration does **not** decide what contracts exist and does **not** bootstrap runtime discovery.

      ### 3. Registry projections own durable read truth

      Registry projections are the sole durable dashboard/API truth for node registration state.

      This means:

      - downstream consumers should treat registry projections as authoritative
      - runtime memory, startup logs, and compatibility paths are not read truth
      - if multiple registry-ish tables or views exist, one must be declared canonical and the rest treated as adapters, legacy surfaces, or deletion targets

      ### 4. Downstream consumers read projections only

      Future dashboard/API consumers must read registry truth from registry projections only.

      This workstream does **not** implement dashboard changes. It only establishes the boundary registry must satisfy so future consumers, including `omnidash v2`, can rely on the correct projection surface.

      ## Central Fork Still To Adjudicate

      The most important unresolved architecture question is the canonical projection identity.

      The current leading candidate is `node_service_registry`, but this ADR does **not** assume that by default. The architecture is only complete once one registry projection is explicitly named as canonical and proven:

      - live
      - fresh
      - fed by the correct registration-domain outputs
      - suitable as durable dashboard/API read truth

      This adjudication is the main dependency for `OMN-7889`, read-surface audits, and golden-chain tail assertions.

      ## Lifecycle Fact Contract

      Runtime-to-registration traffic should be normalized into explicit lifecycle facts, not inferred from raw startup internals.

      Initial fact set to refine through implementation:

      - `contract_discovered`
      - `consumer_started`
      - `runtime_node_announced`
      - `node_accepted`
      - `heartbeat_seen`
      - `node_expired`
      - `recovery_requested`

      These facts should be treated as boundary objects between runtime execution and registration orchestration. Verification should assert against them or their derived registration outputs, not against accidental side effects of mixed startup paths.

      ## Current-State Truth Boundary

      This ADR describes the target architecture. It is **not** claiming the current implementation already conforms.

      In particular:

      - `OMN-9420` is the main adjudication surface for whether registration contract subscriptions reflect target architecture, historical residue, or a documented temporary mixed state
      - introspection may still exist as a compatibility or enrichment path, but it should not silently substitute for runtime-owned discovery and wiring
      - existing read paths may still reference projection-adjacent legacy surfaces; that does not change the target boundary

      ## Consequences

      ### What should happen next

      1. Lock the canonical projection choice with evidence.
      2. Resolve `OMN-9420` by reconciling contract declarations, runtime behavior, and verification expectations.
      3. Prove projection freshness and contamination status under the chosen canonical projection.
      4. Update golden-chain baselines to reflect the chosen lifecycle facts and canonical projection.

      ### What should not happen next

      - no more local fixes that treat registration as a hidden runtime bootstrap mechanism
      - no dashboard implementation work in this stream
      - no verification patches that hide contract/runtime mismatches before ownership is adjudicated

      ## Ticketing Implications

      - `OMN-9420` should be treated as boundary adjudication, not a narrow mismatch bug.
      - `OMN-7889` should proceed only once the canonical projection target is explicit.
      - any future registry-consumer audit should be recorded as boundary/compliance evidence, not as a dashboard implementation task.

      ## Done Means

      This ADR is fully realized when:

      - one canonical registry projection is explicitly named
      - runtime and registration ownership are reflected in code and verification
      - no unresolved contradiction remains between live runtime behavior, contract declarations, and verification expectations
      - registry projections are proven fit for durable dashboard/API reads
