      # ADR: Dispatch Lifecycle Canonical Source (SEAM-9)

      **Status:** ACCEPTED
      **Ticket:** OMN-10172
      **Date:** 2026-04-28
      **Repo-level ADR:** `omnibase_core/docs/decisions/adr-2026-04-28-dispatch-lifecycle-canonical.md`

      ---

      ## Context

      Two concurrent plans introduced overlapping abstractions for the same dispatch lifecycle:

      - **Runtime-Lifecycle Wave 4** (`2026-04-26-runtime-lifecycle-hardening-plan.md` Task 10):
        `ModelDispatchLifecycleEvent` — typed FSM with states
        `accepted / started / heartbeat / terminal_success / terminal_failure / timeout / cancelled / dlq`.
        Already implemented at
        `omnibase_core/src/omnibase_core/models/dispatch/model_dispatch_lifecycle_event.py`.

      - **Skills-to-Market Phase 1 Task 4** (`2026-04-27-skills-to-market-orchestrators-plan.md`):
        `ModelDispatchRecord` — filesystem YAML written to
        `$ONEX_STATE_DIR/dispatches/<agent_id>.yaml` at dispatch time by
        `node_dispatch_worker/handlers/dispatch_record_writer.py`.

      Without a canonical owner, both abstractions can independently drift and different
      tickets can claim lifecycle correctness against different surfaces. SEAM-9 closes that
      ambiguity.

      ---

      ## Decision

      **Typed FSM events are canonical.**

      `ModelDispatchLifecycleEvent` in `omnibase_core` is the authoritative representation of
      dispatch lifecycle state and transition semantics. This ADR ratifies the existing model
      home rather than proposing a relocation.

      Filesystem YAML records (`ModelDispatchRecord`) are compatibility projections — derived
      views written from terminal FSM events, not the authoritative source.

      ### Emitter responsibility table (canonical)

      | State | Emitter | Required fields |
      |---|---|---|
      | `accepted` | DISPATCHER | `dispatched_at`, `command_topic`, `target_node_id` |
      | `started` | CONSUMER | `started_at`, `consumer_group`, `consumer_host` |
      | `heartbeat` | CONSUMER | `heartbeat_at`, `consumer_host` |
      | `terminal_success` | CONSUMER | `terminated_at`, `terminal_event_topic`, `result_payload_hash` |
      | `terminal_failure` | CONSUMER | `terminated_at`, `terminal_event_topic`, `failure_reason` |
      | `timeout` | ORCHESTRATOR | `timed_out_at`, `budget_seconds`, `last_observed_state` |
      | `cancelled` | ORCHESTRATOR | `cancelled_at`, `cancel_reason`, `cancelled_by` |
      | `dlq` | DLQ_WRITER | `dlq_at`, `dlq_topic`, `retry_attempts_used`, `final_failure_reason` |

      Enforced by `ModelDispatchLifecycleEvent._validate_emitter_owns_state` and
      `_validate_required_fields_for_state` validators at construction time.

      ---

      ## Consequences

      1. **Skills-to-Market Phase 1** must treat `ModelDispatchRecord` as a projection of
         `terminal_success` / `terminal_failure` FSM events, not as a standalone source of truth.
         The compatibility section has been added to the canonical skills plan.

      2. **Runtime-Lifecycle Wave 4** must add a task requiring that skill workers (via
         `node_dispatch_worker`) emit `ModelDispatchLifecycleEvent` events on the canonical bus.
         That task has been added to `2026-04-26-runtime-lifecycle-hardening-plan.md` as
         Task 11a (Skill Worker Lifecycle Emission).

      3. **Name collision** — the existing
         `omnimarket/nodes/node_build_dispatch_effect/handlers/dispatch_history_store.py:46`
         defines a `ModelDispatchRecord` with a different schema (build-loop history, not
         per-dispatch snapshot). It should be renamed to `ModelBuildDispatchRecord` in a
         separate follow-up ticket (do NOT bundle into this ADR).

      4. **`omnibase_compat`** may hold compatibility projection record types and projection
         writer surfaces only; it must not redefine lifecycle state semantics.

      5. Proof-of-lifecycle claims in PR bodies, receipts, and DoD evidence must cite a
         `ModelDispatchLifecycleEvent` chain observable on the bus, not a local YAML file.

      ---

      ## Alternatives Rejected

      - **YAML as canonical**: local file records are too easy to self-attest and cannot carry
        the typed emitter-ownership constraints that prevent dispatchers from self-reporting
        terminal success.

      - **Second canonical home outside `omnibase_core`**: adds indirection without solving
        ownership. The typed FSM model already exists in `omnibase_core`; ratifying the
        existing location is the zero-cost path.

      - **Co-equal YAML and typed events**: leaves the same lifecycle open to inconsistent
        claims across tickets and repos — the failure mode this ADR exists to prevent.
