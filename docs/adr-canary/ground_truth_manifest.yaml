  - id: "2026-04-23-data-verification-invocation"
    root_paths:
    - "docs/decisions/"
    - "omnimarket/src/omnimarket/nodes/node_data_verification/"
    ground_truth_adr: |
      # ADR: `node_data_verification` Invocation Policy

      **Date:** 2026-04-23
      **Status:** Proposed
      **Ticket:** OMN-9576
      **Parent epic:** OMN-7621 (Insights Action Plan 2026-04-06 — Runtime Activation & Infrastructure Observability)
      **Related:** OMN-7624 (Task 3 — Post-pipeline data validation gate), OMN-7722 (Milestone 3 verification), OMN-9577 (pipeline-touching PR classifier, follows from this ADR)
      **Source plan:** `docs/plans/2026-04-06-insights-plan.md` Task 3b (lines 196–200)

      ## Why This Exists

      `node_data_verification` has a working runtime adapter — the node runs end-to-end against real Postgres on `.201:5436`, the 6 deterministic checks (`NO_GARBAGE_UUIDS`, `NO_NULL_REQUIRED_FIELDS`, `NO_DUPLICATES`, `ROW_COUNT_NONZERO`, `SCHEMA_MATCH`, `EVENT_LANDED`) pass golden-chain tests, and OMN-7722 proved real-DB execution. What does **not** exist is a deterministic contract describing how DoD gates call the node. Four questions have been open since OMN-7624 closed Task 3a:

      1. How does `dod_verify` invoke `node_data_verification` — skill wrapper, Kafka event, or both?
      2. How are target tables selected per ticket — explicit list, PR-diff inference, or contract-declared?
      3. How is `rendered_output` evidence represented — receipt format?
      4. What does a verification failure block — Done status, PR merge, or both?

      Until these have single canonical answers, `dod_verify` cannot call `node_data_verification` the same way twice, and receipts written by different callers will not compare. This ADR locks the answers against the node's `contract.yaml` (`omnimarket/src/omnimarket/nodes/node_data_verification/contract.yaml`).

      ## Decision

      ### 1. Invocation Mode — Kafka command topic is canonical; `onex run` is the local-only fallback

      `dod_verify` invokes `node_data_verification` by publishing a `ModelDataVerificationStartCommand` envelope onto the command topic declared in the node contract:

      - **Command topic:** `onex.cmd.omnimarket.data-verification-start.v1`
        — source: `contract.yaml` `event_bus.subscribe_topics`
      - **Completion topic:** `onex.evt.omnimarket.data-verification-completed.v1`
        — source: `contract.yaml` `terminal_event` and `event_bus.publish_topics`
      - **Input envelope:** `omnimarket.nodes.node_data_verification.models.model_data_verification_start_command.ModelDataVerificationStartCommand`
        — source: `contract.yaml` `handler.input_model`
      - **Terminal envelope:** `ModelDataVerificationCompletedEvent`
        — source: `models/model_data_verification_completed_event.py`

      The Kafka path is canonical because it is the only path that works from `dod_verify` running in the runtime container (which has no filesystem access to `onex run` and no authority to shell out). It is also the only path that produces a verifiable event trail the runtime sweep can audit.

      `uv run onex run node_data_verification -- --table-name ... --correlation-id ...` remains supported as a local-only invocation mode for human debugging and for CI jobs that don't have Kafka reachability. Local invocation **MUST** emit an equivalent `ModelDataVerificationCompletedEvent` through `EventBusInmemory` and **MUST NOT** be used to satisfy a DoD receipt for a real ticket — receipts are only valid when sourced from the Kafka terminal event.

      **Not chosen:** a dedicated HTTP endpoint on the runtime. Rejected because it would duplicate the command-topic surface and would not be auditable via the existing Redpanda event log.

      ### 2. Table Selection — Contract-declared, with explicit override

      Per-ticket table selection reads from **`ModelTicketContract.dod_evidence`**, specifically the `rendered_output` evidence items whose verification method is `data_verification`. Each such item declares:

      - `table_name` (required) — the fully-qualified target table, e.g. `omnibase_infra.llm_cost_aggregates`
      - `expected_columns`, `unique_columns`, `uuid_columns`, `min_rows`, `sample_size` — the remaining inputs declared by `contract.yaml` `inputs`

      `dod_verify` reads the evidence list, filters to `data_verification` items, and publishes one command per item. No PR-diff inference. No wildcard expansion. If a ticket's tables are not listed in `dod_evidence`, `dod_verify` does not guess — the ticket's Done gate either does not require data verification, or it is misconfigured and must be fixed at the contract.

      **Not chosen:** PR-diff inference. Rejected because the mapping from diff → affected tables is ambiguous (a migration file changes one table; a handler refactor changes zero or many) and the inference step would itself need verification. Contract declaration is explicit, auditable, and diffable.

      **Not chosen:** per-repo allowlist file. Rejected because the source of truth would drift away from the ticket that describes the work.

      The companion `pipeline-touching PR classifier` (OMN-9577) decides **whether** to fire verification, not **which tables** — that stays with the ticket contract.

      ### 3. Receipt Format — `ModelDodReceipt` serialization of the terminal event

      The `rendered_output` evidence receipt is a structured JSON document written by `dod_verify` after it consumes the terminal event. Shape:

      ```json
      {
        "evidence_type": "rendered_output",
        "verification_method": "data_verification",
        "ticket_id": "OMN-XXXX",
        "correlation_id": "<uuid from ModelDataVerificationStartCommand>",
        "table_name": "<FQDN from contract inputs>",
        "verification_status": "pass | fail | partial | timeout",
        "total_rows": <int>,
        "issues": ["<issue strings from ModelDataVerificationResult.issues>"],
        "event_landed": <bool>,
        "started_at": "<ISO-8601>",
        "completed_at": "<ISO-8601>",
        "source_event_topic": "onex.evt.omnimarket.data-verification-completed.v1",
        "source_event_offset": <int>
      }
      ```

      Fields map directly to `ModelDataVerificationCompletedEvent` (`models/model_data_verification_completed_event.py`). Status vocabulary is fixed by `EnumVerificationStatus` (`models/model_data_verification_state.py`).

      Receipts are stored by `onex_change_control` under its existing receipts surface (same path used for the other `rendered_output` types shipped under OMN-597). `dod_verify` does not invent a new storage mechanism.

      **Not chosen:** a free-form markdown summary. Rejected because receipts must be machine-readable to be gated on.

      ### 4. Blocking Semantics — Fails block Done; PR merge is not gated here

      A failed `node_data_verification` run blocks **Done** on the Linear ticket via the DoD completion guard. It does **not** block PR merge.

      Rationale:

      - Verification runs against real `.201` DB state. Many verification targets only exist **after** the PR merges and the runtime redeploys (projection tables populate from live events). Gating merge on a table that does not exist yet would deadlock the release.
      - Merge-time gating is already covered by CI (unit + golden-chain + contract sweep). Data verification is the post-deploy confirmation that the merged change actually produced correct rows, which is the gap OMN-7624 exists to close.
      - Done gate enforcement already exists as a hard-mode check in `onex_change_control` (OMN-597 receipt gate). Adding data verification as an evidence type fits that surface without new plumbing.

      A `fail` terminal status writes a failing receipt; the Done guard reads receipt status and refuses to mark the ticket Done. A `partial` or `timeout` status is treated as `fail` for gating purposes and produces an explicit `retry_required` flag on the receipt.

      **Not chosen:** block PR merge on verification failure. Rejected for the deadlock reason above and because pre-merge verification against post-merge schema is logically impossible.

      **Not chosen:** block neither (advisory only). Rejected because advisory checks do not get adopted — OMN-9126 documents the pattern. Detection without enforcement is the status quo that OMN-7624 was filed to replace.

      ## Scope — What This ADR Does Not Cover

      - **Automatic trigger policy** — when a pipeline-touching PR should fire verification without an explicit evidence item. This is OMN-9577 (Task 3c). This ADR assumes `dod_evidence` is the source; OMN-9577 decides when a classifier backfills missing evidence.
      - **Runtime wiring on .201** — the `ModelDataVerificationStartCommand` publisher in `dod_verify`'s Kafka-runtime path. This ADR specifies the contract surface; the wiring PR comes after.
      - **Schema of `ModelTicketContract.dod_evidence`** — evidence schema lives in `omnibase_core` models; adding `verification_method: data_verification` is additive and compatible.
      - **Rollback** — a failed verification does not trigger redeploy rollback. Rollback is `node_redeploy`'s concern (OMN-9579).

      ## Consequences

      **Immediate:**

      - `dod_verify` can begin publishing `ModelDataVerificationStartCommand` as soon as the runtime wiring PR lands. No further policy work required.
      - Tickets whose Done gates need data verification must add `rendered_output` evidence items with `verification_method: data_verification` and the input fields the contract declares. Missing evidence means no verification fires — which is correct, because the ticket author is the only party who knows which tables matter.
      - Tickets that merge without declaring verification evidence cannot retroactively have verification enforced. This is acceptable: the gate exists for new work, not for backfilling historical closures.

      **Deferred to follow-on work:**

      - OMN-9577 — pipeline-touching PR classifier that fires verification when the ticket contract did not declare it and the diff touches pipeline code paths.
      - Runtime wiring PR for the Kafka publisher path in `dod_verify`.
      - `omnibase_core` additive field on `ModelDodEvidence` for `verification_method` vocabulary.

      ## References

      - `omnimarket/src/omnimarket/nodes/node_data_verification/contract.yaml` — topic names, input schema, terminal event
      - `omnimarket/src/omnimarket/nodes/node_data_verification/models/model_data_verification_completed_event.py` — terminal envelope
      - `omnimarket/src/omnimarket/nodes/node_data_verification/models/model_data_verification_state.py` — status enum
      - `omnimarket/src/omnimarket/nodes/node_data_verification/handlers/datasource_postgres.py` — real-DB adapter
      - `docs/plans/2026-04-06-insights-plan.md` lines 178–210 — Task 3 source plan
      - `docs/tracking/2026-04-23-omn-7621-decomposition.md` — decomposition that produced OMN-9576
