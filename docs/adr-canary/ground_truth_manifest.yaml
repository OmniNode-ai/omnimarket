      # ADR: Canonical Skills Migration Plan
      
      ## Context
      
      Two same-day plans cover the same skills-to-market migration surface:
      - `docs/plans/2026-04-27-skills-to-market-orchestrators-plan.md`
      - `docs/plans/2026-04-27-skills-actually-working-plan.md`
      
      The overlap created duplicated guidance and made it too easy for later tasks to
      cite whichever file was convenient.
      
      ## Decision
      
      `docs/plans/2026-04-27-skills-to-market-orchestrators-plan.md` is the canonical
      skills migration plan.
      
      `docs/plans/2026-04-27-skills-actually-working-plan.md` is archived but
      retained for context. Its unique content must be explicitly migrated into the
      canonical plan rather than implied away.
      
      ## Consequences
      
      - The canonical plan gains a `Subsumes` marker, an explicit `Invariants`
        section, and a short process retro.
      - The archived plan gains an archive banner pointing to the canonical file.
      - A follow-up enforcement ticket should add same-day canonical-plan overlap
        checking to `plan_to_tickets`.
      
      ## Alternatives Rejected
      
      - Keeping both plans active: preserves ambiguity.
      - Deleting the duplicate plan: removes historical context and hides what was
        merged versus dropped.
