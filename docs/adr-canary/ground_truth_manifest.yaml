      # ADR: Skill Liveness Validator Home

      ## Context

      Two competing plans proposed the skill-backing-node liveness validator in
      different homes:
      - `docs/plans/2026-04-27-skills-to-market-phase-2-validator-gates.md`
      - `docs/plans/2026-04-26-runtime-lifecycle-part-4-skill-shim-runtime-proof.md`

      The current execution also surfaced a repo-policy constraint: reusable
      governance and validator logic should not be scattered into workspace-root
      helpers. Existing validator precedent already lives in `omnibase_core`.

      ## Decision

      The validator code lives in `omnibase_core`.

      Invocation surfaces are split by audience:
      - `omniclaude` runs it in pre-commit for local author feedback.
      - `omnimarket` runs it in CI for shared enforcement.

      This ADR applies to the skill-backing-node liveness validator only. It does
      not make every future validator an `omnibase_core` concern by default, but it
      does align with the current validator-in-core precedent.

      ## Consequences

      - The competing validator sections in the two older plans are retired and
        replaced with pointers to this ADR.
      - The implementation ticket (`OMN-10196`) targets `omnibase_core` for code,
        not `omnimarket`, `omniclaude`, or `omnibase_compat`.
      - `omniclaude` and `omnimarket` remain the enforcement surfaces, not the
        ownership home.

      ## Alternatives Rejected

      - `omnimarket` as code home: too consumer-specific for a validator that scans
        skill declarations across repo boundaries.
      - `omniclaude` as code home: good invocation surface, wrong ownership layer.
      - `omnibase_compat` as code home: compat should stay focused on DTOs and
        transitional seams, not become a general validator bucket.
