---
schema_version: "1.0.0"
ticket_id: "OMN-12856"
title: "Resolve GitHub token via contract api_key_ref at effect boundary; enforce with gate"
summary: >
  All omnimarket handlers, adapters, and consumers that previously read
  GH_PAT / GH_TOKEN / GITHUB_TOKEN directly via os.environ or os.getenv
  are migrated to the canonical contract-native pattern: contract.yaml
  declares github_token as an api_key_ref entry; handlers call
  contract_secret_ref(CONTRACT_PATH, "GITHUB_TOKEN") + resolve_api_key(ref)
  at the effect boundary. The raw-env path is eliminated from source.
  A new enforcement gate (scripts/ci/check_github_token_env_reads.py)
  scans omnimarket source and fails CI on any remaining direct env read of a
  GitHub token, wired as a required CI step and a pre-commit hook so the
  invariant is mechanically enforced, not advisory.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
