---
schema_version: "1.0.0"
ticket_id: "OMN-12844"
title: "M4 — Exploration policy: contract-config bandit + effectiveness decay"
summary: >
  Add node_context_exploration_policy_compute, a pure COMPUTE node that replaces
  the greedy argmax in node_context_roi_compute (_select_preferred_arm) with a
  probabilistic explore/exploit bandit over scored, decay-adjusted capsule
  candidates. Prevents cold-start starvation (a fresh capsule is never selected)
  and winner lock-in (a stale winner is selected forever). Every bandit
  parameter (family/epsilon/ucb_c/priors/min_trials/decay_half_life) is resolved
  from the contract config block into a frozen ModelExplorationPolicyConfig —
  never from module-level constants or env. Consumes M2's already-decayed
  confidence; never recomputes decay. Deterministic given a typed seed; no I/O,
  no bus, no inference, no datetime.now(), no ambient random().
is_seam_ticket: false
interface_change: true
interfaces_touched:
  - topics
  - events
  - models
evidence_requirements:
  - kind: "tests"
    description: "Six TDD invariant tests pass (RED-before-implementation, GREEN after)"
    command: "uv run pytest tests/nodes/node_context_exploration_policy_compute/ -v"
  - kind: "tests"
    description: "Full test suite passes with no regressions"
    command: "uv run pytest tests/ --tb=short -q -m 'not kafka'"
  - kind: "manual"
    description: "mypy --strict clean"
    command: "uv run mypy src/omnimarket/ --strict"
  - kind: "manual"
    description: "Runtime sweep: every entry point resolves (this node routable)"
    command: "uv run python scripts/ci/run_runtime_sweep.py"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
