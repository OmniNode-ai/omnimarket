        check_value: "uv run pytest 'tests/nodes/node_context_exploration_policy_compute/test_handler_exploration_policy.py::TestColdStartNoStarvation::test_greedy_winner_does_not_starve_coldstart' -q"
  - id: "dod-decay-reentry"
