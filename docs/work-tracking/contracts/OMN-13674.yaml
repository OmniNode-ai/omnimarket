title: "Declared-state coverage: wave-kb-context-knowledge cluster"
summary: >-
  Adds full declared-state coverage integration tests for the
  wave-kb-context-knowledge cluster (node_kb_adr_publisher,
  node_kb_repowise_index_effect, node_context_bundle_generator_compute,
  node_candidate_pool_compute), driven over the canonical in-memory bus
  (EventBusInmemory + LocalRuntimeBusAdapter). The two effect handlers gain a
  behavior-preserving constructor-injected subprocess runner seam
  (ProtocolCommandRunner, default = subprocess.run) so their I/O boundary is
  exercised at every outcome without monkeypatching subprocess, and their
  handle() signature is made positional-or-keyword so they dispatch over the
  canonical adapter. No runtime behavior change; the production default path is
  byte-identical.
