---
schema_version: "1.0.0"
ticket_id: "OMN-13589"
title: "Route runtime_sweep CI gate through canonical node_runtime_sweep; delete freestanding script"
summary: >
  omnimarket CI ran a 184-line freestanding imperative script
  (scripts/ci/run_runtime_sweep.py --import-check) that self-described as "the
  entry-point validation subset of runtime_sweep" yet bypassed the canonical
  COMPUTE node it claimed to be a subset of — architectural drift against the
  everything-is-nodes / contract-native doctrine. This change absorbs the
  single-repo "do the entry points load?" import probe into the canonical
  node_runtime_sweep, splitting facts from decisions: the harness (the I/O
  boundary, __main__.collect_entry_point_probes) walks this repo's pyproject
  [project.entry-points."onex.nodes"], runs the structural + import checks per
  node, and emits one typed ModelEntryPointProbe each; the PURE NodeRuntimeSweep
  handler turns ok=False probes into BROKEN_ENTRY_POINT findings via a new
  REGISTRATION phase. RuntimeSweepRequest gains entry_point_probes and an
  enabled_checks selector (None = all phases run exactly as before, so existing
  cross-repo/skill callers are byte-for-byte unaffected); the single-repo CI
  request scopes to enabled_checks=[REGISTRATION] so the cross-repo symmetry /
  durability / stranded-workflow / profile-consumer phases cannot false-positive
  in a single-repo checkout. CI (ci.yml:424) now invokes
  `uv run python -m omnimarket.nodes.node_runtime_sweep --import-check`; the
  freestanding script is DELETED (no shim, no re-export). Live references in
  CLAUDE.md, CONTRIBUTING.md, README.md, and docs/reference/node-catalog.md are
  repointed at the canonical command. Frozen historical DoD/OCC receipts under
  docs/work-tracking/contracts/ are intentionally left untouched — they recorded
  the command that was true when written.
is_seam_ticket: false
interface_change: true
interfaces_touched:
