    command: "uv run pytest tests/ci/test_runtime_sweep_import_check.py tests/test_golden_chain_runtime_sweep.py -q -m 'not kafka'"
  - kind: "ci"
    description: "Full suite green (no -k); mypy --strict clean; ruff clean; pre-commit --all-files clean; the rewired runtime-sweep gate proves itself in CI."
    command: "uv run python -m omnimarket.nodes.node_runtime_sweep --import-check"
