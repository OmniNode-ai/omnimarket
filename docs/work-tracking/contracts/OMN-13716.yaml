---
schema_version: "1.0.0"
ticket_id: "OMN-13716"
title: "Fix sweep input-default gaps: shim_audit paths + doc_freshness_sweep hang"
summary: >-
  Two CONVERGED sweep nodes whose no-arg invocations were broken:
  (a) shim_audit: ModelShimScanRequest.paths was required with no default, so
  onex skill shim_audit (no-arg) crashed with ValidationError paths Field
  required. Fixed: paths defaults to None; handler resolves workspace repo
  src dirs from OMNI_HOME env var (matching the established pattern in
  DocFreshnessSweepRequest.omni_home). (b) doc_freshness_sweep: no-scope
  full-repo scan hung >9min because scanning all 11 default repos via
  resolve_references had unbounded runtime. Fixed: DocFreshnessSweepRequest
  gains per_repo_timeout_s (default 30s); each repo is scanned in a
  ThreadPoolExecutor thread; timed-out repos are skipped with a warning and
  the scan proceeds, completing in bounded time. Both fixes are in the node
  input model / handler layer only (no skill_mapping.yaml change).
