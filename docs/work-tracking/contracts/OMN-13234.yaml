---
schema_version: "1.0.0"
ticket_id: "OMN-13234"
title: "Typed tier cost model (free_local / metered / budgeted) in routing_tiers + projection"
summary: >
  Add a typed per-tier cost model to routing_tiers.yaml and teach the projection
  cost computation to use it. The core ModelRoutingTier gains a typed `cost`
  block (EnumTierCostType free_local | metered | budgeted with rate/cap/overage,
  omnibase_core). routing_tiers.yaml declares the typed cost for every tier.
  pricing.compute_tier_cost_usd implements the billing semantics (metered =
  rate*tokens; budgeted in-budget = 0 cash + headroom drawdown; budgeted overage
  = overage rate; free_local = 0). The delegation_events projection persists the
  measured tier-cost provenance via migration 0018.
is_seam_ticket: false
interface_change: true
interfaces_touched:
  - "public_api"
  - "events"
evidence_requirements:
  - kind: "tests"
    description: "Typed cost-model DoD unit tests pass: metered=rate*tokens, budgeted under cap (headroom drawdown, 0 cash), budgeted over cap (overage), free_local=0; routing_tiers typed-cost contract round-trips."
    command: "uv run pytest tests/test_tier_cost_model_omn13234.py tests/test_routing_tiers_contract.py -q"
  - kind: "ci"
    description: "mypy --strict green on the changed src modules."
    command: "uv run mypy src/omnimarket/pricing.py src/omnimarket/nodes/node_delegation_routing_reducer/models/model_delegation_config.py src/omnimarket/nodes/node_projection_delegation/handlers/handler_projection_delegation.py --strict"
emergency_bypass:
