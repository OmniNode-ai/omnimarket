schema_version: "1.0.0"
ticket_id: "OMN-13676"
title: "WS-5 Wave 2: multi-param integration tests for runtime/infra sweeps (+ db_sweep collector seam)"
summary: >-
  Repo-local deploy-gate evidence carrier for omnimarket PR. Adds real
  multi-parameter end-to-end integration tests (>=3 distinct param sets and >=1
  negative control each, asserting typed result fields) for seven omnimarket
  nodes: node_runtime_sweep, node_database_sweep, node_duplication_sweep,
  node_env_parity_compute, node_bus_audit_compute,
  node_environment_health_scanner, and node_platform_readiness. The only source
  change is an additive, testability-only collector seam on node_database_sweep:
  a constructor-injected psql probe runner (NodeDatabaseSweep(psql_runner=...))
  resolved at call time so existing module-_psql patches keep working and
  production behavior (live _psql subprocess) is byte-for-byte unchanged. No
  event-bus topic, REST endpoint, node contract, runtime_profile, image
  dependency, or live runtime mutation is changed.
