      mypy --strict passes on the omnimarket source after the change (the local
      default adapters are strongly typed against their node-private protocols).
    source: "manual"
    checks:
      - check_type: "command"
        check_value: >-
          uv run mypy src/omnimarket --strict
  - id: "dod-no-runtime-mutation"
    description: >-
