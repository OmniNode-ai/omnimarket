# OMN-12831 per-repo evidence carrier for omnimarket.
# Canonical ticket contract lives in onex_change_control
# (contracts/OMN-12831.yaml on OmniNode-ai/onex_change_control).
# D2 (close-the-loop plan, 2026-06-08): self-extension loop golden-chain test.
# Builds on jonah/omn-12829-escalation so the executor (B1/OMN-12826),
# registration payload conformance (A4), and escalation (C1/OMN-12829) are all
# present in the worktree.
schema_version: '1.0.0'
ticket_id: OMN-12831
title: "D2 — self-extension loop golden-chain test (generate → deploy → registered → invoked → output verified)"
summary: >
  Adds a golden-chain test in omnimarket that exercises the full self-extension
  loop through the REAL wired code (no mocks of the logic under test):
  HandlerGenerationConsumer._emit_deploy / _emit_registration publish the
  node-deploy command and the platform.node-registration.v1 event; the
  node-deploy command is fed VERBATIM into HandlerGeneratedExecutor.on_deploy_event,
  which sandbox-loads the generated handler, invokes it via importlib, and emits
  the terminal result on generated-node-invoked.v1. The proof captured by the
  chain matches the §D2 acceptance items: generated output hash (SHA-256 of the
  FULL contract + handler artifacts), the registration event (on the correct
  platform topic with A4 payload conformance), and the invocation event (terminal
  shape + verified output). A single correlation_id threads generate → register →
  invoke. All topics are resolved from contract.yaml (never hardcoded), so the
  test also guards the contract-driven wiring.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
# Scope decisions (documented per CLAUDE.md Rule 2):
#   1. D2 is a TEST deliverable. The chain it asserts (deploy emit + registration
#      emit + executor invoke + terminal emit) is already wired by OMN-12826 (B1),
#      A4 (registration payload), and OMN-12829 (C1, the base branch). The test
#      drives those real methods rather than re-implementing or mocking them, and
#      a TDD sanity check confirms it goes red when the wired chain regresses
#      (mutating the registration event_type breaks the suite).
#   2. The chain is driven without a live LLM: a ModelGenerationBenchmark (the
#      post-validation state the generation flow holds) is constructed and passed
#      to the REAL _emit_deploy / _emit_registration. This keeps the test
#      deterministic and broker-free while still exercising the production
#      emission + execution code paths.
#   3. Topics are read from the same contract.yaml the handlers read, so the test
#      fails if the contract topic wiring drifts (registration must stay on
#      onex.evt.platform.node-registration.v1, not the dead node-registered topic).
dod_evidence:
  - id: dod-001-golden-chain-green
    description: >
      The D2 self-extension golden chain proves: the deploy command carries the
      FULL generated artifacts + their SHA-256 hashes; the registration event is
      emitted on onex.evt.platform.node-registration.v1 with A4 payload
      conformance; the generated node is invoked and its real output is carried
      back on onex.evt.omnimarket.generated-node-invoked.v1 with the
      future-dispatch terminal shape; and a single correlation_id threads
      generate → register → invoke. Run by a verifier other than the author.
    source: generated
    checks:
      - check_type: command
        check_value: >
          cd omnimarket && uv run pytest
          tests/test_golden_chain_generation_self_extension.py
          -q --tb=short
  - id: dod-002-chain-is-regression-sensitive
    description: >
      The golden chain is coupled to the REAL wired code, not a self-fulfilling
      assertion: mutating the handler's registration payload (event_type) turns
      the suite red, demonstrating it catches a self-extension-loop regression.
    source: generated
    checks:
      - check_type: command
        check_value: >
          cd omnimarket && grep -q "on_deploy_event"
          tests/test_golden_chain_generation_self_extension.py
          && grep -q "_emit_deploy"
          tests/test_golden_chain_generation_self_extension.py
          && grep -q "_emit_registration"
          tests/test_golden_chain_generation_self_extension.py
  - id: dod-003-suites-green
    description: >
      Full omnimarket test suite green (no -k filter, not kafka); mypy --strict
      clean; ruff clean; pre-commit clean. Verified on the worktree before push.
    source: generated
    checks:
      - check_type: command
        check_value: >
          cd omnimarket && uv run pytest tests/ -q -m "not kafka"
  - id: dod-004-contract-file
    description: Evidence contract file present in repo.
    source: generated
    checks:
      - check_type: command
        check_value: 'test -f docs/work-tracking/contracts/OMN-12831.yaml'
