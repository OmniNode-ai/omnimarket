schema_version: "1.0.0"
ticket_id: "OMN-12813"
title: "fix(OMN-12813): SEA generation output format — force fenced yaml+python blocks + exemplar, suppress reasoning"
summary: >
  Root cause of contract_passed=false / empty generation_events row: Qwen3.6-35B-A3B
  returns reasoning prose instead of the required two-fenced-block output.
  Fix: strengthen _DEFAULT_SYSTEM_PROMPT + add two inference protocol profiles
  (local-qwen-generation-no-think, local-qwen-generation-exemplar) scoped to
  task_type="node_generation", wired via apply_inference_protocol in
  HandlerGenerationConsumer._call_llm. Profiles add /no_think directive and a
  one-shot exemplar (```yaml contract + ```python handler) to force output format.
  Non-Qwen models and non-generation task types unaffected. Reuses OMN-12738
  inference_protocols machinery.
