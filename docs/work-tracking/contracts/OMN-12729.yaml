title: "Delegation inference-response re-enters routing instead of quality gate/completion"
summary: >-
  Delegation inference response-shape errors such as truncated responses and empty message content
  must fail terminally instead of being converted back into fresh routing intents. PR #1060 keeps
  nonretryable response errors out of the routing loop and preserves the normal quality-gate path for
  valid useful artifacts.
