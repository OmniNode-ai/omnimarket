---
schema_version: "1.0.0"
ticket_id: "OMN-12826"
title: "Wire HandlerGeneratedExecutor as node-deploy.v1 consumer; sandbox importlib invoke; emit future terminal result shape"
summary: >
  Close-the-loop plan track B1. Wires HandlerGeneratedExecutor as the consumer of
  onex.cmd.omnimarket.node-deploy.v1 via the new on_deploy_event entrypoint, which
  sandbox-loads the generated handler (importlib), invokes it, and emits the
  terminal result on the contract-declared onex.evt.omnimarket.generated-node-invoked.v1
  topic. The terminal result mirrors the SAME evidence-key shape future runtime
  dispatch (NodeInvocationAdapter.dispatch) produces (_runtime_backend,
  _event_bus_backend, _state_store_backend, _node_contract, _command_topic, status)
  and is explicitly labelled non-hot-load (_runtime_backend="sandbox", hot_load=False),
  so a future runtime hot-load path can replace the sandbox path without changing the
  result contract. All topics resolve from contract.yaml — no hardcoded topic strings.
is_seam_ticket: false
interface_change: true
interfaces_touched:
  - "HandlerGeneratedExecutor.on_deploy_event"
  - "HandlerGeneratedExecutor.terminal_topic"
  - "HandlerGeneratedExecutor.deploy_topic"
  - "node_generation_consumer contract.yaml: new generated-node-invoked terminal topic"
evidence_requirements:
  - kind: "tests"
    description: "Focused executor tests prove deploy-consume, sandbox invoke, and future-dispatch terminal shape (24 tests)"
    command: "uv run pytest tests/unit/nodes/node_generation_consumer/test_handler_generated_executor.py -v"
  - kind: "tests"
    description: "Full omnimarket suite green (no -k filter)"
    command: "uv run pytest tests/ -v"
  - kind: "ci"
    description: "omnimarket PR CI checks pass"
