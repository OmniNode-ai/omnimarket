  Close-the-loop plan track A1.5 (DEMO GATE). Adds an enforcing routing-authority
  gate that proves the exact demo path (node generation + delegation inference)
  resolves provider, model (served_model_id), endpoint_ref, the resolved endpoint,
  and route_source from the contract / overlay / routing authority — recording the
  source file:line for each — PLUS a negative static audit proving NO demo-path
