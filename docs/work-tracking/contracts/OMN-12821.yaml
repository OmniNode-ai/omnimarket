  or reads a fallback endpoint string after route resolution. Secret-value
  resolution (os.environ[api_key_ref]) at the effect boundary is the sanctioned
  contract-native pattern and is explicitly NOT flagged. Wired as a required CI
  step and a pre-commit hook (Rule 5: enforcement, not detection).
