---
schema_version: "1.0.0"
ticket_id: "OMN-12824"
title: "HG2 — secret-store resolver at the inference effect boundary; remove direct os.environ secret reads; delete hardcoded OpenRouter base"
summary: >
  Close-the-loop plan track HG2 (docs/plans/2026-06-08-close-the-loop-plan.md).
  Builds a secret-store resolver at the inference effect boundary so the API-key
  VALUE is resolved through the canonical ProtocolSecretStore (env-backed by
  default, Infisical-swappable) instead of direct os.environ reads. The routing
  authority carries only the secret reference NAME (api_key_ref), never the
  value. Removes the two cited direct os.environ value reads
  (handler_generation_consumer.py:599, handler_inference_intent.py:107) and
  deletes the hardcoded OpenRouter base URL default in bridge_config_loader.py
  (fail-closed: key present but base URL missing now raises, no in-code literal).
  The contract field rename api_key_env->api_key_ref lands in the canonical
  omnibase_core model (paired PR; OMN-12659 made core the home for the bifrost
  wire DTO); the committed bifrost_delegation.yaml rename + omnimarket core-pin
  bump follow once the core change publishes.
is_seam_ticket: true
interface_change: true
interfaces_touched:
  - "omnimarket.inference.secret_store_resolver.resolve_api_key"
  - "omnimarket.inference.secret_store_resolver.resolve_api_key_async"
  - "omnibase_core.models.delegation.wire.ModelDelegationBackendConfig.api_key_ref"
