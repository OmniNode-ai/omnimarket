schema_version: "1.0.0"
ticket_id: "OMN-13711"
title: "Handler handle() signatures reject runtime correlation_id kwarg"
summary: >-
  Repo-local deploy-gate / receipt evidence carrier for omnimarket PR. Systemic
  Finding #4: the RuntimeLocal LocalRuntimeBusAdapter dispatches a contract-
  declared entry handler by introspecting its handle() signature
  (omnibase_core.runtime.runtime_local_adapter._invoke_handle_method). When a
  typed-command handler declares ADDITIONAL positional parameters after its
  command (e.g. an optional phase_results second positional), the adapter falls
  through to its handle_method(**payload_dict) branch and raises
  "TypeError: Handler<X>.handle() got an unexpected keyword argument
  'correlation_id'" because correlation_id is a field of the command payload,
  not a parameter of handle(). This crashed two user-facing mapped skills
  (build_loop -> HandlerBuildLoop, design_to_plan -> HandlerDesignToPlan). The
  fix makes every secondary handle() parameter keyword-only (insert '*,') across
  the eight affected typed-command entry handlers so the adapter dispatches the
  command model positionally. Pure signature change; no event-bus topic, REST
  endpoint, node contract, image dependency, or live runtime mutation.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
