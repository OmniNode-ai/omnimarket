schema_version: '1.0.0'
ticket_id: OMN-12815
title: "A1 — COMPLETE endpoints in contracts, posted VERBATIM; delete all in-code URL construction"
summary: >
  Endpoints are specified COMPLETELY in the contract (incl. the full chat path)
  and posted VERBATIM at every call site. Deleted every in-code URL
  constructor/derivation: omnibase_infra HandlerLlmOpenaiCompatible._build_url
  append branch + _OPERATION_PATHS map; omnimarket _split_resolved_endpoint
  (handler_generation_consumer), _chat_completions_url + _CHAT_COMPLETIONS_SUFFIX
  (handler_llm_delegation_call), the inline /v1/chat/completions append
  (handler_inference_intent), and the /paas/v4-vs-/v1 chat_path branches in
  adapter_llm_dispatch + handler_local_supervisor. All POST sites now send the
  contract endpoint_url unchanged and fail closed when it is empty/missing.
  bifrost_delegation.yaml cloud demo backends carry the COMPLETE endpoint URL;
  site-specific locals remain null in the repo default and MUST be supplied
  COMPLETE by the deploy overlay.
is_seam_ticket: false
interface_change: true
interfaces_touched:
  - public_api
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
