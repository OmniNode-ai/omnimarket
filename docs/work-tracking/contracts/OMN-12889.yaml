---
schema_version: "1.0.0"
ticket_id: "OMN-12889"
title: "Delegation quality gate accepts source-free accurate summaries"
summary: >-
  Fixes a false negative in the delegation quality gate where source-free summarization tasks had to
  include marker words such as "evidence", "verified", "based on", or "line" to satisfy the `accurate`
  heuristic. The updated check treats explicit accuracy disclaimers as failures and allows concise
  summaries that otherwise satisfy the prompt shape and content constraints.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
evidence_requirements:
  - kind: "tests"
    description: "Focused delegation quality-gate tests pass."
    command: >-
      uv run pytest tests/unit/delegation/test_delegation_quality_contract.py
      tests/unit/delegation/test_handler_quality_gate_thinking_traces.py
      tests/unit/delegation/test_handler_quality_gate_intent.py -q
  - kind: "lint"
    description: "Changed quality-gate files pass ruff check and format verification."
    command: >-
      uv run ruff check src/omnimarket/nodes/node_delegation_quality_gate_reducer/handlers/handler_quality_gate.py
      tests/unit/delegation/test_delegation_quality_contract.py &&
      uv run ruff format --check src/omnimarket/nodes/node_delegation_quality_gate_reducer/handlers/handler_quality_gate.py
      tests/unit/delegation/test_delegation_quality_contract.py
  - kind: "manual"
    description: >-
      Deploy assessment: this changes deterministic quality-gate handler logic only. No Kafka topic,
      database migration, secret, or live runtime restart is performed pre-merge. After merge/deploy to
      stability-test, rerun an E3-style summarization task and verify the projected quality-gate pass.
    command: >-
      printf '%s\n' 'deploy-assessment: deterministic handler-only quality-gate fix; no live deploy,
      Kafka topic, DB migration, or secret mutation performed pre-merge; post-merge stability rerun required'
