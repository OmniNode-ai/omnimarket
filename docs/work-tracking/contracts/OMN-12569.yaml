    description: >
      Simulated sweep populates the ledger with all required fields and
      per-entry provenance; reconstruction from source events yields the
      identical state (order-independent); the projection-database durable store
      round-trips the same state.
    source: "manual"
    checks:
      - check_type: "command"
        check_value: "uv run pytest tests/unit/nodes/node_pr_lifecycle_orchestrator/test_pr_ledger_projection.py -q"
  - id: "dod-orchestrator-ledger-integration"
