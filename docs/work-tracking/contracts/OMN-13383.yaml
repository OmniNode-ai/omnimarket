ticket_id: "OMN-13383"
title: "Fix wrong stability-test broker port (39092) in e2e harness docs"
summary: >-
  Repo-local deploy-gate evidence carrier for omnimarket PR. The PR corrects the
  documented Kafka bootstrap port for the stability-test lane in the e2e-probe
  harness and the delegation golden-chain integration test. Stability-test
  Redpanda is on 39092 (cluster ae26157e); dev is 19092 (cluster a54e5d22). The
  mislabeling caused a contractor to publish synthetic events to dev while
  querying stability-test, producing a Gate-Zero false alarm (OMN-13363).
  Documentation/default-correctness only: the harness reads
  ONEX_E2E_KAFKA_BOOTSTRAP from env; only documented defaults and examples for
  the stability-test lane were wrong. No event-bus topic, REST endpoint, node
  contract, image dependency, or live runtime mutation is changed.
