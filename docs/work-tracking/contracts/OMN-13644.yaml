---
schema_version: "1.0.0"
ticket_id: "OMN-13644"
title: "Plumb context_pack_hash through delegation orchestrator + projection on all terminals"
summary: >
  ModelDelegationResult gained a context_pack_hash field upstream (OMN-13646,
  omnibase_core 0.46.1 @ 52ee18b4c8fcc517996084437266f0738caf1cb5) but omnimarket
  never set it: the delegation orchestrator collected the hash into
  TerminalEmissionInputs.context_pack_hash at the three terminal sites yet built
  ModelDelegationResult WITHOUT it (dead field), and the projection converter
  dropped it, so every projection row read the '' default regardless of arm. This
  change pins the context_pack_hash ONCE at request acceptance into
  DelegationWorkflowState (handle_delegation_request) and threads it through the
  single terminal builder (_emit_terminal) onto the canonical
  ModelDelegationResult, so it persists identically on COMPLETED and
  FAILED/ESCALATED terminals — escalation re-routing or prompt-text loss between
  attempts can no longer drop it (the terminals read the pinned state value, not
  the live request). The projection converter
  (_canonical_result_to_task_delegated_payload) now carries the hash into
  ModelTaskDelegatedEvent so the row mapping reads a real value. The hash is only
  non-empty when an actual context pack was injected (the ON arm); the '' OFF-arm
  default is preserved verbatim. No bespoke co-writer event (OMN-13629
  anti-pattern), no Plugin*, no new REST, topics stay contract-sourced; the pin
  bump (pyproject.toml + uv.lock) adopts the upstream field. Dev lane only.
is_seam_ticket: false
interface_change: false
interfaces_touched:
  - "events"
