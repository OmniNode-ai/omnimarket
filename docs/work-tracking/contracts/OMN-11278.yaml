        check_value: |
          echo deploy && uv run python - <<'PY'
          from omnimarket.nodes.node_session_phase_evaluator import (
              HandlerSessionPhaseEvaluator,
              ModelPhaseEvaluation,
              ModelPhaseEvaluationRequest,
          )
          req = ModelPhaseEvaluationRequest(
              phase_name="planning",
              max_duration_minutes=60,
              elapsed_minutes=30.0,
              exit_condition_statuses={},
          )
          result = HandlerSessionPhaseEvaluator().handle(req)
          assert result.action == "no_action"
          assert result.budget_elapsed_pct == 50
          print("smoke ok")
          PY
