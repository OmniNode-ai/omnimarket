schema_version: "1.0.0"
ticket_id: "OMN-13710"
title: "Fix: HandlerLinearTriage.handle() async — await resolve_api_key_async"
summary: >-
  Systemic Finding #3. HandlerLinearTriage.handle() was a sync method calling
  _get_github_client(), which called the sync resolve_api_key(). The
  LocalRuntimeBusAdapter dispatches handlers from within a running event loop
  (on_message is async def), so resolve_api_key() detected the running loop
  and raised RuntimeError: resolve_api_key() is sync-only. This crashed every
  Linear-dependent skill (linear_housekeeping, ticketing_triage, create_ticket
  live path, decompose_epic, refill_sprint, friction_triage, etc.).

  Fix: make _get_github_client() async def and await resolve_api_key_async()
  (the async resolver already existed in secret_store_resolver.py). Make
  handle() async def so it can await _get_github_client(). The RuntimeLocal
  adapter already supports async handlers via inspect.isawaitable(). Also
  updated __main__.py _run_with_timeout to directly await the async coroutine
  (dropped ThreadPoolExecutor). Updated all test callers to async def + await.

