---
schema_version: "1.0.0"
ticket_id: "OMN-13540"
title: "Delegation regression suite — versioned golden-task corpus + Layer-1 CI gate + nightly live runner"
summary: >
  Delegation has only been exercised ad-hoc and regressions are discovered by accident
  (import break that took the orchestrator down — OMN-13539; metered cost never recorded —
  OMN-13408/13535; empty terminal data). This adds a fixed, versioned set of delegation
  tasks with BEHAVIORAL assertions that run repeatably so regressions are caught
  mechanically. Two layers: (1) a deterministic contract/unit gate (U1-U4) that runs in
  omnimarket's existing pytest CI on every PR with no live model — catches the
  import/wiring/config regression class; (2) a versioned YAML corpus (I1-I9) + a runner
  that publishes each case to the live bus, reads the delegation_events projection, and
  asserts structure/behavior (routing tier, quality gate, terminal, token/cost, escalation),
  wired as a nightly GitHub Actions workflow against the stability-test lane. Assertions
  encode INTENDED behavior; known-broken cases are xfail with the tracking ticket
  (OMN-13408 metered cost, OMN-13535 telemetry, OMN-13140 escalation/exhaustion) so the
  nightly is actionable. Test-only + CI-workflow change — no source, migration, schema,
  endpoint, or env-for-model change to runtime nodes.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
evidence_requirements:
  - kind: "manual"
    description: "Layer-1 contract/unit tests (U1-U4) + corpus shape + runner pure-logic pass deterministically with no live model."
    command: "uv run pytest tests/delegation_golden -q"
  - kind: "manual"
    description: "Full omnimarket suite stays green with the new tests added."
    command: "uv run pytest tests/ -q -m 'not kafka'"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-001"
    description: >
      Layer-1 contract/unit gate (U1-U4) hard-passes deterministically, no live model.
      U1 imports node_delegate_skill_orchestrator handler + ModelPremiumCounterfactual
      (regression for OMN-13539 ImportError). U2 resolves every routing tier model to a
      complete backend (endpoint literal-or-env, model_name, and a secret_ref for non-local
      tiers). U3 constructs ModelDelegateSkillRequest for each contract allowed_task_type and
      rejects an unknown one. U4 asserts the projection event model + response metrics carry
      model_name + tokens + cost (regression for OMN-13535 telemetry drop). Plus the corpus
      parses into the typed loader and the runner's behavioral evaluator is unit-tested.
    source: "manual"
    checks:
      - check_type: "command"
        check_value: "uv run pytest tests/delegation_golden -q"
  - id: "dod-002"
    description: >
      Versioned declarative corpus exists and is the single source of cases: U1-U4 (unit)
      and I1-I9 (integration), each with acceptance_criteria + a behavioral `expected` block.
      Known-broken integration cases (I2/I4/I8/I9) carry an xfail block naming the tracking
      ticket; the assertion text still encodes the CORRECT expectation so the case goes
      green only when the real fix lands. The corpus loads and validates.
    source: "manual"
    checks:
      - check_type: "command"
        check_value: "uv run python -c \"from tests.delegation_golden.corpus_loader import load_corpus; c=load_corpus(); print('unit',[x.id for x in c.unit_cases()]); print('integration',[x.id for x in c.integration_cases()])\""
  - id: "dod-003"
    description: >
      Layer-2 nightly GitHub Actions workflow exists (.github/workflows/delegation-regression-nightly.yml):
      scheduled cron, self-hosted runner with .201 lane access, runs the Layer-2 runner
      against the stability-test lane, fails on hard (non-xfail) assertion breaks, and uploads
      the scoreboard artifact. The Layer-2 pytest module skips without OMN_ALLOW_LIVE_E2E_PROBE
      so it never runs against the bus from ordinary PR CI; the runner pure-logic + xfail wiring
      are covered in PR CI.
    source: "manual"
    checks:
      - check_type: "command"
        check_value: "test -f .github/workflows/delegation-regression-nightly.yml && echo workflow_present=true"
  - id: "dod-deploy"
    description: >
      Deploy-gate evidence: test-only + nightly-CI-workflow change. No runtime node source,
      migration, schema, endpoint, or env-for-model change. The new tests land under tests/
      (Layer-1 runs in the existing pytest CI on every PR); the nightly workflow is additive
      and runs only on schedule/dispatch. No live deploy performed by this PR.
    source: "manual"
    checks:
      - check_type: "command"
        check_value: "printf 'deploy gate: test + nightly-workflow only; no runtime node/source/migration/schema/endpoint/env change; no live deploy'"
