summary: >
  node_session_phase_dispatcher is the ONLY side-effecting node in the session-phase subsystem.
  Receives phase transition commands (onex.cmd.omnimarket.session-phase-transition.v1) and
  publishes phase-state events (onex.evt.omnimarket.session-phase-state.v1) and budget-warning
  events (onex.evt.omnimarket.session-phase-budget-warning.v1). Worker dispatch_items from phase
  spec counted on enter transitions. Topics loaded from contract.yaml. 4 unit tests.

  Note: Core implementation was delivered under OMN-11231 (PR #704, merged). This contract
  provides OMN-11280 DoD evidence for the same node.
