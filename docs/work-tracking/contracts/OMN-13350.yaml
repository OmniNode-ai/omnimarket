---
schema_version: "1.0.0"
ticket_id: OMN-13350
title: "SEA generation-completed projection silently drops every event (UndefinedColumn) + missing corpus columns"
summary: >-
  The omnimarket 0.4.3 generation handler emits ModelGenerationBenchmark with
  corpus_checked/corpus_passed/corpus_errors (OMN-13289) on
  node-generation-completed.v1, but generation_events had no such columns, so the
  projection INSERT raised UndefinedColumn and every completion event was dropped.
  The runner committed the offset anyway (enable_auto_commit + swallowed
  exception), so the consumer group reported Stable/LAG=0 while projecting zero
  rows. This adds migration 0015 (corpus columns), persists the corpus verdict in
  both write paths, exposes it on the projection_api, and makes BaseProjectionRunner
  fail-loud (no commit-and-drop on a projection error).
is_seam_ticket: false
interface_change: false
interfaces_touched: []
