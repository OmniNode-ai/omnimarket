    description: "Targeted projection + runner tests pass (corpus projection + fail-loud)"
    command: "uv run pytest tests/test_generation_corpus_projection_omn13350.py tests/test_projection_runner.py tests/test_generation_semantic_pass_projection_omn13166.py tests/test_generation_events_proof_fields.py tests/test_projection_handlers.py tests/test_golden_chain_projection_delegation.py -m 'not kafka' -q"
  - kind: ci
