# OMN-14617 -- frozen burn-down baseline for the omnimarket handler dispatch-ENTRYPOINT gate.
# Fleet-wide fan-out of the omnibase_infra OMN-14135 gate (see
# src/omnimarket/validators/handler_dispatch_entrypoint.py).
#
# INVARIANT (omnimarket.validators.handler_dispatch_entrypoint):
#   a handler named in a contract's `handler_routing.handlers[]` MUST expose a callable
#   `handle` or `handle_async`. The shared runtime's _make_dispatch_callback binds one of
#   them at wiring time; a handler exposing NEITHER is bound to `_missing_handle`, which
#   raises ModelOnexError on EVERY dispatch -- while the contract validates, the node
#   boots, and CI stays green. Registration and routing do NOT imply executability.
#
# THIS IS A RATCHET, NOT AN EXEMPTION. It is SHRINK-ONLY:
#   * a handler NOT listed here with no entrypoint  -> FAIL (no new instances, ever);
#   * a handler listed here that GAINS an entrypoint -> FAIL until it is removed
#     (a fixed handler still listed is STALE = FAIL, so the list cannot rot).
#
# Census 2026-07-16 at dev: 32 of 380 distinct contract-declared handlers are
# entrypointless. node_pattern_b_broker's AdapterPatternBBrokerPublish /
# AdapterPatternBBrokerTerminalConsumer are deliberately NOT listed -- they are the
# instances that exposed this defect class for omnimarket (OMN-14616) and now carry a
# real def-B entrypoint (merged via #1769).
#
# Burn-down tracked under OMN-14617. End state is an empty list.

