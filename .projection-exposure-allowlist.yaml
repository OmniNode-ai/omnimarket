# Projection exposure⇄column drift — omission allowlist (OMN-13663)
#
# Consumed by the omnibase_core validator `check-projection-exposure-drift`
# (module: omnibase_core.validators.projection_exposure_drift), wired as a
# pre-commit hook + the "Projection Exposure Drift Gate" required CI job.
#
# The validator's EXISTENCE check (an exposure references a column its table/view
# does not materialize) is ALWAYS blocking and is NOT allowlistable here — fix the
# exposure or the DDL. This file only annotates the OMISSION heuristic: a
# materialized identity/tier/cost column (cost_tier, tier, *_id, correlation_id,
# cost_*, savings_*, tokens_*) that is intentionally NOT surfaced by any exposure.
#
# This is the cost_tier_name class of bug (OMN-13649): the column existed in DDL
# (migration 0018) but was dropped at the projection boundary. With the gate run
# in --fail-on-omission mode, an unannotated omission of such a column BLOCKS
# merge. Each entry below is a ratchet baseline grandfathered at gate introduction
# — a pre-existing omission, not a regression introduced by the gate. Only entries
# with a non-empty `reason` are honored; an unannotated entry is ignored so
# intentional omissions stay explicit, never silent.
#
# To clear an entry: surface the column in a projection_api exposure (and delete
# the entry), or confirm the omission is correct and keep the documented reason.
omissions:
  - node: node_projection_delegation
    table: delegation_events
    column: cost_measurement_source
    reason: >-
      Cost-provenance enum (metered vs estimated) added in OMN-13234. The
      dashboard reads cost_usd + cost_tier_name/cost_tier_type from the
      decisions.v1 / correlation-trace.v1 exposures; the provenance flag is not a
      rendered surface. Grandfathered ratchet baseline at OMN-13663 gate
      introduction — surface it in an exposure if it later becomes a display need.
  - node: node_projection_delegation
    table: delegation_events
    column: llm_call_id
    reason: >-
      Internal LLM-call correlation FK used for server-side joins, not a
      projection/dashboard surface (correlation_id is the public correlation key,
      already exposed). Grandfathered ratchet baseline at OMN-13663 gate
      introduction.
  - node: node_projection_delegation
    table: delegation_budget_state
    column: last_correlation_id
    reason: >-
      Internal bookkeeping pointer to the most recent correlation that mutated the
      budget-state row; not a rendered surface (the budget exposure serves
      tenant_id/cost_tier_name/period aggregates). Grandfathered ratchet baseline
      at OMN-13663 gate introduction.
  - node: node_projection_delegation
    table: delegation_events
    column: tenant_id
    reason: >-
      OMN-14058 interim per-tenant identity stamp (operator-accepted for beta):
      the column exists so writes with ONEX_TENANT_ID set land under a real
      tenant identity instead of erroring, but no per-tenant dashboard surface
      reads it yet. The durable per-tenant identity design (org/tenant model,
      auth-derived resolution, RLS-aware readers) is OMN-14107 — surface this
      column in an exposure when that lands.
  - node: node_projection_delegation
    table: generation_events
    column: tenant_id
    reason: >-
      OMN-14974 tenant key used by database RLS to isolate generation proof rows.
      The projection reader sets the authenticated tenant as app.tenant_id; the
      raw tenant key is intentionally not returned as dashboard data. Surface it
      only if the durable per-tenant identity design in OMN-14107 requires it.
  - node: node_projection_savings
    table: savings_estimates
    column: tenant_id
    reason: >-
      OMN-14058 interim per-tenant identity stamp (operator-accepted for beta):
      the column exists so writes with ONEX_TENANT_ID set land under a real
      tenant identity instead of erroring, but no per-tenant dashboard surface
      reads it yet. The durable per-tenant identity design (org/tenant model,
      auth-derived resolution, RLS-aware readers) is OMN-14107 — surface this
      column in an exposure when that lands.
  - node: node_projection_context_roi
    table: context_roi_scores
    column: tenant_id
    reason: >-
      OMN-15655 / house-tenant ruling 2026-08-02: context_roi_scores is TENANT
      data, so the column exists to carry the owning tenant (the house tenant
      by column DEFAULT until customer ingress exists). It is the RLS isolation
      key, not dashboard data — the omnidash ExperimentsPage reader gets its
      scoping from the app.tenant_id GUC and the tenant_isolation policy, so
      returning the raw key would add nothing it is allowed to act on. Same
      treatment as delegation_events / generation_events / savings_estimates.
      Surface it when the durable per-tenant identity design (OMN-14107 /
      OMN-15356) needs a rendered tenant column.
  - node: node_projection_routing_decision
    table: agent_routing_decisions
    column: tenant_id
    reason: >-
      OMN-15655 / house-tenant ruling 2026-08-02: a routing decision is made
      for a specific workload, so agent_routing_decisions is TENANT data and
      the column carries the owning tenant (the house tenant by column DEFAULT
      until customer ingress exists). It is the RLS isolation key, not
      dashboard data — same treatment and same follow-up condition as the
      context_roi_scores entry above.
